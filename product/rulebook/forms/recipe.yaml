# Recipe — the chef (spec §4.4). v1 DIRECTION + BEAT fields; each shot names route, action class, what it starts from.
# v2 (founder 2026-09-24): a descriptive recipe in plain English, the Mokobara way — the story told in full, identity
# anchors described once, and every shot with title / feeling / framing / impact and a full description paragraph.
form: recipe
version: 2
written_by: chef
schema:
  type: object
  required: [proposition, concepts, selected_concept, rationale, audience_experience, hook, remember, story, identity_anchors, visual_language,
             sound, product_anchor, master_plate, character, copy_deck, composition, shots, end_card, risks,
             library_used, reuse_shelf_items, customer_summary]
  properties:
    proposition: {type: string}
    concepts:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: object
        required: [name, idea, why_it_works]
        properties: {name: {type: string}, idea: {type: string}, why_it_works: {type: string}}
    selected_concept: {type: string}
    rationale: {type: string}
    audience_experience: {type: string}
    hook: {type: string}
    remember: {type: string}
    story: {type: string}
    identity_anchors:
      type: object
      required: [person, product, world, grade]
      properties: {person: {type: string}, product: {type: string}, world: {type: string}, grade: {type: string}}
    visual_language:
      type: object
      required: [look, light, palette, camera]
      properties: {look: {type: string}, light: {type: string}, palette: {type: array, items: {type: string}}, camera: {type: string}}
    sound:
      type: object
      required: [music_brief, ambience]
      properties: {music_brief: {type: string}, ambience: {type: string}}
    product_anchor: {type: string}
    master_plate:
      type: object
      required: [description, product_state]
      properties: {description: {type: string}, product_state: {type: string}}
    character:
      type: object
      required: [present, description]
      properties: {present: {type: boolean}, description: {type: string}}
    copy_deck:
      type: array
      items:
        type: object
        required: [id, text, role, source]
        properties:
          id: {type: string}
          text: {type: string}
          role: {type: string}
          source: {type: string, enum: [customer_exact, proposed]}
    composition:
      type: object
      required: [hero, text_zone, background, product_treatment]
      properties:
        hero: {type: string}
        text_zone: {type: string, enum: [top, bottom, left, right, none]}
        background: {type: string}
        product_treatment: {type: string}
    shots:
      type: array
      items:
        type: object
        required: [n, duration_s, title, feeling, framing, impact, description, purpose, first_frame, action, end_state, camera, route, action_class, starts_from,
                   feasibility_refs, product_present, product_state, continuity, must_not, super_id, mandatory_ids]
        properties:
          n: {type: integer}
          duration_s: {type: number}
          title: {type: string}
          feeling: {type: string}
          framing: {type: string}
          impact: {type: string}
          description: {type: string}
          purpose: {type: string}
          first_frame: {type: string}
          action: {type: string}
          end_state: {type: string}
          camera: {type: string}
          route: {type: string, enum: [IMG, FILM-A, FILM-B, FILM-C, END-CARD]}
          action_class: {type: string, $enum: action_classes}
          starts_from: {type: string, enum: [master_plate, previous_shot_end, still_only]}
          feasibility_refs: {type: array, items: {type: string}}
          product_present: {type: boolean}
          product_state: {type: string}
          continuity: {type: array, items: {type: string}}
          must_not: {type: array, items: {type: string}}
          super_id: {type: [string, "null"]}
          mandatory_ids: {type: array, items: {type: string}}
    end_card:
      type: object
      required: [copy_ids, background_hex]
      properties: {copy_ids: {type: array, items: {type: string}}, background_hex: {type: string}}
    risks:
      type: array
      items:
        type: object
        required: [shot, action_id, risk, limit]
        properties: {shot: {type: [integer, "null"]}, action_id: {type: [string, "null"]}, risk: {type: string}, limit: {type: string}}
    library_used: {type: array, items: {type: string}}
    reuse_shelf_items: {type: array, items: {type: string}}
    customer_summary: {type: string}
