# Recipe — the chef. v3 (kitchen v3, founder-approved 2026-09-25): the chef writes the dish in full — the story, the
# people and world described once, a board where every shot names its tool and carries the chef's OWN full prompts, the
# sound, and the voice-over when the customer asked for one. Code derives the older production fields from these
# (stations/chef.py `normalise`); it never rewrites the chef's prompts.
form: recipe
version: 3
written_by: chef
schema:
  type: object
  required: [selected_concept, remember, story, audience_person, identity_anchors, look, sound, voice_over, copy_deck, shots,
             end_card, reference_photos, library_used, customer_summary]
  properties:
    selected_concept: {type: string}
    remember: {type: string}
    story: {type: string}
    audience_person: {type: string}
    identity_anchors:
      type: object
      required: [person, product, world, grade]
      properties: {person: {type: string}, product: {type: string}, world: {type: string}, grade: {type: string}}
    look:
      type: object
      required: [picture_prompt, text_zone, product_present]
      properties:
        picture_prompt: {type: string}
        product_present: {type: boolean}
        text_zone: {type: string, enum: [top, bottom, none]}
    sound:
      type: object
      required: [music_prompt, ambience]
      properties: {music_prompt: {type: string}, ambience: {type: string}}
    voice_over:
      type: object
      required: [wanted, language, direction, lines]
      properties:
        wanted: {type: boolean}
        language: {type: string}
        direction: {type: string}
        lines:
          type: array
          items:
            type: object
            required: [shot, text]
            properties: {shot: {type: integer}, text: {type: string}}
    copy_deck:
      type: array
      items:
        type: object
        required: [id, text, role, source]
        properties:
          id: {type: string}
          text: {type: string}
          role: {type: string}
          source: {type: string, enum: [customer_exact, proposed]}
    shots:
      type: array
      items:
        type: object
        required: [n, duration_s, title, feeling, framing, impact, description, tool, picture_prompt, motion_prompt,
                   photo_index, product_present, super_id]
        properties:
          n: {type: integer}
          duration_s: {type: number}
          title: {type: string}
          feeling: {type: string}
          framing: {type: string}
          impact: {type: string}
          description: {type: string}
          tool: {type: string, enum: [video, still, photo, end_card]}
          picture_prompt: {type: string}
          motion_prompt: {type: string}
          photo_index: {type: [integer, "null"]}
          photo_crop:
            type: [array, "null"]
            items: {type: number}
          photo_fill: {type: [string, "null"], enum: [cut_out, card, full_frame, null]}
          product_present: {type: boolean}
          super_id: {type: [string, "null"]}
    end_card:
      type: object
      required: [copy_ids, background_hex]
      properties: {copy_ids: {type: array, items: {type: string}}, background_hex: {type: string}}
    reference_photos: {type: array, items: {type: integer}}
    library_used: {type: array, items: {type: string}}
    customer_summary: {type: string}
