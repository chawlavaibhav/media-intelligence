# Ingredient check — the head cook's tasting skill (kitchen v3; was the small taster). v2 adds the repair decision and a
# sharper prompt for a retake, so the head cook repairs a take instead of code freezing it.
form: ingredient_check
version: 2
written_by: head_cook
schema:
  type: object
  required: [usable, unsure, required_action_occurred, end_state_reached, product_identity_ok, character_consistent,
             matches_master_plate, matches_previous_plate, differences, prohibited_present, unrequested_elements,
             lettering_present, best_segment, notes, repair, better_prompt]
  properties:
    usable: {type: boolean}
    unsure: {type: boolean}
    required_action_occurred: {type: string, enum: ["yes", "no", partial, n/a, cannot_determine]}
    end_state_reached: {type: string, enum: ["yes", "no", n/a, cannot_determine]}
    product_identity_ok: {type: string, enum: ["yes", "no", n/a, cannot_determine]}
    character_consistent: {type: string, enum: ["yes", "no", n/a, cannot_determine]}
    matches_master_plate: {type: string, enum: ["yes", "no", n/a, cannot_determine]}
    matches_previous_plate: {type: string, enum: ["yes", "no", n/a, cannot_determine]}
    differences: {type: array, items: {type: string}}
    prohibited_present: {type: array, items: {type: string}}
    unrequested_elements: {type: array, items: {type: string}}
    lettering_present: {type: string, enum: ["yes", "no", cannot_determine]}
    best_segment:
      type: object
      required: [in_s, out_s]
      properties: {in_s: {type: number}, out_s: {type: number}}
    notes: {type: string}
    repair: {type: string, enum: [keep, retake, restage, use_photo, tell_customer]}
    better_prompt: {type: string}
