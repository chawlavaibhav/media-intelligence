# Feasibility — the pantry and oven checker (spec §4.3). NEW in v2.
# The AI writes `product_truth` and `actions_needed` (ai_fields); code writes the rest from the equipment sheet.
form: feasibility
version: 1
written_by: pantry_checker
ai_fields: [product_truth, actions_needed]
schema:
  type: object
  required: [product_truth, actions_needed, route_verdicts, verdict, ask_customer, alternatives, reference_risks]
  properties:
    product_truth:
      type: array
      items:
        type: object
        required: [part_state, covered_by_photo, photo_ref, source]
        properties:
          part_state: {type: string}
          covered_by_photo: {type: string, enum: ["yes", "no"]}
          photo_ref: {type: [integer, "null"]}
          source: {type: string, enum: [photo, customer_fact, none]}
    actions_needed:
      type: array
      items:
        type: object
        required: [id, action, action_class, required_by_customer]
        properties:
          id: {type: string}
          action: {type: string}
          action_class: {type: string, $enum: action_classes}
          required_by_customer: {type: boolean}
    route_verdicts:
      type: array
      items:
        type: object
        required: [action_id, action_class, route, verdict, equipment_row]
        properties:
          action_id: {type: string}
          action_class: {type: string}
          route: {type: string}
          verdict: {type: string, enum: [reliable, risky, cannot]}
          equipment_row: {type: [string, "null"]}
    verdict: {type: string, enum: [go, go_with_limits, need_input, cannot_make]}
    ask_customer: {type: array, items: {type: string}}
    alternatives:
      type: array
      items:
        type: object
        required: [for_action, alternative]
        properties: {for_action: {type: string}, alternative: {type: string}, action_class: {type: string}}
    limits: {type: array, items: {type: string}}      # code: parts/states already requested once, carried as limits (loop guard)
    loop_guard: {type: array, items: {type: object}}  # code: what the loop guard applied instead of asking the customer again
    reference_risks:
      type: array
      items:
        type: object
        required: [photo, risk, equipment_row]
        properties: {photo: {type: integer}, risk: {type: string}, equipment_row: {type: [string, "null"]}}
