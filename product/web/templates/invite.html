{% extends "base.html" %}{% block title %}Accept invitation · Media Intelligence{% endblock %}
{% block body %}
<div class="card" style="max-width:460px;margin:40px auto">
<h1>Welcome</h1>
<p class="muted">Set up your beta account.</p>
{% if error %}<p class="bad">{{ error }}</p>{% endif %}
<form method="post">
<label for="name">Your name</label><input id="name" type="text" name="name" required>
<label for="password">Choose a password (10+ characters)</label><input id="password" type="password" name="password" minlength="10" required autocomplete="new-password">
<p><button type="submit">Create account</button></p>
</form>
</div>
{% endblock %}
