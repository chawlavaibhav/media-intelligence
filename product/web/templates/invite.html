{% extends "studio_auth.html" %}{% block title %}Welcome · Aight Studio{% endblock %}
{% block body %}
<h1>You're invited</h1>
<p class="lede">Choose a password and you're in. Then tell us the ad you want — we'll take it from there.</p>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post">
<label for="name">Your name</label><input id="name" type="text" name="name" required autocomplete="name">
<label for="password">Password <span style="color:var(--faint)">(at least 10 characters)</span></label><input id="password" type="password" name="password" minlength="10" required autocomplete="new-password">
<button type="submit">Enter the studio</button>
</form>
{% endblock %}
