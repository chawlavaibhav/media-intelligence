{# One input box: text, an optional paperclip, a send arrow. Enter sends on a keyboard; phones use the arrow.
   Needs: action, field, placeholder, files (bool), file_field, big (bool), value. #}
<form id="composer" class="composer{{ ' big' if big }}" method="post" action="{{ action }}" enctype="multipart/form-data">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label class="sr" for="composer-text">{{ placeholder }}</label>
<textarea id="composer-text" name="{{ field }}" rows="1" placeholder="{{ placeholder }}"{{ ' autofocus' if big }}>{{ value or '' }}</textarea>
{% if big %}<div class="row">{% endif %}
{% if files %}<label class="icon clip" title="Add photos or your logo"><span class="sr">Add photos or your logo</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.9-8.9a3.7 3.7 0 015.2 5.2l-8.9 8.9a1.8 1.8 0 01-2.6-2.6l8.2-8.2"/></svg>
<input class="sr" type="file" name="{{ file_field or 'photos' }}" accept="image/png,image/jpeg,image/webp,image/svg+xml,application/pdf" multiple data-picked="picked"></label>
<div class="picked" id="picked"></div>{% elif big %}<div class="picked"></div>{% endif %}
<button class="icon send" type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
{% if big %}</div>{% endif %}
</form>
