# Pass marks for the three judges (spec §10). CONFIRMED by the founder on 2026-09-23 (amendment 1 §2).
# Until a judge passes a LIVE run on this set it is unqualified: its "no" blocks (the system repairs, then the customer
# decides) and its "yes" goes to the customer's preview as the final check (amendment 1 §3). Agreement marks apply to the
# accepted and the not-accepted cases SEPARATELY (amendment 1 §2), so a judge cannot pass by saying "yes" to everything.
status: confirmed_by_founder
confirmed_by_founder: 2026-09-23          # amendment 1 §2
recipe_checker:
  agreement_with_known_outcome_min: 0.80     # verdict approve ↔ accept, send_back ↔ reject
head_cook:
  known_bad_caught_min: 0.80
  good_wrongly_rejected_max: 0.20
gatekeeper:
  moko7_v1_target_defects_found_min: 4       # of 6 (D1, D5, OAR_REVEAL, TEAR, FONT, LOGO)
  agreement_with_customer_verdict_min: 0.80  # pass ↔ accept, fix/fail ↔ not accepted (specific_repair, rebuild_direction, reject)
