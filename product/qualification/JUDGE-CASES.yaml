  - {id: RC-H-UPWORK-INTRO-001, branch: work/pilot-upwork-intro-video-v4, known_verdict: accept,
     plan: pilots/upwork-intro-video-2026-09-14/v4/plan/CREATIVE-BLUEPRINT-V4.md, brief: pilots/upwork-intro-video-2026-09-14/preprod/COMMERCIAL-BRIEF.md}
  - {id: RC-H-CUMINCO-CHOPSTICKS-003, branch: work/agency-job-cuminco-chopsticks-001, known_verdict: reject,
     plan: agency/jobs/AGY-2026-09-15-CUMINCO-CHOPSTICKS-001/prompts/PROMPTS.yaml, brief: agency/jobs/AGY-2026-09-15-CUMINCO-CHOPSTICKS-001/brief.job.json,
     note: "the job's only plan on its branch is its prompt file (no creative plan document was kept)"}
