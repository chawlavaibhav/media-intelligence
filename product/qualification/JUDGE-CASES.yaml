# Judges' qualification set (spec §10): old cases whose verdict the founder already gave. No new generation.
# `evidence:` paths are relative to the private repository chawlavaibhav/mi-p1-evidence (MI_P1_EVIDENCE, or a checkout next
# to this repository); `agency:` cases need the historical Mokobara job folder (MI_HISTORICAL_MOKOBARA_JOB). A case whose
# files are not on the host is reported "unavailable" and counts for nothing — never as a pass.
recipe_checker:
  - id: RC-0923-FILM
    what: the plan of the rejected 30-s packing reel (8 hand-action beats on the video model, each generated independently)
    evidence: {job: job_20260923_7d36a5b6, artifact: direction, version: 1}
    known_verdict: reject            # the customer rejected what this plan produced
    known_reasons: [hands operating zips and flaps on the video model, no continuity plan across independently generated beats]
  - id: RC-0923-POSTER
    what: the plan of the accepted launch poster
    evidence: {job: job_20260923_6720871c, artifact: direction, version: latest}
    known_verdict: accept
    known_reasons: []
  # ── Old jobs whose plan is on the job's branch in THIS repository (amendment 1 §2). Read with `git show <ref>:<path>`
  # (ref origin/work/<branch>, or work/<branch>); the known verdict is the job's FINAL verdict.
  - {id: RC-H-MOKOBARA-ODYSSEY-007, branch: work/agency-job-mokobara-odyssey-001, known_verdict: accept,
     plan: agency/jobs/AGY-2026-09-21-MOKOBARA-ODYSSEY-001/stages/03-CREATIVE.md, brief: agency/jobs/AGY-2026-09-21-MOKOBARA-ODYSSEY-001/brief.job.json}
  - {id: RC-H-RENTOK-GAME-A-004, branch: work/agency-job-rentok-game-lane-a-001, known_verdict: accept,
     plan: agency/jobs/AGY-2026-09-20-RENTOK-GAME-LANE-A-001/stages/03-CREATIVE.md, brief: agency/jobs/AGY-2026-09-20-RENTOK-GAME-LANE-A-001/brief.job.json}
  - {id: RC-H-RENTOK-GAME-B-005, branch: work/agency-job-rentok-game-lane-b-001, known_verdict: accept,
     plan: agency/jobs/AGY-2026-09-20-RENTOK-GAME-LANE-B-001/stages/03-CREATIVE.md, brief: agency/jobs/AGY-2026-09-20-RENTOK-GAME-LANE-B-001/brief.job.json}
  - {id: RC-H-RENTOK-GAME-V2-006, branch: work/agency-job-rentok-game-v2-001, known_verdict: accept,
