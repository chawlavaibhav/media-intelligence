# Equipment sheet — SEED rows (spec §9.2). Per generator route × action class: reliable | risky | cannot, with the evidence
# each verdict came from and how many observed samples back it. Later rows are added only by an approved lesson (the
# lesson queue) and live in the store; this file is never edited by the running product. A pair with no row is `unknown`,
# which the pantry checker treats as `risky`.
#
# Statistics (founder ruling 2026-09-24: "apply stats to the equipment sheet too"): a row with `successes`/`failures` has
# its verdict COMPUTED from them by exact binomial bounds (library/stats.py, EquipmentSheet.rows): `cannot` only when the
# failure rate is significantly above 50 %, `reliable` only when it is significantly below 25 %, otherwise `risky`. The
# written `verdict` is kept as `declared_verdict`. Rows with `basis: policy` (a founder decision, not an observation) or
# `basis: deterministic` (code that cannot fail at random) keep their declared verdict.
#
# Evidence ids:
#   EV-0923-FILM   private repo chawlavaibhav/mi-p1-evidence, job_20260923_7d36a5b6 (the rejected 30-s Reel): events
#                  take_rejected 05:02–06:37 UTC (15 of 16 Veo takes rejected by the per-clip inspector), the founder's
#                  verdict in VERDICTS.md, attempts seq 42/43/49/54/56/70/74 (refusals, request errors)
#   EV-0923-IMG    same repo, job_20260923_6720871c (the accepted launch poster)
#   ATLAS-B7       production-learning/atlas/2026-09-22/FAILURE-ATLAS-CLASSIFIED.yaml, mode route_cannot_meet_the_demand
#   SPEC-9.1       coordination/p1-v2/P1-V2-BUILD-SPEC.md §9.1 "Not offered" (founder policy, not an observation)
