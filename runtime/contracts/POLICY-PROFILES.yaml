  purpose: "lane development and cell audits only; auto-routes every status; never a battery profile"
  status: active
  adopted: true
  # RENAMED 14 Sep 2026 (lane F): this was `dry`. Every field is kept. It is not the dry twin of the
  # alpha profile and takes none of the alpha's real decisions; use `dry` for that.
  dispatch_mode: dry
  spend_authority:
    status: none
    record: null
    note: "dry_permissive never dispatches; max_provider_draws_per_deliverable is 0"
  deliverable_kinds_allowed: [__all__]
  exact_text_strategies_allowed: [code_set_on_textless_plate, generated_in_scene]
  motion_requires_accepted_still: false
  max_provider_draws_per_deliverable: 0
