# POLICY-PROFILES — every operating limit the runtime obeys, as data.
#
# WHY THIS FILE EXISTS. The first alpha is deliberately narrow: one static ad, an optional short
# motion version, two provider draws, a person approving every delivery. Those are CHOICES FOR THE
# FIRST WEEK, and they are written here as values so that widening them is an edit to a row — never a
# change to a contract, a schema or a line of code. Nothing in this system is capped by its
# architecture.
#
# A job names its profile. The runtime reads every limit from that row and refuses to run if the row
# is missing a limit it needs (fail closed, never a default hidden in code).
schema: POLICY-PROFILES-v0

profiles:

- profile: alpha_human_release
  purpose: "the first private alpha: real customer briefs, human release authority, tight money"
  status: adopted_by_controller
  adopted: true
  adoption_basis: "coordination/decisions/CONTROLLER-ALPHA-1-PRODUCT-FAMILY-AND-RELEASE-POLICY-2026-09-14.md (C-7, C-8)"
  # dispatch_mode (added 14 Sep 2026, lane F): live = a dispatch under this row would send bytes to a
  # provider IF spend authority existed; dry = every attempt is rendered and priced through the harness
  # adapter's dry_run() and nothing is ever sent. The execution bridge reads this before anything else
  # after spend_authority. live + spend_authority.status none = refuse, which is today's state.
  dispatch_mode: live
  # ADOPTED 14 Sep 2026. Adoption means the Controller agreed these LIMITS. It is not money: see
  # spend_authority below and the invariant that separates the two. Nothing in this row authorises
  # a paid dispatch (Controller rider, same brief: "Adopting the Alpha policy is NOT spend
  # authorisation. No paid dispatch is authorised by any decision above.").
  spend_authority:
    status: none
    record: null
    note: >-
      Adoption of the profile is not spend authorisation (Controller, 14 Sep 2026). A paid dispatch
      under this profile additionally requires a signed runtime spend authorisation record named
      here; none exists.
  # C-7, as data. "Freeze Alpha 1 to: one STATIC COMMERCIAL AD WITH EXACT OVERLAY COPY, optionally
  # followed by: one SHORT MOTION VERSION DERIVED ONLY FROM THE ACCEPTED STILL. Supplied-photo work
  # is conditional behind the identifiable-person / consent gate."
  deliverable_kinds_allowed: [static_ad, short_motion_from_accepted_still, static_ad_from_supplied_photo]
  exact_text_strategies_allowed: [code_set_on_textless_plate]
  exact_text_strategies_note: >-
    "EXACT OVERLAY COPY" (C-7) is the code-set strategy: the strings are composed onto a textless
    plate by the runtime, exact by construction. generated_in_scene is excluded by C-7's words
    "generated in-scene exact text". The RR-2 evidence for in-scene text (Nano Banana 2 and GPT
    Image 2, 4/4) exists in the map; it is out of Alpha 1 by ruling, not by capability. A spec whose
    strategy is outside this list is a refusal or manual_route_required, never a silent downgrade.
  motion_requires_accepted_still: true
  motion_requires_accepted_still_note: >-
    The short motion version "DERIVED ONLY FROM THE ACCEPTED STILL" (C-7): motion.from must be
    accepted_still and motion.depends_on must name the accepted still deliverable in the same job
    (PRODUCTION-JOB-v1 motion.depends_on). A motion request from text or from a reference is outside
    Alpha 1.
  supplied_photo_conditions:
    identifiable_person_requires_consent_ref: true
    basis: "PRODUCTION-JOB-v1 depicts_identifiable_person invariant"
    note: >-
      static_ad_from_supplied_photo stays in the family but is CONDITIONAL (C-7: "conditional behind
      the identifiable-person / consent gate"). Any reference asset with depicts_identifiable_person
      true and no consent_ref is refused at intake, whatever its declared role.
  # The kinds C-7's words exclude, each with the phrase it comes from. A kind listed here may never
  # appear in deliverable_kinds_allowed while this basis stands.
  excluded_by_ruling:
  - kind: null
    c7_phrase: "talking heads"
    note: >-
      No registry kind is named talking_head today (runtime/contracts/DELIVERABLE-KINDS.yaml). The
      exclusion is recorded against the phrase so that a future kind of that shape is excluded on
      arrival, not admitted by omission.
  - kind: lipsync_to_supplied_audio
    c7_phrase: "lip-sync"
  - kind: two_speaker_dialogue
    c7_phrase: "native speech"
  - kind: spoken_voiceover
    c7_phrase: "native speech"
    note: >-
      Most restrictive reading, chosen by the encoder not the Controller: narration is generated
      speech, so it is treated as covered by "native speech" until the Controller says otherwise.
  - kind: multi_shot_story
    c7_phrase: "multi-shot stories"
  - kind: null
    c7_phrase: "generated in-scene exact text"
    note: >-
      Not a deliverable kind but an exact-text STRATEGY (generated_in_scene); encoded as
      exact_text_strategies_allowed above.
  # Kinds C-7 does not name but which are outside Alpha 1 because the ruling FREEZES the family to
  # the kinds listed ("Freeze Alpha 1 to: ..."). Not excluded by name; simply not admitted.
  outside_alpha_1_by_omission: [text_in_motion, music_bed]
  native_speech_allowed: false
  lipsync_allowed: false
  max_provider_draws_per_deliverable: 2
  repair_allowance: 1
  auto_routable_evidence_status: [clean_observed]
  # CORRECTED. This row previously said `launch_eligible`, a status that does not exist and never
  # will: eval/capability-map/TAINT-REGISTER-v1.yaml states in writing that whether a cell may carry
  # customer traffic is a Controller ruling plus this profile, not an auditor's label. The effect of
  # the mistake was total - the alpha profile could auto-route 0 of 61 cells - and it was found by
  # building the router, not by reading the file. The real vocabulary is:
  #   clean_observed | directional_only | awaiting_controller_ruling | method_tainted | insufficient
  on_non_auto_routable: manual_route_required
  # C-8: "Every Alpha-1 output requires human approval before external delivery. No autonomous
  # external delivery."
  acceptance_authority: human
  automated_judge_in_release_path: false
  autonomous_external_delivery: false
  human_approval_required_before_external_delivery: true
  human_approval_basis: "coordination/decisions/CONTROLLER-ALPHA-1-PRODUCT-FAMILY-AND-RELEASE-POLICY-2026-09-14.md (C-8)"
  # C-11: "Adopt Auditor A's twelve-condition T8 public-release gate." The twelve are held here once,
  # verbatim from coordination/audits/AUDIT-2026-09-10-REPORT-A.md §7 T8, so a later check can read
  # them as data. This is the gate for PUBLIC release; this profile is not a public-release profile.
  public_release_gate:
    adopted: true
    basis: "coordination/decisions/CONTROLLER-ALPHA-1-PRODUCT-FAMILY-AND-RELEASE-POLICY-2026-09-14.md (C-11); text from coordination/audits/AUDIT-2026-09-10-REPORT-A.md §7 T8"
    conditions:
    - audit closed
    - HEAD reproducible
    - route evidence clean
    - Stage-B envelopes exist for public routes
    - Stage-C accepted-outcome evidence exists
    - CpAO measured
    - fallback/repair bounded
    - spend ceilings and kill switch live
    - customer privacy/retention policy live
    - provider commercial/terms review complete
    - observability/incident handling live
    - human override remains available
    status_note: >-
      none of the twelve is met today by this repository; this profile is a PRIVATE human-supervised
      alpha profile, not a public-release profile
  surface_preference:
    rule: same_model_prefers_gcp
    basis: coordination/decisions/CONTROLLER-FAL-LAST-CHOICE-CREDITS-FIRST-2026-09-09.md
    note: >-
      When ONE model is offered on both fal and a GCP surface, call it on GCP - the Controller's
      words: "fal is the last choice since it costs me money ... if the model exists on fal and
      gemini key, we use it from gemini key". This is a rule about WHERE a given model is called.
      It is NOT a preference for credit-funded models over cash-funded ones: that same decision says
      preference between different models stays what the blind verdicts say, with cost as a tie-break
      only. A router that quietly preferred cheap credit routes over better cash routes would be
      breaking the decision it thought it was obeying.
  default_job_cost_ceiling_usd: 5.00
  fallback_required: true
  retention_days_default: 30
  note: >-
    The automated judge is out of the release path because it agrees with the human judge only about
    two thirds of the time and wrongly accepts 22 % of what the human rejects
    (eval/experiments/EVAL-040/QUALIFICATION-REPORT-2026-09-09.yaml). That is a fact about today's
    judge, not a permanent property of the product.

