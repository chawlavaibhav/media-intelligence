    note: "carried so a dry plan prices the surface a paid run would use; the dry profile itself never calls anything"
  default_job_cost_ceiling_usd: 0.00
  fallback_required: false
  retention_days_default: 0
  note: "a permissive row for lane development and cell audits. Zero draws means zero spend, enforced by the ledger, not by good intentions. Not the alpha's dry twin: see `dry`."

invariants:
  - >-
    ADDED after the first lane built against this file. A profile with adopted:false may plan, price
    and dry-run a job, and may never spend a rupee. The Controller adopts a profile the same way a
    spend record is signed in the Lab; until then the runtime refuses to dispatch under it. The first
    alpha profile was deliberately shipped adopted:false, so the system could not spend customer
    money before anyone had agreed to its limits. The Controller adopted it on 14 Sep 2026; the
    spend_authority invariant below says why that still does not let it spend.
  - >-
    The same gate applies to every other input the runtime reads. The pack trigger table and both
    compiled packs are currently marked PROPOSED; a paid run under a proposed input is refused. This
    was found by building the first lane, not by reading the contract.
  - "A limit that is not in the named profile is not a limit the runtime may invent. Missing limit = refuse."
  - "No limit in this file is referenced by a constant anywhere in runtime code."
  - "Widening the alpha is editing a row here or adding a profile. It is never a contract change."
  - "acceptance_authority may name an automated judge only after that judge has passed qualification against its frozen criteria."
  - >-
    adopted: true means the Controller has agreed the profile's limits (a policy). It is NOT spend
    authority. A dispatch under any profile additionally requires spend_authority.status == signed
    with a record path that exists and is itself signed; a profile with spend_authority.status none
    may plan, price and dry-run only. (Controller rider, 14 Sep 2026: "Adopting the Alpha policy is
    NOT spend authorisation. No paid dispatch is authorised by any decision above.")
  - >-
    exact_text_strategies_allowed is read by the compiler/router; a strategy outside it is a refusal
    (or manual_route_required per on_non_auto_routable), never a silent downgrade. The list governs
    a spec that carries exact-text strings. A spec with no exact text names no strategy to check
    (the compiler writes no_exact_text; the route fixtures write none_required), so the list does
    not bite on it.
  - >-
    motion_requires_accepted_still: true means a motion deliverable is admitted only with
    motion.from == accepted_still and a motion.depends_on naming the accepted still in the same job;
    anything else is a refusal at intake or manual_route_required, never an inferred ordering.
