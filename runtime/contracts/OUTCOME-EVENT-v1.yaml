# OUTCOME-EVENT-v1 — what actually happened on one job, written once, never edited.
# Frozen contract. v0 stays beside this file untouched; every v0 field is carried here, and the
# fields the third-round lanes needed are added. See CHANGES-v0-to-v1.md "Third round — lane G".
#
# WHAT IS NEW, IN PLAIN TERMS. v0 recorded that a job ran and whether a person accepted it. It could
# not say WHICH route identity made the picture (the text mechanism is part of the identity, C-6c),
# which blueprint or template planned it, which Canon packs and corpus bytes were injected, how the
# attempts chained through repairs, what the two gates reported, or whether the whole thing was a
# dry rehearsal. Each of those is a question the empirical memory must answer later — "how many
# draws per accepted outcome on this route?", "did this template ever fail a gate?" — and a field
# that is not written cannot be queried.
#
# DRY EVENTS. `dry_run: true` means every attempt was rendered and priced and NOTHING was sent: the
# artifact the post-draw gate saw was synthetic (runtime/loop/synthetic.py) or absent. A dry event
# is empirical memory of the CHAIN having run end to end — package, gates, repair, acceptance,
# memory — never memory of a real outcome. It must not feed an accepted-outcome rate, a cost per
# accepted outcome, or a template promotion as if it were real; consumers read `dry_run` first.
schema: OUTCOME-EVENT-v1
status: FROZEN_CONTRACT

fields:

  event_id: {type: string, required: true, note: "'oe-' + sha256 of the canonical event content without event_id and written_utc; the store recomputes it and refuses a mismatch"}
  job_id: {type: string, required: true}
  spec_id: {type: string, required: true}
  written_utc: {type: timestamp, required: true}
  policy_profile: {type: string, required: true, note: "the profile row the loop ran under; the store reads acceptance_authority from it"}
  dry_run: {type: bool, required: true, note: "true: nothing was sent to any provider; the artifact was synthetic or absent. Memory of the chain, not of an outcome."}

  fingerprints:
    type: object
    required: true
    fields:
      job_sha256: {type: string, required: true}
      spec_sha256: {type: string, required: true}
      canon_injected_context_sha256: {type: string, required: true}
      acceptance_contract_sha256: {type: string, required: true, note: "proves the contract was not edited after a rejection"}
      decision_sha256: {type: string, required: true, note: "the ROUTE-DECISION this job ran under"}
      manifest_sha256: {type: string, required: true, note: "the EXECUTION-MANIFEST the attempts came from"}
      package_sha256: {type: string, required: false, note: "the FINAL_PRODUCTION_PACKAGE text the gates read"}

  route:
    type: object
    required: true
    note: "route identity of the primary attempt (ROUTE-IDENTITY-v0): the text mechanism is part of it (C-6c)"
    fields:
      route_key: {type: string, required: true}
      cell_key: {type: string, required: true, note: "the evidence cell the route rests on; the first when several"}
      cells: {type: "list[string]", required: false}
      text_mechanism: {type: string, required: true, note: "deterministic_text_composition | model_draws_text | not_applicable"}
      surface: {type: string, required: true}
      surface_model_id: {type: string, required: true}
      evidence_status: {type: string, required: true}
      price_pin_ref: {type: string, required: true}

  blueprint:
    type: object
    required: true
    fields:
      planner: {type: string, required: true, note: "stage_a_blueprint_fixture | recorded_fixture | template:<id>"}
      source_ref: {type: string, required: true}
      template_id: {type: string, required: false, note: "set when the plan was served from the template library"}

  canon:
    type: object
    required: true
    fields:
      packs_selected: {type: "list[string]", required: true, note: "pack ids"}
      canon_gap: {type: bool, required: true}
      missing_domains: {type: "list[string]", required: true}
      corpus_digest: {type: string, required: false, note: "from the CanonLookup when the loop was handed one"}
      injection_prefix_sha256: {type: string, required: false, note: "Canon injection v1 prefix (lane H) when available"}

  attempts:
    type: "list[object]"
    required: true
    note: "every attempt, in order, including dry ones that sent nothing"
    fields:
      attempt_id: {type: string, required: true}
      slot: {type: string, required: true, note: "primary | fallback"}
      draw_index: {type: int, required: true}
      route_decision_id: {type: string, required: true}
      route_key: {type: string, required: true}
      surface: {type: string, required: true}
      surface_model_id: {type: string, required: false}
      requested_utc: {type: timestamp, required: true}
      latency_s: {type: number, required: false, note: "absent for a dry attempt"}
      status: {type: string, required: true, note: "ok | refusal | provider_error | timeout | local_fault | dry_not_sent"}
      artifact_sha256: {type: string, required: false}
      artifact_origin: {type: string, required: false, note: "provider | synthetic | none — so a synthetic artifact is never mistaken for a draw"}
      reserved_usd: {type: decimal, required: true}
      settled_usd: {type: decimal, required: true}
      billing_state: {type: string, required: true, note: "not_dispatched | reported | unknown_provisional — kept separate (Lab audit)"}
      billing_pool: {type: string, required: true}
      is_repair_of: {type: string, required: false, note: "attempt_id this attempt repairs"}
      repair_id: {type: string, required: false}
      gate_pre_report_sha256: {type: string, required: true}
      gate_post_report_sha256: {type: string, required: true}
      gate_post_verdict: {type: string, required: true, note: "PASS | FAIL | NOT_RUN"}

  gate:
    type: object
    required: true
    fields:
      pre_dispatch: {type: "list[object]", required: true, note: "GateOutcome rows"}
      post_draw: {type: "list[object]", required: true, note: "GateOutcome rows of the last attempt"}
      blocking_failures: {type: "list[string]", required: true}
      post_draw_by_attempt: {type: "list[object]", required: false}

  deterministic_checks: {type: "list[object]", required: true}

  repairs:
    type: "list[object]"
    required: true
    note: "every repair proposed, in order. 'Try again' cannot appear: what_changes and what_stays_invariant are required."
    fields:
      repair_id: {type: string, required: true}
      attempt_index: {type: int, required: true}
      source: {type: string, required: true, note: "gate | human"}
      failure_observed: {type: string, required: true}
      failure_category: {type: string, required: true}
      what_changes: {type: string, required: true}
      what_stays_invariant: {type: string, required: true}
      route_changed: {type: bool, required: true}
      fallback_route: {type: string, required: false}
      incremental_cost_usd: {type: decimal, required: true}
      failing_ids: {type: "list[string]", required: false}

  acceptance:
    type: object
    required: true
    fields:
      authority: {type: string, required: true, note: "who may decide — a person for as long as no automated judge has qualified; must equal the profile row's acceptance_authority"}
      decision: {type: string, required: true, note: "accepted | rejected | abandoned"}
      decided_utc: {type: timestamp, required: true}
      decided_by: {type: string, required: false, note: "the person, for accepted/rejected; absent for abandoned. The store refuses accepted without it."}
      contract_lines_failed: {type: "list[string]", required: false}
      note: {type: string, required: false}
      human_minutes: {type: number, required: false}
      transcript_sha256: {type: string, required: true, note: "sha256 of the acceptance transcript (every transition with utc)"}
      state: {type: string, required: true, note: "accepted | rejected | abandoned | delivered"}

  delivered:
    type: object
    required: false
    fields:
      artifact_sha256: {type: string, required: true}
      content_type: {type: string, required: true}
      delivered_utc: {type: timestamp, required: true}
      released_by: {type: string, required: true}

  cost:
    type: object
    required: true
    fields:
      provider_usd_total: {type: decimal, required: true}
      by_pool: {type: object, required: true}
      draws: {type: int, required: true, note: "attempts recorded; under dry_run these sent nothing"}
      draws_per_accepted_outcome: {type: number, required: false, note: "absent unless accepted"}
      vendor_billed_usd: {type: decimal, required: false, note: "absent until a statement is reconciled"}

  template_candidate:
    type: object
    required: true
    fields:
      eligible: {type: bool, required: true}
      reason: {type: string, required: false}
      resulting_template_ref: {type: string, required: false, note: "set by the template library after promotion, in a superseding event"}

invariants:
  - "Written once. A correction is a new event that supersedes this one by id; nothing is edited in place."
  - "Every attempt appears, including the ones that produced nothing, with reserved and settled money kept separate."
  - "An outcome event is never a Capability Registry row and never enters eval/. Production learning and Lab evidence stay in separate stores."
  - "acceptance.authority records a person for as long as no automated judge has qualified, and equals the profile row's acceptance_authority; the store refuses otherwise."
  - "acceptance.decision accepted requires decided_by naming a person and a transcript_sha256; the store refuses an acceptance no human recorded."
  - "A repair without what_stays_invariant is invalid."
  - "dry_run true is memory of the chain, not of an outcome: no accepted-outcome rate, cost per accepted outcome or template promotion may count it as real."
