commercial_purpose: "a 30-s vertical spec advertisement (Instagram Reels / Facebook / YouTube Shorts) for Mokobara's Transit Backpack 30L in the Private Island colourway: after years alone on a grey island a man finds his navy backpack at the tideline; inside is his wife's photo and, absurdly, everything he needs to go home — his arms go into the bag, an impossibly long paddle comes out; he packs and paddles toward dawn; code end card with the site's own wordmark, 'Transit Backpack · 30L', 'Room for the long way home.', 'mokobara.com'. No price, no dialogue, no Homer or film names."
production_method: "hero still (Nano Banana 2 with two product photos as reference images) → one still per beat anchored on the hero still + the product photo → Veo 3.1 Fast image-to-video per beat (4–8 s, 720p, native ambience, negative prompt against text/logos/speech) → ffmpeg assembly by an edit list, wordmark super and end card composed by code through runtime.compositor.gates (text bounds, contrast on real pixels, disjointness), one Lyria bed, two-pass loudnorm + limiter; text never in-model; the tiny wordmark the image model copied from the reference photos painted out by code before every clip"
experiment_context: "not a blind experiment — an ordinary spec production with one customer proxy (the Controller); n = 1 brief, 1 product, 1 customer; the first agency job of this production class (generated live-action-style footage) after three code-rendered RentOK films"

