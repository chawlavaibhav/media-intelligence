tally:
  media_model_failures_that_reached_a_gate: 5      # DF-1, DF-2, DF-2b, DF-4, DF-7 (caught by contact sheets or the customer/checker; each repaired by a re-take or an edit)
  media_model_failures_unrepaired_on_the_accepted_file: 2   # DF-3 (arms depth), DF-11 (lid opening, beard/bracelet drift)
  pipeline_defects_closed_before_v2: 3             # DF-9 (overlays), DF-10 (audio joins), LG-1 (id collision, by hand)
  pipeline_defects_unrepaired_on_the_accepted_file: 3   # DF-12 (720p), DF-14 (no ear check), REC-1 (records)
  infrastructure_transients: 1                     # DF-5
  customer_flagged: 5                              # v1 items 1–5, all repaired in v2
  found_by: {producer_contact_sheets: 4, producer_micro_qual: 1, customer: 5, independent_checker: 9, dispatch_tool: 1, this_sync: 1}
  promoted_to_code_now: 0
  reading: "what got through to the customer and the checker was what no deterministic gate can see — story events, prop geometry, a tear, a costume — and the two things a gate COULD have caught (the ledger id, the audio dip) have no runtime module to live in yet. The promoted overlay gates ran in production on this class for the first time and were decisive on one customer item (black vs white logo, measured 6.58:1 vs 1.3:1). The accepted file carries five recorded open items and the customer's unitemised 'minor issues'; that is the honest state of the file."
