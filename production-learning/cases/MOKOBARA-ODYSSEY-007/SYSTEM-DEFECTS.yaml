# SYSTEM DEFECTS — case MOKOBARA-ODYSSEY-007.
# The central finding: on the first generated-footage agency job, every shipped defect was a MODEL behaviour or a
# board/route decision, not a layout miss — and no deterministic gate in the runtime could have caught any of them,
# because they are about what happens in the picture (a product that appears early, an action the clip never reaches,
# a prop that warps, a goal state undone). The promoted compositor gates from cases 001/004 DID run here, in production,
# on the overlays (runtime.compositor.gates imported by the job's tools/render_text.py) and passed on real pixels.
# Nothing is promoted to code from this job (class 1 empty, with the reason per item); the deterministic candidates
# name the check and the file they would need — a runtime assembly step and a runtime ledger — that do not exist yet.
case_id: MOKOBARA-ODYSSEY-007
classes:
  media_model_failure: "the generation model produced something that does not meet the brief"
  pipeline_failure: "the system around the model — compositor, assembly, QA coverage, records, orchestration — let a defect through or created one"
  infrastructure_transient: "provider unavailable / refusal / quota; one occurred on this job (att-014)"

defects:
  # ── class 1 candidates examined and NOT promoted (each with the reason) ──────────────────────────
  - id: LG-1
    class: pipeline_failure
    subsystem: orchestration (attempt-id allocation in the job-local dispatch tool)
    observed: "att-020 was issued to two attempts: the b3 clip (reserved 18:22:16.47Z, settled 18:23:28.46Z, 72-s latency) and the b6 still (reserved 18:23:00.26Z, settled 18:23:11.79Z). The producer relabelled the still att-020b by hand in LEDGER.jsonl and ATTEMPTS.jsonl with a note_id; money lines unchanged; the ledger re-adds to 7.857 either way."
    root_cause: "tools/dispatch.py next_attempt_id() = 1 + the number of lines in gen/ATTEMPTS.jsonl — a file appended only at SETTLE. Any attempt that is reserved but not yet settled is invisible to the counter, so the collision window is the full latency of every in-flight call (48–74 s for a Veo clip), not 'the same moment' as the packet says. The reserve-time ledger (LEDGER.jsonl), which does carry the in-flight attempt, was never the id source, and no file lock exists. The tool is a per-job copy (tools/PROVENANCE.md: from CQ-001's treatments kit @ 41d97c6, itself from the Cumin B kit @ 5c33173) — the same code will be copied into the next job unless the kit changes."
    found_by: producer (at the second reserve)
    repair: "hand relabel to att-020b; dispatches serialised for the rest of the round"
    repaired: true
    not_a_model_failure: true
    promoted_as: null
    deterministic_check_named: "ATTEMPT_ID_UNIQUE_AND_RESERVE_MINTED — (a) mint the id from the reserve-time ledger (max attempt number over LEDGER.jsonl reserve lines + 1) under an exclusive file lock (fcntl.flock) held across read-mint-append, or mint structurally from (asset, route, draw index) the way runtime/route/attempt_id.py does; (b) a ledger integrity check refusing any file in which two reserve lines share an attempt_id"
    why_not_class_1: "no runtime module owns a running job ledger or mints ids by counting: runtime/route/attempt_id.py mints from (customer_ref, job_id, decision_id, route_key, draw_index) — structural, collision-free by construction — and runtime/execute/bridge.py builds every attempt of a decision in one process. The defect lives in the agency dispatch kit that travels job to job on job branches, so the check has no file on main to live in yet. Recorded as class 2 LEDGER_LOCK_ATOMIC_ATTEMPT_IDS with the exact requirement; proposed for the /media-agency kit"
  - id: DF-8
    class: media_model_failure
    subsystem: "generation (beat 6) + board (Stage 3 asked for more action than the clip length)"
    observed: "v1 beat 6 (att-013): he stands knee-deep beside the raft for all 4 s, picks the paddle off the raft and holds it — the customer's mandatory 'goes back' never happens on screen; Stage 5 §1 described the beat as if realised and its LJ list never asked 'does he leave?' (checker D3: NEW, not producer-recorded). The customer independently noticed the paddle 'comes out magically again' (item 3)."
    root_cause: "Stage 3 asked for wade + board + two strokes in 3.5 s of a 4-s clip; the model did the first verb. The board's beat 6 first frame (a still of him beside the raft) fixed the starting state far from the goal. The producer's presentation checklist had no line per mandatory customer event."
    found_by: independent checker (D3); customer (the second paddle)
    repair: "v2: a still that already shows him ON the raft, afloat, paddle in both hands + a 4-s clip 'paddle already in his hands from the first frame; two strokes; the raft glides away' (att-020b/023, USD 0.467) — FIXED first draw"
    repaired: true
    not_a_model_failure: "partly — the clip did what a 4-s clip can; the ask exceeded it"
    promoted_as: null
    deterministic_check_named: "none — whether a mandatory event is visible on screen is a human/LJ judgment; the nameable requirement is a records rule: one LJ line per mandatory customer event (M1–M7 in Stage 1) answered against a cited frame BEFORE presentation. Class 2 MANDATORY_EVENT_VISIBILITY_LJ_LINE"
  - id: DF-10
    class: pipeline_failure
    subsystem: "audio assembly (joins)"
    observed: "v1: at the 3.5-s and 7.5-s cuts the incoming clip's native ambience sits ~15–20 dB below the outgoing for the first ~40 ms then recovers — a faint hole; at 12.5 / 20.5 / 24.5 s continuous; no clicks (checker D9, INFERRED at or below audibility on phone speakers)."
    root_cause: "per-segment fades and a straight concat at the audio joins; every clip carries its own native ambience bed at a different level"
    found_by: independent checker (measured)
    repair: "v2: 60-ms acrossfade (tri/tri) at every join (tools/assemble.py v2, gen/assemble-report.json audio_join_s 0.06) — 'FIXED by construction'; not re-measured on v2 by anyone"
    repaired: true
    not_a_model_failure: true
    promoted_as: null
    deterministic_check_named: "AUDIO_LEVEL_CONTINUITY_AT_CUTS — at every hard cut, RMS of the 50 ms after the cut vs the 50 ms before, refuse when the drop exceeds a stated dB (the checker's 15–20 dB is the only datum); and a crossfade at every join as the assembly default"
    why_not_class_1: "no assembly step exists in the runtime (runtime/loop/ has container.py for the box walk and no stitch); the same reason CODEC_TRUE_PEAK_MARGIN has stayed class 2 since case 004. Class 2 AUDIO_JOIN_CROSSFADE, same promotion condition"
  - id: DF-9
    class: pipeline_failure
    subsystem: compositor (overlays)
    observed: "v1: wordmark super = the site's white SVG at 300 px on a grey backing box; end card text in Avenir Next (a system geometric sans chosen at Stage 2 because the brand's face was 'not verified'). Customer items 4 and 5: 'use mokobara logo/name properly', 'the text font style could be better'."
    root_cause: "(a) white on a light sky needs a backing; the backing box looked like a caption; nobody had measured the alternative (black) on the real pixels; (b) Stage 2 read the dossier's 'font not verified' instead of the fetched home.html, whose @font-face names NeurialGrotesk (commercial, absent from the machine) and whose label CSS carries uppercase + letter-spacing .08em"
    found_by: customer
    repair: "v2 (USD 0): the site's own BLACK logo PNG (sha b3aefbd5…, unmodified) at 420 px on the sky, no backing — worst contrast on the real pixels of 10 frames 6.58:1 where white measured 1.3:1; end card: white SVG at 700 px first, then the product line uppercase with the site's .08em tracking, tagline with the site's -0.02em heading tracking, CTA; Helvetica Neue (the closest neo-grotesque on the machine) shaped by hb-view; 10 gates from runtime.compositor.gates at render (check_text_bounds x5, check_contrast x4 incl. the super on pixels, check_disjoint x1) all PASS (gen/overlays/layout.json)"
    repaired: true
    not_a_model_failure: true
    promoted_as: null
    note: "EVIDENCE THAT A PROMOTED GATE WORKS ON THIS CLASS: check_contrast's 'worst pixel behind the text' rule (case 001 / PR #98 blocker 1) is what made the black-vs-white decision measurable (6.58 vs 1.3). First production use of runtime.compositor.gates on a generated-footage job. The brand-font part is class 2 BRAND_FONT_FALLBACK_WITH_SITE_CSS_STYLING"

  # ── media model failures at the generation layer (all caught by the producer's contact sheets or by the customer/checker; all repaired by re-takes or edits) ──
  - {id: DF-1, class: media_model_failure, subsystem: "generation (beat 1, Veo i2v)", observed: "the open bag with yellow showing lies at his feet before he has found it — the prompt never mentioned the bag (qa/b1/contact.jpg)", root_cause: "the model added the hero product to a beat where it must be absent; the still (b1.png) had no bag, the text description of a castaway did the rest", found_by: producer (contact sheet), repair: "take 2: 'the pebble shore around him is completely empty: no bag…' + negative prompt 'backpack, bag, luggage, yellow object on the ground' (att-016, 0.40) — held", repaired: true, not_a_model_failure: false, promoted_as: null, candidate: NEGATIVE_PROMPT_THE_PRODUCT_BEFORE_ITS_REVEAL, route_observation: RO-01}
  - {id: DF-2, class: media_model_failure, subsystem: "generation (beat 5, Veo i2v)", observed: "take 1 (4 s): one coconut in, zip closed with fish, rope, gourd, flare and two coconuts still out; take 2 (6 s, 'EVERY item goes in'): fish, rope, flare in, coconuts + gourd out at the zip (qa/b5/contact.jpg, qa/b5-take2/contact.jpg)", root_cause: "a 4–6-s clip from a still that shows seven items OUTSIDE the bag cannot move them all inside — the pace asked exceeded the model (cf. Media Factory P5 'richer prompt ≠ better when it exceeds model grammar')", found_by: producer (take 1), checker D2 (take 2), repair: "v2 changed the mechanism: a still with the pebbles already EMPTY and the bag visibly full, then a clip of only the last coconut + the zip (att-021/024/025) — FIXED", repaired: true, not_a_model_failure: false, promoted_as: null, candidate: END_STATE_STILL_PLUS_LAST_ACTION_I2V, route_observation: RO-01}
  - {id: DF-2b, class: media_model_failure, subsystem: "generation (beat 5 take 3, Veo i2v)", observed: "att-024: coconut in, lid closed at 1.5 s, then the model RE-OPENED the bag for 2–4 s — 1.9 s usable", root_cause: "the prompt ended at the goal state ('the zip closes'); with 2.5 s of clip left the model kept acting and undid it", found_by: producer (sheet), repair: "take 4 (att-025): after the close 'he grips the top grab handle and lifts the closed, full bag straight up out of the top of the frame. The bag is never opened again' — held (3.2 s used)", repaired: true, not_a_model_failure: false, promoted_as: null, candidate: EXIT_ACTION_AFTER_GOAL_STATE, route_observation: RO-01}
  - {id: DF-4, class: media_model_failure, subsystem: "generation (beat 1 take 2, Veo i2v)", observed: "the one change that emptied the shore also produced a hard in-model cut at 1.54 s (scdet 27.5) to a static full-length portrait looking into the lens, a sleeved buttoned shirt with rolled cuffs (beats 2–6: sleeveless torn), and no marked rock in the wide; no pull-back exists (checker D4; the producer had recorded the costume only)", root_cause: "the pull-back from an ECU still to a wide is a camera move the model replaced with a cut; costume is text-anchored and drifted", found_by: producer (costume), checker (the cut, the rock), repair: "v2: a still that IS the wide (small man side-on at the marked rock, sleeveless, empty shore) + a 4-s clip of a small action; beat 1 = take 2's ECU 1.5 s + take 3's wide 2.0 s (att-026/027, 0.467) — FIXED", repaired: true, not_a_model_failure: false, promoted_as: null, route_observation: RO-01}
  - {id: DF-6, class: media_model_failure, subsystem: "still generation (beat 3, nano-banana-2 with references)", observed: "the lower-left of the open lining shows an irregular hanging flap that reads as a TEAR (customer item 1; checker D6-iii, frames 7.5–12.5 s)", root_cause: "the still drew the open bag with a loose lining flap; the clip inherited it; 'intact' was not in the prompt", found_by: customer; checker, repair: "v2 still: 'brand new, completely intact, no tears/rips/frayed edges, every edge a clean stitched seam', upright with the top folded open flat; negative torn/ripped/damaged; + 6-s clip (att-019/020, 0.667) — clean seams over 12 sampled frames", repaired: true, not_a_model_failure: false, promoted_as: null, route_observation: RO-02}
  - {id: DF-7, class: media_model_failure, subsystem: "generation (beat 4 take 2, Veo i2v)", observed: "the paddle blade warps and the shaft bends in the last 1.5 s of take 2 (att-018) — the take used in v1; the customer: 'looked weird coming out of bag' (item 2)", root_cause: "a long rigid prop drawn out of a small opening over 2 s; take 1 (att-003) pulled it straight, handle first, in one continuous pull", found_by: customer; producer (side-by-side sheets at 4 fps in the repair round), repair: "edit: take 1 used in v2, USD 0 — 'the take we had not used was the fix; keep every take'", repaired: true, not_a_model_failure: false, promoted_as: null, candidate: TAKE_SELECTION_BEFORE_RETAKE, route_observation: RO-01}
  - {id: DF-3, class: media_model_failure, subsystem: "generation + route (beat 4, both takes)", observed: "both hands inside the open bag at wrist-to-forearm depth, the way anyone rummages; no frame with an arm past the elbow, no chin on the rim; the second half (a stick becomes a paddle far longer than the bag) reads clearly (checker D1, R6 PARTIAL). Stage 5's LJ-3 ('one arm to the shoulder ~13–15 s, both arms in ~15–17 s') overstated what the take contains", root_cause: "i2v from a still whose first frame shows normal rummaging cannot be pushed to 'arm to the shoulder' by text alone (checker's earliest stage: Stage 4 route); the repair-round addendum ranked the straight paddle above arm depth on the same beat", found_by: producer (micro-qual note), checker (D1), repair: "NONE — unrepaired on the accepted file; the recorded route if asked: a beat-4 still that already shows one arm buried to the shoulder, then i2v (≈ USD 0.87)", repaired: false, not_a_model_failure: false, promoted_as: null, note: "the customer's own named gag ('keep his arms in the bag') is the item left out; he accepted anyway and did not name it in v2's 'minor issues'", route_observation: RO-01}
  - {id: DF-11, class: media_model_failure, subsystem: "generation (identity across 6 clips)", observed: "beard jet-black/fuller in beat 1 vs grey-streaked in beats 3–4; bracelet on the right wrist in beats 2, 4, 5 (anchor: left); the bag's top opens as a hinged lid at 16.5 s and the front pocket hangs open downward at 22.5 s (v1) where the product zips at the top (checker D6-i/ii, D7)", root_cause: "text-anchored identifiers drift; the reference photo fixes the closed bag, not its opening mechanism", found_by: independent checker, repair: "v2: beat 5's new take has the front pocket closed and flat; the lid opening in beat 4 (take 1) and the beard/bracelet drift are UNREPAIRED", repaired: false, not_a_model_failure: false, promoted_as: null, route_observation: RO-01}

