  - {n: 1, beat: cold_open_mid_action, start_s: 0.0, end_s: 1.8, feeling: "bustle — a game already running", framing_target: 0.15, content: "owner mid-jump at frame 1, live HUD"}
  - {n: 2, beat: obstacle_1, start_s: 1.8, end_s: 4.6, feeling: "dread, then a bonk", framing_target: 0.25, content: "wall leans in, sheets flutter → brace → hit-stop, star, shake, knock-back, dazed (TENANT VERIFICATION)"}
  - {n: 3, beat: obstacle_2, start_s: 4.6, end_s: 7.4, feeling: "menace with a grin", framing_target: 0.25, content: "sack hops with dust → hit (COLLECTING RENT)"}
  - {n: 4, beat: obstacle_3, start_s: 7.4, end_s: 10.2, feeling: "surprise, then helplessness", framing_target: 0.21, content: "tenant sprints past from BEHIND with speed lines and coins; look-back, reach, trip (LEFT WITHOUT PAYING — never stopped)"}
  - {n: 5, beat: obstacle_4, start_s: 10.2, end_s: 12.6, feeling: "dread (it wobbles) then a crash", framing_target: 0.16, content: "tower wobbles, topples about its base; the world STOPS while he is under it; crawl out (NO RECONCILIATION)"}
  - {n: 6, beat: obstacle_5_game_over, start_s: 12.6, end_s: 15.0, feeling: "panic, pain, defeat", framing_target: 0.25, content: "swarm lunges; cold grade + vignette; the swarm hangs over him; GAME OVER? (COMPLAINTS)"}
  - {n: 7, beat: cheat_code_turning_point, start_s: 15.0, end_s: 18.0, feeling: "a held breath → awe", framing_target: 0.22, content: "panel types INSTALL / RENTOK APP; the phone drops OUT of the panel into his hand; held breath (near-silence); flash from the phone; +10 % lift and cyan highlights after"}
  - {n: 8, beat: power_up, start_s: 18.0, end_s: 19.6, feeling: "power, rising confidence", framing_target: 0.24, content: "aura, palette shift, health refill ticks, wind-up → fire, POWER UP!"}
  - {n: 9, beat: clear_1, start_s: 19.6, end_s: 20.8, feeling: "glee", framing_target: 0.15, content: "tick projectile; paper burst; chip DIGITAL KYC"}
  - {n: 10, beat: clear_2_hero_frame, start_s: 20.8, end_s: 22.0, feeling: "release", framing_target: 0.15, content: "coin fountain inside a shockwave ring — hero frame 651 (21.7 s); AUTOPAY"}
  - {n: 11, beat: clear_3_tagged_not_stopped, start_s: 22.0, end_s: 23.2, feeling: "control", framing_target: 0.15, content: "ledger tag follows the runner; DUES TRACKED LIVE"}
  - {n: 12, beat: clear_4, start_s: 23.2, end_s: 24.4, feeling: "order", framing_target: 0.15, content: "dashboard card; ONE DASHBOARD"}
  - {n: 13, beat: clear_5, start_s: 24.4, end_s: 25.6, feeling: "relief", framing_target: 0.15, content: "red → green pops, swarm fades; COMPLAINT TICKETS"}
  - {n: 14, beat: flag_level_clear, start_s: 25.6, end_s: 27.6, feeling: "triumph", framing_target: 0.19, content: "brace, jump, cheer, flag rises, confetti, LEVEL CLEAR!; checklist gone by 27.0"}
  - {n: 15, beat: end_card_brand_cta, start_s: 27.6, end_s: 30.0, feeling: "calm, clear close", framing_target: 0.0, content: "brand-blue card, wordmark, INSTALL RENTOK APP, RENTOK.COM"}

