compositor_invariants_used:
  - every text box logged per frame and kept inside the phone-safe box (65,288)–(888,1248): 4,019 boxes × 900 frames, 0 failures
  - critical text regions disjoint per frame (0 overlaps)
  - graphic-vs-text disjoint in screen space, sprite states alive/burst/fallen/leaving (0 overlaps; case 004's GRAPHIC_TEXT_DISJOINT)
  - framing target per beat at focus_t (0 below target) — now runtime check_framing_target
  - world fills the frame (camera >= 1.0 on 900 frames) — now runtime check_world_fills_frame
  - hero frame present in the keyframes
  - WCAG contrast measured per box (min worst 6.08)
  - exact copy byte-checked against the frozen deck (0 mismatches)
  - forbidden-claim scan over every on-screen string (40 distinct in the DET run; 42 in the checker's own scan incl. typing partials; 0 hits)
  - container: geometry, codec, moov-first, no edit lists by box walk
  - loudness on the encoded file: -14 LUFS ±1.5, TP ≤ -1 (delivered -14.0 / -2.7)
  - NOT in the set on this job (hence N1/N2/N5 reached the checker): hero occlusion by a graphic; sprite density across sheets — both now runtime gates

known_limits_of_the_template:            # stages/05 §5.6, confirmed by the checker's scores (2–4 of 5)
  - "secondary motion, true contact, continuous facial change, parallax on pushes, squash-and-stretch on the character: not possible with rigid cut-outs — a video-model pass on one or two hero beats is the recorded next step (CQ-001 §5), not tried here"
  - "power-up effects read modest at phone size (checker §5: 2 of 5) — the customer did not object"

