# ACCEPTED TEMPLATE — the structural template of the V2 film: Lane A's accepted skeleton (case RENTOK-GAME-A-004,
# code_rendered_side_scroller_with_ai_sprites) plus the direction layer that CQ-001 Treatment C introduced — a board with
# feeling / framing / impact per beat, a renderer that executes those fields through named primitives, and textless AI
# sprites. Every value below carries evidence_scope: this_accepted_template. None is a Canon rule; none is a universal
# pacing norm. Beat times are board.json @ b06deaf (the board the delivered film was rendered from); they are Lane A's.
case_id: RENTOK-GAME-V2-006
template_id: code_rendered_side_scroller_with_ai_sprites   # the same id as cases 004/005 — this record adds the direction layer
template_variant: directed_board_v2                          # feeling / framing / impact per beat + primitive renderer
template_class: game_style_advertising_film
status: reusable_candidate                # n = 2 ACCEPTED jobs on this skeleton by the same producer path (Lane A without the direction layer, this job with it), ONE customer, ONE brief; plus CQ-001's blind rank on one beat (C > B > A with the layer). NOT a promoted runtime template.
source_asset_sha256: 0e76b7b1872317728cfbb08dc948e4c678452ef7d84a0eafd6ece0f89013d122
total_duration_s: 30.0
evidence_scope: this_accepted_template

what_is_reusable_here:                    # honest scope: the STRUCTURE, not the film
  skeleton: "Lane A's fifteen beats and timings (case 004 ACCEPTED-TEMPLATE.yaml structure) — carried over unchanged"
  direction_layer: "per beat: feeling (one or two words + one line), framing (owner_frac_target per POSE, focus_t at the camera hold, camera keyframes [{t, scale, cx, ease_s}], eye order), impact (a list of {t | t0/t1, primitive, params}) — board.json frames[].feeling / .framing / .impact"
  renderer_contract: "the renderer reads camera, hit-stop, shake, pose table and audio cues FROM the board (render_v2.py _collect / CAMS / HOLDS / SHAKES / ANTIC); nothing about feel is hard-coded"
  primitive_names_used: [anticipation, audio, audio_withdraw, checklist_fade, chip_flight, flag_reached, flash_from_source, freeze_dim, grade, hit_stop, hud_flash, hud_phone_icon, hud_refill, impact_frame, impact_star, install, muzzle_flash, obstacle_motion, particles, payoff, phone_fall, pose, projectile, ring, shake]   # the 25 names in board.json impact[]
  generative_inputs: "textless stills only — character sheets on flat #00FF00 (base 4-pose + two 8-pose expression sheets), one still per obstacle, one plate (all nano-banana-2); one music bed (Lyria) processed per beat by code"
  what_is_NOT_reusable: "the beats' specific feelings, the obstacle metaphors, the copy deck, the numbers below"

production_method:
  film: "rendered by code (Pillow frames → ffmpeg), 30 fps, 900 frames, world/UI layer split, camera crop-and-scale with NEAREST resampling"
  text: "every string set by code (original bitmap font); no in-model text"
  voice: none
  motion: "code: obstacle motion curves, hit-stop with catch-up, shake, easing, particles, grade; no generative video"
  audio: "SFX synthesised from the board's audio cues (53); the reused bed ducked / cut / low-passed / lifted per beat; loudnorm + true limiter"
  reuse: "everything but one sheet reused under accepted_in_context provenance from two earlier productions (PROVENANCE.md, 61 files blob-verified)"

