  currency_note: "USD at pinned prices; INR at the repo display rate 95.4211"
  known_v3_to_v4_1_provider_cost_usd: {value: 7.31118, rounded_as_reported: 7.3112, inr_approx: 697.6, covers: "V3 (3.2836) + V4 (4.0276) + V4.1 (0) — the figure the final pilot report quoted"}
  known_v1_v2_provider_cost_usd: {value: 8.082, inr_approx: 771.2, covers: "V1 (3.762) + V2 (4.320) under the INR 3,000 record"}
  verified_pilot_provider_cost_usd: {value: 15.39318, rounded: 15.3932, inr_approx: 1468.8, covers: "all 54 reserved dispatches across the three ledgers, failed calls included", label_rule: "this — not 7.31 — is the number to call the pilot's provider cost"}
  total_known_provider_cost_usd: 15.39318
  cost_by_pool:
    fal_cash: {usd: 3.479, calls: 17, note: "V3 2.999 (GPT Image 2 0.212, Seedream 0.405, FLUX 0.03, Kling 2.352) + V1 H3 Max 0.48; fal balance reads show ≈ 2.97 actually billed in V3 (GPT Image 2 metered under the pin)"}
    vertex_gemini_credits: {usd: 11.8696, calls: 21, note: "Veo i2v ×6 (5.76) + Veo extend ×2 (4.32) + NB2 ×8 (0.536) + Omni ×1 (1.0136) + Lyria ×4 (0.24); a credit pool, not cash"}
    sarvam_prepaid: {usd: 0.04458, calls: 16, inr: 4.3, note: "exact ledger sum; the pilot report rounded it to 0.0446"}
  cost_of_discarded_attempts_usd:
    value: null
    lower_bound_usd: 9.32
    reason: "at least the entire V1/V2 lineage (8.082) + the four explicit rejections (FLUX dhaba 0.03, Kling b2 0.448, NB2 still-r1 0.067, Omni 1.0136 = 1.559) — but V3/V4 media accepted at the time and dropped by the V4 architecture (a2/b1 clips, b2/b3/kora/dhaba stills, all 16 Sarvam takes) are neither cleanly 'discarded' nor 'used'"
  cost_of_failed_provider_calls_reserved_usd: 2.10    # Lyria 3 × 0.06 = 0.18 + Veo 2 × 0.96 = 1.92; whether billed is unknown
  cost_per_accepted_outcome:
    media_cost_to_accepted_outcome_usd: 15.39318
    numerator_complete: false
