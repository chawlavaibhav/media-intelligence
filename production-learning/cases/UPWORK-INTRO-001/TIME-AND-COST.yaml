    statement: "lower bound USD 15.39 ≈ INR 1,469 of provider spend for one accepted 57-s asset; the true full CpAO is higher by the missing components and by the human time below"
  full_cpao_proposed:
    provider_generation_cost_usd: 15.39318
    paid_reasoning_cost_usd: {value: null, reason: "subscription-metered sessions; no per-job figure"}
    human_production_review_time: {value: "≤ 3 h 50 m of unattributed gaps + five verdict exchanges", inr_per_hour: null, reason: "no labour rate assigned without Controller authority"}
    note: "the 7–8 h total is itself commercially meaningful before any labour cost is assigned"

product_conclusion:
  final_quality: SUCCESS
  pipeline_efficiency: UNDERPERFORMED
  statement: "final quality succeeded; pipeline efficiency did not. One accepted 57-s asset took five assembled versions, five human review cycles, 54 paid dispatches (USD 15.39 reserved) and ≈ 7 h 54 m wall clock, of which provider waiting was ≈ 1 h 06 m (latency sum) — the time went to creative re-architecture (V1→V2→V3), a compositor without gates (V3), and review/packaging gaps between versions"
  baseline_status: "this record is the BASELINE for comparable future commercial productions; no universal target is set here"
  next_productions_must: "measure TTAO from the first production input (session start or package receipt), record the ACCEPT timestamp mechanically, and keep one ledger per production so the numerator is complete"

controller_decision_candidates:
  - id: CD-TTAO-KPI
    question: "Should TTAO become a formal primary production KPI alongside CpAO?"
    recommendation: "YES"
    status: candidate — not policy until the Controller rules
    rationale: "this run shows a quality success and an efficiency failure that CpAO alone (USD 15.39) would under-report; the cost of the 7–8 h is the larger commercial fact"
