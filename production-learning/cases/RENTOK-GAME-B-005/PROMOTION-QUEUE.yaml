promoted_now:                                                # class 1 — deterministic, in code, with regression tests
  - id: GRAPHIC_TEXT_DISJOINT
    kind: deterministic_compositor_gate
    where: "runtime/compositor/gates.py check_graphic_text_disjoint — test runtime/tests/test_j_rentok_game_004_005.py GraphicTextDisjoint (shared with case 004 D-2)"
    rule: "declared critical graphics and critical text boxes may not overlap, with an optional minimum gap"
    closes: [D-1, D-9]
  - id: VO_TEXT_ALIGNMENT
    kind: deterministic_compositor_gate
    where: "runtime/compositor/gates.py check_vo_text_alignment — test VoTextAlignment"
    rule: "a spoken line paired with an on-screen string may not start before that string's first on-screen time (minus a stated tolerance); a paired string that never appears is refused"
    closes: [D-3]
    note: "sits beside PR #103's check_vo_schedule (overlap / overrun), which this branch does not carry; the two are complementary and will need a merge of gates.py"
  - id: VALIDATE_BEFORE_RESERVE
    kind: orchestration_fix
    where: "runtime/execute/bridge.py _attempt — test HarnessRefusedAttemptsReserveNothing; committed dry battery B05 re-recorded (runtime/battery/results/2026-09-14)"
    rule: "an attempt the harness refuses before dispatch (unresolved input, unverified body shape, failed precondition) reserves neither ceiling nor pool; the refusal is recorded with 'not_reserved'"
    closes: [T1 (att-016)]

candidate_patterns:                                          # class 2
  - id: VOICE_CAST_BY_A_HUMAN_EAR
    kind: process requirement (candidate)
    rule: "when a film carries a generated voice, a human listens to the audition takes before the voice is frozen and the plates are built; transcript-verbatim and duration are not a casting judgment. When neither producer nor checker can listen, the takes go to the Controller for a 30-second listen"
    evidence: [HD-01, RO-05, "case 001 RO-05 (same route, long narration, same reading)", "case 002 CROSS_CLIP_VOICE_CONTINUITY: human-perceived continuity is the release authority"]
    promotion_condition: "a line in the /media-agency Stage 5 preamble (already implied by the question template's 'cast by ear'); one more voiced job produced this way"
  - id: PER_KEY_QUOTA_IN_POOL_READINGS
    kind: pool-reading requirement (candidate)
    rule: "a pool reading for a keyed provider records the KEY's quota as well as the account balance, or dry-probes the key before planning on it; a balance read that cannot see the key's quota is recorded as partial"
    evidence: [att-006, RO-06]
    promotion_condition: "runtime/execute/pools.py PoolLiquidity could carry an optional key_quota reading — proposed, not built (no runtime path reads ElevenLabs today); adopt after one more keyed-provider job"
  - id: MEASURED_VO_DRIVES_TIMELINE
    kind: compositor mechanism (candidate)
    rule: "board slots are maxima; the code timeline reads measured VO durations and grows/shrinks holds under a minimum-hold rule, and the alignment gate (VO_TEXT_ALIGNMENT) runs over the result"
    evidence: ["two slots grew by 1.0 / 0.8 s to fit measured lines", D-3, D-7]
    promotion_condition: "one more voiced code-rendered job; the stretch created the D-7 hole, so the mechanism needs a bed-continuity rule before it is a pattern"
  - id: SPRITE_SHEET_SINGLE_DRAW
    kind: production pattern (candidate; the sheet variant of MICRO_QUALIFY_THE_RISKIEST_ASSET_FIRST in case 004)
    rule: "draw all poses of a character in ONE image on a keyable ground and animate by code — identity by construction instead of reference-image routes; read the card cell by cell"
    evidence: [RO-01, D-4, "case 004 RO-01 / D-5"]
    promotion_condition: "a third sheet with no missing identifier, or a rule that the card lists identifiers per cell"
  - id: WORLD_AT_LOWRES_TEXT_AT_FULLRES
    kind: compositor pattern (candidate)
    rule: "compose the generated world at 1/k resolution and nearest-upscale for a unified retro texture across stills from separate draws; draw exact text crisp at full resolution"
    evidence: ["worked once (render_film.py: 360x640 x3)"]
    promotion_condition: "a second retro/pixel brief"
  - id: CODE_RENDERED_GAME_WITH_AI_SPRITES
    kind: production template (candidate; shared with case 004, recorded once in each ACCEPTED-TEMPLATE.yaml)
    rule: "as case 004"
    evidence: ["this lane converged on it independently"]
    promotion_condition: "a second customer and brief"
  - id: CODEC_TRUE_PEAK_MARGIN
    kind: deterministic_qa rule (candidate; shared with case 004)
    rule: "measure loudness and true peak on the delivered encoded file; leave ≈ 2 dB pre-encode headroom"
    evidence: [R2, R2b, RO-09, "case 004 R5"]
    promotion_condition: "as case 004"
  - id: COMPOSE_WORLD_ACROSS_THE_FULL_FRAME
    kind: composition rule (candidate; shared with case 004)
    rule: "specify plates in the delivered geometry (a 9:16 film needs a 9:16 or two-row plate); the safe box bounds critical elements, not art"
    evidence: [D-5, "case 004 D-7"]
    promotion_condition: "as case 004"
  - id: CANON_GAP_DECLARATION_VERIFIED
    kind: checker step (candidate)
    rule: "a Stage-3 'missing domain' declaration is verified against the accepted-claim index before the gate closes"
    evidence: ["the gate checker found audio and colour claims this lane had first declared as gaps; the lane then cited 62 ids (06-CONTROLLER-COMPARISON.md §3)"]
    promotion_condition: "a Canon-stream decision; a lookup test is cheap once the index format is fixed"

