# FAILURE-ATLAS-CLASSIFIED — the 225 raw defect rows with a mechanism bucket and a failure-mode label added.
# Derived from FAILURE-ATLAS-RAW.yaml on 2026-09-22. Nothing in the original rows was altered; three fields were added to each row:
#   bucket        — one of B1..B10 below. Every row lands in exactly one.
#   failure_mode  — the mechanism inside that bucket, stable across jobs so recurrence can be counted.
#   recurrence    — PREVENTED | RECURRED-DESPITE-CODE | RECURRED-NOTE-ONLY | RECURRED-NO-FIX | NEW (single occurrence so far).
#
# Recurrence rule used (stated so it can be checked): a mode is a recurrence only when the MECHANISM repeats, not the symptom.
# Where a code artefact existed at or before a later occurrence and the mode still happened, the chain is RECURRED-DESPITE-CODE.
# Where the only response was prose (a candidate pattern, a directional note, a line in a case file), it is RECURRED-NOTE-ONLY.
# Where the record shows nothing was done, it is RECURRED-NO-FIX. PREVENTED means the later occurrence was stopped by the promoted code before delivery.

