- atom_id: mb_002
  concept: centre_as_strongest_attractor
  informs: [creative.hierarchy, static.composition]
  role: [fills, diagnoses, repairs]
  principle: >
    The centre of the frame is the single strongest point of attraction. An element
    placed there holds the eye and resists the viewer moving away from it.
  mechanism: "The enclosing edges push attention inward; the centre both receives and radiates that force."
  applicability:
    media: [static, video_frame]
    when: "any framed composition"
    exceptions: ["square and circular frames intensify the effect further"]
    exceptions_status: source_supported
  diagnostic: "Is the rank-1 element at or near centre, and is holding the eye what this creative wants?"
  failure_modes: [wrong_element_dominates]
  proposed_failure_modes: [unintended_centre_lock]
  repairs: [alter_position]
  proposed_repairs: [move_off_centre]
