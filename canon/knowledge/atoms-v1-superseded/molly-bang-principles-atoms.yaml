- atom_id: mb_005
  concept: contrast_enables_perception
  informs: [creative.hierarchy, static.composition]
  role: [fills, diagnoses, repairs]
  principle: >
    Contrast — of colour, shape, size, or placement — is what makes any element or
    pattern visible at all. Without contrast against its surroundings, an element
    cannot hold a rank in the hierarchy.
  mechanism: "Perception is comparative; difference is the signal."
  applicability:
