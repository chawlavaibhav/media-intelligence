- atom_id: mb_015
  concept: depth_via_size_and_base_height_progression
  informs: [static.composition]
  role: [fills, repairs]
  principle: >
    Depth is created by placing the bases of progressively smaller, thinner or lighter
    elements progressively higher in the frame. The effect is stronger when the spacing
    between them reduces geometrically rather than by a fixed amount.
  mechanism: "Reproduces how receding objects behave in a perspective view."
  applicability:
    media: [static, video_frame]
    when: "the composition requires depth and the arrangement is a free decision"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Do element size, base height, and inter-element spacing progress together?"
