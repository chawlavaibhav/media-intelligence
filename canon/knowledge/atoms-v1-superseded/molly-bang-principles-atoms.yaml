- atom_id: mb_014
  concept: colour_carries_borrowed_qualities
  informs: [creative.visual_language, message.emotional_target]
  role: [fills, diagnoses]
  principle: >
    Colour affects viewers more strongly than any other pictorial element. Meanings are
    borrowed from natural constants — red from blood and fire, white from snow and bone,
    black from darkness — and then transferred to anything sharing that colour, even
    though the transfer is not logically valid.
  mechanism: "A generalisation from remembered experience; the source notes it is false and that it works reliably anyway."
  applicability:
    media: [static, video_frame]
    when: "palette is a free or soft decision"
