- atom_id: mb_013
  concept: colour_association_dominates_shape_association
  informs: [creative.hierarchy, static.composition, relationships]
  role: [fills, diagnoses, repairs]
  principle: >
    When colour varies across a set of elements, shared colour dominates grouping and
    overrides shared shape. Shape grouping is what remains available when colour is
    uniform. Two unrelated elements sharing a colour will be read as belonging together.
  mechanism: "Colour association is immediate and pre-attentive; shape grouping requires effort to override it."
  applicability:
    media: [static, video_frame]
    when: "more than one element shares a colour, or a palette is being chosen"
    exceptions: ["young children group by shape more strongly than by colour"]
    exceptions_status: source_supported
  diagnostic: "Which elements share a colour, and is the association that creates one the creative intends?"
  failure_modes: []
  proposed_failure_modes: [false_grouping_by_colour]
  repairs: []
  proposed_repairs: [break_colour_association]
  retrieval_keys: {ir_fields: [creative.hierarchy, static.composition], media_types: [static, video], objective_classes: [any]}
