- atom_id: mb_001
  concept: pictorial_weight_of_vertical_position
  informs: [creative.hierarchy, static.spatial_hierarchy]
  role: [fills, diagnoses, repairs]
  principle: >
    An element placed higher in the frame draws more attention and reads as more
    important than the same element placed lower, independent of its size.
  mechanism: >
    Read as escaping the ground plane; the viewer registers the departure from where
    things are expected to rest.
  applicability:
    media: [static, video_frame]
    when: "vertical placement of a subject is a free or soft decision"
    exceptions: ["subject must also read as grounded; the same placement makes it feel less attached to the earth"]
    exceptions_status: source_supported
  diagnostic: "Compare intended priority order against the vertical placement order of the competing elements."
  failure_modes: [wrong_element_dominates]
  proposed_failure_modes: []
  repairs: [alter_position]
  proposed_repairs: [alter_vertical_placement]
  retrieval_keys: {ir_fields: [creative.hierarchy], media_types: [static], objective_classes: [any]}
