- atom_id: mb_006
  concept: value_contrast_against_ground
  informs: [creative.hierarchy, creative.visual_language, static.composition]
  role: [fills, diagnoses, repairs]
  principle: >
    Bright and pale elements read as luminous against dark grounds and wash out against
    light grounds. Small pale elements on a dark ground can outrank much larger elements.
  mechanism: >
    Stated physiologically in the source: a white field activates all colour receptors and
    bleaches them, while a dark ground lets them rest, so the coloured area reads stronger.
  applicability:
    media: [static, video_frame]
    when: "an element must hold rank 1 or 2 despite being small"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Compare the value of each ranked element against the value of the ground behind it."
  failure_modes: []
  proposed_failure_modes: [salience_lost_to_background]
  repairs: [alter_contrast]
  proposed_repairs: [alter_background_value]
  retrieval_keys: {ir_fields: [creative.hierarchy, creative.visual_language], media_types: [static, video], objective_classes: [any]}
