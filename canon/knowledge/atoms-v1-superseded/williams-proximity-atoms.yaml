atoms:

- atom_id: rw_001
  concept: proximity_implies_relationship
  informs: [static.composition, creative.hierarchy]
  role: [fills, diagnoses, repairs]
  principle: >
    Physical closeness implies relationship. Items placed close together are read as one
    visual unit; items placed apart are read as unrelated. The rule runs in both directions —
    unrelated items must be moved apart, not merely related items moved together.
  mechanism: "Spatial grouping is read pre-attentively, before content is understood."
  applicability:
    media: [static, video_frame]
    when: "a frame contains more than one informational element"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Which elements read as belonging together, and is that the intended set?"
  failure_modes: []
  proposed_failure_modes: [false_grouping_by_proximity, ambiguous_element_association]
  repairs: []
  proposed_repairs: [group_related_elements, separate_unrelated_elements]
  retrieval_keys: {ir_fields: [static.composition, creative.hierarchy], media_types: [static], objective_classes: [any]}
  source_ref: {source_id: williams_non_designers_design_book, chapter: 2, section: "Summary of proximity", page_start: 15, page_end: 32, figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.95
  status: pending_vocabulary

- atom_id: rw_002
  concept: eye_stop_count_threshold
  informs: [static.composition]
  role: [diagnoses, repairs]
  principle: >
    Count the number of times the eye stops when scanning the frame. More than three to five
    separate visual elements indicates the frame needs grouping.
  mechanism: "Each ungrouped element costs a fixation; too many fixations prevent a readable order."
  applicability:
    media: [static, video_frame]
    when: "assessing whether a composition is organised"
    exceptions: ["the source states the threshold depends on the piece"]
    exceptions_status: source_supported
  diagnostic: "How many separate visual units does the frame resolve into?"
  failure_modes: []
  proposed_failure_modes: [excessive_separate_elements]
  repairs: []
  proposed_repairs: [group_related_elements, reduce_element_count]
  retrieval_keys: {ir_fields: [static.composition], media_types: [static], objective_classes: [any]}
  source_ref: {source_id: williams_non_designers_design_book, chapter: 2, section: "How to get it", page_start: 32, page_end: 32, figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.9
  status: pending_vocabulary

- atom_id: rw_003
  concept: reading_path_requires_definite_start_and_end
  informs: [creative.hierarchy]
  role: [fills, diagnoses]
  principle: >
    A composition must support a logical progression with a definite beginning and a definite
    end. The viewer should know where to start, what path to follow, and when they are finished.
  mechanism: "Without a terminating point the eye continues searching the frame for missed content."
  applicability:
    media: [static, video_frame]
    when: "any composition carrying more than one piece of information"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Where does the eye start, what path does it follow, and does it know when it is finished?"
  failure_modes: []
  proposed_failure_modes: [no_clear_entry_point, no_clear_exit_point]
  repairs: []
  proposed_repairs: [establish_single_entry_point, group_related_elements]
  retrieval_keys: {ir_fields: [creative.hierarchy], media_types: [static], objective_classes: [any]}
  source_ref: {source_id: williams_non_designers_design_book, chapter: 2, section: "Summary of proximity", page_start: 32, page_end: 32, figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.9
  status: pending_vocabulary

- atom_id: rw_004
  concept: competing_emphasis_destroys_entry_point
  informs: [creative.hierarchy]
  role: [diagnoses, repairs]
  principle: >
    Two elements carrying equal emphasis create two competing entry points. The viewer
    bounces between them instead of reading in an intended order.
  mechanism: "An entry point is established by being unambiguously strongest; two equals cancel."
  applicability:
    media: [static, video_frame]
    when: "more than one element carries strong emphasis"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Is there exactly one unambiguously strongest element?"
  failure_modes: []
  proposed_failure_modes: [competing_entry_points]
  repairs: []
  proposed_repairs: [demote_competing_emphasis, establish_single_entry_point]
  retrieval_keys: {ir_fields: [creative.hierarchy], media_types: [static], objective_classes: [any]}
  source_ref: {source_id: williams_non_designers_design_book, chapter: 2, section: "business card demonstration", page_start: 17, page_end: 17, figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
