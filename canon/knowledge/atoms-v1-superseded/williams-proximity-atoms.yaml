  status: pending_vocabulary

- atom_id: rw_005
  concept: trapped_white_space_separates_related_elements
  informs: [static.typography_layout, static.composition]
  role: [diagnoses, repairs]
  principle: >
    White space left between elements that belong together pushes them visually apart.
    Space must be removed from within a group and added between groups, not distributed evenly.
  mechanism: "Perceived grouping tracks relative spacing, so equal spacing destroys group boundaries."
  applicability:
    media: [static]
    when: "text elements have a hierarchical relationship, such as headline and body"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Is the space within each group smaller than the space between groups?"
  failure_modes: []
  proposed_failure_modes: [trapped_white_space]
  repairs: []
  proposed_repairs: [reduce_space_within_group, increase_space_between_groups]
  retrieval_keys: {ir_fields: [static.typography_layout], media_types: [static], objective_classes: [any]}
  source_ref: {source_id: williams_non_designers_design_book, chapter: 2, section: "mini-poster demonstration", page_start: 25, page_end: 26, figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.95
  status: pending_vocabulary

- atom_id: rw_006
  concept: equal_spacing_signals_equal_relationship
  informs: [static.typography_layout, static.composition]
  role: [diagnoses, repairs]
  principle: >
    Equal white space between elements signals that they are peers. If a headline sits the same
    distance from the text above and below it, its ownership is genuinely ambiguous.
  mechanism: "Relative spacing is the grouping cue; equality removes the cue entirely."
  applicability:
    media: [static]
    when: "three or more elements are stacked"
    exceptions: ["legitimate when every element is genuinely a peer within one subset"]
    exceptions_status: source_supported
  diagnostic: "For each element, is it closer to the thing it belongs to than to anything else?"
  failure_modes: []
  proposed_failure_modes: [ambiguous_element_association]
  repairs: []
  proposed_repairs: [reduce_space_within_group, increase_space_between_groups]
  retrieval_keys: {ir_fields: [static.typography_layout], media_types: [static], objective_classes: [any]}
  source_ref: {source_id: williams_non_designers_design_book, chapter: 2, section: "What to avoid", page_start: 32, page_end: 32, figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.9
  status: pending_vocabulary

- atom_id: rw_007
  concept: do_not_fill_space_for_its_own_sake
  informs: [static.composition]
  role: [diagnoses, repairs]
  principle: >
    Elements must not be placed in corners or in the centre merely because that space is empty.
    Emptiness is not a defect to be corrected.
  mechanism: "Placement driven by vacancy rather than relationship produces false groupings."
  applicability:
    media: [static, video_frame]
    when: "elements are distributed across a frame"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Does every element's position express a relationship, or does any merely fill a gap?"
  failure_modes: []
  proposed_failure_modes: [space_filling_placement]
  repairs: []
  proposed_repairs: [remove_corner_filling, group_related_elements]
  retrieval_keys: {ir_fields: [static.composition], media_types: [static], objective_classes: [any]}
  source_ref: {source_id: williams_non_designers_design_book, chapter: 2, section: "What to avoid", page_start: 32, page_end: 32, figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.9
  status: pending_vocabulary

