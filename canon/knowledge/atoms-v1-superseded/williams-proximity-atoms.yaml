# Canon atoms — Robin Williams, The Non-Designer's Design Book (2008), ch.2 "Proximity"
# Pass 1, source-only. Extracted in isolation: no vocabulary or atoms from any other source.
# Registry is empty, so every atom proposing a term is pending_vocabulary by SPEC-02 rule 3.
source_manifest:
  source_id: williams_non_designers_design_book
  edition: "4th ed., Peachpit Press, 2008"
  pdf_pages: 217
  chapter: 2
  chapter_title: Proximity
  book_pages: 15-32
  pdf_pages_extracted: 16-33
  structure_note: >
    Each principle chapter ends with four named sections — Summary, The basic purpose,
    How to get it, What to avoid. "How to get it" is a diagnostic-plus-repair list and
    "What to avoid" is a failure list, both authored by the source rather than inferred.
  figure_note: >
    Argues through before/after redesign pairs. Layout is legible in extracted text for
    most examples; the dance-postcard example (p24) loses its scattered arrangement in
