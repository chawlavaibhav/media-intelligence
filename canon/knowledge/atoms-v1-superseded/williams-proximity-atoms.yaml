human_notes:

- concept: organisation_increases_readership_and_recall
  statement: "The source asserts that organised information is more likely to be read and remembered."
  informs: []
  reason_not_operational: "A commercial-outcome claim, asserted without evidence and with no IR field to fill."
  source_ref: {chapter: 2, section: "The basic purpose", page_start: 32}

- concept: group_information_before_designing
  statement: "Write out which pieces of information belong together before attempting any layout."
  informs: []
  reason_not_operational: >
    A procedure for the designer, not a property of the output. Describes producing a
    specification before execution — arguably a statement about our own pipeline rather
    than knowledge the pipeline consumes.
  source_ref: {chapter: 2, section: "menu demonstration", page_start: 27}

- concept: overlap_graphic_past_the_edge
  statement: "Enlarging a graphic so it overlaps a boundary strengthens the piece. 'Don't be a wimp.'"
  informs: []
  reason_not_operational: "Stated as an aside about a single redesign, with no general principle given."
  source_ref: {chapter: 2, section: "newsletter flag demonstration", page_start: 19}

- concept: straight_corners_read_stronger_than_rounded
  statement: "Changing rounded corners to straight gave the piece a cleaner, stronger look."
  informs: []
  reason_not_operational: "Single-instance aesthetic claim, no mechanism or scope stated."
  source_ref: {chapter: 2, section: "newsletter flag demonstration", page_start: 19}

- concept: reversed_type_needs_a_robust_face
  statement: "Small type dropping out of a dark background needs a face that will not fall apart when printed."
  informs: []
  reason_not_operational: >
    A render-method-dependent production constraint. Would belong to Production IR, which
    does not exist yet. Notable as the first extracted item that clearly lands outside the
    Creative IR by design rather than by omission.
  source_ref: {chapter: 2, section: "newsletter flag demonstration", page_start: 19}
