- atom_id: rw_009
  concept: clarity_outranks_thematic_expression
  informs: [creative.concept, creative.visual_language]
  role: [constrains, diagnoses]
  principle: >
    When expressing the subject thematically conflicts with communicating the information,
    clarity wins. A design need not enact its topic.
  mechanism: "Thematic treatment that degrades legibility costs the reader the message."
