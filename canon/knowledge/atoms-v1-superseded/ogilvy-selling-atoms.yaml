# Canon atoms — David Ogilvy, Ogilvy on Advertising (1983), ch.2
# "How to produce advertising that sells"
# Pass 1, source-only, extracted in isolation from all other sources.
source_manifest:
  source_id: ogilvy_on_advertising
  edition: "Vintage Books, 1985 (text 1983)"
  chapter: 2
  chapter_title: "How to produce advertising that sells"
  extraction: "EPUB OEBPS/Ogil_9780804170055_epub_c02_r1.htm, single column, clean"
  evidence_profile_warning: >
    IMPORTANT and different from the design sources in this batch. Ogilvy's support is
    practitioner assertion plus anecdote plus uncontrolled sales figures — "sales rose from
    10,000 to 40,000", "still running 25 years later". These are outcome claims without
    controls, not demonstrated mechanisms. The source is also explicit about its own register:
    "forgive me for oversimplifying... and for the dogmatism of my style."
    Most atoms below are therefore evidence_class: supported_extrapolation with confidence
    at or below 0.7, even where the claim is famous. Definitional atoms are the exception.
  figure_note: >
    Advertisements are reproduced as plates with captions. Captions extract; the ads themselves
    do not. No atom below depends on reading an ad.

atoms:

- atom_id: og_001
  concept: positioning_is_what_it_does_and_who_it_is_for
  informs: [intent.objective, audience.who, message.proposition]
  role: [fills, diagnoses]
  principle: >
    A product's position is defined by two things together: what the product does, and who it is
    for. The same product supports many positions — the source's soap could have been positioned
    as a detergent bar for men with dirty hands, and was instead positioned as a toilet bar for
    women with dry skin.
  mechanism: "Position is a choice among available markets and uses, not a property of the product."
  applicability:
    media: [static, video]
    when: "any commercial brief where the market or use is not already fixed"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Can you state what this product does and who it is for, in one sentence, without hedging?"
  failure_modes: []
  proposed_failure_modes: [position_unstated]
  repairs: []
  proposed_repairs: [state_position_explicitly]
  retrieval_keys: {ir_fields: [intent.objective, audience.who, message.proposition], media_types: [static, video], objective_classes: [any]}
  source_ref: {source_id: ogilvy_on_advertising, chapter: 2, section: Positioning, figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.85
  status: pending_vocabulary

- atom_id: og_002
  concept: proposition_grounded_in_specific_product_fact
  informs: [message.proposition, message.support]
  role: [fills, diagnoses, repairs]
  principle: >
    A selling proposition should come from a specific, concrete fact discovered about the product,
    not from a generic claim. The source's method is extended study of the product before any
    writing — the famous headline about the electric clock at sixty miles an hour was found by
    reading, not invented.
  mechanism: "A specific verifiable fact is both more credible and more distinctive than a category claim."
  applicability:
    media: [static, video]
    when: "the proposition is being chosen"
    exceptions: ["the source concedes that with genuine parity products no differentiating fact may exist — see og_006"]
    exceptions_status: source_supported
  diagnostic: "Is the proposition traceable to a specific fact about this product, or is it a category generality?"
  failure_modes: []
  proposed_failure_modes: [generic_claim_without_product_fact]
  repairs: []
  proposed_repairs: [ground_proposition_in_product_fact]
  retrieval_keys: {ir_fields: [message.proposition], media_types: [static, video], objective_classes: [any]}
  source_ref: {source_id: ogilvy_on_advertising, chapter: 2, section: "Do your homework", figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: supported_extrapolation
  confidence: 0.7
  status: pending_vocabulary

- atom_id: og_003
  concept: audience_language_precedes_copy
  informs: [audience.who, audience.context, message.proposition]
  role: [fills, diagnoses]
  principle: >
    Before writing, establish how the audience thinks about this kind of product, what language
    they use when discussing it, which attributes matter to them, and what promise would most
    likely make them buy.
  mechanism: "Not stated. Asserted as method."
  applicability:
    media: [static, video]
    when: "audience is unspecified or assumed"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Is the copy in the audience's vocabulary or the advertiser's?"
  failure_modes: []
