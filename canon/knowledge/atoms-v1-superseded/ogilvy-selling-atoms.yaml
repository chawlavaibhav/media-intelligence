- atom_id: og_008
  concept: multiple_objectives_achieve_nothing
  informs: [intent.objective, message.proposition]
  role: [constrains, diagnoses, repairs]
  principle: >
    Campaigns that reflect a long list of objectives, reconciling the divergent views of many
    stakeholders, achieve nothing by attempting to cover too many things. The source's phrase is
    that such work "looks like the minutes of a committee."
  mechanism: "Attention and memory are limited; every added objective reduces the delivery of the others."
  applicability:
    media: [static, video]
    when: "the brief carries more than one objective or proposition"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "How many objectives does this brief carry, and how many propositions does the asset attempt?"
  failure_modes: []
  proposed_failure_modes: [objective_overload]
  repairs: []
  proposed_repairs: [reduce_to_single_objective]
  retrieval_keys: {ir_fields: [intent.objective, message.proposition], media_types: [static, video], objective_classes: [any]}
