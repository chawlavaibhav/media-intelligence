- atom_id: og_007
  concept: make_the_product_the_hero
  informs: [entities, creative.hierarchy]
  role: [fills, diagnoses, repairs]
  principle: >
    Wherever possible the product itself should be the hero of the advertisement. The source
    rejects the premise that some products are too dull — "there are no dull products, only dull
    writers" — and notes that showing the product with utter simplicity is often the best idea
    and takes courage, because it invites the accusation of not being creative.
  mechanism: "Not stated."
  applicability:
    media: [static, video]
    when: "assigning entity roles and hierarchy rank"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Is the product the hero entity, and does the hierarchy rank it accordingly?"
  failure_modes: []
  proposed_failure_modes: [product_not_hero]
  repairs: []
  proposed_repairs: [promote_product_to_hero]
  retrieval_keys: {ir_fields: [entities, creative.hierarchy], media_types: [static, video], objective_classes: [any]}
  source_ref: {source_id: ogilvy_on_advertising, chapter: 2, section: "Make the product the hero", figure_refs: [], visual_context_required: false}
