- atom_id: og_004
  concept: every_asset_contributes_to_one_brand_image
  informs: [brand.palette, brand.type, creative.visual_language, intent.objective]
  role: [constrains, diagnoses, repairs]
  principle: >
    A brand has a personality assembled from its name, packaging, price, the style of its
    advertising and the product itself. Every individual advertisement is a contribution to that
    personality, so advertising should project the same image consistently, year after year.
  mechanism: "Image accumulates across exposures; inconsistent exposures accumulate into nothing."
  applicability:
    media: [static, video]
    when: "a brand has any prior body of work"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Would this asset be recognised as belonging to the same brand as last year's?"
  failure_modes: []
  proposed_failure_modes: [inconsistent_brand_image]
  repairs: []
  proposed_repairs: [align_to_established_brand_image]
  retrieval_keys: {ir_fields: [brand, creative.visual_language], media_types: [static, video], objective_classes: [any]}
  source_ref: {source_id: ogilvy_on_advertising, chapter: 2, section: "Brand image", figure_refs: [], visual_context_required: false}
