human_notes:

- concept: advertising_can_reduce_sales
  statement: "The source cites cases where advertised groups bought less than unadvertised groups, and argues the difference between one advertisement and another can be very large."
  informs: []
  reason_not_operational: "A commercial-outcome claim about the category, with no IR field to fill. Motivates the enterprise; does not guide a decision."
  source_ref: {chapter: 2, section: opening}

- concept: big_ideas_come_from_the_informed_unconscious
  statement: "Stuff the conscious mind with information, then unhook rational thought — walk, bathe, drink half a pint of claret."
  informs: []
  reason_not_operational: "Advice on a human creative process. No property of the output and no consumer."
  source_ref: {chapter: 2, section: "What's the big idea?"}

- concept: repeat_winners_moving_parade
  statement: "Repeat a good advertisement until it stops selling; you advertise to a moving parade, not a standing army."
  informs: []
  reason_not_operational: "Media scheduling across a campaign. SPEC-01 v0.1 explicitly excludes multi-asset campaign scope."
  source_ref: {chapter: 2, section: "Repeat your winners"}

- concept: committees_cannot_create
  statement: "Committees can criticise but cannot create; agency campaigns average 117 days of gestation."
  informs: []
  reason_not_operational: "Organisational critique. Notable only as an argument for automating the specification step."
  source_ref: {chapter: 2, section: "Down with committees"}

- concept: style_as_added_value_for_parity_products
  statement: "Where products are undifferentiated, the style of the advertising is itself the differentiation — the 'added value' advertising contributes."
  informs: []
  reason_not_operational: >
    Borderline. Arguably informs creative.visual_language and overlaps og_005 and og_006.
    Held out because as stated it is an economic argument about what advertising does, not a
    rule for what any given asset should be. Flagged for review — this one may deserve promotion.
  source_ref: {chapter: 2, section: "Make the product the hero"}
