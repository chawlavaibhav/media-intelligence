- atom_id: og_005
  concept: production_quality_register_transfers_to_product
  informs: [creative.visual_language]
  role: [constrains, diagnoses, repairs]
  principle: >
    Cheap or shoddy-looking advertising transfers its quality to the product. This matters most
    for products whose brand is visible to other people — the source's examples are beer,
    cigarettes and cars, "products you wear."
  mechanism: "The advertisement is treated as evidence about the product's quality."
  applicability:
    media: [static, video]
    when: "the product is consumed or displayed publicly"
    exceptions: ["the source scopes the strongest form of the claim to publicly visible products"]
    exceptions_status: source_supported
  diagnostic: "Does the execution's quality register match the price and positioning claimed?"
  failure_modes: []
  proposed_failure_modes: [image_quality_mismatch]
  repairs: []
  proposed_repairs: [raise_production_quality_register]
  retrieval_keys: {ir_fields: [creative.visual_language], media_types: [static, video], objective_classes: [any]}
  source_ref: {source_id: ogilvy_on_advertising, chapter: 2, section: "Brand image", figure_refs: [], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
