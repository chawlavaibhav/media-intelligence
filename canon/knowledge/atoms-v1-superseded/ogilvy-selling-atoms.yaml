- atom_id: og_009
  concept: big_idea_five_question_test
  informs: [creative.concept]
  role: [diagnoses]
  principle: >
    A concept can be tested against five questions: did it make you gasp on first sight; do you
    wish you had thought of it; is it unique; does it fit the strategy to perfection; could it be
    used for thirty years?
  mechanism: "Not stated. Offered as a heuristic checklist."
  applicability:
    media: [static, video]
    when: "a creative concept has been proposed and must be judged"
    exceptions: ["the source concedes recognising a good idea is 'horribly difficult' and that research cannot predict an idea's cumulative value"]
    exceptions_status: source_supported
  diagnostic: "Run the five questions against the proposed concept."
  failure_modes: []
  proposed_failure_modes: []
  repairs: []
  proposed_repairs: []
