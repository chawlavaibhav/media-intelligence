- atom_id: og_006
  concept: positively_good_beats_comparative_superiority
  informs: [message.proposition]
  role: [fills, repairs]
  principle: >
    Where competing products are genuinely equivalent, do not claim superiority. It is enough to
    convince the audience that this product is positively good — a buyer certain about yours and
    uncertain about the competitor's will choose yours.
  mechanism: "Certainty about one option beats an unverifiable comparison between two."
  applicability:
    media: [static, video]
    when: "the product has no defensible functional advantage over competitors"
    exceptions: ["does not apply where a genuine differentiating fact exists — see og_002"]
    exceptions_status: source_supported
  diagnostic: "Is the proposition comparative, and is the comparison actually defensible?"
  failure_modes: []
  proposed_failure_modes: [superiority_claim_on_parity_product]
  repairs: []
  proposed_repairs: [restate_as_positive_claim]
  retrieval_keys: {ir_fields: [message.proposition], media_types: [static, video], objective_classes: [any]}
  source_ref: {source_id: ogilvy_on_advertising, chapter: 2, section: "'The positively good'", figure_refs: [], visual_context_required: false}
