- atom_id: gos_006
  concept: thirty_degree_rule
  informs: [video.temporal_structure, video.continuity_requirements]
  role: [constrains, diagnoses, repairs]
  principle: >
    Between two shots of the same subject, move the camera at least 30 degrees around the arc,
    and change focal length. Below that the perspective is not "different enough" and the cut
    reads as a jump in space or time rather than as new information.
  mechanism: "Every cut is expected to deliver new information; too small a change delivers none and reads as an error."
  applicability:
    media: [video]
    when: "cutting between two shots of the same subject"
    exceptions: ["source-level: creative motivation overrides convention (p105)"]
    exceptions_status: source_supported
  diagnostic: "How far apart in angle and focal length are consecutive shots of the same subject?"
  failure_modes: []
  proposed_failure_modes: [jump_cut]
  repairs: []
  proposed_repairs: [increase_angle_change, change_focal_length]
  retrieval_keys: {ir_fields: [video.temporal_structure], media_types: [video], objective_classes: [any]}
  source_ref: {source_id: grammar_of_the_shot, chapter: 4, section: "The 30 Degree Rule", page_start: 106, page_end: 107, figure_refs: [fig_4_14, fig_4_15], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.9
  status: pending_vocabulary

- atom_id: gos_007
  concept: reciprocating_imagery
  informs: [video.continuity_requirements, video.temporal_structure]
  role: [constrains, diagnoses, repairs]
  principle: >
    Shots covering different characters in one scene must match each other — subject size,
    subject placement, camera height, lens angle and angle on action. A medium close-up of one
    character paired with a big close-up of the other is a mismatch.
  mechanism: "Unmatched reciprocal framing is read as a break in the scene's consistency, often below conscious notice."
  applicability:
    media: [video]
    when: "two or more characters are covered in single or over-the-shoulder shots"
    exceptions: ["source-level: creative motivation overrides convention (p105)", "allowances for actual subject size, hairstyle or accessories"]
    exceptions_status: source_supported
  diagnostic: "Do the reciprocal shots match on size, placement, height, lens angle and angle on action?"
  failure_modes: []
  proposed_failure_modes: [mismatched_reciprocal_framing]
  repairs: []
  proposed_repairs: [match_reciprocal_framing]
  retrieval_keys: {ir_fields: [video.continuity_requirements], media_types: [video], objective_classes: [any]}
  source_ref: {source_id: grammar_of_the_shot, chapter: 4, section: "Reciprocating Imagery", page_start: 108, page_end: 110, figure_refs: [fig_4_16, fig_4_17, fig_4_18, fig_4_19, fig_4_20], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.9
