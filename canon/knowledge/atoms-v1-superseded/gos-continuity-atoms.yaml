- atom_id: gos_008
  concept: outside_in_shot_progression
  informs: [video.temporal_structure, video.temporal_hierarchy]
  role: [fills]
  principle: >
    Conventionally a scene progresses from outside in — opening wider to establish environment
    and characters, then cutting tighter as the action develops to deliver intimacy and detail.
  mechanism: "Establishing context first lets later close framing be read as detail rather than disorientation."
  applicability:
    media: [video]
    when: "structuring the shot order within a scene"
    exceptions: ["described by the source as tradition rather than rule"]
    exceptions_status: source_supported
  diagnostic: "Does shot size tighten as the scene progresses, and is context established before detail?"
  failure_modes: []
  proposed_failure_modes: []
  repairs: []
  proposed_repairs: []
  retrieval_keys: {ir_fields: [video.temporal_structure, video.temporal_hierarchy], media_types: [video], objective_classes: [any]}
