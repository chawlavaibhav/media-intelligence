- concept: shoot_coverage_to_give_the_editor_choices
  statement: "Record the action from several angles and framings so the editor can decide later when to cut and what to show."
  informs: []
  reason_not_operational: >
    A production strategy about generating options for a downstream chooser. In this
    architecture that is a Production IR decision (how many variants to generate), not a
    property of the intended outcome. Notable as a second clear Production IR candidate.
  source_ref: {chapter: 4, section: Continuity, page_start: 96}

