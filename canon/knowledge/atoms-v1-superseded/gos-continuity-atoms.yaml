- atom_id: gos_005
  concept: line_violation_is_invisible_until_assembly
  informs: [video.continuity_requirements]
  role: [diagnoses]
  principle: >
    A crossed action line is not detectable in any single shot. The error appears only once the
    shots are cut together, when both characters appear to look the same way instead of at
    each other.
  mechanism: "The fault is a relation between shots, not a property of any one of them."
  applicability:
    media: [video]
    when: "evaluating coverage before assembly"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Evaluate screen direction across the assembled sequence, never shot by shot."
  failure_modes: []
  proposed_failure_modes: [crossed_action_line]
  repairs: []
  proposed_repairs: [reframe_within_180_arc]
  retrieval_keys: {ir_fields: [video.continuity_requirements], media_types: [video], objective_classes: [any]}
  source_ref: {source_id: grammar_of_the_shot, chapter: 4, section: "Jumping the Line", page_start: 104, page_end: 105, figure_refs: [fig_4_13], visual_context_required: false}
  source_support: text
