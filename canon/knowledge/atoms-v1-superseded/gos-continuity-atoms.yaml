- atom_id: gos_010
  concept: continuity_of_action_across_takes
  informs: [video.continuity_requirements]
  role: [constrains, diagnoses]
  principle: >
    Movement, action and dialogue must be repeated consistently from one camera setup to the
    next, so that material recorded across hours or weeks reads as one continuous moment.
  mechanism: "The audience assumes a single continuous event; inconsistency between setups contradicts that assumption."
  applicability:
    media: [video]
    when: "one action is covered from more than one setup"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Does the same action occur identically in every shot that covers it?"
  failure_modes: []
  proposed_failure_modes: [continuity_of_action_break]
  repairs: []
  proposed_repairs: [reshoot_matching_action]
  retrieval_keys: {ir_fields: [video.continuity_requirements], media_types: [video], objective_classes: [any]}
