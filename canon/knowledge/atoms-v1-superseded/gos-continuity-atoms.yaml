- atom_id: gos_009
  concept: eyeline_match_setup_and_payoff
  informs: [video.temporal_structure, video.continuity_requirements, relationships]
  role: [fills, constrains, diagnoses, repairs]
  principle: >
    When a character looks off-frame, the audience traces the line and expects the next shot to
    reveal what they are looking at — framed from a corresponding direction, angle and height.
    The first shot sets up an expectation; the second must pay it off.
  mechanism: "An established sight line creates an unfulfilled expectation the audience holds across the cut."
  applicability:
    media: [video]
    when: "a subject's attention is directed outside the frame"
    exceptions: ["need not be a strict subjective POV shot, only a corresponding vantage point"]
    exceptions_status: source_supported
  diagnostic: "For each off-frame look, is there a following shot revealing the object from a corresponding vantage?"
  failure_modes: []
  proposed_failure_modes: [unresolved_eyeline]
  repairs: []
  proposed_repairs: [add_payoff_shot, match_payoff_vantage]
  retrieval_keys: {ir_fields: [video.temporal_structure, relationships], media_types: [video], objective_classes: [any]}
  source_ref: {source_id: grammar_of_the_shot, chapter: 4, section: "Eye-Line Match", page_start: 111, page_end: 112, figure_refs: [fig_4_21], visual_context_required: false}
  source_support: text
