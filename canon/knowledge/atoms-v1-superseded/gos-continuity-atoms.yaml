# Canon atoms — Thompson & Bowen, Grammar of the Shot, 2nd ed. (2009), ch.4
# "Putting Your Shots Together: Prethinking the Editing Process"
# Pass 1, source-only, extracted in isolation from all other sources.
source_manifest:
  source_id: grammar_of_the_shot
  edition: "Focal Press, 2nd ed., 2009"
  chapter: 4
  chapter_title: "Putting Your Shots Together: Prethinking the Editing Process"
  book_pages: 93-112
  pdf_pages_extracted: 106-125
  structure_note: >
    Chapter ends with an eight-point numbered review authored by the source, which functions
    as a compact restatement of its own principles. Diagrams (4.1-4.21) are overhead geometry
    plus paired shot examples.
  global_exception_note: >
    The chapter states explicitly (book p105): "there are very few absolutes when it comes to
    the guidelines and 'rules' presented in this text. Remember, if you have creative reasons
    to execute a certain shot or group of shots a certain way, then do it, even if it flies in
    the face of convention." This is a source-level exception clause and is why most atoms
    below carry exceptions_status: source_supported.
  figure_note: >
    Text extraction preserves figure captions and the prose is self-contained — the 180-degree
    geometry is described in words as well as drawn. Figures were not rendered; no atom depends
    solely on a diagram.

atoms:

- atom_id: gos_001
  concept: frame_edges_are_directional_references
  informs: [video.continuity_requirements, static.composition]
  role: [fills]
  principle: >
    The four edges of the frame become the audience's references of direction. A subject exits
    frame left, a character looks off frame right — viewers map the film world's geography onto
    those edges and assume a world continuing beyond them.
  mechanism: "The frame is the audience's only window onto the film space, so its edges stand in for real directions."
  applicability:
    media: [video]
    when: "any shot that will be cut with another"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Which frame edge does each subject's motion or attention address?"
  failure_modes: []
  proposed_failure_modes: []
  repairs: []
  proposed_repairs: []
  retrieval_keys: {ir_fields: [video.continuity_requirements], media_types: [video], objective_classes: [any]}
  source_ref: {source_id: grammar_of_the_shot, chapter: 4, section: "Continuity of Screen Direction", page_start: 97, page_end: 98, figure_refs: [fig_4_2], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.9
  status: operational

- atom_id: gos_002
  concept: continuity_of_screen_direction
  informs: [video.continuity_requirements, video.temporal_structure]
  role: [constrains, diagnoses, repairs]
  principle: >
    Left-right movement must be maintained across a cut. A subject exiting frame left must
    enter the next shot from frame right to continue travelling leftward in the film's space.
  mechanism: "The audience continues the motion vector across the cut unless shown a change."
  applicability:
    media: [video]
    when: "a moving subject continues across a cut"
    exceptions: ["source-level: creative motivation overrides convention (p105)"]
    exceptions_status: source_supported
  diagnostic: "Does the subject's direction of travel read as continuous across the cut?"
  failure_modes: []
  proposed_failure_modes: [reversed_screen_direction]
  repairs: []
  proposed_repairs: [restore_screen_direction]
  retrieval_keys: {ir_fields: [video.continuity_requirements], media_types: [video], objective_classes: [any]}
  source_ref: {source_id: grammar_of_the_shot, chapter: 4, section: "Continuity of Screen Direction", page_start: 97, page_end: 99, figure_refs: [fig_4_3, fig_4_4, fig_4_5], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
  confidence: 0.95
  status: pending_vocabulary

- atom_id: gos_003
  concept: lines_of_attention_establish_spatial_relations
  informs: [relationships, video.continuity_requirements]
  role: [fills, diagnoses]
  principle: >
    Each subject's attention to another subject or object creates a sight line. The audience
    actively traces these lines and uses them to establish who is related to what, and where
    things sit relative to each other in space.
  mechanism: "Attention is read as a directed connection, which the viewer converts into spatial layout."
  applicability:
    media: [video, static]
    when: "a frame contains a subject attending to something"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "What is each subject looking at, and does the resulting set of connections match the intended relationships?"
  failure_modes: []
  proposed_failure_modes: [contradictory_sight_lines]
  repairs: []
  proposed_repairs: [redirect_subject_attention]
  retrieval_keys: {ir_fields: [relationships, video.continuity_requirements], media_types: [video, static], objective_classes: [any]}
  source_ref: {source_id: grammar_of_the_shot, chapter: 4, section: "The Line—Basis for Screen Direction", page_start: 100, page_end: 101, figure_refs: [fig_4_6, fig_4_7, fig_4_8], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
