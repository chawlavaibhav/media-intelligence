- atom_id: gos_004
  concept: axis_of_action_180_degree_rule
  informs: [video.continuity_requirements]
  role: [constrains, diagnoses, repairs]
  principle: >
    The first shot establishes an imaginary line through the action, traced along the talent's
    sight line. All subsequent camera positions must stay within the 180-degree arc on one side
    of that line, or established left and right invert.
  mechanism: "The line fixes the mapping between film-world geography and frame edges; crossing it re-maps them."
  applicability:
    media: [video]
    when: "a scene is covered from more than one camera position"
    exceptions: ["source-level: creative motivation overrides convention (p105)", "the source notes crossing is legitimate when the subjects face opposite directions along the axis, e.g. two people dancing cheek to cheek"]
    exceptions_status: source_supported
  diagnostic: "Do all setups in this scene sit on the same side of the established axis?"
  failure_modes: []
  proposed_failure_modes: [crossed_action_line]
  repairs: []
  proposed_repairs: [reframe_within_180_arc]
  retrieval_keys: {ir_fields: [video.continuity_requirements], media_types: [video], objective_classes: [any]}
  source_ref: {source_id: grammar_of_the_shot, chapter: 4, section: "The Imaginary Line—The 180 Degree Rule", page_start: 102, page_end: 105, figure_refs: [fig_4_9, fig_4_10, fig_4_11, fig_4_12, fig_4_13], visual_context_required: false}
  source_support: text
  knowledge_type: source_principle
  evidence_class: established
