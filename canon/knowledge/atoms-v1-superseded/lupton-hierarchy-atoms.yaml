- atom_id: lu_005
  concept: inline_emphasis_needs_only_one_signal
  informs: [static.typography_layout, copy.body]
  role: [constrains, diagnoses, repairs]
  principle: >
    Emphasising a word or phrase within running text usually requires only one signal.
    Italic is the standard form; boldface, small caps, colour or a font change are alternatives.
  mechanism: "One shift is sufficient to break the pattern; further shifts add no information."
  applicability:
