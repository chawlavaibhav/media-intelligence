- atom_id: lu_002
  concept: hierarchy_supports_scanning_entry_and_exit
  informs: [creative.hierarchy]
  role: [fills, diagnoses]
  principle: >
    A visual hierarchy lets readers scan — knowing where to enter, where to exit, and how to
    pick and choose among the content's offerings rather than reading linearly.
  mechanism: "Ranked cues let the reader sample the content without processing all of it."
  applicability:
    media: [static]
    when: "the viewer is expected to scan rather than read continuously"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Can a scanning reader find an entry point, an exit point, and a way to choose between parts?"
  failure_modes: []
  proposed_failure_modes: [no_scan_entry_point]
  repairs: []
  proposed_repairs: [strengthen_level_contrast]
  retrieval_keys: {ir_fields: [creative.hierarchy], media_types: [static], objective_classes: [any]}
