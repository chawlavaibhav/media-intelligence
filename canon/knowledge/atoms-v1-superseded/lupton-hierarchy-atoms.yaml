  informs: [static.typography_layout]
  role: [fills, constrains]
  principle: >
    Some redundancy between cues is acceptable and even recommended — a paragraph traditionally
    carries both a line break and an indent, each signal backing up the other.
  mechanism: "Duplicated cues survive contexts where one of them is lost or weakened."
