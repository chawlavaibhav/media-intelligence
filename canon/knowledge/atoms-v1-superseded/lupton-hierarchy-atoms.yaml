- atom_id: lu_007
  concept: three_cue_ceiling_per_level
  informs: [static.typography_layout, creative.hierarchy]
  role: [constrains, diagnoses, repairs]
  principle: >
    Use no more than three cues to mark any one level or break. Beyond that the signals compete
    rather than reinforce — the source labels the overloaded case "too many signals."
  mechanism: "Redundant cues stop adding information and start reading as emphasis for its own sake."
  applicability:
    media: [static]
    when: "any hierarchy level is being marked"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Count the cues carrying each level. Is any above three?"
