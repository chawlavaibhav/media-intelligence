# Canon atoms — Ellen Lupton, Thinking with Type (2010), TEXT part, "Hierarchy"
# Pass 1, source-only, extracted in isolation from all other sources.
source_manifest:
  source_id: lupton_thinking_with_type
  edition: "Princeton Architectural Press, 2010 (2nd ed.)"
  part: TEXT
  section: Hierarchy
  book_pages: 131-133
  extraction: "EPUB index_split_001.html, chars 93052-97355"
  extraction_quality_warning: >
    CRITICAL. The source is set in two columns and the EPUB extraction INTERLEAVES them
    sentence by sentence. Example of raw output: "A typographic hierarchy expresses the
    organization Emphasizing a word or phrase within a body of of content, emphasizing some
    elements and text usually requires only one signal." Two independent sentences are woven
    together. Every atom below required de-interleaving by the extractor, which is an
    inference step, not a reading step. Confidence is capped at 0.8 throughout for this
    reason and all atoms should be checked against the printed page before promotion.
  figure_note: >
    The section's central demonstration is a four-column table showing one logical hierarchy
    (angels / clergy / parts of a text) rendered four different ways. The table survives
    extraction structurally but its typographic distinctions — which are the entire point —
    do not. Treated as text-only evidence.

atoms:

- atom_id: lu_001
  concept: hierarchy_expresses_content_organisation
  informs: [creative.hierarchy]
  role: [fills, diagnoses]
  principle: >
    A hierarchy is the visual expression of the organisation of the content — emphasising some
    elements and subordinating others. It is relational: a level exists only relative to others.
  mechanism: "Rank is perceived comparatively, so no element carries a hierarchy level in isolation."
  applicability:
    media: [static]
    when: "content has more than one level of importance"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Does the visual ranking match the content's actual organisation?"
  failure_modes: []
  proposed_failure_modes: [hierarchy_contradicts_content_structure]
  repairs: []
  proposed_repairs: [restate_level_cues]
  retrieval_keys: {ir_fields: [creative.hierarchy], media_types: [static], objective_classes: [any]}
  source_ref: {source_id: lupton_thinking_with_type, section: Hierarchy, page_start: 131, page_end: 131, figure_refs: [], visual_context_required: false}
