- atom_id: lu_003
  concept: level_cues_must_be_applied_consistently
  informs: [static.typography_layout, creative.hierarchy]
  role: [constrains, diagnoses, repairs]
  principle: >
    Each level of a hierarchy is signalled by one or more cues, and those cues must be applied
    consistently across the whole body of content.
  mechanism: "Inconsistent cueing breaks the mapping between visual treatment and rank."
  applicability:
    media: [static]
    when: "a hierarchy level recurs more than once"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Is every instance of a given level treated identically?"
  failure_modes: []
  proposed_failure_modes: [inconsistent_level_cueing]
  repairs: []
