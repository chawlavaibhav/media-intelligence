- atom_id: lsm_005
  concept: source_size_governs_shadow_and_highlight_extent
  informs: [creative.visual_language]
  role: [fills, diagnoses]
  principle: >
    A small source produces hard shadows and a small highlight on a glossy surface. A large
    source produces soft shadows and a highlight that can cover the whole surface. Both are
    readable from the image itself — hard shadows and a small reflection are evidence that the
    source was small.
  mechanism: "The reflected image of the source is the source; its size in the image is its angular size."
  applicability:
    media: [static, video]
    when: "specifying a lighting register"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "Do shadow hardness and highlight extent agree with each other about the source size?"
  failure_modes: []
  proposed_failure_modes: [inconsistent_lighting_evidence]
  repairs: []
  proposed_repairs: [respecify_source_size]
