atoms:

- atom_id: lsm_001
  concept: surface_identity_is_a_reflection_mixture
  informs: [entities, creative.visual_language]
  role: [fills, diagnoses]
  principle: >
    Light reflects as diffuse reflection, direct reflection, or polarised direct reflection, and
    most surfaces produce some of each. It is the proportion of the three in the mix that makes
    one surface look different from another. Three objects of identical colour and identical
    absorption — paper, pewter, glazed ceramic — are instantly distinguishable by that mixture
    alone.
  mechanism: "Transmission and absorption being equal, only the reflection distribution differs, and the eye reads that distribution as material."
  applicability:
    media: [static, video]
    when: "a material must read as the material it is"
    exceptions: ["the source notes no real surface produces a perfect example of any single type"]
    exceptions_status: source_supported
  diagnostic: "Does the surface's reflection mixture read as the intended material?"
  failure_modes: []
  proposed_failure_modes: [material_reads_as_wrong_substance]
  repairs: []
  proposed_repairs: []
