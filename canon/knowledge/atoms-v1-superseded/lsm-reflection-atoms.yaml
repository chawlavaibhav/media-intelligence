- atom_id: lsm_006
  concept: glare_is_strongest_on_dark_and_transparent_subjects
  informs: [entities, creative.visual_language]
  role: [fills, diagnoses]
  principle: >
    Polarised direct reflection — glare — is always dimmer than ordinary direct reflection, but
    is most visible on black or transparent subjects. Lakes, painted metal, glossy wood and
    plastic all produce it; even matte surfaces produce some.
  mechanism: "Dark and transparent subjects return little competing diffuse reflection, so the dimmer polarised component dominates."
  applicability:
    media: [static, video]
    when: "the subject is dark, glossy, or transparent"
    exceptions: ["polarisation is never perfect; some diffuse and un-polarised direct reflection is always mixed in"]
    exceptions_status: source_supported
