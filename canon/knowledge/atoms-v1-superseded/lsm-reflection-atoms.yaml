human_notes:

- concept: the_family_of_angles
  statement: >
    Every point on a surface is seen at a slightly different angle; together those angles form
    the family of angles that produces direct reflection. A source inside it produces a direct
    reflection; a source outside it does not light a mirror-like subject at all as far as the
    camera is concerned. A source large enough to fill the family covers the whole surface.
  informs: []
  reason_not_operational: >
    The book's central concept, and it is a rule for WHERE TO PUT A LIGHT. It has no Creative IR
    consumer — it is Production IR, and specifically Production IR for a physical camera. Its
    generative-media equivalent, if one exists, would be a Pass 2 hypothesis.
  source_ref: {chapter: 3, section: "The Family of Angles"}

- concept: direct_reflection_brightness_ignores_distance
  statement: "The brightness of a direct reflection is independent of source distance; moving the source closer changes the reflection's size, not its brightness, preserving the inverse square law."
  informs: []
  reason_not_operational: "Physical mechanism. Explains a behaviour rather than specifying an outcome."
  source_ref: {chapter: 3, section: "Breaking the Inverse Square Law?"}

- concept: lighting_is_reflection_management
  statement: "Photographic lighting is primarily an exercise in reflection management; understanding and managing reflection for the result you want is what constitutes good lighting."
  informs: []
  reason_not_operational: "Framing statement for the book. True and useful to a human; no field to fill."
  source_ref: {chapter: 3, section: opening}

- concept: source_refuses_an_ambiguous_term
  statement: >
    The source explicitly declines to use the word "specular" anywhere in the book, because
    practitioners use it to mean at least three different things — direct reflection, small
    bright highlights within a larger one, and highlights from a small source — and because
    "specular light" has drifted to mean hard light, which is a property of the source rather
    than of the reflection.
  informs: []
  reason_not_operational: >
    Not creative knowledge at all. It is a worked example of controlled-vocabulary governance:
    a technical field identifying a near-synonym with divergent meanings and resolving it by
    refusing the term and naming the two concepts separately. Directly relevant to the Canon's
    own registry problem. Flagged prominently.
  source_ref: {chapter: 3, section: "Specular Reflection and Specular Light"}
