- atom_id: lsm_004
  concept: material_class_determines_allowed_viewing_angle_variation
  informs: [entities]
  role: [fills, constrains]
  principle: >
    Whether a subject's appearance may vary with viewing angle is a property of its surface, not
    a free choice. A matte subject holds its appearance across angles; a polished one does not,
    and will read bright from one angle and dark from another.
  mechanism: "Follows directly from the viewpoint independence of diffuse reflection and the viewpoint dependence of direct reflection."
  applicability:
