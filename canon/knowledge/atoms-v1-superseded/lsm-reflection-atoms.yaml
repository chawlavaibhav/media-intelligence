- atom_id: lsm_002
  concept: diffuse_reflection_is_viewpoint_independent
  informs: [entities, creative.visual_language]
  role: [fills, constrains]
  principle: >
    Diffuse reflection is the same brightness from every viewing angle, because the surface
    scatters light equally in all directions. Neither the angle of the source nor the angle of
    view changes it. Matte and white surfaces approximate this.
  mechanism: "Equal scattering in all directions makes recorded brightness independent of viewpoint."
  applicability:
    media: [static, video]
    when: "a matte subject will be seen from more than one angle"
    exceptions: ["distance from source to subject does still change brightness"]
    exceptions_status: source_supported
  diagnostic: "Does this surface hold the same brightness across the angles it will be seen from?"
  failure_modes: []
  proposed_failure_modes: []
