- atom_id: lsm_003
  concept: direct_reflection_is_viewpoint_dependent
  informs: [entities, creative.visual_language]
  role: [fills, constrains, diagnoses]
  principle: >
    Direct reflection is a mirror image of the light source and is visible from exactly one
    angle — the angle of incidence equals the angle of reflectance. From every other viewpoint
    the same polished surface reads dark. Polished metal, glass and water approximate this.
  mechanism: "Smooth surfaces reflect rays at the incident angle, so only one viewpoint intercepts them."
  applicability:
    media: [static, video]
    when: "a polished or glossy subject appears, especially if the viewpoint moves"
    exceptions: []
    exceptions_status: not_identified
  diagnostic: "For a glossy subject seen from several angles, does its appearance change as it should?"
  failure_modes: []
  proposed_failure_modes: [glossy_surface_reads_flat]
