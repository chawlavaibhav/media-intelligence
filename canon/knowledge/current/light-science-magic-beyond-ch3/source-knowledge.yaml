- sk_id: sk_lsmx_0030
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - If we light the subject with every point on the surface except the marked family of angles, we will
    have a large, soft source that still keeps the metal black.
  - The gobo would behave more like a reflector than a light-blocking device, even though it might be
    black.
  concept_label: a_gobo_shaped_to_the_family_keeps_metal_black_under_an_otherwise_large_soft_light
  label_origin: extractor_assigned
  claim: 'Simply putting the light near the camera keeps metal dark but gives shadows whose position does
    nothing to delineate the shape. A better arrangement uses the marked family directly: illuminate a
    large diffusion sheet evenly, then attach a gobo cut to barely fill the family of angles. Every point
    of the sheet except the family lights the scene, so the light is large and soft while the metal stays
    black. The source adds a boundary condition: the technique works with a diffusion sheet or a soft
    box but not with an opaque white reflector card, because the light that illuminates the card also
    illuminates the gobo, which then behaves more like a reflector than a blocker even if it is black
    — though it concedes that hybrid may be the most pleasing compromise of all.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The metal can only see what lies inside its family of angles, so subtracting exactly that region
      from a large source removes the metal''s illumination while leaving the rest of the scene lit by
      the remainder of the source.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - metal_surfaces
    conditions: polished metal to be rendered dark under soft general lighting
  caveats:
