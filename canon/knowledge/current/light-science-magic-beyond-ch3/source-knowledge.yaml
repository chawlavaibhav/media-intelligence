- sk_id: sk_lsmx_0015
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - 'perspective distortion : some edges of the cube seem to be longer than others'
  - 'there is a second clue that our brain uses to perceive depth: tonal variation'
  - these visual clues are so powerful that the brain perceives depth that does not and never did exist
  concept_label: depth_in_a_flat_image_rests_on_two_clues_perspective_distortion_and_tonal_variation
  label_origin: extractor_assigned
  claim: 'A photograph is as two-dimensional as a drawing, and the depth a viewer perceives in it is manufactured
    by two visual clues: perspective distortion, in which edges that are equal appear unequal and right
    angles appear not to be right angles, and tonal variation, the presence of both light and dark areas.
    The source demonstrates with a line drawing of a cube that lacks both clues and is not reliably read
    as a cube at all, and one with both clues that is. Lighting affects both: obviously through highlight
    and shadow, less obviously through the coupling described separately.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The brain infers depth from convergence of known-parallel lines and from the tonal difference
      between differently oriented faces. Neither depends on the subject actually having depth, which
      is why the clues work on ink and on paper.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - composition
    conditions: any two-dimensional representation of a three-dimensional subject
  caveats:
