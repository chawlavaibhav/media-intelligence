- sk_id: sk_lsmx_0005
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Because we want only diffuse reflection, we place the light anywhere outside the family of angles.
  - Placing the light inside the family of angles caused an unacceptable hot spot on the image.
  concept_label: copy_work_wants_diffuse_reflection_only_so_the_light_goes_outside_the_family
  label_origin: extractor_assigned
  claim: 'Copy work — photographing a painting, an illustration or an old photograph — is the case where
    only diffuse reflection is wanted, because the job is to record the colours and values of the original
    and not the surface it sits on. Since a light at any angle can produce diffuse reflection but only
    a light inside the family of angles can produce direct reflection, the light goes anywhere outside
    the family. A light placed inside it puts a hot spot on the artwork.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Diffuse reflection is available from any lighting angle and direct reflection only from inside
      the family, so excluding the family removes one type without costing the other.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - copy_work
    conditions: flat artwork being reproduced for its tone and colour
  caveats:
  - text: applies the live chapter-3 placement rule (sk_lsm_c003_0014) rather than restating it; the extraction
      here is the APPLICATION — which subjects want the light outside, and why
    origin: extractor_observed
  - text: the source calls this its first concrete demonstration of lighting technique and says it deliberately
      over-explains it, omitting comparable detail in later chapters
    origin: source_stated
  source_stated_problems:
  - an unacceptable hot spot on the painting's surface
  source_stated_remedies:
  - place the light anywhere outside the family of angles
  examples:
    positive:
    - description: 'folk painting lit from outside the family of angles: only diffuse reflection, tones
        close to the original'
      figure_ref: '4.2'
    counter:
    - description: 'the same folk painting with the light inside the family of angles: a large white hot
        spot obliterates the upper-right quarter of the artwork'
      figure_ref: '4.3'
