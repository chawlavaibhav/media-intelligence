- sk_id: sk_lsmx_0004
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Diffuse reflection gives us the information about how black or how white the subject is.
  - diffuse reflection does not tell us very much about what the surface material is
  - You could , however, tell the difference in material by the direct reflection.
  concept_label: diffuse_reflection_carries_tone_and_colour_direct_reflection_carries_material
  label_origin: extractor_assigned
  claim: 'The two reflection types carry different information about a subject. Diffuse reflection tells
    the viewer how black or how white the subject is, and because it can reflect frequencies selectively
    it carries most of the colour information. It says very little about what the material is: the source''s
    own test is that this page printed on smooth leather or glossy plastic instead of paper would produce
    about the same diffuse reflection. Material identity is carried by the direct reflection instead.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Diffuse reflection is a selective re-emission of frequencies by the body of the material, so
      it reports pigment; direct reflection is a mirror image formed at the surface, so it reports finish.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - surface_rendering
    conditions: any surface; the source's examples are printed paper, leather and glossy plastic
  caveats:
  - text: an information-carrying claim, not a physical one; it says what each reflection type TELLS a
      viewer, and the source offers it as the reason copy work wants diffuse reflection only
    origin: extractor_observed
  - text: depends on the live chapter-3 distinction between the reflection types (sk_lsm_c003_0002, sk_lsm_c003_0004,
      sk_lsm_c003_0010); what is new is the division of labour between them
    origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
