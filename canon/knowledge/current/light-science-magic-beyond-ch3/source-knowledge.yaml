- sk_id: sk_lsmx_0052
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Compression means that tones that were very different and easy to distinguish in the scene are now
    very similar and difficult to distinguish in the photograph.
  - Changing the general exposure decreases compression at one end of the grayscale, but it worsens the
    compression at the other extreme.
  - we cannot remedy the compression caused by overexposing the picture
  concept_label: tonal_compression_at_the_extremes_is_moved_by_exposure_and_not_recovered_afterwards
  label_origin: extractor_assigned
  claim: 'A recording medium does not respond linearly across its range: tones near both extremes are
    compressed, so distinctions that were easy to see in the scene become hard to see in the picture.
    Exposure moves the problem rather than removing it — more exposure relieves shadow compression and
    worsens highlight compression, less exposure does the reverse. Crucially, the compression is not recoverable
    after the fact. Darkening an overexposed frame restores the overall tonality without restoring distinction
    among the highlights; lightening an underexposed one does not bring back shadow detail, because the
    underexposure compressed those tones too much for them ever to be salvaged. The source''s practical
    use of this is that white-on-white and black-on-black scenes are recorded entirely on the parts of
    the curve that preserve the least detail, which is why they need lighting and exposure to be used
    together.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The characteristic curve is S-shaped, so equal exposure steps in the scene map to unequal brightness
      steps in the image, with the steps smallest at both ends. Information lost by mapping several scene
      tones onto one image tone cannot be recreated by rescaling the image.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - exposure
    conditions: any recording medium with an S-shaped response; the source discusses both film and digital
      sensors
  caveats:
  - text: 'partly technology-contingent: the source states that Raw straightens the curve and preserves
      the detail, that the straight result looks flat, and that photographers deliberately reintroduce
      the compression to make pictures look right. The grain discussion is about film specifically.'
    origin: source_stated
  - text: the claim that this preference is hardwired and will not change without hundreds of thousands
      of years of evolution is a strong psychological assertion offered without evidence; it is the source's
      own opinion about taste
    origin: extractor_observed
  - text: the histogram and curves material is about particular software of the edition's period and is
      historical rather than optical
    origin: extractor_observed
  source_stated_problems:
  - scenes get recorded on those portions of the characteristic curve that preserve the least detail
  source_stated_remedies: []
