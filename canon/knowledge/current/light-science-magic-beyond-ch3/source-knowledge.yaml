  concept_label: complex_surface_requires_both_reflection_types_in_different_parts_of_the_frame
  label_origin: source_verbatim
  claim: 'The source defines a complex surface as a single surface that needs both diffuse and direct
    reflection to be defined properly. Glossy wood is the given example: only direct reflection can say
    the wood is glossy, and only diffuse reflection can show the colour and grain beneath the gloss. The
    two cannot occupy the same area, so the surface is divided. The source lit a polished wooden box with
    a source large enough to fill the whole family of angles, then blocked part of it with a gobo, so
