- sk_id: sk_lsmx_0034
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Because the metal is a mirror, the camera is likely to reflect in the subject.
  - Although the camera is not visible in the subject, the hole in the light source is.
  - spending half a day lighting instead of spending half an hour at a computer makes absolutely no sense
  concept_label: photographing_metal_square_on_forces_a_choice_among_four_imperfect_remedies
  label_origin: extractor_assigned
  claim: 'A camera placed square on to flat metal reflects in it. The source gives four remedies and is
    explicit about what each costs. A view camera or perspective-control lens is the best: the camera
    sits off-centre, outside the family of angles, with its back parallel to the subject so no perspective
    distortion is introduced, and the lens is shifted to re-centre the image — though a large shift may
    vignette the corners or reveal lens distortion, both minimised by working farther away with a longer
    lens. Shooting through a hole cut in the light source removes the camera''s reflection but substitutes
    the hole''s, which only works where the subject is irregular enough to camouflage it. Shooting at
    an angle and correcting in post always costs some image quality and requires composing loose enough
    to crop the trapezoid. Retouching the reflection out is not a lighting solution at all, but for some
    subjects it is so much cheaper than the lighting solutions that the source says it should not be forgotten,
    and it loses no quality.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The camera lies inside the family of angles whenever it faces flat metal squarely; the remedies
      work either by moving the camera out of the family while keeping the image plane parallel, by concealing
      it inside the source, or by abandoning the geometric fix.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - metal_surfaces
    conditions: flat metal that must appear centred and undistorted
  caveats:
