- sk_id: sk_lsmx_0007
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - There is nothing magic about such an angle. It is a general rule that usually works—but not always.
  - Both of the lights shown are at 45 degrees to the center of the subject, but only one is satisfactory.
  concept_label: the_forty_five_degree_copy_rule_is_underspecified_because_it_omits_distance
  label_origin: extractor_assigned
  claim: 'The standard 45-degree copy lighting rule found in other texts is a general rule that usually
    works and sometimes does not, and the source names two things it leaves out. First, a usable lighting
    angle depends on camera-to-subject distance and the resulting focal length. Second, and more important,
    it depends on the distance from the light to the subject: two lights both at 45 degrees to the centre
    of the same subject can differ, because the nearer one falls inside the family of angles and the farther
    one does not. The source adds that the rule nonetheless often works in practice, because photographers
    move lights back anyway for a different reason — to get even illumination.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'An angle stated to the centre of a subject does not fix the angles to the subject''s edges.
      A near light at 45 degrees to the centre subtends the family of angles at some points of the surface;
      the same nominal angle from farther away does not.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - copy_work
    conditions: flat copy subjects lit by one or two lights at a nominal angle
  caveats:
  - text: the source is correcting a rule it attributes to other texts, and is careful to say the rule
      is not worthless — it usually works, and it explains WHY it usually works
    origin: source_stated
  - text: 'a rule-about-rules: the failure mode is that a heuristic stated as an angle silently depends
      on two distances'
    origin: extractor_observed
  source_stated_problems:
  - this rule may fail to produce good lighting if we do not give attention to the distance between the
    light and the subject
  source_stated_remedies:
  - get the lights far enough away from the subject surface that the 45-degree position falls outside
    the family of angles
  examples:
    positive: []
    counter:
    - description: two lights both at 45 degrees to the subject centre, one inside the family of angles
        and producing a hot spot, one outside it and lighting the surface cleanly
      figure_ref: '4.7'
  intra_source_relations:
