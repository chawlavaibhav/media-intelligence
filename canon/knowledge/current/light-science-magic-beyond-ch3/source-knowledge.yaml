- sk_id: sk_lsmx_0044
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - in this scene there is no such thing as 'correct' exposure. The only correct exposure is the one that
    we like.
  - pure direct reflections from a subject are as bright as the light source that produces them. Those
    reflections may be too small to read, but the large source is not.
  - Because perfect direct reflections rarely occur, try additional exposures with one, two, and then
    three stops more exposure.
  concept_label: the_two_glass_methods_are_metered_by_opposite_procedures
  label_origin: extractor_assigned
  claim: 'The two methods require different metering. In bright field the meter reads the background directly
    behind the subject, and the exposure decision is free: the indicated value gives a mid grey, up to
    two stops more gives near white, up to two stops less gives a very dark grey. Any tone but black works,
    because a black edge against a black ground leaves nothing to record, and the lighter the background
    the more graphically the glass is defined. A very light background has a further benefit — extraneous
    reflections in the front surface become too dim to see against it — while a medium or dark one lets
    surrounding objects reflect visibly. In dark field the edge highlights are too small for a normal
    meter, so the source substitutes a proxy: because a pure direct reflection is as bright as its source,
    meter the edge of the light source itself and open two stops to place it near white. That is only
    the starting point of a bracket, because a real reflection is never both perfect and un-polarized;
    the source prescribes trying one, two and three stops beyond it. Lightening the dark-field background
    by increasing exposure instead of adding a background light will usually overexpose the subject.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A direct reflection records at the brightness of its source, so the source can be metered as
      a stand-in for a highlight too small to read; the bracket compensates for the loss from polarization
      and from the imperfection of real direct reflection.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - glass_and_transparent_subjects
    conditions: bright-field and dark-field glass, with the glass as the only important subject
  caveats:
  - text: the proxy metering rests on the live chapter-3 claim that a direct reflection is as bright as
      its source (sk_lsm_c003_0011) and on the live claim that polarized direct reflection is substantially
      dimmer (sk_lsm_c003_0015); neither is re-extracted, and the bracket is the practical allowance for
      the second
    origin: extractor_observed
  - text: the source says accurate dark-field metering would need a spot meter of much less than one degree,
      that few photographers have one, and that bracketing with a conventional meter is an acceptably
      close approximation — an explicit substitution of procedure for instrument
    origin: source_stated
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0029 — the same source-brightness
      fact drives the metal exposure rule. The extraction expressed this with ''related_to'', which is
      a SPEC-05 ontology relation and not one of SPEC-03''s intra-source relations. No permitted SPEC-03
      relation says ''the same mechanism appears in another chapter'', so the observation is kept here
      rather than expressed as a relation that does not mean it.'
    origin: extractor_observed
  source_stated_problems:
  - attempting to lighten the background by increasing exposure will usually overexpose the subject
  source_stated_remedies:
  - in bright field, meter the background behind the subject and place it anywhere but black
  - in dark field, meter the edge of the light source, open two stops, and bracket up to three stops beyond
  - add a separate background light rather than more exposure when a dark-field background must be lighter
  examples:
