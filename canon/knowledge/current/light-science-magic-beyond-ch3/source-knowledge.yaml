      claim, and the source presents it as such
    origin: extractor_observed
  - text: 'the source warns that lighting the area near the camera needs care in the hole-in-the-source
      arrangement: a light aimed at a reflector card can flare into the lens, and a light through a diffusion
      sheet can cast a shadow of the camera onto the sheet that then reflects visibly in the subject'
