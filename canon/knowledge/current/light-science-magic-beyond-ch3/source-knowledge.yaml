- sk_id: sk_lsmx_0058
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - The difficulty comes from an uneven mix —part of the scene is lit by one light, while lights of different
    colors illuminate different areas .
  - It is this uniformity of error that makes the problem so simple to correct.
  - The best way to cope with unmixed color sources is to filter the lights to match each other as closely
    as possible . The objective of this is to get all of the light sources to be a single color—but not
    necessarily the right color.
  concept_label: mixed_colour_is_correctable_and_unmixed_colour_is_not_so_match_the_sources_to_each_other
  label_origin: extractor_assigned
  claim: 'Two situations arise when light sources of different colours are present, and only one is a
    problem. In mixed colour, rays of different balance blend so that the whole scene is lit by a single
    new balance: the error is uniform, so the camera will probably fix it and postproduction certainly
    can, with the result differing from a correctly shot frame only under side-by-side comparison. In
    unmixed colour, different areas are lit by different sources — flash on the foreground subject, fluorescent
    overhead, and, in a case the source flags as easy to miss, a flash-cast shadow on a wall filled in
    by fluorescent light and rendering yellow-green. No white balance can correct this, because whatever
    is right for one area is wrong for another, and a compromise value makes nothing right. The remedy
    is counter-intuitive: gel the sources to match each other as closely as possible, aiming for a single
    colour and not necessarily the correct one, then let the camera correct the whole scene globally.
    The source''s example is a light-green gel on the flash to approximate the overhead fluorescents.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A global colour correction is a single transform applied to the whole image, so it can only
      succeed where the error is the same everywhere. Matching the sources to each other converts a spatially
      varying error into a uniform one, which the global transform can then remove.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - colour
    conditions: location work where existing light cannot be removed or matched to a standard
  caveats:
  - text: the specific filtration varies with the scene and the source says trial and error is the only
      really satisfactory way to determine it
    origin: source_stated
  - text: the catalogue of nonstandard sources is period-specific — fluorescent tubes of mixed age and
      type, early LED panels whose colour temperature varies and whose adjustable versions the source
      says it has not been satisfied by — and is technology-contingent
    origin: extractor_observed
  - text: the source also allows unbalanced colour as a deliberate effect, citing its own 'Cinema Noir'
      portrait made from mixed street sources; that is a taste claim, not a correction claim
    origin: source_stated
  source_stated_problems:
  - No white balance adjustment can correct unmixed color.
  - the flash casts a shadow on the wall, but the fluorescent light illuminates the shadow and makes it
    a putrid yellow/green
  source_stated_remedies:
  - filter the lights to match each other, aiming for one colour rather than the right colour, then correct
    globally
  examples:
    positive: []
    counter: []
  intra_source_relations:
  - relation: generalises
    target: sk_lsmx_0059
    note: filtering the window is a case of matching the sources
  - relation: qualified_by
    target: sk_lsmx_0060
    note: global correction has its own failure mode
  evidence:
    characteristics:
