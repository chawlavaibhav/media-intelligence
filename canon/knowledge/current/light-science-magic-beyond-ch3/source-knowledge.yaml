- sk_id: sk_lsmx_0022
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Cylinders usually need a brighter highlight side or a darker shadow side than boxes do.
  - The shadows blend so gradually into the highlights that some of the dimensional distinction is lost.
  concept_label: cylinders_need_more_built_in_tonal_variation_than_boxes
  label_origin: extractor_assigned
  claim: 'A cylinder has no edges at which tone changes abruptly, so under even lighting the shadow blends
    into the highlight gradually and the subject reads as flat. Cylinders therefore need a brighter highlight
    side or a darker shadow side than boxes do. The source''s method is a light on one side and a black
    card on the other. Doing so reintroduces the side-lighting shadow problem, so it also calls for a
    large source to keep that shadow soft enough not to compete.

