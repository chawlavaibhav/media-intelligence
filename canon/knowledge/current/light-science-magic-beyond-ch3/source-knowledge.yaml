- sk_id: sk_lsmx_0040
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - The background dictates how we must treat any glass subject. On a bright background, we have to keep
    the glass dark if it is to remain visible.
  - we care only about the extreme limits of the family of angles, labeled 'L' in the diagram
  - there must be no light along the lines marked 'L'
  concept_label: bright_field_lighting_keeps_the_limits_of_the_family_dark
  label_origin: extractor_assigned
  claim: 'Bright-field lighting produces dark edge lines on a bright background. The background dictates
    the treatment: on a bright ground the glass must be kept dark to remain visible. What matters is not
    the whole family of angles but only its two extreme limits, because light arriving from exactly those
    angles is what would brighten the edge. Bright-field therefore requires that there be no light at
    those limits. The procedure is to set up a light-toned background — translucent tracing paper, cloth,
    a shower curtain, or an opaque wall or board — light it evenly, place the camera so the background
    exactly fills the frame, position the subject, then meter and shoot.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The edge of a round glass reflects, toward the camera, only light arriving from the extreme
      limits of its family of angles. Excluding light from those two directions leaves the edge with nothing
      to reflect, so it records dark against the lit ground behind it.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - glass_and_transparent_subjects
    conditions: transparent glassware photographed against a light ground
  caveats:
