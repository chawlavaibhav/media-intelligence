- sk_id: sk_lsmx_0054
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - White-on-white scenes generally have as much direct reflection as any other scene, but the diffuse
    reflection is usually bright enough to overpower the direct reflection.
  - a light gray still disappears against an identical light gray. The only way to keep such a subject
    visible is to make one of those grays lighter or darker .
  - White subjects do not necessarily produce less direct reflection.
  concept_label: white_on_white_removes_the_direct_reflection_tool_and_black_on_black_hands_it_back
  label_origin: extractor_assigned
  claim: 'White-on-white scenes deprive the photographer of direct reflection as a working tool, and the
    source is careful about why. White subjects do not produce less direct reflection than others; they
    produce so much diffuse reflection that it overpowers what direct reflection there is, so the camera
    cannot see it and manipulating it accomplishes little. The mirror-image statement holds for black
    subjects: they produce no more direct reflection, but theirs faces less competition and is therefore
    more visible. Good exposure only preserves distinctions; it cannot create them, and a light grey still
    disappears against an identical light grey. Only lighting can make one of the two greys lighter or
    darker, which is what separates a subject from its background.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Whether direct reflection is usable is set by its ratio to the diffuse reflection, not by its
      absolute amount, so the same physical reflection is a tool on a dark surface and unusable on a light
      one.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - exposure
    conditions: scenes composed almost entirely of very light or very dark tones
