- sk_id: sk_lsmx_0003
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - One of the first steps in lighting a scene is to look at the subject and decide what kind of reflection
    causes the subject to appear the way it does.
  - The next step is to position the light, the subject, and the camera to make the photograph capitalize
    on that type of reflection and minimize the others.
  concept_label: the_two_step_method_diagnose_the_governing_reflection_then_engineer_for_it
  label_origin: extractor_assigned
  claim: 'The source''s operative procedure has exactly two steps and a fixed order. First, look at the
    subject and decide which kind of reflection is responsible for how it looks. Second, position the
    light, the subject and the camera so that the photograph capitalizes on that reflection and minimizes
    the others. The source is explicit that "position the light" does not require a studio: choosing viewpoint,
    day and time outdoors performs the identical operation, and studio examples are used only because
    they are controllable enough to demonstrate the point.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Because the surface determines the reflection type and the geometry determines whether the
      camera can see it, a lighting decision is made by first identifying the type and then arranging
      the geometry that admits it.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - surface_rendering
    conditions: any subject; the source claims the principles apply to any type of photography
  caveats:
  - text: 'builds directly on live chapter-3 knowledge — the three reflection types (sk_lsm_c003_0003)
      and the family of angles placement rule (sk_lsm_c003_0014). What is new here is the ORDER: diagnosis
      before placement. The chapter-3 material is not re-extracted.'
    origin: extractor_observed
  - text: the source states this is the thinking an experienced photographer performs on any arrangement,
      and that most of it becomes habitual and fast; the effort described is therefore an initial cost,
      not a per-shot cost
    origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
  - decide what kind of reflection causes the subject to appear the way it does
  - position the light, the subject, and the camera to capitalize on that reflection and minimize the
    others
  examples:
    positive: []
    counter: []
