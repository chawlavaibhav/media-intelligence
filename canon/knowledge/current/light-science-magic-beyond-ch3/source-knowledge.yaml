- sk_id: sk_lsmx_0016
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Viewpoint determines both perspective distortion and the family of angles that causes direct reflection.
  - Changing viewpoint to control that family of angles also alters perspective distortion; changing viewpoint
    to control perspective distortion also alters the family of angles.
  - it is the camera's position that determines perspective distortion, not the lens mounted on it
  concept_label: viewpoint_couples_perspective_distortion_and_the_family_of_angles
  label_origin: extractor_assigned
  claim: 'Camera position is a single control acting on two independent-seeming outcomes. It determines
    perspective distortion — closer means more convergence, farther means less — and it determines the
    family of angles that produces direct reflection. The two therefore cannot be adjusted separately:
    moving the camera to escape a reflection changes the apparent geometry of the subject, and moving
    it to change the apparent geometry changes which lights will reflect. The source separately insists
    that focal length does not cause perspective distortion; it only lets a chosen viewpoint fill the
    frame, and the authors prove this by shooting all their comparison frames on one wide lens and enlarging.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Both quantities are functions of the camera''s position relative to the subject: distortion
      from the ratio of distances to near and far parts of the subject, and the family of angles from
      the spread of angles the viewpoint subtends across the surface.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - composition
    - product_rendering
    conditions: three-dimensional or glossy subjects where both matter
  caveats:
  - text: the source allows that extremely wide-angle and inferior lenses may produce other kinds of distortion,
      and excludes only perspective distortion from lens attribution
    origin: source_stated
  - text: this coupling is the reason several later remedies in the book come in pairs — move the light
      or move the camera — and why the choice between them is rarely free
    origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
