  source_id: light-science-magic-beyond-ch3
  source_terms:
  - 'Photographic lighting deals mainly with the extremes: the highlights and the shadows.'
  - Highlight and shadow together reveal form, shape, and depth . But highlight alone is usually enough
    to reveal what the surface of an object is like.
  concept_label: highlight_reports_surface_while_highlight_and_shadow_together_report_form
  label_origin: extractor_assigned
  claim: 'Lighting is worked at the two extremes of the tonal range; if the highlights and the shadows
    are right the middle range usually follows. The two extremes do different jobs. Highlight and shadow
    together reveal form, shape and depth. Highlight alone is usually enough to reveal what the surface
    of an object is like. The source uses this division to organise its own chapters: flat subjects and
