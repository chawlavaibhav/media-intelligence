- sk_id: sk_lsmx_0038
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - the closer the metal comes to producing pure direct reflection, the closer that reflection comes to
    photographing at the same brightness as the light source
  - Black magic is anything added to the basic lighting set-up solely to place a black 'reflection' in
    the metal surface.
  - metal with dulling spray on it no longer looks brightly polished and may not even look like metal!
  concept_label: the_disappearing_edge_and_the_three_finishing_tools_for_metal
  label_origin: extractor_assigned
  claim: 'A specific failure mode arises from the very purity that makes metal predictable: the closer
    the metal is to a pure direct reflector, the closer its reflection is to the brightness of the source,
    and since the surface it sits on is often the source, the two record at identical brightness and the
    camera cannot see where one ends and the other begins. Three finishing tools address it. Polarizing
    filters normally do nothing to metal, which reflects un-polarized — but the source may carry polarized
    rays, frequently when the metal is reflecting blue sky, and in the studio the light reflected from
    the surface the metal rests on is often partly polarized; where there is none, it can be introduced
    with a polarizer over the light. Black magic is anything added solely to place a black reflection
    in the surface: a gobo between a diffusion sheet and the subject gives a hard black edge, the same
    gobo behind the sheet gives a graduated one, softer the farther back it goes, and a soft-edged stripe
    of black spray paint achieves the graduation on an opaque reflector, where a gobo cannot. Dulling
    spray increases diffuse and decreases direct reflection, buying freedom from the family of angles
    at the price that the metal may stop looking like metal.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'An edge is visible only as a tonal boundary; when subject and background are lit to the same
      brightness there is no boundary to record. A black object placed inside the family of angles appears
      in the metal as a dark region, restoring the boundary.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - metal_surfaces
    conditions: polished metal in a finished set-up; the source presents these as options after the basic
      lighting is decided
  caveats:
  - text: the source says heavy-handed dulling spray reveals rather than conceals an inability to light
      metal, and immediately admits all three authors keep it in their studios — an unusually candid practitioner
      concession
    origin: source_stated
  - text: the blue-sky case explains why polarizers sometimes work on bright metal outdoors even though
      metal does not polarize; this is the live chapter-3 explanation (sk_lsm_c003_0019) reused, not re-extracted
    origin: extractor_observed
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0030 — the same gobo device used
      to place tone rather than remove it. The extraction expressed this with ''related_to'', which is
      a SPEC-05 ontology relation and not one of SPEC-03''s intra-source relations. No permitted SPEC-03
      relation says ''the same mechanism appears in another chapter'', so the observation is kept here
      rather than expressed as a relation that does not mean it.'
    origin: extractor_observed
  source_stated_problems:
  - the edge of a piece of metal is disappearing into the background
  - metal with dulling spray on it no longer looks brightly polished
  source_stated_remedies:
  - place a gobo to put a black reflection in the metal, hard-edged in front of the diffusion sheet or
    graduated behind it
  - paint a soft-edged black stripe across an opaque reflector where a gobo cannot graduate
  - use a polarizer where the source or the supporting surface supplies polarized light, or polarize the
    source deliberately
  - apply dulling spray sparingly to an overly bright highlight or a disappearing edge, keeping as much
    gleam as possible
  examples:
    positive: []
    counter: []
  intra_source_relations:
  - relation: qualifies
    target: sk_lsmx_0025
    note: the cost of the purity that makes metal predictable
  - relation: contradicts
    target: sk_lsmx_0009
    note: polarization is nearly useless on metal, where it was the escape route on copy work
