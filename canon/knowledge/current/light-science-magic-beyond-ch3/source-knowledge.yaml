- sk_id: sk_lsmx_0021
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - we never specify lighting ratios in this book because the decision has to be based on the specific
    subject as well as personal taste
  - if the subject is the package for a product we want to sell, there may be important detail on all
    sides. This requires keeping the highlight only slightly brighter, and the shadow only slightly darker,
    than the third side.
  concept_label: a_package_with_detail_on_every_side_forces_a_narrower_tonal_range_than_a_plain_form
  label_origin: extractor_assigned
  claim: 'The source refuses to publish lighting ratios, on the grounds that the right amount of tonal
    variation depends on the subject and on taste. It nevertheless states the governing distinction. A
    simple cube with no important detail on any side can take the full range — black shadow, white highlight.
    A package that has to sell a product, with important detail on all three visible sides, cannot: the
    highlight must be only slightly brighter and the shadow only slightly darker than the third side,
    because detail in either extreme would be lost. The depth clue is thereby deliberately weakened in
    exchange for legibility.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Depth is read from tonal difference between faces, and detail is read within a face. A wide
      difference between faces pushes some faces into the compressed extremes of the tonal range where
      their detail is lost, so a subject carrying detail everywhere must accept less difference.

      '
  scope:
