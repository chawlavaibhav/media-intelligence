- sk_id: sk_lsmx_0057
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - another good rule for black-on-black is to light it as if it were metal , regardless of the actual
    material
  - The best solution is to find a background material that produces less diffuse reflection than the
    subject. Black velvet serves this purpose
  - Much of the direct reflection from a black subject is likely to be polarized. If we use a polarizing
    filter to take the reflection off our table surface, we will probably turn the subject black too.
  concept_label: light_black_on_black_as_if_it_were_metal_and_the_metal_tricks_stop_where_polarization_differs
  label_origin: extractor_assigned
  claim: 'Because a black subject''s direct reflection has little diffuse competition, the rule for black-on-black
    is to capitalize on direct reflection wherever possible — in the source''s words, to light it as if
    it were metal regardless of what it is actually made of, which means finding the family of angles
    and filling it. The background problem is then the hard part. Opaque black paper is the worst common
    choice: it receives as much light as the subject, and since the subject must be rendered dark grey
    rather than black to hold detail, the paper under it cannot be black either. A spotlight would keep
    the background darker but is ruled out, because the direct reflection wanted on the subject requires
    a large source. The source''s answer is a background material producing less diffuse reflection than
    the subject — black velvet — with two stated limits: a few subjects are so black that even velvet
    is not blacker, and the subject''s edges may merge with its own shadow. Glossy black acrylic supplies
    invisible light to fill those edges, but the same overhead source then fills the acrylic''s family
    of angles and the background stops being black; the source argues its way to keeping this, saying
    the reflection under the subject is itself a sufficient clue that the surface is black and glossy,
    and concedes some readers will not accept that. The clean solution is distance: put the subject far
    enough from the background that lighting one does not touch the other. And the metal chapter''s glass-support
    trick does not transfer — much of a black subject''s direct reflection is polarized, so a polarizer
    used to clear the table would probably blacken the subject too.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Black surfaces show direct reflection because their diffuse reflection is weak, which makes
      them behave for lighting purposes like polished metal. The glass-support trick depends on the subject
      and the support polarizing differently; black insulating subjects polarize like the glass, so the
      filter cannot discriminate.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    conditions: black subjects on black backgrounds
  caveats:
  - text: 'the same authors revising their own earlier prescription: the metal chapter''s transparent-support-plus-polarizer
      solution is explicitly withdrawn for black subjects, on a stated optical ground. Not cross-source
      disagreement.'
    origin: source_stated
  - text: the acrylic-background argument is presented as an argument the source expects some readers
      to refuse, and it says so — an unusually explicit acknowledgement that it is bending its own rule
    origin: source_stated
  - text: the string-support alternative is dismissed as usually needing retouching, and the source notes
      it may survive in a brief motion picture or video shot while being apparent in a high-quality still
    origin: source_stated
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0012 — the same channel switch that
      rescued the black leather. The extraction expressed this with ''related_to'', which is a SPEC-05
      ontology relation and not one of SPEC-03''s intra-source relations. No permitted SPEC-03 relation
      says ''the same mechanism appears in another chapter'', so the observation is kept here rather than
      expressed as a relation that does not mean it.'
    origin: extractor_observed
  source_stated_problems:
  - if the subject is not black, then the background under it cannot be black either
  - the edges of the black subject merge with their own shadow
  source_stated_remedies:
  - find the family of angles and fill it with a large source, exactly as for metal
  - replace black paper with black velvet, a material producing less diffuse reflection than the subject
  - use a glossy black surface to bounce invisible light into the subject's edges
  - place the subject far enough from the background that its lighting does not reach the background
  examples:
