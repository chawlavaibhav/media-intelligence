- sk_id: sk_lsmx_0059
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Remember that windows are light sources and that they can be filtered just like any other light source.
  - our lights are probably weaker than the sun, and we would prefer not to dim them even more with the
    light absorbed by the filter
  - A better solution would be to put orange theatrical gels on the outside of the window and then shoot
    with a tungsten white balance.
  concept_label: filter_the_window_rather_than_the_lamps_because_it_balances_intensity_as_well_as_colour
  label_origin: extractor_assigned
  claim: 'A window is a light source and can be gelled like any other, a possibility the source says motion
    picture and video photographers use routinely and still photographers tend to overlook. In a room
    lit by tungsten photographic lights and by daylight through windows, the quick fix is blue gels on
    the photographic lights and a daylight balance. The better fix inverts it: orange theatrical gel on
    the outside of the window and a tungsten balance. Both achieve the same colour match. The second is
    preferred because the photographic lights are probably weaker than the sun, so filtering them costs
    output where it can least be spared, whereas filtering the window attenuates the stronger source and
    balances the two intensities as well as their colours.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A colour-correction filter absorbs light as well as shifting its balance, so which source is
      filtered determines which source is attenuated; putting the loss on the stronger source improves
      the intensity ratio at the same time as the colour match.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - colour
    conditions: interiors with both photographic lighting and daylight
  caveats:
  - text: an instance of the general matching principle with an added criterion — where two ways of matching
      exist, prefer the one that also improves the intensity balance
