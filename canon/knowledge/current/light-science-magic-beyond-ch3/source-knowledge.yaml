- sk_id: sk_lsmx_0029
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - a spot meter reading on the metal, remembering to expose two to three stops more than the meter indicates
  - A gray card reflection reading of the scene will probably not predict an acceptable exposure if the
    metal is the important subject .
  - There is, unfortunately, no 'normal' exposure that works for both. If the metal and the white paper
    are both important, we have to relight the scene.
  concept_label: metal_exposure_breaks_the_middle_grey_rule_and_a_conflict_must_be_relit_not_metered
  label_origin: extractor_assigned
  claim: 'Because a direct reflection records at about the brightness of its source, a spot reading on
    brightly lit metal must be opened two to three stops beyond the indicated value — the meter would
    place the metal at 18% grey and the metal should be brighter, and how much brighter is a creative
    decision rather than a technical one. The general rule of placing the middle greys accurately and
    letting the extremes fall where they may fails whenever the important subject is much brighter than
    a grey card: exposing correctly for the metal renders a white paper background dark grey. If both
    the metal and the white background matter — the source''s example is an advertisement needing legible
    black type on the paper — no exposure satisfies both and the scene must be relit.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The metal''s brightness in the image approximates that of the light source, not that of the
      illumination falling on the scene, so metering conventions calibrated to reflectance of the illuminated
      scene do not describe it.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - metal_surfaces
    conditions: scenes where brightly lit metal is the important subject
  caveats:
