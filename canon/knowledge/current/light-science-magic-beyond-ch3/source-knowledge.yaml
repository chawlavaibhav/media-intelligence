- sk_id: sk_lsmx_0050
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Changing from short to broad lighting positions the main light outside the family of angles that produces
    direct reflection.
  - From any particular camera position, the family of angles that produces direct reflection is greater
    if the glasses have big lenses.
  concept_label: eyeglass_glare_is_a_family_of_angles_problem_and_lens_diameter_sets_its_size
  label_origin: extractor_assigned
  claim: 'Reflections in a sitter''s eyeglasses are treated by the source as an ordinary family-of-angles
    problem rather than as a portrait-specific nuisance. With the main light on the far side from the
    visible ear, the glasses can reflect it and the source says the glare cannot be eliminated from that
    position — raising the light might clear it, but by the time it is high enough the eyes may be in
    shadow. Moving the light to the near side, which portrait practice calls broad lighting, works because
    it puts the main light outside the family of angles the eyeglass lenses define. The size of that family
    scales with the diameter of the lenses, so the problem grows with big glasses, and with small ones
    a smaller main light can sometimes be kept on the far side because it is easier to place entirely
    outside the family.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
