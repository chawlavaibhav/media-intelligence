- sk_id: sk_lsmx_0031
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - The precise tone of the metal is fully controllable, independently of the rest of the scene, and it
    can be any step between black and white that the photographer's creative judgment determines.
  - the entire light source produces diffuse reflection from the paper, but only that portion that covers
    the family of angles produces direct reflection on the metal
  concept_label: the_metals_tone_is_placeable_anywhere_on_the_greyscale_independently_of_the_scene
  label_origin: extractor_assigned
  claim: 'The usual result is neither of the extremes but a compromise: light filling the family of angles
    to make the metal bright, plus light from other angles producing diffuse reflection from the background.
    Several arrangements produce the same picture and the source says the best is whichever suits the
    equipment on hand. The important claim is not that the compromise is the best picture but the control
    it demonstrates — the metal''s tone can be placed at any step between black and white, independently
    of the rest of the scene. A single large soft box suffices, because the whole of it lights the background
    diffusely while only the part covering the family lights the metal; having more of the box inside
    the family makes the metal brighter, and a box large enough that little of it falls inside makes the
    background brighter instead.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The two surfaces read different parts of the same source: the background responds to all of
      it through diffuse reflection, the metal only to the portion inside its family through direct reflection.
      Changing the fraction of the source inside the family therefore moves one without moving the other.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - metal_surfaces
    conditions: metal against a background that reflects diffusely
  caveats:
  - text: 'the source states its purpose explicitly: not to convince the reader the compromise makes the
      best picture, but to get the reader to understand the thinking that leads to it'
    origin: source_stated
  - text: the same logical structure as the complex-surface treatment in chapter 4, but achieved by exploiting
      one source's differing effect on two surfaces rather than by dividing one surface
    origin: extractor_observed
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0013 — the complex-surface idea applied
      across two surfaces instead of within one. The extraction expressed this with ''related_to'', which
      is a SPEC-05 ontology relation and not one of SPEC-03''s intra-source relations. No permitted SPEC-03
      relation says ''the same mechanism appears in another chapter'', so the observation is kept here
      rather than expressed as a relation that does not mean it.'
    origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
