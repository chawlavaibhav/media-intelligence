  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Most failures in photographing glass result from deliberately or naively using both simultaneously.
  - They successfully eliminated extraneous reflections, but they equally successfully eliminated the
    edge of the glass.
  - Using the two methods together requires that we keep them separate, even in a single picture.
  concept_label: bright_field_and_dark_field_must_be_kept_spatially_separate_and_the_tent_is_the_worked_failure
  label_origin: extractor_assigned
  claim: 'The two methods are individually easy and difficult to combine, and the source attributes most
    glass failures to using both at once. Its worked counter-example is the tent, the very enclosure recommended
    for round metal: photographers who tented glass removed the extraneous reflections and removed the
    glass''s edges with them, because the part of the tent the camera saw became a light background while
    the rest of the tent lit the glass — light-on-light, the one combination that cannot define an edge.
    Combining the methods is possible only by keeping them separate within the frame: divide the scene
    mentally, assign one region to bright field and another to dark field. Where the two remain distinct
    the glass is well defined; only the transition area mixes them, and keeping that transition small
    minimises the loss.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
