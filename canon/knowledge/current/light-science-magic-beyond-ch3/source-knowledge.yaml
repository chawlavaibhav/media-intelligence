  label_origin: extractor_assigned
  claim: 'When a surface cannot supply enough diffuse reflection to show its texture, the remedy is to
    produce direct reflection instead. For the black leather this means a large source, above the subject
    rather than raking from the side, big enough to fill the whole family of angles. That is the exact
    opposite of the arrangement that worked for the sponge on every variable — direction and size both
    inverted — and the source says plainly that the earlier theory, taken alone, predicts this is the
    worst possible way to light the leather. The apparent contradiction is resolved by the fact that the
    earlier reasoning considered only diffuse reflection. With the large overhead source the leather''s
    texture highlight moves from near black to middle grey with no exposure increase and the same amount
    of light falling on the subject.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The leather produces little diffuse reflection but a great deal of direct reflection. Direct
      reflection is available only from inside the family of angles, so a source large enough to fill
      that family lights the whole surface through the channel the surface actually has, raising the recorded
      highlight without changing the incident light or the exposure.

      '
