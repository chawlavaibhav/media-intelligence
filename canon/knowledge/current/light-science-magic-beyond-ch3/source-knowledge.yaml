- sk_id: sk_lsmx_0055
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Technically, it does not matter whether the main subject or the background is slightly darker.
  - Psychologically, however, it matters a lot whether the background or the subject is white.
  - the background needs to be between ½ stop and 1 stop brighter than grays in the edges of the primary
    subject
  - the white backgrounds in all of these arrangements are in exactly the position most likely to cause
    these reflections
  concept_label: the_background_must_carry_the_extreme_and_the_separation_window_is_half_to_one_stop
  label_origin: extractor_assigned
  claim: 'Separating subject from background needs only that one be lighter than the other, and technically
    it does not matter which. Psychologically it matters a great deal: the brain will accept a light-grey
    subject against a white background as white-on-white, but will not accept a grey background, reading
    the same scene relit as white-on-gray. The identical asymmetry holds at the other end — a dark-grey
    subject on a black background reads as black-on-black, a black subject on a dark-grey background does
    not. The rule the source draws is that the background must carry the extreme. It also states a numeric
    window, rare in this book: the background between ½ and 1 stop brighter than the greys at the edges
    of the subject. Under ½ stop, part of the subject may disappear; over 1 stop, flare scatters enough
    light inside the camera to cost contrast in the subject. Separately, the background must be kept small
    — the same rule as bright-field glass — because direct reflection at the subject''s edge is what makes
    it disappear against a white ground and the background sits in exactly the position most likely to
    produce it, and because large white backgrounds produce a flare so uniform that the contrast loss
    will not be seen.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Viewers judge the key of a scene from the background rather than from the subject, so the background''s
      tone determines whether a scene reads as an extreme at all. The separation window is bounded below
      by the loss of the edge and above by flare inside the camera.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - exposure
    - product_rendering
    conditions: white-on-white and black-on-black scenes, especially simple ones giving the brain few
      other clues
  caveats:
  - text: the source says this is almost always true for simple scenes that do not give the brain many
      other clues, and also true for many complex ones — a hedged generalisation
    origin: source_stated
  - text: 'it explicitly allows the alternative: if the aim is only to separate subject from background,
      either may carry the extreme, and the picture may be good; it is simply not an example of the extreme
      type'
    origin: source_stated
  - text: the ½-to-1-stop figure is given for the source's own remaining examples rather than as a universal,
      and is stated in the same paragraph that sets those examples' conventions
    origin: extractor_observed
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0047 — the invisible-flare diagnosis
      appears in both chapters. The extraction expressed this with ''related_to'', which is a SPEC-05
      ontology relation and not one of SPEC-03''s intra-source relations. No permitted SPEC-03 relation
      says ''the same mechanism appears in another chapter'', so the observation is kept here rather than
      expressed as a relation that does not mean it.'
    origin: extractor_observed
  source_stated_problems:
  - If it is less than ½ stop brighter, part of the subject may disappear; if it is more than 1 stop brighter,
    flare may scatter enough light inside the camera to cost contrast
  - This flare will probably be so uniform that you will not see it, even when the general loss of contrast
    is significant.
  source_stated_remedies:
  - keep the background at the extreme and let the subject sit slightly inside it
  - hold the background between ½ and 1 stop brighter than the subject's edge tones
  - keep the white background no larger than it needs to be, confining the light to the image area or
    surrounding it with black cards
