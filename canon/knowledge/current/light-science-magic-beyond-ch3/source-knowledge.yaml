- sk_id: sk_lsmx_0053
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - A typical white diffuse reflection is about 2½ stops brighter than an 18% gray card seen under the
    same light.
  - the reduced exposure reserves more choices for later
  - we increase the exposure of a black-on-black scene to move it closer to the middle grays, even if
    we know we're going to darken it back down later
  concept_label: both_extremes_are_exposed_toward_the_middle_and_corrected_afterwards
  label_origin: extractor_assigned
  claim: 'Both extreme scene types are exposed toward the middle of the curve and moved back afterwards,
    by the same magnitude and for different reasons. A white-on-white scene is given up to 2½ stops less
    than normal — which in practice means metering the white subject and using the reading without the
    usual 2½-stop white correction — because that places the subject on the straight part of the curve
    and away from the shoulder, and because it reserves more choices for later. A black-on-black scene
    is given up to 2½ stops more, and the source says the extreme is more likely to be actually used there,
    because the shadow end also carries digital noise. Both shortcuts have the same failure condition:
    a secondary subject at the opposite extreme. Reduced exposure leaves an important black subject without
    shadow detail; increased exposure overexposes any light-grey secondary subject. Whether that matters
    is explicitly a psychological judgement about the secondary subject''s importance and size, not a
    technical one, and the source says it is entirely reasonable to expose two technically identical scenes
    differently on that basis.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Detail survives best on the straight portion of the curve. Shifting the exposure moves the
      scene''s tones onto that portion; the shift is then undone in reproduction, which restores the intended
      lightness while keeping the distinctions that were recorded.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - exposure
    conditions: scenes composed almost entirely of very light or very dark tones
  caveats:
  - text: the source distinguishes deliberate reduced and increased exposure from accidental under- and
      overexposure by whether the photographer has thought about the dangers, which is a distinction of
      intent rather than of result
    origin: source_stated
  - text: it anticipates that photographers who have mastered metering will be offended by 'point the
      meter and do what it says', and says they ought to be — the shortcut is only safe with the secondary-subject
