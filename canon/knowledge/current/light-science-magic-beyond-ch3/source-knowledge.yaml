- sk_id: sk_lsmx_0036
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Placing the box on a sheet of clear glass allows reflecting light through the glass to the box.
  - most of the direct reflection from glass viewed at this angle is polarized
  - Remember, too, that direct reflection from metal is never polarized unless the light source itself
    is polarized.
  - We call this technique invisible light .
  concept_label: transparent_and_glossy_black_supports_light_a_metal_box_without_showing_the_source
  label_origin: extractor_assigned
  claim: 'Two arrangements light the front of a metal box without putting a light source in the frame.
    On a clear glass support, light is reflected up through the glass from a white card below, so the
    camera sees the card''s reflection in the metal without seeing the card; a dark background can then
    be sized to fill the frame while staying outside the family that lights the box. The glass itself
    will reflect the overhead source, and here the two materials part company: most direct reflection
    from glass at that angle is polarized while direct reflection from metal is not, unless the source
    itself is polarized. A lens polarizer therefore turns the glass black and leaves the metal untouched.
    On a glossy black acrylic support the source calls the technique invisible light: the acrylic is too
    black to reflect diffusely but glossy enough to reflect directly, so a light below the camera bounces
    off it into the metal, while the acrylic''s own family of angles excludes the camera, so the camera
    cannot see the acrylic doing it. The light source for the box is in the scene and invisible.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Each surface has its own family of angles. A support can therefore lie inside the metal''s
      family while the camera lies outside the support''s, so the support illuminates the subject without
      being seen to. The polarizer works because insulators polarize their direct reflection and conductors
      do not.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - metal_surfaces
    conditions: three-dimensional metal on a support, where the background must stay dark
  caveats:
  - text: the polarizer step rests on the live chapter-3 diagnostic that conductors reflect un-polarized
      and insulators are more likely to polarize (sk_lsm_c003_0018), and on the live rule that a polarized
      SOURCE yields polarized reflection even from metal (sk_lsm_c003_0019); neither is re-extracted
    origin: extractor_observed
  - text: 'the source records a rejected alternative: frosted glass would remove the reflection but would
      make the background lighter rather than darker, which was the opposite of what was wanted'
    origin: source_stated
  - text: the source is candid that whether the dark reflection under the box is objectionable depends
      on the subject and on the reader's opinion
    origin: source_stated
  source_stated_problems:
  - the family of angles defined by the front surface tells us that the only possible place from which
    the metal could get light would be from the black plastic surface
  source_stated_remedies:
  - support the box on clear glass and reflect light up through it from a card below
  - put a lens polarizer on to blacken the glass without affecting the metal
  - bounce light off a glossy black acrylic support into the metal, using a family of angles that excludes
    the camera
  examples:
    positive:
    - description: 'the box on glass with a lens polarizer: the support is now black, the box unchanged'
      figure_ref: '6.27'
    - description: 'the box on glossy black acrylic lit by invisible light: the front face is brightly
        lit metal with the source nowhere visible'
      figure_ref: '6.29'
    counter:
    - description: 'the same glass support without the polarizer: a distinct reflection sits under the
        box and the background is grey rather than black'
      figure_ref: '6.26'
  intra_source_relations:
