- sk_id: sk_lsmx_0041
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - It makes sense to suppose, then, that the light must come from L if the edge of the glass is to be
    bright.
  - So we need four large sources to light just the edges of a single tiny glass!
  - Any size between 10 and 25 times the diameter of the subject will work well.
  concept_label: dark_field_lighting_puts_one_large_source_at_the_limits_and_a_smaller_dark_ground_inside_it
  label_origin: extractor_assigned
  claim: 'Dark-field lighting inverts the same geometry: light lines against a dark background. If no
    light at the family''s limits keeps the edge dark, light from exactly those limits makes it bright,
    and the glass must see light nowhere else. The plan-view diagram appears to require light at two points,
    but that is an artefact of drawing in two dimensions — in three dimensions the same reasoning demands
    a source above and behind for the rim and, on a stemmed glass, another for the underside of the bowl,
    which is four large sources for one small glass. The source replaces all of them with a single source
    large enough to cover top, bottom and sides; its exact size is not critical and any size between 10
    and 25 times the subject''s diameter works. A dark background, smaller than the source, sits inside
    it — taped to a translucent panel, or hung separately in front of a brightly lit opaque wall so the
    wall can be lit as much as one likes without lighting the background the camera sees.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The edge reflects only what lies at the limits of its family of angles; surrounding a small
      dark background with a much larger bright source puts light at those limits from every direction
      while leaving the field behind the subject unlit.

      '
  scope:
