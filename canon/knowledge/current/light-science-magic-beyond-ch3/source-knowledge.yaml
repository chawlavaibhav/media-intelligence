- sk_id: sk_lsmx_0056
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - The closer the gobo is to the subject, the harder the shadow of the gobo becomes.
  - one of the single biggest advantages to this technique is that it allows us to control the apparent
    shadow of the subject completely independently of the lighting of the subject
  - A mirror reflects almost nothing but direct reflections . These reflections are likely to be much
    brighter than the diffuse reflections from a white subject.
  concept_label: three_white_backgrounds_and_the_manufactured_ground_shadow
  label_origin: extractor_assigned
  claim: 'Three white-on-white background types trade different things. On an opaque white background
    — the hardest case, because whatever is done to one affects the other — the subject is lit from above,
    which shades its front and fully lights the tabletop, and a gobo is then almost always needed to bring
    the over-lit top of the subject down to the tone of its front. The gobo is tuned by two coupled controls:
    closer to the subject makes its shadow harder, farther makes it softer but lighter, so a shadow that
    blends but is too dark calls for a smaller gobo and one that is too light for a larger. A medium-sized
    main light is recommended precisely to keep that adjustment available. The method fails on very shallow
    subjects — a white card on a white table cannot be shaded without shading the background equally.
    A translucent background lit from behind removes the coupling entirely, at the cost of erasing the
    ground shadow; the source then manufactures one, tracing a pleasing shadow cast by a test light onto
    paper, cutting it out, and gluing the cut-out beneath the translucent panel, so the apparent shadow
    becomes independent of the lighting of the subject. A mirror is the easiest white background of all,
    because it reflects almost nothing but direct reflection and those reflections are brighter than any
    diffuse white; it needs the largest light in the book, one filling the family of angles of the entire
    background, that light must show no texture because it will be sharply reflected, and no ground shadow
    is obtainable at all.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Shadow hardness varies with the occluder''s distance from the subject and shadow depth with
      its size, so the two must be traded against each other. A translucent or mirror background is lit
      by a separate mechanism from the subject, which decouples the two.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    conditions: white subjects on white backgrounds
  caveats:
  - text: the source gives no formula for gobo size or distance and says the factors vary with the subject,
      offering instead a procedure for finding them by hand
    origin: source_stated
  - text: the manufactured shadow is presented without any suggestion that it is deceptive; the source's
      own phrase is that it certainly looks as if the light cast it
    origin: extractor_observed
  - text: 'the mirror background''s drawbacks are stated: the subject''s own reflection may confuse depending
      on crop and shape, and misting the tabletop with water is offered to break it up'
    origin: source_stated
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0019 — the ground shadow''s job is
      the one chapter 5 described. The extraction expressed this with ''related_to'', which is a SPEC-05
      ontology relation and not one of SPEC-03''s intra-source relations. No permitted SPEC-03 relation
      says ''the same mechanism appears in another chapter'', so the observation is kept here rather than
      expressed as a relation that does not mean it.'
    origin: extractor_observed
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0027 — the mirror background''s family
      is found by the metal procedure. The extraction expressed this with ''related_to'', which is a SPEC-05
      ontology relation and not one of SPEC-03''s intra-source relations. No permitted SPEC-03 relation
      says ''the same mechanism appears in another chapter'', so the observation is kept here rather than
      expressed as a relation that does not mean it.'
    origin: extractor_observed
  source_stated_problems:
  - it is impossible to put a shadow on the card without shading the background equally
  - the illumination under the subject has erased any hint of a ground shadow
  source_stated_remedies:
  - light from above and add a gobo over the subject, tuned by moving it and by recutting its size
  - use a translucent background lit from behind to decouple subject and background
  - trace a test light's shadow, cut it out, and glue it under the translucent background to manufacture
    a ground shadow
  - use a mirror background with a source large enough to fill the whole background's family of angles
  - add a black card to one side to give a white-on-white subject a shadowed side, rather than a reflector
  examples:
    positive:
    - description: the bust with a gobo shading the top of its head, restoring the separation lost in
        the previous frame
      figure_ref: '9.15'
    - description: a white flower on a translucent background with a manufactured shadow beneath it that
        reads as cast
      figure_ref: '9.20'
    - description: the same flower on a mirror background reading whiter than the flower
      figure_ref: '9.21'
    counter:
