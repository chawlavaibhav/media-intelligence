- sk_id: sk_lsmx_0045
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Large highlights are essential to glass surface definition.
  - Rather than cluttering the other elements of the photograph for the attention of the viewer, it serves
    the constructive purpose of saying, 'This is how this glass surface looks and feels.'
  - Had we lit the whole diffusion sheet brightly, it would have reflected in the glass as an obvious
    hard-edged rectangle. This reflection would have advertised the presence of a studio light
  concept_label: a_large_dim_highlight_describes_a_glass_surface_where_a_small_bright_one_only_distracts
  label_origin: extractor_assigned
  claim: 'Defining the edges is not always enough; often the surface must be shown too, and that requires
    managing the highlights. Large highlights are essential, and the difference from small ones is not
    of degree but of function: a tiny bright spot is distracting at best and meaningless at worst, while
    a large highlight tells the viewer how the surface looks and feels. Producing one means filling the
    relevant family of angles with light, and because a rounded glass reflects much of the studio, that
    family can be surprisingly large. The distance from the lamp head to the diffusion sheet then becomes
    a design decision: close in, only the centre of the sheet is bright and the highlight is small and
    bright; pulled back, the whole sheet lights and reflects as a larger highlight, which the source says
    should usually be kept dimmer, because a brightly lit whole sheet reflects as a hard-edged rectangle
    that advertises a studio light and costs the scene its reality. Strips of black tape on the sheet
    can make the reflection read as a window instead.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A direct reflection is an image of the source, so the highlight''s size, shape and evenness
      are the source''s size, shape and evenness. Making the highlight describe a surface therefore means
      shaping the source, and making it look unlike a studio means giving the source a shape found outside
      one.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - glass_and_transparent_subjects
    conditions: glassware whose surface, not only outline, must read; also useful with non-transparent
      secondary subjects present
  caveats:
  - text: this is the live chapter-3 mirror-image property (sk_lsm_c003_0010, sk_lsm_c003_0012) used as
      a design control rather than as a fact; the new content is that highlight SIZE carries surface information
      and that a recognisable source shape reads as artificial
    origin: extractor_observed
  - text: the source notes these are the first examples in the chapter where the light does not come from
      behind the glass, and that front lighting is what makes irregular surfaces and non-transparent secondary
      subjects manageable
    origin: source_stated
  source_stated_problems:
  - The tiny bright spots we see are distracting at the least and meaningless at best.
  - it would have reflected in the glass as an obvious hard-edged rectangle
  source_stated_remedies:
  - fill the family of angles of the area to be described, using a source large enough for a rounded subject
  - pull the lamp head back to light the whole diffusion sheet for a larger highlight, and keep that larger
    highlight dimmer
  - tape black strips across the diffusion sheet so its reflection reads as a window
  examples:
    positive:
    - description: a laboratory bottle with a broad soft vertical highlight down its shoulder, describing
        the curvature of the glass
      figure_ref: '7.9'
    - description: 'the same bottle with the lamp pulled back: the whole sheet reflects as a wider, dimmer
        highlight'
      figure_ref: '7.11'
    counter: []
