- sk_id: sk_lsmx_0060
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Beware of those scenes that include either a light source or the mirror reflection of one.
  - Such extremely bright areas record in a picture as white highlights regardless of the color of the
    light producing them. These highlights may then take on the color of whatever correction you use to
    remedy the rest of the scene.
  concept_label: a_light_source_or_its_mirror_image_in_frame_records_white_and_then_takes_the_corrections_colour
  label_origin: extractor_assigned
  claim: 'A global colour correction has a specific failure mode worth anticipating at the composition
    stage. Any area bright enough — a light source in the frame, or the mirror reflection of one — records
    as a white highlight regardless of the colour of the light that produced it, because it has clipped.
    When a correction is then applied to fix the rest of the scene, those highlights, having no colour
    of their own to shift, take on the colour of the correction. The source says the problem can be dealt
    with but requires more than the straightforward adjustment most people know, that only first-rate
    printers have prepress departments able to handle it, and that the reliable answers are to get the
    colour right while shooting or to compose so the troublesome highlights are not in the frame.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A clipped highlight carries no chromatic information, so a global correction that shifts every
      pixel shifts it too, away from the neutral white it recorded as and toward the correction''s own
      colour.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - colour
    conditions: scenes whose frame contains a light source or a mirror image of one, corrected globally
  caveats:
  - text: the source declines to explain the fix, calling it a topic too far from photographic lighting
      for the book, so the remedy recorded here is preventive rather than corrective
    origin: source_stated
  - text: the prepress remark is period- and workflow-specific and is not an optical claim
    origin: extractor_observed
  - text: 'a diagnostic worth keeping for image inspection: a coloured cast in a specular highlight, matching
      the correction applied elsewhere, is evidence of this failure rather than of the original lighting'
    origin: extractor_observed
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0038 — a light source''s own image
      in a shiny subject is the commonest way this arises. The extraction expressed this with ''related_to'',
      which is a SPEC-05 ontology relation and not one of SPEC-03''s intra-source relations. No permitted
      SPEC-03 relation says ''the same mechanism appears in another chapter'', so the observation is kept
      here rather than expressed as a relation that does not mean it.'
    origin: extractor_observed
