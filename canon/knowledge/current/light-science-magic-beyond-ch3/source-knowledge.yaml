- sk_id: sk_lsmx_0049
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - The lighting that produces direct reflection on the glass surface is also likely to obscure the paper
    label.
  - If it extends beyond the family of angles defined by the label, it will reflect in the glass.
  - if the polarizer eliminates the offending reflection from a label, it is also likely to interfere
    with the light the glass needs
  - We cannot make these editorial and artistic decisions on a purely technical basis.
  concept_label: the_label_and_the_glass_want_the_same_light_and_only_a_precisely_sized_gobo_serves_both
  label_origin: extractor_assigned
  claim: 'A paper label on a glass bottle is the source''s worked case of two surfaces demanding incompatible
    treatment from one light. Most of a paper''s reflection is diffuse but some is direct, so the light
    that gives the glass its describing highlight also puts direct reflection on the label and reduces
    its legibility. Two remedies work. Raise the offending light, so the label''s direct reflection goes
    downward rather than toward the lens. Or, where good highlight placement forbids moving the light,
    interpose a small opaque card blocking exactly the angles that produce direct reflection on the label
    — and the size of that gobo is critical, because if it extends beyond the label''s own family of angles
    it will itself reflect in the glass. A polarizer is a third option and rarely works, because much
    of the highlight the glass needs is usually polarized too, so removing the label''s reflection interferes
    with the light the glass requires. Underneath all of it sits a prior question the source says cannot
    be settled technically: which subject is the principal one. Two identical scenes might be lit differently
    depending on the caption, the client, or personal whim.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Each surface has its own family of angles. A gobo sized to the label''s family removes the
      label''s direct reflection without entering the glass''s family; oversize it and it enters the glass''s
      family and becomes a black reflection there. A lens polarizer cannot discriminate between the two,
      because both reflections are polarized.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - glass_and_transparent_subjects
    conditions: glass with opaque secondary subjects; the source's example is a labelled wine bottle
  caveats:
  - text: 'the polarizer''s failure here is the mirror image of its success on the metal box: there it
      discriminated because the two surfaces polarized differently, here it cannot because they polarize
      alike'
    origin: extractor_observed
  - text: the source is explicit that the principal-subject question is editorial and commercial, naming
      the caption and who is paying the bill among the inputs, and says lighting choices follow from it
      rather than the reverse
    origin: source_stated
  - text: the improvement in the labelled-bottle pair is real but subtle in this copy; the label's legibility
      gain is smaller than the source's prose implies
    origin: extractor_observed
  source_stated_problems:
  - The result is reduced legibility.
  source_stated_remedies:
  - move the offending light higher so the label's direct reflection goes downward
  - block the label's own family of angles with a small opaque card, sized no larger than that family
  - decide which subject is the principal one before lighting a mixed scene
  examples:
    positive:
    - description: 'the labelled bottle with a gobo blocking the label''s family of angles: the label
        reads slightly cleaner while the glass keeps its highlight'
      figure_ref: '7.25'
    counter:
    - description: 'the same bottle without the gobo: a sheen across the label reduces its legibility'
      figure_ref: '7.24'
