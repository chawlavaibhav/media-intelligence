- sk_id: sk_lsmx_0037
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - the family of angles defined by a piece of round metal includes practically the whole world!
  - the reflection of the camera will always fall exactly in the center of the metal subject, where it
    is most noticeable
  - The camera itself is the only reflection whose size cannot be reduced by moving it farther away.
  concept_label: round_metal_reflects_the_whole_environment_and_the_cameras_reflection_is_irreducible
  label_origin: extractor_assigned
  claim: 'A round metal subject''s family of angles is practically the whole environment, including the
    camera, and the camera''s reflection always falls at the centre of the subject where it is most noticeable.
    There are no view-camera tricks to move the camera out of that family. Three remedies exist: camouflage,
    meaning any desirable clutter — an irregular surface, or additional subjects appropriate to the scene
    — that breaks up the unwanted reflection; keeping the camera in the dark, by confining the light to
    the subject, working at a distance with a long lens, or covering the camera with black material, which
    only works in a room large enough that the walls do not reflect; and a tent, a white enclosure that
    is both environment and source, with the camera outside shooting through a hole. The source is honest
    that the tent does not solve the problem — the dark camera hole and the tent seams reflect in the
    subject and must be retouched — and that it mainly makes retouching easier. It also kills the intuitive
    fix of building a bigger tent: moving the camera farther away shrinks its reflection but also shrinks
    the subject, so a longer lens is needed, which enlarges the camera''s reflection back to its original
    size. The camera is the one reflection whose size distance cannot reduce.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A convex mirror reflects a hemisphere of its surroundings into a small area, so the family
      of angles is nearly unbounded. The camera''s reflected size scales with the subject''s image size,
      so any distance change that shrinks one shrinks the other and the ratio is constant.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - metal_surfaces
    conditions: round or strongly curved polished metal; the source uses a perfectly smooth sphere as
      the hardest case
  caveats:
  - text: the source states plainly that the tent by itself does not solve the problems and that the reflected
      camera hole and seams must be retouched out
    origin: source_stated
  - text: the anecdote about a department store catalogue cover, where ribbon and greenery camouflaged
      the tent seams, is a practitioner report of one job with no controlled comparison
    origin: extractor_observed
  - text: the source warns that lights placed inside a tent will reflect obtrusively in any mirror-like
      subject
    origin: source_stated
  source_stated_problems:
  - the dark camera hole and tent seams are reflected on the ball
  source_stated_remedies:
  - camouflage the camera's reflection with clutter appropriate to the scene, or with additional subjects
  - confine the light to the subject and keep the camera dark, or cover it with black material
  - build a white tent around the subject and shoot through a hole in it
  examples:
    positive:
    - description: 'shiny ornaments shot inside a tent: the studio clutter is gone and the spheres carry
        smooth even reflections, with small dark spots where the camera hole shows'
      figure_ref: '6.33'
    counter:
    - description: 'the same ornaments untented: the studio and its contents are legible in every sphere'
      figure_ref: '6.31'
  intra_source_relations:
