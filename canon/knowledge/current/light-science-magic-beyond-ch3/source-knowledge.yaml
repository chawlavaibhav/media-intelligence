- sk_id: sk_lsmx_0039
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Like metal, almost all reflection produced by glass is direct reflection. Unlike metal, however, this
    direct reflection is often polarized.
  - Lighting glass, however, requires attention to the edges. If they are clearly defined, we can often
    ignore the front surface altogether .
  - An invisible glass has no shape or form.
  concept_label: glass_is_lit_at_its_edges_not_at_its_face
  label_origin: extractor_assigned
  claim: 'Glass shares metal''s optics — almost all of its reflection is direct — and differs in that
    its direct reflection is often polarized. The source expects a reader to conclude that glass technique
    is metal technique plus a polarizer, and says explicitly that it is not. With metal the concern is
    the surfaces facing the camera; with glass it is the edges, and if the edges are clearly defined the
    front surface can often be ignored altogether. The failure the chapter exists to prevent follows from
    transparency: from most angles light striking a visible glass edge does not reflect toward the viewer,
    so the edge is invisible, and an invisible glass has no shape or form. The few reflections that do
    appear are usually too small and too bright to say anything about surface or texture, so they distract
    without informing.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Because glass transmits rather than absorbs, the only information a photograph can carry about
      it is what its surfaces reflect; the edges are where the surface curves through the widest range
      of angles, and so they are the part whose treatment decides whether the object has a legible outline.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - glass_and_transparent_subjects
    conditions: transparent glassware; the source's examples are a decanter, a laboratory bottle, stemware
      and a beer glass
  caveats:
  - text: the source states its two objectives numerically — produce strong lines along the edges to delineate
      shape and set it apart from the background, and eliminate distracting reflections of lights and
      equipment
    origin: source_stated
  - text: the same-optics-different-method point is the chapter's organising claim, and it is stated as
      a correction of an expectation the source itself raises
    origin: extractor_observed
  source_stated_problems:
  - With no clear outlines and no marked differences in edge tonality, the glass merges with the background.
  - the few tiny reflections we do see are often too small and too bright to tell us anything about surface
