- sk_id: sk_lsmx_0048
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Optical laws dictate that a round, transparent container filled with a liquid is, in fact, a lens.
  - a background large enough to fill the field of view of the camera is not large enough to fill the
    field of view that is seen through the liquid
  - a liquid in a transparent container always takes on some of the color and/or texture of its background
  concept_label: a_liquid_filled_container_is_a_lens_with_its_own_wider_field_of_view_and_its_own_colour_problem
  label_origin: extractor_assigned
  claim: 'A round transparent container filled with liquid is a lens, and this produces two distinct problems.
    The first is field of view: the liquid lens sees more than the camera does, so a background that exactly
    fills the camera''s frame does not fill the area seen through the liquid, and the studio appears as
    a dark surround inside the glass. The obvious remedy — a larger background — is barred, because it
    would sacrifice the edge definition the chapter exists to protect. The source''s remedy is to move
    the camera closer and, if needed, fit a shorter lens to hold the image size, so the existing background
    fills the area seen through the liquid; the stated cost is increased perspective distortion, visible
    as a deeper ellipse at the rim, which may or may not be acceptable. The second problem is colour:
    a liquid in a transparent container always takes on some of the colour and texture of whatever is
    behind it, so amber beer against a mottled mid-toned ground records dark and murky. The remedy is
    a secondary white or silver card behind the glass, cut to the subject''s own outline and lit separately,
    made by replacing the camera with a test light, tracing the cast shadow on the card, cutting it out
    and repositioning it.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A cylinder of liquid refracts, so it images a wider field than the camera and transmits the
      tone and colour of what lies behind it. A secondary background restores a controlled field and a
      controlled colour behind the liquid without extending beyond the glass into the camera''s view.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - glass_and_transparent_subjects
    - food_and_drink
    conditions: round transparent containers holding liquid; the source's cases are a wine glass and a
      glass of beer
  caveats:
  - text: the source notes some photographers prefer a foil coloured like the liquid — gold for beer —
      rather than white or silver; offered as practice, without a stated mechanism for the preference
    origin: source_stated
  - text: the secondary card must be large enough to fill as much of the area behind the liquid as possible
      without extending far enough to be visible beyond the edges of the glass; that two-sided constraint
      is what makes the tracing procedure necessary
    origin: source_stated
  - text: the perspective cost is the chapter-5 viewpoint coupling being paid explicitly, and the source
      says whether it is a defect depends on the scene
    origin: extractor_observed
  source_stated_problems:
  - a liquid-filled subject may reveal surroundings that we would prefer the viewer not see
  - a dark and unappealing murky-looking brew
  source_stated_remedies:
  - move the camera closer and use a shorter lens so the existing background fills the field seen through
    the liquid
  - place a white or silver card behind the glass, cut to the subject's outline by tracing the shadow
    cast by a test light at the camera position, and light it separately
