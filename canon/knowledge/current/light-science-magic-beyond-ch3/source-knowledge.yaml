- sk_id: sk_lsmx_0042
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - the background must exactly fill the field of view of the camera, no more and no less
  - A background that is too large will extend into the family of angles that produces direct reflection
    on the edge of the glass.
  - as the subject moves farther from the lighted background, less light reflects off its edges
  concept_label: the_background_must_exactly_fill_the_frame_and_the_subject_belongs_near_the_camera
  label_origin: extractor_assigned
  claim: 'In both glass methods the single most important consideration is the effective size of the background,
    which is set by the camera-to-background distance and must exactly fill the field of view — no more
    and no less. Too small and it will not fill the picture; too large and it extends into the family
    of angles that acts on the glass edge, in bright field brightening the edge that should be dark, in
    dark field blocking the light that should make it bright. Where the background cannot be made smaller
    — a room wall — its effective size can be cut by lighting only part of it or masking it with dark
    cards. Independently, edge definition improves as the subject is moved toward the camera and away
    from the background, and the source is explicit that this is not because larger detail is easier to
    see: the closer the subject is to a lit background, the more of that background falls inside the family
    of angles that obscures the edges.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The background''s angular extent as seen from the subject is what determines how much of it
      lies inside the subject''s family of angles, and that extent depends on both the background''s size
      and the subject''s distance from it.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - glass_and_transparent_subjects
    conditions: bright-field and dark-field glass set-ups
  caveats:
