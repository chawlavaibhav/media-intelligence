    origin: source_stated
  source_stated_problems:
  - that part of the scene will lack shadow detail
  - This method will, of course, overexpose any secondary light-gray subjects in the same scene.
  source_stated_remedies:
  - for white-on-white, meter the white subject and use the reading without the routine 2½-stop correction
  - for black-on-black, expose up to 2½ stops more than a grey-card or incident reading, or meter the
