- sk_id: sk_lsmx_0027
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - A test light in place of the camera reflects from the metal to show where the family of angles is
    located.
  - the point reflecting in the metal edge at the bottom of the image corresponds to the limit marked
    at the top of the test surface and vice versa
  concept_label: the_test_light_procedure_locates_the_family_of_angles_physically
  label_origin: extractor_assigned
  claim: 'The family of angles can be found by measurement rather than by guesswork. Hang a white target
    larger than you think you need where you expect the family to be; put a narrow-beam test light exactly
    at the lens position, removing the camera if necessary; aim it at the point on the metal nearest the
    camera and mark where the reflected beam lands on the target — that is the near limit; aim it at the
    farthest point and mark the far limit; mark as many points as the subject''s shape requires. The source
    states an inversion that follows from the geometry and that it says will make the source of any hot
    spot easy to find thereafter: the point reflecting at the bottom edge of the image corresponds to
    the limit marked at the top of the test surface, and vice versa. It notes the same relationships hold
    for other orientations — the side view of a copy set-up is also a plan view of a camera photographing
    a mirrored building, where the marked area is the part of the sky reflected in it.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Light paths are reversible: a beam sent from the camera''s position and reflected by the subject
      traces exactly the path a source would have to occupy to reach the camera, so the beam''s landing
      point marks the family''s limit.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - metal_surfaces
    conditions: any mirror-like subject; the source says an abbreviated version suffices for most photographs
  caveats:
  - text: 'the source flags a hazard in the view-camera variant: a photographic light aimed through the
      camera body can heat a black camera enough to cause expensive damage'
    origin: source_stated
  - text: for a long lens at a large working distance the source says the test light need only be as close
      to the lens as convenient, not exactly at it
    origin: source_stated
  - text: the source records a reader's suggestion of using a laser pointer as the test light and endorses
      it without having tested it, writing that it 'should work well'
    origin: source_stated
  source_stated_problems:
  - it may be difficult to visualize where the family of angles exists in space
  source_stated_remedies:
  - position a white target where you think the family will be, larger than you think you need
  - place a narrow-beam test light at the camera lens position and aim it at the nearest and farthest
    points of the metal, marking where the beam lands
