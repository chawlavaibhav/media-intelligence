- sk_id: sk_lsmx_0046
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Glass things have to be put on tables; tables cause horizon lines in photographs.
  - A transparent table allows light to pass through as if the table didn't exist, but an opaque table
    blocks light essential for edge definition.
  - If we cut the paper strip carefully so that it fits the field of view of the camera exactly, there
    will be no sacrifice of the lighting quality.
  concept_label: the_table_under_glass_is_an_optical_obstruction_not_only_a_compositional_one
  label_origin: extractor_assigned
  claim: 'A table under glassware creates a horizon line, and the usual cures — a table large enough to
    fall outside the frame, or a paper sweep — fight the requirement that the background barely fill the
    image area. Worse, the table is not merely a compositional nuisance: an opaque table blocks light
    that is essential for edge definition, which a transparent one passes as if the table did not exist.
    The source''s options, in order of how completely they remove the horizon: a transparent glass or
    acrylic table, which resembles a nonexistent table more closely than anything else; a mirror, whose
    reflected background reduces the abrupt tonal step and which can light glass surfaces almost as well
    as a transparent table, at the cost of a visible but less obtrusive horizon; and, where the horizon
    must go entirely, a paper strip taped to a large diffusion panel and cut to fit the field of view
    exactly, which the source says costs no lighting quality. It adds a variation for either transparent
    surface: mist the table with water to disrupt and camouflage the subject''s reflection.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Light needed at the limits of the family of angles for the lower edges of the subject arrives
      from below and behind; an opaque surface intercepts it, a transparent one transmits it, and a mirror
      redirects some of it back up.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    - glass_and_transparent_subjects
    conditions: glassware standing on a surface within the frame
  caveats:
  - text: the source says covering a dark table with white or silver reflectors for dark field is somewhat
      less effective, because the light on the reflectors is the same source lighting the table and the
      right amount for one may be too much for the other
