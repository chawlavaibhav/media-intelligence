- sk_id: sk_lsmx_0019
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - The least distracting place for the shadow in most compositions is directly under and in front of
    the subject .
  - the shadow also proves that the subject is sitting on a table
  - Without the shadow, the brain would have no way of knowing whether the subject is on the table or
    floating above it.
  concept_label: the_ground_shadow_must_be_relocated_rather_than_removed
  label_origin: extractor_assigned
  claim: 'A competing shadow cannot simply be softened out of existence, because the shadow is carrying
    information: it proves the subject is resting on a surface rather than floating above it, and the
    relationship of subject to background is an essential part of the depth message. The remedy is to
    move it, not to delete it. The least distracting position in most compositions is directly under and
    in front of the subject, which means the light goes above and slightly behind. Softening it afterwards
    with a larger source makes it unobtrusive without losing the grounding.

    '
