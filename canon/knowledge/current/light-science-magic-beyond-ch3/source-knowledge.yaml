- sk_id: sk_lsmx_0009
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - We first position the lights for even illumination, without concern about whether we are creating
    direct reflection.
  - Polarizing the light source has serious drawbacks and is a solution to avoid whenever possible.
  - the actual exposure reduction is likely to be four to six stops
  concept_label: cross_polarizing_source_and_lens_buys_freedom_from_geometry_at_a_large_cost
  label_origin: extractor_assigned
  claim: 'When the working space makes even and glare-free illumination simultaneously impossible, the
    order of operations can be inverted: position the lights purely for even illumination, ignoring direct
    reflection, then put polarizing filters on the lights with their axes toward the camera so that the
    direct reflection is polarized, and a polarizer on the lens at 90 degrees to remove it. In theory
    the camera then sees only diffuse reflection; in practice some polarized reflection survives because
    no polarizer is perfect, and the source says the defect is negligible in all but the worst cases.
    The source is emphatic that this is a last resort: understanding and controlling the size and angle
    of the source makes it unnecessary in most situations, and some photographers go for years without
    needing it.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Metal-free copy surfaces produce a mixture of direct and diffuse reflection; polarizing the
      source makes the whole direct component polarized, and a crossed lens polarizer then removes that
      component and leaves the diffuse one.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - copy_work
    conditions: cases the source describes as deliberately conceived to be impossible by geometry alone
  caveats:
  - text: extends the live chapter-3 remedy of polarizing the source (sk_lsm_c003_0019) by attaching a
      cost. Chapter 3 states that polarizing the source turns direct reflection into manageable polarized
      reflection; this chapter says the move should be avoided whenever possible and lists why. The SAME
      AUTHORS qualifying their own earlier statement — not cross-source disagreement.
    origin: source_stated
  - text: 'the stated costs: a theoretical two stops but four to six in practice because real polarizers
      carry neutral density; worse in non-copy work where diffusion also absorbs; consequent aperture
      may be too wide for depth of field, or the exposure long enough for subject movement; polarizing
      filters are damaged by heat and must be kept off incandescent lights at a tested distance; a minor
      effect on colour balance'
    origin: source_stated
  - text: the heat and colour-balance cautions are partly technology-contingent — the film colour-compensating-filter
      advice is explicitly conditioned on shooting film
    origin: extractor_observed
  source_stated_problems:
  - we cannot position the camera and lights to provide illumination that is both uniform and glare-free
  source_stated_remedies:
  - position the lights for even illumination, then polarize the lights with axes toward the camera and
    cross the lens polarizer at 90 degrees
  - use the most powerful lights the budget and available current allow, to recover the lost stops
  - burn a test piece of polarizing material in front of an incandescent light to determine a safe mounting
    distance
  examples:
    positive:
