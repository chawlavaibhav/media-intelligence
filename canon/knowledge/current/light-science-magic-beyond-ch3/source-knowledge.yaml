- sk_id: sk_lsmx_0020
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - a silver card produces direct reflections. For this reason, the silver card has its own limited family
    of angles from which reflection can occur.
  - Because the angle of a white card is less critical, from some positions it will reflect more light
    to the subject than a silver one.
  - A white reflector card is the only reflector that can provide soft fill light from a small main light.
  concept_label: a_silver_fill_card_has_its_own_family_of_angles_and_inherits_the_main_lights_hardness
  label_origin: extractor_assigned
  claim: 'The choice between a silver and a white reflector card is not simply a choice of brightness.
    A silver card reflects directly, so it has its own limited family of angles and its aim is critical;
    in a crowded set the only position available may be one from which it reflects no light to the subject
    at all, and a white card, reflecting diffusely and therefore insensitive to angle, will then deliver
    more. A silver card also produces a mirror image of the main light, so it inherits that light''s size:
    a large silver card is a soft fill only if the main light is large, and with a small main light a
    silver card is a hard fill regardless of its own size. A white card is the only reflector that can
    give soft fill from a small main light.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A silver card behaves as a mirror: what it sends to the subject is an image of the main light,
      so both its aim and the apparent size of what it reflects are governed by direct-reflection geometry.
      A white card scatters, so its output depends on how much light falls on it and hardly at all on
      its angle.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - product_rendering
    conditions: fill lighting of tabletop subjects with reflector cards
  caveats:
