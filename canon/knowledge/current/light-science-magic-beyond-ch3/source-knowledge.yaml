- sk_id: sk_lsmx_0024
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - We call this uneven illumination falloff . As we are using the term, it means a transition in the
    scene from light to dark.
  - Move the gobo in front of the lens just far enough that you can no longer see the light source reflected
    in the lens.
  concept_label: background_falloff_adds_depth_and_the_lens_reflection_locates_the_gobo
  label_origin: extractor_assigned
  claim: 'A single-tone background wastes the illusion of infinite depth that a sweep provides. Lighting
    the background unevenly — the source''s term is falloff, a transition from light to dark, most commonly
    placed at the top — supplies a further depth clue and separates the subject from the background. The
    source produced it simply by aiming the light more toward the camera, which puts less light on the
    paper at the back of the set. Aiming a light toward the camera raises the risk of camera flare, which
    is caused by light from outside the field of view entering the lens and reflecting inside the camera;
    a gobo is the only cure, and the source gives a positioning trick: because the glass lens reflects
    like a mirror, look into the front of the lens and move the gobo until the offending source is no
    longer reflected there, then pull it back slightly.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A tonal gradient across the background reads as recession. The gobo trick works because the
      lens surface is itself a mirror, so the set of sources it can see is exactly the set that can produce
      camera flare; occluding them in that reflection occludes them at the lens.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - composition
    conditions: studio still life on a seamless sweep; the flare advice applies wherever a source is near
      the field of view
  caveats:
  - text: the source separates lens flare from camera flare and says their appearance can be the same;
      the mechanism it explains and the gobo it prescribes address camera flare
    origin: source_stated
  - text: the source notes that a gobo is harder to place under a soft source, because the gobo's own
      shadow may be too soft to see, and that shallow depth of field at the composing aperture can hide
      an intruding gobo
    origin: source_stated
  - text: the source concedes flare is sometimes wanted, naming current fashion and glamour practice;
      that is a taste claim about a period, not a physical one
    origin: source_stated
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0047 — dark-field glass is the worst
      flare case in the book. The extraction expressed this with ''related_to'', which is a SPEC-05 ontology
      relation and not one of SPEC-03''s intra-source relations. No permitted SPEC-03 relation says ''the
      same mechanism appears in another chapter'', so the observation is kept here rather than expressed
      as a relation that does not mean it.'
    origin: extractor_observed
  source_stated_problems:
  - the more we aimed the light toward the camera, the greater was the possibility that we would produce
    serious camera flare
  source_stated_remedies:
  - aim the light more toward the camera so less falls on the back of the sweep, producing falloff
  - look into the front of the lens and move the gobo until the light source is no longer reflected in
