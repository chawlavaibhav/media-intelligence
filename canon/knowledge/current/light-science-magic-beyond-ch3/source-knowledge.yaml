- sk_id: sk_lsmx_0051
  source_id: light-science-magic-beyond-ch3
  source_terms:
  - Human skin also produces a small amount of direct reflection. Consequently, eliminating all direct
    reflection in the highlights of a portrait may give the skin a lifeless appearance.
  - The key to successfully dealing with dark complexions is to increase the direct reflections from them
  - just a slight increase in the size of the light would offer almost no improvement
  - The larger the light we use, the better the result.
  concept_label: skins_small_direct_reflection_is_both_a_resource_for_dark_skin_and_a_thing_not_to_remove
  label_origin: extractor_assigned
  claim: 'Human skin produces a small amount of direct reflection, and the source draws two consequences
    from the same fact. First, it is a resource: because direct reflection is most visible on a dark surface,
    dark skin is best rendered not by opening the aperture — which would ruin any light-toned subject
    in the same frame, the source''s example being a bride''s white dress — but by increasing the direct
    reflection from the skin with a larger source. Since a head is roughly spherical, the family of angles
    producing a large direct reflection on it is itself large, so a slight increase in light size achieves
    almost nothing and the larger the source the better. Second, it is a thing not to destroy: still-life
    photographers coming to portraiture are sometimes tempted to cross-polarize source and lens to kill
    reflections from eyeglasses, and eliminating all direct reflection from the highlights may leave the
    skin looking lifeless.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Direct reflection is more visible where diffuse reflection is weak, so it contributes more
      to the rendering of dark skin than of light. A larger source fills more of a spherical subject''s
      wide family of angles, enlarging the highlight without changing the exposure at the camera.

      '
  scope:
    domain_discussed_by_source:
    - photographic_lighting
    - portraiture
    conditions: portrait subjects; specifically dark complexions, and any portrait where polarization
      is being considered
  caveats:
  - text: rests on the live chapter-3 explanation that direct reflection is more visible on dark subjects
      because their diffuse reflection is weak (sk_lsm_c003_0017); that mechanism is not re-extracted,
      and what is new is its use as a portrait technique
    origin: extractor_observed
  - text: the lifeless-skin claim is an aesthetic judgement about how an image reads, asserted without
      a demonstration, and it is the reason the source blocks a technique it recommends elsewhere
    origin: extractor_observed
  - text: the source concedes the aperture may still need opening a little; the direct-reflection route
      reduces rather than removes the exposure conflict
    origin: source_stated
  - text: 'Cross-chapter echo recorded without a graph edge: sk_lsmx_0057 — the same reasoning drives
      black-on-black lighting. The extraction expressed this with ''related_to'', which is a SPEC-05 ontology
      relation and not one of SPEC-03''s intra-source relations. No permitted SPEC-03 relation says ''the
      same mechanism appears in another chapter'', so the observation is kept here rather than expressed
      as a relation that does not mean it.'
    origin: extractor_observed
  source_stated_problems:
  - if the subject is a bride with very dark skin in a white wedding dress, the preceding strategy could
    lead to disaster
  source_stated_remedies:
  - use a much larger light source to increase direct reflection from dark skin rather than increasing
