- scs_id: scs_lsmx_001
  source_id: light-science-magic-beyond-ch3
  label: the_surface_class_decision_framework
  label_origin: extractor_assigned
  system_type: decision_framework
  system_type_origin: source_stated
  description: >
    The book's operative procedure for any subject, stated once in chapter 4 and then executed in each
    of the surface chapters. First classify the subject by which reflection type is responsible for its
    appearance. That classification then selects the whole arrangement, and the arrangements it selects
    are not variations on each other — they are opposites. A light-toned diffuse subject wants a small
    raking source; a black glossy subject wants a large source overhead filling the family of angles;
    metal wants the family filled or vacated depending on a prior tonal decision; glass wants the two
    limits of the family occupied or vacated and the front surface ignored; a black subject wants
    metal's arrangement whatever it is actually made of. The classification is not descriptive
    background — it is the branch that determines everything downstream.
  whole_system_claim:
    text: >
      The reflection-type classification is a branch, not a preamble. Two subjects of the same tone,
      the same size and the same shape can require arrangements that differ on every variable — source
      size, source direction, and whether light is placed inside or outside the family of angles — and
      the only thing that selects between them is which reflection channel the surface actually has.
      This is why a lighting rule stated without its surface precondition is unsafe: the book's own
      worked case is a raking light that is correct for a sponge and, applied unchanged to black
      leather, is the worst possible choice.
    origin: source_explicit
    interpretation_basis:
    source_ref: "Ch. 4, 'Photographer as an Editor' (the two-step statement) and 'Capitalizing on Direct Reflections' (the sponge/leather pair)"
  members:
  - {sk_ref: sk_lsmx_0003, role_in_system: decision_rule, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_lsmx_0004, role_in_system: classification_basis, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_lsmx_0010, role_in_system: branch_outcome, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_lsmx_0011, role_in_system: failure_of_wrong_branch, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_lsmx_0012, role_in_system: branch_outcome, order: 5, membership_origin: source_stated}
  - {sk_ref: sk_lsmx_0026, role_in_system: branch_outcome, order: 6, membership_origin: source_stated}
  - {sk_ref: sk_lsmx_0039, role_in_system: branch_outcome, order: 7, membership_origin: source_stated}
  - {sk_ref: sk_lsmx_0057, role_in_system: branch_outcome, order: 8, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: procedural, origin: source_stated}
    dependencies:
    - {from: sk_lsmx_0010, on: sk_lsmx_0003, note: "the raking-light arrangement is what step two produces for a light diffuse surface", origin: source_stated}
    - {from: sk_lsmx_0012, on: sk_lsmx_0003, note: "the large overhead source is what step two produces for a dark glossy surface", origin: source_stated}
    - {from: sk_lsmx_0057, on: sk_lsmx_0026, note: "the source says to light black-on-black as if it were metal", origin: source_stated}
    tradeoffs: []
    conflicts:
    - {between: [sk_lsmx_0010, sk_lsmx_0012], note: "opposite on source size and source direction; the source states the contradiction explicitly and resolves it by the classification", origin: source_stated}
    - {between: [sk_lsmx_0023, sk_lsmx_0035], note: "a glossy non-metallic box has direct reflection removed and a metal box has it created, from identical geometry", origin: source_stated}
  source_warns_against_isolated_use: true
  source_warning_ref: "Ch. 4, 'Capitalizing on Direct Reflections': 'It shows how applying a good technique at the wrong time can produce a bad picture.'"
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, controlled_comparison, argued, repeated_within_source, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The two-step rule and the sponge/leather contradiction are the source's own words and its own
      worked demonstration; the whole-system claim quotes its reasoning rather than adding to it. What
      is OURS is the membership list: the source never gathers these branch outcomes into one set, and
      collecting metal, glass and black-on-black alongside the chapter-4 pair is our grouping. The
      conflicts recorded are stated by the source pairwise, in the chapters where each arises, never
      side by side.
  provenance:
