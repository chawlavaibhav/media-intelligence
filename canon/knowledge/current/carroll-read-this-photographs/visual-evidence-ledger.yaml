  - sk_ref: sk_crl_0001
    fni: false
    lesson: 'Leading lines (spine 8)'
    files: [images/pg11_1.jpg, images/pg10_1.jpg]
    photograph: "The Var department. Hyères. France / Henri Cartier-Bresson / 1932"
    what_it_shows: >
      From above a spiral staircase: the handrail sweeps in from the right frame edge and coils
      down toward a cobbled street where a blurred cyclist passes lower left. pg10_1 is the
      book's own diagram of the same image with a drawn arrow tracing the rail down and around
      to the cyclist.
    verdict: claim_visible_in_photograph
    finding: >
      One dominant line, entering from the frame edge, carrying the eye to the cyclist - all
      three of Carroll's operating rules are visible, and the printed arrow diagram states the
      claimed eye-path explicitly in the artifact itself.

  - sk_ref: sk_crl_0002
    fni: true
    lesson: 'Framing (spine 10)'
    files: [images/pg15_1.jpg]
    photograph: "Burning Man Festival, Black Rock City. Nevada, USA / Cristina Garcia Rodero / 1999"
    what_it_shows: >
      A masked figure leaps mid-air inside a large hoop, hoop and figure set against a truck
      crowded with festival-goers and a busy playa behind.
    verdict: claim_visible_in_photograph
    finding: >
      The claimed ordering of attention is visible: the hoop encloses the leaping figure and
      separates it from a genuinely anarchic scene; the eye lands inside the hoop first. The
      "photograph within your photograph" description matches what the frame does.

  - sk_ref: sk_crl_0003
    fni: true
    lesson: 'Foreground interest (spine 11)'
    files: [images/pg17_1.jpg, images/pg16_1.jpg]
    photograph: "Shipbreaking #31, Chittagong, Bangladesh / Edward Burtynsky / 2001"
    what_it_shows: >
      Textured oily mud fills the very foreground, a wet reflection of the beached ship runs
      through the middle distance, the ship itself stands at the top. pg16_1 is the book's
      diagram variant: a baseline with an upward arrow from the mud to the ship.
    verdict: claim_visible_in_photograph
    finding: >
      The layered near-to-far chain the claim describes is present: mud, reflection, ship.
      Carroll's occlusion test was checked as literally as an inspection can - masking the
      bottom band of the frame does leave the eye jumping straight to the ship with the depth
      chain gone.

  - sk_ref: sk_crl_0004
    fni: false
