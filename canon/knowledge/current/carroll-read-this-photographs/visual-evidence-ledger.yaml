  0008, 0009, 0017, 0018, 0019, 0020, 0022, 0023, 0024, 0027, 0029) now have their photographs
  opened and checked. 13 of 14 resolve as claim_visible_in_photograph; sk_crl_0017 resolves as
  claim_visible_with_noted_limit (the Godwin's shadow-edge sharpness is below this
  reproduction's resolution; the directional modelling the depth claim needs is visible). No
  frozen claim is contradicted by any photograph. Separately, two named recoveries land on
  objects NOT carrying the flag: sk_crl_0019's unresolvable exercise pages are now identified,
  and sk_crl_0021's uninspected focal-length table is now read (contents in its row). The one
  underdetermination found (sk_crl_0030, series claim vs cover reproduction) is on an object
  that never carried the flag, because its support really is prose - the figure adds identity,
  not evidence.

