    verdict: claim_visible_in_photograph
    finding: >
      As the exemplar of a picture "without any excuses" the choice is legible: everything the
      image claims is in the frame. The test itself is a self-assessment procedure, not a visual
      proposition; the figure's role is exemplary and it fills that role.

  - sk_ref: sk_crl_0027
    fni: true
    lesson: 'A different point of view (spine 60)'
    files: [images/pg111_1.jpg]
    photograph: "Felix, Gladys and Rover / Elliott Erwitt / 1974"
    what_it_shows: >
      Ground-level view: a great dane's legs and its owner's boots tower beside a tiny chihuahua
      in a knitted hat looking into the lens; the camera is at the small dog's eye height on the
      pavement.
    verdict: claim_visible_in_photograph
    finding: >
      The joke visibly depends on the vantage: at head height this is a person walking two dogs;
      at ground level it is a portrait among legs. The claimed dependence of the double take on
      the unfamiliar height is directly demonstrated.

  - sk_ref: sk_crl_0028
    fni: false
    lesson: 'Unexpected beauty (spine 58)'
    files: [images/pg107_1.jpg, images/pg108_1.jpg]
    photograph: "Where my Grandfather Drank #1 / Stephen J. Morgan / 2002; and Pepper #30 / Edward Weston / 1930"
    what_it_shows: >
      Morgan: the corner of a run-down social club - worn patterned wallpaper, violet banquette,
      ashtrays and a stout glass, a haze of smoky light drifting across - an unpromising subject
      rendered with evident care. Weston: a pepper photographed into sculptural monumentality.
    verdict: claim_visible_in_photograph
    finding: >
      Both reproductions are of conventionally unbeautiful subjects made compelling by the
      photograph's own means, which is the narrow claim extracted. The inverse claim (that
      sunsets defeat photographers) has no figure and is not visually testable - the book shows
      no failed sunset, consistent with the survivorship caveat.

  - sk_ref: sk_crl_0029
    fni: true
    lesson: 'The importance of intrigue (spine 64)'
    files: [images/pg119_1.jpg]
    photograph: "Sugar's, Davenport / Alec Soth / 2002"
    what_it_shows: >
      An unpeopled green room: floral armchair, brick fireplace with lamp, a mirror cut into the
      wall, a blind patched with tape, and a Hustler magazine face-up on the rug - objects that
      accumulate into an implied occupant and an unanswered story.
    verdict: claim_visible_in_photograph
    finding: >
      The "portrait with no person in it" is demonstrably that: the room withholds its occupant
      while its oddities (the magazine, the taped blind, the cut mirror) pose exactly the
      questions the prose says the picture poses. The mechanism claim about viewer retention is
      not figure-testable; the withholding construction is visible.

  - sk_ref: sk_crl_0030
    fni: false
    lesson: 'The power of a project (spine 65)'
    files: [images/pg121_1.jpg]
    photograph: "The Americans / Robert Frank / First published in 1958"
    what_it_shows: >
      The COVER of Frank's book (the New Orleans trolley photograph under the title and the
      Kerouac introduction credit) - a single reproduced artifact standing in for an 83-image
      sequence.
    verdict: claim_underdetermined_by_figure
    finding: >
      Reported honestly as the runbook asks: this is the one lesson whose claim CANNOT be
      demonstrated by its own reproduction. The claim is that meaning lives in the series'
      style-consistency and ORDER; one cover image cannot exhibit either property, and no
      sequence of frames from the book is reproduced. The figure identifies the case; it cannot
      carry the claim. The object's evidence remains Carroll's autobiographical report, exactly
      as the frozen caveats state.

