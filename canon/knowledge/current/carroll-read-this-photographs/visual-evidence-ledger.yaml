    photograph: "West Wall, Business Systems Division, Pertec, 1881 Langley, Costa Mesa from 'New Industrial Parks' / Lewis Baltz / 1974"
    what_it_shows: >
      A light brick wall occupying most of the frame, a dark garage door and entry door right of
