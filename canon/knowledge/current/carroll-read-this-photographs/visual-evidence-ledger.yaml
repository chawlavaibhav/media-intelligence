      remain unaddressable by page; the extraction's spread-title locators stay the right
      citation unit and all 30 re-resolve (locator_verification above).

  - pattern: false_page_affordance
    affects: "the book's own print-page cross-references, Index and Credits"
    detectability: named_by_text
    recoverability: recovered_in_this_copy
    evidence: >
      The file carries print-edition page references ("Alkan Hassan p. 21", "turn back to pages
      10, 16 and 22") with no page anchors - the trap the extraction recorded. This pass found
      the recovery route the text route could not see: image files are NAMED for their print
      pages, so every cross-reference to a PHOTOGRAPH's page resolves mechanically to an image
      file, verified on three independent references. References to prose pages remain
      unresolvable. The two content losses the extraction charged to this pattern are both
      recovered: the pages-10/16/22 exercise (row sk_crl_0019) and the focal-length table (row
      sk_crl_0021).

  - pattern: no_loss_detected
    affects: "the visual dimension of the extracted span"
    detectability: detected_by_independent_check
    recoverability: not_applicable
    evidence: >
      All 79 images are present, intact and openable; 73 were opened including the photograph
      behind every extracted object. Every printed credit (photographer, title, year) matches
      the caption facts the extraction recorded from the text stream. No image is missing, no
      placeholder appears, and no photograph contradicts the lesson written against it.

  - pattern: figure_inspected_claim_underdetermined
    affects: "sk_crl_0030 (a series says what no single photograph can)"
    detectability: detected_by_independent_check
    recoverability: unrecoverable_in_this_copy
    evidence: >
      The figure behind the lesson is the cover of The Americans. The claim is about properties
      of an ordered sequence; the copy reproduces one image and no sequence, so looking at the
      figure cannot settle the claim in principle. Not a defect of the copy so much as of the
      lesson's own evidence form; recorded so no later pass mistakes it for pending work.

demonstrations: []
visual_only_observations:
  - >
    The book argues visually in its own artifact: four photographs are reprinted as grey
    diagram variants with drawn eye-path arrows, construction lines or a thirds grid (pg10_1,
    pg13_2, pg21_2, pg23_2). For those spreads the claimed mechanism is not only asserted about
    the photograph - it is drawn onto it. The extraction, working text-only, could not know
    these diagrams exist; they strengthen the text-figure binding for sk_crl_0001, 0005 and
    0006 and add nothing that contradicts any object.
  - >
    Photograph-to-file binding drifts across spine boundaries: six spreads' photographs are
    emitted at the end of the preceding spine document (Getting close, Working the frame, Slow
    shutter at night, Compelling close-ups, Soft light can be flat, Composition is the key).
    Harmless once known - bindings were re-established from printed credits and print-page
    filenames - but a naive file-per-spread pass would mis-attribute six photographs.

extraction_constraint_check: >
  The frozen record's constraint holds as written: every object carries source_support: text,
  inspected.figures is empty everywhere, and no figure_refs are populated - correct for the
  extraction, which opened nothing. This ledger is the first figure-level record for the source
  and does not modify the frozen files.

claim_resolution_after_inspection: some_underdetermined
consequence: >
  The photographs are the book's evidence, and they check out: 29 of 30 lessons have their
  claimed demonstrations visible in the reproduced photographs (two of those as instructional
  charts/none-needed cases recorded as no_photograph_behind_lesson, one with a resolution
  limit noted), and one lesson (sk_crl_0030) is underdetermined by its figure in principle.
  The pass also recovered two pieces of content the extraction recorded as lost (the exercise
  page identities and the focal-length table) via the print-page image filenames. The central
  extraction hazard - half the bank resting on uninspected photographs - is resolved in the
  direction favourable to the source: Carroll's descriptions of his examples are accurate in
  every checked instance.
