  - sk_ref: sk_crl_0007
    fni: false
    lesson: 'Working the frame (spine 15)'
    files: [images/pg24_1.jpg]
    photograph: "42nd Street and Eighth Avenue / Lars Tunbjörk / 1997"
    what_it_shows: >
      A colour street scene through a chain-link fence: a grey foreground fencepost standing
      vertical, a yellow taxi passing fully visible in the gap between fence sections, a yellow
