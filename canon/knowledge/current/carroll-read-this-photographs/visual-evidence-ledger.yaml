    verdict: claim_visible_in_photograph
    finding: >
      The centred subject, the converging building lines, and the one saving asymmetric element
      (the bag) are all present and identifiable. The dose claim - that the bag is what keeps
      the balance from feeling phony - is an aesthetic reading, but the elements it is made of
      are exactly as described.

  - sk_ref: sk_crl_0006
