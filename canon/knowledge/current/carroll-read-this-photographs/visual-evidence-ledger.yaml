    fni: true
    lesson: 'Telephoto (spines 50-51)'
    files: [images/pg91_1.jpg, images/pg93_1.jpg]
    photograph: "Head #6 / Philip-Lorca diCorcia / 2001; and São Paulo, Brazil / René Burri / 1960"
    what_it_shows: >
      diCorcia: a middle-aged man in a suit isolated by strobe against blackness, unaware,
      photographed from far off past an out-of-focus foreground head - the concealed-observer
      condition made visible. Burri: from a rooftop, four men walk a roof deck while the avenue
      below reads as a flat vertical strip and the towers stack like layered cut-outs - depth
      visibly compressed, the image graphic rather than receding.
    verdict: claim_visible_in_photograph
    finding: >
      Both halves of the claim are demonstrated: subjects taken unaware at distance, and the
      flattening signature - the Burri's avenue genuinely reads as a strip laid flat on the
      picture plane. The "predatory" reading is a viewer-response claim outside what a figure
      can settle, as the frozen caveat already records.

  - sk_ref: sk_crl_0024
    fni: true
    lesson: 'Decisive moments (spine 56)'
    files: [images/pg103_1.jpg]
    photograph: "Spring Corner, New York / Melanie Einzig / 2000"
    what_it_shows: >
      A street corner at one instant: a courier bent under a bag in the foreground, a couple
      embracing behind him, a man crossing with a white cockatoo perched on his back, and a dog
      trotting through at the left - four unrelated elements coinciding in one frame.
    verdict: claim_visible_in_photograph
    finding: >
      The "beautifully odd quartet" is countable in the reproduction - four separate, unrelated
      elements visibly converging for a single moment, which is precisely the convergence
      definition the object extracts. That the arrangement dissolved a second later is a claim
      about time no still can show; the improbability of the caught arrangement is what the
      photograph itself carries.

  - sk_ref: sk_crl_0025
    fni: false
    lesson: 'The dangers of perfection (spine 57)'
    files: [images/pg105_1.jpg]
    photograph: "Landing of the American troops on Omaha Beach. Normandy, France. / Robert Capa / June 6th, 1944"
    what_it_shows: >
      A soldier low in the surf among beach obstacles; the frame is motion-blurred, grain-rough,
      tilted, with no considered composition - the technical flaws the argument rests on are
      plainly visible.
    verdict: claim_visible_in_photograph
    finding: >
      The photograph is exactly as described: technically failed and viscerally charged. Whether
      the flaws CAUSE the power is an interpretive claim; that the celebrated image carries
