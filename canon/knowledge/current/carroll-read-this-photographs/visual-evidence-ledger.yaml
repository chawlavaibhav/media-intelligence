    files: [images/pg29_1.jpg]
    photograph: "Francis Bacon, Primrose Hill / Bill Brandt / 1963"
    what_it_shows: >
      Bacon stands at the extreme left edge, gazing left OUT of the frame with almost no room
      before the edge; a lamp post runs up to make contact near the top edge; the path sweeps
