  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter 5, why the Braintrust is central"}
  arising_from: [sk_cat_c003_0021]

- term_id: t_cat_c003_0012
  term: identification_with_ones_own_idea
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: problem
  definition_in_origin_frame: >
