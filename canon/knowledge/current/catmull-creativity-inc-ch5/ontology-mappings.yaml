  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: remedy
  definition_in_origin_frame: >
    Give the reviewing group no authority to mandate anything, so criticism cannot arrive as an
    instruction from someone who outranks the maker.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter 5, two key differences"}
