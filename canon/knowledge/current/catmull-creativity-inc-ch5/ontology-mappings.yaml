# CANON-003 book 16 (Lane D) — "Creativity, Inc." ch.5. SPEC-05 ontology, source-local.
# Existing term kinds and relation types only. No new vocabulary was introduced.
#
# ONE THING TO READ BEFORE THE TERMS: every remedy in this source is an organisational or social
# action — change the word you use to ask for feedback, shrink the room, keep a dominating person
# out, phrase a note so the maker wants to act on it. SPEC-05 requires each remedy term to declare
# `executable_by`, whose permitted values are physical_production, generative_respecification,
# deterministic_composite, human_edit and unknown. None of those describes "change who is in the
# room". The honest value under the frozen vocabulary is `unknown`, and that is what is recorded,
# nine times. It should be read as "this vocabulary has no value for this kind of action", not as
# "we did not work out how to do it". Logged in the Lane D issue file.

source_id: catmull_creativity_inc_ch5_honesty_and_candor
extraction_date: 2026-08-24

terms:
- term_id: t_cat_c003_0001
  term: candor
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: property
  definition_in_origin_frame: >
    Forthrightness or frankness. The source's deliberate substitute for honesty, chosen because it
    carries no moral accusation and is understood as optional, so people can admit when they are
    withholding it.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter 5 opening"}
  arising_from: [sk_cat_c003_0002]

- term_id: t_cat_c003_0002
  term: lack_of_candor
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: problem
  definition_in_origin_frame: >
    People choosing not to say what they really think at work. The source says it is often
    rational, sometimes legitimate, and dysfunctional for a creative organisation if unchecked.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter 5 opening"}
  arising_from: [sk_cat_c003_0001]

- term_id: t_cat_c003_0003
  term: honestys_baggage
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: problem
  definition_in_origin_frame: >
    The moral freight the word honesty carries, which makes admitting that you withhold sound like
    confessing to a character defect, and so prevents the obstacles from being discussed at all.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter 5 opening"}
  arising_from: [sk_cat_c003_0001]

- term_id: t_cat_c003_0004
  term: braintrust
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: entity
  definition_in_origin_frame: >
    A recurring meeting, held every few months for each film in production, at which people with
    storytelling judgement watch the current rough version and say candidly what is not working.
    No fixed membership; no authority to mandate anything.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter 5, the Braintrust introduced"}
  arising_from: [sk_cat_c003_0004]

- term_id: t_cat_c003_0005
  term: reels
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: entity
  definition_in_origin_frame: >
    A crude mock-up of the whole film: storyboards edited together with temporary voices and music.
    The artefact the review group actually watches, regenerated every three to six months.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter 5, why candor matters"}
  arising_from: [sk_cat_c003_0008]

- term_id: t_cat_c003_0006
  term: good_note
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: remedy
  definition_in_origin_frame: >
    Feedback that says what is wrong, missing, unclear or senseless; arrives early enough to be
    acted on; demands nothing; offers any proposed fix only as an illustration; and is specific.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter 5, good notes"}
  arising_from: [sk_cat_c003_0015]
  executable_by: [unknown]

- term_id: t_cat_c003_0007
  term: unspecific_note
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: problem
  definition_in_origin_frame: >
    Feedback that reports the giver's reaction without locating anything in the work. The source's
    named failing example is a note saying only that the giver was writhing with boredom.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter 5, good notes"}
  arising_from: [sk_cat_c003_0015]

- term_id: t_cat_c003_0008
  term: prescriptive_note
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: problem
  definition_in_origin_frame: >
    A note that demands a specific remedy rather than surfacing the cause. The source rejects it on
    two grounds: the visible fault is usually not where the cause lies, and the group's fix is
    unlikely to be as good as the maker's.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter 5, diagnosis not prescription"}
  arising_from: [sk_cat_c003_0011]

- term_id: t_cat_c003_0009
  term: diagnose_the_cause_not_the_symptom
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: remedy
  definition_in_origin_frame: >
    Direct feedback at the underlying cause of a visible fault rather than at the fault itself, on
    the analogy of knee pain produced by fallen arches, where operating on the knee would make
    things worse.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter 5, diagnosis not prescription"}
  arising_from: [sk_cat_c003_0011]
  executable_by: [unknown]

- term_id: t_cat_c003_0010
  term: wrong_symptom_identified
  origin: source
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  kind: problem
  definition_in_origin_frame: >
    The reviewing group correctly senses that something is wrong and names the wrong cause. The
    source treats this as common and as still useful, because it makes the maker search.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter 5, additive not competitive"}
  arising_from: [sk_cat_c003_0017]

- term_id: t_cat_c003_0011
