    is what makes criticism unusable.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter 5, diagnosis not prescription"}
  arising_from: [sk_cat_c003_0013]

- term_id: t_cat_c003_0013
  term: remove_power_dynamics_from_the_feedback
