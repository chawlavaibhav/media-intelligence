relationships:
- from: t_cat_c003_0001
  to: t_cat_c003_0003
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    The source's central rhetorical move, and it insists on it: candor and honesty mean nearly the
    same thing, and the difference that matters is that only one of them accuses. Recorded as
    distinct_from because a merge on meaning would destroy the point the source is making.

- from: t_cat_c003_0020
  to: t_cat_c003_0006
  relation: broader_than
  confidence_basis: extractor_judgement
  note: >
    A good note is defined by its content — what it names and how specifically. Constructive
    criticism as the source's quoted director defines it adds a requirement about effect on the
    recipient. Every good note is not necessarily constructive in that stronger sense.

- from: t_cat_c003_0018
  to: t_cat_c003_0019
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    The source defines these against each other in one paragraph: additive contributes, competitive
    measures rival ideas against your own. The pair exists to be contrasted.

- from: t_cat_c003_0010
  to: t_cat_c003_0007
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked because both are notes that fail. They are not the same failure. An unspecific note
    locates nothing; a wrongly diagnosed note locates something precisely and gets the cause wrong.
    The source treats the first as useless and the second as often useful, so merging them would
    invert its judgement.

- from: t_cat_c003_0008
  to: t_cat_c003_0009
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    The source separates prescribing a remedy from surfacing a cause and builds the mechanism on the
    separation. Recorded as an explicitly stated opposition rather than as two shades of one idea.

- from: t_cat_c003_0011
  to: t_cat_c003_0004
  relation: related_to
  confidence_basis: source_stated
  note: "The condition, and the mechanism the source says exists to correct it."

- from: t_cat_c003_0013
  to: t_cat_c003_0012
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source states that removing the power to mandate is what keeps criticism aimed at the work
    rather than the person, so the remedy acts on the problem of self-identification.

- from: t_cat_c003_0015
  to: t_cat_c003_0016
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Both are the same lever — changing who is in the room — applied at different scales, one by
    shrinking the group and one by excluding an individual. The source never connects them.

- from: t_cat_c003_0023
  to: t_cat_c003_0008
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    The studio-notes practice the source rejects is its worked instance of prescriptive, late
    feedback from people the maker does not accept as peers. The source does not state the link in
    these terms.

- from: t_cat_c003_0021
  to: t_cat_c003_0002
  relation: related_to
  confidence_basis: source_stated
  note: "The named fears, and the withholding they produce."

concepts:
- concept_id: sc_cat_c003_good_notes
  kind: source_specific_concept
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  label: good_notes
  children_terms: [t_cat_c003_0006, t_cat_c003_0020, t_cat_c003_0018, t_cat_c003_0009]
  origin: source_stated
  basis: >
    "Good notes" is the source's own term for its constructive-criticism practice, introduced as the
    word Pixar uses for it. The source gives the definition, the failing example and the manner
    requirements together in the same closing section.
  asserts_agreement_between_sources: false

- concept_id: sc_cat_c003_braintrust_compact
  kind: source_specific_concept
  origin_ref: catmull_creativity_inc_ch5_honesty_and_candor
  label: the_braintrust_compact
  children_terms: [t_cat_c003_0004, t_cat_c003_0001, t_cat_c003_0013, t_cat_c003_0005]
  origin: extractor_inferred
  basis: >
    The source names "the compact upon which the meetings are based" and says protecting it is his
    main role, but never enumerates what is in it. Collecting the mechanism, its indispensable
    property, the removal of authority and the artefact reviewed under one concept is ours.
  asserts_agreement_between_sources: false

- concept_id: cc_cat_c003_barriers_to_disclosure
  kind: canonical_concept
  label: barriers_to_disclosure_in_review
  purpose: retrieval_and_aggregation
  created_by: extractor
  asserts_equivalence: false
  children_terms: [t_cat_c003_0002, t_cat_c003_0003, t_cat_c003_0021, t_cat_c003_0022]
  basis: >
    A retrieval grouping, ours, over this one source's several names for people not saying what they
    think. It claims no equivalence between them — the moral freight of a word, a set of fears, and
    frankness that happens in corridors instead of meetings are different things with the same
    consequence.
