    locator: "EPUB text/part0010.html, whole chapter"
    page_start: null
    page_end: null
    source_support: text

- scs_id: scs_cat_c003_002
  source_id: catmull_creativity_inc_ch5_honesty_and_candor
  label: why_people_withhold_and_what_acts_on_it
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    The source's account of silence in a review: the word honesty makes withholding undiscussable;
    deference to rank, group size, dominating colleagues and high stakes make people withhold; the
    fears involved regenerate after being addressed; and the two levers the source actually pulls
    are the vocabulary used to ask for the behaviour and the composition of the room.
  whole_system_claim:
    text: >
      Silence is treated as a produced effect with identifiable causes, not as a character defect,
      and the interventions therefore act on the causes — the word used to ask, and who is in the
      room — rather than on the people. Because the causes are structural, the source expects them
      to return and treats maintenance as permanent.
    origin: extractor_synthesis
    interpretation_basis: >
      The source states each cause and each intervention separately across the chapter and never
      draws them into a model. The causal reading is supported directly by the source's own
      sequence — it names the barriers, then says they reassert themselves, then describes shrinking
      the room and excluding a dominating figure as its responses — but the model is ours.
    source_ref: null
  members:
    - {sk_ref: sk_cat_c003_0001, role_in_system: cause, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_cat_c003_0006, role_in_system: cause, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_cat_c003_0005, role_in_system: persistence_property, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_cat_c003_0002, role_in_system: intervention, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_cat_c003_0016, role_in_system: intervention, order: 5, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: causal, origin: extractor_inferred}
    dependencies:
      - {from: sk_cat_c003_0002, to: sk_cat_c003_0001, nature: "the vocabulary change is the source's stated response to the moral freight of honesty", origin: source_stated}
      - {from: sk_cat_c003_0016, to: sk_cat_c003_0006, nature: "shrinking the room and excluding a dominating presence act on group size and intimidation, two of the stated causes", origin: extractor_inferred}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
