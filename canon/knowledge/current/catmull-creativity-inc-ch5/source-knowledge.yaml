- sk_id: sk_cat_c003_0010
  source_id: catmull_creativity_inc_ch5_honesty_and_candor
  source_terms:
    - "the Braintrust has no authority"
    - "By removing from the Braintrust the power to mandate solutions, we affect the dynamics of the group"
  concept_label: the_reviewing_group_must_hold_no_power_to_mandate
  label_origin: extractor_assigned
  claim: >
    The second named difference, and the one the source calls crucial: the group cannot compel
    anything. The director need not follow any specific suggestion and decides afterwards how to
    respond. Because nobody is pulling rank, the source says defensiveness rarely appears and the
    pain of being told the work is flawed is reduced.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Removing the power to mandate removes the power dynamic, which is what turns criticism of
      the work into a threat to the person.
  scope:
    domain_discussed_by_source: [animated_film_production, creative_organisations]
    conditions: "a review where the reviewers outrank or could overrule the maker"
  caveats:
