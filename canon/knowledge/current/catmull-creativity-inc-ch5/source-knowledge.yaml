- sk_id: sk_cat_c003_0001
  source_id: catmull_creativity_inc_ch5_honesty_and_candor
  source_terms:
    - "there are often good reasons not to be honest"
    - "we need to free ourselves of honesty's baggage"
  concept_label: honesty_carries_moral_freight_that_suppresses_disclosure
  label_origin: extractor_assigned
  claim: >
    Asking people to be honest is self-defeating in a work setting. Because dishonesty reads as a
    moral failing, the word makes the topic undiscussable: admitting you hold back becomes an
    admission of being a bad person, so people neither hold back less nor say that they do.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The moral connotation attaches a penalty to the admission rather than to the behaviour, so
      the behaviour continues and the discussion of it stops.
  scope:
    domain_discussed_by_source: [creative_organisations, film_production, management]
    conditions: "workplace interaction where the speaker perceives a cost to speaking"
  caveats:
    - text: "the source itself lists legitimate reasons to withhold — politicians, CEOs with the press, not embarrassing a colleague"
      origin: source_stated
    - text: "the claim is about the effect of a word on a conversation and is asserted, never measured"
      origin: extractor_observed
  source_stated_problems:
    - "lack of candor"
    - "our own fears and instincts for self-preservation often cause us to hold back"
  source_stated_remedies:
    - "replace the word honesty with another word that has a similar meaning but fewer moral connotations: candor"
