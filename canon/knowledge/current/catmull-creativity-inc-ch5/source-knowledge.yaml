- sk_id: sk_cat_c003_0004
  source_id: catmull_creativity_inc_ch5_honesty_and_candor
  source_terms:
    - "Put smart, passionate people in a room together, charge them with identifying and solving problems, and encourage them to be candid with one another"
    - "meets every few months or so to assess each movie we're making"
  concept_label: the_braintrust_as_a_standing_peer_review_of_work_in_progress
  label_origin: extractor_assigned
  claim: >
    The mechanism is a recurring meeting, held every few months for each film in production, at
    which a group of people skilled in storytelling watch the current rough version and say what
    is not working. Its size and composition vary with what is being examined; membership is not
    a fixed list. The source calls it Pixar's version of peer review.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Its indispensable element is candor: without candor there is no trust, and without trust
      creative collaboration is not possible.
  scope:
    domain_discussed_by_source: [animated_film_production, creative_organisations]
    conditions: "a long creative project passing through many revisions"
  caveats:
    - text: "the source says it is not foolproof and that its interactions sometimes only highlight how hard candor is"
      origin: source_stated
    - text: "the group grew from five people who already worked together exceptionally well; the source does not claim the mechanism would have formed without them"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
