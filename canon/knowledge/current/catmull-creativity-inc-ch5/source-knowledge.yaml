- sk_id: sk_cat_c003_0008
  source_id: catmull_creativity_inc_ch5_honesty_and_candor
  source_terms:
    - "A new version of the movie is generated every three to six months, and the process repeats itself"
    - "reels"
  concept_label: fixed_cadence_review_loop_over_a_cheap_stand_in_for_the_work
  label_origin: extractor_assigned
  claim: >
    The review runs against a deliberately crude stand-in for the finished film: storyboards cut
    together with temporary voices and music, called reels. The group watches that version,
    discusses what is not ringing true, a new version is produced every three to six months, and
    the loop repeats. The source gives an order-of-magnitude figure for the cost of this loop —
    about twelve thousand storyboard drawings for one 90-minute reel, and story teams commonly
    making ten times that number before they are done.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [animated_film_production]
    conditions: "a production long enough to support repeated full-length revisions"
  caveats:
