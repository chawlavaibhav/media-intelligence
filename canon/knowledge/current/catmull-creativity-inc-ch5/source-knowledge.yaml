- sk_id: sk_cat_c003_0006
  source_id: catmull_creativity_inc_ch5_honesty_and_candor
  source_terms:
    - "societal conditioning discourages telling the truth to those perceived to be in higher positions"
    - "The more people there are in the room, the more pressure there is to perform well"
  concept_label: withholding_is_produced_by_status_group_size_and_stakes
  label_origin: extractor_assigned
  claim: >
    Silence in a review has identifiable causes rather than being a personal failing: deference to
    perceived rank, the number of people watching, confident colleagues signalling that criticism
    is unwelcome, and the creator's sense that the work is under attack when the stakes are high.
    The source describes the newcomer's calculation directly — not dishonesty, but not wanting to
    look like an idiot.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Under threat the creator's attention shifts to reading subtexts and fending off perceived
      attacks, which is attention not spent on the problem.
  scope:
