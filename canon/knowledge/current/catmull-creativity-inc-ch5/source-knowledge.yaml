- sk_id: sk_cat_c003_0002
  source_id: catmull_creativity_inc_ch5_honesty_and_candor
  source_terms:
    - "Candor is forthrightness or frankness"
    - "You cannot address the obstacles to candor until people feel free to say that they exist"
  concept_label: name_the_behaviour_so_that_withholding_it_is_admissible
  label_origin: extractor_assigned
  claim: >
    Use "candor" instead. It means much the same thing but carries no accusation, so people can
    say out loud that they sometimes hold their tongues — and the obstacles cannot be worked on
    until they can be named without penalty. Because candor is understood as optional, the source
    argues that when it is given it tends to be genuine.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Nobody is thought a bad person for being less than candid, so admitting the barrier costs
      nothing; and a thing freely given rather than owed is more likely to be meant.
  scope:
    domain_discussed_by_source: [creative_organisations, management]
    conditions: "any group being asked for critical feedback"
  caveats:
    - text: "the source concedes the two words are 'not so different, really' and rests the distinction entirely on common usage"
      origin: source_stated
    - text: "an English-language claim about connotation; the source does not consider whether it survives translation or another professional culture"
      origin: extractor_observed
  source_stated_problems:
    - "people will not admit the obstacles to candor exist"
  source_stated_remedies:
    - "ask for candor rather than demand honesty"
  examples:
    positive: []
    counter: []
