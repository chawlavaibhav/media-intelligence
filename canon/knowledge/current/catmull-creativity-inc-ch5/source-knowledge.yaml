- sk_id: sk_cat_c003_0017
  source_id: catmull_creativity_inc_ch5_honesty_and_candor
  source_terms:
    - "Sometimes the Braintrust will know something's wrong, but they will identify the wrong symptom"
    - "it helped him find a solution even though it failed to diagnose what was truly amiss"
  concept_label: a_correct_alarm_with_a_wrong_diagnosis_is_still_useful
  label_origin: extractor_assigned
  claim: >
    A reviewing group's detection that something is wrong can be reliable while its account of what
    is wrong is mistaken, and the mistaken account still has value because it forces the maker to
    search. The source's recounted case: reviewers said a scene's dialogue made a character seem
    to be bullying his wife and told the director to rewrite it. The director judged the dialogue
    right, looked further, and found the real cause was scale — one character drawn far larger
    than the other. He changed the drawing so she stood at matching size, changed no dialogue, and
    the same reviewers asked which lines he had rewritten.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The reviewers were responding to what was on the screen; the felt effect was produced by the
      relative size of the two figures rather than by the words, so the note named the wrong
      carrier of a correctly perceived problem.
