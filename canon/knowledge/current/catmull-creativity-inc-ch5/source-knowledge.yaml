- sk_id: sk_cat_c003_0011
  source_id: catmull_creativity_inc_ch5_honesty_and_candor
  source_terms:
    - "While problems in a film are fairly easy to identify, the sources of those problems are often extraordinarily difficult to assess"
    - "intended to bring the true causes of problems to the surface—not to demand a specific remedy"
  concept_label: symptoms_are_visible_causes_are_not_so_notes_target_causes
  label_origin: extractor_assigned
  claim: >
    A visible fault — a mystifying plot twist, an unbelievable change of heart — is usually caused
    by something else elsewhere in the story. The group's job is therefore to surface the real
    cause rather than to prescribe a fix for the symptom. The source also gives a second reason
    for not prescribing: it believes the group's solution is unlikely to be as good as the one the
    director and their team will find.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The source's analogy is a patient with knee pain caused by fallen arches: operating on the
      knee would not relieve the pain and could easily make it worse.
  scope:
    domain_discussed_by_source: [animated_film_production, storytelling]
    conditions: "a complex artefact whose faults surface far from their causes"
  caveats:
    - text: "the source gives no method for finding the true cause beyond patience, candor and discussion"
      origin: extractor_observed
  source_stated_problems:
    - "a mystifying plot twist"
    - "a less-than-credible change of heart in our main character"
  source_stated_remedies:
    - "bring the true causes of problems to the surface"
