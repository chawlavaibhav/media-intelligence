# CANON-003 book 16 (Lane D) — Ed Catmull with Amy Wallace, "Creativity, Inc." (2014),
# chapter 5, "Honesty and Candor". Fresh SPEC-03 extraction under the frozen CANON-002-era method.
# Granularity: CANON-001 V0 rule, unchanged — split when a claim can be retrieved, supported,
# contradicted or qualified independently; do not split for a further example or restatement.
# Visual completeness: verified_figure_level (the chapter has no figures; see the ledger).
#
# SECTION RATIONALE: chapter 5 is the chapter in which the book states its central operating
# mechanism — the Braintrust — defines it, gives its preconditions, its failure modes and its
# unit of feedback ("a good note"), and shows it running. It is the densest chapter of reasoning
# in the book and is self-contained: it opens by posing the problem (why people withhold) and
# closes by generalising the mechanism to readers outside Pixar.
#
# NOTE ON THIS SOURCE'S SHAPE, recorded rather than smoothed over:
# this is organisational-process knowledge from one company, told by that company's president.
# Its evidence is overwhelmingly practitioner assertion plus recounted incidents from the same
# organisation, with mechanisms often given but never measured. There is no visual argument, no
# controlled comparison, and no counterexample from a company where the mechanism failed. That
# profile is recorded in evidence.characteristics on every object, not compensated for.

