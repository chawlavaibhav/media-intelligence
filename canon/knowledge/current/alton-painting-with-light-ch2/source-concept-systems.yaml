- scs_id: scs_alt_c003_003
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  label: what_illumination_is_for
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: source_stated
  description: >
    The source's own statement of purpose — quantity, meaning correct exposure everywhere, and
    quality, meaning four numbered values: orientation, mood, pictorial beauty and depth — together
    with what it goes on to say about each: the camera as the audience's eye under orientation, the
    genre key and the dramatic contour under mood, and the dark-to-light progression under depth.
  whole_system_claim:
    text: >
      Quantity and quality are stated as separable, and the source sharpens the separation later by
      insisting that a daylight feeling cannot be produced by overexposing: mood comes from the
      character of the light, not its level. The four quality values are numbered but never ranked,
      and the chapter's own material shows them competing — the genre key can override the
      requirement that light agree with its source, and the two depth rules pull in different
      directions.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {locator: "The Purpose of Illumination, anchor page0149"}
  members:
    - {sk_ref: sk_alt_c003_0013, role_in_system: framing_claim, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0014, role_in_system: value_orientation, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0018, role_in_system: value_mood, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0022, role_in_system: value_mood, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0023, role_in_system: value_mood, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0017, role_in_system: value_depth, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0025, role_in_system: separating_claim, order: 7, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: source_numbered, origin: source_stated}
    dependencies:
      - {from: sk_alt_c003_0022, to: sk_alt_c003_0018, nature: "the dramatic contour is what the drama key means in practice", origin: source_stated}
      - {from: sk_alt_c003_0025, to: sk_alt_c003_0013, nature: "the claim that mood comes from quality rather than quantity sharpens the twofold purpose", origin: extractor_inferred}
    tradeoffs: []
    conflicts:
      - between: [sk_alt_c003_0018, sk_alt_c003_0011]
        nature: >
          The chapter requires the key to appear to come from an established source, then exempts
          musical comedy entirely — for that genre, it says, light sources and logic in lighting
          mean nothing. The source states both approvingly and does not address the exemption.
        origin: extractor_inferred
        source_ref: null
      - between: [sk_alt_c003_0015, sk_alt_c003_0017]
        nature: >
          Two depth rules in the same section. One is symmetrical: separate foreground from
          background in tone, in either direction. The other has a preferred direction: the most
          distant spot should be the lightest. A dark distant background satisfies the first and
          violates the second, and the source does not reconcile them.
        origin: extractor_inferred
        source_ref: null
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The twofold purpose, the four numbered values and their order are the source's own, stated
      under its own heading, so the frame is reported rather than synthesised. Both recorded
      conflicts are ours: the source does not notice either, and a reader who treated the genre key
      as simply overriding the source-agreement rule would find no contradiction at all.
  provenance:
    chapter: "2 — Motion Picture Illumination"
    locator: "EPUB index_split_001.html, anchor page0149"
