# CANON-003 book 8 (rebalance lane) — "Painting With Light" ch.2. SourceConceptSystems under SPEC-03.
# Three systems. The first is a vocabulary the source declares under its own heading; the second is
# the working sequence of a shooting day, which the source demonstrates in order but never names as
# a procedure; the third is what lighting is for, which the source states and then partly undercuts.
source_id: alton_painting_with_light_ch2_motion_picture_illumination
source_concept_systems:

- scs_id: scs_alt_c003_001
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  label: the_named_light_functions
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: source_stated
  description: >
    The studio's vocabulary of lights, given by the source under one heading: key or principal,
    clothes, front, cross, top, cross back or kicker, back, eye, and fill. Each is defined by where
    it comes from, what it acts on, or what job it does, and the chapter's central correction — key
    plus filler, kicker and backlight — is stated entirely in these terms.
  whole_system_claim:
    text: >
      The lights are not a list of options but a division of one job into parts. The source's own
      demonstration shows why: a single source renders a round object flat, and roundness comes back
      only when three further lights with different positions and different purposes are added. Each
      name marks a contribution to modelling, separation or exposure that the others do not make.
    origin: extractor_synthesis
    interpretation_basis: >
      The source lists the designations under a heading without saying they form a system, and
      separately states the four-light correction. Reading the list as a decomposition of one job,
      and treating the sphere demonstration as the argument for that reading, is ours. The evidence
      for it is that the correction is stated using exactly these names and no others.
    source_ref: null
  members:
    - {sk_ref: sk_alt_c003_0007, role_in_system: vocabulary, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0008, role_in_system: organising_analogy, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0009, role_in_system: demonstration, order: 3, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies:
      - {from: sk_alt_c003_0009, to: sk_alt_c003_0007, nature: "the correction is stated in the named roles — filler, kicker, backlight added to the key", origin: source_stated}
      - {from: sk_alt_c003_0008, to: sk_alt_c003_0009, nature: "the source presents the daylight analogy immediately before the flat-object problem, as its justification", origin: source_stated}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, controlled_comparison, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The vocabulary, its heading and the four-light correction are the source's. What is ours is
      the claim that the names constitute a decomposition rather than an inventory. A reader could
      take them as a glossary of positions with no systematic relation; the sphere pair is the
      evidence against that reading, and it is evidence we are interpreting, not a statement the
      source makes.
  provenance:
