- scs_id: scs_alt_c003_002
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  label: the_working_order_of_lighting_a_scene
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: extractor_inferred
  description: >
    The order in which the chapter's second half proceeds, and in which the work is actually done:
    choose the camera angle that shows the most surfaces; decide what the light is supposed to be
    coming from and place the key so it agrees; meter the key and the overall balance for the mood
    wanted; add broads and place the filler near the camera to avoid multiple shadows; rough in the
    background and non-acting areas, crosslighting the walls by a stated order of preference;
    rehearse; light the faces individually; shoot, with seven things checked during the take. The
    hour recipes and the window cases are then variations executed inside this order.
  whole_system_claim:
    text: >
      Lighting is treated as a sequence of commitments in which each step constrains the next, and
      the order is not arbitrary: the angle decides what surfaces exist to be lit, the fictional
      source decides where the key may go, the key decides what the filler has to correct, and the
      rehearsal is what reveals that the rough lighting was insufficient for the faces. The recipes
      later in the chapter are edits within this order rather than alternatives to it.
    origin: extractor_synthesis
    interpretation_basis: >
      The source presents these as consecutive sections of instruction and never names them as a
      procedure or numbers them. Two of the dependencies are the source's own — it says the key
      position must satisfy the established source, and it shows the rehearsal exposing underlit
      faces. Reading the whole as one ordered procedure with each step constraining the next is
      ours.
    source_ref: null
  members:
    - {sk_ref: sk_alt_c003_0010, role_in_system: step, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_alt_c003_0011, role_in_system: step, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0012, role_in_system: step, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0019, role_in_system: step, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0020, role_in_system: step, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_alt_c003_0015, role_in_system: constraint, order: 6, membership_origin: extractor_inferred}
    - {sk_ref: sk_alt_c003_0024, role_in_system: variation, order: 7, membership_origin: extractor_inferred}
    - {sk_ref: sk_alt_c003_0026, role_in_system: variation, order: 8, membership_origin: extractor_inferred}
    - {sk_ref: sk_alt_c003_0027, role_in_system: variation, order: 9, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: procedural, origin: extractor_inferred}
    dependencies:
      - {from: sk_alt_c003_0011, to: sk_alt_c003_0010, nature: "the light source is established for a scene already framed from a chosen angle", origin: extractor_inferred}
      - {from: sk_alt_c003_0012, to: sk_alt_c003_0011, nature: "the source states the balance is measured after the key position is found", origin: source_stated}
      - {from: sk_alt_c003_0020, to: sk_alt_c003_0019, nature: "the source shows the rehearsal exposing faces the rough lighting left muddy", origin: source_stated}
      - {from: sk_alt_c003_0024, to: sk_alt_c003_0011, nature: "each hour recipe begins by naming the source it imitates", origin: source_stated}
    tradeoffs:
      - between: [sk_alt_c003_0011, sk_alt_c003_0012]
        nature: >
          The key must both expose the scene correctly and appear to come from the established
          source. The source states both requirements and never says what to do when the position
          that satisfies one fails the other.
        origin: extractor_inferred
        source_ref: null
    conflicts: []
  source_warns_against_isolated_use: false
