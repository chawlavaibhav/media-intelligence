    ours, and that is recorded on the concept system rather than here.
  asserts_agreement_between_sources: false

- concept_id: sc_alt_c003_purpose_of_illumination
  kind: source_specific_concept
  origin_ref: alton_painting_with_light_ch2_motion_picture_illumination
  label: the_twofold_purpose_of_illumination
  children_terms: [t_alt_c003_0009, t_alt_c003_0010, t_alt_c003_0014]
  origin: source_stated
  basis: >
    "The purpose of illumination is twofold" is the source's own statement, with four numbered
    quality values under it. These terms are the ones that became operational in the chapter —
    the angle criterion, the separation remedy, and the genre key.
  asserts_agreement_between_sources: false

- concept_id: cc_alt_c003_flatness_causes
  kind: canonical_concept
  label: causes_of_a_flat_image
  purpose: retrieval_and_aggregation
  created_by: extractor
  asserts_equivalence: false
  children_terms: [t_alt_c003_0006, t_alt_c003_0008, t_alt_c003_0015, t_alt_c003_0017]
  basis: >
    A retrieval grouping, ours, over this source's named image defects. It asserts no equivalence: a
    single-source rendering, a doubled shadow, a contradiction with the established light direction,
    and blown-out exterior highlights are four different failures with four different corrections.
