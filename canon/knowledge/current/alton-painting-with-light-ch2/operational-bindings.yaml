- binding_id: bnd_alt_c003_0006
  source_knowledge_refs: [sk_alt_c003_0006, sk_alt_c003_0004, sk_alt_c003_0021, sk_alt_c003_0025]
  source_system_refs: []
  target_type: governance
  target_path: null
  governance_consumer: evidence_interpretation
  role: [flags]
  rationale: >
    A worked case of a source whose content ages at three different rates in the same chapter, and
    the Canon needs to be able to see the difference. The geometry does not date — a single source
    renders a solid flat, tones that match lose their edge, an angle reveals form. The technology
    dates completely — the instrument catalogue, the antihalo-film argument for shiny props, the
    requirement that every negative be normally exposed. And one claim is a studio convention of the
    period stated as technical fact: that high reflectors are unfavourable to feminine faces. All
    three carry `practitioner_assertion` and are indistinguishable by claim type alone.
  applicability:
    when: "weighing an older technical source whose physical claims and technological claims are interleaved"
    limits: >
      One source. It shows the pattern clearly because the three kinds sit within a few pages of
      each other. It offers no rule for separating them automatically — the separation here was made
      by reading, and `historical_claim` and `culturally_bounded` were applied by hand.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"
