- sk_id: sk_alt_c003_0007
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "Keylight, or principal light, is used to light either individuals or groups."
    - "Fill and filler light is a shadowless soft light, used to fill in when the keylight is too strong and the shadows are too deep."
    - "Cross backlight or kicker comes from the rear, either from up high, or from the floor."
  concept_label: lights_are_named_by_the_direction_they_come_from_and_the_job_they_do
  label_origin: extractor_assigned
  claim: >
    Under one heading the source gives the studio's vocabulary of light functions: keylight or
    principal light; clotheslight, to build up light on dark clothes; frontlight, from the camera's
    direction; crosslight, from either side, up or down, but always across; toplight, directly from
    above; cross backlight or kicker, from the rear high or from the floor; backlight, directly
    from behind; eyelight, placed at eye height, with almost no exposure value, reflecting only
    from the eyeballs; and fill or filler, a shadowless soft light used where the key is too strong
    and the shadows too deep.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
