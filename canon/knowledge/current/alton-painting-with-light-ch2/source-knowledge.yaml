- sk_id: sk_alt_c003_0019
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "First of all we must light the background and that part of the set in which the actors will not walk around. This is known as roughing it in."
    - "If you cannot use crosslight, toplight may be used. If that too is impossible, employ frontlight, but never from the exact camera height"
  concept_label: rough_in_the_set_by_a_stated_order_of_preference_for_light_direction
  label_origin: extractor_assigned
  claim: >
    The working order is background first, then the acting area. Within it the source gives a
    ranked fallback for wall lighting: back crosslight the side walls from the opposite high corner
    — the left wall from up high right, the right from up high left; if crosslight is impossible,
    use toplight; if that is impossible, use frontlight, but never from exactly camera height, and
    break the light up with shadows. It adds that side walls should be darker in the foreground and
    lighter towards the back, and that crosslighting does not merely light a set but accentuates
    its values, with shiny objects in the beam's path giving the set life.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Crosslight rakes across the surface and reveals its relief; frontlight from the lens axis
      flattens it, which is why frontlight is a last resort and must be displaced from camera
      height when used.
  scope:
    domain_discussed_by_source: [studio_lighting, set_lighting]
    conditions: "a three-wall interior set in a long shot"
  caveats:
    - text: "the mechanism sentence draws together the source's separate statements that crosslight accentuates values and that frontlight must never come from camera height; the source does not state the contrast in one place"
