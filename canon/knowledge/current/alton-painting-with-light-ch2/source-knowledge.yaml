- sk_id: sk_alt_c003_0021
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "Some people have the mistaken idea that a trucking or dolly shot is faster to light than a stationary one. Nothing could be further from the truth"
    - "High reflectors cause deep shadows, exaggerate cheekbones, make deep-set eyes, none of which are favorable to feminine faces."
  concept_label: a_moving_shot_must_satisfy_two_lighting_schemes_at_once
  label_origin: extractor_assigned
  claim: >
    A shot that moves from a long shot to a medium or close-up has to carry both lightings at once,
    which the source calls not an ideal condition. The specific conflict is stated: the long shot
    takes in the whole set so there can be no lights on the floor, while the closer shot needs them.
    The compromise is to suspend reflectors on ropes brought down almost to the upper camera line
    rather than rigging them high, and to mount dimmed reflectors on the dolly or crane and fade
    them in as the camera moves in.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Reflectors placed high cast deep shadows that exaggerate cheekbones and deepen eye sockets,
      which the source states is unfavourable for women's faces.
  scope:
