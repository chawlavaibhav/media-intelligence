- sk_id: sk_alt_c003_0003
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "In order to separate faces from the background, cold colors are usually recommended for the painting of sets."
    - "one warm color easily blends into another"
  concept_label: paint_sets_in_cold_colours_to_separate_faces_from_background
  label_origin: extractor_assigned
  claim: >
    Set colour matters even though most colours photograph acceptably in black and white, because
    warm colours blend into one another and faces are warm. Cold colours — several shades of blue
    are named — separate faces from the background, are faster to light, and give better results.
    The source concedes warm sets may please the cast, crew and visiting executives, and says that
    does not justify the resulting photography.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A warm-painted wall and a warm-toned face render at similar densities in monochrome, so the
      face has nothing to separate against.
  scope:
    domain_discussed_by_source: [set_construction, black_and_white_cinematography]
    conditions: "black-and-white photography; the source says so explicitly"
  caveats:
