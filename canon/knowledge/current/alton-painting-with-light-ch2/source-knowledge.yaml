- sk_id: sk_alt_c003_0027
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "There are times when we must improve upon nature's lighting."
    - "People have positive pictures (mental images) of the appearance of exteriors. Establish your light sources and light accordingly."
  concept_label: imitating_nature_exactly_can_fail_and_the_target_is_the_viewers_mental_image
  label_origin: extractor_assigned
  claim: >
    Two statements that qualify the chapter's realism. Simply imitating natural sunlight for a shot
    taken through a window from outside would burn out the wall and the window, so the light is
    shaded with gauze or a tree branch, the arc placed high to one side so it does not reflect in
    the glass, and a kicker added from inside to round the face — while backlight is omitted because
    it would not look natural. And when exteriors are built inside, the thing being matched is
    stated to be the audience's mental image of an exterior rather than the exterior itself.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Film cannot hold the range that the eye accepts outdoors, so an exact imitation overexposes;
      and the audience judges against a remembered picture, so the target is that picture.
  scope:
    domain_discussed_by_source: [cinematography, exterior_and_interior_exterior_lighting]
    conditions: "shooting through a window from outside; exteriors built on a stage"
  caveats:
    - text: "the mechanism sentence joins two statements the source makes in separate sections — that imitation would burn out the highlights, and that people hold mental images of exteriors. The source does not connect them"
      origin: extractor_observed
  source_stated_problems:
    - "if we simply imitate natural sunlight, the wall outside and the window will burn up"
  source_stated_remedies:
    - "shade the sunlight with gauze, a tree branch, or both"
    - "omit backlight where it would not look natural"
  examples:
