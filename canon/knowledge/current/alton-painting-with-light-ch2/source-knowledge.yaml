  label_origin: extractor_assigned
  claim: >
    Lighting is finished in two passes with a rehearsal between them. The rehearsal is walked with
    the principals while stand-ins watch, and it exposes what the rough lighting missed — the source
    gives an example in which the faces went muddy as the actors crossed the set. Individual
    keylights are then added and balanced with kickers, with the rule that in close shots the faces
    should be the lightest spots on the screen. During the take seven specific things are checked,
    including that no light moves, that there is no voltage drop, that actors return exactly to
    their marks, and that one actor does not shade another's face.
