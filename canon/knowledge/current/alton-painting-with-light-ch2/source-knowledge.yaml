  source_terms:
    - "We determine our light source, which may be either natural or artificial."
    - "By use of a small testlight we determine the position from which the light will properly illuminate the scene, and yet will appear as if coming from the reading lamp."
  concept_label: establish_the_fictional_light_source_first_then_place_the_key_to_agree_with_it
  label_origin: extractor_assigned
  claim: >
    The first act in lighting a scene is to decide where the light is supposed to be coming from —
    the source lists sunlight, moonlight, skyshine and the northern lights among natural sources,
    and street lights, headlights, lighthouses, a stage spotlight, flashlight, lantern, candle, oil
    burner, match, torch, fireplace, campfire and phosphorescence among artificial ones. The key
    light is then placed in the position that both lights the scene properly and appears to come
    from that source, and a small testlight is used to find it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [cinematography, lighting_practice]
    conditions: "any scene with an implied light source in the story world"
  caveats:
    - text: "the requirement that the key satisfy two conditions at once — correct exposure and plausible origin — is stated without saying what to do when they conflict"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "find the key position with a testlight"
