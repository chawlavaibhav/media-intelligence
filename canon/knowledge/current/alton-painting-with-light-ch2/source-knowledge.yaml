- sk_id: sk_alt_c003_0026
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "The old-fashioned way of lighting this was to light the window from the outside, and the person, in flat key from the inside. This two-way light produced a contradictory, confusing feeling."
    - "The average layman may not understand lighting, but every child can tell sunlight when he sees it."
  concept_label: light_from_one_consistent_direction_because_audiences_read_light_without_being_taught
  label_origin: extractor_assigned
  claim: >
    The source rejects the older practice of lighting a figure at a sunlit window from two
    contradictory directions — window from outside, face flatly from inside — because the result
    feels contradictory. Its replacement lights realistically from the established direction: an arc
    from outside, incandescent mixed in from the same direction, a weaker crosslight inside, and a
    heavily diffused broad beside the camera. The justification is that audiences read light without
    training, so subdued low-key faces with strong cross and backlight are now accepted without
    comment even in daylight shots.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A viewer who cannot describe lighting can still tell sunlight from something else, so light
      that contradicts its own established source is detected even when its cause is not.
  scope:
    domain_discussed_by_source: [cinematography, window_lighting]
    conditions: "a figure against a sunlit or moonlit window"
  caveats:
    - text: "the claim that audiences now accept low-key faces in daylight is a claim about the taste of one period's audience, offered without evidence"
      origin: extractor_observed
    - text: "the recipe includes a set-dressing prerequisite — a light blue curtain, which tolerates a stronger outside light than a white one — so the lighting solution depends on a decision made before shooting"
      origin: extractor_observed
  source_stated_problems:
    - "two-way light produced a contradictory, confusing feeling"
  source_stated_remedies:
    - "light realistically from the established direction, with an arc from outside"
