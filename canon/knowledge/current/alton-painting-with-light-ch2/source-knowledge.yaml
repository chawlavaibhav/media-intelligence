- sk_id: sk_alt_c003_0009
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "In interior lighting, if we use one light source, even a round object photographs flat"
    - "We correct this by adding to our keylight a filler, kicker, and backlight"
  concept_label: one_source_photographs_flat_and_three_more_lights_restore_roundness
  label_origin: extractor_assigned
  claim: >
    The chapter's foundational technical claim, and the one it demonstrates most carefully. Outdoors
    a single source — the sun — gives an impression of roundness, for two stated reasons: the
    varying reflective qualities around the object's circumference, and the eye's sensitivity to
    small differences in light density. In interior photography the same single source renders even
    a round object flat. The correction is three further lights added to the key: a filler, a
    kicker and a backlight.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The eye and the film do not respond alike to the gradations around a lit form, so the
      modelling the eye supplies outdoors has to be built by additional instruments indoors.
  scope:
    domain_discussed_by_source: [interior_cinematography, still_photography]
    conditions: "artificial interior lighting of a three-dimensional subject"
  caveats:
    - text: "the demonstration is a photographic minimal pair — the same sphere under one light and under four — and it is the clearest controlled comparison in the chapter"
      origin: extractor_observed
    - text: "the photographs show that the correction worked; which three lights were added, and in what positions, is carried only by the sentence"
      origin: extractor_observed
  source_stated_problems:
    - "even a round object photographs flat"
  source_stated_remedies:
    - "add a filler, kicker and backlight to the keylight"
  examples:
    positive:
      - {description: "the same sphere lit by four lights, reading as a solid ball with graded falloff and a separating rim", figure_ref: "Fig. 76"}
    counter:
