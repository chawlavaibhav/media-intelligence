- sk_id: sk_alt_c003_0010
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "The more surfaces of an object that are visible, the better will be the picture."
    - "Because the screen in the motion picture theatre is a one-dimensional flat surface"
  concept_label: the_best_angle_is_the_one_showing_the_most_surfaces
  label_origin: extractor_assigned
  claim: >
    Camera position is decided by a stated criterion rather than by taste: because the screen is
    flat, photograph from the angle that shows the most surfaces of the subject. The source teaches
    it on a wooden block — face on, one of six faces is visible; move to one side, two; raise the
    camera slightly, three; move further and nothing improves, so that is the best angle. It then
    says the same reasoning scales from a block to a piece of furniture, a window, a vase of
    flowers, or a set full of people.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The screen cannot supply depth of its own, so the depth in the image has to come from how
      much of the object's form the angle reveals.
  scope:
    domain_discussed_by_source: [camera_angle, composition, cinematography]
    conditions: "photographing any solid object"
  caveats:
    - text: "the rule maximises revealed surface and says nothing about what else an angle must do — narrative position, eyelines, or the frame's composition are outside it"
      origin: extractor_observed
    - text: "the source's own escalation from a block to a set full of people is asserted, not demonstrated"
      origin: extractor_observed
  source_stated_problems:
    - "facing it straight on, all we can see is one surface"
  source_stated_remedies:
    - "move the camera to one side and raise it until no further surface is gained"
  examples:
    positive:
      - {description: "the wooden block photographed from successively better angles, showing one, two and three of its six surfaces", figure_ref: "Figs. 77-79"}
    counter: []
  intra_source_relations:
