- sk_id: sk_alt_c003_0018
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "The key of the picture (not to be confused with keylight) depends upon the category of the screen play."
    - "Musical comedies are lit high and brilliant with a stylized, dreamlike light. For this type of photography, light sources and logic in lighting mean nothing."
  concept_label: genre_sets_the_key_of_the_whole_picture_before_any_scene_is_lit
  label_origin: extractor_assigned
  claim: >
    Before scenes are worked out, a decision is made at the level of the whole film. The source
    names three categories from the point of view of illumination — comedy, subdivided into musical
    and slapstick; drama; and mystery — each requiring a different approach. Once the key of the
    picture is decided, the script is broken down into sequences and scenes and each mood is worked
    out separately. For musical comedy, the source states that light sources and logic in lighting
    mean nothing; comedy is lit as high as the stock and laboratory allow without becoming
    senselessly flat, because a low-key scene would spoil the comic effect.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Photography, like music, has a psychological effect: you would not play someone a sad cello
      solo to make them laugh, and lighting that works against the intended response has to be
      avoided.
  scope:
    domain_discussed_by_source: [cinematography, genre]
    conditions: "a whole production, decided before scene work"
  caveats:
