- sk_id: sk_alt_c003_0024
  source_id: alton_painting_with_light_ch2_motion_picture_illumination
  source_terms:
    - "Take the light prepared for a dawn effect, build up the outside with a few additional Duares, build up the interior lighting from up high and also with frontlight, take the diffusers off the arcs shining in through the window, and you have the light ready for a sunrise scene."
    - "we cannot use the same window for both unless we change the direction of the light, as everyone knows that the sun rises on one side of the house and sets on the other"
  concept_label: the_hours_are_lit_as_incremental_edits_to_one_standing_setup
  label_origin: extractor_assigned
  claim: >
    The recipes are written as differences rather than as independent setups. Dawn is built from
    several well-diffused reflectors crisscrossed to establish an unmistakably exterior source, with
    no undiffused arc because an arc throws sharp shadows. Sunrise is that same rig plus extra
    instruments outside, more interior light from high and from the front, and the diffusers taken
    off the window arcs. Breakfast is sunrise with the wall shadows moved and the key density raised.
    Moonlight at a window is the daylight scheme minus the light on the backing and minus the front
    filler. The source also states a continuity constraint: the same window cannot serve for both
    sunrise and sunset unless the light direction changes, because the sun rises on one side of a
    house and sets on the other.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Each hour differs from its neighbour in a small number of controllable properties — how
      diffused the source is, how high the key sits, where the shadow falls, whether the backing is
      lit — so the hours form a series rather than a set of unrelated arrangements.
  scope:
    domain_discussed_by_source: [interior_cinematography, lighting_recipes]
    conditions: "a standing interior set photographed at different implied hours"
  caveats:
    - text: "the mechanism sentence names the pattern; the source demonstrates it by writing each recipe as an edit to the last but never states it as a principle"
      origin: extractor_observed
    - text: "the recipes are stated in period instrument names, and their geometry is carried by plan diagrams rather than by the prose"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
