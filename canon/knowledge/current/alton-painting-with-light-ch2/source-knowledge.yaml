# CANON-003 book 8 (rebalance lane) — John Alton, "Painting With Light" (1949; UC Press 1995
# reprint), chapter 2, "Motion Picture Illumination", complete.
# Fresh SPEC-03 extraction under the frozen CANON-002-era method. V0 granularity rule, unchanged.
# Visual completeness: verified_figure_level.
#
# SECTION RATIONALE: chapter 2 is the book's systematic core. It defines the objects lighting acts
# on, names the studio's vocabulary of light functions, states the theory (why one source is not
# enough, what makes an angle good, how depth is produced), states what illumination is *for*, and
# then runs a complete working day from roughing in to the take, followed by a set of recipes for
# specific hours and situations. Chapter 3, "Mystery Lighting", applies this to one genre; chapter
# 2 is where the reasoning system itself is on the page.
#
# NOTE ON THIS SOURCE'S SHAPE, recorded rather than smoothed over:
# a 1949 studio cinematographer writing for practitioners. Three kinds of content sit side by side
# and age very differently — physical geometry that does not change, film-stock and equipment
# specifics that are obsolete, and studio conventions of the period including one claim about
# women's faces that is stated as technical fact. The evidence characteristics distinguish them;
# nothing was modernised, softened or dropped.
#
# PROVENANCE CONVENTION: this file's `pageNNNN` anchors are NOT printed pages — they run past 0527
# in a book of under 200 printed pages, so they are file-internal position markers. Provenance
# therefore cites the chapter, the section name recovered by the visual pass, and the anchor id.

