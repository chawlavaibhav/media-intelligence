terms:
- term_id: t_vig_c003_0001
  term: semantics
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: property
  definition_in_origin_frame: >
    The search for the meaning of whatever is to be designed — the source's first aspect of design.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Semantics"}
  arising_from: [sk_vig_c003_0002]

- term_id: t_vig_c003_0002
  term: syntactics
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: property
  definition_in_origin_frame: >
    The appropriate relationship between a project's elements — grid, typefaces, text, headlines,
    illustrations — which is what provides a design's consistency.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Syntactics"}
  arising_from: [sk_vig_c003_0003]

- term_id: t_vig_c003_0003
  term: pragmatics
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: property
  definition_in_origin_frame: >
    Whether the work is understood at the point of use. The source's third aspect, and the one that
    voids the other two if it fails.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Pragmatics"}
  arising_from: [sk_vig_c003_0004]

- term_id: t_vig_c003_0004
  term: discipline
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: property
  definition_in_origin_frame: >
    A set of self-imposed rules and parameters within which the designer operates, giving consistency
    from beginning to end and continuity of intent rather than fragmentation.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Discipline"}
  arising_from: [sk_vig_c003_0005]

- term_id: t_vig_c003_0005
  term: appropriateness
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: property
  definition_in_origin_frame: >
    The search for the specific of any given problem; the area of solutions the semantic search
    defines as fitting that problem. The source says it transcends style.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Appropriateness"}
  arising_from: [sk_vig_c003_0006]

- term_id: t_vig_c003_0006
  term: ambiguity
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: property
  definition_in_origin_frame: >
    Used positively by the source: a plurality of meanings, the possibility of a design being read in
    several complementary ways that enrich it. Not vagueness.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Ambiguity"}
  arising_from: [sk_vig_c003_0007]

- term_id: t_vig_c003_0007
  term: intellectual_elegance
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: property
  definition_in_origin_frame: >
    The source's governing standard: a sublime level of intelligence, distinguished from elegance of
    manners, and explicitly not a design style but the essence of design.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Intellectual Elegance"}
  arising_from: [sk_vig_c003_0010]

- term_id: t_vig_c003_0008
  term: visual_power
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: property
  definition_in_origin_frame: >
    Creative strength expressed in form and colour, where every element expresses the content
    forcefully. The source holds it can be achieved with delicate means as well as bold ones.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Visual Power"}
  arising_from: [sk_vig_c003_0009]

- term_id: t_vig_c003_0009
  term: logo_equity
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: property
  definition_in_origin_frame: >
    The accumulated public recognition a mark acquires through long exposure, which the source treats
    as an asset to be protected rather than replaced.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Equity"}
  arising_from: [sk_vig_c003_0013]

- term_id: t_vig_c003_0010
  term: visual_vulgarity
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: problem
  definition_in_origin_frame: >
    Mere visual impact mistaken for visual strength; the source calls it obtrusiveness and sets it
    against intellectual elegance.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Visual Power"}
  arising_from: [sk_vig_c003_0009]

- term_id: t_vig_c003_0011
  term: change_for_the_sake_of_change
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: problem
  definition_in_origin_frame: >
    Redesigning an established mark from a desire for novelty rather than need. The source calls it a
    very wrong motivation.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Equity"}
  arising_from: [sk_vig_c003_0013]

- term_id: t_vig_c003_0012
  term: culture_of_obsolescence
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: problem
  definition_in_origin_frame: >
    The demand for temporary solutions and the waste of energy and capital for the sake of novelty;
    the source pairs it with the culture of waste and the cult of the ephemeral.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Timelessness"}
  arising_from: [sk_vig_c003_0011]

- term_id: t_vig_c003_0013
  term: work_that_fails_to_communicate
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: problem
  definition_in_origin_frame: >
    Work not understood at the point of fruition, which the source says is wasted effort however
    correct it may be semantically and syntactically.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Pragmatics"}
  arising_from: [sk_vig_c003_0004]

- term_id: t_vig_c003_0014
  term: search_the_meaning_before_designing
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: remedy
  definition_in_origin_frame: >
    Begin every assignment by researching the subject's history, context and users to establish what
    it means, before any form is proposed.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "Semantics"}
  arising_from: [sk_vig_c003_0002]

- term_id: t_vig_c003_0015
  term: contrast_scale_and_weight_for_visual_strength
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: remedy
  definition_in_origin_frame: >
    Use difference of scale within a page, and bold type against light type, to produce visually
    dynamic impact; in three dimensions, manipulate light through differing textures and materials.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit, deterministic_composite, generative_respecification]
  source_ref: {locator: "Visual Power"}
  arising_from: [sk_vig_c003_0009]

- term_id: t_vig_c003_0016
  term: retouch_an_established_mark_rather_than_replace_it
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: remedy
  definition_in_origin_frame: >
    Where a mark has long public exposure, propose a light adjustment for contemporary application
    instead of a new design.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "Equity"}
  arising_from: [sk_vig_c003_0013]

- term_id: t_vig_c003_0017
  term: use_primary_shapes_and_colours_for_timelessness
  origin: source
  origin_ref: vignelli_canon_part_one_intangibles
  kind: remedy
  definition_in_origin_frame: >
    Prefer primary shapes and primary colours, and typography that does not follow trends, on the
    grounds that their formal values are timeless.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit, generative_respecification]
  source_ref: {locator: "Timelessness"}
  arising_from: [sk_vig_c003_0011]

relationships:
- from: t_vig_c003_0008
  to: t_vig_c003_0010
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    The source draws this distinction explicitly and insists on it: visual strength is an expression
    of intellectual elegance, while mere visual impact is usually vulgarity and obtrusiveness. The
    two are easily conflated because both describe a forceful page, which is why the source separates
    them by name.

- from: t_vig_c003_0006
  to: t_vig_c003_0013
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked because both concern a reader not arriving at a single settled meaning. They are opposites
    in this source. Ambiguity is a deliberate plurality of complementary readings that enriches the
    work; failure to communicate is the work not being understood at all. The source prizes the first
    and calls the second wasted effort, without ever saying where one becomes the other.

- from: t_vig_c003_0011
  to: t_vig_c003_0012
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Both are the source's objections to novelty pursued for its own sake, one applied to marks and one
    to design generally. Stated in separate sections and never connected by the source.

- from: t_vig_c003_0009
  to: t_vig_c003_0016
  relation: related_to
  confidence_basis: source_stated
  note: "The asset and the source's stated way of preserving it."

- from: t_vig_c003_0001
  to: t_vig_c003_0005
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source states appropriateness is consequent to the semantic search: searching the roots of a
    subject is what defines the area of appropriate solutions.

- from: t_vig_c003_0004
  to: t_vig_c003_0002
  relation: related_to
  confidence_basis: source_stated
  note: >
    Discipline supplies the self-imposed rules; syntactic consistency is what those rules produce
    across a project. The source connects them through the grid, named in both sections.

