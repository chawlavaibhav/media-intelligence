- sk_id: sk_vig_c003_0006
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "appropriateness is the search for the specific of any given problem"
    - "Appropriateness transcends any issue of style"
    - "I think that we have to listen to what a thing wants to be"
  concept_label: appropriateness_is_the_search_for_the_specific_of_the_problem
  label_origin: extractor_assigned
  claim: >
    Searching the roots of a subject also defines the area of solutions appropriate to that particular
    problem, so appropriateness is the search for the specific of any given problem. Defining it
    prevents wrong directions and alternative routes leading nowhere or to wrong solutions.
    Appropriateness directs the choice of media, materials, scale, expression, colour and texture; it
    transcends style, since there are many ways of solving a problem but the solution must be
    appropriate. The source states that one has to listen to what a thing wants to be rather than
    contrive it into an arbitrary confinement.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The semantic search narrows the space of solutions, so appropriateness is a consequence of
      having done it rather than a separate judgement.
  scope:
    domain_discussed_by_source: [graphic_design, product_design]
    conditions: "after the meaning of the subject has been searched"
  caveats:
    - text: "the source calls this one of the fundamental principles of its Canon"
      origin: source_stated
    - text: "the source separately notes that in the post-modern period the word came to mean borrowing something and placing it in a different context, and allows that this kind of appropriation can be done when appropriate"
      origin: source_stated
    - text: "'listen to what a thing wants to be' is offered without a method for hearing it; the criterion is the designer's judgement"
      origin: extractor_observed
  source_stated_problems:
    - "wrong directions, or alternative routes that lead to nowhere or even worse, to wrong solutions"
  source_stated_remedies:
    - "define the area of appropriate solutions from the semantic search before choosing media, materials or scale"
  examples: {positive: []}
  intra_source_relations:
