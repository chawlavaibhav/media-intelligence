# CANON-003 book 5 — Massimo Vignelli, "The Vignelli Canon", Part One: The Intangibles (PDF pp.5-17)
# Fresh SPEC-03 extraction. No historical Vignelli material exists in this repository.
# Granularity: CANON-001 V0 rule, unchanged. Visual completeness: verified_page_level.
# Section rationale: Part One is the book's own division and is self-contained — twelve named values
# stated before any technique appears. Part Two ("The Tangibles") covers paper sizes, grids and
# typefaces and is a different kind of material.
#
# NOTE ON THIS SOURCE'S SHAPE: almost every claim here is a NORMATIVE statement about how design
# ought to be practised, written in the first person plural, with no mechanism and no demonstration.
# That is recorded honestly in the evidence characteristics rather than dressed up.

source_id: vignelli_canon_part_one_intangibles

