- sk_id: sk_vig_c003_0013
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "A real Corporate Identity is based on an overall system approach, not just a logo."
    - "When a logo has been in the public domain for more than fifty years it becomes a classic, a landmark, a respectable entity"
  concept_label: an_established_logo_holds_equity_that_should_be_protected
  label_origin: extractor_assigned
  claim: >
    Requests to redesign a logo are often motivated by a desire for change merely for its own sake,
    which the source calls a very wrong motivation. A real corporate identity rests on an overall
    system rather than on a logo alone. A logo gradually becomes part of collective culture, and one
    in the public domain for more than fifty years becomes a classic and a landmark that should not be
    discarded for a new one however well designed. The source reports proposing a light retouch of the
    existing mark rather than a replacement when asked to design a new logo for Ford, and doing the
    same for Ciga Hotels, Cinzano and Lancia.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Long public exposure roots a mark in people's consciousness, so the accumulated recognition is
      itself the asset and replacing the mark discards it.
  scope:
    domain_discussed_by_source: [graphic_design, corporate_identity]
    conditions: "established marks with long public exposure"
  caveats:
