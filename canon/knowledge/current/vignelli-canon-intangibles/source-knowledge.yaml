- sk_id: sk_vig_c003_0009
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "difference of scale within the same page can give a very strong impact"
    - "Visual strength should never be confused with just visual impact - which, most of the time, is just an expression of visual vulgarity and obtrusiveness."
  concept_label: visual_power_is_achieved_by_contrast_and_is_not_impact
  label_origin: extractor_assigned
  claim: >
    Design should be visually powerful, expressing content forcefully in every element. In graphic
    design, difference of scale within the same page gives strong impact, and bold type contrasting
    with light type creates dynamic impressions; in three dimensions, manipulating light through
    different textures and materials, and changing and contrasting scale, do the same. Visual strength
    can also be achieved with delicate layouts or materials. It is an expression of intellectual
    elegance and must never be confused with mere visual impact, which is usually visual vulgarity and
    obtrusiveness.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [graphic_design, product_design]
    conditions: "two- and three-dimensional work alike"
  caveats:
    - text: "the source names concrete devices — scale difference, bold against light type, light through texture — which makes this the most operational claim in Part One"
      origin: extractor_observed
    - text: "the distinction between visual strength and visual impact is asserted, and the test offered is whether it expresses intellectual elegance, which is itself undefined operationally"
      origin: extractor_observed
  source_stated_problems:
    - "Design that is weak in concept, form, color, texture"
    - "visual vulgarity and obtrusiveness"
  source_stated_remedies:
    - "use difference of scale within the same page"
    - "contrast bold type with light type"
    - "manipulate light through different textures and materials"
