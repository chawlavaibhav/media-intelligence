- sk_id: sk_vig_c003_0002
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "Semantics, for me, is the search of the meaning of whatever we have to design."
    - "Semantics will also indicate the most appropriate form for that particular subject"
  concept_label: begin_by_searching_for_the_meaning_of_the_subject
  label_origin: extractor_assigned
  claim: >
    The first act on any new assignment, in any form of design, is to search for the meaning of the
    thing being designed. That search may begin with the history of the subject, and may extend to
    the company, the product, its market position, the competition, its destination, the final user,
    or the semantic roots of the subject itself. It provides the basis for a correct inception of a
    project, and it indicates the most appropriate form for that particular subject.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Understanding the accurate and essential meanings, their complexities and ambiguities, and the
      context of use is what defines the parameters within which the designer may operate.
  scope:
    domain_discussed_by_source: [graphic_design, product_design, exhibition_design, interior_design]
    conditions: "the start of any assignment"
  caveats:
    - text: "the source states most of the distillation process is intuitive, and likens the result to hearing finished music without knowing the composer's process"
      origin: source_stated
    - text: "an ordering claim about practice, asserted from experience; no case is given where the search was skipped and the work suffered"
      origin: extractor_observed
