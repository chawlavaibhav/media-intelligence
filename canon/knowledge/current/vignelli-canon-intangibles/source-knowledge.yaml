- sk_id: sk_vig_c003_0003
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "the discipline that controls the proper use of grammar in the construction of phrases and the articulation of a language, Design"
    - "The consistency of a design is provided by the appropriate relationship of the various syntactical elements of the project"
  concept_label: syntax_is_the_relationship_between_a_designs_elements
  label_origin: extractor_assigned
  claim: >
    Syntax is the discipline controlling the proper use of grammar in constructing phrases and
    articulating a language. In design the syntax is supplied by the project's components — in graphic
    design the overall structure, the grid, the typefaces, the text and headlines, the illustrations.
    Consistency comes from the appropriate relationship between these: how type relates to grids and
    images from page to page across a whole project, how type sizes relate to each other, how pictures
    relate to each other and how the parts relate to the whole. Some ways of achieving this are
    correct and others incorrect and should be avoided.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [graphic_design]
    conditions: "multi-element, multi-page work"
  caveats:
    - text: "the source attributes the underlying idea to Mies van der Rohe — 'God is in the details' — and calls syntactic consistency of paramount importance in graphic design as in all human endeavours"
      origin: source_stated
    - text: "the source says some ways are correct and others incorrect without giving a test for distinguishing them; it names grids as one of several tools"
      origin: extractor_observed
    - text: "this section did not surface cleanly in the extracted text layer. It shares a spread with a full-page subway diagram whose route legend is emitted around and through the prose. It was recovered by the visual pass"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
