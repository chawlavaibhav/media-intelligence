- sk_id: sk_vig_c003_0007
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "a plurality of meanings, or the ability of conferring to an object or a design, the possibility of being read in different ways"
    - "great caution is recommended in using these spices"
  concept_label: ambiguity_as_deliberate_plurality_of_meaning
  label_origin: extractor_assigned
  claim: >
    Against the negative reading of ambiguity as vagueness, the source treats it positively as a
    plurality of meanings — the ability to confer on an object or design the possibility of being read
    in several complementary ways, enriching the subject and giving it depth. It is used deliberately
    to enhance expression. But it must be measured carefully or it backfires. Contradiction can
    sometimes reinforce ambiguity, though more often it signals discontinuity and lack of control;
    both can enrich a project and both can equally sink it.
  claim_type: explicit_source_claim
  interpretation_basis: null
