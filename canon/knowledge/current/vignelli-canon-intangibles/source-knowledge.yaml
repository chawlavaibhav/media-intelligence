- sk_id: sk_vig_c003_0010
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "it is not a design style, but the deepest meaning and the essence of Design"
    - "the sublime level of intelligence which has produced all the masterpieces in the history of mankind"
  concept_label: intellectual_elegance_as_the_governing_standard
  label_origin: extractor_assigned
  claim: >
    Intellectual elegance, not to be confused with elegance of manners, is the sublime level of
    intelligence the source credits with producing the masterpieces of history — Greek statues,
    Renaissance painting, Goethe, architecture of any period, music of all times, the clarity of
    science. It is the thread guiding the designer to the best solution and the definitive goal of the
    mind, the one beyond compromises. It elevates the most humble artefact, and it is also civic
    consciousness, social responsibility, a sense of decency and a moral imperative. It is not a design
    style but the deepest meaning and essence of design.
