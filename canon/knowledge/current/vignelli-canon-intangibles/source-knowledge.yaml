- sk_id: sk_vig_c003_0008
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "Design is one - it is not many different ones."
    - "Very often people think that Design is a particular style. Nothing could be more wrong!"
  concept_label: design_is_one_discipline_applicable_to_any_subject
  label_origin: extractor_assigned
  claim: >
    The discipline of design is one and can be applied to many different subjects regardless of style.
    Design is a discipline and a creative process with its own rules, controlling the consistency of
    its output toward its objective; it is not a style. Design discipline is above and beyond any
    style, and every style requires discipline in order to be expressed. What matters is to master a
    design discipline, because that is what every project needs.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
