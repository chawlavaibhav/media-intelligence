- sk_id: sk_vig_c003_0011
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "We despise the culture of obsolescence, the culture of waste, the cult of the ephemeral."
    - "We like the use of primary shapes and primary colors because their formal values are timeless."
  concept_label: timelessness_as_a_design_objective
  label_origin: extractor_assigned
  claim: >
    The source declares itself against any fashion of design and any design fashion, despising the
    culture of obsolescence, waste and the ephemeral, and the demand for temporary solutions. It is
    for design that lasts and responds to people's needs and wants, committed to a society that
    demands long-lasting values. It favours primary shapes and primary colours because their formal
    values are timeless, and typography that transcends subjectivity and seeks objective values
    beyond trends. It favours economy of design because it avoids wasteful exercises, respects
    investment and lasts longer, and design centred on the message rather than visual titillation.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [graphic_design, product_design]
    conditions: "stated as a general commitment"
  caveats:
    - text: "the source states a moral rather than functional ground: 'we feel the moral imperative of designing things that will last for a long time'"
      origin: source_stated
    - text: "the claim that primary shapes and colours have timeless formal values is asserted, not argued, and is itself a position characteristic of one modernist period"
      origin: extractor_observed
  source_stated_problems:
    - "the culture of obsolescence, the culture of waste, the cult of the ephemeral"
    - "the waste of energies and capital for the sake of novelty"
  source_stated_remedies:
    - "use primary shapes and primary colours"
    - "use typography that does not follow trends"
    - "centre the design on the message rather than on visual titillation"
  examples: {positive: []}
  intra_source_relations:
    - {relation: specialises, target: sk_vig_c003_0010, note: "one of the commitments intellectual elegance is said to entail"}
