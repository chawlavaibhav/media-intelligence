- sk_id: sk_vig_c003_0005
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "There are no hierarchies when it comes to quality. Quality is there or is not there"
    - "Design without discipline is anarchy, an exercise of irresponsibility."
  concept_label: discipline_is_self_imposed_rules_that_hold_a_project_together
  label_origin: extractor_assigned
  claim: >
    Attention to detail requires discipline, with no room for sloppiness, carelessness or
    procrastination, because the end result is the sum of all the details in the creative process.
    There are no hierarchies when it comes to quality: it is there or it is not, and if it is not the
    time was lost. Discipline is a set of self-imposed rules and parameters, a bag of tools allowing
    consistent design from beginning to end, and an attitude that gives the capacity to control
    creative work so it has continuity of intent rather than fragmentation.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The end result is the sum of all details, so any detail left undisciplined degrades the whole
      rather than a part.
  scope:
    domain_discussed_by_source: [graphic_design, product_design]
    conditions: "any design work, regardless of style"
  caveats:
    - text: "the source states that without discipline there is no good design regardless of its style, which makes discipline prior to and independent of style"
      origin: source_stated
  source_stated_problems:
    - "sloppiness, carelessness, procrastination"
    - "fragmentation"
    - "design without discipline is anarchy"
  source_stated_remedies:
    - "impose a set of rules and parameters on oneself and work within them"
  examples: {positive: []}
  intra_source_relations:
    - {relation: generalises, target: sk_vig_c003_0009, note: "design is one because the discipline is one"}
