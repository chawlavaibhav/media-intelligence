- sk_id: sk_vig_c003_0004
  source_id: vignelli_canon_part_one_intangibles
  source_terms:
    - "Whatever we do, if not understood, fails to communicate and is wasted effort."
    - "Any artifact should stand by itself in all its clarity."
  concept_label: work_not_understood_at_the_point_of_use_is_wasted
  label_origin: extractor_assigned
  claim: >
    Work that is semantically correct and syntactically consistent is still useless if, at the point
    of fruition, no one understands the result or the meaning of the effort. An artefact should stand
    by itself in all its clarity; it may sometimes need explanation, but it is better when it does not.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The final look of anything is the by-product of the clarity, or lack of it, during the design
      phase, so clarity of intent translates into clarity of result.
  scope:
    domain_discussed_by_source: [graphic_design, product_design]
    conditions: "at the point where the work reaches its audience"
  caveats:
