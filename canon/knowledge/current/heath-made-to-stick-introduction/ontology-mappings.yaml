# CANON-003 Lane C, book 14 — Heath & Heath, "Made to Stick", Introduction. SPEC-05 ontology,
# source-local. Existing relation types only; `distinct_from` per Controller decision 3.
source_id: heath_made_to_stick_introduction
extraction_date: 2026-08-24

terms:

# ── problems ────────────────────────────────────────────────────────────────
- term_id: t_hea_mts_0001
  term: the_curse_of_knowledge
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: problem
  definition_in_origin_frame: >
    The tendency, once you know something, to find it impossible to imagine not knowing it, so that
    you cannot re-create your listener's state of mind. The source capitalises the phrase throughout
    and calls it the villain of the book.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Six Principles of Sticky Ideas' close"}
  arising_from: [sk_hea_mts_0022]

- term_id: t_hea_mts_0002
  term: tapper_listener_gap
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: problem
  definition_in_origin_frame: >
    The measured distance between how well a knowledgeable sender believes they have communicated
    and how well they actually have. In Newton's study, once in forty against a belief of once in two.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'Tappers and Listeners'"}
  arising_from: [sk_hea_mts_0023]

- term_id: t_hea_mts_0003
  term: ambiguous_to_the_point_of_being_meaningless
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: problem
  definition_in_origin_frame: >
    The source's description of mission statements, synergies, strategies and visions — language
    abstract enough that each listener supplies a different meaning, or none.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'PRINCIPLE 3: CONCRETENESS'"}
  arising_from: [sk_hea_mts_0012]

- term_id: t_hea_mts_0004
  term: the_inert_statistic
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: problem
  definition_in_origin_frame: >
    A true number the audience has no way to evaluate, and which therefore produces no response.
    The source's instance is "37 grams of saturated fat", of which its own advocate said "Saturated
    fat has zero appeal. It's dry, it's academic, who cares?"
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'The Truth About Movie Popcorn'; 'PRINCIPLE 5: EMOTIONS'"}
  arising_from: [sk_hea_mts_0007, sk_hea_mts_0014, sk_hea_mts_0015]

- term_id: t_hea_mts_0005
  term: claiming_ten_points
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: problem
  definition_in_origin_frame: >
    Making many good points instead of one, so that none is retained. From the quoted defence
    lawyer: argue ten points, each of them good, and the jury will remember none.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'PRINCIPLE 1: SIMPLICITY'"}
  arising_from: [sk_hea_mts_0009]

- term_id: t_hea_mts_0006
  term: reliance_on_repetition
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: problem
  definition_in_origin_frame: >
    Treating repetition as the remedy for a message that is not landing. The source doubts it
    directly: an idea needing ten tellings was probably badly designed, and no urban legend has to
    be repeated ten times.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'On Stickiness'"}
  arising_from: [sk_hea_mts_0005]

- term_id: t_hea_mts_0007
  term: borrowed_authority
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: problem
  definition_in_origin_frame: >
    Belief that rests on the speaker's standing rather than on anything in the idea. The source's
    example of when it is available is a former surgeon general; its point is that in most
    day-to-day situations it is not.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'PRINCIPLE 4: CREDIBILITY'"}
  arising_from: [sk_hea_mts_0013]

# ── remedies ────────────────────────────────────────────────────────────────
- term_id: t_hea_mts_0008
  term: simple
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    Stripped to the essential core by exclusion and relentless prioritisation, and simultaneously
    profound. Explicitly not the same as short: sound bites are rejected and proverbs are the model.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'PRINCIPLE 1: SIMPLICITY'"}
  arising_from: [sk_hea_mts_0009]

- term_id: t_hea_mts_0009
  term: unexpected
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    Violating the audience's expectations, and being counterintuitive, in order to seize attention;
    then opening gaps in their knowledge to hold interest once surprise has decayed.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'PRINCIPLE 2: UNEXPECTEDNESS'"}
  arising_from: [sk_hea_mts_0010, sk_hea_mts_0011]

- term_id: t_hea_mts_0010
  term: concrete
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    Expressed in human actions and sensory information. The source calls it the only way to ensure
    an idea means the same thing to everyone in the audience.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'PRINCIPLE 3: CONCRETENESS'"}
  arising_from: [sk_hea_mts_0012]

- term_id: t_hea_mts_0011
  term: credentialed
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    Carrying its own credentials rather than borrowing the speaker's, chiefly by giving the audience
    a way to test the claim themselves. The source's phrase is a "try before you buy" philosophy for
    the world of ideas.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'PRINCIPLE 4: CREDIBILITY'"}
  arising_from: [sk_hea_mts_0013, sk_hea_mts_0014]

- term_id: t_hea_mts_0012
  term: emotional
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    Made to be felt rather than merely known, and directed at a person rather than an abstraction,
    because we are wired to feel things for people. Selecting which emotion is the difficult part.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'PRINCIPLE 5: EMOTIONS'"}
  arising_from: [sk_hea_mts_0015, sk_hea_mts_0016, sk_hea_mts_0017]

- term_id: t_hea_mts_0013
  term: story
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    A narrative that lets the listener rehearse a situation before meeting it. The source's phrase
    is a "mental flight simulator".
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'PRINCIPLE 6: STORIES'"}
  arising_from: [sk_hea_mts_0018]

- term_id: t_hea_mts_0014
  term: opening_gaps
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    Systematically creating gaps in what the audience knows and then filling them, in order to hold
    curiosity over a long period after surprise has worn off.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'PRINCIPLE 2: UNEXPECTEDNESS'"}
  arising_from: [sk_hea_mts_0011]

- term_id: t_hea_mts_0015
  term: let_them_test_it_themselves
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    Framing a claim so the audience can check it against their own experience instead of accepting
    a statistic. Reagan's "ask yourself if you are better off today than you were four years ago".
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'PRINCIPLE 4: CREDIBILITY'"}
  arising_from: [sk_hea_mts_0014]

- term_id: t_hea_mts_0016
  term: transform_the_idea
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    Changing the form of the message, since the sender's own knowledge cannot be removed. The source
    names it as one of only two reliable ways to beat the Curse of Knowledge — the other being not
    to learn anything.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Tappers and Listeners'"}
  arising_from: [sk_hea_mts_0024]

- term_id: t_hea_mts_0017
  term: run_the_checklist
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: remedy
  definition_in_origin_frame: >
    Asking the six questions of an idea already drafted, one at a time, to see which of them it
    fails — as the source does to "maximize shareholder value" and to the moon-shot call.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'Tappers and Listeners'"}
  arising_from: [sk_hea_mts_0020]

# ── properties ──────────────────────────────────────────────────────────────
- term_id: t_hea_mts_0018
  term: stickiness
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: property
  definition_in_origin_frame: >
    The property of an idea being understood, remembered, and having a lasting impact — changing the
    audience's opinions or behaviour. The word is borrowed from Gladwell's *The Tipping Point*.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'On Stickiness'"}
  arising_from: [sk_hea_mts_0001]

- term_id: t_hea_mts_0019
  term: naturally_sticky_idea
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: property
  definition_in_origin_frame: >
    An idea that spreads and endures with no resources behind it — urban legends, conspiracy
    theories, wartime rumours, jokes, and proverbs. The source stresses that many are false and many
    are true; the category is about transmission, not truth.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'What Led to Made to Stick'"}
  arising_from: [sk_hea_mts_0003]

- term_id: t_hea_mts_0020
  term: proverb
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: property
  definition_in_origin_frame: >
    A nugget of wisdom that endures over centuries and across cultures. Named as the oldest class of
    naturally sticky idea and as the standard simplicity should be measured against.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'What Led to Made to Stick'; 'PRINCIPLE 1: SIMPLICITY'"}
  arising_from: [sk_hea_mts_0008]

- term_id: t_hea_mts_0021
  term: creative_template
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: property
  definition_in_origin_frame: >
    One of six recurring patterns into which 89 per cent of award-winning advertisements were
    classified in the 1999 Israeli study, against 2 per cent of non-award advertisements. The
    example given is Extreme Consequences.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Systematic Creativity'"}
  arising_from: [sk_hea_mts_0025, sk_hea_mts_0026]

- term_id: t_hea_mts_0022
  term: natural_talent_in_an_idea
  origin: source
  origin_ref: heath_made_to_stick_introduction
  kind: property
  definition_in_origin_frame: >
    An idea that already carries the traits without having been engineered — the source's "seven-foot
    stranger", and the Subway store owner who spotted Jared's story.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Six Principles of Sticky Ideas'"}
  arising_from: [sk_hea_mts_0021]

relationships:

- from: t_hea_mts_0004
  to: t_hea_mts_0003
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked because both are language that fails to land and the source's remedy for both is
    concreteness. They fail differently. An inert statistic is precise and unambiguous — everyone
    understands "37 grams" identically and nobody can evaluate it. A meaningless mission statement
    is the opposite: everyone supplies a different meaning. Precision without evaluability against
    evaluability without precision. Collapsing them would hide that the repairs differ — one needs a
    comparison the audience can judge, the other needs a definite referent.

- from: t_hea_mts_0009
  to: t_hea_mts_0014
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source presents opening gaps as the second half of unexpectedness, taking over once surprise
    decays. The reading intended is that the second is narrower than the first, but `related_to` is
    used rather than `narrower_than` because that relation is outside what this worker may set
    locally. Intended reading recorded here.

- from: t_hea_mts_0011
  to: t_hea_mts_0015
  relation: related_to
  confidence_basis: source_stated
  note: >
    Same shape: letting the audience test a claim themselves is the source's chief method of making
    an idea carry its own credentials. Narrower-than intended, `related_to` used.

- from: t_hea_mts_0001
  to: t_hea_mts_0002
  relation: related_to
  confidence_basis: source_stated
  note: >
    The relation the source actually asserts here is `same_mechanism`, and it asserts it directly
    rather than leaving it to be inferred: the tapper cannot stop hearing the tune, and that IS the
    Curse of Knowledge. The tapper/listener gap is the same tendency observed under measurement, not
    a separate phenomenon that resembles it.

    `related_to` is recorded instead, and the intended reading is preserved in this note, because the
    two governing documents disagree about whether this worker may set that relation. SPEC-05's
    governance section singles out only `same_failure_family` as requiring human review, which would
    permit `same_mechanism`. The Canon charter enumerates the relations a worker may choose locally
    and lists only `related_to` and `potentially_equivalent_to`. The narrower of the two was
    followed. The cost is real and worth stating plainly: a source-stated identity has been recorded
    as an unspecified connection. Logged in the Lane C issue file.

- from: t_hea_mts_0006
  to: t_hea_mts_0016
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    The source sets repetition and transformation against each other as rival responses to a message
    that is not landing: repeat it, or change its form. Recorded as related because the ontology has
    no relation for "the source offers these as alternatives".

- from: t_hea_mts_0007
  to: t_hea_mts_0011
  relation: related_to
  confidence_basis: source_stated
  note: >
    Problem and remedy, stated together: credentials in the idea are what a communicator uses when
    the speaker's own standing is not available.

- from: t_hea_mts_0019
  to: t_hea_mts_0020
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source names the proverb as the oldest class of naturally sticky idea, so this is
    membership. `narrower_than` intended, `related_to` used for the reason given above.

- from: t_hea_mts_0021
  to: t_hea_mts_0017
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    The source draws the parallel itself — "what this Israeli research team did for advertisements
    is what this book does for your ideas" — so the six advertising templates and the six-item
    checklist are offered as the same kind of instrument. They are not the same instrument and their
    six-ness is coincidental; recorded as related to preserve the analogy without asserting an
    equivalence the source does not claim.

- from: t_hea_mts_0022
  to: t_hea_mts_0018
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Natural talent in an idea is stickiness that was not designed in. Kept as separate terms because
    the source uses them for different purposes: one names a property to build, the other a property
    to recognise.

concepts:

- concept_id: sc_hea_mts_success_checklist
  kind: source_specific_concept
  origin_ref: heath_made_to_stick_introduction
  label: the_success_checklist
  children_terms: [t_hea_mts_0008, t_hea_mts_0009, t_hea_mts_0010, t_hea_mts_0011, t_hea_mts_0012, t_hea_mts_0013, t_hea_mts_0017]
  origin: source_stated
  basis: >
    The source coins the grouping itself, names it, orders it, and gives it an acronym. This is a
    source generalising over its own vocabulary in the clearest form the batch has produced — the
    six terms exist only as members of this concept and the source says so.
  asserts_agreement_between_sources: false

- concept_id: sc_hea_mts_curse_of_knowledge
  kind: source_specific_concept
  origin_ref: heath_made_to_stick_introduction
  label: the_curse_of_knowledge_and_its_escape
  children_terms: [t_hea_mts_0001, t_hea_mts_0002, t_hea_mts_0006, t_hea_mts_0016, t_hea_mts_0007]
  origin: source_stated
  basis: >
    The source names the Curse, supplies its measurement, names the two rival responses to a message
    that is not landing, and states which of them works. The grouping is the argument of two
    consecutive sections.
  asserts_agreement_between_sources: false

- concept_id: sc_hea_mts_language_that_does_not_land
  kind: source_specific_concept
  origin_ref: heath_made_to_stick_introduction
  label: language_that_does_not_land
  children_terms: [t_hea_mts_0003, t_hea_mts_0004, t_hea_mts_0005]
  origin: extractor_inferred
  basis: >
    Meaningless abstraction, the inert statistic and the ten good points are three ways a true and
    well-intentioned message produces nothing, and each is used by the source to motivate a
    different principle. The source never groups them, so the grouping is ours. It is recorded
    because these three are the failure modes the framework is actually aimed at, and because they
    are not the same failure — see the `distinct_from` above.
  asserts_agreement_between_sources: false
