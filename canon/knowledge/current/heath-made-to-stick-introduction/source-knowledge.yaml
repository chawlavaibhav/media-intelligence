- sk_id: sk_hea_mts_0010
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "How do we get our audience to pay attention to our ideas, and how do we maintain their interest when we need time to get the ideas across?"
    - "We need to violate people's expectations. We need to be counterintuitive."
  concept_label: unexpectedness_is_violating_the_audiences_expectations
  label_origin: extractor_assigned
  claim: >
    The second principle answers how to get an audience to pay attention and how to hold that
    attention long enough to deliver the idea. The answer is to violate people's expectations and to
    be counterintuitive — the source's own example being that a bag of popcorn is as unhealthy as a
    whole day of fatty food.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Surprise is an emotion whose function is to increase alertness and cause focus, so violating
      an expectation produces attention directly.
  scope:
    domain_discussed_by_source: [communication, idea_design]
    conditions: "an audience whose attention has not been secured"
  caveats:
    - text: >
        The function attributed to surprise — increasing alertness and causing focus — is stated as
        established without a citation in this section.
      origin: extractor_observed
