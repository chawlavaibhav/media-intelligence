# ───────────────── The Curse of Knowledge ─────────────────

- sk_id: sk_hea_mts_0022
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "Sadly, there is a villain in our story. The villain is a natural psychological tendency that consistently confounds our ability to create ideas using these principles. It's called the Curse of Knowledge."
    - "Once we know something, we find it hard to imagine what it was like not to know it. Our knowledge has \"cursed\" us."
  concept_label: the_curse_of_knowledge_is_why_obvious_principles_are_not_followed
  label_origin: source_verbatim
  claim: >
    The reason the six principles are not already in general use, despite most of them sounding like
    common sense, is a single psychological tendency the source names the Curse of Knowledge: once a
    person knows something they find it hard to imagine not knowing it, and so cannot re-create the
    listener's state of mind. The source states that this is reenacted daily between CEOs and
    frontline employees, teachers and students, politicians and voters, marketers and customers,
    writers and readers — all of them separated by an information imbalance. When a chief executive
    discusses "unlocking shareholder value" there is a tune playing in her head that the employees
    cannot hear.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Knowledge cannot be set aside on demand, so the knower's own understanding fills in what the
      listener is missing and the gap becomes invisible to the person who has to close it.
  scope:
    domain_discussed_by_source: [communication]
    conditions: "any communication across an information imbalance"
  caveats:
    - text: >
        The Curse is offered as the single explanation for a large and varied failure — everything
        from process memos to strategy announcements. Other causes, such as incentives to be vague
        or simple lack of effort, are not considered.
      origin: extractor_observed
  source_stated_problems:
    - "the Curse of Knowledge"
    - "we can't readily re-create our listeners' state of mind"
  source_stated_remedies: []
  examples:
