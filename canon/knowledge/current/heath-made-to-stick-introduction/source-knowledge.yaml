- sk_id: sk_hea_mts_0020
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "here's our checklist for creating a successful idea: a Simple Unexpected Concrete Credentialed Emotional Story"
    - "They can be used as a kind of checklist."
