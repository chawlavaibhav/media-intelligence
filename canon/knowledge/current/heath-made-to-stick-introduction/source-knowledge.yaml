        product type, and figures on both arms. Not recorded as `empirical_within_source` because it
        is not the source's own measurement — see the file header.
      origin: extractor_observed
    - text: >
        The templates were derived from the award-winning set and then applied to the control set,
        so a high fit on the first and a low fit on the second is partly what the derivation
