- sk_id: sk_hea_mts_0026
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "The final group was trained for two hours on how to use the six creative templates... Their ads were rated as 50 percent more creative and produced a 55 percent more positive attitude toward the products advertised."
    - "This group's ads were rated as less annoying than those of the untrained group but no more creative."
  concept_label: two_hours_of_template_training_beat_both_no_training_and_brainstorming_training
  label_origin: extractor_assigned
  claim: >
    Creativity can be taught, and teaching patterns works better than teaching ideation technique.
    The source reports the same Israeli researchers running three groups of novices on the same three
    products — a shampoo, a diet food and a sneaker. The untrained group's advertisements were rated
    by consumers as annoying. A group given two hours of standard free-association brainstorming
    training produced advertisements rated less annoying but no more creative. A group given two
    hours on the six templates produced advertisements rated 50 per cent more creative and generating
    a 55 per cent more positive attitude toward the products. In every arm the fifteen best
    advertisements were chosen by the same experienced creative director, who did not know how each
    group had been trained.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [advertising, creativity, training]
    conditions: "novices producing print advertising concepts"
  caveats:
    - text: >
        A named third-party experiment with three arms, a shared task, a blinded selector and
        consumer-rated outcomes. It is the best-designed evidence in the section and the strongest
        support for the book's central premise. Not recorded as `empirical_within_source` because it
        is not the source's own measurement — see the file header.
      origin: extractor_observed
    - text: >
        No group size, no significance test, and no baseline for what "50 per cent more creative"
        is 50 per cent of. The brainstorming arm establishes that the effect is not simply from
        being trained at all, which is the design's most valuable feature.
      origin: extractor_observed
    - text: >
        The outcome is consumer ratings of creativity and product attitude, not sales or recall,
        and the source's own framework is about stickiness rather than about creativity ratings.
