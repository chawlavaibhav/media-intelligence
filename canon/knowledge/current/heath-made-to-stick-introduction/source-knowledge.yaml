- sk_id: sk_hea_mts_0005
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "When we get advice on communicating, it often concerns our delivery... Sometimes we get advice about structure... Another genre concerns knowing your audience... and, finally... Use repetition, repetition, repetition."
    - "But this set of advice has one glaring shortcoming: It doesn't help Art Silverman as he tries to figure out the best way to explain that movie popcorn is really unhealthful."
    - "If you have to tell someone the same thing ten times, the idea probably wasn't very well designed. No urban legend has to be repeated ten times."
  concept_label: existing_communication_advice_addresses_everything_except_the_message
  label_origin: extractor_assigned
  claim: >
    The four standard genres of communication advice — delivery, structure, knowing your audience,
    and repetition — all leave the message itself undesigned. The source's test case is a
    communicator who already knows his goal, his audience and his format and still does not know
    what to say. It allows that the advice has obvious merit, except for the emphasis on repetition,
    which it doubts directly: an idea needing ten tellings was probably badly designed, and no urban
    legend needs repeating ten times.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Delivery, structure and audience analysis are all about how a message is transmitted; none of
      them selects the content, so a communicator can satisfy all of them and still have nothing
      worth transmitting.
  scope:
    domain_discussed_by_source: [communication]
    conditions: "advice given to people who must communicate professionally"
  caveats:
    - text: >
        The argument against repetition is made by analogy to urban legends, which are retransmitted
        by many people rather than repeated by one. Whether the comparison holds is not examined.
      origin: extractor_observed
  source_stated_problems:
    - "It doesn't help Art Silverman as he tries to figure out the best way to explain that movie popcorn is really unhealthful."
  source_stated_remedies: []
