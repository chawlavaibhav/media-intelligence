- sk_id: sk_hea_mts_0024
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "You can't unlearn what you already know."
    - "There are, in fact, only two ways to beat the Curse of Knowledge reliably. The first is not to learn anything. The second is to take your ideas and transform them."
  concept_label: the_curse_cannot_be_removed_only_routed_around_by_transforming_the_idea
  label_origin: extractor_assigned
  claim: >
    The Curse of Knowledge cannot be undone. Reversing thirty years of immersion is described as
    impossible as un-ringing a bell, and one cannot unlearn what one already knows. The source states
    that there are therefore only two reliable ways to beat it: learn nothing, or transform the idea.
    Since the first is not available, the whole method reduces to the second, and the six principles
    are named as the weapons for it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because the sender's state cannot be changed, the only remaining variable is the form of the
      message.
  scope:
