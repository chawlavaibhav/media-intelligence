- sk_id: sk_hea_mts_0007
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "\"A medium-sized 'butter' popcorn at a typical neighborhood movie theater contains more artery-clogging fat than a bacon-and-eggs breakfast, a Big Mac and fries for lunch, and a steak dinner with all the trimmings—combined!\""
    - "\"Saturated fat has zero appeal,\" Silverman says. \"It's dry, it's academic, who cares?\""
    - "But that was too scientific somehow. Too rational."
  concept_label: an_inert_true_fact_can_be_made_to_spread_by_reframing_it_alone
  label_origin: extractor_assigned
  claim: >
    A true and important fact that nobody acts on can be made to spread by changing only how it is
    expressed, with no additional resources. The source's case is the Center for Science in the
    Public Interest and movie popcorn: laboratory analysis found the typical bag carried 37 grams of
    saturated fat against a recommended daily maximum of 20. The number by itself meant nothing to
    people, and a bar chart was rejected as too rational for a fact that was not rational but
    ludicrous. The claim was restated as a comparison against a whole day of unhealthy meals and
    staged with the actual food laid out for cameras. It was carried by CBS, NBC, ABC, CNN, *USA
    Today*, the *Los Angeles Times* and the *Washington Post*, popcorn sales fell, and United
    Artists, AMC and Loews stopped using coconut oil.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The underlying fact was abstract and gave the audience no way to judge whether 37 grams was
      bad; the comparison expressed the same fact in terms the audience could already evaluate.
  scope:
    domain_discussed_by_source: [public_communication, advocacy]
    conditions: "a true but abstract claim that an audience cannot evaluate"
  caveats:
    - text: >
        The message and its staging changed together — the wording, the visual buffet and a press
        conference — so the case does not isolate the reframing from the production around it.
      origin: extractor_observed
    - text: >
        The outcome is reported as coverage, falling sales and chains switching oil, with no figures
        for any of the three and no comparison against what a conventional announcement would have
        achieved.
      origin: extractor_observed
  source_stated_problems:
    - "few people know what \"37 grams of saturated fat\" means"
  source_stated_remedies:
    - "shape the message in a way that fully communicated this ludicrousness"
  examples:
    positive:
      - {description: "CSPI press conference, 27 September 1992, with a day's worth of fatty meals laid out beside a single bag of popcorn", figure_ref: null}
  intra_source_relations:
