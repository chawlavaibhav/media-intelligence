- sk_id: sk_hea_mts_0006
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "The Halloween-candy story is, in a sense, the evil twin of the CSPI story."
    - "Both stories highlighted an unexpected danger in a common activity... Both stories called for simple action... Both made use of vivid, concrete images... And both stories tapped into emotion."
    - "We began to see the same themes, the same attributes, reflected in a wide range of successful ideas."
  concept_label: sticky_ideas_share_the_same_traits_whether_they_are_true_or_false
  label_origin: extractor_assigned
  claim: >
    Ideas that stick share a common set of traits regardless of whether they are true, deliberate or
    beneficial. The source derives this by laying three cases side by side: the Halloween
    candy-tampering myth, the movie-popcorn campaign, and the Kidney Heist legend. Each combines an
    unexpected danger in a common activity, a simple action to take, a vivid concrete image, and an
    emotion. It reports that the same themes recur across a wide range of successful ideas, drawn
    from its own research and from reviewing the work of folklorists, psychologists, educational
    researchers, political scientists and proverb-hunters.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [communication, idea_design, folklore]
    conditions: "ideas that have demonstrably spread"
  caveats:
    - text: >
        The Halloween case is supported by named research: sociologists Joel Best and Gerald
        Horiuchi studied every reported Halloween incident from 1958 and found no instance of a
        stranger causing a child life-threatening harm by tampering with candy; the two child deaths
        found were caused by relatives. A 1985 ABC News poll is cited for 60 per cent of parents
        worrying. This is cited third-party research, not the source's own measurement, so it is
        recorded here rather than as `empirical_within_source` — see the file header.
      origin: extractor_observed
    - text: >
        The three cases were selected because they stuck. Nothing is said about ideas carrying the
        same four traits that failed to spread, so the traits are established as common to
        successes, not as sufficient for success. The source says as much two paragraphs later.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "Halloween candy-tampering myth — false, changed the behaviour of millions of parents for thirty years, and changed the law in California and New Jersey", figure_ref: null}
  intra_source_relations:
