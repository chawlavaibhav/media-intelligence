- sk_id: sk_hea_mts_0008
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "perhaps the oldest class of naturally sticky ideas is the proverb—a nugget of wisdom that often endures over centuries and across cultures"
    - "versions of the proverb \"Where there's smoke there's fire\" have appeared in more than fifty-five different languages"
    - "Saying something short is not the mission—sound bites are not the ideal. Proverbs are the ideal."
  concept_label: the_proverb_is_the_model_of_a_durable_idea
  label_origin: extractor_assigned
  claim: >
    The proverb is the oldest and the best model of a sticky idea, because it survives centuries and
    crosses cultures while remaining both compact and profound. The source names it as the standard
    to aim at, explicitly against the sound bite, and observes that proverbs also encode abstract
    truths in concrete language — "a bird in hand is worth two in the bush".
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [communication, folklore]
    conditions: "ideas intended to endure"
  caveats:
    - text: >
        The fifty-five-languages figure is given without a source. It is the strongest durability
        evidence offered and it is a single example.
      origin: extractor_observed
    - text: >
        Recorded as its own object rather than folded into simplicity because the source uses the
        proverb in two different arguments — as the model for simplicity, and as evidence for
        concreteness — and because "compact and profound" is independently contradictable as a
        standard.
      origin: extractor_observed
  source_stated_problems:
    - "sound bites are not the ideal"
  source_stated_remedies:
