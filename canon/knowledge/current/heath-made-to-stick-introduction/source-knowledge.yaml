- sk_id: sk_hea_mts_0009
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "How do we find the essential core of our ideas?"
    - "To strip an idea down to its core, we must be masters of exclusion. We must relentlessly prioritize."
    - "We must create ideas that are both simple and profound."
  concept_label: simplicity_is_finding_the_essential_core_by_exclusion
  label_origin: extractor_assigned
  claim: >
    The first principle answers the question of how to find the essential core of an idea. It
    requires mastery of exclusion and relentless prioritisation, and the source is explicit that
    brevity is not the goal: saying something short is not the mission, sound bites are not the
    ideal, proverbs are. The target is an idea that is simple and profound at once.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An audience that receives many points retains none. The source quotes a defence lawyer: argue
      ten points, each of them good, and the jury will remember none of them.
  scope:
    domain_discussed_by_source: [communication, idea_design]
    conditions: "any idea being prepared for an audience"
  caveats:
    - text: >
        The supporting evidence in the Introduction is one quoted practitioner remark and one
        exemplar, the Golden Rule. The principle's own chapter was not processed.
      origin: extractor_observed
    - text: >
        "Simple and profound" is a target, not a test. Nothing here says how to tell whether an idea
        has reached its core or has merely been cut down.
      origin: extractor_observed
  source_stated_problems:
    - "if you argue ten points, even if each is a good point, when they get back to the jury room they won't remember any"
  source_stated_remedies:
    - "we must be masters of exclusion"
