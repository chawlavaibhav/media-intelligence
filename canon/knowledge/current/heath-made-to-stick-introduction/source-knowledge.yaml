  concept_label: the_six_principles_are_used_as_a_diagnostic_checklist
  label_origin: extractor_assigned
  claim: >
    The six principles are meant to be run as a checklist against a specific idea, one question at a
    time, and the source demonstrates the procedure twice on the same page. "Maximize shareholder
    value" is scored: simple only in the sense of being short, not unexpected, not concrete, credible
    only because the CEO said it, not emotional, not a story. John F. Kennedy's 1961 call to put a
    man on the moon and return him safely by the end of the decade is scored on the same six
    questions and passes each. The source names the acronym SUCCESs and admits it is a little corny.
