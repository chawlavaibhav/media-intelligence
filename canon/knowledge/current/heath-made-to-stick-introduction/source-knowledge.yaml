- sk_id: sk_hea_mts_0019
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "There is no \"formula\" for a sticky idea—we don't want to overstate the case. But sticky ideas do draw from a common set of traits, which make them more likely to succeed."
    - "you don't need all of these traits in order to be great... And having all the traits doesn't guarantee greatness"
  concept_label: the_six_traits_are_a_common_set_not_a_formula
  label_origin: extractor_assigned
  claim: >
    The six traits are neither necessary nor sufficient. The source states outright that there is no
    formula and that it does not want to overstate the case: sticky ideas draw from a common set of
    traits that make success more likely. Its analogy is a great basketball player, who has some
    subset of height, speed, agility, power and court sense — some great guards are five feet ten
    and scrawny, and there are plenty of slow, clumsy seven-footers — but if you are picking a team
    from strangers you should still take the gamble on the seven-footer.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The traits raise the probability of success rather than determining it, so partial possession
      is normal and full possession is no guarantee.
  scope:
    domain_discussed_by_source: [communication, idea_design]
    conditions: "any application of the six principles"
  caveats:
    - text: >
        The probabilistic framing is stated and never quantified anywhere in this section. "More
        likely to succeed" has no base rate, no effect size and no way to be checked.
      origin: extractor_observed
    - text: >
        This claim does real work in the framework: it makes the framework unfalsifiable by any
        individual counter-example, since a sticky idea missing traits and an unsticky idea having
        them are both permitted outcomes.
