# CANON-003 Lane C, book 14 — Chip Heath & Dan Heath, "Made to Stick", the complete Introduction
# ("What Sticks?"). Fresh SPEC-03 extraction. Historical material for this book, if any exists, is
# sealed until this book's checkpoint commit.
# Granularity: CANON-001 V0 rule, unchanged.
# Visual completeness: not_verified_page_layout — figures inspected and there are none; an EPUB has
# no page to inspect. See visual-evidence-ledger.yaml. No claim is recorded as visually demonstrated.
#
# Section rationale: the Introduction is where this book's framework exists as a system. It states
# all six principles with their definitions, names the single obstacle they are all aimed at, states
# how they are meant to be used together and how they are not, and carries most of the book's
# evidence. Chapters 1-6 develop one principle each; the epilogue was not processed. Each principle
# object below therefore records what the Introduction says and supports, NOT the book's full case
# for that principle. That scope limit is stated in PROVENANCE.md rather than left implicit.
#
# EXTRACTION NOTE — read this before reading the evidence fields. This source's support is
# overwhelmingly **published research by named third parties**: Elizabeth Newton's 1990 Stanford
# dissertation, Joel Best and Gerald Horiuchi's Halloween study, a 1999 Israeli advertising-template
# study, an ABC News poll. SPEC-03's `empirical_within_source` is defined as "the source reports its
# own measurement", and the fixed characteristic list has no value for cited external research. The
# least assumptive faithful choice was made: `empirical_within_source` is applied ONLY where the
# measurement is the authors' own (Chip Heath's forty experiments), and every cited third-party
# study is recorded in full — researcher, design and numbers — in a caveat marked
# `extractor_observed`. The consequence is that this book's structured evidence profile reads
# weaker than the book actually is. That is a gap in the vocabulary, not a judgement about the
# source, and it is logged in the Lane C issue file.

