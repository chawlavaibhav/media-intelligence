# ───────────────── Creativity as a systematic skill ─────────────────

- sk_id: sk_hea_mts_0025
  source_id: heath_made_to_stick_introduction
  source_terms:
    - "In 1999, an Israeli research team assembled a group of 200 highly regarded ads... They found that 89 percent of the award-winning ads could be classified into six basic categories, or templates."
    - "when the researchers tried to classify these \"less successful\" ads, they could classify only 2 percent of them"
    - "Highly creative ads are more predictable than uncreative ones."
  concept_label: successful_creative_work_is_more_pattern_bound_than_unsuccessful_work
  label_origin: extractor_assigned
  claim: >
    Work regarded as highly creative conforms to a small number of patterns more often than ordinary
    work does. The source reports a 1999 Israeli study of 200 award-winning and finalist
    advertisements, of which 89 per cent fell into six templates, against 200 non-award
    advertisements from the same publications for the same product types, of which only 2 per cent
    could be classified at all. The source draws the counterintuitive conclusion that highly creative
    advertisements are more predictable than uncreative ones, and quotes Tolstoy: all happy families
    resemble each other, but each unhappy family is unhappy in its own way.
  claim_type: explicit_source_claim
