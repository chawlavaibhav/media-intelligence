  role: [diagnoses]
  observation_unit: whole_asset
  rationale: >
    SPEC-01 records intended relationships between entities. This source supplies the complementary
    failure: a relationship the viewer infers because two elements were placed close together, which
    nobody intended. Because the source states the signal works in both directions, absence of
    closeness is checkable too — two entities the brief says are related, set far apart, is the same
    defect inverted.
  applicability:
    when: "an asset whose Creative IR declares relationships between entities or copy elements"
    limits: >
      Requires the whole asset; proximity is a property of the arrangement. The source discusses
      static page layout. Nothing here establishes how the effect behaves over time in video, and the
      source makes no claim about that.
