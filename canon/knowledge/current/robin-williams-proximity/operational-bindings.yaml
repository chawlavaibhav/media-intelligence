  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [derives, diagnoses]
  rationale: >
    The source treats the relative size of gaps as encoding structure — equal gaps for peers, an
    enlarged gap for an item of a different kind, a much larger gap for subsidiary material. That is
    a concrete way to express a declared spatial arrangement, and a way to detect when the arrangement
    on the page contradicts the structure the brief declared.
  applicability:
    when: "a still creative or frame whose spatial arrangement is being specified or reviewed"
    limits: >
      The graded reading is our synthesis across four separately stated cases, not a claim the source
      makes in general form. The source gives no numeric ratios: it says which gap should be larger,
      never by how much.
