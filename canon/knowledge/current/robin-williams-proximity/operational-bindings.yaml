- binding_id: bnd_rw_c002_0005
  source_knowledge_refs: [sk_rw_c002_0001, sk_rw_c002_0007, sk_rw_c002_0031]
  source_system_refs: []
  target_type: creative_ir
  target_path: creative.hierarchy
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [diagnoses]
  rationale: >
    A declared ranking implies a single definite entry point. This source supplies two ways a layout
    contradicts that: no grouping, so no starting point exists at all; or two elements of equal
    strongest emphasis, so the reader has two and bounces between them. Both are detectable against a
    declared rank-1 element.
  applicability:
    when: "a Creative IR declaring a ranked hierarchy over resolvable elements"
    limits: >
      The competing-entry-point claim is about emphasis, not proximity; the source raises it in
      passing and draws no principle from it. It is used here because the demonstration happens to be
      isolated, not because the source developed it.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_rw_c002_0003, t_rw_c002_0008]
  repair_ontology_refs: [t_rw_c002_0011]
  status: proposed
  status_reason: "not reviewed"

