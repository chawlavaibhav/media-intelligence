- binding_id: bnd_rw_c002_0004
  source_knowledge_refs: [sk_rw_c002_0006, sk_rw_c002_0027, sk_rw_c002_0026, sk_rw_c002_0007]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  role: [evaluates, diagnoses]
  observation_unit: whole_asset
  rationale: >
    Supplies a coarse, cheap check on whether an asset is over-fragmented: count the separate visual
    elements, and treat more than three to five as the trigger for regrouping. The source's own
    procedure — squint, then count eye stops — is a deliberate low-fidelity method, which is
    consistent with its separate claim that grouping stays legible when content cannot be read.
  applicability:
    when: "a first-pass structural check on a still creative before finer evaluation"
    limits: >
      The source qualifies its own threshold with "it depends on the piece", so this supports
      flagging for review rather than a pass or fail. It says nothing about how an automated counter
      should decide what constitutes one element, which is the hard part.
  evidence_basis: derived_from_source
  empirical_refs: []
