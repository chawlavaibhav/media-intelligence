- sk_id: sk_rw_c002_0002
  source_id: williams_non_designers_design_book_ch2_proximity
  source_terms:
    - "Items or groups of information that are not related to each other should not be in close proximity (nearness) to the other elements, which gives the reader an instant visual clue to the organization and content of the page."
    - "Don't create relationships with elements that don't belong together! If they are not related, move them apart from each other."
  concept_label: unrelated_items_must_be_kept_apart
  label_origin: extractor_assigned
  claim: >
    Items that are not related to each other must not be placed in close proximity. Separation is
    itself a signal: the absence of closeness tells the reader those items do not belong together.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [page_layout_for_print_and_web]
    conditions: "any page containing items that are not related"
  caveats:
    - text: "the source sets this out as an equal half of the principle rather than as a corollary, italicising the negation in both statements of it, and repeats it in the chapter's closing list of things to avoid"
      origin: source_stated
    - text: "the newsletter flag is the worked case: two items placed together were implying a relationship the author judged wrong, so the fault was a false grouping rather than a missing one"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "if they are not related, move them apart from each other"
  examples:
    positive:
      - {description: "newsletter flag in which the society name and the tagline sat together, implying a relationship the author judged incorrect", figure_ref: vis_newsletter_flag}
  intra_source_relations:
    - {relation: contradicts, target: sk_rw_c002_0001, note: "matched pair"}
    - {relation: depends_on, target: sk_rw_c002_0004, note: "separation only signals if closeness signals"}
