- sk_id: sk_sam_c003_0032
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Spatial zones are areas within a page or spread that are designated for specific functions, or assigned particular kinds of content, as a means of both invigorating layouts and helping readers navigate."
    - "spatial zones add some of the qualities of a hierarchic grid into grids defined by regular intervals"
  concept_label: spatial_zones_import_hierarchic_behaviour_into_a_regular_grid
  label_origin: extractor_assigned
  claim: >
    Spatial zones are regions of a page or spread designated for a function or a kind of content,
    both to invigorate layouts and to help readers navigate. In a column grid a flowline or two
    defines horizontal zones and a column or group of columns defines vertical ones; in a modular
    grid groups of rows or columns do the same. A designer may also add a flowline or vertical
    guide independent of the grid's basic structure, deliberately interrupting its regularity to
    emphasise the zone; and modules may be grouped in mosaic-like patterns to make stepped or
    irregularly shaped zones. In effect, spatial zones add some of the qualities of a hierarchic
    grid to a grid defined by regular intervals — useful for separating continuous text from
    recurring sidebars or information graphics, or for correlating the text of a step-based process
    with the images illustrating each step.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A zone is not a new kind of part; it is a role assigned to a group of existing parts, which
      is why it can be added to any regular structure without changing it.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design, web_design]
    conditions: "content with distinguishable functions inside one format"
  caveats:
    - text: "the source licenses adding a guide independent of the grid in order to emphasise a zone, which is a sanctioned violation appearing well before the section that discusses violation"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
