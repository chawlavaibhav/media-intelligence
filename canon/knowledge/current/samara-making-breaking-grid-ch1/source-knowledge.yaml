- sk_id: sk_sam_c003_0078
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Pacing can be understood as a kind of cadence or “timing” a viewer will apprehend from one part to another, as well as the degree of dynamism or activity they perceive."
    - "ordering is about function; pacing is about feeling"
  concept_label: pacing_is_feeling_where_ordering_is_function
  label_origin: extractor_assigned
  claim: >
    Rhythmic pacing from part to part within a sequence-based format is a powerful way of keeping a
    grid's use lively. Pacing is the cadence or timing a viewer apprehends from one part to the
    next, and the degree of dynamism they perceive. Varying it from slow to fast or quiet to
    dynamic does two things: each new page or screen engages the reader afresh, and the reader is
    cued to a significant change of content, which clarifies informational function. Pacing is
    distinct from ordering, which accounts for the location and actual sequence of raw content;
    pacing is the formal variation imposed on that. Ordering is about function; pacing is about
    feeling. Applying the system's rules for sizes, weights and styles will automatically create a
    recognisable rhythm supporting the informational ordering, but that intrinsic pacing may seem
    too even for the designer's concept, and it falls to the designer to balance deriving pacing
    from the content's own ordering against invigorating the viewer.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A change in formal treatment is read as a change in kind, so varying the rhythm signals a
      content boundary without any explicit marker.
  scope:
    domain_discussed_by_source: [publication_design, editorial_design, web_design]
    conditions: "sequence-based formats"
  caveats:
    - text: "the source says pacing is somewhat intuitive and offers being methodical only as an initial aid — sketching an abstract or iconic storyboard of the visual states to be achieved"
      origin: source_stated
    - text: "the source states the tension as arguable in both directions and leaves it to the designer, which is the section's most explicit refusal to decide"
      origin: extractor_observed
  source_stated_problems:
    - "intrinsic pacing that seems too even or too quiet for the intended concept"
  source_stated_remedies:
    - "sketch an abstract storyboard of visual states to see a pacing strategy unfold"
  examples:
    positive:
      - {description: "a spread sequence whose pacing rule is simple — chapter openers alone divided by a full-page bleed, images alternating high/low and left/right, large following small", figure_ref: f0075-01}
      - {description: "pacing in a scrolling page, where the field is contiguous and pacing becomes lateral positioning against changes in the depth and width of masses", figure_ref: f0074-02}
  intra_source_relations:
    - {relation: specialises, target: sk_sam_c003_0075, note: "how variation is sustained across a whole sequence"}
    - {relation: depends_on, target: sk_sam_c003_0031, note: "the same signalling logic used with flowlines"}
