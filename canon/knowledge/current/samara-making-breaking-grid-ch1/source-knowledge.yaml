- sk_id: sk_sam_c003_0054
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "If the project’s grid requires only columns (and, optionally, a flowline or two), developing a row structure is unnecessary"
    - "Historically, such baseline alignment has been considered desirable, but this is a subjective preference."
  concept_label: baseline_alignment_across_columns_is_a_preference_not_a_requirement
  label_origin: extractor_assigned
  claim: >
    A row structure is only needed if the project requires a modular grid; for a column grid with
    at most a flowline or two, all that remains after placing the columns is to set the head and
    foot margins. The preliminary decision for a row structure is whether baselines in adjacent
    columns should align horizontally. The source states plainly that although this has
    historically been considered desirable, it is a subjective preference — and notes it is
    difficult, because each text style's leading is likely to differ, and harder still if
    paragraphs are separated by a different leading measure than contiguous text, or if space is
    added before or after a hard return. If baseline alignment is judged unimportant the designer
    may simply choose a depth interval for rows and gutters, decide how many rows are useful, and
    set head and foot margins as they see fit.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Baseline alignment across columns requires every style's leading to reconcile, so its
      difficulty rises with the number of text styles and with any spacing that is not intrinsic to
      the leading.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design, typography]
