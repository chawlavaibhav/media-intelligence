- sk_id: sk_sam_c003_0058
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "The guides in the baseline grid must land precisely where the row guides, row-gutter guides, and foot-margin guides are located."
    - "To accomplish this, the designer will have to do some math."
  concept_label: the_baseline_grid_must_be_reconciled_with_the_rows_by_arithmetic
  label_origin: extractor_assigned
  claim: >
    Where baselines are to align, a baseline grid is specified so text styles can be locked to it.
    For a column grid without rows this is simple: define the increment as the common leading
    number and set where the grid starts, typically just under the head margin so the smallest
    style can hang from the head margin and sit on the first guide. For a grid with rows it is
    harder, because the baseline guides must land exactly on the row guides, the row-gutter guides
    and the foot margin — text must be separable from images by the row gutter yet still flow down
    a column through that gutter and stay locked, with its last line resting on the foot margin.
    The source gives an eight-step arithmetic procedure: convert all measurements to points; measure
    the page height in points; total the depth of the rows and gutters that fit; subtract to get
    the remainder for head and foot margins; split that remainder, removing a row if the margins
    come out too tight; set the margins; create the document guides against the margins rather than
    the page and check the top and bottom row guides strike the head and foot margins; then set the
    baseline increment and start position and check the guides land on every row, row-gutter and
    foot-margin guide, restarting the baseline grid at a different position if they do not.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Text must cross the row gutter without leaving the baseline lattice, which is only possible
      if the lattice is a whole-number divisor of the row and gutter depths as well as of the
      leading.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design, typography]
    conditions: "modular grids with locked baselines, in page-layout software"
  caveats:
    - text: "the worked example uses a 6-point common leading, a 48-point row and a 12-point gutter on a 570-point page, giving 8 rows at 468 points and a 102-point remainder split 66 above and 36 below — specific to that example and not a general result"
      origin: source_stated
    - text: "this is the only claim in the section whose success condition is checked against software behaviour rather than against a reader or a page"
      origin: extractor_observed
    - text: "the remedy when the arithmetic fails is to remove a row or restart the grid at a different depth — the structure yields, not the typography"
      origin: extractor_observed
  source_stated_problems:
    - "margin measures that come out too tight once the rows are fitted"
    - "baseline guides that do not land on the row and gutter guides"
  source_stated_remedies:
    - "remove a row, or reproportion the row depth from a different leading interval"
    - "start the baseline grid at a different depth and test again"
  examples:
    positive:
      - {description: "worked integration of a 6-point baseline grid with a 48-point row and 12-point row gutter on a 570-point page", figure_ref: f0051-01}
  intra_source_relations:
    - {relation: depends_on, target: sk_sam_c003_0055, note: "requires the common leading number"}
    - {relation: contradicts, target: sk_sam_c003_0028, note: "paragraph breaks are elsewhere freed from the row guides"}
