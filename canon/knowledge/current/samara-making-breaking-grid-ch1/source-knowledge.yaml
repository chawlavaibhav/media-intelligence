- sk_id: sk_sam_c003_0053
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "it makes the most sense to base the column gutter measure on the requirements of the running text"
    - "The spaces that remain on either side of that column group will form the outer and inner margin measures."
  concept_label: gutter_from_running_text_margins_from_the_remainder
  label_origin: extractor_assigned
  claim: >
    The universal width increment does not account for the space between columns, so the gutter is
    derived next, and from the running text — because running text is the most ubiquitous and most
    important style, and because the reader's eye must move downward through it without jumping
    horizontally into the adjacent column. In practice: set two deep columns of running text side
    by side at the universal width, separate them as desired, and measure the space between their
    bounding boxes; then reproduce that measure between the guides over the specimen stack. Once
    column and gutter widths are known, the final step is to fit as many columns plus gutters as
    will go within the page format; the spaces left on either side become the outer and inner
    margins.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The gutter's job is to stop the eye jumping sideways mid-paragraph, so the text most at risk
      of that — the longest continuous text — is what sets the measure.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design]
    conditions: "column grids derived from typesetting attributes"
  caveats:
    - text: "the lateral margins are a residue of the column arithmetic here, while elsewhere the source says notational elements usually force the margin measure to increase; the two derivations are not reconciled"
      origin: extractor_observed
  source_stated_problems:
    - "the reader's eye jumping horizontally into an adjacent column"
  source_stated_remedies:
    - "set the gutter from the running text's requirements, then take the margins as what is left"
  examples:
