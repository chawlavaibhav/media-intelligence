- sk_id: sk_sam_c003_0006
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Nowadays, everything is possible, so book-format conventions have at last come to the fore. A webpage is, after all, just another editorial medium."
    - "Current Web formats define margins around a body that emphasizes columns, rather than rows"
  concept_label: web_page_is_book_anatomy_with_a_column_emphasis
  label_origin: extractor_assigned
  claim: >
    The web page has converged on book-format anatomy: a header of shallow depth spanning the
    browser width for titling and branding, a body inset by margins all round, and a shallow
    footer for secondary information. Two things differ. Current web formats emphasise columns
    rather than rows, because column alignment is what accommodates responsiveness; and the head
    margin typically stays constant while the side margins contract as the browser closes or the
    page reorients to a smaller device. Header and footer may scroll with the page or be pinned.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Columns are emphasised because they are the alignment relationships that survive a change of
      viewport width; rows are not.
  scope:
    domain_discussed_by_source: [web_design, interaction_design]
    conditions: "browser-delivered layouts"
  caveats:
