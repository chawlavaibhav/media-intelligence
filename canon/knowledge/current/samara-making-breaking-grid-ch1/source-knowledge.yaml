- sk_id: sk_sam_c003_0033
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "The consistency of these elements’ presence means they can easily become distracting, so they require adequate spatial separation from text or other content."
    - "Their positions, sizes, and styles dramatically influence the proportions of margins in which they’re placed (usually forcing the margin measure to increase"
  concept_label: constant_position_makes_notational_elements_costly
  label_origin: extractor_assigned
  claim: >
    Folios, runners and their web equivalent, navigation, occupy the same location on every page.
    That constancy has three consequences the source says designers neglect. They become
    distracting, so they need adequate spatial separation from other content. They frustrate
    layout, because content cannot go where the folio or runner already is. And they drive the
    structure, because their position, size and style usually force the margin measure to increase
    to keep text from coming uncomfortably close.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Repetition in a fixed location is what makes these elements both noticeable and obstructive;
      the same property produces all three consequences.
  scope:
    domain_discussed_by_source: [publication_design, editorial_design, web_design]
    conditions: "any paginated or sequenced format"
  caveats:
    - text: "the source explicitly equates print folios and runners with web navigation, calling them the print version of navigation"
      origin: source_stated
    - text: "this is the only place in the section where a small recurring element is said to determine a major structural measure; the margin is otherwise derived from the column arithmetic"
      origin: extractor_observed
  source_stated_problems:
