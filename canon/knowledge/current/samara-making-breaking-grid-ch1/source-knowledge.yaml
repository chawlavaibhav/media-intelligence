  concept_label: fifty_to_eighty_characters_per_line_fixes_the_paragraph_width
  label_origin: extractor_assigned
  claim: >
    Regardless of type size or the reader's maturity, between fifty and eighty characters including
    spaces can be processed before a line return — with words averaging five to ten letters, roughly
    eight to twelve words per line, and about sixty-five characters usually ideal. That count
    determines the paragraph's width for a given typeface at a given size. Two consequences follow:
