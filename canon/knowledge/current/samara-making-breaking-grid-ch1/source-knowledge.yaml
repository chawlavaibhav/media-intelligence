- sk_id: sk_sam_c003_0057
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "material that is contiguous, or more closely related in meaning, should be closer together; and information that is not contiguous, or unrelated in meaning, should be further apart"
    - "make sure they also increase in proportion incrementally—from the tightest (between letters) to the largest (the margins)"
  concept_label: every_space_in_the_layout_should_step_up_in_proportion
  label_origin: extractor_assigned
  claim: >
    The printer's ratio expresses a general principle about space in typographic information:
    material that is contiguous or closer in meaning should be closer together, and material that
    is not should be further apart. That logic applies to every kind of space in or between
    typographic components. So beyond independently determining optimal interline space, paragraph
    separation, column and row gutters and margins, the designer must ensure these increase
    proportionally and incrementally from the tightest — between letters — to the largest — the
    margins — adjusting all of them as needed.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Distance is read as relatedness, so a consistent progression of spacing makes the levels of
      the hierarchy distinguishable by space alone.
  scope:
