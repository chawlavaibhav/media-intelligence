      - {description: "a website with three horizontal bands and vertical sub-zones in the lower two, separating navigation from content", figure_ref: f0039-01}
      - {description: "a printmaking book dividing the spread with a single flowline: step text below, images above, images occasionally crossing the boundary", figure_ref: f0039-02}
