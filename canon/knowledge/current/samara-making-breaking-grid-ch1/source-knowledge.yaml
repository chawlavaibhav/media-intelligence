- sk_id: sk_sam_c003_0043
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "constructing a grid is a planning process, not an implementation process, review all of the content and choose instances that differ most widely"
    - "Working by hand (yes!) frees one from the mechanical qualities of working with mouse and software, and working small prevents getting overly invested in details."
    - "overlay the sketches transparently so as to see the elements through all the layers"
  concept_label: sketch_the_extremes_by_hand_then_overlay_them_to_find_the_grid
  label_origin: extractor_assigned
  claim: >
    A concrete procedure for deriving a grid. Review all the content and choose the instances that
    differ most widely — extremes of content volume and kind. Sketch those by hand and small: by
    hand to escape the mechanical quality of mouse and software, small to avoid becoming invested
    in detail. Scan the sketches, or export and convert them if working digitally, and overlay them
    transparently so the elements of every layout are visible through all the layers. Some
    alignments and proportions will correspond and some will not; working from those that do,
    adjusting those that do not, and splitting the difference where two are close, construct a
    column grid and add whatever flowlines the composite suggests — or convert it to a modular grid
    for more precise control.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Overlaying the widest-differing layouts makes the alignments they already share visible, and
      those shared alignments are the grid the content itself implies.
  scope:
    domain_discussed_by_source: [graphic_design, editorial_design, publication_design]
    conditions: "a project whose content range is known"
  caveats:
    - text: "the source notes the sketches are very raw but that an overall visual concept is clear enough to proceed"
      origin: source_stated
    - text: "the procedure resolves disagreements by splitting the difference, which is a judgement rather than a derivation; nothing says how far apart is too far"
      origin: extractor_observed
