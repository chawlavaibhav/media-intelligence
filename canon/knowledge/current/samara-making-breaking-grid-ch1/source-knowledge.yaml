  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Starting with the smartphone screen format as the basis for a column structure, then, is almost a no-brainer. Its “ready-made” column width presents an opportunity to problem-solve"
    - "developing a grid is a matter of arranging columns of the smartphone width side-by-side to fill the increasing screen area"
  concept_label: the_smartphone_width_is_a_ready_made_base_column
  label_origin: extractor_assigned
  claim: >
    Establishing a grid for an interactive experience should be no different from doing so for a
    brochure or newspaper, except that a layout designed for a large desktop monitor must be
    anticipated on a smartphone screen. The smartphone's limited area is an unavoidable physical
    reality, but its particular width accommodates a range of legible type sizes with more or less
    optimal attributes — so it is a ready-made column. Working from small screen to large means
    arranging columns of the smartphone width side by side to fill the increasing area, and the
    base column can be subdivided for more flexibility and variation. Using the smartphone
    proportion as the base column keeps a consistent proportion between the smallest and largest
    formats and enforces visual continuity throughout, even after subdivision.
