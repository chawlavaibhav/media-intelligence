    - {relation: depends_on, target: sk_sam_c003_0025, note: "the same either-fit-or-clearly-refuse logic"}
    - {relation: trades_off_with, target: sk_sam_c003_0073, note: "cohesion from a carried idea against the force of an exception to it"}
