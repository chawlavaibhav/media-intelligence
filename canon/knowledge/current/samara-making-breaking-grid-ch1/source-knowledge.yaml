- sk_id: sk_sam_c003_0012
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "A modular grid is a column grid with a large number of horizontal flowlines that subdivide the columns into rows, creating a matrix of cells called modules."
    - "Smaller modules provide more flexibility and greater precision, but too many subdivisions can become confusing or redundant."
  concept_label: modular_grid_and_the_module_size_tradeoff
  label_origin: extractor_assigned
  claim: >
    For extremely complex projects carrying many kinds of information, a modular grid may be the
    most useful choice. It is a column grid with many horizontal flowlines subdividing the columns
    into rows, producing a matrix of modules. Each module defines a small chunk of informational
    space; grouped, modules define larger chunks all proportionally related to one another, and
    spatial zones with assigned roles. The degree of control depends on module size, and this is a
    trade-off: smaller modules give more flexibility and greater precision, but too many
    subdivisions become confusing or redundant.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because all modules derive from one subdivision, every grouping of them is proportionally
      related to every other, which is what produces the control.
  scope:
    domain_discussed_by_source: [publication_design, editorial_design, signage, identity_design]
    conditions: "projects with many kinds of information"
  caveats:
    - text: "the source gives no test for when subdivision has gone too far; the limit is asserted, not located"
      origin: extractor_observed
  source_stated_problems:
    - "too many subdivisions become confusing or redundant"
  source_stated_remedies: []
  examples:
