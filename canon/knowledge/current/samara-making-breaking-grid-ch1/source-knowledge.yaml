- sk_id: sk_sam_c003_0076
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "A simple trick to achieving layout variation is to alternately cluster images toward the top or bottom from spread to spread; another is to force a small, medium, and large image onto a spread—and then use the same sizes, but placed in different locations, on the next spread."
    - "These basic strategies create what could be termed “bounce” from spread to spread."
  concept_label: bounce_is_produced_by_alternating_position_while_holding_size
  label_origin: extractor_assigned
  claim: >
    Two concrete tactics for layout variation. Alternately cluster images toward the top or the
    bottom from spread to spread; and force a small, a medium and a large image onto a spread, then
    use the same three sizes in different locations on the next. The source calls the result bounce.
    A third tactic operates a level up: articulating material across several different column
    structures within one project, but using similar positioning logic throughout, produces a large
    difference in the overall rhythm while retaining unity.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Holding one variable constant while alternating another is what makes the change legible as
      rhythm rather than as inconsistency.
  scope:
    domain_discussed_by_source: [publication_design, editorial_design, book_design]
    conditions: "sequences of spreads"
  caveats:
    - text: "the source calls these a simple trick and basic strategies, and coins bounce tentatively — \"could be termed\" — so the vocabulary is offered rather than asserted"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
    - "alternate image clustering top and bottom between spreads"
    - "repeat a set of image sizes in changed positions"
    - "use several column structures with one positioning logic"
  examples:
