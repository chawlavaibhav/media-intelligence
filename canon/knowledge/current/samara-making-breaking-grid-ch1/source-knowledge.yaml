- sk_id: sk_sam_c003_0002
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "A grid's orthogonal (90° axis) logic, and all the thinking about how to work with it, derive from the fundamental verbivisual qualities of type."
    - "Stacking horizontal sentences below each other creates a new vertical line—the column—and columns appearing side by side establish yet another horizontal structure."
  concept_label: grid_geometry_derives_from_the_form_of_type
  label_origin: extractor_assigned
  claim: >
    The right-angled logic of the grid is not imposed mathematics; it grows out of the physical
    form of type. Letters in the Western alphabet are built from vertical strokes; sequenced into
    words and sentences those verticals form a horizontal line; sentences stacked form a new
    vertical, the column; columns set side by side establish a further horizontal structure.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The alternation between vertical and horizontal at each level of assembly is what produces
      an orthogonal structure. The source states the chain explicitly, level by level.
  scope:
    domain_discussed_by_source: [typography, graphic_design]
    conditions: "Western alphabetic typesetting"
  caveats:
    - text: "the source names the Western alphabet specifically as the basis of the claim"
      origin: source_stated
    - text: "no non-Latin writing system is discussed, so whether the derivation holds for scripts with different stroke logic is not addressed"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
