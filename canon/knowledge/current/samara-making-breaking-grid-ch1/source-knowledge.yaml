- sk_id: sk_sam_c003_0019
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "In a column grid without flowlines to constrain them, images may be of any depth and slide up and down the columns without aligning horizontally at any point."
    - "As soon as flowlines are introduced, one must assume there’s a need to create horizontal alignments"
  concept_label: introducing_a_flowline_is_a_commitment_to_horizontal_alignment
  label_origin: extractor_assigned
  claim: >
    Without flowlines, images may be any depth and slide freely up and down the columns, aligning
    horizontally nowhere. Introducing a flowline is itself a declaration that horizontal alignment
    is needed, and from then on images relate to it in one of three ways: hanging from it and
    dropping to any depth, sitting on it, or being proportioned by the distance between two of
    them. Images may also cross from one column or row to another, and so may overlap at different
    sizes and proportions.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A flowline has no function unless something aligns to it, so its presence implies the
      requirement rather than merely offering the option.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design]
    conditions: "images placed on a column grid"
  caveats:
    - text: "\"one must assume\" is the source's phrasing and turns a structural choice into an obligation on whoever uses the grid afterwards"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
