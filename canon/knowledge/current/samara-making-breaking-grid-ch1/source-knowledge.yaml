- sk_id: sk_sam_c003_0052
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "The first stage of this process is to find a universal width increment that all of the optimally styled text specimens can share."
    - "This universal increment will be the column width."
  concept_label: column_width_is_the_increment_all_text_styles_can_share
  label_origin: extractor_assigned
  claim: >
    Once each kind of text has been styled optimally, the column width is derived from them rather
    than chosen. Find a universal width increment that all the optimally styled specimens can
    share: stack them left-aligned, draw guides at their left edges and at each specimen's longest
    line, then shift the long-line guides slightly to discover a fractional relationship between
    the styles' widths — the caption perhaps one half or one third of the running text. Combine
    those fractions, splitting differences where needed, to yield a single width increment that
    governs every style as a multiple of itself: two for the caption, four for running text and so
    on. That increment is the column width. The fastest version compares only the narrowest and
    widest specimens, usually caption and headline; but running text is the most important style
    because it appears in the greatest volume and its readability matters most, so narrowest,
    widest and running text should be compared, and comparing all of them is better still.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      If every style's width is a whole multiple of one increment, every style can be placed on the
      same column structure without any of them being distorted to fit it.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design, typography]
    conditions: "text-led projects where the styles are settled before the structure"
  caveats:
    - text: "the source notes some variance between the original text widths and the new proto-column width will be evident, and says optimal has a character-count tolerance built into it"
      origin: source_stated
    - text: "the derivation absorbs disagreement by splitting differences, so the resulting increment is a negotiated fit rather than a computed one"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "derive one universal width increment that all text styles are multiples of, and use it as the column width"
  examples:
    positive:
      - {description: "left-aligned stack of type-style specimens with guides at their left edges and longest lines", figure_ref: f0048-01}
  intra_source_relations:
    - {relation: depends_on, target: sk_sam_c003_0050, note: "the optimal widths being reconciled come from the character-count rule"}
    - {relation: specialises, target: sk_sam_c003_0047, note: "how the text-first strategy is executed"}
    - {relation: generalises, target: sk_sam_c003_0023, note: "assigning each text kind a column-based width depends on this increment existing"}
