# CANON-003 book 6 (Lane A) — Timothy Samara, "Making and Breaking the Grid", 2nd edn (Rockport,
# 2017). Chapter 1 "Making the Grid", instructional core: printed pages 20-76.
# Fresh SPEC-03 extraction. Granularity: CANON-001 V0 rule, unchanged — split when a claim can be
# retrieved, supported, contradicted or qualified independently; do not split for a further
# example, explanation or restatement.
# Visual completeness: partial_figures_only (EPUB — figures inspectable, printed page does not exist).
#
# SECTION RATIONALE: Chapter 1 divides itself into four named parts. "Coming to Order" (pp.11-18)
# is a historical survey and "Exhibits" (pp.77-124) is a project gallery; neither carries the
# author's craft reasoning. "Grid Basics", "Building a Grid" and "Using a Grid" are the author's
# own division of the instructional material and are continuous — they run taxonomy, then
# derivation method, then judgement. Taking only the first would have given a vocabulary list
# without the reasoning that uses it, so the section was enlarged rather than the count accepted.
#
# NOTE ON THIS SOURCE'S SHAPE: this is a rule-dense procedural manual. Most claims are
# imperative craft rules attached to a named element, and a large proportion of them appear as
# figure captions rather than running prose — the source itself separates them, one rule per
# illustration. The object count is correspondingly high and is a property of the source, not of
# a granularity change. Recorded in the Lane A issue file.

source_id: samara_making_breaking_grid_ch1

