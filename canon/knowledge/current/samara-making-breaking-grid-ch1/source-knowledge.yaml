- sk_id: sk_sam_c003_0077
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Occasionally ignoring a rigorous grid has a dramatic effect on pacing and hierarchy."
    - "The resulting surprise breathes life into the sequence and highlights featured content."
    - "The structure was purposely designed to integrate this kind of transgressive behavior."
  concept_label: violation_works_by_scarcity_and_can_be_designed_into_the_structure
  label_origin: extractor_assigned
  claim: >
    Occasionally ignoring a rigorous grid has a dramatic effect on pacing and ordering. In a series
    of heavily structured layouts a single such instance stands out, and the resulting surprise
    breathes life into the sequence and highlights the featured content. Violation can also be
    planned rather than occasional: a structure may be purposely designed to integrate transgressive
    behaviour, as in a publication on a simple two-column grid that benefits from being constantly
    violated by elements crossing gutters, pushing outside the true margins and intruding into the
    text fields. A violation may also be local and stylistic — an element ignoring alignment and
    width proportions entirely, or one spread arranged symmetrically against asymmetry elsewhere.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The effect depends on contrast with the surrounding regularity, so it is the rigour of the
      rest that gives the exception its force.
  scope:
    domain_discussed_by_source: [publication_design, editorial_design, poster_design]
    conditions: "sequences with an otherwise consistent structure"
  caveats:
    - text: "the source presents both occasional violation and constant designed violation approvingly, without saying at what frequency the scarcity that makes the first work is lost"
      origin: extractor_observed
    - text: "one example is a poster whose grid is violated by a secondary structure of diagonal channels that are themselves based on the row measure, so the violation is derived from the thing it violates"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
    - "violate a rigorous structure occasionally to highlight featured content"
    - "or design the structure to accommodate constant transgression"
  examples:
    positive:
      - {description: "one unstructured instance standing out among a series of heavily structured layouts", figure_ref: f0072-02}
      - {description: "a two-column publication designed to be constantly violated by elements crossing gutters and margins", figure_ref: f0073-01}
      - {description: "a cookbook violated twice — a gold italic callout ignoring alignment entirely, and a symmetrical chapter opening against asymmetry elsewhere", figure_ref: f0073-02}
  intra_source_relations:
