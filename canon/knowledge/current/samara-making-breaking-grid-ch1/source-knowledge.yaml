  concept_label: proportional_difference_between_image_and_format_creates_tension
  label_origin: extractor_assigned
  claim: >
    A second way to build from images is through how their shape relates to the format they appear
    in. A difference in proportion between an image and its surrounding space creates dramatic
    tension that will almost guarantee a dynamic composition even where only one image appears. The
    image's shape can define a module; comparing two images of the same or different proportions
    and finding a correspondence between them can yield a module allowing both to be shown at
    different scales; or the grid may simply be columns whose measure is a fractional subdivision
    of the image's width at the size wanted. Which route is taken depends partly on what other
    content accompanies the images — if the supporting content is not complex or varied, a very
    simple structure may be perfectly useful.
