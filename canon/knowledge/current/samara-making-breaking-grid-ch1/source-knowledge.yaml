- sk_id: sk_sam_c003_0075
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "A grid is successfully implemented only if a designer rises above the uniformity implied by its structure and uses it to create a dynamic visual experience that sustains interest page after page"
    - "The greatst danger in using a grid is to succumb to its regularity."
    - "a system exists to encourage flexibility—its rules are made to allow a range of expression; and second, that the grid is a guide—to be followed as much as possible, but deviated from if there’s a good reason to do so. Grids don’t make dull layouts—designers do."
  concept_label: a_grid_succeeds_only_if_the_designer_rises_above_its_regularity
  label_origin: extractor_assigned
  claim: >
    A grid is successfully implemented only if the designer rises above the uniformity its
    structure implies and uses it to create a dynamic visual experience sustaining interest page
    after page and screen after screen. The greatest danger in using a grid is succumbing to its
    regularity. Two things are to be held in mind: a system exists to encourage flexibility — its
    rules are made to allow a range of expression — and the grid is a guide, to be followed as far
    as possible but deviated from where there is a good reason. Grids do not make dull layouts;
    designers do.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [graphic_design, editorial_design, publication_design, web_design]
    conditions: "any sustained use of a grid across a sequence"
  caveats:
    - text: "\"a good reason\" is the only test given for a legitimate deviation and it is not elaborated anywhere in the section"
      origin: extractor_observed
    - text: "this is the thesis the book's title states and the point at which the section turns from constructing rules to licensing their breach; the second half of the book, not processed here, is devoted to it"
      origin: extractor_observed
  source_stated_problems:
    - "succumbing to the grid's regularity"
    - "a layout that fails to sustain interest page after page"
  source_stated_remedies:
    - "treat the grid as a guide and deviate from it where there is a good reason"
