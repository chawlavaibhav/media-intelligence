- sk_id: sk_sam_c003_0007
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "A grid, in essence, is what happens inside the margins of an individual page, within the body."
    - "Every grid contains the same basic parts, no matter how complex the grid becomes. These parts can be combined as needed or omitted from the overall structure at the designer’s discretion"
  concept_label: every_grid_is_built_from_the_same_six_optional_parts
  label_origin: extractor_assigned
  claim: >
    A grid is what happens inside the margins, within the body, and every grid however complex is
    built from the same parts: columns (vertical alignments separated by column gutters, any
    number, equal or unequal in width); flowlines (alignments breaking the space into horizontal
    bands, one or several); rows (many flowlines at regular repeated intervals from head to foot
    margin, separated by row gutters); modules (the units created where columns and rows
    intersect — or, seen the other way, the units whose grouping produces columns and rows);
    spatial zones (groups of columns, rows or modules forming distinct fields to which a role can
    be assigned); and markers (placement indicators for text that always occupies one location,
    such as running heads, section titles and folios). Any part may be combined or omitted at the
    designer's discretion, and the proportions of the parts depend on the designer's needs.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Rows and columns are reciprocal definitions of the same subdivision — the source states
      explicitly that modules can be seen as produced by their intersection or as the units whose
      grouping produces them.
  scope:
    domain_discussed_by_source: [graphic_design, editorial_design, web_design]
    conditions: "any grid"
  caveats:
    - text: "the source says contemporary convention diminishes margins to maximise the body, so the enclosing frame is itself a moving convention"
      origin: source_stated
    - text: "\"every grid contains the same basic parts\" is a definitional claim, so it cannot be falsified by a counterexample — an odd structure would be called a hierarchic grid instead"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "numbered diagram of columns, flowlines, rows, modules, spatial zones and markers", figure_ref: f0023-01}
  intra_source_relations:
    - {relation: specialises, target: sk_sam_c003_0001, note: "what the alignment relationships are made of"}
    - {relation: generalises, target: sk_sam_c003_0008, note: "the manuscript grid"}
    - {relation: generalises, target: sk_sam_c003_0010, note: "the column grid"}
    - {relation: generalises, target: sk_sam_c003_0012, note: "the modular grid"}
    - {relation: generalises, target: sk_sam_c003_0015, note: "the hierarchic grid"}
