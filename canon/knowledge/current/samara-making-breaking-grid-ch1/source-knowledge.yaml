- sk_id: sk_sam_c003_0065
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "This represents a dramatic shift in compositional emphasis, from emphatically horizontal—in which the verticality of the columns adds contrast—to overtly vertical, in which row divisions assume an increased level of importance."
    - "it’s important that strong horizontal breaks and alignments of a similar quality as will appear in the small format are built into the large format presentation to ensure continuity"
  concept_label: reflow_to_one_column_inverts_the_compositional_emphasis
  label_origin: extractor_assigned
  claim: >
    Material placed in the rightward columns of a large-screen layout reorients into a
    single-column vertical scroll when the browser closes to smartphone width. That is a dramatic
    inversion of compositional emphasis: from emphatically horizontal, where the columns'
    verticality supplies contrast, to overtly vertical, where the row divisions become far more
    important. A change this pronounced can disunify a branded experience, so horizontal breaks and
    alignments of the same quality as those that will appear in the small format must be built into
    the large-format presentation to preserve continuity.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Collapsing several columns into one removes the horizontal reading and leaves only the
      vertical, so whatever the layout's character depended on horizontally has to be carried by
      the rows instead.
  scope:
