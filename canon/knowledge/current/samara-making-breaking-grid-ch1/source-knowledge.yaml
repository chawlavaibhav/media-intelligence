    - "the more columns, rows, or modules left open, the deeper the space will seem—pictorial elements and text will take on the quality of independent, floating objects"
  concept_label: articulation_and_fullness_control_whether_the_page_reads_flat_or_deep
  label_origin: extractor_assigned
  claim: >
    How far the grid is articulated determines whether the space is perceived as flat, with
    material sliding across the surface, or deep, with material on layers in a foreground, middle
    ground and background. Flatness increases with the fullness of the page, with the number of
    alignments explicitly marked by compositional elements, with elements similar in scale, and
    with large amounts of text, which being linear and textural is felt as surface activity rather
    than as mass. Depth increases with the number of columns, rows or modules left open — elements
    then take on the quality of independent floating objects — with greater variety in the shapes
    and proportions of the negative spaces, which also adds movement, and with strong contrasts in
    the relative sizes of elements.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Marked alignments tie elements to a single plane; unmarked ones leave them unattached, so the
      eye reads them as separated in depth rather than as parts of one surface.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design, web_design]
    conditions: "any layout on a regular grid"
  caveats:
    - text: "the source hedges the text claim — a large amount of text will \"more likley be felt\" as surface activity — and this is the section's only perceptual claim stated as a tendency"
      origin: source_stated
    - text: "four factors are said to push each way and no account is given of what happens when they conflict, for instance a full page with strong size contrast"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
