- sk_id: sk_sam_c003_0069
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Building a project’s grid addresses the functional aspects of its content and general organization—but it’s a starting point."
    - "The real work begins with establishing how the material will be articulated within the grid"
  concept_label: the_grid_is_a_starting_point_articulation_is_the_real_work
  label_origin: extractor_assigned
  claim: >
    Building the grid addresses only the functional aspects of content and general organisation. It
    is a starting point; the real work is establishing how the material will be articulated within
    it — what scale relationships will exist between elements, what rhythm the compositions will
    express, how geometric or how organic the material's appearance will be. Even the simplest
    grid admits myriad approaches: material justified to the margins or to specific module depths
    creates a rigid geometry; material hung from a line gains consistency balanced by changing
    depth; material that changes both hangline and depth is the most organic and flexible.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The number of fixed edges an element has determines how static it reads: two fixed edges give
      rigidity, one gives consistency with variation, none gives organic freedom.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design]
    conditions: "any layout once its structure exists"
  caveats:
    - text: "the mechanism stated here — a continuum from fullest and most static to most open and dynamic — comes from a figure caption rather than the running prose"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
