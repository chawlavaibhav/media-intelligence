- sk_id: sk_sam_c003_0040
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Every design problem is different and requires a specific grid to address it well."
    - "the grid is a closed system once it is developed, and in building it the designer must account for the content’s idiosyncrasies"
  concept_label: the_grid_is_a_closed_system_so_content_must_be_assessed_first
  label_origin: extractor_assigned
  claim: >
    Every design problem requires its own grid, and the first step in building a reliable one is to
    assess the informational characteristics and production requirements of the content. The source
    calls this phase extremely important for a specific reason: the grid is a closed system once
    developed. The designer must therefore account up front for the content's idiosyncrasies — the
    nature of the images, how many kinds of text there are, the relative volume of each — and
    anticipate problems that will appear during layout, such as unusually long headlines,
    prohibitions on cropping images, dead spots left when one section's content runs out, or simply
    hitting a required page count.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because the structure cannot be revised once layout begins, every constraint it must satisfy
      has to be known before it is built.
  scope:
    domain_discussed_by_source: [graphic_design, editorial_design, publication_design]
    conditions: "the planning phase of any project needing a grid"
  caveats:
    - text: "the source says most often the designer will combine two or more of the strategies that follow, rather than using one"
      origin: source_stated
    - text: "\"closed system\" is contradicted by the source's own remedy for a misaligned image, which is to add columns or rows during layout"
      origin: extractor_observed
  source_stated_problems:
