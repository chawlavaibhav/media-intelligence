- sk_id: sk_sam_c003_0003
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Within the format, alignments between elements create structure."
    - "space is divided based on content: like information is grouped together, disparate information is separated; their resulting widths and heights subdivide the surrounding field"
  concept_label: structure_is_read_off_content_grouping
  label_origin: extractor_assigned
  claim: >
    Structure arises from the content, not the other way round. Like information is grouped and
    disparate information separated; the widths and heights those groups occupy are what subdivide
    the surrounding field. A grouping may yield a single axis dividing the space into two fields,
    or many axes and correspondingly complex subdivisions. Changes in weight and scale introduce
    hierarchy — the source's word for visual ordering — to the information.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Grouping and separating produce edges; the edges are alignments; the alignments are the
      structure. The demonstration holds content constant and varies only the grouping.
  scope:
    domain_discussed_by_source: [graphic_design, typography]
    conditions: "any composition of mixed information within a format"
  caveats:
