- sk_id: sk_sam_c003_0030
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "it’s not necessary to introduce flowlines into a column grid—but they certainly help contribute horizontal movement and structure that contrasts the up-and-down movement of the columns"
    - "flowlines also create opportunities to educate the viewer as to how the information within the visual field works"
  concept_label: flowlines_give_horizontal_counterpoint_and_teach_the_reader
  label_origin: extractor_assigned
  claim: >
    Flowlines are optional in a column grid. What they buy is first visual — horizontal movement
    in contrast to the columns' verticality — and second navigational: they can help a viewer
    identify where to begin reading; anchor titles or callouts to a particular depth so they are
    recognisable as such, or create a strong hierarchic pause between title and text; make a
    relationship visible between elements that would otherwise look unrelated, such as an image
    and the text referring to it; and define simple spatial zones without resorting to a modular
    grid that would be over-complicated for a simple ordering or for continuous text.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Shared depth is read as shared status, so putting two elements on the same flowline asserts a
      relationship between them without any other cue.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design, web_design]
    conditions: "column grids carrying more than one kind of element"
  caveats:
    - text: "the source's word is \"educate\" — the flowline is presented as teaching the reader a convention over repeated exposure, not as being self-evident on one page"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
