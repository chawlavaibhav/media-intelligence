    inspected: {text: true, figures: []}

- sk_id: sk_sam_c003_0059
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "If the proportions of images to be included all conform to the same aspect ratio... one might use this aspect ratio to define the proportions of a module, and then build columns and rows based on that proportion."
    - "the proportions of typographic elements will share this logic with the images and seem intrinsically well-related to them"
  concept_label: a_shared_image_aspect_ratio_can_define_the_module
  label_origin: extractor_assigned
  claim: >
    Where imagery rather than text is the focus — a poster, a coffee-table book — the structure may
    be defined from the proportions of the images, though typesetting attributes should still be
    considered. If all the images share an aspect ratio, that ratio can define the module's
    proportions, and columns and rows are built from it. Images then scale to sizes defined by
    fields of modules, and typographic elements inherit the same logic and appear intrinsically
    related to the pictures. The resulting grid transposes across formats: margins may stay the
    same or change around the module group; columns or rows of modules may be added or removed to
    suit a format's proportion; and the whole module group may be scaled down as a unit for a more
    detailed grid or up for a simplified, bolder one.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      When one proportion generates the module, everything sized by the module shares that
      proportion, so the relationship between type and image is structural rather than judged.
  scope:
    domain_discussed_by_source: [poster_design, book_design, identity_design]
    conditions: "image-led projects whose images share an aspect ratio"
  caveats:
    - text: "the source's own example shows the row gutters made deeper than the column gutters so captions could sit below rather than beside each image, which is a departure from the module proportion made for a reason outside it"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
