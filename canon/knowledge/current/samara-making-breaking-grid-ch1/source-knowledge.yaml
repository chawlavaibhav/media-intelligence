- sk_id: sk_sam_c003_0011
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "It’s important to always bear in mind that several narrower columns may be combined to create the appearance of wider ones."
  concept_label: narrow_columns_combine_to_read_as_wide_ones
  label_origin: extractor_assigned
