- sk_id: sk_sam_c003_0015
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Sometimes the visual and informational needs of a project require an odd grid that doesn’t fit into any category."
    - "they are based more on an intuitive placement of alignments customized to the various proportions of the elements, rather than on regular repeated intervals"
  concept_label: hierarchic_grid_fits_alignments_to_the_elements
  label_origin: extractor_assigned
  claim: >
    When a project's needs require a structure that fits no category, the answer is a hierarchic
    grid: alignments placed intuitively and customised to the proportions of the actual elements
    rather than set at regular repeated intervals. Column widths and the intervals between them
    vary with context and use; several rows may be grouped in only one part of a format and joined
    by a single column; or the structure may be only a few broad divisions. The source calls it an
    organic approach that still holds the parts together architecturally through clear orthogonal
    relationships, and applies it to books, posters and web pages alike.
