- sk_id: sk_sam_c003_0062
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Resolving them well means conceiving the grid structure from the column or module outward, rather than reverse engineering it from a fully developed grid structure defined for the large-browser experience."
  concept_label: build_a_responsive_grid_outward_from_the_module_not_backward_from_the_desktop
  label_origin: extractor_assigned
  claim: >
    Grid use in screen design has come to the fore because online communication must adapt to
    interfaces of extremely different size, and a grid's modularity suits flexible systems of that
    kind. The recurring difficulty is that device-specific screen sizes are usually considered from
    the outset for functionality, while a project's look and feel are developed in the larger
    desktop browser — so structural discrepancies only appear when the designer works to unify the
    composition. Resolving them means conceiving the structure from the column or module outward,
    rather than reverse-engineering it from a fully developed grid defined for the large-browser
    experience.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A structure defined at the largest size has no guarantee of subdividing cleanly at the
      smallest; one built up from the smallest unit necessarily composes at every size above it.
  scope:
    domain_discussed_by_source: [web_design, interaction_design]
    conditions: "layouts that must adapt across screen sizes"
  caveats:
    - text: "the source also notes the challenge of maintaining the structure while achieving a presentation that does not look templated, and does not say how the two are reconciled"
      origin: source_stated
  source_stated_problems:
    - "misalignments between navigation and content areas"
    - "conflicts between symmetrical and asymmetrical arrangements"
    - "loss of important margin area needed for particular compositional gestures"
  source_stated_remedies:
    - "conceive the structure from the column or module outward"
  examples:
    positive:
      - {description: "a 16-column grid giving device-specific layouts in 2-, 4- and 8-module permutations with consistently sized navigation", figure_ref: f0057-01}
  intra_source_relations:
    - {relation: specialises, target: sk_sam_c003_0006, note: "why web formats emphasise columns"}
    - {relation: generalises, target: sk_sam_c003_0064, note: "the smartphone width as the base column"}
