- sk_id: sk_sam_c003_0010
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Information that is discontinuous benefits from being organized into a grid of multiple columns."
    - "Although their widths must always correspond to those of one or more columns (edge to edge), both images and chunks of text may be of any depth, and positioned freely within the margins from top to bottom of the page"
  concept_label: column_grid_for_discontinuous_information
  label_origin: extractor_assigned
  claim: >
    Discontinuous information benefits from multiple columns. The column grid is flexible because
    columns can be dependent on one another for running text, independent for small blocks, or
    crossed over to make wider measures, so different kinds of information can be separated — for
    instance running text and large images in some columns and captions in an adjacent one. Widths
    must always correspond edge to edge to one or more columns, but depth is free: images and
    chunks of text may be any depth and positioned anywhere between the margins. Horizontal
    alignment is optional and is bought by adding flowlines; the more constants required, the more
    flowlines.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Width is constrained and depth is not, because columns fix lateral alignment while vertical
      position is only fixed when a flowline is introduced to fix it.
  scope:
    domain_discussed_by_source: [editorial_design, publication_design, web_design]
    conditions: "content of more than one kind, or text that does not run continuously"
  caveats:
    - text: "the source calls the three-column grid ubiquitous and familiar enough to be easily navigated, which is a claim about audience habituation rather than about the structure"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
    - "add a flowline for each horizontal alignment the project actually needs"
  examples:
    positive:
      - {description: "diagrams of column grids, described by the source as a tiny fraction of those possible", figure_ref: f0026-01}
      - {description: "a four-column spread where scale change of type acts as a foil to the grid", figure_ref: f0027-01}
