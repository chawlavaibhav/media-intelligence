      - {description: "two modular layouts, one flatter because modules are articulated as abutting geometric planes, one reading as objects floating in deep space through separation, size contrast and open modules", figure_ref: f0068-02}
      - {description: "cookbook spreads where type recedes into deep space on a dark ground with only three articulated elements, and reads as surface on a white ground with more alignments marked", figure_ref: f0069-01}
  intra_source_relations:
