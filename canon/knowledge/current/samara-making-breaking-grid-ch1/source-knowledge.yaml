- sk_id: sk_sam_c003_0022
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Similar to the way images should correspond to a grid’s alignment guides, so too should text—regardless whether it is a headline, a deck, running text, a callout, or caption."
    - "Text is organic: When it runs out, it runs out."
  concept_label: text_obeys_the_same_alignment_discipline_but_ends_where_it_ends
  label_origin: extractor_assigned
  claim: >
    Text corresponds to the grid's guides exactly as images do, whatever kind of text it is. Text
    set flush left has its aligned edge on the left edge of a column and the right edge of its
    bounding box butting the right edge of a column. Column and row gutters exist to keep text
    separate when set side by side. A paragraph or column of text always begins from, or hangs
    from, the top edge guideline of a row, but it may cross through a lower row or end in the
