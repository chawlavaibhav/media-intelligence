- sk_id: sk_sam_c003_0055
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "The leading measures of the various styles must be made to share a numeric relationship: Increase and/or decrease the individual leading measures of each text style until all of the measures are divisble by the same number."
    - "One of these intervals is likely to be a good choice for the row depth—probably the one at which the majority of the baselines meet up."
  concept_label: row_depth_comes_from_a_common_divisor_of_the_leading_measures
  label_origin: extractor_assigned
  claim: >
    Where baseline alignment is wanted, the row structure must be built from a commonality between
    the styles' leading measures. Position specimens of each style side by side with their first
    lines on one baseline, then increase or decrease each style's leading until all the measures
    are divisible by the same number. Some styles' baselines will then meet again at particular
    intervals; the interval at which the majority meet is likely the right row depth, and it is
    acceptable that not every style meets there — the odd ones out will still align in various
    instances, just less consistently. The row gutter is typically based on the running text's
    leading but may be any other multiple of the common number. Finally, fit a useful number of
    rows down the page; what remains above and below becomes the head and foot margins.
