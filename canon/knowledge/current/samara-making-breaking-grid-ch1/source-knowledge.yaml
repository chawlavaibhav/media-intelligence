- sk_id: sk_sam_c003_0004
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "Thinking structurally about layouts means being able to see not only the forms, or positive elements, but negative spaces—“white space,” as it’s often called—as shapes of equal importance in the composition."
    - "A grid organizes space as much as it does the stuff that’s in it."
  concept_label: negative_space_is_a_shape_of_equal_importance
  label_origin: extractor_assigned
  claim: >
    Typographic space is governed by the part-to-whole relationships alignments define and, more
    importantly, by the relation of positive to negative that those alignments create. Negative
    space must be seen as shapes of equal importance to the elements, because a grid organises the
    space as much as the material in it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Negative spaces have proportions of their own that can be set in counterpoint to the
      elements: the source's worked example describes vertical rhythm in the negative spaces
      counterpointing a strong horizontal axis, and horizontal negative shapes echoing the
      proportion of the image.
  scope:
    domain_discussed_by_source: [graphic_design, typography]
    conditions: "any composition within a format"
  caveats:
    - text: "the source's worked example for this claim is a spread from this same book, analysed by its own author"
      origin: extractor_observed
    - text: "\"more importantly\" ranks the negative relation above the part-to-whole relation without giving grounds"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
