- sk_id: sk_sam_c003_0005
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "All page-layout conventions descend from the book format that developed between the fall of the Roman Empire in 476 CE and the European Renaissance of the 15th century."
    - "the codex necessitated breaks in text to prevent it from traveling over the folded foredges—hence, the familiar block of text, surrounded by open space"
  concept_label: page_anatomy_descends_from_the_codex
  label_origin: extractor_assigned
  claim: >
    Today's page-layout conventions descend from the mediaeval book. The scroll presented a
    continuous field of text; the codex, folded accordion-style between boards, forced breaks so
    text would not run over the folded foredges, which produced the familiar text block surrounded
    by open space and, in time, left and right sides — the page, and the spread. The components
    that evolved from it each carry a specific name: the body, the margins, the runner (running
    head, running foot or running side depending on position), and the folio.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A physical constraint of the codex — text must not cross the fold — is given as the cause of
      the block-and-margin arrangement, which then became convention.
  scope:
    domain_discussed_by_source: [book_design, editorial_design]
    conditions: "printed page-based formats"
  caveats:
    - text: "the source warns that some contemporary editors use \"folio\" for the page number and runner together, not the page number alone"
      origin: source_stated
    - text: "a historical derivation asserted without citation; the naming, not the history, is what the rest of the section relies on"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "numbered diagram of the printed page's parts", figure_ref: f0022-01}
  intra_source_relations:
