- sk_id: sk_sam_c003_0008
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "The block, or manuscript, grid is structurally the simplest kind of grid: It consists of a single, relatively large text block on each page of a spread"
  concept_label: manuscript_grid_for_extensive_continuous_text
  label_origin: source_verbatim
  claim: >
    The manuscript or block grid is the simplest structure: one relatively large text block per
    page, whose purpose is to carry extensive continuous text such as a book or long essay. An
    occasional image may sit inside the text area; ample margins may hold notes, spot illustrations
    or other editorial features that occur irregularly and therefore do not warrant articulating
    additional columns. Even at this simplicity the range is wide — block size relative to page,
    even or dramatically uneven margins placing the block high, low, near the gutter or near the
    foredges, symmetrical or asymmetrical placement across the gutter, and an added flowline to
    separate titling.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: "Irregular content does not justify a column because a column is a commitment to regularity."
  scope:
    domain_discussed_by_source: [book_design, editorial_design]
    conditions: "extensive continuous text"
  caveats:
    - text: "the source's own examples include a spread with nested or doubled bodies — narrower margins for text, more generous ones for photographs — which stretches the single-block definition"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies: []
