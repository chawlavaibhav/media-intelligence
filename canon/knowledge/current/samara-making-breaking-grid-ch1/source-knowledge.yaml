- sk_id: sk_sam_c003_0061
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "it’s often the case that images will not be permitted to be cropped. That limitation should not hinder the designer’s layout goals."
    - "make the images transparent and then shift them around, changing their relative sizes, and discover at what sizes their proportions come to refer to each other—at different scales. From there, a module can be distilled"
  concept_label: distil_a_module_from_uncroppable_images_of_many_proportions
  label_origin: extractor_assigned
  claim: >
    Where images may not be cropped — as in a monograph or an exhibition catalogue — a grid must
    still allow layout flexibility, which requires finding a proportional relationship between the
    images themselves. If they share a format the earlier strategies work. If they are of many
    different formats, select one example of each, compare their aspect ratios, and look for
    relationships: some may already correspond in width or depth, others fractionally once their
    relative scales change, as when shrinking one to match another's height makes it half the
    second's width. Where the ratios are very different, make the images transparent and shift them
    around at changing sizes until their proportions refer to one another at some scale, and distil
    a module from that. Taking gutters into account, the resulting modular structure lets images of
    every proportion be scaled very large for impact and very small for detail without any of them
    being cropped.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Any two rectangles refer to one another at some pair of scales, so a module that both are
      whole multiples of can be found even when their aspect ratios have nothing in common.
  scope:
    domain_discussed_by_source: [exhibition_catalogue, monograph, book_design]
    conditions: "projects where images may not be cropped"
  caveats:
