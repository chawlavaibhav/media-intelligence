    section: "Using a Grid — Design as a System: Sequence and Pace"
    page_start: 74
    page_end: 75
    figure_refs: [f0074-01, f0074-02, f0075-01]
    source_support: text
    inspected: {text: true, figures: []}

- sk_id: sk_sam_c003_0079
  source_id: samara_making_breaking_grid_ch1
  source_terms:
    - "It is in these situations where the tension between a grid’s consistent architecture and its ability to flex for different purposes comes to the fore."
    - "the formats of various communications can all be outgrowths of a column or module proportion—or vice versa"
    - "formats produced by similar processes are more likely to be able to be produced simultaneously and, therefore, more inexpensively"
  concept_label: deriving_every_format_from_one_module_gives_cohesion_and_cheaper_production
  label_origin: extractor_assigned
  claim: >
    Grids are especially effective for unifying complex campaigns or identity programmes, where
    messaging, function, complexity and medium all vary — and it is there that the tension between
    a grid's consistent architecture and its need to flex comes to the fore. If the designer can
    anticipate most of the materials to be produced, the formats of the various communications can
    all be outgrowths of a column or module proportion, or the proportion derived from the formats.
    Regulating formats across touchpoints and media yields greater visual cohesion, most
    importantly; it also means the formats can be used harmoniously together, and that formats
    produced by similar processes are more likely to be producible simultaneously and therefore
    more cheaply.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      One shared proportion propagates to every format derived from it, so cohesion is a structural
      consequence rather than something enforced piece by piece.
  scope:
    domain_discussed_by_source: [identity_design, campaign_design, print_production]
    conditions: "multi-format campaigns and identity programmes"
  caveats:
    - text: "the whole strategy is conditional on the designer having the opportunity to anticipate all or most of the materials, which the source states as a condition and does not treat as unusual"
      origin: source_stated
    - text: "this is the only claim in the section whose stated benefit is commercial rather than visual, and the production-cost argument is asserted without figures"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "derive every format in the programme from one column or module proportion"
  examples:
    positive:
      - {description: "a set of related formats from one design studio, credited collectively for the section", figure_ref: f0076-01}
  intra_source_relations:
    - {relation: specialises, target: sk_sam_c003_0059, note: "transposing one module proportion across formats"}
    - {relation: depends_on, target: sk_sam_c003_0040, note: "requires anticipating the materials up front"}
    - {relation: trades_off_with, target: sk_sam_c003_0075, note: "consistent architecture against the need to flex; the source names this tension itself"}
