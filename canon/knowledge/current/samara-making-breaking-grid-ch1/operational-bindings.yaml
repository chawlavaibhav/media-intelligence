- binding_id: bnd_sam_c003_0010
  source_knowledge_refs: [sk_sam_c003_0017, sk_sam_c003_0020, sk_sam_c003_0024, sk_sam_c003_0028]
  source_system_refs: [scs_sam_c003_003]
  target_type: governance
  target_path: null
  governance_consumer: retrieval_governance
  role: [constrains]
  rationale: >
    This source is a clean case of knowledge that becomes wrong when split. The rule "image edges
    align with column and row edges" retrieved without its family is actively misleading: the source
    exempts silhouettes and full bleeds, which have no edges to align; exempts paragraph breaks from
    the row guides outright; permits a rag not to reach the column edge; and answers a wanted
    misalignment by subdividing the grid rather than moving the element. An evaluator or generator
    given the bare rule would flag as errors four things the source explicitly allows.
  applicability:
    when: "deciding what may be retrieved separately from a rule-with-exceptions structure"
    limits: >
      One source. It demonstrates that the governing rule and its exemptions must travel together;
      it says nothing about how such families should be detected in general, and the source itself
      supplies no marker distinguishing a governing rule from an exception — the exceptions are
      simply captions on the following pages.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_sam_c003_0011
  source_knowledge_refs: [sk_sam_c003_0009, sk_sam_c003_0013, sk_sam_c003_0067, sk_sam_c003_0068]
  source_system_refs: [scs_sam_c003_005]
  target_type: governance
  target_path: null
  governance_consumer: evidence_interpretation
  role: [flags]
  rationale: >
    A worked case of two evidence profiles interleaved in one text with nothing marking the join.
    Most of this source is geometric and checkable — a measure, a count, an alignment. Scattered
    through it are claims about what audiences will infer: that a manuscript grid reads as
    authoritative, that a modular grid signifies rationalism, that symmetry reads classical and
    asymmetry modern. Not one reports any audience evidence, and they are typographically
    indistinguishable from the checkable claims around them. Weighing a source that mixes the two
    is a distinct problem from weighing one that is uniformly assertion, and this book is a clean
    example of the type.
  applicability:
    when: "weighing a craft source that contains both mechanically checkable rules and unevidenced audience-inference claims"
    limits: >
      One source. It shows the mixture exists and that nothing in the text signals the switch; it
      says nothing about how common the pattern is, nor how the two kinds of claim should be scored
      against each other. Distinguishing them here required reading each claim, not a rule.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"

