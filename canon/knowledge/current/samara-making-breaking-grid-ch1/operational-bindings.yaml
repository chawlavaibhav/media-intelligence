- binding_id: bnd_sam_c003_0008
  source_knowledge_refs: [sk_sam_c003_0059]
  source_system_refs: []
  target_type: creative_ir
  target_path: delivery.aspect_ratios
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [derives, constrains]
  rationale: >
    SPEC-01 records a list of aspect ratios for delivery and treats them as independent. This source
    says they need not be: where a module proportion generates the formats, or the formats generate
    the module, the set of ratios becomes one system, and columns or rows can be added or removed to
    suit a format while the proportion holds. That is a reason a ratio list might carry a derivation
    rather than being a flat enumeration.
  applicability:
    when: "a set of formats is being produced for one campaign or identity programme"
    limits: >
      Conditional on the designer being able to anticipate most of the materials, which the source
      states as a requirement. Where formats are fixed externally — platform-mandated ratios — the
      derivation runs the other way or not at all, and the source does not treat that case.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed; the schema currently has no place to record a derivation between ratios"

- binding_id: bnd_sam_c003_0009
  source_knowledge_refs: [sk_sam_c003_0018, sk_sam_c003_0041, sk_sam_c003_0043, sk_sam_c003_0052, sk_sam_c003_0053, sk_sam_c003_0055, sk_sam_c003_0058]
