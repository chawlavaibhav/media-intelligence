# CANON-003 book 6 (Lane A) — Samara, "Making and Breaking the Grid" ch.1 core.
# SPEC-04 bindings against SPEC-01 v0.1. Written only after the source representation was stable.
#
# 11 bindings against 79 SourceKnowledge objects. Most of this book does not reach a product field
# and is left unbound, which SPEC-04 says is the normal state. Where it DOES reach one, the fit is
# unusually direct: StaticCreativeExtension names typography_layout, spatial_hierarchy and
# composition-with-depth, and this source is about exactly those three things.
source_id: samara_making_breaking_grid_ch1
derived_against: {schema: SPEC-01, version: v0.1}

operational_bindings:

- binding_id: bnd_sam_c003_0001
  source_knowledge_refs: [sk_sam_c003_0007]
  source_system_refs: []
  target_type: creative_ir
  target_path: StaticCreativeExtension.typography_layout
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [fills]
  rationale: >
    SPEC-01 names a typography_layout field and does not say what may go in it. This source supplies
    a complete and closed vocabulary for it: columns and their gutters, flowlines, rows and their
    gutters, modules, spatial zones and markers, with the source's own statement that every grid is
    made of these and no others. A layout specified in these terms is machine-comparable in the way
    SPEC-01 wants element references to be.
  applicability:
    when: "specifying or reading the layout structure of a static piece"
    limits: >
      The vocabulary is for orthogonal, alignment-based structures. The source's own hierarchic grid
      is defined by intuitive placement, and a layout with no repeating interval can be described in
      these terms only loosely.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_sam_c003_0002
  source_knowledge_refs: [sk_sam_c003_0008, sk_sam_c003_0010, sk_sam_c003_0012, sk_sam_c003_0015, sk_sam_c003_0016]
  source_system_refs: [scs_sam_c003_001]
  target_type: creative_ir
  target_path: StaticCreativeExtension.typography_layout
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [constrains, derives]
  rationale: >
    Each of the five structures is introduced with the content condition that calls for it —
    continuous text, discontinuous information, many kinds of information, needs that fit no
    category, needs one structure cannot serve. Given a described content shape, that narrows which
    layout structures are defensible before any layout exists.
  applicability:
    when: "a layout structure is being chosen and the kinds and volumes of content are known"
    limits: >
      The conditions are stated qualitatively — "extremely complex", "many different kinds" — with
      no thresholds, so this narrows the option set and does not select within it. The source also
      records structures being chosen for what they signify rather than what the content needs, and
      supplies no way to weigh that against the functional match.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_sam_c003_0035]
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_sam_c003_0003
  source_knowledge_refs: [sk_sam_c003_0017, sk_sam_c003_0022, sk_sam_c003_0036]
  source_system_refs: [scs_sam_c003_003]
  target_type: evaluation
  target_path: null
  role: [diagnoses]
  observation_unit: whole_asset
  rationale: >
    The alignment discipline is one of very few claims in this batch that is mechanically decidable.
    Given a layout and the structure it was built on, whether an element's edges land on a column or
    row guide is measurable rather than judged. That makes it a checkable acceptance condition, not
    an opinion about quality.
  applicability:
    when: "a rendered static layout is being checked and the structure it was built on is known"
    limits: >
      Decidability depends entirely on knowing the grid. Where it is not supplied it would have to
      be inferred from the layout, which is the source's own method for deriving a grid and is not
      reliable in reverse. The check is also incomplete on its own: the source's exceptions —
      silhouettes and bleeds judged optically, ragged edges completed by a placed element, hung
      bullets, centred text related by width, paragraph breaks explicitly exempted — would all read
      as failures against the bare rule.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [cc_sam_c003_element_fails_to_meet_the_structure, t_sam_c003_0029]
  repair_ontology_refs: [t_sam_c003_0040]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_sam_c003_0004
  source_knowledge_refs: [sk_sam_c003_0031, sk_sam_c003_0076, sk_sam_c003_0078]
  source_system_refs: [scs_sam_c003_004]
  target_type: evaluation
  target_path: null
  role: [diagnoses]
  observation_unit: asset_set_over_time
  rationale: >
    Variation, bounce and pacing are properties of a sequence and do not exist inside any single
    piece. Whether image position alternates between spreads, whether one set of sizes recurs in
    changed places, whether the rhythm shifts to mark a change of content — none of these can be
    observed in one asset held alone. Any evaluator for them must receive the ordered set.
  applicability:
    when: "evaluating a run of pieces produced under one structure, in their intended order"
    limits: >
      The source gives no threshold for enough variation and states the danger — succumbing to
      regularity — only qualitatively. This supports detecting that a sequence does not vary, not
      judging whether it varies well. The order must be the intended one; the same set shuffled
      would score differently and the source's pacing claims assume a reading sequence.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_sam_c003_0028]
  repair_ontology_refs: [t_sam_c003_0051]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_sam_c003_0005
  source_knowledge_refs: [sk_sam_c003_0074, sk_sam_c003_0070]
  source_system_refs: []
  target_type: creative_ir
  target_path: StaticCreativeExtension.composition
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [fills, derives]
  rationale: >
    SPEC-01's composition field names framing, depth and figure-ground. This source gives depth a
    set of structural determinants rather than a pictorial one: how full the page is, how many
    alignments are explicitly marked, how similar the element scales are, how much text is present,
    and how varied the negative shapes are. That is a way of specifying apparent depth in a flat
    typographic composition, which the field otherwise has no vocabulary for.
  applicability:
    when: "specifying or judging whether a static layout should read as flat surface or as layered depth"
    limits: >
      Four factors are said to push each way and the source never says what happens when they
      conflict — a full page with strong size contrast is unaccounted for. The source also hedges
      the text factor ("more likely be felt"), and none of the five determinants is quantified.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_sam_c003_0050]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_sam_c003_0006
  source_knowledge_refs: [sk_sam_c003_0032]
  source_system_refs: []
  target_type: creative_ir
  target_path: StaticCreativeExtension.spatial_hierarchy
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [fills]
  rationale: >
    A spatial zone is a region of the format with a role assigned to it — images here, step text
    below, navigation in this band. That is what a spatial hierarchy field is for, and this source
    supplies both the construction (groups of columns, rows or modules, or a guide added
    deliberately outside the structure) and the purposes it serves.
  applicability:
    when: "assigning roles to regions of a static format"
    limits: >
      The source permits adding a guide independent of the grid to emphasise a zone, so a zone is
      not always derivable from the structure it sits in. A specification recording zones must
      therefore record them separately rather than compute them from the grid.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"

