  role: [derives]
  rationale: >
    The largest usable block of this source is a derivation that turns typographic measurements into
    a structure: universal width increment, gutter from running text, margins as remainder, leading
    forced onto a common divisor, row depth from where baselines meet, baseline grid reconciled by
    arithmetic. Every step is exactly executable and none of it is a generation action. Production
    IR does not exist, so it is recorded in the source's own frame and parked.
  applicability:
    when: "a layout structure must actually be constructed from settled type styles"
    limits: >
      Deterministic layout operations. NOT translated into generative control — asking a model to
      "use a 5x12 modular grid with 12-point row gutters" is a different and unevidenced claim, and
      making it is a Pass 2 hypothesis this binding does not assert. The chain also carries a cost
      the source concedes: forcing the leading onto a common divisor changes the interline spacing
      previously established as optimal for reading.
  evidence_basis: derived_from_source
  empirical_refs: []
