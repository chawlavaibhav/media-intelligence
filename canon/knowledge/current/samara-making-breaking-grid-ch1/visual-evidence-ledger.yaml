visual_only_observations:

- ref: vis_obs_sam_epub_destroys_the_self_demonstration
  figure: null
  observation: >
    This book argues for page structure and its own printed pages are built on a rigorous grid —
    the source says so directly, twice, citing itself: "the baselines of text positioned in
    adjacent columns should align horizontally with each other (as they do in this book)" and
    "the leading measures of the text styles used in this book are multiples of 2.1". A caption on
    printed page 21 analyses one of the book's OWN spreads as a worked example.
    In the EPUB none of that is inspectable. There is no page, no baseline grid, no spread. The
    self-demonstration is not degraded — it is absent.
  strength: clearly_visible
  why_it_matters: >
    This is a different loss mechanism from the ones seen earlier in this batch. Albers lost colour
    because the SCAN was greyscale; Vignelli lost a section because the text-layer ORDER was wrong.
    Here nothing was scanned or mis-ordered: the publisher's own digital format has no page, so a
    book that is partly evidence for itself stops being able to present that evidence. The loss is
    caused by the delivery format, upstream of any extraction we perform, and no extraction method
    can recover it.
  promoted_to_source_claim: false

- ref: vis_obs_sam_labels_baked_into_images
  figure: [f0028-01, f0032-01]
  observation: >
    Diagram labels are rendered inside the image files rather than set as text. The six modular-grid
    notations on printed page 28 (3x4 through 9x14) exist only as pixels. On printed page 32 the
    caption's "Top / Middle / Bottom" refer to rows within a single image, so the three named
    compound-grid options are verbally listed but visually unresolvable without opening the file.
  strength: clearly_visible
  why_it_matters: >
    A text-only pass over this book does not merely lose pictures; it loses WORDS that the reader
    sees, because those words were typeset into artwork. Nothing in the text stream signals that
    anything is missing. This is silent loss, and it is detectable only by opening the figures.
  promoted_to_source_claim: false

- ref: vis_obs_sam_uncaptioned_figures
  figure: null
  observation: >
    Of the 120 figure references in pp.20-76, 11 are followed by no prose line at all and so carry no
    caption in the text stream: f0027-03, f0030-02, f0033-02, f0034-01, f0036-01, f0038-03,
    f0043-01, f0058-01, f0064-02, f0066-03, f0076-01. Counted mechanically. Some are second halves
    of a caption written for the figure before; f0076-01 and f0076-02 share one credit line covering
    "all images in this section".
  strength: clearly_visible
  why_it_matters: >
    Caption coverage is uneven within one book, so the amount of a figure recoverable from text
    varies figure by figure. f0024-01 is almost fully described in words; f0034-01, the positive
    demonstration of the book's central image rule, is described not at all. An extraction that
    treats "captioned" as "recovered" would over-report completeness on this source.
  promoted_to_source_claim: false

- ref: vis_obs_sam_spatial_deixis_survives_reflow
  figure: null
  observation: >
    78 of 544 sentences in the section (14%) contain spatial deixis — "shown below", "the example
    at top", "diagrammed here", "at left", "opposite". Most still resolve, because the EPUB keeps
    figures in reading order, so "below" reliably means "the next image". The ones that do not
    resolve are those pointing WITHIN a single composite figure ("Top / Middle / Bottom" on p.32)
    or across a printed spread ("as shown in the page structure diagram opposite" on p.22).
  strength: clearly_visible
  why_it_matters: >
    Refines a concern rather than confirming it. Spatial language in a reflowed source is not
    uniformly broken; it breaks specifically where the referent is a position on a printed page or
    a region inside one image. That is a narrower and more checkable failure than "the source is
    spatially argued, therefore text is unreliable".
  promoted_to_source_claim: false

