demonstrations:

- ref: vis_sam_structure_from_content
  figure: f0021-01
  printed_page: 21
  kind: controlled_comparison
  isolation: one_variable_changed
  status: fully_legible_in_colour
  visible_content: >
    Four panels in two rows. Left of each row, a poster for the same event — a Hear-Say reading
    by Henry Magaziner at a Philadelphia bookshop, with the same date, time and address. Right of
    each row, the alignment structure that composition implies, drawn as teal rules.
    Top row: the information is set as one flush-right stack, and the derived structure is two
    fields divided by a single vertical axis. Bottom row: the same information is broken into
    several differently-weighted groups scattered across the format, and the derived structure is
    a multi-field grid of roughly five vertical and five horizontal divisions.
  what_the_visual_supports: >
    That a grid is READ OFF a composition rather than imposed on it. The content is held constant
    and only the grouping changes, and the structure changes with it. It also supports the
    source's narrower claim that a large variety of layouts is reachable inside strict limits:
    both posters use one type family and a small set of sizes.
  requires_prose: >
    That like information is grouped and disparate information separated, and that changes in
    weight and scale are what introduce hierarchy. The picture shows the outcome; the caption
    supplies the rule that produced it.
  lost_in_plain_text: partially
  colour_dependent: false
  extractor_note: >
    This is the clearest minimal pair in the section — same content, one variable (grouping)
    changed, both results shown with their derived structures. The caption states the claim, so
    a text-only extraction keeps the claim and loses the proof.

- ref: vis_sam_image_alignment_rule_and_error
  figure: [f0034-01, f0034-02]
  printed_page: 34
  kind: rule_and_counterexample
  isolation: one_variable_changed
  status: fully_legible_in_colour
  visible_content: >
    f0034-01 shows a spread with a fine column-and-row grid and roughly twenty image blocks. Every
    block begins and ends on a column edge and a row edge. Blocks overlap each other, run across
    the page gutter, and bleed off all four format edges, while still landing on guides wherever
    they cross the body.
    f0034-02 shows the counter-case: a single block on the same kind of grid whose four edges all
    fall in the middle of columns and rows, aligning with nothing.
  what_the_visual_supports: >
    The stated rule — image edges align with column edges left-to-right and row edges
    top-to-bottom — and, more importantly, its permissiveness. Overlapping and bleeding are shown
    to be compatible with the rule, which the sentence alone would not settle.
  requires_prose: >
    The remedy attached to the error. The source does not say "don't do it"; it says if the
    misaligned position looks better, add columns or rows until that position becomes an
    alignment. Nothing in the picture carries that.
  lost_in_plain_text: true
  colour_dependent: false
  extractor_note: >
    f0034-01 has NO caption of its own in the text stream — the only caption on the page belongs
    to f0034-02 and describes the error. A text-only extraction therefore receives the counter-
    example described and the positive demonstration not described at all.

- ref: vis_sam_compound_grid_varieties
  figure: f0032-01
  printed_page: 32
  kind: worked_example
  isolation: not_applicable
  status: fully_legible_in_colour
  visible_content: >
    A three-by-three arrangement of spread diagrams. Two or more grids are superimposed in each
    cell and told apart by colour: teal, red and black rules. Reading by row: top row, two grids
    sharing the same outer margins; middle row, two grids each with its own margins; bottom row,
    two grids separated spatially, one occupying the upper portion of the format and one the lower.
  what_the_visual_supports: >
    That the three compound-grid options the prose lists are geometrically distinct, and what each
    actually looks like. Nine specific cases are shown for three stated options.
  requires_prose: "The names of the three options and the purpose each serves."
  lost_in_plain_text: true
  colour_dependent: true
  extractor_note: >
    Colour is doing the work here. Which rule belongs to which of the superimposed grids is carried
    ONLY by hue. In a greyscale reproduction this figure would still show a dense set of rules but
    would stop demonstrating the thing it exists to demonstrate. Worth recording because the Albers
    book in this same batch failed in exactly that way; this source would have failed the same way
    had the digitisation been greyscale, and it does not.

- ref: vis_sam_modular_notation_specimens
  figure: f0028-01
  printed_page: 28
  kind: worked_example
  isolation: not_applicable
  status: fully_legible_in_colour
  visible_content: >
    Six labelled spread diagrams: 3x4, 3x6, 5x8, 5x12, 6x12 and 9x14 modular grids, each label set
    in small caps beneath its pair of pages, each diagram drawn to the stated column and row count.
  what_the_visual_supports: >
    The C# x R# notation the caption states, by instantiating it six times across a range from very
    coarse to very fine, and by showing what "smaller modules give more precision" means in practice.
  requires_prose: "The notation rule itself, and the trade-off between precision and confusion."
  lost_in_plain_text: true
  colour_dependent: false
  extractor_note: >
    The six labels are TEXT BAKED INTO THE IMAGE. They are not in the EPUB text layer at all. A
    text-only extraction of this page receives the notation rule stated abstractly and none of the
    six worked instances of it — including the fact that the notation's range in practice runs from
    3x4 to 9x14. See the loss pattern recorded below.

- ref: vis_sam_manuscript_grid_range
  figure: f0024-01
  printed_page: 24
  kind: worked_example
  isolation: one_variable_changed
  status: fully_legible_in_colour
  visible_content: >
    Six spread diagrams of the same simplest grid. They vary block size relative to page, margin
    depth (blocks sitting high, low, near the gutter, near the foredges), symmetry versus asymmetry
    across the gutter, and the presence of one or two flowlines cutting the block.
  what_the_visual_supports: >
    The caption's claim that a single-block structure still permits a wide range of content
    distribution. Each variation named in the caption has a panel showing it.
  requires_prose: "Nothing essential — this is one of the few figures whose caption enumerates what the picture shows."
  lost_in_plain_text: true
  colour_dependent: false
  extractor_note: >
    A useful control case. Here the caption is nearly a complete verbal description of the figure,
    so text-only loss is low. Compare f0034-01, where the caption is absent entirely. Loss varies
    enormously between figures inside ONE book.

