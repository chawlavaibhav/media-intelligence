source_id: samara_making_breaking_grid_ch1
pass: independent_visual_evidence
section: "Chapter 1 'Making the Grid' — 'Grid Basics', 'Building a Grid', 'Using a Grid'; printed pp.20-76"

figures_available: 120
figures_inspected: [f0021-01, f0024-01, f0028-01, f0032-01, f0034-01, f0034-02]
visual_completeness: partial_figures_only
visual_completeness_reason: >
  This source is an EPUB. Every figure is present, at usable resolution (median 1030 x 828 px)
  and in full colour, so the CONTENT of the illustrations is fully inspectable. What does not
  exist is the PAGE. An EPUB reflows: there is no printed page to render, so the pass cannot
  see where a figure sat relative to the prose, how the spread was composed, or what the book's
  own layout looked like. Recorded as `partial_figures_only` rather than `verified_page_level`,
  which is the strongest honest description available for this format.

colour_check:
  method: "saturation sampled on 20 randomly selected figures from pp.20-76 (60x60 downsample, 3600 px each)"
  result: >
    Colour is present and intact. 17 of the 20 sampled figures carry coloured pixels, up to
    3,148 of 3,600 sampled. Three are genuinely monochrome artwork rather than stripped colour.
    This is a colour-bearing source, unlike the Albers digitisation, and the grid diagrams in
    particular use colour as a load-bearing device (see vis_sam_compound_grid_varieties).

