  asserts_agreement_between_sources: false

- concept_id: cc_sam_c003_element_fails_to_meet_the_structure
  kind: canonical_concept
  label: element_fails_to_meet_the_structure
  purpose: retrieval_and_aggregation
  created_by: extractor
  asserts_equivalence: false
  children_terms: [t_sam_c003_0029, t_sam_c003_0030, t_sam_c003_0031, t_sam_c003_0032]
  basis: >
    Ours, for retrieval only. Four problems in this source share the surface description "an element
    does not land where the structure says it should" — a misaligned image, a broken aligned edge, a
    detached centred text element, and a rag short of the column edge. They arise differently and
    take four different repairs, so this grouping deliberately asserts no equivalence between them.
  asserts_agreement_between_sources: false

- concept_id: cc_sam_c003_deterministic_layout_repairs
  kind: canonical_concept
  label: repairs_a_layout_engine_could_execute_exactly
  purpose: retrieval_and_aggregation
  created_by: extractor
  asserts_equivalence: false
  children_terms: [t_sam_c003_0040, t_sam_c003_0041, t_sam_c003_0043, t_sam_c003_0044, t_sam_c003_0045, t_sam_c003_0047, t_sam_c003_0049, t_sam_c003_0051, t_sam_c003_0053]
  basis: >
    Ours, for retrieval. Nine of this source's fourteen remedies are geometric operations on a
    structure — add a subdivision, hang a character, set a measure, multiply a base column — and
    carry executable_by: deterministic_composite. They have nothing else in common; the grouping
    records an execution property, not a conceptual one, and asserts no equivalence. It is recorded
    because it is a different repair profile from the physical-camera repairs seen in the lighting
    sources of this batch.
  asserts_agreement_between_sources: false
