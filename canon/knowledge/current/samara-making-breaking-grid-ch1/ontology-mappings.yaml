- concept_id: sc_sam_c003_variation_and_violation
  kind: source_specific_concept
  origin_ref: samara_making_breaking_grid_ch1
  label: variation_and_violation
  children_terms: [t_sam_c003_0026, t_sam_c003_0027, t_sam_c003_0025, t_sam_c003_0028]
  origin: source_stated
