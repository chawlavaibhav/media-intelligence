relationships:

- from: t_sam_c003_0015
  to: t_sam_c003_0014
  relation: narrower_than
  confidence_basis: source_stated
  note: >
    The source defines the modular grid as a column grid with a large number of horizontal
    flowlines, so it is a special case of the column grid by the source's own definition rather
    than by our judgement.

- from: t_sam_c003_0016
  to: t_sam_c003_0015
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    Checked because both organise a page into fields. The source defines the hierarchic grid
    explicitly against the modular one: its alignments are placed intuitively and customised to the
    proportions of the elements, rather than at regular repeated intervals. Recorded as a negative
    finding so the two are not later merged on the strength of looking alike in a diagram.

- from: t_sam_c003_0009
  to: t_sam_c003_0016
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source states that spatial zones add some of the qualities of a hierarchic grid into grids
    defined by regular intervals. They are the bridge between the two structures, not a third kind.

- from: t_sam_c003_0019
  to: t_sam_c003_0018
  relation: narrower_than
  confidence_basis: source_stated
  note: >
    The source defines interline space as the shape of the negative space between lines, which makes
    it negative space observed at the smallest scale in the section.

- from: t_sam_c003_0022
  to: t_sam_c003_0018
  relation: related_to
  confidence_basis: source_stated
  note: >
    Harmonic spacing is a rule about the progression of negative spaces from letterspacing to
    margin, so it is the same substance governed at every scale at once.

- from: t_sam_c003_0039
  to: t_sam_c003_0018
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked because both name empty area and the source uses them within nine pages of each other.
    They are opposites in this source: negative space is a shape of equal importance that must be
    preserved for visual rest, and awkwardly empty negative space is a fault to be activated with a
    dot. The source gives no test separating them, which is why the distinction is recorded rather
    than resolved.

- from: t_sam_c003_0028
  to: t_sam_c003_0023
  relation: related_to
  confidence_basis: source_stated
  note: >
    Succumbing to regularity is the failure state of low articulation variety; the articulation
    sections describe the same variable that the danger is stated against.

- from: t_sam_c003_0027
  to: t_sam_c003_0028
  relation: related_to
  confidence_basis: source_stated
  note: >
    Violation is the source's named response to the danger of regularity. The pair is the book's
    title thesis in two terms.

- from: t_sam_c003_0026
  to: t_sam_c003_0025
  relation: narrower_than
  confidence_basis: extractor_judgement
  note: >
    Bounce is a specific spread-to-spread rhythm produced by two named tactics; pacing is the
    general cadence across a sequence. The source coins bounce tentatively and never relates the
    two terms, so this is our reading of the scope difference.

- from: t_sam_c003_0032
  to: t_sam_c003_0031
  relation: same_observed_effect
  confidence_basis: extractor_judgement
  note: >
    Both appear to the reader as a text element failing to meet the column edge. The mechanisms
    differ: a rag does not reach the edge because line lengths vary, while centred text does not
    reach either edge because it is set to an axis. The source gives them different remedies —
    a placed element for one, a matched width or an axis on a guide for the other — which is
    consistent with the effect matching and the cause not.

- from: t_sam_c003_0033
  to: t_sam_c003_0034
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked because both are the reader's eye going to the wrong place in running text. They are
    different failures with different remedies: horizontal escape into an adjacent column is fixed
    by the gutter measure, vertical re-entry on the same line by interline space. Recorded so a
    single "reader loses their place" concept is not proposed later.

- from: t_sam_c003_0038
  to: t_sam_c003_0049
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    The constant position that makes folios and runners distracting in print is the same property
    that makes pinning valuable on screen. The source recommends the second and warns about the
    first, without connecting them. Recorded as related rather than equivalent because the source
    draws no such link and the consequences it reports are opposite.

- from: t_sam_c003_0040
  to: t_sam_c003_0029
  relation: related_to
  confidence_basis: source_stated
  note: "The source's stated repair for its own named common error."

- from: t_sam_c003_0045
  to: t_sam_c003_0019
  relation: related_to
  confidence_basis: source_stated
  note: >
    Forcing the leading measures onto a common divisor changes the interline space established as
    optimal. The source records this cost in a footnote; the relation preserves the link between the
    repair and the property it damages.

