terms:

- term_id: t_nnn_0001
  term: nikhri
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: entity
  definition_in_origin_frame: >
    A Hindi word whose dictionary sense the source gives as "improved" or "better", adopted by a
    fairness-cream advertiser after Doordarshan forbade *gori* ("fair"), and which the source says
    consistent use loaded with the forbidden sense until it came to mean "fairer" to the lay public.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 'No Squeeze, No Wheeze, No Navel Please!', Doordarshan rules"}
  arising_from: [sk_nnn_0011]

- term_id: t_nnn_0002
  term: gori
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: entity
  definition_in_origin_frame: >
    The Hindi word for "fair", which the source records Doordarshan as forbidding in fairness-cream
    advertising, forcing the substitution recorded at t_nnn_0001.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 'No Squeeze, No Wheeze, No Navel Please!', Doordarshan rules"}
  arising_from: [sk_nnn_0011]

- term_id: t_nnn_0003
  term: pester_power
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: property
  definition_in_origin_frame: >
    A term the source says consumer researchers coined in the 1990s for the pressure children exert
    on household purchasing. The source explicitly bounds it: strongest for low-value child-directed
    products, reduced to a veto in shared household categories, smallest in durables.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 'I am a Complan Girl! I am a Complan Boy!', pester power"}
  arising_from: [sk_nnn_0031]

- term_id: t_nnn_0004
  term: topical
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: entity
  definition_in_origin_frame: >
    An Amul hoarding that comments on a current event. The source says the first was for the Bombay
    Derby and that hundreds followed. Inspection of the reproduced example shows a fixed form —
    flat ground, hand-lettered pun, illustrated Amul girl, constant signature — with the joke as the
    only variable element.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "plate insert, Amul plate (images/00021.jpg)"}
  arising_from: [sk_nnn_0021]

- term_id: t_nnn_0005
  term: thanda_matlab
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: entity
  definition_in_origin_frame: >
    "Cool means —", a Hindi construction a beverage advertiser appropriated so that the brand became
    the completion of the phrase. Inspection of the plate shows it set in Devanagari beside the Latin
    logotype, so the appropriation is of the script as well as the word.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "plate insert, Coca-Cola plate (images/00013.jpg)"}
  arising_from: [sk_nnn_0019]

- term_id: t_nnn_0006
  term: effeminization_of_the_male_gender
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: property
  definition_in_origin_frame: >
    The author's own coinage — "what I would call" — for the trend he says Emami caught in opening
    the Indian men's fairness category: men becoming more grooming- and beauty-conscious. Recorded
    verbatim as the source's term. The framing is the author's and is not endorsed by this record.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 'The [In] Complete Man', Fair & Handsome"}
  arising_from: [sk_nnn_0033]

- term_id: t_nnn_0007
  term: mind_and_mood
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: entity
  definition_in_origin_frame: >
    A proprietary qualitative technique of the author's own agency, FCB Ulka, in which planners spend
    extended time with consumers in their homes and workplaces. Results are published as Mood Studies
    in the agency's Cogito Journal. The source reports findings from it; the method is not described
    beyond this, and the publisher has an interest in the findings.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 'The [In] Complete Man', ManMood Study 2014"}
  arising_from: [sk_nnn_0001]

- term_id: t_nnn_0008
  term: aura
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: property
  definition_in_origin_frame: >
    One of three dimensions in the reported Cogito 2002 celebrity study, alongside a Trait Fit Index
    and a Compatibility Index, and the one the study concludes dominates. The source never defines
    it, so the dimension reported as decisive is the one whose construction is least visible.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 'Meri Khubsurti Ka Raaz', Cogito 2002 study"}
  arising_from: [sk_nnn_0042]

- term_id: t_nnn_0009
  term: storyboard_pre_approval
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: entity
  definition_in_origin_frame: >
    Doordarshan-era clearance of a pictorial depiction of a commercial before production. The source
    establishes first-hand that it did not bind the separate approval of the finished film.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 'No Squeeze, No Wheeze, No Navel Please!', Sweetex"}
  arising_from: [sk_nnn_0010]

- term_id: t_nnn_0010
  term: consumer_complaints_council
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: entity
  definition_in_origin_frame: >
    The twenty-one-member body within ASCI that upholds or rejects complaints about advertising. An
    upheld complaint results in a direction to modify and resubmit.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 'No Squeeze, No Wheeze, No Navel Please!', ASCI"}
  arising_from: [sk_nnn_0012]

- term_id: t_nnn_0011
  term: language_department
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: entity
  definition_in_origin_frame: >
    The separate department to which Indian-language writers were confined in 1960s-70s agencies,
    handling translation rather than origination. The source's account of change is precisely that
    work began to be "originally created in Hindi" instead of passing through it.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 'Bole Mere Lips, I Love Uncle Chipps'"}
  arising_from: [sk_nnn_0052]

- term_id: t_nnn_0012
  term: bazaar_totem
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: entity
  definition_in_origin_frame: >
    Imagery borrowed from Indian bazaar art — including images of gods, and calendars distributed by
    advertisers — which the source, reporting Arvind Rajagopal, says brands used to connect with
    consumers specifically when selling unfamiliar products.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 'Meri Khubsurti Ka Raaz', Rajagopal"}
  arising_from: [sk_nnn_0043]

# ── problems ────────────────────────────────────────────────────────────────

- term_id: t_nnn_0031
  term: depiction_read_as_prevalence
  origin: extractor
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: problem
  definition_in_origin_frame: >
    Treating what an advertisement depicts as evidence of how common the depicted arrangement is.
    The source states the separation directly for one case and says the ad "was a depiction of a
    future, not the current reality".
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 'Jo Biwi Se Kare Pyaar…', Airtel"}
  arising_from: [sk_nnn_0005]

- term_id: t_nnn_0032
  term: gating_measure_selects_for_its_own_input
  origin: extractor
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: problem
  definition_in_origin_frame: >
    A measurement standing between work and its approval can be raised by a controllable input that
    does not raise the outcome the measurement predicts, so the input gets bought for the score. The
    source's instance is celebrity casting raising ad pre-test scores.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 'Meri Khubsurti Ka Raaz', pre-testing"}
  arising_from: [sk_nnn_0040]

- term_id: t_nnn_0033
  term: execution_depends_on_a_reference_the_audience_may_not_hold
  origin: extractor
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: problem
  definition_in_origin_frame: >
    An execution whose whole argument rests on a scene, script or common noun the intended audience
    must already recognise. Observed by the extractor in two inspected plates; not a claim the source
    makes.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "plate insert (images/00005.jpg, images/00013.jpg)"}
  arising_from: [sk_nnn_0017, sk_nnn_0019]

- term_id: t_nnn_0034
  term: later_gate_rejects_what_an_earlier_gate_passed
  origin: extractor
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: problem
  definition_in_origin_frame: >
    Independent clearance decisions held by different bodies at different moments, where an earlier
    approval carries no guarantee at a later one. Evidenced twice in the source: the Sweetex
    finished-film rejection after storyboard approval, and Doordarshan withdrawing a storyboard
    approval already given to KamaSutra.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 'No Squeeze, No Wheeze, No Navel Please!'"}
  arising_from: [sk_nnn_0010, sk_nnn_0014]

- term_id: t_nnn_0035
  term: measurement_invoked_without_its_result
  origin: extractor
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: problem
  definition_in_origin_frame: >
    A study is named and its conclusions summarised directionally while its numbers, sample, method
    and attribution are all absent, so nothing can be checked. The source's clearest instance is the
    "frame-by-frame content analysis" of fifty years of Indian television advertising.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Introduction, content-analysis passage"}
  arising_from: [sk_nnn_0054, sk_nnn_0042]

- term_id: t_nnn_0036
  term: caption_not_settled_by_its_own_plate
  origin: extractor
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: problem
  definition_in_origin_frame: >
    A reproduced figure whose caption asserts something the figure does not show, because the
    artefact reproduced is not the artefact the caption is about. Four of nineteen plates in this
    copy have this shape.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "plate insert, plates 1, 4, 11, 15"}
  arising_from: [sk_nnn_0023]

# ── remedies (each states who or what can execute it) ───────────────────────

- term_id: t_nnn_0051
  term: attach_the_prevalence_caution_to_the_corpus
  origin: extractor
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: remedy
  definition_in_origin_frame: >
    Where advertising material is used as evidence about an audience, record alongside it that the
    material shows what an advertiser judged aspirational, not what was common.
    EXECUTABLE BY: a human curating an evidence set, or a governance artifact that travels with it.
    NOT executable by a generative model and not automatable from the asset itself.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 'Jo Biwi Se Kare Pyaar…', Airtel"}
  arising_from: [sk_nnn_0005]
  executable_by:
  - human_edit

- term_id: t_nnn_0052
  term: substitute_a_permitted_token_and_invest_it
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: remedy
  definition_in_origin_frame: >
    Where a regulator forbids a word a category depends on, adopt a permitted word in its slot and
    use it consistently until the audience transfers the meaning.
    EXECUTABLE BY: an advertiser sustaining one substitution across a long campaign. It requires
    repetition over years and cannot be executed within a single asset, by an agency alone, or by any
    automated process. Recorded as observed advertising history, not as advice.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 'No Squeeze, No Wheeze, No Navel Please!'"}
  arising_from: [sk_nnn_0011]
  executable_by:
  - unknown

- term_id: t_nnn_0053
  term: cast_redundant_interchangeable_subjects
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: remedy
  definition_in_origin_frame: >
    Where the subject's performance cannot be directed, book at least three interchangeable subjects
    for the same day so that chances multiply within a fixed shoot day.
    EXECUTABLE BY: a producer or casting director on a live-action shoot. It acts on the physical
    production schedule and has NO generative-model analogue; nothing about model behaviour follows
    from it.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 'I am a Complan Girl…', SHOOTING BABIES sidebar"}
  arising_from: [sk_nnn_0050]
  executable_by:
  - physical_production

- term_id: t_nnn_0054
  term: settle_third_party_clearance_before_approving_the_script
  origin: source
  origin_ref: parameswaran_nawabs_nudes_noodles
  kind: remedy
  definition_in_origin_frame: >
    Establish the route through a third-party clearance body — the source's case is the Animal
    Welfare Board — before a script requiring it is approved, rather than after.
    EXECUTABLE BY: a producer or agency account lead, before production. Not executable by a
    creative process and not automatable.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 'No Squeeze…', ANIMAL PHOBIA sidebar"}
  arising_from: [sk_nnn_0013]
  executable_by:
  - physical_production

