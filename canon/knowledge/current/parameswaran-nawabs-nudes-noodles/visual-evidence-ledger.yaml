# ── observations available only from the images ─────────────────────────────
visual_only_observations:
  - "Four plates are low-resolution television frame-grab composites (Liril, Surf, Bajaj, Hero Pleasure, Naukri, Pepsi, Maggi, NDDB). Nothing may be asserted from them about edit, pace or duration — only about casting, setting, wardrobe, pack and end-frame typography."
  - "The Coca-Cola plate sets 'Thanda matlab' in Devanagari. The book's text names the Hindi word but never says the execution used the Indian script. Script choice is visible only in the image."
  - "The Asian Paints plate is executed in a Kalighat / Jamini Roy folk-painting idiom, which is the same borrowing-from-bazaar-art mechanism the book attributes to Arvind Rajagopal for the 1950s — appearing here in a modern execution the text does not connect to that argument."
  - "The Hero Pleasure frame shows the bride in a Western white wedding gown rather than Indian bridal red. The chapter is about women's mobility and does not mention the wardrobe choice."
  - "On the Incredible India plate the boatmen are Indian and the passengers are Western. The book presents the campaign as successful international tourism advertising and does not discuss the composition."
  - "The Tuffs layout gives roughly half the page to the contested photograph and reduces the product to two small insets. The book recounts the fourteen-year obscenity case in detail and never mentions the composition."

extraction_constraint_applied: >
  Nine SourceKnowledge objects carry source_support: text_and_visual and name the exact image file
  in provenance.inspected.figures. No object claims visual demonstration from a plate that was not
  opened. No object rests on body copy, because body copy is illegible on every plate that has it.
  Where a plate was opened and still did not settle its caption, that is recorded as a finding
  (sk_nnn_0023) rather than resolved in the caption's favour.

claim_resolution_after_inspection: some_underdetermined
consequence: >
  The visual pass materially changed the extraction rather than confirming it. Six craft mechanisms
  in this record exist ONLY because the plates were opened — the book's text describes none of them.
  In the opposite direction, four captions were found not to be settled by their own plates, which a
  text-only pass would have transcribed as established fact. Both directions are recorded.
