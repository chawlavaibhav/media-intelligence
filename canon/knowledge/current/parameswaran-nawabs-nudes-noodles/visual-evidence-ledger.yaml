# CANON-014 — visual-evidence ledger for Parameswaran, "Nawabs, Nudes, Noodles".
#
# The visual pass RAN and COMPLETED. All 19 plates in the insert were extracted from the EPUB and
# opened individually in this session. This is the first source in the corpus whose reproduced
# advertisements were inspected first-hand rather than described from captions.

source_id: parameswaran_nawabs_nudes_noodles
pass: attempted_and_completed
inspection_state: inspected_figure_level
visual_argument_role: figure_carries_content

# ── what was inspected ──────────────────────────────────────────────────────
inspection:
  method: >
    The EPUB was unpacked and every image asset enumerated. Each plate was opened and read directly.
    No caption was accepted as a description of a plate without looking at the plate.
  images_in_archive: 22
  plates: 19
  ornaments_not_plates:
    - {file: "images/00003.jpg", dimensions: "29x25", note: "decorative rule, not a plate"}
    - {file: "images/00009.jpg", dimensions: "10x15", note: "decorative glyph, appears twice in ch. 'The Tingling Freshness of Teens'"}
  cover: "cover.jpeg — publisher cover, not evidence"
  plates_inspected: 19
  plates_not_inspected: 0
  reproduction_scale: >
    Every plate is approximately 566 px on its long edge (range 460-566). At that scale composition,
    casting, setting, colour, pack and display type are legible; body copy is NOT.

# ── the plate insert as an object ───────────────────────────────────────────
plate_insert:
  location: "spine 19, index_split_018.html"
  paginated: false
  binding_to_text: >
    The insert is a single unpaginated run of 19 image-plus-caption pairs. Nothing in the running
    text cross-references a plate, and no plate carries a figure number. The one-line captions are
    the ONLY link between a plate and the chapter whose subject it illustrates, and the extractor
    had to make that link by subject matter.
  numbering_gap:
    observed: "image files run 00001-00015 and 00018-00023; 00016 and 00017 are absent from the archive"
    consequence: >
      No caption is orphaned: 19 captions, 19 plates. The gap is in the file numbering, not in the
      evidence, so no plate is missing from the insert as this copy presents it.

# ── loss patterns observed, using the Audit Gate vocabulary ────────────────
observed_loss_patterns:

  - pattern: no_authored_page
    affects: "the entire source, plates and running text alike"
    detectability: detected_by_independent_check
    recoverability: unrecoverable_in_this_copy
    evidence: >
      Reflowable EPUB. The OPF declares no page map and no plate or paragraph carries an authored
      folio. Every locator in this extraction is a chapter title or the plate insert, never a page.
      The book's printed edition certainly has pages; this copy does not, and none was interpolated.

  - pattern: in_figure_text_absent
    affects: "body copy on every plate that carries body copy — principally Rasna, KamaSutra, Incredible India, Tuffs"
    detectability: detected_by_independent_check
    recoverability: unrecoverable_in_this_copy
    evidence: >
      At ~566 px the body copy on these plates resolves as texture, not letterforms. On the
      Incredible India plate the entire footline is illegible; on KamaSutra a column of perhaps
      fifteen lines is illegible; on Rasna the flavour list and body block are illegible. Display
      type and headlines ARE legible throughout, so the loss is confined to small-set copy. Every
      extracted object that touches one of these plates states that no claim rests on its body copy.

  - pattern: figure_inspected_claim_underdetermined
    affects: "4 of 19 plates — Rasna, Naukri, Pepsi, Asian Paints"
    detectability: detected_by_independent_check
    recoverability: unrecoverable_in_this_copy
    evidence: >
      Each was opened and each still fails to establish its caption, because the artefact reproduced
      is not the artefact the caption describes. Rasna's caption is about a television line; the
      plate is a press advertisement. Naukri's caption quotes spoken abuse; the plate is a silent
      frame of a shouting man. Pepsi's caption quotes a line; the plate shows a cricketer and a
      bottle. Asian Paints' caption describes a campaign that made a phrase famous; the plate is a
      later festival execution punning on the phrase as already established. Recorded as
      sk_nnn_0023.

  - pattern: caption_coverage_uneven
    affects: "the relation between plates and the chapters they belong to"
    detectability: silent
    recoverability: recoverable_not_attempted
    evidence: >
      Every plate has a caption, so caption coverage is complete in the narrow sense. What is uneven
      is what a caption does: some describe the execution (Amul, Jenson & Nicholson), some assert an
      unevidenced commercial outcome ("made condom-wearing appealing and attractive", "creating a new
      drinking habit across India"), and some name a campaign the plate does not show. A reader who
      trusts captions uniformly would draw four different strengths of conclusion from the same kind
      of line.

  - pattern: no_loss_detected
    affects: "the running text"
    detectability: detected_by_independent_check
    recoverability: not_applicable
    evidence: >
      The prose extracts cleanly and in order across all 41 spine items. A duplicate-sentence scan
      over the whole text found no duplicated sentence above 90 characters, so no pull-quote
      flattening or reading-order damage of the kind found in other candidates. Endnotes are present,
      complete and correctly separated by chapter, which is what let evidence_origin be settled.

