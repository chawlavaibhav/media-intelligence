    system_level_uncertainty: 'High. The members are individually well supported and directly quoted,
      but the claim that they form ONE mutually qualifying structure is entirely the extractor''s — the
      author states them separately, in different chapters, and never treats the later two as bounding
      the first. A reader could equally regard the counter-instance as an aside. What the grouping asserts,
      and what must be attributed to CANON-014 rather than to Parameswaran, is that the brakes are load-bearing
