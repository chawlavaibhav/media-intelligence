- scs_id: scs_nnn_004
  source_id: parameswaran_nawabs_nudes_noodles
  label: why_indian_advertising_became_saturated_with_celebrities
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: source_stated
  description: 'The four reasons the author himself gives, in one passage, for the saturation of Indian
    advertising with film and cricket stars: celebrity cost is small relative to media weight; celebrity
    credibility helps drive categories down the socio-economic pyramid; the corporatisation of the film
    industry made stars available; and pre-testing rewards celebrity presence.

    '
  whole_system_claim:
    text: 'Celebrity saturation is over-determined: several independent forces each push the same way,
      so no single one of them needs to be the cause, and at least one of them — the pre-test — pushes
      for reasons unconnected to whether the advertising works.

      '
    origin: extractor_synthesis
    interpretation_basis: 'The author does list these as reasons, in sequence, in one passage ("The answer
      may lie somewhere else… The second reason is… One final reason…"), so the membership and the ordering
      are his. What is the extractor''s is the over-determination claim: the observation that the forces
      are independent of one another and that this makes the phenomenon insensitive to any one of them.
      The author draws no such conclusion.

      '
    source_ref: Ch. 'Meri Khubsurti Ka Raaz', 'Why this celebrity obsession, you may ask.'
