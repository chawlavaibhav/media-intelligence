- scs_id: scs_nnn_003
  source_id: parameswaran_nawabs_nudes_noodles
  label: devices_by_which_a_reproduced_indian_advertisement_carries_its_whole_argument
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: 'Six devices observed by inspecting the book''s plate insert, in which the advertisement''s
    argument is carried by the image and its construction rather than by copy: a familiar everyday scene
    recruited as the demonstration; a single abstract symbol under an instruction headline; a mascot inserted
    into a foreign icon set at reduced scale; a fixed form with one variable joke slot; a sung word typeset
    as the picture; and vernacular appropriation carried simultaneously by word, script and setting.

    '
  whole_system_claim:
    text: 'Across these executions the verbal load is low or absent and the work is done by what is depicted
      and how it is arranged — which means a text-only representation of this book would lose the evidence
      for most of its craft claims, and which also means each device depends on cultural knowledge the
      viewer must already hold.

      '
    origin: extractor_synthesis
    interpretation_basis: 'The source supplies only a one-line caption per plate and never discusses composition,
      typography, scale or layout for any of them. Every structural observation in this system was made
      by CANON-014 opening the images. The grouping asserts a family resemblance the author never proposes.
      It is offered as a hypothesis about the plates, not as a report of the book.

      '
    source_ref: null
