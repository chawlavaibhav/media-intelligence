      A RECORDED CONFLICT BETWEEN sk_nnn_0041 AND sk_nnn_0042 WAS REMOVED IN THE CANON-014 FINAL RECONCILIATION,
      and the tension it pointed at is kept here as prose because it is real and the conflict edge was
      not. sk_nnn_0042 reports a study concluding that a celebrity''s aura dominates; sk_nnn_0041 reports
      that agencies began casting stars as characters once mere celebrity endorsement stopped differentiating.
      Those two statements create a tension worth noticing and they do not contradict each other: a performer
      can carry high aura AND be deliberately cast as a character, and on the source''s own account the
      second practice exists precisely because the first became universal and therefore stopped distinguishing
      one advertiser from another. Encoding that as a structural `conflict` asserted a logical incompatibility
      the source does not contain and the statements do not support. What the source genuinely does is
      state both without reconciling them, which is recorded here and is an observation about the source
      rather than a defect in the knowledge.

      '
  provenance:
    chapter: Meri Khubsurti Ka Raaz
    section: '''Why this celebrity obsession, you may ask.'''
