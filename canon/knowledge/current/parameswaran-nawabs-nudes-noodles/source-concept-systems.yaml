- scs_id: scs_nnn_001
  source_id: parameswaran_nawabs_nudes_noodles
  label: the_mirror_thesis_and_the_brakes_the_author_puts_on_it
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: 'The book''s organising thesis (advertising records social change) together with the two
    explicit qualifications the author himself supplies, and the one place where the thesis''s most quantitative-sounding
    support turns out to be unsupplied. The members qualify each other: the thesis is what makes the book
    worth reading, and the brakes are what make it safe to consume.

    '
  whole_system_claim:
    text: 'Advertising may be read as evidence about which social ideas were available and salient at
      a time, but not as evidence about how common the depicted arrangements were, and not universally
      — the author records a full decade in which Indian advertising did not track the dominant social
      mood at all.

      '
    origin: extractor_synthesis
    interpretation_basis: 'The author never assembles these. He states the thesis in the Introduction,
      records the Angry-Young-Man exception in one chapter and the depiction-is-not-prevalence brake in
      another, roughly two hundred pages apart, and does not connect them. The grouping is entirely the
      extractor''s. What justifies it is that the two qualifications are the only things in the book that
      bound the thesis, and consuming the thesis without them would licence exactly the inference the
      author refuses to make.

      '
    source_ref: null
