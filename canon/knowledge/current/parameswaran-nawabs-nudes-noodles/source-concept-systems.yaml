- scs_id: scs_nnn_002
  source_id: parameswaran_nawabs_nudes_noodles
  label: indian_advertising_clearance_as_a_multi_gate_route
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: extractor_inferred
  description: 'The clearance route an Indian advertisement had to pass, as the book describes it: broadcaster
    pre-approval of the storyboard, broadcaster approval of the finished film, self-regulatory review
    by ASCI on complaint, and separate production clearances (Animal Welfare Board; cinema censor certificate
    for theatrical shorts). Each gate can reject work the previous gate passed.

    '
  whole_system_claim:
    text: 'Clearance in Indian advertising is not one decision but a series of independent ones held by
      different bodies at different moments, and passing an earlier gate carries no guarantee at a later
      one — so clearance risk is distributed across the whole production timeline rather than concentrated
      before it starts.

      '
    origin: extractor_synthesis
    interpretation_basis: 'The author describes each of these bodies, but he describes them as episodes
      in one chapter''s narrative rather than as a route. The claim that they constitute a sequence with
      independent gates is the extractor''s. What justifies it is the Sweetex case he reports first-hand,
      in which storyboard approval demonstrably did not bind the finished-film decision, and the KamaSutra
      case, in which Doordarshan withdrew a storyboard approval it had already given. The independence
      of the gates is a fact he evidences twice; that it is a general structure is our reading.

      '
    source_ref: null
