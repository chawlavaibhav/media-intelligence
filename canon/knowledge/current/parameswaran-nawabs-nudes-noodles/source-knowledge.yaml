- sk_id: sk_nnn_0001
  source_id: parameswaran_nawabs_nudes_noodles
  source_terms:
    - "Advertising too has become a significant window to studying the transformation of Indian society, its desires and its needs."
    - "Often advertising has tried to stay a few steps ahead of society, thereby signalling a future trend."
  concept_label: advertising_read_as_a_record_of_social_change
  label_origin: extractor_assigned
  claim: >
    The author's organising proposition is that fifty years of Indian advertising can be read as a
    record of how Indian society changed — the roles of man, woman, father, mother, the place of
    ritual, festival and money — and that advertising sometimes runs ahead of society to signal a
    coming trend and sometimes reaches back to an older ritual or custom to make a connection.
  claim_type: source_interpretation
  interpretation_basis: >
    This is the author's thesis, argued by accumulation of campaign cases rather than by any
    measurement. He positions it against Jackson Lears, who he says dismisses advertising as "the
    folklore of industrial society", and against Barthes on myth; he claims Indian advertising
    supplies "not just folklore but also some interesting insights into a society in transition".
    No test is proposed that could fail.
  mechanism:
    stated_by_source: true
    text: >
      Advertising must connect with ideas the audience already holds in order to sell, so the ideas
      it reaches for are evidence about which ideas were available and salient at that time.
  scope:
    domain_discussed_by_source: [indian_advertising, indian_consumer_society]
    conditions: >
      India, roughly 1965-2016, and overwhelmingly URBAN India and the mass media that reached it
      (cinema, Doordarshan, satellite television, national print). The author's own examples are
      almost entirely national-brand advertising.
  caveats:
    - text: "the author states the deep divisions of class and caste are 'rapidly diminishing' in consumer India 'at least in the urban markets' — he scopes the claim himself"
      origin: source_stated
    - text: "the thesis is unfalsifiable as stated: a campaign that matches society confirms it, one that runs ahead of society also confirms it, and one that reaches into the past confirms it too"
      origin: extractor_observed
    - text: "the author is a career advertising practitioner writing about the value of his own industry; the book opens with an anecdote about defending the profession to a stranger"
      origin: extractor_observed
