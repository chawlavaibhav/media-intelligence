- sk_id: sk_nnn_0012
  source_id: parameswaran_nawabs_nudes_noodles
  source_terms:
    - "Advertising Standards Council of India (ASCI) was born in 1985. Modelled after the UK Council, it had sixteen members on its Board of Governors and a twenty-one-member Consumer Complaints Council."
    - "As a final shot in the arm of ASCI, the government of India in 2007 modified the Cable TV Network Rules to ensure that no ad found objectionable by ASCI could be aired through any cable network."
  concept_label: asci_self_regulation_and_how_it_acquired_teeth
  label_origin: extractor_assigned
  claim: >
    Indian advertising self-regulation runs through the Advertising Standards Council of India,
    founded in 1985 on the UK model, with a sixteen-member Board of Governors and a twenty-one-member
    Consumer Complaints Council. A complaint goes to the CCC and is upheld or rejected; if upheld,
    the advertiser is told to modify the advertising and resubmit it for ASCI's record. Compliance
    was effectively voluntary and split by membership — the author reports that most large
    advertisers, agencies and media owners were members and almost always complied, while
    non-members were inclined to disregard rulings. In 2007 the government amended the Cable TV
    Network Rules so that an advertisement ASCI found objectionable could not be aired on any cable
    network, which converted a members-only sanction into a general one.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A self-regulator binds only its members. Attaching its findings to a distribution rule that
      applies to every carrier makes the finding effective against non-members too, because the
      constraint moves from the advertiser to the channel that would have to carry the ad.
  scope:
    domain_discussed_by_source: [indian_advertising_regulation]
    conditions: "India, 1985 onward; the cable amendment is dated 2007. Composition figures are as at the book's writing (2016) and may have changed."
  caveats:
    - text: "the author was an industry insider throughout this period; the account of member compliance is his characterisation, not a compliance measurement"
      origin: extractor_observed
    - text: "the book records ASCI rulings against specific campaigns (Amul Macho, Wild Stone, KamaSutra) but never reports how many complaints are upheld or what proportion of the market is covered"
      origin: extractor_observed
  source_stated_problems:
    - "voluntary self-regulation does not bind non-members"
  source_stated_remedies:
    - "bind the carrier rather than the advertiser, via the Cable TV Network Rules"
