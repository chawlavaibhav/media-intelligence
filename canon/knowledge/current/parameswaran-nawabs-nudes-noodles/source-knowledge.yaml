- sk_id: sk_nnn_0010
  source_id: parameswaran_nawabs_nudes_noodles
  source_terms:
    - "Before an ad is made at great cost, the agency always gets a 'storyboard', which is a pictorial depiction of the ad, approved by the Doordarshan authorities."
    - "The agency did not see any problem since the storyboard was already approved. Then came the bombshell. Doordarshan rejected the film on the grounds of obscenity."
  concept_label: storyboard_approval_did_not_bind_the_finished_film
  label_origin: extractor_assigned
  claim: >
    Under Doordarshan, clearance ran as two separate gates: a storyboard was approved before
    production, and the finished film was approved again afterwards. Approval at the first gate did
    not bind the second. The author reports his own Sweetex campaign clearing the storyboard and
    then being rejected on the finished film for showing the model's navel in an opening close-up,
    forcing a reshoot at the advertiser's cost.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The storyboard is a pictorial abstraction; the finished film contains framing, duration and
      emphasis that the storyboard does not fix. A censor assessing the film is therefore assessing
      material the storyboard never showed, and can reach a different verdict on the same concept.
  scope:
    domain_discussed_by_source: [indian_broadcast_clearance, doordarshan]
    conditions: >
      India, mid-1980s, state-monopoly television. The two-gate structure described is
      Doordarshan-era and the author reports the rules "kept changing". It must not be read as
      current Indian practice.
  caveats:
    - text: "the author is a participant recounting a grievance thirty years later; the reasoning attributed to the Doordarshan official is his recollection of a conversation"
      origin: extractor_observed
    - text: "he reports that the film-maker found a way to reshoot a single visual at low cost, so the consequence was bounded"
      origin: source_stated
  source_stated_problems:
    - "a campaign can clear pre-production approval and still be rejected after the money is spent"
  source_stated_remedies:
    - "the author's lane reshot only the single offending visual rather than the whole film"
  examples: {positive: []}
  intra_source_relations:
    - {relation: co_occurs_with, target: sk_nnn_0011, note: "same regulatory regime"}
