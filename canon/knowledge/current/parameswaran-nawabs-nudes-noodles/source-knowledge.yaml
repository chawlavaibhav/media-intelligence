- sk_id: sk_nnn_0011
  source_id: parameswaran_nawabs_nudes_noodles
  source_terms:
    - "Hindustan Lever, which was launching its fairness cream, was prevented from using the Hindi word for 'fair' or gori. They found a way around it by using the word nikhri and over time managed to get it established as an equivalent word for 'fair'. Though nikhri in Hindi literally means 'improved'."
  concept_label: a_banned_word_replaced_by_a_euphemism_the_campaign_then_invests
  label_origin: extractor_assigned
  claim: >
    When Doordarshan forbade the word *gori* ("fair") in fairness-cream advertising, the advertiser
    substituted *nikhri*, whose dictionary sense is "improved" or "better". Sustained use then
    loaded the substitute with the forbidden meaning, so that the author reports *nikhri* coming to
    mean "fairer" to the lay public. The prohibition changed the word and not the proposition.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A lexical ban acts on a token, not on the meaning the audience assigns. If one advertiser uses
      a permitted token consistently in the banned token's slot, the audience learns the mapping and
      the meaning transfers to the new word.
  scope:
    domain_discussed_by_source: [indian_broadcast_clearance, hindi_advertising_copy, skin_lightening_category]
    conditions: >
      India, Doordarshan era into the satellite era; one advertiser (Hindustan Unilever), one word,
      one category. The author gives no measurement of how widely the new sense is held.
  caveats:
    - text: "the claim that nikhri 'almost means fairer to the lay public' is the author's assertion; no survey or dictionary evidence is offered"
      origin: extractor_observed
    - text: "this is a mechanism of censorship evasion, recorded as advertising history. Nothing here endorses the skin-lightening proposition, and the author separately describes the fairness obsession as an 'obsession' and a 'mania'"
      origin: extractor_observed
    - text: "do NOT merge this with euphemism inflation in other sources: here a permitted word ACQUIRES a banned meaning under a prohibition; inflation is a different mechanism in which an unbanned descriptor loses force through universal use"
      origin: extractor_observed
  source_stated_problems:
    - "a regulator can forbid the word a category depends on"
  source_stated_remedies:
    - "substitute a permitted word and invest it with the meaning through consistent use"
