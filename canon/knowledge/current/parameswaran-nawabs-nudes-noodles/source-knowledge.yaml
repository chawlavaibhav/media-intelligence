- sk_id: sk_nnn_0013
  source_id: parameswaran_nawabs_nudes_noodles
  source_terms:
    - "Using real animals in ad films is today highly regulated by the Animal Welfare Board. They can appoint a supervisor to oversee the shoot and more. So before you approve a script featuring a python, a dog or a cat, just find out how you are going to manage the Animal Welfare Board."
    - "television broadcasters too set up two self-regulatory bodies, News Broadcasting Standards Authority (NBSA) and Broadcasting Content Complaints Council (BCCC). These bodies are, by and large, concerned with the content that is broadcast and not the advertising."
  concept_label: production_clearances_beyond_the_advertising_regulator
  label_origin: extractor_assigned
  claim: >
    Beyond the advertising self-regulator, Indian ad production is constrained by other bodies with
    different remits: the Animal Welfare Board regulates the use of real animals and may appoint a
    supervisor to oversee a shoot, and the author advises settling that route before a script
    featuring an animal is approved. Two broadcaster bodies, NBSA and BCCC, exist but address
    broadcast content rather than advertising. Cinema advertising ran on a separate track: brands
    made shorts of roughly 100 feet (30.4 m), running about a minute, which required a censor
    certificate — a practice the author says continues.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
