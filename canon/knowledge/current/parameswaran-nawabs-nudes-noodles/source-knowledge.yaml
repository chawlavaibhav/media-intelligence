- sk_id: sk_nnn_0014
  source_id: parameswaran_nawabs_nudes_noodles
  source_terms:
    - "the name KamaSutra seemed particularly fortuitous to the agency team because it instantly satisfied three crucial requirements: maximum reach/intelligibility, an erotic connotation, and cultural legitimacy"
  concept_label: three_requirements_a_name_had_to_satisfy_simultaneously
  label_origin: source_stated
  claim: >
    Reporting the anthropologist William Mazzarella, who reached the finding by speaking with the
    campaign's creators, the author records that the name "KamaSutra" was chosen for a condom brand
    because it satisfied three requirements at once: maximum reach and intelligibility, an erotic
    connotation, and cultural legitimacy. The brand was positioned against the government's Nirodh
    family-planning framing as an enabler of better lovemaking — "For the pleasure of making love" —
    and priced at a significant premium to both Nirodh and imported condoms.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A taboo category cannot be addressed directly, so the name has to do three jobs at once:
      be understood by everyone, carry the charge the positioning needs, and supply a sanctioned
      cultural warrant that makes the charge admissible. A canonical indigenous text supplied all
      three where an invented or imported name would have supplied at most two.
  scope:
    domain_discussed_by_source: [indian_advertising, brand_naming, taboo_categories]
    conditions: >
      India, 1991, condom category, at a moment when the category's only mass framing was
      state family planning. The three requirements are stated for this case; the source does not
      claim they generalise.
  caveats:
    - text: "the finding is Mazzarella's, an academic reporting interviews with the campaign team after the fact; it is a reconstruction of a naming decision, not a record made at the time"
      origin: extractor_observed
    - text: "the campaign's outcome was contested: ASCI ordered modifications, a Rajya Sabha member sought a ban, Doordarshan withdrew its storyboard approval, and the company fell back to shop displays. Commercial success is not established by the source"
      origin: source_stated
    - text: "generalising these three requirements into a naming checklist would be OUR extrapolation; the source presents them as a reconstruction of one decision"
      origin: extractor_observed
  source_stated_problems:
    - "a category whose only available public framing is state health messaging cannot be premium-positioned inside that framing"
  source_stated_remedies:
    - "find a name that simultaneously supplies reach, the intended connotation, and cultural legitimacy"
