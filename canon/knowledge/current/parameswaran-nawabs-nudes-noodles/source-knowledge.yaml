# CANON-014 — Ambi Parameswaran, "Nawabs, Nudes, Noodles: India Through 50 Years of Advertising"
# (Pan Macmillan India, 2016). SPEC-03 extraction over the whole book.
#
# Corpus position: the FIRST accepted source in this corpus on Indian advertising and the first
# with any Indian cultural context at all. CANON-013 recorded `indian_indic_context` as having zero
# contributors and did not close it.
#
# Epistemic shape of this source, established by reading it rather than assumed: it is a
# synthesising trade book by a practising adman (FCB Ulka), and it mixes four things that must not
# be flattened together - (a) historical description of named campaigns, (b) the author's own
# interpretation of what those campaigns reveal about Indian society, (c) third-party research he
# reports and cites in endnotes, and (d) proprietary qualitative studies by his own agency's
# consulting arm (Cogito), in which he has a declared interest. Every object below names which.
#
# The author's central thesis - that advertising is a window on Indian social change - is HIS, and
# he qualifies it himself (see sk_nnn_0004, where he records that advertising did NOT reflect the
# Angry Young Man decade). That self-qualification is extracted, not smoothed away.
#
# Locators: EPUB, reflowable. There is no authored page anywhere in this copy. Chapter titles are
# stable and are the locator; spine positions are given as a secondary file-position aid only and
# are NOT pages. See visual-evidence-ledger.yaml and PROVENANCE.md.

source_id: parameswaran_nawabs_nudes_noodles

