  label_origin: extractor_assigned
  claim: >
    The author's account of how a modest Kolkata company (Emami) opened the Indian men's fairness
    category in 2005 ahead of the category leader is that the incumbent had known for years that men
    were using its women's brand, but could not act because any move risked its own franchise's
    equity, whereas a newcomer with no equity at stake had nothing to lose. The incumbent followed
    quickly once the category was opened.
