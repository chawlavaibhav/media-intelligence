- sk_id: sk_nnn_0030
  source_id: parameswaran_nawabs_nudes_noodles
  source_terms:
    - "the best time to launch a kid-focused product is when the kid is attending school"
    - "If the kid is going to be the viral mechanism for the new product, it stands to logic that a kid does not see the ad for a new product – of interest to him – as an ad. He or she sees it as valuable information that could be traded in school."
    - "when advertising to kids, we need not apply the minimum threshold principle to advertising"
  concept_label: schedule_against_the_audience_the_recipient_will_have
  label_origin: extractor_assigned
  claim: >
    The author records being argued out of his own position by the marketer T. Krishnakumar. The
    author had proposed reaching children during holidays, when they are free. Krishnakumar's
    counter-position is that a child-directed product should launch while school is in session,
    because the child does not experience the advertisement as advertising but as tradeable news,
    and school is where the audience for that trade exists. The author records the consequence
    drawn from this: that the usual minimum-threshold weight principle need not be applied to
    child-directed advertising, because the amplification comes from retransmission rather than
    from frequency.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The recipient of a child-directed advertisement is also a transmitter. The value of an exposure
      is therefore a function of whether the recipient currently has an audience, so scheduling
      should follow the audience's availability rather than the recipient's free time.
  scope:
    domain_discussed_by_source: [indian_advertising, media_scheduling, children_as_audience]
    conditions: >
      India, 1980s, confectionery; a school-going child audience with a shared daily gathering.
      The argument depends on the recipients having a common physical assembly.
  caveats:
    - text: "no measurement is offered for either position; this is one senior practitioner's argument defeating another's, reported by the loser"
      origin: extractor_observed
