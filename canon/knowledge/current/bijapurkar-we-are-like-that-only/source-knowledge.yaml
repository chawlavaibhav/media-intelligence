- sk_id: sk_rbwl_0050
  source_id: bijapurkar_we_are_like_that_only
  source_terms:
  - reliable but not valid
  - consumption is like maternity, a certainty. Income is like paternity - merely a matter of inference.
  concept_label: a_survival_guide_for_a_dataset_that_is_consistent_but_wrong
  label_origin: extractor_assigned
  claim: 'Bijapurkar gives an explicit, enumerated set of rules for using Indian household income survey
    data, on the ground that it is systematically understated. Her rules: do not use it literally (the
    most rigorous survey, the NDSSP, accounts for only 59.6 per cent of total disposable personal income
    per the National Accounting Statistics); do not try to reconcile across surveys, because they define
    income classes differently, elicit it with different questions and index to different base years;
    and recognise that the data is "what statisticians would call RELIABLE BUT NOT VALID" — repeat the
    survey and you get the same answers, so it does not measure the real thing but is "perfectly usable
    for grading the population based on its relative purchasing power and for comparing the growths and
    declines of various income groups over time." She adds the operational consequence: work with income
    PERCENTILES rather than absolute bands or labels, and calibrate each percentile against what people
    in it actually consume. She compresses the whole into an aphorism: "consumption is like maternity,
    a certainty. Income is like paternity — merely a matter of inference."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A consistent bias destroys level comparisons while preserving rank and change comparisons.
      So the same dataset that cannot answer "how much do they earn" can answer "who earns more than whom"
      and "which group grew" — and the failure mode is using it for the first question because it is expressed
      in the units of the first question.

      '
  scope:
    domain_discussed_by_source:
    - survey_data_interpretation
    - market_sizing
    - india
    conditions: 'Indian household income surveys as of the 2008 data used in the revised edition. Bijapurkar
      attributes the understatement to cultural rather than methodological causes — "This has nothing
      to do with weak survey design methodology" — which is an assertion, not a demonstrated finding.

      '
  caveats:
  - text: THIS IS THE MOST TRANSFERABLE OBJECT IN THE RECORD AND ALSO THE ONE MOST TIED TO ITS DATA. The
      reliable-but-not-valid distinction, and the rule of using ranks and changes rather than levels from
      a consistently biased instrument, generalise well beyond India. The 59.6 per cent figure and the
      specific surveys do not
    origin: extractor_observed
  - text: the attribution of the understatement to cultural causes rather than survey design is asserted
      without evidence, and it is the kind of claim that would need evidence
    origin: extractor_observed
  - text: 'she reports an instance of the failure she is warning about: a consulting firm''s presentation
      that ''arbitrarily moved the income data slab upwards by 30 per cent, to account for underreporting
      ... stating team analysis as the basis, with no further explanation provided''. That is a documented
      instance, unattributed'
    origin: source_stated
  - text: the corresponding positive claim — that consumption data from surveys 'is accurate and tallies
      well with supply-side information' — is supported by one worked reconciliation (car ownership in
      the NCAER data against manufacturers' sales, around 2002) and not by a systematic check
    origin: extractor_observed
  - text: 'Adjacency to sk_rbwl_0040 recorded without a graph edge: why the middle-class question cannot
      be settled from income data. The original extraction used a ''supports'' relation, which SPEC-03
      does not define; no permitted relation expresses it from this object''s side, so it is kept as an
      observation rather than expressed as a fabricated edge.'
    origin: extractor_observed
  - text: 'Adjacency to sk_rbwl_0020 recorded without a graph edge: the calibrated tiers are how the demand
      structure is established. The original extraction used a ''supports'' relation, which SPEC-03 does
      not define; no permitted relation expresses it from this object''s side, so it is kept as an observation
      rather than expressed as a fabricated edge.'
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: The data-handling rules are stated
      with an unusual degree of specificity for a book of this kind and are supported by named sources.
      The causal explanation for the bias is asserted.'
    origin: extractor_observed
  source_stated_problems:
  - a consistently biased instrument expressed in absolute units invites use for the one question it cannot
    answer
  source_stated_remedies:
  - use income data for ranking and for change over time, never for levels
  - work with percentiles rather than absolute bands or verbal labels
  - calibrate every income tier against what that tier actually owns and consumes
  examples:
