- sk_id: sk_rbwl_0040
  source_id: bijapurkar_we_are_like_that_only
  source_terms:
  - There is no unique or universally accepted definition of it
  - Its beauty (size) lies in the eyes of the beholder!
  - As someone who was part of the creation of the myth, I would like to be part of its clarification
    too.
  concept_label: a_category_with_no_agreed_definition_used_as_a_planning_input
  label_origin: extractor_assigned
  claim: 'Bijapurkar''s most sustained methodological argument is against using "the Indian middle class"
    as a business-planning input, on the ground that the category has no agreed definition and that its
    size is therefore a function of who is defining it. She assembles the range: Hansa Research''s finding
    from interviewing senior marketing professionals that "everyone of them had a unique definition" and
    that "no one really has a fix on this nebulous entity"; estimates from 100 million to 500 million;
    roughly 50 million by a global-brand affordability lens, 250-300 million by an FMCG lens, 375 million
    by NCAER''s consuming class, 300 million by a middle-majority-of-income lens, 230 million by Butel''s
    own-transport-entertainment-communication lens, shrinking to 30 million if a computer is added. She
    states the consequence: "despite being notional and subjective, if treated as a gospel, it leads to
    non-exploitation of opportunity and lazy strategy," and quotes Dr A. S. Ganguli that arbitrary downward
    estimates "do not truly reflect a state of restricted opportunity, but rather non-exploration of opportunities".

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Where a category is defined by the analyst''s own affordability threshold, its measured size
      is determined by the price of what the analyst is selling. The number therefore reproduces the firm''s
      existing offer rather than describing the market, and a firm that plans on it has planned on its
      own assumptions with a survey''s authority attached.

      '
  scope:
    domain_discussed_by_source:
    - market_sizing
    - segmentation
    - india
    conditions: 'Indian consumer market analysis 1990s-2009.

      '
  caveats:
  - text: 'the author states her own role in creating what she now calls a myth: ''As someone who was
      part of the creation of the myth, I would like to be part of its clarification too.'' That disclosure
      is unusual and it strengthens the object; it also means the account is partly self-correcting testimony'
    origin: source_stated
  - text: her proposed replacement — abandon the monolith and use a 'multi-tiered cake' of layers of uneven
      size and affluence — is a reframing, not a resolution. It replaces one contested boundary with several,
      and the book does not claim otherwise
    origin: extractor_observed
  - text: the claim that treating the category as gospel leads to non-exploitation of opportunity is supported
      by Ganguli's assertion and by the author's own, not by any evidence that firms which planned on
      it did worse
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: Well evidenced as to the definitional
      disagreement, which is documented from a named research agency''s own interviews. The consequence
      for firm performance is asserted.'
    origin: extractor_observed
  source_stated_problems:
  - a category whose measured size is set by the analyst's own affordability threshold reproduces the
    firm's assumptions with survey authority attached
  source_stated_remedies:
  - abandon the aggregate category; work with explicitly defined layers, each sized and profiled separately
  examples:
    positive:
    - the enumerated range of middle-class estimates, from ~50 million to 500 million depending on the
      lens
