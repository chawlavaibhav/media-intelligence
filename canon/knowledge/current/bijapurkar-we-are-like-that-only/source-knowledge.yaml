- sk_id: sk_rbwl_0060
  source_id: bijapurkar_we_are_like_that_only
  source_terms:
  - benefit maximizers
  - cost-benefit optimizers
  - cash constrained benefit maximizers
  - money for value
  - value for money
  concept_label: segmenting_by_how_a_buyer_trades_benefit_against_cost_rather_than_by_what_they_can_afford
  label_origin: extractor_assigned
  claim: 'Bijapurkar proposes a segmentation whose axis is not spending power but VALUE ORIENTATION —
    how a buyer thinks about benefit against cost. Her five: the rich as benefit maximizers, oriented
    to "money for value", willing to pay more for more, described as "anywhere in the world consumers
    who just happen to be in India"; the consuming class as cost-benefit optimizers, oriented to "value
    for money", balancing the two continuously, "very hard to seduce with imagery-oriented brand benefits";
    the climbers as cash-constrained benefit maximizers with a fixed price point who shop for the maximum
    available within it; the aspirants, new and therefore occasional consumers; and the destitute. She
    claims the model is generic — "this value orientation-based consumer class model is a generic Indian
    model that works for all businesses" — and demonstrates it across office automation, hospital services,
    cellphones, education, chemicals and farm equipment.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Two buyers with the same budget can want opposite things from it: one to spend it all on the
      most benefit obtainable, another to spend as little of it as will do. Since the offer that wins
      differs between them while the affordability data does not distinguish them, a segmentation on spending
      power will place them together and mis-specify the offer for at least one.

      '
  scope:
    domain_discussed_by_source:
    - segmentation
    - consumer_behaviour
    - b2b
    - india
    conditions: 'Presented as a generic Indian model applicable across consumer and industrial categories,
      on NCAER''s consumer-classes framework as the underlying population data.

      '
  caveats:
  - text: the claim that the model 'works for all businesses' is a strong universal, supported by a series
      of illustrative applications the author asserts rather than by any validation. No case is given
      where it failed, and no test is offered
    origin: extractor_observed
  - text: the class labels (rich / consuming class / climbers / aspirants / destitute) come from NCAER;
      the VALUE-ORIENTATION overlay is the author's. The record keeps the two apart because the first
      is survey-derived and the second is not
    origin: extractor_observed
  - text: the Nirma case that anchors the climbers segment is a well-known 1980s story told without figures
      beyond 'outselling it ten to one in tonnage terms', and the harshness of the product ('65 per cent
      soda ash') is reported as consumer-accepted on the basis of a single quoted rationalisation
    origin: extractor_observed
  - text: population sizes attached to the segments are 2005-06 vintage and predate the period this project
      operates in
    origin: extractor_observed
