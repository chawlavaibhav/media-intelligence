  label_origin: extractor_assigned
  claim: 'Bijapurkar reports the SEC system — developed by the Market Research Society of India in the
    early 1980s, classifying urban households by the occupation and education of the chief wage earner
    and rural households by education and house type — and states why she prefers it to income: "through
    it we are able to identify consumer segments not just in terms of how much they consume but also in
    terms of what they will and will not prefer to consume." Her mechanism is that occupation and education
    shape not only earning capacity but family self-image and social status, and that "people like us
    / people not like us" differentiation governs behaviour. She gives the discriminating case: a junior
    executive with a professional qualification and a shopkeeper with a similar income will spend on different
    things, and the difference is sharpest for products requiring cultural rather than economic capital
    — newspapers, home computers, overseas holidays. She adds a precise contrast: "Television buying is
    more income driven, but the programmes watched are SEC driven," and that cellphones "have transcended
    social classes, and are driven almost totally by income."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Income predicts how much can be spent; it does not predict what will be considered appropriate
      to spend it on. Where a purchase carries social meaning, the constraint is the buyer''s sense of
      which goods belong to people like them, which tracks occupation and education rather than earnings
      — so two households with the same income diverge on exactly the categories that carry the most meaning.

      '
  scope:
