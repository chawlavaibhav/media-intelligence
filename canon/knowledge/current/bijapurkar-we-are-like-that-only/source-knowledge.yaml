  concept_label: the_books_own_statement_of_its_data_vintage_and_shelf_life
  label_origin: extractor_assigned
  claim: 'Bijapurkar states twice, in her own voice, that this book''s numbers have a short life. In the
    Preface to the revised edition she records what was updated: "I have updated all the data to 2008,
    and rewritten one particularly troublesome chapter that many readers have groaned about — Chapter
    5 ... I have also added more muscle and flesh to Chapter 11, ''Rural consumer India'', based on new
    data." In chapter 5 she raises the objection against herself — "Is a detailed tour of methodology
    and numbers from various sources really necessary, particularly if THE DATA WILL BE OUTDATED AS SOON
    AS THE BOOK IS PUBLISHED?" — and answers it by saying the purpose is to give strategists a framework
    for reasoning about the numbers rather than the numbers themselves.

    '
