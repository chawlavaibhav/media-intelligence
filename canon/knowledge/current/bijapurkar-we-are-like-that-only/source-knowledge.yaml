  concept_label: why_stripped_down_offers_for_low_income_buyers_fail
  label_origin: extractor_assigned
  claim: 'Bijapurkar states a specific and repeated failure in designing for low-income consumers: firms
    "reduced the price by reducing performance and assumed that this combination would work," offering
    reduced functionality, reduced styling and old or obsolete products, and "the consumer, as always
    the wiser, rejected all of it. Marketers then blamed the consumer and the country for not being evolved,
    whereas, in reality, the consumer was way ahead in sophistication." Her diagnosis is a single line:
    "What suppliers consider to be a frill, consumers consider to be a necessity." She supports it with
    the constraint that produces it — these consumers are "aware of what is happening in the rest of the
    world — as it happens, in real time," so "a better wood stove is not good enough in the world of LPG,
    nor is a black-and-white television or even a colour one without a remote" — and with the observation
    that they will "rather defer a purchase and get a better product than settle for something of a far
    lower standard today."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The supplier decides which attributes are inessential by reference to its own product hierarchy;
      the buyer decides by reference to what they have seen to exist. Where the buyer''s reference set
      is the same global one as the supplier''s premium customers, the attributes the supplier treats
      as removable are the ones the buyer treats as defining, and the stripped offer fails not on price
      but on relevance.

      '
  scope:
    domain_discussed_by_source:
    - product_design
    - bottom_of_the_pyramid
    - india
    conditions: 'Indian low-income consumers post-liberalisation, on 2008 data. The book positions itself
      explicitly against and alongside C. K. Prahalad''s *Fortune at the Bottom of the Pyramid*, and Prahalad
      wrote its Foreword.

      '
  caveats:
  - text: 'THE RELATIONSHIP WITH PRAHALAD SHOULD BE VISIBLE. Prahalad wrote the Foreword to this book
      and his BoP thesis is the interlocutor for its chapter 12. Bijapurkar is not neutral here, though
      she does qualify him: ''the bottom 250 million may be very hard to integrate into the mainstream
      market economy, as Prahalad urges in the book'''
    origin: extractor_observed
  - text: no failed product is named. The claim that firms did this and were rejected is asserted across
      an unnamed set of cases, in contrast with the named examples used elsewhere in the book
    origin: extractor_observed
  - text: the positive claims — that poor consumers do more complex financial value processing than the
      rich, that default rates on their loans are extremely low, that they innovate their own solutions
      — are asserted with illustrations (missed calls, mixed petrol and kerosene for community lighting,
      smaller glasses at weddings, GIAN's pedal-powered washing machine) and no data
    origin: extractor_observed
  - text: SEVERE FRESHNESS RISK. The market conditions described are pre-smartphone and pre-cheap-data.
      The 'missed call' practice she reports as characteristic is an artefact of a tariff structure that
      no longer exists
    origin: extractor_observed
