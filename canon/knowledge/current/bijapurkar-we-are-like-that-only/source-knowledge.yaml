- sk_id: sk_rbwl_0020
  source_id: bijapurkar_we_are_like_that_only
  source_terms:
  - lots and lots of people consuming a little bit each, adding up to a lot
  - the great Indian rope trick of numbers
  concept_label: a_demand_structure_of_many_small_consumers_and_what_it_breaks
  label_origin: extractor_assigned
  claim: 'Bijapurkar states the structural claim on which most of the book rests: "Consumer demand in
    the emerging economies is made up of lots and lots of people consuming a little bit each, adding up
    to a lot," where developed-market marketers "are used to working with an exactly opposite demand structure
    — a few people consuming a lot each, adding up to a lot." She draws the consequence explicitly: "neither
    the pricing paradigms nor the cost structures of their usual, tried and tested global business models
    are appropriate for India''s demand structure." She names the counter-intuitive consequence the "great
    Indian rope trick of numbers" — a small penetration of a large population produces a large absolute
    market, so lower-income groups can out-consume higher-income groups in absolute terms.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Business models encode assumptions about consumption per head. A retail format sized for a
      catchment that consumes a lot per head will not reach viability in a catchment that consumes little
      per head, regardless of how many people are in it — which is why, on her account, the first organised
      retail forays failed and why a small-format chain with an aggregated back end succeeded by "mimicking
      the structure of the customer demand".

      '
  scope:
    domain_discussed_by_source:
    - demand_structure
    - pricing
    - business_model_design
    - india
    conditions: 'Stated for India and for emerging markets more generally, on data to 2008. Bijapurkar
      draws the general form from the BRIC comparison — economies "individually poor but collectively
      rich" — and cites Goldman Sachs''s *Dreaming with the BRICs*.

      '
  caveats:
  - text: 'the two-wheeler evidence was inspected and it holds. Figure 4.1 (rural two-wheeler market)
      shows penetration falling 42 / 25 / 10 / 2.7 per cent across income groups while household counts
      rise 7 / 18 / 63 / 66 million, giving two-wheeler numbers of 3.8 / 4.5 / 6.4 / 1.8 million. The
      lower-middle group therefore does have about 1.6 times the units of the high-income group, exactly
      as the text claims. Source: Indian Readership Survey 2008'
    origin: extractor_observed
  - text: the general claim about business models is argued from a small number of Indian cases (Subhiksha,
      shampoo sachets, community telephony) with no failure cases and no financial detail. Subhiksha in
      particular is presented as a success; the chain collapsed shortly after this edition was published,
      which the book could not know and which is recorded here because the case is load-bearing
    origin: extractor_observed
  - text: SEVERE FRESHNESS RISK. Every figure supporting this object is 2008 or earlier and predates mobile
      data, e-commerce and digital payments in India
    origin: extractor_observed
  - text: 'Adjacency to sk_rbwl_0010 recorded without a graph edge: why the fixed offer is mis-sized.
      The original extraction used a ''supports'' relation, which SPEC-03 does not define; no permitted
      relation expresses it from this object''s side, so it is kept as an observation rather than expressed
      as a fabricated edge.'
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: The structural claim is supported
      by named large-sample survey data; the business-model consequence is argued from a handful of cases
      without financials.'
    origin: extractor_observed
  source_stated_problems:
  - business models encode a consumption-per-head assumption that fails silently in a market with the
    opposite structure
  source_stated_remedies:
  - design the business system to mimic the structure of the demand rather than adapting an offer designed
    for the opposite structure
  examples:
    positive:
    - Figure 4.1, rural two-wheeler market, IRS 2008
    - shampoo sachets creating a 'party pack' market as large as the bottled market rather than a trial-pack
