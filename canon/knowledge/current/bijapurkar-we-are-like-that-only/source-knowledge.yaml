  label_origin: extractor_assigned
  claim: 'Bijapurkar identifies a specific misdiagnosis and corrects it. When richer consumers began buying
    popular-segment rather than premium products, marketers called this "down-trading" and "many have
    suggested that this is the nature of the Indian consumer — mean and stingy." Her correction: "In fact,
    it is not the consumer who has ''down-traded'' but the supplier who has ''up-traded'' his offer and
    the popular and discount segments, in many cases, now offer a real value advantage in terms of equivalent
    if not better benefits at a lower price." She supplies the supply-side cause: unequal tax and duty
    incentives were withdrawn, forcing small manufacturers into open competition, which produced "rogue"
    marketers who refused to respect the unwritten price-performance rules, so consumers faced an explosion
    of new price-performance combinations. She gives the automotive instances — a 125cc motorcycle at
    a 100cc popular price, premium styling at discount prices, a B- segment car with premium features
    — and concludes that "the paradigm of premium-popular-discount = rich-middle income-poor is now quite
    irrelevant."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Observed behaviour changed because the choice set changed, not because preferences did. When
      the price-performance frontier moves, a buyer whose preferences are unchanged will appear at a different
      point on the old segmentation — and an analyst who holds the segmentation fixed will attribute the
      movement to the buyer''s character.

      '
