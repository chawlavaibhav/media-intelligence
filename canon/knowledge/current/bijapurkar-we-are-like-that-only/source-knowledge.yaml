- sk_id: sk_rbwl_0030
  source_id: bijapurkar_we_are_like_that_only
  source_terms:
  - The dangerous delusion of pent-up demand
  - The rock table
  concept_label: the_boom_extrapolation_stagnation_cycle_and_why_early_growth_misleads
  label_origin: extractor_assigned
  claim: 'Bijapurkar names a repeating pattern she says has recurred many times since 1991: an initial
    starburst of demand caused by a confluence of one-time events — release of pent-up demand, a category
    first strongly promoted, a distribution boom, a price threshold crossed by a sachet or an instalment
    scheme — followed by extrapolation of those early rates into the future, followed by stagnation when
    the market "hits a rock table and growth grinds to a halt". She reports the consequence of the 1990s
    instance: analysts extrapolated 20-30 per cent volume growth, "the myth of the Great Indian Middle
    Class was born", large capacity investments followed, and the consumption machine failed to materialise.
    She names what she says is required at the rock table: "not a mop but actually a powerful drill fashioned
    from a good market strategy", and specifically to search for weak areas rather than flog the sales
    team with targets based on historical growth.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A starburst is produced by a stock being released, not by a flow being established. Because
      the observed growth rate during release looks identical to the growth rate of an expanding flow,
      extrapolation cannot distinguish them from the rate alone — and the error is only visible after
      the stock is exhausted, by which point capacity has been committed.

      '
  scope:
    domain_discussed_by_source:
    - demand_forecasting
    - market_entry
    - india
    conditions: 'Indian consumer markets 1991-2009. Bijapurkar applies the same caution prospectively
      to the rural demand of 2005-09 in chapter 11, which is a genuine test of the pattern''s use.

      '
  caveats:
  - text: 'THE STRONGEST THING ABOUT THIS OBJECT IS THAT THE AUTHOR APPLIES IT AGAINST HER OWN INTEREST.
      In chapter 11 she turns the same caution on the ''rural renaissance'' optimism of 2009 — ''such
      talk makes me very nervous. It has too many overtones of the Great Indian Middle Class story, where
      we called victory at least a decade too early'' — and enumerates the one-time events behind the
      rural boom: good monsoons, high support prices, and a one-time write-off of Rs 60,000 crore of farm
      loans in 2007-8. That is a falsifiable prospective use of her own pattern'
    origin: source_stated
  - text: no mechanism is offered for distinguishing a starburst from sustained growth in real time, which
      is what a forecaster would need. The pattern is diagnostic after the fact and cautionary before
      it
    origin: extractor_observed
  - text: the historical instances are recounted without sources for the growth figures quoted
    origin: extractor_observed
  - text: 'Adjacency to sk_rbwl_0040 recorded without a graph edge: the middle-class myth was one product
      of this extrapolation. The original extraction used a ''supports'' relation, which SPEC-03 does
      not define; no permitted relation expresses it from this object''s side, so it is kept as an observation
      rather than expressed as a fabricated edge.'
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: A pattern named from history
      and applied prospectively once. Growth figures are quoted without sources.'
    origin: extractor_observed
  source_stated_problems:
  - one-time demand release and sustained demand growth are indistinguishable from the growth rate alone
  source_stated_remedies:
  - enumerate the one-time events behind an observed boom before extrapolating from it
  - at a growth plateau, search strategically for underserved segments rather than raising sales targets
    from historical rates
  examples:
    positive:
    - the mid-1990s capacity investments made on extrapolated growth, followed by late-1990s disappointment
    - the 2009 rural optimism, tested against good monsoons, support prices and a one-time farm loan write-off
