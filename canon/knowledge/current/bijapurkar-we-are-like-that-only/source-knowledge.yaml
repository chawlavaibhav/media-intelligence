  source_terms:
  - Is there a magic number above which 'consumption take-off' happens?
  - The threshold theory assumes that no smart new business models are possible
  concept_label: the_take_off_threshold_as_an_artefact_of_holding_prices_fixed
  label_origin: extractor_assigned
  claim: 'Bijapurkar addresses the theory that consumption "takes off" above a threshold per-capita income
    — variously pegged at US$1,100 or US$2 a day — and gives both sides. She concedes the correlation:
    the top 30 per cent of India, classified as having consuming power on proven aggressive consumption
    behaviour, did have a per-capita GDP of US$2,216 in 2008, "so there is some sanctity to the number."
    She then states the objection: at category level, consumption data for FMCG items with a history of
    aggressive value innovation — detergents, tea, shampoo — and for two-wheelers and cellphones "shows
    that consumption can take off well below any ''magic number''." Her diagnosis of the theory: it "is
    based on the notion that prices of delivered goods and services will remain unchanged, and will conform
    to existing ''global'' standards of existing companies ... The threshold theory assumes that no smart
    new business models are possible which can achieve this."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A threshold expressed in income units is really a statement about the ratio of income to price.
      Holding price fixed makes it look like a property of the population. If price can move — through
      pack size, business model or cost structure — the threshold moves with it, so the "magic number"
      is an artefact of the assumption rather than a fact about consumers.

      '
  scope:
    domain_discussed_by_source:
    - market_forecasting
    - pricing
    - emerging_markets
    conditions: 'India, categories with a history of aggressive value innovation, on 2008 data.

      '
  caveats:
  - text: the author gives the evidence for the position she is attacking as well as against it, which
      is unusual in this book and strengthens the object
    origin: extractor_observed
  - text: '''consumption can take off well below any magic number'' is asserted from named categories
      without penetration or price series being shown'
    origin: extractor_observed
  - text: the mechanism is a general point about ratios and would apply anywhere; the categories and the
      2008 numbers are Indian and dated
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: Both sides given; supporting
      figures named but not shown as series.'
    origin: extractor_observed
