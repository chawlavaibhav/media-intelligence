  source_id: bijapurkar_we_are_like_that_only
  source_terms:
  - '''THIS as well as THAT'''
  - continuity with change
  - high tolerance of ambiguity
  concept_label: hybrid_adoption_as_the_expected_outcome_rather_than_replacement
  label_origin: extractor_assigned
  claim: 'Bijapurkar argues that the expectation of a zero-sum contest between tradition and modernity,
    with modernity winning, was wrong, and that the observed pattern is "this as well as that": the new
    is adopted alongside the old in hybrid forms rather than replacing it. Her worked cases: chocolate
    makers failed to enter the Diwali sweets exchange with advertising, special flavours and Indian motifs,
    and succeeded only when small players packed individually wrapped chocolate mounds in the traditional
    decorated clay lamps used for the festival; ready-to-eat processed food was pre-empted not by changed
    food habits but by a cottage "kitchen outsourcing" sector supplying idli-dosa batter in plastic packets
    and home-cooked tiffin, which she analyses as "the best of both worlds — made on a micro scale, as
    if at home ... ready to cook (all negative labour outsourced!) but home-made (the positive labour
    retained!)"; and the arranged marriage becoming an "engineered" marriage rather than giving way to
    dating.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Where a practice bundles several benefits, only some of which the new offer improves, adoption
      proceeds by unbundling: the disliked component is outsourced and the valued component retained.
      The result looks like resistance to the new offer but is actually a more precise version of the
      demand than the offer addressed, which is why the successful entrant is usually the one that unbundles
      rather than the one that substitutes.

      '
  scope:
    domain_discussed_by_source:
