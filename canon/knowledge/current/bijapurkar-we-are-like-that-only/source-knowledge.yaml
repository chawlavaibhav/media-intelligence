  concept_label: a_widely_used_proxy_metric_that_tracked_the_wrong_variable
  label_origin: extractor_assigned
  claim: 'Bijapurkar identifies a specific measurement error. The popular theory held that household consumption
    was changing because more women worked outside the home. She reports the data against it: only 23
    per cent of housewives in urban India had a job outside the home, and "as households get richer, the
    proportion of women in the workforce falls" — 20 per cent of SEC A housewives working outside, sliding
    through B and C, rising again to almost 40 per cent toward SEC E. She then reports why the proxy failed
    even where it applied: "the ''this as well as that'' working woman continues to play the traditional
    role at home, and in many ways is the last to change practices inside the home, even as she blazes
    new trails outside," so "her personal spending and saving patterns on personal products will change
    quite dramatically, but not her household behaviour." Her conclusion is the correction: the change
    is driven not by more women working but by more housewives acquiring a working-woman mindset, a shift
    she calls womanism and describes as "a change in the mindset of women rather than in behaviour."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The proxy assumed employment outside the home would change practices inside it. It does not,
      because the two roles are held simultaneously rather than exchanged. So the metric that was easy
      to count tracked a variable that was not the operative one, and marketers watching it "are perhaps
      missing the big changes inside the home."

      '
  scope:
