    - household_consumption
    - gender
    - market_research
    - india
    conditions: 'Indian households on IRS 2008 data, urban and rural.

      '
  caveats:
  - text: THE TRANSFERABLE PART IS THE ERROR SHAPE, NOT THE FINDING. A countable proxy adopted because
      it is countable, tracking a variable that is not the operative one, is a general research failure.
      The Indian specifics are 2008-vintage
