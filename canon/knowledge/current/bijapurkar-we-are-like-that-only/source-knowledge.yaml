  source_id: bijapurkar_we_are_like_that_only
  source_terms:
  - morphing change
  - molting change
  - Force = Mass x Acceleration
  - change confluence
  concept_label: detecting_slow_change_in_a_large_population_and_why_trend_surveys_miss_it
  label_origin: extractor_assigned
  claim: 'Bijapurkar proposes a framework for reading change in this market, built on a distinction she
    draws: MOLTING change, in which the old is shed for the new like a snake''s skin, against MORPHING
    change, slow and from within, "like an amoeba which, with every tiny particle it ingests, infinitesimally
    changes shape." She argues Indian change is of the second kind and gives the reason in a physics analogy:
    since Force = Mass x Acceleration, "a small acceleration (small changes over long periods of time)
    can also unleash a large force of change, if the mass that is changing is very large." She names the
    detection problem it creates — "this change is not visible through the usual run of the mill ''usage
    and attitude'' type surveys that most companies ritualistically engage in" — and reports the executive''s
    experience: watching for change annually and finding none worth mentioning, then five years later
    finding the market distinctly different and asking "when did we blink and not see this happening?"
    Her proposed unit of observation is the CHANGE CONFLUENCE: a collection of individually insignificant
    changes occurring simultaneously, which together reshape a market.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'An instrument that reports a rate per period will report a small number every period when the
      per-period change is small, regardless of how large the accumulated change becomes or how large
      the population it applies to. The change is therefore invisible to the instrument and visible only
      in the cumulative state, which is why it is discovered retrospectively.

      '
  scope:
    domain_discussed_by_source:
    - trend_detection
    - market_research
    - india
    conditions: 'Indian consumer markets. The Force = Mass x Acceleration formulation is an analogy, and
      the author uses it as one.

      '
  caveats:
  - text: the physics analogy is rhetorical. Nothing is multiplied and no quantity is computed; it is
      a memorable way of saying that a small rate over a large base is a large absolute number. It should
      not be mistaken for a model
    origin: extractor_observed
  - text: 'the bicycle case that anchors the argument — a declining share explained by a confluence of
      rising rural incomes, a younger and more school-going buyer, better public transport and widened
      geographic footprints — is told without dates, figures or client, and without saying whether the
      recommended response worked. The author reports the category''s subsequent state as unresolved:
      ''it appears that the traditional bicycle has had its day, and the new one has not yet been innovated
      to everyone''s satisfaction'''
    origin: extractor_observed
  - text: no method is offered for detecting a change confluence prospectively. The two worked cases are
      both retrospective diagnoses, which is precisely the failure the object describes
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: A framework illustrated by undated,
      unattributed consulting cases with no outcomes.'
    origin: extractor_observed
  source_stated_problems:
  - a per-period trend instrument cannot see a small per-period change over a large base, so the change
