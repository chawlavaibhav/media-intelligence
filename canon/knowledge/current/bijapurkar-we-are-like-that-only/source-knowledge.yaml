  concept_label: requiring_the_analyst_to_define_the_market_construct_rather_than_inherit_it
  label_origin: extractor_assigned
  claim: 'Bijapurkar argues that "India" is not a usable market construct and that the analyst must build
    one: "the onus is on them to define what their India is, and translate the geographic idea into a
    well-defined construct of a consumer market." She develops this into the book''s recurring device,
    "my target India", and supplies the variables from which one is assembled — consumer classes, urban
    versus rural, states, age cohorts and the five economies — arguing that population-stratum definitions
    (metro, small town, semi-urban, rural) are "no longer wise" because development has created oases
    that do not follow town size. She illustrates with three firms defining non-overlapping target Indias:
    Hindustan Unilever taking "least developed India" — deeply rural, media-dark, low-literacy — for its
    utensil and fabric care growth; ICICI Bank taking developed, well-off rural India for wealth management;
    and a typical Fortune 500 defaulting to the rich urban educated "like anywhere in the world consumer
    who happens to be in India."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A market construct inherited as a given carries somebody else''s segmentation and somebody
      else''s idea of what varies. Constructing it deliberately from named variables forces the firm''s
      own competencies into the definition, which is what makes two firms'' target Indias differ legitimately
      rather than one of them being wrong.

      '
  scope:
    domain_discussed_by_source:
    - market_definition
    - segmentation
    - strategy
    - india
    conditions: 'Indian market strategy, 1990s-2009.

      '
  caveats:
  - text: the three firm examples are described without dates, revenue, outcome or source, and two are
      large firms whose stated strategies are matters of public record but are not cited here
    origin: extractor_observed
  - text: the Hindustan Unilever figure — contacting 13.6 million women across 30,000 villages in eight
      states between 2005 and 2006 for the detergent business alone — is the most specific operational
      number in the chapter and is given without a source
    origin: extractor_observed
  - text: 'the argument is a reframing rather than a method: it says what a target-market definition must
      be built from, not how to choose among the resulting definitions. The book does not claim otherwise'
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: Firm examples without sources
      or outcomes.'
    origin: extractor_observed
