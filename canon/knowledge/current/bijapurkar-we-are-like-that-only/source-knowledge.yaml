  source_terms:
  - the analogy school
  - emerging markets are not what the developed markets were in their infancy
  - Consumers exist in real time
  concept_label: the_analogy_trap_and_why_a_market_does_not_replay_another_markets_past
  label_origin: extractor_assigned
  claim: 'Bijapurkar attacks what she calls "the analogy school" — the practice of predicting a market''s
    evolution by studying a more developed market assumed to be analogous, plotting per-capita GDP against
    per-capita consumption across countries and reading the gap as opportunity. Her core objection is
    stated flatly: "the assumption that Indian consumers today are like American consumers twenty years
    ago, is deeply flawed. CONSUMERS EXIST IN REAL TIME and are confronted by all the forces of today,
    not yesterday. Moreover, they are products of their own unique consumer history and culture." She
    gives the reinforcing observation: "never before in the history of humanity have so many poor and
    illiterate people been subjected to so much real time exposure to the developed world," so a global
    health discourse about colas or fast food reaches a nascent market at the same moment it reaches a
    mature one. She adds a second objection — emerging markets need not be virgin markets — with the "experienced
    hire versus fresh hire" analogy: Consumer India already had a dense array of home-grown options at
    many price-performance points, which raises the bar for entrants.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'An analogy across time assumes the two markets faced the same information and the same alternatives
      at the same stage. Neither holds: information now arrives simultaneously everywhere, and the later
      market''s alternatives include technologies the earlier market did not have at that stage. So the
      later market can skip stages the analogy requires it to pass through, and the analogy''s prediction
      fails in the direction of over-predicting the skipped stage.

      '
  scope:
    domain_discussed_by_source:
    - forecasting
    - emerging_markets
    - market_entry
    conditions: 'Stated for India against developed-market analogies, over 1991-2009.

      '
  caveats:
  - text: 'her strongest instance is a leapfrogging prediction that was correct and is checkable: ''Intel
      will have to stop worrying about when PC penetration in India will hit the same levels as it did
      in developed markets earlier - it will need to fight in an India revolutionized by feature-rich
      cellphones, which are getting far more deeply entrenched than PCs in a much shorter span of time.''
      Written before 2009, this is a specific, falsifiable forecast and it held'
    origin: extractor_observed
  - text: the argument is asymmetric. She offers cases where analogy over-predicted (colas, breakfast
      cereals, PCs) and none where it under-predicted or was right. An argument against a forecasting
      method built only from its failures is weaker than it appears
    origin: extractor_observed
  - text: her positive alternative — 'painstakingly construct it from first principles, by studying age
      cohorts, by looking at cultural drivers of change and by understanding the process of change and
      the DNA of the society' — is a research programme, not a method, and no worked instance of it producing
      a forecast is given
    origin: extractor_observed
  - text: 'Adjacency to sk_rbwl_0010 recorded without a graph edge: the reasoning that produces the reversed
