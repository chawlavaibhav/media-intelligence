- sk_id: sk_rbwl_0010
  source_id: bijapurkar_we_are_like_that_only
  source_terms:
  - The question is not 'What sort of market for this [global] strategy?', but 'What sort of strategy
    for this [local] market?'
  - made for India
  concept_label: the_direction_of_the_strategy_question_and_the_error_of_reversing_it
  label_origin: extractor_assigned
  claim: 'Bijapurkar''s organising argument is that firms approaching this market habitually ask the question
    the wrong way round. They arrive with a tried-and-tested strategy and ask what size of market exists
    for it; the answer is usually "not much"; and the firm concludes the market is underdeveloped and
    will return later. She states that this "throws the baby out with the bathwater," and that the right
    question is "what should be my local, customized strategy for the Indian market" given my competencies
    and comparative advantages.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Asking what market exists for a fixed offer makes the offer''s parameters — its price, its
      performance point, its cost structure, its business model — into constraints on the answer. Since
      those parameters were set for a different demand structure, the addressable market is bounded by
      an accident of history rather than by the market''s actual size, and the firm reads a constraint
      it imposed as a fact about the market.

      '
  scope:
    domain_discussed_by_source:
    - market_entry_strategy
    - emerging_markets
    - india
    conditions: 'Stated for firms entering or operating in India, principally multinationals, over the
      period 1991-2009. Bijapurkar bounds her own advocacy: she is arguing for reframing, not claiming
      that a reframed strategy will succeed.

      '
  caveats:
  - text: the worked case is a glucometer company that declined to enter around 1999, told through a single
      unnamed account with no follow-up. The reader is never told what the company did next or whether
      the alternative model she proposes would have worked. This is the book's characteristic evidential
      shape and it recurs
    origin: extractor_observed
  - text: the author is a consultant arguing for the value of the work she sells, which is customized
      market strategy. That is not a disqualification, but the interest is real and the book does not
      disclose it
    origin: extractor_observed
  - text: no counter-case is offered anywhere in the book of a firm that correctly declined to enter.
      The argument is constructed entirely from firms that should have entered differently
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: A consultant''s central thesis,
      argued through unattributed cases with no outcomes reported.'
    origin: extractor_observed
  source_stated_problems:
  - asking what market exists for a fixed offer makes the offer's parameters a hidden constraint on the
    answer
  source_stated_remedies:
  - ask what strategy this market requires, given the firm's competencies, rather than what market this
    strategy has
  examples:
    positive:
    - a glucometer manufacturer that concluded around 1999 there was no Indian market, in a country the
      WHO already recorded as having the world's highest diabetic population and the world's smallest
      blood-glucose monitoring market
    - Kellogg's breakfast cereals against the idli, which south Indian focus-group respondents pointed
      out was also cereal-based, nutritious, fat free and cheaper per stomachful
  intra_source_relations:
