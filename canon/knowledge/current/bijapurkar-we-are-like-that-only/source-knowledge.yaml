  concept_label: designing_the_unit_of_purchase_and_the_unit_of_ownership_separately
  label_origin: extractor_assigned
  claim: 'Bijapurkar reports two related design moves that decouple use from ownership where per-head
    consumption is low. The first is COMMUNITY CONSUMPTION: models such as cyber cafes, STD/ISD telephone
    booths, cable operators serving a few thousand homes each, photocopying job shops and custom-hired
    tractors "amortize the investment across many people and thus effectively create a ''pay as you use''
    model," and she states the comparison explicitly — "a few telephone owners consuming a little are
    not as attractive as many call booths catering to a lot of people consuming a little each." The second
    is the SMALL PACK at low unit price, "characterized by the success of the sachet," which produces
    "large numbers of people who are ''occasional but regular'' consumers of things." She adds the consumption-behaviour
    observation behind both: Indians are "a nation of under-dosers" who will use one heaped tablespoon
    where the pack says two, partly from affordability and partly because "careful consumption is ingrained".

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Where per-head consumption is low, the barrier is the unit of purchase rather than the total
      demand: a large indivisible unit prices out buyers whose aggregate demand is nonetheless substantial.
      Reducing the purchase unit — by sharing the asset or by shrinking the pack — converts latent aggregate
      demand into transactions without requiring incomes to rise.

      '
  scope:
    domain_discussed_by_source:
    - business_model_design
    - pricing
    - india
    conditions: 'Indian consumer markets, principally pre-2009 and pre-smartphone. The named instances
      — STD/ISD booths, cyber cafes, community television — are of that period and several have since
      disappeared.

      '
  caveats:
  - text: SEVERAL OF THE NAMED INSTANCES NO LONGER EXIST. STD/ISD booths and cyber cafes were artefacts
      of a pre-mobile, pre-broadband cost structure. The book cannot know this and the object records
      it, because the MECHANISM — reduce the purchase unit rather than wait for incomes — outlived the
      instances
    origin: extractor_observed
  - text: 'the shampoo sachet claim is her strongest and is supported by inspected data: Table 5.6 shows
      rural shampoo penetration rising from 13.3 to 68.7 per cent between 2000 and 2008, which the author
      footnotes as the effect of packaging innovation and lower unit sizes. The causal attribution is
      hers; the penetration change is IRS-sourced'
    origin: extractor_observed
  - text: the 'under-doser' claim is an unsourced generalisation about a national population, illustrated
      by anecdotes about ketchup and cheese, and is the weakest element in the object
    origin: extractor_observed
  - text: the Hindustan Lever fuel-injection-pump story about achieving sachet fill precision is told
      without date or source and is the kind of well-travelled industry anecdote that should not be treated
      as documented
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: The mechanism is clear and one
      instance is supported by inspected survey data; the rest are illustrations, several now historical.'
    origin: extractor_observed
