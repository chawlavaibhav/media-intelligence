# CANON-014 — SPEC-03 SourceConceptSystems for Rama Bijapurkar, "We Are Like That Only".
#
# Three. The first is the only one with a real claim to being the SOURCE's: the book is organised
# around a single thesis and states it repeatedly. The second and third are the extractor's, and both
# exist to keep this source's bounds — its data vintage and its mixed evidential character — attached
# to the material that needs them.

source_id: bijapurkar_we_are_like_that_only

source_concept_systems:

- scs_id: scs_rbwl_001
  source_id: bijapurkar_we_are_like_that_only
  label: the_reasoning_errors_this_book_names_about_a_market_it_says_is_read_wrongly
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    The book's substantive contribution, gathered: a set of named errors in how firms and analysts
    reason about this market, each with a diagnosis. Ask what market exists for a fixed offer rather
    than what strategy the market requires. Predict evolution by analogy with another market's past.
    Extrapolate from a one-time demand release. Plan on a category whose size is set by your own
    affordability threshold. Read a consistently biased survey number as a level. Attribute a shift
    caused by a moving choice set to consumer character. Generalise a metropolitan high-SEC sample to
    a national youth population. Adopt a countable proxy that does not track the operative variable.
    Strip attributes the supplier thinks are frills.
  whole_system_claim:
    text: >
      What this source contributes that outlives its data is a catalogue of reasoning failures, each
      of which has the same general form: an assumption imported from elsewhere is treated as a
      property of the market, and the resulting number or judgement is then read with more authority
      than its construction supports. The Indian specifics date; the failure shapes do not.
    origin: extractor_synthesis
    interpretation_basis: >
      Bijapurkar states each of these individually and states her overall thesis — that this market is
      systematically misread — repeatedly. She does NOT gather them as a set of reasoning errors, and
      several sit chapters apart. Reading them as one catalogue with a common form is the extractor's.
      What the grouping ADDS, and what must be attributed to CANON-014, is the observation that in
      every case the error is the same one at a different site: a constraint the analyst imposed is
      read back as a fact about the market. That is visible across the set and not within any member.
    source_ref: null
  members:
    - {sk_ref: sk_rbwl_0010, role_in_system: the_reversed_strategy_question, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0090, role_in_system: the_analogy_trap, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0030, role_in_system: extrapolating_a_starburst, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0040, role_in_system: planning_on_an_undefined_category, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0050, role_in_system: reading_a_biased_number_as_a_level, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0080, role_in_system: attributing_a_choice_set_shift_to_character, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0140, role_in_system: generalising_an_unrepresentative_sample, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0130, role_in_system: a_countable_proxy_that_misses_the_variable, order: 8, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0150, role_in_system: stripping_what_the_buyer_treats_as_defining, order: 9, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0100, role_in_system: a_threshold_that_holds_price_fixed, order: 10, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - between: [sk_rbwl_0100, sk_rbwl_0090]
        nature: "the take-off threshold is a special case of the analogy trap: it reads another market's income-to-price ratio as a property of this population"
        origin: extractor_inferred
      - between: [sk_rbwl_0040, sk_rbwl_0050]
        nature: "the middle-class question cannot be settled from income data, so the definitional trap and the data trap are the same problem at two removes. Bijapurkar treats them in the same chapter but does not join them"
        origin: extractor_inferred
      - between: [sk_rbwl_0030, sk_rbwl_0040]
        nature: "the extrapolation of the early-1990s boom is what produced the middle-class figure; the source states this connection"
        origin: source_stated
    tradeoffs:
      - between: [sk_rbwl_0010, sk_rbwl_0170]
        nature: "the book's prescription — customize everything, define your own market construct — buys relevance at the cost of strategy complexity, and the source records the objection in the voice of an exasperated CEO: 'Why do we need a Rolls-Royce approach to segmentation for a market so small?' It answers that there is 'regrettably, no way out of this', which is an assertion rather than an argument"
        origin: source_stated
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, anecdotal, practitioner_assertion]
    source_uncertainty: >
      Evidential quality varies sharply across members. Four are supported by named survey data and by
      tables inspected in this pass; five rest on undated, unattributed consulting anecdotes. The
      caveats on each member say which.
    extraction_uncertainty: none
    system_level_uncertainty: >
      Moderate. The members are individually the author's, stated clearly and in her own words. The
      RISK the grouping introduces is that it makes a consultant's strategy book look like a
      methodology: presenting nine scattered arguments as a catalogue of errors with a common form
      lends them a coherence and an authority the book does not claim. It is recorded as a reading of
      what is durable in this source, not as her framework. The claim that all nine share one form is
      the extractor's and is the part most open to challenge.
  provenance:
    chapter: "1, 2, 4, 5, 8, 10, 12"
    section: "assembled across seven chapters"
    page_start: null
    page_end: null
    source_support: text_and_visual

- scs_id: scs_rbwl_002
  source_id: bijapurkar_we_are_like_that_only
  label: everything_here_is_2008_data_and_the_author_says_so
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    A grouping of the source's own statement about its data vintage together with every object whose
    substance depends on a number. Bijapurkar states in her Preface that she updated all data to 2008
    and states in chapter 5 that the data "will be outdated as soon as the book is published".
  whole_system_claim:
    text: >
      Every quantity in this record is a 2008-or-earlier observation about a market that has since
      acquired mass mobile internet, digital payments and consumer e-commerce at scale. The author
      says her numbers age immediately and that her intended durable contribution is the framework for
      reasoning about them. This record is built on that instruction: the numbers are retained as
      historical observations with their sources and years attached, and nothing here is a current
      figure.
    origin: extractor_synthesis
    interpretation_basis: >
      The vintage statements are quoted from the source. Attaching them to the specific objects whose
      substance is numerical is the extractor's, and is a statement about how this record must be read
      rather than a new claim about Consumer India.
    source_ref: null
  members:
    - {sk_ref: sk_rbwl_0180, role_in_system: the_authors_own_vintage_statement, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_rbwl_0020, role_in_system: numerical_object, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0050, role_in_system: numerical_object, order: 3, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0060, role_in_system: numerical_object, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0070, role_in_system: numerical_object, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0100, role_in_system: numerical_object, order: 6, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0130, role_in_system: numerical_object, order: 7, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0140, role_in_system: numerical_object, order: 8, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0160, role_in_system: numerical_object_with_obsolete_instances, order: 9, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - between: [sk_rbwl_0160, sk_rbwl_0180]
        nature: "the worst-affected object: several of its named business-model instances - STD/ISD booths, cyber cafes, community television - were artefacts of a pre-mobile cost structure and no longer exist, while the mechanism it describes survives them"
        origin: extractor_inferred
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: true
  source_warning_ref: "Preface to the revised edition; Ch. 5: 'the data will be outdated as soon as the book is published'"
  evidence:
    characteristics: [explicitly_stated]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      Low. The vintage statement is quoted and unambiguous, and the membership test — does this
      object's substance depend on a number — is mechanical. What the EXTRACTOR adds is the
      attachment, so that no numerical object can be retrieved without its vintage.
  provenance:
    chapter: "Preface; 5"
    section: "assembled"
    page_start: null
    page_end: null
    source_support: text

- scs_id: scs_rbwl_003
  source_id: bijapurkar_we_are_like_that_only
  label: three_kinds_of_evidence_in_one_voice
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    A grouping that records the source's mixed evidential character and sorts its objects by which kind
    of evidence they rest on: named third-party survey data; the author's own co-authored analysis;
    and undated, unattributed consulting anecdote.
  whole_system_claim:
    text: >
      This book speaks in one confident register across three quite different kinds of evidence. Some
      objects rest on named large-sample surveys with years attached and were checked against inspected
      tables. Others rest entirely on consulting stories told without client, date, sample or outcome.
      The book does not mark the difference; this record does, on every object, and the distinction
      should govern how much weight any object bears.
    origin: extractor_synthesis
    interpretation_basis: >
      The evidential difference is visible throughout the book but is nowhere flagged by the author,
      who uses the same declarative voice for a Hansa Research table and for an unattributed story
      about a motorcycle brand. Sorting the objects by evidence type is entirely the extractor's, and
      is the single most consequential editorial judgement in this record.
    source_ref: null
  members:
    - {sk_ref: sk_rbwl_0050, role_in_system: rests_on_named_survey_data_and_own_analysis, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0140, role_in_system: rests_on_named_survey_data, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0130, role_in_system: rests_on_named_survey_data_plus_unmethodised_agency_studies, order: 3, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0020, role_in_system: mixed_survey_data_plus_uncosted_cases, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0110, role_in_system: rests_on_consulting_anecdote_only, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0150, role_in_system: rests_on_consulting_anecdote_only, order: 6, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0170, role_in_system: rests_on_unattributed_firm_examples, order: 7, membership_origin: extractor_inferred}
    - {sk_ref: sk_rbwl_0120, role_in_system: mechanism_sound_culturalist_framing_unevidenced, order: 8, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies: []
    tradeoffs: []
    conflicts:
      - between: [sk_rbwl_0080, sk_rbwl_0110]
        nature: "the book offers two different sufficient explanations for the same event - the FMCG revenue stagnation of roughly 2000-2004. Chapter 4 attributes it to supplier up-trading having invalidated the premium-popular-discount segmentation; chapter 8 attributes it to a change confluence in which housing finance and durables purchases committed future income. Both are presented as the explanation in their own place and the book never reconciles them. This is recorded rather than resolved"
        origin: extractor_inferred
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [anecdotal, practitioner_assertion, visually_demonstrated]
    source_uncertainty: >
      By construction, this system is about the source's uncertainty rather than subject to it.
    extraction_uncertainty: none
    system_level_uncertainty: >
      The sorting is the extractor's judgement and could be disputed at the margin, particularly for
      the mixed objects. The unreconciled double explanation for the FMCG stagnation, recorded as a
      conflict, is an observation about the book rather than a finding about the market, and is
      recorded so that a downstream consumer meets it rather than picking whichever explanation
      happens to be retrieved.
  provenance:
    chapter: "whole book"
    section: "assembled"
    page_start: null
    page_end: null
    source_support: text_and_visual
