- term_id: t_rbwl_0031
  term: biased_instrument_read_as_a_level
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Using a consistently biased measurement for the absolute question it appears to answer, when its
    bias permits only rank and change comparisons. Named from the Indian income survey case, where the
    most rigorous survey accounts for under 60 per cent of disposable personal income.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 5"}
  arising_from: [sk_rbwl_0050]

- term_id: t_rbwl_0032
  term: unrepresentative_sample_projected_to_a_population
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Generalising from a sample whose coverage of the population is small and unstated. Named from the
    Indian youth-market case, where surveys of the highest social classes in four or five cities,
    covering 1-3 per cent of the youth population, were the basis of national claims.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 10"}
  arising_from: [sk_rbwl_0140]

- term_id: t_rbwl_0033
  term: category_sized_by_the_analysts_own_threshold
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Using as a planning input a category whose measured size is determined by the analyst's own
    affordability threshold, so that the number reproduces the firm's existing offer with a survey's
    authority attached. Named from the Indian middle-class case.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 5"}
  arising_from: [sk_rbwl_0040]

- term_id: t_rbwl_0034
  term: extrapolating_a_one_time_release
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Projecting forward a growth rate produced by the release of an accumulated stock, which is
    indistinguishable by rate alone from the growth of an expanding flow. Named from the
    boom-extrapolation-stagnation cycle.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 2"}
  arising_from: [sk_rbwl_0030]

- term_id: t_rbwl_0035
  term: slow_change_invisible_to_a_per_period_instrument
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Concluding that nothing is changing because each period's measured change is small, when the
    accumulated change over a large base is large. Named from the morphing-change argument and the
    executive who watches annually, sees nothing, and finds the market different five years later.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 8"}
  arising_from: [sk_rbwl_0110]

- term_id: t_rbwl_0036
  term: movement_attributed_to_the_wrong_term
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Attributing a change in a measured outcome to the subject's character when the instrument or the
    choice set moved instead. Named from two cases: the working-woman proxy that did not track the
    operative variable, and "down-trading" attributed to consumer meanness when the price-performance
    frontier had moved.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 4 and Ch. 10"}
  arising_from: [sk_rbwl_0130, sk_rbwl_0080]

- term_id: t_rbwl_0037
  term: stripped_by_the_suppliers_hierarchy
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Specifying a reduced offer by removing what the supplier's own product hierarchy treats as
    inessential, when the buyer's reference set is a different one. Named from the source's line:
    "What suppliers consider to be a frill, consumers consider to be a necessity."
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 12"}
  arising_from: [sk_rbwl_0150]

- term_id: t_rbwl_0051
  term: state_which_comparisons_an_instrument_licenses
  origin: extractor
  origin_ref: canon_014
  kind: repair_action
  definition_in_origin_frame: >
    For an instrument with known systematic bias, state explicitly whether its output may be used for
    levels, for ranks, or for change over time, and record which. Executor: whoever reports the
    measurement. A discipline of statement, not a correction; the source offers no way to recover a
    level from a biased instrument.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 5"}
  arising_from: [sk_rbwl_0050]

- term_id: t_rbwl_0052
  term: state_a_samples_coverage_before_projecting
  origin: extractor
  origin_ref: canon_014
  kind: repair_action
  definition_in_origin_frame: >
    Before projecting from a sample to a population, state what share of that population the sample
    covers and what its frame excludes. Executor: whoever projects. Named from the author's own
    practice of sending editors the population profile table in response to youth-market cover
    stories.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 10"}
  arising_from: [sk_rbwl_0140]

- term_id: t_rbwl_0053
  term: enumerate_the_one_time_events_behind_a_boom
  origin: extractor
  origin_ref: canon_014
  kind: repair_action
  definition_in_origin_frame: >
    Before extrapolating an observed growth rate, list the one-time events that could have produced
    it. Executor: whoever forecasts. Named from the author's own prospective application of this to the
    2009 rural optimism, where she enumerated good monsoons, high support prices and a one-time farm
    loan write-off.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 11"}
  arising_from: [sk_rbwl_0030]

- term_id: t_rbwl_0054
  term: check_the_proxy_against_the_operative_variable
  origin: extractor
  origin_ref: canon_014
  kind: repair_action
  definition_in_origin_frame: >
    Before building a forecast on a countable proxy, state what the operative variable is and why the
    proxy tracks it. Executor: whoever chooses the metric. Named from the working-women proxy, adopted
    because it was countable, which tracked employment rather than the household decision-making it
    was taken to indicate.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 10"}
  arising_from: [sk_rbwl_0130]

# ── terms this source attributes to a third party who is also a CANON-014 candidate ──
- term_id: t_rbwl_0060
  term: santosh_desai_attributions
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: attribution_record
  definition_in_origin_frame: >
    RECORDED AS AN ATTRIBUTION, NOT AS A CONCEPT, because the party attributed is a separate CANON-014
    candidate. Bijapurkar quotes and credits Santosh Desai at several points and thanks him in her
    Acknowledgements: "Santosh Desai (now managing director of Future Brands, formerly president of
    McCann Erickson) has added a significant dimension to my understanding of changing consumer values
    and attitudes and has been quoted quite a bit in this book." The specific attributions observed are:
    the auto-rickshaw as a metaphor for India, which "will not grow up to become a car, it will become
    a much better auto-rickshaw"; "Life is not a condition, but a product ... a blank that WE need to
    fill"; "the unlocking of the social and economic fixedness of life"; money as energy; the
    observation that "the dating market isn't here, but the mating market has just got deregulated";
    and the contrast between an older Indian identity rooted in "where we came from" and a modern one
    determined by the personal present and the promise of the future.
    NO CONCEPT IS MERGED ACROSS THE TWO RECORDS. The relation is recorded pairwise in
    canon/findings/CANON-014-CANDIDATE-LINEAGE-MATRIX.yaml with its direction and its date order.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Chs. 5, 8, 9; Acknowledgements"}
  arising_from: [sk_rbwl_0120]
