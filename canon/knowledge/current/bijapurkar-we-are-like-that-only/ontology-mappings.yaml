# CANON-014 — SPEC-05 ontology for Rama Bijapurkar, "We Are Like That Only". Source-local.
# No cross_source_concept. This source CITES Santosh Desai repeatedly and thanks him in the
# Acknowledgements; Desai is a separate CANON-014 candidate already extracted on this branch
# (desai-mother-pious-lady). That is a real, directional citation relation and is recorded in the
# CANON-014 lineage matrix, NOT merged here. Terms Bijapurkar attributes to Desai are marked as such
# below and remain source-local to this record.

source_id: bijapurkar_we_are_like_that_only
extraction_date: 2026-08-30

terms:

- term_id: t_rbwl_0001
  term: consumer_india
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's term throughout for the Indian consumer market treated as an object of analysis
    distinct from India as a geography or a polity. She insists the construct must be built rather
    than inherited, quoting Churchill via Shashi Tharoor that "India is merely a geographic
    expression. It is no more a single country than the equator."
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 1, section 'DEFINE YOUR OWN INDIA'"}
  arising_from: [sk_rbwl_0170]

- term_id: t_rbwl_0002
  term: made_for_india
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    A strategy built from the market's own structure and the firm's competencies, as against a global
    strategy adjusted for cultural sensitivity. The author connects it to C. K. Prahalad's distinction
    between "best practice" and "next practice", which she quotes.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 1, section 'MADE FOR INDIA'"}
  arising_from: [sk_rbwl_0010]

- term_id: t_rbwl_0003
  term: my_target_india
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The market construct a particular firm assembles for itself from named variables — consumer classes,
    urban/rural, states, age cohorts, the five economies — rather than accepting a geographic or
    population-stratum default. The author's point is that two firms' legitimate target Indias may not
    overlap at all.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 6, section 'THE IDEA OF MY TARGET INDIA'"}
  arising_from: [sk_rbwl_0170]

- term_id: t_rbwl_0004
  term: great_indian_rope_trick_of_numbers
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's term for the counter-intuitive arithmetic of a large population: a small penetration
    of a very large group yields a larger absolute market than a high penetration of a small one, so
    lower-income groups can out-consume higher-income groups in absolute terms.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, section 'THE GREAT INDIAN ROPE TRICK OF NUMBERS'"}
  arising_from: [sk_rbwl_0020]

- term_id: t_rbwl_0005
  term: the_rock_table
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The point at which growth from mopping up pent-up or just-below-the-surface demand stops. The
    author's prescription at the rock table is "not a mop but actually a powerful drill fashioned from
    a good market strategy", and specifically to search strategically for weathered-away areas rather
    than raise sales targets from historical growth.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 2, section 'THE LESSONS LEARNT'"}
  arising_from: [sk_rbwl_0030]

- term_id: t_rbwl_0006
  term: category_collide
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    Inter-category competition for the same consumer rupee, arising because the number of things a
    consumer could buy increased exponentially while income did not. The author's illustration is the
    choice between a cellphone for oneself and high-quality shampoo and ketchup for the family.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 2, section 'THE LESSONS LEARNT'"}
  arising_from: [sk_rbwl_0030]

- term_id: t_rbwl_0007
  term: down_trading
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The marketers' term for consumers buying at price points below where the segmentation places them.
    The author records the term and rejects its diagnosis: "it is not the consumer who has 'down-traded'
    but the supplier who has 'up-traded' his offer."
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, section 'THE BREAKDOWN OF THE PREMIUM-POPULAR-DISCOUNT CONSTRUCT'"}
  arising_from: [sk_rbwl_0080]

- term_id: t_rbwl_0008
  term: reliable_but_not_valid
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's characterisation of Indian household income survey data: repeat the survey with the
    same questions and you get the same answers, so it is reliable; it does not measure the real
    thing, so it is not valid. Her operational consequence is that it is usable for grading the
    population and for comparing growth over time, and not for levels.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 5, section 'STRATIFYING CONSUMER INDIA BASED ON INCOME'"}
  arising_from: [sk_rbwl_0050]

- term_id: t_rbwl_0009
  term: money_for_value_versus_value_for_money
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's paired terms for two value orientations: the benefit maximizer, willing to pay more
    for better ("money for value"), and the cost-benefit optimizer, judiciously balancing benefit and
    price to make value-optimising decisions ("value for money"). She reports that the second is "very
    hard to seduce with imagery-oriented brand benefits as the major reason why to buy."
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, section 'VALUE ORIENTATION-BASED CONSUMER MARKET STRUCTURE'"}
  arising_from: [sk_rbwl_0060]

- term_id: t_rbwl_0010
  term: sec_socio_economic_classification
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The classification developed by the Market Research Society of India in the early 1980s: urban
    households by the occupation and education of the chief wage earner, on an ordinal scale A1 to E2;
    rural households by the education of the chief wage earner and the type of house (pucca,
    semi-pucca, kuchcha), on a scale R1 to R4. The author prefers it to income because it predicts what
    a household will and will not prefer to consume, not only how much.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 7, section 'SOCIO-ECONOMIC CLASSIFICATION (SEC) OF CONSUMER INDIA'; grids in Tables 7.1 and 7.2"}
  arising_from: [sk_rbwl_0070]

- term_id: t_rbwl_0011
  term: morphing_change_versus_molting_change
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    Molting change sheds the old for the new, like a snake's skin. Morphing change transforms slowly
    from within, "like an amoeba which, with every tiny particle it ingests, infinitesimally changes
    shape". The author argues Indian change is of the second kind and that this is why it is invisible
    to per-period trend surveys.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 8, section 'MORPHING CHANGE VS. MOLTING CHANGE'"}
  arising_from: [sk_rbwl_0110]

- term_id: t_rbwl_0012
  term: change_confluence
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    A collection of individually insignificant changes occurring simultaneously, which together reshape
    a market. The author's instruction is to look for these rather than for a single large trend, and
    to look outside the category: the confluence that reshaped FMCG demand around 2000 was in housing
    finance and consumer durables.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 8, section 'CHANGE CONFLUENCES'"}
  arising_from: [sk_rbwl_0110]

- term_id: t_rbwl_0013
  term: this_as_well_as_that
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's term for hybrid adoption in which the new is taken up alongside the old rather than
    replacing it. Recorded here with the caveat carried on sk_rbwl_0120: the unbundling MECHANISM this
    names is clean and general; the author's further framing of it as an Indian cultural "DNA" with
    "high tolerance of ambiguity" is essentialist and unevidenced, and the two are separable.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 9, section 'THE DNA OF INDIAN SOCIETY: THIS AS WELL AS THAT'"}
  arising_from: [sk_rbwl_0120]

- term_id: t_rbwl_0014
  term: the_analogy_school
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's name for the practice, which she attributes particularly to consulting firms, of
    predicting a market's evolution by plotting multi-country per-capita GDP against per-capita
    consumption and assuming all emerging markets follow the developed markets' path.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 8, section 'PREDICTING FUTURE CHANGE: THE ANALOGY TRAP'"}
  arising_from: [sk_rbwl_0090]

- term_id: t_rbwl_0015
  term: womanism
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's term for "a gentler and less individualistic form of feminism ... about women
    asserting themselves as their own person too, who want their space and place", which she describes
    as "a change in the mindset of women rather than in behaviour" and therefore hard to see.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 10, section 'THE CHANGE WAVE OF WOMANISM'"}
  arising_from: [sk_rbwl_0130]

- term_id: t_rbwl_0016
  term: community_consumption
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    A model that amortises an asset's cost across many users to create a pay-as-you-use offer, so that
    the unit of purchase falls below the unit of ownership. The author's instances are period-specific
    and several no longer exist.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, section 'IMPLICATIONS FOR STRATEGY'"}
  arising_from: [sk_rbwl_0160]

- term_id: t_rbwl_0017
  term: occasional_but_regular
  origin: source
  origin_ref: bijapurkar_we_are_like_that_only
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's characterisation of the consumption pattern created by small low-unit-price packs:
    large numbers of people consuming a category not at a fixed periodicity but reliably on occasion.
    She insists this is a mainstream market in its own right, not a trial-pack stage to be upgraded
    from — "the former is the mainstream market for India."
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, sections 'MARKETING TO SUCH A DEMAND STRUCTURE' and 'IMPLICATIONS FOR STRATEGY'"}
  arising_from: [sk_rbwl_0160]

