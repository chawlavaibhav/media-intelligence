  rationale: 'Bijapurkar names two complementary forecasting failures and their mechanisms. A one-time
    release of accumulated demand is indistinguishable from sustained growth by its rate alone, so extrapolation
    cannot tell them apart until the stock is exhausted and capacity is committed; and a small per-period
    change over a large base is invisible to a per-period trend instrument and is discovered only in its
    accumulated state. This project will make projections from early observations — of capability, of
    demand, of cost — and both failures are about the relationship between an observation window and the
    process observed, which is not an Indian problem.

    '
  applicability:
    when: projecting forward from an observed rate, or concluding that nothing is changing because a per-period
      measure shows little
    limits: 'The source supplies the failure shapes and worked retrospective diagnoses. It supplies NO
      method for distinguishing a starburst from sustained growth prospectively, and NO method for detecting
      a change confluence before it has accumulated — which is precisely the limitation the objects describe.
      It supports asking the question; it does not answer it. The Force = Mass x Acceleration formulation
      is rhetorical and is not bound as a model.

      '
  governance_consumer: evidence_interpretation
