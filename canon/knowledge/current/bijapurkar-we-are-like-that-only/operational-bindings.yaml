  rationale: 'Two related failures are documented here with unusual concreteness. First, a sample covering
    1-3 per cent of a population being generalised to that population — Bijapurkar quantifies it, names
    the sampling frame (highest social classes in four or five big cities), and supports it with an inspected
    table giving the actual segment sizes. Second, a category whose measured size is determined by the
    analyst''s own affordability threshold, documented from a research agency''s own finding that every
    professional it interviewed had a different definition. This project sizes things — buyer-case pools,
    capability populations, corpora — and both failure shapes are directly transferable even though the
    market is not.

    '
  applicability:
    when: generalising from a sample to a population, or using a bounded category as a sizing input
    limits: 'The Indian segment sizes are 2008 figures and are not bound. What is bound is the requirement
      to state a sample''s coverage of the population before projecting from it, and to check whether
      a category''s boundary was set by the analyst''s own threshold. It supplies no sampling rule and
      no correction for an unrepresentative sample.

      '
  governance_consumer: evidence_interpretation
