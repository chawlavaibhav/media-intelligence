  rationale: 'Two documented instances of a single evaluation failure: a measured quantity moving for
    a reason other than the one attributed to it. In the first, a countable proxy (women working outside
    the home) was adopted because it was countable and tracked a variable that was not the operative one,
    so the forecast built on it failed. In the second, observed buying behaviour shifted because the price-performance
    frontier moved, and analysts attributed the shift to the buyer''s character. This project attributes
    changes in measured outcomes to causes, and both instances are cases of attributing a movement to
    the wrong term.

    '
  applicability:
    when: attributing a change in a measured outcome to a cause, where the measurement instrument or the
      choice set may itself have moved
    limits: 'Both instances are Indian, dated and told without the underlying analysis being shown. They
      support asking, of any attributed movement, whether the proxy tracks the operative variable and
      whether the choice set moved. They establish no rate at which this error occurs, supply no test,
      and licence no threshold. Note also that the source itself offers two unreconciled explanations
      for one of its own examples (see the conflict recorded in scs_rbwl_003), which is a live illustration
      of the difficulty rather than a solution to it.

      '
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs:
