  status: proposed
  status_reason: not reviewed
  governance_consumer: evidence_interpretation
  recast_note: 'RECAST FROM AN EVALUATION BINDING. It carried `observation_unit: measurement_series`,
    which is not one of SPEC-04''s media observation units - those run frame, shot, shot_pair, sequence,
    whole_asset, asset_set_over_time, and a business measurement series is none of them. The underlying
    lesson is real and is not about media at all: when a measured quantity moves, the movement may belong
    to the instrument or to the choice set rather than to the subject, and this source supplies two worked
    cases of it. That is a rule about how evidence may be interpreted, so it is now a governance binding
    with consumer `evidence_interpretation`. Nothing about a media output is evaluated by it, no threshold
    is adopted, and the role is `constrains` because it constrains what an attributed movement may be
    read as.'
bindings_considered_and_not_made:
- proposed_id: bnd_rbwl_0005
  target_type_considered: production
  source_knowledge_refs:
  - sk_rbwl_0150
  - sk_rbwl_0160
  - sk_rbwl_0020
  outcome: not_made
  reason: 'The extraction bound this with role `informs`, which SPEC-04 does not define, and its content
    is commercial strategy rather than media production: the unit at which a purchase is made, the unit
    at which an asset is owned, pricing granularity, and business-model design. SPEC-04''s `production`
    target is about HOW A MEDIA ARTEFACT IS MADE OR EXECUTED, and Production IR does not exist to receive
    anything else. Forcing pricing and packaging knowledge into it would put commercial strategy inside
    a media production contract, which is the boundary PROJECT-CONTRACT separation 2 exists to hold. THE
    KNOWLEDGE IS RETAINED IN FULL and is among the most useful in this source: sk_rbwl_0150 (why an offer
    stripped by the supplier''s own hierarchy is rejected, because the buyer''s reference set is global
    while the supplier''s is its own product line), sk_rbwl_0160 (decoupling use from ownership, and reducing
    the unit rather than the performance) and sk_rbwl_0020 (the many-small-consumers demand structure)
    are unchanged. A SourceKnowledge object with no binding is a normal SPEC-04 state, and this is a fact
    about our product''s current shape, not about the knowledge.'
