# CANON-014 — SPEC-04 bindings for Rama Bijapurkar, "We Are Like That Only", against SPEC-01 v0.1.
#
# Five bindings from eighteen objects. Thirteen have none.
#
# WHAT IS AND IS NOT BOUND HERE. This book's durable content is a set of REASONING ERRORS, and that is
# what is bound. Its market description is 2008-vintage and none of it is bound. No binding below
# carries a number, a segment size, a threshold or a market fact, because every one of those in this
# source is a historical observation about a market that has since changed fundamentally — and the
# author says so herself (sk_rbwl_0180).
#
# NO BINDING TO CREATIVE IR. Considered and declined: this book is about market structure and demand,
# not about what an artefact should be. There is no Creative IR field it fills.

