  rationale: 'Bijapurkar states, with unusual precision for a book of this kind, the discipline for using
    an instrument that is consistently biased: it is "reliable but not valid", so it can be used for ranking
    and for change over time and must not be used for levels, and the operational form is to work with
    percentiles rather than absolute bands or verbal labels. This project reasons from instruments with
    known error — the benchmark-qualified text evaluator carries a stated false-pass and false-fail rate
    on every row — and the general discipline of asking which comparisons an instrument''s error permits
    is exactly the one that already governs how that evaluator''s output is reported. This binds the general
    form of that discipline, and specifically the failure mode that an instrument expressed in absolute
    units invites use for the one question it cannot answer.

    '
  applicability:
    when: using any instrument with a known or suspected systematic bias, to establish which comparisons
      its error permits
    limits: 'The 59.6 per cent figure, the named surveys and the Indian context are all specific and dated,
      and none of them transfers. What transfers is the reliable-versus-valid distinction and the rule
      that a consistent bias preserves rank and change while destroying level. This supports stating which
      comparisons an instrument licenses; it supplies no test for detecting bias, no correction, and no
      threshold. The author''s attribution of the underreporting to cultural rather than methodological
      causes is asserted without evidence and is NOT bound.

      '
  governance_consumer: evidence_interpretation
