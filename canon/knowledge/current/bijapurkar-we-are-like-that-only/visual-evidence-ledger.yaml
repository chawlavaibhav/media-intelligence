# CANON-014 — visual-evidence ledger for Rama Bijapurkar, "We Are Like That Only".
#
# THE VISUAL PASS RAN AND COMPLETED, and for this source it was not optional. Every table and figure
# in this copy is an embedded raster image. Their content does NOT appear in the extracted text
# stream. The running prose NAMES them and reasons from them — "Table 5.1 gives a stratification
# scheme...", "as can be seen in Table 9.2" — without restating what they contain. A text-only
# extraction of this book would have lost load-bearing evidence and would not have known it.
#
# All 46 image objects were enumerated and classified, and all 30 data figures were opened and read.

source_id: bijapurkar_we_are_like_that_only
pass: attempted_and_completed
inspection_state: inspected_figure_level
visual_argument_role: figure_carries_content

# ── the copy as an object ───────────────────────────────────────────────────
copy_form:
  form: calibre_converted_pdf_from_an_ebook
  evidence: >
    Creator and Producer both `calibre (5.34.0) [https://calibre-ebook.com]`; page size US Letter
    (612x792 pt), which is a conversion default and not a trade paperback trim. The text layer is
    clean and complete, so the conversion did not damage the prose.
  consequence: >
    Two consequences, and the second is the important one. First, the 279 pages are conversion
    artefacts and carry no printed folios, so there is no authored page in this copy (see
    PROVENANCE.md). Second, and materially: the tables and figures survived the conversion as raster
    images rather than as text, which is why their content is absent from the text stream.

# ── enumeration: all 46 image objects classified ───────────────────────────
image_inventory:
  total_image_objects: 46
  classification:
    - {class: cover_and_front_matter, count: 3, dimensions: "2 at 600x800 rgb, 1 at 62x83 gray", note: "cover images and a small mark; not evidence"}
    - {class: chapter_opener_illustrations, count: 13, dimensions: "224x300 rgb", note: "a hand-drawn billboard carrying the chapter number and title, one per chapter for 13 chapters; decorative and navigational, not evidence"}
    - {class: data_figures_and_tables, count: 30, dimensions: "various, 300x88 to 902x432", note: "the book's evidence base"}
  classification_basis: >
    Mechanical by dimension, then confirmed visually. The 13 chapter openers are all 224x300 and were
    confirmed by inspection to be the same billboard illustration bearing different chapter numbers
    and titles (2 'the mixed messages from Consumer India', 5 'just how much purchasing power...',
    8 'how to read and predict change...', 11 'rural Consumer India', 13 'winning in the Indian
    market' were opened directly; the count of 13 matches the book's 13 chapters exactly).

# ── what was inspected ──────────────────────────────────────────────────────
inspection:
  method: >
    All 46 image objects were extracted from the PDF and enumerated by page and dimension. The 30 data
    figures were then opened and read directly, individually or in composed contact sheets. No caption
    or text reference was accepted as a description of a figure without looking at the figure.
  data_figures_in_book: 30
  data_figures_inspected: 30
  data_figures_not_inspected: 0
  chapter_openers_inspected: 6
  reproduction_quality: >
    Fully legible throughout. Column headings, row labels, numerals, footnotes and source lines all
    read clearly at native resolution. Not one of the 30 was too degraded to read.

# ── the material finding ────────────────────────────────────────────────────
figure_only_content:
  finding: >
    SEVERAL LOAD-BEARING CLAIM TABLES EXIST ONLY AS IMAGES AND THEIR CONTENT IS ABSENT FROM THE TEXT.
    The running prose refers to them and reasons from them without restating them. Confirmed for at
    least the following, each opened and read in this pass:
  instances:
    - {figure: "Table 5.1, Affluence Layers Based on Income Percentiles", content: "urban tiers 1-5 and rural tiers 1-4 by income percentile, household counts, and per-tier ownership of colour TV, refrigerator, two-wheeler, car, landline, washing machine and PC. Source: IRS 2008"}
    - {figure: "Table 5.2, Affluence Layers Based on Consumption Intensity", content: "eight named layers (Samriddha I and II, Sampanna, Siddha, Unmukha, Saamaanya, Sangharshi, Nirdhana) with population share, household millions, relative consumption intensity index, urban-rural split and total purchasing power index. Source: IRS 2008"}
    - {figure: "Table 5.3, GDP Distribution in Class, Mass, Bottom of Pyramid India (2008)", content: "three layers by income percentile with population, income share, GDP per capita and total GDP. This is the source of the text's US$367 billion bottom-of-pyramid figure: the last-60-per-cent layer shows 690mn people and US$367.4 billion"}
    - {figure: "Table 7.1, Urban SEC", content: "the full classification grid mapping ten occupation categories against seven education categories onto classes A1 through E2. Source: Market Research Society of India. The text describes the system but does not reproduce the grid"}
    - {figure: "Table 7.2, Rural SEC", content: "the grid mapping seven education categories against three house types onto R1 through R4"}
    - {figure: "Table 9.1, Liberalization's Impact on India's Culture", content: "an eleven-row from/towards table (genteel poverty to learning to earn more; swadeshi to international; self-reliance to efficiency; and so on). The text cites it and gives none of its content"}
    - {figure: "Table 9.2, Indian and Western Values", content: "a two-column contrast of asserted values (patriarchy/egalitarianism; ambiguity and low dissonance/clarity and linearity; socially defined roles/individually chosen roles; and so on), with no source and no data. The text says 'as can be seen in Table 9.2' and stops"}
    - {figure: "Table 10.1, Profile of Twelve- to Nineteen-Year-Olds in India", content: "eight segments with SEC, town size, absolute millions and share of total, from Rich Brats 0.8mn/0.4% to Rural Marginal Consumers 137mn/71%. Source: IRS 2008. This table substantiates the 1-3 per cent sampling claim exactly and its content is not in the text"}
    - {figure: "Table 12.1, Changing Attitudes of the BOP Consumer", content: "a five-row from/towards table (settle for less to stretch for more; abstemiousness to affordable indulgence; and so on)"}
  consequence: >
    Nine tables whose content exists only as images, at least four of which carry evidence the text
    relies on. Objects sk_rbwl_0050, sk_rbwl_0070, sk_rbwl_0120 and sk_rbwl_0140 rest partly on tables
    that were read here and could not have been read from the text.

# ── what the inspection established about the text's claims ────────────────
claims_checked_against_figures:
  - claim: "the lower-middle income group has about 1.6 times the two-wheeler sales of the high-income group, despite about one-fourth the penetration, because it has about nine times the households"
    figure: "Figure 4.1, Rural India: Two-wheeler Market"
    outcome: confirmed
    note: >
      The figure gives penetration 42 / 25 / 10 / 2.7 per cent, household counts 7 / 18 / 63 / 66
      million, and two-wheeler numbers 3.8 / 4.5 / 6.4 / 1.8 million. 6.4 divided by 3.8 is 1.68,
      which matches the text's "1.6 times". The arithmetic in the text is supported by the figure.
      Source line: Indian Readership Survey, 2008.
  - claim: "in 2006 the top 10 per cent of consumers by income accounted for 34 per cent of India's income and 30 per cent of consumption expenditure; the next 30 per cent accounted for another 36 per cent"
    figure: "Table 4.2, Consumer Stratification by Income and Expenditure"
    outcome: confirmed
    note: "The table gives 34.1 / 30.0, 36.1 / 36.6 and 29.7 / 33.4 for the three bands, matching the text's rounded figures."
  - claim: "the bottom-of-pyramid layer accounts for a market opportunity of US$367 billion in 2008"
    figure: "Table 5.3, GDP Distribution"
    outcome: confirmed
    note: "The last-60-per-cent layer shows total GDP of US$367.4 billion against 690 million people."
  - claim: "as households get richer the proportion of women in the workforce falls, from 20 per cent of SEC A housewives working outside the home, sliding through B and C, and climbing again toward SEC E"
    figure: "Figure 10.2, Incidence of Housewives Working Outside the Home"
    outcome: confirmed
    note: >
      The urban panel shows a clear U-shape, falling from A1 through B2 and rising through D to E2;
      the rural panel rises monotonically from R1 to R4. The claim as stated is supported.
  - claim: "surveys of the highest social classes in four or five big cities represent at worst under 1 per cent and at best about 3 per cent of Indian youth"
    figure: "Table 10.1, Profile of Twelve- to Nineteen-Year-Olds"
    outcome: confirmed
    note: >
      The table's own shares put Rich Brats at 0.4 per cent, Creamy Layer at 1 per cent and Consuming
      Class at 3 per cent, all confined to the top 23 cities, against Rural Marginal Consumers at 71
      per cent. The claim is exactly supported by the table.
  - claim: "rural shampoo penetration rose sharply through the 2000s as a result of packaging innovation and lower unit sizes"
    figure: "Table 5.6, Penetration Growth of Consumer Goods in Rural India"
    outcome: partially_confirmed
    note: >
      The PENETRATION CHANGE is confirmed: 13.3 per cent in 2000 to 68.7 per cent in 2008. The CAUSAL
      ATTRIBUTION to packaging innovation is the author's own footnote to her own table and is not
      evidence. The two are separated here and in sk_rbwl_0160.
  - claim: "Figure 4.2 shows the premium-popular-discount market structure construct"
    figure: "Figure 4.2"
    outcome: confirmed_as_schematic_only
    note: >
      Opened and read. It is a price-against-performance schematic showing a traditional
      price-performance line, named segment positions, and three 'new offering' markers below the line.
      IT CARRIES NO DATA. It illustrates the argument of sk_rbwl_0080 and is not evidence for it, and
      the object records this.

# ── loss patterns observed, using the Audit Gate vocabulary ────────────────
observed_loss_patterns:

  - pattern: in_figure_text_absent
    affects: "all 30 data figures; at least 9 tables whose content appears nowhere in the text stream"
    detectability: detected_by_independent_check
    recoverability: recovered_in_this_copy
    evidence: >
      THE DEFINING REPRESENTATION FACT ABOUT THIS SOURCE. The calibre conversion preserved the prose
      as text and the tables as images. Because the running text names its tables without restating
      them, a text-only extraction would silently lose the evidence base while retaining the
      assertions that rest on it — and would show no sign of having done so. Recovered here: all 30
      were extracted and read.

  - pattern: no_authored_page
    affects: "the whole source"
    detectability: detected_by_independent_check
    recoverability: unrecoverable_in_this_copy
    evidence: >
      Established from the PDF metadata (calibre-produced, US Letter default page size) and from the
      text layer, which carries no running folios. The 279 pages are conversion artefacts. The
      printed edition certainly has pages; this copy does not, and none was interpolated. Every
      locator in this record is a chapter number, title and section heading, all of which are stable
      and unique in this book.

  - pattern: no_loss_detected
    affects: "text-layer ordering and completeness"
    detectability: detected_by_independent_check
    recoverability: not_applicable
    evidence: >
      Checked rather than assumed. A duplicate-sentence scan over the whole extracted text for
      sentences above 90 characters returned ZERO duplicates: no pull-quote flattening, no
      reading-order damage. The whole book is present and extracts in order — Foreword by C. K.
      Prahalad, Preface, all 13 chapters, Afterword by N. R. Narayana Murthy, Bibliography,
      Acknowledgements, endnotes and copyright page.

  - pattern: no_loss_detected
    affects: "figure coverage"
    detectability: detected_by_independent_check
    recoverability: not_applicable
    evidence: >
      Unlike the other two sources added in this pass, the visual pass here is COMPLETE for the class
      that matters: 30 of 30 data figures inspected, 0 not inspected. The 13 chapter openers were
      classified mechanically by dimension and 6 of the 13 were opened to confirm the classification.

# ── consequence ─────────────────────────────────────────────────────────────
claim_resolution_after_inspection: all_resolved
consequence: >
  This is the only complete visual pass of the three run in this batch, and it was also the most
  necessary. Six of the book's quantitative claims were checked against the tables they rest on and
  all six hold, one of them (the shampoo penetration) with its causal attribution separated out as the
  author's own annotation rather than as evidence. Four objects in this record rest partly on tables
  that exist only as images and were read here.

  THE BOUND. Inspection confirms that the text reports its own tables accurately and that the tables
  say what the text says they say. It establishes nothing about whether the underlying surveys are
  right, and nothing about whether any of it is still true: every figure inspected is dated 2008 or
  earlier, and the author states in her own Preface that her data would be outdated on publication.
  That statement is carried as sk_rbwl_0180 and grouped as scs_rbwl_002 with every numerical object in
  the record.
