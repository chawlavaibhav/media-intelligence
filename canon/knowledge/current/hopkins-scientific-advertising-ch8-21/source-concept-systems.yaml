    page_start: 34
    page_end: 63
    source_support: text

- scs_id: scs_sa8_004
  source_id: hopkins-scientific-advertising-ch8-21
  label: the_sample_offer_as_a_machine_that_pays_for_itself_several_times
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: source_stated
  description: >
    Chapters 13 and 14 describe one device doing five jobs at once. A free sample offer licenses the
    word "Free" and so multiplies readership of the advertisement; it keys the advertisement and
    makes comparison possible; it converts an unconvinced reader into a named prospect who can be
    followed up; it is fulfilled through retailers in a way that recruits them into stocking; and
    the pre-announced full-package coupon forces general distribution without a sales force. The
    gate on who receives a sample, and the cost of policing that gate, are part of the same machine.
  whole_system_claim:
    text: >
      The sample offer is not an expense with a benefit; it is one instrument whose separate returns
      are claimed to cover its cost several times over, which is why it must be evaluated at the
      level of cost per customer for the whole system rather than as a line item. Each function
      also constrains the others: the offer must be free for the readership and keying gains, and it
      must be gated for the impression gain, so "free" and "freely distributed" are opposite
      requirements of the same device.
    origin: extractor_synthesis
    interpretation_basis: >
      The linkage between the sample apparatus and distribution is stated by the source directly —
      "The sample plans dealt with in the previous chapter aid quick distribution. They often pay
      for themselves in this way alone" — which is why `system_type_origin` is `source_stated`. The
      multiple-payback structure is also the source's: chapter 13 enumerates readership, keying,
      prospect capture and referral as separate ways in which "samples pay". What is OURS is the
      identification of the free/gated tension as a constraint internal to the device, and the
      framing of the whole as one machine to be evaluated jointly rather than as a set of benefits
      to be listed.
    source_ref: {chapter: "14", locator: "printed p.45, 'The sample plans dealt with in the previous chapter aid quick distribution.'"}
  members:
  - {sk_ref: sk_sa8_0024, role_in_system: readership_gain_and_the_free_requirement, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_sa8_0025, role_in_system: measurement_gain_and_prospect_capture, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_sa8_0026, role_in_system: cost_driver, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_sa8_0027, role_in_system: gate_and_the_constraint_on_free, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_sa8_0028, role_in_system: cost_of_policing_the_gate, order: 5, membership_origin: source_stated}
  - {sk_ref: sk_sa8_0029, role_in_system: evaluation_rule_for_the_whole, order: 6, membership_origin: source_stated}
  - {sk_ref: sk_sa8_0030, role_in_system: distribution_gain, order: 7, membership_origin: source_stated}
  - {sk_ref: sk_sa8_0031, role_in_system: distribution_gain, order: 8, membership_origin: source_stated}
  - {sk_ref: sk_sa8_0032, role_in_system: failure_condition_and_repair, order: 9, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: causal
      origin: extractor_inferred
    dependencies:
    - {from: sk_sa8_0025, to: sk_sa8_0024, nature: "the key registers interest cheaply only if the offer is free", origin: source_stated}
    - {from: sk_sa8_0031, to: sk_sa8_0024, nature: "the distribution mechanism runs on the free full-size package", origin: source_stated}
    - {from: sk_sa8_0032, to: sk_sa8_0030, nature: "routing fulfilment through a shop is how demand becomes stocking", origin: source_stated}
    - {from: sk_sa8_0028, to: sk_sa8_0027, nature: "the gate needs enforcement, and the enforcement is itself costed", origin: extractor_inferred}
    tradeoffs:
    - between: [sk_sa8_0024, sk_sa8_0027]
      nature: >
        The offer must cost the prospect nothing, and must not be handed to anyone who has not
        asked and been told the story. Free and freely given are opposite requirements of one
        device, and the source states both without naming the tension.
      origin: extractor_inferred
    - between: [sk_sa8_0026, sk_sa8_0032]
      nature: >
        Local redemption produces inquiries at a fraction of the cost of mail, but restricts the
        offer to towns with distribution — which is why out-of-town respondents are invited to
        write and are then routed back to a shop rather than posted a sample.
      origin: source_stated
      source_ref: {chapter: "14", page_start: 45, page_end: 46}
    conflicts: []
  source_warns_against_isolated_use: true
  source_warning_ref: >
    Printed p.43: "Samples sometimes seem to double advertising cost. They often cost more than the
    advertising. Yet, rightly used, they almost invariably form the cheapest way to get customers."
    The source explicitly warns that judging the sampling expenditure on its own line item — rather
    than on cost per customer across the whole machine — inverts the answer. Printed p.43 also warns
    that samples given out without the gate "probably never pay", so the device is not to be adopted
    piecewise.
  evidence:
    characteristics: [explicitly_stated, empirical_within_source, controlled_comparison, argued, mechanism_given, practitioner_assertion, outcome_claimed, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      This is the best-evidenced system in the span and still not well evidenced. Two members carry
      reported returns (sk_sa8_0026's 70 cents against 18-22 cents, which is also the only
      controlled comparison in chapters 8-21; sk_sa8_0028's repeater check) and the rest assert
      results without showing them. The claim that the returns SUM to more than the cost — the
      system's whole point — is never computed anywhere in the source for any product. The machine
      is also thoroughly 1923: bearer coupons redeemable at any retailer, samples consigned to
      shops, mailed proofs to dealers, published circulation figures. Nothing here is translated.
  provenance:
    chapter: "13 — Use of Samples; 14 — Getting Distribution"
    section: "two consecutive chapters the source itself links"
    page_start: 40
    page_end: 46
    source_support: text
