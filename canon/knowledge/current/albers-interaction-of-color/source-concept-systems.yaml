- scs_id: scs_alb_c003_002
  source_id: albers_interaction_of_color_ch1_5
  label: the_relativity_exercise_and_its_conditions
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: source_stated
  description: >
    Chapter IV is one exercise together with everything that has to hold for it to work: the claim
    it demonstrates, the physical analogy that makes it plausible, the setup, the two dimensions
    along which influence acts, the pedagogy of withholding the method, the rejection of harmony as
    a criterion, and the layout failure that destroys the effect.
  whole_system_claim:
    text: >
      Making one colour look like two is not a trick but a controlled comparison, and it only
      succeeds under stated conditions. The pieces must be identical and the grounds large; the
      arrangement must not tile; the judgement is whether the effect occurred, not whether the result
      is pleasant; and the conditions must be discovered by the student rather than supplied.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {locator: "chapter IV, PDF pages 34-37"}
  members:
    - {sk_ref: sk_alb_c003_0011, role_in_system: claim_demonstrated, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0010, role_in_system: supporting_analogy, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0012, role_in_system: exercise, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0013, role_in_system: what_it_teaches, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0014, role_in_system: what_it_teaches, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0016, role_in_system: pedagogy, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0017, role_in_system: criterion, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0015, role_in_system: failure_condition, order: 8, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: procedural, origin: source_stated}
    dependencies:
      - {from: sk_alb_c003_0012, to: sk_alb_c003_0009, nature: "the exercise requires colour paper's exact repeatability", origin: source_stated}
      - {from: sk_alb_c003_0013, to: sk_alb_c003_0012, nature: "influence is what the exercise reveals", origin: source_stated}
      - {from: sk_alb_c003_0015, to: sk_alb_c003_0012, nature: "the tiling failure is a failure of this exercise specifically", origin: source_stated}
    tradeoffs: []
