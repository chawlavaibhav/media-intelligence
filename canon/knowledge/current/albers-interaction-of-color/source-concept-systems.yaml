- scs_id: scs_alb_c003_001
  source_id: albers_interaction_of_color_ch1_5
  label: the_argument_from_unreliable_perception_to_a_programme_of_study
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: source_stated
  description: >
    Chapters I to III are one continuous derivation. Colour cannot be reliably remembered, and its
    names are inadequate, so a colour cannot be pinned down in the abstract. A colour is in any case
    almost never seen alone, arriving always in relation to changing neighbours. Meaning therefore
    lives between elements rather than in them — as with letters in a word, tones in music, spelling
    in poetry. So the object of study must be what happens between colours rather than the pigments
    themselves, and the working material must be one that can supply the identical colour twice.
  whole_system_claim:
    text: >
      The unreliability of colour memory and naming, combined with the fact that colour is never seen
      in isolation, together license a specific programme: study interaction rather than pigment, and
      work in colour paper rather than paint so that the same colour can be repeated exactly. Each
      step is offered as the reason for the next.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {locator: "chapters I-III, PDF pages 29-33"}
  members:
    - {sk_ref: sk_alb_c003_0001, role_in_system: opening_evidence, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0002, role_in_system: stated_reason, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0003, role_in_system: stated_reason, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0006, role_in_system: premise, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0007, role_in_system: generalising_premise, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0008, role_in_system: programme, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_alb_c003_0009, role_in_system: material_consequence, order: 7, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: causal, origin: source_stated}
    dependencies:
      - {from: sk_alb_c003_0008, to: sk_alb_c003_0006, nature: "studying interaction is warranted by colour never being seen alone", origin: source_stated}
      - {from: sk_alb_c003_0008, to: sk_alb_c003_0007, nature: "and by meaning residing between elements", origin: source_stated}
      - {from: sk_alb_c003_0009, to: sk_alb_c003_0008, nature: "the material is chosen to serve the programme", origin: source_stated}
      - {from: sk_alb_c003_0002, to: sk_alb_c003_0001, nature: "poor visual memory is given as the first reason names fail", origin: source_stated}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, visually_demonstrated, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: ocr_degraded
    system_level_uncertainty: >
      The derivation is the source's own and runs in its chapter order, with each chapter opening
      from the previous one's conclusion. What is ours is treating chapter II's reading-and-music
      analogies as a generalising premise rather than as illustration.
  provenance:
