- sk_id: sk_alb_c003_0018
  source_id: albers_interaction_of_color_ch1_5
  source_terms:
    - "Very few are able to distinguish higher and lower light intensity (usually called higher and lower value) between different hues."
  concept_label: few_can_judge_relative_lightness_across_different_hues
  label_origin: extractor_assigned
  claim: >
    Very few people can distinguish higher from lower light intensity — usually called value —
    between different hues, and only a minority can tell the lighter from the darker within close
    cases. The source draws a parallel: someone unable to distinguish a higher from a lower tone
    probably should not make music, and by the same standard almost everyone would prove incompetent
    for the proper use of colour.
