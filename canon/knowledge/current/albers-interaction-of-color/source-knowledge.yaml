- sk_id: sk_alb_c003_0015
  source_id: albers_interaction_of_color_ch1_5
  source_terms:
    - "their illusional effects annul each other"
    - "The simultaneous influence from too many directions -- from left and right, and above and below"
    - "The unfavorable distribution of area between the influencing and the influenced color."
  concept_label: tiled_arrangements_annul_the_effect_they_are_meant_to_show
  label_origin: extractor_assigned
  claim: >
    Small pieces on small grounds must not be used, and studies interlocked into a tile pattern
    destroy the effect they are meant to demonstrate. Two reasons are given: simultaneous influence
    arriving from too many directions at once — left and right, above and below — and an unfavourable
    distribution of area between the influencing and the influenced colour. Shown separately in pairs
    the same studies demonstrate the effect clearly. The source says such presentation lacks both
    sight and insight.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Influence arriving from several directions at once cancels, and too small a ground relative to
      the influenced piece removes the ground's power to influence it.
  scope:
    domain_discussed_by_source: [colour_study_and_teaching]
    conditions: "presentation and layout of colour studies"
  caveats:
    - text: "the counter-example is marked graphically as well as verbally — the tiled arrangement is struck through with a diagonal and labelled NO"
      origin: extractor_observed
    - text: "the figure reproduces perfectly in this greyscale digitisation and is still unable to show the fault, which is that the colour illusions cancel"
      origin: extractor_observed
  source_stated_problems:
