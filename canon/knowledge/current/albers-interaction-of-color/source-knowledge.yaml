- sk_id: sk_alb_c003_0009
  source_id: albers_interaction_of_color_ch1_5
  source_terms:
    - "color paper permits a repeated use of precisely the same color without the slightest change in tone, light, or surface quality"
  concept_label: colour_paper_is_preferred_to_paint_for_experimental_control
  label_origin: extractor_assigned
  claim: >
    The studies are done in colour paper rather than paint. Paper provides innumerable ready-made
    colours cheaply, gathered from printers' waste, packing and wrapping papers, magazine cutouts and
    catalogues rather than from prepared sets. It permits repeated use of precisely the same colour
    without the slightest change in tone, light or surface quality, and without traces of hand or
    tool. It needs almost no equipment beyond paste and a razor blade. It protects against unwanted
    texture — brush marks, changes from wet to dry, hard and soft boundaries — which the source says
    too often hides poor colour conception or insensitive handling. And because a large collection
    can be displayed at once, it trains constant comparison of neighbouring and contrasting colours
    in a way no palette can.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Exact repeatability of a colour is what allows a study to isolate one variable; paint varies
      with thickness, evenness and application, so it cannot supply the same colour twice.
  scope:
    domain_discussed_by_source: [colour_study_and_teaching]
    conditions: "classroom and studio colour exercises"
  caveats:
    - text: "the source names the least desirable option specifically: prepared 'tuned' sets claiming to be failure-proof, and named systems such as Munsell or Ostwald"
      origin: source_stated
    - text: "the reasoning is that of experimental control — hold every variable but one — stated in practical rather than methodological language"
      origin: extractor_observed
  source_stated_problems:
    - "varying density and intensity from traces of hand or tool"
    - "so-called texture which too often only hides poor color conception or application"
  source_stated_remedies:
    - "work in colour paper rather than paint"
    - "assemble a paper collection from waste strips, packing papers and magazine cutouts rather than prepared sets"
  examples: {positive: []}
  intra_source_relations:
