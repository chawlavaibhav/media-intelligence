- sk_id: sk_alb_c003_0005
  source_id: albers_interaction_of_color_ch1_5
  source_terms:
    - "the more the letters are differentiated from each other, the easier is the reading"
    - "words consisting of only capital letters present the most difficult reading -- because of their equal height, equal volume, and, with most, their equal width"
  concept_label: differentiation_between_letters_aids_reading_and_capitals_hinder_it
  label_origin: extractor_assigned
  claim: >
    The more letters are differentiated from one another, the easier reading becomes. Words set
    entirely in capitals are hardest to read, because of their equal height, equal volume and, in
    most cases, equal width. Sans-serif faces give an uneasier read than serif faces in text, and
    the source holds the fashionable preference for sans-serif in text to show neither historical
    nor practical competence.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Reading works on the whole word's shape, so uniformity of height, volume and width removes the
      differentiating outline the eye uses.
  scope:
    domain_discussed_by_source: [colour_study_and_teaching, typography]
    conditions: "continuous text, not captions"
  caveats:
    - text: "the source gives a historical reason for its judgement on sans-serif: such faces were designed for captions rather than texts, introduced when pictorial reproduction arrived with stone lithography, and produce poor word pictures"
      origin: source_stated
    - text: "attributed to ophthalmology without citation; the page's four-way setting demonstrates the difference but measures nothing"
      origin: extractor_observed
  source_stated_problems:
