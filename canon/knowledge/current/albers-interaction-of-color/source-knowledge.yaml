- sk_id: sk_alb_c003_0016
  source_id: albers_interaction_of_color_ch1_5
  source_terms:
    - "the class is invited to produce similar effects but is not given reasons or favorable conditions"
    - "discovery and invention are the criteria of creativeness"
  concept_label: withhold_the_method_so_the_class_discovers_it
  label_origin: extractor_assigned
  claim: >
    Students are shown challenging examples of surprising colour changes and then invited to produce
    similar effects, but are given neither the reasons nor the favourable conditions. Work therefore
    begins on a trial-and-error basis, which the source holds promotes continuing comparison,
    observation and thinking in situations, and makes the class aware that discovery and invention
    are the criteria of creativeness.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Withholding the explanation forces trial and error, and trial and error is what produces the
      comparison and observation the study is trying to train.
  scope:
    domain_discussed_by_source: [colour_study_and_teaching]
    conditions: "classroom teaching of colour"
  caveats:
