# CANON-003 book 4 — Josef Albers, "Interaction of Color", chapters I-V (PDF pp.29-43)
# Fresh SPEC-03 extraction. No historical Albers material exists in this repository.
# Granularity: CANON-001 V0 rule, unchanged.
# Visual completeness: blocked_visual_validation — the digitisation is greyscale and the subject is
# colour. See visual-evidence-ledger.yaml. Verbatim quotations were confirmed against rendered page
# images, not taken from the OCR layer.
# Section rationale: chapters I-V are a tightly connected span that carries Albers's whole argument
# from premise to method — colour cannot be remembered or named, is never seen in isolation,
# therefore study interaction, therefore work in paper, therefore teach by deception exercises.

