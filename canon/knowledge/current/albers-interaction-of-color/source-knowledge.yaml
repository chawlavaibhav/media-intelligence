- sk_id: sk_alb_c003_0010
  source_id: albers_interaction_of_color_ch1_5
  source_terms:
    - "a discrepancy between physical fact and psychic effect"
  concept_label: the_water_pots_show_perception_diverging_from_physical_fact
  label_origin: extractor_assigned
  claim: >
    Three bowls of water — warm, lukewarm, cold — demonstrate the gap between physical fact and
    perception. Hands dipped into the outer bowls feel warm on the left and cold on the right; moved
    into the middle bowl they feel the temperatures reversed, cold on the left and warm on the right,
    though the water is neither, being lukewarm. The source calls this a haptic illusion and states
    that optical illusions deceive in much the same way, leading us to see and read other colours
    than those physically present.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A perceived quality is read relative to what preceded it rather than absolutely, so the same
      physical state yields opposite perceptions depending on context.
  scope:
    domain_discussed_by_source: [colour_study_and_teaching]
    conditions: "offered as an analogy for optical perception of colour"
  caveats:
