  source_id: albers_interaction_of_color_ch1_5
  source_terms:
    - "If one says \"Red\" (the name of a color) and there are 50 people listening, it can be expected that there will be 50 reds in their minds."
  concept_label: a_colour_name_produces_as_many_colours_as_listeners
  label_origin: extractor_assigned
  claim: >
    Naming a colour to fifty listeners produces fifty different colours in their minds, and all of
    them very different. Even naming a colour everyone has seen innumerable times — the red of
    Coca-Cola signs, the same red across the country — still produces many different reds. Given
    hundreds of red samples to choose from, listeners select quite different colours, and none can
    be sure of having found the precise shade.
