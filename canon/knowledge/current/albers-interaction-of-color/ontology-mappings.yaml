# CANON-003 book 4 — Albers, Interaction of Color ch.I-V. SPEC-05 ontology, source-local.
source_id: albers_interaction_of_color_ch1_5
extraction_date: 2026-08-24

terms:
- term_id: t_alb_c003_0001
  term: relativity_of_color
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: property
  definition_in_origin_frame: >
    The property that a colour's appearance depends on what surrounds it rather than on the pigment
    alone. The source states it as "color is the most relative medium in art".
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter IV"}
  arising_from: [sk_alb_c003_0011]

- term_id: t_alb_c003_0002
  term: influencing_color
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: entity
  definition_in_origin_frame: >
    The colour that changes the appearance of another — in the basic exercise, the large ground.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter IV"}
  arising_from: [sk_alb_c003_0013]

- term_id: t_alb_c003_0003
  term: influenced_color
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: entity
  definition_in_origin_frame: >
    The colour whose appearance is changed — in the basic exercise, the small rectangle placed on the
    ground.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter IV"}
  arising_from: [sk_alb_c003_0013]

- term_id: t_alb_c003_0004
  term: word_picture
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: property
  definition_in_origin_frame: >
    The whole shape of a word as the eye takes it in, which the source says is what is actually read
    rather than the individual letters.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter II"}
  arising_from: [sk_alb_c003_0004]

- term_id: t_alb_c003_0005
  term: haptic_illusion
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: property
  definition_in_origin_frame: >
    A discrepancy between physical fact and psychic effect arising in the sense of touch — the source's
    water-pot demonstration, offered as the model for optical illusion.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "chapter IV"}
  arising_from: [sk_alb_c003_0010]

- term_id: t_alb_c003_0006
  term: inadequate_color_nomenclature
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: problem
  definition_in_origin_frame: >
    There being innumerable colours and very few names for them, so that a name cannot specify a
    colour.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter I"}
  arising_from: [sk_alb_c003_0003]

- term_id: t_alb_c003_0007
  term: poor_visual_memory_for_color
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: problem
  definition_in_origin_frame: >
    The difficulty, which the source says may be an impossibility, of remembering a distinct colour;
    contrasted with auditory memory's ability to repeat a melody heard once or twice.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter I"}
  arising_from: [sk_alb_c003_0002]

- term_id: t_alb_c003_0008
  term: annulled_illusion_from_tiling
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: problem
  definition_in_origin_frame: >
    The cancellation of a colour effect when studies are interlocked in a tile pattern, caused by
    simultaneous influence from too many directions and an unfavourable distribution of area between
    influencing and influenced colour.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter IV"}
  arising_from: [sk_alb_c003_0015]

- term_id: t_alb_c003_0009
  term: unreadable_all_capital_setting
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: problem
  definition_in_origin_frame: >
    Text set entirely in capitals, which the source says presents the most difficult reading because
    of equal height, equal volume and mostly equal width.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter II"}
  arising_from: [sk_alb_c003_0005]

- term_id: t_alb_c003_0010
  term: place_equal_pieces_on_differing_grounds
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: remedy
  definition_in_origin_frame: >
    Place two small rectangles of the same colour and size on large grounds of very different colour,
    so that the identical pieces appear unlike each other.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit, deterministic_composite]
  source_ref: {locator: "chapter IV"}
  arising_from: [sk_alb_c003_0012]

- term_id: t_alb_c003_0011
  term: show_studies_separately_in_pairs
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: remedy
  definition_in_origin_frame: >
    Present colour studies separately in pairs rather than interlocked in a tile pattern, so their
    effects do not cancel one another.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit, deterministic_composite]
  source_ref: {locator: "chapter IV"}
  arising_from: [sk_alb_c003_0015]

- term_id: t_alb_c003_0012
  term: enlarge_the_ground_relative_to_the_piece
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: remedy
  definition_in_origin_frame: >
    Avoid small pieces on small grounds; keep the influencing area large relative to the influenced
    one, or the effect is disguised.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit, deterministic_composite]
  source_ref: {locator: "chapter IV"}
  arising_from: [sk_alb_c003_0015]

- term_id: t_alb_c003_0013
  term: work_in_colour_paper_rather_than_paint
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: remedy
  definition_in_origin_frame: >
    Use colour paper so that precisely the same colour can be repeated without change in tone, light
    or surface quality, and so that many colours can be compared side by side.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "chapter III"}
  arising_from: [sk_alb_c003_0009]

- term_id: t_alb_c003_0014
  term: withhold_the_reasons_and_let_the_class_discover
  origin: source
  origin_ref: albers_interaction_of_color_ch1_5
  kind: remedy
  definition_in_origin_frame: >
    Show the effect, give neither reasons nor favourable conditions, and let students find them by
    trial and error.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "chapter IV"}
  arising_from: [sk_alb_c003_0016]

relationships:
- from: t_alb_c003_0002
  to: t_alb_c003_0003
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    The source draws this distinction explicitly and it is the working distinction of the whole
    chapter: one colour exerts change, the other accepts it, and the same colour may do either
    depending on the pairing. Recorded because the two terms are otherwise near-identical in wording
    and would invite merging.

- from: t_alb_c003_0006
  to: t_alb_c003_0007
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source gives both as the two answers to what its opening demonstration shows: colour cannot be
    remembered, and colour cannot be named. They are different failures with a common consequence.

- from: t_alb_c003_0008
  to: t_alb_c003_0011
  relation: related_to
  confidence_basis: source_stated
  note: "The layout failure and the presentation remedy the source gives for it."

- from: t_alb_c003_0008
  to: t_alb_c003_0012
  relation: related_to
  confidence_basis: source_stated
  note: "The same failure and its second stated cause, the area ratio."

- from: t_alb_c003_0004
  to: t_alb_c003_0009
  relation: related_to
  confidence_basis: source_stated
  note: >
    All-capital setting is hard to read precisely because it flattens the word picture; the source
    presents the second as a consequence of the first.

- from: t_alb_c003_0005
  to: t_alb_c003_0001
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source moves from the haptic case to the optical one with "in much the same way", offering the
    first as the model for the second. Recorded as related rather than equivalent: one concerns touch
    and the other sight, and the source asserts rather than argues the transfer.

concepts:
- concept_id: sc_alb_c003_interaction_programme
  kind: source_specific_concept
  origin_ref: albers_interaction_of_color_ch1_5
  label: the_study_of_interaction_rather_than_pigment
  children_terms: [t_alb_c003_0001, t_alb_c003_0002, t_alb_c003_0003, t_alb_c003_0013]
  origin: source_stated
  basis: >
    The source names its own object of study — the interaction of colour, seeing what happens between
    colours — distinguishes it from the anatomical dissection of pigments and wavelengths, names the
    two roles colours take in that interaction, and states the material the study requires. The
    grouping is the book's own programme.
  asserts_agreement_between_sources: false

- concept_id: sc_alb_c003_conditions_for_the_effect
  kind: source_specific_concept
  origin_ref: albers_interaction_of_color_ch1_5
  label: conditions_under_which_a_colour_effect_survives_presentation
  children_terms: [t_alb_c003_0008, t_alb_c003_0011, t_alb_c003_0012, t_alb_c003_0010]
  origin: source_stated
  basis: >
    The source states the exercise, states two ways of presenting it that destroy it, and gives the
    reason for each. It treats these as conditions on one procedure rather than as separate advice.
  asserts_agreement_between_sources: false
