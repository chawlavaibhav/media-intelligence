  role: [fills, derives]
  rationale: >
    SPEC-01 carries a continuity_requirements field on the video extension. This source supplies the
    concrete content such a field would hold for a dialogue or attention scene: which sight lines are
    established, which side of the axis coverage sits on, and which looks require a matching reveal.
  applicability:
    when: "a video Creative IR for a scene with two or more subjects attending to one another"
    limits: >
      The source describes physical production with a crew placing a camera. Whether any of these
