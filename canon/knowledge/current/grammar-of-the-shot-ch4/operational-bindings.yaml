- binding_id: bnd_gos_c003_0002
  source_knowledge_refs: [sk_gos_c003_0014, sk_gos_c003_0015]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  role: [diagnoses]
  observation_unit: shot_pair
  rationale: >
    Two further pair-level checks the source makes explicit and demonstrates: whether consecutive
    shots of one subject are too similar in framing, and whether reciprocal coverage of two subjects
    is insufficiently similar. Both are comparisons between two frames, and the source supplies a
    matched and a mismatched example of the second.
  applicability:
    when: "evaluating consecutive coverage shots, or the two halves of a reciprocal pair"
    limits: >
      The 30 degree threshold is hedged in the source and its figure does not establish it as the
      minimum perceptible difference. The matching requirement is explicitly waived where storytelling
      motivates a difference, so neither supports a pass or fail without knowing intent.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_gos_c003_0002, t_gos_c003_0003]
  repair_ontology_refs: [t_gos_c003_0007, t_gos_c003_0008]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_gos_c003_0003
  source_knowledge_refs: [sk_gos_c003_0007, sk_gos_c003_0016]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  role: [diagnoses]
  observation_unit: sequence
  rationale: >
    Screen direction and eye-line match are properties of a run of shots rather than of any pair:
    a subject's established direction of travel persists across an arbitrary number of intervening
    shots until something on screen shows it change, and a look set up in one shot may be paid off
    later. Checking either requires the sequence.
  applicability:
    when: "evaluating a sequence in which a subject moves directionally or attends to something off-frame"
    limits: >
      The source states the direction holds until a change is shown on screen, so an evaluator must
      be able to recognise that change or it will report false failures.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_gos_c003_0004, t_gos_c003_0005]
  repair_ontology_refs: [t_gos_c003_0009, t_gos_c003_0010]
  status: proposed
  status_reason: "not reviewed"

