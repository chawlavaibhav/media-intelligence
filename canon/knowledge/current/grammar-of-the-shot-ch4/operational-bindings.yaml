- binding_id: bnd_gos_c003_0001
  source_knowledge_refs: [sk_gos_c003_0012]
  source_system_refs: [scs_gos_c003_002]
  target_type: evaluation
  target_path: null
  role: [diagnoses]
  observation_unit: shot_pair
  rationale: >
    The clearest available case of a defect with no within-frame signature. The source states the
    error is not apparent until shots are edited together, and the figure shows the erroneous frame
    is an unremarkable image on its own. Any evaluator scoring frames independently will pass a
    scene containing it.
  applicability:
    when: "evaluating consecutive shots of a scene where subject attention or direction is established"
    limits: >
      Requires both shots together and the knowledge of which side the line was established on. The
      source treats deliberate crossing as legitimate, so a detection is a flag for review rather
      than a fault.
  evidence_basis: derived_from_source
  empirical_refs: []
