- binding_id: bnd_gos_c003_0007
  source_knowledge_refs: [sk_gos_c003_0012, sk_gos_c003_0015]
  source_system_refs: [scs_gos_c003_002]
  target_type: benchmark
  target_path: null
  role: [derives]
  rationale: >
    Two candidate stimuli in which the defect is a relation between frames rather than a property of
    one. Figure 4.13 pairs correct and line-crossed coverage of the same scene; Figures 4.19 and 4.20
    pair matched and mismatched over-the-shoulder framing of the same two performers. Both are useful
    for testing whether an instrument can detect a between-shot defect at all.
  applicability:
    when: "constructing stimuli to test whether an evaluator can detect defects that no single frame contains"
    limits: >
      Candidate stimuli, not instruments, and not usable as-is. The expected readings are the
      authors' assertions, not measured viewer responses, and must be independently validated before
      an evaluator's answer can be scored against them — the same condition the Controller set for
      the CANON-001 and CANON-002 stimuli. The line-crossing figures are line drawings rather than
      photographs, so they are cleaner than real footage and correspondingly less representative.
  evidence_basis: derived_from_source
  empirical_refs: []
