  target_schema_version: v0.1
  role: [derives]
  rationale: >
    The source gives a containment hierarchy — shot inside scene inside act inside picture — and a
    conventional progression from wider to tighter framing as a scene develops. Both bear on how a
    temporal structure is laid out and what each beat is expected to contain.
  applicability:
    when: "specifying beat structure for a multi-shot video"
    limits: >
      The outside-in progression is attributed by the source to tradition and hedged; it is a
      convention worth recording, not a requirement.
