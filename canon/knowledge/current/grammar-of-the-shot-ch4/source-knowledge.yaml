    section: "Continuity of Screen Direction"
    page_start: 97
    page_end: 99
    figure_refs: [vis_gos_screen_direction]
    source_support: text_and_visual
    inspected: {text: true, figures: [vis_gos_screen_direction]}

- sk_id: sk_gos_c003_0008
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "lines of direction, which are also called sight lines"
    - "The child looks after a lost balloon—the dog looks at the burglar—the hungry man looks at the pie in the baker's window"
  concept_label: attention_between_subjects_creates_a_sight_line
  label_origin: extractor_assigned
  claim: >
    Screen direction is not carried only by large physical movement. Wherever a subject directs
    attention at another subject or object, a line of direction — a sight line — is created, and the
    audience uses these connections between people, and between people and objects, to establish
    spatial relationships within the film's space.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The audience is described as keen to observe attention and as actively wanting to follow lines
      of attention, so the connections are sought rather than merely noticed.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "any shot in which a subject attends to something"
  caveats:
    - text: "the three demonstrations are unrelated in content — a child and a balloon, a dog and an intruder, a man and a pie — which shows the structure recurring independently of subject matter"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
