- sk_id: sk_gos_c003_0006
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "the filmmakers have a responsibility to the audience to present a knowable world that conforms to some constant, physical world rules such as up, down, left, right, near, far"
  concept_label: the_film_world_must_obey_constant_physical_rules
  label_origin: extractor_assigned
  claim: >
    The audience assumes a larger film world beyond the four edges of the frame, and filmmakers are
    obliged to present that world as conforming to constant physical rules of direction and distance
    so the audience is not spatially confused.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The screen is the audience's single window onto the film's world, and a film can be shot
      anywhere in any direction, so consistency on screen is the only thing making the world knowable.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "any motion picture presenting a continuous space"
  caveats:
    - text: "stated as a responsibility to the audience, which makes it a normative claim rather than a perceptual one"
      origin: extractor_observed
  source_stated_problems:
    - "they do not get confused spatially"
  source_stated_remedies: []
  examples: {positive: []}
  intra_source_relations:
    - {relation: generalises, target: sk_gos_c003_0007, note: "the rule for left and right follows from the general obligation"}
    - {relation: generalises, target: sk_gos_c003_0010, note: "so does the 180 degree rule"}
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
