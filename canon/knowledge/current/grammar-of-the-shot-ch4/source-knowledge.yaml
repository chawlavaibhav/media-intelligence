- sk_id: sk_gos_c003_0005
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "The top, bottom, left, and right edges of the frame therefore become references of direction for the audience."
    - "the camera occupies the \"fourth wall\""
  concept_label: frame_edges_become_the_audiences_directional_reference
  label_origin: extractor_assigned
  claim: >
    The four edges of the frame become the audience's references of direction. A character looks off
    frame left; a car exits frame right. Viewers tie the directional attention of characters and the
    movement of subjects to those edges.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The camera occupies the fourth wall, giving the audience a privileged and fixed vantage on the
      film's space, so the frame's edges serve as the stable reference against which direction is read.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "any framed motion image"
  caveats:
