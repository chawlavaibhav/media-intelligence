- sk_id: sk_gos_c003_0014
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "you should ideally move the camera at least 30 degrees around the semicircle before you begin to frame up a new shot of the same subject"
    - "a jump cut—two shots with similar framing of the same object cut together causing a visual jump in either space or time"
  concept_label: move_the_camera_at_least_thirty_degrees_between_shots_of_one_subject
  label_origin: extractor_assigned
  claim: >
    Within the 180 degree arc, the camera should be moved at least 30 degrees before framing a new
    shot of the same subject. Below that the perspective is not considered different enough, and
    cutting two similarly framed shots of the same object together produces a jump cut — a visual
    jump in space or time.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Each shot is supposed to show the audience new information, so two coverage shots too similar
      to one another fail that purpose and read as a jump rather than as a cut.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "successive coverage shots of the same subject within the arc"
  caveats:
    - text: "the authors hedge with ideally and at least, giving a floor rather than a value"
      origin: source_stated
    - text: "the figure shows five views at 30 degree intervals and demonstrates that they differ; it does not show a smaller interval, so it does not establish that 30 degrees is the threshold at which difference appears"
      origin: extractor_observed
  source_stated_problems:
    - "a jump cut"
  source_stated_remedies:
    - "move the camera at least 30 degrees around the arc before framing a new shot of the same subject"
    - "change the focal length so no two coverage shots seem to come from the same angle on action"
  examples:
    positive:
      - {description: "the arc divided into 30 degree slices, and the same subjects photographed from five successive slices", figure_ref: vis_gos_30_degree}
  intra_source_relations:
    - {relation: depends_on, target: sk_gos_c003_0010, note: "operates inside the established arc"}
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, argued, mechanism_given]
    source_uncertainty: source_hedges
    extraction_uncertainty: none
  provenance:
