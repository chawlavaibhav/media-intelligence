- sk_id: sk_gos_c003_0016
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "eye-line match"
    - "Eye-line match is a \"setup and then payoff\" scenario maker."
  concept_label: eye_line_match_pays_off_a_look_with_a_correspondingly_angled_reveal
  label_origin: extractor_assigned
  claim: >
    When a character isolated in frame directs attention outside its edges, the audience traces a
    line from their eyes to that edge and the filmmaker is then obliged to show what they are
    looking at. The revealing shot must be taken from a direction, angle and height closely matching
    the observing character's vantage. It need not be a direct point-of-view shot, but it must
    respect the established eye-line. The first shot sets up an expectation; the second fulfils it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Framing the second shot from a corresponding vantage is what produces the illusion of
      connection, so the audience feels they are seeing what the character sees.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "a framed character attending to something off-screen"
  caveats:
    - text: "the authors state the filmmaker is most often obliged to show the object, leaving the obligation defeasible"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
    - "reveal the object of interest from a vantage matching the observing character's direction, angle and height"
  examples:
    positive:
      - {description: "a subject looking off-frame, followed by the object revealed from a correspondingly subjective viewpoint", figure_ref: vis_gos_eyeline_match}
  intra_source_relations:
    - {relation: specialises, target: sk_gos_c003_0008, note: "an applied use of the sight line across a cut"}
  evidence:
