- sk_id: sk_gos_c003_0010
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "Your camera must now operate within that 180 degree arc when you set up for your new camera angles and coverage shots"
  concept_label: keep_all_camera_setups_within_one_180_degree_arc
  label_origin: extractor_assigned
  claim: >
    Once the action line is established it cuts the circle of possible camera positions into two
    halves. All subsequent camera setups for that scene must stay within the same 180 degree arc on
    one side of the line.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The first shot fixes which side is frame left and which frame right, and fixes the directions
      of attention across the film space; staying on one side of the line preserves both.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "coverage of a scene after the first shot has established the line"
  caveats:
    - text: "the permitted region is a definite geometric area shown on an overhead plan, which makes the rule testable rather than a matter of taste"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "set up all coverage cameras within the 180 degree arc on the near side of the established action line"
  examples:
    positive:
      - {description: "overhead plan of the arc, paired with the frames each permitted position produces", figure_ref: vis_gos_180_geometry}
  intra_source_relations:
