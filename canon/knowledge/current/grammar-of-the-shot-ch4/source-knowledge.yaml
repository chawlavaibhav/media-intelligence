source_knowledge:

- sk_id: sk_gos_c003_0001
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "shooting for editing"
    - "you make sure that your shots cover all of the action from each angle required so that when it comes time to edit the individual shots together, there is enough visual material to show the entire story from the preferred positions of coverage"
  concept_label: shoot_coverage_so_the_edit_has_enough_material
  label_origin: extractor_assigned
  claim: >
    During production the action must be recorded from every angle the edit will require, so that
    the whole story can later be assembled from the preferred positions. Recording a variety of shot
    types gives the editor more choices about when the audience receives fresh information.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A cut to a new shot type is what delivers new information, so the range of shot types recorded
      sets the range of moments at which the editor can deliver it.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "any project whose material will be edited"
  caveats:
    - text: "the authors frame the whole chapter as prethinking the edit, describing it as requiring a degree of psychic ability on the part of the production team"
      origin: source_stated
    - text: "the goal is stated as recording as few takes as possible while still getting the needed coverage, so coverage is bounded by time and money rather than maximised"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
    - "cover the main action from several angles and with several different framings"
  examples:
    positive: []
  intra_source_relations:
    - {relation: generalises, target: sk_gos_c003_0004, note: "continuity discipline is what makes coverage cuttable"}
  evidence:
    characteristics: [explicitly_stated, repeated_within_source, argued, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: "Four — Putting Your Shots Together"
    section: "opening question and answer"
    page_start: 93
    page_end: 94
    figure_refs: []
    source_support: text
    inspected: {text: true, figures: []}

