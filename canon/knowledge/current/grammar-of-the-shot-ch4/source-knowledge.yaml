- sk_id: sk_gos_c003_0007
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "screen direction—the left or right movement of a subject—must be maintained from one shot to the next"
    - "if a person walks out of frame left ... in this new shot they would have to be entering from frame right in order to maintain that direction of leftward movement"
  concept_label: screen_direction_must_be_maintained_across_a_cut
  label_origin: extractor_assigned
  claim: >
    A subject's left or right movement must be maintained from one shot to the next. A person who
    exits frame left must enter the following shot from frame right, because within the film's space
    their leftward journey is understood to continue until something on screen shows it change.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The audience assumes movement continues in its established direction, so the entry edge of the
      next shot must be the one consistent with that continued travel.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "a subject moving left or right across consecutive shots"
  caveats:
    - text: "the rule holds until a change of movement is shown on screen, so it governs the unseen interval rather than the whole film"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
    - "have the subject enter the new shot from the edge opposite the one they exited"
  examples:
    positive:
      - {description: "three-state sequence: exit frame left, held empty frame, entry from frame right", figure_ref: vis_gos_screen_direction}
  intra_source_relations:
    - {relation: specialises, target: sk_gos_c003_0006, note: "the concrete rule derived from the general obligation"}
    - {relation: depends_on, target: sk_gos_c003_0005, note: "defined relative to the frame edges"}
    - {relation: contradicts, target: sk_gos_c003_0012, note: "jumping the line is the failure of this rule"}
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, argued, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
