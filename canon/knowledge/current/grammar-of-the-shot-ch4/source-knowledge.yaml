    page_start: 106
    page_end: 107
    figure_refs: [vis_gos_30_degree]
    source_support: text_and_visual
    inspected: {text: true, figures: [vis_gos_30_degree]}

- sk_id: sk_gos_c003_0015
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "matching shots or reciprocating imagery"
    - "Whenever you shoot one type of shot to cover one character in a scene you should create the exact same corresponding frame for the other character"
  concept_label: reciprocating_imagery_match_coverage_between_characters
  label_origin: extractor_assigned
  claim: >
    Coverage shot for one character must be matched by an equivalent frame for the other: the same
    shot size, and matched camera height, lens angle and angle on action, taken from the
    corresponding position on the opposite end of the arc. The editor should be given equal numbers
    of shots and matching framing for each character.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Matching lets the editor progress along shot size from one character to the next; the arc
      geometry is what makes the reciprocal position calculable, since a setup at 45 degrees on one
      side has a counterpart at 45 degrees on the other.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "multi-character scenes covered in singles or over-the-shoulder shots"
  caveats:
    - text: "the authors allow for differences forced by actual subject size, hairstyle, hat or other accessories, and note not every aspect may match exactly once storytelling needs are taken into account"
      origin: source_stated
    - text: "an over-the-shoulder mismatch is said to cause an unfavourable audience reaction, perhaps only at a subconscious level — a claim about viewer response that the figures cannot evidence"
      origin: extractor_observed
  source_stated_problems:
    - "the mismatch will cause your audience, perhaps just on a subconscious level, to have an unfavorable reaction to the scene"
    - "providing an editor with an MCU of one character but only a BCU of the other may cause issues during the edit"
  source_stated_remedies:
    - "shoot the corresponding frame for the other character from the mirrored position on the arc"
    - "keep camera height and lens focal length the same between reciprocal setups"
  examples:
    positive:
      - {description: "matched over-the-shoulder frames with comparable foreground and subject size", figure_ref: vis_gos_ots_match_mismatch}
      - {description: "matched medium close-ups from mirrored 45 degree positions", figure_ref: vis_gos_matching_shot_types}
    counter:
      - {description: "mismatched over-the-shoulder frames, foreground shoulder much larger in one and the subject smaller and at a different height", figure_ref: vis_gos_ots_match_mismatch}
  intra_source_relations:
    - {relation: depends_on, target: sk_gos_c003_0010, note: "reciprocal positions are computed on the arc"}
    - {relation: qualified_by, target: sk_gos_c003_0013, note: "deliberate mismatch is permitted for storytelling reasons"}
