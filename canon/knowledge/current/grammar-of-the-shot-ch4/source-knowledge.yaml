- sk_id: sk_gos_c003_0003
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "Production can span days, weeks, or months of real time, but the resulting images, when edited together, need to appear as though they were all captured at the same exact time with fluid movement and matching actions."
  concept_label: separately_recorded_material_must_read_as_one_continuous_event
  label_origin: extractor_assigned
  claim: >
    Material recorded across days, weeks or months must, once assembled, appear to have been
    captured at one moment, with fluid movement and matching action. Consistency across separate
    recording occasions is therefore a production requirement rather than an editing convenience.
