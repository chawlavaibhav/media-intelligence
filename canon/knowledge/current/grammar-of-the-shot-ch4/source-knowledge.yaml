- sk_id: sk_gos_c003_0012
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "To \"jump the line\" or \"cross the line\" means that you placed the camera on the opposite side of the action line"
    - "the real mistake is not apparent until the three shots are edited together"
    - "most filmmakers do not notice it until they get into the editing process"
  concept_label: jumping_the_line_is_invisible_within_any_single_shot
  label_origin: extractor_assigned
  claim: >
    Placing the camera on the far side of the action line reverses the established left and right
    and inverts the film space for the viewer. The resulting shot is perfectly good in itself: the
    mistake becomes apparent only once the shots are edited together, at which point both characters
    appear to look the same way rather than at each other.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Crossing the line reverses the directions established for the film space, so the cut yields
      two characters whose attention no longer points at one another.
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "coverage shot from the far side of an established action line"
  caveats:
    - text: "the authors state most filmmakers do not notice this until the edit, which asserts the defect is not merely invisible in a frame but reliably missed on set"
      origin: source_stated
    - text: "the figure makes the property directly legible: the erroneous close-up is an unremarkable image, and the fault exists only in its relation to the preceding shot"
      origin: extractor_observed
  source_stated_problems:
    - "the cuts make no sense because it now appears that both A and B are sitting in the same fashion looking off frame right"
    - "inverting the film space on the unaware viewer"
  source_stated_remedies: []
  examples:
    positive:
      - {description: "three camera plans paired with their frames, the third marked WRONG SIDE OF LINE", figure_ref: vis_gos_jumping_the_line}
  intra_source_relations:
