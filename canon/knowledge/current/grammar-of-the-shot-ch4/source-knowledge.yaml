- sk_id: sk_gos_c003_0013
  source_id: grammar_of_the_shot_ch4_continuity
  source_terms:
    - "Crossing the line is acceptable under certain circumstances"
    - "there are very few absolutes when it comes to the guidelines and \"rules\" presented in this text"
    - "if you have creative reasons to execute a certain shot or group of shots a certain way, then do it, even if it flies in the face of convention"
  concept_label: the_chapters_rules_are_defeasible_by_creative_intent
  label_origin: extractor_assigned
  claim: >
    Crossing the line is acceptable in certain circumstances — the authors give a couple dancing
    cheek to cheek, where the axis runs through both faces so that seeing both requires crossing it.
    More broadly the authors state there are very few absolutes among the guidelines in the text, and
    that a creative reason is sufficient warrant to depart from convention.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [motion_picture_production]
    conditions: "any of the chapter's guidelines"
  caveats:
