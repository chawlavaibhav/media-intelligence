- sk_id: sk_disc_0039
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Present your work quickly and efficiently"
    - "it's as if we're trying to avoid the potential for questions"
    - "focus your presentation on what isn't obvious or can't be seen easily"
  concept_label: withholding_rationale_during_presentation_makes_the_analysis_better_not_worse
  label_origin: extractor_assigned
  claim: >
    The source inverts the natural instinct to explain everything before being judged. Walk the
    group through the specific aspect to be discussed, give only enough explanation for them to
    understand how the design is intended to work, and do not attempt to justify every decision;
    let the rationale emerge through the questions participants ask. Two mechanisms are given.
    Pre-empting every question means participants are bombarded and can become overwhelmed, and
    the authors read the over-explanation as an attempt to foreclose questioning. And when the
    details arrive in response to questions, they are "more closely tied to participant's insights
    and questions" — the explanation lands where someone actually needed it, when they needed it.
    A second rule of selection accompanies this: focus on what cannot be seen, typically by
    presenting from the perspective of a user, since participants do not need to be told that the
    navigation is at the top of the page. If the pace ran too fast, the source's remedy is simply
    to say so and invite questions.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Information supplied before it is wanted competes with the analysis for attention and closes
      the openings through which the group would have engaged. Information supplied in answer to a
      question is already attached to a specific line of thinking, so it is retained and used.
