- sk_id: sk_disc_0048
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Laddering"
    - "the repeated asking of the question 'Why?'"
    - "Can you tell me a bit more about what aspects of the design aren't working?"
    - "Why is/are the aspect(s) she is reacting to terrible? How does that relate to the objectives of the design itself?"
  concept_label: repeated_questioning_converts_a_reaction_into_either_a_finding_or_a_disclosed_preference
  label_origin: extractor_assigned
  claim: >
    The source's general instrument for handling badly formed feedback is repeated, progressively
    specific questioning — laddering, borrowed from design research, where each answer is met with
    a form of "Why?" until a logical stopping point is reached. Two things make this more than a
    platitude. First, the authors state the two possible terminations and treat both as successes:
    either the questioning uncovers what the person is trying to communicate in a way that ties
    back to the product's objectives, or it leads the person to realise their feedback rests on
    personal preference and motivation, in which case "it should be left alone and the
    conversation can move on." A test that can return either answer is a test. Second, the
    sequence for a reaction is ordered: first make it specific — get the person to name which
    aspects they are responding to, which also lets you discover that they are reacting to
    something outside the session's scope — and only then ask why that aspect fails and how that
    relates to the objectives. The authors add a wording constraint they treat as decisive: a bare
    "Why?" can be heard as aggressive or accusatory and the effect compounds with repetition, so
    the whys should be worded as invitations to keep sharing. They also supply a stopping rule:
    where someone is unresponsive to attempts at clarification or grows no less difficult as the
    conversation proceeds, thank them and move on, take note of the interaction, and in some cases
    exclude them from future critiques.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A reaction is produced by a fast process before analysis has run; questions force the slower
      process to engage on the same object. Because the questions are progressively specific, the
      chain either terminates on an objective — at which point the statement has acquired the two
      elements it was missing — or fails to, which is itself the diagnosis.
  scope:
    domain_discussed_by_source: [critique_sessions, unsolicited_feedback, client_and_stakeholder_review]
    conditions: "feedback arriving as a reaction, a preference, or an unexplained verdict"
  caveats:
