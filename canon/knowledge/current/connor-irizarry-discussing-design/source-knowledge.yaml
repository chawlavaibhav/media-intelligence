- sk_id: sk_disc_0005
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Critique is a form of analysis that uses critical thinking to determine whether a design is expected to achieve its desired objectives (and adhere to any pertinent best practices or heuristics)"
    - "Critical thinking is the process of taking a statement and determining if it is true or false"
  concept_label: critique_is_analysis_of_a_design_against_its_stated_objectives
  label_origin: source_verbatim
  claim: >
    Critique is defined as the third form of feedback: analysis, using critical thinking, of
    whether what has been designed is expected to achieve the objectives set for it, and whether
    it adheres to any pertinent best practices or heuristics. The authors are explicit about what
    it is not — "Critique isn't about that instant reaction we might feel when seeing something,
    or about how we would change someone's design to better solve an issue." The objectives it is
    judged against may be of three kinds: about utility (giving someone the ability to complete a
    task), about metrics (increasing conversions on a call to action), or experiential (making
    someone feel excited or surprised).
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Judgement is made checkable by binding it to something outside the judge. The objective is
      the external referent; without one, an assessment reports only the assessor. With one, the
      assessment becomes a proposition another person can examine, agree with, or refute.
  scope:
    domain_discussed_by_source: [design_team_conversation, interface_and_product_design, any_deliberate_making]
    conditions: "work made in pursuit of objectives that the group has agreed and can state"
  caveats:
    - text: "the definition is load-bearing on the objectives actually existing and being shared; the source devotes a chapter to the fact that they usually do not (see sk_disc_0022)"
      origin: extractor_observed
    - text: "experiential objectives are admitted alongside metric ones, so this is not a claim that only measurable objectives count"
      origin: source_stated
    - text: "'best practices or heuristics' is admitted as a second legitimate yardstick alongside project objectives, which widens the definition beyond what a team has explicitly agreed"
      origin: source_stated
  source_stated_problems:
    - "the practice of real critique has become a lost skill"
  source_stated_remedies:
    - "we should be working to understand whether we believe that what has been designed will work to achieve those objectives"
  examples:
    positive:
      - description: "'If the objective is for users to seriously consider the impact to their bank balance before making a purchase, placing the balance at the bottom of the screen at the same size as all the other numbers isn't effective because it gets lost in all of the other information' — the source's own worked example, decomposed in the prose into its three parts"
        figure_ref: "Figure 1-5"
    counter: []
  intra_source_relations:
    - {relation: member_of_system, target: scs_disc_001}
    - {relation: depends_on, target: sk_disc_0006, note: "the three elements are what a critique must contain"}
    - {relation: depends_on, target: sk_disc_0022, note: "it presupposes a shared foundation of objectives"}
