- sk_id: sk_disc_0008
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Recipient"
    - "Giver"
    - "Intent initiates conversation and is often what separates successful critiques and feedback discussions from problematic ones"
  concept_label: intent_on_both_sides_is_what_separates_useful_from_harmful_critique
  label_origin: extractor_assigned
  claim: >
    The source names two roles — Recipient and Giver — and holds that the quality of a critique is
    determined before anything is said, by the intent each party arrives with. Receiving with the
    appropriate intent is "wanting to understand whether the elements of the design will work
    toward the established objectives for the product". Giving with the appropriate intent is
    "wanting to help the designer understand the effect that elements of the design will have on
    the product's ability to achieve its objectives". The authors' summary formulation is that
    intent is either self-focused — ulterior motives or personal agendas — or product-focused, and
    that a wrong intent on either side is sufficient to spoil the exchange.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Intent determines what a participant is looking for, and therefore what they will notice and
      say. A giver who wants to be seen as clever will look for faults to display; a recipient who
      wants praise will hear analysis as attack. The technique in the rest of the book operates on
      the surface of the conversation and cannot correct a misaligned purpose underneath it.
  scope:
    domain_discussed_by_source: [design_team_conversation, client_and_stakeholder_review]
    conditions: "both parties present and participating in a feedback exchange"
  caveats:
    - text: "intent is not directly observable, and the source offers no cue for reading it other than watching how someone responds to questions over time (see sk_disc_0048)"
      origin: extractor_observed
    - text: "the authors are careful that misaligned intent is often not malicious — 'some individuals might simply be unaware of their tone, or they have difficulty forming their feedback in a way that is useful'"
      origin: source_stated
  source_stated_problems:
    - "critique with the wrong or inappropriate intent on either side can lead to problems not only in our designs, but also in our ability to work with our teammates"
  source_stated_remedies:
    - "prior to beginning a critique, whether you're the giver or receiver, it's best to ensure that you're going in with the right intent"
  examples:
    positive: []
    counter: []
  intra_source_relations:
    - {relation: qualifies, target: sk_disc_0009, note: "selfish critique is the giver-side failure of intent"}
    - {relation: qualifies, target: sk_disc_0016, note: "the three anti-patterns are the recipient-side failures of intent"}
