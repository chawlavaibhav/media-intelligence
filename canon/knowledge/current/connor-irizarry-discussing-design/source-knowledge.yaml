- sk_id: sk_disc_0051
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "The sandwich method"
    - "the positive comments are superficial and or vague"
    - "Don't worry about the 'sandwich'. Be honest with the recipient. Balance the conversation."
  concept_label: the_authors_position_on_the_feedback_sandwich_keep_the_balance_drop_the_device
  label_origin: extractor_assigned
  claim: >
    The source states the sandwich method — positive, then negative, then positive — describes the
    rationale offered for it, and then declines it while keeping the practice underneath. Three
    objections are given. In practice the positive comments are superficial or vague, about a
    quality unrelated to what is being discussed or about no strength at all, and most people see
    through them; the opening praise then does little more than signal that something bad is
    coming. Because more cognitive energy and attention goes to processing negative situations
    than positive ones, the initial positives are forgotten as soon as the negative arrives. And
    for some recipients the whole device feels manipulative. What the authors keep is the balance:
    discussing strengths and weaknesses is important, and starting on a positive note can help set
    tone — but "most important though, is that the positive comments be about real strengths in
    the design", aspects thought about critically and believed to be effective and important to
    the objectives, "not just things we came up with at the spur of the moment to make a weakness
    we want to point out easier to handle."
