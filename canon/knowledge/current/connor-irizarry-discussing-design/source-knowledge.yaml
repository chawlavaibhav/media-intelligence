- sk_id: sk_disc_0046
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "reorganizing the notes and framing insights as actions"
    - "Relevancy… Immediacy… Amount of agreement… Source of the feedback"
    - "As Adam says, this is completely unscientific."
    - "just because something is said in a critique does not mean that something will change in the design as a result of it"
  concept_label: turning_findings_into_work_and_deciding_what_will_not_be_done
  label_origin: extractor_assigned
  claim: >
    The source gives a four-step procedure for acting on what a critique produced, and is unusually
    candid about its status. Fix trivial defects first — typos, copy-paste errors, small alignment
    issues. Reframe the notes as actions, converting a finding into an exploration: "The news feed
    is too prominent, because…" becomes "Explore options for decreasing the prominence of the
    newsfeed…". Order the list loosely by four considerations: relevancy, meaning how many of the
    product's scenarios, personas, goals and principles the feedback bears on; immediacy, from the
    project plan; amount of agreement, where more people sharing a perspective raises priority;
    and source, where a subject-matter expert's relevance can shift it. Then decide which items
    will not be addressed — and, the step the authors emphasise, record why, because the question
    will be asked again later. The parenthetical is theirs and is load-bearing: "(As Adam says,
    this is completely unscientific.)" The reframing step is what preserves the book's central
    distinction into the follow-up: the to-do that leaves the session is an instruction to explore,
    not an instruction to change.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Framing an insight as an exploration keeps the option space open one step longer, which is
      the same reason the session refused to produce a change list. And recording the reason for a
      rejection converts a silent omission into a decision that can be defended or revisited,
      which is what stops the same item returning indefinitely.
  scope:
    domain_discussed_by_source: [post_critique_follow_up]
    conditions: "a designer or design team holding the notes from a completed critique"
  caveats:
    - text: "the authors label the prioritisation unscientific themselves and note it 'changes a little with every project depending on the team, culture, timeline'; it is one person's routine offered as an example, not a method"
      origin: source_stated
    - text: "the third consideration — more agreement means higher priority — is a majority heuristic, and the source offers no protection against it amplifying a shared blind spot"
      origin: extractor_observed
    - text: "the fourth consideration reintroduces the weight of the giver that the 'everyone is equal' rule excluded during collection; the source intends this, and says so, but the two must be read together"
      origin: extractor_observed
  source_stated_problems:
    - "I need to be ready to answer why it wasn't changed when it comes up in future discussions"
  source_stated_remedies:
