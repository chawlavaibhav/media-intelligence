- sk_id: sk_disc_0017
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Return to the foundation"
    - "you might have discovered that members of the team share different views on what the objectives of the product and its design are"
  concept_label: unrelatable_feedback_is_a_test_that_can_fail_upward_into_the_objectives
  label_origin: extractor_assigned
  claim: >
    When a piece of feedback seems out of place, the recipient's move is to try to relate it to the
    previously agreed objectives, if necessary by asking the giver follow-up questions that do the
    relating. The source treats the two outcomes as both informative. If a connection is found,
    the feedback is now understood and usable. If no connection can be found, the authors' reading
    is not that the comment was worthless but that the team may hold different views of what the
    product's objectives are — and they prescribe naming that explicitly and then deciding, on the
    spot, whether to resolve the divergence now or table it. The failure of a judgement to bind to
    the stated objectives is thereby treated as evidence about the objectives, not only about the
    judgement.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
