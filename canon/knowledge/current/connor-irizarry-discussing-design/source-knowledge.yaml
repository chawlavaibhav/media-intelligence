- sk_id: sk_disc_0006
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "It identifies a specific aspect of the idea or a decision in the design being analyzed."
    - "It relates that aspect or decision to an objective or best practice."
    - "It describes how and why the aspect or decision work to support or not support the objective or best practice."
  concept_label: the_three_elements_a_usable_piece_of_feedback_must_contain
  label_origin: source_verbatim
  claim: >
    Good critique is composed of three elements, all three required. It identifies a specific
    aspect of the idea or a decision in the design. It relates that aspect or decision to an
    objective or best practice. And it describes how and why that aspect or decision does or does
    not support that objective or best practice. The source demonstrates the decomposition on its
    own example: the clause naming the objective, the clause naming the design choices, and the
    clause stating that the critic does not believe those choices will be effective and why.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [design_team_conversation, interface_and_product_design]
    conditions: "a statement offered as feedback on a design decision"
  caveats:
