- sk_id: sk_disc_0035
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Avoid problem solving"
    - "the human brain does not consciously think both analytically… and creatively… simultaneously"
    - "you have some folks in the critique who are in a creative mental process, some in an analytical one, some analyzing the new idea, and some in a third process: comprehension"
  concept_label: proposing_a_fix_mid_analysis_fragments_the_group_into_incompatible_mental_processes
  label_origin: extractor_assigned
  claim: >
    The source calls this the hardest of its four rules and gives it the book's most developed
    mechanism. When a participant proposes a solution she has switched from analytical to creative
    thinking; when that happens in a group, the participants scatter across at least four
    simultaneous processes — still analysing the original design, analysing the new idea,
    generating alternatives, and simply trying to comprehend what was just proposed — with
    individuals jumping between them. The authors add a second, purely practical cost: veering
    into problem solving on item two of five means items three to five are never reached. They are
    explicit that the rule cannot be enforced by will — the tendency is instinctual and
    unconscious, "we can't" prevent a room from doing it — so what matters is recognising it and
    knowing the three responses. If someone jumped to a solution without naming the issue, ask
    questions that identify the issue and relate it to the objectives. If the issue is already
    understood and the person is elaborating a solution, get them to hold the idea for a later
    exploration session. And if the whole group is stuck on one problem, or the impact of solving
    it would call the rest of the analysis into question, pause the critique and deliberately
    switch the room to exploration. "What is paramount is to keep everyone in the same mental
    process."
