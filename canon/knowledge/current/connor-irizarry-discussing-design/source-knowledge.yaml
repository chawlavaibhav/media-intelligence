- sk_id: sk_disc_0011
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Preferential"
    - "justified by the giver from purely preferential thinking"
    - "the team begins, consciously or subconsciously, to prioritize that individual's tastes alongside or above project and user goals"
  concept_label: preferential_critique_becomes_structural_when_the_preference_holder_approves
  label_origin: extractor_assigned
  claim: >
    Preferential critique rejects work not because an aspect fails an objective but because it
    does not match what the giver likes. The source's distinctive contribution is not naming the
    failure — that is common — but naming what happens when the preference-holder also holds
    approval authority: the team begins, consciously or subconsciously, to prioritise that
    individual's tastes alongside or above project and user goals, even where the two conflict. A
    single unchallenged preference thereby stops being an isolated bad comment and becomes a
    standing, unwritten criterion the team optimises against.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Approval authority converts a preference into a constraint. Because the team must eventually
      pass the approver, satisfying the approver's taste becomes instrumentally rational even for
      people who know it is not an objective — and because it is never written down, it is never
      subject to the test that written objectives are subject to.
