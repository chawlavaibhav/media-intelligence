    three characteristics: it is held toward the end of a design phase; it includes the goal of
    collecting approval so effort can shift elsewhere; and where approval is not given it focuses
    on identifying the changes needed to obtain it later. Four consequences make it a poor host
    for critique, each with a stated mechanism. Its intended outcome is approval, not iteration.
    Its feedback therefore arrives as a list of required changes — directive feedback by
    construction, since "it isn't ready yet, but if you do these things and show it to us again,
    we'll give you the OK". Its attendees are largely there to ensure their own interests survive
    into the final design rather than to compare the design to its objectives, and the group is
    usually too large for a coherent conversation — Adam reports one with more than seventy
    people, most by phone. And its timing is set by the project plan rather than by when the
    designer needs the analysis. The authors do not say to abolish reviews; they say do not rely
    on them for critique, and critique in the run-up so the review can do its own job.
