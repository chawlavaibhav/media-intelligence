  claim: >
    Asked repeatedly about the common rule forbidding "I like" and "I don't like" in critique, the
    authors agree with its premise — what an individual likes is probably not relevant to whether
    the design is meeting its objectives — and reject the rule anyway. Their reason is a cost the
    ban imposes on the conversation: the phrases are such a natural part of how people speak that
    their use is inevitable, and a speaker who has been forbidden them and slips will apologise,
    become flustered and regroup, "sometimes losing clarity around the point they were trying to
    make and causing some awkwardness in the exchange." The prescribed alternative is not
    correction but continuation: when someone says they like or dislike something, facilitate the
    conversation to establish whether their reasons bear on the objectives.
