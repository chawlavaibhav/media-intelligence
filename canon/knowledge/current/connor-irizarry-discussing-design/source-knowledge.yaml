- sk_id: sk_disc_0004
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Direction-based feedback typically begins with an instruction or suggestion"
    - "If I were to do this…"
    - "getting that approval and creating an effective design are not necessarily the same things"
  concept_label: direction_based_feedback_and_why_a_reason_does_not_repair_it
  label_origin: extractor_assigned
  claim: >
    Direction-based feedback opens with an instruction or suggestion and, in many cases, ends
    there; the giver is communicating their own vision for the work. The source makes a
    distinction that is easy to miss: even when the giver does explain why they are suggesting the
    change, direction is still not critique. The explanation tells you what problem they believe
    exists — "you at least begin to understand the impetus" — but it "still does not help you
    understand how or why the design you have is or is not effective at addressing that problem".
    The authors also separate two outcomes that are commonly conflated: if the director is the
    approver, complying produces approval, and approval is not the same thing as an effective
    design.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A proposed solution encodes a diagnosis without stating it. The recipient receives the
      remedy and must reverse-engineer what was wrong, which means the actual finding — the
      relationship between the existing element and the objective — is never put on the record and
      cannot be checked, disputed, or applied to anything else.
  scope:
    domain_discussed_by_source: [design_team_conversation, stakeholder_and_client_review]
    conditions: "a responder who has their own solution in mind, or who perceives a problem and reaches for a fix"
  caveats:
    - text: "the authors are explicit that the direction itself may be a good idea — 'it's not that the direction itself that is being given is a bad idea, but at this point it's out of place'"
      origin: source_stated
    - text: "the source treats jumping to a solution as instinctive rather than culpable, and returns to that framing repeatedly"
      origin: source_stated
  source_stated_problems:
    - "direction-based feedback without any explanation indicates nothing about the effectiveness of your decisions in meeting the design's objectives"
    - "when left unchecked, this type of feedback leads to problem solving which is counterproductive to the conversation you're trying to have"
  source_stated_remedies:
    - "ask questions that work toward identifying what that issue is and how it relates to the objectives of the design"
  examples:
    positive: []
    counter: []
  intra_source_relations:
    - {relation: member_of_system, target: scs_disc_001}
    - {relation: generalises, target: sk_disc_0035, note: "the rule against problem solving in a session is this failure at group scale"}
    - {relation: qualified_by, target: sk_disc_0052, note: "a delivered alternative design is the extreme form of it"}
