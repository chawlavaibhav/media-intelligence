  concept_label: bounding_what_is_analysed_and_against_what_and_keeping_the_group_in_one_lens
  label_origin: extractor_assigned
  claim: >
    The source defines the scope of a critique as a pair, not a single thing: which components of
    the design will be analysed, and which objectives they will be analysed against. One session
    might critique visual styles against a set of design principles; another a sequence of screens
    against the relevant scenario and goals. Setting the pair does two jobs — it tells
    participants what to expect, and it gives the facilitator a defined place to steer back to
    when the conversation leaves it, with anything outside noted for a separate discussion rather
    than dropped. Four default goals follow from any scope: what is working within it, what is
    not, answers to the designer's specific questions, and any concerns, open questions and
    assumptions. The authors also offer reverse planning as a way to derive the pair: start from
    the actions you want to be able to take after the conversation, ask what questions must be
    answered to take them, and let those questions determine what to present. The same
    narrow-the-frame logic governs their treatment of lens-based analysis: whatever the lens —
