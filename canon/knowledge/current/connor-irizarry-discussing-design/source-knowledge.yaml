    The source lists conditions under which its own recommended collaborative activity should not
    be used, and the reasons transfer beyond the specific method. If the problem has not been
    framed, there is not enough context to guide idea generation and the problem stays too
    nebulous. If it has been framed but the framing has not been shared, understood and agreed,
    the group will spend the session debating the framing instead — and the authors are explicit
