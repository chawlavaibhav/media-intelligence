  label_origin: extractor_assigned
  claim: >
    The source gives design principles a discriminating-power test rather than a content test. A
    good principle is specific, and by virtue of being specific it eliminates more design ideas
    than it retains; principles stated as broad qualities — "fun", "amusing" — fail because every
    member of the team interprets them differently. Chapter 6 states the test in its negative
    form and makes it a diagnostic on the criteria themselves: "when asking whether design options
    adhere to a principle, more often the answer should be 'no'." Principles that never reject
