- sk_id: sk_disc_0036
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "The output of a critique is not a list of specific changes for the designer to go back and make"
    - "the desired output is a set of new observations and understandings about the design and whether it is meeting the objectives set for it"
    - "If a list of changes is coming out of a critique session, problem solving is taking the place of analysis"
  concept_label: the_deliverable_of_a_critique_is_a_set_of_findings_not_a_change_list
  label_origin: source_verbatim
  claim: >
    The fourth rule fixes what a critique produces. Its output is a set of new observations and
    understandings about the design and whether it is meeting its objectives — not a list of
    specific changes. The authors give this a diagnostic edge that makes it checkable after the
    fact: if a change list came out of the session, problem solving displaced analysis inside it.
    Exploration is not cancelled but sequenced — "after a critique should come a period of
    exploration, using the new insights to frame challenges and generate possible solutions" — and
    the reason for the delay is that most insights admit numerous possible responses, so deciding
    during the analysis risks missing stronger ideas or making premature decisions that cause
    problems later. The interval also serves the maker: it gives her time to digest the feedback
    against the goals, principles, scenarios and personas and to follow up on specific points. The
    authors concede small and obvious changes exist, and that the rule "might raise some eyebrows".
    Appendix A puts it most sharply: "Critique is not a list of revisions to be carried out like a
    short-order cook."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A finding constrains the space of acceptable repairs without choosing one; a change list
      chooses one and discards the rest, including options nobody has thought of yet. Because the
      choice is made while the analysis is still incomplete, it is made on less information than
      the same choice would have after.
  scope:
