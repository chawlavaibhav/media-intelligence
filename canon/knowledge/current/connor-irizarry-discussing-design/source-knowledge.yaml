  concept_label: critique_is_not_a_consensus_mechanism_and_both_collaboration_extremes_obstruct_it
  label_origin: extractor_assigned
  claim: >
    The source analyses collaboration into two mechanisms — coordination, the aligning of separate
    work efforts, and consensus — and holds that a team sitting at either extreme will find
    critique hard. A purely coordinated team is siloed and inexperienced at giving or receiving
    perspectives on others' work. A team that acts only on full consensus is obstructed for a
    different and more interesting reason: critique does not produce agreement and is not intended
    to. "In critiques, people will disagree. Individual perspectives will produce different lines
    of thinking, and that's OK." What critique can do, the authors say, is show where partial
    consensus lies and keep the team focused on what matters rather than mired in personal
    preference — but a team that needs unanimity to move will not get it from a critique.
