    enough understanding of what is and is not working, and why, that she can explore alternatives
    or make other adjustments. The authors then draw the boundary that this whole book turns on:
    actionable is not the same as prescriptive. "Critique should not tell the designer how to act
    on something or specifically what changes she should make."
