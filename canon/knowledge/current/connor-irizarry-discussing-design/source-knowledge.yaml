  label_origin: extractor_assigned
  claim: >
    The source prescribes a single designated note-taker recording where everyone in the discussion
    can see what is being captured, and argues against the common practice of individuals taking
    their own notes and sharing them afterwards. The reason is that each person's notes are their
    own interpretation, and merging several interpretations is confusing and time-consuming.
