- sk_id: sk_disc_0054
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Critique the directive feedback"
    - "instead of just comparing the two designs to each other… you can compare them in regard to all of the things that the team had previously agreed were important"
    - "This can be a sign that the goals and principles you set are too broad"
  concept_label: decode_a_proposed_solution_privately_then_compare_both_against_the_foundation
  label_origin: extractor_assigned
  claim: >
    The source gives a two-stage procedure for recovering the diagnosis hidden inside directive
    feedback. First, alone and in private notes, ask five questions of the proposal: how it differs
    and what specific changes are proposed; why they might be proposed and what problems the person
    is trying to solve; whether you tried to solve those same problems and how your solution
    differs; if you did not, whether that was deliberate or an oversight; and what the proposed
    changes indicate is of primary importance to them. Second, meet and critique together — asking
    about the differences, about the problems being solved, about what in your design they think
    insufficient, and, the move most often skipped, about what they did not change and whether
    they kept it for the same reasons you made it. The pivot of the whole procedure is the
    comparison target: rather than comparing the two designs to each other, compare both against
    what the team previously agreed mattered, which "helps remove some of the my-idea-versus-your-idea
    atmosphere". The intended output is a critique of your own original design, constructed using
    the critic's proposal as a discussion tool. And the source supplies a diagnostic that runs the
    other way: if, in the middle of this, the goals and principles turn out not to help, that is
    evidence the goals and principles are too broad — "when asking whether design options adhere
    to a principle, more often the answer should be 'no'" — and if a goal cannot be meaningfully
    measured to determine whether it has been achieved, it needs refining. Where no foundation
