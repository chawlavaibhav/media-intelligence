  label_origin: extractor_assigned
  claim: >
    Incomplete critique states an outcome or a reaction without the "why" behind it: "I think the
    button is better than the link", "Nobody is going to click that", "This is terrible". The
    source's repair is to attach the reason — "Nobody is going to click on that because the
