- sk_id: sk_disc_0003
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "reaction-based feedback tends to be emotional or visceral"
    - "it's a gut reaction"
    - "That's wonderful! Great work!"
  concept_label: reaction_based_feedback_and_why_it_cannot_direct_a_revision
  label_origin: extractor_assigned
  claim: >
    Reaction-based feedback is fast, instinctive and driven by the responder's own expectations,
    desires and values. The source names a second variety that is often missed: a reaction driven
    not by the work at all but by the responder's sense of what they are expected to say — "That's
    wonderful! Great work!" — which is a response to having been asked, not to what was made. The
    authors' test for why reaction fails is a set of questions the reaction cannot answer: is the
    responder representative of the actual audience; are they looking at it as a user would; and
    does the reaction divulge anything specific about any design decision or its effectiveness.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A reaction is a report about the responder's state, produced before the slower analytical
      process has run. It therefore contains no reference to any element of the work and no
      reference to any objective, which are the two things needed to locate a change.
  scope:
    domain_discussed_by_source: [design_team_conversation, social_media_responses_to_products]
    conditions: "an immediate response given on first exposure to a design"
  caveats:
    - text: "the authors state that reactions are 'something we do want to understand when designing a product or service' — it is not ideal to sell something users cringe at; the defect is in using a reaction as iteration guidance, not in noticing it"
      origin: source_stated
    - text: "the second variety — the culturally-expected compliment — is the more dangerous one for a judgement pipeline, because it is indistinguishable in form from a genuine positive finding; the source names it but gives no cue for telling them apart at the moment it is uttered"
      origin: extractor_observed
  source_stated_problems:
    - "the reaction might be based upon the personal biases and preferences of the individual who is reacting"
    - "the reaction itself isn't in regard to what's being presented; rather, it's in response to simply being asked for feedback in the first place"
  source_stated_remedies:
    - "ask questions that push him to examine not only his reaction, but also the creation you're asking them to analyze"
  examples:
    positive: []
    counter:
      - description: "'Well… it's better than peanut butter and salami!' — a real reaction the authors witnessed in a meeting, whose meaning the room could not decode until it was unpacked"
        figure_ref: null
  intra_source_relations:
