  label_origin: extractor_assigned
  claim: >
    The source argues for discussing strengths on two grounds that are independent of making
    criticism easier to hear. First, reuse: naming why an aspect works lets the designer abstract
    the concept behind it and apply it to weaker areas of the same design — the authors tie this
    to their view that design proceeds by deconstructing, abstracting and recombining ideas.
