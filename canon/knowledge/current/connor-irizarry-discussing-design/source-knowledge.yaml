- sk_id: sk_disc_0038
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Avoid 'Ta-da' moments"
    - "Critical thought takes a little bit of time"
    - "limit what you send to only the relevant aspects of the design you plan to discuss"
  concept_label: first_exposure_can_only_produce_reactions_so_send_the_material_in_advance
  label_origin: extractor_assigned
  claim: >
    The source holds that unveiling work for the first time in the session guarantees reactive
    feedback, because most attendees are seeing it for the first time and can only react. Its
    stated reason is temporal: critical thought takes time — people need to think through the
    design, determine the effects they believe it will have, and compare those effects to the
    objectives — and a room asked to do that on the spot will supply responses it has not thought
    through. The prescription is to send the designs a couple of days ahead, with two
    qualifications the authors are specific about: send only the aspects that will be discussed,
    because sending more invites participants to fixate on irrelevant parts; and preface them with
    a few clear notes on the focus and what is expected. The authors state explicitly that the
    goal is not to have participants arrive with finished feedback but to jump-start the critical
    thinking process before the conversation begins. They answer the standard objection — that
    pre-sending produces a flood of emailed change lists — by conceding it happens (it happened to
    Adam on the example email they reproduce), and prescribing a specific handling: acknowledge
    the feedback, say it will be addressed in the session, and at the session revisit it and ask
    whether it still holds now that more of the design has been discussed. Where nothing could be
    sent, the fallback is to pace the opening more slowly and start with small, discrete aspects.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Analysis has a latency. Compressing the interval between first exposure and required response
      to zero forces the response to come from the fast, reactive process, which is precisely the
      form of feedback the book is trying to displace. Moving the exposure earlier restores the
      interval without lengthening the meeting.
