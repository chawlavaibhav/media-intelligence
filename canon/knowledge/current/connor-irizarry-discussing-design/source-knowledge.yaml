  claim: >
    The source applies its own test symmetrically and says so twice. A positive reaction is subject
    to exactly the same defect as a negative one: it does not say what aspect of the work is
    responsible or how that aspect relates to an objective, so it cannot guide an iteration. The
    authors add a reason positive feedback is systematically less trustworthy than it feels —
    people often offer it because they do not want to hurt someone's feelings, not because they
    think the work is heading in the right direction. The prescribed handling is identical to the
    handling of a negative reaction: thank the person, make sure you understand what is being
    communicated, review it against the known objectives, and follow up with questions — what do
    they love about it, why, and how does it apply to the goals, personas, scenarios and
