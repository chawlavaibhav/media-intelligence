- sk_id: sk_disc_0047
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "the authority you hold as a facilitator is only as strong as your personality and overall social presence"
    - "The true owners of the room are the participants of the session"
    - "it allows time to be the authority in the room, which you the facilitator are simply enforcing"
  concept_label: a_facilitators_authority_is_borrowed_and_should_be_vested_in_artifacts
  label_origin: extractor_assigned
  claim: >
    In a signed sidebar, Brad Nunnally argues that taking the facilitator role confers no real
    authority: it is only as strong as the facilitator's personality and social presence, and the
    participants own the room. His account is of losing it in a single exchange — asking a group
    to put laptops away, being met with "Good luck with that!", and then making a joke about
    having no authority, after which everyone declined and the following rounds of critique were
    shallow enough that the session produced no consensus on direction or priority. The lesson he
    draws is to become a group leader rather than an authority figure, and the mechanism he offers
    is to vest authority in external artifacts rather than in the person: an outline and agenda,
    shared in advance, which set the tone and establish "a social contract between you, the
    facilitator, and the group of participants"; and a timetable reviewed with the group at the
    start, which makes time the authority that the facilitator merely enforces. "The more external
    artifacts that you can use as sources of authority, the easier it is for you to manage the
    flow of the conversation."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
