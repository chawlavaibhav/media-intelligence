- sk_id: sk_disc_0026
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "If you don't have anything nice to say, don't say anything at all"
    - "participants might think that people who tend to refrain from sharing disagreement in groups are in agreement"
  concept_label: cultural_norms_bias_both_what_is_said_and_how_silence_is_read
  label_origin: extractor_assigned
  claim: >
    The source names a bias that operates on the supply of judgement itself and a matching error in
    reading it. On the supply side: people raised to withhold anything not nice hold back honest
    critique they fear will upset the recipient, or worse, validate a direction they do not
    believe in. On the reading side: in cultures where challenging or speaking up is seen as rude,
    silence is not agreement, and participants who assume it is will record a consensus that does
    not exist; conversely, participants used to straightforwardness can be misread as combative.
    Adam's own account is of a project with a team from India where he repeatedly discovered
    afterwards that the alignment he thought he had seen in meetings was not there, and that where
    he thought there had been disagreement there had been none. The prescription is to state
    before the session that stepping outside these norms is acceptable, and to identify and
    clarify such gaps as soon as they are noticed.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Norms about politeness govern whether a judgement is uttered at all, so the set of judgements
      a session collects is filtered before any facilitation technique can act on it. And because
      the filter is invisible, the absence of an objection is systematically misread as its
      absence in the person's mind.
