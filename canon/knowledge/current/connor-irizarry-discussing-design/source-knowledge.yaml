- sk_id: sk_disc_0055
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Explain your work, do not defend it"
    - "In a productive critique environment, our work is not under attack, it is being analyzed collectively"
    - "This is a self-focused approach to critique and to design"
  concept_label: explaining_and_defending_are_different_acts_and_only_one_serves_the_analysis
  label_origin: source_verbatim
  claim: >
    Appendix A names getting defensive as a bad habit and draws the distinction the rest of the
    book leaves implicit: explain your work, do not defend it. The authors' analysis of what
    defensiveness costs is directional — focusing on defending the work, or on what others will
    think of you if there are imperfections, "takes the focus off the product and places it
    squarely on us", which they classify as a self-focused approach to critique and to design.
    They treat imperfections as guaranteed ("which there always will be"), so the choice is not
    whether faults exist but whether attention goes to the artifact or the person. The prescribed
    remedy is a reminder rather than a technique: that the team is working together to analyse and
    improve the work, which they say makes explaining decisions and gathering feedback easier. It
    is the same separation the book applies to the recipient elsewhere — critique is not about
    personal judgement, it is about analysis and improvement.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Explaining supplies the group with the reasoning it needs in order to analyse; defending
      seeks to end the analysis. The two look similar from outside — both are the maker talking
      about her decisions — but they have opposite aims, and only the first adds anything the group
      can use.
  scope:
    domain_discussed_by_source: [group_critique_sessions]
    conditions: "the maker is present while her decisions are being analysed"
  caveats:
    - text: "Appendix A is a reference list of ten habits, most of which restate earlier chapters; this object records the one formulation that appears nowhere else in the book"
      origin: extractor_observed
    - text: "the source offers no cue for telling explanation from defence in the moment, and the distinction is one of intent, which it elsewhere concedes is hard to read"
      origin: extractor_observed
  source_stated_problems:
    - "by focusing on defending our work or worrying about what we think others will think of us… we take the focus off the product and place it squarely on us"
  source_stated_remedies:
    - "if we commit to reminding ourselves that we are working together as a team to analyze and improve them, it makes it easier explain our design decisions and gather feedback"
