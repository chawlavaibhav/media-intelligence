    not match their understanding at the moment it is written. The stakes are stated plainly —
    discussions go deep or broad enough that people forget what was said, and forgotten feedback
    that would have been valuable to the iteration costs the session part of its value. The
    authors add a second, separate record kept privately: notes on how people participated, used
    afterwards to see which facilitation techniques worked, who engaged, and who to invite next
    time. That one is explicitly not public, "that would be pretty awkward."
