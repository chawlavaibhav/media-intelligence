      origin: source_stated
    - text: "the illustrative exchange (less blue in the design, because competitors are all blue) resolves onto a differentiation objective; the source does not show a case where laddering fails"
      origin: extractor_observed
    - text: "the authors' teaming language — 'I need your help to better understand' — is offered to defuse a me-versus-you framing, and is a rapport tactic rather than part of the diagnostic"
      origin: source_stated
  source_stated_problems:
    - "he's really only just reacted. His slower, more analytical cognitive processes that facilitate critical thinking haven't taken over yet"
    - "in some situations the simple question of 'Why?' can be seen as interpreted as aggressive or accusatory"
  source_stated_remedies:
