- sk_id: sk_disc_0007
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "the brain operates as a toggle"
    - "creative thinking… and analytical thinking"
    - "critique is an act of reflection"
  concept_label: making_and_judging_are_separate_modes_that_must_be_switched_between
  label_origin: extractor_assigned
  claim: >
    The source's cognitive premise, introduced early and relied on for the rest of the book, is
    that a person designing something toggles between creative thinking — generating or assembling
    ideas — and analytical thinking — determining whether what exists so far is in line with what
    is being aimed at. Experienced practitioners, the authors say, have learned to be deliberate
    about when they make that switch, periodically pausing creative work to step back and critique
    what they have. The corollary the authors draw is that an individual can and should critique
    alone, and that the switch is a controllable skill improved by exercise.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The authors state that the brain does not consciously think analytically and creatively at
      the same time; multitasking forces it to divide resources between the two processes and
      actively switch between them. Deliberate control of the switch is therefore what makes
      analysis possible at all, and losing control of it is what makes group analysis fragment.
  scope:
    domain_discussed_by_source: [individual_design_work, group_critique_sessions]
    conditions: "any activity that alternates between producing something and assessing it"
  caveats:
    - text: "this is a claim about human cognition presented without citation, measurement or reference to any research; it is the load-bearing premise for the rule against problem solving and should be treated as the authors' working model, not as an established finding"
      origin: extractor_observed
    - text: "the source's own hedge is that keeping the brain from bouncing back and forth 'can take a lot of practice and skill'"
      origin: source_stated
  source_stated_problems:
    - "It happens so frequently that we often aren't even aware it's happening"
  source_stated_remedies:
    - "periodically pausing their creative work to take a step back and critique what they have so far"
  examples:
    positive: []
    counter: []
  intra_source_relations:
    - {relation: generalises, target: sk_disc_0035, note: "the rule against problem solving in a group is this premise applied to many brains at once"}
    - {relation: generalises, target: sk_disc_0030, note: "the same premise explains why analysis suppresses idea generation in a brainstorm"}
    - {relation: demonstrated_together_with, target: sk_disc_0018, note: "the recipient critiquing their own work is an exercise of the toggle"}
