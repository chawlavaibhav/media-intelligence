  label_origin: extractor_assigned
  claim: >
    The source frames this as a constraint problem rather than a kindness problem: "we don't want
    to hold back our comments. We need to be truthful. But we also need to show tact." Three moves
    are prescribed. Get them talking — about the design, the objectives, and the elements meant to
    achieve them — because people who freeze on receiving feedback tend to relax as they describe
    their work, and in describing it they begin analysing it, becoming a critic rather than only a
    recipient, which the authors say makes them more receptive. Keep the language on the design
    rather than the designer, which the authors admit is genuinely hard: a critique needs the
    reasoning behind the decisions, and questions about reasoning are questions about a person, so
    the more the questions seem to be about the designer the more a sensitive recipient hears the
    feedback as about them. And name the iterative frame explicitly — say you are curious what
    comes back next time, and if you have critiqued their work before, point to how it has
    improved across iterations.
