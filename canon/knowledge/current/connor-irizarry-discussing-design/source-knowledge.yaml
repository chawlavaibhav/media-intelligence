- sk_id: sk_disc_0019
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "great critiques are often more about questions asked than statements made"
    - "individuals must do so based on assumptions that they haven't yet been able to validate or eliminate"
  concept_label: critique_is_dialogue_and_asynchronous_channels_degrade_it_by_stranding_assumptions
  label_origin: extractor_assigned
  claim: >
    The source holds that productive critiques contain more questions than statements, for a
    stated reason: questions let assumptions be validated, eliminated or examined collaboratively,
    so the resulting feedback rests on a mutually understood foundation rather than on each
    person's private interpretation. It adds a second use for the recipient — the questions asked
    are themselves evidence of which parts of the design are unclear. From this the authors derive
    a channel argument. Email and comment tools are held to be poor conduits not because they are
    informal but because they are not real-time: a commenter must commit to an assumption they
    have had no opportunity to test. The authors do not forbid these channels; where there is no
    alternative they prescribe being specific about what feedback is wanted, stating the
    objectives in the request, allowing as much back-and-forth as possible, and — the operative
    instruction — writing any assumption down explicitly so the recipient can confirm or correct it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A judgement is only as good as the premises behind it, and in a live exchange a wrong premise
      is cheap to discover and correct. Latency makes that correction expensive, so commenters
      either guess or say nothing, and the recipient cannot tell which of the two happened. Making
      the assumption explicit restores the checkability that the channel removed.
  scope:
    domain_discussed_by_source: [design_team_conversation, email_and_design_commenting_tools]
    conditions: "feedback collected from more than one person, especially where the maker cannot answer immediately"
  caveats:
