- sk_id: sk_disc_0002
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "There are three forms of feedback"
    - "reaction, direction, and critique"
  concept_label: feedback_has_three_forms_only_one_of_which_is_analysis
  label_origin: source_verbatim
  claim: >
    The source's central move is to split "feedback" into exactly three forms — reaction,
    direction and critique — and to hold that they differ in kind, not in politeness or quality.
    Reaction reports how the responder felt. Direction reports what the responder would do
    instead. Only critique reports whether a specific decision serves a stated objective, and why.
    The authors' position is that reaction and direction "are limited in their ability to help us
    understand if the design choices we've made might work toward the product's objectives",
    and that critique "is feedback that focuses on exactly that understanding".
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The three forms are distinguished by what they are about. A reaction is about the responder's
      state; a direction is about the responder's preferred solution; a critique is about the
      relationship between an element of the work and an objective. Only the third contains the
      information needed to decide what to change next, because only the third names the objective
      that the change would be serving.
  scope:
    domain_discussed_by_source: [design_team_conversation, feedback_on_work_in_progress]
    conditions: "responses to work that was made in pursuit of objectives that can be stated"
  caveats:
    - text: "the authors do not claim reaction and direction are worthless — a reaction tells you something about a subconscious response, and a direction may reveal the giver's unstated concern; the claim is that neither on its own supports iteration"
      origin: source_stated
    - text: "the taxonomy is asserted, not derived from observation of a sample; no evidence is offered that these three are exhaustive"
      origin: extractor_observed
  source_stated_problems:
    - "the lines have become blurred in relation to feedback, critique, and how we communicate while working together"
  source_stated_remedies:
    - "understanding these three kinds of feedback can help us understand the conversations we have with our teams"
  examples:
    positive: []
    counter: []
  intra_source_relations:
    - {relation: member_of_system, target: scs_disc_001}
    - {relation: specialises, target: sk_disc_0003, note: "reaction is the first form"}
    - {relation: specialises, target: sk_disc_0004, note: "direction is the second form"}
    - {relation: specialises, target: sk_disc_0005, note: "critique is the third form"}
