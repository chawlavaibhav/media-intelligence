# CANON-003 book 17 (Lane D) — "Art & Fear", printed pp.1-21. SPEC-05 ontology, source-local.
# Existing term kinds and relation types only.
#
# Same `executable_by` situation as book 16, and for the same reason: every remedy here is
# something a person does about their own practice — share work in progress, leave a loose end,
# notice how the material responds. None of the four substantive values in SPEC-05 fits, so the
# honest value is `unknown`. See Lane D issue D-01, now observed in two books.

source_id: bayles_orland_art_and_fear_part_one_opening
extraction_date: 2026-08-24

terms:
- term_id: t_af_c003_0001
  term: quitting
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: problem
  definition_in_origin_frame: >
    Not starting again. The source separates it sharply from stopping: stopping happens all the
    time and is part of the normal cycle, quitting happens once and ends the practice.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "printed p.10"}
  arising_from: [sk_af_c003_0010, sk_af_c003_0012]

- term_id: t_af_c003_0002
  term: stopping
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: property
  definition_in_origin_frame: >
    Running an idea to the point of diminishing returns and setting it down. Normal, recurring and
    healthy in the source's account, and the signal to begin cultivating the next idea.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "printed p.10"}
  arising_from: [sk_af_c003_0012]

- term_id: t_af_c003_0003
  term: loss_of_the_destination_for_the_work
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: problem
  definition_in_origin_frame: >
    The place the work belongs — an audience, an exhibition, a critique — being withdrawn. The
    source names it as one of the two moments at which makers quit, and says it perversely tends to
    arrive at the moment the goal is reached.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed pp.10-11"}
  arising_from: [sk_af_c003_0011, sk_af_c003_0013]

- term_id: t_af_c003_0004
  term: graduation_as_terminal_show
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: problem
  definition_in_origin_frame: >
    The institutional case of destination loss: when the critique has been the only validated
    destination for a maker's work, leaving the programme removes it, and the source says the
    absence of any continuing support afterwards is what actually ends practices.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed pp.11-12"}
  arising_from: [sk_af_c003_0014]

- term_id: t_af_c003_0005
  term: operating_manual_for_not_quitting
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: remedy
  definition_in_origin_frame: >
    Two steps. Make friends with others who make art and share in-progress work with each other
    frequently; then learn to treat that group, rather than the major institution, as the
    destination of your work.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "printed pp.12-13"}
  arising_from: [sk_af_c003_0015]
  executable_by: [unknown]

- term_id: t_af_c003_0006
  term: leave_a_loose_thread
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: remedy
  definition_in_origin_frame: >
    Leave an unresolved issue in each finished piece to carry forward into the next, and hold the
    seed of the next larger destination while pursuing the current one, so that arriving does not
    leave you with nowhere to go.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed p.11"}
  arising_from: [sk_af_c003_0013]
  executable_by: [unknown]

- term_id: t_af_c003_0007
  term: fear_disguised_as_laziness
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: problem
  definition_in_origin_frame: >
    Fear presenting as something else: laziness, resistance to deadlines, irritation with materials
    or surroundings, distraction over the achievements of others — anything that keeps the maker
    from giving the work their best effort.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed p.14"}
  arising_from: [sk_af_c003_0017]

- term_id: t_af_c003_0008
  term: artist_equals_self
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: problem
  definition_in_origin_frame: >
    The modern equation of the work with the maker's identity, which the source calls a recent idea
    and a vicious spiral: flawed work makes you a flawed person, and no work makes you no person.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed p.7"}
  arising_from: [sk_af_c003_0009, sk_af_c003_0016]

- term_id: t_af_c003_0009
  term: accept_many_paths_to_making
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: remedy
  definition_in_origin_frame: >
    Sidestep the identity spiral by accepting that there are many legitimate ways of working —
    reclusive to flamboyant, intuitive to intellectual, folk art to fine art — rather than one
    correct artistic identity.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed p.7"}
  arising_from: [sk_af_c003_0009]
  executable_by: [unknown]

- term_id: t_af_c003_0010
  term: the_talent_view
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: problem
  definition_in_origin_frame: >
    The prevailing belief that art rests fundamentally on talent, a gift randomly built into some
    people and not others. The source rejects it as fatalistic and useless to a working maker,
    explicitly without arguing whether it is true.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed p.2"}
  arising_from: [sk_af_c003_0003]

- term_id: t_af_c003_0011
  term: vision_ahead_of_execution
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: property
  definition_in_origin_frame: >
    The permanent condition in which the maker can conceive more than they can currently produce.
    The source states it never changes and should not — one of its three named inevitabilities.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed pp.14-15"}
  arising_from: [sk_af_c003_0018]

- term_id: t_af_c003_0012
  term: undisciplined_imagination
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: problem
  definition_in_origin_frame: >
    Approaching the work believing your materials more malleable, your ideas more compelling and
    your execution more refined than they are. The source names it as the commoner obstacle to
    correspondence between the imagined and the made, ahead of undisciplined execution.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "printed p.17"}
  arising_from: [sk_af_c003_0021]

- term_id: t_af_c003_0013
  term: progression_of_decreasing_possibilities
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: property
  definition_in_origin_frame: >
    The making of a piece as a sequence in which each executed decision converts one possibility
    into a reality and removes the rest, until the work could not be other than it is.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "printed pp.15-16"}
  arising_from: [sk_af_c003_0019]

- term_id: t_af_c003_0014
  term: notice_how_the_material_responds
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: remedy
  definition_in_origin_frame: >
    Get the knowledge needed to fit intention to material by attending to what actually happens
    while working — how the material responds, and how its response and resistance suggest new
    ideas — rather than from the fantasy the material provoked.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed p.18"}
  arising_from: [sk_af_c003_0022]
  executable_by: [unknown]

- term_id: t_af_c003_0015
  term: tolerance_for_uncertainty
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: property
  definition_in_origin_frame: >
    The capacity to work without knowing the outcome. The source calls it the prerequisite to
    succeeding, and says people who need certainty are less likely to make risky or spontaneous
    work.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "printed p.21"}
  arising_from: [sk_af_c003_0023]

- term_id: t_af_c003_0016
  term: make_a_lot_of_work
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: remedy
  definition_in_origin_frame: >
    Make work you care about and make a great deal of it, on the grounds that the overwhelming
    majority of it exists to teach you how to make the small fraction that succeeds.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed p.6"}
  arising_from: [sk_af_c003_0008]
  executable_by: [unknown]

- term_id: t_af_c003_0017
  term: adopting_the_viewers_attitude
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: problem
  definition_in_origin_frame: >
    The maker judging their own work by what a viewer attends to — the finished product — rather
    than by the process, which the source says is the only thing the maker has privileged access
    to. Described as dangerously easy.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed p.5"}
  arising_from: [sk_af_c003_0006]

- term_id: t_af_c003_0018
  term: romanticising_indifference
  origin: source
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  kind: problem
  definition_in_origin_frame: >
    Reading a lack of response to your work as evidence of seeing further than your audience. The
    source calls this romantic but wrong, and says indifference hardly ever reflects a gulf in
    vision.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "printed p.5"}
  arising_from: [sk_af_c003_0007]

relationships:
- from: t_af_c003_0001
  to: t_af_c003_0002
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    The source makes this separation explicitly and the whole attrition argument rests on it. The
    two are indistinguishable at the moment they happen and differ only in whether anything is
    begun afterwards. Merging them would erase the claim.

- from: t_af_c003_0004
  to: t_af_c003_0003
  relation: narrower_than
  confidence_basis: source_stated
  note: >
    The source names graduation as the student's case of the general condition it has just
    described, so the institutional term is a special case of the general one.

- from: t_af_c003_0012
  to: t_af_c003_0011
  relation: related_to
  confidence_basis: source_stated
  note: >
    The permanent gap between vision and execution is the condition; an undisciplined imagination
    is the source's name for the gap widening because the conception is careless rather than
    because the hand is unskilled.

- from: t_af_c003_0007
  to: t_af_c003_0008
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    The source presents disguised fear and the identity equation in different chapters and never
    links them, but the fear it describes is fear of what the work reveals about the maker, which
    is what the identity equation creates. The connection is ours.

- from: t_af_c003_0018
  to: t_af_c003_0017
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked because both concern the maker's relation to an audience. They are opposite errors:
    one takes the audience's silence as proof of one's own vision, the other takes the audience's
    criteria as one's own. The source warns against each separately.

- from: t_af_c003_0005
  to: t_af_c003_0003
  relation: related_to
  confidence_basis: source_stated
  note: "The two-step procedure and the loss it is offered as the strategy against."

- from: t_af_c003_0006
  to: t_af_c003_0003
  relation: related_to
  confidence_basis: source_stated
  note: >
    Leaving an unresolved thread is the source's structural precaution against the same loss
    arriving at the moment a goal is reached.

- from: t_af_c003_0014
  to: t_af_c003_0012
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Attention to how the material actually behaves is the corrective the source implies for an
    imagination that overrates it. The source places the two in adjacent sections without saying so.

- from: t_af_c003_0010
  to: t_af_c003_0008
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Both locate the source of art in the person rather than in the practice — one as an innate
    gift, the other as an identity. The source attacks them in separate places and does not
    connect them.

concepts:
- concept_id: sc_af_c003_a_few_assumptions
  kind: source_specific_concept
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  label: a_few_assumptions
  children_terms: [t_af_c003_0010, t_af_c003_0008, t_af_c003_0017]
  origin: source_stated
  basis: >
    "A Few Assumptions" is the source's own heading for the premises it adopts, and these terms are
    the named positions it defines them against. The grouping is the book's.
  asserts_agreement_between_sources: false

- concept_id: sc_af_c003_three_inevitabilities
  kind: source_specific_concept
  origin_ref: bayles_orland_art_and_fear_part_one_opening
  label: the_three_inevitabilities
  children_terms: [t_af_c003_0011, t_af_c003_0015]
  origin: source_stated
  basis: >
    The source names vision, uncertainty and knowledge of materials together as inevitabilities all
    artists must acknowledge, then gives each a subsection. Two of the three have terms here; the
    third, knowledge of materials, is carried by the remedy term for noticing how the material
    responds rather than by a property term, because that is the form the source states it in.
  asserts_agreement_between_sources: false

- concept_id: cc_af_c003_practice_ending_conditions
  kind: canonical_concept
  label: conditions_that_end_a_practice
  purpose: retrieval_and_aggregation
  created_by: extractor
  asserts_equivalence: false
  children_terms: [t_af_c003_0001, t_af_c003_0003, t_af_c003_0004, t_af_c003_0007]
  basis: >
    A retrieval grouping, ours, over this source's several accounts of why work stops. It asserts
    no equivalence: an act of not starting again, the withdrawal of an audience, the end of a
    degree programme and fear wearing the costume of laziness are different things that share a
    consequence.
