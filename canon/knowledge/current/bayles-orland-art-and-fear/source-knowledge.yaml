- sk_id: sk_af_c003_0006
  source_id: bayles_orland_art_and_fear_part_one_opening
  source_terms:
    - "MAKING ART AND VIEWING ART ARE DIFFERENT AT THEIR CORE"
    - "To all viewers but yourself, what matters is the product... To you, and you alone, what matters is the process"
  concept_label: assumption_maker_and_viewer_are_evaluating_different_things
  label_origin: extractor_assigned
  claim: >
    The third assumption, and the source's sharpest structural claim. The viewer's object is the
    finished work; the maker's object is the experience of shaping it. Because those are different
    objects, the viewer's concerns are not the maker's concerns, and adopting the viewer's
    attitudes is described as dangerously easy. The source adds that making art gives
    uncomfortably accurate feedback about the gap between what you intended and what you did, and
    that without that feedback making art that matters to you would be impossible.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The maker is the only party with access to the gap between intention and result, so the
      information the work returns to its maker is not available to anyone judging the product.
  scope:
    domain_discussed_by_source: [artmaking, criticism, teaching_art]
    conditions: "any work seen by someone other than its maker"
  caveats:
    - text: "the source states the maker's job is to learn to work on your work, and gives no account of when the viewer's judgement should nonetheless be admitted"
      origin: extractor_observed
    - text: "offered as an assumption under that heading"
      origin: source_stated
