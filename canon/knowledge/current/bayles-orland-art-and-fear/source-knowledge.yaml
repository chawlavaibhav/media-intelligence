- sk_id: sk_af_c003_0022
  source_id: bayles_orland_art_and_fear_part_one_opening
  source_terms:
    - "Materials are like elementary particles: charged, but indifferent"
    - "The knowledge you need to make that fit comes from noticing what really happens as you work"
  concept_label: materials_are_the_reliable_element_and_teach_by_resisting
  label_origin: extractor_assigned
  claim: >
    Materials seduce with potential and also have limits — ink wants to flow but not across any
    surface, clay wants to hold a shape but not any shape — and without the maker's participation
    their potential stays potential. They do exactly what the hands make them do, which is what
    makes them reliable. The knowledge that closes the gap between the contents of the maker's head
    and the qualities of the material comes from noticing what actually happens while working: how
    the material responds, and how that response and resistance suggest new ideas.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because materials are real they are reliable, and because they resist they return information
      the maker's fantasy cannot supply.
  scope:
