- sk_id: sk_af_c003_0023
  source_id: bayles_orland_art_and_fear_part_one_opening
  source_terms:
    - "Art is like beginning a sentence before you know its ending"
    - "tolerance for uncertainty is the prerequisite to succeeding"
  concept_label: uncertainty_is_pervasive_and_tolerance_for_it_is_the_prerequisite
  label_origin: extractor_assigned
  claim: >
    Everything except the materials is uncertain — conditions are never right, knowledge is never
    sufficient, key evidence is missing, support is fickle — and the source states that a finished
    work which looks inevitable may have been seconds from collapse. Control is not the answer:
    people who need certainty are less likely to make work that is risky, subversive, complicated
    or spontaneous. What is needed instead is a broad sense of what you are looking for, some
    strategy for finding it, and a willingness to embrace mistakes and surprises along the way.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The work has to be free to move and so does the maker; detailed advance planning removes the
      room in which the response to the material happens.
  scope:
    domain_discussed_by_source: [artmaking, writing, photography, composition]
    conditions: "work whose outcome cannot be specified in advance"
  caveats:
    - text: "supported by four recounted cases — a photographer destroying all but about ten of a year's hundred-odd pieces, Tolstoy rewriting War & Peace eight times, William Kennedy rewriting a novel eight times, Lincoln doubting himself at Gettysburg — none of them measured or cited"
      origin: extractor_observed
    - text: "the source concedes in passing that beginning before you know the ending is probably a bad idea in public speaking, so the claim is scoped to artmaking by its own admission"
      origin: source_stated
  source_stated_problems:
    - "people who need certainty in their lives are less likely to make art that is risky"
    - "making detailed plot outlines is an exercise in futility"
  source_stated_remedies:
    - "a broad sense of what you are looking for, some strategy for how to find it, and a willingness to embrace mistakes"
  examples:
    positive:
      - {description: "Lawrence Durrell's construction stakes: plant one, run fifty yards ahead and plant another, and the road's direction becomes apparent", figure_ref: null}
      - {description: "E.M. Forster knowing the Malabar Caves would matter in A Passage To India without knowing what would happen there", figure_ref: null}
