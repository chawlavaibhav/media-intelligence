- sk_id: sk_af_c003_0012
  source_id: bayles_orland_art_and_fear_part_one_opening
  source_terms:
    - "Quitting is fundamentally different from stopping"
    - "Quitting means not starting again - and art is all about starting again"
  concept_label: stopping_is_normal_and_recurring_quitting_happens_once
  label_origin: extractor_assigned
  claim: >
    Running an idea until it stops repaying attention is a normal, recurring and healthy part of
    the cycle — the source notes that writers call it the pen running dry and that every medium
    has its equivalent. In the normal cycle that signal means it is time to begin cultivating the
    next idea. The same event becomes quitting only when nothing is begun afterwards: stopping
    happens all the time, quitting happens once.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The two are indistinguishable at the moment they occur; what distinguishes them is whether a
      next piece is started, which is only visible later.
  scope:
    domain_discussed_by_source: [artmaking, writing, painting]
