  label_origin: extractor_assigned
  claim: >
    The source assigns a purpose to unsuccessful work: the great majority of what a maker produces
    exists in order to teach them how to make the small fraction that succeeds. Failed pieces are
    therefore essential rather than wasted, you learn how to make your work by making your work,
    and the practical instruction is to make work you care about and to make a great deal of it.
