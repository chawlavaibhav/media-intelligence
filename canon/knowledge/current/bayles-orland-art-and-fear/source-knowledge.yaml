- sk_id: sk_af_c003_0010
  source_id: bayles_orland_art_and_fear_part_one_opening
  source_terms:
    - "most who began, quit"
    - "those who continue to make art are those who have learned how to continue - or more precisely, have learned how to not quit"
  concept_label: continuing_is_the_skill_that_separates_artists_from_ex_artists
  label_origin: extractor_assigned
  claim: >
    Of those who begin making art, most quit. Those who continue and those who quit share the same
    emotional ground and are, the source says, indistinguishable from outside: everyone meets the
    same universal progression of human troubles, which are routinely survivable in life and
    routinely fatal to the artmaking process. What separates the two groups is having learned how
    not to quit.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
