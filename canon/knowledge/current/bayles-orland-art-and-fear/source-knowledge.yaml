    - "the bison on the wall is someone else's magic"
  concept_label: the_modern_maker_works_without_institutional_support
  label_origin: extractor_assigned
  claim: >
    Earlier makers worked inside institutions that supported the act — the Church, the clan,
    ritual, tradition — and doubted their calling less when working in the service of God than
    in the service of self. Today the work emerges from no secure common ground, so making art
    means working in uncertainty, doing something nobody much cares whether you do, with neither
    audience nor reward guaranteed. Nourishment has to be found inside the work itself.
