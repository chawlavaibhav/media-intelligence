- sk_id: sk_af_c003_0003
  source_id: bayles_orland_art_and_fear_part_one_opening
  source_terms:
    - "This view is inherently fatalistic - even if it's true, it's fatalistic"
    - "offers no useful encouragement to those who would make art"
  concept_label: the_talent_view_is_rejected_for_being_useless_not_for_being_false
  label_origin: extractor_assigned
  claim: >
    The prevailing view that art rests on talent, a gift randomly given to some and not others, is
    rejected — and rejected on explicitly practical grounds. The source states that the view is
    fatalistic whether or not it is true, and that it offers a working artist nothing to act on.
    In its place the source proposes assumptions that put the power, and therefore the
    responsibility, in the maker's own hands.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A belief that locates the cause of your work outside your control cannot guide anything you
      do on a day-to-day basis, which is the only place the work actually happens.
  scope:
    domain_discussed_by_source: [artmaking, teaching_art]
    conditions: "a maker deciding what to believe about their own capacity"
  caveats:
