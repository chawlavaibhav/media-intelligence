# CANON-003 book 17 (Lane D) — David Bayles & Ted Orland, "Art & Fear: Observations on the Perils
# (and Rewards) of Artmaking" (1993; Image Continuum Press printing). Fresh SPEC-03 extraction
# under the frozen CANON-002-era method. V0 granularity rule, unchanged.
# Visual completeness: verified_page_level — the book contains no illustrations at all.
#
# SECTION RATIONALE: printed pages 1-21, which is Part I chapter I ("The Nature of the Problem",
# including the book's own numbered section "A Few Assumptions") plus chapter II ("Art and Fear",
# including its four named subsections Vision & Execution, Imagination, Materials, Uncertainty).
# This is the span in which the book states its premises and builds its central argument; every
# later chapter applies them to a particular fear. The boundaries are the source's own and were
# confirmed independently by the blank versos at PDF pages 20 and 34.
#
# NOTE ON THIS SOURCE'S SHAPE, recorded rather than smoothed over:
# the book states its own foundations as ASSUMPTIONS it has chosen, under that heading, and in one
# passage explicitly declines to argue whether a rival view is true — rejecting it instead because
# believing it is useless to a working artist. Its evidence is assertion plus short anecdotes about
# named artists, and a substantial part of its argument is quoted from other people. There is no
# demonstration, no measurement and no controlled comparison anywhere in the section.

source_id: bayles_orland_art_and_fear_part_one_opening

