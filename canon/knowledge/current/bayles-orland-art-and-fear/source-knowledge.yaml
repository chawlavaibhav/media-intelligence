- sk_id: sk_af_c003_0009
  source_id: bayles_orland_art_and_fear_part_one_opening
  source_terms:
    - "ARTMAKING HAS BEEN AROUND LONGER THAN THE ART ESTABLISHMENT"
    - "if artist equals self, then when (inevitably) you make flawed art, you are a flawed person"
  concept_label: assumption_identity_art_equation_is_recent_and_harmful
  label_origin: extractor_assigned
  claim: >
    The fourth assumption. For most of history the people making art did not think of themselves
    as artists, so equating art with self-expression reflects a contemporary bias rather than a
    property of the medium; even the separation of art from craft is largely post-Renaissance. The
    source then draws the practical consequence it cares about: if artist equals self, flawed work
    makes you a flawed person and no work makes you no person at all. Its remedy is to accept many
    different paths to making rather than one identity.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      When identity is staked on the work, every judgement of the work becomes a judgement of the
      person, which the source calls a vicious spiral.
  scope:
    domain_discussed_by_source: [artmaking, art_history]
    conditions: "a maker whose sense of self is invested in the work"
  caveats:
    - text: "the historical part is asserted, including a speculation that art predates the pronoun 'I'; the source marks that one as presumable"
      origin: source_stated
    - text: "offered as an assumption under that heading"
      origin: source_stated
  source_stated_problems:
    - "the notion that art transcends what you do, and represents what you are"
  source_stated_remedies:
