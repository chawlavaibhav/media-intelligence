# CANON-014 — SPEC-05 ontology for Desai, "Mother Pious Lady". Source-local.
#
# Hindi terms are preserved in the source's own form with the source's own gloss. Where an English
# phrase is NOT an equivalent, that is stated on the term rather than left for a reader to assume.
#
# NO cross_source_concept. Apparent agreements with other candidates — in particular between this
# source's descriptor inflation and another candidate's censorship-driven word substitution — are
# recorded as observations in the CANON-014 lineage matrix and are explicitly NOT merged, because
# the mechanisms run in opposite directions.

source_id: desai_mother_pious_lady
extraction_date: 2026-08-30

terms:

- term_id: t_dmpl_0001
  term: paisa_vasool
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: source_specific_concept
  definition_in_origin_frame: >
    The satisfaction of having extracted the full use-value of a purchase, realised through use over
    time rather than at the price. The source distinguishes it explicitly from miserliness.
    "Value for money" is NOT an equivalent: the author's point is that the value is not settled at
    the price at all.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'The Dhania Factor'"}
  arising_from: [sk_dmpl_0010]

- term_id: t_dmpl_0002
  term: dhania_factor
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's name for the demand for free coriander and green chilli with a vegetable purchase,
    which he argues is invariant to income and is about closing the transaction satisfyingly rather
    than about saving money.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'The Dhania Factor'"}
  arising_from: [sk_dmpl_0011]

- term_id: t_dmpl_0003
  term: theek_daam
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: source_specific_concept
  definition_in_origin_frame: >
    The right or fair price. The source uses it to mark that getting value is ultimately a question
    of fairness — of knowing one has not been taken for a ride — rather than of minimising outlay.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'The Dhania Factor'"}
  arising_from: [sk_dmpl_0011]

- term_id: t_dmpl_0004
  term: chalta_hai
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: source_specific_concept
  definition_in_origin_frame: >
    The disposition to accept the almost-good-enough, which the source says is "widely seen to be
    responsible for many of India's ills" and which he then argues encodes a defensible position
    about the transience of solutions. Recorded as the source's framing of a contested term; this
    record takes no position on it.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'The Power of the Imperfect Solution'"}
  arising_from: [sk_dmpl_0043]

- term_id: t_dmpl_0005
  term: imperfect_solution
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's capitalised term for a temporary equilibrium accepted as such, rather than a final
    resolution. His argument is that holding a solution perfect costs ever-increasing effort until it
    becomes unsustainable. The maintenance-cost part is separable from, and much stronger than, the
    cultural generalisation the essay wraps it in.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'The Power of the Imperfect Solution'"}
  arising_from: [sk_dmpl_0043]

- term_id: t_dmpl_0006
  term: mother_pious_lady
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: source_specific_concept
  definition_in_origin_frame: >
    A stock phrase from Indian matrimonial advertisements, which the source glosses as connoting a
    mother-in-law "concerned more with burning incense sticks than daughters-in-law". The book takes
    its title from it as an instance of a code that says a great deal in three words to a reader who
    holds the convention.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'Mother Pious Lady'"}
  arising_from: [sk_dmpl_0021]

- term_id: t_dmpl_0007
  term: bhp
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: source_specific_concept
  definition_in_origin_frame: >
    "Birth horoscope and photograph" — one of the coded abbreviations of the matrimonial format,
    given by the source as an example of a convention that is transparent to an insider and opaque
    to anyone else.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'Mother Pious Lady'"}
  arising_from: [sk_dmpl_0021]

- term_id: t_dmpl_0008
  term: decent_marriage
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: source_specific_concept
  definition_in_origin_frame: >
    A matrimonial-column phrase the source glosses as signalling openness to dowry. Recorded because
    it is the clearest instance in the book of a code whose surface meaning and conveyed meaning are
    different, which is the property the compression argument rests on.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'Mother Pious Lady'"}
  arising_from: [sk_dmpl_0021]

- term_id: t_dmpl_0009
  term: wheatish
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: source_specific_concept
  definition_in_origin_frame: >
    A matrimonial-column complexion descriptor, used in the source's opening pastiche as a
    disadvantage requiring compensation elsewhere. It sits alongside the "VV Fair" escalation as
    evidence for the source's account of how the format's colour vocabulary works.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'Mother Pious Lady'"}
  arising_from: [sk_dmpl_0022]

- term_id: t_dmpl_0010
  term: raddiwalla
  origin: source
  origin_ref: desai_mother_pious_lady
  kind: entity
  definition_in_origin_frame: >
    The buyer of household scrap who came to every doorstep weekly. The source records selling raddi
    as a skilled activity — negotiating the price and ensuring accurate weighing — and as the final
    stage of a three-stage recycling ladder.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Essay 'The Dhania Factor'"}
  arising_from: [sk_dmpl_0010]

# ── properties and problems ─────────────────────────────────────────────────

- term_id: t_dmpl_0020
  term: use_value_realised_over_time
  origin: extractor
  origin_ref: desai_mother_pious_lady
  kind: property
  definition_in_origin_frame: >
    The property of a purchase whose worth is settled by subsequent use rather than at the
    transaction. Named by the extractor for the mechanism the source states under paisa_vasool.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Essay 'The Dhania Factor'"}
  arising_from: [sk_dmpl_0010]

- term_id: t_dmpl_0031
  term: culturally_bounded_claim_universalised
  origin: extractor
  origin_ref: desai_mother_pious_lady
  kind: problem
  definition_in_origin_frame: >
    Consuming an observation the source scopes to one class, one country and one period as a claim
    about a population. This source is unusually exposed to it, because its most quotable material —
    "the Indian mind", "at its heart, democracy is an impostor in India" — is essayistic
    generalisation the Introduction explicitly disclaims.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Introduction; 'The Power of the Imperfect Solution'"}
  arising_from: [sk_dmpl_0001, sk_dmpl_0043]

- term_id: t_dmpl_0032
  term: surface_change_read_as_model_change
  origin: extractor
  origin_ref: desai_mother_pious_lady
  kind: problem
  definition_in_origin_frame: >
    Inferring that a practice has changed from observed movement in its surface features, when the
    model determining what the practice is for has not moved. The source's instance is thirty years
    of matrimonial advertisements in which the vocabulary changed considerably and caste mention did
    not change at all.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Essay 'Mother Pious Lady'"}
  arising_from: [sk_dmpl_0045, sk_dmpl_0020]

- term_id: t_dmpl_0033
  term: descriptor_saturation
  origin: extractor
  origin_ref: desai_mother_pious_lady
  kind: problem
  definition_in_origin_frame: >
    A descriptor claimed by substantially every item in a category, which therefore excludes nothing
    and conveys nothing, driving escalation or a demand for evidence outside the format. The source's
    instance is "fair" becoming "VV Fair" and the rise of "Photograph (Returnable)".
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Essay 'Mother Pious Lady'"}
  arising_from: [sk_dmpl_0022]

- term_id: t_dmpl_0034
  term: benefit_claim_without_its_enabling_premise
  origin: extractor
  origin_ref: desai_mother_pious_lady
  kind: problem
  definition_in_origin_frame: >
    A benefit proposition offered to an audience that does not hold the premise making the benefit
    meaningful. The source's instance is vehicle safety in a market he says sold no vehicle on it.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Essay 'Indian Traffic as Metaphor'"}
  arising_from: [sk_dmpl_0042]

- term_id: t_dmpl_0035
  term: perceived_attribute_contradicting_the_physical_property
  origin: extractor
  origin_ref: desai_mother_pious_lady
  kind: problem
  definition_in_origin_frame: >
    An attribute confidently attributed to an object on the strength of surrounding imagery, while
    the physical property the attribute names runs the other way. The source's instance is the
    scooter's aura of safety against its smaller, less stable wheels.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Essay 'An Ode to the Scooter'"}
  arising_from: [sk_dmpl_0030]

# ── remedies (each states who or what can execute it) ───────────────────────

- term_id: t_dmpl_0051
  term: carry_the_sources_own_scope_statement_with_the_object
  origin: extractor
  origin_ref: desai_mother_pious_lady
  kind: remedy
  definition_in_origin_frame: >
    Where an object from this source is retrieved, retrieve the source's own scope statement with it,
    so the class, country and period bound travel with the claim.
    EXECUTABLE BY: a retrieval process, if it is built to carry a scope field; otherwise by a human
    curating the retrieved set. NOT executable by a generative model reading the object alone.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Introduction"}
  arising_from: [sk_dmpl_0001]

- term_id: t_dmpl_0052
  term: check_a_descriptor_against_its_whole_category
  origin: extractor
  origin_ref: desai_mother_pious_lady
  kind: remedy
  definition_in_origin_frame: >
    Before treating a claimed attribute as differentiating, check how much of the category claims it.
    EXECUTABLE BY: a deterministic check over a corpus of assets, or by a human reviewing a
    competitive set. It requires the category, not the single asset, so it cannot be executed by
    inspecting one output.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Essay 'Mother Pious Lady'"}
  arising_from: [sk_dmpl_0022]

