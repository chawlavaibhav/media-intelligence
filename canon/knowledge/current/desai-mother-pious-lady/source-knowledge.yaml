- sk_id: sk_dmpl_0022
  source_id: desai_mother_pious_lady
  source_terms:
    - "The language used has its own pitfalls – in a world where everyone is fair and beautiful, we begin to see people being VV Fair or Really Beautiful."
  concept_label: a_descriptor_everyone_claims_inflates_until_it_stops_discriminating
  label_origin: extractor_assigned
  claim: >
    Desai observes that when every advertisement in a format claims the same desirable attribute, the
    attribute stops discriminating and writers escalate — "fair" becomes "VV Fair", "beautiful"
    becomes "Really Beautiful". He notes the same pressure produced the convention of
    "Photograph (Returnable)", because a claim nobody can distinguish creates demand for evidence
    outside the claim.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A descriptor carries information only by excluding something. Universal adoption removes the
      exclusion, so the descriptor conveys nothing and the writer must either intensify it or supply
      evidence the format does not carry.
  scope:
    domain_discussed_by_source: [indian_matrimonial_advertising, compressed_communication]
    conditions: "Indian print matrimonial columns; the author's observation of the corpus he studied"
  caveats:
    - text: "the inflation is observed, not measured; the thirty-year study is reported as finding that fairness claims ROSE, which is consistent with but not the same as demonstrating inflation of the descriptor's meaning"
      origin: extractor_observed
    - text: "do NOT merge this with censorship-driven word substitution recorded elsewhere in the corpus. Here an unbanned descriptor loses force through universal use; there a permitted word ACQUIRES a banned meaning under prohibition. Different mechanisms, opposite directions"
      origin: extractor_observed
  source_stated_problems:
    - "a descriptor everyone claims conveys nothing"
  source_stated_remedies:
    - "intensify the descriptor, or supply evidence outside the format — the author's instance is the returnable photograph"
  examples: {positive: []}
  intra_source_relations:
