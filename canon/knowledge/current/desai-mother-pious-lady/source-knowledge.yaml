- sk_id: sk_dmpl_0021
  source_id: desai_mother_pious_lady
  source_terms:
    - "The matrimonial ad takes twenty-five words to abbreviate a person into marketability and like the thirty-second commercial, makes its user a master of compressing meaning."
    - "A person becomes a bundle of saleable attributes encrypted into matrimonial jargon."
    - "It is a mathematical composition of terse eloquence; it speaks in guttural acronyms and reveals as much in what it is silent on as in what it says."
  concept_label: an_extreme_compression_format_with_a_shared_decoding_convention
  label_origin: extractor_assigned
  claim: >
    Desai reads the matrimonial advertisement as an extreme compression format and draws the
    comparison to advertising himself: twenty-five words abbreviate a person into marketability,
    "like the thirty-second commercial". The format works because writer and reader share a decoding
    convention — VB is very beautiful, BHP is birth horoscope and photograph, "decent marriage"
    signals openness to dowry, "uses contact lens" means thick glasses — and because it signifies as
    much by what it omits as by what it states. He notes that the convention, not the middleman's
    personal guarantee, is what let the format survive the decline of the older system.
  claim_type: source_interpretation
  interpretation_basis: >
    The decoding examples are the author's report of a real convention. The reading of the form as a
    compression technology comparable to a thirty-second commercial, and the argument that shared
    convention is what made it viable, are his interpretation.
  mechanism:
    stated_by_source: true
    text: >
      A shared, stable code lets a very short message carry a long one, because the reader supplies
      the expansion. The code has to be common property; it cannot be invented per message.
  scope:
    domain_discussed_by_source: [indian_matrimonial_advertising, compressed_communication]
    conditions: >
      India, print matrimonial columns, over the study's thirty-year window into the late 2000s.
      Pre-dates the migration of this activity to matrimonial websites, which the book does not cover.
  caveats:
    - text: "the analogy to the thirty-second commercial is the AUTHOR'S, not the extractor's, and is drawn in a single clause without development"
      origin: extractor_observed
    - text: "the source describes a code and its effects; it offers no account of how such a code is established, which is what would be needed to use this as advice"
      origin: extractor_observed
    - text: "this is analysis of an existing form. Turning it into a rule for writing compressed advertising would be converting criticism into production advice, which this record does not do"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - "the opening pastiche: 'status KKB family … throughout convented while being non-manglik … 25/160 … wheatish complexion … BHP'"
  intra_source_relations:
