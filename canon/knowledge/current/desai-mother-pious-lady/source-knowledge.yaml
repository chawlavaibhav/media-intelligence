- sk_id: sk_dmpl_0013
  source_id: desai_mother_pious_lady
  source_terms:
    - "No one grudges the extravagant spending that we lavish on marriages for here the return on money is not economic but social. Families deny themselves the most basic pleasures for years but will spend ruinously on weddings in the family, often ending up in debt."
  concept_label: two_return_currencies_in_one_household_budget
  label_origin: extractor_assigned
  claim: >
    Desai records that the same household which extracts value from every paisa in daily consumption
    will spend ruinously, to the point of debt, on a family wedding — and that this is not a
    contradiction because the return sought there is social rather than economic. Two different
    return currencies operate inside one budget, and the disposition to economise applies only to one
    of them.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Where an outlay buys standing rather than goods, its return is realised in the regard of
      others and is not commensurable with the savings made elsewhere, so the two budgets do not
      compete and no inconsistency is felt.
  scope:
    domain_discussed_by_source: [indian_middle_class_consumption, weddings]
    conditions: "urban middle-class India as described by the author; no period restriction given for this claim"
  caveats:
