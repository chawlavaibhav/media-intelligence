- sk_id: sk_dmpl_0043
  source_id: desai_mother_pious_lady
  source_terms:
    - "It understands that there are no final solutions to problems; at best there is a temporary equilibrium that must eventually get destabilized and give way to a new equilibrium."
    - "keeping a solution perfect will take an ever increasing amount of effort that eventually becomes unsustainable"
  concept_label: the_imperfect_solution_thesis
  label_origin: source_stated
  claim: >
    Desai's most explicitly argued thesis is that the Indian disposition to accept the
    almost-good-enough — usually deplored as *chalta hai* — encodes a defensible position about
    time: that solutions are temporary equilibria, that imperfection is a permanent condition
    conferred by time, and that holding a solution perfect costs ever-increasing effort until it
    becomes unsustainable. He contrasts this with what he characterises as a Western analytical mode
    that reduces a problem to components and freezes it in time, taking the individual as the
    fundamental unit.
  claim_type: source_interpretation
  interpretation_basis: >
    This is a thesis, not an observation. It is argued by assertion and by illustration from Indian
    political leadership, and its central contrast — "the Indian mind" versus "Western analysis" —
    is a pair of essayistic generalisations for which no evidence of any kind is offered.
  mechanism:
