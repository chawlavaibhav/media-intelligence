- sk_id: sk_dmpl_0002
  source_id: desai_mother_pious_lady
  source_terms:
    - "The truth about things is often locked in the smallest actions it engenders. It is what we do without conscious and deliberate thought; it is when we behave naturally and with reflex that we give away who we really are."
    - "we look at India not as an abstract noun but as a verb"
  concept_label: read_culture_from_unconsidered_everyday_acts
  label_origin: extractor_assigned
  claim: >
    Desai's method is to read a culture from its small, unconsidered material acts and objects rather
    than from its stated beliefs, on the grounds that reflexive behaviour reveals more than
    deliberate statement. The book's units are consequently things — a pressure cooker, a scooter, a
    matrimonial advertisement, a nightie, a thali, a postcard — rather than propositions.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Deliberate statement is edited for an audience; reflexive action is not. So what a person does
      without thinking is less filtered evidence about what they hold than what they say they hold.
  scope:
