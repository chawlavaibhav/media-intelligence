- sk_id: sk_dmpl_0040
  source_id: desai_mother_pious_lady
  source_terms:
    - "We need hierarchy because it helps simplify our world by making it deterministic. Science is better than commerce so why tax your mind about what to choose? It standardizes the world on a single linear dimension and helps you know your place without any ambiguity."
    - "The individual and her desires are extracted from the equation; we study what we deserve rather than what we want."
  concept_label: hierarchy_as_a_device_that_removes_choice
  label_origin: extractor_assigned
  claim: >
    Desai argues that the pervasiveness of hierarchy in Indian institutional life functions to
    simplify: it collapses many dimensions onto one linear ordering, which removes ambiguity about
    one's place and removes the individual's preference from the decision entirely — "we study what
    we deserve rather than what we want". His instances are the Science/Commerce/Arts ordering in
    education, which he notes is justified neither by career prospects nor by difficulty, and the
    graded exemptions from airport frisking.
  claim_type: source_interpretation
  interpretation_basis: >
    The instances are observed. The functional explanation — that hierarchy persists because it
    supplies certainty in a world of few choices — is the author's interpretation and is offered
    without evidence that this is why it persists.
  mechanism:
    stated_by_source: true
    text: >
      Collapsing many incommensurable dimensions onto one ordering makes every comparison decidable.
      The cost is that individual preference has no place in the ordering, so it drops out of the
      decision.
  scope:
