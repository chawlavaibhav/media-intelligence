- sk_id: sk_dmpl_0031
  source_id: desai_mother_pious_lady
  source_terms:
    - "Most importantly, the scooter hid the machine from view. Unlike the bike, which revels in displaying its muscular architecture, the scooter covers up the beast within with rotund blandness."
    - "the scooter is middle class and safe because it goes out of its way to advertise its lack of masculine ambition; it wears its unprepossessing modesty on its sleeve, by eschewing any heroics"
  concept_label: concealing_or_displaying_the_mechanism_is_itself_the_signal
  label_origin: extractor_assigned
  claim: >
    Desai's central reading of the scooter is that it signifies by concealment and by refusal: it
    hides its machinery under a rounded shell where the motorcycle displays its architecture, and it
    means what it means precisely by advertising its *lack* of ambition. An object can therefore
    carry meaning by what it declines to claim as much as by what it asserts, and the decision to
    show or hide the mechanism is one of the carriers.
  claim_type: source_interpretation
  interpretation_basis: >
    Entirely the author's reading. The physical facts — the scooter's enclosing bodywork, the
    motorcycle's exposed engine — are uncontroversial; the argument that the enclosure is a social
    signal, and that refusal signifies, is interpretive throughout, and is developed in a sustained
    metaphorical passage ("if the bike is an untamed stallion, the scooter a recalcitrant mule").
  mechanism:
    stated_by_source: true
    text: >
      Where two objects in a category differ in whether they expose their working parts, the
      exposure becomes available as a signifier. Concealment then reads as domestication and display
      reads as potency, independent of the performance either object delivers.
  scope:
