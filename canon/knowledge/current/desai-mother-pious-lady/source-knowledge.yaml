# CANON-014 — Santosh Desai, "Mother Pious Lady: Making Sense of Everyday India"
# (HarperCollins India; this copy's publisher metadata has been OVERWRITTEN by a redistributor —
# see PROVENANCE.md). SPEC-03 extraction.
#
# Epistemic shape, established by reading the book: it is a collection of short interpretive essays
# about the material culture of urban middle-class India, written from inside that class. It is NOT
# a study. Desai states this himself, at length, in the Introduction, and states the limits more
# carefully than most sources in this corpus do:
#
#   * "I am acutely aware that there are many Indias and that the diversity of India cannot be
#     collapsed into a single undifferentiated 'we'."
#   * "since I am writing through the filter of my own experiences, the book carries with it
#     in-built biases."
#   * "I am not here to criticize or commend a class or group … my purpose here is to understand
#     what is happening."
#
# Those self-imposed bounds are extracted as sk_dmpl_0001 and every other object in this file is
# scoped by them. Nothing here is a claim about Indians. Everything here is a claim about what
# Desai argues, about a class he names, in a period he names.
#
# The single genuine measurement in the book — a thirty-year content analysis of matrimonial
# advertisements that Desai says he was involved in — is extracted separately at sk_dmpl_0020 with
# its missing method recorded.
#
# Locators: EPUB, reflowable. No authored page anywhere. Essays have stable titles and are the
# locator. Spine positions are a file aid, not pages.

