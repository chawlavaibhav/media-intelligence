- sk_id: sk_dmpl_0011
  source_id: desai_mother_pious_lady
  source_terms:
    - "Regardless of whether she stays in an affluent neighbourhood or in crowded flats, she must get her dhania and hari mirch free. It has nothing to do with affordability; it is about sneaking in additional value to make the transaction fulfilling."
    - "This ability to see utility in all its dimensions in any object … has perhaps more to do with the ingrained cultural memory of scarcity, than with a real need for economy."
  concept_label: the_free_extra_is_about_completing_the_transaction_not_about_price
  label_origin: extractor_assigned
  claim: >
    Desai's central instance is the free coriander and green chilli demanded when buying vegetables.
    He argues the demand is invariant to income — it is made in affluent neighbourhoods and crowded
    flats alike — and therefore is not about affordability at all but about making the transaction
    feel complete. He attributes the disposition to an ingrained cultural memory of scarcity rather
    than to a present need for economy, and concludes that what matters is not how much is spent but
    how *vasool* the money parted with feels.
  claim_type: source_interpretation
  interpretation_basis: >
    The invariance across income is asserted from observation, not measured. The attribution to a
    cultural memory of scarcity rather than present need is explicitly hedged by the author himself
    ("has perhaps more to do with"), and is his interpretation of a behaviour, not a finding.
  mechanism:
    stated_by_source: true
    text: >
      Where a disposition survives the disappearance of the condition that produced it, its function
      has shifted from economy to the sense of a transaction properly closed. The free extra is the
      marker of closure, so its monetary size is irrelevant.
  scope:
    domain_discussed_by_source: [indian_middle_class_consumption, retail_transactions]
    conditions: >
      Urban middle-class India; the author's observation, undated, and offered against a background
      of rising affluence he places in the 2000s.
  caveats:
    - text: "the author hedges the causal attribution himself with 'perhaps'"
      origin: source_stated
    - text: "the income-invariance claim is the load-bearing one and is entirely unmeasured; it is exactly the kind of claim a survey could test and none is offered"
      origin: extractor_observed
    - text: "this is a claim about a class the author names, in a country he names, in a period he describes. It is NOT a claim about Indian consumers as such, and the source's own Introduction forbids that generalisation"
      origin: extractor_observed
  source_stated_problems:
    - "a disposition is read as economising when it is no longer about economy"
  source_stated_remedies: []
  examples:
