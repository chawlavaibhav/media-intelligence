- sk_id: sk_dmpl_0010
  source_id: desai_mother_pious_lady
  source_terms:
    - "Paisa vasool means that the purchased item is worth its price. It indicates a satisfaction in extracting every drop of consumption liquid from each paisa."
    - "Consumption thus is not about the act of purchase, but instead about the use value of the object in question. It occurs over a period of time, the longer the better"
  concept_label: paisa_vasool_value_as_use_extracted_over_time
  label_origin: source_stated
  claim: >
    Desai defines *paisa vasool* as the satisfaction of having extracted the full use-value of a
    purchase, explicitly distinguishing it from miserliness. On this account consumption is not the
    moment of purchase but the use of the object over time — the longer the better — and the use
    often becomes something unimagined at the time of buying. Value is therefore realised after the
    transaction, not decided at it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      If value is realised through use over time rather than at the point of sale, then the residue
      of unexhausted utility in an object is felt as a loss, which is why discarding is hard and why
      a further use is always sought.
  scope:
    domain_discussed_by_source: [indian_middle_class_consumption]
    conditions: >
      Urban middle-class India as the author knew it, chiefly the pre-liberalisation period, with an
      explicit claim of persistence into greater affluence (see sk_dmpl_0011).
  caveats:
    - text: "the term is Hindi and is preserved; 'value for money' is NOT an equivalent, because the author's point is precisely that the value is not settled at the price"
      origin: extractor_observed
    - text: "no measurement of any kind supports this; it is an essayist's account of a disposition he shares"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
