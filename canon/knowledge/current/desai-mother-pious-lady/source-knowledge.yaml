- sk_id: sk_dmpl_0020
  source_id: desai_mother_pious_lady
  source_terms:
    - "In a study I was involved in a few years ago, we analysed matrimonial ads across thirty years to examine what had changed, and found some very interesting things."
    - "The biggest change, expectedly, was in the importance given to appearance."
    - "Interestingly, the proportion of ads that mentioned the caste origins of the candidates remained constant."
  concept_label: thirty_year_content_analysis_of_matrimonial_advertisements
  label_origin: extractor_assigned
  claim: >
    Desai reports a content analysis of matrimonial advertisements across thirty years, in which he
    says he was involved, and gives its findings directionally: adjectives describing appearance
    increased sharply, with a new premium on being tall and slim; fairness as an articulated quality
    rose sharply; boys were evaluated on income and family, girls on appearance, qualifications and
    family; the boy's side used more words to state its expectations than the girl's side; and the
    proportion of advertisements mentioning caste origin **remained constant**. He also reports that
    even at the end of the period the advertisements barely mention personality traits, individuals
    being summed up by background, appearance and occupation.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [indian_matrimonial_advertising, indian_middle_class_culture]
    conditions: >
      India; a thirty-year window ending "a few years" before the book. Which publications, which
      languages, which cities and which years are not stated.
  caveats:
    - text: "this is the ONE object in the book resting on the author's own measurement, and it is reported without a sample size, a sampling frame, a publication list, a coding scheme, a date range, an inter-coder check, or a single number"
