- sk_id: sk_dmpl_0012
  source_id: desai_mother_pious_lady
  source_terms:
    - "Festivals were the safety valves in our otherwise restrained lives; they gave us sanction to experience little atolls of freedom."
    - "Growing up in middle class India was an elaborate exercise in learning to detach action from one's senses."
    - "We did not eat ice cream because we felt like it, but on occasions when celebrations had been planned."
  concept_label: indulgence_requires_an_occasion_that_sanctions_it
  label_origin: extractor_assigned
  claim: >
    Desai argues that in the middle-class household he describes, spending was controlled by
    detaching action from impulse: indulgences were planned rather than felt, and impulse was treated
    as the enemy. Festivals functioned as sanctioned exceptions — the occasions on which new clothes
    were bought and pleasures taken — so consumption was licensed by an occasion rather than by a
    desire.
  claim_type: source_interpretation
  interpretation_basis: >
    The description of household practice is the author's recollection; the reading of festivals as
    structural "safety valves" that supply sanction is his interpretation of it.
  mechanism:
    stated_by_source: true
    text: >
      Where budgets are tight and every deviation is felt as risk, the sense that prompts spending
      has to be disconnected from the act of spending. An external calendar of occasions then
      supplies permission that the individual's own appetite is not allowed to supply.
  scope:
    domain_discussed_by_source: [indian_middle_class_consumption, festivals_and_ritual]
    conditions: >
      Pre-liberalisation urban middle-class India, the author's childhood. He does not claim this
      persists, and the surrounding essays describe its loosening.
  caveats:
    - text: "wholly retrospective: an adult recalling a childhood household, with no contemporaneous record"
      origin: extractor_observed
    - text: "the author explicitly frames the book's second section as the loosening of exactly these constraints, so this must not be consumed as a current description"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
