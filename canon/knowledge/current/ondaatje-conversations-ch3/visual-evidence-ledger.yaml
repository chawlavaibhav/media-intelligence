# ═════════════════════════════════════════════════════════════
# 6. THE SOURCE'S FORM, OBSERVED BEFORE EXTRACTION
# ═════════════════════════════════════════════════════════════
source_form:
  registers_present: 4
  description: >
    This chapter interleaves four distinct kinds of text, and they carry different evidential weight:
      1. Ondaatje's third-person editorial frame, setting the scene (New York, a SoHo loft, steam
         pipes "a sort of haphazard and unseen gamelan orchestra"), which is authorial writing.
      2. The transcribed dialogue itself, marked "O:" and "M:".
      3. An inset first-person contribution from a THIRD party — the producer Rick Schmidlin's
         account, "As if Orson was sending us notes", running about 400 words inside the chapter.
      4. Photograph captions, which sometimes carry substantive content ("Source music in The English
         Patient: the piano was detuned to suggest that it had been exposed to the elements").
  why_it_was_recorded_before_extraction: >
    Because the register determines who is making a claim, and this source has no single voice.
    A statement can be Murch asserting, Ondaatje proposing and Murch assenting ("Mm-hm", "Right"),
    Ondaatje asserting unchallenged, or a third party recalling. Those are different evidential
    situations and the extraction has to keep them apart.
