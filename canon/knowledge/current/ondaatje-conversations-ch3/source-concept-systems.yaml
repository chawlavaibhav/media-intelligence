# CANON-003 book 12 (Lane B) — The Conversations, Third Conversation. SourceConceptSystems.
#
# THREE systems, and the small number is the finding rather than a shortfall.
#
# Books 9 and 10 in this lane produced five and four systems, because both authors build frameworks:
# named sets, numbered criteria, ranked lists. This source builds none. It is a recorded
# conversation, and a speaker answering questions does not construct taxonomies — he returns to
# preoccupations. What structure exists here is either a metaphor the speaker himself extends across
# several subjects, or a set of claims that share a mechanism he states once and relies on
# afterwards. Anything more would be structure imposed by the extraction, and the task explicitly
# forbids forcing this source into textbook shape.
#
# Origin marking is therefore doing heavy work below. Two of the three systems are largely
# extractor_inferred, and they are labelled as hypotheses about the source rather than reports of it.

source_id: ondaatje_conversations_third_conversation

source_concept_systems:

# ═════════════════════════════════════════════════════════════
- scs_id: scs_conv_c003_001
  source_id: ondaatje_conversations_third_conversation
  label: the_attention_economy_of_the_soundtrack
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    A set of claims about sound that all turn on where a finite audience attention is directed and
    what the audience believes about where a sound came from: that music works best channelling an
    emotion the film has already created; that music with a visible in-scene origin evades the
    listener's sense of being manipulated while a score does not; that withdrawing dialogue makes the
    audience search the remaining sound for meaning; and that acoustic perspective can therefore
    carry plot.
  whole_system_claim:
    text: >
      Sound in this source is governed by two variables, and every claim in the group is a
      consequence of one of them. The first is ATTENTION, which is finite and competitive: "You pay
      attention to the stars on nights when there is no moon… Dialogue is the moon, and stars are the
      sound effects." Remove dialogue and unchanged effects acquire significance. The second is
      ATTRIBUTION: a sound the audience can assign to the world of the scene is not experienced as
      authored, so it passes without resistance, while a sound with no in-world origin registers as a
      new voice and the viewer repositions. Together they explain why the strongest sound effects in
      this chapter are subtractive — dropping dialogue, dropping a score, an echo that does not match
      its space — rather than additive.
    origin: extractor_synthesis
    interpretation_basis: >
      Each member claim is stated explicitly, with its own mechanism, in its own part of the
      conversation. The attention claim and the attribution claim are both the source's own words.
      What is OURS is the assertion that these two variables organise the whole of what he says about
      sound here, and the further observation that the resulting techniques are consistently
      subtractive. Murch never groups these claims or names a governing principle; in a conversation
      he had no occasion to.
    source_ref: null
  members:
    - {sk_ref: sk_conv_c003_0007, role_in_system: governing_claim, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_conv_c003_0009, role_in_system: attribution_mechanism, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_conv_c003_0019, role_in_system: attention_mechanism, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_conv_c003_0022, role_in_system: consequence, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_conv_c003_0010, role_in_system: failure_case, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_conv_c003_0011, role_in_system: bound, order: 6, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - {from: sk_conv_c003_0022, to: sk_conv_c003_0019, nature: "sound can only carry plot if the audience is already listening to it", origin: extractor_inferred}
      - {from: sk_conv_c003_0009, to: sk_conv_c003_0011, nature: "the source itself bounds source music by the overuse rule", origin: source_stated}
    tradeoffs: []
    conflicts:
      - between: [sk_conv_c003_0010, sk_conv_c003_0007]
        nature: >
          Music written independently of a film, with no direct connection to it, nonetheless read as
          commenting on the action wherever it was placed. That is music failing to channel an
          existing emotion and failing for reasons the source cannot state — "there was something
          about that music". The governing claim does not account for the failure case.
        origin: extractor_inferred
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, anecdotal, mechanism_given]
    source_uncertainty: source_hedges
    extraction_uncertainty: none
    system_level_uncertainty: >
      The members are individually explicit and each carries its own stated mechanism. The claim that
      they constitute one model is entirely ours, and it is the kind of tidying a transcript invites
      and does not license. A weaker and equally defensible reading is that a sound editor returned
      several times to sound over one morning and said different things about it. The system is
      recorded as a hypothesis about the source for that reason, and its members remain individually
      retrievable and individually true whether or not the grouping holds.
  provenance:
    chapter: "Third Conversation"
    section: "The Invisible Partner; What's Under the Hands?; The Wrong Echo"
    page_start: null
    page_end: null
    source_support: text

