- scs_id: scs_conv_c003_002
  source_id: ondaatje_conversations_third_conversation
  label: the_hat_as_the_sources_own_extended_metaphor
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: source_stated
  description: >
    A metaphor the speaker introduces, names as a metaphor, and then extends himself: a hat's angle
    sends a message the wearer may not intend, and by extension so does any look, aspect, attitude or
    gesture — and so does the camera, which is normally a neutral hat and can be made an aggressive
    presence.
  whole_system_claim:
    text: >
      The metaphor's work is to make one point across several scales at once: meaning in film is
      carried by small adjustable details that are found rather than designed, and the editor's craft
      is selecting among them. The speaker states the generalisation explicitly — "I'm using 'hat' as
      a metaphor" — and then applies it upward to the camera itself, which is the move that turns a
      remark about costume into a claim about the apparatus. The word "fortuitously" is what holds it
      together: the details are accidents, correct or incorrect, and the editor chooses among them.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {section: "The Minor Key", locator: "Third Conversation, 'The Minor Key'"}
  members:
    - {sk_ref: sk_conv_c003_0014, role_in_system: framing_metaphor, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_conv_c003_0013, role_in_system: the_selection_it_governs, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_conv_c003_0015, role_in_system: extension_to_the_camera, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_conv_c003_0016, role_in_system: worked_instance, order: 4, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - {from: sk_conv_c003_0015, to: sk_conv_c003_0014, nature: "the camera claim is stated as an extension of the hat metaphor and does not stand without it", origin: source_stated}
      - {from: sk_conv_c003_0016, to: sk_conv_c003_0014, nature: "the mobile is the metaphor's worked instance", origin: extractor_inferred}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, anecdotal, mechanism_absent]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      Unusually for this source, the grouping is the speaker's own: he names the metaphor as a
      metaphor and extends it himself within a few exchanges. What is ours is only the decision to
      treat the extension as constituting a set rather than as two separate remarks. This is the one
      structure in the chapter that would exist whether or not anyone extracted it.
  provenance:
    chapter: "Third Conversation"
    section: "The Minor Key"
    page_start: null
    page_end: null
    source_support: text

