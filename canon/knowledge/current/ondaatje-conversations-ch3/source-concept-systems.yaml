- scs_id: scs_conv_c003_003
  source_id: ondaatje_conversations_third_conversation
  label: making_a_film_from_material_that_is_missing
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    A connected account, told as one story, of how a film was assembled when about fifteen script
    pages were never shot: restructuring away from the original intent, reclassifying an unconnectable
    scene as a dream, exploiting costume consistency so scenes could be moved, and splitting a scene
    in two to make the plot legible.
  whole_system_claim:
    text: >
      The four moves are not independent techniques; they are what one constraint made necessary, and
      three of them are only available because of decisions taken earlier by other departments. The
      restructuring is possible because the costumes are consistent. The dream reframing is available
      because the film already tolerates a non-literal register. The split scene is validated by test
      screenings rather than by principle. Taken together they describe editing as working the degrees
      of freedom that production happened to leave open — which is a different picture of the craft
      from the one in which an editor applies criteria to material.
    origin: extractor_synthesis
    interpretation_basis: >
      The four claims are told consecutively, in one stretch of conversation, as a single narrative
      about one film, prompted by one question about whether it was a difficult edit. That much is
      the source's. What is OURS is reading them as illustrating a dependency between production
      decisions and editorial freedom, and the further characterisation of the craft that follows.
      Murch states the dependency for costume explicitly and does not generalise it.
    source_ref: null
  members:
    - {sk_ref: sk_conv_c003_0001, role_in_system: governing_constraint, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_conv_c003_0002, role_in_system: move, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_conv_c003_0003, role_in_system: enabling_condition, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_conv_c003_0005, role_in_system: move, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_conv_c003_0006, role_in_system: residual_problem, order: 5, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - {from: sk_conv_c003_0001, to: sk_conv_c003_0003, nature: "scenes could be repositioned because the costumes did not pin them to a timeline", origin: source_stated}
      - {from: sk_conv_c003_0002, to: sk_conv_c003_0001, nature: "the dream reframing is one instance of the forced restructuring", origin: source_stated}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, anecdotal, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      Membership follows the source's own narrative sequence, which is a weaker basis than a stated
      grouping — things said one after another in a conversation are not thereby a set. The
      characterisation of editing as working production's leftover degrees of freedom is ours and is
      a reading, not a report. Recorded because the dependency it describes is the one genuinely
      general thing in an otherwise wholly film-specific stretch.
  provenance:
    chapter: "Third Conversation"
    section: "Editing The Conversation"
    page_start: null
    page_end: null
    source_support: text
