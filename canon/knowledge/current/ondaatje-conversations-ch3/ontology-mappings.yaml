# `t_conv_c003_0009` (planarity of the face) and `planarity` extracted from In the Blink of an Eye in
# this same lane are the same speaker's word, used in the same sense, in two books with DIFFERENT
# authors and DIFFERENT publishers. Under a count of distinct origin_ref values they would pass an
# independence test for a cross_source_concept. They are not independent: one book is Murch's own
# lecture, the other is Murch interviewed. The same is true of `most_characteristic_angle`, which
# appears in both books as the Egyptian-painting argument.
#
# No cross_source_concept is created here. Flagged in the book 12 findings as the sharpest form of
# the independence problem this lane has found — sharper than the same-author case in LB-09, because
# here even the author field differs.
