# CANON-003 book 12 (Lane B) — The Conversations, Third Conversation. SPEC-05 ontology, source-local.
# Existing relation types and term kinds only. distinct_from permitted here per Controller decision 3.
#
# NOTE ON TERM COUNT. Sixteen terms from 13,774 words, against 48 from book 9's 15,911. The gap is
# the source shape. A textbook names things — it coins "action edit", "natural wipe", "eye trace" —
# because naming is how a textbook teaches. A conversation mostly does not: the speaker describes
# what happened on a film and reaches for a figure of speech rather than a term. Most of what is
# below is therefore a phrase the speaker used vividly and repeatedly, not a technical vocabulary he
# maintains. That distinction is marked on each term via `verbatim`.

source_id: ondaatje_conversations_third_conversation
extraction_date: 2026-08-24

terms:

- term_id: t_conv_c003_0001
  term: source_music
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: entity
  definition_in_origin_frame: >
    Music that comes from within the scene — an orchestra shown playing, a radio, a record player.
    The audience is insulated from feeling manipulated because the sound is explained by the scene.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'The Invisible Partner'"}
  arising_from: [sk_conv_c003_0009]

- term_id: t_conv_c003_0002
  term: the_lucky_accident
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: property
  definition_in_origin_frame: >
    The ideal all source music and sound effects aim at — the impression that the filmmakers had
    nothing to do with it and it just happened.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'The Invisible Partner'"}
  arising_from: [sk_conv_c003_0009]

- term_id: t_conv_c003_0003
  term: on_the_nose
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: problem
  definition_in_origin_frame: >
    Music that reads as commenting directly on the action, as if its composer were behind the screen
    telling the audience exactly what is happening — a fault that occurred even with music written
    long beforehand and unconnected to the film.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'The Invisible Partner'"}
  arising_from: [sk_conv_c003_0010]

- term_id: t_conv_c003_0004
  term: minor_key_character
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: property
  definition_in_origin_frame: >
    A character who comes at the audience sideways rather than directly; on the surface unlikeable or
    boring, and interesting for the deeper or less obvious aspects an editor can reveal.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'The Minor Key'"}
  arising_from: [sk_conv_c003_0012]

- term_id: t_conv_c003_0005
  term: the_hat
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: property
  definition_in_origin_frame: >
    The speaker's own named metaphor for any small adjustable detail — a look, an aspect, an
    attitude, a gesture — whose disposition sends a message, and which is fortuitously correct or
    incorrect rather than designed.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'The Minor Key'"}
  arising_from: [sk_conv_c003_0014]

- term_id: t_conv_c003_0006
  term: neutral_hat
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: property
  definition_in_origin_frame: >
    The camera in its normal condition, asking the viewer to attend to the action rather than to the
    angle, the chosen angle merely happening to be the most revealing one. Contrasted with a camera
    made aggressively a presence.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'The Minor Key'"}
  arising_from: [sk_conv_c003_0015]

- term_id: t_conv_c003_0007
  term: conflicted_moment
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: property
  definition_in_origin_frame: >
    A shot, or a moment within a shot, in which a character looks appealing and problematic at the
    same time. The property an editor selects for when presenting a difficult character.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Third Conversation, 'The Minor Key'"}
  arising_from: [sk_conv_c003_0013]

- term_id: t_conv_c003_0008
  term: the_wrong_echo
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: property
  definition_in_origin_frame: >
    A voice carrying acoustic properties that do not belong to the space its speaker occupies —
    in the source's case, a man hearing his own voice echo from an archway he is not standing in,
    and deducing that he is being recorded.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'The Wrong Echo'"}
  arising_from: [sk_conv_c003_0022]

- term_id: t_conv_c003_0009
  term: planarity_of_the_face
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: property
  definition_in_origin_frame: >
    How a particular face translates from three dimensions into a two-dimensional photograph under a
    given lens at a given distance. A telephoto flattens a subject; a wide-angle curves out a flat
    one.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'The Most Characteristic Angle'"}
  arising_from: [sk_conv_c003_0025]

- term_id: t_conv_c003_0010
  term: most_characteristic_angle
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: property
  definition_in_origin_frame: >
    The angle that reveals most about a given element, chosen separately for each situation, line and
    scene and then combined — the principle the source says Egyptian painters used on the body and
    film uses on the work.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'The Most Characteristic Angle'"}
  arising_from: [sk_conv_c003_0027]

- term_id: t_conv_c003_0011
  term: forced_consistency
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: property
  definition_in_origin_frame: >
    Film's insistence on a unity of costume, location and sound, such that an unexplained difference
    appears inexplicably foreign — necessitated, per the source, by films being shot out of sequence.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'Editing The Conversation'"}
  arising_from: [sk_conv_c003_0004]

- term_id: t_conv_c003_0012
  term: rigid_scene_structure
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: problem
  definition_in_origin_frame: >
    The condition frequent costume changes lock filmmakers into, in which a scene cannot be moved to
    a different position without standing out.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Third Conversation, 'Editing The Conversation'"}
  arising_from: [sk_conv_c003_0003]

- term_id: t_conv_c003_0013
  term: keep_the_character_in_the_same_costume
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: remedy
  definition_in_origin_frame: >
    Holding a character's clothes constant across most of a film so that scenes can be repositioned
    in the edit without standing out.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [physical_production]
  source_ref: {locator: "Third Conversation, 'Editing The Conversation'"}
  arising_from: [sk_conv_c003_0003]

- term_id: t_conv_c003_0014
  term: give_the_composer_the_script_before_shooting
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: remedy
  definition_in_origin_frame: >
    Commissioning themes from the screenplay rather than from the cut, so that music exists during
    production, actors can hear a scene's colouration, and the music has an opportunity to shape the
    film rather than only to be laid over it.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [unknown]
  source_ref: {locator: "Third Conversation, 'The Invisible Partner'"}
  arising_from: [sk_conv_c003_0008]

- term_id: t_conv_c003_0015
  term: divide_the_scene_in_two
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: remedy
  definition_in_origin_frame: >
    Splitting a scene that contains both routine action and a crucial discovery, and placing an
    intervening event between the halves, so the plot becomes followable and the delayed discovery
    gains meaning from its new context.
  first_seen: 2026-08-24
  verbatim: true
  executable_by: [human_edit]
  source_ref: {locator: "Third Conversation, 'Editing The Conversation'"}
  arising_from: [sk_conv_c003_0005]

- term_id: t_conv_c003_0016
  term: withdraw_dialogue_to_expose_the_soundtrack
  origin: source
  origin_ref: ondaatje_conversations_third_conversation
  kind: remedy
  definition_in_origin_frame: >
    Reducing dialogue so that the audience searches the remaining sound for meaning and hears effects
    as if they were speech — the moon withdrawn so the stars can be seen.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "Third Conversation, \"What's Under the Hands?\""}
  arising_from: [sk_conv_c003_0019]

# ═════════════════════════════════════════════════════════════
# LAYER 2 — RELATIONSHIPS
# ═════════════════════════════════════════════════════════════
relationships:

- from: t_conv_c003_0001
  to: t_conv_c003_0002
  relation: same_mechanism
  confidence_basis: source_stated
  note: >
    The source states that source music and sound effects both aim at the ideal of the lucky
    accident, and that both work by the same route — the audience attributes them to the world of the
    scene rather than to an author.

- from: t_conv_c003_0003
  to: t_conv_c003_0002
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    A negative finding. Both concern whether the audience perceives an authorial hand, and it would
    be easy to treat "on the nose" as simply the absence of the lucky accident. The source's own case
    resists that: the Morrison music was NOT authored for the film and had no connection to it, and
    it read as commentary anyway. So authorship and perceived commentary come apart, and the failure
    is not explained by the mechanism that explains the success.

- from: t_conv_c003_0005
  to: t_conv_c003_0006
  relation: broader_than
  confidence_basis: source_stated
  note: >
    The camera as a neutral hat is the speaker's own extension of the hat metaphor to the apparatus.
    The hat is the general term; the neutral hat is the camera's ordinary case.

- from: t_conv_c003_0011
  to: t_conv_c003_0012
  relation: same_mechanism
  confidence_basis: extractor_judgement
  note: >
    A rigid scene structure is forced consistency operating on costume specifically. The source
    states both and does not connect them; the connection is our reading, and it is what makes the
    costume advice more than a production tip.

- from: t_conv_c003_0013
  to: t_conv_c003_0012
  relation: maps_to
  confidence_basis: source_stated
  note: "The remedy the source names for the problem it names."

- from: t_conv_c003_0009
  to: t_conv_c003_0010
  relation: narrower_than
  confidence_basis: extractor_judgement
  note: >
    Choosing a lens that suits a face is one dimension of choosing the most revealing view of an
    element. The source discusses them in the same section and does not subordinate one to the other.

- from: t_conv_c003_0008
  to: t_conv_c003_0016
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    The wrong echo is only readable by an audience that is attending to sound, which is the condition
    withdrawing dialogue creates. Recorded as related_to rather than as a dependency because the
    source discusses them in different sections about different films and never links them.

- from: t_conv_c003_0004
  to: t_conv_c003_0007
  relation: same_observed_effect
  confidence_basis: source_stated
  note: >
    The source moves directly from characters played in a minor key to the editorial question of
    which take shows conflict best. The conflicted moment is how a minor-key character becomes
    visible on screen.

# ═════════════════════════════════════════════════════════════
# LAYER 3 — CONCEPTS
# ═════════════════════════════════════════════════════════════
concepts:

- concept_id: sc_conv_sound_attribution
  kind: source_specific_concept
  label: sound_the_audience_attributes_to_the_scene
  origin_ref: ondaatje_conversations_third_conversation
  origin: source_stated
  definition: >
    The source's own generalisation over its own vocabulary: source music, sound effects and the
    lucky accident all name one thing — sound whose origin the audience can locate inside the scene,
    which therefore evades the sense of being manipulated. The speaker states the grouping himself
    ("Sound effects work very much the same way").
  children_terms: [t_conv_c003_0001, t_conv_c003_0002]

- concept_id: sc_conv_the_hat_family
  kind: source_specific_concept
  label: the_hat_and_its_extensions
  origin_ref: ondaatje_conversations_third_conversation
  origin: source_stated
  definition: >
    The speaker's named metaphor and the things he extends it to: any small adjustable detail that
    sends a message, the camera in its ordinary neutral condition, and the conflicted moment an
    editor selects for. Valid with one origin and not to be presented as agreement between sources.
  children_terms: [t_conv_c003_0005, t_conv_c003_0006, t_conv_c003_0007]

- concept_id: cc_information_carried_off_the_picture
  kind: canonical_concept
  label: information_carried_off_the_picture
  purpose: retrieval_and_aggregation
  created_by: extractor
  asserts_equivalence: false
  definition: >
    Ours, for retrieval. Groups the cases in this chapter where meaning is carried by something other
    than what is visible in the frame: music located inside the scene, an echo that does not match
    its space, effects made audible by withdrawing dialogue. They work by different mechanisms —
    attribution, acoustic geometry, attention — and grouping them asserts nothing about their being
    one thing.
  children_terms: [t_conv_c003_0001, t_conv_c003_0008, t_conv_c003_0016]

