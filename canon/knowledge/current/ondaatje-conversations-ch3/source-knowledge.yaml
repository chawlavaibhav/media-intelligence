- sk_id: sk_conv_c003_0027
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: They were painting essences, and in order to paint an essence you have to paint it from its most characteristic angle."
    - "M: That's exactly what we do in film, except that instead of the body of the person, it's the work itself."
    - "M: It may be, five hundred years from now, when people see films from our era, they'll seem \"Egyptian\" in a strange way."
  concept_label: film_combines_most_characteristic_angles_as_egyptian_painting_did
  label_origin: extractor_assigned
  claim: >
    Murch's analogy for what shot selection is. Ancient Egyptian painters showed each part of a body
    from the angle that revealed most about it — face in profile, shoulders frontal, hips frontal,
    feet in profile — combining the characteristic essences of a person in one figure, which produces
    a strange twisted effect that was natural to them. Film does exactly the same, he says, except
    that the thing being composed is the work rather than a body: the director chooses the most
    characteristic, revealing, interesting angle for every situation, line and scene, overshoots, and
    gives the editor a further range of choices; the editor then shifts between angles on the same
    principle. He adds that in five hundred years films of this era may look equally strange or comic.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Both practices reject reproducing a single viewpoint faithfully in favour of assembling the
      most revealing view of each element. What looks natural is a convention, which is why it can
      later look comic.
  scope:
    domain_discussed_by_source: [film_editing, cinematography]
    conditions: "any multi-angle coverage of a scene"
  caveats:
    - text: "the analogy carries the argument entirely; no evidence is offered that Egyptian painting and film coverage share anything beyond the described resemblance"
      origin: extractor_observed
    - text: "the closing move — that our own convention may look comic in five hundred years — is the chapter's one explicit statement that current film grammar is historically contingent rather than natural. It arrives as an aside."
      origin: extractor_observed
    - text: "DISCLOSED CONTAMINATION. I recognised this analogy while reading this source because I had extracted a compressed version of the same argument from In the Blink of an Eye earlier in this lane, where it appears as a footnote. Nothing was imported: this object is written from the wording in front of me, which is substantially longer and differently developed. The recognition is disclosed here and discussed in the book 12 findings, because an extraction cannot claim independence it does not have."
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples: {positive: []}
