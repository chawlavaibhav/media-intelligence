- sk_id: sk_conv_c003_0004
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "O: Film—even more than theatre, I think—insists on a unity, in some odd way. Not just in costume or location but even in sound."
    - "O: if a different, distinct sound or room tone is suddenly introduced, unless it's explained or established it can appear inexplicably foreign. There's a forced consistency in film."
    - "M: Right, which is necessitated by the fact that films are shot out of sequence."
  concept_label: film_insists_on_a_forced_consistency_because_it_is_shot_out_of_sequence
  label_origin: extractor_assigned
  claim: >
    A claim proposed by Ondaatje and assented to by Murch: film, more than theatre, insists on a
    unity — of costume, of location, of sound — such that an unexplained or unestablished difference
    reads as inexplicably foreign. Murch's addition is the cause: this forced consistency is
    necessitated by films being shot out of sequence.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because material is gathered out of order and across time, consistency has to be imposed rather
      than inherited. Anything inconsistent therefore reads as an error rather than as variation.
  scope:
    domain_discussed_by_source: [film_editing, filmmaking]
    conditions: "narrative film"
  caveats:
    - text: "SPEAKER ATTRIBUTION MATTERS HERE. The substantive claim is the interviewer's; Murch's contribution is a one-word agreement plus a causal explanation. Recorded as an explicit source claim because Murch affirms it and extends it, but it is not evidence that Murch would have volunteered it."
      origin: extractor_observed
    - text: "the comparison with theatre is asserted by Ondaatje and not examined by either speaker"
      origin: extractor_observed
  source_stated_problems:
    - "it can appear inexplicably foreign"
  source_stated_remedies: []
  examples: {positive: []}
  intra_source_relations:
    - {relation: generalises, target: sk_conv_c003_0003, note: "costume consistency is one case of it"}
