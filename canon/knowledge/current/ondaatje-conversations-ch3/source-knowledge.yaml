- sk_id: sk_conv_c003_0006
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: if the balance shifted ever so slightly towards the murder-mystery aspect, our test audiences became impatient with the character-study parts: they seemed unnecessary"
    - "M: On the other hand, if we stayed more with the characters, the murder mystery was so partial that it seemed unnecessary."
    - "M: The metal of character study and the metal of murder mystery don't easily melt together."
  concept_label: two_incompatible_registers_make_each_other_look_unnecessary
  label_origin: extractor_assigned
  claim: >
    Murch's account of a structural instability: in a film alloying a character study with a genre
    plot, shifting the balance slightly toward either one made the other read as unnecessary to test
    audiences. The failure was symmetrical, and the balance point was, in his phrase, a knife-edge
    alchemy between two elements that do not naturally flow together — copper and tin make bronze
    easily, he says, but this was something else.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [film_editing]
    conditions: "a film combining two registers an audience reads differently"
  caveats:
    - text: "Murch scopes the observation to \"getting the structure of that film as right as we ever got it\", which concedes the balance was never fully achieved"
      origin: source_stated
    - text: "the evidence is test-audience impatience, reported without numbers or method. It is nonetheless the closest thing to an empirical observation in the chapter, and its shape — the same intervention failing in both directions — is what makes it more than an anecdote."
      origin: extractor_observed
    - text: "the source names a specific cause for the asymmetric difficulty: the murder mystery was deliberately left partial, because the director refused to work out the crime in case knowing it obliged him to shoot it"
      origin: source_stated
  source_stated_problems:
    - "they seemed unnecessary—Get rid of that!"
    - "it seemed like something chosen by the filmmakers to beef up"
