- sk_id: sk_conv_c003_0025
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: There's a chemistry between each actor and a certain lens."
    - "M: It has something to do with the translation of a three-dimensional object—the human face—into a two-dimensional photograph."
    - "M: A telephoto lens tends to flatten out its subject, and a wide-angle lens does the opposite: it will curve out a flat subject."
  concept_label: each_face_has_a_lens_and_distance_that_renders_it_most_itself
  label_origin: extractor_assigned
  claim: >
    Murch's claim about lens and face: certain actors look most themselves photographed with a
    certain lens at a certain distance, and this is why makeup and costume tests are shot with the
    principals before production — one of the things being studied is the chemistry between the angle
    of the lens and the planarity of the actor's face. He grounds it in optics: a telephoto flattens
    its subject and a wide-angle curves out a flat one, and the underlying issue is the translation
    of a three-dimensional object into a two-dimensional photograph. His everyday parallel is that
    some people look better in person than in photographs and others the reverse.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Lens focal length changes how depth is mapped onto a plane. A face's own depth interacts with
      that mapping, so the same face is rendered differently by different lenses at different
      distances.
  scope:
    domain_discussed_by_source: [cinematography, film_editing, casting]
    conditions: "photographing a human face"
  caveats:
    - text: "\"chemistry\" is the source's word and is not defined; the optical part of the claim is specific and the criterion for looking \"most themselves\" is not"
      origin: extractor_observed
    - text: "his one concrete instance is a memorable number rather than a method — a 45-millimetre lens at four and a half feet for one child actor, remembered, he says, because of the poetry of \"forty-five at four and a half\""
      origin: source_stated
    - text: "the term 'planarity' appears here in the same sense the same speaker uses it elsewhere as a named editorial criterion, but in this source it is used only of a face and is not presented as part of any framework"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "shoot makeup and costume tests with the principals to study lens and face together"
  examples:
