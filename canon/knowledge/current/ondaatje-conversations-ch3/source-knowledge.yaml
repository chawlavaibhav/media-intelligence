- sk_id: sk_conv_c003_0005
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: As an experiment we divided the scene in two."
    - "M: Now we have the second half of the scene where he uncovers the fateful line—which now has greater meaning in this new context."
    - "M: This structure allows the audience to follow the train of events more clearly."
  concept_label: splitting_a_scene_and_delaying_its_second_half_can_make_a_plot_legible
  label_origin: extractor_assigned
  claim: >
    Murch's account of a structural repair: a scene in which a character both performs a routine task
    and makes a crucial discovery was divided in two, with an intervening event placed between the
    halves. The delayed discovery then arrives in a context that gives it greater meaning, and the
    audience can follow the sequence of events more clearly.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The intervening event — a stranger seeming a little too anxious to take the tape — gives both
      the character and the audience pause, which supplies the motive for the second half and loads
      the discovery with a significance it did not have when it followed immediately.
  scope:
    domain_discussed_by_source: [film_editing]
    conditions: "a plot audiences are failing to follow"
  caveats:
    - text: "Murch calls it \"an experiment\", and reports that many test screenings had left audiences \"completely flummoxed\" before the problem was even identified. He states plainly: \"it took us some time to realize that there was a problem and then figure out what to do about it.\""
      origin: source_stated
    - text: "this is the chapter's clearest instance of an editorial change validated by audience response rather than by principle, and the validation is informal — screenings where people were confused, then were not"
      origin: extractor_observed
  source_stated_problems:
    - "audiences were completely flummoxed"
    - "hard for them to understand ... the twists of this particular situation"
  source_stated_remedies:
    - "divide the scene in two and place an intervening event between the halves"
  examples:
    positive:
      - {description: "Harry decoding the tape: routine work first, then delivery to the Director's anxious assistant, then a return to the studio where the fateful line is uncovered", figure_ref: null}
  intra_source_relations:
