- sk_id: sk_conv_c003_0009
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: That's the great power of source music—music that comes from within the scene"
    - "M: they are insulated from feeling overtly manipulated musically because the sounds are explained by the scene"
    - "M: It sneaks past their immune system, so to speak. Whereas a musical score doesn't. It has to pass through some sort of blood/brain barrier."
  concept_label: source_music_avoids_the_audiences_manipulation_defence
  label_origin: extractor_assigned
  claim: >
    Murch's account of why music originating inside a scene — an orchestra shown playing, a radio, a
    record player — works differently from a score. Because the scene explains the sound, the
    audience is insulated from feeling musically manipulated: it reads as an accident of the
    filming, not as commentary on the subtext, even though it is commentary. A score is perceived as
    a new voice entering, and the viewer repositions slightly on hearing it. Murch says sound effects
    work the same way, and that both aim at the ideal of the lucky accident.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Attribution governs the defence. Sound the audience can attribute to the world of the scene is
      not experienced as authored, so it is not resisted. Sound with no in-world source is
      experienced as an authorial voice and triggers a slight repositioning.
  scope:
    domain_discussed_by_source: [film_editing, film_music, sound_design]
    conditions: "any music or effect whose origin can be located within a scene"
  caveats:
    - text: "Murch immediately reports playing against his own principle: in The English Patient a piece was set up to be heard as score and then revealed to be a record playing in the scene, which he says has \"almost the opposite\" effect to the one he has just described"
      origin: source_stated
    - text: "he bounds it himself: \"If you overuse it, then it becomes predictable and it's not so welcome anymore.\" Recorded as sk_conv_c003_0011."
      origin: source_stated
    - text: "the mechanism is an unexamined metaphor — an immune system, a blood/brain barrier. It is doing real explanatory work and it is not evidence."
      origin: extractor_observed
  source_stated_problems:
    - "you recognize that you are now being manipulated musically—and you reposition yourself slightly"
  source_stated_remedies:
    - "give the music or effect a visible origin inside the scene"
  examples:
