- sk_id: sk_conv_c003_0022
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: to make the resolution of the story depend on different shadings and perspectives of sound"
    - "M: Quinlan suddenly stops, suspicious—he hears his own voice with the wrong echo on it."
    - "M: Welles hung the whole ending of the film on the ability of the people in it, and the audience, to understand a subtle nuance with the sound."
  concept_label: sound_perspective_can_carry_the_plot
  label_origin: extractor_assigned
  claim: >
    Murch's account of a sequence in which the resolution of the story depends entirely on shadings
    and perspectives of sound. The same two voices are rendered three ways according to the
    listener's position and equipment — normal when close, distorted like a telephone through a
    receiver, echoey in a field of sound when far from both parties — with no musical accompaniment.
    When the men cross a bridge and the eavesdropper must move under an archway, the recorded voice
    acquires an echo that does not belong to the space the speaker is in. He notices his own voice
    with the wrong echo on it, deduces the surveillance, and the ending follows.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Acoustic properties encode position. A mismatch between the echo a voice carries and the space
      its speaker occupies is information, and both a character and an audience can read it.
  scope:
    domain_discussed_by_source: [film_editing, sound_design, narrative]
    conditions: "a sequence where listener position is dramatically significant"
  caveats:
    - text: "Murch says this is \"very close to my heart\" and links it to his own work, so this is an editor describing a device he admires and has used, not a neutral report"
      origin: extractor_observed
    - text: "the claim is demonstrated on exactly one sequence, and its force depends on that sequence working — which the source asserts (\"This attention to detail pays off fantastically well\", \"It's fantastic!\") rather than evidences"
      origin: extractor_observed
    - text: "it is the strongest instance in the chapter of the source's recurring interest in sound carrying information the picture does not, and the only one where the information is plot rather than mood"
      origin: extractor_observed
