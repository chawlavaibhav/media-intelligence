- sk_id: sk_conv_c003_0019
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: I think that encourages the audience to listen to sounds as if they are speech. In other words, you begin to search the soundtrack for meaning because there are no words \"in the foreground\" distracting you."
    - "M: You pay attention to the stars on nights when there is no moon. When the moon is shining, all you can see is the moon. Dialogue is the moon, and stars are the sound effects."
  concept_label: removing_dialogue_makes_the_audience_hear_sound_as_speech
  label_origin: extractor_assigned
  claim: >
    Murch's claim about attention across the soundtrack: dialogue and sound effects compete, and
    withdrawing dialogue causes the audience to search the remaining sound for meaning, listening to
    sounds as if they were speech. His figure is the moon and the stars — the stars are visible on
    nights when the moon is not shining. He notes the sound effects themselves did not change between
    the halves of the film; what changed was the gradual evaporation of dialogue.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Attention is a fixed quantity competing across one channel. Words in the foreground consume it;
      remove them and the same effects, unchanged, acquire a significance they would not otherwise
      have.
  scope:
    domain_discussed_by_source: [film_editing, sound_design]
    conditions: "a soundtrack in which dialogue can be reduced"
  caveats:
    - text: "Murch states he did not do this knowingly: \"Curiously, I wasn't consciously aware of this when I was working on the film.\" He worked it out only after audiences remarked on the soundtrack, and says \"It seems obvious in retrospect.\""
      origin: source_stated
    - text: "that admission is the most epistemically interesting moment in the chapter. The claim is a post-hoc reconstruction of the maker's own work, offered by the maker, which is a weaker evidential position than it appears to be — and the source volunteers the weakness rather than concealing it."
      origin: extractor_observed
    - text: "the control the claim rests on is real and stated: the effects did not differ between the two halves, only the dialogue did"
      origin: extractor_observed
