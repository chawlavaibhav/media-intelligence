- sk_id: sk_conv_c003_0003
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: if a character keeps the same clothes, you can put a scene in a different place and it doesn't stand out"
    - "M: people don't change clothes in real life as often as they do in film"
    - "M: it's amazing how consistent you can make somebody's costume and have it not stand out"
  concept_label: costume_consistency_buys_freedom_to_move_scenes
  label_origin: extractor_assigned
  claim: >
    Murch, reporting a method he attributes to Coppola: keeping a character in the same clothes for
    most of a film lets the editor move a scene to a different place in the structure without it
    standing out. Frequent costume changes lock filmmakers into a more rigid scene structure. Two
    reasons are given — that people change clothes less often in life than film shows, and that an
    audience experiencing two hours of screen time will subconsciously accept a longer stretch in one
    costume than the story's timeline would allow. The freedom ends where the story makes the issue
    overt: a soaking, or a different social occasion a week later, forces a change.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Costume continuity is what pins a scene to a position in the timeline. Remove the pin and the
      scene becomes movable. The audience's tolerance comes from their own two-hour experience rather
      than from the story's calendar.
  scope:
    domain_discussed_by_source: [film_editing, film_production, costume]
    conditions: "narrative film where the story spans days or longer"
  caveats:
    - text: "attributed by Murch to Coppola, developed on other films, and called \"quite an accurate observation\" — so this is Murch endorsing someone else's method rather than asserting his own"
      origin: source_stated
    - text: "Murch also identifies why the opposite happens: a costume department \"interested in showing what it can do — which is only natural\" will change clothes on the smallest pretext. The obstacle he names is departmental incentive, not craft judgement."
      origin: extractor_observed
    - text: "this is a PRODUCTION decision that determines what is possible in EDITING. It is one of the few places in the chapter where a claim crosses that boundary explicitly, and the direction is that the earlier department constrains the later one."
      origin: extractor_observed
  source_stated_problems:
    - "that locks filmmakers into a more rigid scene structure"
  source_stated_remedies:
    - "keep a character in the same costume so scenes can be repositioned"
  examples:
    positive:
      - {description: "Harry Caul almost always in the same transparent raincoat and crepe-soled shoes", figure_ref: null}
  intra_source_relations:
    - {relation: demonstrated_together_with, target: sk_conv_c003_0001, note: "what made the restructuring possible in practice"}
    - {relation: specialises, target: sk_conv_c003_0004, note: "one instance of film's forced consistency"}
