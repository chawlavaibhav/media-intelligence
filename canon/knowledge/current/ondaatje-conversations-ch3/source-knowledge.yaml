- sk_id: sk_conv_c003_0020
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: There are frequently moments like these in the making of films, where huge issues of character and story are decided by the inclusion—or not—of a single shot that reverberates throughout the film."
  concept_label: a_single_shot_can_decide_a_characters_agency_for_the_rest_of_a_film
  label_origin: extractor_assigned
  claim: >
    Murch's generalisation from a worked case: huge issues of character and story are frequently
    decided by whether a single shot is included, and the effect reverberates through the whole film.
    His case is the removal of one close-up in which a character visibly collapses on being shown
    evidence against his boss. With the close-up in, the other man has seen him acknowledge the
    truth, and everything he does for the last half-hour is done under duress — Murch's image is a
    metaphorical leash. With it removed, the audience sees the doubt but the other character does
