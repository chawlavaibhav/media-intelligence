    mistaken use of the wide-angle lens distorting a face grotesquely — for a change whose real
    purpose was structural. The instruction was addressed to a hostile studio, and admitting an error
    of conception would have conceded power. Murch reports that the note mystified him at the time,
    that he followed it anyway because his job was to do what the memo said, and that he understood
    it only after the work was complete and he could see it in the context of the whole film.
