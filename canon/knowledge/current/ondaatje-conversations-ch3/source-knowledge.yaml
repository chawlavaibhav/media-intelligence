- sk_id: sk_conv_c003_0008
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: How much better if the music is present at the birth of the film, born along with the screenplay, the two of them interweaving through the process of shooting and post-production"
    - "M: at that stage you really can't change the fundamental nature of the music. Nor has the music had an opportunity to shape the film."
  concept_label: music_written_before_shooting_can_shape_the_film_music_added_late_cannot
  label_origin: extractor_assigned
  claim: >
    Murch's argument about when music should be written. If the composer works from the screenplay
    before shooting, the themes exist during production: actors can hear the colouration a scene will
    carry and need not act it, and the editor can place music while cutting, with feedback running
    between script, music and film so each nourishes the others. If music arrives at the end — the
    usual practice — the only available responses are to accept it, reject it, or move it; its
    fundamental nature cannot be changed and it has had no opportunity to shape the film. Murch says
    music thrown out late is often thrown out for this reason.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Influence requires time and mutual exposure. Music present from the screenplay stage
      participates in the decisions of shooting and cutting; music delivered after those decisions
      can only be laid over them.
  scope:
    domain_discussed_by_source: [film_editing, film_music, film_production]
    conditions: "any scored narrative film"
  caveats:
    - text: "Murch conditions his recommendation — \"I recommend it if the director and the composer have a good relationship\" — and reports being surprised to learn the method was unusual"
      origin: source_stated
    - text: "his image for the late alternative is unusually contemptuous for this source and is preserved because it is the argument: \"the music guy comes in all suited up with a big spray gun and blasts it red!\" and, for the panic remedy, \"like putting out an oil fire with dynamite\""
      origin: extractor_observed
    - text: "this is a claim about PROCESS ORDER rather than about any property of the finished work, and it is the second such claim in the chapter — the first being costume consistency. Both say an earlier decision determines what is possible later."
      origin: extractor_observed
  source_stated_problems:
    - "the music is almost spray-gunned on to the film"
    - "the music sometimes ends up being thrown out—because it wasn't given a chance to grow with the film"
  source_stated_remedies:
    - "give the composer the script before shooting and let the themes exist during production"
  examples:
    positive:
      - {description: "David Shire given the screenplay long before shooting and asked to treat it as a strange kind of musical; the themes then played to the actors during shooting so they could hear the scene's colouration and not have to act it", figure_ref: null}
