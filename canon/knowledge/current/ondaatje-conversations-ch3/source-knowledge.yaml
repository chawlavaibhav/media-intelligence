- sk_id: sk_conv_c003_0001
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: When you have restricted material you're going to have to restructure things from the original intent, with sometimes felicitous juxtapositions."
    - "M: So from the beginning we couldn't structure it the way the screenplay called for."
  concept_label: restricted_material_forces_restructuring_away_from_original_intent
  label_origin: extractor_assigned
  claim: >
    Murch's claim, from the case of a film ten days of whose material was never shot: when the
    available material is restricted, the editor must restructure away from the original intent, and
    the juxtapositions that result are sometimes felicitous. The shortfall is not merely absorbed —
    it changes the shape of the film.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
