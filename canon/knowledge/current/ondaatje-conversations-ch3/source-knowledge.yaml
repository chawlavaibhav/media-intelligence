# CANON-003 book 12 (Lane B) — Michael Ondaatje, "The Conversations: Walter Murch and the Art of
# Editing Film" (2002). THIRD CONVERSATION, complete. Fresh SPEC-03 extraction under the CANON-001
# V0 granularity rule, unchanged. Visual completeness: not_verified_page_level (EPUB; see ledger).
#
# SECTION RATIONALE: one complete conversation — the source's own unit. Each chapter is one meeting
# in one place on one day; this one is New York, December 2000, in a SoHo loft, and it runs from
# "Editing The Conversation" through "The Most Characteristic Angle". It is contiguous, self-
# contained, and it is the smallest complete unit the source itself defines. Nothing was taken from
# elsewhere in the book, and the Introduction — which is Ondaatje's own essay rather than
# conversation — was read only to establish the source's identity and form, not for claims.
#
# ═══ THIS SOURCE DOES NOT TEACH THE WAY A TEXTBOOK TEACHES, AND HAS NOT BEEN MADE TO ═══
#
# It is an interview. Nothing here is numbered, ranked, defined or summarised. Claims arrive inside
# anecdotes about particular films, are frequently proposed by the interviewer and assented to by the
# subject, and are as often abandoned as concluded. Three consequences for this extraction:
#
#   1. ATTRIBUTION IS RECORDED IN PROSE BECAUSE THE SCHEMA HAS NOWHERE ELSE TO PUT IT. SPEC-03 has
#      source_id for the work and no field for a SPEAKER. In a two-voice source that matters: a claim
#      Ondaatje proposes and Murch answers "Mm-hm" to is weaker evidence than one Murch states
#      unprompted. Every object below names its speaker in the claim text and quotes with the
#      source's own "O:"/"M:" markers in source_terms. Recorded as LB-15, not solved by adding a
#      field.
#
#   2. MANY PASSAGES YIELD NO OBJECT AT ALL, AND THAT IS CORRECT. Long stretches are film history,
#      biography, production gossip and literary comparison. They are not craft knowledge and have
#      not been converted into any. Where Murch describes what he did on one film without asserting
#      that it generalises, the specific act is recorded as an EXAMPLE inside an object whose claim
#      the source actually makes — never promoted into a principle he did not state.
#
#   3. HEDGES AND ABANDONMENTS ARE PRESERVED. "I don't know whether love is the right word."
#      "Curiously, I wasn't consciously aware of this when I was working on the film." "It is and it
#      isn't." These are recorded in source_uncertainty rather than tidied away, because in a
#      transcript the hedge is often the most accurate part of the claim.

source_id: ondaatje_conversations_third_conversation

