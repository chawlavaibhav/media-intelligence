- sk_id: sk_conv_c003_0014
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: if you are wearing a hat, as soon as you tip the hat slightly back on your head, it gets noticed—you're sending a message via the angle of the hat"
    - "M: I'm using \"hat\" as a metaphor: one moment is always going to be the most revealing, in the best sense, of the inner character, at that point in the film."
    - "M: a look, an aspect, an attitude, a gesture is fortuitously correct or incorrect, and either amplifies or contradicts the message the filmmakers want to convey"
  concept_label: the_hat_metaphor_one_moment_is_always_most_revealing
  label_origin: extractor_assigned
  claim: >
    Murch's metaphor for how small physical details carry meaning. A hat tipped back reads as
    happy-go-lucky, rammed down as unwilling to talk, tipped forward as aggressive; and a tipped-back
    hat will not serve someone trying to be earnest. He states explicitly that "hat" stands for a
    class — a look, an aspect, an attitude, a gesture — each of which is fortuitously correct or
    incorrect and either amplifies or contradicts what the filmmakers intend. His conclusion: one
    moment is always going to be the most revealing of the inner character at that point in the film.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [film_editing, character, performance]
    conditions: "selecting among moments of performance"
  caveats:
