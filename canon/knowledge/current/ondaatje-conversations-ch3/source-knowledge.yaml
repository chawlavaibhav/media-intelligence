- sk_id: sk_conv_c003_0017
  source_id: ondaatje_conversations_third_conversation
  source_terms:
    - "M: the human hunger for mystery: if somebody says, I'm not going to show you what's under my hands, you become fixated on what's under his hands"
    - "M: Even if your hunch is that there's nothing, you won't be satisfied until you've seen what is—or isn't— under his hands."
  concept_label: withholding_fixates_the_audience_regardless_of_what_is_withheld
  label_origin: extractor_assigned
  claim: >
    Murch's account of why a character who reveals nothing becomes magnetic: a declared refusal to
    show fixates the audience on what is being withheld, and the fixation survives the suspicion that
    there is nothing there. The audience will not be satisfied until they have seen what is — or is
    not — being hidden.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The hunger is for the resolution of the concealment, not for its contents. That is why an empty
      hiding place still holds attention.
  scope:
    domain_discussed_by_source: [film_editing, character, narrative]
    conditions: "a character or narrative that declares something withheld"
  caveats:
    - text: "Murch attributes the exploitation of this to the director — \"the very smart thing that Francis exploited\" — rather than to editing"
      origin: source_stated
    - text: "he immediately names the cost: the editors' job \"conversely, was to make things as clear as possible\", because the character's work was hard to understand by its nature. Withholding character and withholding process pull against each other and the source states the tension without resolving it."
