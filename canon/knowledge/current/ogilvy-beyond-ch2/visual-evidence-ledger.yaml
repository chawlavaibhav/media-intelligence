    - chapter: 12 (direct)
      finding: >
        Olympic coins solid-silver offer; handwoven New Mexico ties mail-order; children's
        books offer; Dale Carnegie coupon page; the O&M Direct Response house ad.
    - chapter: 13 (good causes)
      finding: >
        WWF Giant Panda; United Negro College Fund letter; Sierra Club "Should we also flood
