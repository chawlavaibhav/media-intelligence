locator_verification_sample:
  rule: >
    Locators in this extraction are chapter number + title + the book's own section heading.
    Thirteen cited section headings were re-resolved against the unpacked spine documents
    (exceeding the 5-sample minimum): ch7 'Headlines', 'Illustrations', 'Short copy or long?',
    'Layouts', 'Typography', 'Posters', 'Subway cards'; ch8 'Sixteen tips'; ch9 'Alphabet
    soup', 'Container Corporation'; ch10 'Puerto Rico'; ch13 'Teenage alcoholism in Norway',
    'Raising money'.
  outcome: PASS - 13 of 13

central_finding_reclassification: >
  THE RECORDED VISUAL LOSS IS A PROPERTY OF THE EXTRACTION'S TEXT DUMP, NOT OF THIS COPY.
  PROVENANCE.md §7 records that "in this copy those reproductions are absent and replaced by 39
  literal placeholders", with only the Appendix's transcribed text recoverable and "the layout,
  typography and image are not". Unpacking the EPUB shows otherwise: the chapters carry 241
  inline <img> references to 243 image files, which ARE the reproduced advertisements — 54 in
  the print chapter alone — and the 39 "Click here for hi-res image" lines are hyperlinks from
  chapter positions to an Appendix (spine bm2) carrying 39 hi-res duplicates with transcribed
  text. The extraction read a plain-text conversion in which images vanish and only the
  placeholder link-texts survive, so its report was faithful to its representation but wrong
  about the copy. Consequence: the reproduced ads, their layouts and their typography are
  present and legible in this copy, and the inspection below was run directly on them. This
  also bears on the live ch-2 audit's parallel note (an admission-time cross-check for the
  Controller, not something this ledger edits).

inspection:
  method: >
    Every distinct image file referenced by the chapters the extraction drew from was opened
    and identified: ch7 print craft (41 distinct files, all opened), ch8 TV (26, all), ch9
    corporate (12, all), ch10 travel (11, all), ch11 B2B (4, all), ch12 direct (5, all), ch13
    good causes (5, all), ch15 research (11, all) — 115 distinct content images viewed in
    total. The Appendix's 39 hi-res files are duplicates of ads among these and were not
    separately opened. Front-matter/portrait items were identified in passing.
  chapters_covered: [7, 8, 9, 10, 11, 12, 13, 15]
  distinct_images_opened: 115
  figure_rows_by_chapter:
    - chapter: 7 (print craft)
      finding: >
        The full run of classic reproductions is present and legible down to body copy:
        Campbell's "Soup on the rocks"; Dove "Darling, I'm having the most extraordinary
        experience"; Shell "For Minneapolis: 2 below zero!"; VW "Lemon."; Sears "their profit
        is less than 5%" long copy; Rinso "How to take out stains" how-to; Casals Puerto Rico;
        the chef-portrait curiosity pair; Rochas; the Baysol before/after geranium pair;
        Hathaway; Zippo; Caples' "They Laughed When I Sat Down At the Piano"; Ogilvy's own
        Austin "Groton" ad; Chubb ex-safecracker; WWF long copy; Merrill Lynch's 6,450-word
        page; Viyella; Schweppes Whitehead; KLM numbered facts; the editorial-layout run
        (Guinness newspaper pages, advertorials); Sears free-hammer; the Guinness "FOR
        STRENGTH" and Araldite car posters; the typography-sins montage (vertical set type,
        psychedelic layouts, overprint); Porsche/Oldsmobile type-over-image; the Save the
        Children A/B layout pair; and the reverse-type vs black-on-white legibility pair.
    - chapter: 8 (TV)
      finding: >
        Storyboard still-pairs with supers/VO transcribed under each frame: American Express
        "Do you know me?" (Michener); the full Hovis "Boy on the Bike" sequence; Super Glue 3
        ceiling stunt ("filmed without editing") + pack shot; Pepperidge Farm Titus Moody
        wagon and wheat-bread appetite frames; VW's Maxwell Snavely funeral will; Eleanor
        Roosevelt (the margarine celebrity case); Blitz-Weinhard Ottley rancher sequence.
    - chapter: 9 (corporate)
      finding: >
        McGraw-Hill "I don't know who you are" man-in-the-chair; Sears mink; Bethlehem Steel
        "looking for a fight"; Wallachs service ads; General Foods "Sane talk about food";
        Mobil "Windfall profits or windfall tax?"; Sears money-back; IBM New York traffic;
