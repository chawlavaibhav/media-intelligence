  figure_not_inspected_resolution: >
    All 14 objects carrying figure_not_inspected (sk_ogx_0005, 0012, 0013, 0015, 0023, 0026,
    0028, 0029, 0030, 0041, 0044, 0045, 0046, 0057) now have the reproductions behind their
