source_concept_systems:

- scs_id: scs_mb_c001_001
  source_id: molly_bang_picture_this
  label: gravity_derived_emotional_register_of_structure
  label_origin: extractor_assigned

  system_type: interacting_set
  system_type_origin: source_stated

  description: >
    The orientation and vertical placement of shapes — horizontal, vertical, diagonal, upper half,
    lower half — jointly determine a picture's emotional register. The source groups these
    explicitly as the principles arising from gravity and treats them as operating together rather
    than singly.

  whole_system_claim:
    text: >
      The principles in this group are never used one at a time. Every picture uses a combination
      of them, and the addition of each new element can modify the effect of the other elements or
      change them completely. Each principle looks clear considered on its own, but the
      interactions of the parts make the overall effect more complex. The combined structural
      reading is in turn subservient to the picture's context and content.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {section: "The Principles — interlude before the picture-world principles", page_start: 58, page_end: 60}

  members:
    - {sk_ref: sk_mb_c001_0001, role_in_system: dimension, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0002, role_in_system: dimension, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0004, role_in_system: dimension, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0013, role_in_system: dimension, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0014, role_in_system: dimension, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0003, role_in_system: interaction, order: null, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0012, role_in_system: enabling_premise, order: null, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0015, role_in_system: qualifying_corollary, order: null, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0016, role_in_system: whole_system_statement, order: null, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0017, role_in_system: whole_system_statement, order: null, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0018, role_in_system: enabling_premise, order: null, membership_origin: source_stated}

  internal_structure:
    ordering:
      scheme: source_numbered
      origin: source_stated
    dependencies:
      - {from: sk_mb_c001_0013, to: sk_mb_c001_0012, nature: "the upper-half reading presupposes the invisible mid-height division", origin: source_stated}
      - {from: sk_mb_c001_0014, to: sk_mb_c001_0012, nature: "the lower-half reading presupposes the same division", origin: source_stated}
      - {from: sk_mb_c001_0001, to: sk_mb_c001_0018, nature: "the gravity-derived readings presuppose that gravity is read as acting inside the picture", origin: source_stated}
    tradeoffs:
      - between: [sk_mb_c001_0013, sk_mb_c001_0015]
        nature: "the upper half reads as free, light and escaping gravity, and simultaneously carries greater pictorial weight and importance"
        origin: source_stated
        source_ref: {section: "The Principles — principle 4", page_start: 56}
      - between: [sk_mb_c001_0001, sk_mb_c001_0002]
        nature: "stability and calm versus energy and excitement; emphasising one register suppresses the other"
        origin: extractor_inferred
        source_ref: null
    conflicts:
      - between: [sk_mb_c001_0014, sk_mb_c001_0015]
        nature: "low placement reads as heavier, yet high placement is said to carry greater pictorial weight; the source names the appearance of contradiction but does not resolve it"
        origin: source_stated
        source_ref: {section: "The Principles — principle 4", page_start: 56}

  source_warns_against_isolated_use: true
  source_warning_ref: {section: "The Principles — interlude", page_start: 58, quote_paraphrase: "the principles are used not one by one, but always in combination and always in some context"}

  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, repeated_within_source, argued, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: figure_not_inspected
    system_level_uncertainty: >
      Membership and the whole-system claim are both source-stated: the source numbers these
      principles in one series, introduces them as the ones arising from gravity, and states
      directly that they operate only in combination. What is ours is the decision to treat the
      invisible-horizon premise and the gravity-inside-the-picture premise as members rather than
      as background, and the horizontal-versus-vertical trade-off, which the source implies but
      does not state as a trade-off.

  provenance:
    section: "The Principles — principles 1 to 4 and the interlude following them"
    page_start: 42
    page_end: 60
