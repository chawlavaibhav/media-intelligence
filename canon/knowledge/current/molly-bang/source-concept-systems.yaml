- scs_id: scs_mb_c001_002
  source_id: molly_bang_picture_this
  label: frame_centre_and_edge_force_field
  label_origin: extractor_assigned

  system_type: mutual_qualification
  system_type_origin: extractor_inferred

  description: >
    The frame, its centre and its edges act as one field of forces. Where emphasis is placed
    determines simultaneously how strongly the eye is held, how far it travels, whether the picture
    reads as opening into space beyond itself, and how much tension the placement carries. No
    member of this group can be applied without the others also changing.

  whole_system_claim:
    text: >
      Placement within the frame is a single decision with several simultaneous consequences.
      Centring maximises attraction and minimises exploration; displacing emphasis releases eye
      movement but leaves the centre perceptually active; approaching either the centre or the edge
      raises tension; and an element that reaches or crosses the boundary changes how the whole
      picture's depth reads. The source states the central trade-off and the individual effects
      directly, but does not state that they form one field.
    origin: extractor_synthesis
    interpretation_basis: >
      The source states the centre-versus-exploration trade-off explicitly on page 62, states that
      the centre remains perceptually active whatever is done with it on page 64, states the
      edge-and-centre tension claim on page 66, and states on page 66 that covering the single
      frame-breaking element flattens the whole space. Each is stated separately. The claim that
      these constitute one force field with a single placement decision at its centre is ours,
      inferred from the fact that the source's own remedy for one member (move emphasis off centre)
      immediately triggers the others.
    source_ref: null

  members:
    - {sk_ref: sk_mb_c001_0020, role_in_system: causal_premise, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0021, role_in_system: dimension, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0022, role_in_system: stated_goal, order: null, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0023, role_in_system: dimension, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0024, role_in_system: dimension, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_mb_c001_0025, role_in_system: qualifying_corollary, order: null, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0026, role_in_system: causal_premise, order: null, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0027, role_in_system: dimension, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0028, role_in_system: dimension, order: 6, membership_origin: extractor_inferred}
    - {sk_ref: sk_mb_c001_0029, role_in_system: exception_case, order: null, membership_origin: source_stated}
    - {sk_ref: sk_mb_c001_0019, role_in_system: exception_case, order: null, membership_origin: extractor_inferred}

  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - {from: sk_mb_c001_0021, to: sk_mb_c001_0020, nature: "the centre's attraction is attributed to the frame's inward radial force", origin: source_stated}
      - {from: sk_mb_c001_0027, to: sk_mb_c001_0026, nature: "edge tension follows from reading edges as the boundary of the picture-world", origin: source_stated}
      - {from: sk_mb_c001_0021, to: sk_mb_c001_0022, nature: "the trapped eye counts as a problem only against the stated goal of exploration", origin: source_stated}
    tradeoffs:
      - between: [sk_mb_c001_0021, sk_mb_c001_0023]
        nature: "holding the eye at the centre versus releasing it to explore the framed world"
        origin: source_stated
        source_ref: {section: "The Principles — principle 5 preamble", page_start: 62}
    conflicts:
      - between: [sk_mb_c001_0021, sk_mb_c001_0027]
        nature: "the centre is described as the point of greatest attraction where the eye is trapped and held, and separately as a place where proximity raises tension; the source states both and reconciles neither"
        origin: extractor_inferred
        source_ref: null
      - between: [sk_mb_c001_0022, sk_mb_c001_0029]
        nature: "exploration is named as the goal behind most pictures, yet meditation images are said to be centred precisely to prevent the eye moving away"
        origin: extractor_inferred
        source_ref: null

  source_warns_against_isolated_use: false
  source_warning_ref: null

  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, controlled_comparison, argued, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: ocr_degraded
    system_level_uncertainty: >
      Members are individually well supported and the central trade-off is source-stated. The claim
      that all eleven members form one field of forces is ours. Both recorded conflicts are ours to
      name: the source states each side without acknowledging the tension. A reader who disagreed
      that these are one system would still find every member and the trade-off intact.

  provenance:
    section: "The Principles — the picture as a world of its own, principle 5, edges and corners"
    page_start: 60
