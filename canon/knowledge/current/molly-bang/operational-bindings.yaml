# CANON-001 — Molly Bang, "Picture This", pp.42-91
# Operational Bindings created under SPEC-04, derived against SPEC-01 v0.1.
#
# SEQUENCING: this file was written last, after source-knowledge.yaml, source-concept-systems.yaml
# and ontology-mappings.yaml were complete on disk, so that no binding pressure could shape the
# source-faithful passes. See the CANON-001 findings for one disclosed exception: SPEC-01's opening
# section and field names were read during the Phase 0 governance review, before extraction began.
#
# These are OUR interpretations, recorded as ours. None is a claim about what Molly Bang specified.
# All carry status: proposed — nothing here has been reviewed.
#
# ONTOLOGY REFS: SPEC-04's worked examples use `fo_` and `ro_` identifier prefixes that SPEC-05
# does not define. SPEC-05's Layer-1 identifiers are `t_`. This file uses `t_` identifiers from
# ontology-mappings.yaml; the discrepancy is recorded in the CANON-001 findings.

source_id: molly_bang_picture_this
derived_against: {schema: SPEC-01, version: v0.1}

operational_bindings:

# ═════════════════════════════════════════════════════════════
# creative_ir
# ═════════════════════════════════════════════════════════════

- binding_id: bnd_mb_c001_0001
  source_knowledge_refs: [sk_mb_c001_0021, sk_mb_c001_0015, sk_mb_c001_0037, sk_mb_c001_0055]
  source_system_refs: []
  target_type: creative_ir
  target_path: creative.hierarchy
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [diagnoses]
  rationale: >
    The source names four independent determinants of what a viewer notices first and treats as
    important: centre placement, height on the page, relative size, and value contrast against the
    ground. A stated ranking of elements can therefore be checked against where those four
    determinants actually point, and a disagreement between them is detectable rather than a
    matter of taste.
  applicability:
    when: "a Creative IR that declares a ranked hierarchy over resolvable elements, for a still or a frame"
    limits: >
      The source discusses picture-book illustration, where the viewer chooses their own dwell
      time. Whether these determinants hold at the crop, scale and viewing duration of a feed
      creative is untested here. The source also does not say how the four combine when they
      disagree, so this supports flagging a conflict, not resolving one.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mb_c001_0010]
  repair_ontology_refs: [t_mb_c001_0017, t_mb_c001_0018, t_mb_c001_0019, t_mb_c001_0020]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_mb_c001_0002
  source_knowledge_refs: [sk_mb_c001_0050, sk_mb_c001_0028, sk_mb_c001_0010, sk_mb_c001_0049]
  source_system_refs: []
  target_type: creative_ir
  target_path: StaticCreativeExtension.composition
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [derives, diagnoses]
  rationale: >
    SPEC-01's composition field names depth and figure-ground as things it records. The source
    supplies four concrete constructions bearing on both: raising the bases of receding objects,
    letting an element cross the frame boundary, attaching or withholding a baseline, and
    overlapping two objects so they fuse into one unit.
  applicability:
    when: "a still creative, or any single frame, where depth or figure-ground is specified or in question"
    limits: >
      All four are compositional constructions described for hand-made pictures. Whether a
      generative model can be directed to satisfy any of them is a Capability Lab question and is
      not asserted here.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mb_c001_0011, t_mb_c001_0012]
  repair_ontology_refs: [t_mb_c001_0022, t_mb_c001_0023]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_mb_c001_0003
  source_knowledge_refs: []
  source_system_refs: [scs_mb_c001_001, scs_mb_c001_003, scs_mb_c001_004]
  target_type: creative_ir
  target_path: message.emotional_target
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [derives, constrains]
  rationale: >
    Where a Creative IR states an emotional target, three of the source's systems say which
    structural choices support it and which fight it: the orientation and placement register, the
    association account behind shape and size, and the competing readings of ground value. This
    binding references the systems rather than their members, because the source states that the
    principles operate only in combination and that a single added element can change the reading
    entirely — a binding to any one member would assert something the source explicitly denies.
  applicability:
    when: "message.emotional_target is populated and a still or frame composition is being specified"
    limits: >
      The systems tell you which choices push in which direction; they do not quantify how far, and
      the source states the whole structural reading is subservient to context and content. Any use
      of this must remain advisory under SPEC-01's authority tiers, where canon heuristic is tier 6.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_mb_c001_0025]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_mb_c001_0004
  source_knowledge_refs: [sk_mb_c001_0040, sk_mb_c001_0041, sk_mb_c001_0034, sk_mb_c001_0033]
  source_system_refs: []
  target_type: creative_ir
  target_path: creative.visual_language
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [derives, flags]
  rationale: >
    The source's account of colour — association with natural referents, the false but effective
    secondary generalisation, the value-contrast behaviour of bright colours, and the culturally
    variable death associations of black and white — bears on palette selection and, more usefully,
    on flagging when a palette choice will carry a reading nobody asked for.
  applicability:
    when: "a palette is being chosen or reviewed against a stated emotional target or audience"
    limits: >
      The source states the mourning-colour association varies by culture and gives European versus
      Indian and Korean practice as its example, so any use of this against a specified audience
      locale must treat the association as locale-dependent rather than fixed. The source also
      states these secondary associations are factually false while being effective, which limits
      this to predicting viewer response, never to claiming a property of the thing depicted.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mb_c001_0014]
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_mb_c001_0005
  source_knowledge_refs: [sk_mb_c001_0021, sk_mb_c001_0023, sk_mb_c001_0027, sk_mb_c001_0047, sk_mb_c001_0048]
  source_system_refs: [scs_mb_c001_002]
  target_type: creative_ir
  target_path: StaticCreativeExtension.spatial_hierarchy
  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [derives, constrains]
  rationale: >
    Placement within the frame is the field this source addresses most directly. The frame-centre-
    edge system says that a single placement decision simultaneously sets how strongly the eye is
    held, how far it travels, how much tension the placement carries, and how isolated a figure
    reads. Spatial hierarchy is where those consequences are specified rather than discovered.
  applicability:
    when: "spatial arrangement is being specified for a still or a frame"
    limits: >
      The source's own trade-off assumes exploration is a goal. Where it is not — the source names
      images intended as objects of meditation as its exception — the trade-off inverts. Nothing
      here says which of the two a given brief wants.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mb_c001_0010]
  repair_ontology_refs: [t_mb_c001_0017, t_mb_c001_0026]
  status: proposed
  status_reason: "not reviewed"

