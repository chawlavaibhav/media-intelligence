- binding_id: bnd_mb_c001_0006
  source_knowledge_refs: [sk_mb_c001_0021, sk_mb_c001_0015, sk_mb_c001_0037, sk_mb_c001_0055, sk_mb_c001_0034]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  role: [diagnoses, evaluates]
  observation_unit: whole_asset
  rationale: >
    Supports asking whether the element a brief declared most important is in fact the one a viewer
    reaches first. The source supplies four separable determinants to inspect, and one worked case
    in which two small pale elements are noticed before the picture's content is understood at all,
    which is evidence that this can be judged before comprehension rather than after it.
  applicability:
    when: "evaluating a still creative, or a single frame, against a declared hierarchy"
    limits: >
      Requires the whole asset: three of the four determinants are relative properties and cannot
      be assessed from a crop. The source gives no method for combining determinants that disagree.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mb_c001_0010]
  repair_ontology_refs: [t_mb_c001_0017, t_mb_c001_0018, t_mb_c001_0019]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_mb_c001_0007
  source_knowledge_refs: [sk_mb_c001_0042, sk_mb_c001_0043, sk_mb_c001_0054]
  source_system_refs: [scs_mb_c001_005]
  target_type: evaluation
  target_path: null
  role: [diagnoses]
  observation_unit: whole_asset
  rationale: >
    The source states that shared colour groups elements more strongly than shared shape, and that
    the viewer then reads a meaning into whatever has been grouped. This makes an unintended
    relationship between two same-coloured elements a detectable creative defect rather than a
    matter of opinion. The source's closing illustration is a worked case in which colour grouping
    beats a competing shape similarity.
  applicability:
    when: "evaluating whether the relationships a viewer will infer match the relationships the brief intended"
    limits: >
      Requires the whole asset, since grouping is a property of the set. The source notes the
      colour-over-shape dominance is not necessarily the case for small children, so an audience of
      young children is outside the stated scope.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_mb_c001_0008
  source_knowledge_refs: [sk_mb_c001_0010, sk_mb_c001_0028]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  role: [diagnoses, repairs]
  observation_unit: frame
  rationale: >
    Gives a mechanism-level account of an element reading as detached from its scene: a shape with
    no defined ground or baseline attached to it is read as floating. Because the account names the
    cause rather than the symptom, it also names the correction — attach a baseline — rather than
    only reporting that something looks wrong.
  applicability:
    when: "an element is reported as looking detached, pasted on, or not sitting in the scene"
    limits: >
      Assessable within a single frame, unlike most bindings from this source. The source states
      this about a geometric shape in an empty field and does not test it on a photographic or
      rendered scene.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mb_c001_0012, t_mb_c001_0011]
  repair_ontology_refs: [t_mb_c001_0022]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_mb_c001_0009
  source_knowledge_refs: []
  source_system_refs: [scs_mb_c001_001, scs_mb_c001_003, scs_mb_c001_004]
  target_type: evaluation
  target_path: null
  role: [evaluates]
  observation_unit: whole_asset
  rationale: >
    Supports judging whether a creative's structure supports its stated emotional target, by giving
