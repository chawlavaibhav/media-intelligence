- binding_id: bnd_mb_c001_0011
  source_knowledge_refs: [sk_mb_c001_0016, sk_mb_c001_0017]
  source_system_refs: [scs_mb_c001_001]
  target_type: governance
  target_path: null
  governance_consumer: rule_application
  role: [constrains]
  rationale: >
    The source interrupts its own sequence of principles to state that they are used never one by
    one but always in combination and always in some context, that each added element can modify or
    completely change the effect of the others, and that the whole is subservient to content. That
    is an explicit, in-source instruction about whether a principle may be applied in isolation,
    from an author describing their own material — a worked precedent for the question SPEC-04's
    rule_application consumer exists to settle.
  applicability:
    when: "deciding whether a single piece of source knowledge from this source may be applied or retrieved alone"
    limits: >
      The source states this about its own principles. Whether it generalises to other sources is
      not asserted here.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_mb_c001_0012
  source_knowledge_refs: [sk_mb_c001_0041]
  source_system_refs: []
  target_type: governance
  target_path: null
  governance_consumer: evidence_interpretation
  role: [constrains]
  rationale: >
    The source states that colour symbolism rests on a generalisation that is completely false, and
    in the same passage that it works very, very well and is heavily relied on in advertising. It
    holds both without treating the falseness as a defect. That is a precedent for weighting
    evidence: whether a mechanism is factually true and whether it reliably predicts viewer
    response are separate judgements, and a piece of knowledge may fail the first and pass the
    second. Relevant wherever evidence characteristics are being weighed.
  applicability:
    when: "weighing how much a piece of source knowledge should count, where its stated mechanism is doubtful but its predicted effect is reliable"
    limits: >
      A single worked instance from one author about one phenomenon. It shows the distinction is
      real, not how often it applies.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed"

