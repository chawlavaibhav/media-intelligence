- binding_id: bnd_mb_c001_0010
  source_knowledge_refs: [sk_mb_c001_0013, sk_mb_c001_0014, sk_mb_c001_0021, sk_mb_c001_0023, sk_mb_c001_0035, sk_mb_c001_0036, sk_mb_c001_0042]
  source_system_refs: []
  target_type: benchmark
  target_path: null
  role: [derives]
  rationale: >
    The source constructs four near-minimal pairs with a stated expected reading for each: the same
    triangle high versus low in the frame; the same burst centred versus displaced; the same
    landform silhouette pointed versus curved; and the same shape set in one colour versus two.
    Each is a controlled comparison with a predicted viewer response, which is the shape a
    creative-fitness benchmark item needs.
  applicability:
    when: "constructing benchmark items for creative-fitness instruments, or calibrating an evaluator on comparisons with a known expected answer"
    limits: >
      Two of the four pairs are not strictly isolated: the centred-versus-displaced pair also
      changes edge contact and introduces a second focus, and the colour-versus-shape pair does not
      hold shape positions constant. Both are usable as benchmark items only if that is recorded.
      The source's stated expected readings are its own judgements, not measured responses, so they
      are candidate expected answers requiring independent validation — not ground truth.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed; flagged CROSS_STREAM in the CANON-001 Controller Brief"

