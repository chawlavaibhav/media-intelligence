- sk_id: sk_mb_c001_0045
  source_id: molly_bang_picture_this
  source_terms:
    - "We notice contrasts, or, put another way, contrast enables us to see."
    - "Pictures - and human perceptions - are based on contrasts."
  concept_label: contrast_enables_perception
  label_origin: extractor_assigned
  claim: >
    Contrast is what enables us to see. It may be contrast between colours, shapes, sizes,
    placement or combinations of these, and it is the contrast that allows both patterns and
    individual elements to be perceived at all. The source presents this as the last principle,
    involving combinations of all the others and perhaps the most basic to survival and to our way
    of understanding the world and pictures.
