- sk_id: sk_mb_c001_0013
  source_id: molly_bang_picture_this
  source_terms:
    - "The upper half of a picture is a place of freedom, happiness, and triumph; objects placed in the top half often feel more spiritual."
  concept_label: upper_half_reads_as_free_happy_triumphant
  label_origin: extractor_assigned
  claim: >
    Objects placed in the upper half of a picture are read as freer, happier and more triumphant,
    and often as more spiritual. A viewer identifying with an object in the upper half tends to
    feel lighter and gayer.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Two mechanisms are given. Tactically, being high up is a stronger position: the viewer can
      see enemies and throw things down on them, whereas down low one cannot see far and things
      might fall and crush. Gravitationally, objects higher up give a sense of floating, flying or
      otherwise escaping the pull of the earth.
  scope:
    domain_discussed_by_source: [picture_book_illustration]
    conditions: "objects placed above the invisible mid-height division of the frame"
  caveats:
    - text: "the source notes that when people are said to be high it implies they may eventually have a terrible downer when they come back to earth"
      origin: source_stated
    - text: "the corroborating evidence is a list of English idioms (top of the charts, top dog, top-drawer, things are looking up), so the support offered is specific to English usage even though the claim is stated generally"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a small red triangle placed in the upper left area of an otherwise empty white field", figure_ref: p55}
  intra_source_relations:
    - {relation: contradicts, target: sk_mb_c001_0014, note: "presented as opposite halves of one division"}
    - {relation: qualified_by, target: sk_mb_c001_0017, note: "the source states the high-low reading is subservient to context and content"}
