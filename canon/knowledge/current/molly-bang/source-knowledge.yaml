- sk_id: sk_mb_c001_0041
  source_id: molly_bang_picture_this
  source_terms:
    - "These secondary associations are completely false, but we make them all the time."
    - "Color symbolism is based on a false generalization. It also works - very, very well."
  concept_label: colour_symbolism_is_a_false_generalisation_that_still_works
  label_origin: extractor_assigned
  claim: >
    Beyond associating a colour with its natural referent, we further assume that anything sharing
    that colour also has the referent's inherent qualities — a white swan seeming purer than a
    mallard, a red rose more expressive of love than a pink one, a black crow nastier than a
    cuckoo. The source states these secondary associations are completely false, that we make them
    constantly, and that colour symbolism, though based on a false generalisation, works very well
    and is heavily used in advertising, propaganda and visual fabrication.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An over-extension of the natural-constant associations: just as we assume all pointed shapes
      are sharp, we assume everything of a given colour carries that colour's referent qualities.
  scope:
    domain_discussed_by_source: [picture_book_illustration]
    conditions: "any use of colour symbolism"
  caveats:
    - text: "the source names advertising, propaganda and all visual fabrications as the fields where this is most powerfully used, and does not treat the falseness as a reason not to use it"
      origin: source_stated
    - text: "this is one of the few places where the source marks one of its own mechanisms as factually false while affirming that it works"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
