- sk_id: sk_mb_c001_0044
  source_id: molly_bang_picture_this
  source_terms:
    - "This page represents a situation that I'm not clear enough about to give a name to or call a principle, but that I can see working."
    - "Life needs a mixture."
  concept_label: both_perfect_regularity_and_confusion_are_distressing
  label_origin: extractor_assigned
  claim: >
    The eye searches for repetitive patterns in order to make sense of what it sees, and notices
    both repetition amid confusion and breaks in a repetitive pattern. Some repetition gives a
    sense of security; confusion is frightening for most viewers. But perfect, relentless
    repetition is perhaps even more horrifying in its monotony than confusion, because it implies
    a cold, unfeeling, mechanical mind, and such patterns do not exist in nature. Either extreme
    is terrifying, and feeling seems to be elicited by the proportion of regularity to irregularity.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Perfect regularity implies a cold, unfeeling, mechanical mind, and does not occur in nature
      because there are too many forces working against each other.
  scope:
    domain_discussed_by_source: [picture_book_illustration]
    conditions: "patterns formed by other picture elements, at either extreme of regularity"
  caveats:
    - text: "the source explicitly declines to name this or call it a principle, saying it is not clear enough about the situation, while stating that it can see it working"
      origin: source_stated
    - text: "the source says its own question is hampered by the ideas of perfect regularity and perfect chaos, and poses the alternative framings regularity and irregularity, order and disorder as open"
      origin: source_stated
    - text: "the supporting case is literary rather than pictorial: a remark by the novelist Ryunosuke Akutagawa that the worst hell would be an unending forest of cherry trees in full bloom"
      origin: extractor_observed
    - text: "the regular-pattern demonstration referenced by the text survives in the available scan only as a row of bullet characters, which reads as a printed regular dot grid but was not available as a rendered figure; only the irregular composition was inspected"
      origin: extractor_observed
  source_stated_problems:
    - "confusion is more frightening for most of us; we say we are disoriented"
    - "continual, relentless repetition is perhaps even more horrifying in its monotony than confusion"
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a densely irregular black-and-white composition of broken dashes and jagged forms", figure_ref: p79}
  intra_source_relations:
    - {relation: depends_on, target: sk_mb_c001_0045, note: "the source states it is contrast that enables us to see both patterns and elements, so perceiving pattern at all presupposes it"}
  evidence:
