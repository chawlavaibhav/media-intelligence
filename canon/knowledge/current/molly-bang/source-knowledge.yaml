  concept_label: spatial_separation_reads_as_elapsed_time
  label_origin: extractor_assigned
  claim: >
    Distance between two objects is read as time between them. A threat placed right next to its
    victim is less frightening because there is no time for the victim to move and no time for the
    viewer to be scared; the same threat placed far away gives the viewer time to be afraid.
  claim_type: explicit_source_claim
