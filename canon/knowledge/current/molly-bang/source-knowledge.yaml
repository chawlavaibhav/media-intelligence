- sk_id: sk_mb_c001_0001
  source_id: molly_bang_picture_this
  source_terms:
    - "Smooth, flat, horizontal shapes give us a sense of stability and calm."
    - "islands of calm"
  concept_label: horizontal_emphasis_reads_as_stable_and_calm
  label_origin: extractor_assigned
  claim: >
    Shapes that lie flat and horizontal are read as stable and calm. A picture whose overall
    structure emphasises the horizontal generally reads as stable and calm; smaller horizontally
    oriented shapes inside a picture act as local pockets of the same quality.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The source attributes this to gravity and to bodily association: horizontal shapes are
      associated with the surface of the earth and the horizon line, humans are most stable when
      horizontal because they cannot fall down, and shapes that lie horizontal look secure because
      they will not fall on the viewer either.
  scope:
    domain_discussed_by_source: [picture_book_illustration]
    conditions: "pictures whose structure emphasises horizontal shapes; also smaller horizontal shapes within any picture"
  caveats:
    - text: "the source presents this as the first of a family of gravity-derived principles, not as an isolated rule"
      origin: source_stated
    - text: "the supporting example (Little Red Riding Hood as a triangle with a wide flat base) refers back to material outside the extracted page range and was not inspected"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "white field above a solid dark horizontal band occupying the lower portion of the frame", figure_ref: p43}
  intra_source_relations:
    - {relation: contradicts, target: sk_mb_c001_0002, note: "the source presents horizontal and vertical emphasis as opposite emotional registers"}
    - {relation: qualified_by, target: sk_mb_c001_0003, note: "a horizontal placed across verticals restores the stable reading"}
  evidence:
    characteristics:
      - explicitly_stated
      - visually_demonstrated
      - argued
      - mechanism_given
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: null
    section: "The Principles — principle 1"
    page_start: 42
    page_end: 43
    figure_refs: [p43]
    source_support: text_and_visual
    inspected:
      text: true
      figures: [p43]

