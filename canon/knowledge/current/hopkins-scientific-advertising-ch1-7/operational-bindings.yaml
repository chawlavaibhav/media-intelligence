  governance_consumer: conflict_resolution
  role: [flags]
  rationale: >
    The source states that what a person perceives in a product is set by what they were told to
    notice beforehand, and applies it to identical articles. Read against a system that asks human
    reviewers to judge generated assets, this is a stated reason why a reviewer's expectation can
    determine the judgement, and therefore why a disagreement between two reviewers may be a
    difference in what each was told rather than in what they saw. It is recorded as a flag on how
    such disagreements should be read, not as a repair.
  applicability:
    when: "reconciling conflicting human judgements about the same generated asset"
    limits: >
      The source's own support is a hypothetical five-article example that was not run, plus an
      argument from mental impression affecting health. This is a hypothesis to hold, not a finding
      to act on.
