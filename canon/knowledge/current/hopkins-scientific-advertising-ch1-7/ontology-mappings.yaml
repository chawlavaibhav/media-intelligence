concepts:

- concept_id: sc_hop_sa_traced_return_method
  kind: source_specific_concept
  origin_ref: hopkins_scientific_advertising_ch1_7
  label: the_traced_return_method
  children_terms: [t_hop_sa_0016, t_hop_sa_0017, t_hop_sa_0018, t_hop_sa_0019, t_hop_sa_0022, t_hop_sa_0001, t_hop_sa_0002, t_hop_sa_0035, t_hop_sa_0034]
  origin: source_stated
  basis: >
    Chapter 1 exists to define this apparatus and names its parts in one passage — keyed
    advertising, traced returns, coupons, cost per customer, town comparison, the abolition of
    guesswork, and the promotion of a winning method to a fixed principle. Chapter 4 adds mail order
    as the setting where it works best. The grouping is the source's own.
  asserts_agreement_between_sources: false

- concept_id: sc_hop_sa_salesmanship_standard
  kind: source_specific_concept
  origin_ref: hopkins_scientific_advertising_ch1_7
  label: the_salesmanship_standard
  children_terms: [t_hop_sa_0032, t_hop_sa_0033, t_hop_sa_0025, t_hop_sa_0020, t_hop_sa_0012, t_hop_sa_0014, t_hop_sa_0006, t_hop_sa_0007, t_hop_sa_0031]
  origin: source_stated
  basis: >
    The source generalises its own vocabulary here: advertising is salesmanship-in-print, it is
    multiplied salesmanship, the way to settle a question is the salesman test, and the named faults
    are all failures to behave as a salesman would. Chapter 2 states the generalisation explicitly
    and chapter 3 reopens it with "Here again is salesmanship."
  asserts_agreement_between_sources: false

- concept_id: sc_hop_sa_specificity_doctrine
  kind: source_specific_concept
  origin_ref: hopkins_scientific_advertising_ch1_7
