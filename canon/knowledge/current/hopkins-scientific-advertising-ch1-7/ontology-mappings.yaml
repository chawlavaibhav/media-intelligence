terms:

# ── problems ────────────────────────────────────────────────────────────────
- term_id: t_hop_sa_0001
  term: guesswork
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    Choosing between advertising options without a measured comparison. The source uses the word
    three times in this section — "So no guesswork is permitted", "All guesswork is eliminated",
    "Guesswork is very expensive" — and treats it as the condition the traced-return method exists
    to abolish.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "1, 2, 4", locator: "chapters 1, 2 and 4"}
  arising_from: [sk_hop_sa_0002, sk_hop_sa_0015, sk_hop_sa_0021]

- term_id: t_hop_sa_0002
  term: untraced_campaign
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    A campaign that runs without a key on returns, so nobody can discover whether it is the cheap
    version or the expensive one. The source's phrase is "countless untraced campaigns where a whim
    of that kind costs half the advertising money without a penny of return."
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {chapter: "4", locator: "the incubator case"}
  arising_from: [sk_hop_sa_0023, sk_hop_sa_0026]

- term_id: t_hop_sa_0003
  term: blind_headline
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    A headline that does not say who the advertisement is for. It may attract many times as many
    readers, but mostly people who could never buy, while the intended buyers never realise the
    advertisement concerns them.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "5", locator: "Headlines"}
  arising_from: [sk_hop_sa_0032]

- term_id: t_hop_sa_0004
  term: platitudes_and_generalities
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    Claims stated so generally that they carry no information — "Best in the world", "Lowest prices
    in existence", "Pure". They "roll off the human understanding like water from a duck" and leave
    no impression, and superlatives of the kind also lead readers to discount the advertiser's
    other statements.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "7", locator: "Being Specific, opening"}
  arising_from: [sk_hop_sa_0050]

- term_id: t_hop_sa_0005
  term: claiming_the_expected
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    Asserting the attribute every product in the category is already assumed to have, so the claim
    distinguishes nothing. The source's own phrase for what a superlative amounts to.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "7", locator: "Being Specific"}
  arising_from: [sk_hop_sa_0050, sk_hop_sa_0053]

- term_id: t_hop_sa_0006
  term: seeking_applause_instead_of_sales
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    The writer abandoning the salesman's part to perform. "They forget they are salesmen and try to
    be performers. Instead of sales, they seek applause." Named by the source as one of the greatest
    advertising faults.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "2", locator: "Just Salesmanship"}
  arising_from: [sk_hop_sa_0016]

- term_id: t_hop_sa_0007
  term: written_to_please_the_seller
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    An advertisement organised around the advertiser's interests rather than the buyer's. "The
    interests of the buyer are forgotten. One can never sell goods profitably, in person or in
    print, when that attitude exists."
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {chapter: "2", locator: "chapter close"}
  arising_from: [sk_hop_sa_0016, sk_hop_sa_0017]

- term_id: t_hop_sa_0008
  term: useless_pictures
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    Pictures used "merely to decorate or interest", which occupy paid space without carrying any
    part of the sale. Contrasted with mail order pictures, which are "salesmen in themselves" and
    "earn the space they occupy".
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "4", locator: "pictures"}
  arising_from: [sk_hop_sa_0026]

- term_id: t_hop_sa_0009
  term: unoccupied_space
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    Space paid for and not used to sell — borders, margins, enlarged type, half-page copy set in a
    page. "Remember that when you are tempted to leave valuable space unoccupied."
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {chapter: "4", locator: "what mail order practice shows"}
  arising_from: [sk_hop_sa_0024, sk_hop_sa_0028]

- term_id: t_hop_sa_0010
  term: substitution
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    A dealer supplying a different brand when the buyer asks for the advertised one. The source
    reports that warning buyers against it — "Look out for substitutes", "Be sure you get this
    brand" — had no effect, because those are selfish appeals.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "6", locator: "Psychology"}
  arising_from: [sk_hop_sa_0044]

- term_id: t_hop_sa_0011
  term: cheapened_by_giving_it_away
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    Destroying a product's price in the buyer's mind by handing it over free. "He cheapened his
    product by giving a 15-cent package away... It is hard to pay for an article which has once been
    free. It is like paying railroad fare after traveling on a pass."
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {chapter: "6", locator: "the two food advertisers"}
  arising_from: [sk_hop_sa_0045]

- term_id: t_hop_sa_0012
  term: driving_people_to_the_stores
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    The advertiser's own phrase, quoted by the source as the mark of the wrong attitude: treating
    buyers as something to be pushed. "People can be coaxed but not driven."
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "3", locator: "Offer Service, close"}
  arising_from: [sk_hop_sa_0020]

- term_id: t_hop_sa_0013
  term: the_reader_forgets_the_decision
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    A reader decides to act on an advertisement and has forgotten within five minutes, because the
    magazine's own content reclaims his attention. "A large percentage of people who read an ad and
    decide to act will forget that decision in five minutes."
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {chapter: "4", locator: "the coupon"}
  arising_from: [sk_hop_sa_0025]

- term_id: t_hop_sa_0014
  term: revealing_the_hook
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    Letting the selling technique become visible, so the reader attends to the attempt rather than
    the merits. "They reveal the hook. Any studied attempt to sell, if apparent, creates
    corresponding resistance."
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "2", locator: "on ad-writing"}
  arising_from: [sk_hop_sa_0011]

- term_id: t_hop_sa_0015
  term: the_cost_of_our_pride
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: problem
  definition_in_origin_frame: >
    The measurable premium an advertiser pays for departing from proved practice in order to satisfy
    taste or self-regard. The source does not forbid the departure; it insists the price be known.
    "Let us know the cost of our pride."
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "4", locator: "chapter close"}
  arising_from: [sk_hop_sa_0030]

# ── remedies ────────────────────────────────────────────────────────────────
- term_id: t_hop_sa_0016
  term: keyed_advertising
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Marking each version of an advertisement so the responses it produces can be attributed to it
    alone, which is what makes one version comparable with another.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "1", locator: "How Advertising Laws Are Established"}
  arising_from: [sk_hop_sa_0002]

- term_id: t_hop_sa_0017
