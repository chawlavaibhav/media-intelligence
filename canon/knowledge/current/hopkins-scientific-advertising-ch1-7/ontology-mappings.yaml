  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Putting the goods in the buyer's hands before any payment or obligation, to be kept or returned
    as the buyer wishes. "Use them a week, then do as you wish." The stronger variant the source
    prefers is "Pay in a week if you like them" rather than a money-back promise.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {chapter: "3, 6", locator: "Offer Service; Psychology"}
