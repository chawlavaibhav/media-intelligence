  arising_from: [sk_hop_sa_0003]

- term_id: t_hop_sa_0019
  term: town_by_town_comparison
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Comparing one method against another by running them in different towns and measuring cost of
    sales in each, used where no direct return can be traced.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {chapter: "1", locator: "chapter 1"}
  arising_from: [sk_hop_sa_0004]

- term_id: t_hop_sa_0020
  term: offer_service
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Building the advertisement entirely on what the reader gets — wanted information, advantages to
    the user, a sample, a first package, goods on approval — rather than on a request for the
    reader's trade. The source's chapter title.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "3", locator: "Offer Service"}
  arising_from: [sk_hop_sa_0017, sk_hop_sa_0018]

- term_id: t_hop_sa_0021
