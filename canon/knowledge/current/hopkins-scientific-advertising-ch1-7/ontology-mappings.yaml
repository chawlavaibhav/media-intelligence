relationships:

- from: t_hop_sa_0001
  to: t_hop_sa_0002
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked because the source uses them almost interchangeably and they invite merging. They are
    different failures with different repairs. Guesswork is choosing without evidence; an untraced
    campaign may have been chosen on good grounds and simply never measured afterwards. The repair
    for the first is comparison before the decision; the repair for the second is a key on returns
    after it. Recording the split because collapsing them makes "measure it" look like a single act.

- from: t_hop_sa_0003
  to: t_hop_sa_0004
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Both are vague copy and both attract nobody worth having, which is why the similarity was
    examined. They fail differently. A blind headline fails by selecting the wrong readers, so the
    argument beneath it is never read by anyone who could buy. A platitude fails by being read and
    discounted, and it damages the credibility of the specific claims around it. The first is a
    targeting failure, the second a credibility failure, and the source gives them different
    remedies — hail those people only, and be specific.

- from: t_hop_sa_0021
  to: t_hop_sa_0011
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    The most useful negative finding in this source. Sending goods on approval and giving a package
    away are both "let the buyer have it for nothing", and the source's own chapters 3 and 6 sit on
    opposite sides of that resemblance. Hopkins distinguishes them: on approval the article keeps
    its price and the buyer expects to pay if he keeps it; given away, the article's price becomes
    zero and, in the reported case, the advertiser lost part of the trade he already had. Same
    surface act, opposite effect on perceived value.

- from: t_hop_sa_0016
  to: t_hop_sa_0017
  relation: related_to
  confidence_basis: source_stated
  note: >
    Keyed advertising is the apparatus and traced returns are the data it produces; the source uses
    them in one breath. The reading intended here is that one is narrower than the other, but
    `related_to` is used rather than `broader_than`/`narrower_than` because promoting a relation
    beyond the two this worker may set locally would be assuming an authority it does not have. The
    intended reading is recorded in this note instead.

- from: t_hop_sa_0004
  to: t_hop_sa_0005
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source treats claiming the expected as what a platitude amounts to in a category where every
    competitor could say the same thing. Connected but not identical: a platitude can also be vague
    about something no competitor claims.

- from: t_hop_sa_0006
  to: t_hop_sa_0007
  relation: related_to
  confidence_basis: source_stated
  note: >
    Both are the advertisement serving somebody other than the buyer, and the source states them in
    consecutive paragraphs. They are kept separate because the beneficiary differs: applause-seeking
    serves the writer's reputation, seller-pleasing serves the client's self-image.

- from: t_hop_sa_0020
  to: t_hop_sa_0012
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source sets these against each other directly — offering service against driving people to
    the stores — as the right and wrong attitudes to the same task. Recorded as related because the
    ontology has no opposition relation and inventing one is not permitted here.

- from: t_hop_sa_0008
  to: t_hop_sa_0009
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    A useless picture is one form of unoccupied space in the source's accounting — space paid for
    that does no selling. The incubator case is exactly this: 50 per cent more space, no more sales.
    Kept as separate terms because unoccupied space also covers borders, margins and oversized type,
    which are not pictures.

- from: t_hop_sa_0013
  to: t_hop_sa_0022
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source states the coupon exists because the reader forgets. Problem and remedy, stated
