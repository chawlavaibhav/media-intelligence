  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    The recorded responses themselves, followed back to the advertisement that produced them.
    "Mail order advertising is traced down to the fraction of a penny."
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {chapter: "1", locator: "How Advertising Laws Are Established"}
  arising_from: [sk_hop_sa_0002, sk_hop_sa_0021]

- term_id: t_hop_sa_0018
  term: cost_per_customer
  origin: source
  origin_ref: hopkins_scientific_advertising_ch1_7
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    The measure the source says all final conclusions must rest on — cost per customer or cost per
