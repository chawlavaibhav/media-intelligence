  children_terms: [t_hop_sa_0024, t_hop_sa_0004, t_hop_sa_0005, t_hop_sa_0036]
  origin: source_stated
  basis: >
    Chapter 7 defines the pairing itself: platitudes and superlatives on one side, definite
    statements and figures on the other, with mental impression supplying why a stated quality is
    then found. The grouping is the chapter's own structure.
  asserts_agreement_between_sources: false

- concept_id: sc_hop_sa_spending_without_knowing
  kind: source_specific_concept
  origin_ref: hopkins_scientific_advertising_ch1_7
  label: advertising_money_spent_without_knowing_what_it_bought
  children_terms: [t_hop_sa_0001, t_hop_sa_0002, t_hop_sa_0015, t_hop_sa_0008, t_hop_sa_0009]
  origin: extractor_inferred
  basis: >
    Guesswork, the untraced campaign, the cost of pride, useless pictures and unoccupied space are
    all the same underlying condition in this source — money committed with no way of knowing what
    it returned — and the incubator case is offered as its worked instance. The source states each
    separately across chapters 1, 2 and 4 and never groups them, so the grouping is ours. It is
    recorded because it is the concept the book's whole argument is aimed at, and because the cost
    of pride is the one member the source treats as acceptable rather than as an error.
  asserts_agreement_between_sources: false
