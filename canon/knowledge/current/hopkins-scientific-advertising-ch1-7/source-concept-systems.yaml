- scs_id: scs_hop_sa_003
  source_id: hopkins_scientific_advertising_ch1_7
  label: the_mail_order_copy_prescriptions
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    The concrete copy rules chapter 4 draws from mail order practice: small type, every line
    utilised, no borders, no palaver or entertainment, a coupon because readers forget, pictures
    that earn their space, the complete story, returns that scale with fully used space, and the
    long-running unchanged advertisement as the model — closed by the concession that advertisers
    routinely depart from all of it for pride, and should at least price the departure.
  whole_system_claim:
    text: >
      These are not independent craft preferences. Every one of them is warranted by the same
      argument — that mail order advertising is continuously measured, so whatever mail order
      advertisers do universally has been selected by results — and each is therefore only as sound
      as that argument is.
    origin: extractor_synthesis
    interpretation_basis: >
      The source states each prescription separately and repeats the phrase "in mail order
      advertising" at the head of most of them, and it states the warrant once at the start of the
      chapter. It never says that the prescriptions stand or fall together. Grouping them by their
      shared warrant is ours, and it is the property that matters, because the warrant is inference
      from observed practice rather than a reported comparison — only the incubator picture case
      carries an actual before-and-after result.
    source_ref: null
  members:
    - {sk_ref: sk_hop_sa_0024, role_in_system: prescription_and_warrant, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0025, role_in_system: prescription, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0026, role_in_system: prescription, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0027, role_in_system: prescription, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0028, role_in_system: prescription, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0029, role_in_system: model_case, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0030, role_in_system: concession, order: 7, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies:
      - {from: sk_hop_sa_0024, to: sk_hop_sa_0021, nature: "the whole set is warranted by mail order being measured", origin: source_stated}
      - {from: sk_hop_sa_0028, to: sk_hop_sa_0024, nature: "the scaling claim restates the space-utilisation prescription", origin: source_stated}
    tradeoffs:
      - between: [sk_hop_sa_0024, sk_hop_sa_0030]
        nature: "follow the proved form and lose the advertiser's pride, or depart from it and pay a known premium in selling cost"
        origin: source_stated
        source_ref: {chapter: "4", locator: "chapter close, 'let us know the cost of our pride'"}
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, controlled_comparison, mechanism_given]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: none
    system_level_uncertainty: >
      Membership is the source's own. The claim that the set shares one warrant and therefore one
      failure mode is ours. A schema note belongs here: what unifies these members is neither
      interaction, nor ordering, nor causation, but a common evidential warrant. `interacting_set`
      is the least assumptive available system_type and it is not an accurate description. Recorded
      here and in the lane issue file rather than resolved, because the schema is frozen.
  provenance:
    chapter: "4"
    section: "Mail Order Advertising—What It Teaches"
    page_start: 12
    page_end: 14
    source_support: text

