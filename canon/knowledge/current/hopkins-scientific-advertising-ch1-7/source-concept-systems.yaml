- scs_id: scs_hop_sa_005
  source_id: hopkins_scientific_advertising_ch1_7
  label: specificity_as_a_credibility_mechanism
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: source_stated
  description: >
    Chapter 7's chain: readers grant selling talk a licence, so generalities and superlatives carry
    no weight and also discredit everything beside them; a specific claim removes the licence
    because it is either true or a lie and the advertiser is assumed not to be able to lie; a
    definite figure additionally makes the reader infer that tests were made; therefore stating an
    ordinary shared attribute in specific detail claims it for whoever states it first; and none of
    this costs additional space.
  whole_system_claim:
    text: >
      Belief in an advertising claim is produced by its checkability rather than by its content, so
      the same argument gains or loses most of its force according to how definitely it is stated.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {chapter: "7", section: "Being Specific", page_start: 22, page_end: 24}
  members:
    - {sk_ref: sk_hop_sa_0050, role_in_system: negative_half, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0051, role_in_system: positive_half_and_mechanism, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0052, role_in_system: secondary_inference, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0053, role_in_system: application, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_hop_sa_0054, role_in_system: economic_corollary, order: 5, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: causal, origin: source_stated}
    dependencies:
      - {from: sk_hop_sa_0051, to: sk_hop_sa_0050, nature: "specificity works by removing the licence that makes generalities worthless", origin: source_stated}
      - {from: sk_hop_sa_0052, to: sk_hop_sa_0051, nature: "the inference that tests were made is a further effect of definiteness", origin: source_stated}
      - {from: sk_hop_sa_0053, to: sk_hop_sa_0052, nature: "the brewer's process detail works because it reads as knowledge nobody else supplied", origin: extractor_inferred}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, anecdotal, outcome_claimed, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The chain is the source's own and is stated in order. One system-level observation is ours and
      is the most consequential thing in this extraction: this system says that a definite figure
      makes a reader infer that measurement happened, and that the impression of testing is what
      does the persuasive work. The book itself is written to that rule. Its own specific figures —
      85 cents, $14.20, 41 cents, 250,000, nine times in ten, two thousand headlines, five to ten
      times, exactly 50 per cent — are supplied without the measurements behind them. The source
      therefore describes, as a technique, the exact mechanism by which its own evidential
      authority is produced. That is an observation about the text, not an accusation that the
      measurements were not made; whether they were is NOT VERIFIED and cannot be settled from
      chapters 1-7.
  provenance:
    chapter: "7"
    section: "Being Specific"
    page_start: 22
    page_end: 24
    source_support: text
