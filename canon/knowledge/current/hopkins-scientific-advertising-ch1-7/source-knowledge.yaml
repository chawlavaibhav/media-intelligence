      origin: source_stated
    - text: >
        This is the book's foundational claim and the section supplies no instance of a law, a
        dataset, a test protocol, a sample size or a result to support it. The support offered is
        the author's assertion that agencies have tested and recorded. Chapters 1-7 name three
        cost-per-reply figures, one before-and-after picture test and one aggregate headline
        result; none is attributed to a named product, date or advertiser, and none is replicated.
      origin: extractor_observed
    - text: >
        The gravitation comparison is a simile in a sentence about the necessity of laws, not a
        claim that a specific advertising law has gravitation's evidential standing. Recorded so
        the figure of speech is not read as a stronger claim than the source makes.
      origin: extractor_observed
