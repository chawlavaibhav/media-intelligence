- sk_id: sk_hop_sa_0031
  source_id: hopkins_scientific_advertising_ch1_7
  source_terms:
    - "The salesman is there to demand attention. He cannot well be ignored. The advertisement can be ignored."
    - "The purpose of a headline is to pick out people you can interest."
    - "Then create a headline which will hail those people only."
  concept_label: a_headline_selects_the_readers_the_advertisement_can_interest
  label_origin: extractor_assigned
  claim: >
    The difference between advertising and personal salesmanship lies largely in personal contact:
    the salesman is present and cannot well be ignored, the advertisement can be. But the salesman
    also wastes much of his time on prospects he could never interest and cannot pick them out,
    while an advertisement is read only by interested people who choose to read it. The purpose of a
    headline is therefore to pick out the people the advertiser can interest, and to hail those
    people only — as one would call a particular person's name across a crowd.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
