    from before he can hope for success, because there cost and result are immediately apparent and
    the advertising is visibly profitable or not on the face of the returns. All guesswork is
    eliminated, every mistake is conspicuous, and the man is taught efficiency and economy under a
    master who cannot be fooled. Only then is he likely to apply the same principles and keys to all
    advertising. The source calls mail order advertising the court of last resort.
