- sk_id: sk_hop_sa_0051
  source_id: hopkins_scientific_advertising_ch1_7
  source_terms:
    - "But a man who makes a specific claim is either telling the truth or a lie. People do not expect an advertiser to lie. They know that he can't lie in the best mediums."
    - "So a definite statement is usually accepted. Actual figures are not generally discounted. Specific facts, when stated, have their full weight and effect."
    - "The weight of an argument may often be multiplied by making it specific."
  concept_label: a_specific_claim_is_believed_because_it_could_be_caught_being_false
  label_origin: extractor_assigned
  claim: >
    A specific claim is believed because it is either true or a lie, with no middle ground, and
    readers do not expect an advertiser to lie — they know he cannot lie in the best media. Definite
    statements are therefore usually accepted, actual figures are not generally discounted, and
    specific facts carry their full weight. The weight of an argument may often be multiplied by
    making it specific: a tungsten lamp said to give "more light" leaves doubt, while one said to
    give three and one-third times the light is believed; "Our prices have been reduced" makes no
    marked impression while "Our prices have been reduced 25 per cent" gets the full value of the
    announcement.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
