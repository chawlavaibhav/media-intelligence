- sk_id: sk_hop_sa_0053
  source_id: hopkins_scientific_advertising_ch1_7
  source_terms:
    - "All the claims were such as any brewer might have made. They were mere essentials in ordinary brewing. But he was the first to tell the people about them, while others cried merely \"pure beer.\""
    - "He made the greatest success that was ever made in beer advertising."
  concept_label: being_first_to_state_an_ordinary_process_fact_claims_it
  label_origin: extractor_assigned
  claim: >
    Stating an ordinary, universally shared attribute in specific detail claims it for the
    advertiser who states it first. The source reports that in an era when all beers were advertised
    as "Pure" — a claim that made no impression, and the bigger the type the bigger the folly — one
    brewer instead described a plate-glass room where the beer was cooled in filtered air, a
    white-wood-pulp filter every drop passed through, bottles washed four times by machinery, a
    4,000-foot well for pure water, 1,018 experiments to obtain the yeast and the single mother cell
    all yeast came from. All of these were mere essentials of ordinary brewing that any brewer could
    have claimed, but he was first to tell people about them, and the source says he made the
    greatest success ever made in beer advertising. It gives a second case: "Used the world over"
    against "Used by the peoples of 52 nations", which many others then followed.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The attribute is common but the telling is not, so the advertiser who describes it first is
      the one credited with it.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "categories where all competitors share an unstated process or attribute"
  caveats:
    - text: >
        The outcome is asserted at superlative strength — "the greatest success that was ever made
        in beer advertising" — with no figures, date or brand named.
      origin: extractor_observed
    - text: >
        The claim that rivals cannot recover the position by saying the same thing later is implied
        rather than argued, and the 52-nations case immediately reports that many others did follow.
      origin: extractor_observed
  source_stated_problems:
