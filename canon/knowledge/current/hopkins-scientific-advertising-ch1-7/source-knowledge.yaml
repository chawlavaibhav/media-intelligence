- sk_id: sk_hop_sa_0054
  source_id: hopkins_scientific_advertising_ch1_7
  source_terms:
    - "One statement may take as much room as another, yet a definite statement be many times as effective. The difference is vast."
    - "If a claim is worth making, make it in the most impressive way."
    - "Salesmanship-in-print is very expensive. Every word you use may cost $10 to insert."
  concept_label: specificity_is_free_because_a_definite_statement_occupies_the_same_space
  label_origin: extractor_assigned
  claim: >
    A definite statement occupies no more room than a vague one, yet may be many times as effective,
    so specificity is obtained at no cost in space. Since salesmanship-in-print is expensive — the
    source repeats that every word may cost $10 to insert — and a salesman's loose talk matters
    little while talking to millions at that cost does not, any claim worth making should be made in
    the most impressive way.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: "Cost is paid per unit of space, and specificity does not consume additional space."
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "paid print advertising"
  caveats:
    - text: >
        Recorded as a separate object from the believability claim because it is an economic
        argument that could hold or fail independently — a definite statement could be equally
        effective and still be worth making, or ineffective and still be free. It is a borderline
        granularity call and could defensibly have been folded into the specificity claim itself.
      origin: extractor_observed
    - text: >
        "Many times as effective" repeats the chapter's central claim without adding evidence for it.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "If a claim is worth making, make it in the most impressive way."
