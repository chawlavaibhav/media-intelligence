- sk_id: sk_hop_sa_0008
  source_id: hopkins_scientific_advertising_ch1_7
  source_terms:
    - "Advertising is salesmanship. Its principles are the principles of salesmanship."
    - "Advertising is multiplied salesmanship."
    - "Thus every advertising question should be answered by the salesman's standards."
  concept_label: advertising_is_multiplied_salesmanship_and_is_judged_by_salesmans_standards
  label_origin: source_verbatim
  claim: >
    Advertising is salesmanship carried out in print. Its principles are the principles of
    salesmanship, successes and failures in both are due to like causes, and every advertising
    question should therefore be settled by asking what a salesman's standard would require. The
    difference is one of degree only: advertising addresses thousands where the salesman addresses
    one, and carries a corresponding cost.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Both activities are attempts to persuade one buyer to act, so what governs the effectiveness
      of one governs the other; multiplication changes the scale, not the principles.
  scope:
    domain_discussed_by_source: [advertising, personal_selling]
    conditions: "any advertising decision"
  caveats:
    - text: >
        This is the load-bearing analogy of the whole chapter and of several later ones. It is
        asserted, not demonstrated: the source offers no case in which the analogy was tested and
        held, and no case in which it failed. Chapter 5 later names a real disanalogy — the salesman
        commands attention and the advertisement can be ignored — without revisiting the strength
        of the rules already derived from the analogy.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "Treat it as a salesman. Force it to justify itself. Compare it with other salesmen."
  examples: {positive: []}
  intra_source_relations:
