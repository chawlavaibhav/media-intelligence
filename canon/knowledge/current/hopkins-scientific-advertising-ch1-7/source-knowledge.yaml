- sk_id: sk_hop_sa_0052
  source_id: hopkins_scientific_advertising_ch1_7
  source_terms:
    - "Say that it gives three and one-third times the light and people realize that you have made tests and comparisons."
    - "One maker advertised a 78-second shave. That was definite. It indicated actual tests."
    - "\"The final result of testing and comparing 130 formulas.\""
  concept_label: a_definite_figure_makes_the_reader_infer_that_tests_were_made
  label_origin: extractor_assigned
  claim: >
    A definite figure in an advertisement causes the reader to infer that the advertiser has made
    tests and comparisons. The source gives the tungsten lamp's three-and-one-third times, a
    safety-razor maker's 78-second shave which "indicated actual tests" and is said to have produced
    a sensational advance in sales, and a shaving soap advertised as "The final result of testing
    and comparing 130 formulas" alongside "Multiplies itself in lather 250 times", "Softens the
    beard in one minute" and "Maintains its creamy fullness for ten minutes on the face" — a new
    entrant in a field where every customer had to be taken from someone else, which the source says
    produced perhaps the quickest and greatest success ever made in an equally difficult field.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A number could not be arrived at without measuring, so stating one implies the measurement
      was done.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "claims stated as precise figures"
  caveats:
    - text: >
        The mechanism is an inference the reader is said to draw, and the source is explicit that
        what matters is the impression of testing. Nothing in the passage requires the tests to have
        happened; the source neither says they did nor says they need not have.
      origin: extractor_observed
    - text: >
        This is the sharpest point in the section for reading the book's own evidential status. The
        book's central persuasive claim is that specific figures signal that measurement occurred —
        and the book itself makes heavy use of specific figures whose underlying measurements it
        does not report.
      origin: extractor_observed
    - text: >
        The outcome claims attached — "sensational advance", "quickest and greatest success" — carry
        no sales figures.
