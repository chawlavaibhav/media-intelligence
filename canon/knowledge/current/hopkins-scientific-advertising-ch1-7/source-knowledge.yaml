  label_origin: extractor_assigned
  claim: >
    Advertising principles are established by running advertisements with a tracking key, tracing
    the returns each produces, and comparing one method against many others backward and forward
    while recording the results. A method that invariably proves best across such comparisons
    becomes a fixed principle. The source states that in a large agency coupon returns are watched
    and recorded across hundreds of lines and, within a single line, sometimes across thousands of
    separate advertisements.
