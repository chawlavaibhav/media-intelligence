- sk_id: sk_hop_sa_0011
  source_id: hopkins_scientific_advertising_ch1_7
  source_terms:
    - "But fine writing is a distinct disadvantage. So is unique literary style."
    - "They take attention from the subject. They reveal the hook."
    - "Any studied attempt to sell, if apparent, creates corresponding resistance."
  concept_label: visible_craft_creates_resistance
  label_origin: extractor_assigned
  claim: >
    Fine writing and distinctive literary style are disadvantages in advertising because they take
    attention from the subject and reveal the hook, and any attempt to sell that is apparent to the
    reader creates a corresponding resistance. The source extends this to personal selling: fine
    talkers are rarely good salesmen because they inspire the fear of over-influence and the
    suspicion that the buyer is being sold on grounds other than merit.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Noticing the technique makes the buyer suspect the motive, and suspicion of the motive
