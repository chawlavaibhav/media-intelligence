- sk_id: sk_hop_sa_0001
  source_id: hopkins_scientific_advertising_ch1_7
  source_terms:
    - "advertising has in some hands reached the status of a science"
    - "It is based on fixed principles and is reasonably exact."
    - "unless one is guided by laws as immutable as the law of gravitation"
  concept_label: advertising_has_become_a_science_governed_by_fixed_laws
  label_origin: extractor_assigned
  claim: >
    Advertising has changed from a gamble into a science. Its causes and effects have been analysed
    until they are well understood, its correct procedures have been proved and established, and it
    is governed by laws the source compares to the law of gravitation for immutability. The source
    states that the book therefore deals not with theories and opinions but with well-proved
    principles and facts, and that any realms of uncertainty it enters will be carefully denoted.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Large agencies run hundreds of campaigns, record the results, and retain them across
      generations of staff, so the field accumulates proved knowledge instead of losing it.
  scope:
