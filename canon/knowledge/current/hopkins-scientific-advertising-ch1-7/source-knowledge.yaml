  concept_label: a_guarantee_impresses_in_proportion_to_the_risk_the_seller_visibly_accepts
  label_origin: extractor_assigned
  claim: >
    A guarantee loses force as it becomes universal, and regains it when the seller visibly accepts
    more risk or brings the guarantor closer to the buyer. The source reports a concern that made a
    fortune by having the local dealer who took the money sign a written warrant to repay it, rather
    than a distant stranger guaranteeing it, and says the plan has always proved effective. It
    contrasts "Try it for a week; if you don't like it we'll return your money" with sending goods
    with no money down and saying "Pay in a week if you like them", which it says proved many times
    as impressive, illustrated by the two-horses story in which the buyer chose the seller who asked
    for nothing in advance.
