# CANON-003 Lane C, book 13 — Claude C. Hopkins, "Scientific Advertising", chapters 1-7
# (printed pp. 1-24). Fresh SPEC-03 extraction. Historical material for this book, if any exists,
# is sealed until this book's checkpoint commit.
# Granularity: CANON-001 V0 rule, unchanged.
# Visual completeness: verified_page_level. The source contains no figures; see
# visual-evidence-ledger.yaml. No claim is recorded as visually demonstrated.
#
# Section rationale: chapters 1-7 are one connected span. Chapter 1 states how Hopkins believes
# advertising knowledge is established; chapters 2-4 give the three doctrines he derives directly
# from it (advertising is salesmanship, advertising must offer service, mail order is the school
# that proves both); chapters 5-7 apply the doctrines to headlines, psychology and specificity.
# A single Hopkins chapter is 2-4 printed pages and is far too small to expose his reasoning
# system, so a multi-chapter span is required. Chapters 8-21 were not processed; the notable
# exclusion is chapter 15, "Test Campaigns", so this extraction's inventory of the source's
# measurement claims covers chapters 1-7 only and is not the book's complete case.
#
# EXTRACTION NOTE, recorded because it governs how this whole file reads: this source repeatedly
# describes itself as scientific, exact, proved and law-governed. Those are recorded as the
# source's claims. The `evidence.characteristics` of each object record what the source actually
# supplies to support the claim in question, which is usually practitioner assertion or an
# unattributed anecdote. Where the source asserts that measurement was performed but reports no
# measurement, that gap is written into a caveat with origin `extractor_observed` rather than
# being recorded as `empirical_within_source`.

source_id: hopkins_scientific_advertising_ch1_7

