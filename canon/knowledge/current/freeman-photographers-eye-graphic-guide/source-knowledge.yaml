- sk_id: sk_fre_c003_0034
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Many man-made things, especially buildings, cupboards, boxes, and so on, are rectilinear—constructed of verticals and horizontals; so you could rightly say that there’s no great imagination involved in shooting them that way."
    - "But in this case, for a book on the Shakers, it was more a matter of treating the subject in its own spirit."
  concept_label: matching_a_rectilinear_subject_is_unimaginative_unless_it_matches_the_subjects_spirit
  label_origin: extractor_assigned
  claim: >
    Many man-made things are built of verticals and horizontals, and the source concedes that
    shooting them that way — camera level, normal-to-long lens, facing them exactly — involves no
    great imagination. Its justification is not compositional but interpretive: the subject was a
    Shaker pantry, and the Shaker communities were highly ordered places with simplicity and
    plainness a practised virtue, so treating the subject rectilinearly was treating it in its own
    spirit.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [interior_photography, architectural_photography]
    conditions: "man-made rectilinear subjects with a known cultural character"
  caveats:
    - text: "this is the only case in the three parts where the justification for a compositional choice is the subject's culture rather than the picture's effect, and it is offered explicitly in place of a compositional reason the source admits it lacks"
      origin: extractor_observed
    - text: "no test is given for when a subject's spirit licenses an otherwise unimaginative treatment, so the argument would justify almost any match between subject and handling"
      origin: extractor_observed
