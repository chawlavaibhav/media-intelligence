- sk_id: sk_fre_c003_0011
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Sometimes, the shapes and lines in a scene just want to take the frame wide"
    - "There’s a set of parabolic curves here, which makes the image cohere, together with the implied curve of the out-of-frame part of the boat."
  concept_label: a_scenes_shapes_can_call_for_a_wide_frame_and_an_implied_offframe_curve_can_cohere_it
  label_origin: extractor_assigned
