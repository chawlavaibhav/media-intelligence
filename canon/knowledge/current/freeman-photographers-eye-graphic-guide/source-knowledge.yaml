- sk_id: sk_fre_c003_0031
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "The eye will naturally go to the one sharp strong element—the tree line—but with it so low in the frame, the eye then wanders elsewhere, and there’s only one place to go: up."
    - "The initial subject is a detailed dark line of trees that we pay extra attention to, but the ultimate subject is the swirl of storm clouds."
  concept_label: push_the_sharp_element_to_the_edge_to_send_the_eye_to_the_real_subject
  label_origin: extractor_assigned
  claim: >
    An eccentric division puts the only sharp, strong element close to the frame's edge. The eye
    goes to it first, because it is the sole point of precision in the picture; but being so far to
    one side, the eye then has nowhere to wander except toward the true subject — in this case a
    pale, subtle storm above. The initial subject and the ultimate subject are deliberately
    different. The source adds that aligning the strong element exactly to the frame edge adds
    interest, and notes this was shot on film with no easy digital straightening afterwards.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A subtle subject cannot hold attention on its own, so it is keyed to a sharp one that can.
      Placing the sharp element at the edge means the only direction available afterwards is toward
      the subtle one.
  scope:
