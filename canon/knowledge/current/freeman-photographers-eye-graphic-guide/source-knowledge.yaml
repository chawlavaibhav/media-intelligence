- sk_id: sk_fre_c003_0023
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Graphically, it means “almost touching.”"
    - "the viewer’s eye is drawn to this uncertain area simply because it’s unresolved, and gauging the exact size of the gap is something to think about"
    - "Through the camera, the “just” moment does not need to be real. It needs simply to be apparent."
  concept_label: an_almost_touching_gap_holds_the_eye_because_it_is_unresolved
  label_origin: extractor_assigned
  claim: >
    "Just" means almost touching — a foot about to reach the ground, a door about to close, a bird
    about to land. It holds both the exact and the not-quite at once, hovering between complete and
    incomplete. The source's mechanism is that the viewer's eye is drawn to the uncertain area
    precisely because it is unresolved, and gauging the exact size of the gap is something to think
    about, so such pictures hold extra interest: you look at them and want to complete them.
    Critically, the moment does not have to be real — it only has to be apparent through the
    camera, so a viewpoint that creates the graphic possibility is enough.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An unresolved relationship is a question the viewer cannot answer at a glance, so attention
      stays at the gap while it is being judged.
