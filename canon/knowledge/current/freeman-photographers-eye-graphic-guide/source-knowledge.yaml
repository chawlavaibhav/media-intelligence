- sk_id: sk_fre_c003_0021
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "As the frame is meant to enclose, there needs to be a reason for doing something like this, otherwise it just looks perverse."
    - "as long as there’s some logic, the viewer is likely to accept it, although not necessarily agree"
  concept_label: extreme_placement_needs_a_visible_reason_or_reads_as_perverse
  label_origin: extractor_assigned
  claim: >
    Placing a subject right at an edge or in a corner is the most extreme option and the least
    likely. Because the frame is meant to enclose, there has to be a reason, or it simply looks
    perverse. The reasons depend on the scene and on what the photographer is trying to show, and
    the source's test is weak but explicit: as long as there is some logic, the viewer is likely to
    accept it, though not necessarily to agree. The reason that arises most often is to make the
    background dominate the subject, most commonly with a human figure in a specific setting.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: true, text: "The frame's purpose is enclosure, so a subject pushed against its boundary works against the frame's function and must be given a reason that overrides it."}
  scope:
    domain_discussed_by_source: [photography]
    conditions: "a subject at the frame's edge or corner"
  caveats:
    - text: "in the worked case the extreme placement was forced by geometry rather than chosen — filling the frame with columns without gaps required an acute angle, which left only a small triangle of space at the bottom right for the figure"
      origin: source_stated
    - text: "the source's acceptance test — the viewer accepts it if there is some logic — is not operationalised and would be satisfied by almost any stated reason"
      origin: extractor_observed
  source_stated_problems:
