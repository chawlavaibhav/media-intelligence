    characteristics: [explicitly_stated, visually_demonstrated, anecdotal, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: figure_not_inspected
  provenance:
    chapter: "Part 1 — Framing"
    section: "Loose"
    page_start: null
    page_end: null
    locator: "converted-PDF pages 19-21, LOOSE"
    figure_refs: [pdf_p19, pdf_p20, pdf_p21]
