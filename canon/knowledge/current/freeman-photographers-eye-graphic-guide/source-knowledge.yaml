- sk_id: sk_fre_c003_0001
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Framing the shot usually comes before anything else—the first decision."
    - "Composition (or design if you like) covers the whole range of organizing the image, while framing concentrates on enclosing the scene, even before thinking about the relationship between elements inside the picture."
  concept_label: framing_precedes_composition_and_is_about_enclosure_only
  label_origin: extractor_assigned
  claim: >
    Framing and composition are different acts. Framing concentrates on enclosing the scene and
    comes before anything else, prior even to thinking about relationships between the elements
    inside the picture; composition covers the whole range of organising the image. The source
    notes the term comes from filmmaking, where a scene is enclosed and the action then plays out
    within it, and concedes the separation is less sharp in still photography, where the image is
    singular rather than multiple. Even so, the decisions about where to cut into a landscape,
    figure or object, and what to include and leave out, rank as the most important in defining
    the shot.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      In film the enclosure is fixed first and the action happens inside it, which is what makes
      framing logically prior. The source imports that ordering into still photography while
      acknowledging it fits less cleanly.
  scope:
    domain_discussed_by_source: [photography]
    conditions: "any photograph"
  caveats:
    - text: "the source states directly that the separation may not hold to the same degree in still photography"
      origin: source_stated
    - text: "the claim that framing decisions are the most important in defining the shot is asserted and is not revisited or tested anywhere in the three parts"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples: {positive: [], counter: []}
  intra_source_relations:
