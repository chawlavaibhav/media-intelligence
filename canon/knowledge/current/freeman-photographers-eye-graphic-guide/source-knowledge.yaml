- sk_id: sk_fre_c003_0008
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Horizontal is the default because of the way cameras are designed to be held, but vertical offers different possibilities."
    - "matching a vertical frame to a tall subject is one obvious approach. But if we want a sense of tallness, there’s a little more to it."
  concept_label: a_vertical_frame_is_not_the_same_as_a_sense_of_tallness
  label_origin: extractor_assigned
  claim: >
    Horizontal is the default orientation only because of how cameras are designed to be held.
    Matching a vertical frame to a tall subject is the obvious move, but it does not by itself
    produce a sense of tallness. In the worked case that sense came from opposing two elements at
    the frame's extremes — a dark peak and a flaring sun at opposite ends of a double curve — which
    emphasised the frame's vertical length.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Two strongly contrasting elements placed at opposite ends of the long axis make the distance
      between them legible, which is what registers as tallness rather than the frame shape alone.
  scope:
    domain_discussed_by_source: [landscape_photography]
    conditions: "a subject whose main features are vertical"
  caveats:
    - text: "the source notes the most striking feature of its subject was rejected as too obvious in favour of a harder-to-catch alternative, so the choice was as much about avoiding the expected as about tallness"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
    - "oppose contrasting elements at the two ends of the long axis"
  examples:
    positive:
      - {description: "Bear and Rabbit Rocks, Monument Valley — peak and sunrise at opposite ends of a double U-curve", figure_ref: pdf_p26}
  intra_source_relations:
    - {relation: demonstrated_together_with, target: sk_fre_c003_0009, note: "adjacent treatments of frame shape"}
