  label_origin: extractor_assigned
  claim: >
    One of composition's prime jobs is keeping the interest going, so there are times when it is
    better to go against the expected practice of focusing attention clearly on one subject.
    Dividing the frame so the eye cannot rest anywhere for long produces deliberate disruption,
    and that makes the image more energetic. In the source's case the underlying division is still
    rectilinear, but set at an angle, with four faces of different sizes each in a squared-off
    segment keying the composition.
