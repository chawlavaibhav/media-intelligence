- sk_id: sk_fre_c003_0007
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Far from carefully fitting things inside, we carefully break them in half, and for a good reason."
    - "In one case, the eyes move to the center; in this case, they are pulled apart."
  concept_label: halving_symmetrical_subjects_produces_symmetry_that_pulls_the_eye_apart
  label_origin: extractor_assigned
  claim: >
    The opposite of frame-fit: deliberately breaking subjects in half at the frame edge. The source
    says showing half of each of two subjects is more interesting than showing both whole because
    it is not quite expected, and that it works because the subjects are virtually symmetrical, as
    faces are. The resulting image is symmetrical, but in the opposite way from a centred
    symmetrical composition — where centred symmetry moves the eyes to the middle, this pulls them
    apart.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Two half-subjects placed at opposite sides create two centres of interest rather than one, so
      the symmetry works outward instead of inward.
  scope:
    domain_discussed_by_source: [studio_photography]
    conditions: "two near-symmetrical subjects that need to be shown together"
  caveats:
    - text: "the source shows the alternative of merging the two into a single composite and reports it as less successful because the visors differ in height — a reason specific to these two objects"
      origin: source_stated
    - text: "the source's cross-reference for the contrasting centred case points to a page this copy does not have"
      origin: extractor_observed
  source_stated_problems:
    - "a side-by-side framing that is too wide and shows more than we need to see"
  source_stated_remedies:
    - "crop left-right so each symmetrical subject is divided exactly in half"
  examples:
    positive:
      - {description: "two space helmets, each halved at the frame's centre line", figure_ref: pdf_p24}
    counter:
      - {description: "the same two helmets simply side by side, described as too wide and pedestrian", figure_ref: pdf_p25}
  intra_source_relations:
