- sk_id: sk_fre_c003_0024
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Seen alone as a landscape image, they don’t impress as much as the real thing because they lack comparison—the trees could be almost any size."
    - "there was the question of whether horizontal or vertical, and how small the figure could be in the image and still be seen. Too small and the point would be wasted."
    - "It has to be printed big."
  concept_label: a_figure_supplies_scale_but_only_above_a_size_that_depends_on_the_print
  label_origin: extractor_assigned
  claim: >
    A landscape seen alone can fail to convey its size because it lacks comparison — the source's
    falls do not impress as much as the real thing because the trees could be almost any size. A
    small human figure supplies that comparison. But the figure has a lower limit: too small and
    the point is wasted, and whether it registers at all depends on the print size, so one of the
    source's two versions works only on condition that it is printed big. The type is old — the
    source dates "figure in a landscape" to at least the sixteenth century.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Scale is read by comparison against something of known size, so a figure of known size
      supplies the missing term. If the figure falls below the threshold of being noticed, the
      comparison is not made and no scale is conveyed.
  scope:
    domain_discussed_by_source: [landscape_photography]
    conditions: "landscapes containing no object of familiar size"
  caveats:
    - text: "the condition is external to the image — the same file succeeds or fails depending on how large it is reproduced. This is the only claim in the three parts whose truth depends on the output medium"
      origin: extractor_observed
    - text: "the source also chose the moment of the figure's action, saying the chosen frame has more energy than the others, which is a separate judgement from the scale argument"
      origin: source_stated
  source_stated_problems:
    - "a landscape that lacks comparison, so its size does not read"
    - "a figure too small to be seen, wasting the point"
  source_stated_remedies:
    - "include a figure of known size, scaled as small as possible but still noticeable"
