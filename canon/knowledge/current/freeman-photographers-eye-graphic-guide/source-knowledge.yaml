- sk_id: sk_fre_c003_0026
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "One of the points of a two shot is that there’s a relationship between the subjects, and it’s often good to manage the composition so that the viewer’s eye moves back and forth between them—in other words, the shot is active rather than static."
    - "The attention plays ping-pong between the two subjects."
  concept_label: a_two_shot_should_be_made_active_by_moving_the_eye_between_the_pair
  label_origin: extractor_assigned
  claim: >
    The two shot — two people framed tight to medium so their faces dominate — is a classic of
    cinema and television, and widescreen suits it because it allows the pair to sit side by side
    with breathing space. Its point is the relationship between the subjects, so the composition
    should be managed to move the viewer's eye back and forth between them, making the shot active
    rather than static. The source's case achieves this with three devices working in sequence:
    selective focus and lighting put the eye on the foreground figure first, contrasting
    backgrounds — dark on one side, light and colourful on the other — carry it to the blurred but
    recognisable second figure, and the more dominant first figure brings it back.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Each subject is given a different reason to be looked at — sharpness and light for one,
      background contrast for the other — so neither settles the attention and it oscillates.
  scope:
    domain_discussed_by_source: [photography, cinema, television]
    conditions: "two related subjects framed together"
  caveats:
    - text: "the source names its technical settings, ƒ/1.4 with an 85mm lens, which is the only place in the three parts where a claim is tied to specific equipment values"
      origin: source_stated
    - text: "\"active rather than static\" is offered as the goal without a reason why an active reading is better here"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "give each subject a different claim on attention so neither settles it"
  examples:
