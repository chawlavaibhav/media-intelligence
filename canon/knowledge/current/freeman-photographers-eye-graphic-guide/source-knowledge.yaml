- sk_id: sk_fre_c003_0025
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "The only way to come close to this in a still image is to arrange the framing, composition or lighting so that all the attention immediately goes to one place, but the eye lingers long enough on the frame to start to wander, and then discovers something else."
    - "It’s an uncertain balancing act, because if you hide the thing-to-be-revealed too well, such as by making it too small or poorly lit, chances are the viewer will get bored and move on before noticing it."
  concept_label: a_still_reveal_is_a_balancing_act_between_delay_and_abandonment
  label_origin: extractor_assigned
  claim: >
    The reveal is a cinematic device — the camera shows one thing, then moves or zooms to disclose
    something else, effective through surprise — and the source says it is difficult and perhaps
    impossible to achieve in a single still. The only approach is to arrange framing, composition
    or lighting so that attention goes immediately to one place, but the eye lingers long enough to
    start wandering and then discovers something else. It is an uncertain balancing act: hide the
    thing to be revealed too well — too small, too poorly lit — and the viewer will get bored and
    move on before noticing it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      In film the disclosure is controlled by the camera's movement. In a still it must be produced
      by the viewer's own scanning, so the photographer controls only how long the first subject
      holds and how findable the second is.
  scope:
    domain_discussed_by_source: [photography, cinema]
    conditions: "a still image with a secondary subject intended to be found late"
  caveats:
    - text: "the source states the technique may be impossible in a still and then attempts it anyway — \"But let's try anyway\" — so the case is offered as an attempt rather than a demonstration"
      origin: source_stated
    - text: "success and failure are described only in terms of the viewer's patience, and no way of testing whether the balance was struck is given"
      origin: extractor_observed
  source_stated_problems:
    - "hiding the thing-to-be-revealed so well the viewer moves on before noticing it"
  source_stated_remedies:
    - "arrange framing, composition or lighting so attention goes to one place and then wanders"
  examples:
