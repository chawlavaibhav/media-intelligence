- sk_id: sk_fre_c003_0005
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Loose framing doesn’t (or shouldn’t) mean ill-considered and sloppy."
    - "In a busy scene like this, the edges and corners of the frame will be less noticeable."
  concept_label: a_busy_scene_makes_the_frame_edges_stop_mattering
  label_origin: extractor_assigned
  claim: >
    Loose framing means not being preoccupied with how things fit the frame, how objects intersect
    edges and corners, or whether the frame breaks into a person. The source is explicit that it is
    not the same as sloppiness: it is partly an attitude, and it suits situations where the action
    takes precedence over the finer points of the frame. The reason it works is that in a busy
    scene the viewer's attention centres on the activity and gestures and is unlikely to be
    distracted by the borders, so the edges and corners become less noticeable.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Attention is finite and goes to the activity, so the frame's edges recede from notice. Where
      the interest is dense enough, precision at the borders buys nothing.
  scope:
    domain_discussed_by_source: [reportage_photography]
    conditions: "scenes busy with action, shot close with a wide lens"
  caveats:
    - text: "the source reduces its own busy example to an interaction of just three elements, so the scene is loose at the edges and tightly organised at the centre — the looseness is bounded and not stated to be"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "tea picking, Assam — three elements organised at the centre with the frame breaking figures at the edges", figure_ref: pdf_p19}
  intra_source_relations:
    - {relation: contradicts, target: sk_fre_c003_0002, note: "the deliberate opposite of exact framing"}
    - {relation: contradicts, target: sk_fre_c003_0006, note: "and of frame-fit"}
