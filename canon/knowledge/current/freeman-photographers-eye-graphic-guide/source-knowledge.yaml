- sk_id: sk_fre_c003_0015
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Placement assumes two things, both quite common. One is that there is a subject that is concrete—a single, identifiable unit, rather than a concept, pattern, or some overall generality. The second is that this subject is small enough in the frame that you do actually have a choice of where to put it."
    - "the decisions are generally to do with where in the rectangular frame, and how close to other things"
  concept_label: placement_has_two_preconditions_and_only_two_variables
  label_origin: extractor_assigned
  claim: >
    Placing and framing are different though inseparably linked. Placement presupposes two
    conditions, both common: that there is a concrete subject — a single identifiable unit rather
    than a concept, a pattern or a generality — and that it is small enough in the frame that there
    is actually a choice of where to put it. Given those, the decisions reduce to two: where in the
    rectangular frame, and how close to other things. The source says it is no more complicated
    than that, while noting that because every picture situation is unique, doing it for any one
    photograph can be anything but simple.
