# CANON-003 book 7 (Lane A) — Michael Freeman, "The Photographer's Eye: A Graphic Guide"
# (Focal Press / Ilex Press, 2013). Parts 1-3: Framing, Placing, Dividing.
# Fresh SPEC-03 extraction. Granularity: CANON-001 V0 rule, unchanged.
# Visual completeness: partial_reflowed_layout (calibre conversion — figures survive, page does not).
#
# PROVENANCE WARNING CARRIED INTO EVERY OBJECT: the numbers on these pages are the CONVERTED file's
# pagination, not the printed book's. Proved by the book's own cross-references, all five of which
# point elsewhere in this copy. Every object therefore has page_start: null and cites a locator of
# the form "converted-PDF page NN, CASE NAME". Nothing here should be read as a printed page.
#
# NOTE ON THIS SOURCE'S SHAPE: the book is organised as ~80 "cases", each one photograph the author
# made, with a first-person account of the decisions behind it. Claims are therefore embedded in
# single recounted instances, and the evidence profile is dominated by `anecdotal` and
# `visually_demonstrated` — a different profile from any book this lane has processed. The author
# states in his introduction that the words are deliberately minimal and the visuals carry the
# story, so text-only extraction of this source is known to be partial by the source's own account.

