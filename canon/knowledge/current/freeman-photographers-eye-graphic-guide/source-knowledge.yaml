- sk_id: sk_fre_c003_0014
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "When you frame a shot, you leave out more than you include."
    - "the suggestion of what might be happening out of frame can be intriguing"
    - "The word to stress here is occasional, because of the risk of being simply annoying."
  concept_label: referring_to_what_is_offstage_works_only_because_it_is_rare
  label_origin: extractor_assigned
  claim: >
    Framing leaves out more than it includes, which is the point — it establishes the
    photographer's view and no one else's. The accepted convention in photography, as in painting,
    is to gather into the frame what is to be shown, and it is that convention which gives value to
    the occasional image referring to something deliberately off-stage. The source stresses
    "occasional", because of the risk of being simply annoying. The mechanism it gives is a
    question mark: the viewer does not immediately know what is being looked at, and for a moment
    that makes the image more engaging.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The effect depends on the surrounding convention. Because nearly every photograph contains
      what it is about, one that does not poses a question, and the engagement is the brief interval
      before the viewer answers it.
  scope:
    domain_discussed_by_source: [photography, painting]
    conditions: "images referring to an event outside the frame"
  caveats:
    - text: "the source states the effect lasts only a moment — \"we soon realize the answer\" — so the engagement it buys is explicitly brief"
      origin: source_stated
    - text: "the value is said to derive from the convention being general, which means the device would lose its force if it were widely adopted; the source does not draw that consequence"
      origin: extractor_observed
  source_stated_problems:
    - "being simply annoying by referring off-frame too often"
  source_stated_remedies: []
