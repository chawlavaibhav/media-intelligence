      origin: extractor_observed
    - text: "the source notes the alignment in its example was rectilinear and squared up and was hard to avoid given where the photographer was standing, so the case is partly circumstance rather than choice"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
