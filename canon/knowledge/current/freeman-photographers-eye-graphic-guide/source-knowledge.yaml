- sk_id: sk_fre_c003_0010
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Because the square frame has no bias and no direction, it tends to draw the eye inward."
    - "The square’s lack of bias—all sides equal—makes it easily divisible into equal parts, and also gives it a definite center, like a circle."
  concept_label: a_square_has_no_direction_so_it_draws_the_eye_inward
  label_origin: extractor_assigned
  claim: >
    Because a square has equal sides it has no bias and no direction, and three things follow: it
    tends to draw the eye inward, it is easily divisible into equal parts, and it has a definite
    centre in the way a circle does. The source lists the occasions this suits — dividing things
    equally, centring, a uniform field, a symmetrical subject, and enclosing another shape within
    the frame.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A rectangle's unequal sides give it a direction along the longer axis. Removing that
      inequality removes the direction, leaving nowhere for the eye to travel except inward.
  scope:
    domain_discussed_by_source: [photography]
    conditions: "square-format images"
  caveats:
    - text: "the source's worked example uses the square to enclose a triangle formed by a group of children, and attributes the shape's legibility partly to counter-shading, which is a tonal effect rather than a property of the frame"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "children, Cartagena — a central triangle with two outlying wedges enclosed by the neutral square", figure_ref: pdf_p30}
  intra_source_relations:
    - {relation: qualifies, target: sk_fre_c003_0009, note: "a geometric account beside the historical one"}
    - {relation: depends_on, target: sk_fre_c003_0019, note: "the source cites the square's inward pull when arguing for centring"}
