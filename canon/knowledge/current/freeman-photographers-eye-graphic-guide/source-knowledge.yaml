- sk_id: sk_fre_c003_0009
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "A square format was never seen in the visual arts as a natural frame, and was used just occasionally, often to make a point about rigor and severity."
    - "The equal sides give a sense of strictness, formality, even constraint."
  concept_label: the_square_frame_reads_as_strict_and_formal
  label_origin: extractor_assigned
  claim: >
    The square was never treated in the visual arts as a natural frame and was used only
    occasionally, often to make a point about rigour and severity. Its equal sides give a sense of
    strictness, formality, even constraint. Photography was different, because for decades
    medium-format 6x6cm film pushed photographers into finding square compositions, and they found
    that square could be good.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [photography, visual_arts]
    conditions: "square-format images"
  caveats:
