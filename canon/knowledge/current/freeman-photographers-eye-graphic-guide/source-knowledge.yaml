- sk_id: sk_fre_c003_0002
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Framing can be as rigorous and precise as you have the time or energy for."
    - "The cuts and the gaps were proportionate to the angle at which the various curves of the shell interacted with the frame edges."
  concept_label: cut_the_frame_proportionate_to_how_the_subjects_curves_meet_the_edges
  label_origin: extractor_assigned
  claim: >
    Framing can be made as rigorous as time allows, and studio still-life is the extreme case
    because there is full control and, in the source's words, an absolute obligation to bring
    things into some kind of order. In the worked case the decisions were: how much of the subject
    to include, where exactly to cut, how close to bring its curved outline to the frame edges, and
    how to divide the proportions between the subject, the background and its coloured interior.
    The rule the source gives is that the cuts and gaps were proportionate to the angle at which
    the subject's various curves met the frame edges.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [studio_still_life_photography]
    conditions: "full control over subject, set and lighting"
  caveats:
    - text: "the source notes the proportions of the three colours present were also taken into account, so the geometric rule was not the only input"
      origin: source_stated
    - text: "\"proportionate to the angle\" is not defined further and no measurement is given; the accompanying diagram shows which distances were measured but not what the proportion was"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "cowrie shell on black acrylic under a softbox, with an analytic diagram measuring the gaps between the shell's curve and each frame edge", figure_ref: vis_fre_deconstruction_of_a_cut}
  intra_source_relations:
    - {relation: specialises, target: sk_fre_c003_0001, note: "framing at its most rigorous"}
    - {relation: trades_off_with, target: sk_fre_c003_0005, note: "the deliberate opposite of loose framing"}
