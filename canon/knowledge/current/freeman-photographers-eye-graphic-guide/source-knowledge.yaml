- sk_id: sk_fre_c003_0030
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "For some reason, symmetry often gets criticized, generally on the grounds that it shows lack of imagination. Like other things in composition, it has a time and a place."
    - "One occasion for using it is when you seriously need to bring order to a scene or subject that has none whatsoever."
  concept_label: symmetry_is_for_imposing_order_on_a_subject_that_has_none
  label_origin: extractor_assigned
  claim: >
    Symmetry is often criticised as showing a lack of imagination, but like other things in
    composition it has a time and a place. One occasion for it is when order seriously has to be
    brought to a scene or subject that has none at all. In the source's case — twenty-three loose
    pearls of different sizes that had to be arranged somehow — the solution was not only symmetry
    but a constructed background: blackened river pebbles chosen for contrast and texture, whose
    gaps gave the pearls resting places, so the composition's basic unit became a pearl nested in a
    gap.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
