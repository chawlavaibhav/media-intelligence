- sk_id: sk_fre_c003_0029
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "Our eyes are drawn to the light, and brighter usually gets more attention, so classical proportions take this into account."
    - "see what happens if we manipulate this image to divide darker and lighter along the Golden Section. It doesn’t work well, and the bright sky over-dominates, although if we made the tones more equal, it would be more comfortable."
  concept_label: a_geometric_division_fails_if_it_ignores_tonal_weight
  label_origin: extractor_assigned
  claim: >
    Because the eye is drawn to the light and brighter areas usually get more attention, a division
    of the frame has to weigh tone as well as size. The source demonstrates this against the Golden
    Section directly: it manipulated its own image so the darker and lighter areas divided on that
    proportion, and the result does not work — the bright sky over-dominates. It then states the
    condition under which the same geometric division would work: if the tones were made more
    equal. So the named proportion is not wrong, it is incomplete, because it takes no account of
    the relative weight of what falls on either side of the line.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A bright area attracts more attention than a dark one of equal size, so equal areas are not
      equal weights. A proportion defined only on area therefore misstates the balance whenever the
      tones differ.
  scope:
    domain_discussed_by_source: [photography]
    conditions: "images divided into zones of differing brightness"
  caveats:
    - text: "the demonstration is a manipulation of one photograph by its own author, who is also the person judging that it does not work well; the judgement and the evidence come from the same source"
      origin: extractor_observed
    - text: "the source shows the corrected version — tones equalised — as an illustration and does not claim to have shot it that way"
      origin: extractor_observed
  source_stated_problems:
    - "a bright area over-dominating a composition divided by proportion alone"
  source_stated_remedies:
    - "take tonal weight into account when setting the proportions"
    - "or equalise the tones if the geometric division is to be kept"
