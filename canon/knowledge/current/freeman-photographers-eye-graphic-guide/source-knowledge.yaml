- sk_id: sk_fre_c003_0003
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "If there’s a straight edge in the subject, and it’s close to one edge of the frame, it suddenly acquires a new relationship."
    - "The closer you position it, the stronger this feels, like a kind of magnetism."
  concept_label: a_straight_subject_edge_near_a_frame_edge_reads_as_magnetic
  label_origin: extractor_assigned
  claim: >
    A straight edge within the subject, positioned close to an edge of the frame, acquires a new
    relationship with it, and the closer it is placed the stronger that relationship feels — the
    source describes it as a kind of magnetism. In the worked case high contrast encouraged the
    photographer to shave the distance between the subject and the top and left edges to the
    absolute minimum.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [photography]
    conditions: "a subject containing a straight edge, positionable relative to the frame"
  caveats:
