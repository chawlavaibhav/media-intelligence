- sk_id: sk_fre_c003_0033
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "The last image used an angled framing to energize the scene... but here I’m using them to make a clean and definite division."
    - "Note also the value of a head-on, flat viewpoint... which sets the diagonals off against the strict horizontals and verticals of everything else."
  concept_label: diagonals_divide_cleanly_only_against_strict_horizontals_and_verticals
  label_origin: extractor_assigned
  claim: >
    The same angled treatment that energises a scene can instead make a clean and definite
    division. The source's case uses converging diagonal shadows, doubled by their reflections in
    still water so they meet like chevrons, pointing at a bright target; the waterline supplies a
    second, horizontal division and is deliberately not centred because the reflections are softer
    and weaker than the shadows. Crucially, the diagonals are set off by a head-on flat viewpoint
    that keeps everything else strictly horizontal and vertical — the division reads as clean
    because of what surrounds it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A diagonal is only legible as a diagonal against orthogonals. A flat frontal viewpoint
      removes perspective convergence from everything else, so the deliberate diagonals are the
      only obliques in the frame.
  scope:
    domain_discussed_by_source: [architectural_photography]
    conditions: "scenes containing both strong obliques and rectilinear structure"
  caveats:
    - text: "the source's decision to place the waterline off-centre is justified by the reflections being weaker than the shadows, which is the tonal-weight argument from the classical section applied without being named as such"
      origin: extractor_observed
    - text: "the source's cross-reference to its own treatment of the flat viewpoint points to pages this copy does not have"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "use a head-on flat viewpoint so the deliberate diagonals are the only obliques"
    - "offset a division when what falls either side differs in strength"
  examples:
