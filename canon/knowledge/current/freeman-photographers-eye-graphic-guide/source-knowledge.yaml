- sk_id: sk_fre_c003_0027
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "There is not always something to divide in an image."
    - "At its crudest, you need lines to divide a frame, and the straighter they are, the cleaner the partition."
    - "there are other lines that may sneak up on you and insist on splitting up the frame, particularly if they are edges of things or areas, and even more so if what goes on either side is very different"
  concept_label: division_requires_a_line_and_a_difference_across_it
  label_origin: extractor_assigned
  claim: >
    Not every image has anything to divide — many are too complex, or too simple, to lend
    themselves to any useful division. Division needs lines, and the straighter the line the
    cleaner the partition. A horizon is the cleanest and clearest case: it is known and expected,
    and like a single subject on a plain background it simply has to be put somewhere — high,
    middle or low. Other lines can impose themselves without being chosen, particularly the edges
    of things or areas, and the more so when what lies either side differs strongly — dark against
    light, one colour against another, different textures, or anything else that creates a contrast.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A line divides only where it separates two regions that read as different, so the contrast
      across the line is what makes the division exist rather than the line itself.
  scope:
    domain_discussed_by_source: [photography]
    conditions: "images containing a continuous edge between differing areas"
  caveats:
    - text: "the source's own cross-reference to the section it compares this with points to a page this copy does not have"
      origin: extractor_observed
    - text: "\"insist on splitting up the frame\" treats the division as something that happens to the photographer, which sits against the rest of the part, where every division is a decision"
      origin: extractor_observed
