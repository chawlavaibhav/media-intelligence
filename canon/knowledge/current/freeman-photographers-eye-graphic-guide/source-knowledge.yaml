- sk_id: sk_fre_c003_0019
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "don’t let the accompanying criticism of dead-centered, bull’s-eye positioning make you believe it has no use"
    - "there are any number of situations in which centering the main subject makes a firm and strong statement"
  concept_label: centring_is_justified_when_the_scene_already_points_inward
  label_origin: extractor_assigned
  claim: >
    Off-centre is the most popular idea and comes naturally to practised photographers, but the
    criticism of dead-centred, bull's-eye positioning should not be taken to mean centring has no
    use: there are many situations in which centring the main subject makes a firm and strong
    statement. The source's worked case shows what those situations have in common — the subject
    had strong intrinsic pull, being both colourful and circular, it sat within a fairly flat
    surrounding area, and the surrounding structure was arranged in concentric curves around it, so
    everything pointed to the centre.
