    inspected: {text: true, figures: []}

- sk_id: sk_fre_c003_0006
  source_id: freeman_photographers_eye_graphic_guide_parts1_3
  source_terms:
    - "there’s the possibility of being clever with the edges and corners to make everything just fit. Emphasis on “just,” because this is a tricky procedure. One slip and it all falls apart if anything important actually breaks out and crosses the edge."
    - "The slight gap at the top, above the cross, is deliberate—any less would look too tight."
  concept_label: frame_fit_is_fragile_and_needs_a_deliberate_slight_gap
  label_origin: extractor_assigned
  claim: >
    When the subject's shape resembles the picture frame, or can be made to, the edges and corners
    can be used to make everything just fit. The source stresses that this is fragile: one slip and
    it falls apart if anything important breaks out across the edge. To be satisfying the subject
    has to match the frame, and a slight deliberate gap is needed — any less would look too tight.
    Cropping in afterwards to make it appear to work is rejected as missing the point.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [photography]
    conditions: "a subject whose outline is close to the frame's proportions"
  caveats:
    - text: "the source concedes it can waste a lot of time moving around and changing lenses to make this happen"
      origin: source_stated
    - text: "the rejection of later cropping is a claim about the photographer's practice, not about the resulting image, which would be identical"
      origin: extractor_observed
  source_stated_problems:
    - "something important breaking out across the frame edge"
    - "a fit so exact it looks too tight"
  source_stated_remedies:
    - "leave a slight deliberate gap"
    - "find the camera position rather than crop afterwards"
  examples:
    positive:
      - {description: "picket-fenced church, Stykkishólmur, with exactly equal gaps in the lower third", figure_ref: pdf_p22}
  intra_source_relations:
    - {relation: contradicts, target: sk_fre_c003_0007, note: "the source presents frame break as its opposite"}
    - {relation: specialises, target: sk_fre_c003_0002, note: "rigorous framing applied to the outline as a whole"}
