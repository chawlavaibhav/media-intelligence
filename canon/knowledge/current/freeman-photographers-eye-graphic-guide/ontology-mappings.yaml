- concept_id: cc_fre_c003_delay_devices
  kind: canonical_concept
  label: devices_that_hold_attention_by_delaying_the_viewer
  purpose: retrieval_and_aggregation
  created_by: extractor
  asserts_equivalence: false
  children_terms: [t_fre_c003_0017, t_fre_c003_0018, t_fre_c003_0023, t_fre_c003_0020]
  basis: >
    Ours, for retrieval. Four of this source's techniques work by making the viewer wait — for a gap
    to be judged, for a hidden element to be found, for the eye to travel from a sharp element to a
    subtle one, for a scale figure to be noticed. The source connects none of them and they look
    nothing alike, so this asserts no equivalence. It exists because they share one failure mode,
    which is a useful thing to be able to retrieve together.
  asserts_agreement_between_sources: false

