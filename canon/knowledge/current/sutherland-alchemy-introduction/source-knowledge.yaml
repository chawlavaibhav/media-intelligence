- sk_id: sk_sut_alc_0012
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "in reality ‘context’ is often the most important thing in determining how people think, behave and act: this simple fact dooms many universal models from the start"
    - "Because in order to form universal laws, naïve rationalists have to pretend that context doesn’t matter."
    - "‘At the federal level I am a Libertarian. At the state level, I am a Republican. At the town level, I am a Democrat. In my family I am a socialist. And with my dog I am a Marxist’"
  concept_label: context_dependence_defeats_universal_laws_of_human_behaviour
  label_origin: extractor_assigned
  claim: >
    Context determines how people think and act to such a degree that universal, context-free laws of
    human behaviour are doomed from the start, and forming such laws requires pretending context does
    not matter. The source's illustrations are a Pall Mall club where wealthy right-wing members all
    pay the same fee regardless of use; Goldman Sachs, described by Taleb as internally socialistic
    while proposing no profit share with JP Morgan; a quoted individual whose politics shifts from
    Libertarian to Marxist as the unit shrinks from federal to household; and the banana liqueur that
    tasted good only in the Caribbean. It invokes Adam Smith's warning against the "man of system"
    who imagines he can arrange society like pieces on a chessboard, forgetting that every piece has
    a principle of motion of its own.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Perception itself is affected by context, so the same act has a different value to the same
      person in a different setting; a universal law has no place to record the setting.
  scope:
    domain_discussed_by_source: [economics, politics, human_behaviour]
    conditions: "any attempt to state a general law about people"
  caveats:
    - text: >
        The examples are chosen and anecdotal, and the strongest of them — the Adam Smith passage —
        is an eighteenth-century warning rather than evidence about the present.
      origin: extractor_observed
    - text: >
        The claim is self-limiting in a way the source does not address: "context is often the most
        important thing" is itself a universal claim about human behaviour.
      origin: extractor_observed
  source_stated_problems:
    - "the ‘man of system’"
    - "the modern rationalist straitjacket"
  source_stated_remedies: []
  examples:
