# CANON-003 Lane C, book 15 — Rory Sutherland, "Alchemy", the complete Introduction
# ("Cracking the (Human) Code"). Fresh SPEC-03 extraction. Historical material for this book, if any
# exists, is sealed until this book's checkpoint commit.
# Granularity: CANON-001 V0 rule, unchanged.
# Visual completeness: not_verified_page_layout — both figures inspected and recovered; an EPUB has
# no page. One claim is recorded as visually demonstrated. See visual-evidence-ledger.yaml.
#
# Section rationale: the Introduction is the book's epistemic statement. It defines psycho-logic,
# argues the case against requiring a rationale before trying something, sets out the nonsense /
# non-sense distinction, the two-operating-systems model and the context argument, and names the
# framework the rest of the book uses. Parts 1-6 apply it. The prologue and "Rory's Rules of
# Alchemy" were not processed.
#
# EXTRACTION NOTE — this governs the whole file. This source is deliberately a heuristic,
# anti-rational, commercial practitioner text. It argues that things can work without a known
# reason, that demanding a rationale before trying something is itself a failure mode, and it
# describes itself as "a provocation". Its claims are recorded as what they are: assertions,
# analogies, anecdotes and one of the author's own field tests. They are NOT recorded as
# experimentally established rules, and no mechanism has been supplied where the source does not
# supply one. Where the source concedes it does not know why something happens, that concession is
# recorded in `source_uncertainty` rather than smoothed over — this is the first book in Lane C
# where `source_uncertainty` carries values other than `none` at scale, and that is a property of
# the source worth preserving.

