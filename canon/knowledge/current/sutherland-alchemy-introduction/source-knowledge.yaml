- sk_id: sk_sut_alc_0014
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "Irrational people are much more powerful than rational people, because their threats are so much more convincing."
    - "being rational means you are predictable, and being predictable makes you weak"
    - "If you are wholly predictable, people learn to hack you."
  concept_label: predictability_is_a_weakness_because_it_can_be_exploited
  label_origin: extractor_assigned
  claim: >
    An actor known to behave rationally is predictable, and a predictable actor can be anticipated
    and exploited, so apparent irrationality can be a source of negotiating power. The source's
    political example is a threatened wall and a threatened repeal of a trade agreement, arguing the
    threat alone can achieve the trade objective without the action; its technical example is that
    driverless cars which reliably stop for pedestrians would invite jaywalkers to step out in front
    of them, so such cars may have to learn to appear angry and occasionally fail to stop.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Where an outcome depends on what others expect you to do, removing the certainty of your
      response changes their behaviour without requiring you to act.
  scope:
    domain_discussed_by_source: [negotiation, politics, automated_systems]
    conditions: "situations where others adapt to your expected behaviour"
  caveats:
    - text: >
        The political example is contested territory and the source knows it — it says outright "you
        may hate it, but it works" and "I don't admire him". The claim that the threat achieved the
        trade objective is asserted, with no outcome measured.
      origin: extractor_observed
    - text: >
        The driverless-car claim is attributed only to "some scientists", unnamed and uncited.
      origin: extractor_observed
    - text: >
        The argument is about strategic settings where others respond to your reputation. Applied
        outside those, unpredictability is simply cost.
      origin: extractor_observed
  source_stated_problems: []
