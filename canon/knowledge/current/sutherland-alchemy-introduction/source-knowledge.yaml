- sk_id: sk_sut_alc_0027
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "There is the unambiguously ‘right’ answer, where certainty is achieved by limiting the number of data points considered. The downside of this is that, in the wrong context, it can be hopelessly wrong."
    - "GPS devices know everything about what they know and nothing about anything else."
    - "the reason we don’t always obey our GPS is not because we are wrong: it is because there are important factors in our journey-planning that the GPS is completely ignorant of"
  concept_label: certainty_is_bought_by_narrowing_the_inputs_and_the_narrowing_is_what_makes_it_fail
  label_origin: extractor_assigned
  claim: >
    Logic achieves its unambiguous answers by limiting how many factors it considers, and that same
    limitation is what makes it hopelessly wrong in the wrong context. Psycho-logic considers a far
    wider range and arrives at a not-perfect-but-rarely-stupid conclusion. How much credibility each
    deserves varies by context. The source's extended case is satellite navigation: a technical
    triumph that optimises journey time and distance and knows nothing else — no scenery, no
    preference for continuous slow movement over stop-start traffic, no notion of public transport,
    no trade-off between average journey time and its variance.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A model's certainty comes from excluding variables; anything excluded is invisible to it, so
      confidence and blindness increase together.
  scope:
    domain_discussed_by_source: [decision_making, automated_systems]
    conditions: "any optimiser working on a simplified objective"
  caveats:
    - text: >
        The satellite-navigation account is an analogy for how human reasoning works, and the source
        offers it as a way to understand the book rather than as evidence for the duality.
      origin: extractor_observed
    - text: >
        "Not-perfect-but-rarely-stupid" is a claim about the reliability of intuition that nothing in
        this section supports.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples: {positive: []}
  intra_source_relations:
