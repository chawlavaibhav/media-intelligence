- sk_id: sk_sut_alc_0013
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "while in physics the opposite of a good idea is generally a bad idea, in psychology the opposite of a good idea can be a very good idea indeed: both opposites often work"
    - "there are two equally potent, but completely contradictory, ways to sell a product: ‘Not many people own one of these, so it must be good’ and ‘Lots of people already own one of these, so it must be good.’"
  concept_label: two_opposite_approaches_can_both_work_and_the_context_decides_which
  label_origin: extractor_assigned
  claim: >
    In psychology, unlike physics, the opposite of a good idea can also be a good idea, and both
    often work. Scarcity and ubiquity are both potent selling arguments. The source reports its own
    case: an insurance sales letter that had grown longer paragraph by paragraph, each addition
    improving response, which it rewrote to two paragraphs — and the very short version also worked,
    because a long letter reassures by being thorough and a short one reassures by implying the
    product needs no selling. It observes the same shape in retail, where the top and the bottom of
    the price spectrum have both weathered instability better than the middle, and in its own
    behaviour buying bed linen, where only "zero" or "a lot" carried an emotional reward.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Each of the two opposites carries a different reassurance or reward, so which one works is
      decided by the context and by what the buyer needs reassuring about.
  scope:
    domain_discussed_by_source: [marketing, retail, persuasion]
    conditions: "psychological rather than physical problems"
  caveats:
    - text: >
        The insurance-letter case is the author's own test with a reported directional result, no
        figures, and a single product. The retail and bed-linen observations are assertion and
        introspection.
      origin: extractor_observed
    - text: >
        The claim is a strong one and it removes falsifiability from a large class of advice: if both
        an approach and its opposite may work, no result disconfirms either. The source does not
        supply a rule for deciding which context calls for which.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
