- sk_id: sk_sut_alc_0022
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "‘The trouble with market research is that people don’t think what they feel, they don’t say what they think, and they don’t do what they say.’"
    - "For a business to be truly customer-focused, it needs to ignore what people say. Instead it needs to concentrate on what people feel."
    - "Research will never tell you this"
  concept_label: asking_people_cannot_recover_the_reasons_for_their_behaviour
  label_origin: extractor_assigned
