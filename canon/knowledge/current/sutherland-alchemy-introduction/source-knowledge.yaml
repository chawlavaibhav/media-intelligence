- sk_id: sk_sut_alc_0021
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "we do not have full access to the reasons behind our decision-making because, in evolutionary terms, we are better off not knowing; we have evolved to deceive ourselves, in order that we are better at deceiving others"
    - "It is not enough to conceal them from others – to be really convincing, you also have to conceal them from yourself."
  concept_label: self_deception_evolved_because_concealing_a_motive_from_yourself_conceals_it_from_others
  label_origin: extractor_assigned
  claim: >
    The source reports a theory it attributes to the evolutionary biologist Robert Trivers and the
    evolutionary psychologist Robert Kurzban: people lack access to their own motives because
    concealing them from oneself is what makes concealing them from others convincing. If unconscious
    motivations reached consciousness, subtle behavioural cues would reveal them and damage social and
    reproductive prospects. Its illustration is Trivers's hare, which zigzags to escape a pursuer and
    is safer if the pattern is genuinely random, since foreknowledge of the next jump would show in
    its posture and dogs would learn to read it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Selection against leakage. An animal or person whose own knowledge of its next move is
      detectable by an observer is at a disadvantage, so ignorance of one's own motives is favoured.
  scope:
    domain_discussed_by_source: [evolutionary_psychology, market_research]
    conditions: "motives with social consequences"
  caveats:
    - text: >
        A named third party's theory, reported by the source. There is no value in the SPEC-03
        evidence vocabulary for cited external research, so it is recorded here rather than as
        `empirical_within_source`, consistently with this lane's handling elsewhere.
      origin: extractor_observed
    - text: >
        The source endorses it with a self-interested argument — "if he were not, our job as
        advertisers would be much easier than it is" — which is a reason to expect the theory to be
        congenial, not a reason to think it true.
      origin: extractor_observed
    - text: >
        The hare is an illustration by analogy; nothing in it is evidence about human motivation.
      origin: extractor_observed
