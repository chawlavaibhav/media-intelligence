- sk_id: sk_sut_alc_0024
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "it pays often to ask naïve questions to which the answers seem completely self-evident"
    - "to reach intelligent answers, you often need to ask really dumb questions"
    - "The reason we do not ask basic questions is because, once our brain provides a logical answer, we stop looking for better ones"
  concept_label: asking_a_question_whose_answer_seems_obvious_is_a_productive_method
  label_origin: extractor_assigned
  claim: >
    Deliberately asking questions whose answers appear self-evident is a productive method, because
    the obvious answer is usually a post-rationalisation that stopped the search. The source names
    the mechanism directly: once the brain supplies a logical answer we stop looking for better ones.
    Its worked example is why people dislike standing on crowded trains — an obvious question nobody
    in a rail meeting could answer, which opens onto several candidate explanations (feeling cheated
    of a paid-for seat; the effort of balancing; being unable to read, drink or use a phone; nowhere
    for bags; status and view) and to a design proposal in which standing carries a window view, a
    cushion, a shelf and charging sockets so that it could be chosen rather than endured. The source
    is explicit that it does not know which explanation is right: "We don't know yet."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A satisfying answer terminates enquiry, so the questions that were answered earliest and most
      easily are the ones whose better answers were never found.
  scope:
    domain_discussed_by_source: [research, product_design, marketing]
    conditions: "understanding behaviour that is taken for granted"
  caveats:
    - text: >
        The source states plainly that the train proposal is untested and that it does not know which
        of the candidate explanations holds — "We could find out", "We don't know yet". The example
        demonstrates the method, not a result.
      origin: source_stated
    - text: >
        The method has no stopping rule. Nothing here says how to tell a productive naive question
        from an unproductive one, and the source's own examples are chosen with hindsight.
      origin: extractor_observed
  source_stated_problems:
