- sk_id: sk_sut_alc_0007
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "Not everything that makes sense works, and not everything that works makes sense."
    - "In the other quadrants, ‘wonky’ human perception and emotionality are integral to any workable solution."
    - "although humans can learn how to ride bicycles quite easily, physicists still cannot fully understand how bicycles work"
  concept_label: making_sense_and_working_are_independent_properties
  label_origin: extractor_assigned
  claim: >
    Whether something makes sense and whether it works are two separate dimensions, and all four
    combinations are populated. The source demonstrates this with a chart running FAILS to WORKS
    against MAKES SENSE to SEEMS WEIRD. Only the top-right quadrant — pure science, Newtonian
    physics, the Boeing 787, cars, dishwashers — is where sense and success coincide. Placed in
    makes-sense-and-fails are scientism, Marxism, flossing, economies of scale and mergers,
    management consultancy and economics; in seems-weird-and-works are heuristics, behavioural
    economics, evolution, constitutional monarchy, marketing, bicycles, the Panama Canal, placebos
    and Red Bull; in seems-weird-and-fails are identity politics, water diving and Jonestown. The
    bicycle is singled out in the text: people ride them easily and physicists still cannot fully
    explain how they work.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Where human perception and emotion are part of the system, a solution that ignores them can be
      correct and still fail, and a solution that exploits them can be inexplicable and still work.
  scope:
    domain_discussed_by_source: [business, policy, science, human_affairs]
    conditions: "any problem involving people"
  caveats:
    - text: >
        The placements are the author's assertions, not measurements, and several are strong
        political and scientific claims made by position on a chart rather than by argument —
        Marxism, economics and management consultancy in makes-sense-and-fails, identity politics in
        seems-weird-and-fails. None is defended anywhere in this section.
      origin: extractor_observed
    - text: >
        Almost the entire content of the figure exists only in the figure; the prose beside it names
        just the top-right quadrant and the bicycle. This claim is therefore one of the few in Lane C
        that a text-only extraction would have recorded with nearly all of its content missing.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "the bicycle: ridden easily, still not fully explained by physics, and evolved by trial and error rather than intentional design", figure_ref: image7}
