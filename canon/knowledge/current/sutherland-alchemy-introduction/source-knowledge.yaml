  label_origin: extractor_assigned
  claim: >
    If only options with a prior rationale are ever tried, only effects with a prior rationale can
    ever be found. The source's demonstration is its own envelope test: a logical person would have
    seen no point in testing three of the four variables, and those three are the ones that worked.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
