  concept_label: an_effect_should_not_be_dismissed_because_its_mechanism_is_unacceptable
  label_origin: extractor_assigned
  claim: >
    An effect should not be discounted because the explanation offered for it is implausible. The
    source's case is religious practice: it reports a 1996 Heritage Institute survey on religion in
    American public life associating regular church attendance with marital stability and
    satisfaction, movement out of poverty, lower rates of suicide, drug abuse, out-of-wedlock births,
    crime and divorce, better mental health, recovery from addiction and marital breakdown, greater
    longevity and better recovery from illness. Its argument is that results of that size from a drug
    trial would have us add the drug to tap water, and that not knowing why something works is not a
    reason to be blind to the fact that it does.
