- sk_id: sk_sut_alc_0026
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "the world runs on two operating systems"
    - "This may be true when you are building a road, but it is not true when you are painting the lines on it."
    - "The logical and the psycho-logical approaches run on different operating systems and require different software"
  concept_label: logical_and_psycho_logical_problems_are_different_kinds_of_problem
  label_origin: extractor_assigned
  claim: >
    Problems divide into two kinds needing different methods. A logical problem has a definition of
    success independent of perception — will the bridge carry X vehicles of Y kilograms at Z miles an
    hour — and can be settled in objective units. A psycho-logical problem turns on how people
    respond to informational cues, and the source's illustration is that building a road is the first
    kind while painting the lines on it is the second. Because logic is self-explanatory, it is
    applied by default in social and institutional settings where it has no place, which the source
    describes as running inappropriate software for the operating system.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Where success is defined without reference to perception, objective units suffice; where it
      depends on how people read cues, it does not.
  scope:
    domain_discussed_by_source: [engineering, policy, design, marketing]
    conditions: "choosing a method for a problem"
  caveats:
    - text: >
        The source gives no test for classifying a problem into one kind or the other, and its own
        examples show the two are entangled in the same project rather than cleanly separable.
      origin: extractor_observed
  source_stated_problems:
    - "we end up using inappropriate software for the operating system"
  source_stated_remedies: []
