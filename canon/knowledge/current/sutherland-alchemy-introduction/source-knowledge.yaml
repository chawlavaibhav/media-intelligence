- sk_id: sk_sut_alc_0003
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "100,000 of them announced that the envelopes had been delivered by volunteers; 100,000 encouraged people to complete a form which meant their donation would be boosted by a 25 per cent tax rebate; 100,000 were in better-quality envelopes; and 100,000 were in portrait format"
    - "The ‘rational’ envelope in fact reduces donations by over 30 per cent compared to the plain control, while the other three tests increase donations by over 10 per cent."
    - "it also reduced the proportion of people who gave anything at all; I’ll be honest with you – I have no idea why this should be."
  concept_label: the_only_rational_variant_in_a_field_test_was_the_only_one_that_lost_money
  label_origin: extractor_assigned
  claim: >
    In a charity fundraising test the source's own colleagues ran, envelopes delivered to millions of
    doors were randomly varied four ways at 100,000 each: announcing that volunteers had hand
    delivered them; prompting a form that would add a 25 per cent government tax rebate to the
    donation; better-quality paper; and portrait rather than landscape format. Only the tax-rebate
    variant gives a rational reason to give more. It reduced donations by over 30 per cent against
    the plain control, and reduced the proportion of people giving anything at all. The other three
    each raised donations by over 10 per cent, and the better paper also attracted more donations of
    £100 or more.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Candidate explanations are offered and explicitly held as speculation: a shorter flap may suit
      putting notes or cheques in; thick paper may feel more agreeable to put a large cheque into; a
      volunteer's effort may prompt reciprocation; the mention of a 25 per cent bonus may reduce the
      amount people feel they need to give. For the drop in participation the source says outright
      that it does not know.
  scope:
    domain_discussed_by_source: [charity_fundraising, direct_marketing]
    conditions: "printed door-drop fundraising envelopes in the United Kingdom"
  caveats:
    - text: >
        The source explicitly does not know why the rational variant also cut the number of people
        giving anything, and says so rather than supplying a reason.
      origin: source_stated
    - text: >
        This is the source's own field test, randomised, with a control and roughly 400,000 treated
        units, and it is by a distance the strongest evidence in the section. What it does not carry
        is a client name, a date, absolute donation levels, a significance test, or a definition of
        the control. The effect directions are reported; the underlying numbers are not.
      origin: extractor_observed
    - text: >
        It is one campaign for one cause. The source uses it as the opening metaphor for the whole
        book — "Remember the story of those envelopes" — which is a much larger load than a single
        test can carry.
      origin: extractor_observed
