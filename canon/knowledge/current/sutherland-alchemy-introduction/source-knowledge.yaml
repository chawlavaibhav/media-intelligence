- sk_id: sk_sut_alc_0009
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "There are two separate forms of scientific enquiry – the discovery of what works and the explanation and understanding of why it works. These are two entirely different things, and can happen in either order."
    - "Aspirin, for instance, was known to work as an analgesic for decades before anyone knew how it worked."
    - "Perhaps a plausible ‘why’ should not be a pre-requisite in deciding a ‘what’"
  concept_label: discovering_what_works_and_explaining_why_are_separate_and_can_happen_in_either_order
  label_origin: extractor_assigned
  claim: >
    Finding out that something works and understanding why are two different enquiries which can
    occur in either order. Aspirin was used as an analgesic for decades before its mechanism was
    known; penicillin's discovery was not predicted in advance. The source argues that policy and
    business decisions are overwhelmingly made on a reason-first, discovery-later basis, which it
    calls wasteful in the extreme, and proposes that a plausible why should not be a prerequisite for
    deciding a what.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Evolution is offered as the model: it discovers what survives without needing to know why, and
      works because each gene bears the costs and rewards of its own accidents.
  scope:
    domain_discussed_by_source: [science, policy, business]
    conditions: "deciding what to try"
  caveats:
    - text: >
        Two selected cases of accidental discovery, with no account of how often the reason-first
        method succeeds. The source's own summary — "the record of science in some ways casts doubt
        on a scientific approach to problem solving" — is a rhetorical inversion rather than a
        conclusion the two cases support.
      origin: extractor_observed
    - text: >
        The evolution analogy carries a condition the source does not carry over: evolution works
        because failures are paid for locally and continuously. A business trying things without
        rationale has no equivalent guarantee.
      origin: extractor_observed
  source_stated_problems:
    - "policy and business decisions are overwhelmingly based on a ‘reason first, discovery later’ methodology"
  source_stated_remedies: []
  examples:
    positive:
      - {description: "aspirin, effective for decades before its mechanism was understood; penicillin, whose discovery was not predicted", figure_ref: null}
  intra_source_relations:
