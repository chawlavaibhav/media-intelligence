- sk_id: sk_sut_alc_0029
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "The lesson we should learn from the appendix is that something can be valuable without necessarily being valuable all the time."
    - "In looking for the everyday function of the human appendix, we were looking for the wrong thing."
    - "Be careful before calling something nonsense."
  concept_label: something_can_be_valuable_without_being_valuable_all_the_time
  label_origin: extractor_assigned
  claim: >
    A thing can be genuinely valuable while appearing useless most of the time, so judging it by its
    everyday function is looking for the wrong thing. The source's case is the human appendix, long
    treated as a vestigial remnant because removing it produces no immediate ill effects. It reports
    that in 2007 William Parker, Randy Bollinger and colleagues at Duke University hypothesised that
    it serves as a haven for digestive bacteria valuable for digestion and immunity, and that later
    research showed people whose appendix had been removed were four times more likely to suffer
    clostridium difficile colitis.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Evolution does not take a short-term instrumentalist view, so a feature can be maintained for
      a rare condition rather than a daily one — the source's image is a pouch preserving a starter
      culture.
  scope:
    domain_discussed_by_source: [biology, evaluation_of_practices]
    conditions: "judging whether something serves a purpose"
  caveats:
    - text: >
        Cited third-party research with named investigators, an institution, a date and an effect
        size. As elsewhere in this lane it is not recorded as `empirical_within_source`, because the
        measurement is not the source's own and the vocabulary has no value for cited research.
