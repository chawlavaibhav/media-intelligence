    Asking people why they behave as they do produces plausible post-rationalisations rather than
    reasons, because they do not have access to their own motives. The source quotes David Ogilvy's
    maxim that people do not think what they feel, do not say what they think, and do not do what
    they say, and Bill Bernbach on the need to attend to the unchanging man whose language camouflages
    what really motivates him. Its conclusion is that a genuinely customer-focused business must
    ignore what people say and attend to what they feel.
