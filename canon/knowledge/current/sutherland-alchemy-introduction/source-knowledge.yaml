- sk_id: sk_sut_alc_0015
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "It’s important to remember that big data all comes from the same place – the past."
    - "The need to rely on data can also blind you to important facts that lie outside your model."
    - "‘my data disagree with your anecdotes’"
  concept_label: a_model_built_from_past_data_is_blind_to_what_lies_outside_it
  label_origin: extractor_assigned
  claim: >
    Data comes from the past, so a model built on it cannot see a new pattern, a rogue variable or a
    rare event, and reliance on it blinds the user to relevant facts outside the model. The source's
    case is a 2016 campaign strategist who refused non-quantitative input, mocked a former
    president's suggestion to visit Midwestern working-class voters, dismissed a suggestion with "my
    data disagree with your anecdotes", and sent the candidate to Arizona rather than Wisconsin,
    which she never visited. It adds that the visibly different crowd sizes at the two campaigns were
    relevant information that no model contained.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A model's inputs bound what it can represent, so a genuinely new phenomenon appears in the
      model as noise or not at all.
  scope:
    domain_discussed_by_source: [politics, business, forecasting]
    conditions: "decisions made from quantitative models of past behaviour"
  caveats:
