- sk_id: sk_sut_alc_0008
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "It isn’t, though. It’s a different kind of thing, which I call ‘non-sense’."
    - "much ‘irrational’ human behaviour is not really nonsensical at all; it is non-sensical"
    - "Non-sense includes things that are useful or effective, even though (or perhaps because) they defy conventional logic."
  concept_label: nonsense_and_non_sense_are_different_and_the_hyphen_carries_the_difference
  label_origin: source_verbatim
  claim: >
    The source distinguishes two things a single word normally covers. Nonsense is behaviour that
    genuinely serves nothing, often because we evolved for different conditions. Non-sense, written
    with a hyphen, is behaviour that is useful or effective while defying conventional logic — either
    because we are judging the motive wrongly, or because evolution has found something we have not
    yet explained. The source states that almost all good advertising contains some element of
    non-sense.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Evolution is described as a brilliant uneducated craftsman — what it lacks in intellect it
      makes up for in experience — so behaviour it produced may be effective for reasons no one has
      articulated.
  scope:
    domain_discussed_by_source: [human_behaviour, advertising, evolutionary_psychology]
    conditions: "behaviour that appears irrational"
  caveats:
    - text: >
        The distinction is a definition the source introduces, not a finding, and it has no test:
        nothing here says how to tell in advance which of the two a given piece of behaviour is. In
        practice the source assigns the label after deciding whether the behaviour works.
      origin: extractor_observed
  source_stated_problems:
    - "nonsense"
  source_stated_remedies:
    - "Be careful before calling something nonsense."
  examples:
    positive:
      - {description: "advertisements featuring cute animals outperforming those that do not, explained after the fact by evolved attention to living things", figure_ref: null}
  intra_source_relations:
