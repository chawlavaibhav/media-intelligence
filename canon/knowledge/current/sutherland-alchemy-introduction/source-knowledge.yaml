- sk_id: sk_sut_alc_0031
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "a British team was able to reduce the incidence of accidents on a traffic circle in Florida by 95 per cent by placing the painted lines differently"
    - "In one Dutch town traffic experts improved traffic safety by removing road markings altogether."
  concept_label: changing_the_cues_in_a_physical_environment_can_change_behaviour_more_than_changing_the_structure
  label_origin: extractor_assigned
  claim: >
    Behaviour in a physical environment responds to informational cues, and altering the cues can
    produce large effects without altering the structure. The source reports that a British team cut
    accidents on a Florida traffic circle by 95 per cent by placing the painted lines differently,
    and that traffic experts in a Dutch town improved safety by removing road markings altogether. It
    also notes that the original Clearwater design was not helped by a large decorative fountain in
    the middle, and that a later redesign reduced the accident rate significantly.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Drivers act on how the environment reads to them, so the markings that convey the situation can
      matter more than the geometry they are painted on.
  scope:
    domain_discussed_by_source: [traffic_design, behaviour_change]
    conditions: "environments where people respond to cues"
  caveats:
    - text: >
        The 95-per-cent figure is reported with no date, no baseline accident count, no comparison
        period and no citation. It is the largest single effect claimed anywhere in this section.
      origin: extractor_observed
    - text: >
        The two cases point in opposite directions — place the lines better, and remove them
        entirely — which fits the source's own thesis that opposites can both work, but means neither
        case supports a rule about markings.
      origin: extractor_observed
    - text: >
        The fountain claim and the redesign outcome are carried by the photograph's caption, not by
        the body text.
      origin: extractor_observed
