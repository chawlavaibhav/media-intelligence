- sk_id: sk_sut_alc_0002
  source_id: sutherland_alchemy_introduction
  source_terms:
    - "most things aren't logical – they are psycho-logical"
    - "Rather than being designed to be optimal, it has evolved to be useful."
    - "This alternative logic emerges from a parallel operating system within the human mind, which often operates unconsciously"
  concept_label: psycho_logic_is_a_second_evolved_decision_system
  label_origin: source_verbatim
  claim: >
    Human decisions follow what the source names "psycho-logic": a parallel operating system in the
    mind, largely unconscious, which evolved to be useful rather than designed to be optimal, and
    which often diverges sharply from the logic taught in mathematics or economics. The source
    chooses the term deliberately as neutral, in preference to "emotion", which it says is used as
    code for "you're being an idiot" and which makes non-rational behaviour sound like logic's evil
    twin.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Logic makes a successful engineer; psycho-logic is what made humans a successful species. It
      is an evolved heuristic system, so it optimises for survival and social fitness rather than for
      correctness.
  scope:
    domain_discussed_by_source: [human_behaviour, decision_making, marketing]
    conditions: "human decisions generally, especially in social contexts"
  caveats:
    - text: >
        "Psycho-logic" is the source's own coinage and is offered as a name for a phenomenon, not as
        a theory with content. The source compares it to gravity — "a force that nobody noticed until
        someone put a name to it" — which is a claim about naming, not evidence that the thing named
        behaves in any specified way.
      origin: extractor_observed
    - text: >
        The evolutionary framing is asserted throughout and is not supported in this section by any
        evolutionary evidence.
      origin: extractor_observed
