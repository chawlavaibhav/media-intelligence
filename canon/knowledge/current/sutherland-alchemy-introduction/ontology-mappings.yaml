# CANON-003 Lane C, book 15 — Sutherland, "Alchemy", Introduction. SPEC-05 ontology, source-local.
# Existing relation types only; `distinct_from` per Controller decision 3.
source_id: sutherland_alchemy_introduction
extraction_date: 2026-08-24

terms:

# ── problems ────────────────────────────────────────────────────────────────
- term_id: t_sut_alc_0001
  term: logical_overreach
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: problem
  definition_in_origin_frame: >
    The demand that every solution have a convincing rationale before it can even be considered or
    attempted. The source is explicit that this, and not logic or reason, is what it is attacking.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Some Things Are Dishwasher-Proof, Others Are Reason-Proof'"}
  arising_from: [sk_sut_alc_0032, sk_sut_alc_0004]

- term_id: t_sut_alc_0002
  term: logic_proof_problem
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: problem
  definition_in_origin_frame: >
    A problem on which the logical answer does not work. The source's claim is that these are what
    remain after logical solutions have removed everything they can solve, and that most political,
    business, foreign-policy and marital problems are of this kind.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Some Things Are Dishwasher-Proof, Others Are Reason-Proof'"}
  arising_from: [sk_sut_alc_0006]

- term_id: t_sut_alc_0003
  term: privileging_the_hypothesis
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: problem
  definition_in_origin_frame: >
    Everyone involved in an enquiry becoming fixated on the same theory, so that one shared false
    assumption undermines the whole investigation and contradictory evidence is suppressed or
    ignored.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Crime, Fiction and Post-Rationalism'"}
  arising_from: [sk_sut_alc_0011]

- term_id: t_sut_alc_0004
  term: post_rationalisation
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: problem
  definition_in_origin_frame: >
    A plausible explanation constructed after the event, which the source calls the stock-in-trade of
    the commentariat, and which is mistaken for an ability to predict.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'The Danger of Technocratic Elites'"}
  arising_from: [sk_sut_alc_0010]

- term_id: t_sut_alc_0005
  term: the_man_of_system
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: problem
  definition_in_origin_frame: >
    Adam Smith's figure, quoted at length by the source: a planner so enamoured of his own ideal plan
    that he cannot suffer the smallest deviation from it, and who imagines he can arrange society
    like pieces on a chessboard, forgetting that each piece has a principle of motion of its own. The
    source says the modern man of system is all too likely to be an economist.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Context Is Everything'"}
  arising_from: [sk_sut_alc_0012]

- term_id: t_sut_alc_0006
  term: emotional_misattribution
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: problem
  definition_in_origin_frame: >
    Knowing how one feels while being unable to say accurately why, so that the reason a person
    supplies for a feeling has little to do with its real cause.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Why We Should Ignore Our GPS'"}
  arising_from: [sk_sut_alc_0023]

- term_id: t_sut_alc_0007
  term: nonsense
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: problem
  definition_in_origin_frame: >
    Behaviour that genuinely serves nothing, often because we evolved for conditions different from
    those we now find ourselves in. The source uses the unhyphenated spelling for this and reserves
    the hyphenated form for its opposite.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'On Nonsense and Non-Sense'"}
  arising_from: [sk_sut_alc_0008]

- term_id: t_sut_alc_0008
  term: you_can_never_be_fired_for_being_logical
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: problem
  definition_in_origin_frame: >
    The organisational incentive that produces defensible reasoning instead of effective decisions:
    sound reasoning transfers blame away from the decision maker even when the decision fails, and
    it is much easier to be fired for being illogical than for being unimaginative.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Context Is Everything'"}
  arising_from: [sk_sut_alc_0016]

# ── remedies ────────────────────────────────────────────────────────────────
- term_id: t_sut_alc_0009
  term: test_counterintuitive_things
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    The stated mantra of the division the source founded at its agency: test counterintuitive things,
    because no one else ever does. Its warrant is that logic gets everyone to the same place, so
    advantage can only lie in what nobody has tried.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Context Is Everything'"}
  arising_from: [sk_sut_alc_0017]

- term_id: t_sut_alc_0010
  term: ask_a_dumb_question
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Deliberately asking a question whose answer seems self-evident — why do people clean their teeth,
    why do people go to restaurants, why do people dislike standing on trains — on the ground that
    the obvious answer is what stopped the search.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, opening and 'Why We Should Ignore Our GPS'"}
  arising_from: [sk_sut_alc_0024]

- term_id: t_sut_alc_0011
  term: what_before_why
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Deciding what to try without first requiring a plausible explanation of why it should work, on
    the model of aspirin and penicillin, whose effects were established long before their mechanisms.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'The Danger of Technocratic Elites'"}
  arising_from: [sk_sut_alc_0009]

- term_id: t_sut_alc_0012
  term: watch_what_people_feel_not_what_they_say
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Ignoring stated preferences and attending to behaviour and feeling instead, because people do not
    have access to their own motives. The source's warrant is Ogilvy's maxim that people do not think
    what they feel, do not say what they think, and do not do what they say.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'Why We Should Ignore Our GPS'"}
  arising_from: [sk_sut_alc_0022]

- term_id: t_sut_alc_0013
  term: signal_through_the_details_people_can_judge
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Investing in the peripheral, observable details a customer can assess — on-board catering, a
    reception area — because they are what carries the judgement of the substance the customer
    cannot assess.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'On Nonsense and Non-Sense'; 'Why We Should Ignore Our GPS'"}
  arising_from: [sk_sut_alc_0020]

- term_id: t_sut_alc_0014
  term: try_the_opposite_too
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Treating the reverse of a working approach as a candidate rather than as a refuted alternative,
    because in psychology both opposites often work and the context decides which. The source's own
    case is a long sales letter and a two-paragraph one that both succeeded.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'The Opposite of a Good Idea Can Be a Good Idea'"}
  arising_from: [sk_sut_alc_0013]

- term_id: t_sut_alc_0015
  term: minimise_the_worst_case_not_the_average
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: remedy
  executable_by: [unknown]
  definition_in_origin_frame: >
    Choosing the option with the least-bad worst outcome rather than the best expected one, where the
    penalty for the worst case is discontinuous. The source's case is driving to an airport by slower
    back roads to avoid a small chance of missing a flight.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Why We Should Ignore Our GPS'"}
  arising_from: [sk_sut_alc_0028]

# ── properties ──────────────────────────────────────────────────────────────
- term_id: t_sut_alc_0016
  term: psycho_logic
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: property
  definition_in_origin_frame: >
    The source's coinage for the way humans actually make decisions: a parallel, largely unconscious
    operating system that evolved to be useful rather than being designed to be optimal. Chosen
    deliberately as a neutral term in preference to "emotion", which the source says is used as code
    for "you're being an idiot".
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Introducing Psycho-Logic'"}
  arising_from: [sk_sut_alc_0002]

- term_id: t_sut_alc_0017
  term: non_sense
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: property
  definition_in_origin_frame: >
    The source's hyphenated coinage for behaviour that is useful or effective while defying
    conventional logic — either because we are judging the motive wrongly or because evolution found
    something we have not yet explained. Explicitly not the same as nonsense.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'On Nonsense and Non-Sense'"}
  arising_from: [sk_sut_alc_0008]

- term_id: t_sut_alc_0018
  term: alchemy
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: property
  definition_in_origin_frame: >
    The source's name for its own subject: "the science of knowing what economists are wrong about".
    Its skill is said to lie not in understanding universal laws but in spotting the many instances
    where those laws do not apply, and in knowing when and how to abandon narrow logic.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Introducing Psycho-Logic'"}
  arising_from: [sk_sut_alc_0002, sk_sut_alc_0012]

- term_id: t_sut_alc_0019
  term: the_four_s_es
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: property
  definition_in_origin_frame: >
    The book's named framework of reasons humans evolved to behave in seemingly illogical ways:
    Signalling, Subconscious hacking, Satisficing and Psychophysics. Named in the processed section
    and defined nowhere in it. The source's own text is internally inconsistent here — the heading
    says four, the sentence says five, the list has four, and a footnote jokes about the one
    beginning with P. Recorded as the source has it.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'The Four S-es'"}
  arising_from: [sk_sut_alc_0025]

- term_id: t_sut_alc_0020
  term: two_operating_systems
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: property
  definition_in_origin_frame: >
    The source's framing of the split between problems whose success is definable in objective units
    independent of perception, such as building a road, and those that turn on how people read cues,
    such as painting the lines on it.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Introduction, 'Context Is Everything'"}
  arising_from: [sk_sut_alc_0026]

- term_id: t_sut_alc_0021
  term: self_deception
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: property
  definition_in_origin_frame: >
    Lack of access to one's own motives, attributed by the source to Trivers and Kurzban as an evolved
    trait: concealing a motive from yourself is what makes concealing it from others convincing.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, 'Why We Should Ignore Our GPS'"}
  arising_from: [sk_sut_alc_0021]

- term_id: t_sut_alc_0022
  term: makes_sense_versus_works
  origin: source
  origin_ref: sutherland_alchemy_introduction
  kind: property
  definition_in_origin_frame: >
    The two independent axes of the source's chart. Whether something makes sense and whether it
    works are separate properties, and all four combinations are populated — pure science in the
    quadrant where they coincide, and placebos, marketing, heuristics and Red Bull among the things
    that seem weird and work.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Introduction, the chart at the end of 'Introducing Psycho-Logic'"}
  arising_from: [sk_sut_alc_0007]

relationships:

- from: t_sut_alc_0007
  to: t_sut_alc_0017
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    The only relation in this lane that the source itself asserts as a distinction rather than
    leaving us to check. Sutherland introduces the hyphen specifically to hold them apart: nonsense
    serves nothing, non-sense is effective while defying conventional logic. The two would collapse
    into one string on any normalisation that ignored punctuation, and the whole argument of the
    section depends on their being separate. Recorded with `confidence_basis: source_stated` because
    the distinction is the source's, not our judgement.

- from: t_sut_alc_0001
  to: t_sut_alc_0002
  relation: related_to
  confidence_basis: source_stated
  note: >
    Logical overreach is the practice; a logic-proof problem is what the practice leaves behind. Cause
    and residue, stated together across two sections.

- from: t_sut_alc_0004
  to: t_sut_alc_0003
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Both are the mind settling on a satisfying account too early — one after the event, one during an
    enquiry. Checked for `distinct_from` and left as related: post-rationalisation is an individual
    explaining what already happened, privileging the hypothesis is a group committing to a theory
    while the outcome is still open. Related in mechanism, different in timing and in who does it.

- from: t_sut_alc_0016
  to: t_sut_alc_0020
  relation: related_to
  confidence_basis: source_stated
  note: >
    The intended relation is that psycho-logic is one of the two operating systems — a
    narrower-than relation. `related_to` is used because the relations this worker may set locally
    are limited to `related_to` and `potentially_equivalent_to`; the intended reading is recorded
    here. This is the same downgrade recorded elsewhere in this lane.

- from: t_sut_alc_0008
  to: t_sut_alc_0009
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    The source sets these against each other without naming the opposition: the incentive never to be
    fired for being logical is exactly what stops anyone testing counterintuitive things. Problem and
    remedy, connected by us rather than by the text.

- from: t_sut_alc_0010
  to: t_sut_alc_0012
  relation: related_to
  confidence_basis: source_stated
  note: >
    Both are ways of getting at motives people cannot report. The source presents them together in
    the same section, one as the question to ask and the other as the evidence to trust.

- from: t_sut_alc_0011
  to: t_sut_alc_0009
  relation: related_to
  confidence_basis: source_stated
  note: >
    Dropping the requirement for a prior explanation is what makes testing counterintuitive things
    possible at all; the source states the dependence.

- from: t_sut_alc_0006
  to: t_sut_alc_0021
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source presents emotional misattribution as the everyday surface of evolved self-deception —
    a narrower-than relation again, recorded as `related_to` for the reason given above.

- from: t_sut_alc_0022
  to: t_sut_alc_0017
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Non-sense is the source's name for the seems-weird-and-works quadrant of the chart. The chart and
    the coinage appear in different sections and the source never connects them explicitly, so the
    connection is ours.

- from: t_sut_alc_0005
  to: t_sut_alc_0001
  relation: related_to
  confidence_basis: source_stated
  note: >
    The man of system is the source's borrowed name for the person who commits logical overreach.
    Kept separate because the Smith figure is about attachment to a plan and the source's own term is
    about a precondition demanded of others' proposals.

concepts:

- concept_id: sc_sut_alc_case_against_overreach
  kind: source_specific_concept
  origin_ref: sutherland_alchemy_introduction
  label: the_case_against_logical_overreach
  children_terms: [t_sut_alc_0001, t_sut_alc_0002, t_sut_alc_0004, t_sut_alc_0005, t_sut_alc_0008, t_sut_alc_0003]
  origin: source_stated
  basis: >
    The source coins or adopts each of these terms and develops them as one argument across five
    consecutive sections, and states the argument's scope in its own words. The grouping is the
    Introduction's own structure.
  asserts_agreement_between_sources: false

- concept_id: sc_sut_alc_psycho_logic
  kind: source_specific_concept
  origin_ref: sutherland_alchemy_introduction
  label: psycho_logic_and_its_vocabulary
  children_terms: [t_sut_alc_0016, t_sut_alc_0017, t_sut_alc_0007, t_sut_alc_0020, t_sut_alc_0021, t_sut_alc_0006, t_sut_alc_0022, t_sut_alc_0019, t_sut_alc_0018]
  origin: source_stated
  basis: >
    Every term here is the source's own coinage or its own framing, introduced explicitly as
    vocabulary for the thing the book is about. This is a source generalising over words it invented,
    which is the clearest case a source_specific_concept can have.
  asserts_agreement_between_sources: false

- concept_id: sc_sut_alc_working_method
  kind: source_specific_concept
  origin_ref: sutherland_alchemy_introduction
  label: the_working_method_implied_by_the_argument
  children_terms: [t_sut_alc_0009, t_sut_alc_0010, t_sut_alc_0011, t_sut_alc_0012, t_sut_alc_0013, t_sut_alc_0014, t_sut_alc_0015]
  origin: extractor_inferred
  basis: >
    The source issues each of these instructions separately and never gathers them into a method; it
    says its intention is to give the reader permission rather than a procedure. The grouping is ours
    and is marked as such. It is recorded because a source like this one invites being silently
    summarised as a method, and doing that without saying so would convert a book that refuses to
    offer a recipe into one that does.
  asserts_agreement_between_sources: false
