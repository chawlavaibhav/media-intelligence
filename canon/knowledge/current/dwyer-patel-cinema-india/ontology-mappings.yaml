  - sk_dpci_0120
  kind_before_spec05_reclassification: failure_mode
- term_id: t_dpci_0032
  term: describing_a_work_the_audience_already_knows
  origin: extractor
  origin_ref: canon_014
  kind: problem
  definition_in_origin_frame: 'Producing an asset that describes a work to an audience that has already
    encountered it, when the asset''s job is to index it. Named from the re-release redesign case, where
    the source records the industry converging on the opposite move.

    '
  first_seen: 2026-08-30
  verbatim: false
  source_ref:
    locator: Ch. 3, printed p. 150
  arising_from:
