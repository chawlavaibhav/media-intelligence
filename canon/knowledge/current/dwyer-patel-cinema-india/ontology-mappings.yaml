- term_id: t_dpci_0052
  term: ask_whether_the_brief_is_to_describe_or_to_index
  origin: extractor
  origin_ref: canon_014
  kind: remedy
  definition_in_origin_frame: 'For an asset about a work the audience may already know, decide explicitly
    which of the two briefs is in play before designing. Executor: whoever sets the brief. The source
    records the distinction and one studio''s answer; it supplies no method for finding a remembered signifier
    and none is invented here.

    '
