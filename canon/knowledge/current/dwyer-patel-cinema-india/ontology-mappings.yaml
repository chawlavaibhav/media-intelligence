- term_id: t_dpci_0051
  term: name_the_level_an_effect_belongs_to
  origin: extractor
  origin_ref: canon_014
  kind: remedy
  definition_in_origin_frame: 'Before relying on a design effect, state whether it is claimed at the level
    available to any viewer or at the level available only to a viewer holding the code, and record which.
    Executor: the person or process making the claim, not the generator. This is a discipline of statement,
    not a test; the source supplies no test.

    '
  first_seen: 2026-08-30
  verbatim: false
  source_ref:
    locator: Ch. 4, printed p. 183
