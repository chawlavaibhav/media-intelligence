  term: corpus_survival_bias
  origin: extractor
  origin_ref: canon_014
  kind: problem
  definition_in_origin_frame: 'Reasoning about a practice from the artefacts that happened to survive,
    when the most characteristic artefacts of that practice were systematically destroyed. Named from
    the source''s own declaration about hoardings.

    '
  first_seen: 2026-08-30
  verbatim: false
  source_ref:
