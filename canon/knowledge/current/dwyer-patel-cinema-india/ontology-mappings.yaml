- term_id: t_dpci_0031
  term: culture_bound_effect_read_as_universal
  origin: extractor
  origin_ref: canon_014
  kind: problem
  definition_in_origin_frame: 'Treating a design effect that depends on the viewer holding a code as though
    it were available to any viewer. Named because the source draws the line explicitly and twice, for
    star recognition and for character types, and because collapsing the two levels is the specific error
    its two-level account is built to prevent.

    '
  first_seen: 2026-08-30
  verbatim: false
  source_ref:
    locator: Ch. 4, printed pp. 183 and 194
  arising_from:
