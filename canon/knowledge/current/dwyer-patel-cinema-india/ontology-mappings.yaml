terms:
- term_id: t_dpci_0001
  term: darshan
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'A two-way look, used most often in the context of religious worship, in
    which the beholder takes darshan (darshan lena) and the object gives darshan (darshan dena), and in
    which the image rather than the person looking holds the power: it authorises the look rather than
    merely being its object, thereby benefiting the beholder. The source reports it as also applicable
    to social and political authority, and as invited in film by tableaux.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 1 'Indian Cinema', printed p. 33; Ch. 2, printed pp. 45-46
  arising_from:
  - sk_dpci_0010
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0002
  term: frontality
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: property
  definition_in_origin_frame: 'Geeta Kapur''s formal category for the Indian popular arts, as reported
    by the source: not merely filming from a right-angle plane or direct address to camera, but a mode
    operating also through the spectator''s knowledge of narrative and mise-en-scene. Dwyer adds that
    it may be seen as a freezing of space, and sometimes of time, into a tableau.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 2, printed p. 44
  arising_from:
  - sk_dpci_0020
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0003
  term: iconicity
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: property
  definition_in_origin_frame: 'Used by the source after Geeta Kapur and expressly NOT in the Peircean
    sense of a relation of resemblance, but as a meaningful condensation of symbolic meanings into one
    static image, which is not necessarily religious or mythological. The source flags the non-standard
    sense itself.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 2, printed p. 44
  arising_from:
  - sk_dpci_0020
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0004
  term: attractions
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'Units of spectacle that interrupt linear narrative and the realist illusion,
    after Gunning and Gaudreault, as applied to Hindi cinema by Vasudevan and reported here. The source
    lists the main ones: sets and costumes, action sequences, presentation of the stars, grandiloquent
    dialogues, song and dance sequences, comedy interludes and special effects. Manmohan Desai''s own
    word for them, ''items'', is recorded by the source.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 1, printed pp. 29-31
  arising_from:
  - sk_dpci_0060
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0005
  term: items
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'The industry''s own term, attributed by the source to the director Manmohan
    Desai, for attractions piled one on another and subordinating the narrative.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 1, printed p. 31
  arising_from:
  - sk_dpci_0060
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0006
  term: glamorous_realism
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: property
  definition_in_origin_frame: 'Yash Chopra''s own term, reported by the source, for a style he uses in
    which reality is glossed over to make it more attractive.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 1, printed p. 29
  arising_from:
  - sk_dpci_0030
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0007
  term: filmi
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: property
  definition_in_origin_frame: '''Belonging to or associated with film''. The source records that the term
    is used derogatorily, to suggest something cheap and trashy, and that this pejorative status is part
    of what has held the Hindi film industry back from recognition as cultural capital. The Conclusion
    reports that by 2002 ''anything filmi is out'' within the industry itself.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 1, printed p. 30; Conclusion, printed p. 217
  arising_from:
  - sk_dpci_0190
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0008
  term: masala_film
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'The source''s term (alongside ''formula film'') for the genre in which
    the circular narrative, the range of emotions, the blending of song and dance spectacle with fight
    sequences, and the archetypal character types are combined; described as developing in the post-war
    period.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 4, printed p. 194
  arising_from:
  - sk_dpci_0120
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0009
  term: hierarchy_of_responses
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'Patel''s term for the layered way a poster is read: certain elements are
    immediately and universally understood while other elements require specific cultural knowledge to
    be understood.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 4, printed p. 183
  arising_from:
  - sk_dpci_0090
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0010
  term: overpainting
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'The technique of applying oil or gouache paint, often with a knife in thick
    textured strokes, over a photographic still, used to place the artist''s interpretation over the photographic
    image and principally to express and emphasise emotion. The source traces it to nineteenth-century
    Indian painted photography and dates its displacement by computer imagery through the 1990s.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 3, printed p. 171; Ch. 4, printed pp. 187-190
  arising_from:
  - sk_dpci_0110
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0011
  term: the_mask
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'Patel''s term for the star''s constructed identity or ''social role'' as
    it is projected in a portrait, as against the true identity of the person, which conventional portraiture
    sought. She reports that the properties of the mask act as symbols with which the public identifies
    the subject.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 4, printed p. 187
  arising_from:
  - sk_dpci_0100
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0012
  term: symbolic_biography
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'The star identity formed through the films an actor appears in, the characters
    played, and the documentation of public and private life in the media.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 4, printed p. 184
  arising_from:
  - sk_dpci_0100
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0013
  term: splitting
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'Also ''doubling'': the device by which the good and bad characteristics
    of one person are manifested through two characters, most often the good and bad brother. The source
    reports one pictorial application, a Deewaar poster in which Bachchan''s face is coloured half in
    reds and pinks and half in blues.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 4, printed pp. 195-198
  arising_from:
  - sk_dpci_0120
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0014
  term: chronotope_of_romance
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'A time-place associated with romance in this cinema — Kashmir and by extension
    Switzerland and other mountainous areas, the log cabin, parks and gardens in bloom, waterfalls, the
    tropical beach — functioning as a private space within the public domain, away from family surveillance.
    The source also gives a seasonal form: spring for love in union, the rainy season for love in separation.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 2, printed pp. 58-60
  arising_from:
  - sk_dpci_0050
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0015
  term: personification_acting
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'After Barry King, as reported by the source: acting in which the actor''s
    persona retains significant similarities across different performances, as against impersonation,
    in which the actor transforms body and voice. The source states that the former is found most often
    in Hindi cinema and that it restricts the way in which an image can be presented.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 1, printed p. 29
  arising_from:
  - sk_dpci_0080
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0016
  term: secular_darshan
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'Patel''s deliberately weakened application of darshan to poster design,
    where the conventions of realism, centrality and frontal encounter bring the gazes of subject and
    viewer together. She marks the downgrade explicitly: ''when expressed in relation to poster design
    it must be termed a secular darshan''.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 4, printed p. 192
  arising_from:
  - sk_dpci_0110
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0017
  term: activation_of_memory
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'The source''s term for the design objective in re-release publicity: creating
    an image that will most effectively trigger the memory of a public already familiar with the film,
    by highlighting what has over time become a key signifier of it.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 3, printed p. 150
  arising_from:
  - sk_dpci_0140
  kind_before_spec05_reclassification: source_specific_concept
- term_id: t_dpci_0018
  term: video_holdback
  origin: source
  origin_ref: dwyer_patel_cinema_india
  kind: entity
  definition_in_origin_frame: 'The practice, attributed by the source to Sooraj Barjatya with Hum aapke
    hain kaun (1994), of delaying the video release rather than issuing it alongside cinema prints, in
    order to change film viewing practice; taken by Yash Raj Films to the point where Dilwale Dulhania
    Le Jayenge (1995) was not released on video until 2002.

    '
  first_seen: 2026-08-30
  verbatim: true
  source_ref:
    locator: Ch. 1, printed p. 25
  arising_from:
  - sk_dpci_0180
  kind_before_spec05_reclassification: source_specific_concept
