- term_id: t_dpci_0034
  term: discontinuity_scored_inside_a_licensed_unit
  origin: extractor
  origin_ref: canon_014
  kind: problem
  definition_in_origin_frame: 'Reporting as a defect a continuity break that falls inside a convention
    the audience understands as suspending the work''s rules. Named from the song sequence, where costume
    changes without elapsed time and cuts between continents without travel are licensed.

    '
  first_seen: 2026-08-30
  verbatim: false
  source_ref:
    locator: Ch. 1, printed pp. 37-38; Ch. 2, printed p. 55
  arising_from:
