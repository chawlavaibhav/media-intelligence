  - constrains
  rationale: 'Patel separates, explicitly and in the same passage, an attentional effect she offers as
    general (a human face draws the glance whether or not the person is recognised) from a recognition
    effect she says does not travel (an Indian star "will be unknown to the wider Western audience ...
    and the poster will not evoke the same response"). She draws the same line again for character types,
    which "are not universally recognized". This project generates and evaluates media for audiences it
    does not choose, and the distinction between what a design does for any viewer and what it does only
    for a viewer holding the code is exactly the distinction that gets collapsed when a convention is
    lifted out of its context. The binding is to that DISTINCTION, not to either effect.

    '
  applicability:
    when: assessing whether an observed or intended effect of a design is available to a viewer outside
      the culture that produced the convention
    limits: 'The source measures neither effect. The attentional claim is asserted from developmental
      and expressive premises with no test of any kind, and must not be cited as evidence that faces draw
      attention. What is usable is the two-level distinction and the source''s insistence that the second
      level is culture-bound. It supports asking which level an effect belongs to; it supports no prediction
      about either level, and no threshold.

      '
  governance_consumer: evidence_interpretation
