  repair_ontology_refs: []
  status: proposed
  status_reason: not reviewed; scoping question only, no threshold adopted
bindings_considered_and_not_made:
- proposed_id: bnd_dpci_0005
  target_type_considered: production
  source_knowledge_refs:
  - sk_dpci_0030
  - sk_dpci_0040
  - sk_dpci_0070
  outcome: not_made
  reason: 'The extraction bound this with role `informs`, which SPEC-04 does not define. Its content is
    an observation about one cinema in one period - that in a melodramatic mode, setting and costume are
    asked to carry a character''s interior state - not an action a production step could take. None of
    SPEC-04''s seven roles fits it: it fills nothing, constrains nothing we do, diagnoses nothing, repairs
    nothing, derives nothing, flags nothing and evaluates nothing. Replacing `informs` with a stronger
    role to keep the binding alive would have asserted an operational relation the source does not support,
    so the binding was removed. THE KNOWLEDGE IS UNAFFECTED: sk_dpci_0030, sk_dpci_0040 and sk_dpci_0070
    are unchanged, and a SourceKnowledge object with no binding is a normal SPEC-04 state.'
