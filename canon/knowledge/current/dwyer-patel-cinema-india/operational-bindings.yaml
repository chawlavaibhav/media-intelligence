  role:
  - flags
  rationale: 'The source declares, about its own study, that the form it calls the most distinctive feature
    of its medium is the one systematically absent from its evidence, because hoardings are destroyed
    when a film''s run ends. This is a clean, self-reported instance of a survival bias in a corpus: what
    is available to study is not what was most characteristic of the practice. This project builds corpora
    and reasons from them, and the shape of the error is transferable even though the particular corpus
    is not.

    '
  applicability:
    when: reasoning from any corpus of surviving artefacts about the practice that produced them
    limits: 'This is a single documented instance, not a general result about corpora, and the source
      neither quantifies the loss nor attempts to correct for it. It supports asking what a corpus systematically
      failed to preserve; it supports no correction and no estimate.

      '
  governance_consumer: evidence_interpretation
