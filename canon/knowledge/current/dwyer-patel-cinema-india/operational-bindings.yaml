  role:
  - flags
  rationale: 'Patel documents a design problem this project will meet: producing an asset for a work the
    audience has already encountered. The move she records is not to describe the work again but to identify
    what has since become its remembered signifier and build on that — including, in the Aan case, an
    image the original publicity did not carry at all. The general form of the observation is that for
    a re-encountered work the asset''s job changes from describing to indexing, and that what indexes
    it best may not be what was salient the first time. That is a real distinction between two briefs
    that are easy to confuse.

    '
  applicability:
    when: producing an asset for a work, product or campaign the intended audience has already encountered
    limits: 'One studio, one designer, one decade, eight titles, and no outcome data of any kind — the
      source does not report whether the redesigns worked. It supports naming the two briefs and asking
      which one is in play. It supports no method for identifying a remembered signifier, and no claim
      that doing so improves any outcome.

      '
  governance_consumer: rule_application
  evidence_basis: derived_from_source
