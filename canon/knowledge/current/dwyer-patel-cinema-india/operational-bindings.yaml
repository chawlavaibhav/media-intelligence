  role:
  - diagnoses
  rationale: 'Dwyer describes a case in which continuity violations that would ordinarily be defects are
    not defects, because they occur inside a unit the audience understands as suspending the work''s own
    rules: within a song sequence, costume changes without elapsed time and cuts between continents without
    travel are licensed. Whether a discontinuity in a generated time-based asset falls inside or outside
    such a licensed unit is directly inspectable, and it determines whether the discontinuity should be
    reported as a fault at all. This bears on how a checker should be scoped, which is live work in this
    project.

    '
  observation_unit: whole_asset
  applicability:
    when: inspecting a time-based asset for continuity, where part of the asset may belong to a convention
      that licenses discontinuity
    limits: 'Dwyer''s assertion that the audience "does not seem to be disturbed at all" carries no evidence;
      no audience study exists in this book. The binding supports asking whether a discontinuity sits
      inside a licensed unit before scoring it. It does NOT license ignoring discontinuity, does not identify
      which units are licensed in any other tradition, and supplies no pass mark. The convention itself
      is dated by the source''s Conclusion and must not be assumed current.

      '
  evidence_basis: derived_from_source
  empirical_refs: []
