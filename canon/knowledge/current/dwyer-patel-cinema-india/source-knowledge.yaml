    page_start: 29
    page_end: 38
    locator: "Ch. 1 'Indian Cinema', sections 'A Cinema of Attractions?' and 'Attraction: Song and Dance', printed pp. 29-38"
    figure_refs: ["illus. 6 Naseeb 1981", "illus. 8 Taal 1998"]
