- sk_id: sk_dpci_0060
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "attractions"
    - "items"
    - "cinema of attractions"
  concept_label: the_song_sequence_as_a_licensed_suspension_of_continuity_time_and_place
  label_origin: extractor_assigned
  claim: >
    Dwyer reports Vasudevan's argument that Indian cinema's relationship between narrative,
    performance sequence and action spectacle is loosely structured in the fashion of a "cinema of
    attractions" (Gunning and Gaudreault), and describes what the song sequence is licensed to
    suspend: real time, with the heroine changing costume repeatedly within one sequence; location,
    which may move from India to Switzerland without any reference to moving in space; and narrative
    consequence, since love "may be expressed in the song but not necessarily acknowledged in the
    narrative." She adds that eroticism in the movies is largely contained within the song, which also
    contains other breaks in continuity such as numerous costume changes and a whole different range
    of gesture and movement.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An attraction is a unit the audience accepts as suspending the film's own rules for its
      duration. Because the suspension is bounded and signalled, material that could not survive
      inside the narrative — costume changes without elapsed time, continents crossed without travel,
      eroticism, declarations that leave no trace — can be carried there without damaging the
      narrative it interrupts.
  scope:
    domain_discussed_by_source: [hindi_cinema, song_and_dance, continuity]
    conditions: >
      Hindi commercial cinema. Dwyer notes that attractions appeared in certain genres of early Indian
      cinema (the stunt and the mythological), entered the previously middle-class 'social' by the
      1950s, were largely eschewed by state-sponsored realism after Prasad's 1970s segmentation, and
      were "deployed to the full" by the aesthetic of mobilisation. The device is period-differentiated
      by the source, not constant.
  caveats:
    - text: "Dwyer expressly tracks the device's uneven presence across genres and decades, so 'Hindi film suspends continuity in songs' as a flat statement is weaker than what she says"
      origin: source_stated
    - text: "the source treats the audience's acceptance of the suspension as given and does not evidence it"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - "Naseeb (1981), a denouement staged during and after a song in a revolving restaurant, the multi-star cast dressed as Cossacks, Chaplin and Hepburn, a matador and a flamenco dancer"
      - "Darr (1993), where during a song a flat appears fully furnished and the walls open onto a Swiss meadow"
  intra_source_relations:
    - {relation: supports, target: sk_dpci_0050, note: "the frame within which the location device operates"}
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: "1, Indian Cinema"
