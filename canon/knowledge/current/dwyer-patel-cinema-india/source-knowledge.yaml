- sk_id: sk_dpci_0150
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "each distinct phase in development marked a distinct aesthetic change in advertising"
    - "Film advertising reflected the Zeitgeist"
  concept_label: advertising_style_as_a_period_marker_and_the_authors_own_periodisation
  label_origin: extractor_assigned
  claim: >
    Patel's organising claim for chapter 3 is that Indian film advertising did not evolve toward a
    single style but moved through distinct phases, each borrowing "the aesthetic vocabulary of the
    period." She sets out the sequence: text-only newspaper notices and handbills (1896 onward); the
    Ravi Varma aesthetic, realist oil technique applied to Hindu mythological subject matter, carried
    into posters via the Varma press's oleographs; the Bombay School of Art style, a delicate realism
    tied to Ajanta revival and used when a studio wanted to signal that a film was special; Art Deco
    from the 1930s as a universal symbol of modernity, which "did not survive beyond the end of the
    1940s" in India because it was seen as Western cultural imperialism; nationalist imagery around
    Independence, often using the map of India; overpainted montage in the 1970s-80s; and
    computer-aided design from the 1990s.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Patel's stated mechanism is that a style already carries associations before a poster uses it,
      so choosing a style is a way of saying something the image itself does not have to depict. She
      states it explicitly for the art-school style: it was "referred to whenever there was a need to
      communicate more than the basic information about a film," and in these instances "the mode of
      representation was often used to reflect or reinforce underlying messages about current cultural
      and political issues."
  scope:
    domain_discussed_by_source: [film_advertising_history, indian_graphic_design, 1896_to_2002]
    conditions: >
      Indian film advertising 1896-2002. Every phase is dated by the source. The claim is a
      periodisation, not a description of a standing style.
  caveats:
    - text: "THIS IS THE OBJECT THAT PROTECTS THE REST FROM BEING FLATTENED. The source's own thesis is that the style changed repeatedly and that each change tracked a change in its environment. Any use of this book that produces a single timeless 'Indian poster style' contradicts the source's central argument"
      origin: source_stated
    - text: "the mechanism — style carries prior association — is stated and illustrated but not tested; the source shows that designers used styles this way, not that audiences read them so"
      origin: extractor_observed
    - text: "attributions are uneven: many booklets and posters of the period 'were unsigned', and Patel says so. Some phase-to-artist assignments therefore rest on stylistic attribution"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies: []
  examples:
