    - text: "the claim that these particular images had 'become key signifiers' over time is asserted; no evidence of what audiences actually remembered is presented"
      origin: extractor_observed
    - text: "INSPECTED: illus. 96, the 1980s Mother India poster, was opened and read directly. The outstretched arm across the diagonal, the low viewpoint, the orange-red-yellow palette and the three-dimensional lettering are all present as Patel describes them"
      origin: extractor_observed
  source_stated_problems:
