  label_origin: extractor_assigned
  claim: >
    Patel gives a dated, step-by-step account of one release's publicity process (Mohabbatein, Yash
    Raj Films, 2000): stills are taken from the first day of filming; work on posters begins twelve
    weeks before release and the design must be with the printers eight weeks before; twelve posters
    were produced in total — eight one-sheet designs at a print run of 250,000, one four-sheet at
    15,000, three six-sheet at 30,000; four weeks before release distributors receive lobby cards,
    booklets and one-sheet posters free of charge while paying for the larger sizes; two weeks before
    release the artwork must be displayed in cinemas; 'soft' television publicity starts twelve weeks
    before release with short trailers shown ten times a day across different channels; the music is
    released two weeks after that; aggressive television advertising starts two weeks before release
    at up to six trailers a day on one channel at peak time.
