      Patel grounds the first stage in the claim that the structuring of human relationships from the
      earliest stages of life is based on physical appearance and facial recognition, and that the
      face is "the primary field of expressive action" where all forms of emotion can be made visible,
      so it holds attention at a deeper level than other visual images. The second stage is not
      perceptual but cultural: it depends on the viewer holding the star's accumulated text.
  scope:
