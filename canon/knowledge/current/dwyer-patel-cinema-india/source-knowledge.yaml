- sk_id: sk_dpci_0040
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "the tonga, or horse and cart, represents the rural or the historical"
    - "the train is a major icon of modernity"
    - "pianos are icons of modern bourgeois style"
  concept_label: props_and_vehicles_as_a_conventional_vocabulary_for_period_class_and_modernity
  label_origin: extractor_assigned
  claim: >
    Dwyer states that props used in Hindi films have acquired their own symbolic meanings and gives an
    enumerated set: pianos are icons of modern bourgeois style in the 1950s and '60s; high-tech goods
    such as mobile phones, video cameras and computers carry the same office in the 1990s. She gives a
    parallel enumeration for transport: the tonga represents the rural or the historical; the horse
    the aristocrat or untameable nature; the train is a major icon of modernity; the bicycle indicates
    youth and freedom; the car allows a display of a wide range of wealth; the autorickshaw and the
    taxi tie together middle-class and proletarian city dwellers.
  claim_type: explicit_source_claim
  interpretation_basis: null
