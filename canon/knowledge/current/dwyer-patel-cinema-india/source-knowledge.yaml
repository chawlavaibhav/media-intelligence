- sk_id: sk_dpci_0170
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "the vision of the director could be easily transferred to posters through the use of computer technology"
    - "Advertising is therefore not about 'art' but about selling an image"
  concept_label: the_1990s_shift_from_painted_montage_to_computer_composition_and_what_it_cost
  label_origin: extractor_assigned
  claim: >
    Patel documents a technology-driven change in who makes posters and what they look like. From the
    early 1990s, photographic stills fed into a computer could be manipulated on screen, "allowing for
    the smooth superimposition, juxtaposition, reduction, enlargement and colour contrasting of images
    and text with relative ease," and the characteristic overpainted montage of the previous two
    decades was replaced by images "defined by simplicity and elegance." She reports the consequence
    for personnel plainly: "the role of the traditional artist has been displaced by the computer
    specialist," naming H.R. Enterprises, run by two publicity designers who are not trained artists
    but have extensive computer knowledge, and Yash Raj Films' in-house Design Cell under Fayyaz
    Badruddin, also a computer specialist. She records the practitioners' own views on both sides: Yash
    Chopra prefers painted posters for their element of 'art' and greater emphasis on emotion but sees
    the new ones as having more modern appeal; to the new designers hand-painted posters look
    old-fashioned.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      When composition becomes cheap and non-destructive, the montage no longer has to be resolved by
      hand into a single painted surface, so the design constraint that produced the montage look
      disappears. What replaces it is not a better version of the same thing but a different object —
      Patel's "slick, glossy posters" that "match those produced in the West and as such they have
      become indicators of modernity."
  scope:
    domain_discussed_by_source: [film_posters, production_technology, 1990s_india]
    conditions: >
      Indian film publicity from the early 1990s to 2002. Patel dates the first use to Dilwale
      Dulhania Le Jayenge (1995) and Yash Raj's Design Cell to 1998.
  caveats:
    - text: "the source reports a loss alongside the gain and does not adjudicate it. Hoarding painters, she says, are now mimicking the computer-generated posters, 'thus displacing their own characteristic expressive interpretations ... signalling a loss of artistic freedom'. That is her judgement, not a measured outcome"
      origin: extractor_observed
    - text: "the Gupt (1997) anecdote — a poster image unconnected to the film was so strong that the script was rewritten to include a scene with those outfits — is a single reported incident, attributed to one designer, with no corroboration"
      origin: extractor_observed
    - text: "no commercial outcome is reported for any of this: the source does not claim the new posters sold more tickets"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - "Dilwale Dulhania Le Jayenge (1995), among the first to use the technology, three posters each on a strand of the romance"
      - "Mohabbatein (2000), twelve poster designs in three sizes, print runs of 250,000 / 15,000 / 30,000"
