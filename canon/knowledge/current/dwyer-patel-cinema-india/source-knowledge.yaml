    - "key signifiers of the films"
  concept_label: re_release_design_as_memory_activation_rather_than_information_delivery
  label_origin: extractor_assigned
  claim: >
    Patel documents a distinct design problem and the solution the industry converged on. When Mehboob
    Studios redesigned posters in the 1980s for a set of re-released classics, "the activation of
    memory was a key factor in the redesign": because the public was already familiar with these
    films, "the primary function of the new publicity was to create an image that would most
    effectively trigger people's memories," so the new designs highlighted scenes, images and stars
    that had over time become key signifiers of the films. She reports the specific moves — Anokhi Ada
    reduced to the three central characters of its love-triangle theme; Aan given a sword fight that
    did not appear on the original poster at all; Mother India reduced to the single image of Radha
    pulling the plough, seen from a low viewpoint. She states the general rule she draws from the set:
    "the new designs therefore refined the originals by either adding or subtracting images according
    to their perceived contemporary impact or relevance."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      For a work the audience has already seen, the design does not have to describe the work; it has
      to index it. What indexes it best is not what was salient at release but what has since become
      the film's remembered signifier, which may be an element the original publicity did not carry.
      Hence images may be added that were never on the original poster.
  scope:
    domain_discussed_by_source: [film_posters, re_release_advertising]
    conditions: >
      Documented for one studio's 1980s redesign programme covering eight named Mehboob titles, all
      designed by Raj Tilak of Seth Studios. It is a single-studio, single-period case.
  caveats:
