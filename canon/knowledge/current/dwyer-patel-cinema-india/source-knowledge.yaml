- sk_id: sk_dpci_0080
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "the star must appear as a star, not as a character playing a role"
    - "impersonation"
    - "personification"
  concept_label: personification_over_impersonation_and_the_constraint_it_places_on_the_image
  label_origin: extractor_assigned
  claim: >
    Dwyer reports Barry King's distinction between two forms of acting — impersonation, where the
    actor transforms body and voice, and personification, where the actor's persona retains
    significant similarities across performances — and states that the latter is found most often in
    Hindi cinema. She draws the consequence for the image directly: personification "creates and
    maintains the star's text, RESTRICTING THE WAY IN WHICH AN IMAGE CAN BE PRESENTED," and melodrama
    reinforces this because "the star must appear as a star, not as a character playing a role."
