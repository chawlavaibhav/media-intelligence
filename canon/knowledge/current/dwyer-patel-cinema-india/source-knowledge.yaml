- sk_id: sk_dpci_0050
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "chronotopes of romance"
    - "a private space in the public domain"
  concept_label: remote_location_as_a_device_for_manufacturing_privacy_not_for_depicting_place
  label_origin: extractor_assigned
  claim: >
    Dwyer argues that Hindi cinema's romantic locations — Kashmir, and by extension Switzerland,
    Scotland and other mountainous areas; the log cabin; parks and gardens in bloom; waterfalls; the
    tropical beach — function to constitute "some sort of privacy for the romantic couple, a private
    space in the public domain, where they are away from the surveillance of the family that prevents,
    encourages and controls romance, love and marriage." She states the consequence for continuity
    directly: frequent jumps in location, such as cuts between Switzerland and India, "do not seem to
    disturb the audience at all since the purpose of the setting is to create a structure of feelings
    and looks, not necessarily to be realistic."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Where the obstacle to romance is family surveillance rather than distance, the location's job is
      to remove the couple from surveillance, and any location that reads as beyond the family's reach
      will do. Geographic plausibility is therefore not a constraint the device has to satisfy, which
      is why cuts across continents inside one song do not register as errors.
  scope:
    domain_discussed_by_source: [hindi_cinema, location_and_setting, song_sequences]
    conditions: >
      Hindi commercial cinema; overseas locations from the 1960s, Kashmir from 1949 until the
      political situation made shooting there impossible, Switzerland from the 1970s, Scotland,
      Germany, North America and New Zealand more recently. The claim about audience tolerance is
      Dwyer's assertion about a specific audience, not a measurement.
  caveats:
    - text: "'do not seem to disturb the audience at all' is an assertion about viewers with no evidence behind it — no audience study is reported anywhere in this book"
      origin: extractor_observed
    - text: "the mechanism is specific to a setting where family surveillance is the operative obstacle; it does not transfer to contexts where it is not"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - "Aradhana (1969), the log cabin"
      - "Bobby (1973), 'Hum tum ek kamre men band'"
      - "Dil to Pagal Hai (1997), 'Dholna', which begins at a wedding in Bombay and cuts to Germany"
  intra_source_relations:
    - {relation: supported_by, target: sk_dpci_0060, note: "the song is where the suspension is licensed"}
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded, historical_claim]
    source_uncertainty: >
      The mechanism is argued; the claim about audience response is asserted without evidence.
    extraction_uncertainty: none
  provenance:
    chapter: "2, Film Style: Settings and Costume"
    section: "Locations"
    page_start: 58
    page_end: 60
    locator: "Ch. 2 'Film Style', section 'Locations', printed pp. 58-60; continuity consequence at p. 55"
    figure_refs: ["illus. 17 Kashmir ki Kali 1964", "illus. 23 Aradhana 1969"]
