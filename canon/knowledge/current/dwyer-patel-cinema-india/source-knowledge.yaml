- sk_id: sk_dpci_0130
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "text is seen as a cultural barrier"
    - "a dramatic enigma"
    - "the media seal of approval"
  concept_label: text_minimal_indian_posters_versus_text_led_western_enigma_posters
  label_origin: extractor_assigned
  claim: >
    Patel states a structural contrast between two poster traditions. Contemporary Western posters
    present a dramatic enigma — provocative images and text giving incomplete or paradoxical
    information — which requires the public to see the film to resolve it, and they are supported
    substantially by text, including review quotations that function as "the media seal of approval,"
    plus studio, producer and director credits that signal the film's status. Indian posters, in
    contrast, "rarely use text": with the scale of national and international distribution the Indian
    industry enjoys, "text is seen as a cultural barrier." From the 1980s onward it has been more
    common for only the title and the names of the producer, director and music director to appear,
    printed solely in English, because to the public those three figures are a marker of the style,
    content and quality of the film. Indian posters accordingly "convey the familiarity of the form and
    content of the Indian film" rather than an enigma.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Text has to be read in a language, so any text narrows the poster's reach across a
      multilingual distribution territory. Where the distribution is wide and the audience already
      knows the form, the poster's job shifts from posing a question to confirming a familiar promise,
      and that job can be done by images and by three names.
  scope:
    domain_discussed_by_source: [film_posters, cross_cultural_comparison]
    conditions: >
      Indian film posters from the 1980s onward against contemporary Western practice. Patel notes the
      earlier Indian convention was different — title and star names prominently in English with Hindi
      and Urdu titles in smaller lettering nearby — so this too is dated.
  caveats:
    - text: "the comparison is drawn between two practices as the author characterises them; no sample of Western posters is enumerated and no count is given on either side"
      origin: extractor_observed
    - text: "Patel notes the cost of the change she documents: more recent designs focusing on one narrative element are 'more universally understood' but 'convey less information about the culture in which they are produced'. That trade-off is stated by the source and is the most useful part of this object"
      origin: source_stated
  source_stated_problems:
    - "text narrows a poster's reach across a multilingual distribution territory"
  source_stated_remedies:
    - "carry the message in recognisable images and in the three names that index style, content and quality"
  examples:
    positive:
      - "Dilwale Dulhania Le Jayenge (1995), three posters each focusing on a strand of the romance"
      - "Pardes (1997), an amalgamation with an American cityscape and the Taj Mahal diagonally opposed"
  intra_source_relations:
