  claim: >
    Patel argues that the star portrait is the natural opening component of a poster because it
    activates a "hierarchy of responses" in two distinct stages that she separates explicitly. First,
    an image of a human face is "instantly engaging because it is familiar to us all" — of any mix of
    images, the face is the one most likely to draw the glance, and this works WITHOUT recognition of
    the person. Second, and only within a specific cultural environment, the portrait is recognisable
    as a star, which arouses expectations built up over time. She states the boundary in the same
    breath: "an Indian film star will be unknown to the wider Western audience where his or her films
    are not so popular and the poster will not evoke the same response."
