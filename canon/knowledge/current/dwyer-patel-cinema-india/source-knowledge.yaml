# CANON-014 — Rachel Dwyer and Divia Patel, "Cinema India: The Visual Culture of Hindi Film"
# (Reaktion Books, London, 2002; Envisioning Asia series). SPEC-03 extraction over the whole book.
#
# Epistemic shape, established by reading it: this is an ACADEMIC book by two specialists — Dwyer a
# film scholar (SOAS), Patel a curator at the Victoria and Albert Museum. It is not a practitioner
# manual and not a set of rules. Its four chapters divide cleanly by author: Dwyer wrote 1-2 (film
# history; settings and costume), Patel wrote 3-4 (advertising history; how posters mean). The
# Introduction and Conclusion are joint. The book states this division itself in the Preface, and the
# extraction respects it: an object drawn from chapters 3-4 is Patel's, one from 1-2 is Dwyer's.
#
# WHAT THIS SOURCE IS GOOD FOR AND WHAT IT IS NOT.
# It is a study of CONVENTIONS — how a body of commercial visual work signals meaning to an audience
# that shares its codes. Its strongest objects are about what a device does and what a viewer who
# holds the code reads from it. It is NOT a source of measured audience effects: the book reports no
# experiment, no survey, no viewing study, and no box-office analysis of its own anywhere. Where the
# authors say a device "works" or "conveys," that is a trained reading of the artefact, not a
# measurement of a viewer, and every such object is typed `source_interpretation`.
#
# HISTORICAL SCOPE IS PRESERVED RATHER THAN FLATTENED. The book runs 1896 to 2002 and is explicit
# that its subject changed repeatedly. It ends by saying the 'filmi' style it has just documented "is
# a thing of the past." No object here asserts a permanent "Indian style"; every period-bound object
# carries its period in `scope.conditions`, and objects that are period-bound are separated from the
# few that state a device-level mechanism.
#
# PAGES ARE REAL AND ARE USED. Unlike the three EPUB sources already in this branch, this is a print
# book (Reaktion, 2002) and the copy is a page-image scan that preserves the printed folios. The
# mapping from scan page to printed page was established mechanically and is reproducible
# (printed = pdf - 2; verified at four independent points — see PROVENANCE.md). Every locator below
# carries a printed page number AND a chapter, so a reader can find it either way.

source_id: dwyer_patel_cinema_india

source_knowledge:

- sk_id: sk_dpci_0010
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "darshan"
    - "darshan lena"
    - "darshan dena"
  concept_label: darshan_as_a_two_way_look_in_which_the_image_authorises_the_gaze
  label_origin: extractor_assigned
  claim: >
    Dwyer describes darshan as a structure of spectation drawn from Hindu religious practice in which
    the look runs both ways: the beholder TAKES darshan (darshan lena) and the object GIVES darshan
    (darshan dena). The distinctive feature she draws out is that the image, not the person looking,
    holds the power — the image "authorizes the look (rather than merely being its object), thereby
    benefiting the beholder." She reports that this is used in Hindi cinema to construct the star:
    the star appears in tableau scenes that invite darshan, which hierarchises the look and lends the
    star the associations of the traditional granters of darshan, kings and gods.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A look that is authorised by its object rather than by its subject inverts the usual direction
      of power in spectatorship. Stasis and the tableau hold the figure still and frontal long enough
      for the exchange to be legible as an exchange rather than as narrative action, which is why
      Dwyer (following Vasudevan) ties darshan to stasis and tableaux rather than to continuity
      editing.
  scope:
    domain_discussed_by_source: [hindi_cinema, star_construction, religious_visual_practice]
    conditions: >
      Stated for Hindi commercial cinema and for viewers who hold the code. Dwyer is careful that
      this is a contested topic: she reports it as Prasad's and Vasudevan's argument, says Vasudevan's
      contention that stasis and tableaux permit hierarchical darshan is one "I find persuasive," and
      immediately bounds her own agreement — "while it may operate within the film to produce the
      star, I cannot otherwise see any culturally specific ways in which the star is produced."
  caveats:
    - text: "Dwyer explicitly limits her endorsement: she accepts darshan as operating INSIDE the film to produce the star and otherwise finds the Hindi star produced no differently from the Hollywood star. An extraction that reported darshan as a general theory of Indian spectatorship would overstate what she signs up to"
      origin: source_stated
    - text: "the source describes a reading practice available to viewers who hold the code; it reports no measurement that viewers in fact respond this way"
      origin: extractor_observed
    - text: "Patel, in chapter 4, applies the term to poster design but explicitly downgrades it there, calling it a 'secular darshan' — the two authors do not use the term at equal strength"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - "Pyaasa (1957) devotional song sequence, where the object of devotion does not return the look, breaking the circuit of darshan temporarily"
  intra_source_relations:
    - {relation: supported_by, target: sk_dpci_0020, note: "frontality and the tableau are the formal means"}
    - {relation: qualified_by, target: sk_dpci_0110, note: "Patel's weaker 'secular darshan' in poster design"}
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded]
    source_uncertainty: >
      The source presents this as a disputed topic and marks the dispute. Dwyer calls it "this much
      disputed topic of darshan" and accepts it only in a bounded form. No measurement supports it.
    extraction_uncertainty: none
  provenance:
