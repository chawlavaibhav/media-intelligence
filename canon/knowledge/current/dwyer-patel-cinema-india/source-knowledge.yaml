  concept_label: character_types_as_a_compression_code_that_lets_a_poster_carry_a_plot
  label_origin: extractor_assigned
  claim: >
    Patel argues that Indian film is understood through the familiarity of its characters, which are
    depicted as social types defined by their differences from each other — good against bad, rich
    against poor, weak against strong, traditional against modern — yielding recurring roles such as
    the long-suffering mother, the wife, the vamp, the good brother, the bad brother and the villain.
    Because the same actor is cast in the same role type across films, the public is familiar with both
    actor and type and transfers meaning between them. Posters therefore "use the viewer's familiarity
    with character types as a code with which to convey a greater sense of the theme of the film." She
    works one poster through: in a Deewaar poster, Bachchan's persona is recognised, the older woman
    reads as the long-suffering mother, her presence implies a filial relation between the two male
    portraits, and the audience's familiarity with the lost-and-found theme supplies the rest.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A type is a compression: one figure stands for a whole set of expected relations and moral
      positions. When several types are placed together, the relations BETWEEN them are inferred by
      the viewer rather than depicted, so a still image can carry a narrative structure it never
      shows. This works only for a viewer holding the code.
  scope:
    domain_discussed_by_source: [film_posters, character_types, indian_cinema]
    conditions: >
      Indian film posters, mainly pre-1990. Patel states the limit and the change: female character
      types "commonly feature on (usually pre-1990) film posters," and since the beginning of the
      1990s the oppositional structures and dramatic distinction in female character types "are no
      longer manifested through the type of clothes worn."
  caveats:
