- sk_id: sk_dpci_0030
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "melodrama"
    - "exteriority"
    - "glamorous realism"
  concept_label: melodrama_makes_feeling_exterior_so_setting_and_costume_carry_interior_state
  label_origin: extractor_assigned
  claim: >
    Dwyer argues that melodrama "foregrounds language, as it makes all feelings exterior," with
    characters verbalising their feelings, and that it likewise affects the image: it uses close-ups
    to increase the effect of emotional depth, and heightens the exterior display of emotion through
    storms, remote places and other symbolic representations of a character's interior feelings. She
    draws the consequence for settings directly: settings can be "a form of making the characters'
    state of mind external, following the melodramatic style of exteriority," and she reports Yash
    Chopra's own term for the resulting look, "glamorous realism," a style in which reality is glossed
    over to make it more attractive.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      In melodrama the emphasis is not on the psychology of a unique individual but on characters in
      situations that push emotion to extremes. Because the interior is not the unit of interest,
      interior state must be placed outside the character to be read at all — in speech, in weather,
      in place, in the arrangement of the set. Setting therefore stops being a container for action
      and becomes a bearer of state.
  scope:
    domain_discussed_by_source: [hindi_cinema, melodrama, production_design]
    conditions: >
      Stated for the melodramatic mode, which Dwyer says is "often found in societies where the
      pre-modern is giving way to the modern," and which she distinguishes from the more realist mode
      of some Hindi films (Bimal Roy, IPTA-influenced work). It is a mode-level claim, not a claim
      about all Hindi cinema.
  caveats:
    - text: "Dwyer explicitly separates the melodramatic from the realist mode within Hindi cinema and names films in each. Treating exteriority as a property of Hindi cinema as such would ignore a distinction the source insists on"
      origin: source_stated
    - text: "the mechanism is drawn from Western melodrama theory (Brooks, Neale, Ang) and applied; the source offers no Indian-specific evidence for the mechanism itself"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - "the Awara (1951) dream sequence, where the film's themes are condensed into and projected onto the sets themselves"
  intra_source_relations:
