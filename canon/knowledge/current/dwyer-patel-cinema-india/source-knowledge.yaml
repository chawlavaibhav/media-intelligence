    - "a clever cocktail of desi (local) values draped in Yankee slickness"
  concept_label: the_book_dates_its_own_subject_as_ending_and_says_why
  label_origin: extractor_assigned
  claim: >
    In the Conclusion the authors state that the 'filmi' style which "defined the visual culture of the
    Hindi film up to the 1990s (and which has been the focus of this book) is a thing of the past and
    is considered to be the very antithesis of the new 'look'." They attribute the change to a younger
    generation of film-makers "raised on Hollywood but firmly grounded in Bollywood," to a new
    middle-class consumerist lifestyle, and to the growing importance of the diasporic market, where
    returns per ticket are far higher because of the exchange rate. They also record the irony they
    see: as filmi style is discarded by the industry, it is the means by which the industry is finally
    gaining Western recognition.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The authors tie the visual change to a change in who the film is for and who is making it: a
      market whose most profitable segment is overseas and metropolitan, and a cohort of makers formed
      on two cinemas at once, produce a look that reads as globally current while retaining the song
      sequences and the traditional values that mark it as Hindi film.
