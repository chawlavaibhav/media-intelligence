- sk_id: sk_dpci_0070
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "the sari is heavily laden with cultural meanings of nostalgia, tradition, womanhood, nationalism and social status"
    - "a widely understood grammar of wearing the sari exists"
  concept_label: clothing_as_a_semiotic_system_with_a_grammar_the_audience_already_holds
  label_origin: extractor_assigned
  claim: >
    Dwyer states that "the relationship between women's clothes in movies and in real life is not one
    of reflection, but the codes of cinema require clothing to fill particular semiotic functions,"
    and then traces those functions. She reports a real-world grammar that the audience brings: a
    widely understood grammar of wearing the sari, with specific occasions requiring different saris
    by season, time of day and degree of formality, and a colour code (red, green and yellow for
    festive occasions; white or pale for widows; black largely a Western fashion). She then reports
    the cinematic use built on it — in older films contrasting the heroine with the vamp, the heroine
    almost invariably wore a sari as an emblem of chastity and goodness; the unmarried heroine wears
    Western clothes before marriage and changes into salwar-khamees or a sari after it; mothers and
    mother-figures always wear traditional sober saris.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The garment carries meaning before it reaches the film, so the film does not have to construct
      the meaning; it selects from a code the viewer already holds. This is why costume can mark
      marital status, age, class, region, religion and moral position without dialogue, and why the
      same garment changes what it says when worn by a different character type.
  scope:
    domain_discussed_by_source: [hindi_cinema, costume, indian_dress_conventions]
    conditions: >
      Stated for Hindi cinema and for the Indian dress conventions of the period the book covers, with
      the sari's own standardisation described as recent ("the sari is seen as the national dress of
      Indian women, but this is only a recent fashion"). Dwyer explicitly dates changes: the heroine
      of the 1990s can wear Western clothes with no negative implication, which she says was not
      earlier the case.
  caveats:
    - text: "the source dates the code's own change inside the book — Western clothes on the heroine carried a moral charge earlier and did not by the 1990s. The grammar is not stable and the source says so"
      origin: source_stated
    - text: "'almost invariably', 'always', 'often' are the quantifiers used throughout; no counts over any corpus are given anywhere in the costume section"
      origin: extractor_observed
    - text: "the code is described for one audience. Nothing in the source supports its transfer to viewers who do not hold it, and the book's own Conclusion reports that films are 'finding it hard to reach out beyond the South Asian diasporic audience'"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - "Biwi no 1 (1999), where the wife and mother always wears a sari and her rival wears Western fashion"
      - "Dil to Pagal Hai (1997), Manish Malhotra's salwar-khamees for the 'traditional' heroine against the DKNY sportswear of the hero's best friend"
  intra_source_relations:
    - {relation: supports, target: sk_dpci_0120, note: "the same code is read off posters, where it does more work"}
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded, historical_claim]
    source_uncertainty: >
      Rich and specific, but entirely unquantified: the pattern is asserted over an unnamed corpus.
    extraction_uncertainty: none
  provenance:
    chapter: "2, Film Style: Settings and Costume"
