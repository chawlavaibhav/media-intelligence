- sk_id: sk_dpci_0020
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "frontality"
    - "iconicity"
    - "tableau"
  concept_label: frontality_and_iconicity_as_a_freezing_of_space_that_renders_meaning_visible
  label_origin: extractor_assigned
  claim: >
    Dwyer reports Geeta Kapur's formal category of "frontality" in the Indian popular arts and
    Kapur's use of "iconicity" — not in the Peircean sense of resemblance, but as a meaningful
    condensation of symbolic meanings into ONE STATIC IMAGE, which need not be religious or
    mythological. Frontality here is not merely filming from a right-angle plane or direct address to
    camera but also operates through the spectator's knowledge of narrative and mise-en-scene. Dwyer
    adds that frontality may be seen as a freezing of space, and sometimes of time, into a tableau,
    which positions characters and objects in relation to one another and gives the spectator "the
    opportunity to see meaning represented, emotions and moral states rendered in clear visible
    signs."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Freezing space and time suspends the narrative demand that a shot advance an action, which
      frees the composition to carry a state instead of an event. Because the state is rendered in
      arranged visible signs rather than in inferred psychology, it can be read without the viewer
      reconstructing an interior. This is why the same device serves both the icon and melodrama.
  scope:
    domain_discussed_by_source: [hindi_cinema, indian_popular_arts, melodrama]
    conditions: >
      Attributed to Geeta Kapur for the Indian popular arts generally (word, image, design and the
      performative act, cinema included) and traced by Dwyer through Phalke, early photography,
      miniature painting, the Company style and Ravi Varma. Dwyer notes the limit herself: most of
      these studies "draw on early films and those from the 1950s and do not trace more recent
      changes in styles of looking."
  caveats:
    - text: "Dwyer states the temporal limit of the evidence base explicitly — the iconicity/frontality/tableau/darshan literature is built on early and 1950s films and was not extended to later ones. Applying it to contemporary work is an extrapolation the source does not make"
      origin: source_stated
    - text: "Dwyer nevertheless suggests the codes endure, visible 'in the use of spectacle, in particular the depiction of the star'. That suggestion is hers and is not evidenced"
      origin: extractor_observed
    - text: "this is a formal category for reading images, not a production instruction; the source gives no rule for when to use frontality"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - "Sant Tukaram (1936), where Kapur argues religious iconicity is mediated to secular effect and the actor's face is privileged as sign"
      - "Kismet (1943), a staged tableau of Mother India against a map and icons of the country"
  intra_source_relations:
    - {relation: supports, target: sk_dpci_0010, note: "the formal means by which darshan is invited"}
    - {relation: supports, target: sk_dpci_0030, note: "melodrama's exteriority uses the same freezing"}
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded, historical_claim]
    source_uncertainty: >
      Reported from Kapur and Rajadhyaksha rather than established here, and the source names the
      period limit of the underlying scholarship.
    extraction_uncertainty: none
  provenance:
    chapter: "2, Film Style: Settings and Costume"
