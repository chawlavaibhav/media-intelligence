- sk_id: sk_dpci_0110
  source_id: dwyer_patel_cinema_india
  source_terms:
    - "overpainting"
    - "hyper-reality, a solidification of certain features and an intensification of the gaze"
    - "secular darshan"
  concept_label: overpainting_a_named_technique_for_heightening_a_photograph_and_its_lineage
  label_origin: extractor_assigned
  claim: >
    Patel documents overpainting — applying oil or gouache over a photographic still, often with a
    knife in thick textured strokes — as the defining technique of Indian film poster art in the 1970s
    and '80s, names its principal practitioner (Diwakar Karkare, trained at the Bombay School of Art,
    who introduced it on Daag in 1973), and states what it was for: it "provided a means for artists to
    place their own interpretation over the photographic image, primarily allowing them to express and
    emphasize emotion." She traces its lineage to nineteenth-century Indian painted photography, where
    studios employed up to six artists to paint a photograph, and reports that the surviving practice —
    memorial photographs of the deceased — produces "hyper-reality, a solidification of certain
    features and an intensification of the gaze through the sharp reworking of the eyes."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A photograph fixes what was in front of the camera; paint laid over it can select, exaggerate
      and intensify without discarding the photographic base. The result is not more faithful but more
      legible as feeling: Patel calls this "enhancing of reality" and says it is what Karkare aimed at.
      Combined with centrality of placement and a returned gaze, she argues it produces an image that
      closes the psychological gap between subject and viewer.
  scope:
    domain_discussed_by_source: [film_posters, poster_technique, indian_painted_photography]
    conditions: >
      Indian film posters of the 1970s and '80s specifically. Patel dates its displacement precisely:
      through much of the 1990s overpainting "was gradually almost replaced by computer-generated
      imagery," and Karkare closed Studio Diwakar in 1988 because he believed computer technology was
      displacing the artist and the new designs required no real artistic input.
  caveats:
    - text: "the technique is historically closed by the source's own account; it is documentation of a superseded craft, not a current method"
      origin: source_stated
    - text: "Patel's application of 'darshan' here is explicitly downgraded to a 'secular darshan', which is a weaker claim than the one Dwyer discusses in chapters 1-2. The two authors are not asserting the same thing"
      origin: extractor_observed
    - text: "INSPECTED: illus. 100, a close-up of Karkare's overpainting, was opened and read directly. Thick knife-laid strokes over a photographic base are plainly visible, so the technique is confirmed first-hand rather than taken from the caption"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
