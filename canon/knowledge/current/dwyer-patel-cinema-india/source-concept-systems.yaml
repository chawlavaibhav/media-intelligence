# CANON-014 — SPEC-03 SourceConceptSystems for Dwyer and Patel, "Cinema India".
#
# Three only. This is an academic book with two authors writing two different halves, and it does not
# present its material as a system anywhere. All three groupings below are the extractor's synthesis
# and each says so. The third exists specifically to carry the source's own bounds forward with the
# objects, so that a downstream consumer meets them together rather than having to rediscover them.

source_id: dwyer_patel_cinema_india

source_concept_systems:

- scs_id: scs_dpci_001
  source_id: dwyer_patel_cinema_india
  label: how_a_still_image_carries_a_narrative_to_a_viewer_who_holds_the_code
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    Patel's chapter-4 account of poster meaning, assembled: the face opens attention before
    recognition; recognition of the star brings forward a persona that was built cumulatively by
    star, artist and public and is carried by a few fixed features; character types compress whole
    sets of relations into single figures so that the relations BETWEEN them are inferred rather than
    depicted; and because the code does the work, text can be minimised, which is what Indian posters
    in fact do.
  whole_system_claim:
    text: >
      A poster can carry a narrative structure it never depicts, provided the viewer holds the code.
      Attention is won by the face without recognition; meaning is then supplied by the viewer out of
      an accumulated persona and a familiar typology, not out of the poster. The poster's job is
      therefore indexing, not describing — which is why minimal text suffices and why the same design
      fails outside the code.
    origin: extractor_synthesis
    interpretation_basis: >
      Patel connects the first three members explicitly through her "hierarchy of responses" and her
      worked reading of the Deewaar poster. She does not present them as a model, does not draw the
      consequence for text as following from the type code, and never cites Dwyer's chapter-1 account
      of personification as the precondition. Assembling them into a causal chain, and adding those
      two members, is the extractor's. What the grouping ADDS, and what must be attributed to
      CANON-014, is the observation that all four devices fail together at the same boundary - the
      viewer who does not hold the code - which is visible across the set and not within any member.
    source_ref: null

  members:
    - {sk_ref: sk_dpci_0090, role_in_system: attention_before_recognition, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_dpci_0100, role_in_system: what_recognition_brings_forward, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_dpci_0120, role_in_system: the_compression_code, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_dpci_0130, role_in_system: the_consequence_for_text, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_dpci_0080, role_in_system: the_precondition_that_makes_personas_persist, order: 5, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: causal
      origin: extractor_inferred
    dependencies:
      - between: [sk_dpci_0100, sk_dpci_0080]
        nature: "the persona can only be indexed by a few features if personification, not impersonation, is the prevailing mode; Dwyer establishes that in chapter 1 and Patel relies on it in chapter 4 without restating it"
        origin: extractor_inferred
      - between: [sk_dpci_0130, sk_dpci_0120]
        nature: "text can be dropped only because the type code already carries the information text would have carried"
        origin: extractor_inferred
    tradeoffs:
      - between: [sk_dpci_0130, sk_dpci_0120]
        nature: "Patel states the trade-off herself: designs that focus on one element are more universally understood but 'convey less information about the culture in which they are produced'. Reach and specificity are exchanged"
        origin: source_stated
    conflicts: []
  source_warns_against_isolated_use: true
  source_warning_ref: "Patel states that character types 'are not universally recognized' and are 'only fully understood by those with a knowledge of that culture' (printed p. 194); she draws the same boundary for star recognition at p. 183"
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded, historical_claim]
    source_uncertainty: >
      Every member is argued and illustrated by readings of specific posters; none is measured. No
      audience study exists anywhere in this book.
    extraction_uncertainty: none
    system_level_uncertainty: >
      Moderate. The members are all Patel's, all from one chapter, and she does connect the first
      three explicitly through the "hierarchy of responses". What is the EXTRACTOR'S and must be
      attributed to CANON-014 is the addition of sk_dpci_0130 (minimal text) as a consequence of the
      code rather than as a separate observation, and the addition of sk_dpci_0080 (personification)
      from Dwyer's chapter as the precondition — Patel never cites Dwyer's chapter for this. The
      causal ordering is likewise the extractor's. The system is recorded as a reading of Patel's
      argument, not as a structure she sets out.
  provenance:
    chapter: "4, Advertising and the Communication of Meaning (with one member from Ch. 1)"
    section: "The Star Image; The Cultural Construction of Meaning; Character Types"
    page_start: 183
    page_end: 204
    source_support: text

- scs_id: scs_dpci_002
  source_id: dwyer_patel_cinema_india
  label: the_conventions_are_dated_and_the_source_dates_them
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    A grouping of the objects in this record that the source itself bounds in time, together with the
    two objects that do the bounding. Chapter 3's argument is a periodisation in which each phase of
    advertising style borrowed the vocabulary of its moment; the Conclusion states that the style the
    whole book documents has ended; and the Introduction declares that the most characteristic form of
    the medium studied is systematically missing from the surviving evidence.
  whole_system_claim:
    text: >
      Nothing in this source supports a standing description of "Indian film style" or "the Indian
      poster". The book's own thesis is that the style changed repeatedly with its environment, its
      last chapter says the style it documented is over, and its first chapter says the most
      distinctive artefacts of the medium did not survive to be studied. Every convention-level object
      drawn from this source is therefore a historical observation with a stated end date, not a
      durable rule.
    origin: extractor_synthesis
    interpretation_basis: >
      Each bounding statement is quoted from the source, but the source never gathers them and never
      applies them to the specific convention objects extracted here. Assembling the bounds with the
      things they bound is the extractor's, and is a statement about how this record should be read
      rather than a new claim about Hindi cinema.
    source_ref: null
  members:
    - {sk_ref: sk_dpci_0150, role_in_system: the_periodisation_itself, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_dpci_0190, role_in_system: the_sources_own_expiry_notice, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_dpci_0160, role_in_system: the_survival_bias_in_the_evidence, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_dpci_0040, role_in_system: a_bounded_convention_prop_vocabulary, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_dpci_0070, role_in_system: a_bounded_convention_costume_code, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_dpci_0120, role_in_system: a_bounded_convention_character_types, order: 6, membership_origin: extractor_inferred}
    - {sk_ref: sk_dpci_0110, role_in_system: a_bounded_technique_overpainting, order: 7, membership_origin: extractor_inferred}
    - {sk_ref: sk_dpci_0170, role_in_system: what_replaced_the_bounded_technique, order: 8, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - between: [sk_dpci_0190, sk_dpci_0040]
        nature: "the Conclusion's statement that filmi style has ended is what dates the prop vocabulary, which is otherwise presented without an end"
        origin: extractor_inferred
      - between: [sk_dpci_0160, sk_dpci_0150]
        nature: "the periodisation is built on the artefacts that survived, and the source names the class that did not"
        origin: source_stated
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: true
  source_warning_ref: "Conclusion, printed pp. 217-218: the filmi style 'is a thing of the past and is considered to be the very antithesis of the new look'; Introduction, printed p. 11, on hoardings not surviving"
  evidence:
    characteristics: [explicitly_stated, historical_claim]
    source_uncertainty: >
      The bounding statements are the authors' own and are unambiguous.
    extraction_uncertainty: none
    system_level_uncertainty: >
      Low as to the bounds themselves, which are quoted from the source. What the EXTRACTOR adds, and
      what must be attributed to CANON-014, is the decision to gather the bounded objects under the
      bounds so a downstream consumer cannot retrieve a convention without also retrieving its expiry.
      That gathering is a statement about this record, not a claim about Hindi cinema.
  provenance:
    chapter: "Introduction; 3, The Art of Advertising; Conclusion"
    section: "assembled across the book"
    page_start: 11
    page_end: 218
    source_support: text

- scs_id: scs_dpci_003
  source_id: dwyer_patel_cinema_india
  label: exteriority_as_the_reason_setting_costume_and_location_are_asked_to_carry_meaning
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    Dwyer's chapter-2 material read back to the principle she states in chapter 1. If melodrama makes
    feeling exterior, then interior state has to be placed somewhere outside the character, and the
    three places this book examines are the set, the location and the costume — with the song sequence
    as the licensed zone in which the ordinary rules of place and time are suspended so the placement
    can be extreme.
  whole_system_claim:
    text: >
      In this body of work setting, location and costume are not backgrounds but bearers. They carry
      state, status and moral position because the mode does not carry them inside the character. The
      song sequence is where this reaches its limit: because the sequence is understood as suspending
      the film's own rules, it can place feeling in a location the narrative never travelled to and a
      costume the scene never allowed time to change into.
    origin: extractor_synthesis
    interpretation_basis: >
      Dwyer states the principle of exteriority, states each of the placements, and connects
      exteriority to settings once (printed p. 52). She does not connect it to the prop vocabulary, to
      the location chronotopes, or to the costume code. Reading all of these as instances of one
      principle is the extractor's synthesis and is recorded as a hypothesis about how her chapter
      hangs together, not as an argument she makes.
    source_ref: null
  members:
    - {sk_ref: sk_dpci_0030, role_in_system: the_principle, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_dpci_0040, role_in_system: placement_in_props, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_dpci_0050, role_in_system: placement_in_location, order: 3, membership_origin: extractor_inferred}
    - {sk_ref: sk_dpci_0070, role_in_system: placement_in_costume, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_dpci_0060, role_in_system: the_licensed_zone_of_suspension, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_dpci_0020, role_in_system: the_formal_device_that_renders_state_visible, order: 6, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: causal
      origin: extractor_inferred
    dependencies:
      - between: [sk_dpci_0050, sk_dpci_0060]
        nature: "the location device depends on the song's licence: Dwyer's own example of the Switzerland cut occurs inside a song"
        origin: source_stated
      - between: [sk_dpci_0020, sk_dpci_0030]
        nature: "frontality and the tableau are how melodrama's exteriority becomes visible in a frame; Dwyer connects the two explicitly at printed p. 44"
        origin: source_stated
    tradeoffs:
      - between: [sk_dpci_0060, sk_dpci_0050]
        nature: "the suspension buys expressive freedom at the cost of narrative continuity. Dwyer says the audience does not mind; that assertion is not evidenced and the trade-off is therefore recorded as one the source asserts is costless, not one shown to be"
        origin: extractor_inferred
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded]
    source_uncertainty: >
      The principle and the licensed zone are stated by the source; the placement objects are stated
      but not tied back to the principle by the source itself.
    extraction_uncertainty: none
    system_level_uncertainty: >
      Moderate. Dwyer states the principle (exteriority) and states each of the placements, and she
      connects exteriority to settings once, explicitly, at printed p. 52. She does NOT connect it to
      the prop vocabulary, to the location chronotopes or to the costume code. Reading all four as
      instances of one principle is the extractor's synthesis and is the claim most at risk of tidying
      a two-author academic book into a coherence it does not have. It is recorded as a hypothesis
      about how Dwyer's chapter 2 hangs together, not as her argument.
  provenance:
    chapter: "1, Indian Cinema; 2, Film Style: Settings and Costume"
    section: "assembled across two chapters"
    page_start: 28
    page_end: 98
    source_support: text
