      count: 129
      share_of_words: "0.81%"
      reversible: true
      note: >
        Typographic ligatures emitted as single Unicode characters. Meaning is unaffected, but naive
        verbatim string matching against an ASCII transcript would fail on every affected word.
    - glyph: "⫽ (U+2AFD) standing in for '='"
      count: 2
      location: "printed p.81, the opposing-composition dissolve example"
      reversible: true
      note: "Recoverable from context. A character-level artifact, not structural damage."
  structural_damage: none
  section_completeness_check:
    method: >
      Every section name listed in the book's contents page for Chapters Three, Four and Five was
      searched for in the extracted section text — the contents-page control.
    result: "All named sections present. Nothing buried, nothing missing."
  ordering_anomalies:
    - location: "printed p.103 (PDF 116), Figure 5.3 caption"
      what: >
        The Figure 5.3 caption is emitted in the middle of the running prose rather than after it,
        because the figure sits in the right-hand column beside the text.
      severity: cosmetic
      note: >
        Reading order is disturbed for a few lines; no words are lost or spliced into sentences the
        authors did not write. This is the mildest end of the same ordering family that blocked
        Lupton, and it did not require repair.
  verdict: >
    Usable without reservation. This is the cleanest source text encountered in this lane: a native
    digital PDF, no OCR, complete sections, and only reversible character-level artifacts.
