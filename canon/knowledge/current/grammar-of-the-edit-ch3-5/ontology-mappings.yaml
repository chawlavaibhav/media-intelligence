  children_terms: [t_gote_c003_0001, t_gote_c003_0002, t_gote_c003_0003, t_gote_c003_0004]

- concept_id: sc_gote_edit_category_taxonomy
  kind: source_specific_concept
  label: the_five_edit_categories
  origin_ref: grammar_of_the_edit_ch3_5_editing_decisions
  origin: source_stated
  definition: >
    The source's own grouping of action, screen position, form, concept and combined edits as five
    categories classifying the relation between two shots. The source states the list is not
    exhaustive and that there may be no industry standard for the terminology.
  children_terms: [t_gote_c003_0005, t_gote_c003_0006, t_gote_c003_0007, t_gote_c003_0008, t_gote_c003_0009]

- concept_id: sc_gote_edit_decision_criteria
  kind: source_specific_concept
  label: the_six_elements_of_a_good_edit
  origin_ref: grammar_of_the_edit_ch3_5_editing_decisions
  origin: source_stated
  definition: >
    The source's own generalisation over its criteria for a transition: new information, motivation,
    shot composition, camera angle, continuity and sound. Represented here by the terms that name
    the properties themselves; composition, camera angle and continuity have no single source noun
    and appear through their associated failure and remedy terms.
  children_terms: [t_gote_c003_0027, t_gote_c003_0028, t_gote_c003_0018, t_gote_c003_0023, t_gote_c003_0041]

- concept_id: sc_gote_line_geometry
  kind: source_specific_concept
  label: the_geometry_of_the_action_line
  origin_ref: grammar_of_the_edit_ch3_5_editing_decisions
  origin: source_stated
  definition: >
    The source's own treatment of the action line, screen direction, look room, the 180 degree arc
    and the 30 degree rule as one geometry from which its continuity rules follow. The source states
    that the line establishes screen direction, look room and lines of attention together.
  children_terms: [t_gote_c003_0019, t_gote_c003_0018, t_gote_c003_0020, t_gote_c003_0032, t_gote_c003_0042]

- concept_id: cc_perceived_break_at_a_transition
  kind: canonical_concept
  label: perceived_break_at_a_transition
  purpose: retrieval_and_aggregation
  created_by: extractor
  asserts_equivalence: false
  definition: >
    Ours, for retrieval. Groups the failures in which the viewer notices something wrong at a
    transition. They arise differently — insufficient angle difference, similar composition, a
    reversed line, a subject changing frame side, a mismatched object, sound vanishing, a fade
    filling unevenly — and the repair follows the mechanism, not the appearance. Grouping them is
    useful; claiming they are one failure would be a stronger act this concept does not perform.
  children_terms: [t_gote_c003_0031, t_gote_c003_0032, t_gote_c003_0033, t_gote_c003_0034,
                   t_gote_c003_0035, t_gote_c003_0037, t_gote_c003_0040]

- concept_id: cc_attention_break_as_repair
  kind: canonical_concept
  label: attention_break_as_repair
  purpose: retrieval_and_aggregation
  created_by: extractor
  asserts_equivalence: false
  definition: >
    Ours, for retrieval. Groups the source's remedies that work by interrupting what the viewer is
    attending to and supplying elapsed time — the cut-away, the insert shot and the reaction shot.
    The source gives the first two an identical mechanism and the third a different justification,
    so the grouping is a convenience and not a claim that all three are the same device.
  children_terms: [t_gote_c003_0015, t_gote_c003_0016, t_gote_c003_0017]
