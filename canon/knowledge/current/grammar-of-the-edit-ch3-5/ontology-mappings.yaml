relationships:

- from: t_gote_c003_0015
  to: t_gote_c003_0016
  relation: same_mechanism
  confidence_basis: source_stated
  note: >
    The source describes the same action — insert any brief logical shot — with the same stated
    mechanism — break the audience's continuous attention and supply elapsed time — under two names,
    cut-away for a content mismatch and insert shot for a direction reversal. Recorded as one
    mechanism under two source terms rather than merged, because the source keeps both words.

- from: t_gote_c003_0029
  to: t_gote_c003_0030
  relation: same_observed_effect
  confidence_basis: extractor_judgement
  note: >
    Transparency is stated of the cut in Chapter Four; invisible technique is stated as a general
    standard in Chapter Five. Both name the edit going unnoticed. Related rather than merged because
    the first is a property of one transition and the second a standard for a whole programme, and
    the source never equates them.

- from: t_gote_c003_0023
  to: t_gote_c003_0024
  relation: broader_than
  confidence_basis: source_stated
  note: >
    The source states room tone is ambience lifted from the production recordings, as against
    ambience built by an editor from other sources. Ambience is therefore the broader term and room
    tone one of its two origins.

- from: t_gote_c003_0025
  to: t_gote_c003_0026
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    Both are split edits and the source presents them as opposites — which track leads. Recorded as
    a checked distinction so that a later pass does not collapse them into one lapping concept.

- from: t_gote_c003_0010
  to: t_gote_c003_0025
  relation: narrower_than
  confidence_basis: source_stated
  note: >
    A sound bridge is one form of sound leading picture — the case where the leading sound's origin
    is unknown to the audience until the incoming shot reveals it.

- from: t_gote_c003_0031
  to: t_gote_c003_0037
  relation: same_observed_effect
  confidence_basis: source_stated
  note: >
    The source defines the jump cut by the viewer consciously noticing it and being pulled out of
    the experience, so the two terms name the same event from the screen side and the viewer side.

- from: t_gote_c003_0033
  to: t_gote_c003_0032
  relation: same_mechanism
  confidence_basis: source_stated
  note: >
    A discontinuity of movement is what crossing the line produces for a moving subject. Chapter
    Three names the symptom; Chapter Five supplies the geometry that causes it.

- from: t_gote_c003_0034
  to: t_gote_c003_0032
  relation: same_mechanism
  confidence_basis: extractor_judgement
  note: >
    A subject apparently jumping across the screen is the same reversal applied to a static
    subject's frame position. The source states the causal link explicitly for movement and not for
    position, so this direction is our inference from its own geometry.

- from: t_gote_c003_0006
  to: t_gote_c003_0034
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    A negative finding worth recording. Both concern which side of the frame a subject occupies, and
    both use the word position. They are not the same concept: the screen position edit is a device
    that deliberately moves the viewer's eye by placing subjects on opposite sides, while a subject
    jumping across the screen is a failure of a subject to stay put. Examined and rejected as a
    match so that a later pass does not merge them on the shared word.

- from: t_gote_c003_0014
  to: t_gote_c003_0003
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    A second negative finding. Despite its name, the source says a natural wipe may be executed as
    either a cut or a wipe, so it is a way of concealing a transition inside in-frame movement
    rather than a variety of the wipe transition. Checked against the source's own wording rather
    than assumed from the name.

- from: t_gote_c003_0013
  to: t_gote_c003_0007
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source says the term match dissolve is often used to describe a form edit. Recorded as
    related_to rather than as an equivalence because a match dissolve is the execution and a form
    edit is the relation between the shots, and the source uses each word in the other's section
    without stating they are the same thing.

- from: t_gote_c003_0021
  to: t_gote_c003_0020
  relation: same_mechanism
  confidence_basis: source_stated
  note: >
    Eye trace works by the viewer crossing the empty look room; the source presents the two as one
    device seen from the viewer's side and the frame's side.

- from: t_gote_c003_0019
  to: t_gote_c003_0018
  relation: broader_than
  confidence_basis: source_stated
  note: >
    The action line establishes screen direction. Direction is one of the things the line fixes,
    along with look room and the lines of attention in a two-shot.

- from: t_gote_c003_0022
  to: t_gote_c003_0045
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    A third negative finding. Both answer how long a shot should run, and it would be easy to treat
    them as one timing concept. They are not: the beat is explicitly unquantified and acquired with
    experience, while describing the shot is a repeatable procedure available to a beginner. The
    source offers both and never relates them, so the distinction is recorded rather than resolved.

- from: t_gote_c003_0038
  to: t_gote_c003_0031
  relation: broader_than
  confidence_basis: extractor_judgement
  note: >
    The illegitimate cut names any of six causes making two shots unjoinable; the jump cut is the
    perceptual result of one family of those causes. Our reading of the source's own two lists.

