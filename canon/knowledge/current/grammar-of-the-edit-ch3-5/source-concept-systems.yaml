- scs_id: scs_gote_c003_004
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  label: how_binding_the_grammar_is
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    Three statements, one at the end of each chapter, about the standing of the rules the book
    teaches: that right and wrong are settled by the audience rather than by the rules, that the
    framework is for reasoning with rather than memorising, and that the grammar should be learned
    before it is broken because effective creativity overrules it.
  whole_system_claim:
    text: >
      The book teaches a rule system and simultaneously denies that it is one. Each chapter closes
      by weakening what it just taught, and the three weakenings are consistent: the rules are
      reasoning aids whose authority comes from the audience's response, not from the rules
      themselves. This is what makes the framework's silent exceptions coherent rather than
      contradictory — if the six elements were binding, waiving them for the wipe and the concept
      edit would be inconsistent; because they are aids, waiving them is just judgement. The source
      never draws that connection.
    origin: extractor_synthesis
    interpretation_basis: >
      Each of the three member claims is explicit and verbatim, and each appears at a chapter
      boundary — printed p.73, p.96 and pp.97 and 108. What is ours is treating them as one position
      rather than three closing remarks, and using that position to account for the pattern recorded
      in scs_gote_c003_002. The source states each part and never assembles them.
    source_ref: null
  members:
    - {sk_ref: sk_gote_c003_0023, role_in_system: position_statement, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_gote_c003_0046, role_in_system: position_statement, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_gote_c003_0060, role_in_system: position_statement, order: 3, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies: []
    tradeoffs:
      - between: [sk_gote_c003_0060, sk_gote_c003_0003]
        nature: "the licence to depart from the grammar against the framework that defines a good edit; the source resolves it by requiring the departure to be conscious and the result effective"
        origin: source_stated
        source_ref: {section: "Editing Is Creating", page_start: 108}
      - between: [sk_gote_c003_0060, sk_gote_c003_0013]
        nature: "deliberate use of the jump cut against the instruction that it should almost always be prevented"
        origin: source_stated
        source_ref: {section: "Editing Is Creating", page_start: 108}
    conflicts: []
  source_warns_against_isolated_use: true
  source_warning_ref: >
    "It is usually best to learn these general guidelines and working practices ... before trying to
    break conventions." The source explicitly warns against taking the licence without the
    framework, which means these three claims should not be retrieved apart from the rules they
    qualify.
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, repeated_within_source]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: none
    system_level_uncertainty: >
      The three claims are individually well supported and verbatim. The claim that they form one
      position is ours, and the further use of that position to explain the framework's variable
      application is a second inferential step which the source does not take.
  provenance:
    chapter: "Chapters Three, Four and Five"
    section: "chapter closings"
    page_start: 73
    page_end: 108
    source_support: text

