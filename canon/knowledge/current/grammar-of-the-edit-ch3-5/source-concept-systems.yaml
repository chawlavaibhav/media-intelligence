- scs_id: scs_gote_c003_002
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  label: the_element_set_named_as_fixed_but_applied_as_variable
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    The set of elements the source actually applies changes from one transition or edit type to the
    next, while the source continues to call it the six elements. The cut is analysed against all
    six. The dissolve and the wipe drop continuity and add a seventh, time. The fade is analysed
    against four — motivation, composition, sound and time — with information, camera angle and
    continuity silently absent. The wipe explicitly waives composition and camera angle. The screen
    position edit is said not to need all six. The concept edit is said to need none of them.
  whole_system_claim:
    text: >
      The source presents one fixed checklist and operates a variable one. Across seven applications
      the element set is never the same twice, an unannounced seventh element (time) appears for
      every transition that has a duration, and two of the seven cases carry an explicit waiver.
      The source never states that the set varies and never reconciles the variation with the claim
      that all edit types benefit from the same six elements. The variation is not random: elements
      are dropped exactly where they are inapplicable — continuity cannot apply to a transition
      between unrelated times or places, camera angle cannot apply where the whole point is that the
      shots are unrelated — so the underlying rule appears to be applicability, not membership. That
      rule is never written down.
    origin: extractor_synthesis
    interpretation_basis: >
      Assembled by listing, for each of the four transitions and each of the five edit categories,
      which numbered elements the source actually walks through. The counts are directly checkable
      against printed pages 76-78 (cut, six), 80-82 (dissolve, six with continuity replaced by
      time), 84-85 (wipe, six with two waived), 86-87 (fade, four), 88-90 (action edit, six), 91
      (screen position edit, "not every ... will address all six"), and 94 (concept edit, "the six
      elements need not be applied here"). No claim here rests on anything the source says about its
      framework; only on what it does with it.
    source_ref: null
  members:
    - {sk_ref: sk_gote_c003_0024, role_in_system: framing_claim, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_gote_c003_0028, role_in_system: unannounced_seventh_element, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_gote_c003_0035, role_in_system: explicit_partial_waiver, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0037, role_in_system: silent_reduction, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_gote_c003_0039, role_in_system: framing_claim, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0041, role_in_system: stated_partial_exemption, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0044, role_in_system: explicit_total_waiver, order: 7, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies: []
    tradeoffs: []
    conflicts:
      - between: [sk_gote_c003_0039, sk_gote_c003_0044]
        nature: "the source states all five edit categories benefit from the same six elements, then states the six need not be applied to the concept edit"
        origin: extractor_inferred
      - between: [sk_gote_c003_0024, sk_gote_c003_0037]
        nature: "the chapter announces it will analyse each transition against the six elements, then analyses the fade against four without saying so"
        origin: extractor_inferred
      - between: [sk_gote_c003_0003, sk_gote_c003_0035]
        nature: "the camera-angle and composition criteria are stated as requirements for a good edit and then waived for the wipe"
        origin: source_stated
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, repeated_within_source, practitioner_assertion]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The individual observations are OBSERVED and countable on the page. Three of the seven
      departures are the source's own words, so those need no interpretation. What is INFERRED is
      that they constitute one pattern rather than three unrelated remarks, and the further
      suggestion that the operative rule is applicability rather than membership is our reading of
      why the omissions fall where they do. The source may simply have been inconsistent. Both
      readings are consistent with the text and this system does not choose between them.
  provenance:
    chapter: "Chapters Three and Four"
    section: "across The Cut, The Dissolve, The Wipe, The Fade and The Five Major Categories of Edit Types"
    page_start: 57
    page_end: 96
    source_support: text

