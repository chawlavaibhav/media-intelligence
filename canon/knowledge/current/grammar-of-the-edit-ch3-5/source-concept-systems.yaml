# CANON-003 book 9 (Lane B) — Grammar of the Edit, ch.3-5. SourceConceptSystems under SPEC-03.
# Five systems. Origin is marked at every structural level, per the spec's requirement.
#
# Systems 2 and 4 are the ones that carry knowledge no single object holds. System 2 records a
# discrepancy between what the source says its framework is and what it does with it; system 4
# records the source's own position on how binding its rules are. Both were written after all 60
# SourceKnowledge objects existed, not before.

