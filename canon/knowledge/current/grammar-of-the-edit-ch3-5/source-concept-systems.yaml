- scs_id: scs_gote_c003_005
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  label: the_seven_general_practices
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: source_stated
  description: >
    Seven practices the source lists as the starting point for approaching any material: sound and
    vision are partners not rivals; a new shot should contain new information; there should be a
    reason for every edit; observe the action line; select the appropriate form of edit; the better
    the edit, the less it is noticed; editing is creating.
  whole_system_claim:
    text: >
      Six of the seven restate material already taught as elements or transitions, and the source
      says so — it flags two of them as being elements of the cut and the dissolve. What the list
      adds is a change of register: the same content stated as standing practice rather than as a
      per-transition test, plus one practice with no counterpart earlier, the invisibility standard,
      and one that is not a practice at all but a claim about the editor's role. The list is the
      source's own; treating it as mostly a restatement with two additions is ours.
    origin: extractor_synthesis
    interpretation_basis: >
      The source lists the seven at printed p.97 and gives each a section. Two of them are marked by
      the source itself as already covered — "This general practice is one of the elements of the
      cut and also one of the elements of the dissolve" and "This convention is linked with
      motivation, one of the six elements of the cut". The remaining overlaps with the action line
      and with select-the-appropriate-form are visible by comparison but not flagged. That the
      invisibility standard and "editing is creating" have no earlier counterpart is our
      observation.
    source_ref: null
  members:
    - {sk_ref: sk_gote_c003_0047, role_in_system: practice, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0004, role_in_system: practice_restated, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0050, role_in_system: practice, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0054, role_in_system: practice, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0057, role_in_system: practice, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0058, role_in_system: practice_without_earlier_counterpart, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0060, role_in_system: practice_without_earlier_counterpart, order: 7, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: source_numbered
      origin: source_stated
    dependencies:
      - {from: sk_gote_c003_0058, to: sk_gote_c003_0059, nature: "the invisibility standard is justified by the downstream cost of a noticed edit", origin: source_stated}
      - {from: sk_gote_c003_0050, to: sk_gote_c003_0006, nature: "the reason-for-every-edit practice is the motivation element restated", origin: source_stated}
    tradeoffs:
      - between: [sk_gote_c003_0050, sk_gote_c003_0005]
        nature: "leave a self-sufficient shot intact, against discarding a shot that adds no new information"
        origin: extractor_inferred
      - between: [sk_gote_c003_0049, sk_gote_c003_0021]
        nature: "never put picture on screen with sounds that do not match, against the taught technique of deliberate sound contradiction"
        origin: extractor_inferred
    conflicts:
      - between: [sk_gote_c003_0058, sk_gote_c003_0029]
        nature: "the better the edit the less it is noticed, against the dissolve attracting attention on purpose"
        origin: extractor_inferred
  source_warns_against_isolated_use: true
  source_warning_ref: >
    "These general practices may be considered the starting point at which you begin to consider
    your approach to editing any material, but they are not the only points, nor are they the end
    point."
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, practitioner_assertion, repeated_within_source]
    source_uncertainty: source_hedges
    extraction_uncertainty: none
    system_level_uncertainty: >
      Membership and ordering are the source's own list. Which members are restatements is partly
      the source's own admission and partly our comparison. The two trade-offs and the one conflict
      are ours: the source states all four claims involved and never notes that they pull against
      each other.
  provenance:
    chapter: "Chapter Five"
    section: "General Practices for Editors"
    page_start: 97
    page_end: 109
    source_support: text_and_visual
