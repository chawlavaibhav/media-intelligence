- scs_id: scs_gote_c003_003
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  label: the_four_continuities
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: source_stated
  description: >
    Continuity is divided by the source into four kinds that must each be addressed separately:
    content, movement, position and sound. Each has its own failure and, for three of the four, its
    own remedy.
  whole_system_claim:
    text: >
      The four are treated as one responsibility with four independent failure surfaces. A
      transition can satisfy any three and fail the fourth, and each failure looks different to the
      viewer — a mismatched object, a reversed direction of travel, a subject that jumps across the
      screen, sound that vanishes. Two of the four, movement and position, share a single underlying
      cause in the geometry of the action line, and the source treats them separately in Chapter
      Three before supplying the shared cause in Chapter Five.
    origin: extractor_synthesis
    interpretation_basis: >
      The division into four and the requirement to address each is the source's own, stated at the
      head of the Continuity section and repeated in the chapter review. What is ours is the
      observation that movement and position both reduce to the action line, which the source
      supplies two chapters later without connecting it back, and the observation that the four are
      independently failable rather than aspects of one property.
    source_ref: null
  members:
    - {sk_ref: sk_gote_c003_0014, role_in_system: framing_claim, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0015, role_in_system: dimension, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0017, role_in_system: dimension, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0018, role_in_system: dimension, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0019, role_in_system: dimension, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0016, role_in_system: shared_remedy, order: 6, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: source_numbered
      origin: source_stated
    dependencies:
      - {from: sk_gote_c003_0017, to: sk_gote_c003_0054, nature: "screen direction is established by the action line", origin: source_stated}
      - {from: sk_gote_c003_0018, to: sk_gote_c003_0054, nature: "frame-side position is fixed by the same line", origin: extractor_inferred}
      - {from: sk_gote_c003_0016, to: sk_gote_c003_0015, nature: "the cut-away is the named remedy for a content mismatch", origin: source_stated}
      - {from: sk_gote_c003_0016, to: sk_gote_c003_0017, nature: "and the same device, called an insert shot, is the remedy for a direction reversal", origin: source_stated}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, controlled_comparison, practitioner_assertion, repeated_within_source]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: none
    system_level_uncertainty: >
      Membership and ordering are the source's own. The grouping of the cut-away as a shared remedy
      serving two of the four is ours, though it rests on the source using the same action and the
      same stated mechanism in both places under two names.
  provenance:
    chapter: "Chapter Three"
    section: "Continuity"
    page_start: 66
    page_end: 70
    source_support: text_and_visual

