- scs_id: scs_gote_c003_001
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  label: the_six_element_test_for_a_transition
  label_origin: extractor_assigned
  system_type: decision_framework
  system_type_origin: source_stated
  description: >
    Six named factors — information, motivation, shot composition, camera angle, continuity and
    sound — which the source introduces together as the criteria for whether a transition is a good
    edit, applies one at a time to every transition and edit type in the following chapter, and
    finally restates in negative form as the six reasons two shots cannot be joined at all.
  whole_system_claim:
    text: >
      The six factors are a single test, not six separate pieces of advice. The source's own closing
      move makes this explicit: when two shots will not cut together, the reason is that one of
      exactly these six is wrong, and no change of transition type will repair it. The framework is
      therefore both the standard for a good edit and the diagnostic for a bad one, and the source
      states there is very little an editor can do once one of the six has failed.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {section: "What Factors Help Make a Transition a Good Edit?; Select the Appropriate Form of Edit", page_start: 57, page_end: 105}
  members:
    - {sk_ref: sk_gote_c003_0003, role_in_system: framing_claim, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0004, role_in_system: criterion, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0006, role_in_system: criterion, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0010, role_in_system: criterion, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0012, role_in_system: criterion, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0014, role_in_system: criterion, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0021, role_in_system: criterion, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_gote_c003_0057, role_in_system: diagnostic_inverse, order: 8, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: source_numbered
      origin: source_stated
    dependencies:
      - {from: sk_gote_c003_0057, to: sk_gote_c003_0003, nature: "the six failure causes are the six criteria restated negatively; the source lists them in the same order", origin: source_stated}
    tradeoffs:
      - between: [sk_gote_c003_0004, sk_gote_c003_0006]
        nature: "information governs the shot cut to, motivation the shot cut from; a transition can satisfy one and fail the other"
        origin: source_stated
        source_ref: {section: "Motivation", page_start: 60}
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, practitioner_assertion, repeated_within_source]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: none
    system_level_uncertainty: >
      The membership and the ordering are the source's own — it names the six, numbers them, and
      repeats the same six in the same order at least six times across the span. What is ours is the
      decision to attach the diagnostic list from Chapter Five as a member of the same system rather
      than as a separate claim. The source does not say "these are the same six"; it simply lists
      six failure causes that match its six criteria one for one, in order.
  provenance:
    chapter: "Chapters Three, Four and Five"
    section: "What Factors Help Make a Transition a Good Edit?; Select the Appropriate Form of Edit"
    page_start: 57
    page_end: 105
    source_support: text_and_visual

