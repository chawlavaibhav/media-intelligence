- sk_id: sk_gote_c003_0041
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "\"Directional\" because the edit helps direct the viewer's eyes around the screen, and \"placement\" because it is the unique placement of subjects or objects in the two shots cut together that make the viewer's eyes move around the frame."
    - "one strong visual element occupies one side of the frame and casts its attention or a movement toward the other side"
  concept_label: screen_position_edit_moves_the_eye_across_the_frame
  label_origin: extractor_assigned
  claim: >
    A screen position edit uses the placement of subjects in two shots to move the viewer's eyes
    around the screen. One strong element occupies one side of the frame and directs attention or
    movement toward the other; the incoming shot puts the object of that attention on the opposite
    side, satisfying the viewer's need to see something occupy that space. Also called a directional
    or placement edit. It can be a cut or a dissolve, but is usually a cut where no passage of time
    is implied.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The mirrored composition creates and then discharges an expectation: the viewer's eyes are on
      one side, the attention in frame points across, and the cut rewards the movement by placing
      the new subject where the eyes were sent.
  scope:
