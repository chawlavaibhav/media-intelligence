- sk_id: sk_gote_c003_0054
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "It is the imaginary line that cuts through the area of action along talent's sight lines or follows in the direction of an object's movement."
    - "The editor must only select shots from one side of the line unless the line is seen to change"
  concept_label: the_action_line_and_the_one_side_rule
  label_origin: extractor_assigned
  claim: >
    The action line, or axis of action, is an imaginary line running through the area of action —
    along the talent's sight lines, or in the direction an object moves. It establishes a 180 degree
    arc around the subject and dictates which side the camera may shoot from. The editor must select
    only shots taken from one side of it, and so maintain the established screen direction, unless
    the line is seen to change on screen, as when a car changes direction during a shot.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "assembling coverage of a scene with an established direction of action or attention"
  caveats:
    - text: "the source calls the line a mental guide for both directors and editors, so the editor's obligation is to select within constraints production has already fixed"
      origin: source_stated
    - text: "the exception — unless the line is seen to change — puts the burden on the change being visible to the audience, which the source states but does not elaborate"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "select shots from only one side of the line"
  examples:
    positive:
      - {description: "an overhead diagram of the line with camera positions, paired with the frames each produces", figure_ref: "5.3"}
  intra_source_relations:
    - {relation: generalises, target: sk_gote_c003_0055, note: "what crossing it does"}
    - {relation: generalises, target: sk_gote_c003_0056, note: "the case of two people in conversation"}
    - {relation: generalises, target: sk_gote_c003_0017, note: "it is what establishes the screen direction that must be maintained"}
    - {relation: generalises, target: sk_gote_c003_0012, note: "the line establishes the 180 degree arc within which the 30 degree rule operates"}
    - {relation: member_of_system, target: scs_gote_c003_005}
