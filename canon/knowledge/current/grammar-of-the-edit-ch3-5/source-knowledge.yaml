      origin: source_stated
    - text: "asserted, not evidenced; no study, measurement or comparison across viewer populations is offered anywhere in the section"
      origin: extractor_observed
    - text: "if the competence is learned by exposure it should vary with viewing history and era, which the source does not address except when noting that the convention against dissolves in news is itself changing"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples: {positive: []}
