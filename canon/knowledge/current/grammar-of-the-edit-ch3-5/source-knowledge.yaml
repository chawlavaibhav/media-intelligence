- sk_id: sk_gote_c003_0060
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "QUESTION: Aren't the rules of editing made to be broken? ANSWER: No, they are made to be followed, and, perhaps eventually, creatively reinterpreted by you."
    - "Breaking the practices to achieve a special result is valid under nearly all circumstances."
    - "effective creativity overrules grammar"
  concept_label: learn_the_grammar_before_breaking_it_creativity_overrules_it
  label_origin: extractor_assigned
  claim: >
    The rules are made to be followed and eventually reinterpreted, not broken. The common grammar
    exists to get everyone on the same page; an editor's creativity and craft can overrule it, but
    the editor should always be conscious of which rule is being bent. Well-known directors have
    produced creditable results by breaking the fundamentals, including deliberate use of the jump
    cut, always for a special sequence. Breaking the practices to achieve a special result is valid
    in nearly all circumstances. The source closes: perfect editing grammar is not an end in itself,
    and effective creativity overrules grammar.
