# CANON-003 book 9 (Lane B) — Roy Thompson & Christopher J. Bowen, "Grammar of the Edit", 2nd ed.
# Chapters Three, Four and Five, complete (printed pp.55-109 = PDF pp.68-122).
# Fresh SPEC-03 extraction under the CANON-001 V0 granularity rule, unchanged.
# Visual completeness: verified_page_level.
#
# SECTION RATIONALE: three chapters, taken as one tightly connected span rather than one chapter.
# Chapter Three introduces six factors that make an edit good. Chapter Four opens by saying it will
# analyse each transition against "the six elements of information, motivation, composition, camera
# angle, continuity, and sound" and then does exactly that, four times, plus five edit categories.
# Chapter Five states the general practices that govern both and carries the section's strongest
# visual demonstration. Chapter Four is not readable without Chapter Three; the dependency is the
# source's own, not a convenience. Chapter Six ("Working Practices") is workflow procedure and is a
# different kind of material.
#
# SCOPE NOTE, STATED SO THE COUNT IS NOT MISREAD: this span is 55 printed pages against roughly 20
# for the earlier books in this batch, and the source is unusually enumerative — it lists six
# elements, applies them to four transitions, then defines five edit categories and seven general
# practices. The object count is therefore higher than books 1-5. That is section size and source
# shape, not a change in granularity policy. Object density is about 1.1 per printed page, against
# 0.85 for book 1.
#
# ISOLATION NOTE: no Canon knowledge file for "Grammar of the Shot" was opened at any point during
# this extraction, although the two books share authors, publisher, series and subject. Everything
# below was read off this source. Whether the two books produce overlapping knowledge is a question
# for the post-checkpoint comparison, not an input to it.
#
# ON THIS SOURCE'S SHAPE: an introductory teaching text. Claims are asserted from professional
# experience and taught by enumeration; most are accompanied by a demonstration figure and a worked
# scenario, and a minority are given a mechanism. There is no measurement anywhere in the section.

