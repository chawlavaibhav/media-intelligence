- sk_id: sk_gote_c003_0057
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "If a cut does not create a successful transition between two shots, then it is unlikely that a dissolve or a fade will make it successful."
    - "An illegitimate cut is no better than an illegitimate dissolve."
    - "If an edit should be a cut and it fails as a cut, then the failure might be compounded, even more, as a dissolve."
  concept_label: a_failed_cut_cannot_be_rescued_by_another_transition
  label_origin: extractor_assigned
  claim: >
    Where two shots will not join as a cut they will not join as a dissolve or a fade either, and
    the failure may be made worse. The reason is that the fault lies in the shots, not in the
    transition: the angle is wrong, the continuity is wrong, there is no new information, there is
    no motivation, the composition is wrong, or some combination. There is very little an editor can
    do to improve this. Depending on the programme a wipe may sometimes make an otherwise sticky cut
    point work; if a wipe is not appropriate to the show, the editor is back to square one.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A dissolve superimposes the two shots, so a fault in the pairing is displayed for longer and
      with both images present. The source's example is a crossed line in a dialogue scene: as a cut
      it jars, and as a dissolve the two faces superimpose and the viewer starts looking for a
      symbolic or supernatural reading that was never intended.
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "a shot pair that fails as a straight cut"
  caveats:
    - text: "the wipe exception is real but narrow and genre-dependent, and the source immediately notes that if a wipe is not appropriate there is no remedy left"
      origin: source_stated
    - text: "this is the most diagnostically useful claim in the section: it names six checkable causes and asserts that the transition type is not among them"
      origin: extractor_observed
  source_stated_problems:
    - "the angle is wrong"
    - "the continuity is wrong"
    - "there is no new information"
    - "there is no motivation"
    - "the shot composition is wrong"
  source_stated_remedies:
    - "a wipe may sometimes work at a sticky cut point, where the programme allows it"
  examples:
    counter:
      - {description: "a crossed-line dialogue pair failing as a cut and failing worse as a dissolve, the two faces superimposing", figure_ref: "5.6"}
  intra_source_relations:
    - {relation: depends_on, target: sk_gote_c003_0003, note: "its six diagnostic causes are the six elements restated as failures"}
    - {relation: qualified_by, target: sk_gote_c003_0033, note: "the wipe is the one partial exception"}
    - {relation: demonstrated_together_with, target: sk_gote_c003_0056, note: "demonstrated on the crossed-line case"}
    - {relation: member_of_system, target: scs_gote_c003_001}
