  concept_label: split_edit_offsets_picture_and_sound_cut_points
  label_origin: extractor_assigned
  claim: >
    Picture and sound are separate tracks and need not change at the same instant. Cutting both at
    once is a butt-cut or straight cut. Offsetting one produces a split edit, also called an L-cut
    or lapping: sound leading picture when the next shot's audio arrives first, picture leading
    sound when the outgoing audio continues under the new image. Assemble and rough cuts are
    normally all butt-cuts; split edits appear when timing is refined in the fine cut.
