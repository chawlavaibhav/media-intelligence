- sk_id: sk_gote_c003_0001
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "The main purpose behind any edited project is for it to be shown to an audience."
    - "not just any audience, but the specific audience that the project is targeting"
  concept_label: edit_for_the_specific_targeted_audience
  label_origin: extractor_assigned
  claim: >
    Every editing decision is made on behalf of a particular intended audience, not an audience in
    general. The material was written, shot and must be cut with that audience in mind. Anticipating
    what they will want to see next is presented as the editor's primary orienting skill, and
    different genres and audiences require different editing approaches.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [film_editing, television_editing, commercials, music_video, documentary]
    conditions: "any edited motion picture intended for viewing"
  caveats:
