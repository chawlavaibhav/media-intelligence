- sk_id: sk_gote_c003_0002
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "People are rarely conscious of these elements, but through viewing film and television imagery over time, they subconsciously know how to \"read\" certain edits"
    - "There is a grammar of the edit."
  concept_label: audiences_read_edits_through_learned_convention
  label_origin: source_verbatim
  claim: >
    Viewers acquire, from long exposure to film and television, a subconscious competence at reading
    edits. They decipher meaning in the flow of images without being aware of doing so. This learned
    competence is what the book calls a grammar: just as shot types carry meaning, the way shots are
    joined carries meaning to the viewer.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Repeated exposure over time builds the competence. The source attributes it to viewing habit,
      not to anything innate.
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "viewers with ordinary exposure to motion pictures"
  caveats:
