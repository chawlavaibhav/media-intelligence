- sk_id: sk_gote_c003_0042
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "a transition from a shot that has a pronounced shape, color, dimension or sound, to another shot that has a matching shape, color, dimension, or sound"
    - "Rarely is the form edit just blind luck on the part of the editor."
  concept_label: form_edit_matches_shape_colour_dimension_or_sound_across_the_cut
  label_origin: extractor_assigned
  claim: >
    A form edit joins a shot with a pronounced shape, colour, dimension or sound to another whose
    shape, colour, dimension or sound matches it. It is usually executed as a dissolve — then called
    a match dissolve — particularly where location or time changes, though it can be a straight cut
    when sound provides the motivation. It must normally be conceived during writing or
    pre-production, because the matching elements require deliberate composition and sometimes
    deliberate screen direction.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Consistency of shape and composition keeps the viewer's eye trained on one part of the screen,
      giving them the focus needed to read the meaning of the juxtaposition. During the dissolve the
      two objects occupy the same positions, and that union is what generates the meaning.
  scope:
    domain_discussed_by_source: [film_editing, television_editing, advertising, television_commercials]
    conditions: "footage containing deliberately matched forms"
  caveats:
    - text: "the source names shape, colour, dimension and sound as matchable, but every example given matches shape and position only; colour and dimension are never demonstrated"
      origin: extractor_observed
    - text: "the reproduction is monochrome throughout, so a colour-matched form edit could not have been shown in this edition even had one been offered"
      origin: extractor_observed
    - text: "the cigarette-and-headstone example is later said to be very much like a concept edit, so the source's own boundary between the two categories is soft"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a jet tyre, car tyre, bicycle wheel and wagon wheel, all round and framed at the same size and centre position, dissolving in sequence to compress a journey", figure_ref: "4.7A-D"}
