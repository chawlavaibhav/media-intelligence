- sk_id: sk_gote_c003_0029
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "the dissolve is defined as a gradual change from the ending pictures of one shot into the beginning pictures of the next shot"
    - "unlike the straight cut, it attracts attention to itself on purpose"
    - "So the dissolve chiefly allows the editor to play with time."
  concept_label: the_dissolve_is_a_deliberately_visible_manipulation_of_time
  label_origin: extractor_assigned
  claim: >
    A dissolve is a gradual change from the end of one shot into the beginning of the next, achieved
    by superimposing both while ramping one down in opacity and the other up, so the images are seen
    overlapping. Unlike the cut it attracts attention to itself on purpose. Its chief use is to play
    with time — condensing a long event into a montage, moving into a flashback, or slowing events
    with slow motion so the audience has time to absorb them. Also called a lap dissolve, a lap, or
    a video mix.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Simultaneous downward and upward ramping of opacity over a period of time, so that both images
      are on screen together while one replaces the other.
