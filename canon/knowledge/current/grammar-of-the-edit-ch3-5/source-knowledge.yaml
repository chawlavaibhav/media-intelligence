- sk_id: sk_gote_c003_0043
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "The concept edit may stand alone as a purely mental suggestion."
    - "through the juxtaposition of these visual elements at that particular time in the story, they can generate implied meaning not explicitly told in the story"
  concept_label: concept_edit_generates_meaning_by_juxtaposition
  label_origin: extractor_assigned
  claim: >
    A concept edit joins two shots of unrelated content so that their juxtaposition, at that
    particular point in the story, generates an implied meaning the story never states. It can cover
    changes of place, time, people or story without an obvious visual break, and is also called a
    dynamic edit or an idea edit. It is usually planned early by the filmmaker, who already knows
    the pairing will convey a mood, make a dramatic emphasis or create an abstract idea. It is rare
    but not impossible for an editor to build one from footage not intended for it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The meaning is produced in the viewer's mind by the pairing itself, not by any property of
      either shot. The source's example — a man asked how it feels to be getting married, cut to a
      shackled prisoner on a television, cut back to him watching — carries a reading neither shot
      contains.
