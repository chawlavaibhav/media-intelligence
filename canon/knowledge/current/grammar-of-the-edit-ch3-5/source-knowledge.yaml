- sk_id: sk_gote_c003_0040
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "this category encompasses edits between shots that depict continuous action or movement of subjects or objects"
    - "Time is unbroken."
    - "Since you cut on action, the audience is not perceiving the cut, but merely registering the presentation of new information"
  concept_label: action_edit_joins_continuous_movement_across_the_cut
  label_origin: extractor_assigned
  claim: >
    An action edit joins two shots depicting one continuous action or movement, with different
    framings and unbroken time, so the movement appears smooth and continuous across the cut. It is
    nearly always a straight cut, and is also called a movement edit or a continuity edit. The
    continuity of movement must match at the cut point, and the editor is free to cut at any point
    during the overlapping action.
