- sk_id: sk_gote_c003_0006
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "There should always be a motivation for making a transition away from a shot."
    - "This motivation can be either visual or aural."
  concept_label: every_departure_from_a_shot_must_be_motivated
  label_origin: extractor_assigned
  claim: >
    Information governs the shot being cut to; motivation governs the shot being cut away from.
    There must always be a reason to leave the current shot and a reason it is left at that
    particular moment. The motivating element may be visual — usually some movement by a subject or
    object, from a car clearing a river down to a small shift of a character's eyes — or aural.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Movement or sound in the current shot creates an expectation the next shot answers. When an
      actor's eyes move off-screen, cutting to the object of interest both discharges the motivation
      and supplies new information.
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "every transition"
  caveats:
    - text: "the source's worked example — a man's eyes move left, cut to the cat he is looking at — is not what the accompanying figure depicts; Figure 3.2A-B shows a man reading a book about pigs cut to a pig"
      origin: extractor_observed
  source_stated_problems:
    - "there is no reason to leave the shot at that moment"
  source_stated_remedies:
    - "find the movement or sound in the outgoing shot that creates the need to see the next one"
  examples:
    positive:
      - {description: "a character in close-up moves only his eyes to the left; the cut goes to what he is looking at", figure_ref: "3.2A-B"}
      - {description: "a tea kettle begins to whistle in a medium long shot, motivating the cut to a close-up of the kettle", figure_ref: "3.2C-D"}
  intra_source_relations:
