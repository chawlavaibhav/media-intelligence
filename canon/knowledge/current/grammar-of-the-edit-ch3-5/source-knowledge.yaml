- sk_id: sk_gote_c003_0021
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "the sound track can also be a great way to comment on something within the film or to juxtapose messages within the film"
    - "the inappropriate animal sounds actually become story-enhancing sounds"
  concept_label: sound_may_depart_from_the_literal_to_create_meaning
  label_origin: extractor_assigned
  claim: >
    Sound need not simply reproduce what is visible. Removing the sound the audience expects, or
    replacing it with sound that contradicts the picture, produces meaning the images do not carry.
    Dropping office noise under a closer shot of a calm woman tells the audience about her internal
    state; a lion's roar over a man saying he will hunt for a job makes the commuter street a
    hunting ground. Sound the audience would not normally accept becomes story-enhancing when it
    follows the context.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The audience accepts a sound that contradicts the image when the narrative context supplies a
      reading for it. The mismatch is then interpreted rather than rejected.
  scope:
    domain_discussed_by_source: [film_editing, television_editing, sound_editing]
    conditions: "where a departure from literal sound has a narrative reading available"
  caveats:
    - text: "the source calls the same removal of expected ambience a fault a page earlier, when it is not deliberate; the difference is intent, which no property of the finished track records"
      origin: extractor_observed
    - text: "recorded as one claim with two examples rather than two claims. Removal and contradiction are different operations, but the source introduces both under one sentence about commenting and juxtaposing, and gives them one mechanism. Splitting them would assert a distinction the source does not make."
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
