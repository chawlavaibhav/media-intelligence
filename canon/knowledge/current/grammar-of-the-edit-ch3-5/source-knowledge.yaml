- sk_id: sk_gote_c003_0004
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "A new shot should always present some new information to the viewer."
    - "this element of new information is basic to all editing choices"
  concept_label: every_new_shot_must_carry_new_information
  label_origin: extractor_assigned
  claim: >
    Each shot cut to must give the viewer information it did not already have. The information may
    be visual — a character entering, a new location, an unexplained event — or aural, such as
    narration or an off-screen sound. The source states this is basic to all editing choices, and
    frames the editor's working question as: what would, should, cannot and do I wish the audience
    to see next.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      New information keeps the audience thinking and feeling. While they are engaged in processing
      it they are not attending to the physical act of the edit, so the cut passes unnoticed.
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "every transition"
  caveats:
    - text: "the information may be deliberately misleading; the source cites showing false information in a mystery, and showing the audience what the characters do not know in melodrama"
      origin: source_stated
    - text: "no test is offered for how much novelty counts as new information, so the rule is applied by judgement"
      origin: extractor_observed
  source_stated_problems:
    - "the audience notices the physical act of the edit"
  source_stated_remedies:
    - "give the new shot something the audience does not yet have"
  examples:
    positive:
      - {description: "a large establishing view of a location; a close-up of a computer screen; rain falling; a baby crying", figure_ref: "3.1"}
  intra_source_relations:
    - {relation: specialises, target: sk_gote_c003_0003, note: "first of the six factors"}
    - {relation: generalises, target: sk_gote_c003_0005, note: "the disposal rule follows from it"}
    - {relation: qualified_by, target: sk_gote_c003_0006, note: "information governs the shot cut to; motivation governs the shot cut from"}
