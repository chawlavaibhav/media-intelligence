- sk_id: sk_gote_c003_0053
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "it is essential to give the eyes enough time to read and absorb the visual information"
    - "you could describe, in your mind, what you are seeing in the shot ... \"There is a house in the hills, there is smoke coming out of the chimney, a man is walking to the house, it is evening because the sun is setting. Cut!\" And that is the length of the shot."
  concept_label: shot_length_set_by_describing_the_shot_contents_aloud
  label_origin: extractor_assigned
  claim: >
    A shot must run long enough for the eyes to read and absorb its visual information. To find that
    length, silently describe what is in the shot; the time the description takes is the length of
    the shot. The source's justification is that if the extractor's own eyes and brain need that
    much time to digest the image, most viewers will comprehend it at about the same rate.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Describing the content aloud takes roughly as long as apprehending it, and comprehension rates
      are assumed to be similar across viewers, so one person's description time stands in for the
