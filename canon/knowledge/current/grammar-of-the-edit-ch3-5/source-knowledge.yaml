- sk_id: sk_gote_c003_0007
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "An editor may create what is called a sound bridge."
    - "A sound, seemingly generated by something not seen or known to the audience, begins under shot one. It motivates the transition into shot two, where the origin of the strange sound is revealed."
  concept_label: sound_bridge
  label_origin: source_verbatim
  claim: >
    A sound whose source is not visible or known begins under the outgoing shot, motivates the cut,
    and is explained by the incoming shot, which reveals its origin. The device carries the viewer
    across a change of location or subject that would otherwise be abrupt.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The unexplained sound gives the audience something to process, and the new shot resolves it.
      Because they are occupied resolving it and the resolution follows a knowable logic, they do
      not notice the unexpected transition.
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "a transition to a new location, time or subject"
  caveats:
    - text: "the source describes this as a third and more advanced use of audio, above the two simpler motivating uses"
      origin: source_stated
    - text: "the source's own cross-reference for this claim is wrong: it cites Figure 3.4E and F, but Figure 3.4 has only panels A to C and shows camera-angle similarity; the train-whistle bridge is Figure 3.2E and F. Verified by rendering both pages."
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
