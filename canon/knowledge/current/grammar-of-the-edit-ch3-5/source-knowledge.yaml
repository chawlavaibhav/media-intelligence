    - {relation: qualifies, target: sk_gote_c003_0004, note: "the two factors govern opposite ends of the same transition"}
    - {relation: generalises, target: sk_gote_c003_0007, note: "the sound bridge is a specific motivating device"}
    - {relation: generalises, target: sk_gote_c003_0009, note: "elapsed time can itself become the motivator"}
