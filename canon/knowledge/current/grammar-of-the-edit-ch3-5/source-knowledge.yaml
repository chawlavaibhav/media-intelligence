- sk_id: sk_gote_c003_0015
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "Actions performed by the on-camera talent must match from one shot to the next."
    - "the editor must create some means of hiding, masking, or \"explaining\" the visual incongruity"
  concept_label: continuity_of_content_actions_and_objects_must_match
  label_origin: extractor_assigned
  claim: >
    Actions and the objects involved in them must match from shot to shot within a scene: a dog
    present in the wide shot should be present in the tighter shots, a telephone picked up in the
    right hand should still be in the right hand after the cut. Where the coverage does not supply
    matching material the editor must hide, mask or explain the incongruity, and the audience must
    remain unaware of it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A visible incongruity breaks the audience's belief in the filmed illusion. The source likens
      the editor to a magician distracting the eye to cover the trick of the edit.
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "shots covering the same continuous scene"
  caveats:
    - text: "the source concedes the problem originates in production — actors are obliged to repeat actions across takes and often do not — and that it may not be easily fixed"
      origin: source_stated
    - text: "several of the offered solutions change the shape of the scene rather than repairing the mismatch: starting on a close-up instead of the wide, or adding a sound effect of the dog leaving"
      origin: extractor_observed
  source_stated_problems:
    - "the continuity of content must be watched for but may not be easily fixed"
    - "you run the risk of breaking their belief in the filmed illusion"
  source_stated_remedies:
    - "begin the scene on a different shot that does not contain the mismatched element"
    - "lay in a sound effect that explains the element's absence"
    - "cut away to a brief shot so the audience accepts that the change happened off screen"
  examples:
