- sk_id: sk_gote_c003_0010
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "you use the alternate placement of characters frame left and frame right to generate interest"
    - "the audience traces character A's eye-line across the empty screen and rests upon the new face of character B"
    - "eye-line match or eye trace"
  concept_label: alternating_frame_placement_drives_eye_trace_across_the_cut
  label_origin: extractor_assigned
  claim: >
    The editor cannot compose the shots but chooses which compositions meet at a cut. Placing one
    character at frame left with open look room to the right, and cutting to a matching shot of the
    other character at frame right with look room to the left, makes the viewer's gaze travel across
    the screen at the cut and land on the new face. The source calls this eye-line match or eye
    trace and likens the effect to a tennis ball crossing a court.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      While watching character A at frame left the viewer is aware that A's attention is directed
      across the screen to the right. At the cut the viewer traces that eye-line across the empty
      look room and is rewarded by finding character B where the trace ended.
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "two-person dialogue coverage with matching reciprocal singles"
  caveats:
    - text: "the source stresses that the placement of character B must match the eye-line from character A for the reward to occur"
      origin: source_stated
    - text: "the mechanism is asserted about where viewers look; no eye-tracking or other measurement is offered"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a wide shot of two people at a table, then reciprocal medium close-ups with each character on the opposite side of frame", figure_ref: "3.3"}
  intra_source_relations:
    - {relation: specialises, target: sk_gote_c003_0003, note: "third of the six factors"}
