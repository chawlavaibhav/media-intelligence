- sk_id: sk_gote_c003_0047
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "Sound is a partner in the production and must be edited with the same care and attention to detail as the visual elements."
    - "The ear and the eye work in unison, supplementing information to each other, so any conflict between the two will cause confusion."
  concept_label: sound_and_vision_are_partners_not_rivals
  label_origin: source_verbatim
  claim: >
    Sound must be edited with the same care as picture. Ear and eye work in unison and supplement
    each other, so conflict between them causes confusion. Aural information should extend and
    expand the message of the visuals — a car passing an airport sign is better understood with jet
    engines under it; a large truck demands the sound of a large engine. Where one of the two
    dominates a shot or scene, that should be the editor's conscious choice.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The two channels supplement each other's information. Reinforcing the picture with matching
      sound delivers a multi-sensory experience that is more easily understood; contradiction
      between them produces confusion and rivalry in the viewer's mind.
  scope:
    domain_discussed_by_source: [film_editing, television_editing, sound_editing]
    conditions: "any edited material"
  caveats:
    - text: "the source observes it is surprising how many editors allow sound to fight the picture, so it treats this as a common failure rather than an obvious truth"
      origin: source_stated
    - text: "the exception is stated in the same passage — unless conflict is the creative intention of the filmmakers — which makes the rule conditional on intent"
      origin: source_stated
  source_stated_problems:
    - "the sound fights the picture"
    - "confusion and rivalry in the mind of the viewer"
  source_stated_remedies:
    - "edit sound with the same care and attention to detail as picture"
    - "add the sound that reinforces what the picture shows"
  examples:
