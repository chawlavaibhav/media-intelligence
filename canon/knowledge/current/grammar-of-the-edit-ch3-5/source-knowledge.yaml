  label_origin: extractor_assigned
  claim: >
    A single bad edit damages more than its own moment. The general public will not identify it as a
    bad edit, but the blip registers as something not-quite-right, perhaps below consciousness, and
    the viewer's mind continues trying to justify it while the programme goes on. That continuing
    effort impairs their ability to absorb information presented after the bad edit, so one bad edit
    can ruin an entire sequence.
