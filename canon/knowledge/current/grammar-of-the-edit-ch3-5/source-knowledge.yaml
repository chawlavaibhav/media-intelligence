- sk_id: sk_gote_c003_0056
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "A two-shot will establish frame left and frame right, therefore also establishing screen direction, look room, and lines of attention for the two characters."
    - "Clearly, with both persons looking right, they would appear to be talking to some third, but unseen, person off-screen."
  concept_label: the_line_for_people_governs_reciprocal_coverage
  label_origin: extractor_assigned
  claim: >
    The action line exists for people as well as movement. A two-shot fixes which character is frame
    left and which frame right, and with that the screen direction, the look room and each
    character's line of attention. Every coverage single must keep the characters on their
    established sides looking in their established directions. If one single is shot from the far
    side of the line, both characters appear to look the same way, so they read as addressing an
    unseen third person — which makes no sense to an audience who can account for only two.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The audience reconstructs the geometry of the space from the direction each character faces.
      Two characters facing the same way cannot be facing each other, so the audience infers a third
      party rather than a mistake.
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "dialogue coverage of two characters"
  caveats:
    - text: "the source states the requirement absolutely: both shots must come from the initial side of the arc, never one from each"
      origin: source_stated
  source_stated_problems:
    - "both persons appear to be looking toward frame right"
    - "they would appear to be talking to some third, but unseen, person off-screen"
  source_stated_remedies:
    - "take both coverage singles from the same side of the established line"
  examples:
    positive:
      - {description: "correct coverage — diagrams plus frames, character A at frame left looking right, character B right of centre looking left", figure_ref: "5.4"}
    counter:
      - {description: "the identical setup with character B's single shot from the far side, so both characters look frame right", figure_ref: "5.5"}
  intra_source_relations:
    - {relation: specialises, target: sk_gote_c003_0054, note: "the line applied to people rather than movement"}
    - {relation: depends_on, target: sk_gote_c003_0055, note: "the same reversal mechanism"}
    - {relation: generalises, target: sk_gote_c003_0010, note: "reciprocal look room is what eye trace relies on"}
