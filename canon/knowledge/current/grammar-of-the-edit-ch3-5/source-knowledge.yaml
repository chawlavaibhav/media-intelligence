- sk_id: sk_gote_c003_0055
  source_id: grammar_of_the_edit_ch3_5_editing_decisions
  source_terms:
    - "Crossing the line results in a visually contradicting situation for the audience."
    - "It will, in essence, flip-flop the orientation of left and right within the film space."
  concept_label: crossing_the_line_reverses_the_film_spaces_left_and_right
  label_origin: extractor_assigned
  claim: >
    Cutting together shots from opposite sides of the action line reverses the left-right
    orientation of the film space. A car travelling right to left in one shot appears to travel left
    to right in the next, though in the story it never turned. The audience is confronted with a
    contradicting viewpoint, their perception of the action changes, the visual flow breaks and they
    ask why the movement reversed.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Shooting from the far side of the line inverts the screen geometry, so the same physical
      movement is recorded travelling the opposite way across frame. The reversal is a property of
      camera placement, not of the action.
  scope:
    domain_discussed_by_source: [film_editing, television_editing]
    conditions: "cutting between shots taken from opposite sides of an established line"
  caveats:
    - text: "the diagram carries the drawn label \"WRONG SIDE OF LINE\", which exists only inside the artwork and is absent from the text layer entirely"
      origin: extractor_observed
  source_stated_problems:
    - "a visually contradicting situation for the audience"
    - "the viewer will be confused and will ask, \"Why is the car now going the opposite way?\""
  source_stated_remedies: []
  examples:
    counter:
      - {description: "a truck shot from one side of the line then from the other, appearing to reverse direction", figure_ref: "5.3"}
  intra_source_relations:
    - {relation: specialises, target: sk_gote_c003_0054, note: "the consequence of breaking the one-side rule"}
    - {relation: generalises, target: sk_gote_c003_0017, note: "the mechanism behind a discontinuity of movement"}
