consequence: >
  The visual pass changed nothing about this extraction and could not have, because the source
  makes no visual argument. Recording that as a completed inspection with a null result
  distinguishes 'we looked and there is nothing to see' from 'we did not look', which is the
  separation the Audit Gate vocabulary was designed for. Note that this ledger asserts nothing
  about admissibility: the critique-not-craft admission boundary (Controller ruling (c)) is
  pending and is a separate question from the visual evidence recorded here.
