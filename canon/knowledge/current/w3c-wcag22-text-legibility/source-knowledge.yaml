- sk_id: sk_wcag_0036
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "Not every graphical object needs to contrast with its surroundings - only those that are required for a user to understand what the graphic is conveying."
    - "If the least-contrasting area is less than 3:1, assume that area is invisible, is the graphical object still understandable?"
    - "If there are multiple colors and/or a gradient, choose the least contrasting area to test"
  concept_label: the_required_for_understanding_test_is_to_assume_the_low_contrast_area_is_invisible
  label_origin: extractor_assigned
  claim: >
    The Understanding note supplies an operational test for "required for understanding". Identify what
    part of an image is needed to grasp what it represents; where there are several colours or a
    gradient, test the least-contrasting area; if that area falls below 3:1, assume it is invisible and
    ask whether the graphical object is still understandable. If enough remains to understand it, it
    passes. The note names four situations in which a graphic is not required for understanding at all:
    where text embedded or overlaid conveys the same information, such as labels and values on a chart;
    where the graphic is aesthetic and need not be seen to understand the content or use the
    functionality; where the information is available in another form such as a following table or a
    long description; and where the graphic is part of a logo or brand name. It adds that text within a
    graphic must itself meet SC 1.4.3.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Treating the sub-threshold region as absent converts a contrast question into a comprehension
      question, which is what the criterion is actually protecting; a graphic can therefore keep
      low-contrast parts as long as the parts that carry the meaning survive their removal.
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "assessing icons, charts, diagrams and other graphics under SC 1.4.11"
  caveats:
    - text: "NON-NORMATIVE — Understanding SC 1.4.11 is a W3C Working Group Note; the criterion's phrase 'required to understand the content' is normative but the test procedure is not"
      origin: source_stated
    - text: "the note allows Gestalt reasoning — it cites the law of continuity as a ground for ignoring minor overlaps between graphical objects — which makes the test partly a perceptual judgement rather than a pure measurement"
      origin: source_stated
    - text: "the worked examples are figures (a magnet, a phone icon, pie charts, network infographics) whose captions state the colours and ratios; the figures themselves were not inspected in this extraction"
      origin: extractor_observed
  source_stated_problems: []
