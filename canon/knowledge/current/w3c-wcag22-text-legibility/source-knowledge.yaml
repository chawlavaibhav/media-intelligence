- sk_id: sk_wcag_0003
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "Text or images of text that are part of an inactive user interface component, that are pure decoration, that are not visible to anyone, or that are part of a picture that contains significant other visual content, have no contrast requirement."
  concept_label: incidental_text_has_no_contrast_requirement
  label_origin: extractor_assigned
  claim: >
    Four categories of text carry no contrast requirement at all under SC 1.4.3 and SC 1.4.6: text
    belonging to an inactive user interface component; text that is pure decoration; text not visible
    to anyone; and text that is part of a picture containing significant other visual content. The
    source calls this group "Incidental". It is an exemption from the requirement, not a lower
    threshold.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "text falling into one of the four named situations"
  caveats:
    - text: "normative — a named exception clause inside SC 1.4.3 and repeated verbatim in SC 1.4.6"
      origin: source_stated
    - text: "'pure decoration' and 'part of a picture that contains significant other visual content' are both defined terms; the exemption cannot be claimed by asserting that text merely looks decorative"
      origin: extractor_observed
    - text: "no contrast requirement is not a statement that such text is readable; the source removes the test, it does not certify the outcome"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a submit button visible at the foot of a form but not activatable until required fields are complete — an inactive user interface component, exempt", figure_ref: null}
      - {description: "a street sign that happens to appear in a photograph — incidental text inside a picture with significant other visual content", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: qualifies, target: sk_wcag_0001, note: "removes the requirement rather than lowering it"}
    - {relation: qualifies, target: sk_wcag_0005, note: "the same clause appears verbatim in SC 1.4.6"}
    - {relation: depends_on, target: sk_wcag_0027, note: "'pure decoration' is a defined glossary term"}
    - {relation: member_of_system, target: scs_wcag_001}
  evidence:
    characteristics: [explicitly_stated, repeated_within_source]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: "Guideline 1.4 Distinguishable"
    section: "SC 1.4.3 Contrast (Minimum), 'Incidental' exception"
