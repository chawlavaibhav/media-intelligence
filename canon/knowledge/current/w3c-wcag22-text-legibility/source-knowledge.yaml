- sk_id: sk_wcag_0020
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "the relative brightness of any point in a colorspace, normalized to 0 for darkest black and 1 for lightest white"
    - "L = 0.2126 * R + 0.7152 * G + 0.0722 * B"
  concept_label: relative_luminance_is_a_weighted_linearised_srgb_quantity
  label_origin: extractor_assigned
  claim: >
    Relative luminance is the relative brightness of any point in a colourspace, normalised to 0 for
    darkest black and 1 for lightest white. For sRGB it is L = 0.2126 R + 0.7152 G + 0.0722 B, where
    each channel is first linearised from its 8-bit value by a piecewise transform with a breakpoint at
    0.04045. The three channel weights are markedly unequal: green contributes roughly seven tenths of
    the luminance and blue roughly seven hundredths. The source directs authors to evaluate in sRGB
    unless another colour space is known to be used.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The channel weights model the eye's unequal sensitivity across the spectrum, which is why a
      luminance-based measure can be computed without regard to a particular colour deficiency; the
      Understanding note adds that most of the luminance contribution comes from the mid and long wave
      receptors, which largely overlap in their spectral responses.
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "sRGB-encoded content; the source notes almost all systems used today to view web content assume sRGB"
  caveats:
    - text: "normative — a glossary definition with six notes"
      origin: source_stated
    - text: "the source records that the 0.04045 breakpoint was 0.03928 before May 2021, and states the change has no practical effect on the calculations in this context"
      origin: source_stated
    - text: "the mechanism sentence above blends the normative definition with the non-normative Understanding note's account of spectral overlap"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
