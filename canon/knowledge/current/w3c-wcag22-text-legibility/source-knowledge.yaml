    - "Corporate identity or brand guidelines beyond logo and logotype are not included in the exception."
    - "If logos are presented with an insufficient contrast, but their presentation was an author choice rather than being mandated by corporate identity or brand guidelines, then that particular low contrast presentation is not \"essential\", and the logo is not exempt from the contrast requirements."
  concept_label: the_logo_exemption_rests_on_a_brand_mandate_and_fails_without_one
  label_origin: extractor_assigned
  claim: >
    The Understanding notes state the assumption behind the logo exemption and then narrow it in three
    ways. The exemption is granted on the assumption that logos and logotypes must comply with stricter
    colour choices mandated by corporate identity or brand guidelines. Corporate identity or brand
    guidelines beyond the logo and logotype are explicitly not covered by the exception. And under SC
    1.4.11 the source states directly that where a low-contrast logo presentation was an author choice
    rather than mandated by brand guidelines, that presentation is not "essential" and the logo is not
    exempt. The source also flags that the exemption becomes problematic when a logo acts as a user
    interface component such as a link, and recommends as best practice choosing a higher-contrast
    variant if brand guidelines allow, or providing an equivalent control that meets the requirements.
