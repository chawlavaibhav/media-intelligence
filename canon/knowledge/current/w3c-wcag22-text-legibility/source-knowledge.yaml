- sk_id: sk_wcag_0033
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "the computed values should not be rounded (e.g., 4.499:1 would not meet the 4.5:1 threshold)"
    - "refer to the foreground and background colors obtained from the user agent, or the underlying markup and stylesheets, rather than the text as presented on screen"
    - "This can lead to situations where text has a contrast ratio that nominally passes the Success Criterion, but has a much lower contrast in practice."
  concept_label: thresholds_are_unrounded_and_a_nominal_pass_can_be_a_practical_failure
  label_origin: extractor_assigned
  claim: >
    Two evaluation points that pull in opposite directions. First, the ratios are threshold values and
    computed results are not rounded: 4.499:1 does not meet 4.5:1, and the same rule is restated for
    3:1 under SC 1.4.11, where 2.999:1 does not pass. Second, the measurement is taken from colours
    obtained from the user agent or the underlying markup and stylesheets rather than from the text as
    presented on screen — and because anti-aliasing can render particularly thin or unusual fonts much
    fainter than their declared colour, text can nominally pass while having much lower contrast in
    practice. The source's stated best practice in that case is to choose a font with stronger, thicker
    lines, or to aim for a colour combination that exceeds the normative requirement. The same warning
    is repeated for thin lines and shapes in non-text elements.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The conformance measurement is defined on specified colour values, not on rendered pixels;
      anti-aliasing acts between the two, so the measured quantity and the perceived quantity can
      diverge, always in the direction of the rendering being fainter.
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "evaluating text and non-text contrast"
  caveats:
    - text: "NON-NORMATIVE — Understanding SC 1.4.3 and SC 1.4.11 are W3C Working Group Notes; the no-rounding instruction and the exceed-the-threshold advice are both non-normative, though the underlying anti-aliasing allowance is normative (glossary contrast ratio, Note 2)"
