    itself damage light-dark contrast perception. Colour deficiencies are too diverse for prescribing
    effective general-use colour pairs from quantitative data to be feasible, so the standard requires
    luminance contrast instead, which is independent of colour perception. Most of the luminance
    contribution comes from mid and long wave receptors whose spectral responses largely overlap. The
    source names one exception: predominantly long-wavelength colours against dark colours for readers
    with protanopia, for which it provides an advisory technique on avoiding red on black.
