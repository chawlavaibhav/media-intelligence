- sk_id: sk_wcag_0038
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "If content is conveyed through the use of colors that differ not only in their hue, but that also have a significant difference in lightness, then this counts as an additional visual distinction, as long as the difference in relative luminance between the colors leads to a contrast ratio of 3:1 or greater."
    - "However, if content relies on the user's ability to accurately perceive or differentiate a particular color an additional visual indicator will be required regardless of the contrast ratio between those colors."
  concept_label: a_3_to_1_lightness_difference_can_satisfy_the_colour_alone_rule_unless_the_colour_must_be_identified
  label_origin: extractor_assigned
  claim: >
    The Understanding notes supply the boundary between SC 1.4.1 and SC 1.4.11. Where two colours differ
    not only in hue but also significantly in lightness, that lightness difference itself counts as the
    additional visual distinction SC 1.4.1 demands, provided the relative luminance difference reaches
    3:1. Inverting an element's foreground and background colours passes on the same ground. But where
    the content relies on the reader accurately perceiving or differentiating a particular colour — the
    source's example is knowing whether an outline is green for valid or red for invalid — an additional
    visual indicator is required regardless of the contrast ratio between them. The SC 1.4.11 note draws
    the resulting division of labour: a star rating distinguished by yellow versus white fill is likely
    to fail Use of Color rather than Non-text Contrast, and a change of background colour within a
    component is not in scope of Non-text Contrast at all while still failing Use of Color.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A lightness difference survives colour vision deficiency, so it does the same work as a shape or
      text cue. Identification of a specific hue does not survive it, so no amount of luminance
      separation substitutes for a second cue in that case.
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance, colour_vision_deficiency]
    conditions: "content that distinguishes states, categories or elements by colour"
  caveats:
    - text: "NON-NORMATIVE — Understanding SC 1.4.1 and Understanding SC 1.4.11 are W3C Working Group Notes; the criteria they reconcile are normative and say none of this"
      origin: source_stated
    - text: "the source also records a carve-out from the same notes: where colour alone distinguishes visited from unvisited links, it does not fail SC 1.4.1, because user agents constrain visited-state exposure for privacy reasons and authors cannot style it non-chromatically"
      origin: source_stated
    - text: "the note further states that SC 1.4.1 does not apply where colour has not been used to convey anything — a link styled identically to surrounding text does not fail it, though the source observes that this could be poor usability for everyone"
      origin: source_stated
  source_stated_problems:
    - "content relies on the user's ability to accurately perceive or differentiate a particular color"
  source_stated_remedies:
    - "an additional visual indicator will be required regardless of the contrast ratio between those colors"
  examples:
