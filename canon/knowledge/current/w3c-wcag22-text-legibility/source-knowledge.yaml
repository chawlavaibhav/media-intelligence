- sk_id: sk_wcag_0039
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "The Essential exception is intended to apply when there is no way of presenting the graphic with sufficient contrast without undermining the meaning."
    - "Flags: Flags may not be identifiable if the colors are changed to have sufficient contrast."
    - "Sensory: There is no requirement to change pictures of real life scenes such as photos of people or scenery."
