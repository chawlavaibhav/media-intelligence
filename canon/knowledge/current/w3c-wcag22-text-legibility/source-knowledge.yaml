- sk_id: sk_wcag_0008
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "If the technologies being used can achieve the visual presentation, text is used to convey information rather than images of text"
    - "The image of text can be visually customized to the user's requirements"
    - "A particular presentation of text is essential to the information being conveyed."
    - "Logotypes (text that is part of a logo or brand name) are considered essential."
  concept_label: real_text_is_preferred_over_images_of_text_with_two_exceptions
  label_origin: extractor_assigned
  claim: >
    Where the technologies in use can achieve the intended visual presentation, information must be
    conveyed with text rather than with an image of text. Two exceptions are named: Customizable — the
    image of text can be visually customised to the user's requirements; and Essential — a particular
    presentation of text is essential to the information being conveyed. A note declares logotypes to
    be essential. The obligation is conditional on the technology: it applies only where the
    presentation can actually be achieved with text.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "web content at Level AA, where the technologies in use can achieve the desired visual presentation"
  caveats:
    - text: "normative — a Success Criterion at Level AA, with a normative note on logotypes"
      origin: source_stated
    - text: "'Essential' is a defined glossary term with a stringent test, not a claim that the designer preferred that presentation"
      origin: extractor_observed
    - text: "the criterion concerns whether information is conveyed as text; it is not a rule about whether images may contain letterforms"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "headings set with CSS rather than as bitmap images", figure_ref: null}
      - {description: "a server-generated image of text accompanied by controls that let the user set its font size and its foreground and background colours — the Customizable exception", figure_ref: null}
      - {description: "a representation of a font family, where substituting another font would defeat the purpose — the Essential exception", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: depends_on, target: sk_wcag_0025, note: "the glossary definition of image of text bounds what the criterion covers"}
    - {relation: depends_on, target: sk_wcag_0028, note: "'Essential' is a defined term"}
    - {relation: qualified_by, target: sk_wcag_0009, note: "SC 1.4.9 removes the Customizable exception and the technology condition"}
    - {relation: member_of_system, target: scs_wcag_003}
