- sk_id: sk_wcag_0014
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "(L1 + 0.05) / (L2 + 0.05)"
    - "L1 is the relative luminance of the lighter of the colors"
    - "L2 is the relative luminance of the darker of the colors"
    - "Contrast ratios can range from 1 to 21 (commonly written 1:1 to 21:1)."
  concept_label: contrast_ratio_is_a_relative_luminance_formula_bounded_at_1_and_21
  label_origin: source_verbatim
  claim: >
    Contrast ratio is defined as (L1 + 0.05) / (L2 + 0.05), where L1 is the relative luminance of the
    lighter colour and L2 that of the darker. Because the lighter colour is always the numerator, the
    measure is symmetric — dark text on a light ground and its inverse give the same number. The
    source's first note bounds the scale: ratios range from 1 to 21, commonly written 1:1 to 21:1. The
    quantity is dimensionless and is a property of a pair of colours, not of a single colour.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The Understanding note explains the 0.05 offset: the ANSI/HFS 100-1988 standard requires the
      contribution from ambient light to be included in L1 and L2, and 0.05 is taken from the Typical
      Viewing Flare value in IEC/4WD 61966-2-1. The note also explains why the terms "contrast ratio"
      and "relative luminance" are used instead of "luminance" — web content does not emit light
      itself, so the ratio measures the relative luminance that would result when displayed.
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "any pair of colours being assessed under WCAG"
  caveats:
    - text: "normative — a glossary definition, and the glossary is part of the Recommendation"
      origin: source_stated
    - text: "the mechanism text above is drawn from the non-normative Understanding note 'Notes on formula'; the formula itself is normative"
      origin: extractor_observed
    - text: "the symmetry observation is the extractor's reading of the lighter/darker assignment, not a statement the source makes"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
