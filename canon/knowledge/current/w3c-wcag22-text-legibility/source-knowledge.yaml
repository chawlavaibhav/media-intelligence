- sk_id: sk_wcag_0011
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "Vertical scrolling content at a width equivalent to 320 CSS pixels"
    - "Horizontal scrolling content at a height equivalent to 256 CSS pixels"
    - "Except for parts of the content which require two-dimensional layout for usage or meaning."
  concept_label: reflow_without_two_dimensional_scrolling_at_320_css_pixels
  label_origin: extractor_assigned
  claim: >
    Content must be presentable without loss of information or functionality and without requiring
    scrolling in two dimensions, at a width equivalent to 320 CSS pixels for vertically scrolling
    content and a height equivalent to 256 CSS pixels for horizontally scrolling content. The source's
    note derives 320 CSS pixels from a 1280 CSS pixel viewport at 400% zoom. Parts of the content that
    require two-dimensional layout for usage or meaning are excepted, and the source names images
    required for understanding such as maps and diagrams, video, games, presentations, data tables and
    toolbar-bearing interfaces.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "web content at Level AA"
  caveats:
    - text: "normative — a Success Criterion at Level AA, with two normative notes"
      origin: source_stated
    - text: "the numbers are zoom-derived viewport equivalences, not device sizes; a CSS pixel is separately defined as a visual angle of about 0.0213 degrees, not a hardware pixel"
      origin: source_stated
    - text: "the criterion governs a resizable rendered layout under user control; a fixed-size rendered image has no reflow behaviour for it to describe"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive: []
    counter: []
