- sk_id: sk_wcag_0005
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "The visual presentation of text and images of text has a contrast ratio of at least 7:1"
    - "Large-scale text and images of large-scale text have a contrast ratio of at least 4.5:1"
  concept_label: enhanced_contrast_is_7_to_1_with_4_5_to_1_for_large_text
  label_origin: extractor_assigned
  claim: >
    SC 1.4.6 Contrast (Enhanced) is a Level AAA criterion requiring 7:1 for text and images of text,
    with large-scale text and images of large-scale text at 4.5:1. Its Incidental and Logotypes
    exceptions are worded identically to those in SC 1.4.3. The two criteria are the same structure at
    two levels: the value that is the AA general threshold becomes the AAA large-text threshold.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
