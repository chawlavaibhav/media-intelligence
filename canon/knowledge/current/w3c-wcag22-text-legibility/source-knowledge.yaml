- sk_id: sk_wcag_0037
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "long lines of text can become a significant barrier. They have trouble keeping their place and following the flow of text."
    - "The uneven spacing between words in fully justified text can cause \"rivers of white\" space to run down the page making reading difficult and in some cases impossible."
    - "Studies have shown that Chinese, Japanese and Korean (CJK) characters are approximately twice as wide as non-CJK characters when both types of characters are displayed with characteristics that achieve the same readability"
  concept_label: reasons_behind_the_line_length_justification_and_leading_provisions
  label_origin: extractor_assigned
  claim: >
    The Understanding note gives a separate reason for each item of SC 1.4.8. Long lines are a barrier
    for some readers with reading or vision disabilities because they lose their place and cannot follow
    the flow; a narrow block makes continuing to the next line easier. The 40-glyph CJK limit is half
    the 80-character limit because CJK characters are described as approximately twice as wide as
    non-CJK characters at equal readability. Full justification is a problem because uneven word spacing
    creates "rivers of white" running down the page, and because it can push words so close together
    that word boundaries become hard to locate. Extra line and paragraph spacing helps readers track to
    the next line and recognise the end of a paragraph, and the note recommends offering several
    options rather than one.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Each provision addresses a specific reading-process failure: losing the return sweep on a long
      line, losing word boundaries in uneven justified spacing, and losing the line or paragraph
      boundary in tight leading.
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance, low_vision_readership, cognitive_disability]
    conditions: "blocks of text presented for reading"
  caveats:
