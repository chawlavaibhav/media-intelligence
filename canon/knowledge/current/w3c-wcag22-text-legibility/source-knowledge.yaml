      - {description: "a light green and a dark red differing in both hue and lightness pass if their contrast ratio is at least 3:1", figure_ref: null}
      - {description: "an inline link distinguished from surrounding text by a colour meeting 3:1 against the non-link text colour is treated as relying on contrast as well as hue, and satisfies Use of Color", figure_ref: null}
