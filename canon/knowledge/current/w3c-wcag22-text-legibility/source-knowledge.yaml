- sk_id: sk_wcag_0006
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "The visual presentation of the following have a contrast ratio of at least 3:1 against adjacent color(s)"
    - "Visual information required to identify user interface components and states"
    - "Parts of graphics required to understand the content"
  concept_label: non_text_contrast_is_3_to_1_against_adjacent_colours
  label_origin: extractor_assigned
  claim: >
    SC 1.4.11 requires 3:1 against adjacent colours for two things: the visual information needed to
    identify a user interface component and its states, and the parts of graphics required to
    understand the content. It exempts inactive components, appearances determined by the user agent
    and not modified by the author, and graphics where a particular presentation is essential to the
    information conveyed. The comparison is against adjacent colours, not against a page background in
    the abstract.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "user interface components and graphical objects in web content, at Level AA"
  caveats:
    - text: "normative — a Success Criterion at Level AA"
      origin: source_stated
    - text: "the requirement is scoped by 'required to identify' and 'required to understand'; it does not apply to every graphic or every part of a graphic"
      origin: source_stated
    - text: "the phrase 'adjacent color(s)' does substantial work and its interpretation is developed only in the non-normative Understanding note"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
