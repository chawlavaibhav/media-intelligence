- sk_id: sk_wcag_0030
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "A contrast ratio of 3:1 is the minimum level recommended by [ISO-9241-3] and [ANSI-HFES-100-1988] for standard text and vision."
    - "the empirical finding that in the population, visual acuity of 20/40 is associated with a contrast sensitivity loss of roughly 1.5"
    - "A user with 20/40 would thus require a contrast ratio of 3 * 1.5 = 4.5 to 1."
  concept_label: 4_5_and_7_are_derived_from_a_3_to_1_baseline_times_a_contrast_sensitivity_loss
  label_origin: extractor_assigned
  claim: >
    The two headline numbers are derived rather than chosen. A 3:1 ratio is the minimum recommended by
    ISO 9241-3 and ANSI/HFES 100-1988 for standard text and normal vision. The population finding cited
    is that visual acuity of 20/40 carries a contrast sensitivity loss of roughly 1.5, so such a user
    requires 3 x 1.5 = 4.5:1 — which is the AA threshold. Following the same logic, a user at 20/80
    requires about 7:1, which is the AAA threshold. The source adds that 20/40 is commonly reported as
    typical visual acuity at roughly age 80, and that people with worse loss than 20/80 usually use
    assistive technology with contrast enhancement and magnification built in.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Baseline contrast requirement for a normal observer, multiplied by the contrast sensitivity loss
      associated with a specified level of acuity, gives the ratio that restores an equivalent
      experience for that reader. The thresholds are compensation factors, not readability optima.
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance, low_vision_readership]
    conditions: "explaining why SC 1.4.3 and SC 1.4.6 use the values they do"
  caveats:
    - text: "NON-NORMATIVE — Understanding SC 1.4.3 is a W3C Working Group Note; the source's own glossary states that content identified as informative or non-normative is never required for conformance"
      origin: source_stated
    - text: "the source further notes that the ISO and ANSI calculations are for body text, and that a relaxed ratio is provided for text that is much larger"
      origin: source_stated
    - text: "the chain rests on cited external studies (ARDITI-FAYE, GITTINGS-FOZARD) that are not reproduced or re-examined in the document"
      origin: extractor_observed
    - text: "this derivation is about restoring contrast perception for readers with acuity loss; it is not, and is not offered as, a model of what draws attention or reads well"
      origin: extractor_observed
  source_stated_problems:
    - "the loss in contrast sensitivity that typically accompanies aging"
