- sk_id: sk_wcag_0009
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "Images of text are only used for pure decoration or where a particular presentation of text is essential to the information being conveyed."
    - "Logotypes (text that is part of a logo or brand name) are considered essential."
  concept_label: images_of_text_no_exception_permits_only_decoration_or_essential
  label_origin: extractor_assigned
  claim: >
    At Level AAA, SC 1.4.9 permits images of text only where they are pure decoration or where a
    particular presentation of text is essential. The Customizable exception of SC 1.4.5 is gone, and
    so is SC 1.4.5's condition that the technologies must be able to achieve the presentation.
    Logotypes remain essential. The two criteria differ in their exceptions, not in their subject.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "web content being assessed at Level AAA"
  caveats:
    - text: "normative — a Success Criterion at Level AAA, with a normative note on logotypes"
      origin: source_stated
    - text: "the Understanding note for SC 1.4.5 adds a distinction the criteria themselves do not state: SC 1.4.5 is met where an image of text is used in addition to the same information as text, whereas SC 1.4.9 applies to all images of text regardless"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies: []
  examples:
