- sk_id: sk_wcag_0001
  source_id: w3c-wcag22-text-legibility
  source_terms:
    - "The visual presentation of text and images of text has a contrast ratio of at least 4.5:1"
  concept_label: minimum_contrast_ratio_for_text_is_4_5_to_1
  label_origin: extractor_assigned
  claim: >
    At conformance level AA, the visual presentation of text, and of images of text, must have a
    contrast ratio of at least 4.5:1 against its background. Three carve-outs modify this: large-scale
    text, incidental text, and text that is part of a logo or brand name.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [web_content_accessibility_conformance]
    conditions: "web content being assessed for conformance at Level AA; applies to the visual presentation of text and of images of text"
  caveats:
    - text: "normative — this is a Success Criterion, which the source's glossary defines as 'required for conformance'"
      origin: source_stated
    - text: "the criterion is a conformance threshold for accessibility, chosen for readers with low vision; the source nowhere claims that meeting it makes communication effective, or that failing it makes a design bad"
      origin: extractor_observed
    - text: "the criterion states the threshold but gives no mechanism; the reasoning appears only in the non-normative Understanding note (see sk_wcag_0030)"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive: []
    counter: []
  intra_source_relations:
    - {relation: qualified_by, target: sk_wcag_0002, note: "the large-text carve-out lowers the threshold to 3:1"}
    - {relation: qualified_by, target: sk_wcag_0003, note: "incidental text is exempted entirely"}
    - {relation: qualified_by, target: sk_wcag_0004, note: "logotypes are exempted entirely"}
    - {relation: depends_on, target: sk_wcag_0014, note: "the number is only meaningful via the contrast ratio formula"}
    - {relation: member_of_system, target: scs_wcag_001}
  evidence:
    characteristics: [explicitly_stated, mechanism_absent]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: "Guideline 1.4 Distinguishable"
    section: "SC 1.4.3 Contrast (Minimum)"
    page_start: null
    page_end: null
