- scs_id: scs_god_003
  source_id: godin-this-is-marketing
  label: the_adoption_path_and_the_gap_in_it
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: source_stated
  description: >
    Godin's account of how something travels from nobody to a market: begin with the neophiliacs
    because the satisfied cannot be afforded; expect a gap, because the mass market wants a pattern
    match and the early adopters wanted an interrupt; cross it with a network effect rather than
    with enthusiasm; sustain it with frequency past the point of your own boredom; and build the
    reason to tell into the artefact rather than adding it later.
  whole_system_claim:
    text: >
      The path has a discontinuity in it that is structural rather than a matter of effort: the two
      populations want opposite things, so the same offering cannot satisfy both, and the passage
      between them is bought only where the earlier adopter's own life improves when the later one
      joins. Everything else in the sequence — where to spend first, how long to keep saying the
      same thing — is a consequence of that discontinuity.
    origin: extractor_synthesis
    interpretation_basis: >
      Godin states each member separately and credits the curve and the chasm to others (Rogers,
      Moore, Gartner). He does not present them as one sequence with a single governing property.
      The claim that the discontinuity is what determines the spending rule, the bridge and the
      persistence requirement is our reading of how the chapters relate — Chs. 14, 15, 17 and 19 are
      four separate chapters in his order, not one argument. The reading is contestable in one
      specific way, recorded here rather than smoothed: Godin's own counter-example — a chocolate you
      like, which does not improve your life if others eat it — means the bridge is unavailable for
      whole categories, and he supplies no alternative for them, which a genuine sequence would.
    source_ref:
  members:
  - {sk_ref: sk_god_0023, role_in_system: step, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_god_0021, role_in_system: mechanism, order: 2, membership_origin: extractor_inferred}
  - {sk_ref: sk_god_0024, role_in_system: step, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_god_0026, role_in_system: precondition, order: 4, membership_origin: extractor_inferred}
  - {sk_ref: sk_god_0025, role_in_system: sustaining_condition, order: 5, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: causal
      origin: source_stated
    dependencies:
    - {from: sk_god_0024, to: sk_god_0023, nature: "beginning with neophiliacs is what creates the gap that must then be crossed", origin: source_stated}
    - {from: sk_god_0024, to: sk_god_0026, nature: "the bridge requires a reason to tell that was designed into the offering", origin: source_stated}
    - {from: sk_god_0021, to: sk_god_0024, nature: "the gap exists because the mass market wants a pattern match", origin: source_stated}
    tradeoffs:
    - between: [sk_god_0023, sk_god_0024]
      nature: "satisfying the early adopters may require annoying the mass market you will later need"
      origin: source_stated
      source_ref: {chapter: 'Ch. 19 "The Funnel", section "Bridging the chasm" (spine 26)', page_start: null}
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref:
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given, anecdotal, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The members are the source's; the sequence is ours. Two of the frameworks inside it (the
      chasm, the hype cycle) are cited from other authors and are not findings of this book, and one
      member's evidence is the author's own failed project, reported by him. The system should be
      read as a hypothesis about how his chapters relate, not as a stated method.
  provenance:
    chapter: 'Chs. 14, 15, 17, 19-20, spines 21-22, 24, 26-27'
    section:
    page_start:
    page_end:
    source_support: text
