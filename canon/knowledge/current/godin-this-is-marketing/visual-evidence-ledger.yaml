observed_loss_patterns:

  - pattern: no_authored_page
    affects: "the whole source"
    detectability: detected_by_independent_check
    recoverability: unrecoverable_in_this_copy
    evidence: >
      Reflowable EPUB, no authored page numbers. Every locator is chapter number and title plus
      Godin's own bold section heading (PROVENANCE.md §2, Case 3), which is a genuinely fine
      locator because his headings occur every few hundred words; page_start/page_end are null on
      every object; spine numbers are a secondary aid only; no page number was invented. The image
      filenames ('page_246.png', 'page_iii_3.jpg') echo print-edition folios but are asset names,
      not an addressable page map.

  - pattern: in_figure_text_absent
    affects: "the internal text of all 16 figures (axis labels, quadrant labels, percentages, logo names)"
    detectability: detected_by_independent_check
    recoverability: recovered_in_this_copy
    evidence: >
      Every figure is a raster image; its internal text (e.g. 'security' / 'speed of delivery',
      'High perceived status', '34.1%', the ~130 logo names) exists only inside the JPEGs and is
      absent from the text layer the extraction read. This pass opened all 16 and confirms that
      for every figure adjacent to an extracted claim, the prose states the semantic binding the
      figure carries - the quadrant letters are read out ('the top-left quadrant (d)'), the chart
      readings are stated ('only eight… contributed a profit'), the axes are named. No extracted
      object cites an in-figure value that the prose does not also state.

  - pattern: no_loss_detected
    affects: "the argument carried by the extraction"
    detectability: detected_by_independent_check
    recoverability: not_applicable
    evidence: >
      All 16 figures illustrate stated propositions; the ones the prose points at hardest
      (art-09, art-10, art-14) are narrated line by line. The material where a figure comes
      closest to carrying the claim alone - the art-07 logo sheet, the Gartner Hype Cycle, the
      long-tail t-shirt - was REFUSED by the extraction on independent grounds (period-bound
      detail, another author's framework; EXTRACTION-NOTES §7), so a text-only representation
      loses nothing any frozen object needs. The extraction's empty figure_refs on all 29 objects
      is confirmed correct as a statement of dependence.

demonstrations:
  - >
    art-07 (the Helvetica logo clip sheet) is the one image in this book whose claim is partly
    performed by the reader's own act of looking - ~130 wordmarks that read as one logo. It is not
    recorded as a demonstration_performs_the_claim loss because nothing extracted depends on it:
    the logo material was refused in extraction. Recorded here so a later reader of the refusal
    can find the specimen.
visual_only_observations:
  - >
    PROVENANCE.md §2 states that where a diagram carries meaning the text alone does not, this is
    'recorded in EXTRACTION-NOTES.md under figure_semantic_binding_lost'. The committed
    EXTRACTION-NOTES.md contains no such section or string. This pass supplies the inspection that
    the promised record would have pointed at, and finds no figure whose semantic binding an
    extracted claim needs and lacks: the discrepancy is a documentation gap in the candidate's own
    prose, not a knowledge defect, and it is recorded here rather than papered over.

extraction_constraint_applied: >
  Checked programmatically against the frozen source-knowledge.yaml: no object carries
  source_support: visual or text_and_visual (all 29 are source_support: text), and
  provenance.inspected.figures is empty on every object. No claim in the frozen record depends on
  an image, and this pass confirmed by opening every image that none should have.

claim_resolution_after_inspection: all_resolved
consequence: >
  The inspection changed no frozen claim. It corrected the runbook's expectation of a null-visual
  book: This Is Marketing carries sixteen real figures, and the honest role for them is
  illustrative_only - the prose states everything the extraction uses, and the figures restate it.
  It also closed, by inspection, the figure_semantic_binding_lost question that PROVENANCE.md
