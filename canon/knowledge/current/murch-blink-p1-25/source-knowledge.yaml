- sk_id: sk_murch_c003_0018
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "An overactive editor, who changes shots too frequently, is like a tour guide who can't stop pointing things out"
    - "then he is pursuing a goal (complete control) that in the end is self-defeating"
  concept_label: complete_control_of_the_viewers_attention_is_self_defeating
  label_origin: extractor_assigned
  claim: >
    An editor who changes shots too frequently is like a tour guide who cannot stop pointing things
    out. Some of the time the viewer wants to be shown; some of the time they want to walk around and
    see what they see. An editor without the confidence to let people occasionally choose what to
    look at, or to leave things to their imagination, is pursuing complete control, which is
    self-defeating: viewers eventually feel constrained and then resentful under the constant
    pressure of his hand on the backs of their necks.
