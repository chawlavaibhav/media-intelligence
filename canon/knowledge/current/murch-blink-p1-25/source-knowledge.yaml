# ─────────────────────────────────────────────────────────────
# "CUT OUT THE BAD BITS" (pp.10-14)
# ─────────────────────────────────────────────────────────────

- sk_id: sk_murch_c003_0011
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "in a certain sense, editing is cutting out the bad bits, the tough question is, What makes a bad bit?"
    - "what is bad in one film may be good in another"
    - "one way of looking at the process of making a film is to think of it as the search to identify what-for the particular film you are working on-is a uniquely \"bad bit.\""
  concept_label: what_counts_as_a_bad_bit_is_specific_to_the_film_being_made
  label_origin: extractor_assigned
  claim: >
    Editing is, in a plain sense, cutting out the bad bits; the difficult question is what makes a
    bit bad. In a home movie the answer is obvious, because the goal is simple — an unrestructured
    record of events in continuous time. In narrative film the fragmented time structure and the need
    to indicate internal states make it proportionately harder, and what is bad in one film may be
    good in another. The source proposes that making a film can be seen as the search to identify
    what, for that particular film, is a uniquely bad bit.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [film_editing]
    conditions: "narrative film, contrasted with home movie"
  caveats:
