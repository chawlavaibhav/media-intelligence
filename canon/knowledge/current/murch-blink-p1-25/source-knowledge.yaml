- sk_id: sk_murch_c003_0006
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "film is actually being \"cut\" twenty-four times a second"
    - "in a continuous shot, the space/time displacement from frame to frame is small enough (twenty milliseconds) for the audience to see it as motion within a context rather than as twenty-four different contexts a second"
  concept_label: continuous_motion_is_already_twenty_four_displacements_a_second
  label_origin: extractor_assigned
  claim: >
    A continuous shot is not continuous. Each frame is a displacement from the one before, and film
    is being cut twenty-four times a second. What makes a shot read as motion rather than as
    twenty-four separate contexts is that the frame-to-frame displacement is small — twenty
    milliseconds — not that it is absent.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Below a threshold of displacement the viewer integrates successive images as motion within one
      context. Above it, they re-evaluate the image as a different context.
  scope:
    domain_discussed_by_source: [film_editing, human_visual_perception]
    conditions: "projected motion picture film at twenty-four frames per second"
  caveats:
    - text: "the twenty-millisecond figure is the interval between frames at 24fps, offered as the magnitude of the displacement rather than as a measured perceptual threshold"
      origin: extractor_observed
    - text: "this reframes the cut as a difference of degree rather than of kind, which is the move that makes the displacement model possible; the source does not flag it as a move"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples: {positive: []}
