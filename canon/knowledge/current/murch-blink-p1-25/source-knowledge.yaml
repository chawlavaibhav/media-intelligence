- sk_id: sk_murch_c003_0027
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "If you find you have to sacrifice certain of those six things to make a cut, sacrifice your way up, item by item, from the bottom."
    - "If you have to give up something, don't ever give up emotion before story. Don't give up story before rhythm, don't give up rhythm before eye-trace, don't give up eye-trace before planarity, and don't give up planarity before spatial continuity."
  concept_label: sacrifice_upward_from_the_bottom_of_the_list
  label_origin: extractor_assigned
  claim: >
    When not all six criteria can be met, give them up from the bottom of the list upward, one item
    at a time. The source restates this as five ordered pairs: never give up emotion before story,
    story before rhythm, rhythm before eye-trace, eye-trace before planarity, or planarity before
    spatial continuity. Its worked case: a cut that gives the right emotion, advances the story, is
    rhythmically satisfying and respects eye-trace and planarity but fails to preserve
    three-dimensional space is, by all means, the cut to make.
