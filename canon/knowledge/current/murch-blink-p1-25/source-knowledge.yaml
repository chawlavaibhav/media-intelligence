# CANON-003 book 10 (Lane B) — Walter Murch, "In the Blink of an Eye", revised 2nd ed. (2001).
# Printed pages 1-25, complete and contiguous. Fresh SPEC-03 extraction under the CANON-001 V0
# granularity rule, unchanged. Visual completeness: verified_page_level (the section has no figures).
#
# SECTION RATIONALE: printed pp.1-25 covers seven consecutive named sections — Cuts and Shadow Cuts,
# Why Do Cuts Work?, "Cut Out the Bad Bits", Most with the Least, The Rule of Six, Misdirection, and
# Seeing Around the Edge of the Frame. It is contiguous, it is the book's theoretical opening, and it
# contains the Rule of Six in full, which is this source's reason for selection. Nothing was
# cherry-picked from elsewhere in the book.
#
# ON THIS SOURCE'S SHAPE — this is not a textbook. It is "a revised transcription of a lecture on
# film editing given by Walter Murch ... at Spectrum Films, Sydney, Australia, in October 1988",
# revised in 1995 and 2001. The consequences are visible throughout and are recorded rather than
# smoothed over:
#   - it argues in the first person from one career, mostly one film (Apocalypse Now);
#   - it reasons by extended analogy — DNA and chimpanzees, a beehive moved two yards, the bumble-bee,
#     nuclear binding forces, Houdini — and the analogies carry argumentative weight rather than
#     decorating it;
#   - it addresses a live audience, hedges aloud ("slightly tongue-in-cheek, but not completely"),
#     and defers its own central question by fifty pages;
#   - it contains exactly two numbers derived from counting anything the author did, and one set of
#     six percentages the author explicitly qualifies as not-quite-serious.
#
# ON THE RULE OF SIX AND THE SCHEMA — the ranked list is represented as a SPEC-03 SourceConceptSystem
# of type `priority_order`, which is an existing structure and fits the ordering. It does NOT carry
# the interval information: Murch's weights (51/23/10/7/5/4) say emotion is worth more than the other
# five combined, and `order: 1..6` cannot express that. The weights are preserved verbatim in each
# criterion's source_terms and claim, and the insufficiency is recorded as evidence in the lane issue
# file (LB-10). No new structure was invented.

source_id: murch_blink_p1_25_editing_decisions

