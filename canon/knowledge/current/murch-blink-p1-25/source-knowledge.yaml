- sk_id: sk_murch_c003_0034
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "I have been looking at the image as the miniature it is in the editing room, rather than seeing it as the mural that it will become when projected in a theater"
    - "cut out little paper dolls-a man and a woman-and put one on each side of the editing screen"
  concept_label: correct_for_the_editing_room_being_a_miniature_of_the_theatre
  label_origin: extractor_assigned
  claim: >
    Losing the overview in detail usually comes from looking at the image as the miniature it is in
    the editing room rather than as the mural it will become in a theatre. The source's correction is
    to imagine yourself very small and the screen very large, watching the finished film in a
    thousand-seat theatre full of people, with the film beyond any further change: if you still like
    it, it is probably all right; if not, you will now have a better idea how to fix it. Its physical
    aid is a pair of paper dolls a few inches high placed either side of the editing screen, sized so
    the screen seems thirty feet wide.
