- sk_id: sk_murch_c003_0015
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "You can never judge the quality of a sound mix simply by counting the number of tracks it took to produce it."
    - "The underlying principle: Always try to do the most with the least-with the emphasis on try."
  concept_label: do_the_most_with_the_least
  label_origin: extractor_assigned
  claim: >
    Quality cannot be judged by counting components. Terrible mixes have been made from a hundred
    tracks and wonderful ones from three; what decides it is the initial choices, the quality of the
    sounds, and how capable the blend was of exciting emotions hidden in the hearts of the audience.
    The underlying principle is to produce the greatest effect in the viewer's mind by the least
    number of things on screen. The source applies it to all the crafts of filmmaking — acting, art
    direction, photography, music, costume — and to editing.
