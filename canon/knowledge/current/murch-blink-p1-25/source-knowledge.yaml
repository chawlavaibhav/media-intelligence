      origin: source_stated
    - text: "the evolutionary framing is rhetorical rather than evidenced; no perceptual research is cited anywhere in the section"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples: {positive: []}
  intra_source_relations:
