- sk_id: sk_murch_c003_0038
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "it is necessary to create a barrier, a cellular wall between shooting and editing"
    - "the very best thing that can happen to the director (and the film) is that he say goodbye to everyone and disappear for two weeks"
    - "if he had gone straight from shooting to editing, the confusion would be worse and he would have gotten the two different thought processes of shooting and editing irrevocably mixed up"
  concept_label: a_deliberate_barrier_between_shooting_and_editing
  label_origin: extractor_assigned
  claim: >
    Because the director is the person most burdened with beyond-the-frame information, the best
    thing for the director and the film is a deliberate break of about two weeks between the end of
    shooting and the first cut, spent thinking about things with nothing to do with the film. The
    source calls this a barrier, a cellular wall between shooting and editing, and states that going
    straight from one to the other mixes the two thought processes irrevocably. The editor's job
    includes helping the director build that barrier, so the director can sit down and say: I am
    going to pretend I had nothing to do with this film — what needs to be done?
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Shooting and editing are two different thought processes. Without an interval they run
      together, and the surplus information from the shoot is never discharged.
  scope:
    domain_discussed_by_source: [film_editing, film_production]
    conditions: "between the end of shooting and the first cut"
  caveats:
    - text: "the source concedes the barrier is only partial: a director \"will never be fully able to forget\" the images from beyond the edge of the frame, so the remedy reduces the bias rather than removing it"
      origin: source_stated
    - text: "the supporting case is Fred Zinnemann climbing in the Alps to put himself somewhere he had to be present rather than day-dreaming about the film's problems. One named practitioner, one practice, offered as illustration."
      origin: extractor_observed
    - text: "two weeks is stated without justification, and the source's alternative suggestions — the mountains, the sea, or Mars — signal that the specific destination is not the point"
      origin: extractor_observed
  source_stated_problems:
    - "the two different thought processes of shooting and editing irrevocably mixed up"
  source_stated_remedies:
    - "disappear for two weeks and think about things that have nothing to do with the film"
    - "help the director erect this barrier for himself"
  examples:
    positive:
      - {description: "Fred Zinnemann climbing in the Alps after the end of shooting, to be somewhere potentially life-threatening where he had to be present", figure_ref: null}
