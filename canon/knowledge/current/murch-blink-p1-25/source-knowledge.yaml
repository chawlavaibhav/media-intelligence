- sk_id: sk_murch_c003_0007
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "What we do seem to have difficulty accepting are the kind of displacements that are neither subtle nor total"
    - "The displacement of the image is neither motion nor change of context, and the collision of these two ideas produces a mental jarring-a jump-that is comparatively disturbing."
  concept_label: intermediate_displacement_is_the_disturbing_case
  label_origin: extractor_assigned
  claim: >
    Displacement between successive images has three regimes, and only the middle one fails. A small
    displacement reads as motion within a context. A total displacement forces the viewer to
    re-evaluate the image as a different context, which they do without difficulty most of the time.
    A displacement that is neither subtle nor total is read as neither motion nor a change of
    context, and the collision of the two readings produces a mental jarring — a jump — that is
    comparatively disturbing. The source's example is cutting from a full-figure master to a slightly
    tighter shot framing the actors from the ankles up.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The new image is different enough to signal that something has changed, but not different
      enough to make the viewer re-evaluate its context. Two incompatible readings are triggered at
      once and neither resolves.
  scope:
    domain_discussed_by_source: [film_editing, human_visual_perception]
    conditions: "any transition between successive images"
  caveats:
    - text: "the source's supporting analogy is a beehive: moved two inches the bees are undisturbed, moved two miles they re-orient successfully, moved two yards they are fatally confused because the environment does not seem different enough to prompt re-orientation. The analogy is asserted, not sourced."
      origin: source_stated
    - text: "no boundary is given for either threshold. The model says the middle fails without saying where the middle starts, so it explains a failure after the fact rather than predicting one."
      origin: extractor_observed
    - text: "this is the section's most transferable claim and its most striking property is that it is NOT a rule about film grammar — it is a claim about a perceptual response to magnitude of change, and would apply to any medium presenting successive images"
      origin: extractor_observed
  source_stated_problems:
