- sk_id: sk_murch_c003_0035
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "you can't help, in your mind's eye, seeing around the edge of the frame-you can imagine everything that was there, physically and emotionally, just beyond what was actually photographed"
    - "The film editor is one of the few people working on the production of a film who does not know the exact conditions under which it was shot (or has the ability not to know) and who can at the same time have a tremendous influence on the film."
  concept_label: presence_at_the_shoot_makes_you_see_past_the_frame
  label_origin: extractor_assigned
  claim: >
    Anyone who was on the set — actors, producer, director, cameraman, art director — cannot help
    seeing, in the mind's eye, around the edge of the frame: imagining everything that was there
    physically and emotionally, just beyond what was actually photographed. The editor is one of the
    few people with substantial influence on a film who does not know, or has the ability not to
    know, the exact conditions of shooting. The source treats this ignorance as the editor's
    qualification, not a deficiency.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Having been through the practicalities of getting a shot, you carry that experience into
      viewing it, and what you remember of the surrounding circumstance colours what you see on the
      screen.
  scope:
