- sk_id: sk_murch_c003_0008
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "Discontinuity is King: It is the central fact during the production phase of filmmaking, and almost all decisions are directly related to it"
    - "films could be shot discontinuously, which was the cinematic equivalent of the discovery of flight"
  concept_label: discontinuous_shooting_freed_film_from_time_and_space
  label_origin: extractor_assigned
  claim: >
    The discovery that certain kinds of cutting worked led immediately to the discovery that films
    could be shot discontinuously, which the source calls the cinematic equivalent of the discovery
    of flight: films were no longer earthbound in time and space. Discontinuity is the central fact
    of the production phase, and almost all production decisions relate to overcoming its
    difficulties or exploiting its strengths.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      If every element had to be assembled simultaneously, as in the theatre, the range of possible
      subjects would be comparatively narrow.
  scope:
    domain_discussed_by_source: [filmmaking, film_production, film_editing]
    conditions: "the whole practice of filmmaking since the early twentieth century"
  caveats:
    - text: "the source names its own counter-examples: Hitchcock's Rope, ten ten-minute shots invisibly joined, and Kubrick building all sets simultaneously at Elstree for The Shining. It calls the latter a special exception to the general rule."
      origin: source_stated
    - text: "a historical claim about causation — that the discovery of cutting caused discontinuous shooting — offered without evidence"
