# ─────────────────────────────────────────────────────────────
# THE RULE OF SIX (pp.17-20)
#
# The six criteria are recorded as six separate objects. Under the V0 granularity rule each can be
# retrieved, supported, contradicted or qualified independently — one can hold that eye-trace matters
# while denying that planarity does — and the source gives several of them their own gloss, their own
# history and, in one case, its own footnote. Splitting them is also what allows the priority_order
# system to carry real members with a real order.
#
# Each object carries its rank AND its stated percentage. The percentages are the source's own and
# are load-bearing: they say emotion is worth more than the other five combined, which a rank alone
# does not say. SPEC-03 has no field for a member weight, so the weights live in source_terms and
# claim text. See LB-10 in the lane issue file.
# ─────────────────────────────────────────────────────────────

- sk_id: sk_murch_c003_0019
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "An ideal cut (for me) is the one that satisfies all the following six criteria at once"
    - "What I'm suggesting is a list of priorities."
  concept_label: an_ideal_cut_satisfies_six_ranked_criteria_at_once
  label_origin: extractor_assigned
  claim: >
    An ideal cut satisfies six criteria simultaneously: it is true to the emotion of the moment, it
    advances the story, it occurs at a rhythmically interesting and right moment, it acknowledges
    eye-trace, it respects planarity, and it respects the three-dimensional continuity of the actual
    space. The six are not equal — the source presents them as a ranked list of priorities governing
    what to give up first when they cannot all be satisfied.
