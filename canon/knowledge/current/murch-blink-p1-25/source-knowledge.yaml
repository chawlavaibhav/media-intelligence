- sk_id: sk_murch_c003_0013
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "the information in the DNA can be seen as uncut film and the mysterious sequencing code as the editor"
    - "both of you would make different films out of the same material"
