- sk_id: sk_murch_c003_0001
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "editing--even on a \"normal\" film--is not so much a putting together as it is a discovery of a path"
    - "the overwhelming majority of an editor's time is not spent actually splicing film"
  concept_label: editing_is_discovering_a_path_not_assembling
  label_origin: extractor_assigned
  claim: >
    Editing is not primarily the act of joining pieces. It is the discovery of a path through the
    material, and almost none of an editor's working time is spent making splices. The rest goes to
    screenings, discussions, rewinding, re-screenings, meetings, scheduling, filing trims,
    note-taking, bookkeeping and deliberative thought — activities that clear and illuminate the path
    ahead.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      More footage means more possible pathways, the possibilities compound on each other, and each
      additional possibility demands evaluation time. The splice itself takes seconds; choosing it
      is the work.
  scope:
    domain_discussed_by_source: [film_editing]
    conditions: "any narrative film; the source generalises from an extreme case to a normal one"
  caveats:
    - text: "the source presents Apocalypse Now as a deliberately extreme case, chosen because \"it is frequently at the edges of things that we learn most about the middle\""
      origin: source_stated
    - text: "the source concedes the film was unusual on every axis — sensitive subject, daring structure, technical innovation, personal investment — and that few films combine such qualities, which weakens the generalisation it is used to support"
      origin: source_stated
    - text: "the supporting figure for a normal film, eight cuts per editor per day, appears only in a footnote and is given no source"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
