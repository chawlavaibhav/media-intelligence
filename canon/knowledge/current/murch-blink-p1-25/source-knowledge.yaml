      origin: source_stated
    - text: "this is the strongest justification the section offers for the ordering, and it is a different KIND of claim from the ranking itself: the ranking says what the editor should prefer, this says what the audience will notice. A preference order and a perceptual masking order are not the same thing, and the source treats them as one."
      origin: extractor_observed
