- sk_id: sk_murch_c003_0028
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "satisfying the criteria of items higher on the list tends to obscure problems with items lower on the list, but not vice-versa"
    - "getting Number 4 (eye-trace) working properly will minimize a problem with Number 5 (stage-line), whereas if Number 5 (stage-line) is correct but Number 4 (eye-trace) is not taken into consideration, the cut will be unsuccessful"
  concept_label: higher_criteria_obscure_failures_of_lower_ones_but_not_the_reverse
  label_origin: extractor_assigned
  claim: >
    The ordering has an asymmetric effect on perception, not only on preference. Satisfying a higher
    criterion tends to obscure problems with lower ones, and the reverse does not hold. The source's
    worked case is adjacent ranks: getting eye-trace right will minimise a stage-line problem, but a
    correct stage-line with eye-trace ignored produces an unsuccessful cut. More broadly, if the
    emotion is right and the story is advanced in a unique, interesting way in the right rhythm, the
    audience tends to be unaware of or unconcerned about problems with eye-trace, stage-line and
    spatial continuity.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [film_editing]
    conditions: "a cut satisfying some criteria and failing others"
  caveats:
