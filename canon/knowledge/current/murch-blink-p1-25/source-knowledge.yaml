- sk_id: sk_murch_c003_0037
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "The editor, on the other hand, should try to see only what's on the screen, as the audience will. Only in this way can the images be freed from the context of their creation."
    - "you are the ombudsman for the audience"
  concept_label: the_editor_sees_only_the_screen_as_the_audiences_ombudsman
  label_origin: extractor_assigned
  claim: >
    The editor should try to see only what is on the screen, as the audience will, because only that
    frees the images from the context of their creation. Doing so, the editor will use moments that
    should be used even if they were shot under duress, and reject moments that should be rejected
    even if they cost a terrible amount of money and pain. The source states the editor's standing:
    the audience knows nothing about any of the circumstances, and the editor is their ombudsman.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The audience will only ever see what is on the screen. Judging by that standard is therefore
      judging by the only standard that will apply when the film is shown.
  scope:
    domain_discussed_by_source: [film_editing]
    conditions: "assessing footage for inclusion"
  caveats:
    - text: "the source urges preserving \"a certain kind of virginity\" — keeping up with what is going on during the shoot while having as little specific knowledge of it as possible. That is a working instruction with an obvious cost, and the source does not weigh it against what an informed editor might contribute."
      origin: source_stated
    - text: "\"ombudsman for the audience\" is the source's own term for the role and is the clearest statement in the section of who the editor is accountable to"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
