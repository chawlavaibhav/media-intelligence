- sk_id: sk_murch_c003_0004
  source_id: murch_blink_p1_25_editing_decisions
  source_terms:
    - "it represents a total and instantaneous displacement of one field of vision with another, a displacement that sometimes also entails a jump forward or backward in time as well as space"
    - "nothing in our day-to-day experience seems to prepare us for such a thing"
  concept_label: the_cut_is_a_total_instantaneous_displacement_unlike_lived_perception
  label_origin: extractor_assigned
  claim: >
    A cut is the total and instantaneous replacement of one field of vision by another, often
    carrying a jump in time as well as space. Nothing in ordinary experience prepares a viewer for
    it: from waking to sleeping, perceived visual reality is a continuous stream of linked images,
    and life on Earth has experienced the world that way for hundreds of millions of years. Edited
    film confronted human beings with something else only at the beginning of the twentieth century.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [film_editing, human_visual_perception]
    conditions: "any cut"
  caveats:
