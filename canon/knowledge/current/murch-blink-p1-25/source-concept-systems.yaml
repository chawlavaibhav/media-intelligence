- scs_id: scs_murch_c003_002
  source_id: murch_blink_p1_25_editing_decisions
  label: the_three_regimes_of_visual_displacement
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    A model of how the viewer reads a change between successive images, with three regimes set by the
    magnitude of the change: small displacement read as motion within one context, total displacement
    read as a new context requiring re-evaluation, and intermediate displacement read as neither,
    producing a jarring jump.
  whole_system_claim:
    text: >
      The cut is not a different kind of event from ordinary motion, only a different magnitude of
      the same event. Film is already being cut twenty-four times a second, and what separates motion
      from a cut from a jump is how far the image moves between frames. The failure case is in the
      middle, not at the extreme: an image different enough to signal that something changed but not
      different enough to prompt re-evaluation triggers two incompatible readings, and their
      collision is what the viewer experiences as a jump.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {chapter: "Why Do Cuts Work?", page_start: 6, page_end: 7}
  members:
    - {sk_ref: sk_murch_c003_0006, role_in_system: continuum_premise, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0007, role_in_system: three_regime_claim, order: 2, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: causal
      origin: extractor_inferred
    dependencies:
      - {from: sk_murch_c003_0007, to: sk_murch_c003_0006, nature: "the three-regime reading only follows once a continuous shot is understood as small displacements", origin: source_stated}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The three regimes and the mechanism are the source's own words. Calling it a causal model is
      ours — the source presents it as an explanation in the flow of a lecture and never labels it.
      The model is not predictive as stated: it names two thresholds and locates neither, so it
      accounts for a failure after the fact rather than forecasting one. Its supporting analogy, a
      beehive moved two inches, two yards or two miles, is asserted without a source.
  provenance:
    chapter: "Why Do Cuts Work?"
    section: null
    page_start: 6
    page_end: 7
    source_support: text

