- scs_id: scs_murch_c003_004
  source_id: murch_blink_p1_25_editing_decisions
  label: the_editors_stance_toward_the_material
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    A set of claims and practices about where the editor should stand in relation to the footage:
    occupy the audience's position and ask their questions, misdirect attention as a magician does,
    correct for the editing room being a miniature of the theatre, recognise that anyone present at
    the shoot sees past the frame, resist the distortion of what a shot cost, see only what is on the
    screen as the audience's ombudsman, help the director build a barrier between shooting and
    editing, and separate what you wish were there from what is.
  whole_system_claim:
    text: >
      All eight address one problem: the editor's judgement is systematically distorted by
      information the audience will never have. The distortions named are specific — the memory of
      the shoot, the cost of a shot, the small screen, the editor's own wishes — and every remedy has
      the same shape, which is to reconstruct the audience's position artificially, whether by
      imagining a thousand-seat theatre, refusing knowledge of the shoot, or sending the director to
      the Alps. The source treats the editor's ignorance of production as a qualification rather than
      a deficiency, which is the position the whole set rests on.
    origin: extractor_synthesis
    interpretation_basis: >
      The source presents these across two chapters as separate observations and never groups them.
      What is ours is the claim that they share one problem and one remedy shape. The reading is
      supported by the source's own framing of the editor as the person who "does not know the exact
      conditions under which it was shot (or has the ability not to know)" and as "the ombudsman for
      the audience" — both of which define the role by informational position rather than by skill.
    source_ref: null
  members:
    - {sk_ref: sk_murch_c003_0032, role_in_system: framing_claim, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0033, role_in_system: practice, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0034, role_in_system: corrective_technique, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0035, role_in_system: named_distortion, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0036, role_in_system: named_distortion, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0037, role_in_system: corrective_discipline, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0038, role_in_system: corrective_technique, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0039, role_in_system: corrective_discipline, order: 8, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - {from: sk_murch_c003_0037, to: sk_murch_c003_0035, nature: "the see-only-the-screen discipline exists to answer the beyond-the-frame distortion", origin: source_stated}
      - {from: sk_murch_c003_0038, to: sk_murch_c003_0035, nature: "and so does the barrier between shooting and editing", origin: source_stated}
      - {from: sk_murch_c003_0036, to: sk_murch_c003_0035, nature: "cost distortion is a specific form of the same surplus information", origin: source_stated}
    tradeoffs:
      - between: [sk_murch_c003_0037, sk_murch_c003_0032]
        nature: >
          The editor is told to know as little as possible about the shoot, and also to model the
          audience's mental state closely. Both are demands for a particular kind of knowledge and
          ignorance, and the source does not say how much of the first is compatible with the second.
        origin: extractor_inferred
    conflicts:
      - between: [sk_murch_c003_0033, sk_murch_c003_0018]
        nature: >
          The editor should misdirect the audience's attention, as Houdini did; and an editor who
          keeps directing attention pursues complete control, which is self-defeating and makes
          viewers resentful. Both are stated within six pages and the boundary between them is never
          drawn.
        origin: extractor_inferred
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, anecdotal, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The members are individually explicit. The grouping is entirely ours, and it spans two of the
      source's own chapter divisions, which is a reason for caution: the source may not regard
      misdirection and the barrier between shooting and editing as belonging to one subject. The
      grouping is offered as a hypothesis about the source, which is what a fully extractor-inferred
      system is.
  provenance:
    chapter: "Misdirection; Seeing Around the Edge of the Frame"
    section: null
    page_start: 21
    page_end: 25
    source_support: text
