- scs_id: scs_murch_c003_003
  source_id: murch_blink_p1_25_editing_decisions
  label: three_independent_justifications_for_cutting
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    Three separate arguments for why films are cut: a practical one (assembling everything
    simultaneously is logistically very difficult, and long takes compound the risk of failure), a
    selective one (discontinuity lets the best angle be chosen for each emotion and story point), and
    an intrinsic one (cutting is a positive influence in and for itself, by the force of its
    paradoxical suddenness).
  whole_system_claim:
    text: >
      The three arguments are cumulative and deliberately ordered from weakest to strongest, and the
      source signals the escalation — "beyond even these considerations" — before stating the third.
      The point of the sequence is that the intrinsic argument survives the removal of the other two:
      "We would want to cut even if discontinuity were not of such great practical value." That
      sentence is the load-bearing one, and it converts cutting from a workaround into a medium.
    origin: extractor_synthesis
    interpretation_basis: >
      The three arguments are each stated explicitly and separately, at printed pages 8 and 9. What
      is ours is reading them as one escalating structure rather than as three remarks. The reading
      rests on the source's own transition — "And yet, beyond even these considerations" — and on the
      counterfactual it then states, which only does work if the earlier arguments are being set
      aside.
    source_ref: null
  members:
    - {sk_ref: sk_murch_c003_0008, role_in_system: practical_argument, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0009, role_in_system: selective_argument, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0010, role_in_system: intrinsic_argument, order: 3, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies: []
    tradeoffs: []
    conflicts:
      - between: [sk_murch_c003_0010, sk_murch_c003_0017]
        nature: >
          Cutting is asserted to be intrinsically valuable, and eight pages later the source argues
          that deciding NOT to cut is frequently the harder and better work. Both positions are held
          and neither is withdrawn.
        origin: extractor_inferred
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      Each member is well supported individually. The escalation reading is ours, and the third
      argument — the one the escalation exists to reach — is the only one of the three the source
      offers no mechanism for.
  provenance:
    chapter: "Why Do Cuts Work?"
    section: null
    page_start: 7
    page_end: 9
    source_support: text

