# CANON-003 book 10 (Lane B) — Murch, "In the Blink of an Eye" pp.1-25. SourceConceptSystems.
# Four systems. Origin marked at every structural level.
#
# scs_murch_c003_001 is the reason this book is in the batch. It is represented with SPEC-03's
# EXISTING `priority_order` system type. What that type can carry, it carries faithfully. What it
# cannot carry is recorded in `system_level_uncertainty` and in the lane issue file as LB-10, rather
# than fixed by inventing a field.

source_id: murch_blink_p1_25_editing_decisions

source_concept_systems:

# ═════════════════════════════════════════════════════════════
- scs_id: scs_murch_c003_001
  source_id: murch_blink_p1_25_editing_decisions
  label: the_rule_of_six
  label_origin: source_verbatim
  system_type: priority_order
  system_type_origin: source_stated
  description: >
    Six criteria for an ideal cut, numbered by the source and ranked: emotion, story, rhythm,
    eye-trace, planarity, three-dimensional continuity. The source attaches a percentage to each
    (51, 23, 10, 7, 5, 4), states a procedure for when they conflict — sacrifice upward from the
    bottom — and gives two claims about how the ranks relate to each other: that higher criteria
    obscure failures of lower ones but not the reverse, and that the top three are bound far more
    tightly to each other than the lower three are.
  whole_system_claim:
    text: >
      The six are a single ordered instrument, not six separate pieces of advice. The order is what
      makes it usable: it tells an editor what to give up first when a cut cannot satisfy everything,
      and the source states it in that form — "What I'm suggesting is a list of priorities." The
      ordering is also claimed to be perceptual and not merely preferential: satisfying a higher item
      tends to obscure problems with lower items, and not the other way round. And the source ranks
      three-dimensional spatial continuity LAST, deliberately reversing what it says film schools
      teach first and what early sound film treated as the rule.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {chapter: "The Rule of Six", page_start: 17, page_end: 20}
  members:
    - {sk_ref: sk_murch_c003_0019, role_in_system: framing_claim, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0020, role_in_system: ranked_criterion, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0021, role_in_system: ranked_criterion, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0022, role_in_system: ranked_criterion, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0023, role_in_system: ranked_criterion, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0024, role_in_system: ranked_criterion, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0025, role_in_system: ranked_criterion, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0027, role_in_system: sacrifice_procedure, order: 8, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0028, role_in_system: asymmetry_claim, order: 9, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0029, role_in_system: interval_claim, order: 10, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0030, role_in_system: coupling_claim, order: 11, membership_origin: source_stated}
    - {sk_ref: sk_murch_c003_0031, role_in_system: applicability_bound, order: 12, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: source_numbered
      origin: source_stated
    dependencies:
      - {from: sk_murch_c003_0027, to: sk_murch_c003_0019, nature: "the sacrifice procedure operates on the ranking and is meaningless without it", origin: source_stated}
      - {from: sk_murch_c003_0028, to: sk_murch_c003_0019, nature: "the masking asymmetry is offered as the justification for the order", origin: source_stated}
      - {from: sk_murch_c003_0027, to: sk_murch_c003_0031, nature: "the sacrifice procedure applies only in the minority of cases where all six cannot be met", origin: source_stated}
    tradeoffs:
      - between: [sk_murch_c003_0020, sk_murch_c003_0025]
        nature: "emotion against three-dimensional spatial continuity — the source's own worked case, resolved in favour of emotion by all means"
        origin: source_stated
        source_ref: {chapter: "The Rule of Six", page_start: 19}
      - between: [sk_murch_c003_0023, sk_murch_c003_0024]
        nature: "eye-trace against planarity — the adjacent pair the source uses to demonstrate the asymmetry"
        origin: source_stated
        source_ref: {chapter: "The Rule of Six", page_start: 19, page_end: 20}
    conflicts:
      - between: [sk_murch_c003_0030, sk_murch_c003_0027]
        nature: >
          The sacrifice procedure asks the editor to give up items one at a time from the bottom, but
          the coupling claim says the top three are bound about as tightly as nucleons. If emotion,
          story and rhythm move together, they cannot be traded singly, so the procedure is least
          applicable exactly where the ranking matters most. The source states both and does not
          address the tension.
        origin: extractor_inferred
      - between: [sk_murch_c003_0019, sk_murch_c003_0011]
        nature: >
          A general ranked list of what makes a good cut sits against the same source's earlier claim
          that what counts as a bad bit is unique to the particular film being made.
        origin: extractor_inferred
  source_warns_against_isolated_use: true
  source_warning_ref: >
    "The values I put after each item are slightly tongue-in-cheek, but not completely." The source
    qualifies its own weights, and also scopes the whole list to itself — "An ideal cut (for me)".
    Both markings are routinely dropped when this list is quoted elsewhere, so they are recorded here
    as an explicit warning against retrieving the ranking without them.
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, repeated_within_source, mechanism_absent]
    source_uncertainty: source_hedges
    extraction_uncertainty: none
    system_level_uncertainty: >
      Membership, ordering and the sacrifice procedure are entirely the source's own — numbered,
      weighted, and restated as five ordered pairs. Nothing about the order is our inference.

      WHAT THIS REPRESENTATION LOSES, stated because it matters for how the object may be used.
      `priority_order` with `members[].order` records that emotion outranks story which outranks
      rhythm. It does not record BY HOW MUCH. The source's percentages are not decoration: 51 against
      23, 10, 7, 5 and 4 says emotion outweighs the other five combined, and that the gap between
      rank 2 and rank 3 is wider than the entire spread from rank 3 to rank 6. Read as a bare
      ordinal list, the Rule of Six looks like six roughly comparable considerations in a preferred
      sequence, which is close to the opposite of what the source argues. SPEC-03 has no field for a
      member weight or an interval, so the numbers are preserved verbatim inside
      sk_murch_c003_0020-0025 and sk_murch_c003_0029, where they are readable by a human and not by a
      machine. No field was added. Recorded as LB-10.

      A second thing the type cannot hold is that the ordering is claimed to be perceptual as well as
      preferential — sk_murch_c003_0028 asserts higher items mask failures of lower ones. That is a
      claim about what an audience notices, and it is carried as an ordinary member rather than as a
      property of the ordering, because `ordering` has only `scheme` and `origin`.
  provenance:
    chapter: "The Rule of Six"
    section: null
    page_start: 17
    page_end: 20
    source_support: text

