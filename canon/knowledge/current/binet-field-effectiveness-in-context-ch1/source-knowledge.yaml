- sk_id: sk_eic_0004
  source_id: binet_field_effectiveness_in_context_ch1_consideration
  source_terms:
  - the mix of business effects also varies with consideration
  concept_label: the_mix_of_business_effects_shifts_with_consideration
  label_origin: extractor_assigned
  claim: In high-consideration categories marketing works mainly by increasing sales volume rather than
    price, and by recruiting new customers rather than increasing loyalty. In low-consideration categories
    effects are less dramatic and the skew towards volume and penetration is less marked, with loyalty
    and price playing a bigger though still secondary role.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: Activation effects dominate where consideration is high; brand effects matter relatively more
      where it is low.
  scope:
    domain_discussed_by_source:
    - advertising_effectiveness
    conditions: For-profit IPA cases 1998-2016
  caveats:
  - text: A statement about relative composition, not absolute magnitude. Loyalty and price remain secondary
      in both conditions.
    origin: extractor_observed
  - text: 'Figure 02 inspected in the correction pass, adding the brand-versus-activation dimension
      of the same mix shift: campaigns with very large activation effects rise from 26 to 38 per cent
      across low to high consideration while average very large brand effects rise from 1.5 to 1.8.
      The source''s phrasing tracks the asymmetry - activation is ''particularly big'' for considered
      purchases and the brand difference is ''less marked''. The two panels use different metrics, so
      they are not a like-for-like comparison.'
    origin: extractor_observed
