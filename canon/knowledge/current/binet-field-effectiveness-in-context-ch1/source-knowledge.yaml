- sk_id: sk_eic_0005
  source_id: binet_field_effectiveness_in_context_ch1_consideration
  source_terms:
  - both kinds of mental processing help to increase overall effectiveness
  concept_label: rational_and_emotional_consideration_both_raise_effectiveness
  label_origin: extractor_assigned
  claim: 'Engagement of either kind raises overall effectiveness: marketing is most effective when people
    are highly engaged at either a rational or an emotional level.'
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source:
    - advertising_effectiveness
    conditions: For-profit IPA cases 1998-2016, measured as the number of very large business effects
  caveats:
  - text: The source states the data 'suggests' this, which is weaker than its phrasing elsewhere.
    origin: source_stated
  - text: The two kinds of consideration are not mutually exclusive; the source says most decisions
      involve a bit of both.
    origin: source_stated
  - text: 'Figure 05 inspected in the CANON-007 correction pass and it confirms the claim. Average number
      of very large business effects rises across low, medium and high consideration in both panels:
      emotional 1.4, 1.5, 1.7 and rational 1.4, 1.5, 1.9. Two things the prose does not say: the metric
      here is an AVERAGE COUNT of effects, not the percentage of campaigns used in Figure 03, and the
      rational series ends higher than the emotional one (1.9 against 1.7), so ''both kinds help'' is
      accurate while ''equally'' would not be.'
    origin: extractor_observed
