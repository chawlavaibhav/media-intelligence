- sk_id: sk_eic_0001
  source_id: binet_field_effectiveness_in_context_ch1_consideration
  source_terms:
  - the level and nature of consideration (whether emotional or rational) is central to our understanding
    of best practice and sets the scene for many other context effects
  concept_label: consideration_is_the_master_context_variable
  label_origin: extractor_assigned
  claim: The level of consideration a purchase attracts, and whether that consideration is rational
    or emotional, is the context variable that most widely modifies marketing best practice, and it
    underlies many of the other context effects the report examines.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: The nature of the purchase decision determines whether marketing can build brands or activate
      short-term sales, and therefore the optimum balance of expenditure between them.
  scope:
    domain_discussed_by_source:
    - advertising_effectiveness
    conditions: Campaigns entered for the UK IPA Effectiveness Awards, 1998-2016, for-profit cases
  caveats:
  - text: The source presents consideration as a framework it will return to throughout the report,
      so its centrality is an organising choice of the report as well as a finding.
    origin: extractor_observed
  source_stated_problems:
  - assuming general effectiveness rules apply unmodified in every context
  source_stated_remedies:
  - flex the rules according to the context the brand operates in
