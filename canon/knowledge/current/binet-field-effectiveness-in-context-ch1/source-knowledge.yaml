- sk_id: sk_eic_0013
  source_id: binet_field_effectiveness_in_context_ch1_consideration
  source_terms:
  - advertising works best when the purchase is emotional
  - rational consideration actually inhibits the effects of advertising
  - The more people think about the purchase, the less influence advertising has over them
  concept_label: advertising_efficiency_is_highest_for_emotional_purchases
  label_origin: extractor_assigned
  claim: 'Within each kind of consideration, the direction of the effect on advertising efficiency is
    opposite: as EMOTIONAL consideration rises, ESOV Efficiency rises (0.11, 0.18, 0.19 across low,
    medium and high); as RATIONAL consideration rises, it falls (1.11, 0.43, 0.36). The more people
    deliberate about a purchase, the less influence advertising has over them.'
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source:
    - advertising_effectiveness
    conditions: For-profit IPA cases 1998-2016, measured as ESOV Efficiency
