- sk_id: sk_eic_0006
  source_id: binet_field_effectiveness_in_context_ch1_consideration
  source_terms:
  - Activation works particularly well when the buying decision involves a lot of conscious, rational
    thought
  - in very rational categories it is slightly harder (although still important) to build strong brands
  concept_label: rational_consideration_favours_activation_and_hinders_brand_building
  label_origin: extractor_assigned
  claim: Where the buying decision involves conscious rational thought, activation works particularly
    well and brand building becomes slightly harder.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: People respond immediately to direct activity and promotions, perhaps because these require
      more conscious attention and work on a more rational level; when consumers think hard about the
      purchase they become slightly more resistant to brand activity.
  scope:
    domain_discussed_by_source:
    - advertising_effectiveness
    conditions: For-profit IPA cases 1998-2016
  caveats:
  - text: The source hedges the mechanism with 'perhaps' and 'it seems', and calls the brand-building
      penalty slight while insisting brand building remains important.
    origin: source_stated
  - text: A comparison of proportions between groups of campaigns, not a controlled experiment. The
      source does not claim to have isolated this variable from other differences between categories.
    origin: extractor_observed
  - text: 'Figure 06 inspected in the correction pass and it confirms the claim in both directions.
      Campaigns with very large activation effects fall from 38 per cent in rational categories to 36
      at equal and 27 in emotional ones. The asymmetry matters and supports the source''s own hedge:
      the activation swing is eleven points while the brand-effect gradient across the same axis is
      1.6, 1.7, 1.8 - which is why the source says brand building is only SLIGHTLY harder in rational
      categories. Note also that the two panels use different metrics, a percentage of campaigns against
      an average count, so they are not a like-for-like comparison.'
    origin: extractor_observed
