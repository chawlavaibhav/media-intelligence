- sk_id: sk_eic_0002
  source_id: binet_field_effectiveness_in_context_ch1_consideration
  source_terms:
  - high-consideration improves marketing performance on every single business metric
  concept_label: high_consideration_raises_every_measured_business_effect
  label_origin: extractor_assigned
  claim: Across the six business effects the report measures, the share of campaigns reporting a very
    large effect is higher in high-consideration than in low-consideration categories on every metric.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: Both brand and activation effects tend to be bigger when consumers are highly engaged, so
      marketing produces stronger business results overall.
  scope:
    domain_discussed_by_source:
    - advertising_effectiveness
    conditions: For-profit IPA cases 1998-2016, high- against low-consideration categories
  caveats:
  - text: 'Figure 03 prints all twelve values: sales 40 to 54 per cent, market share 27 to 31, customer
      acquisition 23 to 37, loyalty 13 to 14, price sensitivity 5 to 8, profit 23 to 28. The direction
      is consistent across all six, but the loyalty and price gaps are one and three points, and the
      source itself calls those effects only slightly bigger.'
    origin: extractor_observed
  - text: A comparison of proportions between groups of campaigns, not a controlled experiment. The
      source does not claim to have isolated this variable from other differences between categories.
    origin: extractor_observed
  - text: The metric is the percentage of campaigns whose own case authors graded the effect 'very large'
      on a four-point scale. It is a count of top-box self-assessments, not an independently measured
      effect size.
    origin: extractor_observed
