- sk_id: sk_eic_0012
  source_id: binet_field_effectiveness_in_context_ch1_consideration
  source_terms:
  - If you want to make people less price sensitive, you need to engage them emotionally; people are
    willing to pay more for the brands they love
  concept_label: emotional_engagement_is_the_route_to_lower_price_sensitivity
  label_origin: extractor_assigned
  claim: Lower price sensitivity is achieved by engaging people emotionally rather than by rational
    argument; in emotional categories it is easier to build brands that command a price premium.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: People are willing to pay more for brands they love, so emotional attachment rather than argument
      supports a premium.
  scope:
    domain_discussed_by_source:
    - advertising_effectiveness
    conditions: For-profit IPA cases 1998-2016
  caveats:
  - text: 'CORRECTED in the correction pass. Before Figure 08 was inspected this object carried a caveat
      saying the figure showed only price effects by consideration type and not the emotional route
      itself. That understated it. The figure is a clean crossover: campaigns reporting very large price
      effects fall across rising RATIONAL consideration - 8, 6, 5 per cent - and rise across rising
      EMOTIONAL consideration - 4, 7, 8 per cent. That is the directional evidence for the claim, so
      visually_demonstrated is now carried and the earlier caveat is withdrawn.'
    origin: extractor_observed
  - text: A source-internal cross-reference oddity, observed only by looking at both figures. The prose
      supporting this claim points the reader to 'Fig 04, page 11', which is the ESOV Efficiency and
      ROMI table and contains no price data at all. The price figure is Figure 08, on the same page
      as the claim. This extraction cites Figure 08, which is what the source actually shows, and records
      the source's own pointer here rather than silently correcting or silently repeating it.
    origin: extractor_observed
