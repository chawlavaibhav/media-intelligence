      brand effects move 0.3 on a 2.0 scale, which is why the source says the brand difference is
      "less marked". As with Figures 06 and 09, the two panels use different metrics - a percentage
      of campaigns against an average count - so they are not a like-for-like comparison.
    supports: [sk_eic_0004]

representation_findings:
  - ref: vis_eic_phantom_text_in_forewords
    status: OBSERVED
    printed_pages: [1, 2, 3]
    what_happened: >
      The text layer of the three foreword pages contains sentences that are not printed anywhere on
      those pages. Rendering PDF page 3 and reading it confirms that the visible page carries only
      Janet Hull's foreword and a photograph; the phrases "This is a self-help manual for brands, to
      guide strategy depending on the contexts that the brand operates in", "So it is not safe to
      assume that general learning can be automatically applied in all situations" and "The report
      also observes that whilst marketing has been improving its effectiveness in some contexts"
      appear in the extracted text of that page and belong to the "In a nutshell" page, printed 5.
    how_it_presents: >
      Interleaved line by line with the real foreword text, so a text-only pass produces a foreword
      in which a third party appears to say things the report says elsewhere. Both pdftotext -layout
      and default reading-order mode reproduce it.
    scope: >
      Confined to printed pages 1, 2 and 3, verified by scanning all 139 pages for the marker
      phrases. Printed page 5 is the legitimate home of that text. No page in the processed span is
      affected.
    consequence_for_this_extraction: >
      None. The forewords are third-party contributions outside the processed section and no object
      is drawn from them.
    method_note: >
      This is a shape the adopted Audit Gate loss-pattern vocabulary does not have a value for. Its
      values all describe information LOST from the page; here information is ADDED to the text
      layer that the page does not show. No pattern value was stretched to cover it and no claim in
      this extraction is affected, so no method change is proposed. If a later task processes these
      pages, the gap becomes live and should be raised then.

  - ref: vis_eic_chart_values_survive_but_lose_their_bindings
    status: OBSERVED
    what_happened: >
      Chart text is fully present in the text layer and fully unusable without the page. Values,
      axis labels, series names and category names all extract; their correspondence does not.
    why_it_matters: >
      A text-only extractor would see plausible numbers beside plausible labels and could bind them
      wrongly with no signal that anything was uncertain. On printed page 15 the fragment "1.5"
      appears mid-sentence in the extracted prose, having come from a chart axis on the same page.
    detectability: silent
    consequence_for_this_extraction: >
      Every numeric value recorded in any SourceKnowledge object in this extraction was read from a
      render, not from the text layer.

  - ref: vis_eic_differing_axis_scales_invert_a_reading
    status: OBSERVED
    printed_page: 16
    what_happened: >
      Figure 09's two panels carry different Y-axis scales, 0.00 to 0.20 and 0.0 to 1.2, a factor of
      six. The bars look comparable in height and the numbers are not: every rational value exceeds
      every emotional value.
    why_it_matters: >
      A reader taking the visual pattern rather than the printed values draws the opposite
      conclusion from the one the values support. This is the "chart's visual pattern to a stronger
      numeric claim" hazard in its sharpest form, and it is invisible to any text-only pass because
      the axis maxima are just two more numbers in the layer.
    detectability: detected_by_independent_check
    consequence_for_this_extraction: >
      It changed one claim. sk_eic_0013 was narrowed from an absolute comparison between the two
      kinds of consideration to the within-type direction the figure actually supports. This is the
      only object in the extraction whose meaning the correction pass altered.

  - ref: vis_eic_text_integrity_otherwise_clean
    status: OBSERVED
    measurements:
      pages_in_text_layer: 139
      words_extracted: 45749
      replacement_characters: 0
      vowel_less_words_over_3_letters: 89
      vowel_less_share: 0.321%
      near_empty_pages: 1
    what_it_means: >
      A native Adobe InDesign 14.0 PDF with no OCR layer. The vowel-less words are overwhelmingly
      chart axis fragments and abbreviations such as VL, ESOV, ROMI and SOV rather than garbling.
      One near-empty page is the back cover. No missing page, no dropped section, no encoding
      damage.
    contents_page_control: >
      Every section title listed on the contents page for the processed span was found in the
      extracted text at the printed page the contents page names.

