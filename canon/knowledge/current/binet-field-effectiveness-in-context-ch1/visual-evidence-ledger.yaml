    values:
      ACTIVATION EFFECTS: {RATIONAL: 38, EQUAL: 36, EMOTIONAL: 27}
      BRAND EFFECTS: {RATIONAL: 1.6, EQUAL: 1.7, EMOTIONAL: 1.8}
    base_note: 'Source: IPA Databank, 1998-2016 for-profit cases'
    adjacent_interpretation: >
      "Activation works particularly well when the buying decision involves a lot of conscious,
      rational thought"; "in very rational categories it is slightly harder (although still
      important) to build strong brands"; "For emotional purchases, the reverse is true."
    verdict: confirms_existing_claims
    what_the_figure_adds: >
      An asymmetry that supports the source's own hedging. The activation series swings eleven
