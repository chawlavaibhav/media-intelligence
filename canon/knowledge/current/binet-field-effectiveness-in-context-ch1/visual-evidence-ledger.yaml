  - figure: FIGURE 08
    title: EFFECT ON PRICE SENSITIVITY
    printed_page: 15
    inspected_in: CANON-007 correction pass
    kind: two_panel_bar_chart
    panels: [RATIONAL CONSIDERATION, EMOTIONAL CONSIDERATION]
    y_axis: {label: '% CAMPAIGNS WITH VL PRICE EFFECTS', scale: 0 to 9 per cent}
    x_axis: {categories: [LOW, MEDIUM, HIGH]}
    values_printed_on_chart: true
    values:
      RATIONAL CONSIDERATION: {LOW: 8, MEDIUM: 6, HIGH: 5}
      EMOTIONAL CONSIDERATION: {LOW: 4, MEDIUM: 7, HIGH: 8}
    base_note: 'Source: IPA Databank, 1998-2016 for-profit cases'
    adjacent_interpretation: >
      "If you want to make people less price sensitive, you need to engage them emotionally"; "In
      rational categories, where brand building is harder, it is more difficult to justify higher
      prices. In emotional categories, it is easier to build strong brands that can command a price
      premium."
    verdict: strengthens_existing_claim
    what_the_figure_adds: >
      A clean crossover, and more than the extraction previously credited. Price effects fall as
      rational consideration rises and rise as emotional consideration rises, on a shared axis and
      with both series monotonic. sk_eic_0012 previously carried a caveat saying the figure showed
      only price effects by consideration type and not the emotional route itself; that understated
      it, the caveat is withdrawn, and the object now carries visually_demonstrated.
    source_internal_cross_reference_error: >
      OBSERVED, and detectable only by looking at both figures. The prose supporting the price-
      premium claim points the reader to "Fig 04, page 11", which is the ESOV Efficiency and ROMI
      table and contains no price data. The price figure is Figure 08, on the same page as the
      claim. The extraction cites Figure 08, which is what the source actually shows, and records
      the source's own pointer as an extractor-observed caveat rather than silently correcting or
      silently repeating it.
    supports: [sk_eic_0012]

  - figure: FIGURE 09
    title: DECISION PROCESS AFFECTS ESOV EFFICIENCY
    printed_page: 16
    inspected_in: CANON-007 correction pass
    kind: two_panel_bar_chart
    panels: [EMOTIONAL CONSIDERATION, RATIONAL CONSIDERATION]
    y_axis_left: {label: ESOV EFFICIENCY, scale: 0.00 to 0.20}
    y_axis_right: {label: ESOV EFFICIENCY, scale: 0.0 to 1.2}
    axes_share_a_scale: false
    x_axis: {categories: [LOW, MEDIUM, HIGH]}
    values_printed_on_chart: true
    values:
      EMOTIONAL CONSIDERATION: {LOW: 0.11, MEDIUM: 0.18, HIGH: 0.19}
      RATIONAL CONSIDERATION: {LOW: 1.11, MEDIUM: 0.43, HIGH: 0.36}
    base_note: 'Source: IPA Databank, 1998-2016 for-profit cases'
    adjacent_interpretation: >
      "When consumers are very emotionally involved, advertising works harder, increasing ESOV
      Efficiency. But rational consideration actually inhibits the effects of advertising." A
      footnote adds that this does not mean all advertising is ineffective in rational categories.
    verdict: MATERIALLY_QUALIFIES_EXISTING_CLAIM
    what_the_figure_adds: >
      The single most consequential result of the correction pass, and the reason the pass was
      warranted. The two panels carry DIFFERENT Y-AXIS SCALES - 0.00 to 0.20 for emotional and 0.0
      to 1.2 for rational, a factor of six. Side by side the bars look comparable in height while
      the numbers are not: every value in the rational panel (1.11, 0.43, 0.36) exceeds every value
      in the emotional panel (0.11, 0.18, 0.19).

      sk_eic_0013 previously read that ESOV Efficiency is "higher where consumers are emotionally
      involved and lower where they consider the purchase rationally". At the absolute level the
      printed magnitudes contradict that. What the figure supports is the WITHIN-TYPE direction -
      rising with emotional consideration, falling with rational consideration - and the claim has
      been narrowed to exactly that. extraction_uncertainty: figure_not_inspected is removed because
      it is now resolved.

      Recorded as an observation about the figure's presentation, not as a criticism of the authors'
      text, which states only the within-type direction and does not compare the panels.
    supports: [sk_eic_0013]

