  - figure: FIGURE 01
    title: BRAND BUILDING AND SALES ACTIVATION WORK OVER DIFFERENT TIMESCALES
    printed_page: 6
    inspected_in: CANON-007 correction pass
    kind: schematic_line_diagram
    y_axis: {label: SALES UPLIFT OVER BASE, scale: none printed}
    x_axis: {label: 'TIME / SHORT-TERM EFFECTS DOMINATE / 6 MONTHS'}
    series: ['SALES ACTIVATION / SHORT-TERM SALES UPLIFT', 'SALES ACTIVATION / LONG-TERM SALES GROWTH']
    values_printed_on_chart: false
    base_note: 'Source: Binet & Field 2013'
    verdict: no_object_relies_on_it_and_it_contradicts_nothing
    what_the_figure_adds: >
      Nothing numeric, deliberately: the Y axis carries no scale and no value is printed anywhere on
      it. It establishes a qualitative shape only - short-term activation spikes that decay against a
      long-term ratchet - and nothing may be read off it as a magnitude. It is the schematic behind
      the two-mechanism model recorded as scs_eic_002; no SourceKnowledge object cites it.
    provenance_finding: >
      OBSERVED, and the reason inspecting it was worth the render. This is the ONLY figure in the
      processed span whose source note is not the IPA Databank. It is credited "Source: Binet & Field
      2013", which is the authors' own earlier report The Long and the Short of It. That is direct
      visual confirmation of the series dependency recorded in the audit's lineage section: the
      report's founding diagram is carried forward from a prior publication rather than produced
      from the data analysed here. Footnote 01 on the same page names all three predecessors -
      Marketing in the Era of Accountability (2007), The Long and The Short of It (2013) and Media
      in Focus (2017).
    apparent_legend_inconsistency: >
      OBSERVED, recorded as a reading rather than as an established defect. Both legend entries begin
      "SALES ACTIVATION /" while the figure title contrasts brand building with sales activation, and
      the long-term ratchet series is brand building in the authors' canonical version of this
      diagram. The second entry appears to should read "BRAND BUILDING / LONG-TERM SALES GROWTH".
      Nothing in this extraction depends on the legend, so no claim is affected; it is recorded
      because it is the second source-internal inconsistency the visual pass found and neither is
      detectable from the text layer.
    supports: []

