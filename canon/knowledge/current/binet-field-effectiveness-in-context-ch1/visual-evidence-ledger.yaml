  - figure: FIGURE 06
    title: DIFFERENT DECISION PROCESS, DIFFERENT MARKETING EFFECTS
    printed_page: 13
    inspected_in: CANON-007 correction pass
    kind: two_panel_bar_chart
    panels: [ACTIVATION EFFECTS, BRAND EFFECTS]
