source_id: binet_field_effectiveness_in_context_ch1_consideration
pass: independent_visual_evidence
visual_completeness: verified_page_level

method:
  why_a_visual_pass_was_mandatory: >
    The chart text of this report IS in the text layer - axis labels, series names, category names
    and every printed data value extract cleanly. What linearised text destroys is the BINDING
    between them. A text-only pass receives, for Figure 03, the sequence 60% 54% 50% 40% 40% 37%
    31% 27% 23% 23% 28% and the words SALES, MARKET SHARE, CUSTOMER ACQUISITION, LOYALTY, PRICE
    SENSITIVITY, PROFIT, with nothing to say which number belongs to which category or to which of
    the two series. Every quantitative claim in this extraction therefore required the page to be
    looked at.
  tooling: pdftotext -layout and pdftoppm at 110-130 dpi, poppler
  renders_committed: false
  renders_ephemeral: true
  pages_rendered: [3, 8, 12, 13, 14, 15, 16, 17, 18, 19, 20, 22, 23, 24]
  pages_read_as_images: [3, 8, 12, 13, 14, 15, 16, 17, 18, 19, 20, 22, 23, 24]
  correction_pass_note: >
    PDF pages 14, 15, 17, 18, 19 and 23 - printed 12, 13, 15, 16, 17 and 21 - were rendered and read
    in the CANON-007 correction pass, from the SAME already-verified copy. Its identity was
    re-checked before re-opening: 24,726,437 bytes and SHA-256
    e589a4222f5ce06db52384c5cc002dbd4e96f4156530be60d19bdf73e70ae91e, both unchanged. Nothing was
    reacquired.
  page_offset: PDF page = printed page + 2, established from the running page numbers and stable
    across the whole file

figures_inspected:
  - figure: FIGURE 03
    title: HIGH CONSIDERATION BOOSTS ALL BUSINESS EFFECTS
    printed_page: 11
    kind: grouped_bar_chart
    y_axis: {label: '% REPORTING VERY LARGE EFFECTS', scale: 0 to 60 per cent, units: percentage of campaigns}
    x_axis: {label: BUSINESS EFFECTS, categories: [SALES, MARKET SHARE, CUSTOMER ACQUISITION, LOYALTY, PRICE SENSITIVITY, PROFIT]}
    series: [LOW CONSIDERATION, HIGH CONSIDERATION]
    values_printed_on_chart: true
    values:
      SALES: {low: 40, high: 54}
      MARKET SHARE: {low: 27, high: 31}
      CUSTOMER ACQUISITION: {low: 23, high: 37}
      LOYALTY: {low: 13, high: 14}
      PRICE SENSITIVITY: {low: 5, high: 8}
      PROFIT: {low: 23, high: 28}
    base_note: 'Source: IPA Databank, 1998-2016 for-profit cases'
    adjacent_interpretation: >
      "marketing produces much stronger business results in high-consideration categories" and
      "high-consideration improves marketing performance on every single business metric".
    what_the_figure_does_and_does_not_establish: >
      It establishes that the high-consideration bar is at least as tall as the low-consideration
      bar on all six metrics. It does not establish causation, and the loyalty and price-sensitivity
      gaps are one and three percentage points. The source's own prose is correspondingly hedged on
      those two.
    supports: [sk_eic_0002, sk_eic_0004]

  - figure: FIGURE 04
    title: HIGH CONSIDERATION INCREASES EFFICIENCY
    printed_page: 11
    kind: two_row_table
    columns: [ESOV EFFICIENCY, ROMI]
    rows: [LOW CONSIDERATION, HIGH CONSIDERATION]
    values_printed_on_chart: true
    values:
      LOW CONSIDERATION: {esov_efficiency: 0.60, romi: 418%}
      HIGH CONSIDERATION: {esov_efficiency: 0.73, romi: 430%}
    base_note: 'Source: IPA Databank, 1998-2016 for-profit cases'
    adjacent_interpretation: >
      "Consideration increases efficiency as well as effectiveness"; ROMI described as "slightly
      higher".
    what_the_figure_does_and_does_not_establish: >
      Four printed numbers with no dispersion, no sample size and no interval. The ROMI difference
      is twelve points on a base of about 420 per cent.
    supports: [sk_eic_0003]

  - figure: FIGURE 07
    title: PENETRATION IS ALWAYS THE MAIN DRIVER
    printed_page: 14
    kind: two_panel_grouped_bar_chart
    panels: [EMOTIONAL CONSIDERATION, RATIONAL CONSIDERATION]
    y_axis: {label: '% CAMPAIGNS WITH VL EFFECTS', scale: 0 to 50 per cent}
    x_axis: {categories: [LOW, MEDIUM, HIGH]}
    series: [PENETRATION, LOYALTY]
    values_printed_on_chart: true
    values:
      EMOTIONAL CONSIDERATION: {LOW: {penetration: 27, loyalty: 15}, MEDIUM: {penetration: 32, loyalty: 12}, HIGH: {penetration: 33, loyalty: 17}}
      RATIONAL CONSIDERATION: {LOW: {penetration: 26, loyalty: 10}, MEDIUM: {penetration: 28, loyalty: 15}, HIGH: {penetration: 44, loyalty: 16}}
    base_note: 'Source: IPA Databank, 1998-2016 for-profit cases'
    adjacent_interpretation: >
      "regardless of the nature of the purchase decision, penetration is always the main driver of
      growth"; "loyalty-first approaches are doomed to fail"; and the qualification that loyalty
      effects become "marginally more significant when overall consideration is low, and when
      decisions are more emotional".
    what_the_figure_does_and_does_not_establish: >
      Penetration exceeds loyalty in all six cells, which is what "always" refers to. It does not
      support "doomed to fail", which is a recommendation. And the loyalty series is not monotonic
      in the direction the qualification implies - emotional runs 15, 12, 17 and rational 10, 15,
      16 - so the qualification is weaker than a trend.
    supports: [sk_eic_0008, sk_eic_0009, sk_eic_0010]

  - figure: FIGURE 12
    title: OPTIMUM BRAND:ACTIVATION SPLIT
    printed_page: 18
    kind: two_panel_stacked_bar_chart
    y_axis: {label: BRAND/ACTIVATION SPLIT, scale: 0 to 100 per cent}
    series: [BRAND, ACTIVATION]
    x_axis: {categories: [LOW CONSIDERATION, HIGH CONSIDERATION, PRIMARILY EMOTIONAL, PRIMARILY RATIONAL]}
    values_printed_on_chart: true
    values:
      LOW CONSIDERATION: {brand: 61, activation: 39}
      HIGH CONSIDERATION: {brand: 69, activation: 31}
      PRIMARILY EMOTIONAL: {brand: 67, activation: 33}
      PRIMARILY RATIONAL: {brand: 71, activation: 29}
    base_note: 'Source: IPA Databank, 1998-2016 for-profit cases'
    adjacent_interpretation: >
      "marketers can dial down their activation spend when consideration is high and/or the purchase
      decision is primarily rational" and, conversely, "marketers can dial down the brand spend in
      low-consideration and/or emotional categories". The source also states on the same page that
      "The efficiency picture is in fact more nuanced than the chart suggests."
    what_the_figure_does_and_does_not_establish: >
      These are fitted optima, read off the maximum of an inverted U curve described in the
      appendix, not observed best splits. The appendix also records that the fit required removing
      rational product-benefit brand campaigns, and that activation spend is under-reported in a
      direction that flatters brand. Both qualifications are recorded as sk_eic_0027 and
      sk_eic_0026 and are attached to this claim by intra-source relations.
    supports: [sk_eic_0016]

  - figure: FIGURE 13
    title: BRAND BUILDING BOOSTS SHORT-TERM EFFECTS
    printed_page: 20
    kind: bar_chart
    y_axis: {label: '% REPORTING VL ACTIVATION EFFECTS', scale: 0 to 45 per cent}
    x_axis: {label: NUMBER OF VL BRAND EFFECTS REPORTED, categories: ['0', '1', '>=2']}
    values_printed_on_chart: true
    values: {'0': 17, '1': 36, '>=2': 42}
    base_note: 'Source: IPA Databank, 1998-2016 for-profit cases'
    adjacent_interpretation: >
      The figure title asserts that brand building BOOSTS short-term effects.
    what_the_figure_does_and_does_not_establish: >
      This is the clearest association-versus-causation case in the processed span. The chart shows
      that campaigns reporting more very large brand effects also report very large activation
      effects more often. It does not establish direction, and both axes are counts of the same
      case author's top-box gradings of the same campaign, so a generously graded campaign can
      raise both. The extraction records the association and marks the causal title as the source's
      framing.
    supports: [sk_eic_0015]

  - figure: FIGURE 14
    title: EMOTIONAL ADVERTISING WORKS EVEN HARDER IN HIGH RESEARCH CATEGORIES
    printed_page: 20
    kind: bar_chart
    y_axis: {label: ESOV EFFICIENCY, scale: 0.0 to 0.8}
    series_label_on_plot: EFFICIENCY OF EMOTIONAL ADVERTISING
    x_axis: {label: EXTENT OF ONLINE RESEARCH, categories: [LOW RESEARCH CATEGORIES, HIGH RESEARCH CATEGORIES]}
    values_printed_on_chart: true
    values: {LOW RESEARCH CATEGORIES: 0.67, HIGH RESEARCH CATEGORIES: 0.73}
    base_note: 'Source: IPA Databank, 1998-2016 for-profit cases'
    adjacent_interpretation: >
      The prose calls the difference "slightly more efficient". The pull quote on the same page
      escalates to "There is no evidence to suggest that online research makes emotional brand
      building redundant: quite the reverse", and the body to "Only emotional campaigns can create
      competitive advantage in this environment."
    what_the_figure_does_and_does_not_establish: >
      Two bars differing by 0.06 with no dispersion shown. The prose's own word, "slightly", is
      proportionate to it; the pull quote and the "only emotional campaigns" assertion are not, and
      are recorded as assertion rather than as measured result.
    supports: [sk_eic_0018]

  - figure: FIGURE 16
    title: OPTIMUM BRAND ALLOCATION IS HIGHER IN HIGH ONLINE RESEARCH CATEGORIES
