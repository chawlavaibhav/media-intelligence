  label: ipa_databank_evidence_apparatus
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: 'The chain by which a number in this report is produced: awards entrants submit confidential
    campaign data, case authors grade outcomes on a four-point scale, only top-box grades are counted,
    spend splits are partly inferred and partly self-reported, and optima are read off a fitted curve
    after an exclusion.'
  whole_system_claim:
    text: Every quantitative claim in the report is a proportion of self-assessed top-box gradings drawn
      from a sample biased toward successful campaigns, with a self-declared under-reporting of activation
      spend and an analytic exclusion behind the optimum splits.
    origin: extractor_synthesis
    interpretation_basis: The source states each of these facts plainly and separately in the appendix
      and in an introduction footnote, and never assembles them into one statement about what its numbers
      are. The assembly is the extractor's, and it is recorded as a system rather than added to any
      individual claim so that no single object is made to carry an argument the source did not make.
    source_ref: null
