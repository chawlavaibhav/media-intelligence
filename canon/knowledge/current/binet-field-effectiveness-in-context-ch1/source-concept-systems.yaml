- scs_id: scs_eic_002
  source_id: binet_field_effectiveness_in_context_ch1_consideration
  label: brand_and_activation_as_complementary_mechanisms
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: source_stated
  description: Two mechanisms working on different timescales - brand building creating durable memory
    structures, sales activation converting them into immediate sales - which the source treats as mutually
    reinforcing rather than alternative.
  whole_system_claim:
    text: Brand and activation work in synergy, each enhancing the other, so both are required for maximum
      effectiveness and for maximum efficiency; the question is never which one but in what proportion
      for the context.
    origin: source_explicit
    interpretation_basis: null
    source_ref:
      section: '1.6'
      page_start: 17
      page_end: 18
