  label: consideration_context_framework
  label_origin: extractor_assigned
  system_type: decision_framework
  system_type_origin: source_stated
  description: Two dimensions of the purchase decision - how much consideration it attracts, and whether
    that consideration is rational or emotional - which together determine which marketing effects are
    easy to produce, which are hard, and therefore how budget should be split.
  whole_system_claim:
    text: The level and nature of consideration jointly set the relative difficulty of brand building
      and sales activation in a category, and best practice should be flexed accordingly rather than
      applied uniformly.
