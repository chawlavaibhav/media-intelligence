# CANON-003 book 18 (Lane D) — Donald Miller, "Building a StoryBrand" (2017), chapters 1-3.
# Independent visual-evidence pass, completed BEFORE any SourceKnowledge object was written.
#
# PROVENANCE:
#   local file: ~/Downloads/Books/"Building a StoryBrand.epub"
#   dc:title "Building a StoryBrand" · dc:creator Donald Miller
#   publisher HarperCollins Leadership · dc:date 2017-09-08 · ISBN 9780718033330
#   dc:contributor "calibre (6.25.0)" and a "calibre:20611" identifier — the package was handled by
#   Calibre. Unlike book 16 there is no Kindle ASIN, and the internal structure (OEBPS/, ISBN-named
#   files, image filenames carrying printed page numbers) is a publisher-style EPUB, so this looks
#   like a re-packaged publisher file rather than a format conversion. NOT VERIFIED either way.
#   36 images. No page renders exist and none were made: an EPUB reflows.

source_id: miller_storybrand_sb7_framework_ch1_3
pass: independent_visual_evidence
visual_completeness: verified_figure_level

method:
  images_in_book: 36
  images_in_processed_section: 12
  images_inspected: 6
  what_was_checked: >
    Every image reference in chapters 1-3 was listed, and six were opened and read: the framework
    diagram, the two worked examples, one of the seven inline icons, the BrandScript template and
    the nesting diagram. The remaining six are the other inline icons, which are the same small
    circular glyphs repeated for each framework element.
  what_could_not_be_checked: >
    Page layout, which does not exist in a reflowable EPUB. The image filenames carry printed page
