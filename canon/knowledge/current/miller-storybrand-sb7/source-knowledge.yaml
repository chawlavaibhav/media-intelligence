- sk_id: sk_sb_c003_0002
  source_id: miller_storybrand_sb7_framework_ch1_3
  source_terms:
    - "the overriding function of the brain is to help an individual survive and thrive"
    - "if we position our products and services as anything but an aid in helping people survive"
  concept_label: attention_is_given_only_to_what_reads_as_survival_relevant
  label_origin: extractor_assigned
  claim: >
    The source's first stated cause of marketing failure. People continually scan their
    environment, advertising included, for information that helps them survive and thrive, and
    discard the rest. A message about the company's own history, scale or internal goals is
    therefore filtered out before it is considered. The source's illustration is that after an hour
    in a ballroom you would not know how many chairs it held but would know where the exits were.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The brain's overriding function, on the account the source is given, is survival, so the
      subconscious sorts incoming information by survival relevance and discards what fails.
  scope:
    domain_discussed_by_source: [marketing, branding, consumer_behaviour]
    conditions: "a customer encountering a commercial message unprompted"
  caveats:
    - text: "the whole neuroscientific argument is delivered as reported conversation with a named friend on the author's back porch, with no study cited"
      origin: extractor_observed
    - text: "Maslow's hierarchy is invoked as the supporting frame, which is a mid-century model of motivation rather than a current finding about attention"
      origin: extractor_observed
    - text: "the source's list of survival needs runs from food and shelter to love, tribe and meaning, which is broad enough that almost any benefit can be claimed to fit"
      origin: extractor_observed
  source_stated_problems:
    - "brands fail to focus on the aspects of their offer that will help people survive and thrive"
    - "positioning ourselves as the chairs, not the exits"
  source_stated_remedies:
    - "make the message about something that helps the customer survive and thrive"
  examples:
