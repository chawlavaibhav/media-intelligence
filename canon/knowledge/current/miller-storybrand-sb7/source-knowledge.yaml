  label_origin: extractor_assigned
  claim: >
    Story is offered as the specific remedy for processing cost, on the grounds that it is a
    sense-making device: it identifies an ambition, defines what stands in the way, and provides a
    plan, so the information arrives pre-ordered. The source's analogy is music against noise —
    the same sound waves, but organised under rules the brain can engage, which is why a song is
    remembered and a dump truck reversing is not.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A familiar structure removes the work of ordering the information, so the audience spends
      nothing on organising and can attend to the content.
