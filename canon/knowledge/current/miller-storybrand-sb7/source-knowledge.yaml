- sk_id: sk_sb_c003_0006
  source_id: miller_storybrand_sb7_framework_ch1_3
  source_terms:
    - "A CHARACTER who wants something encounters a PROBLEM before they can get it. At the peak of their despair, a GUIDE steps into their lives, gives them a PLAN, and CALLS THEM TO ACTION. That action helps them avoid FAILURE and ends in a SUCCESS."
  concept_label: the_seven_element_framework_as_the_unit_of_message_design
  label_origin: extractor_assigned
  claim: >
    The framework itself: seven elements — character, problem, guide, plan, call to action, failure
    avoided, success — which the source says are the necessary elements of a compelling story and
    the categories a brand message should be reduced to. It is presented as derived from studying
    hundreds of films, novels, plays and musicals, and as a summation of best practices refined
    over thousands of years of storytelling.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The formula follows a well-worn path in the brain, so positioning a product along that path
      makes it easier to attend to.
  scope:
    domain_discussed_by_source: [marketing, branding, websites, keynotes, elevator_pitch]
    conditions: "constructing a brand's core message"
  caveats:
    - text: "the diagram shows the last two elements as a fork from one junction rather than as consecutive steps, which the prose does not say"
      origin: extractor_observed
    - text: "the derivation is asserted, not shown: no sample, no criteria and no count of the films studied are given"
      origin: extractor_observed
    - text: "the source concedes some stories leave the guide out or use several, and calls indie films that break the formula critically successful but commercially unsuccessful, which is an outcome claim without evidence"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
    - "reduce the message to soundbites in seven categories"
