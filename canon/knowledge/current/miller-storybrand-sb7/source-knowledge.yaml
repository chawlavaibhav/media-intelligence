# CANON-003 book 18 (Lane D) — Donald Miller, "Building a StoryBrand" (2017), chapters 1-3:
# "The Key to Being Seen, Heard, and Understood", "The Secret Weapon That Will Grow Your Business",
# "The Simple SB7 Framework". Fresh SPEC-03 extraction under the frozen CANON-002-era method.
# V0 granularity rule, unchanged. Visual completeness: verified_figure_level.
#
# SECTION RATIONALE: Section 1 of the book, which is the source's own division. It contains the
# whole causal argument (why marketing fails), the case for story as the remedy, and the complete
# framework in summary with all seven principles stated. Section 2 then spends one chapter on each
# element. Processing Section 1 exposes the reasoning system entire; processing one later chapter
# would expose one element in depth without the argument that produced it.
#
# NOTE ON THIS SOURCE'S SHAPE, recorded rather than smoothed over:
# this is commercial-communication knowledge sold alongside a paid framework, a certification
# programme and a software tool. Its claims are frequently supported by revenue outcomes with no
# controls — a client's course selling $25,000 and then $103,000 after a rewrite, the author's own
# company doubling for four consecutive years — and by causal attributions about famous companies
# made from outside them. The science in chapter 1 is delivered as reported speech from a named
# friend, not as citation. All of that is recorded in the evidence characteristics, which is what
# they are for.

source_id: miller_storybrand_sb7_framework_ch1_3

