extraction_scope_statement:
  chapters_read_by_extraction: >
    Chapters 1-9, 11, 15, 16 in full, with platform material from chapter 12; the frozen
    objects' provenance cites chapters 1-9, 11/12, 15, 16 only.
  chapters_never_read_by_extraction: [10, 13, 14, 17]
  rep07_read: >
    All four chapters were read in full by this pass. Chapter 10 ("Advertising 2.0"): the
    digital shift - branded content, brand actions and experiences, participatory/shareable
    ideas, culture-riding, revised briefs. Chapter 13 ("Everything That Can Be Digital, Will
    Be"): creative technologists and developers, goal-directed design, user personas,
    wireframes/prototypes, mobile mechanics (NFC, geofencing, AR, native vs web apps). Chapter
    14 ("Stopping People from Going to the Bathroom"): television/video craft - all-visual
    solutions, the one-frame goal, three-act structure, the last-five-seconds rule (quoted from
    Fowler's The Creative Companion), spare writing, dialogue craft. Chapter 17 ("Just Start
    World War III"): portfolio, schools, job-search and career advice.
  finding: >
    NO frozen object cites any of the four chapters, and nothing in them contradicts any frozen
    claim - they cover terrain the extraction's span deliberately excluded (digital/mobile
    execution, TV craft, careers). The partial_extraction_recorded_as_whole defect is therefore
    BOUNDED: the unread chapters contain real, extractable craft doctrine (especially ch. 14's
    television rules), so the extraction is genuinely partial, but its recorded objects are not
    contaminated by the gap. Any future extension of this source should start from chapters 10,
    13, 14.

informant_test:
  question: >
    Does sullivan-hey-whipple share a primary informant with live
    ogilvy-ch2-advertising-that-sells (David Ogilvy), per the AUDIT-GATE-v0.2
    shared_primary_informant definition?
  census: >
    16 occurrences of the string "Ogilvy" across the book, classified by reading each in
    context: 8 are the OGILVY AGENCY as maker of campaigns discussed (Ogilvy Brasil/BandSports
    Fig 5.5; Ogilvy London/British Airways Fig 6.12, twice; Ogilvy/AeroMexico Fig 9.5; Ogilvy
    Frankfurt/DB railways, twice; Ogilvy Australia/KFC Secret Menu); 4 are endnote citations of
    David Fowler's The Creative Companion (New York: Ogilvy, 2003) in chapters 4, 14, 15, 16 -
    a different practitioner's book whose publisher-of-record is the agency; 1 is a David
    Ogilvy aphorism quoted in ch. 16 (research used "the way a drunk uses a lamppost"); 1 is
    Norman Berry, an Ogilvy & Mather creative director, quoted in ch. 1; 2 are the author's own
    employment anecdote (ch. 18).
  verdict: >
    shared_primary_informant does NOT hold. David Ogilvy's own claims are incidental in this
    book - one aphorism - and the gate's definition states incidental quotation of the same
    person is not sufficient. The heavier dependency the extraction flagged is David Fowler's
    Ogilvy-published book (cited across four chapters, and load-bearing for ch. 14's
    last-five-seconds rule), but Fowler is not David Ogilvy and his book is not in the corpus;
    the agency-campaign references are examples, not a practitioner's claims. The correct
    lineage relation to ogilvy-ch2-advertising-that-sells is cites_source (one-directional,
    does not defeat independence). Three frozen objects rest on OTHER named third parties
    quoted approvingly (sk_whip_0007 McAlhone & Stuart; sk_whip_0016 Norman Berry;
    sk_whip_0066 Bogusky), recorded in the audit's evidence_origin.

