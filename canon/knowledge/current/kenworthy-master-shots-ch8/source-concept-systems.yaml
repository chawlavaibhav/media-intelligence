# CANON-003 book 11 (rebalance lane) — "Master Shots" frame material and ch.8.
# SourceConceptSystems under SPEC-03. Three systems: how the book intends itself to be used, which
# is stated; the chapter read as alternatives to a cut, which is ours; and the shared standard the
# camera-move techniques are judged by, which is ours.
source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
source_concept_systems:

- scs_id: scs_ms_c003_001
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  label: how_the_book_intends_itself_to_be_used
  label_origin: extractor_assigned
  system_type: decision_framework
  system_type_origin: source_stated
  description: >
    The instructions the book gives about itself, set out in its own front matter: read all of it
    before preproduction rather than looking up one shot; reconstruct each technique from the frame
    grabs and the overhead diagrams before watching the source film; understand a chapter by reading
    the text, studying the images and imagining your own use; keep it on set for alternatives;
    combine several techniques in one scene; own the lens decision; and test the recommendations
    against the opposite choice to see whether the author was right.
  whole_system_claim:
    text: >
      The book states that its purpose is not the hundred shots but the fluency they produce — that
      knowing technique well enough to forget it is what makes an original choice possible in the
      few moments a set allows. Every instruction follows from that: read it all, practise
      visualising, combine, and test rather than accept. The catalogue is a means and the source
      says so.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {locator: "Introduction and Conclusion; 'the more techniques you know, the sooner you will be able to forget them'"}
  members:
    - {sk_ref: sk_ms_c003_0005, role_in_system: stated_purpose, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0006, role_in_system: instruction, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0007, role_in_system: instruction, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0009, role_in_system: apparatus, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0008, role_in_system: instruction, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0003, role_in_system: precondition, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0004, role_in_system: epistemic_stance, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0001, role_in_system: scope_claim, order: 8, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0020, role_in_system: evidential_basis, order: 9, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies:
      - {from: sk_ms_c003_0007, to: sk_ms_c003_0009, nature: "the reader is told to reconstruct the technique from image types the source defines in the next section", origin: source_stated}
      - {from: sk_ms_c003_0005, to: sk_ms_c003_0006, nature: "reading the whole book rather than looking up one shot is what produces the fluency the source is after", origin: source_stated}
    tradeoffs: []
    conflicts:
      - between: [sk_ms_c003_0008, sk_ms_c003_0019]
        nature: >
          The front matter calls combining several techniques in one scene one of the best things a
          director can do. Inside the chapter, the reflection technique warns that shifting focus
          between two planes of interest confuses rather than guides. Combination is encouraged in
          general and forbidden in at least one specific case, and the source does not connect the
          two statements.
        origin: extractor_inferred
        source_ref: null
  source_warns_against_isolated_use: true
  source_warning_ref: >
    The source recommends reading the whole book rather than dipping in for a single shot, and says
    the technique must be imagined into your own scene rather than copied.
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, repeated_within_source, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      This is largely a reported system: the members, the purpose and most of the instructions are
      the source's own words in its own front matter. Ours are the inclusion of the film-citation
      practice as the system's evidential basis, and the recorded conflict about combining
      techniques. A reader could treat the front matter as ordinary publisher's preamble rather than
      as a method; the Conclusion's restatement of the purpose is the evidence against that reading.
  provenance:
    chapter: "Introduction, How to Use this Book, About the Images, Conclusion"
    locator: "EPUB text/part0005.html, part0006.html, part0007.html, part0020.html"
    page_start: null
    page_end: null
    source_support: text_and_visual

- scs_id: scs_ms_c003_002
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  label: seven_ways_to_move_attention_without_a_cut
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    Chapter 8 read as a set of alternatives to cutting: motivate a move with an object in transit;
    hand the scene from one subject to another with a retreating camera; carry the move on an
    actor's differential speed across the lens; put subject and reaction in one frame with a
    reflection; drive the camera to a predetermined close-up regardless of the action; identify a
    background figure by an established colour; or move nobody but the actors in a static wide
    master.
  whole_system_claim:
    text: >
      The seven are alternative answers to one question — how to redirect attention without a cut —
      and they differ in what carries the redirection: an object, the camera's retreat, an actor's
      speed, a reflective surface, the camera's indifference, a colour, or blocking. Two of the
      seven use no camera movement at all, which is why the set is better described by what
      redirects attention than by what the camera does.
    origin: extractor_synthesis
    interpretation_basis: >
      The source never states a chapter thesis; each technique stands alone under its own number.
      The reading is ours, and its basis is that six of the seven explicitly contrast their method
      with cutting or with a plain pan, and the chapter is the author's own grouping under the title
      Directing Attention. The parameter that distinguishes the members — what carries the
      redirection — is also ours.
    source_ref: null
  members:
    - {sk_ref: sk_ms_c003_0010, role_in_system: framing_claim, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_ms_c003_0011, role_in_system: technique, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0012, role_in_system: technique, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0013, role_in_system: technique, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0014, role_in_system: technique, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0015, role_in_system: technique, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0016, role_in_system: technique, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0017, role_in_system: technique, order: 8, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: source_numbered, origin: source_stated}
    dependencies: []
    tradeoffs:
      - between: [sk_ms_c003_0014, sk_ms_c003_0016]
        nature: >
          Both depend on a lens decision that determines what the background does, and they pull
          opposite ways. The reflection technique warns that a long lens leaves the reflection
          blurred unless focus is pulled; the colour technique wants a long lens precisely so the
          background blurs. The same choice serves one and damages the other.
        origin: extractor_inferred
        source_ref: null
    conflicts:
      - between: [sk_ms_c003_0017, sk_ms_c003_0010]
        nature: >
          The chapter's last technique reaches the chapter's goal without moving the camera at all,
          and ends by planning coverage so that a cut becomes possible. Whatever unifies these seven
          techniques, it is not the avoidance of cutting as such.
        origin: extractor_inferred
        source_ref: null
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, practitioner_assertion, repeated_within_source, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      Membership and order are the source's — these are its seven numbered techniques under its own
      chapter title. Everything else here is ours: the framing claim, the parameter that separates
      the members, the recorded trade-off between two lens decisions, and the observation that the
      final technique breaks the pattern. A reader could take the chapter as an unordered list of
      seven unrelated tricks, and nothing in the source contradicts that.
  provenance:
    chapter: "8 — Directing Attention"
    locator: "EPUB text/part0015.html"
    page_start: null
    page_end: null
    source_support: text_and_visual

- scs_id: scs_ms_c003_003
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  label: the_standard_a_camera_move_is_judged_by
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    Two requirements the source applies together to every moving-camera technique: the move must be
    motivated by something in the scene, and the audience must not notice it. Motivation is stated
    in the introduction as the rule; invisibility is stated inside individual techniques as the test
    that the rule was satisfied.
  whole_system_claim:
    text: >
      The two qualify each other and neither is sufficient alone. A move can be motivated by an
      action and still announce itself if it is too long or too fast, which is why the object-guide
      transition is required to be brief. A move can be unnoticed and unmotivated, which is the
      source's picture of the camera drifting because the equipment allows it. What the source is
      after is a move whose reason lies in the scene and whose execution leaves the audience with
      the scene rather than the technique.
    origin: extractor_synthesis
    interpretation_basis: >
      The source states the motivation rule once, in the introduction, and states the invisibility
      criterion separately inside three techniques in almost the same words. It never puts them
      together or says either is insufficient alone. Joining them, and the claim that each bounds
      the other, is ours.
    source_ref: null
  members:
    - {sk_ref: sk_ms_c003_0002, role_in_system: rule, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0018, role_in_system: test, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_ms_c003_0012, role_in_system: instance, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0013, role_in_system: instance, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_ms_c003_0015, role_in_system: instance, order: 5, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies:
      - {from: sk_ms_c003_0018, to: sk_ms_c003_0002, nature: "the invisibility criterion is how the source checks that a move was motivated rather than gratuitous", origin: extractor_inferred}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, repeated_within_source, practitioner_assertion, mechanism_absent]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      Both members are the source's own statements, repeated often enough to be unmistakable. The
      system is entirely ours: the source never presents them as a pair, and the claim that each
      bounds the other is an interpretation of how the chapter behaves rather than a report of
      anything it says. It is also a standard nothing can measure — one half describes what an
      audience does not notice.
  provenance:
    chapter: "Introduction and 8 — Directing Attention"
    locator: "EPUB text/part0005.html and text/part0015.html"
    page_start: null
    page_end: null
    source_support: text
