  role: [derives]
  rationale: >
    The executable content of all seven techniques: where the camera goes, where the actors go, in
    what order, and how the two are timed against each other. Production IR does not exist, so none
    of it is translated. It is recorded in the source's frame — dollies, marks, blocking, pace — and
    left unbound. The geometry lives in the overhead diagrams rather than in the prose, which is
    noted here because a text-only reading of these objects would carry the intent without the
    positions.
  applicability:
