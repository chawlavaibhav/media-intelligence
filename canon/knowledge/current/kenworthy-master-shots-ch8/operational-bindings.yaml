- binding_id: bnd_ms_c003_0006
  source_knowledge_refs: [sk_ms_c003_0004, sk_ms_c003_0020, sk_ms_c003_0001]
  source_system_refs: [scs_ms_c003_001]
  target_type: governance
  target_path: null
  governance_consumer: evidence_interpretation
  role: [flags]
  rationale: >
    A distinctive evidence profile the Canon should be able to recognise. Every technique here is
    warranted by one thing only: naming a released feature in which it was used, with frame grabs.
    That is evidence a technique can be executed and was thought good enough to keep, and it is not
    evidence that it caused any effect. The source does not overclaim — but it also tells the reader
    twice to test its recommendations against the opposite choice and decide whether it was right,
    which makes its claims proposals for testing rather than assertions. A source that pre-declares
    that status is a different weighing problem from one that asserts, and nothing in the schema
    marks the difference.
  applicability:
    when: "weighing a procedural source whose only warrant is that a technique appears in released work"
    limits: >
      One source. It shows what the profile looks like; it says nothing about how such claims should
      be scored against sources arguing from mechanism or measurement.
  evidence_basis: derived_from_source
