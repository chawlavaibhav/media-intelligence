- sk_id: sk_ms_c003_0013
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  source_terms:
    - "Rather than having her run straight forward, have her run across the other actor's path. This brings her much closer to the camera, which adds to the sense of speed."
    - "A face is usually more interesting than the back of somebody's head."
  concept_label: differential_actor_speed_across_the_lens_carries_a_move_and_reveals_a_space
  label_origin: extractor_assigned
  claim: >
    Technique 8.3. To show a space and move within it, dolly backward with two actors and have one
    move faster than the other, crossing the slower actor's path so she passes close to the camera;
    pan with her and let the move slow to rest. The source gives three conditions: the faster actor
    should start behind the other so the acceleration registers; the run must be motivated rather
    than convenient for the camera; and using a single runner is preferable because she can look
    back at the off-screen character, which shows her face.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Proximity to the lens exaggerates apparent speed, so crossing close to camera does the work
      that running straight away from it cannot; and the audience is meant to watch a character
      leave rather than to notice a camera move.
  scope:
    domain_discussed_by_source: [film_directing, blocking, landscape]
    conditions: "a scene where the surrounding space matters to the story"
  caveats:
    - text: "the source concedes the audience does not in fact see the whole space, because the crew are behind the camera, and says it feels as though they have"
      origin: source_stated
  source_stated_problems:
    - "just pointing the camera at the actor and panning lacks any sense of dynamic motion or flow"
  source_stated_remedies:
    - "have one actor cross the other's path close to the lens, and pan to rest"
