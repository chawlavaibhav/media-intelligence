# CANON-003 book 11 (rebalance lane) — Christopher Kenworthy, "Master Shots" vol.1, 2nd ed.
# Processed span: the book's frame — Introduction, "How to Use this Book", "About the Images" and
# the Conclusion — together with chapter 8, "Directing Attention", complete (techniques 8.1-8.7).
# Fresh SPEC-03 extraction under the frozen CANON-002-era method. V0 granularity rule, unchanged.
# Visual completeness: verified_figure_level.
#
# SECTION RATIONALE: this book is a hundred numbered recipes. A chapter on its own would expose the
# recipe FORM but not the reasoning that governs it — what the recipes are for, how the author
# intends them to be read, what evidential status the pictures have, and what he claims knowing a
# hundred of them does to a director. All of that is in the frame material, and the frame material
# alone would expose the reasoning with no instance of it. The two together are the coherent
# section: about 4,200 words, one complete chapter of seven techniques, and the book's own account
# of how to use them.
#
# NOTE ON THIS SOURCE'S SHAPE, recorded rather than smoothed over:
# this is procedural craft knowledge. Almost every claim is an instruction with a stated condition
# and often a stated failure mode, supported by naming a released film in which the technique was
# used. It contains no measurement, no controlled comparison and no argument from mechanism beyond
# what an audience is said to notice. Its unusual feature is epistemic: the author twice tells the
# reader to test his recommendations against their own experiment and decide whether he was right.

