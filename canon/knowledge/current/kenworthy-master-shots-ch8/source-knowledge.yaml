- sk_id: sk_ms_c003_0011
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  source_terms:
    - "The piece of paper is not insignificant, but neither is it the focus of the scene. It merely gives us a reason to move"
    - "It is a transition, rather than a journey."
  concept_label: an_object_in_transit_licenses_a_move_across_a_location
  label_origin: extractor_assigned
  claim: >
    Technique 8.1. A minor object handed between characters — the example is a sheet of paper —
    gives the camera a reason to travel from one side of a location to the other. The object must be
    calibrated: not insignificant, but not the focus of the scene either. Both the start and the end
    of the move should be composed as though each were a finished shot in its own right, and the
    passage between them, where the actor moves past the camera, should be brief because it is not
    interesting enough to hold attention.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A move that follows something the audience is already attending to reads as motivated, where
      the same move performed on its own reads as the camera swinging across without reason.
  scope:
    domain_discussed_by_source: [film_directing, blocking]
    conditions: "a continuous shot linking two areas of one location"
  caveats:
    - text: "the calibration of the object — significant but not the focus — is given without a test for it"
      origin: extractor_observed
    - text: "the source notes the technique works whether or not the two areas are in communication with each other, which widens its scope beyond the example shown"
      origin: source_stated
  source_stated_problems:
    - "cutting from one place to another, or just panning"
  source_stated_remedies:
    - "give the camera a motivation to move by following a handed object"
