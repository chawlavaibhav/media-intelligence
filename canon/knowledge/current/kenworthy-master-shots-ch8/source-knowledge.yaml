- sk_id: sk_ms_c003_0016
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  source_terms:
    - "Color can be used to direct the audience's attention just as effectively as any camera move."
    - "There should be no slow dawning for the audience; we need to know in a beat who that is in the background."
  concept_label: a_colour_established_earlier_identifies_a_figure_the_frame_cannot_resolve
  label_origin: extractor_assigned
  claim: >
    Technique 8.6. A character given a strongly contrasting colour can be identified even when
    blurred and distant, provided the association between the colour and the character was made in
    an earlier, closer shot. The source's example is an orange jacket in a frame graded almost
    entirely to blue, with a long lens close to the foreground actor letting the background blur.
    It states two constraints: an actor cannot be given a colour that does not suit the character,
    though contrast can always be introduced some other way; and the identification must be
    immediate, with no slow dawning.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The audience expects a shot composed this way to concern only the foreground, so a splash of
      established colour overrides that expectation and pulls attention to the background before the
      foreground actor reacts.
  scope:
    domain_discussed_by_source: [film_directing, colour, grading, costume]
    conditions: "a background figure whose identity must register while out of focus"
  caveats:
    - text: "the effect depends on the rest of the frame being graded down so that one hue is nearly the only colour present, which makes it a grading and costume decision as much as a staging one"
      origin: extractor_observed
    - text: "the illustration accompanying this section is greyscale, as is every image in the book, so the demonstration cannot show the effect and in fact shows a background figure that is hard to pick out — see the visual evidence ledger"
      origin: extractor_observed
  source_stated_problems:
    - "if she was wearing an indistinct color, then her blurred appearance in the background would not be so obvious"
  source_stated_remedies:
    - "establish the colour-to-character link in an earlier closer shot, then let the background blur"
  examples:
