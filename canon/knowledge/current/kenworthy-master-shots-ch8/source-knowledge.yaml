- sk_id: sk_ms_c003_0010
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  source_terms:
    - "how do you move from one place to the other without it seeming forced?"
    - "a choreographed shot that camouflages the movement behind an action"
  concept_label: attention_can_be_moved_within_one_continuous_shot_instead_of_by_cutting
  label_origin: extractor_assigned
  claim: >
    The chapter's organising problem, stated in its first technique and recurring in every one
    after it: how to move the audience's attention from one part of a scene to another without
    cutting and without the move seeming arbitrary. The source's general answer is to hide the
    camera's movement behind something happening in the scene, and it treats the cut as the default
    that the techniques exist to improve on.
  claim_type: source_interpretation
  interpretation_basis: >
    The source never states a chapter-level thesis. Each of the seven techniques poses its own
    problem and gives its own solution. Reading them as seven answers to one question — how to
    redirect attention without a cut — is ours, and the evidence for it is that six of the seven
    explicitly contrast their method with cutting or panning, and the chapter is titled Directing
    Attention.
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [film_directing, scene_staging]
    conditions: "scenes with more than one point of interest"
  caveats:
    - text: "the source does not argue that continuous shots are better than cutting in general; it says cutting is fine but less flowing, and one technique ends by recommending a cut"
      origin: source_stated
  source_stated_problems:
