- sk_id: sk_ms_c003_0017
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  source_terms:
    - "By keeping the camera essentially in the same place, and moving the actors, you can capture all the motion and emotion of the scene without any complex moves."
    - "you need to block the actors' movements so that the character who is doing most of the talking faces the camera"
  concept_label: blocking_alone_can_direct_attention_with_a_static_wide_camera
  label_origin: extractor_assigned
  claim: >
    Technique 8.7. For an argument, hold a wide master with almost no camera movement and let the
    actors circle and pace, blocked so that whoever is dominating the scene faces the camera and the
    turn has already happened before the other begins to dominate. The source states the standing
    problem — one actor is always facing away — and requires that actor to be given enough body
    acting to keep a presence. It also gives a fallback: if no take is perfect, shoot coverage that
    need not be faces, since hands and feet will enable a cut while keeping the focus on the
    argument's energy.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      People arguing circle and pace, so the movement the scene needs is already there; making the
      actors carry it keeps the audience oriented in a way a moving camera would not.
  scope:
    domain_discussed_by_source: [film_directing, blocking, dialogue]
    conditions: "arguments and other scenes with continuous movement between two people"
  caveats:
