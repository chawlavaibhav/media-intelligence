- sk_id: sk_ms_c003_0015
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  source_terms:
    - "This camera move doesn't follow any of the objects or characters directly, but is always heading for a close-up with the main character"
    - "It's vital that your actor initially ignores the letter — or other object — so that she moves off into the background. If she simply stops when the object is offered, the effect is destroyed."
  concept_label: a_camera_that_ignores_the_action_and_arrives_anyway_reads_as_inevitability
  label_origin: extractor_assigned
  claim: >
    Technique 8.5. The camera moves at a constant pace towards a close-up of one character,
    disregarding the objects and people moving in and out of shot, so that arriving there reads as
    inevitable — the source calls the sensation magnetic, with everything drawn into the moment.
    Two timing conditions are stated: the actor must end on a mark just in front of the camera's
    resting point, coming to rest with the camera or a beat or two earlier; and the actor must at
    first ignore the object entirely, because stopping when it is offered destroys the effect.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
