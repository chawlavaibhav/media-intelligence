- sk_id: sk_ms_c003_0005
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  source_terms:
    - "The more techniques you know, the sooner you will be able to forget them and come up with your own."
    - "When you know something well enough to \"unlearn\" it, you are on the path to greatness."
  concept_label: fluency_in_technique_is_what_makes_invention_possible_under_pressure
  label_origin: extractor_assigned
  claim: >
    The stated purpose of learning a hundred recipes is not to execute them but to be able to stop
    needing them. The source's argument is about conditions of work: a film set gives a director
    moments to solve a problem after months of thinking, and technique that has become second nature
    is what makes an original choice possible in those moments. It states the negative case too —
    directors who dismiss technique end up "getting the coverage" because they could not think of a
    solution in time.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Time on set is the binding constraint, so the limit on creativity under pressure is how much
      is already internalised rather than how much can be worked out.
  scope:
    domain_discussed_by_source: [film_directing, craft_learning]
    conditions: "production conditions with severe time pressure"
  caveats:
    - text: "the claim that technique enables rather than constrains invention is asserted from the author's experience and from reader correspondence, not demonstrated"
      origin: extractor_observed
    - text: "the source states that the techniques cannot make you a good director, which limits its own claim"
      origin: source_stated
  source_stated_problems:
    - "filmmakers on set just getting the coverage because they couldn't think of a new solution in time"
  source_stated_remedies:
