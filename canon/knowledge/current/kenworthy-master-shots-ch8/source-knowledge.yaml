- sk_id: sk_ms_c003_0014
  source_id: kenworthy_master_shots_frame_and_ch8_directing_attention
  source_terms:
    - "Reflections enable you to show two things at once."
    - "when using reflections a cheated eyeline can register with some viewers as being somehow wrong"
  concept_label: a_reflection_shows_a_subject_and_its_reaction_in_one_frame
  label_origin: extractor_assigned
  claim: >
    Technique 8.4. A reflective surface puts a subject and the person reacting to it in the same
    frame, which the source calls more elegant than cutting to a point-of-view shot, and which can
    also direct attention to a background by having actors look off-screen towards the reflection.
    Four conditions are stated: a larger mirror gives more freedom in placing the shot; the actor
    should genuinely look at what they are meant to be looking at, because a cheated eyeline
    registers as wrong here even though cheating is normal elsewhere; the lens is a trade-off, since
    too wide makes the reflected subject distant while a long lens leaves the reflection blurred
    unless focus is pulled; and glossy tables and walls work as well as mirrors.
