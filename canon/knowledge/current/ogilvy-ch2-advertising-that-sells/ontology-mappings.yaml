- from: t_ogl_c003_0016
  to: t_ogl_c003_0017
  relation: related_to
  confidence_basis: source_stated
  note: >
    The source presents positioning and image as consecutive decisions — position first, then image —
    so they are connected but sequential rather than equivalent.

- from: t_ogl_c003_0005
  to: t_ogl_c003_0015
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked because both concern originality and both are judged by the practitioner's reaction, which
    invites merging. They are opposites in this source. A big idea is validated by whether it sells for
    thirty years; the cult of creativity is precisely the error of validating by style, originality or
    awards instead. The source attacks the second while insisting on the first, and quotes Reeves that
    originality is the most dangerous word in advertising.

- from: t_ogl_c003_0002
  to: t_ogl_c003_0003
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Both are advertising failing, but they fail differently and the difference matters for diagnosis.
    Passing like a ship in the night is advertising that is not noticed — a zero effect. Advertising
    that reduces sales is noticed and works against the product — a negative effect. The source treats
    the second as the more surprising finding and evidences it separately.

- from: t_ogl_c003_0004
  to: t_ogl_c003_0005
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    The source raises both as institutional failures in consecutive sections and uses the same kind of
    incentive argument for each, but never connects them explicitly. Recorded as related only.

concepts:
- concept_id: sc_ogl_c003_image_account
  kind: source_specific_concept
  origin_ref: ogilvy_on_advertising_ch2
  label: the_image_account_of_what_advertising_sells
  children_terms: [t_ogl_c003_0016, t_ogl_c003_0017, t_ogl_c003_0018, t_ogl_c003_0007, t_ogl_c003_0010]
  origin: source_stated
  basis: >
    The source coins or defines each of these terms and develops them across consecutive sections as
    one connected account: position the product, decide its image, keep the image constant, and use it
    as the added value that differentiates a product materially identical to its rivals. The grouping
    is the chapter's own structure.
  asserts_agreement_between_sources: false

- concept_id: sc_ogl_c003_measurement_complaint
  kind: source_specific_concept
  origin_ref: ogilvy_on_advertising_ch2
  label: the_unmeasured_trade
  children_terms: [t_ogl_c003_0020, t_ogl_c003_0014, t_ogl_c003_0005, t_ogl_c003_0004]
  origin: extractor_inferred
  basis: >
    The source's own term "factors", its remedy of following direct response, and its two named
    institutional failures all belong to one argument about a trade that does not measure itself. The
    source makes each point separately and never groups them, so the grouping is ours.
  asserts_agreement_between_sources: false
