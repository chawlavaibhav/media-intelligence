- term_id: t_ogl_c003_0012
  term: repeat_until_it_stops_selling
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: remedy
  definition_in_origin_frame: >
    Continue running a successful advertisement, measuring selling effectiveness at intervals, until
    research shows it has worn out.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit, unknown]
  source_ref: {locator: "Repeat your winners"}
  arising_from: [sk_ogl_c003_0017]

- term_id: t_ogl_c003_0013
  term: state_what_is_good_rather_than_what_is_better
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: remedy
  definition_in_origin_frame: >
    For products whose competitors are also good, drop the comparative claim and say clearly, honestly
    and informatively what is good about yours.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "'The positively good'"}
  arising_from: [sk_ogl_c003_0016]

- term_id: t_ogl_c003_0014
  term: follow_direct_response_practice
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: remedy
  definition_in_origin_frame: >
    Where general and direct-response practice diverge on format, timing or copy length, follow direct
    response, because it alone knows to a dollar what each advertisement sold.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "The lessons of direct response"}
  arising_from: [sk_ogl_c003_0020]

