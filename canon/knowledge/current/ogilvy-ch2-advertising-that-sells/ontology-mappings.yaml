  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: remedy
  definition_in_origin_frame: >
    Keep every advertisement contributing to one consistent brand personality over years, resisting
    the pressure from new agencies and new marketing directors to change it.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "Brand image"}
  arising_from: [sk_ogl_c003_0007]

- term_id: t_ogl_c003_0011
  term: make_the_product_the_hero
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: remedy
