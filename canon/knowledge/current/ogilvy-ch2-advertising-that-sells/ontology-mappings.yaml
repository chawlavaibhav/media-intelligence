- term_id: t_ogl_c003_0002
  term: advertising_that_reduces_sales
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: problem
  definition_in_origin_frame: >
    Advertising whose effect on sales is negative rather than merely small. The source's phrase for
    the brewer's case is that he spent millions "un-selling his beer".
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "chapter opening"}
  arising_from: [sk_ogl_c003_0002]

- term_id: t_ogl_c003_0003
  term: passing_like_a_ship_in_the_night
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: problem
  definition_in_origin_frame: >
    The fate of advertising containing no big idea: it is not noticed at all.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "What's the big idea?"}
  arising_from: [sk_ogl_c003_0010]

- term_id: t_ogl_c003_0004
  term: committee_advertising
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: problem
  definition_in_origin_frame: >
    Campaigns that reconcile a long list of objectives and too many executives' views, and so achieve
    nothing. The source says such work looks like the minutes of a committee.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Down with committees"}
  arising_from: [sk_ogl_c003_0018]

- term_id: t_ogl_c003_0005
  term: cult_of_creativity
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: problem
  definition_in_origin_frame: >
    Judging advertising by style, originality or awards rather than by whether it sells. The source
    uses the term as a section heading and endorses the counter-position that if it does not sell it
    is not creative.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "The cult of 'creativity'"}
  arising_from: [sk_ogl_c003_0021]

- term_id: t_ogl_c003_0006
  term: discarding_an_advertisement_before_it_wears_out
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: problem
  definition_in_origin_frame: >
    Retiring a campaign that is still selling, usually because those close to it have grown tired of
    seeing it. The source's illustration is Henry Ford objecting to a campaign that had not yet run.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Repeat your winners"}
  arising_from: [sk_ogl_c003_0017]

- term_id: t_ogl_c003_0007
  term: parity_product
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: problem
  definition_in_origin_frame: >
    A product materially no different from its competitors, because manufacturers share technology
    and use the same research to set colour, size, design and taste.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Make the product the hero"}
  arising_from: [sk_ogl_c003_0015]

- term_id: t_ogl_c003_0008
  term: study_the_product_first
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: remedy
  definition_in_origin_frame: >
    Read and investigate the product at length before writing, on the grounds that the selling idea
    comes out of that knowledge.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit, unknown]
  source_ref: {locator: "Do your homework"}
  arising_from: [sk_ogl_c003_0004]

- term_id: t_ogl_c003_0009
  term: position_the_product_explicitly
  origin: source
  origin_ref: ogilvy_on_advertising_ch2
  kind: remedy
  definition_in_origin_frame: >
    Decide and state what the product does and who it is for, before deciding image or campaign.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "Positioning"}
  arising_from: [sk_ogl_c003_0006]

- term_id: t_ogl_c003_0010
