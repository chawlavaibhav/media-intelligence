- sk_id: sk_ogl_c003_0011
  source_id: ogilvy_on_advertising_ch2
  source_terms:
    - "Big ideas come from the unconscious. This is true in art, in science and in advertising. But your unconscious has to be well informed , or your idea will be irrelevant."
    - "Stuff your conscious mind with information, then unhook your rational thought process."
  concept_label: big_ideas_come_from_an_informed_unconscious
  label_origin: extractor_assigned
  claim: >
    Big ideas arise from the unconscious, but only from a well-informed one, or the idea will be
    irrelevant. The stated procedure is to fill the conscious mind with information and then disengage
    rational thought — by a long walk, a hot bath, or half a pint of claret — after which the idea
    surfaces.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Information is loaded deliberately and then rational processing is suspended so the unconscious
      can combine it.
