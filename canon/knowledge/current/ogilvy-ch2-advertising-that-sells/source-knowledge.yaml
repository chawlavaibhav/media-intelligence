- sk_id: sk_ogl_c003_0004
  source_id: ogilvy_on_advertising_ch2
  source_terms:
    - "You don't stand a tinker's chance of producing successful advertising unless you start by doing your homework."
    - "study the product you are going to advertise. The more you know about it, the more likely you are to come up with a big idea for selling it."
  concept_label: study_the_product_before_writing
  label_origin: extractor_assigned
  claim: >
    Successful advertising begins with prolonged study of the product itself, and the more that is
    known about it the more likely a big selling idea becomes. The source reports spending three
    weeks reading about Rolls-Royce and finding the sentence that became the headline; sending a team
    for three weeks of engineer interviews for Mercedes; ten days' reading for a margarine account;
    and a client briefing that surfaced the ingredient behind the Shell campaign.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Product knowledge is where the selling idea comes from — in each case reported, a specific fact
      discovered during study became the campaign.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "before beginning creative work on any account"
  caveats:
    - text: "the author calls the work extremely tedious and says there is no substitute for it"
      origin: source_stated
    - text: "the four cases are the author's own successes, reported by him, with sales outcomes attributed to the campaign; no unsuccessful homework is reported, so the sample is selected on the outcome"
      origin: extractor_observed
  source_stated_problems:
    - "the slippery surface of irrelevant brilliance"
  source_stated_remedies:
    - "study the product before writing anything"
  examples:
    positive:
      - {description: "Rolls-Royce: three weeks' reading produced 'at sixty miles an hour, the loudest noise comes from the electric clock', which became the headline over 607 words of factual copy. The advertisement itself is a placeholder in the available text and was not seen", figure_ref: null}
