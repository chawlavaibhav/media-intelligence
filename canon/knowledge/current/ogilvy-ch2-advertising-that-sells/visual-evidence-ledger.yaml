# ── A fourth distinct visual-loss pattern for the batch ──────────────────────
visual_loss_pattern:
  pattern_name: announced_absence
  description: >
    The evidence is gone and the file says so. A literal instruction to click something that cannot
    be clicked sits where each advertisement was.
  contrast_with_earlier_books: >
    Williams (CANON-002) was SILENT loss: the two demonstration lists became identical and nothing in
    the file indicated anything was missing. Grammar of the Shot (book 1) was NAMED loss: every figure
    is introduced by number and caption, so the reader knows what they cannot see. Ogilvy is ANNOUNCED
    loss: the file contains explicit placeholder text marking each gap.
  why_the_distinction_matters: >
    Severity tracks detectability, not quantity. Announced and named loss are recoverable in
    principle — you know exactly what to go and find. Silent loss is the dangerous one, because an
    extractor cannot tell that anything is absent and will treat a description of missing evidence as
    though the evidence were present.
  rank_by_danger: [silent_loss_williams, named_loss_grammar_of_the_shot, announced_loss_ogilvy]

