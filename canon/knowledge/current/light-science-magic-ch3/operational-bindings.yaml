  repair_ontology_refs: [t_lsm_c003_0009, t_lsm_c003_0010, t_lsm_c003_0011, t_lsm_c003_0012, t_lsm_c003_0014]
  status: production_candidate
  status_reason: "Production IR does not exist; parked, not translated"

- binding_id: bnd_lsm_c003_0005
  source_knowledge_refs: [sk_lsm_c003_0002, sk_lsm_c003_0006, sk_lsm_c003_0011]
  source_system_refs: []
  target_type: benchmark
  target_path: null
  role: [derives]
  rationale: >
    Three candidate stimuli with unusually clean isolation. The opening thought experiment specifies
    three subjects identical in tone and differing only in finish. The playing-card pair changes source
    size and holds everything else fixed. The mirror-and-lamp test changes distance and predicts that
    brightness holds while reflection size changes. Each has a definite predicted outcome grounded in
    stated physics rather than in taste.
  applicability:
    when: "constructing stimuli where the expected answer follows from physics rather than from a practitioner's judgement"
    limits: >
      Candidate stimuli, not instruments, and not usable as-is — the photographs were unavailable for
      inspection during this extraction, so the pairs are described rather than seen. Unlike the earlier
      books' stimuli, the expected outcomes here derive from stated physical law rather than authorial
      assertion, which makes them easier to validate independently but does not remove the need to.
  evidence_basis: derived_from_source
