- sk_id: sk_lsm_c003_0013
  source_id: light_science_and_magic_ch3
  source_terms:
    - "Taken together, these different angles make up the family of angles that produces direct reflection ."
    - "This family of angles is one of the most useful concepts in photographic lighting."
  concept_label: the_family_of_angles
  label_origin: source_verbatim
  claim: >
    A surface is made of an infinite number of points and a viewer sees each at a slightly different
    angle. Taken together those angles form the family of angles that produces direct reflection. The
    source declares this one of the most useful concepts in photographic lighting, and restricts the
    phrase to direct reflection because a family of angles for diffuse reflection would be meaningless
    — diffuse reflection can come from a source at any angle.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because rays reflect from a polished surface at the angle at which they strike it, the family's
