- sk_id: sk_lsm_c003_0014
  source_id: light_science_and_magic_ch3
  source_terms:
    - "any light positioned within the family of angles will produce a direct reflection"
    - "any light positioned outside of the family of angles will not light a mirror-like subject at all, at least as far as the camera can see"
  concept_label: light_placement_relative_to_the_family_decides_whether_direct_reflection_appears
  label_origin: extractor_assigned
  claim: >
    Whether a direct reflection appears is decided entirely by whether the light sits inside the family
    of angles. A light inside it produces one; a light outside it does not light a mirror-like subject
    at all as far as the camera is concerned. To see direct reflection across most of a mirror-like
    surface, the source must be large enough to fill the family; to see none, both camera and light
    must be placed so the source falls outside it.
