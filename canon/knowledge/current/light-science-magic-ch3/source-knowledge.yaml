  source_id: light_science_and_magic_ch3
  source_terms:
    - "Black and transparent subjects do not necessarily produce stronger direct reflections than white ones. Instead, they produce weaker diffuse reflection, making it easier to see the direct reflection."
  concept_label: dark_subjects_reveal_direct_reflection_by_producing_less_diffuse_reflection
  label_origin: extractor_assigned
  claim: >
    Polarized direct reflection is more visible on black or transparent subjects, but not because such
    subjects reflect more directly. They produce weaker diffuse reflection, which leaves the direct
    component easier to see. This is the explanation for the earlier room observation that black
    objects change brightness with viewpoint while white objects do not.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
