- sk_id: sk_lsm_c003_0009
  source_id: light_science_and_magic_ch3
  source_terms:
    - "Because specular reflection has different meanings for different people, we will not use the term in this book."
    - "a \"specular\" light source does not necessarily produce a \"specular\" reflection"
  concept_label: the_term_specular_is_refused_because_it_carries_divergent_meanings
  label_origin: extractor_assigned
  claim: >
    Photographers use specular in at least three incompatible ways: as a synonym for direct
    reflection, for the smaller brighter highlights within a large one, and for highlights created by
    a small source. Modern usage adds a fourth, specular light as a synonym for hard light. Because
    the word carries divergent meanings, the source declines to use it at all and names the underlying
    concepts separately instead, always calling hard lights hard so it is clear the light is meant
    rather than the reflection.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A hard light is always hard, but how it reflects depends on the surface, so a single word
      spanning both the light and the reflection cannot be used consistently.
  scope:
    domain_discussed_by_source: [photographic_lighting]
    conditions: "terminology within photographic practice"
  caveats:
    - text: "the source notes the Greek root means mirror and that the word originally described only the reflection, so the ambiguity is a modern accretion"
      origin: source_stated
    - text: "the source explicitly permits readers who use the term to substitute it while reading, so the refusal is applied to its own writing rather than imposed on the reader"
      origin: source_stated
  source_stated_problems:
    - "specular reflection has different meanings for different people"
  source_stated_remedies:
    - "refuse the ambiguous term and name the underlying concepts separately"
  examples: {positive: []}
  intra_source_relations:
