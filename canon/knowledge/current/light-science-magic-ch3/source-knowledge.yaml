- sk_id: sk_lsm_c003_0015
  source_id: light_science_and_magic_ch3
  source_terms:
    - "an image of the polarized reflection is always substantially dimmer than a photograph of the light source itself"
    - "A perfectly polarized direct reflection is exactly half as bright as an un-polarized one"
  concept_label: polarized_direct_reflection_is_dimmer_than_ordinary_direct_reflection
  label_origin: extractor_assigned
  claim: >
    Polarized direct reflection resembles ordinary direct reflection and is visible from the same
    single viewing position, but is always substantially dimmer. A perfectly polarized direct
    reflection is exactly half as bright as an un-polarized one, provided the source is not itself
    polarized, and in practice is dimmer still because polarization is inevitably accompanied by
    absorption.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The molecular structure of some reflecting surfaces blocks part of a photon's oscillating energy,
      in the way a polarizing filter does, so only part of the energy is reflected.
  scope:
