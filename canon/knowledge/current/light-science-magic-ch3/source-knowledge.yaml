- sk_id: sk_lsm_c003_0019
  source_id: light_science_and_magic_ch3
  source_terms:
    - "placing a polarizing filter over the light source will turn a direct reflection into polarized reflection"
    - "The open sky often serves as a beautifully functional polarized light source."
  concept_label: polarizing_the_source_makes_a_reflection_manageable
  label_origin: extractor_assigned
  claim: >
    A polarizer on the camera lens has no effect on an ordinary direct reflection except to add
    neutral density. Placing a polarizing filter over the light source instead converts the direct
    reflection into polarized reflection, which the lens polarizer can then manage. Polarized sources
    are not confined to the studio: the open sky often serves as one, which is why polarizing filters
    sometimes work on subjects such as bright metal even though filter manufacturers say they should
    not.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      In those cases the subject is reflecting an already-polarized source, so the reflection is
      polarized despite the surface being a conductor.
  scope:
    domain_discussed_by_source: [photographic_lighting]
    conditions: "studio and daylight work with reflective subjects"
  caveats:
    - text: "the source explicitly contradicts advice given by filter manufacturers, and explains why both can be right"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
