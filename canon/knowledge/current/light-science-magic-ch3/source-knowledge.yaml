- sk_id: sk_lsm_c003_0018
  source_id: light_science_and_magic_ch3
  source_terms:
    - "The conclusive test, however, is the appearance of the subject through a polarizing filter. If the polarizer eliminates the reflection, then that reflection is polarized."
  concept_label: diagnostic_guidelines_for_identifying_polarized_reflection
  label_origin: extractor_assigned
  claim: >
    Polarized and un-polarized direct reflections look similar and brightness alone will not separate
    them, because real subjects mix reflection types. The source offers graded guidelines: electrical
    conductors such as metal are likely to reflect un-polarized, insulators such as plastic, glass and
    ceramic are more likely to polarize; mirror-like surfaces suggest simple direct reflection;
    non-mirror-like surfaces such as polished wood or leather are more likely polarized when viewed at
    40 to 50 degrees. The conclusive test is the polarizing filter: if it eliminates the reflection the
    reflection was polarized, if it has no effect the reflection was ordinary, and if it dims without
    eliminating, the reflection is mixed.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism: {stated_by_source: false, text: null}
  scope:
    domain_discussed_by_source: [photographic_lighting]
    conditions: "identifying reflection type on a real subject"
  caveats:
    - text: "the source marks the first three guidelines as tendencies with the words likely and more likely, and reserves conclusive for the filter test alone"
      origin: source_stated
    - text: "the 40 to 50 degree figure is qualified as depending on the subject material"
      origin: source_stated
    - text: "a rare structure among the sources in this batch: a graded diagnostic ladder ending in a decisive physical test, rather than a rule of thumb"
      origin: extractor_observed
  source_stated_problems:
