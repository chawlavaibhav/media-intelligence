- sk_id: sk_lsm_c003_0001
  source_id: light_science_and_magic_ch3
  source_terms:
    - "Photographic lighting, therefore, is primarily an exercise in reflection management."
    - "Understanding and managing reflection, for the result you want, is what constitutes good lighting."
  concept_label: lighting_is_the_management_of_reflection
  label_origin: extractor_assigned
  claim: >
    A subject can transmit, absorb or reflect light, and of the three, reflection is the most visible.
    Highly transparent subjects tend to be invisible because they affect light minimally; highly
    absorbent ones may also be invisible because they convert light into forms such as heat. Good
    lighting therefore consists in understanding and managing reflection.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Transmission and absorption produce little or nothing for the eye to see, so what a viewer
      perceives of a subject is almost entirely what it reflects.
  scope:
    domain_discussed_by_source: [photographic_lighting]
    conditions: "any lit subject"
  caveats:
    - text: "the chapter is framed as putting into words visual knowledge the reader already holds, rather than as teaching new facts"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies: []
  examples: {positive: []}
  intra_source_relations:
