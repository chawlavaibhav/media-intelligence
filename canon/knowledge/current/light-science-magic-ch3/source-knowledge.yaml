- sk_id: sk_lsm_c003_0010
  source_id: light_science_and_magic_ch3
  source_terms:
    - "Direct reflections are a mirror image of the light source that produces them."
    - "the angle of incidence equals the angle of reflectance"
  concept_label: direct_reflection_is_a_mirror_image_at_one_determined_angle
  label_origin: extractor_assigned
  claim: >
    A direct reflection is a mirror image of the light source. Light rays bounce from a smooth surface
    at the same angle at which they strike it, so the point from which a direct reflection can be seen
    is exactly determined by the angles between source, subject and camera.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The angle of incidence equals the angle of reflectance, which fixes the single viewing position
      from which the reflection is visible.
  scope:
    domain_discussed_by_source: [photographic_lighting]
    conditions: "smooth surfaces such as polished metal, water or glass"
  caveats:
    - text: "the source states no real subject produces a perfect direct reflection, though brightly polished metal, water or glass may nearly do so"
      origin: source_stated
    - text: "supported by a diagram in which one of three cameras sees a bright reflection of the source and the other two see none at all; not available for inspection"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a shiny saw blade with light and three cameras in fixed positions; one camera sees a bright reflection, the others see the blade as dark — described but not seen", figure_ref: null}
  intra_source_relations:
