- sk_id: sk_lsm_c003_0007
  source_id: light_science_and_magic_ch3
  source_terms:
    - "Diffusing the light source has no effect on whether the reflection is diffuse ."
    - "The source determines the type of light, and the surface determines the type of reflection. Any light can produce any reflection, depending on the subject."
  concept_label: the_source_sets_the_light_type_the_surface_sets_the_reflection_type
  label_origin: extractor_assigned
  claim: >
    Diffusing a light source — bouncing it from an umbrella or covering it with translucent material —
    has no bearing on whether the resulting reflection is diffuse. The source determines the type of
    light; the surface determines the type of reflection. Any light can produce any reflection,
    depending on the subject.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Both uses of the word diffusion mean a scattering of light; the question is what does the
      scattering, the light or the subject.
