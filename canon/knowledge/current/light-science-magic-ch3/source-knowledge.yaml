- sk_id: sk_lsm_c003_0020
  source_id: light_science_and_magic_ch3
  source_terms:
    - "In a good photograph, the light is appropriate to the subject and the subject is appropriate to the light."
    - "The meaning of appropriate is the creative decision of the photographer."
  concept_label: the_technique_serves_a_creative_decision_it_does_not_make
  label_origin: extractor_assigned
  claim: >
    Good recording requires more than focus and exposure: the light must be appropriate to the subject
    and the subject to the light. What counts as appropriate is the photographer's creative decision,
    and any decision is likely to be appropriate if guided by understanding of how subject and light
    together produce an image. The method is to decide which reflection type matters for the subject
    and then capitalize on it — by manipulating the light in the studio, or outside it by positioning
    the camera, anticipating sun and cloud, and waiting for the right time of day.
