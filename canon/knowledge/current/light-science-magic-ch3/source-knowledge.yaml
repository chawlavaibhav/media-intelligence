- sk_id: sk_lsm_c003_0008
  source_id: light_science_and_magic_ch3
  source_terms:
    - "The inverse square law says that intensity is inversely proportional to the square of the distance."
    - "reflection from a surface gets brighter if we move the light closer and it gets dimmer if we move the light farther away"
  concept_label: diffuse_reflection_follows_the_inverse_square_law
  label_origin: extractor_assigned
  claim: >
    The distance from light to subject does change a diffuse reflection. A light at a given distance
    illuminates a subject four times as brightly as the same light twice as far away, and nine times
    as brightly as one three times as far, following the inverse square law.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Intensity is inversely proportional to the square of the distance, and the diffuse reflection
      varies with the intensity falling on the surface.
  scope:
    domain_discussed_by_source: [photographic_lighting]
    conditions: "diffuse reflection; the source notes it does not hold for all subjects"
  caveats:
