- sk_id: sk_lsm_c003_0016
  source_id: light_science_and_magic_ch3
  source_terms:
    - "Crossing the axes of two polarizing filters blocks the transmission of light, just as the two picket fences do with rope energy."
  concept_label: polarization_explained_by_the_jump_rope_and_picket_fence
  label_origin: extractor_assigned
  claim: >
    The oscillating electromagnetic field around a photon is likened to a jump rope swung between two
    children. A picket fence between them makes the rope bounce in one plane instead of swinging in an
    arc, which is what a polarizing filter does to light. Adding a second fence at right angles stops
    the movement transmitting at all, which is what crossing two polarizers does.
  claim_type: explicit_source_claim
