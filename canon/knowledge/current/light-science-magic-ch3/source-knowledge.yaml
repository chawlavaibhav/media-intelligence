- sk_id: sk_lsm_c003_0002
  source_id: light_science_and_magic_ch3
  source_terms:
    - "The reason that these subjects, with identical transmission and absorption, appear different is that the subjects reflect the light differently ."
  concept_label: identical_tone_still_looks_different_by_reflection_type
  label_origin: extractor_assigned
  claim: >
    Three subjects of exactly the same grey — thick matte paper, smooth pewter, and glossy ceramic
    tile — transmit nothing and absorb equally, yet look obviously different. The difference is
    entirely in how they reflect. The source establishes this by a thought experiment rather than a
    photograph, on the grounds that the reader can already see the difference in their mind.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      With transmission and absorption held constant by construction, reflection is the only remaining
      variable, so it must account for the visible difference.
  scope:
    domain_discussed_by_source: [photographic_lighting]
    conditions: "surfaces matched for tone but differing in finish"
  caveats:
