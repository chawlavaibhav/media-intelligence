- sk_id: sk_lsm_c003_0011
  source_id: light_science_and_magic_ch3
  source_terms:
    - "The brightness of the image of a direct reflection is the same regardless of the distance from the source."
    - "if we spread four times the butter on a piece of bread of four times the area, the thickness of the layer of butter stays the same"
  concept_label: direct_reflection_brightness_is_independent_of_source_distance
  label_origin: extractor_assigned
  claim: >
    A direct reflection records as bright as the light source itself, regardless of how far away the
    source is. This appears to defy the inverse square law and does not, because moving the source to
    half the distance quadruples the light reflected and simultaneously quadruples the area the
    reflection covers, leaving brightness unchanged.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The extra light is spread over a proportionally larger image of the source, so intensity per
      unit area is constant — the source's analogy is four times the butter on four times the bread.
  scope:
    domain_discussed_by_source: [photographic_lighting]
    conditions: "direct reflection from a mirror-like surface"
  caveats:
    - text: "the source offers a test the reader can perform: position a mirror so a lamp is reflected in it, move the mirror closer, and observe that the brightness holds constant while the size of the reflection changes"
      origin: source_stated
    - text: "the source anticipates the reader's alarm at the claim and addresses it directly, which marks it as the counter-intuitive point of the chapter"
      origin: extractor_observed
  source_stated_problems: []
