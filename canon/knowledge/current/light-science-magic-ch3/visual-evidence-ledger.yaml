blocking_reason:
  what_happened: >
    The local book library is unreadable. Diagnosed during this batch as macOS privacy protection
    rather than the Claude Code sandbox: the blocked directories are exactly Downloads, Documents and
    Desktop — macOS's protected set — while Pictures, Movies, the repository and /tmp all remain
    readable. Disabling the Claude Code sandbox made no difference, which confirms the diagnosis.
  scope: the whole local book library
  is_it_a_source_integrity_problem: false
  remedy_requires: >
    A macOS permission the user must grant (Privacy & Security → Files and Folders → Downloads, or
    Full Disk Access). It cannot be granted by this worker and typically requires the user's password.
  consequence_for_this_book: >
    None of Figures 3.1 to 3.14 could be inspected. Every claim rests on text alone. Provenance
    remains established: verified earlier in this session against the 5th edition EPUB at 200 of 200
