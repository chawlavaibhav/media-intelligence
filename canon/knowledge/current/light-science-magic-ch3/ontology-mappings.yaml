# CANON-003 book 3 — Light: Science & Magic ch.3. SPEC-05 ontology, source-local.
source_id: light_science_and_magic_ch3
extraction_date: 2026-08-24

terms:
- term_id: t_lsm_c003_0001
  term: family_of_angles
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: entity
  definition_in_origin_frame: >
    The set of angles, taken over all points of a surface, at which a light source will produce a
    direct reflection visible from a given camera position. The source restricts the phrase to direct
    reflection, calling a diffuse equivalent meaningless.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "The Family of Angles"}
  arising_from: [sk_lsm_c003_0013]

- term_id: t_lsm_c003_0002
  term: diffuse_reflection
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: property
  definition_in_origin_frame: >
    Reflection of the same brightness from every viewing angle, because the surface scatters light
    from the source equally in all directions.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Diffuse Reflections"}
  arising_from: [sk_lsm_c003_0004]

- term_id: t_lsm_c003_0003
  term: direct_reflection
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: property
  definition_in_origin_frame: >
    A mirror image of the light source, visible only from the single position at which the angle of
    reflectance equals the angle of incidence.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Direct Reflections"}
  arising_from: [sk_lsm_c003_0010]

- term_id: t_lsm_c003_0004
  term: polarized_direct_reflection
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: property
  definition_in_origin_frame: >
    Direct reflection whose oscillation has been constrained to one plane by the reflecting surface,
    always substantially dimmer than un-polarized direct reflection. The source notes it is often
    called glare.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Polarized Direct Reflection"}
  arising_from: [sk_lsm_c003_0015]

- term_id: t_lsm_c003_0005
  term: glare
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: problem
  definition_in_origin_frame: >
    The source's alternative name for polarized direct reflection, used when the reflection is
    unwanted.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Types of Reflections"}
  arising_from: [sk_lsm_c003_0015]

- term_id: t_lsm_c003_0006
  term: diffusion_confusion
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: problem
  definition_in_origin_frame: >
    The source's name for mistaking a diffused light source for a cause of diffuse reflection. The
    source determines the type of light; the surface determines the type of reflection.
  first_seen: 2026-08-24
  verbatim: true
  source_ref: {locator: "Diffusion Confusion"}
  arising_from: [sk_lsm_c003_0007]

- term_id: t_lsm_c003_0007
  term: ambiguous_use_of_specular
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: problem
  definition_in_origin_frame: >
    The word specular used by different practitioners to mean direct reflection, small bright
    highlights within a larger one, highlights from a small source, or hard light. The source declines
    to use the term at all on these grounds.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "Specular Reflection and Specular Light"}
  arising_from: [sk_lsm_c003_0009]

- term_id: t_lsm_c003_0008
  term: unwanted_direct_reflection
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: problem
  definition_in_origin_frame: >
    A mirror image of the light source appearing on a subject where the photographer does not want it.
  first_seen: 2026-08-24
  verbatim: false
  source_ref: {locator: "The Family of Angles"}
  arising_from: [sk_lsm_c003_0014]

- term_id: t_lsm_c003_0009
  term: place_the_light_outside_the_family_of_angles
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: remedy
  definition_in_origin_frame: >
    Position camera and light so the source falls outside the family of angles, so no direct reflection
    reaches the camera from a mirror-like subject.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [physical_production]
  source_ref: {locator: "The Family of Angles"}
  arising_from: [sk_lsm_c003_0014]

- term_id: t_lsm_c003_0010
  term: enlarge_the_source_to_fill_the_family_of_angles
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: remedy
  definition_in_origin_frame: >
    Use a source large enough to fill the family of angles, so direct reflection covers the whole
    mirror-like surface rather than part of it.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [physical_production]
  source_ref: {locator: "The Family of Angles"}
  arising_from: [sk_lsm_c003_0014]

- term_id: t_lsm_c003_0011
  term: test_the_reflection_with_a_polarizing_filter
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: remedy
  definition_in_origin_frame: >
    View the subject through a polarizing filter: elimination means the reflection was polarized, no
    effect means ordinary direct reflection, partial dimming means a mixture. The source calls this the
    conclusive test.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [physical_production]
  source_ref: {locator: "Is It Polarized Reflection or Ordinary Direct Reflection?"}
  arising_from: [sk_lsm_c003_0018]

- term_id: t_lsm_c003_0012
  term: polarize_the_light_source
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: remedy
  definition_in_origin_frame: >
    Place a polarizing filter over the light source, converting an ordinary direct reflection into a
    polarized one so that a lens polarizer can then manage it.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [physical_production]
  source_ref: {locator: "Turning Ordinary Direct Reflection into Polarized Reflection"}
  arising_from: [sk_lsm_c003_0019]

- term_id: t_lsm_c003_0013
  term: refuse_an_ambiguous_term_and_name_the_concepts_separately
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: remedy
  definition_in_origin_frame: >
    Where a word carries divergent meanings across a field, decline to use it and name the underlying
    concepts separately instead, stating the reason. The source applies this to specular.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [human_edit]
  source_ref: {locator: "Specular Reflection and Specular Light"}
  arising_from: [sk_lsm_c003_0009]

- term_id: t_lsm_c003_0014
  term: read_source_size_from_its_reflection
  origin: source
  origin_ref: light_science_and_magic_ch3
  kind: remedy
  definition_in_origin_frame: >
    Read the size of a light source from the size of its image in a shiny subject, and use that to
    anticipate what enlarging the source will do.
  first_seen: 2026-08-24
  verbatim: false
  executable_by: [physical_production]
  source_ref: {locator: "Direct Reflections"}
  arising_from: [sk_lsm_c003_0012]

relationships:
- from: t_lsm_c003_0004
  to: t_lsm_c003_0005
  relation: potentially_equivalent_to
  confidence_basis: source_stated
  note: >
    The source introduces glare as an alternative name for polarized direct reflection — "or as it is
    often called, glare". Recorded as potentially equivalent rather than identical because the source
    uses glare only where the reflection is unwanted, so the terms carry different evaluative loading
    even where they pick out the same physical event. Not promoted further; that would need review.

- from: t_lsm_c003_0002
  to: t_lsm_c003_0003
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    The source's central distinction, and it checks it on four separate questions. Diffuse reflection
    is the same from every angle, is unaffected by source size or contrast, and follows the inverse
    square law with distance. Direct reflection is visible from exactly one angle, is transformed by
    source size, and holds constant brightness regardless of distance. Same surface, same light,
    opposite behaviour on every test.

- from: t_lsm_c003_0003
  to: t_lsm_c003_0004
  relation: distinct_from
  confidence_basis: source_stated
  note: >
    Checked explicitly by the source, which notes photographers often treat them as the same. They
    share geometry — both visible from one position only — and differ in brightness and, decisively, in
    response to a polarizing filter. The source devotes a section to telling them apart precisely
    because the appearance invites merging.

- from: t_lsm_c003_0006
  to: t_lsm_c003_0007
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Both are terminology failures the source stops to correct, and both collapse a property of the
    light into a property of the reflection. The source treats them in separate asides and does not
    connect them; recorded as related only.

- from: t_lsm_c003_0008
  to: t_lsm_c003_0009
  relation: related_to
  confidence_basis: source_stated
  note: "The problem and the source's stated placement remedy for it."

- from: t_lsm_c003_0005
  to: t_lsm_c003_0011
  relation: related_to
  confidence_basis: source_stated
  note: "Glare and the filter test that both identifies and removes it."

- from: t_lsm_c003_0001
  to: t_lsm_c003_0003
  relation: related_to
  confidence_basis: source_stated
  note: >
    The family of angles is defined as the angles producing direct reflection, summed over a surface.
    The source states the restriction explicitly, calling a diffuse equivalent meaningless.

concepts:
- concept_id: sc_lsm_c003_reflection_taxonomy
  kind: source_specific_concept
  origin_ref: light_science_and_magic_ch3
  label: the_three_types_of_reflection
  children_terms: [t_lsm_c003_0002, t_lsm_c003_0003, t_lsm_c003_0004, t_lsm_c003_0005]
  origin: source_stated
  basis: >
    The source names the three types in one sentence, treats them as an exhaustive division of how
    light reflects from a subject, and states that every real surface produces a mixture of all three.
    The grouping is the chapter's own organising structure.
  asserts_agreement_between_sources: false

- concept_id: sc_lsm_c003_placement_control
  kind: source_specific_concept
  origin_ref: light_science_and_magic_ch3
  label: controlling_reflection_by_light_placement
  children_terms: [t_lsm_c003_0001, t_lsm_c003_0009, t_lsm_c003_0010, t_lsm_c003_0014, t_lsm_c003_0008]
  origin: source_stated
  basis: >
    The source derives the family of angles, states that it determines where lights should be placed,
    gives both the produce-it and the eliminate-it move, and says it will use the principle repeatedly
    in later chapters. The grouping is the source's own.
  asserts_agreement_between_sources: false

- concept_id: sc_lsm_c003_terminology_discipline
  kind: source_specific_concept
  origin_ref: light_science_and_magic_ch3
  label: refusing_ambiguous_field_vocabulary
  children_terms: [t_lsm_c003_0007, t_lsm_c003_0013, t_lsm_c003_0006]
  origin: extractor_inferred
  basis: >
    The source performs two separate terminology interventions and states the reasoning for each, but
    never groups them or names the practice. Collecting them as one discipline is ours.
  asserts_agreement_between_sources: false
