- scs_id: scs_jgb_003
  source_id: jain_gods_in_the_bazaar
  label: value_located_in_circulation_and_what_follows_for_reading_this_market
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    Jain's political-economy argument, assembled: an image's value is held to emanate from its
    circulation and exchange rather than from its production, which is why authorship registers so
    weakly, why the same industrial system can address many segments without homogenising them, why
    the catalogue is not a demand curve, and why publicness itself adds value.
  whole_system_claim:
    text: >
      In this arena the artefact's value does not sit in it and was not put there by its maker. It
      accrues through movement — through being gifted, displayed, worshipped, recognised as
      recognised. That single relocation explains a cluster of otherwise disconnected observations:
      that buyers choose by subject and not by artist; that signatures work as brand names; that
      catalogues encode self-presentation rather than preference; and that an image's exposure to a
      public gaze both creates its power and makes it vulnerable to desecration.
    origin: extractor_synthesis
    interpretation_basis: >
      Jain states the location of value in circulation as her own thesis (chs. 5 and 6) and connects
      it to the fetish, to the gift economy of the bazaar and to meta-popularity. She does not join it
      to the subject-over-author finding or to the layered-catalogue finding, which sit in chapters 1
      and 4. Assembling them under one relocation is the extractor's synthesis. What the grouping ADDS,
      and what must be attributed to CANON-014, is the observation that four findings which look like
      quirks of one trade are consequences of one premise about where value sits.
    source_ref: null
  members:
    - {sk_ref: sk_jgb_0050, role_in_system: the_economic_frame, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_jgb_0110, role_in_system: value_from_imagined_collective_investment, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_jgb_0070, role_in_system: consequence_authorship_registers_weakly, order: 3, membership_origin: extractor_inferred}
    - {sk_ref: sk_jgb_0060, role_in_system: consequence_the_catalogue_is_not_a_demand_curve, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_jgb_0100, role_in_system: the_method_that_makes_it_visible, order: 5, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: causal
      origin: extractor_inferred
    dependencies:
      - between: [sk_jgb_0070, sk_jgb_0050]
        nature: "if value accrues in circulation rather than in production, the producer's identity is not what is being bought, which is why the signature migrates from an authorship mark to a brand name"
        origin: extractor_inferred
      - between: [sk_jgb_0110, sk_jgb_0100]
        nature: "meta-popularity is only visible once the image is treated as a circulating object rather than as a representation"
        origin: source_stated
    tradeoffs: []
    conflicts:
      - between: [sk_jgb_0050, sk_jgb_0150]
        nature: "the post-liberalisation object describes a partial re-import of the production-centred regime — proprietary analytical templates, patenting pressure, corporate signage — into an arena the earlier chapters characterise as circulation-centred. Jain does not treat this as refuting her thesis, but the two describe different states of the same system and should not be read as simultaneous"
        origin: extractor_inferred
  source_warns_against_isolated_use: true
  source_warning_ref: "Ch. 3, printed p. 119, and Conclusion, printed p. 369: the bazaar ethos 'is a hegemonic formation in itself and therefore should not be romanticized in the name of the popular'"
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, empirical_within_source, historical_claim]
    source_uncertainty: >
      Grounded for one industry over roughly seven years of fieldwork; the wider claim about
      capitalism is proposed rather than shown.
    extraction_uncertainty: none
    system_level_uncertainty: >
      Moderate-to-high. This is the most theoretically loaded grouping in the record and the one where
      an extractor is most likely to over-systematise a book that is arguing with other scholars rather
      than laying down a model. Two of the five members are joined to the thesis by the extractor and
      not by the author. It is recorded as a hypothesis about how Jain's political economy connects to
      her trade observations, not as her stated system.
  provenance:
    chapter: "1, Vernacularizing Capitalism; 4, The Sacred Icon; 5, The Circulation of Images; 6, The Efficacious Image"
    section: "assembled across four chapters"
    page_start: 31
    page_end: 295
    source_support: text
