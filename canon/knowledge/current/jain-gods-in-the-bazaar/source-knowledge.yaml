  source_id: jain_gods_in_the_bazaar
  source_terms:
  - Images are not powerful in and of themselves. It is we ... who make them powerful through what we
    do with them and what we say about them.
  concept_label: the_authors_closing_statement_on_where_an_images_power_resides
  label_origin: extractor_assigned
  claim: 'Jain closes the book with an explicit statement of her position on image efficacy: "Images are
    not powerful in and of themselves. It is we — iconolaters and iconoclasts, devotees and secularists
    alike — who make them powerful through what we do with them and what we say about them." She immediately
    qualifies the "we": because this power unfolds in a trans-subjective arena, "it is not fully controllable
    by individual subjects, whether at the point of ''production'' or of ''reception''."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'If efficacy is constituted by collective practice and discourse rather than residing in the
      artefact, then no single party at either end of the chain can determine it. Producers cannot install
      power in an image and viewers cannot withhold it individually, because the constitutive process
      runs between them.

      '
  scope:
    domain_discussed_by_source:
    - image_theory
    - efficacy
    conditions: 'The author''s summary position, stated for the whole argument of the book.

      '
  caveats:
  - text: retained as an object because it is the source's own bound on everything else it says. Any downstream
      use that treats one of this book's production constraints as a lever on an outcome is contradicted
      by the book's last page
    origin: extractor_observed
  - text: it is a position, not a result. The book demonstrates practices and discourses; it does not
      demonstrate that power is constituted by them rather than merely correlated with them
