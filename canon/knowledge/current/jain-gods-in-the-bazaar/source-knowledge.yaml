- sk_id: sk_jgb_0060
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - the files are not direct indices of market demand but represent several layers of second-guessing
    and self-projection
  - the formal expression - and the vehicle - of a relationship
  concept_label: the_calendar_file_as_layered_second_guessing_rather_than_a_read_on_demand
  label_origin: extractor_assigned
  claim: 'Jain identifies a structural problem with treating this industry''s catalogues as evidence of
    what consumers want, and states it precisely. Because Sivakasi calendars are mostly advertisements
    given out free rather than commodities bought by end-users, "the calendar files are not direct indices
    of market demand but represent several layers of second-guessing and self-projection." She enumerates
    the layers: the files index what publishers think will interest their clients (the people responsible
    for a firm''s publicity); which in turn indexes not just what those clients think will please their
    own customers, but also HOW THOSE CLIENTS WANT THEMSELVES TO BE SEEN. She adds the consequence for
    what the artefact is: "if a calendar is primarily a commodity from the point of view of the publishers,
    from the point of view of their clients it is primarily the formal expression — and the vehicle —
    of a relationship."

