- sk_id: sk_jgb_0140
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - naturalism and other pictorial technologies served to reconfigure or recontextualize existing forms
    and thereby expand the domain of commodity address
  concept_label: new_pictorial_technique_widening_who_a_commodity_could_address_at_once
  label_origin: extractor_assigned
  claim: 'Jain argues that the deployment of new image-making techniques, including technological mass
    reproduction and elements of Western naturalism, "helped mass-manufactured images to forge an arena
    of common address across varying social constituencies — that is, to ''naturalize'' an expanded category
    of the popular." Her worked case is M. V. Dhurandhar''s 1932 Woodward''s Gripe Water calendar, which
    she reads as deploying two distinct registers of signification at once: a perspectival, narrative,
    allegorical register aimed at a modernising Indian and European resident elite, and an indexical,
    frontal, iconic register that institutes a divine presence. She states the general point: "commodity
    aesthetics provided a ground for reformulations of community and locality, in this case by drawing
    colonial residents and the Indian elite into a common frame of address," driven by "the opposing expansive
    and conservative imperatives of mass production: to solicit the largest possible audience while also
    drawing on familiar frames of reference."

    '
  claim_type: source_interpretation
  interpretation_basis: 'The reading of the Dhurandhar calendar as doubled in address, and the generalisation
    from it to the expansive function of naturalism, are Jain''s. She advances the position explicitly
    against accounts that treat Indian popular aesthetics as an iconic realm resistant to Western naturalism.

    '
  mechanism:
    stated_by_source: true
    text: 'Mass production pulls in two directions at once: it must reach as many people as possible,
      and it must remain legible within frames those people already hold. A single artefact that carries
      two registers can satisfy both, addressing constituencies that would otherwise require separate
      artefacts — which is why technique expansion and audience expansion travel together.

      '
  scope:
    domain_discussed_by_source:
    - commodity_aesthetics
    - advertising_history
    - colonial_india
    conditions: 'Indian commercial imagery from roughly the 1880s to the mid-twentieth century. Jain marks
      the Dhurandhar case as exceptional — "it represents something of an aberration, a path not taken"
      — because the constituency it addressed did not last.

      '
  caveats:
  - text: the central worked example is one the author calls an aberration and a path not taken. The mechanism
      is argued from a case she says did not persist, which is unusual and should be visible to anyone
      using the object
    origin: source_stated
  - text: '''expanded the domain of commodity address'' is an interpretation of a historical pattern;
      no measure of reach, sales or audience composition is presented anywhere'
    origin: extractor_observed
  - text: Jain is arguing against Pinney's and Rajadhyaksha's readings by name. The object records her
      position in a disagreement among specialists, not a settled result
    origin: source_stated
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: Interpretive and contested; the
      principal example is described by the author as atypical.'
    origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
