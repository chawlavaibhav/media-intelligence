- sk_id: sk_jgb_0100
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - images are as much objects as they are signs or representations
  - the forensic mode of analysis
  concept_label: the_limits_of_treating_an_image_only_as_a_representation_to_be_judged_true_or_false
  label_origin: extractor_assigned
  claim: 'Jain''s opening argument is that the default mode of critical thinking about images in social
    and political change has been juridical and forensic — treating an image either as evidence (true
    or false, real or fake) or as a perpetrator (good or bad, objectifying or empowering) — and that this
    mode is systematically blind to other forms of power an image has. She names the specific cost: "the
    more explicitly politically invested the critical analysis of an image, the likelier it is to resort
    to the representational realism that has come to us epistemically and institutionally bundled with
    the modern discourse of justice ... As a result, the less likely it is to be able to engage — to apprehend
    or to counteract — the other forms of power available to the image." Her alternative is to treat images
    "as much objects as they are signs," attending to their efficacy as circulating things: as icons,
    commodities, gifts, items of ritual exchange.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A frame that asks only whether an image is adequate to a truth can only see the properties
      that bear on adequacy — what is inside the frame, and whether it corresponds. Properties that reside
      in the image''s movement, its handling, its exchange and its physical presence are not unmeasured
      by such a frame; they are invisible to it, because they answer a question it does not ask.

      '
  scope:
    domain_discussed_by_source:
    - image_theory
    - critique
    - method
    conditions: 'Advanced for the analysis of mass-cultural and religious images in postcolonial India,
      with the author explicitly not discrediting evidentiary analysis: "I do not intend to discredit
      the evidentiary analyses of images mobilized in struggles for social justice."

      '
  caveats:
  - text: this is a methodological argument, not a finding about images. It changes what questions get
      asked; it establishes no fact about any image
    origin: extractor_observed
  - text: Jain's own alternative is developed through theory (Appadurai, Simmel, Taussig, Deleuze, Butler)
      as much as through evidence, and the object should not be read as an empirical result
    origin: extractor_observed
  - text: the source explicitly keeps the evidentiary frame available — 'to the extent that they have
      become part of a certain common sense ... these realist strategies may still offer a potent mode
      of immanent critique'. It is an argument for adding a frame, not for replacing one
    origin: source_stated
  - text: 'Adjacency to sk_jgb_0110 recorded without a graph edge: the trans-subjective account of efficacy
      that follows from it. The original extraction used a ''supports'' relation, which SPEC-03 does not
      define; no permitted relation expresses it from this object''s side, so it is kept as an observation
      rather than expressed as a fabricated edge.'
    origin: extractor_observed
  source_stated_problems:
  - a purely evidentiary frame cannot see the forms of an image's power that do not reside in its correspondence
    to a truth
  source_stated_remedies:
  - attend to the image as a circulating object as well as a representation
