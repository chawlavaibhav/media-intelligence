  concept_label: producers_disavowing_the_audience_they_belong_to_and_what_that_disavowal_is_doing
  label_origin: extractor_assigned
  claim: 'Jain documents a systematic gap between what people in the calendar industry SAY about their
    audience and what they DO. Artists, publishers and printers routinely described the consumers of calendar
    art as "ordinary people," "the masses," "villagers," "the labor class," ascribing to them unrefined
    taste and religious credulity — while, as she observes, "my interviewees were more often than not
    sitting under the benign gaze of a printed deity, usually of the very type they were denigrating,"
    and most had similar images in a shrine at home. She reports the countervailing testimony from the
    one secular artist in her sample, Ram Kumar Sharma: "The picture of Ramchandraji will be up in the
    home of a man of a modern progressive mind, and in that of a mythological man as well." Her reading
    is that the high-low distinction is deployed "at a primarily rhetorical level, as a means of performing
    solidarity between educated, relatively cosmopolitan constituencies while simultaneously asserting
    distinctness from others" — and, crucially, that this rhetoric "does not actually correspond to aesthetically
    enforced social distinctions."

    '
  claim_type: source_interpretation
  interpretation_basis: 'The observations are the author''s — informants'' words, and what she saw on
    the walls behind them. The reading that the distinction is rhetorical rather than operative, and that
    it is a response to her own presence as a fine-art researcher, is her interpretation of that material.
    She says so: "I read it as an attempt to function within the epistemological constraints imposed by
    the terms of aesthetic judgment in a postcolonial field."

    '
  mechanism:
    stated_by_source: true
    text: 'Mass production creates a shared realm of consumption that threatens to conflate socially distinct
      constituencies. The rhetoric of taste is then adopted in particular contexts to reinstate a distinction
      that consumption no longer enforces. Because the distinction is being performed rather than practised,
      it appears in speech and not in behaviour.

      '
  scope:
