    - taste
    - social_distinction
    - ethnographic_method
    conditions: 'The Indian calendar industry 1994-2001, in interviews conducted by a researcher who introduced
      herself as a student in a department of fine arts — a framing Jain identifies as the probable trigger
      for the rhetoric.

      '
  caveats:
