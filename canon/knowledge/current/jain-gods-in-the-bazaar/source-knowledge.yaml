- sk_id: sk_jgb_0120
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - what is required from critique in this context is not so much the condemnation or censorship of particular
    kinds of images, which chiefly serves to shore up their power
  concept_label: condemning_an_image_publicly_can_increase_the_power_it_is_condemned_for
  label_origin: extractor_assigned
  claim: 'Jain argues that speech about an image is itself performative, so that critique is not a neutral
    observation of an image''s power but an intervention in it: "the very act of paying attention to an
    image and framing it in a particular way is an encounter or actualization that changes the character
    of the image." She draws the practical consequence for how to respond to images one objects to: what
    is required "is not so much the condemnation or censorship of particular kinds of images, which chiefly
    serves to shore up their power and efficacy, but a creative, expropriative reframing within the context
    of alternative narratives." She restates it in the Conclusion, noting that the forces she opposes
    "are strengthened by the secular mistrust of all forms of contemporary religiosity, for ... discourses
    about the power of images themselves have a certain political effect, setting up images as channels
    for political energies in the public arena."

    '
  claim_type: source_interpretation
  interpretation_basis: 'Built from performativity theory (Butler, Sedgwick) and from the author''s reading
    of the 1990s Indian episodes in her chapter 6. It is presented explicitly as a position she is arguing
    for, and chapter 7 is offered as her own attempt to practise it — "an experiment in applying the approach
    to images outlined above to the writing of cultural critique."

    '
  mechanism:
    stated_by_source: true
    text: 'If an image''s efficacy is partly constituted by imagined collective investment (see sk_jgb_0110),
      then any act that publicly marks the image as significant — including condemning it — adds to the
      investment it is trying to remove. Attention is the resource, and condemnation spends it on the
      target.

      '
  scope:
    domain_discussed_by_source:
    - critique
    - image_politics
    - method
    conditions: 'Advanced for mass-cultural images in a public sphere where the efficacy of images is
      itself a live public discourse. Jain''s cases are Indian and from the 1990s.

      '
  caveats:
  - text: this is an argued position in cultural criticism, not a demonstrated causal result. No case
      is presented in which condemnation was shown to increase an image's power, and no counterfactual
      is offered
    origin: extractor_observed
  - text: the author is explicit that her own chapter 7 is 'unapologetically indexing a certain will to
      power' and is a 'counterpropagandist gesture'. She is not claiming neutrality and neither should
      any use of this object
    origin: source_stated
