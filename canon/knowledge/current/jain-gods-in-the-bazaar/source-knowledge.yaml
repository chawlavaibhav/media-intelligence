- sk_id: sk_jgb_0040
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - accuracy in following them is a particularly stringent requirement
  - the production of locality
  concept_label: regional_iconographic_codes_are_the_main_ground_of_rejection_and_are_produced_from_elsewhere
  label_origin: extractor_assigned
  claim: 'Jain reports, from artists, printers, distributors and clients alike, "a well-defined regional
    iconography characterizing preferences in the north, south, east, and west," operating not only at
    the level of which deities are favoured but at the level of their iconographic attributes and formal
    treatment. Her enumerated examples: Lakshmi and Shiva preferred standing in the north and seated in
    the south; the eyes of Shiva and Hanuman wide open in the south and often half-closed in the north;
    Ganesh''s ears and trunk longer in the north and his face paler in Bengal; Lakshmi accompanied by
    an owl in Bengal and nowhere else; Radha often portrayed with her garments askew in the north while
    in Bengal all goddesses are covered to the point that even their ears are hidden. She states the operational
    consequence directly: artists develop a thorough knowledge of these codes, "as accuracy in following
    them is a particularly stringent requirement; most cited this as THE MAIN AREA WHERE THEY MIGHT BE
    ASKED TO MAKE CHANGES BEFORE A DESIGN IS APPROVED TO GO TO PRESS." She adds a second finding: because
    the codes are conventionalised, an artist need not inhabit or identify with the community whose images
    he or she is producing — enabling the "production of locality" from dispersed sites, or as she puts
    it, its commoditisation.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Once a regional preference is codified into a finite list of attributes, it becomes transferable
      knowledge rather than lived membership. The artist can then satisfy it from anywhere, which is why
      Jain finds Venkatesh Sapar in Sholapur creating the Durgas and Krishnas that represent Bengaliness,
      Nirmala in Calcutta painting a "northern" Shiva-Parvati, and Yogendra Rastogi in Meerut figuring
      a south Indian identity through his Lakshmis.

      '
  scope:
    domain_discussed_by_source:
    - indian_calendar_art
    - regional_markets
    - iconography
    conditions: 'The pan-national Sivakasi-centred trade as observed 1994-2001. Jain notes the same conventions
      are mapped onto a discourse of taste — Bengali taste considered the most refined and softest in
      colour, northern and western markets preferring lighter colours, the most intense schemes used for
      the south.

      '
  caveats:
  - text: the enumerated attribute-level differences are reported from informants, not from a survey of
      prints. Jain does not count them or test whether the prints in fact conform
    origin: extractor_observed
  - text: '''most cited this as the main area where they might be asked to make changes'' is the strongest
      operational statement in the object and is also unquantified — ''most'' of an unnamed number of
      artists'
    origin: extractor_observed
  - text: the taste discourse ('Bengali taste is the most refined') is a trade stereotype the industry
      holds, reported as such. It is not the author's finding about Bengali viewers and must not be read
      as one
    origin: extractor_observed
  - text: the same section records that the participation of Muslim artists in this Hindu-dominated imagery
      has been characterised by degrees of 'passing' — Liaqat Ali's major input to paintings signed by
      Rastogi goes unsigned, and Muslim artists who do sign have adopted names that are not easily identifiable.
      The transferability of the codes is real and it is not evidence of communal difference being erased
    origin: source_stated
  - text: 'Adjacency to sk_jgb_0050 recorded without a graph edge: the commoditisation of difference.
      The original extraction used a ''supports'' relation, which SPEC-03 does not define; no permitted
      relation expresses it from this object''s side, so it is kept as an observation rather than expressed
      as a fabricated edge.'
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: Field-attested from multiple
      roles in the industry, unquantified throughout.'
    origin: extractor_observed
  source_stated_problems:
  - regional iconographic inaccuracy is the most common cause of a design being sent back before press
  source_stated_remedies:
  - learn the regional attribute codes as explicit transferable knowledge rather than relying on membership
  examples:
    positive:
    - fig. 28, a 1995 Lakshmi for the Bengali market by V. V. Sapar of Sholapur
