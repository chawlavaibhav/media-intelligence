- sk_id: sk_jgb_0030
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - sukomal
  - we people avoid muscles
  - lila
  - It looks ridiculous!
  concept_label: the_iconographic_injunction_against_muscularity_and_why_action_scenes_break
  label_origin: extractor_assigned
  claim: 'Jain documents a specific and consequential production constraint, attested from several independent
    practitioners. Indra Sharma: "Now the body is very strong, but we will not show the anatomy. For god''s
    body, the description is of a gentle, beautiful (sukomal) body. . . . There won''t be any muscles,
    we people avoid muscles." The expressions must likewise be tranquil, almost meditative. Jain reports
    the reason given: divine agency in the Vaishnava schema is a matter of lila, sacred play, not of labour
    — Ram Waeerkar, first illustrator of the Amar Chitra Katha comics, "Bhagwan Krishna, Prabhu Ram .
    . . they have succeeded in fighting, but they are not fighters." She then reports the consequence
    the artists themselves run into: attempting to depict action and bodily agency within these constraints
    "render[s] irreconcilable the differences between narrative ''realism'' and sacred textual imperatives,"
    and quotes Waeerkar''s verdict on the result: "It looks ridiculous!"

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Where power is held to emanate from a transcendent source rather than from a body, visible
      bodily force is not a sign of power but a contradiction of it. Musculature and wide-eyed alertness
      are the visual signature of instrumental human agency; applying them to a figure whose agency is
      defined as non-instrumental produces an image that is internally inconsistent, which is why the
      failure shows up precisely in scenes of action.

      '
  scope:
    domain_discussed_by_source:
    - indian_calendar_art
    - iconography
    - comics
    - cinema
    conditions: 'Stated for Vaishnava iconography in bazaar images as practised through the period of
      the fieldwork, and reported by Jain as extending to the cinema — she cites N. T. Ramarao saying
      "I realized that keeping a muscular body won''t be nice, particularly for a character like Krishna
      ... I took to pranayam and gave up physical exercises." Jain also records exceptions inside the
      schema: some muscularity is not inappropriate for Shiva given his association with tapasya, and
      Hanuman is muscular throughout.

      '
  caveats:
  - text: 'the constraint is NOT permanent, and the source''s chapter 7 is about its breach: from the
      late 1980s a muscular, aggressive Ram appears in bazaar prints in confluence with the Ramjanmabhumi
      movement, and a muscular Krishna follows. An extraction that presented the injunction as a standing
      rule would contradict the source''s own argument'
    origin: source_stated
  - text: the injunction is reported as textual, but Jain notes that where textual prescriptions conflict
      with plausibility the prescriptions win, and where the texts are silent artists improvise — Waeerkar
      had to depict horse-riding in the Mahabharata despite history dating its introduction later
    origin: source_stated
  - text: 'INSPECTED AND CONFIRMED. Fig. 93, Ram Ravan Yuddha (printed p. 195), was rendered and read
      directly. Ram and Lakshman are drawing bows in the middle of a battle and their eyes are half-lidded
      and their faces serene, their bodies smooth and unmuscled, against a ten-headed Ravan in an agitated
      posture. Fig. 140 (printed p. 327) was also inspected: a strongly muscled Hanuman flies above a
      soft, unmuscled, seated Ram and Lakshman. Both descriptions hold exactly'
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: Multiply attested from independent
      practitioners and confirmed against the artefacts. Its historical stability is explicitly denied
      by the source''s own chapter 7.'
    origin: extractor_observed
  source_stated_problems:
  - depicting action through a body whose agency is defined as non-instrumental produces an internally
    inconsistent image
  source_stated_remedies: []
  examples:
    positive:
    - fig. 93, Ram Ravan Yuddha by Mukesh, print by S. S. Brijbasi
    - fig. 140, Lakshaman Shakti by Mukesh, muscular Hanuman above unmuscled Ram and Lakshman
