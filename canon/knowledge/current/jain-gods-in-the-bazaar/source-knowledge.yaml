  source_id: jain_gods_in_the_bazaar
  source_terms:
  - See here, sir, [god] isn't looking at us, and if he is not looking at us how will he bestow benevolence
    on us (kripa kaise karenge)?
  - Bold colors, bold figures, front looking - these are the most important things.
  concept_label: the_frontal_gaze_as_a_functional_requirement_that_overrides_depicted_action
  label_origin: extractor_assigned
  claim: 'Jain records, from the Meerut calendar artist Yogendra Rastogi, an explicit production constraint
    and the reason given for it: the figure must look out of the frame at the viewer, whatever the figure
    is doing. Rastogi''s examples are secular as well as divine — a woman putting on a slipper for a footwear
    advertisement, a woman rolling a beedi, a woman washing clothes for a soap advertisement, "she has
    to look at you"; "that child who is studying, if he''s reading his eyes will be downcast, and if his
    eyes are downcast the calendar will not sell." The stated reason is devotional: a viewer will say
    that if the deity is not looking at us it cannot bestow benevolence. Jain reports the corresponding
    compositional consequence — an intense emphasis in calendar art on the face and eyes, with eyes typically
    painted last as part of the "finishing" strokes.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Darshan is a two-way seeing: the devotee must not merely see the deity but BE SEEN by it in
      order to receive its blessing. An image in which the figure''s gaze is directed inside the depicted
      world cannot support that exchange, because the second direction of the look is missing. Frontality
      is therefore not a stylistic preference but the condition on which the image can do the thing it
      is bought to do — which is why it overrides the naturalistic requirement that a figure look where
      its action is directed.

      '
  scope:
    domain_discussed_by_source:
    - indian_calendar_art
    - bazaar_prints
    - devotional_image_use
    conditions: 'Stated for the Indian calendar and framing-picture industry as the author encountered
      it, 1994-2001, and for images intended to circulate in the bazaar. Jain is careful that this is
      partly a DISCURSIVE category: "these imperatives of the bazaar are not always or necessarily reflected
      in the images themselves: these are primarily discursive categories, part of the bazaar''s self-understanding."
      She then says there IS in fact an intense emphasis on face and eyes, so the practice as well as
      the discourse is attested.

      '
  caveats:
  - text: Jain states in the same passage that the imperative is 'not always or necessarily reflected
      in the images themselves' and is 'part of the bazaar's self-understanding'. Reporting it as an observed
      universal of the artefacts would go further than she does
    origin: source_stated
  - text: the reason given is a practitioner's account of what HIS CUSTOMERS believe. No consumer study
      supports it. The constraint is well attested as a constraint the industry works under; the belief
      attributed to consumers is reported, not measured
    origin: extractor_observed
  - text: INSPECTED AND CONFIRMED. Fig. 92, the 1969 'Television' calendar (printed p. 193), was rendered
      and read directly. The woman is reclining in front of a television showing a cricket match, and
      her face is turned frontally out of the frame while the screen is to her side — she is watching
      the match out of the corner of her eye, exactly as the caption states. The constraint is visible
      in the artefact, not merely asserted
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: The constraint is directly attested
      from practitioners and visible in the artefacts. The reason given for it is a practitioner''s theory
      of his customers and is not evidenced.'
    origin: extractor_observed
  source_stated_problems:
  - a figure whose gaze follows its depicted action cannot support the two-way look the image is bought
    for
  source_stated_remedies:
  - turn the face frontally to the viewer even where the depicted action would direct it elsewhere
  examples:
