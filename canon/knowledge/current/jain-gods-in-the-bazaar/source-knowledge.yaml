  concept_label: realism_adopted_as_a_technique_and_detached_from_the_worldview_that_carried_it
  label_origin: extractor_assigned
  claim: 'Jain reports Geeta Kapur''s observation, and builds on it, that "realism" was construed in nineteenth-century
    Indian discourse "to mean an ENABLING TECHNIQUE rather than a philosophically accredited style of
    representation within a specific historical context." She draws the distinction out: there is a difference
    between naturalist TECHNIQUES — perspective, anatomy, modelling, the rendering of light and shadow
    — and the institutionally sanctioned "post-sacred" schemata of signification through which they entered
    the colonial context: romanticism and the picturesque, neoclassicism, bourgeois realism, ethnographic
    documentation. The techniques were taken up; the schemata largely were not. She records the vernacular
    word some artists used instead of the English "realism" — sajivta, "livingness" or "lifelikeness"
    — and states what it puts at issue: "at issue here is not the reality of the gods, but how alive they
    are: how the image brings them to life."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A technique and the worldview that historically carried it are separable, because a technique
      is a way of making marks and a worldview is a set of commitments about what marks are for. Where
      the receiving context has its own commitments, the technique can be adopted to serve those instead.
      Jain''s instance: naturalist modelling was taken up not in its techno-rationalist aspect but in
      its "personalizing, affective, libidinal aspect, making the divine accessible to devotees as an
      empathetic presence."

      '
  scope:
    domain_discussed_by_source:
    - art_history
    - colonial_encounter
    - indian_popular_imagery
    conditions: 'Nineteenth and twentieth century Indian commercial image-making, principally chromolithography,
      Nathdwara and the calendar industry.

      '
  caveats:
  - text: Jain positions this against Christopher Pinney's account of a 'naturalist blip' between 1878
      and 1927 and against readings that align naturalism with disenchantment. She is arguing with named
      colleagues, and the object should be read as her position in a live scholarly disagreement rather
      than as settled fact
    origin: source_stated
  - text: the separability claim is historical and interpretive. No mechanism is tested; the evidence
      is the pattern of what was and was not adopted
    origin: extractor_observed
  - text: 'the same chapter shows the separation is not clean in practice: artists trained in anatomy
      report frustration at being unable to use it, and ''realism'' in their discourse is, in Jain''s
      words, ''an often contradictory, highly overdetermined term'''
    origin: source_stated
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: Advanced explicitly against other
      scholars'' positions; the source marks the disagreement.'
    origin: extractor_observed
