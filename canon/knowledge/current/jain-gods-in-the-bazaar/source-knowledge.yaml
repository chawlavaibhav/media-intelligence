- sk_id: sk_jgb_0110
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - the popularity of popularity, a meta-popularity
  - a triangulation ... between the image, the viewer, and the viewer's sense of what others see
  concept_label: publicness_itself_adding_value_to_an_image_through_an_imagined_third_partys_gaze
  label_origin: extractor_assigned
  claim: 'Jain argues, drawing on Michael Warner and René Girard, that iconic figures in a mass-mediated
    public sphere take on a distinctive "logic of appeal" through the value embodied in publicity itself:
    after a point it is not the figure''s attributes that matter but the very fact of its popularity —
    "the popularity of popularity, a meta-popularity." The operation is triangular, "between the image,
    the viewer, and the viewer''s sense of what others see, think, and feel," so that desire for the icon
    "is enhanced, even produced, by witnessing — or, crucially, even just imagining — the intensity and
    desire of others." She then states the corollary that gives the object its force: because presentation
    before the public gaze is what renders an image valuable and powerful, "by the same token it also
    renders them vulnerable to disinvestment," and desecration becomes a site of violence.

    '
  claim_type: source_interpretation
  interpretation_basis: 'The theoretical apparatus is Warner''s and Girard''s; the application to Indian
    bazaar images, and the linkage to the "aesthetics of presence" and to desecration, are Jain''s synthesis.
    She presents it as her contention — "I want to suggest that a similar notion of a triangulated gaze
    informs..."

    '
  mechanism:
    stated_by_source: true
    text: 'Where value is imputed to an object rather than produced by an identifiable maker, an individual
      viewer cannot verify it alone; the viewer infers it from what others appear to invest. Mass mediation
      makes that inference cheap and continuous, so publicness becomes self-reinforcing. The same structure
      runs in reverse: an object whose value rests on imagined collective investment can be attacked by
      attacking that investment publicly.

      '
  scope:
    domain_discussed_by_source:
    - mass_media
    - political_iconography
    - image_efficacy
    conditions: 'Developed for public images in India, with the political examples drawn from the 1990s
      — principally the Shiv Sena''s actions and the case brought against M. F. Husain in 1996.

      '
  caveats:
  - text: this is a theoretical claim illustrated by cases, not a measured effect. No quantitative work
      on image popularity or desecration is reported
    origin: extractor_observed
  - text: the mechanism is drawn from Euro-American theory (Warner on Reagan, Girard on mimetic desire)
      and applied to a different setting; Jain argues the application, but the underlying mechanism is
      not independently established here
    origin: extractor_observed
  - text: the desecration corollary is illustrated by episodes of real political violence. It should not
      be handled as a marketing observation
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: Theory plus illustrative cases;
      no measurement.'
    origin: extractor_observed
  source_stated_problems: []
