- sk_id: sk_jgb_0050
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - vernacularizing capitalism
  - the commodification of cultural difference
  - a difference-eating machine
  concept_label: capitalist_expansion_thriving_on_difference_rather_than_erasing_it
  label_origin: extractor_assigned
  claim: 'Jain''s central structural argument is that the spread of centralised commodity manufacture
    into "vernacular" constituencies is a TWO-WAY process, which she calls vernacularizing capitalism:
    the incorporation of vernacular constituencies into a regnant capitalist order on one side, and the
    protean adaptation of capital''s axiomatics to varying local circumstances on the other, producing
    multiple cultures of capitalism rather than one. Her evidence is the calendar industry''s own mechanics:
    a centralised offset economy of scale in Sivakasi combined with local letterpress overprinting for
    personalisation, mobile self-employed agents, home-based artists, and annually refreshed catalogue
    "files" segmented by religion and region. She states the consequence against the cultural-imperialism
    thesis directly: "the industry has thrived on the commodification of cultural difference," and in
    the Conclusion, "capital in its reterritorializing aspect thrives on difference: it is a difference-eating
    machine."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Difference is not friction for this kind of expansion, it is the product. A centralised press
      that can run any design at the same unit cost, plus a local process that personalises each run,
      lets a single industrial system address many segments without homogenising them — indeed it creates
      an incentive to maintain and refine the segmentation, because segmentation is what the catalogue
      sells.

      '
  scope:
    domain_discussed_by_source:
    - political_economy_of_culture
    - print_industry
    - globalisation
    conditions: 'Grounded in the Indian calendar industry 1994-2001 and in the historical bazaar formation.
      Jain says the analysis "should also be pertinent to thinking about the cultures of capitalism more
      generally", but that extension is offered as a suggestion, not demonstrated.

      '
  caveats:
  - text: the general claim about capitalism is proposed rather than shown; the demonstration is one industry
      in one country over roughly seven years of fieldwork
    origin: extractor_observed
  - text: Jain explicitly refuses to romanticise the vernacular arena. She states that the bazaar ethos,
      'while subaltern in relation to the regnant style of capitalist expansion, is a hegemonic formation
      in itself and therefore should not be romanticized in the name of the popular'. An extraction that
      read this as celebration of local resistance would invert her argument
    origin: source_stated
  - text: Sivakasi's cost advantage rests substantially on de-mechanisation and informal piece-rate labour,
      and Jain records that the match industry there has been 'notoriously dependent on its exploitation
      of child labor' and that all three of its major industries remained largely untouched by occupational
      health and safety in the late 1990s. The mechanism being described has this cost and the source
      names it
    origin: source_stated
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: Well grounded for the industry
      studied; the generalisation beyond it is proposed.'
    origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
