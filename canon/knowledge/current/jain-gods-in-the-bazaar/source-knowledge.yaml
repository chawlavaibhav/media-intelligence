  source_terms:
  - the aesthetics of presence
  - if an icon is not produced in accordance with iconographic prescriptions it will not 'work'
  concept_label: iconographic_correctness_as_the_precondition_on_which_the_image_is_held_to_function
  label_origin: extractor_assigned
  claim: 'Jain reports Richard Davis''s "aesthetics of presence" — the idea, informing most icon worship
    in South Asia since the medieval period, that the icon is a privileged housing for the divine essence,
    an embodiment as much as a signifier — and states the operational consequence that follows in both
    temple practice and the bazaar: "if an icon is not produced in accordance with iconographic prescriptions
    it will not ''work'' (that is, it will not accrue efficacy, value, and power) — or worse, it will
    have the opposite effect, becoming inauspicious and bringing bad fortune." She records a printer''s
    version of the reasoning, that South Indians prefer seated Lakshmis because "if she sits down, wherever
    you keep the calendar, the god or goddess will stay in that place," and draws out the triangulation
    it implies: before the deity can look at the worshipper through an image, it must first recognise
    itself in it and decide to inhabit it.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Where an image is held to house rather than depict, correctness is not a quality criterion
      but an enabling condition: an inadequate depiction is not a worse image but a vacant one. This is
      why iconographic error is treated in this trade as a functional failure rather than an aesthetic
      shortcoming, and why it, rather than beauty, is what a design is sent back for.

      '
  scope:
    domain_discussed_by_source:
    - devotional_image_use
    - iconography
    - image_efficacy
    conditions: 'South Asian icon worship as reported from Davis, and the calendar trade as observed by
      the author. Jain notes the corresponding rhetoric in the industry and attributes the belief to imagined
      others — the printer says "they believe" of the southern market.

      '
  caveats:
  - text: 'Jain marks the attribution structure herself: the printer imputes a literalist belief to consumers,
      just as the schema imputes a literalist gaze to the deity. She writes that ''in order for this formulation
      to work it is necessary for the deity''s gaze to be imputed with a certain literalism''. The belief
      is reported at one remove throughout and is not observed directly in any consumer'
    origin: source_stated
  - text: no consumer study supports the claim that buyers reject iconographically incorrect images. What
      is attested is that the TRADE behaves as though they will
    origin: extractor_observed
  - text: the mechanism explains why sk_jgb_0040 finds iconographic accuracy to be the main ground of
      pre-press rejection; the two objects should be read together
    origin: extractor_observed
  - text: 'Adjacency to sk_jgb_0040 recorded without a graph edge: why accuracy is enforced so stringently.
