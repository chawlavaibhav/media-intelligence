- sk_id: sk_jgb_0020
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - chatkile bhatkile
  - Whether or not your gaze wants to go there it still goes.
  - retouching is not about faithful reproduction
  concept_label: colour_saturation_as_a_public_claim_on_attention_and_a_convention_that_outlived_its_technical_cause
  label_origin: extractor_assigned
  claim: 'Jain documents, from first-hand observation of the Sivakasi presses, the technique that produces
    the characteristic look of these prints: extensive MANUAL retouching of colour-separated negatives
    at the pre-press stage — brushing on photo opaque and pink wash and scratching off emulsion, for anything
    from two to twenty hours per separation — plus the use of two blue and two red plates in addition
    to yellow and black, to achieve maximum saturation, tonal contrast and strong highlights. She states
    the finding plainly: "retouching is not about faithful reproduction but primarily indexes the printers''
    perceptions of what they think their audience wants." She records the practitioners'' own account
    of the effect — Indra Sharma on gaudy, distracting (chatkile bhatkile) colours: "whether or not your
    gaze wants to go there it still goes" — and Jain''s own reading, that the bright colours of the framing
    picture are "clamorous, ''shouting'', attracting the gaze away from its ''regular work'': in other
    words, forcing the divine presence into the public arena."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Saturation and contrast are a claim on attention made from outside the viewer''s current task.
      The image is not waiting to be looked at; it interrupts. Jain ties this to the public/private distinction:
      it is not the sacredness of the icon that marks it as "popular" taste but its public claim for attention,
      indicated by this use of colour.

      '
  scope:
    domain_discussed_by_source:
    - print_production
    - colour
    - sivakasi_industry
    conditions: 'The Sivakasi offset industry as observed 1994-2001, for calendars and framing pictures
      aimed at the pan-national "English market". Jain records that the association is stronger for framing
      pictures than for calendars, on Venkatesh Sapar''s account.

      '
  caveats:
  - text: 'THE MOST IMPORTANT PART OF THIS OBJECT IS THAT THE PRACTICE OUTLIVED ITS OWN JUSTIFICATION.
      Jain records a technical explanation for retouching — compensating for poor filters, insensitive
      film, uneven lighting — and then reports that it does not hold: ''now that many printers have gone
      digital, they are using computer software such as Photoshop to achieve similar effects, even though
      digital scanning can produce perfect color separations.'' What started as a technical solution became
      a genre convention. This is a documented case of a production convention persisting after the constraint
      that produced it disappeared'
    origin: source_stated
  - text: the effect on viewers is a practitioner theory plus the author's reading. No attention measurement
      of any kind is reported. The PRACTICE is observed; the EFFECT is not
    origin: extractor_observed
  - text: the artists themselves uniformly denigrate these colours as 'cheap', 'shouting', 'thick' or
      'gaudy', and several complained that the printers changed their original colours entirely. The convention
      is not the artists' preference; it is imposed downstream of them
    origin: source_stated
  - text: INSPECTED AND CONFIRMED. Fig. 88 (printed p. 185) shows a printed Sapar Brothers Hanuman beside
      the original painting it was made from. The print is visibly more saturated, higher in contrast
      and more luminous in its golds than the painting. The effect of the retouching stage is confirmed
      directly by comparing the two, not taken from the caption
    origin: extractor_observed
  - text: 'Adjacency to sk_jgb_0010 recorded without a graph edge: the same interruption, performed by
      colour instead of by gaze. The original extraction used a ''supports'' relation, which SPEC-03 does
      not define; no permitted relation expresses it from this object''s side, so it is kept as an observation
      rather than expressed as a fabricated edge.'
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: The production practice is directly
      observed and described in unusual technical detail. The account of why it exists is the practitioners''
      and the author''s, and is not measured.'
    origin: extractor_observed
  source_stated_problems:
  - an image competing for attention against a viewer's ongoing work has to interrupt it
  source_stated_remedies:
  - raise saturation and contrast beyond what reproduction fidelity would require
