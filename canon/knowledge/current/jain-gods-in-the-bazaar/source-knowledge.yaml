- sk_id: sk_jgb_0160
  source_id: jain_gods_in_the_bazaar
  source_terms:
  - a marked iconographic shift
  - ugra
  concept_label: a_dated_documented_breach_of_an_iconographic_canon_and_the_route_it_took
  label_origin: extractor_assigned
  claim: 'Jain revisits Anuradha Kapur''s account of a marked iconographic shift in popular imagery from
    depictions of Ram as soft, smooth-bodied, almost pudgy, smiling, benign, gentle and tranquil, to muscular
    versions whose mood is predominantly ugra — "angry, exercised . . . punishing" — emphasising his bow
    and arrows as weapons rather than as iconographic markers, appearing from the late 1980s in confluence
    with the Ramjanmabhumi movement. Jain accepts the shift as real and dateable but rejects Kapur''s
    explanation of it as a consequence of colonial "realism," arguing instead that it was ENABLED by the
    one figure for whom musculature had long been acceptable: Hanuman, whose muscular body posed no threat
    to the location of agency in Ram because it was framed as that of an animal, a devotee and a servant.
    Jain proposes Hanuman as the site at which muscularity was naturalised in the expressive vocabulary
    of bazaar artists and thence became available for extension to other deities, noting that a muscular
    Krishna followed the muscular Ram.

    '
  claim_type: source_interpretation
  interpretation_basis: 'The shift and its dating are Kapur''s and are accepted by Jain. The explanation
    — the Hanuman route, and the reading of the change as a shift in what male power is signalled by rather
    than as an increase in violence — is Jain''s own counter-argument, advanced explicitly against Kapur''s
    "humanization" narrative and in dialogue with Pinney''s objection to physiognomic readings.

    '
  mechanism:
    stated_by_source: true
    text: 'A canon does not open at the point of greatest resistance. It opens where a licensed exception
      already exists: Hanuman''s muscularity was permitted because it was subordinated — animal, devotee,
      servant — so painting it did not violate the schema. Once the vocabulary was routine for one figure,
      extending it required no new capability, only a new permission.

      '
  scope:
    domain_discussed_by_source:
    - iconography
    - hindu_nationalism
    - mass_culture
    conditions: 'Indian bazaar prints from the late 1980s, in the context of a specific political movement.
      Jain notes that calendar Hanumans "have not always been muscular" either, so the enabling figure
      is itself the product of a change.

      '
  caveats:
  - text: THIS OBJECT IS THE COUNTERWEIGHT TO sk_jgb_0030 AND MUST TRAVEL WITH IT. The iconographic injunction
      against muscularity is real, multiply attested, and was breached within living memory. Any use of
      the injunction as a timeless rule is refuted by this object, and any use of the breach as evidence
      that the injunction was never real is refuted by the other
    origin: extractor_observed
  - text: the Hanuman route is a proposal, offered as 'worth examining' and as a narrative Jain generates
      in an explicitly rhetorical mode. She writes that chapter 7 is 'an experiment' and that its narrative
      'unapologetically indexes a certain will to power'. This is the least evidentially secure object
      in the record and is retained because the shift itself is well attested even where the explanation
      is not
    origin: source_stated
  - text: the material is inseparable from a history of communal violence. It is extracted as iconographic
      history and carries no implication about any community
    origin: extractor_observed
  - text: INSPECTED. Fig. 138 (Jai Shri Ram janmabhoomi campaign sticker, printed p. 321) and fig. 140
      (Lakshaman Shakti, printed p. 327) were rendered and read directly. The muscular striding Ram of
      the campaign sticker and the muscular Hanuman above the unmuscled Ram of the Brijbasi print are
      both as described, and the contrast between them and fig. 93 is stark
    origin: extractor_observed
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
