  label_origin: extractor_assigned
  claim: 'Jain reports that consumers of these images choose by SUBJECT, not by artist: "clients, and
    their customers in turn, are primarily interested in the ''subject'' of a calendar and are unconcerned
    about other issues of provenance," artists'' names "almost never register in conversations between
    publishers and their clients," and most end-users could not name any calendar artist beyond Ravi Varma.
    She quotes an Old Delhi pharmaceuticals trader: "I have no relation with the artist, I have a relation
    with the picture." She then reports the production constraint this creates. Customers often want a
    picture of the same deity year after year, so artists and printers are obliged to supply a constant
    stream of "new" designs on the "same" subjects, while iconographic recognisability limits what can
    change. She quotes a Sivakasi printer: "mythological means gods. In that we cannot change anything.
    Only colors we can change, dress we can change. Subject means same." And J. P. Singhal: "whatever
    change there is, it''s in the decoration."

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'If the thing being bought is the subject and the subject is fixed by iconographic convention,
      then the axis along which a producer can differentiate is narrow by construction. Novelty is therefore
      forced into the residual dimensions — background, colour, dress, ornament — which is why the industry
      recycles existing designs with modifications in exactly those, and why "copy masters" exist as a
      role.

      '
  scope:
    domain_discussed_by_source:
    - calendar_industry
    - authorship
    - iconography
    conditions: 'Religious calendars in the Indian trade 1994-2001. Jain notes the constraint is looser
      for secular subjects, for the upmarket multi-sheet calendars, and for wedding and greeting cards,
      "where the demand for novelty often outweighs considerations of expense, allowing for a greater
      degree of creative risk taking."

      '
  caveats:
