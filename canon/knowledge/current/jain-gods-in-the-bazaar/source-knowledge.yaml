  source_id: jain_gods_in_the_bazaar
  source_terms:
  - advertising agencies in India - the new Ravi Varmas, if you will
  - markers of difference within a universalizing matrix
  concept_label: post_liberalisation_difference_as_content_grafted_onto_a_universal_template
  label_origin: extractor_assigned
  claim: 'In her Conclusion Jain describes what she sees replacing the older arrangement after economic
    liberalisation: "there appears to be a double movement at work, such that one set of processes creates
    identifiable symbols of cultural identity while another lays down the universal ground within which
    these markers of difference operate." She names the mechanism in the trade: "advertising agencies
    in India — the new Ravi Varmas, if you will — often use proprietary analytical models from their parent
    companies overseas, filling in the blanks with content specific to Indian market segments." She reports
    the corresponding narrowing of what "culture" is taken to mean: circumscribed, globally portable signs
    of heterogeneity — language, dress, food, music, art, rituals, festivals — grafted onto the protocols
    of a putatively universal modernity, which allows cultural difference to be relegated to leisure and
    harnessed to niche marketing.

    '
  claim_type: source_interpretation
  interpretation_basis: 'Jain''s own reading of the post-liberalisation period, built from her 2001 return
    visits to Sivakasi and from observation of the media landscape. She marks it as interpretation, offering
    it as what "appears to be" under way.

    '
  mechanism:
    stated_by_source: true
    text: 'A universal analytical template with local content slots produces difference that is real at
      the level of content and absent at the level of structure. Because the template is what determines
      which differences are askable about, the differences that survive are exactly those the template
      can hold — which is why they converge on portable markers like dress, food and festivals.

      '
  scope:
    domain_discussed_by_source:
    - post_liberalisation_india
    - advertising
    - globalisation
    conditions: 'Written from observation up to roughly 2004-2006 and published 2007. Jain''s evidence
      is the transformation of one named Sivakasi firm (Srinivas Fine Arts) between her 1990s and 2001
      visits, plus the media landscape she describes.

      '
  caveats:
  - text: SEVERE FRESHNESS RISK. This is a description of a media and advertising landscape as of roughly
      2001-2006. It predates the Indian smartphone and streaming eras entirely. It is retained as a historical
      characterisation of a transition, not as a description of the present
    origin: extractor_observed
  - text: the generalisation rests on one firm's transformation observed at two points, plus the author's
      reading of television, cinema and print. It is an impression carefully drawn, not a study
    origin: extractor_observed
  - text: Jain herself insists the process does not mean the demise of vernacular economies, and gives
      the cable-television 'last mile' as a counter-case where informality persisted and shaded into criminality.
      An extraction that took only the homogenising half would misreport her
    origin: source_stated
  - text: 'Evidential assessment recorded by the extractor, moved here from evidence.source_uncertainty
      when that field was returned to its controlled SPEC-03 vocabulary: An interpretive characterisation
      of a period, drawn from limited but well-chosen observation.'
