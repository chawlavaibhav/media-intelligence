  rationale: 'Jain documents a distinction this project''s evaluation work needs and does not currently
    have a name for: the difference between a criterion that grades an artefact and a criterion that determines
    whether the artefact functions at all. In this tradition iconographic correctness is the second kind
    — an incorrect icon is not held to be a worse image but a vacant one — and the industry''s behaviour
    follows: artists reported iconographic accuracy as the main thing they are asked to change before
    a design goes to press, ahead of any question of quality. Whether a given inspection criterion is
    enabling or grading is directly answerable about a criterion, and it changes how a failure on it should
    be reported.

    '
  observation_unit: whole_asset
  applicability:
    when: designing or interpreting an inspection criterion, to establish whether failing it makes the
      asset worse or makes it unusable
    limits: 'The source establishes that the TRADE behaves as though correctness is enabling. It does
      not establish that buyers reject incorrect images — no consumer study is reported, and Jain marks
      the belief as imputed to consumers by printers, at one remove. The binding supports asking which
      kind of criterion is in play; it licenses no pass mark, no threshold, and no claim that any particular
      criterion in this project is of the enabling kind.

      '
  evidence_basis: derived_from_source
  empirical_refs: []
