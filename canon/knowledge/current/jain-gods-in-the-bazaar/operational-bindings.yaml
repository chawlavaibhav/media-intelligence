  repair_ontology_refs: []
  role_note: 'The extraction carried `constrains, informs`. `informs` is not a SPEC-04 role and is removed;
    `constrains` is retained because it is exactly right and was verified first-hand: two requirements
    of this idiom - the returned gaze and the non-muscular divine body - are stated as constraints by
    the practitioners subject to them and were confirmed against the plates in this pass. Nothing else
    about the binding changes.'
- binding_id: bnd_jgb_0005
  source_knowledge_refs:
  - sk_jgb_0180
  - sk_jgb_0090
  source_system_refs:
  - scs_jgb_002
  target_type: governance
  target_path: null
  role:
  - flags
  rationale: 'Jain provides a clean, self-documented case of a class of evidence this project will increasingly
    rely on and currently has no standing treatment for: what practitioners say about their own practice
    and their own audience. She states that such accounts are "narratives, produced largely for my benefit";
    she identifies her own self-introduction as the probable trigger for a whole rhetorical register;
    and she then demonstrates the productive use of the bound, deriving a finding precisely from the gap
    between what informants said about their audience and what they visibly did. The shape — treat practitioner
    testimony as evidence of what practitioners say, look for the gap between saying and doing, and record
    who was asking — is directly transferable.

    '
  applicability:
    when: collecting or interpreting practitioner testimony about practice, audience or outcome
    limits: 'This is a methodological posture drawn from one ethnography, not a validated protocol. It
      supports naming the class of evidence and looking for say/do gaps. It supplies no instrument, no
      sampling rule and no way of deciding when testimony is reliable. It must not be read as a reason
      to discount practitioner evidence: Jain''s own strongest findings are built from it.

      '
