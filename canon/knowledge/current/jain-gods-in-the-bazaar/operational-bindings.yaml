  rationale: 'Jain documents a fully worked case of a production convention that outlived the constraint
    which produced it. Manual retouching of colour separations began, on one account, as compensation
    for poor filters, insensitive film and uneven lighting; when the industry went digital and scanning
    could produce perfect separations, printers kept achieving the same effect in software. The technical
    justification had lapsed and the practice had not. This project will accumulate production conventions
    of its own, some of which will be responses to constraints that later disappear, and this is a documented
    instance of the failure shape with the mechanism visible.

    '
  applicability:
    when: auditing a production convention whose original justification may no longer hold
    limits: 'One industry, one technology transition, observed by one researcher. It supports asking of
      a convention whether its cause still exists, and it supplies a name for the failure. It supports
      no claim about how often conventions outlive their causes, no test, and no threshold. Note that
      the source does NOT say the convention became wrong when its cause lapsed — she says it became a
      genre feature, which is a different thing.

      '
  governance_consumer: evidence_interpretation
