  rationale: 'Jain identifies, and states precisely, a structural reason why one commonly used signal
    is not evidence of what it appears to be evidence of. Because these calendars are advertisements given
    away rather than goods bought, the catalogue''s contents index what publishers think will interest
    clients, which indexes what clients think will please their customers AND how those clients want to
    be seen. This project reasons from demand-shaped artefacts — briefs, buyer postings, order histories
    — and the general form of the error, that the purchaser is not the viewer and their self-presentation
    contaminates the signal, is transferable even though the trade is not.

    '
  applicability:
    when: treating any purchase, order or brief signal as evidence of end-user preference, where the purchaser
      is not the end user
    limits: 'A structural argument about one business model, not a measured distortion. It supports asking
      how many parties a signal has passed through and whose self-presentation it may encode. It supplies
      no correction, no estimate of the distortion, and no method for recovering preference. Jain also
      records the industry''s compensating mechanism — very few degrees of separation between agents and
      end-users — so this is not a claim that such an industry is blind.

      '
  governance_consumer: evidence_interpretation
