# CANON-014 — SPEC-04 bindings for Kajri Jain, "Gods in the Bazaar", against SPEC-01 v0.1.
#
# Six bindings from eighteen objects. Twelve objects have no binding.
#
# THE ONE THING TO UNDERSTAND ABOUT THIS FILE. This source contains the most directly operational
# material of the three books added in this pass — actual production constraints, with stated
# mechanisms, three of which were confirmed first-hand against the plates. That makes it the source
# most at risk of being turned into a rule set. It is not one. Every binding below is scoped to the
# tradition the source studied, carries the source's own statement that these imperatives are partly
# discursive (Ch. 4, printed p. 192), and carries the author's closing position that images are not
# powerful in themselves (Ch. 4 conclusion and Conclusion, printed p. 372). None of them predicts an
# outcome, because the source measures none.
#
# NO BINDING HERE TOUCHES RELIGIOUS PRACTICE AS SUCH. What is bound is the general shape of a
# constraint — a convention that outlives its cause, an enabling condition mistaken for a quality
# criterion, a catalogue mistaken for a demand curve — not any devotional content.

source_id: jain_gods_in_the_bazaar
derived_against: {schema: SPEC-01, version: v0.1}

operational_bindings:

- binding_id: bnd_jgb_0001
  source_knowledge_refs: [sk_jgb_0020]
  source_system_refs: []
  target_type: governance
  target_path: null
  role: [flags, diagnoses]
  rationale: >
    Jain documents a fully worked case of a production convention that outlived the constraint which
    produced it. Manual retouching of colour separations began, on one account, as compensation for
    poor filters, insensitive film and uneven lighting; when the industry went digital and scanning
    could produce perfect separations, printers kept achieving the same effect in software. The
    technical justification had lapsed and the practice had not. This project will accumulate
    production conventions of its own, some of which will be responses to constraints that later
    disappear, and this is a documented instance of the failure shape with the mechanism visible.
  applicability:
    when: "auditing a production convention whose original justification may no longer hold"
    limits: >
      One industry, one technology transition, observed by one researcher. It supports asking of a
      convention whether its cause still exists, and it supplies a name for the failure. It supports
      no claim about how often conventions outlive their causes, no test, and no threshold. Note that
      the source does NOT say the convention became wrong when its cause lapsed — she says it became a
      genre feature, which is a different thing.
  governance_consumer: evidence_interpretation
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_jgb_0031]
  repair_ontology_refs: [t_jgb_0051]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_jgb_0002
  source_knowledge_refs: [sk_jgb_0060]
  source_system_refs: [scs_jgb_003]
  target_type: governance
  target_path: null
  role: [flags, constrains]
  rationale: >
    Jain identifies, and states precisely, a structural reason why one commonly used signal is not
    evidence of what it appears to be evidence of. Because these calendars are advertisements given
    away rather than goods bought, the catalogue's contents index what publishers think will interest
    clients, which indexes what clients think will please their customers AND how those clients want
    to be seen. This project reasons from demand-shaped artefacts — briefs, buyer postings, order
    histories — and the general form of the error, that the purchaser is not the viewer and their
    self-presentation contaminates the signal, is transferable even though the trade is not.
  applicability:
    when: "treating any purchase, order or brief signal as evidence of end-user preference, where the purchaser is not the end user"
    limits: >
      A structural argument about one business model, not a measured distortion. It supports asking
      how many parties a signal has passed through and whose self-presentation it may encode. It
      supplies no correction, no estimate of the distortion, and no method for recovering preference.
      Jain also records the industry's compensating mechanism — very few degrees of separation between
      agents and end-users — so this is not a claim that such an industry is blind.
  governance_consumer: evidence_interpretation
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_jgb_0032]
  repair_ontology_refs: [t_jgb_0052]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_jgb_0003
  source_knowledge_refs: [sk_jgb_0130, sk_jgb_0040]
  source_system_refs: [scs_jgb_001]
  target_type: evaluation
  target_path: null
  role: [diagnoses, constrains]
  rationale: >
    Jain documents a distinction this project's evaluation work needs and does not currently have a
    name for: the difference between a criterion that grades an artefact and a criterion that
    determines whether the artefact functions at all. In this tradition iconographic correctness is
    the second kind — an incorrect icon is not held to be a worse image but a vacant one — and the
    industry's behaviour follows: artists reported iconographic accuracy as the main thing they are
    asked to change before a design goes to press, ahead of any question of quality. Whether a given
    inspection criterion is enabling or grading is directly answerable about a criterion, and it
    changes how a failure on it should be reported.
  observation_unit: whole_asset
  applicability:
    when: "designing or interpreting an inspection criterion, to establish whether failing it makes the asset worse or makes it unusable"
    limits: >
      The source establishes that the TRADE behaves as though correctness is enabling. It does not
      establish that buyers reject incorrect images — no consumer study is reported, and Jain marks
      the belief as imputed to consumers by printers, at one remove. The binding supports asking which
      kind of criterion is in play; it licenses no pass mark, no threshold, and no claim that any
      particular criterion in this project is of the enabling kind.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_jgb_0033]
  repair_ontology_refs: [t_jgb_0053]
  status: proposed
  status_reason: "not reviewed; distinction only, no criterion classified and no threshold adopted"

- binding_id: bnd_jgb_0004
  source_knowledge_refs: [sk_jgb_0010, sk_jgb_0030]
  source_system_refs: [scs_jgb_001]
  target_type: production
  target_path: null
  role: [constrains, informs]
  rationale: >
    Two constraints in this source are unusually well suited to production reasoning because they are
    STATED AS CONSTRAINTS BY THE PEOPLE SUBJECT TO THEM, they have reasons attached, and they are
    checkable against the artefact. A figure must return the viewer's gaze even where the depicted
    action would direct it elsewhere; a divine body must not carry musculature or an alert, agentive
    posture. Both were confirmed first-hand in this pass against the plates the source cites. What is
    bound is the existence and shape of such constraints for work intended for this tradition — that
    a request for an image in this idiom carries requirements which override naturalistic plausibility
    and which a generator working from generic naturalist priors will violate by default.
  applicability:
    when: "planning an image intended to function within the Indian devotional/bazaar idiom the source studies"
    limits: >
      Scoped to that idiom and to the period of the fieldwork, 1994-2001. The muscularity injunction in
      particular is NOT stable: sk_jgb_0160 documents its dateable breach from the late 1980s, and
      that object must travel with this binding. Jain states that these imperatives are "primarily
      discursive categories, part of the bazaar's self-understanding" and are not always reflected in
      the images. This informs how a brief in this idiom should be read; it is not a specification, no
      list of attributes is adopted as a rule here, and nothing in it transfers to any other tradition.
  status: production_candidate
  status_reason: "Production IR does not exist (PROJECT-CONTRACT separation 2); recorded as a candidate with target_path null"
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_jgb_0034]
  repair_ontology_refs: []

- binding_id: bnd_jgb_0005
  source_knowledge_refs: [sk_jgb_0180, sk_jgb_0090]
  source_system_refs: [scs_jgb_002]
  target_type: governance
  target_path: null
  role: [flags]
  rationale: >
    Jain provides a clean, self-documented case of a class of evidence this project will increasingly
    rely on and currently has no standing treatment for: what practitioners say about their own
    practice and their own audience. She states that such accounts are "narratives, produced largely
    for my benefit"; she identifies her own self-introduction as the probable trigger for a whole
    rhetorical register; and she then demonstrates the productive use of the bound, deriving a finding
    precisely from the gap between what informants said about their audience and what they visibly did.
    The shape — treat practitioner testimony as evidence of what practitioners say, look for the gap
    between saying and doing, and record who was asking — is directly transferable.
  applicability:
    when: "collecting or interpreting practitioner testimony about practice, audience or outcome"
    limits: >
      This is a methodological posture drawn from one ethnography, not a validated protocol. It
      supports naming the class of evidence and looking for say/do gaps. It supplies no instrument, no
      sampling rule and no way of deciding when testimony is reliable. It must not be read as a reason
      to discount practitioner evidence: Jain's own strongest findings are built from it.
  governance_consumer: evidence_interpretation
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_jgb_0035]
  repair_ontology_refs: [t_jgb_0054]
  status: proposed
  status_reason: "not reviewed"

- binding_id: bnd_jgb_0006
  source_knowledge_refs: [sk_jgb_0040, sk_jgb_0070]
  source_system_refs: [scs_jgb_001]
  target_type: benchmark
  target_path: null
  role: [informs]
  rationale: >
    Jain reports one dimension along which artefacts in this tradition are in fact discriminated by
    the people who commission them, and it is not a dimension this project currently has: conformity
    to an explicit, enumerable, regionally differentiated attribute code — Lakshmi standing or seated,
    Shiva's eyes open or half-closed, Ganesh's trunk longer or shorter, Lakshmi with or without an owl.
    Unlike almost everything else in these three books, this is a dimension on which an artefact could
    in principle be scored against a stated code rather than judged. It is bound as INFORMING what such
    a dimension would look like, and for no other purpose.
  applicability:
    when: "considering whether a candidate evaluation dimension can be stated as conformity to an explicit external code rather than as a judgement"
    limits: >
      NO THRESHOLD IS ADOPTED AND NONE EXISTS. The source supplies an illustrative list from
      informants, not a code, does not claim the list is complete or current, and does not report that
      prints were surveyed against it. Constructing a scorable code from this material would be
      inventing a benchmark, which this project forbids. What is bound is the observation that such a
      dimension exists in this domain, nothing more.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "not reviewed; explicitly no threshold, no code adopted, and no scoring proposed"
