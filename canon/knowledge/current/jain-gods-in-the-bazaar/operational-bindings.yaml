bindings_considered_and_not_made:
- proposed_id: bnd_jgb_0006
  target_type_considered: benchmark
  source_knowledge_refs:
  - sk_jgb_0040
  - sk_jgb_0070
  outcome: not_made
  reason: The extraction bound this with role `informs`, which SPEC-04 does not define, and its own rationale
    said it was bound as INFORMING what a dimension would look like 'and for no other purpose'. That is
    an honest description of something that is not a binding. The source reports that artefacts in this
    tradition are discriminated by conformity to an explicit regional attribute code, but supplies an
    illustrative list from informants rather than a code, does not claim it is complete or current, and
    reports no survey of prints against it. No SPEC-04 role fits, and constructing a scorable code from
    this material would be inventing a benchmark. THE OBSERVATION SURVIVES IN sk_jgb_0040 and sk_jgb_0070,
    which is where it belongs.
