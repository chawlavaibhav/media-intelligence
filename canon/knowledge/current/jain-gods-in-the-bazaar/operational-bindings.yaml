  status: proposed
  status_reason: not reviewed; distinction only, no criterion classified and no threshold adopted
- binding_id: bnd_jgb_0004
  source_knowledge_refs:
  - sk_jgb_0010
  - sk_jgb_0030
  source_system_refs:
  - scs_jgb_001
  target_type: production
  target_path: null
  role:
  - constrains
  rationale: 'Two constraints in this source are unusually well suited to production reasoning because
    they are STATED AS CONSTRAINTS BY THE PEOPLE SUBJECT TO THEM, they have reasons attached, and they
    are checkable against the artefact. A figure must return the viewer''s gaze even where the depicted
    action would direct it elsewhere; a divine body must not carry musculature or an alert, agentive posture.
    Both were confirmed first-hand in this pass against the plates the source cites. What is bound is
    the existence and shape of such constraints for work intended for this tradition — that a request
    for an image in this idiom carries requirements which override naturalistic plausibility and which
    a generator working from generic naturalist priors will violate by default.

    '
  applicability:
    when: planning an image intended to function within the Indian devotional/bazaar idiom the source
      studies
    limits: 'Scoped to that idiom and to the period of the fieldwork, 1994-2001. The muscularity injunction
      in particular is NOT stable: sk_jgb_0160 documents its dateable breach from the late 1980s, and
      that object must travel with this binding. Jain states that these imperatives are "primarily discursive
      categories, part of the bazaar''s self-understanding" and are not always reflected in the images.
      This informs how a brief in this idiom should be read; it is not a specification, no list of attributes
      is adopted as a rule here, and nothing in it transfers to any other tradition.

      '
  status: production_candidate
  status_reason: Production IR does not exist (PROJECT-CONTRACT separation 2); recorded as a candidate
    with target_path null
  evidence_basis: derived_from_source
  empirical_refs: []
