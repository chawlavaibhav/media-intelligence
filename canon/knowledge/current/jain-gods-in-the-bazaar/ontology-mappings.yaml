# CANON-014 — SPEC-05 ontology for Kajri Jain, "Gods in the Bazaar". Source-local.
# No cross_source_concept. Source terminology, including Hindi and Sanskrit terms, is recorded in the
# source's own form with the source's own gloss. Observed adjacencies with
# dwyer_patel_cinema_india (frontality, iconicity, Ravi Varma, chromolithography, the Bombay School of
# Art, S. M. Pandit) are recorded as observations in the CANON-014 lineage matrix ONLY, and the
# citation running from Dwyer/Patel to Jain's 1998 article is recorded there with its direction.

source_id: jain_gods_in_the_bazaar
extraction_date: 2026-08-30

terms:

- term_id: t_jgb_0001
  term: calendar_art
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    A vernacular term, retained deliberately by the author despite its denigratory charge. It covers
    not just the illustrated calendars businesses distribute annually but also wall posters, the
    smaller images known in the industry as "framing pictures", and ephemeral objects such as keychains
    and magnets. The author keeps the denigrated term in order to "confront and reframe their terms of
    subordination", calling this an expropriative move.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Introduction, printed pp. 15-16"}
  arising_from: [sk_jgb_0100]

- term_id: t_jgb_0002
  term: bazaar
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    Not primarily a place but a social formation and credit complex: the "informal" or "indigenous"
    sector of the colonial economy delineated by the historians Bayly, Yang and Ray, distinct from and
    forming an interface with the colonial administration and foreign trade on one side and the
    agrarian subsistence economy on the other. The author identifies four aspects the calendar industry
    perpetuates: mediation between formal and informal economies; a gift economy of personalised
    reciprocal relationships; explicit religious or communitarian affiliation; and an ability to work
    both with and across communitarian, regional and linguistic difference.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 2, printed pp. 78-80; four aspects at Ch. 1, printed p. 69"}
  arising_from: [sk_jgb_0050]

- term_id: t_jgb_0003
  term: vernacular
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's chosen term over "traditional", "native", "indigenous" or "local", because it resists
    primordialism and romanticism. Her gloss: vernaculars are "normal but not normative; they can be
    modern but not modernist", and unlike "subaltern" a vernacular "can be simultaneously subordinate
    within one set of power relations and dominant in another". She notes the etymological root, Latin
    verna, "slave born in the master's house".
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Introduction, printed pp. 14-15"}
  arising_from: [sk_jgb_0050]

- term_id: t_jgb_0004
  term: vernacularizing_capitalism
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's term for a two-way movement: the incorporation of vernacular constituencies into a
    regnant capitalism on one side, and the adaptation of capital's axiomatics to varying local
    circumstances on the other, producing multiple cultures of capitalism rather than one.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 1, printed p. 37"}
  arising_from: [sk_jgb_0050]

- term_id: t_jgb_0005
  term: darshan
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    Used here as the two-way seeing in which "the devotee must be able not just to see but also be seen
    by the deity in order to receive its blessing", and identified as the reason for the iconic
    imperative of frontality in images meant for ritual use.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, printed p. 192"}
  arising_from: [sk_jgb_0010]

- term_id: t_jgb_0006
  term: aesthetics_of_presence
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    Richard Davis's term, as reported: the idea, informing most icon worship in South Asia since the
    medieval period, that the icon is a privileged housing or receptacle for the divine essence, an
    embodiment as much as a signifier. Contrasted by Davis with the "semiotic aesthetic" of medieval
    Christianity, where the image was emphatically representational.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 6, printed pp. 292-293"}
  arising_from: [sk_jgb_0130]

- term_id: t_jgb_0007
  term: sukomal
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    "Gentle, beautiful" — the textual description of a divine body, cited by the Nathdwara artist Indra
    Sharma as the reason musculature is not depicted: "For god's body, the description is of a gentle,
    beautiful (sukomal) body. . . . There won't be any muscles, we people avoid muscles."
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, printed p. 194"}
  arising_from: [sk_jgb_0030]

- term_id: t_jgb_0008
  term: lila
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    Sacred "play", in both senses of the word. Used to characterise divine agency in the Vaishnava
    schema as a matter of play rather than of labour, which is the stated reason a deity's body does
    not carry the marks of instrumental exertion.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, printed p. 195"}
  arising_from: [sk_jgb_0030]

- term_id: t_jgb_0009
  term: bhava
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    Emotion or emotional dimension. The source distinguishes two uses: Balendranath Tagore's
    colonially-oriented classicising formulation, the expression of noble sentiment; and the calendar
    artists' use, drawing on devotional bhakti discourses of visual desire. The artists oppose
    bhava paksh (the emotional dimension) to shringar paksh (the ornamental dimension) and complain
    that the latter has come to predominate.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, printed pp. 186 and 197-198"}
  arising_from: [sk_jgb_0020]

- term_id: t_jgb_0010
  term: bhavyata
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    Divine beauty or power, cited by Yogendra Rastogi as the reason a deity's face is painted
    proportionately larger than anatomical correctness would allow: "if you make it absolutely correct,
    the right size, then people will say, Rastogi sahib, what have you done, how have you made the
    face, there's no power in it."
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, printed p. 194"}
  arising_from: [sk_jgb_0010]

- term_id: t_jgb_0011
  term: sajivta
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    "Livingness" or "lifelikeness" — the Hindi word some artists used in place of the English
    "realism". The author draws the distinction: "at issue here is not the reality of the gods, but how
    alive they are: how the image brings them to life."
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, printed p. 199"}
  arising_from: [sk_jgb_0080]

- term_id: t_jgb_0012
  term: chatkile_bhatkile
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    "Gaudy, distracting" — Indra Sharma's phrase for the colours of framing pictures, glossed by their
    effect: "Whether or not your gaze wants to go there it still goes."
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, printed p. 186"}
  arising_from: [sk_jgb_0020]

- term_id: t_jgb_0013
  term: framing_picture
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    The industry's own term for the smaller images sold rather than gifted, distinguished from
    calendars by a slower-moving market, greater iconographic conventionality, a richer and more
    locally inflected range of subjects, and use within relatively formal religious contexts — bought
    at pilgrimage sites or on ritual occasions and instated in domestic prayer rooms or workplace
    shrines.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 1, printed pp. 63-64"}
  arising_from: [sk_jgb_0070]

- term_id: t_jgb_0014
  term: english_market
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    The industry's own name for the pan-national calendar circuit, as against the separately scheduled
    "Bengali market". The author calls the term both paradoxical and revealing: the trade it names is
    a largely vernacular, non-English enterprise, yet "there seems to be no other means available to
    describe such an arena of mobile, wide-ranging, and nonlocal modernity than in terms of the
    colonial language, English."
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 1, printed pp. 49 and 76"}
  arising_from: [sk_jgb_0050]

- term_id: t_jgb_0015
  term: production_of_locality
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    After Appadurai, and pressed further by the author into "the commoditization of locality": the
    generation of regionally specific imagery from dispersed sites through a centralised system,
    enabled by the conventionalisation of regional iconographic codes, so that an artist need not
    inhabit or identify with the community whose images he or she produces.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 1, printed p. 60"}
  arising_from: [sk_jgb_0040]

- term_id: t_jgb_0016
  term: meta_popularity
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    After Michael Warner: the condition in which it is not an iconic figure's attributes that matter
    but the very fact of its popularity — "the popularity of popularity". The author ties it to a
    triangulated gaze between the image, the viewer, and the viewer's sense of what others see, and
    notes its underside, that public investment also makes an icon vulnerable to desecration.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 6, printed p. 292"}
  arising_from: [sk_jgb_0110]

- term_id: t_jgb_0017
  term: copy_master
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    The trade's term for artists employed to make minor modifications to existing designs, as against
    "original" artists; a role created by the requirement to supply annually new designs on subjects
    that iconography forbids changing.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 1, printed p. 57; Ch. 4, printed p. 205"}
  arising_from: [sk_jgb_0070]

- term_id: t_jgb_0018
  term: nakal_mein_akal
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    "Intelligence in imitation" — B. G. Sharma's formulation of the trade's position on copying:
    "To copy is not a crime (gunah), but in copying also you need to be smart ... Without copying an
    artist won't learn." The author uses it to characterise an iconographic "commons" of technique and
    convention that sits awkwardly with authorial property.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 4, printed p. 211"}
  arising_from: [sk_jgb_0070]

- term_id: t_jgb_0019
  term: ugra
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    "Angry, exercised . . . punishing" — Anuradha Kapur's characterisation, as reported, of the
    predominant mood of the muscular Ram images appearing from the late 1980s, against the earlier
    tranquil and benign depictions.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 7, printed p. 321"}
  arising_from: [sk_jgb_0160]

- term_id: t_jgb_0020
  term: sivakasi
  origin: source
  origin_ref: jain_gods_in_the_bazaar
  kind: source_specific_concept
  definition_in_origin_frame: >
    A town in Tamil Nadu that became the centralised hub of Indian offset calendar and framing-picture
    production from the mid-1960s to the mid-1990s; reported as holding roughly 40 per cent of India's
    offset printing capacity in 1980 and roughly 60 per cent by 2001. Its cost position rested on
    de-mechanisation, ancillarised informal piece-rate labour, and thrift in materials, and the source
    records the associated conditions, including child labour in the match industry.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 1, printed pp. 39-41"}
  arising_from: [sk_jgb_0050]

