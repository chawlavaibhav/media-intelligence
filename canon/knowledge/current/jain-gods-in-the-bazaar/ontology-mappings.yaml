- term_id: t_jgb_0031
  term: convention_outliving_its_cause
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    A production practice adopted to compensate for a constraint, retained after the constraint has
    gone, and thereafter defended on other grounds. Named from the documented case of manual colour
    retouching persisting into the digital era where scanning made it unnecessary.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 4, printed pp. 183-184"}
  arising_from: [sk_jgb_0020]

- term_id: t_jgb_0032
  term: purchaser_signal_read_as_end_user_preference
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Treating an order, purchase or brief as evidence of what the eventual viewer wants, where the
    purchaser is not the viewer and the signal encodes the purchaser's self-presentation. Named from
    the calendar files, which the source shows to be several layers of second-guessing rather than an
    index of demand.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 1, printed pp. 53-54"}
  arising_from: [sk_jgb_0060]

- term_id: t_jgb_0033
  term: enabling_condition_scored_as_a_grading_criterion
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Reporting a failure that makes an artefact unusable as though it merely made it worse, or the
    reverse. Named from iconographic correctness in this tradition, where an incorrect icon is held not
    to be a poorer image but a vacant one, and where the trade accordingly treats accuracy as the
    principal ground for sending a design back.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 6, printed p. 293; Ch. 1, printed p. 61"}
  arising_from: [sk_jgb_0130, sk_jgb_0040]

- term_id: t_jgb_0034
  term: naturalist_default_violating_an_idiom_constraint
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Producing an image that satisfies generic naturalistic plausibility while violating a requirement
    of the idiom it was asked for. Named from the two documented cases: a figure whose gaze follows its
    depicted action rather than meeting the viewer, and a divine body given anatomically correct
    musculature.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 4, printed pp. 191-196"}
  arising_from: [sk_jgb_0010, sk_jgb_0030]

- term_id: t_jgb_0035
  term: practitioner_testimony_read_as_audience_fact
  origin: extractor
  origin_ref: canon_014
  kind: failure_mode
  definition_in_origin_frame: >
    Treating what a practitioner says their audience believes or wants as evidence about that audience.
    Named because every audience-level claim in this source arrives this way, at one remove, and the
    author says so.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 4, printed p. 174"}
  arising_from: [sk_jgb_0180]

- term_id: t_jgb_0051
  term: ask_whether_a_conventions_cause_still_holds
  origin: extractor
  origin_ref: canon_014
  kind: repair_action
  definition_in_origin_frame: >
    For a standing production convention, state the constraint it was adopted to address and check
    whether that constraint still obtains. Executor: whoever maintains the convention. The source
    supplies the failure shape and one case; it supplies no test and none is invented here.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 4, printed pp. 183-184"}
  arising_from: [sk_jgb_0020]

- term_id: t_jgb_0052
  term: count_the_parties_a_demand_signal_passed_through
  origin: extractor
  origin_ref: canon_014
  kind: repair_action
  definition_in_origin_frame: >
    Before using a purchase or brief signal as evidence of preference, enumerate the parties between
    the signal and the eventual viewer and record whose self-presentation each may have added.
    Executor: whoever interprets the signal. This is a discipline of statement, not a correction; the
    source offers no way to recover preference from a contaminated signal.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 1, printed pp. 53-54"}
  arising_from: [sk_jgb_0060]

- term_id: t_jgb_0053
  term: classify_a_criterion_as_enabling_or_grading
  origin: extractor
  origin_ref: canon_014
  kind: repair_action
  definition_in_origin_frame: >
    For each inspection criterion, state whether failing it makes the artefact unusable or merely
    worse, and report failures accordingly. Executor: whoever designs the inspection. No criterion in
    this project is classified by this record and no threshold is adopted.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 6, printed p. 293"}
  arising_from: [sk_jgb_0130]

- term_id: t_jgb_0054
  term: record_who_was_asking
  origin: extractor
  origin_ref: canon_014
  kind: repair_action
  definition_in_origin_frame: >
    When collecting practitioner testimony, record how the collector was presented to the informant,
    and look for gaps between what informants say and what they are observed to do. Executor: whoever
    collects the testimony. Named from the author's own practice, which produced a finding precisely
    from such a gap.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 4, printed pp. 174 and 180"}
  arising_from: [sk_jgb_0180, sk_jgb_0090]
