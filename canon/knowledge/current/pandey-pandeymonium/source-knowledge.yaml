- sk_id: sk_ppm_0020
  source_id: pandey_pandeymonium
  source_terms:
  - "Often, we write off people as 'the MBA', 'that brand manager', 'that marketing manager', and we forget that there is a human being behind the designation or the business card."
  - "Once one accepts the realities of the processes, one instantly becomes part of a team."
  - "Stay focused on the challenges of the brief and the client, and you become closer. This happens when you stop working at cross purposes and see a common enemy."
  concept_label: treat_the_clients_process_as_a_shared_constraint_rather_than_an_obstacle
  label_origin: extractor_assigned
  claim: >
    Pandey argues that the systems and processes creative people resent — research requirements,
    approval stages, layers of management — should be accepted as a shared constraint rather than
    fought, because accepting them converts the relationship from adversarial to joint. His stated
    mechanism is that if the client's requirement to test an idea is treated as a problem for the
    whole team, mutual understanding deepens and the process eventually becomes "a blur, a necessary
    chore".
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >
      Where two parties each treat the other's constraints as obstacles, effort goes into the
      conflict. Adopting the constraint as shared redirects that effort at the brief, and the shared
      difficulty itself becomes the thing that binds the parties.
  scope:
    domain_discussed_by_source: [agency_client_relationships, creative_practice]
    conditions: >
      Indian agency practice, 1982 onward, and specifically large multinational clients with heavy
      process (his examples are Hindustan Unilever, Cadbury, Asian Paints, Pidilite).
  caveats:
  - text: "every supporting case is one in which the relationship went well and the author's career advanced; clients with whom this posture failed are not in the book"
    origin: extractor_observed
  - text: "his examples are of exceptional individual generosity — a brand manager waiving a launch commitment, a company sending cash on a bereavement — rather than of the process working. They evidence that good people exist, which is not the same as the claim being argued"
    origin: extractor_observed
  - text: "'Don't be scared of systems and processes. There are ways to fool them. I found at least a hundred.' sits in the same chapter and is in tension with accepting the process as shared. The source does not reconcile them, and the line appears twice in this copy as a flattened pull-quote"
    origin: extractor_observed
  - text: every supporting case is one in which the relationship went well and the author's career advanced; relationships where this posture failed are not in the book
    origin: extractor_observed
  source_stated_problems:
  - "treating a counterpart's constraints as obstacles turns joint work into conflict"
  source_stated_remedies:
  - "accept the constraint as shared, and direct the effort at the brief"
