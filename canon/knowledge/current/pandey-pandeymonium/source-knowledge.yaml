- sk_id: sk_ppm_0010
  source_id: pandey_pandeymonium
  source_terms:
  - "I reject the procedures that I have seen, but I don't undervalue homework and thoroughness."
  - "I hate researches where regular human beings are asked stupid questions. Obviously, you will get a stupid reply."
  - "I don't want to hear stupid answers to stupid questions. I would much rather watch their body language. If they are chatting and not looking at the TV commercial after five seconds, we have lost them."
  concept_label: rejects_the_procedure_not_the_homework_and_proposes_behavioural_observation
  label_origin: extractor_assigned
  claim: >
    Pandey distinguishes his position carefully: he rejects the research *procedures* he has seen,
    not homework or thoroughness, and states he has attended more research sessions than most
    creative people. His objection to the group discussion is that asking people to report a feeling
    about a pack produces a fabricated answer, and that the first fabrication then propagates round
    the group as agreement. In place of self-report he proposes direct behavioural observation:
    discard the headphones, watch body language, and treat a respondent who is chatting and not
    looking at the commercial after five seconds as lost.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >
      A respondent asked a question they have no genuine answer to will supply one to save face in
      front of a group, and subsequent respondents can then agree cheaply. The fabricated answer is
      then reported as a finding. Observed attention is not subject to that failure because it is not
      a report.
  scope:
    domain_discussed_by_source: [advertising_research, creative_practice]
    conditions: >
      Indian agency and client qualitative research as the author encountered it over a career from
      1982; focus groups, one-way mirrors, dial meters. He explicitly extends the scepticism to
      neuro-response research ("Take it easy, folks") without having used it.
  caveats:
  - text: "the five-second attention criterion is offered in passing and is not a validated threshold; the author proposes no way of checking it"
    origin: extractor_observed
  - text: "his evidence is a list of his own successful campaigns that he says would have failed research. That is survivorship: campaigns that failed research AND would have failed in market are not counted, and neither are campaigns that passed research and succeeded"
    origin: extractor_observed
  - text: "the dismissal of neuro-response research is asserted from no stated experience of it"
    origin: extractor_observed
  - text: "the fabrication-and-propagation mechanism he describes is a real and independently recognised failure of group self-report; the mechanism is stronger than the evidence he gives for his conclusion"
    origin: extractor_observed
  source_stated_problems:
  - "asking people to report feelings they do not have produces fabricated answers that propagate through a group"
  source_stated_remedies:
  - "observe attention and body language rather than collecting self-report"
  examples: {positive: []}
  intra_source_relations:
