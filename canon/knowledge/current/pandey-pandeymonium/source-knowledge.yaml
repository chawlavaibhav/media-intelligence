- sk_id: sk_ppm_0040
  source_id: pandey_pandeymonium
  source_terms:
  - "You have two options. Do scam ads for barber shops, dentists, weight-loss clinics, your girlfriend's boutique; or pick up an issue and do path-breaking work on it."
  - "Even an award is difficult because the world and the juries have got smarter."
  concept_label: the_authors_position_on_scam_advertising
  label_origin: extractor_assigned
  claim: >
    Pandey addresses the practice of producing unpaid speculative work for tiny clients in order to
    win awards. His stated position is that the alternative — taking a real issue and doing genuine
    work on it, starting small and letting it spread — is both better and more likely to win, and
    that juries have become harder to fool. He proposes a list of issues (women's safety, Swachch
    Bharat, girl child education, energy conservation) and pre-empts the objection that he is
    promoting a government agenda.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >
      Work that changes something real can propagate outward from a small beginning, which both
      produces the effect and supplies the award case. A poster for a sweet shop can do neither.
  scope:
    domain_discussed_by_source: [advertising_industry_ethics, awards]
    conditions: "Indian advertising, as at 2015, addressed to entrants early in their careers"
  caveats:
  - text: "the claim that juries have got smarter is asserted with no evidence"
    origin: extractor_observed
  - text: "the author anticipates and rebuts the charge of political alignment rhetorically ('Hold your horses, and think, for a change'), which is not an answer to it"
    origin: extractor_observed
  - text: "he is a senior figure recommending unpaid public-issue work to juniors, from a position where such work is career-safe for him; the asymmetry is not acknowledged"
    origin: extractor_observed
  source_stated_problems:
  - "unpaid speculative work made only to win awards"
  source_stated_remedies:
  - "take a real issue and do genuine work on it, starting locally"
