# CANON-014 — Piyush Pandey, "Pandeymonium: Piyush Pandey on Advertising"
# (Portfolio / Penguin Books India, 2015). SPEC-03 extraction over the whole book.
#
# Epistemic shape, established by reading it: this is a practitioner MEMOIR, not an argument. Pandey
# is India's best-known advertising creative director; the book is organised as short chapters each
# ending in a lesson drawn from a story about his own career. Almost everything in it is
# `practitioner_assertion` + `anecdotal`, and almost every lesson is drawn from a case that
# succeeded.
#
# THE SURVIVORSHIP PROBLEM IS STRUCTURAL HERE AND IS RECORDED ON EVERY OBJECT IT AFFECTS.
# The book's characteristic move is: I did X, it worked, therefore do X. The cases where someone did
# X and failed are not in the book and could not be, because the book is a memoir of a successful
# career. Pandey occasionally supplies the counterfactual himself — he notes he would have been
# "history" had the Tata Cement pitch been lost — and where he does, it is extracted.
#
# Two further things this extraction does NOT do:
#   * it does not convert his rejection of research procedures into a claim that pre-testing is
#     invalid. He rejects specific procedures and proposes a different observation; both are
#     recorded as his position, and his evidence for it is survivorship-shaped.
#   * it does not treat his campaigns' commercial outcomes as established. The book asserts them
#     and reproduces no evidence for any of them.
#
# Locators: EPUB, reflowable, no authored page. Chapter titles are the locator.

