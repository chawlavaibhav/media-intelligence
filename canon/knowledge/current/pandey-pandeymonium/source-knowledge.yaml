- sk_id: sk_ppm_0041
  source_id: pandey_pandeymonium
  source_terms:
  - "We've not been sensitive enough to the needs and compulsions of a woman."
  - "This conflict has to be resolved by the business, not by the woman."
  - "We haven't realized or been sensitive to the fact that a huge treasure of knowledge is lost when competent women leave our industry."
  concept_label: retention_not_recruitment_is_where_the_industry_loses_women
  label_origin: extractor_assigned
  claim: >
    Pandey states that Indian advertising has too few women leading agencies, accepts this as a
    failing of the industry's senior men including himself, and locates the problem specifically at
    retention rather than entry: competent women leave and their accumulated knowledge is lost. He
    states that the conflict between the two roles he describes must be resolved by the business
    rather than by the individual, and names extended maternity and paternity leave approvingly. He
    contrasts advertising with Indian banking, where he names several women running major banks.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >
      Knowledge accumulated over a career is lost when the holder leaves, so an industry that cannot
      retain people through a particular life stage loses seniority rather than merely headcount.
  scope:
    domain_discussed_by_source: [advertising_industry, women_in_advertising, india]
    conditions: "Indian advertising and Indian banking, as at 2015"
  caveats:
  - text: "the author's account of WHY the conflict exists rests on an essentialist premise stated in his own voice — that a woman 'is also the nurturer of the family' and that the two roles conflict. The locus-of-responsibility conclusion he draws from it (the business must resolve it) does not depend on that premise, and the two are separated here rather than extracted together"
    origin: extractor_observed
  - text: "no data of any kind: no counts, no attrition rates, no comparison with the banking sector he uses as the contrast"
