  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The source states one condition, negatively: the reviewers had not seen the work develop over the preceding month, so their judgement was made without the context the team held - 'If any of the board members had been involved from the outset, we wouldn't have been in this sorry state.'
  scope:
    domain_discussed_by_source: [creative_practice, agency_politics]
    conditions: "one Indian agency, early 1990s, one pitch"
  caveats:
