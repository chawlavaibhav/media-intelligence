  label_origin: extractor_assigned
  claim: >
    Pandey's stated position is that a creative person convinced they are right should stand by the
    work, handled with tact and confidence. His central case is the Tata Cement pitch: his agency's
    strategy review board rejected the campaign as beyond repair days before the presentation, he
    refused to change it or to accept the rejection, the agency chairman let it go ahead, the pitch
    was won, and the chairman said "the boy was right".
