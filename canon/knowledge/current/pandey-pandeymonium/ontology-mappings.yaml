terms:

- term_id: t_ppm_0001
  term: scam_ads
  origin: source
  origin_ref: pandey_pandeymonium
  kind: source_specific_concept
  definition_in_origin_frame: >
    Unpaid speculative advertising made for tiny or notional clients — the source's list is barber
    shops, dentists, weight-loss clinics, "your girlfriend's boutique" — in order to enter awards
    rather than to sell anything. The source treats it as the wrong of two options open to a young
    creative.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 18, 'Scam Ads'"}
  arising_from: [sk_ppm_0040]

- term_id: t_ppm_0002
  term: domestic_multiculturalism
  origin: source
  origin_ref: pandey_pandeymonium
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's term for treating a single national market as internally multicultural to a degree
    comparable with operating across countries, requiring both a central quality-defining pool and
    locally knowledgeable teams.
  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 25 'Domestic Multiculturalism'"}
  arising_from: [sk_ppm_0030]

- term_id: t_ppm_0003
  term: the_human_behind_the_client
  origin: source
  origin_ref: pandey_pandeymonium
  kind: source_specific_concept
  definition_in_origin_frame: >
    The author's phrase for looking past a counterpart's role and process to the individual, which he
