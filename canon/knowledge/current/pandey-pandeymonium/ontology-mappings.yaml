  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 6 'The Human Behind the Client'"}
  arising_from: [sk_ppm_0020]

- term_id: t_ppm_0004
  term: link_test
  origin: source
  origin_ref: pandey_pandeymonium
  kind: entity
