  first_seen: 2026-08-30
  verbatim: true
  source_ref: {locator: "Ch. 7 'Scratching beneath the Surface'"}
  arising_from: [sk_ppm_0010]

- term_id: t_ppm_0005
  term: homework_as_distinct_from_research_procedure
  origin: extractor
  origin_ref: pandey_pandeymonium
  kind: property
  definition_in_origin_frame: >
    The distinction the source insists on: he rejects the procedures he has seen while stating he
    does not undervalue "homework and thoroughness", and describes his own preferred practice as
    chatting with people without an agenda. Named by the extractor because the distinction is
    load-bearing and the source has no single word for it.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 7 'Scratching beneath the Surface'"}
  arising_from: [sk_ppm_0010]

# ── problems ────────────────────────────────────────────────────────────────

- term_id: t_ppm_0031
  term: group_self_report_fabrication_cascade
  origin: extractor
  origin_ref: pandey_pandeymonium
  kind: problem
  definition_in_origin_frame: >
    A respondent with no genuine answer to a question fabricates one to save face in front of a
    group; subsequent respondents agree cheaply; the fabrication is then reported as a finding. The
    source's instance is being shown a new pack and asked what one feels on seeing it.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 7 'Scratching beneath the Surface'"}
  arising_from: [sk_ppm_0010]

- term_id: t_ppm_0032
  term: review_without_the_works_development_context
  origin: extractor
  origin_ref: pandey_pandeymonium
  kind: problem
  definition_in_origin_frame: >
    Work developed over an extended period is judged at the end by reviewers who did not see it
    develop and cannot see the alternatives already discarded. The source's instance is a strategy
    review board rejecting a month's work days before a pitch, none of whom had seen it in progress.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 17 'Standing Up for One's Beliefs'"}
  arising_from: [sk_ppm_0021]

- term_id: t_ppm_0033
  term: lesson_drawn_from_a_case_that_succeeded
  origin: extractor
  origin_ref: pandey_pandeymonium
  kind: problem
  definition_in_origin_frame: >
    The book's characteristic evidential form: a practice is recommended on the strength of an
    occasion when it worked, with no counting of occasions when the same practice failed. The source
    supplies the counterfactual himself only once, noting he would have been "history" had the pitch
    been lost. Recorded as a property of THIS SOURCE, to be carried with anything retrieved from it.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "whole book; explicitly at Ch. 17"}
  arising_from: [sk_ppm_0021, sk_ppm_0011, sk_ppm_0020]

- term_id: t_ppm_0034
  term: source_evidence_published_outside_the_source
  origin: extractor
  origin_ref: pandey_pandeymonium
  kind: problem
  definition_in_origin_frame: >
    The work a book argues about is deliberately not reproduced in it, being published to a companion
    route instead. Not a defect of any copy: the source's own copyright page states it. A reader of
    the book alone cannot see what is being defended.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Copyright page"}
  arising_from: [sk_ppm_0050]

# ── remedies (each states who or what can execute it) ───────────────────────

- term_id: t_ppm_0051
  term: observe_attention_instead_of_collecting_self_report
  origin: source
  origin_ref: pandey_pandeymonium
  kind: remedy
  definition_in_origin_frame: >
    Where the question is whether an asset holds a viewer, watch whether the viewer is still looking
    rather than asking them what they felt.
    EXECUTABLE BY: a human observer in the room, which is how the source executes it. An automated
    attention measure would be a DIFFERENT instrument with its own validation problem, and the source
    supports nothing about one. The five-second criterion he offers is NOT adopted.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 7 'Scratching beneath the Surface'"}
  arising_from: [sk_ppm_0010]

- term_id: t_ppm_0052
  term: give_reviewers_the_works_development_context
  origin: extractor
  origin_ref: pandey_pandeymonium
  kind: remedy
  definition_in_origin_frame: >
    Involve reviewers early enough that they have seen the work develop, rather than only at a
    terminal gate. The source states the condition negatively — "If any of the board members had been
    involved from the outset, we wouldn't have been in this sorry state" — and proposes no procedure.
    EXECUTABLE BY: whoever schedules the review; it is a process decision, not something a reviewer
    or a creator can do at the point of review.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "Ch. 17 'Standing Up for One's Beliefs'"}
  arising_from: [sk_ppm_0021]

- term_id: t_ppm_0053
  term: carry_the_survivorship_bound_with_anything_retrieved_here
  origin: extractor
  origin_ref: pandey_pandeymonium
  kind: remedy
  definition_in_origin_frame: >
    Where an object from this source is retrieved, carry with it that the supporting case is one that
    succeeded and that no failure rate is available.
    EXECUTABLE BY: a retrieval process built to carry an evidence-quality field, or by a human
    curating the retrieved set. NOT executable by a model reading the object alone.
  first_seen: 2026-08-30
  verbatim: false
  source_ref: {locator: "whole book"}
  arising_from: [sk_ppm_0021]

