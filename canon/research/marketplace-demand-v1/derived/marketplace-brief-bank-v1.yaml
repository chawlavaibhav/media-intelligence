        on_screen_copy: absent
        subtitles: absent
      provenance: customer_stated
      rationale: >
        Hinglish is customer-stated - Hindi spoken with English mixed in, commonly written in Latin
        script. One of only two postings in the whole sample where an Indic language is stated for
