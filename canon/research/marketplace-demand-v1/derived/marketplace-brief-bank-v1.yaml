  source_facts_used:
    - fact: 75-100 scripts per week arrive with visual guidance; individual videos run from 30 seconds to 300 seconds; styles are mixed.
      verbatim: '75–100 scripts weekly with visual guidance, 30s–300s, mixed styles'
    - fact: The posting asks about team size, capacity and workflow rather than about a showreel.
      verbatim: the post asks about **team size, capacity and workflow** rather than your reel
    - fact: The client has posted 133 jobs, hires 46% of the time, and has $16K of recorded spend against a $50,000 headline.
      verbatim: '$16K · 46% hire · 133 posted'
  customer_brief: |
    Ongoing AI video production. We send 75-100 scripts a week, each with visual guidance.
    Individual videos run anywhere from 30 seconds to 300 seconds, in mixed styles.

    We want to know your team size, your capacity and your workflow.
  budget_caution: >
    The $50,000 headline is the posted budget, not evidence of money. The same client has 133
    postings against $16K of recorded spend and a 46% hire rate. Nothing in this bank treats the
    headline as a funded commitment.
  normalized_request:
    R01_requested_operation:
      value: generate
      provenance: customer_implied
      rationale: Videos are produced from scripts. No artefact is being altered.
    R02_supplied_assets:
      value:
        - asset_id: mkt007_scripts
          media_type: document
          role: unresolved_not_in_grammar_v1
          applies_to: null
          description: weekly batch of scripts, each accompanied by visual guidance
          grammar_gap_ref: GG-02
      provenance: customer_stated
      rationale: >
        Scripts WITH visual guidance is the strongest supplied-input statement in the sample: the
        buyer supplies not only the words but direction on how it should look. The grammar has no
        asset role for either.
    R03_mutation_intents:
      value: null
      provenance: absent
    R04_deliverable_set:
      value:
        cardinality: 12
        weekly_cardinality_stated: {min: 75, max: 100}
        variation_axis: message
        acceptance_basis: per_deliverable
      provenance: customer_stated
      sub_field_provenance:
        weekly_cardinality_stated: customer_stated
        cardinality: experiment_supplied_fixture
        acceptance_basis: system_derived
      rationale: >
        The buyer states 75-100 per week. Running 75-100 generations to test this shape would be a
        spend decision no worker may make, so the benchmark case is scoped to a 12-item slice and
        that slice size is labelled a fixture. The stated weekly volume is preserved separately so
        the real request is not quietly shrunk to fit the benchmark.
    R05_modality:
      value: video
      provenance: customer_stated
    R06_entities:
      value: null
      provenance: absent
      rationale: No entity is named. "Mixed styles" is a style statement, not an entity statement.
    R07_relationships:
      value: null
      provenance: absent
    R08_text_requirements:
      value: null
      provenance: absent
    R09_brand_requirements:
      value: null
      provenance: absent
    R10_language_topology:
      value:
        spoken: en
        on_screen_copy: none
        subtitles: none
      provenance: experiment_supplied_fixture
    R11_speaker_topology:
      value:
        visible_speakers: 0
        offscreen_voices: 1
        turn_boundaries_required: false
        script_exactness: exact
      provenance: customer_implied
      sub_field_provenance:
        script_exactness: customer_implied
        visible_speakers: experiment_supplied_fixture
        offscreen_voices: experiment_supplied_fixture
    R12_temporal_structure:
      value:
        duration_seconds: {min: 30, max: 300}
        shot_count: null
        beats: null
      provenance: customer_stated
      rationale: >
        A ten-to-one duration range inside one contract. Worth noticing: the same buyer, the same
        workflow and the same price expect both a 30-second piece and a five-minute piece, which is
        a production-envelope statement no authored brief in the project makes.
    R13_subject_motion:
      value: null
      provenance: absent
    R14_camera_motion:
      value: null
      provenance: absent
    R15_delivery:
      value: null
      provenance: absent
    R16_specification_provenance:
      value:
        customer_specified: [R01, R02, R04, R05, R11, R12, R18]
        customer_omitted: [R03, R06, R07, R08, R09, R10, R13, R14, R15]
        derived: [{field: R04.cardinality, by: benchmark, why: a 12-item slice stands in for a stated 75-100 weekly volume; the stated volume is preserved separately}]
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: '"mixed styles" names a variation the buyer expects but no style is specified'
          affected_fields: [R09, R18]
        - marker_type: underspecification
          detail: nothing states how a 30-second and a 300-second deliverable differ in acceptance
          affected_fields: [R04, R12]
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - each video follows its supplied script
          - each video follows its accompanying visual guidance
          - duration falls between 30 and 300 seconds
        stated_success_criteria:
          - sustained weekly throughput of 75-100 videos
        stated_rejection_criteria: []
      provenance: customer_stated
      rationale: >
        Throughput is stated as a success condition, which is unusual and important: this buyer's
        acceptance includes a RATE, not only an artefact quality. The project's operational
        capability family covers reliability and latency but nothing covers sustained throughput
        as an acceptance condition.
  fixture_requirements:
    - fixture_id: FX-007-scripts
      what: twelve benchmark-authored scripts with attached visual guidance, spread across the stated 30-300 second range
      why: the buyer's scripts are not held, and "follows the visual guidance" needs guidance to hold it against
      rights_requirement: benchmark-authored
      blocks_runnable: false
    - fixture_id: FX-007-slice
      what: slice size fixed at 12 rather than the stated 75-100 weekly
      why: running the stated volume is a spend decision no worker may take
      rights_requirement: none
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: The twelve-item slice is fully constructible without the buyer.
  execution_feasibility:
    attemptable_without_a_planner: partially
