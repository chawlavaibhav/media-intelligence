      provenance: customer_stated
      sub_field_provenance:
        variation_axis: customer_stated
        cardinality: customer_implied
        acceptance_basis: system_derived
      rationale: >
        The variation axis is LANGUAGE and it is customer-stated: an original plus Hindi plus Urdu.
        This is the only language-variant deliverable set in the sample and the grammar's
