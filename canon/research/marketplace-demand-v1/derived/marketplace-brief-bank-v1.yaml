        An editor edits something, so material exists. WHAT it is is completely unrecorded - and
        unlike the other cases here, the benchmark cannot responsibly invent it, because the
        content is the substance of a mystery or historical channel rather than a container for it.
    R03_mutation_intents:
      value:
        preservation_default: implicit_everything_not_named
        intents: []
      provenance: absent
      rationale: The buyer names nothing to change. An edit request with no stated change is not a specifiable job.
    R04_deliverable_set:
      value:
        cardinality: null
        variation_axis: null
        acceptance_basis: null
      provenance: absent
    R05_modality:
      value: video
      provenance: customer_stated
    R06_entities:
