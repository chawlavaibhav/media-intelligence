    and the register is mystery, explainer or historical content for a channel.

    What is not known, and is deliberately not filled in: what the source material is, what change
    is being asked for, how long the output runs, how many are wanted, and whether the job is
    editing one artefact or assembling several.

    A generation brief written from this posting would be an authored brief wearing marketplace
    provenance. It is left incomplete on purpose.
  prompt_ready_envelope:
    objective: faceless Hinglish channel content, mystery/explainer/historical register
    output_modality: video
    requested_operation: edit
    requested_operation_confidence: low
    duration_seconds: unspecified_by_customer
    aspect_ratio: unspecified_by_customer
    placement: youtube
    placement_provenance: customer_implied
    audience: Hinglish-speaking Indian channel audience
    audience_provenance: customer_implied
    entities: []
    supplied_assets: [unrecorded]
    identity_invariants: []
    product_fidelity: not_applicable
    script_or_dialogue: unspecified_by_customer
    exact_on_screen_text: []
    language: {spoken: hi-Latn, on_screen: unspecified_by_customer, subtitles: unspecified_by_customer}
    visual_tone: mystery / explainer / historical
    visual_tone_provenance: customer_stated
    temporal_beats: unspecified_by_customer
    cta: unspecified_by_customer
    brand_constraints: [no presenter face appears]
    prohibited_failures:
      - a presenter's face appearing
      - narration that is not Hinglish
    envelope_completeness: incomplete_by_design
    model_specific_fields: null
  capability_mappings:
    atomic:
