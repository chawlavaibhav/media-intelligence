      - Hindi or Urdu narration a competent speaker cannot follow
      - narration voice changing within a language version
      - speech and picture drifting apart over a long runtime
    model_specific_fields: null
  capability_mappings:
    atomic:
      - spoken_script_correctness
      - pronunciation_intelligibility
      - voice_identity_consistency
      - audio_video_synchronisation
      - delivery_format_compliance
    compound_cooccurrence:
      - one_deliverable_in_three_spoken_languages
      - indic_speech_at_long_form_duration
  evaluator_dependencies:
    - family: speech_audio_av
      for: [spoken_script_correctness, pronunciation_intelligibility, voice_identity_consistency, audio_video_synchronisation]
      qualified: false
      hard_blocker: >
        The project holds no audio material at all, and no Indic speech instrument has ever been
        qualified. This case cannot be scored on its central requirement by any current means.
    - family: deterministic_cv_geometry
      for: [delivery_format_compliance]
      qualified: false
    - family: creative_commercial
      for: [composition_brand_register]
      qualified: false
  stage_fit:
    stage_a_atomic: false
    stage_b_compound: no
    stage_c_end_to_end: blocked
    rationale: >
      Not a Stage-C candidate today, and it should not be forced into one. Its value is as evidence:
      it is the single marketplace-attested case where an Indic language is part of producing a
      video rather than a separate voice-over service, and the project can neither run it nor judge it.
  open_questions:
    - Whether the two postings really are one job. The research says same client; it does not say same deliverable.
    - Whether on-screen safety text must be localised. Unstated, and it would add a Devanagari and Nastaliq exact-text requirement that would change this case completely.

