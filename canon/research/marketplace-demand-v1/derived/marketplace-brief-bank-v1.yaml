- case_id: MKT-006
  source_marketplace: upwork
  source_record_id: UW-021
  source_title: AI Video Producer / AI Video Production Specialist
  source_file: canon/research/marketplace-demand-v1/sources/upwork-ai-video-demand-2026-08-26.md
  source_section_locators:
    - "Section 2, 'What custom creative looks like', first bullet"
    - 'Section 5 Tier 1 table, row 5'
    - 'Appendix row 21'
  source_posted: '25 Aug'
  buyer_named_tools: []
  source_facts_used:
    - fact: Two recurring named characters, Thomas and Anna, must stay visually and vocally consistent across a series; live SaaS dashboard footage is integrated; the register is subtle comedy; the buyer explicitly instructs that the AI-avatar look be avoided; and a reusable character style guide is requested. Ten videos for $700.
      verbatim: two recurring named characters (Thomas and Anna) who must stay visually and vocally consistent across a series, integrated live SaaS dashboard footage, "subtle comedy", explicit instruction to *avoid* the AI-avatar look, plus a request to build a reusable character style guide. Enormous scope for $700 across 10 videos.
    - fact: Ten videos now, with an ongoing library intended.
      verbatim: '$700 fixed | **10 videos** now, ongoing library intended'
    - fact: The client has a 70% hire rate over 49 posted jobs and $34K recorded spend.
      verbatim: '$34K · 70% hire · 49 posted'
  customer_brief: |
    A series of ten videos for our B2B SaaS product, with an ongoing library intended after that.

    Two recurring characters, Thomas and Anna. They must look the same and sound the same in
    every video in the series. Live footage of our SaaS dashboard is integrated into the videos.
    The tone is subtle comedy. We specifically want to avoid the static AI-avatar-talking-into-
    the-camera look. We also want a reusable character style guide out of this.

    $700 fixed for the ten.
  normalized_request:
    R01_requested_operation:
      value: generate
      provenance: customer_implied
      rationale: >
        New videos are being made. Supplied dashboard footage is integrated into them, but that
        does not make it compose: compose in the grammar means combining two or more SUPPLIED
        artefacts, and here only one side is supplied while the character performance is generated.
        The grammar has no cleaner value, and the mismatch is recorded in grammar_gaps rather than
        resolved by stretching a definition.
    R02_supplied_assets:
      value:
        - asset_id: mkt006_dashboard_footage
          media_type: video
          role: unresolved_not_in_grammar_v1
          applies_to: saas_product
          description: live screen recordings of the buyer's SaaS dashboard, which must appear in the output
          grammar_gap_ref: GG-01
        - asset_id: mkt006_character_sheets
          media_type: image
          role: character_sheet
          applies_to: character_thomas
          description: identity references for the two recurring characters
      provenance: customer_stated
      sub_field_provenance:
        dashboard_footage: customer_stated
        character_sheets: experiment_supplied_fixture
      rationale: >
        The dashboard footage is stated by the buyer - "integrated live SaaS dashboard footage".
        The character references are NOT: the buyer asks for a style guide to be BUILT, which means
        no such reference exists yet. The benchmark supplies character sheets so identity is
        measurable, and that is a fixture.
    R03_mutation_intents:
      value: null
      provenance: absent
    R04_deliverable_set:
      value:
        cardinality: 10
        variation_axis: message
        acceptance_basis: per_deliverable
        set_level_invariant: character identity holds across every deliverable in the series
      provenance: customer_stated
      sub_field_provenance:
        cardinality: customer_stated
        set_level_invariant: customer_stated
        acceptance_basis: system_derived
      rationale: >
        THE MOST STRUCTURALLY INTERESTING CASE IN THE BANK. The buyer states ten deliverables AND a
        constraint that only exists across the set - the characters must be the same people in
        every one. The grammar's acceptance_basis offers per_deliverable OR set_level as
        alternatives; this request needs per-video acceptance WITH a set-level invariant. Recorded
        as grammar gap GG-03 rather than forced into one of the two values.
    R05_modality:
      value: video
      provenance: customer_stated
    R06_entities:
      value:
        - entity_id: character_thomas
          entity_type: character
          role: hero
          identity_invariants: [face, build, voice, wardrobe]
        - entity_id: character_anna
          entity_type: character
          role: hero
          identity_invariants: [face, build, voice, wardrobe]
        - entity_id: saas_product
          entity_type: product
          role: supporting
          identity_invariants: [dashboard_interface]
      provenance: customer_stated
      sub_field_provenance:
        entity_presence: customer_stated
        identity_invariants_visual_and_vocal: customer_stated
        identity_invariants_wardrobe: experiment_supplied_fixture
      rationale: >
        "Visually and vocally consistent" is an unusually explicit identity statement - the buyer
        names both channels. Wardrobe is NOT named, and the grammar warns specifically that
        "keep her looking the same" does not tell you whether wardrobe is part of identity. It is
        added here as a fixture so the case is repeatable, and never as customer intent.
    R07_relationships:
      value:
        - subject: character_thomas
          relation: appears_alongside
          object: character_anna
      provenance: customer_implied
      rationale: Two recurring characters in one series implies they share the fiction. Whether they share a frame is not stated.
    R08_text_requirements:
      value: null
      provenance: absent
    R09_brand_requirements:
      value:
        prohibitions: [the static AI-avatar-talking-into-camera look]
      provenance: customer_stated
      rationale: >
        A rare and valuable thing: an explicit customer-stated PROHIBITION on an aesthetic. It is a
        quality bar, not a tooling objection, and it belongs in prohibited_failures rather than in
        the subjective column, because the buyer named it.
    R10_language_topology:
      value:
        spoken: en
        on_screen_copy: none
        subtitles: none
      provenance: experiment_supplied_fixture
      rationale: Not stated. A Norway-based buyer selling B2B SaaS is not a language statement.
    R11_speaker_topology:
      value:
        visible_speakers: 2
        offscreen_voices: 0
        turn_boundaries_required: true
        script_exactness: exact
      provenance: customer_stated
      sub_field_provenance:
        visible_speakers: customer_stated
        turn_boundaries_required: customer_implied
        script_exactness: experiment_supplied_fixture
      rationale: >
        Two characters who must sound consistent are two speaking parts. Two speakers in one piece
        means turn boundaries matter - which capability at a time and whose lips move. The script
        itself is a benchmark fixture.
    R12_temporal_structure:
      value: null
      provenance: absent
      rationale: No duration is stated for any video in the series.
    R13_subject_motion:
      value:
        description: characters perform rather than deliver to camera
      provenance: customer_implied
      rationale: >
        Follows directly from the stated prohibition on the static talking-into-camera look. This is
        the clearest legitimate customer_implied inference in the bank: the buyer named what they do
        not want, and its complement is a motion requirement.
    R14_camera_motion:
      value: null
      provenance: absent
    R15_delivery:
      value: null
      provenance: absent
    R16_specification_provenance:
      value:
        customer_specified: [R01, R02, R04, R05, R06, R07, R09, R11, R13, R18]
        customer_omitted: [R03, R08, R10, R12, R14, R15]
        derived: [{field: R04.acceptance_basis, by: benchmark, why: the buyer states a set-level invariant but not an acceptance basis}]
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: no duration is stated for any video in the series
          affected_fields: [R12]
        - marker_type: underspecification
          detail: acceptance basis unstated while a set-level identity invariant is stated
          affected_fields: [R04]
        - marker_type: unverifiable_claim
          detail: '"subtle comedy" is a register the customer asserts; whether an output achieves it has no ground truth'
          affected_fields: [R18]
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - Thomas and Anna look the same in every video of the series
          - Thomas and Anna sound the same in every video of the series
          - the supplied dashboard footage appears in the videos
          - ten videos
        stated_rejection_criteria:
          - the static AI-avatar-talking-directly-into-camera look
        soft_preferences:
          - subtle comedy
      provenance: customer_stated
      rationale: >
        THE ONLY CASE IN THE BANK where the buyer states an explicit REJECTION criterion -
        verified by measure_coverage.py, which counts one. Seventeen of eighteen real commercial
        postings say what they want and never say what would make them reject it. That is a
        finding about how commercial briefs are actually written, and it sits awkwardly beside an
        authored bank in which acceptance criteria are the defining strength.
  fixture_requirements:
    - fixture_id: FX-006-characters
      what: two character identity sheets - face, build, wardrobe - and a fixed voice sample for each
      why: the buyer asks for a style guide to be built, so no reference exists; identity across a series cannot be measured without one
      rights_requirement: synthetic identities; consent required if any real person's likeness or voice is used
      blocks_runnable: false
    - fixture_id: FX-006-dashboard
      what: screen recordings of a fictional SaaS dashboard
      why: the buyer's real footage is not held, and this asset is customer-stated so a stand-in is required
      rights_requirement: benchmark-authored interface
      blocks_runnable: false
    - fixture_id: FX-006-scripts
      what: ten two-hander scripts in a subtle-comedy register, with turn boundaries marked
      why: needed for spoken-script correctness and for two-speaker turn assignment
      rights_requirement: benchmark-authored
      blocks_runnable: false
    - fixture_id: FX-006-duration
      what: a fixed per-video duration
      why: the buyer states none
      rights_requirement: none
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: >
    Every input is constructible without the buyer. Note what this costs: the character identities
    the buyer has not yet defined become benchmark fixtures, so the case tests identity PERSISTENCE
    against a reference we chose, not against the buyer's unstated taste.
  execution_feasibility:
    attemptable_without_a_planner: partially
    note: >
      Individual short scenes are attemptable. Holding two identities and one interface stable
      across ten separate deliverables is the hard part, and no capability in the contract measures
      cross-asset identity as a distinct thing - it is handled as an observation SCOPE of
      person_identity and product_identity.
  acceptance_contract:
    acceptance_basis: per_deliverable_with_set_level_invariant
    grammar_gap_ref: GG-03
    hard_objective:
      - requirement: Thomas is recognisably the same person in every deliverable
        provenance: customer_stated
        capability: person_identity
      - requirement: Anna is recognisably the same person in every deliverable
        provenance: customer_stated
        capability: person_identity
      - requirement: each character's voice is the same voice in every deliverable
        provenance: customer_stated
        capability: voice_identity_consistency
      - requirement: neither character drifts within a single clip
        provenance: customer_implied
        capability: person_stability_in_clip
      - requirement: the supplied dashboard footage appears in the output
        provenance: customer_stated
        capability: reference_conditioning
      - requirement: when two characters speak, the right lips move for the right line
        provenance: customer_implied
        capability: two_speaker_turn_assignment_and_lip_sync
      - requirement: wardrobe stays constant per character across the series
        provenance: experiment_supplied_fixture
        capability: wardrobe_invariant_fidelity
      - requirement: ten deliverables
        provenance: customer_stated
        capability: delivery_format_compliance
    subjective_creative:
      - requirement: reads as subtle comedy rather than as broad comedy or as no comedy
        provenance: customer_stated
        capability: composition_brand_register
        no_deterministic_ground_truth: true
        note: The buyer stated the register. That makes the REQUIREMENT customer-stated; it does not make the judgement objective.
      - requirement: does not read as a static AI avatar addressing the camera
        provenance: customer_stated
        capability: motion_action_quality
        no_deterministic_ground_truth: true
      - requirement: the characters read as people rather than as generated puppets
        provenance: customer_implied
        capability: human_anatomy_integrity
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - '"Subtle comedy" has no instrument and no qualified reviewer panel. It needs human judgement and probably more than one judge.'
      - Whether an output avoids "the AI look" is exactly the kind of perceptual judgement family 6 was created for and family 6 is unqualified.
      - Cross-asset identity across ten deliverables has no instrument today.
  route_neutral_generation_brief: |
    Produce a series of ten videos for a business software product, featuring two recurring
    characters called Thomas and Anna.

    Thomas must be the same person in all ten. Anna must be the same person in all ten. Each must
    also sound like the same person throughout - the voices are part of the identity, not a
    detail. Neither may change appearance inside a single video.

    The supplied recordings of the product's dashboard must appear in the videos rather than being
    recreated or approximated.

    Where both characters speak, it must be visible which of them is speaking at any moment.

    The register is subtle comedy. The customer has explicitly rejected output that looks like a
    static AI presenter talking directly into the camera; the characters must be doing something
    rather than addressing the lens.

    Duration, shot structure and staging are open choices.
  prompt_ready_envelope:
    objective: build a recurring-character video series for a B2B SaaS product
    output_modality: video
    duration_seconds: unspecified_by_customer
    aspect_ratio: '16:9'
    aspect_ratio_provenance: experiment_supplied_fixture
    placement: unspecified_by_customer
    audience: business software buyers
    audience_provenance: customer_implied
    entities:
      - id: character_thomas
        type: character
        role: hero
        must_stay_constant: [face, build, voice, wardrobe]
        scope: across_the_whole_series
      - id: character_anna
        type: character
        role: hero
        must_stay_constant: [face, build, voice, wardrobe]
        scope: across_the_whole_series
      - id: saas_product
        type: product
        role: supporting
        must_stay_constant: [dashboard_interface]
    supplied_assets: [FX-006-characters, FX-006-dashboard, FX-006-scripts]
    identity_invariants:
      - Thomas is one person across all ten deliverables, in look and in voice
      - Anna is one person across all ten deliverables, in look and in voice
      - the dashboard shown is the supplied dashboard
    product_fidelity: the supplied dashboard recordings must appear, not a recreation of them
    script_or_dialogue: FX-006-scripts, two-hander, turn boundaries marked
    exact_on_screen_text: []
    language: {spoken: en, on_screen: none, subtitles: none}
    visual_tone: subtle comedy
    visual_tone_provenance: customer_stated
    temporal_beats: unspecified_by_customer
    cta: unspecified_by_customer
    brand_constraints: []
    deliverable_set: {cardinality: 10, acceptance: per_deliverable_with_set_level_invariant}
    prohibited_failures:
      - a character who is not the same person as in the previous deliverable
      - a character whose voice changes between deliverables
      - the static AI-avatar-talking-into-camera look, which the customer explicitly rejected
      - the wrong character's lips moving on a line
      - a recreated or approximated dashboard instead of the supplied footage
    model_specific_fields: null
  capability_mappings:
    atomic:
      - person_identity
      - wardrobe_invariant_fidelity
      - voice_identity_consistency
      - person_stability_in_clip
      - two_speaker_turn_assignment_and_lip_sync
      - reference_conditioning
      - motion_action_quality
      - human_anatomy_integrity
      - composition_brand_register
    compound_cooccurrence:
      - two_recurring_identities_across_a_series
      - visual_identity_plus_vocal_identity_on_the_same_entity
      - generated_performance_composited_with_supplied_live_footage
      - two_speaker_dialogue_with_identity_constraints
  evaluator_dependencies:
    - family: structured_visual_vlm
      for: [person_identity, wardrobe_invariant_fidelity, reference_conditioning, human_anatomy_integrity]
      qualified: false
      hard_blocker: >
        This family is the project's single largest evaluator blocker - it needs person and product
        reference packs WITH same-category decoys, because without decoys a qualification cannot
        detect a permissive judge at all.
    - family: speech_audio_av
      for: [voice_identity_consistency, two_speaker_turn_assignment_and_lip_sync]
      qualified: false
      hard_blocker: No audio material is held, so nothing here can be qualified today.
    - family: temporal_video
      for: [person_stability_in_clip, motion_action_quality]
      qualified: false
    - family: creative_commercial
      for: [composition_brand_register]
      qualified: false
    - family: operational_logging
      for: [cost_and_cpao, reliability_pass_at_k]
      qualified: false
  stage_fit:
    stage_a_atomic: false
    stage_b_compound: primary_source_material
    stage_c_end_to_end: primary
    rationale: >
      A top Stage-C candidate and the best compound-scenario source in the bank. It carries the one
      thing the research identifies as flipping an AI-video job from routine to hard - identity that
      must hold across a series - and it carries it in both the visual and the vocal channel at once,
      which no item in the existing authored bank or its extension does.
  open_questions:
    - No duration is stated. It changes cost and feasibility completely and cannot be recovered from the record.
    - The buyer wants a reusable character style guide as a deliverable. That is a document, not media, and is excluded from this case rather than folded in.
    - Whether Thomas and Anna appear together in frame or in alternating videos. Not stated, and it decides whether two-speaker capabilities apply at all.

