    exact_on_screen_text: []
    language: {spoken: en, on_screen: none, subtitles: none}
    visual_tone: as specified per item by the supplied visual guidance
    visual_tone_provenance: customer_stated
    temporal_beats: unspecified_by_customer
    cta: unspecified_by_customer
    brand_constraints: []
    deliverable_set: {cardinality: 12, stated_weekly_volume: '75-100', acceptance: per_deliverable}
    prohibited_failures:
      - output that ignores the supplied visual guidance
      - spoken words differing from the supplied script
      - duration outside the 30-300 second range
      - quality that degrades across the batch
    model_specific_fields: null
  capability_mappings:
    atomic:
