      - requirement: carries a consistent personality, not only a consistent face
        provenance: customer_stated
        capability: composition_brand_register
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - Realism has no qualified instrument and no threshold. Any number attached to it today would be invented.
      - Whether a persona has a consistent PERSONALITY, as distinct from a consistent appearance, is not measured by any capability in the contract.
  route_neutral_generation_brief: |
    Produce four short videos featuring one recurring presenter figure for a football performance
    laboratory brand.

    No reference for this figure exists. The first output establishes who they are; every
    subsequent output must be the same person - same face, same build, same hair, same voice.
    Within any single video the figure must not change.

    Each video delivers its own supplied script. The figure should read as a real person.
    Everything else is an open choice.
  prompt_ready_envelope:
    objective: establish and hold a persistent brand presenter persona across a set of videos
    output_modality: video
    duration_seconds: unspecified_by_customer
    aspect_ratio: '9:16'
    aspect_ratio_provenance: experiment_supplied_fixture
    placement: social
    placement_provenance: customer_implied
    audience: athletes and sports performance customers
    audience_provenance: customer_implied
    entities:
      - id: brand_persona
        type: person
        role: hero
        must_stay_constant: [face, build, hair, voice]
        scope: across_the_whole_set
        reference_exists: false
    supplied_assets: [FX-008-scripts]
    identity_invariants:
      - identity is established by the first accepted output and held thereafter
    product_fidelity: not_applicable
    script_or_dialogue: FX-008-scripts, one per deliverable, spoken verbatim
    exact_on_screen_text: []
    language: {spoken: en, on_screen: none, subtitles: none}
    visual_tone: realistic, sports-adjacent
    visual_tone_provenance: customer_stated
    temporal_beats: unspecified_by_customer
    cta: unspecified_by_customer
    brand_constraints: []
    deliverable_set: {cardinality: 4, acceptance: per_deliverable_with_set_level_invariant}
    prohibited_failures:
      - a different person in a later deliverable
      - voice changing between deliverables
      - facial or anatomical breakdown that makes the figure read as generated
    model_specific_fields: null
  capability_mappings:
    atomic:
      - person_identity
      - voice_identity_consistency
      - person_stability_in_clip
      - human_anatomy_integrity
      - single_speaker_lip_sync
      - spoken_script_correctness
    compound_cooccurrence:
      - identity_established_without_a_reference_then_held
      - visual_and_vocal_identity_on_one_entity_across_a_set
  evaluator_dependencies:
    - family: structured_visual_vlm
      for: [person_identity, human_anatomy_integrity]
      qualified: false
      hard_blocker: needs a person reference pack with same-category decoys, which the project does not hold
    - family: speech_audio_av
      for: [voice_identity_consistency, single_speaker_lip_sync, spoken_script_correctness]
      qualified: false
      hard_blocker: no audio material is held
    - family: temporal_video
      for: [person_stability_in_clip]
      qualified: false
    - family: creative_commercial
      for: [composition_brand_register]
      qualified: false
  stage_fit:
    stage_a_atomic: false
    stage_b_compound: primary_source_material
    stage_c_end_to_end: primary
    rationale: >
      Valuable because of what it lacks. Every identity item in the authored bank and its extension
      supplies a reference and asks whether the output matches it. This buyer supplies nothing and
      asks for an identity to be INVENTED and then held - a different problem with a different
      failure mode, and one no existing item tests.
  open_questions:
    - How many deliverables the persona must persist across. Unstated, and it changes the difficulty completely.
    - Whether the buyer intended still images, video, or both. The record does not say.

