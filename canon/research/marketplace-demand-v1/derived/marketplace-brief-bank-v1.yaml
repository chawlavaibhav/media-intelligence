- case_id: MKT-004
  source_marketplace: upwork
  source_record_id: UW-063
  source_title: AI Lecture Videos, Narration & Assessment ($20/video)
  source_file: canon/research/marketplace-demand-v1/sources/upwork-ai-video-demand-2026-08-26.md
  source_section_locators:
    - "Section 2, 'What productized looks like here', fourth bullet"
    - 'Section 5 Tier 1 table, row 3'
    - 'Appendix row 63'
  source_posted: '25 Aug'
  buyer_named_tools: []
  source_facts_used:
    - fact: Six courses of eight weeks of lectures each, priced at $20 per video, with a supplied PDF as the source material, $720 in total.
      verbatim: '6 courses × 8 weeks of lectures, **$20 per video**, source material is a supplied PDF. $720 total, 10–15 proposals.'
    - fact: The research states the volume as 48 lectures at $20 per video.
      verbatim: '$20 per video × 48 lectures'
    - fact: The posting title includes narration and assessment alongside the video.
      verbatim: AI Lecture Videos, Narration & Assessment ($20/video)
  customer_brief: |
    Lecture videos for six courses, eight weeks of lectures each - 48 videos. The source material
    for each is a PDF we supply. We need narration and assessment alongside the video. $20 per
    video, $720 in total.
  normalized_request:
    R01_requested_operation:
      value: generate
      provenance: customer_implied
      rationale: >
        A lecture video is produced from a document. Nothing is being altered, so this is generate.
        The PDF is the content source, not an artefact under operation.
    R02_supplied_assets:
      value:
        - asset_id: mkt004_course_pdf
          media_type: document
          role: unresolved_not_in_grammar_v1
          applies_to: null
          description: course PDF supplying the material each lecture must convey
          grammar_gap_ref: GG-02
      provenance: customer_stated
      rationale: >
        Explicitly supplied by the buyer. Same grammar gap as MKT-003 and independently attested
        by a different buyer: the asset_role vocabulary has no value for "document supplying the
        content the deliverable must convey".
    R03_mutation_intents:
      value: null
      provenance: absent
    R04_deliverable_set:
      value:
        cardinality: 48
        variation_axis: message
        acceptance_basis: per_deliverable
      provenance: customer_stated
      sub_field_provenance:
        cardinality: customer_stated
        acceptance_basis: customer_stated
        variation_axis: customer_implied
      rationale: >
        Six courses times eight weeks is 48, and the research states 48 directly. Per-video pricing
        makes per-deliverable acceptance customer-stated, as in MKT-002.
    R05_modality:
      value: video
      provenance: customer_stated
    R06_entities:
      value: null
      provenance: absent
      rationale: No presenter, product or character is named. A lecture video may have no visible person at all and nothing is invented.
    R07_relationships:
      value: null
      provenance: absent
    R08_text_requirements:
      value: null
      provenance: absent
      rationale: >
        Tempting and wrong to fill. Lecture videos usually carry on-screen text, but this buyer
        states none, and manufacturing an exact-text requirement here would invent the single
        requirement the authored bank already over-tests.
    R09_brand_requirements:
      value: null
      provenance: absent
    R10_language_topology:
      value:
        spoken: en
        on_screen_copy: none
        subtitles: none
      provenance: experiment_supplied_fixture
      rationale: Not stated. English fixed as a fixture.
    R11_speaker_topology:
      value:
        visible_speakers: 0
        offscreen_voices: 1
        turn_boundaries_required: false
        script_exactness: approximate
      provenance: customer_implied
      sub_field_provenance:
        offscreen_voices: customer_stated
        script_exactness: customer_implied
        visible_speakers: experiment_supplied_fixture
      rationale: >
        "Narration" is stated in the title, so a spoken track is customer-stated. Exactness is
        APPROXIMATE, not exact, and this is the important judgement: the buyer supplies source
        material to be taught from, not a verbatim script to be read. Upgrading this to exact
        would invent a constraint and generate false failures, which the grammar warns about at R08.
    R12_temporal_structure:
      value: null
      provenance: absent
      rationale: No lecture duration is stated anywhere in the record.
    R13_subject_motion:
      value: null
      provenance: absent
    R14_camera_motion:
      value: null
      provenance: absent
    R15_delivery:
      value: null
      provenance: absent
    R16_specification_provenance:
      value:
        customer_specified: [R01, R02, R04, R05, R11, R18]
        customer_omitted: [R03, R06, R07, R08, R09, R10, R12, R13, R14, R15]
        derived: [{field: R11.visible_speakers, by: benchmark, why: nothing states whether a presenter is visible}]
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: no lecture duration is stated, so the size of each deliverable is unknown
          affected_fields: [R12]
        - marker_type: underspecification
          detail: '"assessment" is a deliverable in the title but is not a media artefact and has no representation in this grammar'
          affected_fields: [R04]
      permitted_scope_note: >
        The assessment component is recorded and then set aside. It is a text deliverable, outside
        the media-generation scope this bank covers, and is not silently folded into the video.
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - 48 lecture videos across six courses
          - each built from its supplied course PDF
          - each carries narration
        stated_rejection_criteria: []
      provenance: customer_stated
  fixture_requirements:
    - fixture_id: FX-004-pdf
      what: a benchmark-authored course PDF of realistic length and structure, plus its factual key
      why: content fidelity to a supplied document cannot be measured without holding the document and its ground truth
      rights_requirement: benchmark-authored; no third-party course material
      blocks_runnable: false
    - fixture_id: FX-004-scope
      what: a fixed per-lecture duration and a fixed subset size for a runnable slice
      why: the buyer states neither a duration nor anything that bounds a single run
      rights_requirement: none
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: Inputs are constructible. Nothing requires the buyer.
  execution_feasibility:
    attemptable_without_a_planner: false
    note: >
      48 deliverables of unstated but certainly multi-minute length. Same shape as MKT-003 and
      the same conclusion: this is ordinary paid work that needs a plan the project has no object for.
  acceptance_contract:
    acceptance_basis: per_deliverable
    hard_objective:
      - requirement: each lecture video carries narration
        provenance: customer_stated
        capability: spoken_script_correctness
      - requirement: the narration is intelligible
        provenance: customer_implied
        capability: pronunciation_intelligibility
      - requirement: one narration voice across the set
        provenance: experiment_supplied_fixture
        capability: voice_identity_consistency
      - requirement: audio and picture remain aligned
        provenance: system_derived
        capability: audio_video_synchronisation
    subjective_creative:
      - requirement: the lecture actually teaches what the supplied PDF contains
        provenance: customer_stated
        capability: proposition_objective_fit
        no_deterministic_ground_truth: true
        note: >
          The requirement is customer-stated - the PDF is the source material. Whether the video
          faithfully conveys it is a judgement, and no evaluator family in the contract measures
          fidelity of conveyed CONTENT to a supplied document. That is a real coverage hole.
      - requirement: paced as instruction rather than as advertising
        provenance: customer_implied
        capability: hook_pacing_temporal_hierarchy
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - Content fidelity to a supplied document has no evaluator family and would need a subject-matter reviewer.
      - Factual correctness of taught material is outside every capability in the contract.
  route_neutral_generation_brief: |
    Produce a lecture video for each week of a course, using the supplied course PDF as the
    material to be taught.

    Each video carries spoken narration that conveys the content of its section of the document.
    The narration is intelligible and uses one consistent voice across the whole course. Speech
    and picture stay aligned.

    The narration does not have to reproduce the document word for word - the buyer supplied
    material to teach from, not a script to read. What appears on screen, and how long each
    lecture runs, are open choices.
  prompt_ready_envelope:
    objective: turn supplied course documents into narrated lecture videos
    output_modality: video
    duration_seconds: unspecified_by_customer
    aspect_ratio: '16:9'
    aspect_ratio_provenance: experiment_supplied_fixture
    placement: course_delivery_platform
    placement_provenance: customer_implied
    audience: enrolled students
    audience_provenance: customer_implied
    entities: []
    supplied_assets: [FX-004-pdf]
    identity_invariants:
      - one narration voice across the course
    product_fidelity: not_applicable
    script_or_dialogue: derived from FX-004-pdf, approximate not verbatim
    exact_on_screen_text: []
    language: {spoken: en, on_screen: none, subtitles: none}
    visual_tone: instructional
    visual_tone_provenance: customer_implied
    temporal_beats: unspecified_by_customer
    cta: none
    brand_constraints: []
    deliverable_set: {cardinality: 48, one_per: course_week, acceptance: per_deliverable}
    prohibited_failures:
      - narration that contradicts or omits the supplied material
      - narration voice changing across the course
      - unintelligible narration
      - speech and picture drifting apart
    model_specific_fields: null
  capability_mappings:
    atomic:
      - spoken_script_correctness
      - pronunciation_intelligibility
      - voice_identity_consistency
      - audio_video_synchronisation
      - delivery_format_compliance
    compound_cooccurrence:
      - document_sourced_content_plus_speech
      - voice_identity_across_a_large_set
  evaluator_dependencies:
    - family: speech_audio_av
      for: [spoken_script_correctness, pronunciation_intelligibility, voice_identity_consistency, audio_video_synchronisation]
      qualified: false
      hard_blocker: The project holds no audio material, so this family cannot be qualified today.
    - family: creative_commercial
      for: [proposition_objective_fit, hook_pacing_temporal_hierarchy]
      qualified: false
    - family: operational_logging
      for: [cost_and_cpao]
      qualified: false
  evaluator_coverage_gap:
    gap: fidelity of conveyed content to a supplied source document
    why_it_matters: >
      This is the buyer's actual acceptance test and no capability in Capability Contract v2
      measures it. It is not the same as spoken_script_correctness, which compares speech against
      an exact expected string. Here there is no expected string - there is a document, and the
      question is whether the video teaches it.
  stage_fit:
    stage_a_atomic: false
    stage_b_compound: no
    stage_c_end_to_end: secondary
    rationale: >
      Secondary for Stage C because its central acceptance condition has no evaluator family at
      all. Its main value now is as the clearest evidence that document-to-media content fidelity
      is an uncovered requirement that real buyers pay for.
  open_questions:
    - How long each lecture should be. Unstated, and it determines everything about feasibility.
    - Whether "assessment" was expected as part of the same deliverable. Recorded and deliberately excluded from this media case.

