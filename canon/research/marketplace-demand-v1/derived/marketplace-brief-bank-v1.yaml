        provenance: customer_stated
        capability: delivery_format_compliance
      - requirement: Hindi and Urdu spoken versions exist and say what the script says
        provenance: customer_stated
        capability: spoken_script_correctness
      - requirement: the Hindi and Urdu narration is intelligible to a competent speaker
        provenance: customer_implied
        capability: pronunciation_intelligibility
      - requirement: the same narration voice character is used within each language version
        provenance: experiment_supplied_fixture
        capability: voice_identity_consistency
      - requirement: audio and picture remain aligned across a twenty-minute runtime
        provenance: system_derived
        capability: audio_video_synchronisation
    subjective_creative:
      - requirement: reads as a compliance induction rather than as promotional film
        provenance: customer_implied
        capability: composition_brand_register
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - Whether Hindi and Urdu narration is correct and natural needs competent human readers, and the project has already established that one reader is not ground truth.
      - No Indic speech instrument of any kind has been qualified.
  route_neutral_generation_brief: |
    Produce an industrial health, safety, security and environment induction video of fifteen to
    twenty minutes, and Hindi and Urdu spoken versions of it.

    In each language version the narration must say what the script for that language says, and
    must be intelligible to a competent speaker of it. Within each version one consistent narration
    voice is used. Speech and picture stay aligned for the full runtime.

    The customer has not said whether on-screen text exists or must be localised; nothing here
    assumes it does. How the video is produced or how the language versions are made is not
    specified.
