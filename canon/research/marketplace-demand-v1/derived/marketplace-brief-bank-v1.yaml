        script_exactness: exact
      provenance: customer_implied
      sub_field_provenance:
        script_exactness: customer_implied
        visible_speakers: experiment_supplied_fixture
    R12_temporal_structure:
      value: null
      provenance: absent
    R13_subject_motion:
      value: null
      provenance: absent
    R14_camera_motion:
      value: null
      provenance: absent
      rationale: '"High end cinematic" is a register. As in MKT-012, no camera instruction is read into it.'
    R15_delivery:
      value: null
      provenance: absent
    R16_specification_provenance:
      value:
        customer_specified: [R01, R02, R05, R11, R18]
        customer_omitted: [R03, R07, R08, R09, R12, R13, R14, R15]
        derived: []
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: the supplied concept's content is not in the record, so "did it realise the concept" cannot be checked against anything real
          affected_fields: [R02, R18]
        - marker_type: underspecification
          detail: '"high end" is a quality bar with no stated threshold'
          affected_fields: [R18]
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - the ad realises the supplied concept
          - the ad delivers the supplied script
        soft_preferences:
          - high end
          - cinematic
        stated_rejection_criteria: []
      provenance: customer_stated
  fixture_requirements:
    - fixture_id: FX-018-concept
      what: a written creative concept for an ad, specific enough that "was this concept realised" is answerable
      why: this case's distinguishing feature is a supplied concept, and it needs one to exist
      rights_requirement: benchmark-authored
      blocks_runnable: false
    - fixture_id: FX-018-script
      what: a matching script
      why: needed for spoken-script correctness
      rights_requirement: benchmark-authored
      blocks_runnable: false
    - fixture_id: FX-018-product
      what: a product with reference stills
      why: an ad needs something to advertise
      rights_requirement: benchmark-owned
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: Constructible. Writing a concept specific enough to be checkable is the substantive work.
  execution_feasibility:
    attemptable_without_a_planner: true
    note: A single short-to-medium commercial piece with no stated duration; a short version is attemptable.
  acceptance_contract:
    acceptance_basis: per_deliverable
    hard_objective:
      - requirement: the spoken words match the supplied script
        provenance: customer_implied
        capability: spoken_script_correctness
      - requirement: the product matches its reference
        provenance: experiment_supplied_fixture
        capability: product_identity
      - requirement: the elements the concept specifies are present
        provenance: customer_stated
        capability: reference_conditioning
    subjective_creative:
      - requirement: the finished ad realises the supplied concept rather than merely containing its parts
        provenance: customer_stated
        capability: proposition_objective_fit
        no_deterministic_ground_truth: true
        note: >
          The sharpest subjective requirement in the bank. Every element of a concept can be present
          while the concept has not been realised, and no instrument distinguishes those two states.
      - requirement: reads as high-end rather than as competent
        provenance: customer_stated
        capability: composition_brand_register
        no_deterministic_ground_truth: true
      - requirement: the product is the hero
        provenance: customer_implied
        capability: hierarchy_product_as_hero
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - '"Concept realised" and "high end" both need an independent reviewer panel, and the creative evaluator family has none and is unqualified.'
  route_neutral_generation_brief: |
    Produce one commercial advertisement realising the supplied creative concept and delivering
    the supplied script.

    The concept specifies what the ad is; every element it names must be present, and the finished
    piece must read as that concept rather than as a collection of its parts. The spoken words must
    be the words of the script. The product must be the supplied product.

    The register is high-end and cinematic. How that is achieved is not specified here, and the
    tools the buyer happens to name are recorded as their preference rather than as a requirement.
  prompt_ready_envelope:
    objective: execute a customer-supplied creative concept as a high-end commercial advertisement
    output_modality: video
    duration_seconds: 30
    duration_provenance: experiment_supplied_fixture
    aspect_ratio: '16:9'
    aspect_ratio_provenance: experiment_supplied_fixture
    placement: unspecified_by_customer
    audience: unspecified_by_customer
    entities:
      - id: advertised_product
        type: product
        role: hero
        must_stay_constant: [form, branding]
    supplied_assets: [FX-018-concept, FX-018-script, FX-018-product]
    identity_invariants:
      - the product matches its reference
      - every element named in the supplied concept appears
    product_fidelity: required
    script_or_dialogue: FX-018-script, spoken verbatim
    exact_on_screen_text: []
    language: {spoken: en, on_screen: none, subtitles: none}
    visual_tone: high-end cinematic
    visual_tone_provenance: customer_stated
    temporal_beats: as set out in the supplied concept
    temporal_beats_provenance: customer_stated
    cta: unspecified_by_customer
    brand_constraints: []
    prohibited_failures:
      - an element the concept names being absent
      - spoken words differing from the script
      - the product not matching its reference
      - output that reads as generic stock advertising rather than as the supplied concept
    model_specific_fields: null
  capability_mappings:
    atomic:
      - reference_conditioning
      - product_identity
      - spoken_script_correctness
      - proposition_objective_fit
      - composition_brand_register
      - hierarchy_product_as_hero
      - technical_visual_integrity
    compound_cooccurrence:
      - supplied_concept_execution_fidelity
      - concept_plus_script_plus_product_in_one_deliverable
  evaluator_dependencies:
    - family: structured_visual_vlm
      for: [reference_conditioning, product_identity]
      qualified: false
    - family: speech_audio_av
      for: [spoken_script_correctness]
      qualified: false
    - family: creative_commercial
      for: [proposition_objective_fit, composition_brand_register, hierarchy_product_as_hero]
      qualified: false
      hard_blocker: >
        This family needs a fresh independent reviewer panel and known-clean assets to measure false
        criticism, and has neither. It is the family this case leans on hardest.
    - family: temporal_video
      for: [technical_visual_integrity]
      qualified: false
  stage_fit:
    stage_a_atomic: false
    stage_b_compound: candidate
    stage_c_end_to_end: primary
    rationale: >
      A strong Stage-C candidate for one specific reason: the customer supplies the concept, so the
      thing being measured is execution fidelity to a stated creative intention rather than creative
      taste. That is a far more tractable version of the creative-quality question than "is this
      good", and no item in the authored bank frames it that way.
  open_questions:
    - The buyer's actual concept is not in the record. The case tests concept-execution in general, using a concept the benchmark wrote.
    - Whether the buyer expected the named tools to be used. Recorded as preference; not treated as a requirement.

# ── Places where the grammar could not represent a real buyer request ──────────
#
# These are OBSERVATIONS ROUTED TO THE CONTROLLER, not changes. Canon may not edit a
# frozen contract, and no field, role or value has been invented here. Each gap names
# the cases that hit it and what was done instead.

grammar_gaps:
  status: OBSERVED_AND_ROUTED_NO_CHANGE_MADE
  affects: canon/experiments/pre-execution-freeze/MEDIA-REQUEST-GRAMMAR-v1.yaml
  gaps:
    - id: GG-01
      field: R02 supplied_assets[].role
      gap: >
        No role exists for material the customer supplies that must APPEAR IN the finished
        deliverable of a `generate` request. Every existing role either informs a new artefact
        (identity_reference, style_reference, brand_asset and so on) or is the artefact being
        operated on (subject_of_operation). Supplied dashboard footage that must be in the
        finished video is neither.
      cases: [MKT-005, MKT-006, MKT-013]
      strongest_evidence: >
        MKT-006, where the buyer states "integrated live SaaS dashboard footage". The footage is
        not a reference and is not being edited; it must be present in the output.
      what_was_done: 'role recorded as `unresolved_not_in_grammar_v1` with a gap reference, never mislabelled as an existing role'
      consequence_if_unaddressed: >
        The natural workaround is to call it a reference, and a reference may legitimately be
        departed from. That would silently convert a hard requirement - this exact footage must
        appear - into a soft one, and an output that omitted it entirely could pass.
    - id: GG-02
      field: R02 supplied_assets[].role
      gap: >
        No role exists for a DOCUMENT that supplies the content the deliverable must convey - a
        script, a course PDF, a creative concept, visual guidance.
      cases: [MKT-003, MKT-004, MKT-007, MKT-017, MKT-018]
      strongest_evidence: >
        Five of eighteen cases, from five different buyers, on three continents. Supplied source
        material is one of the most common things a real buyer hands over, and the research names
        it directly for each of these postings.
      what_was_done: 'role recorded as `unresolved_not_in_grammar_v1` with a gap reference'
      consequence_if_unaddressed: >
        Supplied source material is the most frequently attested buyer input in this sample and it
        currently has nowhere to live in the request record.
    - id: GG-03
      field: R04 deliverable_set.acceptance_basis
      gap: >
        The vocabulary offers per_deliverable, set_level and best_n_of_m as alternatives. Three
        cases need per-deliverable ACCEPTANCE together with a set-level INVARIANT: each video is
        approved on its own, but the same character must appear in all of them.
      cases: [MKT-006, MKT-008, MKT-009]
      strongest_evidence: >
        MKT-006, where the buyer states ten deliverables and that two named characters must stay
        consistent across the series. Choosing per_deliverable loses the cross-video requirement;
        choosing set_level wrongly implies the ten are accepted or rejected together.
      what_was_done: >
        Recorded as `per_deliverable_with_set_level_invariant` in the acceptance contract, with the
        gap reference attached, and the two components kept separate so neither is lost.
      consequence_if_unaddressed: >
        This is the requirement the research identifies as the thing that flips an AI-video job
        from routine pipeline work to expensive custom work. If the request record cannot express
        it, the benchmark cannot test the thing that decides the commercial value of the product.
    - id: GG-04
      field: R04 deliverable_set
      gap: >
        deliverable_set has a cardinality but no way to express an ongoing RATE. Several buyers
        state a rate rather than a total - two videos per week minimum, 75-100 scripts weekly, a
        substantial portion of a catalogue.
      cases: [MKT-002, MKT-007, MKT-010]
      what_was_done: 'the stated rate is recorded alongside cardinality as `recurrence` or `weekly_cardinality_stated`, and the benchmark''s own slice size is labelled a fixture'
      consequence_if_unaddressed: >
        A rate is a different economic object from a total, and it is the shape the research
        identifies as the one worth selling into. Recording only a benchmark slice size would erase it.

# ── Capabilities and evaluators these buyers need and the contract does not have ─
#
# Also OBSERVATIONS, routed to Eval and the Controller. Nothing here proposes a
# capability, and no capability id has been invented.

capability_coverage_observations:
  status: OBSERVED_AND_ROUTED_NO_CHANGE_PROPOSED
  observations:
    - id: CO-01
      observation: >
        No capability measures whether a deliverable faithfully conveys the CONTENT of a supplied
        source document. spoken_script_correctness compares speech against an exact expected string,
        which is a different question: there is no expected string when the input is a course PDF or
        a creative concept.
      cases: [MKT-004, MKT-018]
      why_it_matters: >
        For MKT-004 this is the buyer's entire acceptance test. A lecture video that is fluent,
        well-paced and about the wrong material passes every capability in the contract.
    - id: CO-02
      observation: >
        No capability treats sustained THROUGHPUT as an acceptance condition. reliability_pass_at_k
        measures how often a single attempt succeeds; latency_errors_refusals measures per-call
        behaviour. Neither answers "can you deliver 75-100 a week without quality decay".
      cases: [MKT-007]
      why_it_matters: >
        The research finds that scale-contract postings ask about capacity and workflow rather than
        about a showreel, and that this is the tier where the larger budgets sit. Throughput is a
        stated buyer requirement there, not an internal operational concern.
    - id: CO-03
      observation: >
        Cross-asset identity is handled as an observation SCOPE of person_identity and
        product_identity rather than as its own capability, which was a deliberate Controller
        decision. Five of eighteen cases here depend on it, and in three of them it is the primary
        acceptance condition rather than a secondary one.
      cases: [MKT-002, MKT-006, MKT-008, MKT-009, MKT-011]
      why_it_matters: >
        Recorded so the decision is revisited with evidence rather than reopened on preference. The
        scope treatment may well be right; what is new is how load-bearing the scope turns out to be.
    - id: CO-04
      observation: >
        Three buyers state an aesthetic PROHIBITION - avoid the AI-avatar look, do not look like
        stock AI, look unpolished rather than produced. The contract's creative family measures
        whether something achieves a positive quality. Nothing measures whether it avoids a named
        negative.
      cases: [MKT-006, MKT-010]
      why_it_matters: >
        The research reports these as the reason a premium tier exists at all: buyers are not
        objecting to AI, they are objecting to output that looks like it.

# ── What was considered, what was taken, what was left ────────────────────────

selection_and_rejection:
  source_records_recorded_by_research: 114
  source_records_classified_addressable_by_research: 67
  source_records_classified_not_addressable_by_research: 47
  counts_verified_mechanically: >
    Recomputed from the appendix table: 114 numbered rows, 67 with a bold title, 47 without. The
    appendix states that bold titles are the pipeline-addressable ones, and the research's own prose
    states 67 addressable and 47 not. The three figures agree.
  cases_built: 18
  source_rows_drawn_on: 19
  source_rows_drawn_on_note: MKT-015 is built from two postings by the same client (rows 89 and 95).
  drawn_from_addressable_rows: 16
  drawn_from_non_addressable_rows: 3
  drawn_from_non_addressable_rows_note: >
    Rows 15, 89 and 95. Both disagreements are recorded on the cases themselves
    (source_classification_disagreement) rather than resolved silently.
  rejection_reasons:
    - reason: source-classified as not addressable by an AI video pipeline
      count: 44
      examples: [wedding editing, games journalism, cold calling, developer work, ad buying]
      note: 47 rows minus the 3 drawn on with the disagreement recorded.
    - reason: a hiring ROLE or seat rather than a specified deliverable
      count_approx: 22
      examples:
        - Full-Time AI Video Creator & AI Video Editor, $2,000/mo
        - AI Video Editor, $2K/month full time, DTC
        - Video Editor - E-Commerce Content, $2,000/mo
        - AI video editor for Ecommerce brand, hourly, ongoing
        - HIRING - Video Editor, India, 6+ months
      why: >
        The task asks for explicit production-shaped jobs rather than vague roles. A posting that
        says "full-time, $2,000/month, multi-style" describes an employment relationship. Deriving a
        deliverable from it would mean authoring the brief and attributing it to the buyer.
    - reason: the deliverable is not media - it is text, voice-only, data or consulting
      count_approx: 14
      examples:
        - 'Hindi/Hinglish Video Scriptwriter for India-Focused Creatives ($500, 9:16, 15-45s, social casino)'
        - Professional VO artist - Hindi
        - Hindi Voice Data Annotator
        - Hindi to English Translation, 44 min to SRT
        - Hindi Proofreader
        - India Content & Culture Consultant
      why: >
        Out of scope for a media-generation bank. The scriptwriter posting is called out separately
        below because it is the most tempting rejection in the set.
    - reason: too thin to specify without inventing the request
      count_approx: 8
      examples:
        - 'AI Video Creator for Social Media Content (10-20s), $5'
        - 'Cinematic UGC AI Video Ads Creator, $5'
        - 'AI UGC Ads Creator for Sock Brand, $5'
        - 'HeyGen Expert - digital twin videos, $20'
      why: >
        A title and a price is not a brief. These were considered and dropped rather than padded out
        with benchmark-authored content wearing marketplace provenance. MKT-016 is retained as one
        deliberately incomplete worked example of this class; the rest are not.
    - reason: long-form with no stated content specification
      count_approx: 3
      examples:
        - 'AI Video Creator/Editor for 30-Min YouTube Story Videos, $5,000'
        - 'AI Video Creator and Editor (corporate film, India project), 6-minute premium corporate film'
      why: Duration far beyond anything attemptable, with no content specification to compensate.
  notable_rejection:
    record: UW-107
    title: Hindi/Hinglish Video Scriptwriter for India-Focused Creatives
    facts: >
      $500 fixed, fewer than 5 proposals, Poland-based client with $6K+ spend, 9:16 format, 15-45
      second creatives, social casino category, and the research's own note that this buyer clearly
      produces India-targeted creatives at volume.
    why_rejected: >
      The deliverable the buyer is paying for is a SCRIPT, not a video. Building a video benchmark
      case from it would mean inventing the production request the buyer did not make - and it would
      be the single most misleading invention available here, because it would manufacture the
      Hindi/Hinglish video-production demand the sample does not actually show.
    what_it_still_evidences: >
      That someone is paying for 9:16, 15-45 second, Hindi/Hinglish creatives for India at volume.
      That is real and it is recorded. It is format and language evidence, not a customer brief.
  fiverr_records:
    gig_pages_recorded: 42
    listing_only_rows_recorded_approx: 40
    cases_built_from_fiverr: 0
    why: >
      A gig is a seller advertising what they will do. No buyer asked for anything in any of them.
      Fiverr informed five commercial conventions, recorded in fiverr_convention_inputs, and every
      fixture those conventions shaped is labelled experiment_supplied_fixture.

