  evaluator_dependencies:
    - family: structured_visual_vlm
      for: [reference_conditioning]
      qualified: false
    - family: speech_audio_av
      for: [spoken_script_correctness]
      qualified: false
    - family: deterministic_cv_geometry
      for: [delivery_format_compliance]
      qualified: false
    - family: creative_commercial
      for: [composition_brand_register]
      qualified: false
    - family: operational_logging
      for: [reliability_pass_at_k, reproducibility, cost_and_cpao, latency_errors_refusals]
