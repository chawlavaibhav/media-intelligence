    unresolved_human_review:
      - Whether an output matches supplied visual guidance is a reference-conditioning judgement with no qualified instrument.
      - Sustained throughput as an acceptance condition has no capability in the contract at all.
  route_neutral_generation_brief: |
    Produce a batch of twelve videos, one for each supplied script.

    Each video delivers its script's words and follows the visual guidance supplied alongside it.
    Durations vary across the batch, from thirty seconds to five minutes, as the scripts specify.

    Quality must hold across the whole batch: the twelfth video is judged by the same standard as
    the first. Nothing here specifies how any of it is produced.
  prompt_ready_envelope:
    objective: sustained batch production of scripted video at volume
    output_modality: video
    duration_seconds: {min: 30, max: 300}
    aspect_ratio: '16:9'
    aspect_ratio_provenance: experiment_supplied_fixture
