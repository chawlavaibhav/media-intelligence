- case_id: MKT-015
  source_marketplace: upwork
  source_record_id: UW-095+UW-089
  source_title: Industrial HSSE Safety Video Producer, with Hindi/Urdu Voice-Over + Localisation
  source_file: canon/research/marketplace-demand-v1/sources/upwork-ai-video-demand-2026-08-26.md
  source_section_locators:
    - 'Section 6 Hindi/Indic table, rows 7 and 8'
    - 'Appendix rows 89 and 95'
  source_posted: '25 Aug'
  buyer_named_tools: []
  source_classification_disagreement:
    source_says: >
      Neither posting is bolded in the appendix, and the appendix states that bold titles are the
      pipeline-addressable ones. The research classified both as not addressable - reasonably, since
      one reads as voice-over work and the other as conventional video production.
    source_verbatim: '**Bold titles** are classified as pipeline-addressable.'
    this_bank_says: >
      Included anyway, and NOT as a claim that the research was wrong. It is included because it is
      the only place in the sample where an Indic language is part of producing a video rather than
      a separate service bought alongside one, and because the bank should record that the project
      cannot currently run or judge it. Its stage fit is `blocked`, not `primary`.
    what_would_settle_it: The posting bodies, which were not captured.
  two_posting_case_note: >
    This case is built from TWO postings by the SAME client, which the research explicitly links -
    row 8 is annotated "same client". One posting asks for a 15-20 minute industrial safety
    induction video; the other asks for Hindi/Urdu voice-over and localisation of an HSSE safety
    video. Treating them as one customer job is an inference, and it is labelled as such on every
    field it affects rather than presented as a single posting.
  source_facts_used:
    - fact: The client wants Hindi/Urdu voice-over and localisation for an HSSE safety video, at $15-20/hr.
      verbatim: '| 7 | Hindi/Urdu Voice-Over + Localisation, HSSE Safety Video | $15–20/hr | 5–10 | Ireland · $10K+ | 25 Aug | VO and localisation |'
    - fact: The same client separately wants a 15-20 minute industrial HSSE safety induction video produced, $1,000 fixed.
      verbatim: '| 8 | Industrial HSSE Safety Video Producer (same client) | $1,000 fixed | 5–10 | Ireland · $10K+ | 25 Aug | 15–20 min induction video |'
  customer_brief: |
    An industrial health, safety, security and environment induction video, 15 to 20 minutes long.
    $1,000 fixed.

    Separately, the same client wants Hindi and Urdu voice-over and localisation for an HSSE safety
    video, at $15-20 an hour.
  indic_significance: >
    THIS IS THE ONLY BUYER IN THE ENTIRE 114-POSTING SAMPLE WHO PAYS FOR HINDI AS PART OF PRODUCING
    A VIDEO. Every other Hindi and Indic posting in the research is voice-over alone, dubbing
    operations, translation, subtitling, proofreading, data annotation or a consulting role. That is
    a finding about the sample, not about the world, and it is stated in those terms in the coverage
    report.
  normalized_request:
