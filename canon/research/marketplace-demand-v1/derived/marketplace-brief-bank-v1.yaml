      verbatim: '| 3 | Faceless Video Editor — Mystery/Explainer/Historical (Hinglish) | $40 fixed | <5 | India (Delhi) · $100+ | 25 Aug | Editing, not generation. Content house running 2 channels |'
  customer_brief: |
