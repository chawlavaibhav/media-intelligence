- case_id: MKT-011
  source_marketplace: upwork
  source_record_id: UW-018
  source_title: AI Video Creator (Higgsfield, Pegasus Sports)
  source_file: canon/research/marketplace-demand-v1/sources/upwork-ai-video-demand-2026-08-26.md
  source_section_locators:
    - 'Section 5 Tier 1 table, row 6'
    - 'Appendix row 18'
  source_posted: '26 Aug'
  buyer_named_tools:
    - tool: Higgsfield
      where: job title
      treatment: >
        SOURCE METADATA ONLY. The buyer named a tool. That fact is preserved here because it tells
        us something real about how this buyer thinks, and it appears nowhere in the route-neutral
        brief, the acceptance contract or the envelope. A named tool is a production preference,
        not a statement about what the deliverable must be.
  source_facts_used:
    - fact: The buyer has a large number of licensed sports products and wants TikTok UGC plus Amazon product videos for them; hourly, fewer than five proposals, a new US client.
      verbatim: '| AI Video Creator (Higgsfield, Pegasus Sports) | Hourly | "**a large number of licensed sports products**" — TikTok UGC + Amazon product videos | Fewer than 5 | US · new client |'
    - fact: The appendix records the same posting with the tool name in the title.
      verbatim: '| 18 | **AI Video Creator – Higgsfield \| TikTok UGC + Amazon Product Videos** | Hourly | <5 | $0 · US | 26 Aug |'
  customer_brief: |
    We have a large number of licensed sports products. We need TikTok UGC videos and Amazon
    product videos for them. Hourly.
  normalized_request:
    R01_requested_operation:
      value: variants
      provenance: customer_stated
      rationale: >
        The clearest variants case in the sample and worth being precise about. The buyer wants TWO
        DIFFERENT DELIVERABLE FORMS for the same product - a TikTok UGC piece and an Amazon product
        video - and wants that across many products. Under the grammar, one creative intent
        producing a set of related deliverables is `variants`, and the grammar's own rule then
        requires cardinality greater than one, which is satisfied.
    R02_supplied_assets:
      value:
        - asset_id: mkt011_licensed_products
          media_type: image
          role: identity_reference
          applies_to: sports_product
          description: product references for licensed sports products
      provenance: customer_implied
      sub_field_provenance:
        asset_existence: customer_implied
        asset_content: experiment_supplied_fixture
      rationale: >
        A buyer who says they hold licensed products has the products. That the buyer HAS reference
        material is a fair implication. WHAT that material is is not in the record, so the content
        is a fixture. The distinction matters: this is one of the few cases where a supplied asset
        is implied rather than merely assumed.
    R03_mutation_intents:
      value: null
      provenance: absent
    R04_deliverable_set:
      value:
        cardinality: 6
        variation_axis: placement
        acceptance_basis: per_deliverable
      provenance: customer_stated
      sub_field_provenance:
        variation_axis: customer_stated
        cardinality: experiment_supplied_fixture
        acceptance_basis: system_derived
      rationale: >
        The variation axis is genuinely customer-stated: TikTok versus Amazon is a placement split,
        not a message split. The benchmark fixes three products times two placements as a size.
    R05_modality:
      value: video
      provenance: customer_stated
    R06_entities:
      value:
        - entity_id: sports_product
          entity_type: product
          role: hero
          identity_invariants: [product_form, branding, colourway]
        - entity_id: ugc_presenter
          entity_type: person
          role: hero
          identity_invariants: [face, hair]
          applies_to_variant: tiktok_ugc_only
      provenance: customer_implied
      sub_field_provenance:
        product_presence: customer_stated
        presenter_presence: customer_implied
        identity_invariants: experiment_supplied_fixture
      rationale: >
        The product is stated. A presenter is implied by the UGC half and NOT by the Amazon half -
        Amazon product video is conventionally product-only. So one entity appears in one variant
        and not the other, which is a set structure the grammar does not currently express.
    R07_relationships:
      value:
        - subject: ugc_presenter
          relation: demonstrates
          object: sports_product
      provenance: customer_implied
    R08_text_requirements:
      value: null
      provenance: absent
    R09_brand_requirements:
      value: null
      provenance: absent
      rationale: >
        Worth flagging as a real-world risk the case surfaces: "licensed sports products" means
        third-party marks are present in the buyer's real work. The benchmark uses invented brands
        and does not reproduce any licensed mark.
    R10_language_topology:
      value:
        spoken: en
        on_screen_copy: none
        subtitles: none
      provenance: experiment_supplied_fixture
    R11_speaker_topology:
      value:
        visible_speakers: 1
        offscreen_voices: 0
        turn_boundaries_required: false
        script_exactness: exact
        applies_to_variant: tiktok_ugc_only
      provenance: customer_implied
      sub_field_provenance:
        visible_speakers: customer_implied
        script_exactness: experiment_supplied_fixture
    R12_temporal_structure:
      value: null
      provenance: absent
    R13_subject_motion:
      value: null
      provenance: absent
    R14_camera_motion:
      value: null
      provenance: absent
    R15_delivery:
      value:
        platform: [tiktok, amazon]
        aspect_ratios: ['9:16', '1:1']
        resolution: null
      provenance: customer_stated
      sub_field_provenance:
        platform: customer_stated
        aspect_ratios: experiment_supplied_fixture
      rationale: Two named placements with genuinely different conventions, which is what makes this a variants case rather than a repeat.
    R16_specification_provenance:
      value:
        customer_specified: [R01, R02, R04, R05, R06, R15, R18]
        customer_omitted: [R03, R08, R09, R10, R12, R13, R14]
        derived: [{field: R04.cardinality, by: benchmark, why: '"a large number" states no number'}]
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: '"a large number of licensed sports products" states volume qualitatively only'
          affected_fields: [R04]
        - marker_type: underspecification
          detail: nothing states how a TikTok deliverable and an Amazon deliverable should differ beyond placement
          affected_fields: [R04, R06]
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - TikTok UGC videos and Amazon product videos are both produced
          - the products shown are the buyer's licensed products
        stated_rejection_criteria: []
      provenance: customer_stated
  fixture_requirements:
    - fixture_id: FX-011-products
      what: three fictional sports products with reference stills
      why: real licensed sports products cannot be used and the buyer's own references are not held
      rights_requirement: invented brands only; no licensed mark may be reproduced
      blocks_runnable: false
    - fixture_id: FX-011-variants
      what: a specification of what distinguishes the TikTok variant from the Amazon variant
      why: the buyer names both placements but never says how they differ
      rights_requirement: none
      blocks_runnable: false
    - fixture_id: FX-011-presenter
      what: a presenter identity reference for the UGC variant only
      why: the UGC half implies a person, the Amazon half does not
      rights_requirement: synthetic identity only
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: Constructible. The variant specification is the substantive benchmark decision and it is labelled a fixture.
  execution_feasibility:
    attemptable_without_a_planner: true
    note: Six short deliverables. The hard part is holding one product identity across two different treatments, not producing either treatment.
  acceptance_contract:
    acceptance_basis: per_deliverable
    set_level_note: >
      A cross-variant invariant that the per-deliverable basis does not capture: the SAME product
      must be recognisable in both its TikTok and its Amazon deliverable. Each output can pass on
      its own while the pair fails as a pair.
    hard_objective:
      - requirement: each product appears in both a TikTok deliverable and an Amazon deliverable
        provenance: customer_stated
        capability: delivery_format_compliance
      - requirement: the product matches its reference in every deliverable
        provenance: customer_stated
        capability: product_identity
      - requirement: the product is the same product across its two variants
        provenance: customer_implied
        capability: product_identity
        note: this is a cross-asset scope of the same capability, not a separate capability
      - requirement: the TikTok deliverables are vertical and the Amazon deliverables are not
        provenance: experiment_supplied_fixture
        capability: delivery_format_compliance
      - requirement: in the UGC variant the presenter handles the product plausibly
        provenance: customer_implied
        capability: human_object_contact
    subjective_creative:
      - requirement: the TikTok variant reads as user content and the Amazon variant reads as catalogue video
        provenance: customer_stated
        capability: composition_brand_register
        no_deterministic_ground_truth: true
        note: The buyer named two placements with different conventions. Whether an output meets either convention is a judgement.
      - requirement: the product is the subject in both variants
        provenance: customer_implied
        capability: hierarchy_product_as_hero
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - Whether one output reads as TikTok-native and another as Amazon-native needs a reviewer who knows both conventions.
      - Cross-variant product identity has no instrument today.
  route_neutral_generation_brief: |
    Produce two videos for each of three products: one in a user-generated social style for a
    short vertical feed, and one as a product video for a retail listing.

    The product in every deliverable must be the supplied product, matching its reference stills.
    The same product must be recognisably the same object across both of its deliverables, even
    though the two treatments are different.

    In the social variant, a person presents and handles the product; their hands must interact
    with it plausibly. The retail variant does not require a person.

    How each treatment is achieved is an open choice.
  prompt_ready_envelope:
    objective: produce paired social and retail product videos across a product range
    output_modality: video
    duration_seconds: unspecified_by_customer
    aspect_ratio: {social_variant: '9:16', retail_variant: '1:1'}
    aspect_ratio_provenance: experiment_supplied_fixture
    placement: [tiktok, amazon_listing]
    audience: sports consumers
    audience_provenance: customer_implied
    entities:
      - id: sports_product
        type: product
        role: hero
        must_stay_constant: [product_form, branding, colourway]
        scope: across_both_variants
      - id: ugc_presenter
        type: person
        role: hero
        appears_in: social_variant_only
        must_stay_constant: [face, hair]
    supplied_assets: [FX-011-products, FX-011-presenter]
    identity_invariants:
      - the product matches its reference in every deliverable
      - the product is the same object in its social and its retail variant
    product_fidelity: the central requirement of the case
    script_or_dialogue: benchmark-supplied for the social variant only
    exact_on_screen_text: []
    language: {spoken: en, on_screen: none, subtitles: none}
    visual_tone: {social_variant: user-generated, retail_variant: clean catalogue}
    visual_tone_provenance: customer_stated_placements_with_fixture_registers
    temporal_beats: unspecified_by_customer
    cta: unspecified_by_customer
    brand_constraints: [invented brands only; no licensed third-party mark may be reproduced]
    deliverable_set: {cardinality: 6, structure: 3 products x 2 placements, acceptance: per_deliverable}
    prohibited_failures:
      - the product differing between its two variants
      - the product not matching its reference
      - a retail deliverable that reads as social content or the reverse
      - hands deforming around the product in the social variant
    model_specific_fields: null
  capability_mappings:
    atomic:
      - product_identity
      - product_stability_in_clip
      - human_object_contact
      - delivery_format_compliance
      - composition_brand_register
      - hierarchy_product_as_hero
    compound_cooccurrence:
      - one_product_two_placement_treatments
      - cross_variant_product_identity
      - entity_present_in_one_variant_and_absent_in_another
  evaluator_dependencies:
    - family: structured_visual_vlm
      for: [product_identity, human_object_contact]
      qualified: false
    - family: temporal_video
      for: [product_stability_in_clip]
      qualified: false
    - family: deterministic_cv_geometry
      for: [delivery_format_compliance]
      qualified: false
    - family: creative_commercial
      for: [composition_brand_register, hierarchy_product_as_hero]
      qualified: false
  stage_fit:
    stage_a_atomic: false
    stage_b_compound: primary_source_material
    stage_c_end_to_end: primary
    rationale: >
      The only genuine `variants` case in the bank sourced from a real buyer, and the only one where
      the variation axis is placement rather than message. The existing coverage extension has two
      variants items, both authored; this is the same operation attested by someone paying for it.
  open_questions:
    - How the buyer expects a TikTok deliverable to differ from an Amazon deliverable. Unstated, and it is the whole substance of the variants axis.
    - Whether the buyer's licensed products carry third-party marks that must be reproduced exactly. Likely, and it would add a brand-fidelity requirement this case cannot legally test.

