    product_fidelity: not_applicable
    script_or_dialogue: FX-015-scripts, one per language, spoken verbatim
    exact_on_screen_text: []
    language: {spoken: [en, hi, ur], on_screen: unspecified_by_customer, subtitles: unspecified_by_customer}
    visual_tone: instructional, compliance
    visual_tone_provenance: customer_implied
    temporal_beats: unspecified_by_customer
    cta: none
    brand_constraints: []
    deliverable_set: {cardinality: 3, variation_axis: language, acceptance: per_deliverable}
    prohibited_failures:
