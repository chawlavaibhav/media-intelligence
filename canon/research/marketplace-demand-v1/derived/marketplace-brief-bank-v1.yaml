      what: four short scripts in the persona's voice
      why: needed to give the four deliverables distinct content while holding identity fixed
      rights_requirement: benchmark-authored
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: >
    Constructible, with one caveat worth stating: because no reference exists, the benchmark must
    itself decide what "the same person" means. That decision is a fixture and it materially shapes
    what the case measures.
  execution_feasibility:
    attemptable_without_a_planner: true
    note: Four short single-speaker pieces. Individually within reach; the hard part is the cross-deliverable identity, not the generation.
  acceptance_contract:
    acceptance_basis: per_deliverable_with_set_level_invariant
    grammar_gap_ref: GG-03
    hard_objective:
      - requirement: the same figure appears in all four deliverables
        provenance: customer_stated
        capability: person_identity
      - requirement: the figure's voice is the same across all four
        provenance: experiment_supplied_fixture
        capability: voice_identity_consistency
      - requirement: the figure does not drift within any single deliverable
        provenance: customer_implied
