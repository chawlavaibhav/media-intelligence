  normalized_request:
    R01_requested_operation:
      value: edit
      provenance: customer_implied
      rationale: >
        The title says "Video Editor" and the research classifies it as editing rather than
        generation. That is enough for customer_implied and not enough for certainty: faceless
        channel work is often assembly of many supplied pieces, which would be `compose`. An
        ambiguity marker records that this could be either, and the grammar's own handling rule for
        underspecification is `ask`.
    R02_supplied_assets:
      value:
        - asset_id: mkt016_source_material
