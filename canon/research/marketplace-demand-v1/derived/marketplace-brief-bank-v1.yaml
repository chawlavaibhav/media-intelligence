# ===========================================================================
# CANON-011 — Marketplace-derived benchmark brief bank v1
# ===========================================================================
# STATUS: PROPOSED WORKER OUTPUT. NOT FROZEN. NOT AN APPROVED BENCHMARK.
#
# WHAT THIS IS. Eighteen benchmark cases derived from individual Upwork BUYER
# job postings recorded in committed marketplace research. Each case carries the
# chain the Controller decision requires:
#
#   source buyer job
#     -> source-faithful customer brief
#     -> Normalized Request (Media Request Grammar v1)
#     -> benchmark acceptance requirements
#     -> route-neutral generation brief
#     -> prompt-ready envelope
#     -> [ later, and NOT here: Production IR / provider-specific prompt ]
#
# WHAT THIS IS NOT.
#   * Not a replacement for the 30 authored briefs. Those stay byte-identical.
#   * Not demand evidence in the market-share sense. The research sampled 114
#     postings from 11 queries on one platform on one day. It supports "this
#     request SHAPE is really being paid for"; it supports no prevalence claim.
#   * Not a production recipe. No case chooses a model, a route or a technique.
#
# THE RULE THAT GOVERNS EVERY FIELD. A requirement is the customer's only if the
# customer said it or it follows directly from what they said. Anything the
# benchmark adds to make a case repeatable is an experiment fixture and is
# labelled as one. There is no case in this bank where a fixture is dressed as
# customer intent, and validate_marketplace_bank.py fails closed on that.
#
# READ WITH. canon/research/marketplace-demand-v1/README.md (evidence hierarchy),
# canon/experiments/pre-execution-freeze/MEDIA-REQUEST-GRAMMAR-v1.yaml (field ids
# R01-R18 and their provenance rules), eval/pre-execution-freeze/
# CAPABILITY-CONTRACT-v2.yaml (capability ids) and EVALUATOR-QUALIFICATION-MAP.yaml
# (evaluator families).
# ===========================================================================

meta:
  bank_id: marketplace_brief_bank
  version: v1
  status: PROPOSED_WORKER_OUTPUT_NOT_FROZEN
  task: CANON-011
  date: '2026-08-27'
  authority: coordination/decisions/CONTROLLER-MARKETPLACE-DERIVED-BRIEF-PREP-2026-08-27.md
  external_calls: 0
  spend_usd: 0
  grammar: canon/experiments/pre-execution-freeze/MEDIA-REQUEST-GRAMMAR-v1.yaml
  capability_contract: eval/pre-execution-freeze/CAPABILITY-CONTRACT-v2.yaml
  evaluator_map: eval/pre-execution-freeze/EVALUATOR-QUALIFICATION-MAP.yaml
  does_not_modify:
    - canon/experiments/v1/brief-bank/
    - canon/experiments/pre-execution-freeze/REQUEST-COVERAGE-EXTENSION.jsonl
    - eval/v1/capability-contract.yaml
    - eval/v1/bank/
    - eval/registry/
  no_prevalence_claim: >
    No count in this bank is a market-share statement. The underlying sweep is one
    platform, one account, one day, 11 queries, 114 recorded postings. It shows that
    a request shape is being bought. It does not show how often, relative to what, or
    by how many buyers.

# ── Vocabularies the validator enforces ────────────────────────────────────────

provenance_vocabulary:
  customer_stated: >
    The buyer said it, and a verbatim source string in source_facts_used supports it.
  customer_implied: >
    A direct logical consequence of something the buyer said. A rationale is required
    and must name the stated fact it follows from.
  experiment_supplied_fixture: >
    The benchmark supplies it so the case is repeatable. The buyer did not say it.
    Every field carrying this label must have a matching entry in fixture_requirements.
  system_derived: >
    The system worked it out. Permitted only where the grammar permits it, and never
    on R01 (requested operation) or R08 (text requirements).
  absent: >
    The buyer did not address it and nothing derives it. An absent field is a fact
    about the request, not a gap to be filled.

evaluator_families:
  - deterministic_cv_geometry
  - structured_visual_vlm
  - temporal_video
  - text_ocr
  - speech_audio_av
  - creative_commercial
  - operational_logging

evaluator_qualification_status:
  instruments_qualified_project_wide: 0
  meaning: >
    Every evaluator dependency named in every case below is currently UNQUALIFIED. No
    checker or perceptual instrument in this project has passed a qualification protocol,
    so no case in this bank can be scored today, however runnable its inputs are.
    `runnable_now: true` means the INPUTS can be assembled without contacting the buyer.
    It does not mean the case can be judged.
  source: 'eval/pre-execution-freeze/EVALUATOR-QUALIFICATION-MAP.yaml (instruments_qualified: 0)'

# ── Fiverr: conventions only, never customer intent ────────────────────────────

fiverr_convention_inputs:
  rule: >
    A Fiverr gig is a SELLER's offering. It says what a seller will do for money. It is
    not a record of any buyer asking for anything. Nothing below is used as a customer
    requirement anywhere in this bank. These conventions were used only to make
    experiment-supplied fixtures resemble real commercial practice, and every fixture
    they informed is labelled experiment_supplied_fixture.
  is_customer_brief: false
  source_file: canon/research/marketplace-demand-v1/sources/fiverr-ai-video-demand-2026-08-26.md
  conventions:
    - id: FC-01
      convention: >
        Commercial AI video packages cluster at three running times - roughly 15 s, 30 s
        and 60 s - and price ladders are built on those three lengths.
      verbatim: '| **10–15 s AI product clip / hook** |'
      used_for: >
        Choosing fixture durations only where the buyer stated none, and only in cases
        that already state a duration band. Never used to overwrite a stated duration.
    - id: FC-02
      convention: >
        The standard buyer intake across high-velocity sellers is: product images or
        clips, script or concept, logo, brand colours, product link plus audience plus
        offer/CTA, reference examples, voice-over preference.
      verbatim: 'What do you need from me to get started?'
      used_for: >
        The shape of the fixture kits in fixture_requirements. This is what a real
        commercial buyer is normally asked to hand over, so a benchmark fixture kit that
        looks like it is realistic rather than invented.
    - id: FC-03
      convention: >
        Pronunciation guidance for brand and personal names is an explicit intake field
        on the one Hindi/Hinglish gig that structures its packages properly.
      verbatim: 'asks for pronunciation guidance for names'
      used_for: >
        Making pronunciation an explicit fixture field in cases with Indic-language
        speech, rather than leaving it implicit.
    - id: FC-04
      convention: >
        Catalogue work is sold in volume tiers - 3 / 10 / 30 videos from product photos -
        rather than per single asset.
      verbatim: 'I will turn product photos into ai ecommerce product videos'
      used_for: >
        Confirming that the batch acceptance shape in MKT-002 is an ordinary commercial
        structure. The batch requirement itself is stated by the Upwork buyer, not by this.
    - id: FC-05
      convention: >
        Buyers searching real-footage e-commerce product video can reject AI footage as
        a defect - one visible one-star review complains exactly that.
      verbatim: 'only to deliver me AI'
      used_for: >
        A prohibited-failure line in envelopes for catalogue product work: output that
        reads as generic AI stock rather than as this seller's actual product is a
        commercial failure, not just an aesthetic one. Recorded as a benchmark decision,
        never as a customer statement.

# ── The cases ──────────────────────────────────────────────────────────────────
#
# Field shape, once, so it is not repeated eighteen times:
#
#   source_facts_used[]  each has `fact` (plain English) and `verbatim` (an exact
#                        substring of source_file, checked mechanically).
#   normalized_request   every grammar field R01-R18 appears, even when absent, each
#                        with a provenance from provenance_vocabulary. sub_field_provenance
#                        is used where one grammar field mixes customer statement with
#                        benchmark fixture, so the mixture is visible rather than averaged.
#   acceptance_contract  hard_objective / subjective_creative, each item carrying its own
#                        provenance, plus the acceptance basis and the human-review gaps.
#   route_neutral_generation_brief   what must be MADE. Scanned by the validator for
#                        provider names and production-route words; a buyer's own tool
#                        name lives in buyer_named_tools and never here.

cases:

# ---------------------------------------------------------------------------
- case_id: MKT-001
  source_marketplace: upwork
  source_record_id: UW-008
  source_title: 'AI Video Creator for Meta Ads | Talking Head + Product B-Roll'
  source_file: canon/research/marketplace-demand-v1/sources/upwork-ai-video-demand-2026-08-26.md
  source_section_locators:
    - "Section 2, 'What productized looks like here', first bullet"
    - 'Appendix row 8'
  source_posted: '26 Aug'
  buyer_named_tools: []
  source_facts_used:
    - fact: The buyer wants one Meta ad, 40 seconds, for a men's dog-care supplement, built as a talking-head avatar plus AI-generated product B-roll.
      verbatim: '40 seconds, one Meta ad, men''s dog-care supplement, avatar plus AI product B-roll'
    - fact: The job is $50 fixed and the research notes the specification is complete inside the posting.
      verbatim: '$50 fixed, 10–15 proposals. Complete spec sits in the post.'
    - fact: Posted 26 Aug by a Ukraine-based client with $1K+ recorded spend.
      verbatim: '$1K+ · Ukraine | 26 Aug'
  customer_brief: |
    One Meta ad, 40 seconds, for a men's dog-care supplement. Talking-head AI avatar
    plus AI-generated product B-roll. Fixed budget $50.

    Nothing else is recorded. The research says the complete specification sat in the
    posting, but the posting body itself was not captured, so anything beyond the four
    facts above is unknown rather than absent-by-choice.
  normalized_request:
    R01_requested_operation:
      value: generate
      provenance: customer_implied
      rationale: >
        The buyer asks for an ad to be made and names no artefact to be changed. Under the
        grammar rule "a supplied asset does not imply edit", and with no asset recorded at
        all, this is generate.
    R02_supplied_assets:
      value:
        - asset_id: mkt001_product_ref
          media_type: image
          role: identity_reference
          applies_to: product_supplement
          description: reference stills of the supplement pack, front and label
      provenance: experiment_supplied_fixture
      rationale: >
        The source does NOT record whether this buyer supplied product photography. A real
        product-B-roll job almost certainly involves some, but "almost certainly" is not a
        customer statement. The benchmark supplies a reference set so the case is repeatable,
        and it is labelled a fixture.
    R03_mutation_intents:
      value: null
      provenance: absent
      rationale: No supplied artefact is being changed.
    R04_deliverable_set:
      value:
        cardinality: 1
        variation_axis: none
        acceptance_basis: per_deliverable
      provenance: customer_stated
      sub_field_provenance:
        cardinality: customer_stated
        variation_axis: absent
        acceptance_basis: customer_implied
      rationale: >
        "one Meta ad" states cardinality 1. Acceptance basis is the grammar's documented
        default for a single deliverable, which the grammar itself labels customer_implied.
    R05_modality:
      value: video
      provenance: customer_stated
      rationale: A duration in seconds and B-roll; the title says video.
    R06_entities:
      value:
        - entity_id: presenter_avatar
          entity_type: person
          role: hero
          identity_invariants: [face, hair, wardrobe]
        - entity_id: product_supplement
          entity_type: product
          role: hero
          identity_invariants: [pack_form, label_artwork, label_colourway]
      provenance: customer_stated
      sub_field_provenance:
        entity_presence: customer_stated
        identity_invariants: experiment_supplied_fixture
      rationale: >
        The buyer names a talking head and a product. The buyer says NOTHING about what makes
        either one "the same" across the clip. The invariant lists are the benchmark's
        decision about what to hold fixed and are fixtures, not customer requirements. This
        is the exact trap the grammar warns about at R06.
    R07_relationships:
      value: null
      provenance: absent
    R08_text_requirements:
      value: null
      provenance: absent
      rationale: >
        The buyer requires no on-screen copy. Worth noticing: the authored 30-brief bank puts
        an exact-text requirement in 28 of 30 briefs, and this real, fully specified commercial
        job has none.
    R09_brand_requirements:
      value:
        assets: [mkt001_logo]
        palette: fixture_brand_palette
      provenance: experiment_supplied_fixture
      rationale: The buyer states no brand kit. The benchmark supplies one for repeatability.
    R10_language_topology:
      value:
        spoken: en
        on_screen_copy: none
        subtitles: none
      provenance: experiment_supplied_fixture
      rationale: >
        No language is recorded anywhere in the source for this posting. Inferring English
        from the platform would be inventing a customer requirement, so the benchmark fixes
        English as a fixture and says so.
    R11_speaker_topology:
      value:
        visible_speakers: 1
        offscreen_voices: 0
        turn_boundaries_required: false
        script_exactness: exact
      provenance: customer_stated
      sub_field_provenance:
        visible_speakers: customer_stated
        script_exactness: experiment_supplied_fixture
      rationale: >
        "Talking head" states one visible speaker. The buyer supplies no script and states no
        exactness requirement; the benchmark supplies a fixed script and requires it verbatim
        so that spoken-script correctness is measurable at all.
    R12_temporal_structure:
      value:
        duration_seconds: 40
        shot_count: null
        beats: null
      provenance: customer_stated
      rationale: >
        40 seconds is stated. Shot structure and beats are not, and are deliberately left
        empty - deciding them is part of what the system under test has to do.
    R13_subject_motion:
      value: null
      provenance: absent
    R14_camera_motion:
      value: null
      provenance: absent
      rationale: Not addressed by the buyer; delegated to whoever makes it.
    R15_delivery:
      value:
        platform: meta
        aspect_ratios: ['9:16']
        resolution: null
      provenance: customer_stated
      sub_field_provenance:
        platform: customer_stated
        aspect_ratios: experiment_supplied_fixture
      rationale: >
        THE MOST IMPORTANT LABEL IN THIS CASE. The buyer stated the platform and nothing about
        format. Meta carries 9:16, 4:5 and 1:1. A proposal draft elsewhere in the same research
        document offers a 9:16 cut - but that is the RESEARCHER pitching, not the buyer asking.
        The benchmark fixes 9:16 as a fixture so the case is repeatable, and refuses to record
        it as customer intent.
    R16_specification_provenance:
      value:
        customer_specified: [R01, R04, R05, R06, R11, R12, R15, R18]
        customer_omitted: [R02, R03, R07, R08, R09, R10, R13, R14]
        derived: [{field: R17, by: benchmark, why: ambiguity recorded rather than resolved}]
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: aspect ratio not stated although the platform is
          affected_fields: [R15]
        - marker_type: underspecification
          detail: no language stated for the spoken track
          affected_fields: [R10, R11]
        - marker_type: underspecification
          detail: the posting body was not captured, so "complete spec" content is unavailable
          affected_fields: [R08, R09, R12]
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - the finished video runs 40 seconds
          - a talking presenter appears
          - the product appears as B-roll
          - one deliverable, for Meta
        stated_success_criteria: []
        stated_rejection_criteria: []
      provenance: customer_stated
      rationale: >
        The buyer stated four structural requirements and no success or rejection criteria.
        An empty rejection list is a fact about this request. It is not filled in.
  fixture_requirements:
    - fixture_id: FX-001-product
      what: reference stills of a fictional men's dog-care supplement pack, front and label, 3-5 images
      why: the source does not record supplied product assets, and product identity cannot be measured without a reference
      rights_requirement: benchmark-owned or licensed for internal evaluation; no real brand
      blocks_runnable: false
    - fixture_id: FX-001-avatar
      what: a presenter identity reference (single consistent face/wardrobe)
      why: person identity across the clip needs a reference to be measured against
      rights_requirement: consent required if a real person is used; synthetic identity preferred
      blocks_runnable: false
    - fixture_id: FX-001-script
      what: a fixed English spoken script sized to 40 seconds
      why: spoken-script correctness is not measurable without an exact expected string
      rights_requirement: benchmark-authored
      blocks_runnable: false
    - fixture_id: FX-001-format
      what: aspect ratio decision (9:16) and a brand kit (logo + palette)
      why: the buyer stated neither; both are needed for a repeatable run
      rights_requirement: benchmark-authored
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: >
    Every missing input can be constructed by the benchmark. No fact needs to be recovered
    from the buyer. Note the separate gate: no evaluator family this case needs has been
    qualified, so it can be RUN but not yet SCORED.
  execution_feasibility:
    attemptable_without_a_planner: true
    note: >
      One 40-second deliverable. A 40-second piece is longer than a single generation from
      most current routes, so it implies a multi-shot assembly - but a fixed avatar segment
      plus product B-roll is a shape that can be attempted as a sequence of short pieces
      without needing a planning object to decide the structure.
  acceptance_contract:
    acceptance_basis: per_deliverable
    hard_objective:
      - requirement: total duration is 40 seconds
        provenance: customer_stated
        capability: delivery_format_compliance
      - requirement: a single visible human presenter is present and speaking
        provenance: customer_stated
        capability: single_speaker_lip_sync
      - requirement: the supplied product reference appears and is the same product
        provenance: customer_stated
        capability: product_identity
      - requirement: the presenter's identity does not drift within the clip
        provenance: experiment_supplied_fixture
        capability: person_stability_in_clip
      - requirement: the spoken words match the supplied script
        provenance: experiment_supplied_fixture
        capability: spoken_script_correctness
      - requirement: delivered at the fixture aspect ratio
        provenance: experiment_supplied_fixture
        capability: delivery_format_compliance
      - requirement: exactly one deliverable
        provenance: customer_stated
        capability: delivery_format_compliance
    subjective_creative:
      - requirement: reads as a usable Meta advertisement rather than a demo clip
        provenance: customer_implied
        capability: proposition_objective_fit
        no_deterministic_ground_truth: true
      - requirement: the product is the subject of the piece, not set dressing
        provenance: customer_implied
        capability: hierarchy_product_as_hero
        no_deterministic_ground_truth: true
      - requirement: hands, faces and product surfaces survive without visible artefacting
        provenance: system_derived
        capability: technical_visual_integrity
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - Whether an avatar-plus-B-roll join reads as one piece of film is a judgement no current instrument makes.
      - Commercial usability has no qualified instrument and would need an independent reviewer panel.
  route_neutral_generation_brief: |
    Produce one 40-second advertising video for a men's dog-care supplement, for placement
    on Meta.

    It must contain a single human presenter who speaks to camera, and separate footage of
    the product itself. The presenter must remain the same person throughout. The product
    must remain the same product as the supplied reference - same pack form, same label
    artwork, same colours - wherever it appears. The spoken words must be exactly the
    supplied script.

    Shot structure, pacing and how the presenter footage and the product footage are
    interleaved are open choices. Nothing here specifies how any of it is made.
  prompt_ready_envelope:
    objective: sell a men's dog-care supplement to a Meta audience in a single 40-second ad
    output_modality: video
    duration_seconds: 40
    aspect_ratio: '9:16'
    aspect_ratio_provenance: experiment_supplied_fixture
    placement: meta_feed_or_reels
    audience: dog owners, adult, general market
    audience_provenance: customer_implied
    entities:
      - id: presenter_avatar
        type: person
        role: hero
        must_stay_constant: [face, hair, wardrobe]
      - id: product_supplement
        type: product
        role: hero
        must_stay_constant: [pack_form, label_artwork, label_colourway]
    supplied_assets: [FX-001-product, FX-001-avatar]
    identity_invariants:
      - the presenter is one continuous person for the whole 40 seconds
      - the product matches its reference stills wherever it appears
    product_fidelity: the pack must be recognisable as the referenced pack, not a similar pack
    script_or_dialogue: FX-001-script, spoken verbatim
    exact_on_screen_text: []
    language: {spoken: en, on_screen: none, subtitles: none}
    visual_tone: commercial, direct-response
    visual_tone_provenance: customer_implied
    temporal_beats: unspecified_by_customer
    cta: unspecified_by_customer
    brand_constraints: [FX-001-format brand kit applies where branding appears]
    prohibited_failures:
      - presenter changes appearance mid-clip
      - product changes pack form, label or colour between shots
      - spoken words differ from the supplied script
      - visible hand or face deformation
      - runtime other than 40 seconds
    model_specific_fields: null
  capability_mappings:
    atomic:
      - product_identity
      - person_stability_in_clip
      - product_stability_in_clip
      - spoken_script_correctness
      - single_speaker_lip_sync
      - audio_video_synchronisation
      - human_anatomy_integrity
      - technical_visual_integrity
      - delivery_format_compliance
    compound_cooccurrence:
      - person_plus_product_in_one_deliverable
      - spoken_track_plus_product_b_roll
      - identity_persistence_across_shot_change
  evaluator_dependencies:
    - family: structured_visual_vlm
      for: [product_identity, human_anatomy_integrity]
      qualified: false
    - family: temporal_video
      for: [person_stability_in_clip, product_stability_in_clip, technical_visual_integrity]
      qualified: false
    - family: speech_audio_av
      for: [spoken_script_correctness, single_speaker_lip_sync, audio_video_synchronisation]
      qualified: false
    - family: deterministic_cv_geometry
      for: [delivery_format_compliance]
      qualified: false
    - family: creative_commercial
      for: [proposition_objective_fit, hierarchy_product_as_hero]
      qualified: false
    - family: operational_logging
      for: [cost_and_cpao, latency_errors_refusals]
      qualified: false
  stage_fit:
    stage_a_atomic: false
    stage_b_compound: candidate
    stage_c_end_to_end: primary
    rationale: >
      This is a whole commercial outcome with several capabilities entangled, which is what
      Stage C is for. It does not decompose into a single-capability probe, so forcing it into
      Stage A would measure nothing cleanly. Its person-plus-product-plus-speech co-occurrence
      makes it good raw material for a Layer-2 compound scenario later.
  open_questions:
    - The posting body was not captured, only the research summary of it. If the original text is ever re-read, several fixture labels here may become customer_stated.
    - Whether the buyer supplied product photography is unknown, and it changes the requested operation nowhere but changes the fixture story completely.

# ---------------------------------------------------------------------------
- case_id: MKT-002
  source_marketplace: upwork
  source_record_id: UW-074
  source_title: E-Commerce Product Video Editor (Knox Deco)
  source_file: canon/research/marketplace-demand-v1/sources/upwork-ai-video-demand-2026-08-26.md
  source_section_locators:
    - "Section 2, 'What productized looks like here', third bullet"
    - 'Section 5 Tier 1 table, row 2'
    - 'Appendix row 74'
  source_posted: '24 Aug'
  buyer_named_tools: []
  source_facts_used:
    - fact: Each video runs 15-30 seconds, the master is 1080x1080, up to two revisions are allowed, no watermark, and 9:16 and 16:9 exports are wanted on request.
      verbatim: '15–30s per video, 1080×1080 master, up to 2 revisions, no watermark, plus 9:16 and 16:9 exports on request'
    - fact: The buyer prices per approved video rather than hourly.
      verbatim: '$30–45 per approved video'
    - fact: After a paid test the work extends across a substantial portion of the buyer's product catalogue.
      verbatim: a substantial portion of our product catalog
    - fact: The catalogue is furniture.
      verbatim: 'furniture catalogue at $30–45 per approved video'
    - fact: The client has a 100% hire rate over 27 posted jobs and $180K recorded spend - the strongest client in the sample.
      verbatim: '$180K · 100% hire · 27 posted'
  customer_brief: |
    Product videos for our furniture catalogue. 15-30 seconds each. Master at 1080x1080.
    Up to two revision rounds. No watermark on the delivered file. We also want 9:16 and
    16:9 exports when we ask for them.

    We pay $30-45 per approved video, not by the hour. Paid test first, then a substantial
    portion of our product catalogue.
  normalized_request:
    R01_requested_operation:
      value: generate
      provenance: customer_implied
      rationale: >
        THE INTERPRETIVE RISK IN THIS CASE, STATED OPENLY. The job title contains the word
        "Editor", which in this market often means cutting footage the buyer already has. The
        source records no supplied footage anywhere. "Editor" is a role name, not a statement
        about an artefact, so the grammar's rule - never infer edit merely from context -
        applies and this is read as generate. If the buyer in fact supplies clips, the operation
        becomes compose or edit and the acceptance contract changes materially. An ambiguity
        marker records this rather than hiding it.
    R02_supplied_assets:
      value:
        - asset_id: mkt002_product_stills
          media_type: image
          role: identity_reference
          applies_to: catalogue_item
          description: catalogue photography of one furniture item, multiple angles
      provenance: experiment_supplied_fixture
      rationale: The source records no supplied assets. Catalogue photography is supplied by the benchmark.
    R03_mutation_intents:
      value: null
      provenance: absent
    R04_deliverable_set:
      value:
        cardinality: 8
        variation_axis: none
        acceptance_basis: per_deliverable
      provenance: customer_stated
      sub_field_provenance:
        cardinality: experiment_supplied_fixture
        acceptance_basis: customer_stated
        variation_axis: system_derived
      rationale: >
        The ACCEPTANCE BASIS is genuinely customer-stated here, which is rare and valuable:
        "per approved video" means each output is accepted or rejected on its own and only
        approved ones are paid for. The batch SIZE is not stated - "a substantial portion of
        our catalog" is not a number - so the benchmark fixes eight, one per distinct product,
        as a fixture. The variation axis is "one deliverable per catalogue item", which is a
        set structure the grammar's variation_axis vocabulary does not name; recorded as
        system_derived and flagged in grammar_gaps.
    R05_modality:
      value: video
      provenance: customer_stated
    R06_entities:
      value:
        - entity_id: catalogue_item
          entity_type: product
          role: hero
          identity_invariants: [silhouette, material, upholstery_colour, hardware_finish]
      provenance: customer_stated
      sub_field_provenance:
        entity_presence: customer_stated
        identity_invariants: experiment_supplied_fixture
      rationale: >
        A furniture catalogue video is about the furniture; that much is stated. What counts as
        the same sofa is not stated, and the invariant list is the benchmark's decision.
    R07_relationships:
      value: null
      provenance: absent
    R08_text_requirements:
      value: null
      provenance: absent
      rationale: The buyer requires no on-screen copy. A second fully specified commercial job with zero exact-text requirement.
    R09_brand_requirements:
      value:
        prohibitions: [no watermark on the delivered file]
      provenance: customer_stated
      rationale: >
        "No watermark" is a real, checkable, customer-stated delivery prohibition. It is the
        only brand-adjacent constraint the buyer states.
    R10_language_topology:
      value: null
      provenance: absent
      rationale: No speech, copy or subtitle language is stated or implied. Silent product video is a legitimate reading and nothing is invented to fill this.
    R11_speaker_topology:
      value: null
      provenance: absent
    R12_temporal_structure:
      value:
        duration_seconds: {min: 15, max: 30}
        shot_count: null
        beats: null
      provenance: customer_stated
      rationale: A stated duration BAND rather than a point value. Acceptance is a range check, not an equality check.
    R13_subject_motion:
      value: null
      provenance: absent
    R14_camera_motion:
      value: null
      provenance: absent
    R15_delivery:
      value:
        platform: null
        aspect_ratios: ['1:1', '9:16', '16:9']
        resolution: '1080x1080 master'
      provenance: customer_stated
      rationale: >
        Fully customer-stated, unusually. One master at 1080x1080 plus two additional exports on
        request. Note the grammar's own distinction: this is ONE artefact delivered several ways,
        which is R15, not several artefacts, which would be R04.
    R16_specification_provenance:
      value:
        customer_specified: [R04, R05, R06, R09, R12, R15, R18]
        customer_omitted: [R02, R03, R07, R08, R10, R11, R13, R14]
        derived: [{field: R01, by: benchmark, why: 'title says Editor, no artefact recorded; read as generate and flagged'}]
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: whether the buyer supplies source footage, which decides between generate, edit and compose
          affected_fields: [R01, R02]
        - marker_type: underspecification
          detail: batch size is described qualitatively ("a substantial portion") and never numbered
          affected_fields: [R04]
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - each video runs between 15 and 30 seconds
          - master delivered at 1080x1080
          - 9:16 and 16:9 exports available on request
          - no watermark on the delivered file
          - each video is approved individually
        soft_preferences: []
        stated_rejection_criteria: []
      provenance: customer_stated
      rationale: >
        "Up to 2 revisions" is a commercial process term, not an acceptance criterion, and is
        recorded as commercial_context rather than as a requirement on the artefact. It matters
        to Cost per Accepted Outcome because rejected revisions in the same journey are counted.
  commercial_context:
    unit_price_usd: 30-45 per approved video
    revision_allowance: up to 2
    cpao_relevance: >
      This buyer has already structured the deal the way whole-outcome Cost per Accepted Outcome
      is defined: payment attaches to an APPROVED video, and up to two revision rounds sit inside
      that price. A rejected first attempt plus an accepted second attempt is one accepted outcome
      at two attempts' cost, which is precisely the quantity the project says it wants to measure.
  fixture_requirements:
    - fixture_id: FX-002-catalogue
      what: eight distinct fictional furniture items with catalogue photography, multiple angles each
      why: batch identity and per-item product fidelity cannot be measured without per-item references
      rights_requirement: benchmark-owned renders or licensed-for-evaluation photography; no real retailer's catalogue
      blocks_runnable: false
    - fixture_id: FX-002-batchsize
      what: batch size fixed at 8
      why: the buyer states a qualitative volume and no number
      rights_requirement: none
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: All inputs are constructible by the benchmark; nothing needs the buyer.
  execution_feasibility:
    attemptable_without_a_planner: partially
    note: >
      Each individual 15-30s product video is within a plausible single-generation envelope. The
      three-format delivery (1080x1080 master plus 9:16 and 16:9) is a deterministic local transform
      and creates artefacts without a provider call, which the accepted evidence contract already
      allows. The eight-item batch needs a repeat loop, not a plan.
  acceptance_contract:
    acceptance_basis: per_deliverable
    set_level_note: >
      Acceptance is per video, but the buyer's economics are set-level: they are buying a catalogue.
      A run where three of eight are accepted is a very different commercial result from one where
      eight of eight are, even though each acceptance decision is individual.
    hard_objective:
      - requirement: each video runs 15-30 seconds inclusive
        provenance: customer_stated
        capability: delivery_format_compliance
      - requirement: master frame size is 1080x1080
        provenance: customer_stated
        capability: delivery_format_compliance
      - requirement: 9:16 and 16:9 exports exist for each accepted master
        provenance: customer_stated
        capability: delivery_format_compliance
      - requirement: no watermark appears anywhere in the delivered file
        provenance: customer_stated
        capability: technical_visual_integrity
      - requirement: the product in each video is the referenced catalogue item, not a similar item
        provenance: customer_stated
        capability: product_identity
      - requirement: the product does not change shape, material or colour within a clip
        provenance: experiment_supplied_fixture
        capability: product_stability_in_clip
      - requirement: one deliverable per catalogue item, eight items
        provenance: experiment_supplied_fixture
        capability: delivery_format_compliance
    subjective_creative:
      - requirement: reads as retail catalogue video a furniture seller would publish
        provenance: customer_implied
        capability: composition_brand_register
        no_deterministic_ground_truth: true
      - requirement: the product is the subject and is shown in enough detail to sell it
        provenance: customer_implied
        capability: hierarchy_product_as_hero
        no_deterministic_ground_truth: true
      - requirement: does not read as generic stock footage of a similar-looking product
        provenance: system_derived
        capability: product_identity
        no_deterministic_ground_truth: true
        note: informed by Fiverr convention FC-05, recorded as a benchmark decision and not as customer intent
    unresolved_human_review:
      - Whether a generated furniture video is commercially publishable by a real retailer has no qualified instrument.
      - Whether video 8 still looks like video 1 across a batch is a set-level judgement with no instrument at all today.
  route_neutral_generation_brief: |
    Produce eight short retail product videos, one for each of eight furniture items, from the
    supplied catalogue photography.

    Each video runs between fifteen and thirty seconds. Each must show the item it belongs to,
    and that item must stay recognisably the same object throughout - same shape, same material,
    same upholstery colour, same hardware finish - and must match its own reference photography
    rather than a similar-looking piece.

    Each master is delivered at 1080 by 1080. A 9:16 and a 16:9 version of each accepted master
    must also be available. No watermark may appear in any delivered file.

    Each video is judged on its own. Shot structure, movement and staging are open choices.
  prompt_ready_envelope:
    objective: sell individual furniture catalogue items through short retail product video
    output_modality: video
    duration_seconds: {min: 15, max: 30}
    aspect_ratio: '1:1'
    additional_deliverable_formats: ['9:16', '16:9']
    placement: ecommerce_product_page_and_social
    placement_provenance: customer_implied
    audience: furniture shoppers
    audience_provenance: customer_implied
    entities:
      - id: catalogue_item
        type: product
        role: hero
        must_stay_constant: [silhouette, material, upholstery_colour, hardware_finish]
    supplied_assets: [FX-002-catalogue]
    identity_invariants:
      - the item matches its own reference photography, not a similar product
      - the item does not change within the clip
    product_fidelity: highest priority requirement in this case
    script_or_dialogue: none
    exact_on_screen_text: []
    language: {spoken: none, on_screen: none, subtitles: none}
    visual_tone: retail catalogue, clean, product-forward
    visual_tone_provenance: customer_implied
    temporal_beats: unspecified_by_customer
    cta: unspecified_by_customer
    brand_constraints: [no watermark in any delivered file]
    deliverable_set: {cardinality: 8, one_per: catalogue_item, acceptance: per_deliverable}
    prohibited_failures:
      - a different piece of furniture than the reference
      - material, colour or hardware changing mid-clip
      - watermark present
      - runtime outside 15-30 seconds
      - master not 1080x1080
    model_specific_fields: null
  capability_mappings:
    atomic:
      - product_identity
      - product_stability_in_clip
      - delivery_format_compliance
      - technical_visual_integrity
      - reproducibility
      - reliability_pass_at_k
    compound_cooccurrence:
      - product_identity_across_a_batch
      - single_master_multiple_delivery_formats
      - per_deliverable_acceptance_over_a_set
  evaluator_dependencies:
    - family: structured_visual_vlm
      for: [product_identity]
      qualified: false
    - family: temporal_video
      for: [product_stability_in_clip, technical_visual_integrity]
      qualified: false
    - family: deterministic_cv_geometry
      for: [delivery_format_compliance]
      qualified: false
    - family: creative_commercial
      for: [hierarchy_product_as_hero, composition_brand_register]
      qualified: false
    - family: operational_logging
      for: [cost_and_cpao, reliability_pass_at_k, reproducibility]
      qualified: false
  stage_fit:
    stage_a_atomic: false
    stage_b_compound: candidate
    stage_c_end_to_end: primary
    rationale: >
      The strongest Stage-C candidate in the bank. It is the only case where the buyer states a
      per-approved-unit price, a revision allowance, a duration band, a master format and export
      formats - which means a real Cost per Accepted Outcome can be computed against a real
      commercial unit price rather than an invented one.
  open_questions:
    - Whether the buyer supplies source footage. This is the one unresolved fact that would change the requested operation.
    - What "a substantial portion of our product catalog" means numerically. The batch size used here is a benchmark choice.

