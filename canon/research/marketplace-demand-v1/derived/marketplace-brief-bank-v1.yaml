- case_id: MKT-003
  source_marketplace: upwork
  source_record_id: UW-031
  source_title: AI Video Assembly & Polish
  source_file: canon/research/marketplace-demand-v1/sources/upwork-ai-video-demand-2026-08-26.md
  source_section_locators:
    - "Section 2, 'What productized looks like here', second bullet"
    - 'Section 5 Tier 1 table, row 4'
    - 'Appendix row 31'
  source_posted: '24 Aug'
  buyer_named_tools: []
  source_facts_used:
    - fact: Ten short videos of roughly three minutes each, with the scripts supplied by the buyer, for $150 fixed.
      verbatim: '10 short videos, ~3 min each, **scripts provided**. $150 fixed, 15–20 proposals.'
    - fact: The recurring-buyer table records the same job as ten videos with scripts provided.
      verbatim: '| AI Video Assembly & Polish | $150 fixed | **10 videos**, scripts provided | 15–20 | US · $1K+ |'
  customer_brief: |
    Ten short videos, about three minutes each. We provide the scripts. $150 fixed for the set.
  normalized_request:
    R01_requested_operation:
      value: generate
      provenance: customer_implied
      rationale: >
        A supplied SCRIPT is supplied text, not a supplied artefact. Nothing is being changed, so
        this is generate from a fixed script rather than edit. The word "Assembly" in the title is
        a production description, not a customer statement about an artefact.
    R02_supplied_assets:
      value:
        - asset_id: mkt003_scripts
          media_type: document
          role: unresolved_not_in_grammar_v1
          applies_to: null
          description: ten buyer-written scripts, one per video
          grammar_gap_ref: GG-02
      provenance: customer_stated
      rationale: >
        The buyer really does supply these - it is one of only three postings in the whole sample
        that says so explicitly. But the grammar's asset_role vocabulary has no value for "content
        the deliverable must convey". Rather than mislabel it as a reference or as the subject of
        an operation, the role is left explicitly unresolved and recorded in grammar_gaps.
    R03_mutation_intents:
      value: null
      provenance: absent
    R04_deliverable_set:
      value:
        cardinality: 10
        variation_axis: message
        acceptance_basis: per_deliverable
      provenance: customer_stated
      sub_field_provenance:
        cardinality: customer_stated
        variation_axis: customer_implied
        acceptance_basis: system_derived
      rationale: >
        Ten is stated. The axis of variation is the script, i.e. the message, which follows from
        one script per video. Acceptance basis is NOT stated - a single fixed fee for the set could
        equally mean set-level acceptance - so the benchmark's per_deliverable reading is marked
        system_derived and an ambiguity marker records the alternative.
    R05_modality:
      value: video
      provenance: customer_stated
    R06_entities:
      value: null
      provenance: absent
      rationale: The buyer names no product, person or character. Nothing is invented to fill this.
    R07_relationships:
      value: null
      provenance: absent
    R08_text_requirements:
      value: null
      provenance: absent
      rationale: >
        Careful distinction. The buyer supplies SPOKEN scripts. That is R11 script exactness, not
        R08 on-screen text. No on-screen copy is requested and none is manufactured.
    R09_brand_requirements:
      value: null
      provenance: absent
    R10_language_topology:
      value:
        spoken: en
        on_screen_copy: none
        subtitles: none
      provenance: experiment_supplied_fixture
      rationale: No language is recorded. English is a benchmark fixture, not a customer statement.
    R11_speaker_topology:
      value:
        visible_speakers: 0
        offscreen_voices: 1
        turn_boundaries_required: false
        script_exactness: exact
      provenance: customer_implied
      sub_field_provenance:
        script_exactness: customer_implied
        visible_speakers: experiment_supplied_fixture
        offscreen_voices: experiment_supplied_fixture
      rationale: >
        Supplying a script implies its words are the customer's and should be delivered as written -
        that is a direct consequence, so exactness is customer_implied. Whether anyone is VISIBLE
        saying them is not stated at all; the benchmark fixes an unseen narrator so the case is
        runnable, and labels it a fixture.
    R12_temporal_structure:
      value:
        duration_seconds: 180
        duration_qualifier: approximate
        shot_count: null
        beats: null
      provenance: customer_stated
      rationale: '"~3 min each" is an approximate stated duration; acceptance must treat it as a band, not equality.'
    R13_subject_motion:
      value: null
      provenance: absent
    R14_camera_motion:
      value: null
      provenance: absent
    R15_delivery:
      value: null
      provenance: absent
      rationale: No platform, aspect ratio or resolution is stated. Left absent rather than assumed.
    R16_specification_provenance:
      value:
        customer_specified: [R01, R02, R04, R05, R11, R12, R18]
        customer_omitted: [R03, R06, R07, R08, R09, R10, R13, R14, R15]
        derived: [{field: R04.acceptance_basis, by: benchmark, why: a single fee for a set does not decide acceptance basis}]
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: one fixed fee for ten videos does not say whether acceptance is per video or for the set
          affected_fields: [R04]
        - marker_type: underspecification
          detail: nothing states what is on screen while the script is spoken
          affected_fields: [R06, R11, R13]
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - ten videos
          - each about three minutes
          - each follows its supplied script
        stated_rejection_criteria: []
      provenance: customer_stated
  fixture_requirements:
    - fixture_id: FX-003-scripts
      what: ten benchmark-authored English scripts, each sized to roughly three minutes
      why: the buyer's real scripts are not in the record, and spoken-script correctness needs an exact expected string
      rights_requirement: benchmark-authored
      blocks_runnable: false
    - fixture_id: FX-003-visualdirection
      what: a stated visual treatment (unseen narrator over supporting imagery) and a delivery format
      why: the buyer states neither, and both are needed for a repeatable run
      rights_requirement: none
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: Nothing needs the buyer. The scripts, visual treatment and format are benchmark decisions and are labelled as such.
  execution_feasibility:
    attemptable_without_a_planner: false
    note: >
      Thirty minutes of finished video across ten deliverables. No current single generation
      produces a three-minute continuous piece, so this case requires a segmentation and assembly
      plan - which is Production IR, and Production IR does not exist. The case is valuable
      precisely because it exposes that: it is a real, cheap, ordinary commercial job that the
      project currently has no object capable of planning.
  acceptance_contract:
    acceptance_basis: per_deliverable
    hard_objective:
      - requirement: ten separate deliverables exist
        provenance: customer_stated
        capability: delivery_format_compliance
      - requirement: each runs approximately three minutes
        provenance: customer_stated
        capability: delivery_format_compliance
      - requirement: the spoken words of each video match its supplied script
        provenance: customer_implied
        capability: spoken_script_correctness
      - requirement: the narration voice is the same voice across all ten
        provenance: experiment_supplied_fixture
        capability: voice_identity_consistency
      - requirement: audio and picture stay in sync across a long runtime
        provenance: system_derived
        capability: audio_video_synchronisation
    subjective_creative:
      - requirement: watchable for three continuous minutes rather than three minutes of filler
        provenance: customer_implied
        capability: hook_pacing_temporal_hierarchy
        no_deterministic_ground_truth: true
      - requirement: the imagery supports what is being said rather than contradicting it
        provenance: system_derived
        capability: proposition_objective_fit
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - Long-form watchability has no instrument and no qualified reviewer panel.
      - Whether the same narration voice persists across ten separate deliverables is a cross-asset judgement with no instrument today.
  route_neutral_generation_brief: |
    Produce ten separate videos, each about three minutes long, each delivering one of the ten
    supplied scripts.

    The words spoken in each video must be the words of its script. One consistent narration
    voice is used across all ten. Picture and speech must stay aligned for the full runtime.

    What appears on screen is an open choice, provided it supports rather than contradicts what
    is being said. Nothing here specifies how the video is produced or assembled.
  prompt_ready_envelope:
    objective: turn ten supplied scripts into ten finished narrated videos
    output_modality: video
    duration_seconds: 180
    duration_qualifier: approximate
    aspect_ratio: '16:9'
    aspect_ratio_provenance: experiment_supplied_fixture
    placement: unspecified_by_customer
    audience: unspecified_by_customer
    entities: []
    supplied_assets: [FX-003-scripts]
    identity_invariants:
      - one narration voice across all ten deliverables
    product_fidelity: not_applicable
    script_or_dialogue: FX-003-scripts, one per deliverable, spoken verbatim
    exact_on_screen_text: []
    language: {spoken: en, on_screen: none, subtitles: none}
    visual_tone: unspecified_by_customer
    temporal_beats: unspecified_by_customer
    cta: unspecified_by_customer
    brand_constraints: []
    deliverable_set: {cardinality: 10, one_per: supplied_script, acceptance: per_deliverable}
    prohibited_failures:
      - spoken words differ from the supplied script
      - narration voice changes between or within deliverables
      - speech and picture drift out of alignment
      - runtime materially short of three minutes
    model_specific_fields: null
  capability_mappings:
    atomic:
      - spoken_script_correctness
      - voice_identity_consistency
      - audio_video_synchronisation
      - pronunciation_intelligibility
      - delivery_format_compliance
      - hook_pacing_temporal_hierarchy
    compound_cooccurrence:
      - long_form_speech_over_generated_picture
      - voice_identity_across_a_set
      - supplied_script_batch_production
  evaluator_dependencies:
    - family: speech_audio_av
      for: [spoken_script_correctness, voice_identity_consistency, audio_video_synchronisation, pronunciation_intelligibility]
      qualified: false
      hard_blocker: >
        The project holds NO audio material of any kind, so nothing in this family can be qualified
        today. This case is unscoreable on its central requirement until that changes.
    - family: deterministic_cv_geometry
      for: [delivery_format_compliance]
      qualified: false
    - family: creative_commercial
      for: [hook_pacing_temporal_hierarchy, proposition_objective_fit]
      qualified: false
    - family: operational_logging
      for: [cost_and_cpao]
      qualified: false
  stage_fit:
    stage_a_atomic: false
    stage_b_compound: candidate
    stage_c_end_to_end: secondary
    rationale: >
      Secondary rather than primary for Stage C, because its length puts it beyond anything the
      project can attempt without a Planner. Its real present value is as evidence that ordinary,
      cheap, supplied-script batch work is structurally out of reach today.
  open_questions:
    - Whether acceptance is per video or for the set. A single fee for ten deliverables genuinely does not say.
    - What the buyer expected on screen. The posting body was not captured.

