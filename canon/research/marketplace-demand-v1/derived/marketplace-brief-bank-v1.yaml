# ---------------------------------------------------------------------------
- case_id: MKT-013
  source_marketplace: upwork
  source_record_id: UW-015
  source_title: Replace 4 AI-generated monitor screens in promo video
  source_file: canon/research/marketplace-demand-v1/sources/upwork-ai-video-demand-2026-08-26.md
  source_section_locators:
    - 'Appendix row 15'
  source_posted: '26 Aug'
  buyer_named_tools: []
  source_classification_disagreement:
    source_says: >
      The appendix does not bold this title, and the appendix states that bold titles are the ones
      classified as pipeline-addressable. So the research classified this posting as NOT addressable
      by an AI video pipeline.
    source_verbatim: '**Bold titles** are classified as pipeline-addressable.'
    this_bank_says: >
      Included anyway, and the disagreement is recorded rather than smoothed over. The researcher's
      classification is an interpretation, which the README places below individual buyer facts in
      the evidence hierarchy. The BUYER FACT is that someone is paying to change four specific
      objects inside an existing video while leaving the rest of it alone. That is an `edit`
      operation on a supplied video - the single largest hole in the authored 30-brief bank, which
      contains no edit item at all - and it is the only such posting in the entire recorded sample.
    what_would_settle_it: The posting body, which was not captured. If the buyer wanted a re-shoot rather than a change, the classification is right and this case is wrong.
  source_facts_used:
    - fact: The buyer wants four AI-generated monitor screens replaced inside an existing promo video, $10 fixed, from a Slovenia client with $4K+ recorded spend.
      verbatim: '| 15 | Replace 4 AI-generated monitor screens in promo video | $10 fixed | 5–10 | $4K+ · Slovenia | 26 Aug |'
    - fact: The appendix's own convention is that bold titles are the pipeline-addressable ones; this row is not bold.
      verbatim: '**Bold titles** are classified as pipeline-addressable.'
  customer_brief: |
    We have a promo video with four monitor screens in it that were AI-generated. Replace those
    four screens. $10 fixed.
  normalized_request:
    R01_requested_operation:
      value: edit
      provenance: customer_stated
      rationale: >
        "Replace X in Y" is the textbook edit statement: a supplied artefact, a named element to
        change, and everything else left alone. No inference is needed.
    R02_supplied_assets:
      value:
        - asset_id: mkt013_promo_video
          media_type: video
          role: subject_of_operation
          applies_to: null
          description: the existing promo video containing the four screens
        - asset_id: mkt013_replacement_content
          media_type: image
          role: unresolved_not_in_grammar_v1
          applies_to: monitor_screens
          description: the content that must appear on the four screens after replacement
          grammar_gap_ref: GG-01
      provenance: customer_stated
      sub_field_provenance:
        promo_video: customer_stated
        replacement_content: experiment_supplied_fixture
      rationale: >
        The video is unambiguously supplied - "in promo video" presupposes it. What the screens
        should be replaced WITH is not recorded, so the replacement content is a fixture.
    R03_mutation_intents:
      value:
        preservation_default: implicit_everything_not_named
        intents:
          - target: the four monitor screens
            intent: change
            detail: each screen's content is replaced
      provenance: customer_stated
      rationale: >
        Note what is NOT written here. The customer said what changes. Everything else is preserved
        implicitly, and the grammar forbids enumerating that implicit preservation as a list of
        customer statements. One intent, one target, and the preservation default carries the rest.
    R04_deliverable_set:
      value:
        cardinality: 1
        variation_axis: none
        acceptance_basis: per_deliverable
      provenance: customer_implied
    R05_modality:
      value: video
      provenance: customer_stated
    R06_entities:
      value:
        - entity_id: monitor_screens
          entity_type: object
          role: hero
          identity_invariants: [screen_position, screen_geometry, count]
      provenance: customer_stated
      sub_field_provenance:
        entity_presence: customer_stated
        entity_count: customer_stated
        identity_invariants: experiment_supplied_fixture
      rationale: >
        Four is stated, which is unusual and useful: an exact object count that must survive an
        edit, so object_count becomes an acceptance condition rather than a probe construct.
    R07_relationships:
      value: null
      provenance: absent
    R08_text_requirements:
      value: null
      provenance: absent
      rationale: >
        Screens usually carry text and this case would be much richer if it did. The buyer did not
        say so and none is invented. If the fixture screen content includes text, that text is a
        fixture requirement and labelled as one, not a customer requirement.
    R09_brand_requirements:
      value: null
      provenance: absent
    R10_language_topology:
      value: null
      provenance: absent
    R11_speaker_topology:
      value: null
      provenance: absent
    R12_temporal_structure:
      value: null
      provenance: absent
      rationale: The duration is whatever the supplied video's duration is. It is inherited, not requested.
    R13_subject_motion:
      value: null
      provenance: absent
    R14_camera_motion:
      value: null
      provenance: absent
      rationale: Inherited from the supplied video. An edit does not choose a camera.
    R15_delivery:
      value: null
      provenance: absent
      rationale: Inherited from the supplied video.
    R16_specification_provenance:
      value:
        customer_specified: [R01, R02, R03, R05, R06, R18]
        customer_omitted: [R04, R07, R08, R09, R10, R11, R12, R13, R14, R15]
        derived: [{field: R02.replacement_content, by: benchmark, why: the buyer does not say what the screens should show instead}]
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: what the four screens should display after replacement is not stated
          affected_fields: [R02, R08]
        - marker_type: underspecification
          detail: the research classified this posting as not pipeline-addressable and this bank disagrees; the posting body would settle it
          affected_fields: [R01]
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - all four monitor screens are replaced
          - the rest of the video is unchanged
        stated_rejection_criteria: []
      provenance: customer_stated
      rationale: >
        "The rest is unchanged" is customer_stated by the structure of the request itself, not by a
        separate sentence. A replace instruction that also altered everything else would not be
        what was asked for.
  fixture_requirements:
    - fixture_id: FX-013-basevideo
      what: a short benchmark-authored promo video containing exactly four visible monitor screens, with the source frames retained
      why: an edit case is meaningless without the artefact being edited, and preservation cannot be measured without the original to compare against
      rights_requirement: benchmark-authored
      blocks_runnable: false
    - fixture_id: FX-013-screencontent
      what: the replacement content for the four screens
      why: the buyer states the change but not its content
      rights_requirement: benchmark-authored
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: >
    Constructible, and unusually clean: because the benchmark authors the base video, the ground
    truth for "everything else unchanged" is held exactly rather than judged.
  execution_feasibility:
    attemptable_without_a_planner: true
    note: >
      A short single-artefact edit. Its measurement is cheaper than most cases here because
      preservation of the untouched region is a deterministic comparison against a held original,
      not a perceptual judgement.
  acceptance_contract:
    acceptance_basis: per_deliverable
    hard_objective:
      - requirement: exactly four screens are present after the edit
        provenance: customer_stated
        capability: object_count
      - requirement: all four screens show the replacement content
        provenance: customer_stated
        capability: edit_preservation
      - requirement: every region of the video not named in the request is unchanged
        provenance: customer_stated
        capability: edit_preservation
      - requirement: screen geometry and position are preserved
        provenance: experiment_supplied_fixture
        capability: spatial_relationship_2d
      - requirement: the replaced screens stay stable across the clip's frames
        provenance: system_derived
        capability: text_logo_stability_in_clip
    subjective_creative:
      - requirement: the replacement reads as part of the original footage rather than as a paste
        provenance: customer_implied
        capability: technical_visual_integrity
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - Whether a replacement blends convincingly is perceptual; the preservation half is not, which makes this case unusually cheap to judge in part.
  route_neutral_generation_brief: |
    Take the supplied promo video and change what appears on its four monitor screens to the
    supplied replacement content.

    Nothing else in the video may change. The number of screens stays four, in the same positions
    and the same shapes, and the footage around them - people, room, lighting, motion, timing - is
    the footage that was supplied.

    The replacement should sit in the footage rather than on top of it. How the change is achieved
    is not specified here.
  prompt_ready_envelope:
    objective: replace the content of four monitor screens inside an existing promotional video
    output_modality: video
    requested_operation: edit
    duration_seconds: inherited_from_supplied_asset
    aspect_ratio: inherited_from_supplied_asset
    placement: unspecified_by_customer
    audience: unspecified_by_customer
    entities:
      - id: monitor_screens
        type: object
        role: hero
        count: 4
        must_stay_constant: [position, geometry, count]
        must_change: [displayed_content]
    supplied_assets: [FX-013-basevideo, FX-013-screencontent]
    identity_invariants:
      - every element not named in the request is preserved exactly
      - four screens before, four screens after
    product_fidelity: not_applicable
    script_or_dialogue: none
    exact_on_screen_text: []
    language: {spoken: inherited_from_supplied_asset, on_screen: none, subtitles: none}
    visual_tone: inherited_from_supplied_asset
    temporal_beats: inherited_from_supplied_asset
    cta: unspecified_by_customer
    brand_constraints: []
    preservation_semantics: >
      One named element changes. Everything else is implicitly preserved. The customer enumerated
      nothing to keep and the system must not manufacture a list of preserve statements and
      attribute them to the customer.
    prohibited_failures:
      - any change outside the four screens
      - a screen count other than four
      - screens moving or changing shape
      - replacement content that flickers or drifts between frames
    model_specific_fields: null
  capability_mappings:
    atomic:
      - edit_preservation
      - object_count
      - spatial_relationship_2d
      - text_logo_stability_in_clip
      - technical_visual_integrity
    compound_cooccurrence:
      - edit_with_implicit_preservation_of_everything_unnamed
      - exact_object_count_surviving_an_edit
  evaluator_dependencies:
    - family: deterministic_cv_geometry
      for: [edit_preservation, object_count, spatial_relationship_2d]
      qualified: false
      note: >
        The cheapest evaluator path in the bank. Edit preservation against a held original is
        deterministic, and object count has a synthetic fixture pack that already exists.
    - family: temporal_video
      for: [text_logo_stability_in_clip, technical_visual_integrity]
      qualified: false
  stage_fit:
    stage_a_atomic: primary_source_material
    stage_b_compound: candidate
    stage_c_end_to_end: secondary
    rationale: >
      The one case here with real Stage-A value. Edit preservation is isolable, its truth is held
      by construction, and its evaluator family is the cheapest to qualify. If the project wants a
      marketplace-grounded item it could actually measure soonest, this is it.
  open_questions:
    - What the screens should display. The buyer's actual replacement content is unknown.
    - Whether the research's non-addressable classification is right. Recorded as an open disagreement, not resolved.

# ---------------------------------------------------------------------------
- case_id: MKT-014
  source_marketplace: upwork
  source_record_id: UW-049
  source_title: AI Video Ad Creator - Image-to-Video Workflow (Stonebridge Leads)
  source_file: canon/research/marketplace-demand-v1/sources/upwork-ai-video-demand-2026-08-26.md
  source_section_locators:
    - 'Appendix row 49'
  source_posted: '24 Aug'
  buyer_named_tools: []
  buyer_named_production_route:
    route_phrase: Image-to-Video Workflow
    where: job title
    treatment: >
      THE CASE THAT TESTS THE DISCIPLINE. The buyer named a production route in the title. Under
      the Controller decision that phrase is retained as source metadata and must not become
      benchmark ground truth: the customer intent underneath it is `animate` - produce motion from
      a still - and the route by which motion is produced is a later production choice against a
      Registry that does not exist. The phrase appears in this field and in source_facts_used, and
      in no route-neutral field anywhere in the case. The validator enforces that.
  source_facts_used:
    - fact: An AI video ad using an image-to-video workflow, $10 fixed, 5-10 proposals, US client with $900+ recorded spend.
      verbatim: '| 49 | **AI Video Ad Creator — Image-to-Video Workflow (Stonebridge Leads)** | $10 fixed | 5–10 | $900+ · US | 24 Aug |'
  customer_brief: |
    An AI video ad, produced from images. $10 fixed.

    The posting title specifies an image-to-video workflow. That is how the buyer expects it to be
    made; it is recorded and not treated as a requirement on the finished piece.
  normalized_request:
    R01_requested_operation:
      value: animate
      provenance: customer_implied
      rationale: >
        The most careful judgement in the bank. "Image-to-video" is a route name, and the grammar
        forbids route values as operations outright. But the customer intent underneath it is
        legible: something still becomes something moving, which is exactly the definition of
        `animate`. So the operation is customer_implied from the buyer's own words, with the route
        phrase preserved separately and used nowhere downstream.
    R02_supplied_assets:
      value:
        - asset_id: mkt014_source_image
          media_type: image
          role: subject_of_operation
          applies_to: advertised_product
          description: the still image the video is produced from
      provenance: customer_stated
      sub_field_provenance:
        asset_existence: customer_stated
        asset_content: experiment_supplied_fixture
      rationale: >
        An image-to-video job presupposes an image. That the image exists is stated by the request
        shape; what it depicts is not in the record and is a fixture.
    R03_mutation_intents:
      value: null
      provenance: absent
      rationale: The grammar requires mutation intents for edit, restore, extend and compose - not for animate. Nothing is being changed; motion is being added.
    R04_deliverable_set:
      value:
        cardinality: 1
        variation_axis: none
        acceptance_basis: per_deliverable
      provenance: customer_implied
    R05_modality:
      value: video
      provenance: customer_stated
    R06_entities:
      value:
        - entity_id: advertised_product
          entity_type: product
          role: hero
          identity_invariants: [everything visible in the source image]
      provenance: customer_implied
      sub_field_provenance:
        entity_presence: customer_implied
        identity_invariants: system_derived
      rationale: >
        The identity invariant here is unusual and derives from the operation rather than from a
        list: in an animate request the source image IS the identity specification. What was in the
        frame must still be what is in the frame once it moves.
    R07_relationships:
      value: null
      provenance: absent
    R08_text_requirements:
      value: null
      provenance: absent
    R09_brand_requirements:
      value: null
      provenance: absent
    R10_language_topology:
      value: null
      provenance: absent
    R11_speaker_topology:
      value: null
      provenance: absent
    R12_temporal_structure:
      value: null
      provenance: absent
    R13_subject_motion:
      value: null
      provenance: absent
      rationale: >
        Deliberately absent and important. The buyer asked for motion but said nothing about WHAT
        should move. The grammar separates subject motion from camera motion precisely because
        "make this move" is three different production problems, and this buyer has specified none
        of them.
    R14_camera_motion:
      value: null
      provenance: absent
    R15_delivery:
      value: null
      provenance: absent
    R16_specification_provenance:
      value:
        customer_specified: [R01, R02, R05, R18]
        customer_omitted: [R03, R04, R07, R08, R09, R10, R11, R12, R13, R14, R15]
        derived: [{field: R06.identity_invariants, by: benchmark, why: 'in an animate request the source frame defines the identity to preserve'}]
      provenance: system_derived
    R17_ambiguity_markers:
      value:
        - marker_type: underspecification
          detail: nothing states what should move, or whether the motion is subject motion or camera motion
          affected_fields: [R13, R14]
        - marker_type: underspecification
          detail: no duration, format or product content is stated
          affected_fields: [R06, R12, R15]
      provenance: system_derived
    R18_acceptance_intent:
      value:
        hard_constraints:
          - a video ad is produced from the supplied image
        stated_rejection_criteria: []
      provenance: customer_stated
  fixture_requirements:
    - fixture_id: FX-014-sourceimage
      what: a single product still, retained at full resolution as the animation ground truth
      why: an animate case needs the exact source frame in order to check what survived the motion
      rights_requirement: benchmark-owned
      blocks_runnable: false
    - fixture_id: FX-014-motionspec
      what: a stated motion brief - what moves, and whether the camera moves
      why: the buyer states neither, and without a decision the case cannot be judged either way
      rights_requirement: none
      blocks_runnable: false
    - fixture_id: FX-014-format
      what: duration and aspect ratio
      why: unstated by the buyer
      rights_requirement: none
      blocks_runnable: false
  runnable_now: true
  runnable_rationale: Constructible. Note that the motion specification - the substance of the request - is entirely a benchmark decision.
  execution_feasibility:
    attemptable_without_a_planner: true
    note: A single short animate operation from one still. Among the most attemptable shapes in the bank.
  acceptance_contract:
    acceptance_basis: per_deliverable
    hard_objective:
      - requirement: the content of the source image is recognisably preserved once it moves
        provenance: customer_implied
        capability: reference_conditioning
      - requirement: the product does not deform, drift or change while moving
        provenance: customer_implied
        capability: product_stability_in_clip
      - requirement: the motion that occurs is the motion specified
        provenance: experiment_supplied_fixture
        capability: motion_action_quality
      - requirement: subject motion and camera motion are distinguishable in the result
        provenance: experiment_supplied_fixture
        capability: camera_framing_fidelity
        note: >
          Included because the grammar separates these two fields and the coverage extension exercises
          the separation in only two items. This case can carry it cheaply.
    subjective_creative:
      - requirement: the motion looks intentional rather than like drift or artefacting
        provenance: customer_implied
        capability: technical_visual_integrity
        no_deterministic_ground_truth: true
    unresolved_human_review:
      - Whether motion reads as deliberate or as instability is a perceptual judgement with no qualified instrument.
  route_neutral_generation_brief: |
    Produce a short video advertisement from the supplied still image.

    Whatever is in the source image must still be recognisably there once it is moving - same
    object, same form, same colours, same arrangement. It must not deform or drift as it moves.

    The motion required is the motion set out in the supplied motion brief, and it must be clear
    whether it is the subject that moves or the framing.

    Nothing here specifies how the motion is produced.
  prompt_ready_envelope:
    objective: turn a supplied product still into a short video advertisement
    output_modality: video
    requested_operation: animate
    duration_seconds: 8
    duration_provenance: experiment_supplied_fixture
    aspect_ratio: '9:16'
    aspect_ratio_provenance: experiment_supplied_fixture
    placement: unspecified_by_customer
    audience: unspecified_by_customer
    entities:
      - id: advertised_product
        type: product
        role: hero
        must_stay_constant: [everything visible in the source frame]
    supplied_assets: [FX-014-sourceimage, FX-014-motionspec]
    identity_invariants:
      - the source frame's content survives the motion unchanged in form and colour
    product_fidelity: the source image is the fidelity reference
    script_or_dialogue: none
    exact_on_screen_text: []
    language: {spoken: none, on_screen: none, subtitles: none}
    visual_tone: inherited_from_source_image
    temporal_beats: unspecified_by_customer
    cta: unspecified_by_customer
    brand_constraints: []
    prohibited_failures:
      - the object deforming or changing as it moves
      - motion other than the motion specified
      - camera movement supplied where subject movement was asked for, or the reverse
      - visible warping or morphing artefacts
    model_specific_fields: null
  capability_mappings:
    atomic:
      - reference_conditioning
      - product_stability_in_clip
      - motion_action_quality
      - camera_framing_fidelity
      - technical_visual_integrity
    compound_cooccurrence:
      - animate_with_source_frame_preservation
      - subject_motion_separated_from_camera_motion
  evaluator_dependencies:
    - family: structured_visual_vlm
      for: [reference_conditioning]
      qualified: false
    - family: temporal_video
      for: [product_stability_in_clip, motion_action_quality, camera_framing_fidelity, technical_visual_integrity]
      qualified: false
      note: >
        Temporal truth can be INJECTED - a known freeze, a known identity swap, a known flip - so
        this family needs no human labels, only clean base clips. It is described in the
        qualification map as the cheapest large unblock available.
  stage_fit:
    stage_a_atomic: primary_source_material
    stage_b_compound: candidate
    stage_c_end_to_end: secondary
    rationale: >
      Strong Stage-A material for animate, which the authored 30-brief bank does not cover at all
      and the coverage extension covers with two authored items. This one is attested by a buyer.
  open_questions:
    - What should move. The buyer asked for motion and specified none, which is the substance of the job.
    - Whether the buyer's image-to-video phrasing carried further constraints in the posting body, which was not captured.

