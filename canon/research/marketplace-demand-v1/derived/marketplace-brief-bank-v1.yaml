  stage_fit:
    stage_a_atomic: false
    stage_b_compound: candidate
    stage_c_end_to_end: primary
    rationale: >
      The best case in the bank for the operational half of Stage C - throughput, reliability and
      cost per accepted outcome over a batch - because throughput is a stated buyer requirement
      here rather than an internal concern.
  open_questions:
    - What "mixed styles" means. It is a stated expectation with no content.
    - Whether the buyer's $50,000 is real. The spend record says treat it as aspirational.

