# STATUS: PROPOSED — Canon-stream worker output; no Controller decision adopts it;
# coordination/CONTROL-STATE.md governs.
#
# domain->system map v0 (Canon repair / REP-01, live-24 corpus).
#
# WHY THIS EXISTS. The domain map assigns whole SOURCES to domains, so a pack compiler seeding
# from it pulls 20-83% of the corpus per pack (measure: per-pack contributor object upper bounds
# in CANON-V1-LIVE24-COVERAGE.yaml over 677 objects). The committed sub-source structure — 78
# SourceConceptSystems averaging 8.7 members — is never referenced by any planning artifact. This
# file is the missing middle layer: for each of the 56 diagnostic domains it names the scs_ids the
# domain actually draws on, so compilation seeds at system granularity and closes over
# intra_source_relations instead of pulling whole sources.
#
# WHAT THIS IS NOT. Every systems list here is an AUTHORED CANON JUDGEMENT made by reading the
# committed system labels, descriptions and members against the domain definitions — validated
# mechanically only for naming real scs_ids (canon/validation/validate_live24_coverage.py). It is
# not machine-discovered, and adoption is a Controller decision.
#
# RESIDUE ENTRIES. Where a domain's material sits partly or wholly OUTSIDE any committed system
# (isolated objects, or a contributor whose relevant claims are not system members), the entry
# carries an explicit `residue` list so a system-seeded compiler knows what it will NOT reach and
# must pull by sk_id or leave behind knowingly. Empty domains carry a residue entry saying so.
# The 36 system-unreachable objects are catalogued with repair proposals in
# canon/planning/PROPOSED-orphan-backfill-v0.yaml.
#
# Every scs_id below resolves in canon/knowledge/current/*/source-concept-systems.yaml; every
# sk_id in a residue note resolves in the same source's source-knowledge.yaml (checked by the
# validator).

meta:
  task: Canon repair / REP-01
