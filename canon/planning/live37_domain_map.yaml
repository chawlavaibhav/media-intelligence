# STATUS: PROPOSED — Canon-stream worker output; no Controller decision adopts it;
# coordination/CONTROL-STATE.md governs.
#
# CANON live-37 — authored domain→source mapping for the LIVE 37 accepted sources.
# SUPERSEDES canon/planning/live24_domain_map.yaml (frozen; never mutated — supersede only).
# All 56 domain rows are carried over from the live24 map verbatim except where a row is
# annotated "LIVE37 EDIT"; the only changes are (a) contributor additions for the thirteen
# sources admitted under REP-07 / DN-06 (google-abcd-video-ads, w3c-wcag22-text-legibility,
# light-science-magic-beyond-ch3, berger-contagious, hopkins-scientific-advertising-ch8-21,
# hopkins-my-life-in-advertising, kahneman-sibony-sunstein-noise, godin-this-is-marketing,
# sontag-on-photography, sullivan-hey-whipple, connor-irizarry-discussing-design,
# carroll-read-this-photographs, ogilvy-beyond-ch2; 623 objects) and (b) gap-prose and
# state_override-prose corrections that those admissions make factually necessary. Each
# addition carries a justification comment citing the sk_/scs_ ids it was judged from.
#
# RULING-(c) ADMISSION MARKERS (DN-06, 2026-09-01, "Admit both, marked"): google-abcd-video-ads
# is admitted marked platform_contingent — dated, platform-scoped official guidance, valid
# relative to YouTube's formats and measurement products at the pages' stated dates, published
# by a party with a declared commercial interest; nothing from it may be compiled as
# platform-neutral or evergreen doctrine. sontag-on-photography is admitted marked
# critique_context — critique of how photographs are read, circulate and act on viewers, never
# production doctrine; no claim from it may be compiled as advice about how to make anything.
# Any compiled pack or downstream consumer carrying material from either source must surface
# its marker alongside it (mirrors the admission_conditions blocks in
# canon/audit/records/google-abcd-video-ads.audit.yaml and sontag-on-photography.audit.yaml).
# The meta.admission_markers block below carries the flags machine-readably.
#
# RULING-(d) SCOPED EXTENSIONS (DN-06): hopkins-scientific-advertising-ch8-21,
# light-science-magic-beyond-ch3 and ogilvy-beyond-ch2 enter ONLY as explicitly scoped
# extensions of their live sources (hopkins-scientific-advertising-ch1-7,
# light-science-magic-ch3, ogilvy-ch2-advertising-that-sells respectively), never as
# independent origins. The meta.scoped_extensions block below records the same-work grouping;
# counting is enforced mechanically, because each pair is dependence-blocked by the two-sided
# shared_author lineage declarations in the audit records, which independent_origins_ok()
# (the committed Audit Gate rule the builder imports) fails closed on. The builder additionally
# refuses to run if any listed pair is NOT dependence-blocked.
#
# WHAT THIS IS. One row per diagnostic domain from `canon/experiments/CANON-COVERAGE-MAP-V0.md`.
# `contributors` lists the accepted source directories that MATERIALLY contribute knowledge to that
# domain, judged by reading the committed extraction — the source-declared
# `scope.domain_discussed_by_source` values, the SourceConceptSystems, and the ontology terms — and
# NOT by the book's title or its shelf position.
#
# WHAT THIS IS NOT. It is NOT machine-discovered truth. Every `contributors` list, every
# `importance`, every `gap` and every `state_override` entry in this file is an AUTHORED CANON
# JUDGEMENT. `build_live37_coverage.py` validates them for completeness and for naming only real
# accepted source directories, and fails closed on a breach — but it cannot check whether a
# judgement is right. Whether a different Canon worker reading the same 37 directories would assign
# the same contributors is untested. The additions here are worker proposals pending Controller
# acceptance.
#
# It is also not a quality score. A domain with four contributors is not "better" than
# one with two; it holds knowledge from more places. Bindability is not evidence quality
# (canon/HANDOFF.md), so nothing here ranks a source by how many bindings it has.
#
# Everything mechanical — independent-origin counts, binding state, object counts — is computed by
# `build_live37_coverage.py` from committed artifacts and is NOT authored here.
#
# importance: critical | useful | peripheral   (to the frozen first-product scope)
# Coverage state is COMPUTED, not authored, except where `state_override` gives a reason.

meta:
  task: REP-07 / DN-06 consequence 5 (live-37 coverage layer)
  authored: 2026-09-01
  status: PROPOSED
  supersedes: canon/planning/live24_domain_map.yaml
  domain_source: canon/experiments/CANON-COVERAGE-MAP-V0.md
  basis: canon/knowledge/current (37 accepted source directories), canon/audit/records (37 records)
  # DN-06 ruling (c): admission markers the coverage layer must carry visibly. Keys are the
  # marker condition names exactly as they appear in the records' admission_conditions blocks.
  admission_markers:
    platform_contingent: [google-abcd-video-ads]
    critique_context: [sontag-on-photography]
  # DN-06 ruling (d): same-work grouping. extension -> the live source it is a scoped
  # extension of. Never counted as independent origins of their parents (enforced via the
  # audit-record lineage + independent_origins_ok(); the builder fails closed on a breach).
  scoped_extensions:
    hopkins-scientific-advertising-ch8-21: hopkins-scientific-advertising-ch1-7
    light-science-magic-beyond-ch3: light-science-magic-ch3
    ogilvy-beyond-ch2: ogilvy-ch2-advertising-that-sells

domains:

# ── A · Static visual craft ────────────────────────────────────────────────────
- id: A01
  name: Composition & framing
  section: A
  importance: critical
  # LIVE24 EDIT — added dwyer-patel-cinema-india and jain-gods-in-the-bazaar.
  # Justification: dwyer-patel treats frontality/iconicity as a compositional convention that
  # freezes space to render meaning visible (sk_dpci_0020) and gives a two-stage account of the
  # portrait-led poster composition (sk_dpci_0090, sk_dpci_0100; system scs_dpci_001). jain states
  # the frontal gaze as a functional compositional requirement that overrides depicted action
  # (sk_jgb_0010; system scs_jgb_001). Both are audience-code composition conventions, not camera
  # placement craft — they extend, not replace, the three physical-world sources.
  # LIVE37 EDIT — added carroll-read-this-photographs.
  # Justification: scs_crl_003 is a nine-spread compositional-technique system — leading lines
  # (sk_crl_0001), internal framing (sk_crl_0002), symmetry/centring with its stated cost
  # (sk_crl_0005), rule of thirds (sk_crl_0006), working the frame edge to edge (sk_crl_0007),
  # seeing objects as two-dimensional shapes and tones (sk_crl_0008) — all subordinated to a
  # single serves-the-picture test (sk_crl_0009). Beginner-register but genuinely compositional.
  contributors: [freeman-photographers-eye-graphic-guide, kenworthy-master-shots-ch8, alton-painting-with-light-ch2, dwyer-patel-cinema-india, jain-gods-in-the-bazaar, carroll-read-this-photographs]
  gap: >
    Well covered for the still frame and the staged scene. The craft sources assume a
    photographer or director choosing a camera position in the physical world; none addresses
    composing for a fixed vertical feed frame or for a crop that will be re-used at several aspect
    ratios. The two India sources add frontal/iconic composition conventions read by an audience
    that holds the code (2002/2007 material; dated, not feed-native). carroll adds a plain-language
    technique inventory (2016) with an explicit override test.

- id: A02
  name: Hierarchy / attention / salience
  section: A
  importance: critical
  # LIVE24 EDIT — added dwyer-patel-cinema-india.
  # Justification: sk_dpci_0090 is an explicit two-stage salience account (the face opens
  # attention before recognition; scope domain visual_attention) and scs_dpci_001 describes how a
  # poster steers a viewer's attention through a held code.
  contributors: [freeman-photographers-eye-graphic-guide, samara-making-breaking-grid-ch1, kenworthy-master-shots-ch8, murch-blink-p1-25, grammar-of-the-edit-ch3-5, vignelli-canon-intangibles, dwyer-patel-cinema-india]
  gap: >
    Strong and genuinely multi-origin across still, page and moving image. The v0 map rated this
    strong on Picture This, Non-Designer's and Thinking with Type — none of which is in the live 19.
    The rating survives, but on entirely different evidence.

- id: A03
  name: Visual weight
  section: A
  importance: critical
  # LIVE24 EDIT — added jain-gods-in-the-bazaar.
  # Justification: sk_jgb_0020 (member of scs_jgb_001) treats colour SATURATION as a public claim
  # on attention — exactly the saturation-borne weight the live19 gap recorded as absent.
  contributors: [freeman-photographers-eye-graphic-guide, alton-painting-with-light-ch2, jain-gods-in-the-bazaar]
  gap: >
    Freeman supplies tonal weight and division; Alton supplies tonal separation of subject from
    ground. Both are tonal arguments. jain (sk_jgb_0020) now supplies saturation as a claim on
    attention, from Indian bazaar-print practice; weight from brand-colour blocks — what a
    commercial creative usually manipulates — remains untreated.

- id: A04
  name: Grouping / gestalt
  section: A
  importance: useful
  contributors: [freeman-photographers-eye-graphic-guide, samara-making-breaking-grid-ch1]
  gap: >
    Present as practice — Samara's modules and spatial zones, Freeman's backgrounds that give each
    unit a place — but no accepted source states the perceptual grouping principles themselves. The
    Canon has the applications without the mechanism.

- id: A05
  name: Colour
  section: A
  importance: critical
  # LIVE24 EDIT — added jain-gods-in-the-bazaar.
  # Justification: sk_jgb_0020 records saturated colour as a convention of the Indian bazaar-print
  # market that outlived its technical cause (Sivakasi print production), i.e. colour MEANING in a
  # named market context — the exact half the live19 gap called absent. It is historical
  # (2007-published field material), not a festival-by-festival colour code.
  # LIVE37 EDIT — added w3c-wcag22-text-legibility and light-science-magic-beyond-ch3.
  # Justification: wcag supplies the corpus's only computable colour machinery — the contrast
  # ratio (sk_wcag_0014) and relative luminance (sk_wcag_0020) formulas, the derivation of the
  # 4.5:1 and 3:1 thresholds (sk_wcag_0030; system scs_wcag_002), deliberate hue-insensitivity
  # for colour-vision deficiency (sk_wcag_0032) and colour-never-the-only-means (sk_wcag_0007;
  # system scs_wcag_004). lsm-beyond adds colour-of-light craft: mixed versus wrong colour
  # (sk_lsmx_0058), gelling a window as a source (sk_lsmx_0059), and the failure mode of a
  # global colour correction (sk_lsmx_0060). wcag carries no aesthetic colour judgement; it is
  # conformance machinery, not palette advice.
  contributors: [albers-interaction-of-color, alton-painting-with-light-ch2, kenworthy-master-shots-ch8, vignelli-canon-intangibles, jain-gods-in-the-bazaar, w3c-wcag22-text-legibility, light-science-magic-beyond-ch3]
  gap: >
    Albers is deep on colour RELATION — a colour's appearance depends on its neighbour — which is the
    hardest part and the part a generator gets wrong. Two limits matter: the Albers digitisation is
    greyscale, so its own audit records blocked visual validation of a colour source; and colour
    MEANING by market context is now present only as jain's dated bazaar-print account
    (sk_jgb_0020) — festival-by-festival and category colour codes remain absent.

- id: A06
  name: Typography
  section: A
  importance: critical
  # LIVE37 EDIT — added w3c-wcag22-text-legibility.
  # Justification: text legibility as a testable procedure — the large-scale text definition and
  # its 18pt/14pt-bold thresholds (sk_wcag_0021) with their large-print provenance (sk_wcag_0024),
  # the warning that extraordinarily thin strokes or unfamiliar letterforms reduce legibility
  # (sk_wcag_0022), the per-item reasons behind SC 1.4.8's line length/spacing/justification rules
  # (sk_wcag_0037, sk_wcag_0012), and the images-of-text criteria (scs_wcag_003, sk_wcag_0008).
  # scs_wcag_001 is the full SC 1.4.3 decision procedure a rendered-text check can execute.
  contributors: [samara-making-breaking-grid-ch1, vignelli-canon-intangibles, albers-interaction-of-color, w3c-wcag22-text-legibility]
  gap: >
    Latin typography only, and structural rather than letterform-level: Samara on measure, leading
    and column derivation, Vignelli on discipline and appropriateness. wcag (2023-era normative
    text plus Understanding notes) now adds computable legibility floors — contrast thresholds,
    large-text classification, images-of-text rules — the first directly checkable typography
    knowledge in the corpus, though it is a conformance floor, not typographic craft. No accepted
    source treats typeface anatomy, and none treats any non-Latin script — the CJK note inside
    sk_wcag_0021 sizes an equivalent threshold but does not treat Indic scripts.

- id: A07
  name: Grids & layout systems
  section: A
  importance: useful
  contributors: [samara-making-breaking-grid-ch1, vignelli-canon-intangibles]
  gap: >
    The strongest single domain in the corpus — Samara alone contributes 79 objects and six concept
    systems. Print and web page structure. A single-image commercial creative is a different layout
    problem, and the transfer is unproven rather than absent.

- id: A08
  name: Imagery & subject choice
  section: A
  importance: useful
  # LIVE24 EDIT — added dwyer-patel-cinema-india and jain-gods-in-the-bazaar.
  # Justification: the live19 gap named "choosing imagery that reads correctly to an Indian
  # audience" as absent. dwyer-patel supplies the audience-held code for props, costume and
  # character types (sk_dpci_0040, sk_dpci_0070, sk_dpci_0120); jain supplies iconographic
  # correctness as the precondition of a functioning image, regional codes as the main ground of
  # rejection, and a named injunction whose breach breaks images (sk_jgb_0130, sk_jgb_0040,
  # sk_jgb_0030; system scs_jgb_001).
  # LIVE37 EDIT — added hopkins-scientific-advertising-ch8-21 (SCOPED EXTENSION of the live
  # ch1-7 source per DN-06 ruling (d) — same 1923 volume, never an independent origin; the
  # shared_author lineage blocks the pair mechanically).
  # Justification: scs_sa8_001 is chapter 9's picture-economics system — a picture costs the
  # space it occupies and must out-sell the same space set in type (sk_sa8_0005), pictures that
  # pay depict the condition the buyer wants to reach (sk_sa8_0006), and the eccentric picture
  # is a named double failure (sk_sa8_0007). This deepens the ch1-7 commercial test with
  # subject-choice rules; agreement between the two spans is worth zero as corroboration.
  contributors: [freeman-photographers-eye-graphic-guide, hopkins-scientific-advertising-ch1-7, alton-painting-with-light-ch2, dwyer-patel-cinema-india, jain-gods-in-the-bazaar, hopkins-scientific-advertising-ch8-21]
  gap: >
    Hopkins supplies the commercial test — a picture must sell, "useless pictures" are a named
    failure — now extended by the same volume's chapters 8-21 with picture-economics and
    subject-choice rules (one origin, two spans). Freeman supplies the craft of what the frame
    holds. dwyer-patel and jain supply audience-code and iconographic-correctness priors for
    Indian imagery, dated 2002/2007; contemporary Indian feed imagery conventions remain
    untreated.

- id: A09
  name: Lighting
  section: A
  importance: critical
  # LIVE37 EDIT — added light-science-magic-beyond-ch3 (SCOPED EXTENSION of the live
  # light-science-magic-ch3 per DN-06 ruling (d) — chapters 4-11 of the identical 5th-edition
  # file, never an independent origin; shared_author lineage blocks the pair mechanically) and
  # carroll-read-this-photographs.
  # Justification: lsm-beyond executes the ch3 procedure chapter by chapter — the
  # classify-by-reflection decision rule (sk_lsmx_0003; system scs_lsmx_001) and the four
  # controls that all act on the family of angles (scs_lsmx_002, sk_lsmx_0017). carroll is an
  # independent origin: hard versus soft light structured as a paired system (scs_crl_002),
  # intent-governed choice between them (sk_crl_0018), flat light's cost (sk_crl_0019), and the
  # geometric reason built-in flash overrides a look (sk_crl_0020).
  contributors: [alton-painting-with-light-ch2, light-science-magic-ch3, light-science-magic-beyond-ch3, carroll-read-this-photographs]
  gap: >
    Alton names light functions from studio practice, Light Science & Magic derives placement
    from the physics of reflection — and its beyond-ch3 span (same work, same origin) now works
    that physics through every major surface class. carroll adds an independent hard/soft
    treatment at beginner register. All describe operating physical lights, so every binding is
    a production candidate rather than a generative instruction. This is a translation problem,
    not a knowledge gap.

- id: A10
  name: Material appearance
  section: A
  importance: critical
  # LIVE37 EDIT — added light-science-magic-beyond-ch3 (SCOPED EXTENSION, ruling d — see A09).
  # Justification: the extension is the surface-appearance payoff of the ch3 model: complex
  # surfaces needing both reflection types (sk_lsmx_0013), gloss proven by an object's own
  # reflection (sk_lsmx_0014), metal's purity of direct reflection (sk_lsmx_0025), glass optics
  # (sk_lsmx_0039), and texture revealed or lost by reflection type (sk_lsmx_0010, sk_lsmx_0011,
  # sk_lsmx_0012 — members of scs_lsmx_001).
  contributors: [light-science-magic-ch3, alton-painting-with-light-ch2, light-science-magic-beyond-ch3]
  gap: >
    Light Science & Magic's family-of-angles model is the most directly product-relevant physical
    knowledge in the Canon: it predicts where a reflection will appear on a glossy surface, and
    its beyond-ch3 span (same origin) now applies it to metal, glass, wood and textured surfaces
    class by class. Directly useful for judging whether a generated packshot is physically
    coherent.

- id: A11
  name: Photography craft
  section: A
  importance: useful
  # LIVE37 EDIT — added light-science-magic-beyond-ch3 (SCOPED EXTENSION, ruling d — see A09)
  # and carroll-read-this-photographs.
  # Justification: lsm-beyond adds measurable working craft — finding the family of angles with
  # a white target (sk_lsmx_0027), opening a spot reading two to three stops on bright metal
  # (sk_lsmx_0029), the two glass metering regimes (sk_lsmx_0044). carroll adds the exposure
  # triangle as a compensating-controls system (scs_crl_001, sk_crl_0010), aperture as an
  # attention control (sk_crl_0013), predictable metering failure on very bright/dark subjects
  # (sk_crl_0016), and the focal-length-decides-your-distance chain (sk_crl_0021; scs_crl_004).
  contributors: [freeman-photographers-eye-graphic-guide, light-science-magic-ch3, alton-painting-with-light-ch2, light-science-magic-beyond-ch3, carroll-read-this-photographs]
  gap: >
    Camera-operation craft, largely inapplicable as instruction to a generator, but usable as
    inspection criteria for whether an output is physically plausible.

- id: A12
  name: Spatial relationships & depth
  section: A
  importance: useful
  # LIVE37 EDIT — added carroll-read-this-photographs.
  # Justification: scs_crl_004 is a depth system — foreground interest as the entry point and
  # depth cue (sk_crl_0003), short focal lengths exaggerating near-far relations (sk_crl_0022),
  # long focal lengths compressing space and reading as distance from the subject (sk_crl_0023).
  contributors: [freeman-photographers-eye-graphic-guide, kenworthy-master-shots-ch8, murch-blink-p1-25, grammar-of-the-shot-ch4, carroll-read-this-photographs]
  gap: >
    Murch's planarity and the two-dimensional plane of the screen are load-bearing for judging
    whether a generated shot sequence holds together spatially. carroll adds focal-length depth
    cues for the still frame.

- id: A13
  name: Product / packshot photography
  section: A
  importance: critical
  # LIVE37 EDIT — added light-science-magic-beyond-ch3 (SCOPED EXTENSION, ruling d — see A09).
  # Justification: the extension is the closest thing the corpus now holds to packshot doctrine:
  # the glossy-box remedy ladder (scs_lsmx_003, sk_lsmx_0023), the metal box's simultaneous
  # families of angles (sk_lsmx_0035), bright-field/dark-field glass (scs_lsmx_004, sk_lsmx_0040,
  # sk_lsmx_0041), the label-on-a-bottle two-surface conflict (sk_lsmx_0049), and white-on-white /
  # black-on-black technique sets (scs_lsmx_005, sk_lsmx_0056, sk_lsmx_0057).
  contributors: [light-science-magic-ch3, alton-painting-with-light-ch2, light-science-magic-beyond-ch3]
  gap: >
    THE most important partially-covered domain for the first product. What exists is reflection
    control and lighting function — now including worked product cases (glossy boxes, metal,
    glass, bottle labels, white-on-white) from the LSM beyond-ch3 span, which is the same origin
    as chapter 3, not a second one. What is missing is still packshot convention: hero angle,
    label legibility, scale cues, and the commercial packshot's obligation to show the product as
    it actually is. All contributors are photographic-lighting sources, not product-photography-
    convention sources.
  state_override:
    state: present_but_application_unbound
    reason: >
      Knowledge exists and is relevant — deepened by the LSM beyond-ch3 worked product cases —
      but every binding from all three sources is a physical-production candidate. Nothing has
      been translated into what to ask for, or what to inspect, in a generated packshot. SPEC-04
      forbids auto-translating physical advice into generative instruction.

- id: A14
  name: Devanagari & Indic typography
  section: A
  importance: critical
  contributors: []
  gap: >
    Empty. No accepted source treats any non-Latin script. CANON-008 stopped at its acquisition gate
    (only a 3-page abstract is public), so the slot is unfilled by decision, not by oversight. This
    is the single largest named hole and it sits directly under a first-product language requirement.

# ── B · Moving image ───────────────────────────────────────────────────────────
- id: B01
  name: Shot grammar & shot types
  section: B
  importance: critical
  contributors: [grammar-of-the-shot-ch4, grammar-of-the-edit-ch3-5, kenworthy-master-shots-ch8]
  gap: >
    Note the independence trap: Grammar of the Shot and Grammar of the Edit are companion volumes and
    are BLOCKED from counting as independent origins with each other. Kenworthy is the genuine second
    origin here.

- id: B02
  name: Camera placement & movement
  section: B
  importance: useful
  contributors: [kenworthy-master-shots-ch8, grammar-of-the-shot-ch4, alton-painting-with-light-ch2]
  gap: >
    Kenworthy's seven ways to move attention without a cut is unusually well suited to short-form,
    where cuts are expensive in attention terms. The unmotivated camera move is a named failure.

- id: B03
  name: Continuity
  section: B
  importance: critical
  contributors: [grammar-of-the-shot-ch4, grammar-of-the-edit-ch3-5, murch-blink-p1-25, ondaatje-conversations-ch3]
  gap: >
    Strong, and the most directly transferable moving-image knowledge the Canon holds for judging
    generated video, where continuity failure is a known weakness. Two dependence pairs sit inside
    this domain (companion volumes; shared primary informant), so the independent-origin count is
    materially lower than the contributor count.

- id: B04
  name: Editing & cut logic
  section: B
  importance: critical
  contributors: [grammar-of-the-edit-ch3-5, murch-blink-p1-25, ondaatje-conversations-ch3]
  gap: >
    Deep — 60, 39 and 27 objects. But Murch and Ondaatje are a shared-primary-informant pair, so this
    is two independent origins, not three. Assembly-stage knowledge; a text-to-video generator
    produces shots, so this is mostly evaluation and planning knowledge rather than instruction.

- id: B05
  name: Pacing & rhythm
  section: B
  importance: critical
  contributors: [murch-blink-p1-25, grammar-of-the-edit-ch3-5, ondaatje-conversations-ch3]
  gap: >
    Feature-film pacing. Nothing addresses the 6–20 second commercial, where the whole piece is
    shorter than a single scene in any of these sources. The knowledge is real and the scale is wrong.

- id: B06
  name: Temporal hierarchy
  section: B
  importance: useful
  contributors: [murch-blink-p1-25, grammar-of-the-edit-ch3-5]
  gap: >
    Murch's Rule of Six is an explicit ranked priority list with sacrifice rules — the clearest piece
    of trade-off machinery in the entire Canon, and reusable well beyond editing.

- id: B07
  name: Visual storytelling
  section: B
  importance: critical
  contributors: [murch-blink-p1-25, ondaatje-conversations-ch3, kenworthy-master-shots-ch8, miller-storybrand-sb7]
  gap: >
    Miller supplies commercial narrative structure, the others cinematic. No accepted source treats
    story compressed into a few seconds.

- id: B08
  name: Performance & direction
  section: B
  importance: peripheral
  contributors: [kenworthy-master-shots-ch8, ondaatje-conversations-ch3]
  gap: >
    Thin, and correctly peripheral: directing a human performer is not what a generative pipeline
    does. Retains value as evaluation vocabulary for whether a generated person reads as plausible.

- id: B09
  name: Dialogue presentation
  section: B
  importance: useful
  contributors: [grammar-of-the-edit-ch3-5, ondaatje-conversations-ch3, kenworthy-master-shots-ch8]
  gap: >
    Split edits, sound bridges and Ondaatje's withdrawal of dialogue to expose the soundtrack.
    Relevant to the two-speaker cases in the first-product scope. Nothing on lip-sync plausibility,
    which is where generated dialogue actually fails.

- id: B10
  name: Sound / audiovisual relation
  section: B
  importance: useful
  contributors: [ondaatje-conversations-ch3, grammar-of-the-edit-ch3-5, murch-blink-p1-25]
  gap: >
    Better than the v0 map credited. Ondaatje's attention economy of the soundtrack — that picture
    and sound compete for one attention budget — is directly applicable to voiceover briefs. Both
    Murch-lineage sources sit here, so independence is limited.

- id: B11
  name: Short-form / feed-native grammar
  section: B
  importance: critical
