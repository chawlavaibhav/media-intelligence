  # patterns predicted by occupation/education not income (sk_rbwl_0070), hybrid adoption as the
  # expected outcome (sk_rbwl_0120). pandey states audience-context understanding as his governing
  # communication principle (sk_ppm_0001) and localises it organisationally (sk_ppm_0030).
  # parameswaran reports Indian household purchase-influence structure and usage patterns
  # (sk_nnn_0030, sk_nnn_0031, sk_nnn_0032).
  # LIVE37 EDIT — added hopkins-my-life-in-advertising and godin-this-is-marketing.
  # Justification: the memoir states its audience knowledge as its core asset — competence
  # limited to ordinary wage-earning people (sk_mla_0002), the deciders' preferences
  # systematically unrepresentative of the market (sk_mla_0005), people do little to prevent and
  # much to cure (sk_mla_0049), economy rarely the stated reason even for buyers of limited
  # means (sk_mla_0060). godin's audience machinery: psychographic grouping (sk_god_0008),
  # empathy as a hard working constraint — the served do not believe or want what you do
  # (sk_god_0010, sk_god_0011), and audience-first ordering (sk_god_0001; system scs_god_002).
  contributors: [sutherland-alchemy-introduction, hopkins-scientific-advertising-ch1-7, binet-field-effectiveness-in-context-ch1, miller-storybrand-sb7, heath-made-to-stick-introduction, bijapurkar-we-are-like-that-only, pandey-pandeymonium, parameswaran-nawabs-nudes-noodles, hopkins-my-life-in-advertising, godin-this-is-marketing]
  gap: >
    Heath's curse of knowledge — once you know something you cannot imagine not knowing it — is the
    mechanism behind most briefing failure; hopkins's memoir and godin both restate it as the
    decider's unrepresentativeness (sk_mla_0005) and the empathy constraint (sk_god_0010). The
    Anglo-American origins now span 1927-2018; the three accepted India sources (2007/2015/2016)
    describe the Indian audience's purchase logic, influence structure and register expectations —
    as cultural history and practitioner assertion, not as current operational data.

