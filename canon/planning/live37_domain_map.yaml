# ── E · Evaluation & critique ──────────────────────────────────────────────────
- id: E01
  name: What to look for, by objective
  section: E
  importance: critical
  contributors: [ogilvy-ch2-advertising-that-sells, binet-field-effectiveness-in-context-ch1, miller-storybrand-sb7, hopkins-scientific-advertising-ch1-7, grammar-of-the-edit-ch3-5]
  gap: >
    Present as several objective-specific tests — Hopkins's salesmanship test, Miller's grunt test,
    Grammar of the Edit's six-element transition test. Not yet assembled into one inspection
    procedure keyed by objective; that is C7/C8 work.

- id: E02
  name: Observational unit
  section: E
  importance: critical
  contributors: [grammar-of-the-shot-ch4, grammar-of-the-edit-ch3-5, murch-blink-p1-25, freeman-photographers-eye-graphic-guide, samara-making-breaking-grid-ch1]
  gap: >
    MATERIALLY BETTER THAN v0 RECORDED — v0 rated this weak on Grammar of the Shot alone. Five
    sources now establish that the unit of inspection varies: the frame (Freeman), the spread
    (Samara), the transition PAIR (Grammar of the Edit's six-element test), the cut (Murch).
    Grammar of the Shot's "defects with no within-frame signature" is the load-bearing insight for
    Eval: some failures are invisible in any single frame and exist only across a pair. An evaluator
    that scores frames one at a time cannot detect them by construction.
  cross_stream_relevance: eval

- id: E03
  name: Diagnostic questions
  section: E
  importance: critical
  # LIVE37 EDIT — added connor-irizarry-discussing-design.
  # Justification: scs_disc_002 pairs a critique specification with a four-question procedure
  # that produces it (sk_disc_0015: what is the objective; what elements relate to it; are they
  # effective; why or why not). Productive critiques contain more questions than statements
  # (sk_disc_0019), and laddering recovers the diagnosis hidden inside badly formed feedback
  # (sk_disc_0048).
  contributors: [catmull-creativity-inc-ch5, grammar-of-the-edit-ch3-5, light-science-magic-ch3, miller-storybrand-sb7, vignelli-canon-intangibles, connor-irizarry-discussing-design]
  gap: >
    Catmull's "diagnose the cause, not the symptom" and the named failure of the unspecific and the
    prescriptive note are directly applicable to designing a creative evaluator's output format;
    connor's four-question procedure is the closest thing the corpus holds to an evaluator's
    question template.

