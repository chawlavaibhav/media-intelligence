- id: E05
  name: Context dependence & exceptions
  section: E
  importance: useful
  # LIVE24 EDIT — added bijapurkar-we-are-like-that-only.
  # Justification: bijapurkar's analogy trap — a market does not replay another market's past
  # (sk_rbwl_0090) — and hybrid adoption as the expected outcome (sk_rbwl_0120) are context-
  # dependence arguments at market scale; scs_rbwl_001 is a system of such reasoning errors.
  # LIVE37 EDIT — added sontag-on-photography. ADMISSION MARKER (DN-06 ruling c):
  # critique_context — critique of how photographs are read and act on viewers, admitted as
  # context for interpreting images and framing units of evaluation, NEVER production doctrine;
  # no claim from it may be compiled as advice about how to make anything, and any pack carrying
  # it must surface the marker.
  # Justification: scs_snt_002 is a system of limits on what an image can mean by itself —
  # meaning is supplied by placement and no placement secures it (sk_snt_0007), the caption
  # cannot fix it (sk_snt_0008) — and scs_snt_003 gives effect-decay mechanisms: repetition
  # blunts response (sk_snt_0014) and time drains the event (sk_snt_0015). These are
  # context-dependence claims about image RECEPTION, exactly the register the marker permits.
  contributors: [binet-field-effectiveness-in-context-ch1, grammar-of-the-shot-ch4, freeman-photographers-eye-graphic-guide, samara-making-breaking-grid-ch1, light-science-magic-ch3, bijapurkar-we-are-like-that-only, sontag-on-photography]
  gap: >
    Binet & Field's entire chapter is an argument that effectiveness rules are context-dependent;
    bijapurkar makes the same argument at market scale for India; sontag (marker-bound: critique
    context, never production doctrine) makes it for the single image — its meaning depends on
    placement, caption and exposure history. Strong raw material, unsynthesised.

- id: E06
  name: Interaction among principles
  section: E
  importance: critical
  contributors: [murch-blink-p1-25, albers-interaction-of-color, samara-making-breaking-grid-ch1, freeman-photographers-eye-graphic-guide, light-science-magic-ch3]
  gap: >
    MATERIALLY BETTER THAN v0 RECORDED (v0: weak). Albers is an entire source arguing that a colour
    has no fixed appearance in isolation; Murch's Rule of Six ranks six criteria that routinely
    conflict; Light Science & Magic's family of angles is a single control with several simultaneous
    consequences. Still requires cross-source synthesis, which has not been done.

- id: E07
  name: Critique process & language
  section: E
  importance: peripheral
  # LIVE37 EDIT — added connor-irizarry-discussing-design and kahneman-sibony-sunstein-noise.
  # The live24 correction ("Discussing Design is NOT an accepted source") is now itself
  # corrected: connor was admitted at DN-06 with a 0-error record, so the v0 rating's original
  # evidence base has arrived, three corpora later.
  # Justification: connor is an entire source on critique process and language — feedback split
  # into reaction/direction/critique (scs_disc_001, sk_disc_0002), the three required elements
  # of a critique (sk_disc_0006), the four session rules and their facilitation (scs_disc_004;
  # sk_disc_0034, sk_disc_0035, sk_disc_0036). noise contributes session-design mechanics from
  # judgement research: discussion can increase noise where mechanical aggregation reduces it
  # (sk_nse_0022), first-speaker cascades (sk_nse_0023), independence as the precondition of
  # useful second opinions (sk_nse_0024), and information sequencing to delay premature
  # impressions (sk_nse_0036).
  contributors: [catmull-creativity-inc-ch5, vignelli-canon-intangibles, light-science-magic-ch3, connor-irizarry-discussing-design, kahneman-sibony-sunstein-noise]
  gap: >
    The v0 map rated this STRONG on Discussing Design when it was not accepted; the live19/live24
    maps carried the correction. connor is now an accepted source with a complete record, so the
    domain holds its original evidence plus what replaced it — Catmull's Braintrust compact,
    Light Science & Magic's terminological discipline, and noise's session-design findings.
    Genuinely useful for evaluator design, which is why "peripheral to creative output"
    understates it.

- id: E08
  name: Judgement quality & bias
  section: E
  importance: useful
  # LIVE24 EDIT — added bijapurkar-we-are-like-that-only, pandey-pandeymonium,
  # parameswaran-nawabs-nudes-noodles. Justification: bijapurkar's scs_rbwl_001 is literally a
  # system of named reasoning errors (consistent-but-wrong data sk_rbwl_0050, proxy tracking the
  # wrong variable sk_rbwl_0130, sampling error in a repeated claim sk_rbwl_0140). pandey rejects
  # self-report pre-testing procedures in favour of behavioural observation (sk_ppm_0010, with
  # named cases sk_ppm_0011). parameswaran names instrument bias — the pre-test selects for what
  # it scores (sk_nnn_0040) — and depiction-read-as-prevalence (sk_nnn_0005).
  # LIVE37 EDIT — added kahneman-sibony-sunstein-noise, hopkins-my-life-in-advertising and
  # sontag-on-photography (ADMISSION MARKER, ruling c: critique_context — see E05; reception
  # claims only, never production doctrine).
  # Justification: noise is the judgement-variability source the v0 map wanted — the
  # bias/noise decomposition (sk_nse_0001; system scs_nse_001), noise measurable without a true
  # answer (sk_nse_0002), stable pattern noise as the largest component (sk_nse_0011), the
  # substitution of an easier question (sk_nse_0026), scale disagreement masquerading as case
  # disagreement (sk_nse_0031), and the noise audit as an instrument (sk_nse_0013). The memoir
  # adds practitioner-side bias: deciders' preferences unrepresentative (sk_mla_0005), the
  # maker's fatigue with a working campaign against the public's indifference (sk_mla_0028),
  # judgement never a substitute for traced results, stated against itself (sk_mla_0047).
  # sontag names reception bias an image evaluator must not share: the photograph received as a
  # piece of the world rather than a statement about it (sk_snt_0001) while standards are
  # imposed by selection anyway (sk_snt_0002), and aestheticisation working against the image's
  # intended effect (sk_snt_0013).
  contributors: [sutherland-alchemy-introduction, catmull-creativity-inc-ch5, bayles-orland-art-and-fear, binet-field-effectiveness-in-context-ch1, heath-made-to-stick-introduction, bijapurkar-we-are-like-that-only, pandey-pandeymonium, parameswaran-nawabs-nudes-noodles, kahneman-sibony-sunstein-noise, hopkins-my-life-in-advertising, sontag-on-photography]
  gap: >
    The v0 map rated this STRONG partly on Noise before it was accepted; the live19/live24 maps
    carried that correction, and DN-06 has now admitted Noise with a complete record, so the
    correction is spent for this one source (Thinking Fast and Slow and Superforecasting remain
    unaccepted). The domain is now the corpus's deepest evaluation asset: judgement-variability
    theory (noise), post-rationalisation (Sutherland), the creator losing perspective (Catmull),
    the curse of knowledge (Heath), Indian measurement errors (bijapurkar, pandey,
    parameswaran), practitioner-side bias (hopkins memoir) and reception bias (sontag,
    marker-bound). This knowledge is aimed at OUR evaluator design, not at the customer's
    creative.
  cross_stream_relevance: eval
