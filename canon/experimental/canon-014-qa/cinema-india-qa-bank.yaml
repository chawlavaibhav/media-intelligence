# CANON-014 grounded Q&A — Dwyer & Patel, "Cinema India: The Visual Culture of Hindi Film"
# GROUNDED, UNGRADED, UNCALIBRATED research Q&A. NOT a benchmark and NOT benchmark ground truth.
# Not Source Knowledge. Not admission evidence. No Audit Gate record covers this file.
#
# Two properties of this source shape every answer here and are stated once rather than repeated:
#   1. THE BOOK IS PERIODISED AND SAYS SO. It describes a style it dates as ending in the 1990s and
#      states that ending in its own Conclusion. An answer that presents any convention here as a
#      standing rule of Indian film imagery is wrong on the source's own terms.
#   2. THE EVIDENCE BASE IS WHAT SURVIVED. Hoardings — the form the source itself calls the most
#      distinctive of its medium — were destroyed after each film's run, so the study rests on
#      handbills, posters and booklets. Where a question touches a claim about the whole medium, the
#      answer states this.
#
# There is no application-question quota. Items are flagged requires_application only where the
# question puts a case NOT in the source on the table and asks what follows.

source_id: dwyer_patel_cinema_india
qa_items:

- qa_id: qa_dpci_0001
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 1 'Indian Cinema', section 'Attraction: the Star', printed p. 33"
  question: "This source describes darshan as a structure of looking. What is unusual about the direction of power in it, and how far does the author herself extend the claim?"
  answer: "The look runs both ways and the power sits with the image rather than with the viewer: the beholder TAKES darshan (darshan lena) and the object GIVES darshan (darshan dena), and the image 'authorizes the look (rather than merely being its object), thereby benefiting the beholder'. That inverts the usual direction of power in accounts of spectatorship, where the gaze belongs to the one who looks. Dwyer reports its cinematic use — the star appears in tableau scenes that invite darshan, which hierarchises the look and lends the star the associations of kings and gods, the traditional granters of darshan. Her own extension is narrow and she draws the line herself: she reports this as Prasad's and Vasudevan's argument, says Vasudevan's contention about stasis and tableaux is one she finds persuasive, and then bounds it — while it may operate within the film to produce the star, she cannot otherwise see any culturally specific ways in which the star is produced."
  answer_type: source_position
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: "the image 'authorizes the look (rather than merely being its object), thereby benefiting the beholder.'"
  confounders: "The common summary is that Indian audiences 'worship' film stars. The source's claim is narrower and formal — about how a look is structured and where it is authorised from — and Dwyer explicitly declines the broader version."

- qa_id: qa_dpci_0002
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 2 'Film Style', section 'The Image and Ways of Looking', printed pp. 43-46"
  question: "Geeta Kapur's 'iconicity' is reported here in a sense that is not the ordinary one. What is the difference, and why does it matter for reading an image?"
  answer: "Not the Peircean sense of resemblance — an icon as a sign that looks like its object — but a meaningful CONDENSATION of symbolic meanings into one static image, which need not be religious or mythological. Frontality, the companion term, likewise is not merely filming from a right-angle plane or direct address to camera: it also operates through the spectator's knowledge of narrative and mise-en-scene. It matters for reading an image because it relocates where the meaning is. On the resemblance reading you would ask what the image depicts; on this reading you ask what has been compressed into it and whether the viewer holds the code that unpacks it. Dwyer adds that frontality may be seen as a freezing of space, and sometimes time, into a tableau which positions characters and objects in relation to one another and gives the spectator 'the opportunity to see meaning represented, emotions and moral states rendered in clear visible signs'."
  answer_type: concept_understanding
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: "'the opportunity to see meaning represented, emotions and moral states rendered in clear visible signs.'"
  confounders: "Reading 'iconic' as 'famous' or as 'resembling' both miss it. The term is doing work about compression, not about fame or likeness."

- qa_id: qa_dpci_0003
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 1 'Melodrama and Realism', printed pp. 28-30; consequence for settings in Ch. 2, printed pp. 51-52"
  question: "What does melodramatic exteriority claim about where a character's interior state is located, and what does that make a setting?"
  answer: "That there is no reserve of unexpressed interiority to be inferred: melodrama 'foregrounds language, as it makes all feelings exterior', with characters verbalising their feelings, and it works the same way on the image, using close-ups to increase the effect of emotional depth and heightening the display of feeling through storms, remote places and other symbolic representations of a character's interior state. The consequence Dwyer draws for setting is direct: a setting becomes 'a form of making the characters' state of mind external, following the melodramatic style of exteriority' — that is, part of the emotional statement rather than a place the action happens to occur in. She reports Yash Chopra's own name for the resulting look, 'glamorous realism', a style in which reality is glossed over to make it more attractive."
  answer_type: mechanism
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "melodrama 'foregrounds language, as it makes all feelings exterior'"
  confounders: "This is not the claim that the films are unrealistic. It is a claim about where feeling is put, which is what makes an unrealistic setting legible rather than a mistake."

- qa_id: qa_dpci_0004
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 2 'Film Style', section 'Locations', printed pp. 58-60; continuity consequence at p. 55"
  question: "The source says audiences are not disturbed by a cut from Switzerland to India inside one sequence. What is the explanation offered, and what is the explanation NOT?"
  answer: "The explanation is functional: the romantic location — Kashmir, and by extension Switzerland, Scotland and other mountainous areas, the log cabin, parks and gardens in bloom, waterfalls, the tropical beach — is there to constitute 'some sort of privacy for the romantic couple, a private space in the public domain, where they are away from the surveillance of the family that prevents, encourages and controls romance, love and marriage'. Because the setting's job is to supply that privacy, any setting that supplies it will serve, and the jumps 'do not seem to disturb the audience at all since the purpose of the setting is to create a structure of feelings and looks, not necessarily to be realistic'. What it is NOT is an argument that the audience fails to notice, or that continuity does not matter in this cinema: the claim is that the setting is not carrying geography, so a change of geography breaks nothing it was carrying."
  answer_type: mechanism
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'a private space in the public domain, where they are away from the surveillance of the family'"
  confounders: "'Audiences don't mind' is the weak version and invites the reading that anything goes. The source's version specifies what the setting IS carrying, which is what predicts where a jump would in fact break something."

- qa_id: qa_dpci_0005
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 1 'Indian Cinema', sections 'A Cinema of Attractions?' and 'Attraction: Song and Dance', printed pp. 29-38"
  question: "Enumerate what the song sequence is described as licensed to suspend, and say what that implies about reading a film's narrative from its songs."
  answer: "Three things, and the source names each. Real time: the heroine may change costume repeatedly within one sequence. Location: the sequence may move from India to Switzerland without any reference to moving in space. Narrative consequence: love 'may be expressed in the song but not necessarily acknowledged in the narrative'. Dwyer frames this via Vasudevan's argument that the relationship between narrative, performance sequence and action spectacle is loosely structured in the fashion of a 'cinema of attractions' after Gunning and Gaudreault, and adds that eroticism is largely contained within the song, along with other breaks in continuity including a whole different range of gesture and movement. The implication for reading is direct: what a song shows cannot be assumed to have happened in the story. A declaration made in a song may leave the narrative exactly where it was."
  answer_type: source_position
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "love 'may be expressed in the song but not necessarily acknowledged in the narrative'"
  confounders: "Treating songs as narrative summary is the error this passage rules out; it is also the error a text-only synopsis of such a film would make."

- qa_id: qa_dpci_0006
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 2 'Film Style', section 'Clothing', printed pp. 84-98"
  question: "This source denies that film clothing reflects real clothing while also insisting the audience brings a real-world grammar to it. How do both hold at once?"
  answer: "They hold at different levels. The denial is about correspondence: 'the relationship between women's clothes in movies and in real life is not one of reflection, but the codes of cinema require clothing to fill particular semiotic functions'. The insistence is about legibility: the audience brings a widely understood grammar of wearing the sari, with occasions requiring different saris by season, time of day and degree of formality, plus a colour code — red, green and yellow for festive occasions, white or pale for widows, black largely a Western fashion. The cinematic code is built ON that grammar without copying it. So the heroine almost invariably wore a sari as an emblem of chastity in contrast with the vamp, the unmarried heroine wears Western clothes before marriage and changes into salwar-khamees or a sari after it, and mothers and mother-figures always wear a sari. Real dress supplies the vocabulary; the films use it to mark moral and narrative position, not to record what people wore."
  answer_type: concept_understanding
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: "'the relationship between women's clothes in movies and in real life is not one of reflection, but the codes of cinema require clothing to fill particular semiotic functions'"
  confounders: "Both halves are routinely dropped. Reading film dress as documentary evidence of period dress ignores the first; reading it as arbitrary costume design ignores the second."

- qa_id: qa_dpci_0007
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 1 'Indian Cinema', printed pp. 29 and 32-33"
  question: "What constraint does personification place on an image, and why is that a constraint on the picture rather than on the performance?"
  answer: "Personification is the form of acting in which the actor's persona retains significant similarities across performances, as against impersonation, in which the actor transforms body and voice — Barry King's distinction, which Dwyer reports and says is found most often in Hindi cinema. The constraint she draws is stated of the image, not of the acting: personification 'creates and maintains the star's text, RESTRICTING THE WAY IN WHICH AN IMAGE CAN BE PRESENTED', and melodrama reinforces this because 'the star must appear as a star, not as a character playing a role'. It is a constraint on the picture because the persona is what the audience is buying and what the next film inherits: an image that submerges the star in the character damages an asset that exists across films, whatever it does for this one."
  answer_type: mechanism
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: "personification 'creates and maintains the star's text, restricting the way in which an image can be presented'"
  confounders: "This is not a claim that the acting is poor or unvaried. It is a claim about what the image is obliged to preserve."

- qa_id: qa_dpci_0008
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 4 'Advertising and the Communication of Meaning', opening of 'The Star Image', printed p. 183"
  question: "Patel's account of why a poster opens with a face has two stages. Separate them, and say which one survives outside the culture."
  answer: "Stage one is pre-cultural and stage two is not, and she separates them explicitly. First, an image of a human face is 'instantly engaging because it is familiar to us all': of any mix of images the face is the one most likely to draw the glance, and this works WITHOUT recognition of the person. Second, and only within a specific cultural environment, the portrait is recognisable as a particular star, which arouses expectations built up over that star's career. Only the first survives outside the culture, and she states the boundary in the same breath — 'an Indian film star will be unknown to the wider Western audience where his or her films are not so popular and the poster will not evoke the same response'. The practical consequence is that a face still buys the glance anywhere; what the glance then delivers is entirely dependent on the viewer holding the star's history."
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: "'an Indian film star will be unknown to the wider Western audience where his or her films are not so popular and the poster will not evoke the same response.'"
  confounders: "Collapsing the two stages produces the false generalisation that 'putting a face on it works' — which is true only of the attention effect, not of anything the face is supposed to mean."

- qa_id: qa_dpci_0009
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 4, section 'The Star Image', printed pp. 183-192"
  question: "Whose portrait is a star portrait a portrait of, on this account, and what does the artist work from?"
  answer: "Not the person's. Star identity is 'cumulatively constructed by the star, the artist and the public', so a portrait carries 'a concurrence of self representation, artistic interpretation, and viewer expectation'. The artist's aim is therefore not the sitter's true identity, as in conventional portraiture, but 'the mask' — the star's constructed identity. What the artist works from, concretely, is a small set of fixed recognition features: Patel's survey of the posters finds certain facial characteristics becoming the defining ones that trigger recognition, and for Bachchan she names them — the heavy-hooded eyes, usually looking directly at the viewer or into the distance, and the full lips, enhanced to impart a brooding air. The visual pass on this copy confirmed those features are present as described in the Deewaar posters she cites."
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: "the aim is 'the \"mask\" or the star's constructed identity'"
  confounders: "It is easy to hear 'mask' as deception. The claim is about authorship — three parties build the identity — not about falsity."

- qa_id: qa_dpci_0010
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 3, printed p. 171; Ch. 4, printed pp. 187-192"
  question: "Describe overpainting as this source documents it: the technique, who introduced it, what it was for, and where it came from."
  answer: "The technique is applying oil or gouache over a photographic still, often with a knife in thick textured strokes, and it is documented as the defining technique of Indian film poster art in the 1970s and '80s. Its principal practitioner is named — Diwakar Karkare, trained at the Bombay School of Art, who introduced it on Daag in 1973. Its purpose is stated: it 'provided a means for artists to place their own interpretation over the photographic image, primarily allowing them to express and emphasize emotion'. Its lineage is traced to nineteenth-century Indian painted photography, where studios employed up to six artists to paint a single photograph, and to the one surviving branch of that practice, memorial photographs of the deceased, which produce 'hyper-reality, a solidification of certain features and an intensification of the gaze through the sharp reworking of the eyes'. The knife-laid impasto over photographic underlay was confirmed by direct inspection of the plates in this pass."
  answer_type: factual_recall
  difficulty: easy
  knowledge_type: production
  requires_application: false
  support: "it 'provided a means for artists to place their own interpretation over the photographic image, primarily allowing them to express and emphasize emotion.'"
  confounders: "Overpainting is not retouching. The point is not to correct the photograph but to add an interpretation the photograph cannot supply."

- qa_id: qa_dpci_0011
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 4, sections 'Character Types' and 'Female Character Types', printed pp. 194-204"
  question: "How does a poster carrying three portraits and no text convey a plot, on this account?"
  answer: "Through a compression code the viewer already holds. Indian film is understood through the familiarity of its characters, depicted as social types defined by their differences from each other — good against bad, rich against poor, weak against strong, traditional against modern — yielding recurring roles: the long-suffering mother, the wife, the vamp, the good brother, the bad brother, the villain. Because the same actor is repeatedly cast in the same type, the public is familiar with both actor and type and transfers meaning between them, so posters 'use the viewer's familiarity with character types as a code with which to convey a greater sense of the theme of the film'. Patel works one through: in a Deewaar poster Bachchan's persona is recognised, the older woman reads as the long-suffering mother, her presence implies a filial relation between the two male portraits, and the theme of brothers divided is delivered without a word of text. THE CODE IS THE VIEWER'S, NOT THE POSTER'S — a viewer without it sees three faces."
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: "posters 'use the viewer's familiarity with character types as a code with which to convey a greater sense of the theme of the film.'"
  confounders: "The compression looks like an economical design decision and is actually a dependency: it works only where the casting convention that built the types has been running long enough for the audience to hold them."

- qa_id: qa_dpci_0012
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 4, section 'The Cultural Construction of Meaning', printed pp. 193-194"
  question: "What contrast does the source draw between Indian and contemporary Western posters, and what reason does it give for the Indian side of it?"
  answer: "Western posters present a dramatic enigma — provocative images and text giving incomplete or paradoxical information — which the public must see the film to resolve, and they are supported substantially by text, including review quotations that function as 'the media seal of approval' plus studio, producer and director credits signalling the film's status. Indian posters 'rarely use text'. The reason given is distribution: with the scale of national and international distribution the Indian industry enjoys, 'text is seen as a cultural barrier' — text picks a language, and picking a language cuts the audience. From the 1980s it has been more common for only the title and the names of the producer, director and music director to appear, printed solely in English, because to the public those three figures are themselves a marker of the style, content and quality of the film."
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: "'text is seen as a cultural barrier'"
  confounders: "The absence of text is not an aesthetic preference in this account; it is a response to a multilingual distribution constraint, and the three names that DO appear are doing the work the review quotations do elsewhere."

- qa_id: qa_dpci_0013
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 3, section 'The Studio System: Image and Memory', printed pp. 149-153 and 164-166"
  question: "The Mehboob Studios re-release redesigns are described as solving a different problem from an original release poster. What is the different problem, and what changed in the designs as a result?"
  answer: "The problem is that the audience already knows the film, so publicity cannot be about informing them and becomes about retrieval: 'the activation of memory was a key factor in the redesign', and because the public was already familiar with these films 'the primary function of the new publicity was to create an image that would most effectively trigger people's memories'. What changed is that the new designs highlighted whichever scenes, images and stars had OVER TIME become the key signifiers of each film, not what the film was originally sold on. Patel gives three: Anokhi Ada reduced to the three central characters of its love-triangle theme; Aan given a sword fight that did not appear on the original poster at all; Mother India reduced to the single image of Radha pulling the plough, seen from a low viewpoint. The general rule she draws is that the redesign targets the film's remembered image rather than its original pitch."
  answer_type: mechanism
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: "'the activation of memory was a key factor in the redesign'"
  confounders: "The Aan case is the sharp one: a scene that was not on the original poster becomes the poster, because what the audience retained diverged from what the film was first sold on."

- qa_id: qa_dpci_0014
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 3 'The Art of Advertising', printed pp. 101-182; thesis stated at p. 101"
  question: "What is chapter 3's organising claim about how film-advertising style changed, and why does the Art Deco phase matter to that claim?"
  answer: "That Indian film advertising did not evolve toward a single style but moved through distinct phases, each borrowing 'the aesthetic vocabulary of the period'. The sequence given: text-only newspaper notices and handbills from 1896; the Ravi Varma aesthetic, realist oil technique on Hindu mythological subject matter, carried into posters via the Varma press's oleographs; the Bombay School of Art style, a delicate realism tied to the Ajanta revival, used when a studio wanted to signal a film was special; Art Deco from the 1930s as a universal symbol of modernity; nationalist imagery around Independence, often using the map of India; overpainted montage in the 1970s-80s; computer-aided design from the 1990s. Art Deco matters because of how it ended: it 'did not survive beyond the end of the 1940s' in India because it came to be seen as Western cultural imperialism. That is a style displaced by a political meaning attaching to it rather than by a better style, which is the strongest evidence for the chapter's claim that these are period vocabularies rather than steps toward a solution."
  answer_type: concept_understanding
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: "each phase borrows 'the aesthetic vocabulary of the period'; Art Deco 'did not survive beyond the end of the 1940s'"
  confounders: "Read as a progression toward better design, the sequence supports a 'this is how you make a film poster' conclusion. Read as the source states it, it supports the opposite: no phase here is the answer."

- qa_id: qa_dpci_0015
  source_id: dwyer_patel_cinema_india
  source_locator: "Introduction, section 'Cinema India', printed p. 11"
  question: "The source names a form it calls the most distinctive of its medium and then does not study it. Which form, why not, and what does that do to every claim in the book about the medium as a whole?"
  answer: "Hoardings. Patel identifies them in the Introduction as 'the most distinct feature of film advertising', with their large-scale vibrant images and bright colours, and also as the most ephemeral, destroyed once a film finishes its run: 'since there is little surviving evidence of the type of imagery depicted on early hoardings, this study is based primarily upon handbills, posters and booklets, which, despite their fragility, have survived'. WHAT THAT DOES IS MAKE THE EVIDENCE BASE A SURVIVAL SAMPLE, AND NOT A RANDOM ONE: the form that survived is the small, printed, collectable one, and the form that did not is the large, painted, public one. So any statement here about what Indian film advertising looked like is a statement about what its durable printed forms looked like. The source states the gap plainly, which is why it is a bound on the evidence rather than a hidden defect — and it is the medium's gap, not a digitisation loss, since a reader of the 2002 print edition was in exactly the same position."
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: "'since there is little surviving evidence of the type of imagery depicted on early hoardings, this study is based primarily upon handbills, posters and booklets'"
  confounders: "One hoarding IS reproduced (illus. 105, Balkrishna Arts, 2000) and it is a late one, which can create the impression the form is covered."

- qa_id: qa_dpci_0016
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 3, section 'New Technology and the Cinematic Image', printed pp. 175-181"
  question: "What changed in the 1990s in who makes Indian film posters, and how does the source handle the disagreement about whether the change was a loss?"
  answer: "From the early 1990s photographic stills fed into a computer could be manipulated on screen, 'allowing for the smooth superimposition, juxtaposition, reduction, enlargement and colour contrasting of images and text with relative ease', and the overpainted montage of the previous two decades gave way to images 'defined by simplicity and elegance'. The personnel consequence is stated plainly: 'the role of the traditional artist has been displaced by the computer specialist', and she names the firms — H.R. Enterprises, run by two publicity designers who are not trained artists but have extensive computer knowledge, and Yash Raj Films' in-house Design Cell under Fayyaz Badruddin, also a computer specialist. The disagreement is handled by RECORDING BOTH SIDES AS PRACTITIONER VIEWS rather than adjudicating: Yash Chopra prefers painted work, others prefer the new. Nothing in the source measures which performed better, and the record does not supply a verdict the source does not give."
  answer_type: source_position
  difficulty: medium
  knowledge_type: production
  requires_application: false
  support: "'the role of the traditional artist has been displaced by the computer specialist'"
  confounders: "Practitioner preference on either side is testimony about taste and craft, not evidence about effectiveness, and no effectiveness evidence appears anywhere in this book."

- qa_id: qa_dpci_0017
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 3, printed pp. 179-180"
  question: "Reconstruct the publicity timeline the source documents for Mohabbatein, and say what kind of evidence one dated campaign is."
  answer: "Working back from release: stills are taken from the first day of filming; poster work begins twelve weeks before release and the design must be with the printers eight weeks before; 'soft' television publicity also starts twelve weeks out, with short trailers ten times a day across channels; the music is released two weeks after that; four weeks before release distributors receive lobby cards, booklets and one-sheet posters free of charge while paying for the larger sizes; two weeks before release the artwork must be displayed in cinemas and aggressive television advertising starts, at up to six trailers a day. Twelve posters were produced: eight one-sheet designs at a print run of 250,000, one four-sheet at 15,000, three six-sheet at 30,000. WHAT KIND OF EVIDENCE IT IS: one documented instance, from one studio (Yash Raj Films), for one release in 2000, recorded in detail. It establishes that this process existed and what its intervals and volumes were. It establishes nothing about typicality — no other campaign is documented at this granularity — and nothing about outcome, since no result of any kind is reported."
  answer_type: factual_recall
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: "Ch. 3, printed pp. 179-180, quoted intervals and print runs."
  confounders: "The specificity of the numbers invites their use as norms. A single documented case is not a norm, and the source does not offer it as one."

- qa_id: qa_dpci_0018
  source_id: dwyer_patel_cinema_india
  source_locator: "Conclusion, printed pp. 215-218"
  question: "This book ends by dating its own subject. What does it say, what reasons does it give, and what does that oblige a reader to do with the rest of the book?"
  answer: "The authors state that the 'filmi' style which 'defined the visual culture of the Hindi film up to the 1990s (and which has been the focus of this book) is a thing of the past and is considered to be the very antithesis of the new \"look\"'. Three reasons are given: a younger generation of film-makers 'raised on Hollywood but firmly grounded in Bollywood'; a new middle-class consumerist lifestyle; and the growing importance of the diasporic market, where returns per ticket are far higher because of the exchange rate. They also record an irony — as filmi style is discarded by the industry, it is the means by which the industry is finally gaining Western recognition. WHAT IT OBLIGES: every convention in the book must be read as dated, on the authors' own instruction. The costume grammar, the poster conventions, the character types and the location logic are described as the practice of a period that the authors say had ended by their own publication in 2002 — a quarter-century before this extraction. Any claim that these ARE the conventions of Indian film imagery contradicts the source it cites."
  answer_type: source_position
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "the filmi style 'is a thing of the past and is considered to be the very antithesis of the new \"look\"'"
  confounders: "This is the single most-ignored passage in the book, and ignoring it turns a historical study into a style guide."

- qa_id: qa_dpci_0019
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 4, section 'The Star Image', printed pp. 183-192; Introduction, printed p. 11"
  question: "A team is building an image-generation system and proposes a 'star portrait' control that reproduces a named performer's recognition features. Using only what this source establishes, what can be justified and what cannot?"
  answer: "Justified: that recognition of a performer runs on a SMALL SET OF STABLE FEATURES rather than on overall likeness, and that those features are identifiable by survey of the existing images — the source does exactly that survey and names Bachchan's heavy-hooded eyes and enhanced full lips as the recognition carriers. Also justified: that the target is the constructed identity rather than the person, since identity here is 'cumulatively constructed by the star, the artist and the public'. NOT justified, and the source blocks each directly: that any particular feature set transfers to a different performer, since the features are found per star by inspection and no general rule is offered; that recognition works outside the culture that built it, since Patel states an Indian star 'will be unknown to the wider Western audience'; and that reproducing the features produces the response, since the response depends on expectations built up over a career, which no image supplies. A further constraint comes from outside this passage: reproducing a living performer's likeness is a rights and consent question this source says nothing whatever about, and its silence is not permission."
  answer_type: application
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: "identity is 'cumulatively constructed by the star, the artist and the public'"
  confounders: "The temptation is to read the Bachchan feature list as a recipe. It is a finding about one star produced by looking at his posters, and the method — survey the corpus — is the transferable part, not the features."

- qa_id: qa_dpci_0020
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 3, section 'The Studio System: Image and Memory', printed pp. 149-153; Ch. 4, printed pp. 194-204"
  question: "A studio is designing the poster for a sequel to a fifteen-year-old film that has since acquired a following the original release never had. What does this source's re-release material say to do, what does it not settle, and what would you have to know that the source cannot tell you?"
  answer: "What it says to do: design for retrieval, not for information. The re-release finding is that where the audience already knows the film, publicity's job is 'to create an image that would most effectively trigger people's memories', and the designs accordingly targeted whichever scenes and images had OVER TIME become the key signifiers — which is why Aan's poster acquired a sword fight that was not on the original. So the operative question is not what the original was sold on but what the audience now retains, and those can differ. What it does not settle: a sequel is not a re-release. The re-release cases carry no new film to sell, whereas a sequel must both retrieve the old and introduce the new, and the source documents no case of that mixture. Nor does it establish any effect — no attendance, sales or recognition figure is reported for any redesign, so the finding is about intent and craft, not outcome. What you would have to know independently: WHAT THE AUDIENCE ACTUALLY RETAINS, which the source cannot supply for a film it never studied and which cannot be inferred from the original campaign. Patel's designers evidently knew it for their titles; how they knew it is not documented, and that gap is the whole problem in the sequel case."
  answer_type: application
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: "'the primary function of the new publicity was to create an image that would most effectively trigger people's memories'"
  confounders: "It is easy to take the Mother India reduction — the whole film to Radha pulling the plough — as a rule that less is more. The rule is that the retained image wins, and finding out what is retained is the part the source does not teach."

- qa_id: qa_dpci_0021
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 2, section 'The Image and Ways of Looking', printed pp. 43-46; Ch. 1, printed p. 33"
  question: "Another source in this corpus, Kajri Jain on calendar art, also uses frontality and iconicity. Why are the two treated as separate source-local terms here rather than as one shared concept?"
  answer: "Because the two authors do not use them identically, and merging them would assert an equivalence neither states. In this source frontality and iconicity are reported as GEETA KAPUR'S FORMAL ART-HISTORICAL CATEGORIES, applied to cinema — frontality as a freezing of space into a tableau, iconicity as symbolic condensation into a static image — with Dwyer explicitly attributing them and explicitly bounding how far she will take the related darshan argument. In Jain they are a FUNCTIONAL REQUIREMENT OF RITUAL USE with a stated devotional mechanism, attested by interviews with practitioners who say a deity must look out at the viewer. Same words, different claims: one is a description of pictorial form, the other an account of what an image must do to work. There is a real lineage relation between the two books — Dwyer and Patel cite Jain's 1998 article, five years before her book — which is recorded pairwise, but a citation is not a shared concept. Each record keeps the term with its own author's gloss."
  answer_type: concept_understanding
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: "Ch. 2 n. 9 cites 'Kajri Jain, \"Gods in the Bazaar\", South Asia, XXI/1 (1998)'"
  confounders: "Two authors using the same word about overlapping material is the most common way a false cross-source concept gets built, and it is not evidence of agreement."

- qa_id: qa_dpci_0022
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 4, section 'The Cultural Construction of Meaning', printed pp. 193-194"
  question: "A distributor must design one key art for a film releasing simultaneously in six Indian language markets and in three diaspora territories. What does this source's account of text actually argue, and where does the argument stop being about India in 2002?"
  answer: "The argument is not that posters look better without text; it is that TEXT PICKS A LANGUAGE AND PICKING A LANGUAGE CUTS THE AUDIENCE. With the scale of national and international distribution the Indian industry enjoys, 'text is seen as a cultural barrier', which is why Indian posters 'rarely use text' while contemporary Western posters carry substantial copy including review quotations acting as 'the media seal of approval'. So the reasoning transfers exactly to the case described: one artwork across nine markets is precisely the condition the convention was a response to, and every word added narrows it. What the source also supplies is what replaced the text — from the 1980s only the title and the names of the producer, director and music director, printed solely in English, because to the public those three names themselves signal the style, content and quality of the film. That second half is where the transfer stops. It depends on a star-and-credit system in which those three names carry meaning to that public, which is a fact about Indian audiences in a particular period and not a general property of names. In a diaspora territory whose audience does not hold that system, removing the text removes the signal and does not replace it, and the source says nothing about what would. Nothing here is measured either: no comparison of a text-carrying and a text-free poster is reported anywhere in the book."
  answer_type: application
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: "'text is seen as a cultural barrier'"
  confounders: "Treating this as a minimalist design principle inverts it. The convention is a distribution constraint, and in a single-language market the constraint is absent."

- qa_id: qa_dpci_0023
  source_id: dwyer_patel_cinema_india
  source_locator: "Ch. 1, printed p. 33; Ch. 2, printed pp. 43-46"
  question: "A creative team proposes that a product be shown 'darshan-style' — held still, frontal, looking out at the viewer — to give it authority. Judge that proposal against what this source establishes."
  answer: "The proposal borrows a form and drops the thing that made the form work, and this source is unusually explicit about which is which. What darshan describes is not a pose but an AUTHORISATION STRUCTURE: the look runs both ways, the beholder takes darshan and the object gives it, and the image 'authorizes the look (rather than merely being its object), thereby benefiting the beholder'. That authority comes from the viewer's prior relation to the kinds of thing that grant darshan — kings and gods — which cinema borrows for the star, not from frontality itself. A product has no such prior relation, so frontal stillness would deliver the form with nothing behind it. Two further bounds come from the source itself. Dwyer explicitly limits her own agreement: she finds Vasudevan's stasis-and-tableau argument persuasive as an account of how the star is produced WITHIN a film and says she cannot otherwise see culturally specific ways in which the star is produced. And the whole account is stated for viewers who hold the code; the book's own Conclusion dates the filmi style it describes as already past by 2002. What CAN be taken is narrower and real: stillness and frontality make an exchange legible as an exchange rather than as narrative action, which is a compositional observation and does not require the devotional structure. Present that as the claim and it is supportable; present it as borrowed authority and the source contradicts you."
  answer_type: application
  difficulty: hard
  knowledge_type: cultural
  requires_application: true
  support: "the image 'authorizes the look (rather than merely being its object), thereby benefiting the beholder.'"
  confounders: "The proposal is attractive precisely because the visual form is easy to copy and the authorisation structure is invisible. Nothing in the source suggests the form carries the effect on its own."
