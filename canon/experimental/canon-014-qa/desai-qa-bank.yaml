# CANON-014 grounded Q&A — Desai, "Mother Pious Lady"
# GROUNDED, UNGRADED, UNCALIBRATED. Not a benchmark. Not Source Knowledge. Not admission evidence.
# Every answer states the source's own scope bound where the question touches a generalisation.
source_id: desai_mother_pious_lady
qa_items:

- qa_id: qa_dmpl_0001
  source_id: desai_mother_pious_lady
  source_locator: "Introduction"
  question: "How does this source bound its own scope, and why does that bound matter more here than in most sources?"
  answer: "It bounds itself four ways, explicitly and repeatedly: it examines urban middle-class India from INSIDE that class; it uses 'we' while stating that 'the diversity of India cannot be collapsed into a single undifferentiated \"we\"'; it declares 'in-built biases' from the author's own experience; and it declines both to prescribe and to judge, stating its purpose is 'to understand what is happening'. It matters more here than elsewhere because the book's most quotable material — the Imperfect Solution thesis, the reading of hierarchy, the essay on Indian traffic — is essayistic generalisation about 'the Indian mind' that reads as a claim about a population, and the Introduction is what forbids that reading."
  answer_type: source_position
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'I am acutely aware that there are many Indias…'; 'the book carries with it in-built biases'"
  confounders: "The rhetorical force of the later essays makes it easy to forget the Introduction's disclaimers."

- qa_id: qa_dmpl_0002
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'The Dhania Factor'"
  question: "Define *paisa vasool* as this source defines it, and say why 'value for money' is not an equivalent."
  answer: "The satisfaction of having extracted the full use-value of a purchase — 'extracting every drop of consumption liquid from each paisa' — realised through use over time, the longer the better, and often through uses unimagined at the time of buying. The source distinguishes it explicitly from miserliness. 'Value for money' is not an equivalent because it locates the judgement at the price, whereas the author's whole point is that the value is not settled at the transaction at all: consumption is the use, not the purchase, so worth is determined afterwards. That is also why an unexhausted residue of utility in an object is felt as a loss and makes discarding hard."
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'Consumption thus is not about the act of purchase, but instead about the use value of the object in question.'"
  confounders: "No measurement supports this anywhere; it is an essayist's account of a disposition he shares."

- qa_id: qa_dmpl_0003
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'The Dhania Factor'"
  question: "A researcher observes affluent Indian shoppers still demanding free coriander with vegetables and concludes they are price-sensitive. What does this source argue instead, and how confident is it?"
  answer: "That the demand has nothing to do with affordability. The author's claim is that it is made in affluent neighbourhoods and crowded flats alike, and that its function is to make the transaction feel complete — 'sneaking in additional value to make the transaction fulfilling' — so the free extra is a marker of closure whose monetary size is irrelevant. He attributes the disposition to an ingrained cultural memory of scarcity rather than to present need. His confidence is explicitly hedged on the causal attribution: he writes it 'has perhaps more to do with' scarcity memory. The load-bearing claim — invariance across income — is not hedged and is entirely unmeasured, which is notable because it is exactly the kind of claim a survey could test."
  answer_type: application
  difficulty: hard
  knowledge_type: cultural
  requires_application: true
  support: "'It has nothing to do with affordability; it is about sneaking in additional value to make the transaction fulfilling.'"
  confounders: "Scoped to urban middle-class India by the source's own Introduction; not a claim about Indian consumers as such."

- qa_id: qa_dmpl_0004
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'The Dhania Factor'"
  question: "The same household extracts value from every paisa and also spends ruinously on a wedding, sometimes into debt. Why does this source say that is not a contradiction?"
  answer: "Because two different return currencies operate inside one budget. On a wedding the return sought is social rather than economic — 'the return on money is not economic but social' — and a social return is not commensurable with the savings made elsewhere, so the two budgets do not compete and no inconsistency is felt. The economising disposition applies only to the first currency. The author makes the same distinction in the other direction for a masala film, which he calls a paisa vasool film, so it is a real distinction in his account rather than an excuse constructed for one awkward case."
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'Families deny themselves the most basic pleasures for years but will spend ruinously on weddings in the family, often ending up in debt.'"
  confounders: "'often ending up in debt' is asserted with no figure or source."

- qa_id: qa_dmpl_0005
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'Mother Pious Lady', the thirty-year study"
  question: "This book contains exactly one measurement. What did it find, and what is entirely missing from how it is reported?"
  answer: "A content analysis of matrimonial advertisements across thirty years, which the author says he was involved in. It found: appearance adjectives increased sharply, with a new premium on tall and slim; fairness as an articulated quality rose sharply; boys were evaluated on income and family, girls on appearance, qualifications and family; the boy's side used more words to state expectations; and — the most valuable finding — the proportion of advertisements mentioning caste origin REMAINED CONSTANT. Missing is every methodological particular: no sample size, no sampling frame, no publication list, no coding scheme, no date range, no inter-coder check, and not a single number. Every finding is directional only. 'A study I was involved in' also does not establish authorship, publication, or that it was ever written up."
  answer_type: source_position
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: "'In a study I was involved in a few years ago, we analysed matrimonial ads across thirty years…'"
  confounders: "The constant-caste result is the most trustworthy finding precisely because it is a NULL running against the book's own modernisation narrative, and nulls are least likely to be reported selectively."

- qa_id: qa_dmpl_0006
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'Mother Pious Lady'"
  question: "A team observes that the vocabulary of a long-running format has changed considerably over twenty years and concludes the practice has modernised. What does this source's measured finding say about that inference?"
  answer: "That the inference does not follow. Across thirty years of matrimonial advertisements the surface changed considerably — appearance descriptors multiplied, individuals expressed needs with more specificity, the chaperoned ten-minute meeting stretched to two or three meetings with chaperoning becoming optional — while the underlying model did not move at all. Advertisements are still placed by parents, the parties are still called 'boy' and 'girl' whatever their age, personality is still barely mentioned, and the transaction is still between stations in life rather than between individuals. Caste mention, on the study's evidence, did not decline. Surface features respond to changing expression while the model that determines what the convention is FOR can persist unchanged underneath."
  answer_type: application
  difficulty: hard
  knowledge_type: cultural
  requires_application: true
  support: "'the essential nature of the system has not changed… The underlying mental model is still that of marriage as a relationship between stations in life and not individuals.'"
  confounders: "The study's method is entirely unreported, so the finding's strength rests on the author's authority alone. The book predates the migration of Indian matrimonial matching to websites."

- qa_id: qa_dmpl_0007
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'Mother Pious Lady'"
  question: "Why does this source say a twenty-five-word matrimonial advertisement can carry so much, and what analogy does the AUTHOR draw?"
  answer: "Because writer and reader share a decoding convention, so the reader supplies the expansion: VB is very beautiful, BHP is birth horoscope and photograph, 'decent marriage' signals openness to dowry, 'uses contact lens' means thick glasses. The code has to be common property and cannot be invented per message; it also signifies by omission as much as by statement. The analogy is the author's own, not the extractor's: the format 'takes twenty-five words to abbreviate a person into marketability and like the thirty-second commercial, makes its user a master of compressing meaning'. He notes the shared convention, rather than the older middleman's personal guarantee, is what let the format survive."
  answer_type: mechanism
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'like the thirty-second commercial, makes its user a master of compressing meaning'"
  confounders: "The source describes a code and its effects and offers no account of how such a code gets established, which is what would be needed to use this as advice."

- qa_id: qa_dmpl_0008
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'Mother Pious Lady'"
  question: "What happens to a descriptor when every entry in a format claims it, what does this source observe as the two responses, and why must this not be merged with a censored word being replaced by a euphemism?"
  answer: "It stops discriminating and conveys nothing, because a descriptor carries information only by excluding something and universal adoption removes the exclusion. The two responses the source observes are escalation — 'in a world where everyone is fair and beautiful, we begin to see people being VV Fair or Really Beautiful' — and demand for evidence outside the claim, which is why 'Photograph (Returnable)' became de rigueur. It must not be merged with the euphemism case because the mechanisms run in opposite directions: here an unbanned descriptor LOSES force through universal adoption by many writers with no prohibition involved; there a permitted word ACQUIRES a banned meaning under an external prohibition, driven by one advertiser's sustained investment. They share only the surface feature that a word's meaning changed with use."
  answer_type: mechanism
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: "'in a world where everyone is fair and beautiful, we begin to see people being VV Fair or Really Beautiful'"
  confounders: "This is the clearest pair in CANON-014 that a keyword-similarity pass would wrongly merge; the caveat is recorded on both objects and in the lineage matrix as OBS-03."

- qa_id: qa_dmpl_0009
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'An Ode to the Scooter'"
  question: "This source says the scooter carried an aura of safety its engineering does not merit. What is the engineering point, what produced the perception, and how well supported is each?"
  answer: "The engineering point is that the scooter's smaller wheel size makes it LESS stable than the motorcycle it was felt to be safer than. The perception, he argues, came from the images surrounding it: the stepney, the space to squeeze in a whole family, the dickey for the household's sundries — an attribute term attaches to whatever most visibly stands for it, so 'safe' attached to a vehicle visibly enabling responsible family life, and the physical property the term names went unconsulted. Neither half is well supported: the stability claim is asserted with no engineering authority cited, and the perception is asserted from the author's memory of the object's standing with no measurement at all."
  answer_type: mechanism
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'an aura of safety… that its engineering does not quite merit. Its smaller wheelsize actually makes it a less stable vehicle'"
  confounders: "Both halves are asserted; the object is valuable as a shape of failure, not as an established fact about scooters."

- qa_id: qa_dmpl_0010
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'An Ode to the Scooter'"
  question: "What is this source's central reading of how the scooter signifies, and what is the limit on using it?"
  answer: "That it signifies by concealment and by refusal. It hides its machinery under a rounded shell where the motorcycle 'revels in displaying its muscular architecture', and it means what it means precisely by advertising its LACK of ambition — 'it wears its unprepossessing modesty on its sleeve, by eschewing any heroics'. So the decision to show or hide a mechanism is itself a carrier of meaning, and an object can signify by what it declines to claim. The limit is that this is cultural criticism of an existing object written in sustained metaphor, not design advice: nothing here licenses a rule about whether to expose or conceal a mechanism in any new work, and the surrounding figurative language must not be extracted as further claims."
  answer_type: source_position
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: "'the scooter hid the machine from view… the scooter covers up the beast within with rotund blandness'"
  confounders: "The gendered framing is the author's for one market at one time, not a general account of how objects gender themselves."

- qa_id: qa_dmpl_0011
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'Hierarchies Unlimited'"
  question: "What function does this source argue hierarchy serves, and what is the cost it names?"
  answer: "Simplification. Hierarchy collapses many incommensurable dimensions onto one linear ordering, which makes every comparison decidable and lets a person know their place without ambiguity — 'Science is better than commerce so why tax your mind about what to choose?' His instances are the Science/Commerce/Arts ordering in education, which he notes is justified neither by career prospects nor by difficulty, and the graded exemptions from airport frisking. The cost he names is that individual preference has no place in the ordering and so drops out of the decision entirely: 'we study what we deserve rather than what we want.'"
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'It standardizes the world on a single linear dimension and helps you know your place without any ambiguity.'"
  confounders: "Essayistic interpretation argued from selected institutional examples. It records what Desai argues, not an established account of Indian social structure — and he himself predicts the linear hierarchy will recede."

- qa_id: qa_dmpl_0012
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'Hierarchies Unlimited'"
  question: "This source says a status signal must be received to exist. What is the argument, and what is its exemplary case?"
  answer: "That status is a relation requiring the weaker party's awareness rather than a property held privately: the 'do you know who I am' question emphasises the KNOWING, because power that keeps nobody at a distance does no work — 'Power is real only when the weaker person is aware of his relative status.' The consequence is that signal design optimises for unavoidable reception rather than for accuracy or elegance. The exemplary case is the vehicle siren, which 'converts an abstract noun into an insistent compelling whining verb' — a device that turns standing into a signal others cannot avoid receiving."
  answer_type: mechanism
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'Power is real only when the weaker person is aware of his relative status.'"
  confounders: "Stated as a universal but argued entirely from Indian institutional examples; the extraction does not extend it beyond them. The siren reading is the essay's rhetorical high point — the transferable content is the reception requirement, not the metaphor."

- qa_id: qa_dmpl_0013
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'Indian Traffic as Metaphor'"
  question: "A brand plans to lead on safety in a market where no competitor does. What observation and what explanation does this source offer, and how much weight does each carry?"
  answer: "The observation is that in India at the time of writing, 'not a single brand of vehicle is sold on the basis of safety'. The explanation is that safety is a meaningful proposition only for a buyer who accepts a link between an action and its consequence, which he argues Indian traffic conditions do not train — a benefit claim requires the audience to hold the premise that makes the benefit meaningful. The two carry very different weight. The observation is a checkable claim about a category's advertising, though it is an absolute stated with no supporting survey and it is dated — the essays are late-2000s columns and this is exactly the kind of claim that changes. The explanation is the author's interpretation, offered without evidence and embedded in a sustained metaphorical essay whose metaphysics of time the extraction does not take."
  answer_type: application
  difficulty: hard
  knowledge_type: cultural
  requires_application: true
  support: "'not a single brand of vehicle is sold on the basis of safety. The idea of safety is relevant only for those who acknowledge the relationship between cause and effect…'"
  confounders: "It must never be used as a current market statement. The general shape — check whether the audience holds the enabling premise — is what survives."

- qa_id: qa_dmpl_0014
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'The Power of the Imperfect Solution'"
  question: "State the Imperfect Solution thesis, separate the part with general force from the part with none, and say why the separation matters."
  answer: "The thesis is that the Indian disposition to accept the almost-good-enough — usually deplored as *chalta hai* — encodes a defensible position about time: solutions are temporary equilibria, imperfection is a permanent condition conferred by time, and holding a solution perfect costs ever-increasing effort until it becomes unsustainable. The part with general force is the maintenance-cost mechanism: keeping any solution against a changing environment requires continuing effort that rises as the environment diverges from the one the solution was built for. The part with none is the cultural attribution — 'the Indian mind' versus 'Western analysis' — which is a pair of essayistic generalisations for which no evidence of any kind is offered. The separation matters because this is the object in the book most at risk of being universalised: it records that DESAI ARGUES this, and is not evidence that Indians or Westerners think in these ways."
  answer_type: source_position
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: "'keeping a solution perfect will take an ever increasing amount of effort that eventually becomes unsustainable'"
  confounders: "The author anticipates the charge of arguing for passivity and answers it rhetorically rather than with evidence."

- qa_id: qa_dmpl_0015
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'SRK – Brand Ambassador for the Market'"
  question: "What is this source's reading of Shah Rukh Khan, and why does the extraction refuse to turn it into a casting principle?"
  answer: "That he embodies rather than merely uses market forces: a figure demonstrating that fame, fortune, success and family can be had together and easily; whose Raj/Rahul characters made modernity desirable by presenting it as a distillation of tradition rather than a break from it; and who is consumed as himself playing a character rather than as an actor disappearing into one. The extraction refuses to turn it into a casting principle because it is film and cultural criticism throughout — every element is the author's interpretation of films and of a public persona, and no audience evidence of any kind is offered for what 'people seem to want'. Converting criticism into production advice is exactly the failure this record avoids. It is retained because it is the corpus's only material on how an Indian star persona is read culturally."
  answer_type: source_position
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'he plays himself, or more accurately, plays Shah Rukh Khan playing the character'"
  confounders: "The reading is compelling and entirely unevidenced; those two facts are independent."

- qa_id: qa_dmpl_0016
  source_id: desai_mother_pious_lady
  source_locator: "Introduction; whole book"
  question: "What is this source's stated method, and what check does it lack?"
  answer: "To read a culture from its small, unconsidered material acts and objects rather than from its stated beliefs, on the grounds that 'it is when we behave naturally and with reflex that we give away who we really are' — deliberate statement is edited for an audience and reflexive action is not. That is why the book's units are things: a pressure cooker, a scooter, a matrimonial column, a nightie, a thali. The check it lacks is any at all: an essayist selecting which small acts to interpret and what they mean has complete latitude, and the source proposes no way any particular reading could be shown wrong. It is also a research posture that cannot be executed by anything other than a person reading a culture they belong to."
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'The truth about things is often locked in the smallest actions it engenders.'"
  confounders: "The method's appeal and its unfalsifiability are the same property."

- qa_id: qa_dmpl_0017
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'The Dhania Factor'"
  question: "What licensed spending in the household this source describes, and what was treated as the enemy?"
  answer: "An occasion licensed spending; impulse was the enemy. He describes growing up in middle-class India as 'an elaborate exercise in learning to detach action from one's senses' — ice cream was not eaten because one felt like it but on occasions when celebrations had been planned, and new clothes were bought with ceremony at festivals. Festivals functioned as 'the safety valves in our otherwise restrained lives', supplying permission the individual's own appetite was not allowed to supply. The mechanism is that where budgets are tight and every deviation is felt as risk, the sense that prompts spending has to be disconnected from the act, and an external calendar then supplies the sanction."
  answer_type: mechanism
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: "'Festivals were the safety valves in our otherwise restrained lives; they gave us sanction to experience little atolls of freedom.'"
  confounders: "Wholly retrospective — an adult recalling a childhood household with no contemporaneous record — and the book's second section is explicitly about these constraints loosening."

- qa_id: qa_dmpl_0018
  source_id: desai_mother_pious_lady
  source_locator: "PROVENANCE; visual-evidence-ledger"
  question: "What has been done to this copy of the book, how much of it was found, and what is the risk that remains?"
  answer: "A redistributor has modified it. The publisher metadata is overwritten — dc:publisher reads GAPPAA.ORG instead of HarperCollins — and the string appears at 11 positions in the text. Ten stand alone in front matter, the dedication, the contents and section openers, where they are obviously not authorial. One is a complete non-authorial sentence sitting INSIDE an authorial paragraph of the Introduction, with no distinguishing markup, reading as prose: 'My effort in this book has been to examine Middle India from within. This book has been downloaded from gappaa dot org. I have grown up in a middle class family…'. All 11 were located by string search and excluded. The residual risk is not those: it is that a redistributor demonstrably willing to insert a sentence into an author's prose may have made other changes carrying no marker, undetectable in this copy. That risk is silent and unbounded, which is why no object in the record rests on a single verbatim sentence."
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: "11 injection sites located mechanically; 1 in-body interpolation."
  confounders: "The found injections are the reassuring part. The unfound ones are the reason for the extraction discipline."

- qa_id: qa_dmpl_0019
  source_id: desai_mother_pious_lady
  source_locator: "visual-evidence-ledger"
  question: "A reviewer asks why this source's visual pass has a null result and whether that is a gap. What is the answer?"
  answer: "It is a result, not a gap. Thirty of the thirty-three images are 700–1,840-byte decorative ornaments recurring at essay openings, and the other three are the cover and two front-matter marks; both non-ornament images were opened. The book argues about objects — a scooter, a thali, a matrimonial column — entirely in prose and never reproduces or points at an image of any of them, and no sentence in the book directs the reader to look at anything. So a text-only representation loses nothing of the argument. The Audit Gate vocabulary separates exactly this case: inspection_state is inspected_figure_level (we looked) and visual_argument_role is no_visual_argument (there was nothing to see), which is a different state from not having looked."
  answer_type: source_position
  difficulty: medium
  knowledge_type: cultural
  requires_application: true
  support: "33 images enumerated and measured; 2 non-cover images opened; 0 figures."
  confounders: "The two-axis vocabulary exists because a single 'visual completeness' field cannot distinguish these, which is what CANON-003 got wrong."

- qa_id: qa_dmpl_0020
  source_id: desai_mother_pious_lady
  source_locator: "Essay 'Mother Pious Lady'"
  question: "The book takes its title from a matrimonial phrase. What does the phrase mean, and why is it a good title for a book about reading culture from small things?"
  answer: "The author glosses 'Mother pious lady' as connoting a mother-in-law 'concerned more with burning incense sticks than daughters-in-law' — that is, a signal to a prospective bride's family that she will not be interfered with. It is a good title for the book's project because it is three words that say a great deal to a reader who holds the convention and almost nothing to anyone else, which is precisely the claim the book makes about everyday material: that meaning sits in small, coded, unconsidered things, and that reading them requires belonging to the culture that shares the code."
  answer_type: concept_understanding
  difficulty: easy
  knowledge_type: cultural
  requires_application: false
  support: "'Even more mystifying is \"Mother pious lady\", a description that is perhaps meant to connote a mother-in-law concerned more with burning incense sticks than daughters-in-law.'"
  confounders: "The author himself marks the gloss as tentative — 'perhaps meant to connote'."

- qa_id: qa_dmpl_0021
  source_id: desai_mother_pious_lady
  source_locator: "ontology-mappings; whole book"
  question: "A retrieval system returns the sentence 'at its heart, democracy is an impostor in India' from this source as a claim about Indian politics. What is wrong, and what does the record propose as the fix?"
  answer: "It is a rhetorical formulation inside an essay, and the extraction deliberately does NOT record it as a claim — the object on hierarchy carries a caveat saying so explicitly. Consuming it as a claim about Indian politics is the failure the ontology names as culturally_bounded_claim_universalised: taking an observation the source scopes to one class, one country and one period as a claim about a population, which the source's own Introduction forbids. The proposed remedy is to carry the source's own scope statement with anything retrieved from it, so the class, country and period bounds travel with the claim. It is executable by a retrieval process only if that process is built to carry a scope field; otherwise it needs a human curating the retrieved set, and it is not executable by a model reading the object alone."
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: cultural
  requires_application: true
  support: "Caveat on sk_dmpl_0040; remedy t_dmpl_0051 with its executable_by."
  confounders: "The sentence is genuinely in the book. The defect is in what a consumer does with it, which is why the remedy acts on retrieval rather than on the source."
