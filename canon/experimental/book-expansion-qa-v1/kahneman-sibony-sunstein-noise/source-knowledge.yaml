- sk_id: sk_nse_0005
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "the error equations"
    - "Overall Error (MSE) = Bias 2 + Noise 2"
    - "mean squared error"
  concept_label: error_equation
  label_origin: source_verbatim
  claim: >-
    Under mean squared error — the standard scoring rule for accuracy, and the only one for which
    the arithmetic mean is the best estimate — overall error decomposes into the square of bias plus
    the square of noise. Bias and noise are independent of each other and enter with equal weight,
    so reducing either by the same amount reduces overall error by the same amount. The source is
    explicit that this equation does NOT apply to evaluative judgements, where there is no true
    value, error costs are rarely symmetrical, and there is no reason to think they are proportional
    to the square.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      Squaring gives large errors far more weight than small ones, and MSE is minimised by the mean —
      which the source presents as the reason to accept it, since the intuition that the mean is the
      best estimate is one most readers already hold. The decomposition then follows algebraically,
      with the Pythagorean form as the visualisation.
  scope:
    domain_discussed_by_source: [predictive_judgment, forecasting, measurement_of_error]
    conditions: >-
      "The rule is appropriate for purely predictive judgments, including forecasts and estimates,
      all of which aim to approach a true value." Not evaluative judgements; not decisions whose
      error costs are asymmetric.
  caveats:
    - text: >-
        "The error equation does not apply to evaluative judgments" — the source's own stated
        boundary, with worked counter-cases: elevator load limits, when to leave for a train,
        insurance pricing.
      origin: source_stated
    - text: >-
        The source concedes that MSE conflicts with common intuitions about scoring — people care
        about near-misses and are insensitive to the difference between two large errors, "almost
        the mirror image of what they should be".
      origin: source_stated
    - text: >-
        The worked illustration is a constructed, "implausibly smooth" example in which bias and
        noise are set equal for exposition. It is not a measurement.
      origin: extractor_observed
    - text: >-
        Figures 3-8 carry the quantitative content of this argument and were not inspected; the
        prose states the numbers used, but the visual comparison of the two panels is not available
        to this extraction.
      origin: extractor_observed
  source_stated_problems:
    - "how, and how much, bias and noise contribute to error"
  source_stated_remedies:
    - "the measurement and reduction of noise should have the same high priority as the measurement and reduction of bias"
    - "you should not mix your values and your facts"
  examples:
    positive:
      - {description: "GoodSell's forecasters: halving bias and halving noise produce identical reductions in MSE", figure_ref: null}
    counter:
      - {description: "elevator maximum load — underestimation costly, overestimation catastrophic; squared error irrelevant", figure_ref: null}
      - {description: "when to leave for a train — one minute late and five minutes late cost the same", figure_ref: null}
  intra_source_relations:
    - {relation: generalises, target: sk_nse_0006, note: "the practical consequence drawn from the equation"}
    - {relation: demonstrated_together_with, target: sk_nse_0010, note: "the same sum-of-squares form is reused to decompose noise itself"}
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: figure_not_inspected
  provenance:
