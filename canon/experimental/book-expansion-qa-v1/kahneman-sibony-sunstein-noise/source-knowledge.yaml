- sk_id: sk_nse_0012
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "level noise is the only form of noise that organizations can (sometimes) monitor without conducting noise audits"
  concept_label: level_noise_is_the_only_component_visible_without_an_audit
  label_origin: extractor_assigned
  claim: >-
    Where cases are assigned more or less randomly, an organisation can see level noise in its
    ordinary operating records: the differing average severity, generosity or grant rates of its
    people show up without any special study. Pattern noise cannot be seen this way at all. The
    consequence is a systematic bias in what organisations believe about their own noise — the
    component they can see is the smaller one, so every finding based on operating data alone
    understates the problem.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      Level noise is a difference in a per-person average, which random assignment makes visible
      across enough cases. Pattern noise is an interaction between a judge and a case; recovering it
      requires several judges to have judged the SAME case, which normal operations never arrange.
  scope:
    domain_discussed_by_source: [patent_examination, child_protection, organisational_decision_making]
    conditions: >-
      Requires that cases be assigned to professionals approximately at random, so that differences
      in average outcome are attributable to the professional rather than to the caseload.
  caveats:
    - text: >-
        The patent-office and child-protection findings cited are third parties' studies; the source
        uses them as illustrations of what level-noise-only observation looks like.
      origin: extractor_observed
    - text: >-
        The "factor of two" understatement depends on the tentative conclusion that pattern noise
        exceeds level noise, which the source itself hedges.
      origin: extractor_observed
  source_stated_problems:
    - "If there is more pattern noise than level noise, then these already-shocking findings understate the magnitude of the noise problem"
  source_stated_remedies:
