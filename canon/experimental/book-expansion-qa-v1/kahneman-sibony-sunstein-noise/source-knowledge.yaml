- sk_id: sk_nse_0007
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "level noise"
    - "level errors"
    - "the average level of sentencing functions like a personality trait"
  concept_label: level_noise
  label_origin: source_verbatim
  claim: >-
    Level noise is the variability in the average level of different judges' judgements — some
    people are across-the-board more severe, more generous, more optimistic or more aggressive than
    others. It behaves like a personality trait: stable, correlated with background, opinions and
    experience, and having nothing to do with the case in front of the judge.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      The source attributes level differences to characteristics of the person rather than of the
      case — in the sentencing study, to stated views on the purpose of sentencing, geography and
      political outlook. It also notes a second, separable cause that produces the same signature:
      judges may form the same impression and merely use the response scale differently.
  scope:
    domain_discussed_by_source: [criminal_sentencing, performance_appraisal, forecasting, clinical_recommendation]
    conditions: >-
      "Variability in level errors will be found in any judgment task." The source asserts this as
      general.
  caveats:
    - text: >-
        The 2.4-year standard deviation of judge severity comes from the 1981 study of 208 federal
        judges, conducted by third parties as part of the sentencing-reform movement, not by the
        authors.
      origin: extractor_observed
    - text: >-
        "Error is defined here as a deviation from the average; an error may in fact correct an
        injustice, if the average judge is wrong" — the source's own warning about its terminology.
      origin: source_stated
    - text: >-
        The source explicitly leaves ambiguous whether a level difference is a difference in
        impression or a difference in scale use; the two are not separated by the measurement.
      origin: source_stated
  source_stated_problems:
    - "judges have reputations, some for being harsh 'hanging judges' … others for being 'bleeding-heart judges'"
    - "This variability has nothing to do with justice"
  source_stated_remedies:
    - "the organizations that employ them could aim to equalize the average level of their judgments"
  examples:
    positive:
      - {description: "supervisors who are systematically more generous raters than their peers", figure_ref: null}
      - {description: "bail judges: most lenient quintile released 83% of defendants, least lenient 61%", figure_ref: null}
    counter: []
  intra_source_relations:
