- sk_id: sk_nse_0006
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "Whenever you observe noise, you should work to reduce it!"
    - "the benefit of reducing noise is the same, regardless of the amount of bias"
  concept_label: noise_reduction_valuable_independent_of_bias
  label_origin: extractor_assigned
  claim: >-
    Because bias and noise are independent terms in the error equation, there is no need to know how
    biased a set of predictive judgements is before deciding whether reducing their noise is
    worthwhile. Waiting to discover the bias first — the intuitively sensible course — is wrong. The
    source also warns that noise reduction can LOOK like deterioration: halving noise while bias
    stands makes the judgements more uniformly wrong and makes the bias impossible to miss, which is
    a presentational effect, not a loss of accuracy.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      The relevant measure of bias is average error — the distance from the peak of the distribution
      to the true value — not the imbalance of positive and negative errors. Concentrating the
      distribution leaves that distance unchanged while raising the proportion of errors falling on
      one side, which reads as worse and is not.
  scope:
    domain_discussed_by_source: [predictive_judgment, forecasting]
    conditions: >-
      Predictive judgements scored by MSE. The source adds one condition: noise-reduction procedures
      help "as long as they do not increase bias to a larger extent".
  caveats:
    - text: >-
        The source concedes the priority does shift: "reducing noise would be less of a priority if
        bias were much larger than noise."
      origin: source_stated
    - text: >-
        The argument inherits the error equation's boundary and therefore does not extend to
        evaluative judgements.
      origin: extractor_observed
    - text: >-
        This is a mathematical argument about a scoring rule, not an empirical finding. The source
        presents no study showing that organisations which reduced noise first did better.
      origin: extractor_observed
  source_stated_problems:
    - "how could we reduce errors when we don't know if our forecasts are right or wrong?"
    - "noise reduction seems to have made the forecasts more precisely wrong"
  source_stated_remedies:
    - "Reducing noise in predictive judgment is always useful, regardless of what you know about bias"
  examples:
    positive:
      - {description: "Amy Simkin's boss refusing the noise project until the bias is known; the equation shows him wrong", figure_ref: null}
      - {description: "84% of forecasts on one side of the truth is what a bias as large as the noise looks like", figure_ref: null}
    counter: []
  intra_source_relations:
