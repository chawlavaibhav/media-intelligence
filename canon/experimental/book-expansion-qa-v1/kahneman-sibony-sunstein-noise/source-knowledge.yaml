- sk_id: sk_nse_0011
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "stable pattern noise"
    - "The most important component of system noise is the one we had initially neglected"
    - "Noise is mostly a by-product of our uniqueness, of our 'judgment personality'"
  concept_label: stable_pattern_noise_is_the_largest_component
  label_origin: extractor_assigned
  claim: >-
    On the evidence the authors assemble, the largest single component of system noise is stable
    pattern noise: the persistent, idiosyncratic way a particular person responds to particular
    cases. This reverses the authors' own earlier working assumption — that the residual after level
    noise was essentially random — and it changes what noise reduction has to attack, because the
    component that is easiest to see and to correct, level noise, is not where most of the problem is.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      Stability is argued rather than shown directly: if all pattern noise were transient, an
      individual judge's own sentences for the same case would vary by about 2.8 years across
      occasions, which the authors call implausible and grotesque. The positive account is the
      personality analogy — idiosyncratic sensitivities rooted in values and experience recur because
      their causes recur.
  scope:
    domain_discussed_by_source: [criminal_sentencing, bail_decisions, insurance_underwriting, punitive_damages, personnel_decisions]
    conditions: >-
      Drawn from a small assembled set of studies. The source explicitly flags one exception:
      asylum-judge variability is "almost certainly due more to level noise".
  caveats:
    - text: >-
        "Though we want to be careful not to overgeneralize from what remains a limited selection of
        examples … it requires some triangulation to formulate this tentative conclusion." The source
        marks this as tentative, in its own words.
      origin: source_stated
    - text: >-
        The supporting figures split by origin. The insurance company's 20%-level / 80%-pattern split
        is the authors' own audit. The 208-judge split, the Todorov face and punitive-intent
        replications, and the bail-judge 26%/7% analysis are third parties' studies. The punitive
        damages 63/62/61% pattern share is the authors' own study.
      origin: extractor_observed
    - text: >-
        The claim is about the RELATIVE size of components across a handful of domains. It is not a
        claim that any particular organisation's noise has this composition.
      origin: extractor_observed
  source_stated_problems:
    - "focusing on level noise misses a large part of what individual differences are about"
    - "these already-shocking findings understate the magnitude of the noise problem by at least a factor of two"
  source_stated_remedies:
    - "Reducing level noise is still a worthwhile objective, but attaining only this objective would leave most of the problem of system noise without a solution"
  examples:
    positive:
      - {description: "insurance underwriters: level differences only 20% of system noise, the remaining 80% pattern", figure_ref: null}
      - {description: "punitive damages: pattern share roughly constant at 63%, 62%, 61% across three different response scales", figure_ref: null}
    counter:
      - {description: "asylum judges, where the source expects level noise to dominate", figure_ref: null}
  intra_source_relations:
