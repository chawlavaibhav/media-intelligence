- sk_id: sk_nse_0001
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "bias"
    - "noise"
    - "Bias and noise—systematic deviation and random scatter—are different components of error"
  concept_label: bias_and_noise_as_distinct_components_of_error
  label_origin: extractor_assigned
  claim: >-
    Error in judgement has two components that are different in kind. Bias is systematic deviation:
    judgements are off target in a consistent direction, which supports a prediction about the next
    one and invites a causal explanation. Noise is scatter: judgements that should have been
    identical are spread out, with no direction to them and usually no available explanation. A
    judgement system can exhibit either, both, or neither, and the two must be understood
    separately.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      The source's shooting-range figure holds the target fixed and varies the pattern of hits: a
      tight cluster off centre (biased), a wide scatter centred on the bull's-eye (noisy), and both
      together. Consistency of a deviation is what makes it predictable and explicable; scatter is
      by construction neither.
  scope:
    domain_discussed_by_source: [human_professional_judgment, organisational_decision_making]
    conditions: >-
      Judgements made by people who are expected to agree — the source's phrase is "the diverse
      decisions that people make on behalf of organizations".
  caveats:
    - text: >-
        The distinction is introduced through an illustrative metaphor, not a study. The source
        presents it as a framing device for the rest of the book.
      origin: extractor_observed
    - text: >-
        The source is explicit that its "bias" is statistical bias — average error — and warns
        separately that this is not a synonym for social discrimination.
      origin: source_stated
  source_stated_problems:
    - "Many organizations, unfortunately, are afflicted by both bias and noise"
    - "in public conversations about human error and in organizations all over the world, noise is rarely recognized"
  source_stated_remedies:
    - "To understand error in judgment, we must understand both bias and noise"
  examples:
    positive:
      - {description: "four shooting teams: tight on target, tight off target, scattered on target, scattered off target", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: generalises, target: sk_nse_0005, note: "the error equation quantifies the distinction this object states qualitatively"}
    - {relation: demonstrated_together_with, target: sk_nse_0002, note: "the same figure, seen from the back of the target"}
