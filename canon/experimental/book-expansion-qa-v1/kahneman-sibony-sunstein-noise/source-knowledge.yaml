- sk_id: sk_nse_0008
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "pattern noise"
    - "pattern errors"
    - "judge × case interaction"
    - "consistency without consensus"
  concept_label: pattern_noise
  label_origin: source_verbatim
  claim: >-
    Pattern noise is the variability in how individual judges respond to particular cases, over and
    above their general severity. Two judges of equal average severity can rank the same set of cases
    differently, because each has an idiosyncratic sensitivity to particular features and
    combinations of features. The source's technical name for it is the judge-by-case interaction.
    Pattern errors sum to zero for each judge and for each case, and still contribute to noise,
    because the contributions are squared.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      The source's account is by analogy with personality: behaviour is a function of person and
      situation and the joining is not additive, so two people with the same trait score still have
      different signature patterns of response to triggers. Applied to judgement, the "judgment
      personality" is a unique pattern of sensitivity to features, formed from values, memories,
      training and associations, and mostly opaque to the judge.
  scope:
    domain_discussed_by_source: [criminal_sentencing, bail_decisions, recruitment, performance_appraisal, medical_admission]
    conditions: >-
      Detectable only when the same judges evaluate multiple cases. "Pattern noise is pervasive" —
      the source asserts it wherever different judges produce different rankings.
  caveats:
    - text: >-
        The bail-judge evidence — 173 modelled judges, 141,833 cases, stable pattern noise nearly
        four times level noise — is a special analysis carried out at the authors' request by the
        original researchers (Mullainathan and colleagues). The data and the modelling are theirs,
        not the authors'.
      origin: extractor_observed
    - text: >-
        The Todorov group's "consistency without consensus" studies are third-party work using paid
        online participants; the source itself notes their judgement quality is often lower than in
        professional settings.
      origin: extractor_observed
    - text: >-
