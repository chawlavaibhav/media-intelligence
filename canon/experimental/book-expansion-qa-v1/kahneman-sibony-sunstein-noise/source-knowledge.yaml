- sk_id: sk_nse_0009
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "occasion noise"
    - "the second lottery"
    - "you are not the same person at all times"
  concept_label: occasion_noise
  label_origin: source_verbatim
  claim: >-
    Occasion noise is variability in the judgements of the same case by the same person on different
    occasions. It is produced by a second lottery — one that picks the moment, the mood, the cases
    freshly in mind, the sequence of preceding decisions and countless other circumstances that
    should not bear on the judgement. The source's stronger claim is that a judgement is drawn from
    an internal distribution rather than computed from all the judge's knowledge: the answer given is
    one point in a cloud of answers the same mind could have produced.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      Two mechanisms are given. External: mood changes both what you notice and retrieve AND how you
      think — good mood raises reliance on first impressions and receptivity to unfounded claims;
      fatigue, weather and sequence effects act similarly. Internal: variability in the efficiency of
      endogenous neural processes, which the source argues cannot be controlled away.
  scope:
    domain_discussed_by_source: [medical_diagnosis, forensic_examination, wine_judging, software_estimation, asylum_adjudication]
    conditions: >-
      "Occasion noise affects all our judgments, all the time." The source asserts universality while
      also asserting that it is the SMALLEST of the three noise components.
  caveats:
    - text: >-
        Every quantitative example is a third party's study: Vul and Pashler on the crowd within,
        Herzog and Hertwig on dialectical bootstrapping, Forgas on mood, Kahana and colleagues on
        memory, the asylum-sequence and opioid-prescribing analyses. The authors report none of their
        own measurements of occasion noise.
      origin: extractor_observed
    - text: >-
        Direct measurement is blocked wherever cases are memorable: a judge who recognises a case
        will reproduce the earlier answer to save effort and stay consistent, so within-session
        retests systematically understate occasion noise.
      origin: source_stated
    - text: >-
        "In every case we reviewed in which the share of occasion noise in total system noise could
        be measured, occasion noise was a smaller contributor than were differences among
        individuals." The source states this as a review of a limited set, not a law.
      origin: source_stated
  source_stated_problems:
    - "we do not always produce identical judgments when faced with the same facts on two occasions"
    - "your mood in the moment may influence your approach to the problem … even when you can confidently justify the answer you found"
  source_stated_remedies:
    - "make the same judgment yourself a second time to create an 'inner crowd'"
    - "Sleep on it, and think again in the morning"
    - "unless you have very strong reasons to put more weight on one of the estimates, your best bet is to average them"
  examples:
    positive:
      - {description: "wine experts at a US competition scoring only 18% of the same wines identically in a blind re-tasting", figure_ref: null}
      - {description: "asylum judges 19% less likely to grant asylum when the previous two cases were approved", figure_ref: null}
    counter:
      - {description: "the highly controlled memory study where all measured predictors together explained only 11% of within-person variation — the residual had no identifiable external cause", figure_ref: null}
  intra_source_relations:
    - {relation: member_of_system, target: scs_nse_001}
    - {relation: specialises, target: sk_nse_0008, note: "the transient component of pattern noise"}
    - {relation: depends_on, target: sk_nse_0036, note: "sequencing information is the hygiene strategy the source aims at occasion noise"}
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, repeated_within_source]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: none
