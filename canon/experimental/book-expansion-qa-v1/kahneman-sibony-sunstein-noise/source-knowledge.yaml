- sk_id: sk_nse_0010
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "System Noise 2 = Level Noise 2 + Pattern Noise 2"
    - "(Pattern Noise) 2 = (Stable Pattern Noise) 2 + (Occasion Noise) 2"
  concept_label: decomposition_of_system_noise
  label_origin: extractor_assigned
  claim: >-
    System noise decomposes by the same sum-of-squares logic as the error equation: into level noise
    and pattern noise, and pattern noise in turn into a stable component and occasion noise. The
    decomposition is not merely descriptive — it is what a noise audit with multiple judges and
    multiple cases can actually recover, and separating the components is what tells an organisation
    which remedy could help.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      The components are independent and uncorrelated, so variances add. The source stresses that
      the split requires the same people to judge SEVERAL cases: with one case per judge, level and
      pattern are not separable, and separating stable pattern noise from occasion noise requires two
      independent judgements of each case by each judge.
  scope:
    domain_discussed_by_source: [noise_audits, criminal_sentencing, punitive_damages, performance_appraisal]
    conditions: >-
      Requires a design in which multiple judges evaluate multiple common cases; the stable/transient
      split additionally requires repeat judgements that the judge does not recognise.
  caveats:
    - text: >-
        The source states that in the sentencing study "the conservative spirit of statistical
        analysis" made the residual default to random error, and that the authors themselves held
        that default for a long time before abandoning it. The decomposition is therefore an
        interpretive choice about the residual, not only an arithmetic one.
      origin: source_stated
    - text: >-
        Figure 16 carries the combined graphical decomposition and was not inspected; the prose
        states all three equations, so the content is recoverable, but the figure's presentation is
        not available to this extraction.
      origin: extractor_observed
  source_stated_problems:
    - "there is no way of telling whether the residual error … is transient or stable"
  source_stated_remedies:
    - "An essential benefit is the assessment of separate types of noise"
  examples:
    positive:
      - {description: "the 208-judge study, in which level and pattern noise contributed approximately equally", figure_ref: null}
    counter: []
  intra_source_relations:
