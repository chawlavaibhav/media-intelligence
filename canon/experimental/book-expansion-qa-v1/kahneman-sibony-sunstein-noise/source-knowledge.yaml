- sk_id: sk_nse_0004
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
    - "Unwanted Variability Versus Wanted Diversity"
    - "A defining feature of system noise is that it is unwanted"
    - "in a market as in nature, selection cannot work without variation"
  concept_label: unwanted_variability_versus_wanted_diversity
  label_origin: extractor_assigned
  claim: >-
    Variability in judgement is not always a defect, and the concept of noise does not apply to it
    when it is not. Where the judgements are matters of taste, disagreement is expected and welcome.
    Where the setting is competitive — several teams attacking the same problem, several traders
    pricing the same stock — variation is the raw material selection works on, and suppressing it
    would destroy the mechanism. Noise is a problem of SYSTEMS, which are organisations, not markets.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >-
      In a competitive setting variation is only the first phase; a second phase pits the results
      against one another and the best wins. In a system there is no second phase — one judgement
      is made on the organisation's behalf and acted on, so the variation is never selected, only
      suffered.
  scope:
    domain_discussed_by_source: [organisational_decision_making, markets, matters_of_taste]
    conditions: >-
      The distinction turns on whether the variation is subsequently selected on. The source notes
      the boundary is crossable in one direction: personal taste mistaken for professional judgement
      is an error, not welcome diversity.
  caveats:
    - text: >-
        The source gives no test for deciding which side of the line a given judgement task falls
        on. It supplies clear cases at each end and leaves the middle to judgement.
      origin: extractor_observed
    - text: >-
        The source notes the same person can be on both sides: a film producer's personal liking is
        welcome diversity as taste and a major mistake if it stands in for a professional judgement
        about an audience.
      origin: source_stated
  source_stated_problems:
    - "diversity of tastes can help account for errors if a personal taste is mistaken for a professional judgment"
  source_stated_remedies: []
  examples:
    positive:
      - {description: "multiple research teams attacking a vaccine from different angles — variation wanted", figure_ref: null}
      - {description: "traders disagreeing on a stock's value: disagreements make markets", figure_ref: null}
    counter:
      - {description: "one trader randomly chosen to value a stock on the firm's behalf while colleagues would differ sharply — system noise", figure_ref: null}
  intra_source_relations:
