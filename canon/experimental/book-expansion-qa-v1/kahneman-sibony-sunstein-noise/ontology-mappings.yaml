- {from: t_nse_0031, to: t_nse_0026, relation: related_to, confidence_basis: extractor_judgement, note: "aggregation fails exactly where a cascade has removed the independence it assumes"}
- {from: t_nse_0040, to: t_nse_0041, relation: broader_than, confidence_basis: extractor_judgement, note: "forced ranking is comparative judgment plus a mandated distribution; the source endorses the first and rejects the second"}
- {from: t_nse_0033, to: t_nse_0025, relation: related_to, confidence_basis: extractor_judgement, note: "the case scale is the source's answer to scale ambiguity"}
- {from: t_nse_0034, to: t_nse_0029, relation: distinct_from, confidence_basis: extractor_judgement, note: "the outside view is the statistical mode; causal thinking is the default it displaces"}
- {from: t_nse_0037, to: t_nse_0032, relation: narrower_than, confidence_basis: extractor_judgement, note: "a guideline is a structured judgement with the decomposition and the weights fixed in advance"}
- {from: t_nse_0039, to: t_nse_0005, relation: related_to, confidence_basis: extractor_judgement, note: "an override that fails the broken-leg test is the judge's own pattern noise reasserting itself"}
- {from: t_nse_0018, to: t_nse_0019, relation: distinct_from, confidence_basis: extractor_judgement, note: "checked and rejected: respect tracks confidence and fluent storytelling; the source reports only actively open-minded thinking as predicting forecasting performance"}
- {from: t_nse_0013, to: t_nse_0014, relation: distinct_from, confidence_basis: extractor_judgement, note: "the source's error equation applies to the first and explicitly not to the second; noise is a defect in both, for different reasons"}
- {from: t_nse_0012, to: t_nse_0001, relation: related_to, confidence_basis: extractor_judgement, note: "noise is disagreement in excess of the bound a matter of judgement expects"}
- {from: t_nse_0010, to: t_nse_0008, relation: related_to, confidence_basis: extractor_judgement, note: "the source states the audit is what shatters the illusion"}

