  target_schema: null
  target_schema_version: null
  role: [derives]
  observation_unit: null
  governance_consumer: null
  rationale: >
    Five matched pairs in which exactly one variable changes and the predicted outcome follows from stated
    physics rather than from taste, and — unlike the live chapter-3 pass — all five were actually inspected
    in this copy. Black leather under raking light against the same leather under a large source filling the
    family of angles, with the source stating the incident light is unchanged, so the recovered texture
    cannot be an exposure effect. The same spatula and soft box at two distances, where the background lifts
    from mid grey to near white and the blade holds its tone. The same beer against a mottled ground and
    against a shaped white card. The same bust lit so the background is white and then so the subject is.
    The same flashlight on black paper and on black velvet at identical exposure. Each has a definite
    expected result, each isolates one variable, and each is stated before it is shown.
  applicability:
    when: "constructing stimuli whose expected outcome follows from stated physics rather than from a practitioner's judgement"
    limits: >
      Candidate stimuli, not instruments. They are photographs of physical set-ups made by these authors,
      and reproducing them would require reproducing the set-ups. Nothing here is a measurement of any
      generator's behaviour, and the fact that the expected outcomes follow from physics makes them easier
      to validate independently — it does not remove the need to. Note also that the fifth pair's variable,
      the material of the background, is confounded with everything else about velvet versus paper; the
      source controls the exposure and the lighting, not the material's other properties.
