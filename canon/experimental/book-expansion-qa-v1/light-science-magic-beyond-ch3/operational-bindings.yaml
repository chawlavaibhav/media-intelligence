- binding_id: bnd_lsmx_005
  source_knowledge_refs: [sk_lsmx_0025, sk_lsmx_0028, sk_lsmx_0029, sk_lsmx_0031, sk_lsmx_0035, sk_lsmx_0038]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, flags]
  observation_unit: frame
  governance_consumer: null
  rationale: >
    Three inspections for any frame containing polished metal, each with a stated physical reason. First,
    is the metal reading as metal or as a grey card? Polished metal records at close to the brightness of
    whatever it reflects, so a metal surface sitting at a plausible mid grey across its whole area, with
    no bright region and no dark one, is showing the tonal signature of a diffuse surface rather than a
    mirror. Second, does the metal's edge separate from what it stands on? The source names the failure
    exactly — a near-pure direct reflector standing on its own light source records at the same brightness
    as that source, and the boundary disappears. Third, does the frame contain the source's own image?
    Because a direct reflection is a picture of the source, a shiny surface reports the size and shape of
    what lit it, and a hard-edged rectangle in a product's face is a legible artefact.
  applicability:
    when: "inspecting a frame containing polished or brushed metal, foil or another strongly direct-reflecting product surface"
    limits: >
      Everything here is a statement about what a real camera records from real metal. Applying the three
      checks to a rendered frame is ours. The second check in particular assumes the depicted metal really
      is standing on the surface that appears to light it, which a generated image need not honour. Nothing
      about how to FIX any of these is bound outside bnd_lsmx_010: the source's answers are a light-toned
      background, a black card, a gobo, a polarizer or dulling spray, all physical.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_lsmx_0021]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_lsmx_006
  source_knowledge_refs: [sk_lsmx_0048]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  observation_unit: frame
  governance_consumer: null
  rationale: >
    Two checks for any frame containing liquid in a transparent container, both with stated optics behind
    them. First, does the liquid's colour belong to the liquid or to what is behind it? The source states
    flatly that a liquid in a transparent container always takes some of the colour and texture of its
    background, and its demonstration pair is beer that is murky brown against a mottled ground and bright
    amber with a shaped card behind it. A brief asking for an appetising drink is asking, in this source's
    terms, for a controlled secondary background. Second, does what is visible THROUGH the liquid agree
    with what is visible beside it? A round liquid-filled container is a lens with a wider field than the
    camera, so the region seen through it legitimately shows more of the surroundings — and, in a
    fabricated image, is a place where the surroundings may simply fail to be consistent.
  applicability:
    when: "inspecting a frame containing a drink, a liquid product or any transparent container of liquid"
    limits: >
      The lens behaviour is a physical fact about refraction; whether a generated image obeys it is exactly
      the sort of thing this check would reveal, and this lane makes no claim about the answer. The colour
      check is a diagnosis of appearance: it can say a liquid looks murky and can point at the background as
      the source's stated cause, and it cannot verify that the depicted cause is the actual one.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_lsmx_0023, t_lsmx_0011]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_lsmx_007
