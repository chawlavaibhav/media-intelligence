- binding_id: bnd_lsmx_009
  source_knowledge_refs: [sk_lsmx_0058, sk_lsmx_0060]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, flags]
  observation_unit: whole_asset
  governance_consumer: null
  rationale: >
    A colour-error triage that is worth having because it separates a fixable defect from an unfixable
    one before anyone spends time on it. Is the colour error uniform across the asset, or does it vary by
    region? A uniform cast is the source's mixed-colour case: one global correction removes it, and the
    result differs from a correct original only under side-by-side comparison. A cast that changes from
    the subject to the background, or that appears in a shadow but not on the surface casting it, is the
    unmixed case: no single correction is right anywhere, and a compromise leaves nothing right. The
    source adds a specific artefact to look for after any global correction — a clipped highlight, having
    recorded white regardless of the colour that produced it, takes on the colour of the correction, so a
    tinted specular highlight in an otherwise corrected asset is evidence of the correction rather than of
    the lighting.
  applicability:
    when: "triaging a colour cast across a delivered asset, or inspecting an asset after a global colour correction"
    limits: >
      The source's context is a photographer on location with a flash and existing fluorescent light, and
      its remedy is to gel the physical sources. Only the DIAGNOSIS is bound here. The uniform-versus-
      varying test is a property of the image and transfers; the remedy is physical and is parked. The
      catalogue of nonstandard sources is period-specific and is not part of this binding.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_lsmx_0013, t_lsmx_0012]
  repair_ontology_refs: []
  status: proposed
