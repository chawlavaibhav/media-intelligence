- binding_id: bnd_lsmx_008
  source_knowledge_refs: [sk_lsmx_0055, sk_lsmx_0053, sk_lsmx_0021]
  source_system_refs: [scs_lsmx_005]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, evaluates]
  observation_unit: frame
  governance_consumer: null
  rationale: >
    Two checks for frames pushed toward either end of the tonal range, which is most packshots on white
    and most dramatic product work on black. First, does the background carry the extreme? The source
    demonstrates with matched pairs that a viewer accepts a light-grey subject on a white ground as
    white-on-white but reads a white subject on a light-grey ground as white-on-gray, and the same
    asymmetry in reverse at the dark end. The frame can be technically separated and still read as the
    wrong thing. Second, does the subject's edge survive against the ground? The source gives a numeric
    window for its own examples — background between half a stop and one stop beyond the subject's edge
    tones — with a stated failure on each side: below it the edge is lost, above it flare costs contrast.
    A frame whose product silhouette dissolves into a white ground is failing the first of those bounds.
  applicability:
    when: "inspecting a high-key or low-key frame, or a packshot on a white or black ground"
    limits: >
      The half-to-one-stop window is stated by the source for its own remaining examples and is not
      presented as a universal, so it is a starting reference and not a threshold. The perceptual claim
      about which element must carry the extreme is asserted from the source's own matched pairs, without
      a study. The exposure half of the underlying system is technology-contingent — the compression the
      source describes belongs to film and to the sensor generation of this edition.
  evidence_basis: derived_from_source
  empirical_refs: []
