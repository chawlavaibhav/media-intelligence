# Light: Science & Magic, 5th ed., chapters beyond ch.3 — SPEC-04 OperationalBindings
# EXPERIMENTAL — NOT LIVE CANON. Lane of book-expansion-qa-v1.
# scope_extension_of: light-science-magic-ch3 · independence: none — same work
#
# ─────────────────────────────────────────────────────────────────────────────
# THE RULE THAT GOVERNS THIS FILE, STATED ONCE AND ENFORCED IN EVERY BINDING:
#
# This source is about PHYSICAL LIGHT, PHYSICAL CAMERAS AND PHYSICAL SURFACES. Every action it
# prescribes is a person moving a light, a camera, a card, a filter, a support or a gobo.
# "Move the light outside the family of angles" does NOT become "regenerate with a different
# lighting prompt." Exactly one binding below carries target_type: production, it is
# status: production_candidate with target_path: null, and its applicability.limits says in
# terms that nothing in it has been translated. The gap ledger calls physical-to-generative
# translation G11 and records that no book supplies it. This lane does not attempt it.
#
# The EVALUATION bindings are the honest ones: what to LOOK AT in a finished image. Each carries an
# observation_unit. They do not claim any generator can produce these behaviours — that is a
# Capability Lab question and is not asserted anywhere here.
#
# Neither cross_source_supported nor empirically_supported is used, per the schema contract.
# ─────────────────────────────────────────────────────────────────────────────

