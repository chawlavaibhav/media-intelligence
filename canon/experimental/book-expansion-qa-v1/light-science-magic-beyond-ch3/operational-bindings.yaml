- binding_id: bnd_lsmx_011
  source_knowledge_refs: [sk_lsmx_0009, sk_lsmx_0023, sk_lsmx_0035, sk_lsmx_0036, sk_lsmx_0057]
  source_system_refs: []
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains]
  observation_unit: null
  governance_consumer: conflict_resolution
  rationale: >
    A worked precedent for a distinction the ontology has to be able to draw and currently draws by hand:
    a source qualifying its OWN earlier statement is not a disagreement between sources. This span
    contains at least three clean instances, all within one book by one author team. The polarizer is
    offered early among the remedies for competing surfaces in chapter 4 and demoted to a next-to-last
    resort for glossy boxes in chapter 5, with the optical reason given. Identical box geometry is used to
    REMOVE direct reflection when the box is glossy wood and to CREATE it when the box is metal, and the
    source says so in as many words. The transparent-support-plus-polarizer trick that solves the metal box
    is explicitly withdrawn for black subjects in chapter 9, on the ground that a black subject's direct
    reflection is polarized like the support's. In each case the later statement supersedes the earlier
    within a stated scope, and none of the three is a contradiction: the scopes differ and the source names
    the difference. Any consolidation that flattened these into "the source contradicts itself", or worse
    into two sources disagreeing, would destroy the information.
  applicability:
    when: "deciding how to record an apparent conflict between two claims, and whether it is a disagreement at all"
    limits: >
      Three instances from one work. It shows that self-qualification is common enough within a single
      author team to need a name, and that the qualifying statement usually carries its own scope marker.
      It does not establish how to detect the pattern where the source does NOT state the scope, which is
      the harder case.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_lsmx_012
