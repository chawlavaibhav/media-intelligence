  target_schema: null
  target_schema_version: null
  role: [diagnoses, flags]
  observation_unit: frame
  governance_consumer: null
  rationale: >
    A specific, checkable acceptance question for any frame containing transparent glassware: does the
    glass have defined edges, and are they defined the same way all the way round? The source's two
    correct answers are continuous dark lines against a brighter ground, or continuous bright lines
    against a darker one. Its named failure is the mixture — edges that go bright in one region and
    vanish in another, or a subject whose outline merges with the ground. That failure has a name in this
    lane and a stated cause. This is the most inspectable claim in the whole span: the two acceptable
    outcomes are visually distinct, mutually exclusive, and describable without reference to how the frame
    was made.
  applicability:
    when: "inspecting a frame containing transparent glass or a transparent container"
    limits: >
      The source is describing physical glass photographed with real backgrounds. The check transfers
      because it is stated entirely in terms of the finished image rather than the set-up — but the
      REMEDIES do not transfer, and none has been rewritten as one. When this check fails, the source's
      answers are all physical: resize the background, move the subject toward the camera, separate the
      two field regions. Those stay in bnd_lsmx_010.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_lsmx_0018, t_lsmx_0019]
  repair_ontology_refs: []
  status: proposed
