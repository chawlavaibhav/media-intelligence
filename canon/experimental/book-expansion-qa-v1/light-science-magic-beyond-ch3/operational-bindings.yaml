  target_schema: SPEC-01
  target_schema_version: v0.1
  role: [constrains]
  observation_unit: null
  governance_consumer: null
  rationale: >
    SPEC-01 lets an entity declare `allowed_variation: {lighting: true, viewing_angle: true}` alongside
    the invariants that constitute its identity. This source supplies a physical basis for setting those
    two flags per surface rather than per product. A matte surface's recorded brightness is independent
    of viewing angle, so its appearance is close to an identity property. A polished one's is not: what a
    mirror-like product shows is an image of its surroundings, so the same physical object legitimately
    looks different from a different angle or in a different room, and its centre will show whatever is
    in front of it. Declaring viewing_angle variation permissible for a brushed-metal tin and
    impermissible for a matte carton is a different decision, and the source says why.
  applicability:
    when: "declaring which appearance changes count as identity violations for a product entity with reflective surfaces"
    limits: >
      The source is describing what a physical camera records from a physical object. Whether a generator's
      variation across angles corresponds to this physics is unknown and is not claimed. The flags this
      informs are declarations of intent, not measurements. Treat as extractor inference: the source never
      discusses identity, invariants, or any specification format.
  evidence_basis: extractor_inference
  empirical_refs: []
