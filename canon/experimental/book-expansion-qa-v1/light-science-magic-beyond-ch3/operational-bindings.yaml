# ── EVALUATION — the honest bindings. Every one names what to inspect. ───────

- binding_id: bnd_lsmx_003
  source_knowledge_refs: [sk_lsmx_0004, sk_lsmx_0010, sk_lsmx_0011, sk_lsmx_0012, sk_lsmx_0054]
  source_system_refs: [scs_lsmx_001]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  observation_unit: frame
  governance_consumer: null
  rationale: >
    A single question to ask of any highlight in a rendered or photographed frame: is it a diffuse
    highlight or a direct reflection? The source supplies the discriminators. A diffuse highlight sits
    where the light falls and does not move with viewpoint; a direct reflection is an image of the source
    and its size, shape and evenness are the source's. On a textured surface the two produce visibly
    different results — a light diffuse surface shows a shadow and a lit face on every particle, a dark
    glossy one shows a raised overall highlight with the texture legible inside it. The diagnostic value
    is that a frame in which a dark textured material shows neither is a frame in which the material is
    not reading as its class.
  applicability:
    when: "inspecting a frame containing a textured or finished surface to judge whether it reads as its material"
    limits: >
      The source describes what a camera records from a real surface, and its two demonstrations are
      photographs of a sponge and a leather notebook. Applying the discriminators to a generated image is
      ours, and a generator that produces a plausible highlight without any underlying geometry may satisfy
      the cue without the mechanism. The check therefore diagnoses appearance, not correctness.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_lsmx_0017]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_lsmx_004
  source_knowledge_refs: [sk_lsmx_0039, sk_lsmx_0040, sk_lsmx_0041, sk_lsmx_0042, sk_lsmx_0043]
