  role: [diagnoses, flags]
  observation_unit: frame
  governance_consumer: null
  rationale: >
    The conflict check, and the most transferable thing in this span. Where two surfaces of different
    class occupy one frame, the treatment that serves one degrades the other, and the source's worked case
    is the packshot's own: the light that gives a bottle its describing highlight puts a sheen across the
    paper label and reduces its legibility. The inspection is therefore not "is the glass well lit" or "is
    the label legible" but both at once, plus the third question the source insists comes first — which of
    them is the principal subject. A frame where the container looks superb and the type has gone soft is
    not a frame with a legibility defect; it is a frame lit for the wrong principal subject, and the source
    says that decision cannot be made technically.
  applicability:
    when: "inspecting any frame in which a legible element sits on a reflective or transparent product"
    limits: >
      The source treats one case — a paper label on a glass bottle — and generalises it only loosely. The
      diagnosis is honest as far as naming the conflict; the source's remedies are a light moved higher and
