  governance_consumer: rule_application
  rationale: >
    Two clean demonstrations that a rule extracted without its precondition is not merely incomplete but
    actively harmful, and that the source treats this as the central pedagogical point rather than as an
    aside. The 45-degree copy rule is a real rule that usually works and that fails silently because it is
    stated as an angle while depending on two distances; the source's correction is not to replace it but
    to name what it omits. The raking light that reveals a sponge's texture is the same rule applied to
    black leather, where the source says the earlier theory predicts the worst possible arrangement — and
    the reason is a precondition, the presence of a diffuse channel, that the rule never mentioned. Both
    are directly relevant to how this project should record craft rules: a rule whose scope condition is
    dropped will be applied confidently in exactly the cases where it inverts.
  applicability:
    when: "deciding how much scope condition must travel with an extracted craft rule before it may be applied"
    limits: >
      Two instances, both from one chapter of one book, both about surface lighting. They demonstrate the
      failure mode vividly and do not establish how often it occurs, nor give a test for detecting an
      unstated precondition in a rule that has not yet been seen to fail.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_lsmx_0017, t_lsmx_0016]
  repair_ontology_refs: []
  status: proposed
