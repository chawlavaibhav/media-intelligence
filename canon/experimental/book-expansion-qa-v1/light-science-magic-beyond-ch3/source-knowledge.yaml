- sk_id: sk_lsmx_0013
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "we will use the term complex surface to mean a single surface that requires both diffuse and direct reflection to define it properly"
    - "Only direct reflection can tell the viewer that the wood is glossy, but diffuse reflection is essential to reveal the color and the grain of the wood beneath the gloss."
  concept_label: complex_surface_requires_both_reflection_types_in_different_parts_of_the_frame
  label_origin: source_verbatim
  claim: >
    The source defines a complex surface as a single surface that needs both diffuse and direct
    reflection to be defined properly. Glossy wood is the given example: only direct reflection can
    say the wood is glossy, and only diffuse reflection can show the colour and grain beneath the
    gloss. The two cannot occupy the same area, so the surface is divided. The source lit a polished
    wooden box with a source large enough to fill the whole family of angles, then blocked part of it
    with a gobo, so that one part of the surface shows the gloss by direct reflection and the other
    shows the wood's true colour and grain by diffuse reflection. The source notes that the diffusely
    lit area is the only place where the true colour of the wood is clearly apparent.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Direct reflection is an image of the source and therefore reports finish; diffuse reflection
      reports pigment. A surface carrying both properties can only report both by devoting different
      regions of itself to different reflection types, which a partly blocked large source achieves.
