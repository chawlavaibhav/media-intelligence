  claim: >
    A cylinder has no edges at which tone changes abruptly, so under even lighting the shadow blends
    into the highlight gradually and the subject reads as flat. Cylinders therefore need a brighter
    highlight side or a darker shadow side than boxes do. The source's method is a light on one side
