- sk_id: sk_lsmx_0032
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "Changing the distance of the light source changes the brightness of the background but not of the metal."
    - "we expect the closer light to illuminate the background more brightly, but the brightness of the metal does not change because the brightness of direct reflection is not affected by the distance to the source"
  concept_label: moving_the_light_changes_the_background_and_leaves_the_metal_where_it_was
  label_origin: extractor_assigned
  claim: >
    Moving the source closer to a metal subject brightens the background and leaves the metal's
    brightness unchanged; moving it away darkens the background and again leaves the metal unchanged.
    This gives what looks like unlimited independent control over the relative brightness of metal and
    background from a single light. The source immediately qualifies it: sometimes it does and
    sometimes it does not, because the effective size of the light relative to the family of angles
    limits how far the light can travel before the metal is affected.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The background is lit by diffuse reflection and therefore follows the inverse square law; the
      metal is lit by direct reflection, whose brightness equals that of the source regardless of
      distance. Two different laws act on the two surfaces from the same lamp.
  scope:
    domain_discussed_by_source: [photographic_lighting, product_rendering, metal_surfaces]
    conditions: "brightly polished metal against a diffusely reflecting background"
  caveats:
    - text: "this is the live chapter-3 pair of laws (sk_lsm_c003_0008 for diffuse, sk_lsm_c003_0011 for direct) put to work as a control; neither law is re-extracted, and what is new is that they can be run against each other in one scene"
      origin: extractor_observed
