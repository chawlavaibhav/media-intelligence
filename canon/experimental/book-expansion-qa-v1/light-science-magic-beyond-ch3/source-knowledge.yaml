- sk_id: sk_lsmx_0005
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "Because we want only diffuse reflection, we place the light anywhere outside the family of angles."
    - "Placing the light inside the family of angles caused an unacceptable hot spot on the image."
  concept_label: copy_work_wants_diffuse_reflection_only_so_the_light_goes_outside_the_family
  label_origin: extractor_assigned
  claim: >
    Copy work — photographing a painting, an illustration or an old photograph — is the case where
    only diffuse reflection is wanted, because the job is to record the colours and values of the
    original and not the surface it sits on. Since a light at any angle can produce diffuse
    reflection but only a light inside the family of angles can produce direct reflection, the light
    goes anywhere outside the family. A light placed inside it puts a hot spot on the artwork.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Diffuse reflection is available from any lighting angle and direct reflection only from inside
      the family, so excluding the family removes one type without costing the other.
  scope:
    domain_discussed_by_source: [photographic_lighting, copy_work]
    conditions: "flat artwork being reproduced for its tone and colour"
  caveats:
