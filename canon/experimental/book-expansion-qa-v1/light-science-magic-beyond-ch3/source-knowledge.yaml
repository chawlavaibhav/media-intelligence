- sk_id: sk_lsmx_0008
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "even illumination and glare-free illumination can be mutually exclusive goals"
    - "The only solution to this problem that always works is to move the light farther away from the subject."
    - "a light at an infinite distance away is also likely to be infinitely dim"
  concept_label: even_illumination_and_glare_free_illumination_pull_against_each_other
  label_origin: extractor_assigned
  claim: >
    On a flat subject the two lighting goals fight. The closer the source is to the camera axis the
    more evenly it lights the surface, and the farther to the side it is the less likely it is to fall
    within the family of angles. A shallow side angle avoids direct reflection but overlights the near
    edge; a second light on the other side then gives two overexposed edges with a dark centre rather
    than fixing it. Moving the light toward the camera evens the illumination but is likely to put it
    inside the family, which the source calls the worse problem. The only solution that always works
    is to move the light farther away — in the limit an infinitely distant light is perfectly even —
    and the limit is unusable because such a light is also infinitely dim. The resolution is a
    compromise distance judged by eye and checked with a meter.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Illumination evenness across a surface is governed by the ratio of the light-to-near-edge and
      light-to-far-edge distances, which approaches one as the light recedes; freedom from direct
      reflection is governed by whether the light lies inside the family of angles, which shrinks as
      the light moves to the side. The two are controlled by different geometry, so they can conflict.

  scope:
    domain_discussed_by_source: [photographic_lighting, copy_work]
    conditions: "flat or near-flat subjects lit for even reproduction"
  caveats:
    - text: "the source explicitly declines to give the formula, saying it could offer mathematical formulas for an acceptable distance at any given angle but that the reader would not use them; it prescribes eye judgement plus a meter check instead"
      origin: source_stated
    - text: "one of the few places in this book where the authors name a genuine trade-off with no clean resolution and say so"
      origin: extractor_observed
  source_stated_problems:
    - "the illumination is too uneven to preserve detail on both the camera-left and -right sides"
    - "we simply get two overexposed areas instead of one, with a dark area in the center"
  source_stated_remedies:
    - "move the light farther away from the subject until the illumination is acceptably even, while keeping it close enough for acceptable exposure times"
    - "place the lights so the illumination looks reasonably even, then double-check by metering points across the surface"
  examples:
    positive: []
    counter:
      - {description: "a shallow lighting angle that avoids direct reflection but leaves one side of the copy markedly brighter than the other", figure_ref: "4.9"}
  intra_source_relations:
    - {relation: trades_off_with, target: sk_lsmx_0005, note: "the two goals of copy lighting are in tension"}
    - {relation: qualified_by, target: sk_lsmx_0009, note: "the polarizer solves the case where neither goal can be met"}
    - {relation: depends_on, target: sk_lsmx_0006, note: "the working-space demand follows from the family's dependence on viewpoint"}
