- sk_id: sk_lsmx_0023
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "a glossy box with two families of angles, one that produces direct reflection for the top of the box and one for the front"
    - "as the polarizing filter eliminates one polarized reflection, it effectively increases another"
    - "there are times when the dragon wins!"
  concept_label: the_glossy_box_remedy_ladder_ordered_by_cost_with_the_polarizer_late
  label_origin: extractor_assigned
  claim: >
    A box presents several families of angles at once, one per visible face, each facing a different
    direction. To suppress direct reflection on a glossy box the source gives an ordered ladder of
    remedies: use a dark to medium background, because background light reaching the box is one of the
    routes glare arrives by; move the light source toward the camera; raise or lower the camera, which
    moves the family; use falloff to darken only the offending part of the background; put a black card
    on the tabletop, which cannot fill the whole family unless it touches the box; tip the box; use a
    longer lens from farther away, which shrinks the family. Only then the polarizer, and only then
    dulling spray. The polarizer is placed late for a stated reason: a glossy box usually carries
    polarized reflection on more than one side, polarized perpendicular to each other, so removing one
    increases another — the filter trades rather than solves. Dulling spray is last because it can
    destroy the very fine detail it was brought in to save.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Each face of a box defines its own family of angles in its own direction, so a single control
      rarely clears them all. A lens polarizer acts on one plane of polarization; the reflections from
      two mutually perpendicular faces are polarized in mutually perpendicular planes, so any rotation
      that attenuates one transmits the other.
  scope:
    domain_discussed_by_source: [photographic_lighting, product_rendering]
    conditions: "glossy non-metallic boxes; the source's example is an antique wooden box with a high-gloss finish"
  caveats:
    - text: "qualifies the source's own earlier advice: in chapter 4 it offered the polarizer as one of the FIRST remedies for competing surfaces, and here it says that for a glossy box the polarizer is saved as a next-to-last resort. Same authors, revised ordering for a different geometry — not cross-source disagreement."
      origin: source_stated
    - text: "the dulling-spray cautions are practitioner warnings with a stated failure mode (loss of sharpness in fine type) and a stated chemical hazard to the subject, with an instruction to test on an insignificant area first"
      origin: source_stated
  source_stated_problems:
    - "much of the detail of the wood in its top is obscured by direct reflection"
    - "dulling spray can reduce the sharpness of the very detail you are trying to preserve"
  source_stated_remedies:
    - "use a dark- to medium-toned background so less light reflects from it into the family of angles"
    - "move the light source toward the camera"
    - "raise or lower the camera to move the family of angles off the light"
    - "use falloff to darken the part of the background causing the reflection"
    - "put a black card on the tabletop, as close to the subject as the frame allows"
    - "tip the front of the box up on a hidden support"
    - "use a longer lens from farther away to shrink the family of angles"
    - "try a polarizer only after the geometric remedies, and expect it to trade one face's reflection for another's"
    - "use dulling spray only as a last resort, sparingly, and test it on an insignificant area first"
  examples:
    positive: []
    counter:
      - {description: "an antique glossy wooden box whose lid detail is largely obscured by direct reflection", figure_ref: "5.20"}
  intra_source_relations:
    - {relation: qualifies, target: sk_lsmx_0009, note: "the polarizer's position in the order is revised for boxes"}
    - {relation: depends_on, target: sk_lsmx_0006, note: "several rungs of the ladder work by moving the family of angles"}
    - {relation: contradicts, target: sk_lsmx_0035, note: "for a METAL box the same geometry is used to create direct reflection rather than to avoid it"}
