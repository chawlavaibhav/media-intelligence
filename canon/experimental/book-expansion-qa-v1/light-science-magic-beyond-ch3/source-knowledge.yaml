    - "the lens may begin to vignette the image"
  source_stated_remedies:
    - "use a view camera or perspective control lens: camera off centre and outside the family, image plane parallel, lens shifted to re-centre"
    - "aim the camera through a hole in the light source, accepting the hole's reflection"
    - "photograph the metal at an angle from as far away as possible and correct the distortion in postproduction"
