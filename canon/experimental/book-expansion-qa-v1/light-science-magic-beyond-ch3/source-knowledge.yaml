- sk_id: sk_lsmx_0006
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "The family of angles causing direct reflection has grown much larger, and the range of acceptable angles for copy lighting is much smaller."
    - "The same lighting angle that works well when the camera is farther away can cause direct reflection if the camera is closer."
  concept_label: camera_distance_and_focal_length_set_the_size_of_the_family_of_angles
  label_origin: extractor_assigned
  claim: >
    Moving the camera closer to a flat subject, with a correspondingly wider lens to keep the framing,
    enlarges the family of angles that produces direct reflection and shrinks the range of lighting
    angles that avoid it. Moving the camera farther away with a longer lens does the reverse: the
    family shrinks and a good lighting angle becomes easy to find. The consequence is that a lighting
    angle is not portable between set-ups — the same angle that was safe from a distance can produce
    direct reflection from close in. When the room will not allow the lights to move, the problem can
    sometimes be solved by moving the camera instead.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The family of angles is the set of angles over all points of the surface at which a source can
      reflect to the camera; a closer viewpoint subtends a wider spread of those angles, so the family
      widens with proximity and narrows with distance.
  scope:
    domain_discussed_by_source: [photographic_lighting, copy_work]
    conditions: "flat subjects; the source's cases are a copy stand, a museum wall with a 90-degree horizontal angle of view, and a long-lens set-up"
  caveats:
    - text: "extends the live family-of-angles concept (sk_lsm_c003_0013) from a fixed geometry to a variable the photographer controls; chapter 3 defines the family, this chapter makes its SIZE the operative control"
      origin: extractor_observed
    - text: "supported by three lighting diagrams rather than photographs; the diagrams were not opened, so the geometry rests on the prose, which states it explicitly"
      origin: extractor_observed
  source_stated_problems:
    - "the room may make the placement of the lights more difficult than that of the camera"
  source_stated_remedies:
    - "move the camera farther away from the subject and use a correspondingly longer lens to shrink the family of angles"
    - "move the light farther to the side when a close viewpoint has enlarged the family"
  examples:
    positive: []
    counter: []
  intra_source_relations:
    - {relation: qualifies, target: sk_lsmx_0005, note: "there is no fixed safe lighting angle; it depends on viewpoint"}
    - {relation: generalises, target: sk_lsmx_0033, note: "the same control reappears as the effective size of the light on metal"}
    - {relation: depends_on, target: sk_lsmx_0016, note: "moving the camera to control the family also changes perspective distortion"}
