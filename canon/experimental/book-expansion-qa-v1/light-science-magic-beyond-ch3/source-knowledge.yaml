      origin: extractor_observed
    - text: "the practical corollary the source draws is that the white target used to find the family must be REMOVED when lighting for dark metal, because left in place it would reflect general illumination and act as an additional source"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
