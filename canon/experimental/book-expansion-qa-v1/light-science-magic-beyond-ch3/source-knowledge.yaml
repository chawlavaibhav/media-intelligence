- sk_id: sk_lsmx_0003
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "One of the first steps in lighting a scene is to look at the subject and decide what kind of reflection causes the subject to appear the way it does."
    - "The next step is to position the light, the subject, and the camera to make the photograph capitalize on that type of reflection and minimize the others."
  concept_label: the_two_step_method_diagnose_the_governing_reflection_then_engineer_for_it
  label_origin: extractor_assigned
  claim: >
    The source's operative procedure has exactly two steps and a fixed order. First, look at the
    subject and decide which kind of reflection is responsible for how it looks. Second, position the
    light, the subject and the camera so that the photograph capitalizes on that reflection and
    minimizes the others. The source is explicit that "position the light" does not require a studio:
    choosing viewpoint, day and time outdoors performs the identical operation, and studio examples
    are used only because they are controllable enough to demonstrate the point.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because the surface determines the reflection type and the geometry determines whether the
      camera can see it, a lighting decision is made by first identifying the type and then arranging
      the geometry that admits it.
  scope:
