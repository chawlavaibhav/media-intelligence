- sk_id: sk_lsmx_0033
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "the focal length of the lens can also indirectly influence the effective size of the light"
    - "If the metal is exposed identically in the two scenes, the background will be brighter in arrangement A and darker in B, despite the fact that the actual incident light is identical in both scenes!"
    - "if the subject is bright metal, we recommend using a longer lens and getting the camera farther away to allow more freedom in lighting"
  concept_label: lens_choice_sets_how_much_freedom_the_light_has_to_move_on_metal
  label_origin: extractor_assigned
  claim: >
    Two cameras framing a metal subject identically — one far away with a long lens, one close with a
    short one — do not have the same lighting latitude. The distant camera's family of angles is narrow,
    so a soft box is much larger than the family and can be moved a long way without changing the
    metal; the close camera's family is wide, the same soft box only just fills it, and moving the light
    back would blacken the edges of the metal. With the metal exposed identically in both, the
    background is brighter in the distant arrangement and darker in the close one even though the
    incident light is identical. The source therefore recommends, wherever the camera position is free
    and the subject is bright metal, using a longer lens from farther away to maximise lighting freedom.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The lens does not change the light, but the viewpoint it permits changes the width of the family
      of angles, and the ratio of the source's size to the family's width is what determines how far
      the source can be moved before it stops filling the family.
  scope:
    domain_discussed_by_source: [photographic_lighting, product_rendering, metal_surfaces]
    conditions: "bright metal where the camera position is not otherwise constrained"
  caveats:
    - text: "the source says this is often surprising even to highly experienced photographers, which marks it as the counter-intuitive result of the chapter"
      origin: source_stated
    - text: "the recommendation is bounded by the coupling noted in chapter 5 — viewpoint also sets perspective distortion, and sometimes there is not much choice about where to put the camera"
      origin: source_stated
  source_stated_problems:
    - "We cannot move the light much farther away without the edges of the metal becoming black."
  source_stated_remedies:
    - "use a longer lens and a more distant viewpoint when the subject is bright metal and the camera position is free"
