- sk_id: sk_lsmx_0017
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "The closer a light is to the subject, the softer the shadows are; the farther a light is from the subject, the harder the shadows become."
    - "Moving a light farther from the subject increases its contrast by reducing the range of angles from which the rays can strike the subject."
    - "The sun behaves as a small light source to people on Earth because it is so far away."
  concept_label: effective_light_size_is_set_by_distance_not_only_by_physical_size
  label_origin: extractor_assigned
  claim: >
    Shadow hardness is governed by the size of the source relative to the subject, and distance is one
    of the two ways to change it. Moving a light closer makes it effectively larger and its shadows
    softer; moving it away makes it effectively smaller and its shadows harder, because fewer of its
    rays reach the subject from different directions. The sun is a small source for this reason.
    Diffusing screens, umbrellas, soft boxes and bounce cards all enlarge a small light and, the
    source says, are interchangeable in effect, so the choice among them is one of convenience: a
    framed diffusion sheet close in for a small subject, a bounced ceiling for a large one, an overcast
    day or open shade outdoors.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A large source illuminates the subject from many directions at once, so the shadow edge is a
      gradual transition; a distant source's rays arrive nearly parallel, so the transition is abrupt.
  scope:
    domain_discussed_by_source: [photographic_lighting]
    conditions: "any subject casting a shadow; indoors and out"
  caveats:
    - text: "the source anticipates a counter-observation and answers it: photographers using portable strobes in small rooms find that moving the light back SOFTENS the shadow, because more rays then bounce from the surrounding walls and the room, being larger than the strobe, becomes the effective source — so the principle is not contradicted"
      origin: source_stated
    - text: "the claim that all enlargement devices are equivalent in effect is a practitioner assertion, offered as licence to choose on convenience rather than as a measured equivalence"
      origin: extractor_observed
    - text: "a subject in open shade lit only by sky can be quite blue without compensation"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
