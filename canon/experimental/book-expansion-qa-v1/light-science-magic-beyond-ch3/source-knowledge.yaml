- sk_id: sk_lsmx_0026
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "One of the first, and most important, decisions that we have to make when we photograph a piece of metal is how bright we want it to be."
    - "This is a critical step because it leads to two exactly opposite lighting set-ups."
    - "the camera position is essential in any lighting diagram involving metal"
  concept_label: bright_or_dark_is_the_first_metal_decision_and_yields_two_opposite_set_ups
  label_origin: extractor_assigned
  claim: >
    Before lighting metal, decide how bright it should appear. If bright, fill the family of angles
    that produces direct reflection; if dark, put the light anywhere else. Either way the first
    physical step is the same — find the family — but the two answers lead to exactly opposite
    arrangements, so the decision cannot be deferred. Because the family depends on where the camera
    is, a lighting diagram for metal is meaningless without the camera in it: the camera-to-subject
    relationship is at least as important as the subject.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Polished metal is visible to the camera only through direct reflection, and direct reflection is
      available only from inside the family of angles, which is defined jointly by the camera position
      and the subject; so the light's position relative to that family fully determines the metal's
      tone.
  scope:
    domain_discussed_by_source: [photographic_lighting, product_rendering, metal_surfaces]
    conditions: "flat polished metal, extended by the source to metal of any shape"
  caveats:
    - text: "applies the live chapter-3 two-sided placement rule (sk_lsm_c003_0014) to a specific surface class; the new content is the claim that the tonal DECISION must come first because the set-ups are mutually exclusive"
      origin: extractor_observed
