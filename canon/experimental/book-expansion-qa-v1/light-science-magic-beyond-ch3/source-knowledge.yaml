  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The leather produces little diffuse reflection but a great deal of direct reflection. Direct
      reflection is available only from inside the family of angles, so a source large enough to fill
      that family lights the whole surface through the channel the surface actually has, raising the
      recorded highlight without changing the incident light or the exposure.
