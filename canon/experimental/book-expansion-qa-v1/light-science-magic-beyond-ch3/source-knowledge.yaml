- sk_id: sk_lsmx_0028
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "because polished metal produces almost no diffuse reflection, light coming from any other angle will have practically no effect on the metal, regardless of how bright it is or how long the exposure"
  concept_label: light_outside_the_family_cannot_reach_polished_metal_at_any_power_or_duration
  label_origin: extractor_assigned
  claim: >
    Light arriving from outside the family of angles has practically no effect on polished metal, no
    matter how bright the light is or how long the exposure. This makes the family a hard boundary
    rather than a matter of degree, and it is the reason the two metal set-ups are cleanly separable:
    the metal's tone can be set entirely by what occupies the family, while everything outside it acts
    only on the rest of the scene.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Diffuse reflection is the channel through which off-axis light would reach the camera, and
      polished metal has almost none of it; the direct channel is available only from inside the
      family. So off-family light has no route to the sensor via the metal.
  scope:
    domain_discussed_by_source: [photographic_lighting, product_rendering, metal_surfaces]
    conditions: "brightly polished metal only; the source is explicit that dulling spray breaks this by adding diffuse reflection"
  caveats:
