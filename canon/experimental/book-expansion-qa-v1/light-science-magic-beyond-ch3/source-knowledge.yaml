- sk_id: sk_lsmx_0010
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "The solution is to position the light at a very shallow angle to the surface so that it skims across it"
    - "This gives each particle of texture—it gives them, in other words—both a highlight side and a shadow side."
    - "small light sources produce sharply defined shadows"
  concept_label: raking_light_reveals_texture_on_light_toned_diffuse_surfaces
  label_origin: extractor_assigned
  claim: >
    A light-toned, strongly diffuse subject photographed with the light on the camera shows almost no
    texture, because the brightness of a diffuse reflection does not depend on the angle of
    illumination: light striking the side of a texture particle returns to the camera almost as
    brightly as light striking its top. The remedy is a very shallow, skimming light that gives each
    particle a highlight side and a shadow side. The source adds that the source should be as small as
    possible, because small sources produce sharply defined shadows, and a sharp shadow is more likely
    to survive the optical limits of resolving very small texture. The uneven illumination this
    shallow angle causes is cured the same way as in copy work: move the light farther away.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Texture is read from the tonal difference between the lit and unlit faces of each particle.
      Diffuse reflection is angle-independent, so frontal light gives both faces the same brightness
      and the difference vanishes; a grazing angle restores it by shadowing one face.
  scope:
    domain_discussed_by_source: [photographic_lighting, surface_rendering]
    conditions: "medium- and light-toned subjects that reflect mostly diffusely; the source's example is a light-blue sponge"
  caveats:
