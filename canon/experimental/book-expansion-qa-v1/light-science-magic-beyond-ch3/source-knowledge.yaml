- sk_id: sk_lsmx_0012
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "If we cannot get significant diffuse reflection from the leather surface, we will try to produce direct reflection instead."
    - "the theory that predicts the best way to light the sponge also says that our new lighting arrangement is the worst possible way to light the leather!"
