      origin: extractor_observed
    - text: "when the metal is kept DARK instead, the source says an incident reading, a grey-card reading or a compensated reading of the white paper are all good, because with no direct reflection and no important dark subject in shadow the extremes do not have to be thought about"
      origin: source_stated
    - text: "the two-to-three-stop figure is offered as a reasonable range, with the exact value explicitly a creative decision"
      origin: source_stated
  source_stated_problems:
