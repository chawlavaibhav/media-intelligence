- sk_id: sk_lsmx_0035
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "Each surface has its own family of angles to consider. The difference is that each family of angles faces a different direction and we have to deal with them all at once."
    - "That means the table surface is the light source for the front of the box, whether we like it or not."
    - "the background needs to fill the family of angles reflected by the metal, not just the area the camera sees"
  concept_label: on_a_metal_box_the_table_becomes_the_light_source_and_a_light_background_is_the_easiest_answer
  label_origin: extractor_assigned
  claim: >
    A metal box shows up to three faces, each with its own family of angles facing a different
    direction, all of which must be satisfied at once. Because a polished metal box produces only
    direct reflection and reads as black without it, the usual aim is to fill every family rather than
    to avoid any — the opposite of the treatment a glossy non-metallic box gets. The top is easy and is
    treated as flat metal. The sides are not: the family defined by the front face falls on the table,
    so the table is the light source for the front of the box whether or not the photographer wants it,
    and no reflector can serve that face without appearing in the picture. Brightly polished metal boxes
    almost always show the resulting defect — the line where a reflector meets the table, or the bottom
    of the box merging into a dark table. The source's easiest answer is a light-toned background: the
    background itself becomes the source for much of the visible metal, and the requirement is that the
    background fill the family of angles the metal reflects, not merely the area the camera sees.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Each planar face reflects a different region of space to the camera. The region reflected by a
      vertical front face is the horizontal surface in front of it, so whatever occupies the table is
      that face's source.
  scope:
    domain_discussed_by_source: [photographic_lighting, product_rendering, metal_surfaces]
    conditions: "three-dimensional metal or metallised subjects; the source's examples are a foil-wrapped gift box"
  caveats:
    - text: "the source notes explicitly that this theory is identical to the glossy-box theory of chapters 4 and 5 but that the difference in material makes it likely to be applied the OPPOSITE way — create the direct reflection instead of avoiding it. The same authors inverting their own earlier prescription because the surface class changed."
      origin: source_stated
    - text: "the source concedes the defect is often unavoidable — if the box is truly mirror-like and the bottom must show, the reflector-to-table line will be visible and objectionable unless the reflector touches the box"
      origin: source_stated
    - text: "if good lighting for the metal box were the only objective the source says it would always use a light-toned background, and that art and emotion impose other requirements"
      origin: source_stated
  source_stated_problems:
    - "The bottom of the box nearly disappears into the dark table."
    - "We cannot use a reflector card, or any other light source, for the sides of the box without it showing in the scene."
  source_stated_remedies:
    - "use a light-toned background large enough to fill the family of angles the metal reflects, not merely the image area"
    - "crop as close to the box as possible so the reflector can be placed closer"
  examples:
    positive:
      - {description: "a foil-wrapped box on a light-grey surface: the front face is evenly lit by the background itself and the whole box reads bright and continuous", figure_ref: "6.24"}
    counter:
      - {description: "the same box on a dark table: the front face and bottom edge sink into the background and the box loses its base", figure_ref: "6.23"}
  intra_source_relations:
    - {relation: contradicts, target: sk_lsmx_0023, note: "the glossy-box ladder avoids direct reflection; the metal box seeks it"}
    - {relation: specialises, target: sk_lsmx_0025, note: "preparing the environment, for a three-dimensional case"}
    - {relation: generalises, target: sk_lsmx_0036, note: "the transparent and glossy backgrounds are the alternatives when a light background is unwanted"}
