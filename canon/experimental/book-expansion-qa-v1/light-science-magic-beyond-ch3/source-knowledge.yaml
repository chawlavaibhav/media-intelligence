- sk_id: sk_lsmx_0009
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "We first position the lights for even illumination, without concern about whether we are creating direct reflection."
    - "Polarizing the light source has serious drawbacks and is a solution to avoid whenever possible."
    - "the actual exposure reduction is likely to be four to six stops"
  concept_label: cross_polarizing_source_and_lens_buys_freedom_from_geometry_at_a_large_cost
  label_origin: extractor_assigned
  claim: >
    When the working space makes even and glare-free illumination simultaneously impossible, the
    order of operations can be inverted: position the lights purely for even illumination, ignoring
    direct reflection, then put polarizing filters on the lights with their axes toward the camera so
    that the direct reflection is polarized, and a polarizer on the lens at 90 degrees to remove it.
    In theory the camera then sees only diffuse reflection; in practice some polarized reflection
    survives because no polarizer is perfect, and the source says the defect is negligible in all but
    the worst cases. The source is emphatic that this is a last resort: understanding and controlling
    the size and angle of the source makes it unnecessary in most situations, and some photographers
    go for years without needing it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Metal-free copy surfaces produce a mixture of direct and diffuse reflection; polarizing the
      source makes the whole direct component polarized, and a crossed lens polarizer then removes
      that component and leaves the diffuse one.
  scope:
    domain_discussed_by_source: [photographic_lighting, copy_work]
    conditions: "cases the source describes as deliberately conceived to be impossible by geometry alone"
  caveats:
