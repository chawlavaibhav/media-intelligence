- sk_id: sk_lsmx_0025
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "Brightly polished metal produces almost nothing but un-polarized direct reflection."
    - "This constancy makes metal a real joy to photograph. It is predictable. It plays by the rules. We can tell before we begin to light the scene what size the light needs to be."
    - "when we photograph metal, we do not make a picture of just the metal itself. We also make a picture of its surroundings, or environment, as it is reflected in the metal"
  concept_label: polished_metal_is_a_nearly_pure_direct_reflector_so_you_photograph_its_environment
  label_origin: extractor_assigned
  claim: >
    Brightly polished metal produces almost nothing but un-polarized direct reflection, and the source
    treats that purity as the reason metal is easy rather than hard. Because the surface behaves as a
    mirror, photographing metal means photographing whatever surrounds it, so a suitable environment
    must be prepared before the exposure. Because the behaviour is uncontaminated by other reflection
    types, the required light size can be worked out before any light is switched on, and a set-up that
    cannot work is visible early rather than after hours of trial. The source adds that this is exactly
    why metal is a teaching subject: it is where direct reflection can be seen behaving on its own.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A direct reflection is a mirror image of whatever lies within the family of angles, and polished
      metal produces almost nothing else, so the recorded appearance of the metal is a map of its
      surroundings and is fully determined by geometry.
  scope:
    domain_discussed_by_source: [photographic_lighting, product_rendering, metal_surfaces]
    conditions: "brightly polished metal; the source's examples are a spatula blade, a metal-wrapped box, guitar hardware and a mirrored sphere"
  caveats:
    - text: "rests on the live chapter-3 account of direct reflection as a mirror image of the source (sk_lsm_c003_0010) and on the live claim that a shiny surface reports the size of its source (sk_lsm_c003_0012); neither is re-extracted"
      origin: extractor_observed
    - text: "the purity claim is 'almost nothing but', not 'nothing but'; the source relies on the approximation and elsewhere says no real surface produces a perfect direct reflection"
      origin: source_stated
    - text: "the opening framing — that students find metal cruel and that it is in fact easy — is a pedagogical assertion about learners, not about optics"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
