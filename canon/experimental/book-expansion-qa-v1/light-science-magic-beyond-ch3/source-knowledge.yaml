- sk_id: sk_lsmx_0001
  source_id: light-science-magic-beyond-ch3
  source_terms:
    - "our brains cannot edit an image of a scene as well as they can the scene itself"
    - "When we make a picture we have to consciously do some of the editing that other observers do unconsciously."
  concept_label: the_camera_does_not_inherit_the_brains_editing_of_a_scene
  label_origin: extractor_assigned
  claim: >
    Every surface produces diffuse, direct and polarized reflection in some mixture, but a viewer
    standing in front of the scene is not conscious of all of it: the brain suppresses reflection
    that is distracting or trivial and promotes whatever is needed to comprehend the scene, so the
    psychological image differs from the optical one. That editing does not survive into a
    photograph. Defects invisible in the room become obvious in the picture. The photographer must
    therefore perform consciously, at the set, the editing that an observer of the scene performs
    unconsciously.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The brain edits a live scene but cannot edit a picture of one to the same degree, so
      reflections it would have suppressed in the room are fully present to a viewer of the image.
      The source states psychologists have not fully explained why, and that movement is part of it.
  scope:
    domain_discussed_by_source: [photographic_lighting, surface_rendering]
    conditions: "any photographed scene; the source's examples are studio still life"
  caveats:
    - text: "the source explicitly declines to explain why pictures reveal what the scene conceals, calling it a question for another book, and offers the fact rather than the mechanism behind it"
      origin: source_stated
    - text: "the psychological claim is asserted from practitioner experience of spotting defects in images, not from a study the source cites"
      origin: extractor_observed
  source_stated_problems:
    - "defects we could not see at all when we carefully examined the original scene"
  source_stated_remedies:
    - "consciously do some of the editing that other observers do unconsciously"
  examples:
