- scs_id: scs_mla_003
  source_id: hopkins-my-life-in-advertising
  label: the_screen_for_whether_a_product_can_be_advertised_at_all
  label_origin: extractor_assigned
  system_type: decision_framework
  system_type_origin: extractor_inferred
  description: >
    A set of conditions the source applies before any campaign is designed, and on which it reports
    refusing most propositions brought to it: is there a real or statable advantage; is the product
    standard or distinguishable; is the demand a habit that already exists or one that would have
    to be created; is the affected class large enough to reach economically; is the repeat cycle
    short enough for acquisition cost to be recovered; and is there a theory to build on at all.
    Failing these, the source's stated action is to refuse rather than to advertise well.
  whole_system_claim:
    text: >
      The source treats campaign quality as unable to rescue a product that fails these conditions,
      and treats refusal as the correct professional act rather than a lost opportunity. Read as a
      set, the conditions are largely economic rather than creative: three of them are arithmetic
      about acquisition cost against lifetime return, and the creative conditions only matter once
      the arithmetic closes.
    origin: extractor_synthesis
    interpretation_basis: >
      Every condition is stated by the source, but in six different chapters and never as a list.
      The source states the refusal ratio (p. 131), the advantage condition (pp. 77-78), the
      standard-product condition (p. 103), the habit condition (pp. 147-148), the cost conditions
      (pp. 185-186, 191-192) and the theory condition (pp. 193-195). Assembling them into one
      pre-campaign screen, and the observation that the screen is mostly arithmetic, are both the
      extractor's. The source never says these are the criteria the advisory board applied.
    source_ref: null
  members:
    - {sk_ref: sk_mla_0037, role_in_system: outcome, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0017, role_in_system: condition, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0024, role_in_system: condition, order: 3, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0022, role_in_system: condition, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0042, role_in_system: condition, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0066, role_in_system: condition, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_mla_0068, role_in_system: condition, order: 7, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0069, role_in_system: condition, order: 8, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0056, role_in_system: exemption, order: 9, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0033, role_in_system: failure_consequence, order: 10, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0029, role_in_system: escape_route, order: 11, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - {from: sk_mla_0066, to: sk_mla_0068, nature: "the repeat-cycle screen is a special case of the acquisition-cost rule", origin: extractor_inferred}
      - {from: sk_mla_0017, to: sk_mla_0029, nature: "where no real advantage exists, a statable one built from figures can substitute", origin: source_stated}
    tradeoffs:
      - between: [sk_mla_0066, sk_mla_0056]
        nature: "a slow repeat cycle disqualifies a product unless auxiliary lines carry the profit, which the source demonstrates but never offers as the answer to its own screen"
        origin: extractor_inferred
        source_ref: null
    conflicts:
      - between: [sk_mla_0022, sk_mla_0042]
        nature: >
          The source claims to have moved most of a market off a household habit in one chapter and
          states that habits cannot be changed profitably in paid print in another. Both are its own
          accounts of its own campaigns and it never addresses the contradiction. This conflict is
          load-bearing for the screen: as stated, it is not decidable whether a habit-displacement
          proposition passes.
        origin: extractor_inferred
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, anecdotal, outcome_claimed, mechanism_given, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      This system is substantially OURS. The source never presents a screen, a checklist or an
      order of evaluation. Every member is a real and separately stated source claim, but the claim
      that they form one pre-campaign decision framework is a hypothesis about how the source
      worked, inferred from the fact that it reports refusing nineteen propositions in twenty and
      gives, elsewhere, exactly these grounds. The unresolved conflict between two of the members is
      recorded rather than smoothed over, and it means the framework as assembled does not decide
      every case.
  provenance:
    chapter: "Twelve; Seven; Nine; Thirteen; Seventeen; Eighteen"
    section: null
    page_start: 131
    page_end: 195
    source_support: text

- scs_id: scs_mla_004
  source_id: hopkins-my-life-in-advertising
  label: the_offer_forms_and_their_category_dependence
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    The source's several rules about how a trial or premium should be framed — free, bought for the
    buyer at retail, charged for, half-price, described gift, undisclosed gift, guaranteed purchase
    — none of which holds on its own, because each is qualified by the others and by the product
    category.
  whole_system_claim:
    text: >
      Read together, these rules say that the trial device is not a single variable with a single
      sign. The buyer must expend effort but not money; the advertiser should buy the product
      rather than give it, except where giving is what the category expects; the word free
      multiplies readership in one category and divides results by four in another when featured;
      a described premium selects and an undisclosed one does not; and a half-price offer, which
      looks like a milder version of a free offer, does not work at all because it addresses price
      rather than conviction. Any one of these rules quoted alone will be wrong roughly as often as
      it is right.
    origin: extractor_synthesis
    interpretation_basis: >
      Each rule is explicitly stated by the source, and the source itself states the strongest
      qualification — the free-offer reversal between food and hygiene (p. 154), which it presents
      as a discovery about psychology. What the source never does is put the rules side by side and
      note that they qualify one another, or draw the conclusion that its trial-offer doctrine is
      category-conditional rather than general. That reading is the extractor's, and it is the
      reason this system exists rather than leaving the members to be retrieved singly.
    source_ref: null
  members:
    - {sk_ref: sk_mla_0004, role_in_system: general_rule, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0026, role_in_system: qualifier, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_mla_0044, role_in_system: qualifier, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_mla_0038, role_in_system: qualifier, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_mla_0050, role_in_system: boundary_condition, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_mla_0010, role_in_system: qualifier, order: 6, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0013, role_in_system: qualifier, order: 7, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0011, role_in_system: governing_principle, order: 8, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - {from: sk_mla_0050, to: sk_mla_0038, nature: "the free-versus-bought choice is decided by the category, not by a general rule", origin: extractor_inferred}
    tradeoffs:
      - between: [sk_mla_0026, sk_mla_0044]
        nature: "effort demanded selects for interest; money demanded destroys response; the source states both and never marks the boundary"
        origin: extractor_inferred
        source_ref: null
      - between: [sk_mla_0038, sk_mla_0050]
        nature: "buying the product for the buyer signals confidence in most categories and reads as trading rather than benefiting in hygiene"
        origin: source_stated
        source_ref: {chapter: "Fourteen — Pepsodent", page_start: 154}
    conflicts: []
  source_warns_against_isolated_use: true
  source_warning_ref: {chapter: "Fourteen — Pepsodent", page_start: 154, note: "the source states that such things are not easy to discover and that the same device reversed sign between categories"}
  evidence:
    characteristics: [explicitly_stated, empirical_within_source, controlled_comparison, practitioner_assertion, outcome_claimed, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The members and the key reversal are the source's. The grouping is OURS, and so is the
      conclusion that the trial-offer rules are category-conditional as a class rather than in the
      single case the source noticed. This system exists chiefly as a retrieval guard: retrieving
      any one of these rules in isolation reproduces exactly the error the source spent money
      discovering.
  provenance:
    chapter: "Fourteen — Pepsodent; Twelve; Thirteen; Nine; Two"
    section: null
    page_start: 154
    page_end: 154
    source_support: text

- scs_id: scs_mla_005
  source_id: hopkins-my-life-in-advertising
  label: the_three_interests_and_the_practitioners_position_within_them
  label_origin: extractor_assigned
  system_type: priority_order
  system_type_origin: source_stated
  description: >
    The source's own numbered ordering of the three parties an advertising writer serves —
    publisher first, agency second, advertiser third — together with the risk and reward asymmetry
    that follows from a publisher-paid commission, and the consequence the source draws from it for
    the practitioner's career.
  whole_system_claim:
    text: >
      The ordering and the structural consequences are the same fact seen twice. Because the
      publisher pays the commission and the agency funds the development, the advertiser is last in
      obligation and first in eventual gain; because the practitioner is anonymous and paid on
      expenditure rather than on equity, the value he creates accrues elsewhere; and because an
      established business no longer needs him, he loses the account he built and must keep
      starting new ventures. The source's stated remedy is to hold equity in what he creates.
    origin: source_explicit
    interpretation_basis: null
    source_ref: {chapter: "Sixteen — Reasons for Success; Eighteen — My Great Mistake", page_start: 167, page_end: 197, note: "the source numbers the three interests explicitly at pp. 167-172 and states the career consequence at pp. 190-193"}
  members:
    - {sk_ref: sk_mla_0059, role_in_system: structure, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_mla_0067, role_in_system: consequence, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_mla_0012, role_in_system: proximate_cause, order: 3, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0028, role_in_system: proximate_cause, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0056, role_in_system: remedy, order: 5, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: source_numbered
      origin: source_stated
    dependencies:
      - {from: sk_mla_0059, to: sk_mla_0067, nature: "the commission structure is what determines who captures the value created", origin: source_stated}
    tradeoffs: []
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, anecdotal, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The ordering and the whole-system claim are the source's, stated in its own numbered form in
      chapter 16 and carried into chapter 18. What is OURS is the inclusion of the two proximate
      causes of account loss as members, and the reading of the auxiliary-line economics as the
      remedy the source arrived at. The system is also the most self-interested material in the
      book — it is one man's account of why he should have been paid differently — and that should
      be visible whenever it is retrieved.
  provenance:
    chapter: "Sixteen — Reasons for Success; Eighteen — My Great Mistake"
    section: null
    page_start: 167
    page_end: 197
    source_support: text
