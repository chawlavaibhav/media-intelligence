# SourceConceptSystem — Claude C. Hopkins, "My Life in Advertising" (Harper & Brothers, 1927)
# source_id: hopkins-my-life-in-advertising
# EXPERIMENTAL — NOT LIVE CANON.
#
# Five systems. Two are close to source-stated (scs_mla_001 and scs_mla_005, both of which the
# source presents as connected wholes in chapters 16 and 17); three are extractor groupings over
# material the source scatters across campaign narratives, and each says so in
# `system_level_uncertainty`. Nothing here asserts anything about any other source.

- scs_id: scs_mla_001
  source_id: hopkins-my-life-in-advertising
  label: the_traced_return_method_and_its_refusal_rule
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    The source's account of how advertising knowledge is made: a countable response is attached to
    each advertisement, alternatives are compared on cost and result, a cheap local test is run
    before any commitment, the test is read on repeat purchase rather than first response, the
    weekly reporting loop caps the cost of a wrong theory, and evidence not obtained this way is
    refused. The refusal rule is what makes the rest a method rather than a habit.
  whole_system_claim:
    text: >
      The parts are load-bearing on each other. The keyed response makes comparison possible; the
      comparison makes a principle; the refusal rule excludes the untraced successes that would
      otherwise swamp the principles; the small test bounds the cost of being wrong; the
      repeat-purchase criterion prevents a strong first response from being mistaken for success;
      and the always-experiment clause prevents the resulting principles from hardening. Remove the
      refusal rule and the system degenerates into anecdote collection, which is what the source
      says most advertising theory is. Remove the repeat-purchase criterion and the system passes a
      campaign that destroys its client, which the source reports happening.
    origin: extractor_synthesis
    interpretation_basis: >
      The source states each element separately and states two of the linkages itself: that safe
      principles are evolved only by those who know with reasonable exactness what the advertising
      does (p. 176), and that regardless of principles one must always experiment (p. 177). It does
      not present the elements as one interlocking system, and it never draws the connection
      between the Mitchell disaster (p. 119-120) and the repeat-purchase criterion (p. 135) — that
      connection is the extractor's. The claim that the parts fail without each other is therefore
      synthesis over material the source supplies but does not assemble.
    source_ref: null
  members:
    - {sk_ref: sk_mla_0061, role_in_system: foundation, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_mla_0062, role_in_system: refusal_rule, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_mla_0001, role_in_system: constraint, order: 3, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0021, role_in_system: assumption, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0039, role_in_system: criterion, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0020, role_in_system: worked_instance, order: 6, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0046, role_in_system: operational_loop, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_mla_0053, role_in_system: principal_variable, order: 8, membership_origin: source_stated}
    - {sk_ref: sk_mla_0047, role_in_system: general_rule, order: 9, membership_origin: source_stated}
    - {sk_ref: sk_mla_0045, role_in_system: worked_instance, order: 10, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0054, role_in_system: worked_instance, order: 11, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0051, role_in_system: calibration_discipline, order: 12, membership_origin: source_stated}
    - {sk_ref: sk_mla_0003, role_in_system: rival_knowledge_route, order: 13, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0005, role_in_system: motivation, order: 14, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0041, role_in_system: worked_instance, order: 15, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: causal
      origin: extractor_inferred
    dependencies:
      - {from: sk_mla_0061, to: sk_mla_0062, nature: "the method is only a method because untraced evidence is refused", origin: source_stated}
      - {from: sk_mla_0001, to: sk_mla_0021, nature: "small-test caution is worthless unless the small test predicts", origin: extractor_inferred}
      - {from: sk_mla_0046, to: sk_mla_0053, nature: "the loop mostly varies the headline because the body is held complete", origin: source_stated}
      - {from: sk_mla_0039, to: sk_mla_0021, nature: "the repeat criterion is what licenses the scale-up", origin: extractor_inferred}
    tradeoffs:
      - between: [sk_mla_0003, sk_mla_0061]
        nature: "unmediated personal contact versus keyed measurement as the route to knowledge; the source uses both and never ranks them"
        origin: extractor_inferred
        source_ref: null
      - between: [sk_mla_0047, sk_mla_0028]
        nature: "test everything new against keep what is proved; the source states both and reconciles them only by requiring a local test before any change"
        origin: source_stated
        source_ref: {chapter: "Ten — Automobile Advertising", page_start: 117}
    conflicts:
      - between: [sk_mla_0062, sk_mla_0020]
        nature: >
          The refusal rule disqualifies untraced success narratives as evidence, and the book's own
          campaign narratives are almost entirely untraced success narratives. The source does not
          apply its rule to itself.
        origin: extractor_inferred
  source_warns_against_isolated_use: true
  source_warning_ref: {chapter: "Seventeen — Scientific Advertising", page_start: 176, page_end: 177, note: "the source warns that methods succeeding in one line cannot be applied to another and that one must always experiment regardless of principles"}
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, repeated_within_source, mechanism_given, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The members are individually well supported and four of them are grouped by the source itself
      in chapter 17. The claim that they constitute one interlocking system whose parts fail
      without each other is OURS, and so is the identified conflict between the refusal rule and
      the book's own evidential practice. The source presents chapter 17 as a list of principles,
      not as a system diagram.
  provenance:
    chapter: "Seventeen — Scientific Advertising, with members drawn from chapters 1, 8, 12, 13, 14 and 15"
    section: null
    page_start: 175
    page_end: 177
    source_support: text

- scs_id: scs_mla_002
  source_id: hopkins-my-life-in-advertising
  label: the_coupon_introduction_sequence
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: source_stated
  description: >
    The source's named plan for introducing a low-price packaged good: announce the buying offer
    above story advertisements, run the story so desire is created, mail advance proofs to the
    trade so stocking becomes the retailer's own interest, publish the coupon page, let the earned
    trial occur, and read the campaign on repeat sales. Distribution is obtained without a sales
    force at any point.
  whole_system_claim:
    text: >
      The order is the mechanism. The pre-announcement multiplies readership of the story; the
      story creates the desire the coupon then converts; the advance proof reaches the trade before
      demand arrives, so the retailer stocks in self-defence rather than being sold to; and the
      coupon makes the sample earned rather than pressed on the buyer. Run out of order — sample
      first, or coupon without story — the source reports each element failing on its own.
    origin: extractor_synthesis
    interpretation_basis: >
      The source presents the plan as a plan, states that it originated it and used it in many of
      its best campaigns, and gives the steps in order at pp. 133-134. It separately reports the
      failure of unsequenced sampling (pp. 105, 146) and the trade-notification step (pp. 104,
      136-137). The claim that the ordering itself carries the effect, and that each element fails
      when detached, is assembled by the extractor from those separate reports rather than stated
      by the source as a property of the sequence.
    source_ref: {chapter: "Twelve — Early History of Palmolive", page_start: 133, page_end: 134}
  members:
    - {sk_ref: sk_mla_0038, role_in_system: step, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_mla_0025, role_in_system: step, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_mla_0026, role_in_system: constraint, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_mla_0044, role_in_system: constraint, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0039, role_in_system: exit_criterion, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0035, role_in_system: governing_principle, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_mla_0036, role_in_system: alternative_route, order: 7, membership_origin: extractor_inferred}
    - {sk_ref: sk_mla_0008, role_in_system: alternative_route, order: 8, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: procedural
      origin: source_stated
    dependencies:
      - {from: sk_mla_0025, to: sk_mla_0035, nature: "the coupon exists to make consumer demand pull distribution rather than buying it", origin: source_stated}
      - {from: sk_mla_0038, to: sk_mla_0026, nature: "the pre-announcement is what makes the later sample requested rather than pressed", origin: extractor_inferred}
    tradeoffs:
      - between: [sk_mla_0026, sk_mla_0044]
        nature: "effort demanded of the buyer selects for interest, but any money demanded collapses response; the admissible band is narrow and the source never states its edges"
        origin: extractor_inferred
        source_ref: null
      - between: [sk_mla_0035, sk_mla_0008]
        nature: "consumer pull versus trade privilege as the route to distribution; the source uses both in different eras and insists you cannot pay for both"
        origin: source_stated
        source_ref: {chapter: "Eleven — Tire Advertising", page_start: 129, page_end: 130}
    conflicts: []
  source_warns_against_isolated_use: true
  source_warning_ref: {chapter: "Twelve — Early History of Palmolive", page_start: 134, page_end: 135, note: "the source states that sampling detached from created interest is a very bad plan and that products handed out without asking lose respect"}
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, anecdotal, outcome_claimed, empirical_within_source, mechanism_given, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The sequence itself is the source's, presented as a named plan it says it originated. What is
      OURS is the inclusion of the two alternative distribution routes as members, the framing of
      the effort-versus-price band as a trade-off internal to the system, and the claim that each
      element fails when detached from the order.
  provenance:
    chapter: "Twelve — Early History of Palmolive; Nine — The Start of My Seventeen Years"
    section: null
    page_start: 133
    page_end: 137
