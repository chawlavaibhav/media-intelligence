- sk_id: sk_mla_0002
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "I do not know the reactions of the rich"
    - "the common people"
    - "There is another field, ably occupied. It is typified by the advertising of Cadillac cars."
    - "they, in advertising, form 95 per cent of our customers"
  concept_label: author_scopes_his_own_knowledge_to_mass_market_goods
  label_origin: extractor_assigned
  claim: >
    The source explicitly limits the domain over which it claims competence. It states that it
    knows the wants and reactions of ordinary wage-earning purchasers and does not know those of
    wealthy purchasers, that it would expect to fail if it tried to advertise a Rolls-Royce,
    Tiffany or a Steinway piano, and that the exclusive-appeal field typified by Cadillac
    advertising is a real and ably occupied field that it has deliberately stayed out of. Every
    campaign it devises is aimed at a member of what it calls the vast majority.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Persuasive appeals depend on knowing what a specific class of buyer wants and fears; the
      source holds that this knowledge comes only from contact with that class, and it has had
      contact with one class and not the other.
  scope:
    domain_discussed_by_source: [advertising, consumer_packaged_goods]
    conditions: "mass-market products bought by wage-earning American households in the 1890s-1920s"
  caveats:
    - text: >
        The source states this limit as a fact about itself, not as a claim that exclusive-appeal
        advertising cannot work. It says the Cadillac field is "ably occupied".
      origin: source_stated
    - text: >
        This is the single most important boundary condition on the whole book, and it is easy to
        lose. Nearly every other principle in this source was derived inside this scope and the
        source nowhere claims it holds outside it.
      origin: extractor_observed
    - text: >
        The surrounding passages carry 1920s American class assumptions — "the common people",
        "simple folks", "plebeian" — which are the source's own framing of its audience and are
        recorded here as period framing, not as a taxonomy of buyers.
      origin: extractor_observed
  source_stated_problems:
    - "The higher we ascend the farther we proceed from ordinary humanity. That will not do in advertising."
  source_stated_remedies:
    - "I have confined my appeals to the 'common people,' to the products which they buy"
  examples:
    positive:
      - {description: "the source names Rolls-Royce, Tiffany and Steinway as lines it expects it would fail on", figure_ref: null}
    counter:
      - {description: "Cadillac advertising, named as a legitimate field the source excludes itself from", figure_ref: null}
  intra_source_relations:
    - {relation: qualifies, target: sk_mla_0043, note: "the same class logic that governs medium choice governs the whole book's scope"}
    - {relation: qualifies, target: sk_mla_0060, note: "the appeal-to-the-majority reasoning is scoped here"}
