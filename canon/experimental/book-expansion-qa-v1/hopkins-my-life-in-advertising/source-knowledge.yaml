    other forms. On competing with editorial its argument is about the composition rather than the
    volume of attention: an advertisement built to rival the stories, news, pictures or cartoons may
    win attention but not valuable attention, because most of the people it attracts have no
    interest in the subject. It adds that any product worth advertising, rightly presented, has more
