  concept_label: transfer_the_purchase_risk_from_the_buyer_to_the_seller
  label_origin: extractor_assigned
  claim: >
    The source's signature commercial move is to remove the buyer's risk entirely and carry it
    itself, and it claims the resulting offer is one no reasonable person refuses. It reports
    building this into successively stronger forms: a druggist-signed money-back warrant on a
    remedy; a warrant covering a five-dollar lot so the single-bottle purchase was underwritten;
    and finally paying for the first fifty-cent bottle outright and then warranting the six that
    followed. It states as a general finding that very few people cheat a seller who offers a
    square deal, that removing restrictions and saying "we trust you" makes people justify the
