- sk_id: sk_mla_0035
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "My idea is that we cannot afford to sell anything twice."
    - "If the consumer is induced to demand what you offer, the dealer will obtain it."
    - "Jobbers and retailers have their own brands. What trade they can influence is never directed toward products you control."
    - "The greatest calamities in advertising come through doubling the selling expense."
  concept_label: choose_consumer_demand_or_trade_selling_because_the_margin_will_not_carry_both
  label_origin: extractor_assigned
  claim: >
    The source states one of its strongest and most repeated doctrines: an advertiser must choose
    between creating consumer demand and buying trade distribution, because selling margins are not
    large enough to pay for both. It describes the failure mode in detail. The advertiser spends to
    convert consumers, then pays salesmen to sell jobbers, who take a fifth for filling orders the
    advertiser generated, then gives retailers free goods and extra margins to persuade them to
    supply a demand he already created; he bears the expense, the risk and the effort, and his
    profit is dissipated. It adds a structural reason not to expect help from the trade: jobbers and
    retailers carry their own brands, make several times as much on them, and will never direct
    their influence toward a product they do not control. Its rule is that if a line can be sold by
    interesting dealers, let the dealer sell it; if you are going to do the selling, pay him only a
    distributor's margin. Most lines it advertised, it says, never employed a salesman.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Consumer demand propagates upward on its own — if the consumer demands it the dealer obtains
      it, and if the dealer wants it the wholesaler supplies it — so paying the trade to do what
      demand already does is duplicated expense. Concessions granted to enter also become
      permanent handicaps, and the intermediary can always be outbid by someone else.
  scope:
    domain_discussed_by_source: [advertising, trade_distribution, consumer_packaged_goods]
    conditions: "branded consumer goods sold through independent jobbers and retailers"
  caveats:
    - text: >
        The source concedes the opposite case exists: an unadvertised line without consumer demand
        must depend on distributors, who then demand a large toll that erodes toward
        insignificance under competitive bidding.
      origin: source_stated
    - text: >
        The doctrine assumes the advertiser can reach consumers at a cost the category supports.
        The source's own list of lines too costly to advertise (sk_mla_0066) is exactly where this
        assumption fails, and it does not connect the two.
      origin: extractor_observed
    - text: >
        Historically bounded to a jobber-and-independent-retailer trade structure with the margins
        the source cites.
      origin: extractor_observed
  source_stated_problems:
    - "Many of the wrecks in advertising come from trying to sell things over and over."
    - "They become mere order-takers."
  source_stated_remedies:
    - "The whole idea has been to win consumers and let them sell to dealers and to jobbers."
    - "Treat them fairly, but do not pay them for what they cannot do."
  examples:
