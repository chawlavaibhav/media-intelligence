  label_origin: extractor_assigned
  claim: >
    The source claims that the pressure to change a working campaign comes from the wrong people.
    The advertiser and the writer see every advertisement and become bored; the reader sees one and
    reads it once, as he reads a news item, and has no reason to read it again. It states the
    advertiser comes to feel that the public reads his story as often as he does, and that this is
