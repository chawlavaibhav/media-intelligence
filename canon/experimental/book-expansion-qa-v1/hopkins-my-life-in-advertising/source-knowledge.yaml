- sk_id: sk_mla_0005
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "We must never judge humanity by ourselves."
    - "I know of nothing more ridiculous than gray-haired boards of directors deciding on what housewives want."
    - "Four times in five they failed."
    - "I do not consult managers and boards of directors. Their viewpoint is nearly always distorted."
  concept_label: never_judge_the_market_by_the_deciders_own_preferences
  label_origin: extractor_assigned
  claim: >
    The source holds that the preferences of the people deciding a campaign are systematically
    unrepresentative of the market, and that the losses caused by venturing on personal preference
    are enormous. It gives a childhood origin — a book it was certain everyone wanted was thrown
    back at it by the town mayor on moral grounds, then sold seven copies in one visit to a
    business office. It states that where men insisted on judging the world by themselves, four
    times in five they failed. Its stated remedy is to submit the question to ordinary members of
    the buying public rather than to managers and boards.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Preferences are formed by surroundings — the prosperous mingle with the prosperous — so the
      further a decider has moved from ordinary purchasers the less his own reaction predicts
      theirs. The source treats this as a structural bias of position, not a failure of
      intelligence.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "any decision about what an appeal should say, made by people who are not the buyers"
  caveats:
    - text: >
        The "four times in five" figure is asserted with no basis, sample or definition of failure.
        The source also concedes that people who judged the world by themselves sometimes succeeded.
      origin: extractor_observed
    - text: >
        The source's own alternative — submitting campaigns to the gardeners, village folk and
        domestic staff around its country home (p. 174) — is a convenience sample chosen by the
        source, not a designed one, and it is presented as authoritative.
      origin: extractor_observed
  source_stated_problems:
    - "Only the obstinate, the bone-headed, will venture far on personal opinion."
    - "some bigoted men judged the many by the few"
  source_stated_remedies:
    - "We must submit all things in advertising, as in everything else, to the court of public opinion."
    - "I have urged them to make tests, to feel out the public pulse."
  examples:
    positive:
      - {description: "the Pinkerton biography refused by the mayor and then bought seven times over at the Big Store", figure_ref: null}
      - {description: "'Foods shot from guns' denounced by a leading food advertiser as the theory of an imbecile, and successful", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: depends_on, target: sk_mla_0047, note: "the remedy is a test, so this rests on the testing doctrine"}
    - {relation: qualified_by, target: sk_mla_0002, note: "the source's own sample of ordinary people is bounded to one class"}
    - {relation: member_of_system, target: scs_mla_001}
