# SourceKnowledge — Claude C. Hopkins, "My Life in Advertising" (Harper & Brothers, 1927)
# source_id: hopkins-my-life-in-advertising
# EXPERIMENTAL — NOT LIVE CANON. Not reviewed, not accepted, not promoted.
#
# LINEAGE WARNING, governing this whole file: the author of this source is also the author of the
# live Canon source `hopkins-scientific-advertising-ch1-7`. That is a `shared_author` DEPENDENCE
# relation. This source is NOT an independent origin against it, and chapter 17 of this book is
# explicitly about that book. Agreement between the two is one man restating himself and must never
# be counted as cross-source convergence. See PROVENANCE.md §4.
#
# EVIDENCE NOTE, governing this whole file: the source constantly asserts that measurement was
# performed — "traced returns", "keyed", "countless tests", "thousands of tests". In most places it
# reports no figure, no control, no sample and no date. Those objects carry `outcome_claimed`.
# `empirical_within_source` is reserved for the small number of places where the source actually
# states what a measurement returned (chiefly pp. 92-94, 104-105, 146-147, 154, 158-159, 165-166).
# Where the source claims measurement and supplies none, that gap is written into a caveat with
# origin `extractor_observed` rather than being upgraded.
#
# RETROSPECTION NOTE: this is a successful practitioner, at the end of his career, in 1927,
# explaining his own success in campaigns run between roughly 1890 and 1925, from memory, and
# twice saying so ("I am telling the story from memory", p. 115; "some figures which may not be
# exact", p. 135). Survivorship and self-attribution are unmanaged throughout and are not
# separately restated on every object.
#
# The book contains no figures. Every object carries source_support: text.

- sk_id: sk_mla_0001
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "All advertising disasters are due to rashness"
    - "ordinary failures mean little"
    - "feeling the public pulse"
    - "a pig in the poke"
  concept_label: disaster_comes_from_rashness_not_from_a_failed_test
  label_origin: extractor_assigned
  claim: >
    The source separates two things usually called failure. An ordinary advertising failure is a
    small venture that does not respond, and it is expected, cheap and informative — every venture
    in its initial stage is only a way of feeling the public pulse. A disaster is a large and
    costly commitment made before any such response was observed, and the source calls that
    rashness, needless and inexcusable. The source states that no amount of experience guides a
    practitioner correctly in even the majority of cases, so incaution is the crime rather than
    being wrong. The same rule is restated as a decision rule late in the book: never involve an
    advertiser to any large extent before a profit is sure.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Advertising deals with wants, prejudices and idiosyncrasies that cannot be measured in
      advance, so the outcome of any untried venture is unknown. Committing money at scale before
      the response is observed converts an unknowable into an unrecoverable loss, whereas a small
      venture converts it into information at a price the advertiser can absorb.
  scope:
    domain_discussed_by_source: [advertising, mail_order_advertising]
    conditions: "any new advertising venture whose response has not yet been observed"
  caveats:
    - text: >
        The source scopes the loss asymmetry to its own commercial arrangement — the advertiser
        usually gets his money back whatever the outcome, and the agency bears the real stake
        (p. 171). The rule as stated is partly a description of who was paying, not only of risk.
      origin: source_stated
    - text: >
        No base rate is given for how often small tests mislead. The source asserts elsewhere that
        one guess in fifty may be right and fifty in fifty tests are informative (p. 150), which is
        rhetoric rather than a measured figure.
      origin: extractor_observed
  source_stated_problems:
    - "advertising men who pilot some big and costly ship to the rocks"
    - "Pilots who prove reckless are forever feared"
  source_stated_remedies:
    - "Safety first"
    - "I never involve the adventurer to any large extent before we are sure of a profit"
  examples:
    positive:
      - {description: "Palmolive begun with a $700 newspaper test in Benton Harbor before any national commitment", figure_ref: null}
      - {description: "Liquozone tried first in a dozen small Illinois cities before the national campaign", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: depends_on, target: sk_mla_0021, note: "the rule presupposes that a small test predicts the large one"}
    - {relation: generalises, target: sk_mla_0045, note: "the general caution rule; the Quaker Oats test is one application"}
    - {relation: member_of_system, target: scs_mla_001}
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, repeated_within_source, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
