    advantages are clearly on your side, and one should never pay the cost of acquiring customers
    without seeing how they will be kept. It restates the rule for occupied categories: nobody in a
    hard-fought field has ever succeeded without some exceptional claim, and one must offer
    exceptional service to move buyers off brands they already like.
