- sk_id: sk_mla_0003
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "The best school I know is canvassing, going from home to home."
    - "These things can hardly be taught."
    - "ring a thousand door-bells to gain the woman's angle"
  concept_label: door_to_door_canvassing_as_the_school_for_buyer_response
  label_origin: extractor_assigned
  claim: >
    The source holds that the knowledge on which advertising depends — what wins a purchaser and
    what repels one, how pride and individuality can be appealed to — is acquired by selling in
    person, house to house, and then transferred to print. It states that many capable advertising
    writers spend half their time canvassing, and it names a leading practitioner who sold in
    person before selling in print and who would spend weeks going farm to farm. It further states
    that this psychological knowledge can hardly be taught and cannot be taught at all to someone
    out of sympathy with ordinary people.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A canvasser receives an immediate, undeniable reaction from an individual purchaser, so the
      effect of a particular approach is observable within minutes. Print separates the appeal from
      the reaction, so the practitioner who has only worked in print never sees which move produced
      which response.
  scope:
    domain_discussed_by_source: [advertising, personal_selling]
    conditions: "products sold to households; an era in which door-to-door canvassing was routine"
  caveats:
    - text: "the source concedes these things can hardly be taught and gives no procedure for acquiring them"
      origin: source_stated
    - text: >
        The claim that canvassing knowledge transfers to print is asserted, never tested against a
        writer who lacked it. The source's own counter-evidence — that it hired men on the strength
        of a single letter or a single advertisement (pp. 23-25) — suggests it was selecting for a
        disposition rather than for canvassing hours.
      origin: extractor_observed
    - text: >
        Historically bounded. Door-to-door canvassing was a mainstream channel when this was
        written; the claim is about the availability of unmediated buyer reaction, not about that
        specific channel.
      origin: extractor_observed
  source_stated_problems:
    - "No man out of tune with his fellows can be taught them."
  source_stated_remedies:
    - "They learn by personal contacts what wins and what repulses. Then they apply their findings to appeals in print."
  examples:
    positive:
      - {description: "selling mother's silver polish house to house as the origin of the source's sampling doctrine", figure_ref: null}
      - {description: "street fakers observed by torchlight, who never sold without demonstration", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: depends_on, target: sk_mla_0004, note: "the canvassing lesson is what produced the sampling doctrine"}
    - {relation: trades_off_with, target: sk_mla_0061, note: "personal contact versus keyed measurement as sources of knowledge"}
    - {relation: member_of_system, target: scs_mla_001}
