    The source rules out humour and frivolity, and separately rules out competing with editorial
    matter. On humour its argument is that spending money is serious business — money represents
    life and work, spending in one direction means skimping in another, and the average person is
    constantly choosing between ways to spend — so an appeal for money made in a light-some way
