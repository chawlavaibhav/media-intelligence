    something already decided, at which point it is sent for a sample or information and the
    interest can be followed up. It reports mail-order houses testing catalogue offers with and
    without coupons and finding an enormous difference in returns. It names other action devices —
    week sales, offers limited to a day or an hour, limited offers of every sort.
