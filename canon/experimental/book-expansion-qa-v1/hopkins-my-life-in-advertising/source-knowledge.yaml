- sk_id: sk_mla_0007
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "But he knew nothing about carpet sweepers. He had given no study to our trade situation."
    - "not one of them knew the situation"
    - "Had they gone from house to house, and interviewed housewives, they would have reached different conclusions."
  concept_label: general_writing_skill_without_situation_knowledge_fails
  label_origin: extractor_assigned
  claim: >
    The source claims that craft reputation does not substitute for knowledge of the specific
    buying situation, and that campaigns fail when able writers work from general skill without
    investigating the market. It gives two cases. The acknowledged dean of advertising submitted a
    pamphlet for a carpet sweeper without having studied the trade, the product or any woman's
    reason for wanting one, and the source's own three-day effort beat it. Several able advertising
    men produced impressive Van Camp copy and none of them knew that most housewives baked their
    own beans; the source states they did not investigate because it was too much trouble, and
    that they were writing to impress the client rather than to sell.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An appeal has to attach to a want that actually exists in the market. General craft can
      produce an attractive appeal attached to a want that is not there, and no amount of skill
      recovers from that; only investigation locates the want.
  scope:
    domain_discussed_by_source: [advertising, concept_development]
    conditions: "a campaign for a product whose market conditions have not been investigated"
  caveats:
    - text: >
        Both cases are the source's own retellings of contests it won, decades later, with no
        independent account. In the Powers case the source was an employee of one party to a
        lawsuit and states that its pamphlet was used to win that suit.
      origin: extractor_observed
    - text: >
        The source concedes that some lines succeed for reasons unconnected with their advertising
        (p. 175), which weakens any inference from one campaign's outcome to the quality of its
        preparation.
      origin: extractor_observed
  source_stated_problems:
    - "Their whole idea was to impress that man with some interesting copy."
    - "But that was too much trouble."
  source_stated_remedies:
    - "I started investigators to learn the situation in respect to pork and beans."
  examples:
    positive:
      - {description: "the Van Camp investigation finding 94 per cent of housewives baked their own beans, while all advertisers were competing for the remaining 6 per cent", figure_ref: null}
    counter:
      - {description: "a celebrated writer's carpet-sweeper pamphlet, judged by the source to contain no word that would lead a woman to buy", figure_ref: null}
  intra_source_relations:
