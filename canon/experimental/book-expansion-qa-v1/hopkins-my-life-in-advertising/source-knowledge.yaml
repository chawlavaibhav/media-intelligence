- sk_id: sk_mla_0004
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "A good article is its own best salesman."
    - "It is uphill work to sell goods, in print or in person, without samples."
    - "No argument in the world can ever compare with one dramatic demonstration."
  concept_label: demonstration_and_trial_outsell_argument
  label_origin: extractor_assigned
  claim: >
    The source claims that letting a purchaser see the product work converts at a far higher rate
    than describing it, and that this holds in print as well as in person. Its stated origin is a
    childhood comparison — selling a silver polish door to door, it sold about one woman in ten by
    talking at the door, and nearly all of them when it could get into the pantry and demonstrate.
    It generalises this into the rule that a trial device — sample, coupon for a package,
    approval shipment, or a staged demonstration — is the mechanism by which print advertising
    reproduces what a salesman does with a sample case. It also claims that the persuasion needed
    to sell without a sample costs vastly more than the sample does, so refusing samples on cost
    grounds is a false economy.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Argument asks the buyer to accept a claim on the seller's word; demonstration and trial move
      the burden of proof off the seller and let the product produce the conviction, which the
      source holds is both cheaper and less resisted than persuasion.
  scope:
    domain_discussed_by_source: [advertising, mail_order_advertising, personal_selling]
    conditions: "products whose merit is apparent on a single use; products cheap enough to sample"
  caveats:
    - text: >
        The source qualifies the rule heavily elsewhere: an unrequested sample does not work
        (sk_mla_0026), a sample the buyer must pay for does not work (sk_mla_0044), and featuring
        the free sample destroys the appeal in some categories (sk_mla_0050). "Sample" alone is
        not the operative variable.
      origin: source_stated
    - text: >
        The silver-polish comparison is a recollected childhood ratio (one in ten versus nearly
        all) with no recorded count, date or control, reported roughly fifty years after the fact.
        It is the founding evidence for a doctrine the source applied for a career.
      origin: extractor_observed
    - text: >
        The rule presupposes a product that survives inspection. sk_mla_0033 records the source's
        own case where the trial mechanism worked and destroyed the business because the product
        did not.
      origin: extractor_observed
  source_stated_problems:
    - "they will spend fortunes on advertising to urge people to buy without seeing or testing"
    - "None but those who regard advertising as some magic dreamland will ever try to sell without sampling."
  source_stated_remedies:
    - "The way to do that is to sample and demonstrate, and the more attractive you can make your demonstration the better it will be for you."
  examples:
    positive:
      - {description: "silver polish sold to about one woman in ten at the door, to nearly all when demonstrated in the pantry", figure_ref: null}
      - {description: "the largest cake in the world, baked with Cotosuet instead of butter, drawing 105,000 people up four flights in one week; trade orders for the product secured from the leading baker and grocer in each city before the demonstration was staged", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: qualified_by, target: sk_mla_0026, note: "the sample must be requested"}
    - {relation: qualified_by, target: sk_mla_0044, note: "the sample must not be charged for"}
    - {relation: qualified_by, target: sk_mla_0050, note: "the free offer must not be featured in every category"}
    - {relation: member_of_system, target: scs_mla_002}
    - {relation: member_of_system, target: scs_mla_004}
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, anecdotal, outcome_claimed, mechanism_given, repeated_within_source]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
