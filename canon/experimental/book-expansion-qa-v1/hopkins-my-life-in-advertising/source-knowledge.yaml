    processes as commonplace (pp. 80-82, 101-102), and makers volunteer what they are proud of
    (pp. 81, 124-125) — and it says the situation "occurs in most advertising problems". It does
    not state it as a diagnostic procedure to be run. Packaging the two halves as a usable cue for
    locating claim material is the extractor's framing, not the source's presentation.
