- sk_id: sk_mla_0006
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "Any unique style excites suspicion."
    - "Any evident effort to sell creates corresponding resistance."
    - "Brilliant writing has no place in advertising."
    - "In fishing for buyers, as in fishing for bass, one should not reveal the hook."
    - "Style is a handicap."
  concept_label: visible_craft_creates_buyer_resistance
  label_origin: extractor_assigned
  claim: >
    The source claims that conspicuous writing quality, unique style and fine appearance reduce
    persuasion rather than increasing it, because they are read as evidence that an effort is being
    made to sell. It states that education and literary style are handicaps in this work, that the
    great majority cannot appreciate literary style and fear over-influence when spending money,
    that an appeal which seems to come from a higher class arouses resentment, and that a reader
    who admires an advertisement is thereby prevented from being influenced by it. Its prescription
    is inconspicuous language, the shortest words available, and no attempt to show off.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Visible skill signals intent to persuade. A buyer who detects intent to persuade discounts
      the content, exactly as a buyer becomes wary of an over-dressed salesman. The source's
      formulation is that anything taking attention from the subject reduces the impression.
  scope:
    domain_discussed_by_source: [advertising, copywriting]
    conditions: "appeals addressed to mass-market purchasers spending their own money"
  caveats:
    - text: >
        Scoped by the source to its own audience. It states that its appeals are aimed at ordinary
        purchasers and that it would expect to fail on luxury lines (sk_mla_0002); the resistance
        mechanism is asserted for that audience.
      origin: source_stated
    - text: >
        The source offers no traced comparison of a plain against a stylish text where only style
        differed. Its nearest evidence — the mail-order cost-per-reply comparison at pp. 158-159 —
        varies size, type, decoration and copy together (see sk_mla_0054).
      origin: extractor_observed
    - text: >
        The claim shades into the source's personal hostility to formal education, which it states
        at length (pp. 7-8) as opinion.
      origin: extractor_observed
  source_stated_problems:
    - "A unique style takes attention from the subject."
    - "Persuasive ability arouses the fear of over-influence."
  source_stated_remedies:
    - "One should be natural and simple. His language should not be conspicuous."
    - "Use the shortest words possible."
  examples:
    positive:
      - {description: "a writer whose copy would induce a farmer to mortgage his barn, but whose every sentence had to be edited for grammar", figure_ref: null}
    counter:
      - {description: "the reaction 'That is a beautiful ad.' treated by the source as evidence the advertisement will not work", figure_ref: null}
  intra_source_relations:
    - {relation: generalises, target: sk_mla_0012, note: "the same resistance mechanism drives the objection to selfish appeals"}
    - {relation: demonstrated_together_with, target: sk_mla_0058, note: "stated alongside the objection to fine art and colour"}
