  claim: >
    The source sets out a screen that disqualifies a product from advertising regardless of how good
    the campaign would be, and states that one must avoid these cases or become disheartened. Two
    conditions do the work. First, narrow incidence: an ointment, a germicide, a treatment for
    asthma or hay fever, a rub for rheumatism appeal to a small percentage, so reaching them through
