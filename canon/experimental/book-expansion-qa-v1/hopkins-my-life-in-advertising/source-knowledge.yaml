  claim: >
    The source offers a diagnostic. When a manufacturer says a fact about his process is too
    ordinary to mention because every competent maker does it, that is the signal that the fact is
    the campaign. The source states the maker is too close to his product, sees only the ordinary
    in his own methods, and does not realise the public might marvel at them; correspondingly, what
    he does volunteer is the thing he takes pride in, which is usually of no interest to the buyer.
