    rules. On food products the word free multiplied the readers of its advertisements. On a
    hygiene product the same device, featured at the top of the advertisement, divided results by
    four. Its stated explanation is positional: an advertiser offering a benefit of importance is
    understood as a scientist seeking to benefit, and featuring a giveaway reclassifies him as a
    trader seeking to sell, discrediting the very factors that produce converts. Its resolution was
    to keep the sample free but to remove the free offer from the position of chief appeal, so the
    apparent object of the advertisement was to prove at the advertiser's cost what the product
    could do. It emphasises that such things are not easy to discover and that it found this only
    through keyed coupons.
