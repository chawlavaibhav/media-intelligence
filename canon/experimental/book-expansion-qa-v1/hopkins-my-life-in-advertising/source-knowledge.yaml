  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A superlative is uncheckable and therefore costless to make, so readers price it at nothing
      and infer looseness. A specific figure is checkable and legally exposed, so it is read as
      having been weighed and measured, and belief transfers to the rest of the claim.
  scope:
    domain_discussed_by_source: [advertising, copywriting, brand_communication]
    conditions: "media with editorial standards against outright falsehood; a claim that can actually be quantified"
  caveats:
    - text: >
        The source's credibility argument depends on a specific institutional fact of its era — that
        the better publications would not carry deliberate falsehood. It states this twice.
      origin: source_stated
    - text: >
        The mechanism rewards whoever quantifies first, not whoever is better. The source is explicit
        that rivals could probably meet the same shaving-cream specifications and that it has no
        idea one maker far excels others in the line.
      origin: source_stated
    - text: >
        The three-per-cent margin claim was derived from the client's own historical figures and is
        reported without independent verification. It is also a claim about margin, which a reader
        cannot check at all.
      origin: extractor_observed
  source_stated_problems:
    - "There came a time when all were crying bargains in the highest key. In a chorus of that kind, all are on the same plane."
    - "He naturally minimizes whatever else we may say."
