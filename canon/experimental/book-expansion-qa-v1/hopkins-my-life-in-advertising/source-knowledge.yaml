  concept_label: the_liquozone_test_city_measurement_and_its_reproduction_at_national_scale
  label_origin: extractor_assigned
  claim: >
    This is the one place in the book where the source states a measurement, states the waiting
    period, and then states what the same measure returned at scale. A plan was tried in a dozen
    small Illinois cities. Inquiries for the free bottle cost 18 cents each. After a deliberate
    thirty-day wait, sales averaged 90 cents per inquirer. Claims under the money-back guaranty
