- sk_id: sk_mla_0068
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "I gradually came to specialize on proprietaries and foods, on products which people buy over and over."
    - "One-sale articles are not so inviting. The profit must be made on that sale."
    - "products which appeal to nearly every home, and which must be advertised forever"
    - "There is hardly a limit to what one can pay to get a new user established."
  concept_label: repeat_purchase_frequency_determines_what_may_be_spent_to_acquire_a_user
  label_origin: extractor_assigned
  claim: >
    The source states the selection rule that governed its own career choices. It specialised in
    products bought over and over, because the whole profit on a one-sale article must be made on
    that sale, which limits what may be spent to obtain it, whereas a product in daily consumption
    permits almost unlimited acquisition spending. It names the ideal as products appealing to
    nearly every home which must be advertised forever, giving the example of foods mothers teach
    their children to use. It states the corollary concretely for a daily-consumption product:
    there is hardly a limit to what one can pay to get a new user established, and it accepted a
    gift costing more than the profit on the six units required to earn it, because those six units
    made the brand familiar and the user then asked for it by name.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Acquisition cost is paid once and repaid across every subsequent purchase, so the permissible
      cost of a customer is set by purchase frequency and product life rather than by the margin on
      the first sale.
  scope:
    domain_discussed_by_source: [advertising, consumer_packaged_goods, effectiveness]
    conditions: "consumable household goods; comparison against durables and one-sale articles"
  caveats:
    - text: >
        Hardly a limit is rhetorical. The real limit is the discounted lifetime value, which the
        source does not compute anywhere, and its own screen at sk_mla_0066 is precisely where that
        arithmetic bites.
      origin: extractor_observed
    - text: >
        The rule shaped which products the source took on, so its reported success rate is
        conditioned on this selection. That is a survivorship effect internal to the book, created
        deliberately.
      origin: extractor_observed
  source_stated_problems:
