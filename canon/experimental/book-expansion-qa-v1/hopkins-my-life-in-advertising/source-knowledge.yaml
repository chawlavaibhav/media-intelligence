- sk_id: sk_mla_0069
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "I prepared a line of cosmetics, but I had no theory."
    - "I sent men to Paris and Vienna to secure something unique, some claims to give me an advantage. But they found none. So I decided to abandon this line."
    - "That day I found my theory."
    - "No line dominated."
  concept_label: a_product_without_a_theory_is_abandoned_rather_than_advertised
  label_origin: extractor_assigned
  claim: >
    The source records deciding to abandon a fully prepared product line for want of a theory. It
    had studied the category, found American women spending $700,000,000 a year on cosmetics — more
    than on all other advertised lines combined — and prepared a line. The field was overcrowded,
    leading dealers held thousands of kinds, scores of new makers solicited them weekly, no line
    dominated, and a converted buyer arriving at a store faced a dozen demonstrators pushing
    something else. Having sent men to Paris and Vienna to find something unique and been told there
    was nothing, it decided to abandon the line. The venture resumed only when a specific
    proposition appeared — a nationally known woman of grandmother's age who looked far younger,
    who had spent fortunes assembling beauty formulas, and whose personal appearance in a
    department store had drawn a crowd large enough to displace every other department on the floor.
    The source's own phrase for what it had been missing and then found is a theory.
