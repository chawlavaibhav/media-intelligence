  claim: >
    The source treats the loss of half-made converts to procrastination as a standard and avoidable
    failure. A reader has paused because the subject or headline caught her; in a moment she will
    return to her reading and forget. The climax must therefore inspire immediate action among
    those interested. Its usual device is the coupon, and its stated reason is physical and
    behavioural rather than transactional: people cut it out, do not lay the publication aside, and
