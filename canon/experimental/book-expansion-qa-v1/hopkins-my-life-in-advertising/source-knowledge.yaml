    before the bills fell due. Rolled out nationally the following year, the campaign produced over
    1,500,000 requests for the free bottle at an average cost of 18 cents — the same figure — and
    an average sale of 91 cents per request, a trifle more than in the test cities. The source
    reports first-year net profits of $1,800,000 on a company that had begun with enough money only
    to pay its rent.
