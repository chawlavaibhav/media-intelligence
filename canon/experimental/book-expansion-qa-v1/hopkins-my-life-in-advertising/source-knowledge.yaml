- sk_id: sk_mla_0066
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "There are many things in advertising too costly to attempt."
    - "On some such things one appeals to a small percentage. The cost of reaching them in mediums of universal circulation is excessive."
    - "the cost of securing a customer is many years' return from a customer. Repeat sales are too far apart."
