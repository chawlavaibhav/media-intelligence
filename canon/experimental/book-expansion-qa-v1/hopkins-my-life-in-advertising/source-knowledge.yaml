- sk_id: sk_mla_0070
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "But human nature does not change. The principles set down in this book are as enduring as the Alps."
    - "Certainly the tempo of life in America is changing. Fads, fancies, and desires change like a kaleidoscope."
    - "It is and always has been necessary to give to every campaign a different key-note. Imitators never succeed."
    - "My life work has been research in advertising."
  concept_label: the_sources_own_claim_about_the_durability_of_its_principles
  label_origin: extractor_assigned
  claim: >
    The source states its own scope claim in its closing chapter and states it in two parts that sit
    in tension. It concedes that the tempo of American life is changing, that fads, fancies and
    desires change like a kaleidoscope, that certain styles in advertising are changing, and that
    every campaign has always required a different key-note because imitators never succeed. It then
    asserts that human nature does not change and that the principles set down in the book are as
    enduring as the Alps. It adds that advertising has become more difficult because costs are
    higher and competition abler, and treats that as increasing rather than reducing the need for
    its method. It describes its life work as research in advertising, comparable to medical
    research or a life in a laboratory, and offers the book so that others may start where it ended.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The source separates two layers: an invariant one, human nature, from which it claims its
      principles derive; and a variable one, the fads and styles of the moment, in which every
      campaign must be executed afresh.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "stated by the source without limit; asserted for advertising generally"
  caveats:
    - text: >
        The two halves are not reconciled. If every campaign needs a different key-note drawn from
        current preoccupations (sk_mla_0031), then a large part of what the book teaches is
        contingent, and the enduring residue is smaller than the Alps claim suggests.
      origin: extractor_observed
    - text: >
        A great deal of the book's content is plainly contingent on its era: coupon redemption at
        independent retailers, one-cent letters to dealers, 8-point reading matter, $10 per word,
        publisher-paid commissions, universal-circulation media with no targeting, and
        door-to-door canvassing. This object exists so that the source's timelessness claim is
        recorded as its claim and is not silently adopted.
      origin: extractor_observed
    - text: >
        The research analogy is the source's own framing of a career of commercial practice. No
        research protocol, dataset or replication appears in the book.
      origin: extractor_observed
    - text: >
        This is a 1927 claim about human nature made by one American practitioner working in one
        market and one class. It is recorded as a position, not as a finding.
      origin: extractor_observed
  source_stated_problems:
    - "Many argue that advertising is changing, that the times call for something new."
  source_stated_remedies:
    - "But every new difficulty increases the necessity for scientific advertising."
