  label_origin: extractor_assigned
  claim: >
    The source draws a sharp line between two things both called sampling. Distributing samples to
    people who did not ask for them — house to house, thrown on the doorstep, handed out at large —
    it calls a very bad plan: the product has no prestige, the stores are not stocked, grocers are
    offended at free distribution of goods they sell, and the giving itself cheapens the product.
