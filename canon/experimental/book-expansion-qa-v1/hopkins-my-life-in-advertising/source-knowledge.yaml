- sk_id: sk_mla_0067
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "As it grows, the advertising man becomes less and less important. The business acquires a momentum."
    - "The time comes when even mediocre advertising will keep it going upward. Advertising which could never have started it."
    - "So the man who builds a big advertising account is pretty sure to lose it, soon or late."
    - "To keep up his volume and his earnings he must always be starting new ventures."
  concept_label: the_advertising_that_starts_a_business_is_not_the_advertising_that_sustains_it
  label_origin: extractor_assigned
  claim: >
    The source describes a structural dynamic it treats as near-inevitable. In the early stage the
    advertising does nine-tenths of the work, the owner of the trade mark ventures little, and if
    the test fails the advertising man is the main loser of time and talent. If it succeeds the
    business acquires momentum, and a point arrives at which mediocre advertising will keep it
    rising — advertising that could never have started it. From then the advertising man matters
