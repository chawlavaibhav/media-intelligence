- sk_id: sk_mla_0059
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "In advertising we serve three interests, all of them allied but distinct."
    - "The real stake is made by the agency."
    - "Failure means that the advertiser loses a trifle, the agency loses much."
    - "Our least obligation is to the advertiser, yet everything depends on his attitude."
  concept_label: the_three_interests_and_the_asymmetry_of_who_actually_bears_the_test_risk
  label_origin: extractor_assigned
  claim: >
    The source sets out, in its own numbered order, the three parties an advertising writer serves
    and where the risk actually falls. First is the publisher, who pays the agency commission —
    stated as averaging 15 per cent — and pays it for developing new advertising rather than for
    moving accounts. Second is the agency, whose valuable accounts are those grown from small
    beginnings inside it. Third is the advertiser, placed last because the publisher pays and the
    agency employs. It then states the risk asymmetry in figures: a test campaign costing under
    $5,000 yields the agency $750 of commission, while developing that test rarely costs under
    $20,000 in competent work, so the advertiser usually gets his money back whatever happens, the
    agency bears the real stake, and success may mean millions to the advertiser against a
    continuing commission to the agency. It concludes that all three interests are crying for
    profits and the only way to satisfy them is to develop profitably whatever is undertaken.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because the publisher pays the commission and the agency funds the development work, the party
      whose product is being tested is the party with the least exposure. The source uses this to
      argue it owes the advertiser no obligation for the privilege of testing, while conceding that
      everything depends on the advertiser's success.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "the American publisher-commission agency system of the 1900s-1920s"
  caveats:
    - text: >
        Strictly bounded to a specific commercial arrangement. The publisher-paid commission model
        is what makes the ordering and the risk asymmetry true, and the source states that model
        explicitly.
      origin: source_stated
    - text: >
        Self-serving in structure. The conclusion drawn — that the source owes no obligation to an
        advertiser who lets it run a test — is convenient for the party stating it.
      origin: extractor_observed
    - text: >
        The source elsewhere describes the same system in its earlier form, where an agency's profit
        came from devising schemes to get advertisers to spend, with no thought of profit to the
        advertiser, and says it declined a large salary rather than work that way (p. 203). That is
        an incentive misalignment the source names but does not treat as a live risk in its account
        of the reformed system.
      origin: extractor_observed
  source_stated_problems:
    - "Old advertisers who change from one agency to another are not very valuable clients. They have failed in their ambitions."
    - "Each succeeding agent loses reputation and prestige when he attempts the impossible."
  source_stated_remedies:
    - "The only way to please all of them is to profitably develop what you undertake."
