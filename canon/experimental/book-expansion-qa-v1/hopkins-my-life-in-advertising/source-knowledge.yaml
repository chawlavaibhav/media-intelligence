- sk_id: sk_mla_0062
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "I have little respect for most theories of advertising, because they have not been proved."
    - "The reasons for success have little to do with the advertising. The line may have succeeded in spite of the advertising."
    - "Any conclusions drawn from such experiences are bound to lead others astray."
    - "Safe principles are evolved only by those who know with reasonable exactness what the advertising does"
  concept_label: an_untraced_success_is_not_evidence_about_the_advertising_that_accompanied_it
  label_origin: extractor_assigned
  claim: >
    The source states an explicit refusal rule for evidence. Most advertising theories deserve
    little respect because they are unproved and rest on limited experience and exceptional
    conditions. Some lines appear to succeed on methods that every traced return proves impossible,
    and the source names the alternative explanations: the line may have succeeded in spite of its
    advertising; unadvertised lines become highly successful because people discover a wanted
    quality; dealers may have been induced to feature it; or the name itself may tell an appealing
    story. It names gum and a cereal as cases where the name did the work and there was almost no
    story to tell, and observes that the men who succeeded with one such name failed again and
    again with others. Its conclusion is that conclusions drawn from such experiences are bound to
    lead others astray, that the cases where they apply are rare, and that safe principles are
    evolved only by those who know with reasonable exactness what the advertising does.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Success is overdetermined. Where the response was not traced, the advertising is one of
      several sufficient explanations and cannot be separated from the others, so the case carries
      no information about the advertising and generalising from it propagates an error.
  scope:
    domain_discussed_by_source: [advertising, testing_method, effectiveness]
    conditions: "reasoning from observed commercial successes to advertising principles"
  caveats:
    - text: >
        The rule cuts against most of this book. Nearly every campaign the source recounts is an
        outcome asserted without a control, and by its own criterion those accounts do not establish
        the principles they are used to illustrate. The source does not apply the rule to itself.
      origin: extractor_observed
    - text: >
        The source's own defence would be that its principles came from the traced work and the
        narratives merely illustrate them. The book does not exhibit the traced work.
      origin: extractor_observed
    - text: >
        The observation that the same people failed repeatedly with other names is a genuine
        disconfirmation test applied to a rival explanation, and it is one of the sharpest pieces of
        reasoning in the source.
      origin: extractor_observed
  source_stated_problems:
