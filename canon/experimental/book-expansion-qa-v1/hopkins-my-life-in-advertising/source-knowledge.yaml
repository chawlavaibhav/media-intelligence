- sk_id: sk_mla_0029
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "Superlative claims do not count."
    - "Say that it gives 3 1/2 times the light of carbon lamps, and people will realize that you have made actual comparisons."
    - "Such definite statements are either facts or lies, and people do not expect that reputable people or concerns will lie."
    - "Indefinite claims leave indefinite impressions, and most of them are weak."
  concept_label: definite_figures_are_credited_at_par_while_superlatives_are_discounted
  label_origin: extractor_assigned
  claim: >
    The source claims that a superlative makes no impression whatever, because it is the expected
    claim and is classed as exaggeration rather than falsehood; worse, it costs the advertiser
    respect, so everything else he says is discounted. A definite figure, by contrast, is accepted
    at par, because a definite statement is either a fact or a lie and readers do not expect
    reputable firms to lie in the better publications. It reports the device in four forms: a
    lamp's exact light multiple against the alternative; a motor manufacturer answering a public
    belief in excessive profits with a stated nine per cent margin and itemised hidden-part costs
    exceeding $700; a shaving cream published with laboratory figures where rivals used atmosphere;
    and a mail-order house that, instead of joining a chorus of lowest-price guarantees, published
    its actual net margin of three per cent and undertook not to exceed it. On the last it argues
    that in a chorus of superlatives all claims are equally ineffective, and that a stated margin
    was accepted as proof of bottom prices where every guarantee was not.
