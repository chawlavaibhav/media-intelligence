    must read the story to know the sample exists, must cut the coupon and present it, and finds
    the product in stock when she uses it. It reports distributing millions of samples
    promiscuously on puffed grains and finding they won few users, then stopping and requiring the
    coupon. Its rule is that interest must be established before the product has value to anybody.
