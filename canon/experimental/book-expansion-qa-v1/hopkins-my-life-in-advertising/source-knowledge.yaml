  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A price on the trial does not filter for seriousness; it filters out most of the interested,
      because paying for a sample is paying for the seller's selling effort. A half-price offer
      fails for the reverse reason: price is not what is stopping an unconverted buyer, so
      discounting addresses the wrong obstacle.
