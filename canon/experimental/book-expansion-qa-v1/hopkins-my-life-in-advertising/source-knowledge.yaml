  concept_label: an_entry_requires_a_real_or_a_stated_advantage_before_any_spending
  label_origin: extractor_assigned
  claim: >
    The source states an entry condition. Before committing to a campaign one must know the
    competition, know what others offer, and know what people want, and must be able to outbid the
    field on quality, on service, or on terms — or, failing a real advantage, be able to
    manufacture a seeming one by citing facts rivals have not cited. Crying a name or a brand does
