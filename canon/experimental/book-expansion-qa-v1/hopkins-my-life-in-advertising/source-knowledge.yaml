- sk_id: sk_mla_0044
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "Inquiries for free samples may cost 25 cents each. Ask 10 cents for the sample, and the inquiries may cost you $1.25 or more."
    - "To gain that 10 cents you may be losing one dollar."
    - "And you may start only one-fifth as many users for the money that you spend."
    - "A coupon good for half the price is small inducement."
  concept_label: charging_anything_for_a_trial_multiplies_the_cost_of_acquiring_a_user
  label_origin: extractor_assigned
  claim: >
    The source gives its sharpest quantitative warning about trial economics. Free-sample inquiries
    may cost about 25 cents each; asking ten cents for the same sample may push the cost of an
    inquiry to $1.25 or more, so the ten cents recovered can cost a dollar and can start only a
    fifth as many users for the same money. It calls economy on this point one of the greatest
    follies in advertising and states the rule as: remember you are the seller, make trial easy for
    the people you have interested, and do not ask them to pay for your efforts to sell them. It
    attaches a companion finding on discounting: tens of millions of advertisements offering one
    product free with the purchase of another were ineffective, because such an offer is simply a
    price reduction, and it is as hard to sell at half price as at full price to people who are not
    converted.
