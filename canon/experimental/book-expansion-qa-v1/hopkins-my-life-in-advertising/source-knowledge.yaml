- sk_id: sk_mla_0008
  source_id: hopkins-my-life-in-advertising
  source_terms:
    - "I offered both free for Christmas, not as a gift, but as a reward."
    - "This made him solicit me."
    - "I offered a privilege, not an inducement."
    - "I appeared as a benefactor, not as a salesman."
    - "They will never be offered again."
  concept_label: offer_the_trade_a_conditional_privilege_not_an_inducement
  label_origin: extractor_assigned
  claim: >
    The source describes a mechanism for obtaining retail distribution and display without a sales
    force and without margin concessions. The offer is framed as a limited privilege the dealer may
    apply for rather than an inducement pressed on him; it is made scarce by a stated finality
    ("never offered again"); and it is granted only against a signed agreement requiring specific
    merchandising acts — display the goods until sold, display the supplied cards, and enclose the
    supplied pamphlet in every package leaving the store for three weeks. The source states this
