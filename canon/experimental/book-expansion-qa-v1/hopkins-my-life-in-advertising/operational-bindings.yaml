  governance_consumer: null
  rationale: >
    The strongest test case this source yields is a minimal pair it discovered by accident: one
    trial-offer device, two product categories, opposite sign. It generates a benchmark item that
    penalises any system which applies a trial-offer heuristic without conditioning on category,
    and it is valuable precisely because the naive general rule fails it.
  applicability:
    when: "constructing test cases that probe whether an advertising heuristic is applied unconditionally"
    limits: >
      The underlying observation is a single reported ratio with no absolute numbers, no
      denominator, no date, and no statement of what else differed between the versions. The
      benchmark item tests reasoning about conditionality; it is not evidence about which framing
      wins in any category today.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mla_0017]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

