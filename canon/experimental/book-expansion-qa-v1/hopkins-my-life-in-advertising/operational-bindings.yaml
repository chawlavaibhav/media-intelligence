# Operational bindings (SPEC-04) — Claude C. Hopkins, "My Life in Advertising" (1927)
# source_id: hopkins-my-life-in-advertising
# EXPERIMENTAL — NOT LIVE CANON. Every binding is `status: proposed` or `production_candidate` and
# none has been reviewed.
#
# ZERO `creative_ir` BINDINGS, deliberately. A creative_ir binding requires a real SPEC-01 path, a
# schema and a schema version. This lane did not read SPEC-01 and will not invent a target_path;
# a fabricated path is exactly the SPEC-02 failure that SPEC-03 and SPEC-04 exist to prevent.
#
# MOST OF THIS SOURCE IS UNBOUND, and that is the correct outcome. Hopkins's advice is
# overwhelmingly about physical-era production and media — keyed coupons redeemed at independent
# grocers, one-cent letters to dealers, mail-order catalogues, door-to-door canvassing, 6-point
# letterpress body type. Under SPEC-04 those are `target_type: production`, `target_path: null`,
# `status: production_candidate`, and they are recorded in the source's own frame and left
# untranslated. No generative-media equivalent is asserted anywhere in this file.
#
# `evidence_basis` is never `cross_source_supported` or `empirically_supported` — neither is
# authorised in this task.
# All `failure_ontology_refs` and `repair_ontology_refs` are term_ids from this lane's
# ontology-mappings.yaml.

