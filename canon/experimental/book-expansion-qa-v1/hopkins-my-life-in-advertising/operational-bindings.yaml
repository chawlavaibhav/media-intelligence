- binding_id: bnd_mla_007
  source_knowledge_refs: [sk_mla_0062, sk_mla_0061]
  source_system_refs: [scs_mla_001]
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains]
  observation_unit: null
  governance_consumer: evidence_interpretation
  rationale: >
    This source states a refusal rule for evidence that is directly usable as a precedent for how
    outcome claims should be weighted: an observed commercial success does not license an inference
    to the advertising that accompanied it, because the success is overdetermined, and the source
    enumerates the competing explanations. It also supplies its own disconfirmation of a rival
    explanation — the same people succeeding once on a fortunate name and failing repeatedly after.
    The precedent is worth recording, and it is sharpened by the fact that the source does not
    apply it to its own narratives.
  applicability:
    when: "weighing an `outcome_claimed` evidence characteristic against `empirical_within_source`"
    limits: >
      This is a practitioner's methodological stance from 1927, not an established epistemic
      standard, and the source violates it throughout its own book. Its value is as a worked
      precedent and as a self-refuting example, not as authority.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mla_0003]
  repair_ontology_refs: [t_mla_0002]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_mla_008
  source_knowledge_refs: [sk_mla_0061]
  source_system_refs: [scs_mla_001]
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains]
  observation_unit: null
  governance_consumer: rule_application
  rationale: >
    In the same chapter where it states its principles, this source states that methods succeeding
    in one line cannot be applied to another, that some profitable methods are not a quarter as
    effective as others, and that regardless of principles one must always experiment. That is a
    source-stated limit on applying any of its own principles in isolation, and it is the kind of
    limit `rule_application` exists to carry.
  applicability:
    when: "a single principle from this source is being retrieved and applied to a new category"
    limits: >
      The source states the limit and immediately proceeds to give fourteen pages of general rules,
      so the limit is stated more clearly than it is observed. It nonetheless has the author's own
      authority, which is the strongest form this constraint can take.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_mla_009
  source_knowledge_refs: [sk_mla_0050, sk_mla_0026, sk_mla_0044]
  source_system_refs: [scs_mla_004]
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains]
  observation_unit: null
  governance_consumer: retrieval_governance
  rationale: >
    The trial-offer rules in this source mutually qualify each other and reverse sign by category.
    Retrieving any one of them alone reproduces the exact error the source spent money discovering.
    This binding records that scs_mla_004's members must not be split in retrieval — which is the
    named purpose of `retrieval_governance`.
  applicability:
    when: "retrieving any member of scs_mla_004 for a trial, sample or premium decision"
    limits: >
      The grouping into one mutually-qualifying set is the extractor's, not the source's; the
      source states the individual rules and notices only one of the reversals. The
      no-split constraint is therefore ours as well.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_mla_0012, t_mla_0016, t_mla_0017]
  repair_ontology_refs: [t_mla_0022, t_mla_0027]
  status: proposed
  status_reason: "experimental; not reviewed; the grouping is the extractor's"

- binding_id: bnd_mla_010
  source_knowledge_refs: [sk_mla_0022, sk_mla_0042]
  source_system_refs: [scs_mla_003]
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [flags]
  observation_unit: null
  governance_consumer: conflict_resolution
  rationale: >
    This source contains an unresolved internal contradiction that matters: it claims in one
    chapter to have moved most of a market off a household practice, and states in another that
    habits cannot be changed profitably in paid print. Both are its own accounts of its own
    campaigns. The contradiction is recorded rather than resolved, and it is flagged so that
    retrieving either claim surfaces the other instead of presenting one as the source's position.
  applicability:
    when: "either sk_mla_0022 or sk_mla_0042 is retrieved for a question about displacing an existing behaviour"
    limits: >
      No resolution is proposed. The available distinction — substituting a purchase for a disliked
      task versus creating an appetite that does not exist — is the extractor's reading and is
      recorded in sk_mla_0022's caveats as such, not as the source's reconciliation.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_mla_0015]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

