  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, flags]
  observation_unit: whole_asset
  governance_consumer: null
  rationale: >
    Two of this source's failure descriptions are surface-detectable in a finished asset without
    any knowledge of the market: an unquantified superlative used as the substantive claim, and a
    brand-insistence or self-directed instruction to the reader. Both are string-level and
    inexpensive to check, which makes them a reasonable first-pass flag rather than a judgement.
    See sk_mla_0029 and sk_mla_0012 for what the source actually claims about each.
  applicability:
    when: "a finished text-bearing asset whose principal claim can be read"
    limits: >
      The source studied print advertisements for mass-market American goods in the 1900s-1920s,
      and its evidence for both claims is practitioner assertion with one uncontrolled cost
      comparison. It also concedes that name-crying advertising may sometimes pay to an extent.
      A flag raised here means this source would object, not that the asset is worse.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mla_0011, t_mla_0008, t_mla_0009]
  repair_ontology_refs: [t_mla_0020, t_mla_0019]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_mla_002
  source_knowledge_refs: [sk_mla_0030]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  observation_unit: asset_set_over_time
  governance_consumer: null
  rationale: >
    The completeness claim is a property of a set, not of one asset: it says no proved appeal may
    be deferred to a later insertion. Detecting a violation requires seeing the whole set of assets
    for a line together and asking whether any single one, read alone, omits an argument the set
    treats as important. An evaluator scoring assets independently cannot see this at all.
  applicability:
    when: "a campaign's assets for one product are available together"
    limits: >
      The premise — that a reader sees one asset once and may not see another for months — is the
      source's own figuring about 1920s print and is asserted, not measured. In any environment
      with controlled or measurable frequency the premise may simply be false, and the rule then
      trades directly against the source's own space-economy doctrine (sk_mla_0052).
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_mla_0031]
  status: proposed
  status_reason: "experimental; not reviewed; premise is era-bound"

- binding_id: bnd_mla_003
  source_knowledge_refs: [sk_mla_0049, sk_mla_0050]
  source_system_refs: [scs_mla_004]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, flags]
  observation_unit: whole_asset
  governance_consumer: null
  rationale: >
    The source supplies two checks whose value is that they are conditional rather than absolute:
    whether an asset leads on a penalty or on a reward, and whether a free offer is the chief
    appeal in a category where the source found that reversed its results. The second is only
    meaningful with the product category attached, which is precisely why it is worth binding as a
    conditional check rather than as a rule.
  applicability:
    when: "the asset's product category is known and the asset makes a trial or premium offer"
    limits: >
      The reward-not-fear claim is a 1927 generalisation about human nature from one practitioner's
      American practice, with an exception the source itself states for buyers who already have the
      trouble. The divided-by-four figure is a single uncontrolled ratio on one product. Neither
      supports a scored penalty; both support a question.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_mla_0017]
  repair_ontology_refs: [t_mla_0033]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_mla_004
  source_knowledge_refs: [sk_mla_0033, sk_mla_0039]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [flags]
  observation_unit: asset_set_over_time
  governance_consumer: null
  rationale: >
    This source records a campaign whose response metrics were the best it ever saw and whose
    outcome was the destruction of the client, and separately records a pass criterion — repeat
    purchase inside the billing period — that is not a response metric. Together they argue that a
    measured response rate is not by itself evidence of success and that the evaluation window has
    to extend past the first conversion. The binding exists to make that objection representable,
    not to supply a threshold.
  applicability:
    when: "an evaluation regime is being defined and first-response metrics are candidates for the success criterion"
    limits: >
      The source neither states this as a rule nor applies it — it reports the disaster and the
      criterion in different chapters and never connects them. Treating the connection as the
      source's position would misrepresent it; the connection is drawn in sk_mla_0033's caveats as
      the extractor's observation.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_mla_0014]
  repair_ontology_refs: [t_mla_0006]
  status: proposed
  status_reason: "experimental; not reviewed; the connecting inference is ours, not the source's"

