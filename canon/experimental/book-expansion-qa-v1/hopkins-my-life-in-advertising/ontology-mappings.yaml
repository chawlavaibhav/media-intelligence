- {from: t_mla_0038, to: t_mla_0018, relation: related_to, confidence_basis: extractor_judgement, note: "the same class reasoning bounds the source's own competence and its medium choices"}
- {from: t_mla_0040, to: t_mla_0038, relation: uncertain, confidence_basis: extractor_judgement, note: "the timelessness claim is asserted over a body of work the source elsewhere scopes to one class, one market and one era; the relation between the two claims is unresolved in the source"}

