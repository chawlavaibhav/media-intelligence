- sk_id: sk_god_0009
  source_id: godin-this-is-marketing
  source_terms:
    - "Johnson took that action based on his worldview, on his bias about how to shop"
    - "he abandoned Penney's true fans: people who loved the sport of bargain hunting"
    - "As a result, sales plummeted by more than 50 percent"
    - "Penney's customers were playing a game, one that made them feel like they were winning"
  concept_label: substituting_your_own_worldview_for_the_audiences_destroys_the_fit
  label_origin: extractor_assigned
  claim: >
    Godin's worked failure case is an executive who ended a retailer's constant discounts and sales
    because he could not imagine a quality store behaving that way — a judgement made from his own
    worldview as a luxury buyer. Godin's reading is that the existing customers were not enduring the
    discounts but playing a game that made them feel like they were winning, so removing the
    discounts removed the product. He reports sales falling by more than fifty per cent. The general
    claim is that a change made from the maker's own preferences, however competently executed,
    breaks the fit with an audience whose worldview differs.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      What the customer was buying was not the stated product but the experience of winning at it.
      A decision taken from a different worldview optimises the stated product and deletes the
      experience, which is the part the audience was actually there for.
  scope:
    domain_discussed_by_source: [retail, marketing]
    conditions: "an established audience whose worldview differs from the decision-maker's"
  caveats:
