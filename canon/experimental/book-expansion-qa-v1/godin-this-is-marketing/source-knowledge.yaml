- sk_id: sk_god_0011
  source_id: godin-this-is-marketing
  source_terms:
    - "Desire for gain versus avoidance of loss"
    - "Here are your new glasses. If they work and you like them, please pay us three dollars. If you don't want them, please give them back"
    - "One thing that doubled the percentage of glasses sold"
    - "Maybe the people we were trying to serve saw shopping for something new as a threat, not as a fun activity"
    - "My narrative is simply my narrative, and if it's not working, it's arrogant to insist on it"
  concept_label: which_frame_works_depends_on_the_audiences_relation_to_risk
  label_origin: extractor_assigned
  claim: >
    Godin's sharpest case for "you are not your customer" turns on one change of frame. Selling
    reading glasses in a village, about a third of the people who needed them, knew they needed them
    and had the money bought a pair. The offer had been framed as shopping — a choice of ten styles,
    a mirror, new stock in sleeves. Changing it to loss avoidance — here are your glasses, pay to
    keep them or hand them back — is reported to have doubled the proportion sold. His explanation
    is about risk capacity rather than psychology in general: shopping is a risk, and it is
    enjoyable only to people for whom being wrong is not costly, because being wrong does not cost
    them dinner or a medical check-up. For an audience without that margin, the same offer reads as
    a threat. He draws the general rule that his own narrative is not better or worse, only his,
    and that insisting on it when it is not working is arrogance.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Whether a choice is experienced as an opportunity or as an exposure depends on what being
      wrong costs the chooser. The frame does not change the goods; it changes which of those two
      experiences the offer presents.
  scope:
    domain_discussed_by_source: [social_enterprise, retail, marketing]
    conditions: "audiences whose capacity to absorb a wrong choice differs from the marketer's"
  caveats:
    - text: >
        The doubling is an outcome claimed without controls: one afternoon, one village, one
        observer, no comparison group, no count reported beyond "about a third" and "doubled". It is
        recorded as outcome_claimed and anecdotal, NOT as a measurement, and nothing in this lane
        treats it as a rate.
      origin: extractor_observed
    - text: >
        Godin's own framing of the episode is that he was mystified and changed one thing; the
        explanation about risk capacity is his interpretation afterwards, not a tested hypothesis.
      origin: extractor_observed
    - text: >
        Culturally and materially bounded: a specific village, a specific income level, a specific
        moment. Godin uses it to argue that the marketer's assumptions do not transfer, which is an
        argument that would be undermined by treating the result itself as transferable.
      origin: extractor_observed
  source_stated_problems:
    - "it's not helpful to imagine that everyone knows what you know, wants what you want, believes what you believe"
    - "To go shopping is to take a risk"
  source_stated_remedies:
    - "caring enough about those we serve to imagine the story that they need to hear"
  examples:
