- sk_id: sk_god_0020
  source_id: godin-this-is-marketing
  source_terms:
    - "Marketers create tension, and forward motion relieves that tension"
    - "None of those feelings existed before a marketer showed up with something that caused them"
    - "We intentionally create these gaps, these little canyons of tension that people find themselves leaping over"
    - "Launch a new project and, in addition to serving your audience, you'll be breaking something"
    - "The very existence of a fancier alternative degraded their experience at their former favorite"
  concept_label: change_requires_a_gap_that_only_moving_forward_closes
  label_origin: extractor_assigned
  claim: >
    Godin's account of how anything actually moves is that the marketer creates a gap and the only
    way to close it is forward motion. He is unusually direct that the gap is manufactured: the
    feelings involved did not exist before someone arrived with something that caused them — if
    there were no new album you would not feel left out for not having heard it. The second half is
    the part practitioners miss: launching anything breaks something. The second hotel makes the
    first no longer the only one; a fancier casino makes last year's satisfied visitor ask whether
    he is the sort of person who goes somewhere this run-down. So a new offering does not merely add
    an option, it degrades the standing of what people already chose, and that degradation is the
    tension. He puts the diagnostic as a question to the maker: when you arrive with your solution,
    do you also create tension — because if you do not, the status quo is likely to survive.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The gap is a discrepancy in standing — between where the person is and where people like them
      now are. It is not closed by information, because information does not change standing; it is
      closed only by taking the action that moves them.
  scope:
    domain_discussed_by_source: [marketing, software, retail, hospitality, automotive]
    conditions: "an offering that changes what is normal for a group the audience identifies with"
  caveats:
    - text: >
        Godin's own strongest case is uncomfortable and he does not soften it: a workplace tool
        spread because every day a colleague was not on it, people were talking about them behind
        their back and working without them. The tension is exclusion. That sits close to the fear
        boundary he draws elsewhere, and the two objects should be read together.
      origin: extractor_observed
    - text: >
        "If you don't [create tension], the status quo is likely to survive" is stated as a rule
        with no case where tension was created and the status quo survived anyway.
      origin: extractor_observed
