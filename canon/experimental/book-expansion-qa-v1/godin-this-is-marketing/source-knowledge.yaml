      figures: []

- sk_id: sk_god_0002
  source_id: godin-this-is-marketing
  source_terms:
    - "Who's it for and what's it for are the two questions that guide all of our decisions"
    - "What change are you trying to make?"
    - "It has a subtle but magic power, the ability to shift the product you make, the story you tell, and where you tell it"
    - "Change is best made with intent. 'What's it for?' is the posture of work that matters"
  concept_label: whos_it_for_and_whats_it_for_are_settled_before_execution
  label_origin: source_verbatim
  claim: >
    Godin's operating rule is that two questions — who is it for, and what is it for — are answered
    before anything is made, and that everything downstream is derived from them. "What's it for" is
    put in its strong form as "what change are you trying to make?", which he insists is a claim of
    responsibility: you are an actor with intent trying to change other human beings, and denying
    that is a form of hiding. He claims the answers are not descriptive but generative: once you are
    clear who it is for, the answer shifts the product you make, the story you tell and where you
    tell it. His worksheet makes the pair the first two lines of a thirteen-question specification.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An unspecified audience cannot constrain a decision, so every later choice is made on the
      maker's own taste. Naming the audience and the change converts taste questions into fit
      questions, which have answers.
  scope:
    domain_discussed_by_source: [marketing, nonprofit_fundraising, politics, internal_persuasion, entrepreneurship]
    conditions: "before the product, the story and the channel are chosen"
  caveats:
    - text: >
        Godin names two ways the "what change" answer goes wrong and both are worth keeping: picking
        a grandiose, nearly impossible change, which he calls both a heavy burden and a convenient
        excuse; and reverse-engineering a change to match what you were already going to sell, which
        he says arrives loaded with buzzwords.
      origin: source_stated
    - text: >
        The claim that answering the two questions shifts the product, the story and the channel is
        asserted throughout and demonstrated nowhere with a case where the answers changed and the
        work changed with them.
      origin: extractor_observed
  source_stated_problems:
    - "hiding behind everyone or anyone"
    - "you reverse-engineer a 'change' that matches that thing, and you load it up with buzzwords that mean nothing to anyone"
    - "It's tempting to pick a grandiose, nearly impossible change"
  source_stated_remedies:
    - "Who's it for? What's it for?"
    - "be very specific about the change you seek to make, and to make it happen"
    - "My product is for people who believe ___. I will focus on people who want ___. I promise that engaging with what I make will help you get ___."
  examples:
    positive:
      - {description: "a gluten-free bakery whose stated change is that no one is left out of a family occasion — hosts move from exclusive to inclusive, guests from outsiders to insiders", figure_ref: null}
    counter:
      - {description: "'Activation and engagement for a new thriller that makes a meta-statement about viewer identity', quoted by Godin as a reverse-engineered change", figure_ref: null}
  intra_source_relations:
    - {relation: specialises, target: sk_god_0001, note: "the operational form of the ordering constraint"}
    - {relation: generalises, target: sk_god_0003, note: "the smallest viable market is the answer to who's it for"}
    - {relation: member_of_system, target: scs_god_002}
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, mechanism_given, repeated_within_source]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: 'Ch. 4 "The Smallest Viable Market", sections "What change are you trying to make?", "Who are you seeking to change?" and "The simple marketing promise" (spine 11)'
    section: 'with the thirteen questions in "A Simple Marketing Worksheet" (spine 32)'
    page_start: null
    page_end: null
    figure_refs: []
    source_support: text
    inspected:
      text: true
      figures: []

- sk_id: sk_god_0003
  source_id: godin-this-is-marketing
  source_terms:
    - "the smallest viable market"
    - "The relentless pursuit of mass will make you boring, because mass means average, it means the center of the curve, it requires you to offend no one and satisfy everyone"
    - "What's the minimum number of people you would need to influence to make it worth the effort?"
    - "find a corner of the market that can't wait for your attention. Go to their extremes"
    - "The smallest viable market is the focus that, ironically and delightfully, leads to your growth"
  concept_label: narrowing_the_audience_improves_the_work_rather_than_merely_reducing_reach
  label_origin: extractor_assigned
  claim: >
    Godin's mechanism for the smallest viable market is not that a small audience is easier to
    reach. It is that pursuing mass forces the work itself to become average: mass means the centre
    of the curve, which requires offending no one and satisfying everyone, and therefore leads to
    compromises and generalisations. Narrowing removes that constraint. Once the audience is small
    and specific, you can go to their extremes, find a position where you alone are the perfect
    answer, and overwhelm their wants with attention — producing change profound enough that people
    cannot help but talk about it. The size question is asked as a floor, not a target: what is the
    minimum number of people you would need to influence to make it worth the effort.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Satisfying everyone and offending no one are constraints on the artefact, not on the audience.
      Removing them by shrinking the audience is what permits extremity, and extremity is what makes
      the work worth remarking on, which is how it then spreads back outward.
  scope:
    domain_discussed_by_source: [marketing, restaurants, music, publishing, politics, nonprofit_advocacy]
    conditions: "projects that can survive on a defined minimum audience and can be made more extreme"
  caveats:
    - text: >
        The word "viable" is load-bearing and Godin says so: no fair shipping junk; it does not help
        to release something that does not work yet. The minimum is a minimum audience, not a minimum
        standard.
      origin: source_stated
    - text: >
        Every supporting case is a survivor — a restaurant that became famous, a band that grossed
        hundreds of millions, a lobbying organisation with five million members. Projects that
        narrowed to a small audience and simply stayed small are absent and cannot appear.
      origin: extractor_observed
    - text: >
        The promise that focus "leads to your growth" is the part with least support. Godin shows
        cases where narrow beginnings preceded growth; he shows nothing about the rate at which they
        do.
      origin: extractor_observed
  source_stated_problems:
    - "mass means average ... it requires you to offend no one and satisfy everyone"
    - "It will lead to compromises and generalizations"
    - "the hubris of everyone"
  source_stated_remedies:
    - "Begin instead with the smallest viable market"
    - "Go to their extremes. Find a position on the map where you, and you alone, are the perfect answer"
    - "Choose the people you serve, choose your future"
  examples:
    positive:
      - {description: "a restaurant that could seat only six hundred a day, whose founder treated the constraint as a reason to curate which six hundred", figure_ref: null}
      - {description: "a band with one top-40 hit that grossed hundreds of millions from concerts by serving a small audience intensely and letting them spread the word", figure_ref: null}
      - {description: "a lobbying organisation with about two per cent of the population as members, comfortable saying 'it's not for you'", figure_ref: null}
    counter:
      - {description: "the hit machine, which Godin explicitly says is a different job and probably not yours", figure_ref: null}
  intra_source_relations:
    - {relation: specialises, target: sk_god_0002, note: "the answer to who's it for"}
    - {relation: qualified_by, target: sk_god_0005, note: "the failure mode that follows from abandoning it under rejection"}
    - {relation: depends_on, target: sk_god_0015, note: "the smallest viable market works because it maximises the chance of changing a culture"}
    - {relation: member_of_system, target: scs_god_002}
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given, repeated_within_source, anecdotal]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
