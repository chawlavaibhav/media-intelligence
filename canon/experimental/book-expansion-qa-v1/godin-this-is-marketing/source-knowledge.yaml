- sk_id: sk_god_0016
  source_id: godin-this-is-marketing
  source_terms:
    - "The status quo doesn't shift because you're right. It shifts because the culture changes. And the engine of culture is status"
    - "If all it took to upend the status quo was the truth, we would have changed a long time ago"
    - "changing our behavior is driven by our desire to fit in (people like us do things like this) and our perception of our status (affiliation and dominance). Since both these forces often push us to stay as we are, it takes tension to change them"
  concept_label: being_right_does_not_move_the_status_quo
  label_origin: extractor_assigned
  claim: >
    Godin's central negative claim is that correctness is not a mechanism of change. The status quo
    is good at resisting insurgents; if truth alone were sufficient the change would already have
    happened, and if a better idea or a simpler solution were sufficient it would have happened a
    year or a decade or a century ago. What moves it is cultural change, and the engine of culture
    is status. He then states the full chain: behaviour is driven by the desire to fit in and by the
    perception of status, both of those forces push toward staying as we are, and therefore change
    requires tension. This is the load-bearing sentence of the book and the reason the status
    material is not decoration.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Both drivers of behaviour are conservative by construction: fitting in rewards doing what is
      already done, and status is protected by not moving. An argument addresses neither, so a
      correct argument leaves the forces that determine the behaviour untouched.
  scope:
    domain_discussed_by_source: [marketing, politics, cultural_change, organisational_change]
    conditions: "any attempt to displace an established behaviour or default"
  caveats:
    - text: >
        Godin asserts the primacy of status without argument beyond illustration, and his
        illustrations run from penguins and dogs to a film scene to a fundraising gala. The claim
        that status is THE engine, rather than one engine, is his position.
      origin: extractor_observed
    - text: >
        Read as a normative claim this licenses persuasion that bypasses the truth of a case. Godin
        addresses the ethics separately and in a chapter this lane refuses; nothing here endorses
        the licence.
