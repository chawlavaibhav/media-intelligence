- sk_id: sk_god_0018
  source_id: godin-this-is-marketing
  source_terms:
    - "Affiliation and dominion are different ways to measure status"
    - "Dominion is a vertical experience, above or below. Affiliation is a horizontal one: Who's standing next to me?"
    - "Affiliation or dominance is up to the customer, not you"
    - "Affiliation isn't as focused on scarcity as dominion is, because affiliation admires the network effect ... Abundance is welcome"
  concept_label: affiliation_and_dominion_are_two_measures_and_the_audience_picks_which
  label_origin: extractor_assigned
  claim: >
    Godin splits status into two different things being counted. Dominion asks who has more power,
    whose side is winning, what is mine and not yours — a vertical measure. Affiliation asks who
    knows you, who trusts you, what your circle is like, where you stand within the tribe — a
    horizontal one. The operational point is the priority: which measure applies is the customer's,
    not the marketer's, and the way you see the world matters far less than the worldview of those
    you seek to serve. He notes the two behave differently under abundance — affiliation welcomes
    the network effect because more affiliation benefits everyone affiliated, while dominion is
    scarcity-bound because someone must be below.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A signal that raises standing on one measure is inert or hostile on the other: an invitation
      to belong is worthless to someone counting who is winning, and a claim to dominate repels
      someone counting who is in sync.
