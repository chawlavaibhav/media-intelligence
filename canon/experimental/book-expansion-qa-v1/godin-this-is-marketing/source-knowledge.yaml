- sk_id: sk_god_0008
  source_id: godin-this-is-marketing
  source_terms:
    - "Begin by choosing people based on what they dream of, believe, and want, not based on what they look like"
    - "use psychographics instead of demographics"
    - "worldviews"
    - "Yes, we're typecasting—willfully exaggerating people's attitudes and beliefs in order to serve them better"
    - "Everyone has a problem, a desire, and a narrative"
  concept_label: group_people_by_what_they_believe_not_by_what_they_look_like
  label_origin: extractor_assigned
  claim: >
    Godin's grouping rule is psychographic rather than demographic: choose people by what they dream
    of, believe and want, and treat the resulting group as sharing a worldview — the lens, the
    assumptions and biases through which they see. He is explicit that this is a deliberate
    simplification and defends it as one: we are typecasting, willfully exaggerating people's
    attitudes and beliefs in order to serve them better. The payoff he claims is predictive — with
    evidence about a worldview you can make reasonable assumptions about how someone will respond to
    a piece of news or a work. His example is that two coffee chains sold to groups distinguished
    not by external markers but by an internal set of beliefs about coffee, time, money, community
    and luxury.
