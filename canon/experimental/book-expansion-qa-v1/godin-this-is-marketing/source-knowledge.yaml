- sk_id: sk_god_0015
  source_id: godin-this-is-marketing
  source_terms:
    - "People like us do things like this"
    - "our actions are primarily driven by one question: 'Do people like me do things like this?'"
    - "Normalization creates culture, and culture drives our choices, which leads to more normalization"
    - "We can't change the culture, but each of us has the opportunity to change a culture—our little pocket of the world"
    - "What the marketer, the leader, and the organizer must do as their first job is simple: define 'us'"
  concept_label: people_like_us_do_things_like_this
  label_origin: source_verbatim
  claim: >
    Godin's account of why people act as they do is a single question they ask themselves — do
    people like me do things like this — and he makes it primary rather than one factor among
    several. Culture is produced by normalisation, and normalisation is produced by choices made in
    answer to that question, so the loop is self-reinforcing. Two consequences follow that he states
    explicitly. First, the marketer cannot change "the culture", only "a culture" — one pocket of the
    world — which is why the smallest viable market maximises the chance of changing anything at all.
    Second, the first job is to define "us", and the more specific and tighter the "us" the better;
    he warns that defining it backwards — the people who do this are people like us — is not an
