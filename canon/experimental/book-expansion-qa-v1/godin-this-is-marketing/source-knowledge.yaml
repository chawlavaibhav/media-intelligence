  concept_label: better_is_not_a_single_scale_and_is_not_the_makers_to_declare
  label_origin: extractor_assigned
  claim: >
    Godin denies that "better" is transitive or objective. Price is measurable and orders cleanly,
    but it does not follow that the more expensive item is better; and for the properties people
    actually choose on — stylish, fashionable, status — there is no line to be more or less far
    along. His mechanism is about memory: faced with hundreds of options nobody can hold, we remember
    the best one, and "best" is always best-for-me on the dimension I happen to care about, so the
    same category has a different winner in each head. His demonstration is that a dominant search
    engine won not on results or speed but because its box did not make you feel stupid — better on
    a dimension its rivals were not competing on, and better only for some people.
