        This is a single retrospective case with a dramatic outcome and no controls. The
        fifty-per-cent figure is reported, not sourced, and the causal attribution to worldview
        mismatch is Godin's reading of a decision with many other moving parts.
      origin: extractor_observed
    - text: >
        Period-bound: a US department-store episode of 2011-13, in a retail environment that no
        longer exists in that form.
      origin: extractor_observed
