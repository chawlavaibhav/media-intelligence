- sk_id: sk_god_0019
  source_id: godin-this-is-marketing
  source_terms:
    - "Tension is not the same as fear"
    - "If you feel like you're coercing people, manipulating them or causing them to be afraid, you're probably doing it wrong"
    - "Fear's a dream killer. It puts people into suspended animation, holding their breath, paralyzed and unable to move forward"
    - "There might be fear, but tension is the promise that we can get through that fear to the other side"
    - "Tension is the hallmark of a great educational experience"
  concept_label: tension_is_not_fear_and_the_difference_is_whether_forward_motion_is_available
  label_origin: extractor_assigned
  claim: >
    Godin draws a distinction he treats as the ethical boundary of his method. Fear paralyses: it
    puts people into suspended animation, holding their breath, unable to move forward, and fear
    alone will not produce change. Tension is different in kind — it is the promise that you can get
    through the fear to the other side, the state of "this might work versus this might not work",
    and the state of knowing you do not yet know something. He calls tension the hallmark of a great
    educational experience and says all effective education creates it, because just before you
    learn something you are aware you do not know it. His practical test for having crossed the
    line is subjective and he offers no other: if you feel like you are coercing, manipulating or
    frightening people, you are probably doing it wrong.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Fear and tension are both discomfort; they differ in whether a route out is visible. Where
      forward motion is available the discomfort is a reason to move, and where it is not the same
      discomfort produces immobility.
  scope:
    domain_discussed_by_source: [marketing, education, cultural_change]
    conditions: "any attempt to move someone off an established behaviour"
  caveats:
    - text: >
        The test is the marketer's own feeling. Godin supplies no criterion the person on the
        receiving end could apply, and several of his own approved cases — the colleague saying
        "you're missing out", the fear of social isolation as a joining motive — sit close to the
        line he is drawing.
      origin: extractor_observed
    - text: >
        "Once we see a way out, the tension can be the tool that moves us" makes the availability of
        forward motion the whole distinction. Whether the route out is genuinely available, or only
        appears to be, is the question the framing does not ask.
      origin: extractor_observed
  source_stated_problems:
