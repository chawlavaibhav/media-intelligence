# ─────────────────────────────────────────────────────────────
# WHO IT IS FOR — audience selection before anything is made
# ─────────────────────────────────────────────────────────────

- sk_id: sk_god_0001
  source_id: godin-this-is-marketing
  source_terms:
    - "It doesn't make any sense to make a key and then run around looking for a lock to open"
    - "The only productive solution is to find a lock and then fashion a key"
    - "It's easier to make products and services for the customers you seek to serve than it is to find customers for your products and services"
  concept_label: the_audience_is_chosen_before_the_artefact_is_made
  label_origin: extractor_assigned
  claim: >
    Godin states an ordering constraint on the work: the audience is selected first and the thing is
    built for that audience, not the other way round. His argument for it is asymmetry of
    difficulty — it is easier to make products and services for the customers you seek to serve than
    to find customers for the products and services you already made. He returns to this as the
    difference between being marketing-driven, which he calls a dead end, and being market-driven.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A key has one shape and must find the single lock it fits; a lock can be measured and a key cut
      to it. Choosing the audience first turns an unbounded search into a specification problem.
  scope:
    domain_discussed_by_source: [marketing, product_development, nonprofit_fundraising, entrepreneurship]
    conditions: "any project whose success depends on being chosen by people who are not obliged to choose it"
  caveats:
    - text: >
        Argued by analogy. Godin offers no case in which the reverse order was tried and failed, and
        the whole book is written for people who have not yet committed to a product — the ordering
        constraint says nothing about what to do when the artefact already exists.
      origin: extractor_observed
    - text: >
        His own contrary case is uncomfortable and he does not resolve it: he says the crowd did not
        invent the Model T, the smartphone or rap, and that people are terrible at inventing new ways
        to address their wants. So the audience is chosen first but not consulted first.
      origin: source_stated
  source_stated_problems:
    - "run around looking for a lock to open"
    - "marketing-driven ... it's a dead end"
  source_stated_remedies:
    - "find a lock and then fashion a key"
    - "be market-driven — to hear the market, to listen to it, and even more important, to influence it"
  examples:
    positive:
      - {description: "an online meditation community built after noticing a need retreat attendees kept voicing, rather than a course built and then promoted", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: generalises, target: sk_god_0002, note: "the two questions are the operational form of this ordering"}
    - {relation: depends_on, target: sk_god_0010, note: "choosing an audience first is only useful if you can model people unlike yourself"}
    - {relation: member_of_system, target: scs_god_002}
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given, repeated_within_source]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: 'Ch. 1 "Not Mass, Not Spam, Not Shameful . . .", section "The lock and the key" (spine 8)'
    section: 'with "Market-driven: Who''s driving the bus?" in Ch. 3 (spine 10)'
    page_start: null
    page_end: null
    figure_refs: []
    source_support: text
    inspected:
