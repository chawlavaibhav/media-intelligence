- sk_id: sk_god_0004
  source_id: godin-this-is-marketing
  source_terms:
    - "Specific is a kind of bravery"
    - "Specific means accountable. It worked or it didn't. It matched or it didn't. It spread or it didn't"
    - "Are you hiding behind everyone or anyone?"
    - "You'll never be able to serve everyone, which is comforting, since you're less likely to be disappointed when it doesn't happen"
  concept_label: everyone_is_unfalsifiable_and_therefore_comfortable
  label_origin: extractor_assigned
  claim: >
    Godin gives an unusually sharp reason why practitioners choose broad audiences, and it is not
    ambition. A specific audience makes the work accountable — it matched or it did not, it spread or
    it did not — and an unspecified one cannot fail, because no outcome can contradict it. He calls
    "everyone" a place to hide and notes the comfort explicitly: you will never serve everyone,
    which is comforting, because you are less likely to be disappointed when it does not happen. So
    specificity is framed as bravery rather than as technique.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A target that cannot be missed cannot be aimed at. Naming the audience creates a condition
      under which the work can be shown to have failed, and it is the exposure to that judgement,
      not the arithmetic, that people avoid.
  scope:
    domain_discussed_by_source: [marketing, creative_work, entrepreneurship]
    conditions: "whenever a maker must state who the work is for"
  caveats:
    - text: >
        This is a claim about practitioners' motives — that vagueness is chosen for psychological
        cover — offered with no evidence beyond Godin's observation of the people he teaches.
      origin: extractor_observed
  source_stated_problems:
    - "hiding behind everyone or anyone"
  source_stated_remedies:
