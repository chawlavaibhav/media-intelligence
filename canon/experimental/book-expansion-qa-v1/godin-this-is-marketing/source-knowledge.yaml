- sk_id: sk_god_0014
  source_id: godin-this-is-marketing
  source_terms:
    - "draw a simple XY grid ... For each axis, choose something that people care about"
    - "This involves going to extremes. Finding an edge. Standing for something, not everything"
    - "If you do, you'll certainly be choosing a crowded quadrant ... Your customer doesn't know what to do, so he does nothing"
    - "Claims that are true, that we continually double down on in all our actions. Claims that are generous, that exist as a service to the customer"
    - "Once you claim a story ... then you're on the hook. On the hook to deliver"
  concept_label: positioning_is_choosing_two_axes_and_going_to_their_extremes
  label_origin: extractor_assigned
  claim: >
    Godin's positioning method is mechanical: draw two axes from attributes people care about, plot
    every available alternative on them, and take a position at an extreme rather than in the
    middle. The trade-off he attaches is the part with content. Choosing the axes most people care
    about puts you in a crowded quadrant, and in a crowded quadrant — without the magic of
    advertising — you cannot grow, because the customer does not know what to do and therefore does
    nothing. The alternative is to build your own quadrant from two overlooked axes and be the clear
    and obvious choice on them. He adds two modern conditions on the claims: they must be true and
    continually doubled down on in all your actions, and they must be generous, existing as a
    service to the customer, because the mid-century practice of inventing a differentiating claim
    does not hold up in a hyper-competitive world. And he names the cost: once you claim a story you
    are on the hook to deliver it — his music teacher now actually has to be more rigorous and to
    expel students who are not serious.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A crowded quadrant offers the chooser no basis for deciding, and the default response to an
      undecidable choice is not a random pick but inaction. An uncrowded quadrant makes the decision
      trivial for the people who care about those two axes and irrelevant to everyone else.
  scope:
    domain_discussed_by_source: [marketing, small_business, professional_services, consumer_goods]
    conditions: "categories with many alternatives and no advertising budget to force attention"
  caveats:
    - text: >
        The choice of axes is unconstrained. Godin prints a list of two dozen candidates and says
        you know your space better than he does, so the method organises a decision it does not
        make. Its output is only as good as the axes chosen.
      origin: extractor_observed
    - text: >
        The truth-and-generosity conditions are stated as a historical shift — this used to work,
        now it does not — without evidence for the shift.
      origin: extractor_observed
    - text: >
        His own worked case shows the method's cost and he does not hide it: the teacher who claims
        rigour has to expel students, and Godin says plainly that the resulting teacher is not one
        he would have wanted himself.
      origin: source_stated
  source_stated_problems:
    - "a crowded quadrant"
    - "Your customer doesn't know what to do, so he does nothing"
    - "'You can choose anyone, and we're anyone'"
    - "they're all lumped together"
  source_stated_remedies:
    - "build your own quadrant. To find two axes that have been overlooked"
    - "Choose your axes, choose your future"
  examples:
    positive:
      - {description: "two music teachers a few blocks apart occupying opposite positions — rigour and competition results against whole-student experience — who Godin says do not compete", figure_ref: null}
