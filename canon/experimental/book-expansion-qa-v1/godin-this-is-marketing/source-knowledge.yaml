- sk_id: sk_god_0007
  source_id: godin-this-is-marketing
  source_terms:
    - "The comedian's dilemma"
    - "Then he discovers that the audience is an Italian tour group, and no one understands English"
    - "It's entirely possible that your work isn't as good as it needs to be. But it's also possible that you failed to be clear about who it was for in the first place"
  concept_label: work_that_lands_badly_has_two_candidate_causes_and_they_need_different_fixes
  label_origin: extractor_assigned
  claim: >
    Godin insists on a diagnostic split that practitioners routinely collapse. When work fails in
    front of an audience there are two candidate explanations: the work is not good enough, or the
    audience was never the one it was for. His illustration puts a skilled comedian in front of a
    tour group that does not speak his language — the failure is total and tells him nothing about
    his material. The consequence is that the same symptom licenses opposite responses, and the
    diagnosis must be made before either is attempted.
