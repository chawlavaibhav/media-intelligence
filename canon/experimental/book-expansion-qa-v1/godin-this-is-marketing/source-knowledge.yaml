- sk_id: sk_god_0006
  source_id: godin-this-is-marketing
  source_terms:
    - "'It's not for you'"
    - "shows the ability to respect someone enough that you're not going to waste their time, pander to them, or insist that they change their beliefs"
    - "It's impossible to create work that both matters and pleases everyone"
    - "the freedom to ignore the critics who don't get the joke, the privilege of polishing your story for those that most need to hear it"
  concept_label: exclusion_is_the_other_face_of_the_choice_to_serve
  label_origin: extractor_assigned
  claim: >
    Godin treats deliberate exclusion as constitutive of positioning rather than as its regrettable
    side effect: "I made this for you, not for the other folks" and "it's not for you" are two sides
    of the same coin. His argument is that exclusion is an act of respect — refusing to waste
    someone's time, to pander to them, or to insist that they change their beliefs — and that the
    alternative is impossible anyway, since no work both matters and pleases everyone. What the
    stance buys is operational: freedom to ignore critics outside the audience, and the ability to
    polish the work for those who most need it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A promise made to a specific group is a promise not made to everyone else. Saying so
      explicitly converts an unavoidable exclusion into information the excluded person can act on,
      and frees the maker from a judgement that was never relevant.
  scope:
    domain_discussed_by_source: [marketing, publishing, restaurants, comedy, nonprofit_advocacy]
    conditions: "any offering that has chosen a specific audience"
  caveats:
    - text: >
        Godin's own worked case shows what it costs. A restaurant group that ended tipping had to
        accept that diners who enjoyed the status of a large tip could no longer get it — "It's not
        for you, sorry." The choice is stated as choosing whom to disappoint, not as avoiding
        disappointment.
      origin: source_stated
    - text: >
        The framing of exclusion as respect is Godin's ethical position, not a finding about how
        excluded audiences experience it.
      origin: extractor_observed
  source_stated_problems:
    - "waste their time, pander to them, or insist that they change their beliefs"
    - "It's impossible to create work that both matters and pleases everyone"
  source_stated_remedies:
    - "I made this for you. Not for the other folks, but for you"
    - "I'm sorry, this isn't for you, here's the phone number of my competitor"
  examples:
    positive:
      - {description: "a restaurant group eliminating tipping, accepting that some diners lose a status they valued, in exchange for regulars whose worldview is fairness and dignity", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: demonstrated_together_with, target: sk_god_0005, note: "the stance that answers the rejection pressure"}
    - {relation: depends_on, target: sk_god_0013, note: "you can only say it is not for them once you accept better is not a single scale"}
    - {relation: member_of_system, target: scs_god_002}
