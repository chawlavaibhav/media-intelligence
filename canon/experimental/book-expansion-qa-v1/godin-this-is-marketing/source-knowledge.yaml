- sk_id: sk_god_0017
  source_id: godin-this-is-marketing
  source_terms:
    - "Status is always relative ... 6 is bigger than 4, but lower than 11. There is no highest number"
    - "Status is in the eyes of the beholder"
    - "Status attended to is the status that matters"
    - "Status has inertia. We're more likely to work to maintain our status (high or low) than we are to try to change it"
    - "Status is learned"
    - "Shame is the status killer"
    - "It's a mistake to believe that everyone wants to make their status higher. In fact, few people do"
  concept_label: six_properties_of_status_and_the_error_of_assuming_everyone_wants_more
  label_origin: extractor_assigned
  claim: >
    Godin sets out six properties of status as a working model. It is relative, so there is no
    absolute scale and no highest position. It is in the eye of the beholder, so someone may be low
    status to outsiders and high status in their own narrative, both true at once. It matters only
    when attended to. It has inertia — people are more likely to work to maintain their status,
    high or low, than to change it. It is learned early, though a cohort can shift the perception
    quickly. And shame is the status killer, which is why shame works as a lever. From these he
    draws the correction that does the most work: it is a mistake to believe everyone wants higher
    status, and equally a mistake to believe no one wants lower — some people are hungry for a shift
    in either direction and others will fight to keep the role they have.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because status is relative and attended-to, an offer that changes someone's standing is read
      as a change to their position in a group rather than as a change to their possessions, and
      because it has inertia the default reading of any such offer is a threat.
  scope:
    domain_discussed_by_source: [marketing, sales, organisational_behaviour, politics]
    conditions: "any interaction in which more than one person is present"
  caveats:
