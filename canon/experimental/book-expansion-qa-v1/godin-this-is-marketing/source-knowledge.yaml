- sk_id: sk_god_0010
  source_id: godin-this-is-marketing
  source_terms:
    - "People don't believe what you believe. They don't know what you know. They don't want what you want"
    - "sonder"
    - "they use marketing to solve other people's problems. They have the empathy to know that those they seek to serve don't want what the marketer wants, don't believe what they believe, and don't care about what they care about. They probably never will"
    - "if you're unwilling to have empathy for the narrative of the person you seek to serve, you're stealing"
  concept_label: you_are_not_your_customer_and_they_will_probably_never_be
  label_origin: extractor_assigned
  claim: >
    Godin's empathy principle is not a disposition but a working constraint with a hard edge: the
    people you seek to serve do not believe what you believe, do not know what you know, do not want
    what you want, and — the clause that does the work — probably never will. So the task is not to
    persuade them into your position but to model theirs. He names the two symmetrical errors:
    assuming the people you serve are well-informed, rational, independent, long-term choice makers,
    and assuming that everyone is like you. His strongest form of the argument inverts the usual
    ethics: refusing to imagine the other person's narrative is not modesty but theft, because it
    withholds an option they would have benefited from.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Every purchase is a bargain from the buyer's side — they paid less than it was worth to them,
      or they would not have bought. Judging the offer by what it would be worth to you substitutes
      the wrong valuer, and the mismatch is not corrected by better argument.
  scope:
    domain_discussed_by_source: [marketing, nonprofit_fundraising, sales, politics]
    conditions: "any offer made to someone who is not the maker"
  caveats:
    - text: >
        Godin sets the bar for accepting difference unusually high and it should be kept: "we're not
        faking our points of view, our dreams, and our fears. And neither are you." He rejects the
        assumption that people on the other side of a divide secretly agree with you.
      origin: source_stated
    - text: >
        The "you're stealing" formulation is rhetoric doing ethical work. The extractable claim is
        the narrower one about modelling the other's narrative; the theft framing is his position.
      origin: extractor_observed
    - text: >
        Adjacent to, and not identical with, the empathy argument in the live corpus. Nothing here
        is asserted about any other source.
      origin: extractor_observed
  source_stated_problems:
    - "Assume that the people you're seeking to serve are well-informed, rational, independent, long-term choice makers"
    - "Assume that everyone is like you, knows what you know, wants what you want"
    - "insisting that they get with our program"
  source_stated_remedies:
    - "It's so much more productive to dance with them instead"
    - "the empathy to imagine what someone else would want, what they might believe, what story would resonate with them"
  examples:
