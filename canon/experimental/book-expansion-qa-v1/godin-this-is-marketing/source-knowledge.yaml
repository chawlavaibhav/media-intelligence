- sk_id: sk_god_0021
  source_id: godin-this-is-marketing
  source_terms:
    - "Pattern match/pattern interrupt"
    - "A pattern interrupt, on the other hand, requires some sort of jolt ... The answer is no because the patterns are established, time is precious, and risk is something to be feared"
    - "When life interferes, new patterns are established. This is why it's so profitable to market to new dads, engaged women, and people who have recently moved"
    - "When you market to someone who doesn't have a pattern yet, you don't have to persuade them that their old choices were mistakes"
  concept_label: matching_an_existing_pattern_is_cheap_and_interrupting_one_is_not
  label_origin: extractor_assigned
  claim: >
    Godin distinguishes two situations that look alike and cost very different amounts. A pattern
    match slots a new offering into a routine that already exists — the family that cycles through
    breakfast cereals adds another one without deciding anything. A pattern interrupt requires the
    routine itself to be undone before any forward motion is possible, and the default answer to
    that request is no, because the pattern is established, time is precious and risk is feared. The
    operational consequence he draws is about timing rather than message: when a person's life has
    just changed — a new parent, someone recently engaged or recently moved — there is no pattern to
    match, so everything is an interrupt and you do not have to persuade them that their old choices
    were mistakes. The same logic makes a brand-new platform the best time to launch on it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Undoing a pattern requires the person to accept that their previous choice was wrong, which is
      a status cost on top of the switching cost. Where no pattern has formed, that cost is simply
      absent, so the same offer meets a much lower barrier.
  scope:
    domain_discussed_by_source: [consumer_marketing, software, b2b_purchasing, services]
    conditions: "audiences with or without an established routine in the category"
  caveats:
    - text: >
        Godin notes the mirror case in organisations: a purchasing manager has been taught that
        matching the pattern is the way to keep a steady job with no surprises, so the same
        distinction predicts institutional resistance, not only consumer inertia.
      origin: source_stated
    - text: >
        The life-transition targeting claim is stated as a profitability fact with no source. It is
        also the point in the book where the method comes closest to the surveillance-driven
        practice Godin criticises elsewhere, and he does not address the tension.
      origin: extractor_observed
