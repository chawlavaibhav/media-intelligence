- sk_id: sk_god_0005
  source_id: godin-this-is-marketing
  source_terms:
    - "When we seek to serve the largest possible audience, that audience will turn us down. The chorus of 'no' will become deafening"
    - "In the face of so much rejection, it's easy to sand off the edges and fit in. Fit in all the way. Fit in more than anyone else"
    - "Resist. It's not for them"
  concept_label: reach_pressure_removes_the_edges_that_made_the_work_work
  label_origin: extractor_assigned
  claim: >
    Godin names a specific mechanism by which more reach makes work worse, and it operates through
    the maker rather than the audience. Seeking the largest possible audience guarantees mass
    rejection — the chorus of no becomes deafening, and the feedback is direct, personal and
    specific. Under that pressure the natural response is to sand off the edges and fit in, and to
    fit in more than anyone else. Since the edges were what made the work fit its intended audience,
    the pursuit of reach destroys the thing that was working. His instruction is to resist on the
    ground that the rejection is not information: it is not for them.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Rejection from people the work was never for is indistinguishable, as an experience, from
      rejection from people it was for. Acting on the volume of the response rather than on its
      source converts a fit problem into an averaging process.
  scope:
    domain_discussed_by_source: [marketing, creative_work, publishing, comedy, product_launch]
    conditions: "any work exposed to an audience wider than the one it was designed for"
  caveats:
    - text: >
        Godin supplies the counter-discipline himself and it is easy to miss: some negative response
        genuinely is about the work. His distinction is between feedback, which asks to be proven
        wrong, and advice, which asks how the work could fit this person's worldview more closely.
        Advice reveals fears and wants; criticism often reports a sore spot the work happened to
        touch. This lane records the distinction as his, not as a reliable test.
      origin: source_stated
    - text: >
        "Resist" is an instruction with no stopping rule. Nothing here distinguishes a work whose
        edges should be defended from one that is simply not good enough, and Godin concedes
        elsewhere that both are possible.
      origin: extractor_observed
  source_stated_problems:
    - "the chorus of 'no' will become deafening"
    - "it's easy to sand off the edges and fit in"
    - "It's tempting to make a boring product or service for everyone. Boring because boring is beyond criticism"
  source_stated_remedies:
    - "Resist. It's not for them"
    - "What advice do you have for how I could make it fit your worldview more closely?"
  examples:
    positive:
      - {description: "a best-selling children's novel of which twelve per cent of twenty-one thousand reviews gave one or two stars, offered as evidence that a desired and an accidental audience both engage with any successful work", figure_ref: null}
    counter: []
  intra_source_relations:
