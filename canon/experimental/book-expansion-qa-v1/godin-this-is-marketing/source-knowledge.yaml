# SourceKnowledge — Seth Godin, "This Is Marketing" (Portfolio/Penguin, 2018).
# source_id: godin-this-is-marketing
# EXPERIMENTAL — NOT LIVE CANON.
#
# LOCATORS: EPUB, reflowable. NO AUTHORED PAGE NUMBERS. page_start/page_end are null everywhere.
# Locators are chapter number + chapter title + the section heading Godin prints inside the chapter,
# with "(spine n)" as a file-position aid. No page number was used or invented.
#
# CENTRAL HAZARD: this book is written in aphorisms, and an aphorism is not a claim. "Low price is
# the last refuge of a marketer who has run out of generous ideas" is a good sentence and asserts
# nothing testable. Every object below was admitted only after asking what it would mean for the
# claim to be false. Where the only content was a maxim, it was refused; where a maxim sits on top
# of a real claim, the claim is recorded and the maxim is quoted as a source_term, not as the claim.
#
# SOURCE POSITION: a practitioner arguing a position from a career of projects. There is no study he
# ran, no control group, no measured comparison. empirical_within_source appears on NO object in
# this lane — see EXTRACTION-NOTES.md §"The one number in the book" for why the VisionSpring
# doubling is typed outcome_claimed and not empirical_within_source.
#
# REPETITION: Godin restates heavily. "Who's it for? What's it for?", the smallest viable market and
# "people like us do things like this" each recur in a dozen places. Each idea is extracted ONCE, at
# the place where the mechanism is actually given, and the other appearances are not re-recorded.

source_id: godin-this-is-marketing

