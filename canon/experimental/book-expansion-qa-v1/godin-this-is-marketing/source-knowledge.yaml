- sk_id: sk_god_0022
  source_id: godin-this-is-marketing
  source_terms:
    - "We scan instead of study. And when we scan, we're asking, 'What does this remind me of?'"
    - "We don't care about you, or how hard you worked on it. We want to know if it's for us, and if you're the real deal"
    - "Because it's not for you. Because they're sending a signal to people who are skeptical, careful, and well-informed: go away"
    - "You're not people like us if you don't talk (talk means typefaces, photo styles, copy) the way we expect you to"
    - "Send a signal that feels like a sign we already trust, then change it enough to let us know that it's new, and that it's yours"
  concept_label: the_surface_selects_the_audience_before_the_message_is_read
  label_origin: extractor_assigned
  claim: >
    Godin's claim about form is that it acts before content does. Busy people scan rather than
    study, and while scanning they ask what this reminds them of; the answer decides whether they
    are the audience and whether the maker is credible, and it is reached before any argument is
    considered. So the vernacular of a category — typefaces, photo styles, copy — is a membership
    signal, and failing to speak it marks you as not people like us. His strongest illustration
    inverts the usual reading of an obvious failure: badly spelled advance-fee scam mail is not
    incompetent, it is a filter, sending skeptical and well-informed readers away so the sender does
    not waste effort on people who would drop out later. He draws a two-part instruction from this:
    send a signal that resembles one already trusted, then change it just enough to mark it as new
