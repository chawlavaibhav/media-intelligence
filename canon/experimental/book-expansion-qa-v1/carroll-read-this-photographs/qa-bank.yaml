# ── COMPOSITION ──────────────────────────────────────────────────────────────

- qa_id: qa_crl_0001
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Leading lines", sub-heading "Look for the leading lines" (spine 8)'
  question: >
    Carroll gives three working rules for leading lines, not one. What are they, and which of the
    three would a photographer be most likely to get wrong by instinct?
  answer: >
    The three are: one main leading line is often all you need; a line is at its most powerful when
    it sweeps in from the edge of the frame; and you should not be shy about making the line very
    overt. The one that runs against instinct is the third — the beginner's instinct is to be subtle,
    and Carroll's instruction is the opposite. The first also cuts against the impulse to accumulate
    devices. Note that "one is often all you need" is stated as a preference; he never says what
    goes wrong with two and shows no counter-case.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    Leading lines spread: great compositions take you on a journey; use them to give structure and
    draw the viewer to key elements; one main line is often all you need; strongest sweeping in from
    the frame edge; don't be shy about making these lines very overt.
  confounders:
    - "reading 'overt' as a warning against obviousness — he says the opposite"
    - "assuming more leading lines means more control of the eye"
    - "the modern default that a leading line must be a road or a path; his examples include a tree branch and a crack in rock"

- qa_id: qa_crl_0002
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Getting close", sub-heading "Get close. And then get closer." (spine 12)'
  question: >
    A photographer says they will shoot from further back and crop in afterwards to get the same
    tight frame. On Carroll's account, what have they lost, and what is his stated reason?
  answer: >
    They have lost the thing he says the picture actually carries. Carroll raises this exact
    substitution and rejects it: cropping is a fine tuner, not a way to fundamentally alter an image.
    His reason is relational rather than optical — the photographer's physical exposure to the
    subject is part of what the picture means. He says of the photographer in his example that it
    matters that he puts himself in the line of fire, and that if he did not, the pictures would
    lose their humour and start to feel underhand. So the loss is not resolution; it is the fact of
    the encounter. Note the scope: he is talking about candid work with people, and elsewhere he
    recommends a long lens precisely where approach is impossible.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: >
    Getting close spread: nothing kills an image more than keeping your distance; think of cropping
    as a fine tuner rather than a way of fundamentally altering your image; it's important that the
    photographer puts himself in the line of fire, or the pictures would feel underhand.
  confounders:
    - "answering in terms of image quality, resolution or lens sharpness — Carroll's reason is not technical"
    - "assuming he forbids cropping; he permits it as a fine tuner"
    - "generalising the rule to all subjects; his scope is subjects that could have been approached"

- qa_id: qa_crl_0003
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "The rule of thirds", sub-heading "Be offish" (spine 14)'
  question: >
    Carroll names two ways of getting off-centre placement wrong, and they are on opposite sides of
    each other. What are they, and what does having two of them tell you about how he is using the
    rule of thirds?
  answer: >
    A subject positioned too near the edge of the frame looks clumsy, and so does a subject
    positioned only slightly off centre. Because the two failures sit on either side, the rule is
    not functioning as a construction method but as a corridor between two errors: it tells you how
    far to displace a subject once you have decided not to centre it. That is consistent with how he
    frames it — a rough guideline for maintaining balance when you do not want to centre, not a grid
    to build on. Neither failure zone is quantified anywhere.
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    Rule of thirds spread: if you don't want to centre your subject, the rule helps maintain
    balance; use it as a rough guideline; be careful not to position your subject too near the edge
    of the frame, or only slightly off-centre, as this can look a little clumsy.
  confounders:
    - "naming only the edge failure and missing the slightly-off-centre one"
    - "treating the thirds grid as a construction to place elements on rather than a corridor"
    - "importing a golden-ratio or geometric justification; Carroll gives none"

- qa_id: qa_crl_0004
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Symmetry", sub-heading "It''s a primal instinct" (spine 13)'
  question: >
    You have a symmetrical composition that a client calls lifeless. What does Carroll say has gone
    wrong and what is his prescribed correction — and what does he not tell you?
  answer: >
    He names this failure directly: there is a fine line between balance and boring, and an image
    that is too perfectly mirrored can feel soulless and a little too phony. His correction is a
    dose rather than an abandonment — allow the human elements to creep in, the little things that
    draw attention without upsetting the balance. What he does not tell you is any threshold: how
    perfect is too perfect, or how large the saving asymmetry may be before it stops rescuing the
    picture and starts unbalancing it. The remedy is asserted, never specified.
  answer_type: repair
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: >
    Symmetry spread: symmetry satisfies a primal need for order; it isn't a case of composing like
    an ink blot but of overall harmony and balance; there's a fine line between balance and boring;
    if everything is too perfectly mirrored an image can feel soulless; allow the human elements to
    creep in.
  confounders:
    - "prescribing that the composition be made asymmetric — his fix is a small element, not a restructure"
    - "assuming he supplies a threshold or ratio; he supplies neither"
    - "confusing this with the rule-of-thirds guidance, which is about off-centre placement, not about rescuing symmetry"

- qa_id: qa_crl_0005
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Working the frame", sub-heading "Make every inch count" (spine 15)'
  question: >
    Carroll's remedy for a composition that is not quite working is to change position "even very
    slightly". Why does such a small movement do anything at all, on his account?
  answer: >
    Because the elements in the frame do not move together. They lie at different distances from the
    camera, so as the camera shifts they move relative to one another at different rates. A small
    change of viewpoint therefore re-arranges the relationships inside the frame without changing
    the subject at all — which is why the instrument is a couple of steps rather than a different
    picture. His instruction is to change position slightly and keep an eye on how all the elements
    move around in relation to each other.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    Working the frame spread: a little lower, a touch to the left, a couple of steps back; these
    minor adjustments make the fencepost vertical, frame the taxi rather than cut it in two, and
    ensure nothing is creeping into the frame; change position even very slightly and watch how the
    elements move in relation to each other.
  confounders:
    - "explaining it as a change of perspective distortion or focal length; neither changes here"
    - "assuming the point is to find a better subject rather than a better arrangement of the same one"

- qa_id: qa_crl_0006
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Working the frame", sub-heading "Make every inch count" (spine 15)'
  question: >
    Give the concrete checks Carroll runs before releasing the shutter, and name the fault he says
    the whole procedure exists to prevent.
  answer: >
    The fault is a "passive" area — a region of the frame that does not add much. The checks he
    names are specific: is a foreground vertical actually vertical; is a passing object framed rather
    than cut in two; do the colours balance without one becoming overpowering; is anything creeping
    into the frame that does not belong. The procedure is to pause just when you think you are ready
    and glance around the frame asking whether everything is where it should be and whether the
    composition is working as a whole. He says pictures like this cannot be snapped — which is the
    honest limit of the method.
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    Working the frame spread: knowing exactly what's going on in every part of your frame; the named
    checks; avoid passive areas that don't add much; pause and glance around your frame before
    shooting.
  confounders:
    - "listing generic composition rules instead of his named checks"
    - "assuming this scan is compatible with catching a decisive moment; Carroll says these pictures can't be snapped"

- qa_id: qa_crl_0007
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Visual weight", sub-heading "Reducing it down" (spine 16)'
  question: >
    "Don't see the world as it is. See it as a photograph." What is Carroll actually instructing the
    photographer to do, and what does he claim about how hard it is?
  answer: >
    He is instructing the photographer to stop seeing objects and start seeing the two-dimensional
    shapes and tones they will become, because it is tone that carries visual weight — he says a
    dark ground reads as heavier than a light wall, and the amount of frame each element is given
    has to answer to that. On difficulty he makes an unusual claim: the skill is not new. He says
    the eyes are already effective weighing scales, used every time you decide where to hang a
    picture or how to arrange food on a plate, so the task is transferring an existing judgement
    rather than acquiring one. That transfer is asserted with no support.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    Visual weight spread: he reduced everything down to two-dimensional shapes and tones; notice how
    much heavier the dark ground seems than the light wall and how this influenced the space given
    to each; your eyes are already pretty effective weighing scales.
  confounders:
    - "reading 'visual weight' as physical size or as subject importance; Carroll grounds it in tone"
    - "assuming he provides a method for computing balance; he provides an analogy"

- qa_id: qa_crl_0008
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Breaking the rules", sub-heading "Throw the rule book out the window" (spine 17)'
  question: >
    Carroll writes that good photographs conform to the rules and really great ones often break
    them. What warrant does he give for a break, and why is that warrant a weak test?
  answer: >
    The warrant is correspondence with the subject: rather than making sure everything conforms,
    concentrate on creating compositions that capture the essence of the subject. Where the subject
    is not settled, a settled composition misdescribes it, so the discomfort a broken rule produces
    can be the true reading. He also warns that too much conformity makes photographs feel safe and
    predictable. The test is weak because it is unfalsifiable as stated — any broken rule can be
    justified after the fact by asserting the discomfort suits the subject — and because every case
    he can show is already a famous photograph, so nothing that broke the same rules and failed is
    in the book.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: composition
  requires_application: false
  support: >
    Breaking the rules spread: compositional techniques serve as essential building blocks but too
    much of that makes photographs feel safe and predictable; rather than making sure everything
    conforms, concentrate on capturing the essence of your subject.
  confounders:
    - "reading it as a licence for novelty; his warrant is correspondence with the subject, not difference"
    - "treating 'break the rules' as advice for beginners; he presents the techniques as prerequisites"
    - "missing the survivorship problem in his evidence base"

- qa_id: qa_crl_0009
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Breaking the rules", sub-heading "Throw the rule book out the window" (spine 17)'
  question: >
    In the course of the rule-breaking spread Carroll lists the things that ordinarily read as
    compositionally wrong. What is on that list, and what should stop you from using it as a
    scorecard?
  answer: >
    Four things: the eye pulled out of the picture by a path running off the frame; an element
    awkwardly making contact with the very top of the frame; the subject positioned at the extreme
    edge with its gaze cut short by that edge; and a horizon line cutting right through the
    subject's head. What stops it being a scorecard is that he lists them in order to defend them —
    in the same passage he argues that because the resulting tension and anxiety match this
    particular sitter, the composition is right. So a cue found is a question about whether the
    register suits the subject, never a verdict.
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    Breaking the rules spread: the eyes pulled out of the image by the path; the off-kilter lamppost
    meeting the top of the frame; the subject at the extreme left with his gaze cut short by the
    frame edge; a horizon line cutting through the subject's head; and then — on second thoughts,
    everything about this image is so right.
  confounders:
    - "treating the four cues as defects to be corrected; Carroll's whole point is that they were not"
    - "assuming the cues came from a rule list rather than from his reading of one image"
    - "adding modern checklist items (leading room, headroom, rule-of-thirds crops) that he does not name here"

- qa_id: qa_crl_0010
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Foreground interest", sub-heading "The layered look" (spine 11)'
  question: >
    What does Carroll claim foreground interest does, and what does he say about how it gets into
    the picture?
  answer: >
    It offers the viewer a stepping stone into the image and heightens its sense of depth; without
    it, the eye feels too separated from the middle distance and background and the picture loses
    depth. The second half is the part that is easy to miss: it does not get into the picture by
    being noticed, it gets there by the photographer moving. He is explicit that the near material
    in his example is not there by chance, that the photographer positioned himself to make it an
    essential part of the composition, and that landscape photographers do not plonk a tripod
    anywhere — it is a case of exactly here, not around about here.
  answer_type: mechanism
  difficulty: easy
  knowledge_type: composition
  requires_application: false
  support: >
    Foreground interest spread: foreground interest offers a stepping stone into your image and
    heightens its sense of depth; without it our eyes would feel too separated from the middle
    distance and background; the mud isn't there by chance, the photographer positioned himself.
  confounders:
    - "describing it as a framing device; it is a depth and entry device"
    - "assuming it means anything in the foreground; Carroll requires it to be positioned for"

- qa_id: qa_crl_0011
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Section opener "EXPOSURE", sub-heading "Seeing through the science" (spine 18)'
  question: >
    Carroll writes that "correct exposure" is just a matter of opinion. What is he actually claiming,
    and which later positions in the book depend on it?
  answer: >
    He is claiming that because shutter, aperture and ISO all act on the same quantity of light,
    several different balances satisfy any given scene, and the camera reports one of them rather
    than the right one. Which balance you want is a question about the picture — blur or freeze,
    shallow or deep — not about the light. Two later positions rest on this. His case against manual
    mode rests on the camera's exposure being a proposal that manual does not improve on, and his
    whole treatment of exposure compensation rests on it being legitimate to depart from that
    proposal on purpose. This is his stated position, not a finding.
  answer_type: source_position
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: false
  support: >
    Exposure opener: shutter speed controls the length of time light enters, aperture how much, ISO
    how sensitive; the trio is inseparable because each relies on the others; adjusting them is as
    much an exercise in creativity as in controlling light; "correct exposure" is just a matter of
    opinion.
  confounders:
    - "reading it as saying exposure doesn't matter; he means several exposures are defensible, not that any is"
    - "attributing to him the idea that the meter is inaccurate — his claim is that it is answering a different question"

- qa_id: qa_crl_0012
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Appendix "Troubleshooting", question "Why does my whole picture look out of focus?" and Ch. "Slow shutter speeds at night" (spines 67, 23)'
  question: >
    A handheld frame comes back and the entire image looks soft, not just the moving parts. What is
    Carroll's diagnosis, what is the tell, and what are his three responses in order of strength?
  answer: >
    His diagnosis is that this is almost certainly not a focusing fault but camera shake from too
    slow a shutter speed. The tell is exactly the one in the question: with subject blur only the
    moving parts smear, whereas with camera shake everything in the frame is blurred, because it was
    the camera that moved. His check is whether the shutter speed dropped below about 1/60 handheld.
    The responses run: switch on stabilisation, which lets you hand-hold at slower speeds; raise the
    ISO enough to lift the shutter speed back over that marker, nudging it rather than maxing it out
    because of noise; and, at genuinely slow speeds, a tripod, which he calls the only cure.
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: true
  support: >
    Troubleshooting: chances are it's not a focusing issue, it's camera shake caused by a slow
    shutter speed; check the speed isn't below 1/60; increase ISO or use a tripod. Night spread:
    hand-holding is the most common cause of death for night shots; IS/VR helps; at this speed a
    tripod is the only cure. ISO spread: nudge the ISO just enough to tip over that marker.
  confounders:
    - "diagnosing a focus or autofocus-mode problem, which is what the symptom superficially suggests"
    - "raising ISO as far as it will go; he warns explicitly against that because of noise"
    - "assuming stabilisation makes a tripod unnecessary at any speed"

- qa_id: qa_crl_0013
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Shallow depth of field", sub-heading "Stand out by being shallow" (spine 26)'
  question: >
    Carroll explains why a shallow depth of field makes a subject stand out. His mechanism is
    subtractive rather than additive. What is it, and why does the distinction matter?
  answer: >
    His mechanism is that by throwing an area of the image out of focus you are effectively getting
    rid of detail, and it is the removal of detail that causes the subject to stand out. Nothing is
    added to the subject at all. The distinction matters because it tells you where the technique
    fails: it works by removing competitors for attention, so it does nothing in a scene that has no
    competing detail to remove, and it does nothing to a subject that is not itself worth attention
    once the competition is gone.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    Shallow depth of field spread: to achieve it select Aperture Priority and a wide open aperture
    (low f-number); by throwing an area of your image out of focus you're effectively getting rid of
    detail, which causes your subject to really stand out.
  confounders:
    - "explaining it as the subject being made sharper or brighter; nothing is added"
    - "attributing the effect to the lens rather than to the removal of competing detail"

- qa_id: qa_crl_0014
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Shallow depth of field", second spread, sub-heading "Compelling close-ups" (spine 27)'
  question: >
    A photographer opens the aperture as wide as it will go and gets almost no background blur.
    Carroll names the condition they have violated. What is it?
  answer: >
    There is nothing at a different distance for the shallow depth of field to act on. He states it
    as a requirement: make sure there is a good amount of distance behind or in front of your
    subject, otherwise there will not be anything to actually fall out of focus. His reason is that
    focus is all about distance from the camera, so the effect is a property of the scene's depth as
    much as of the lens setting. He adds the compounding factor in the other direction — depth of
    field is at its shallowest in close-up, so proximity, a wide aperture and some zoom stack.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: photography
  requires_application: true
  support: >
    Compelling close-ups spread: depth of field is at its most shallow when shooting close-ups;
    focus is all about distance from the camera; make sure there's a good amount of distance behind
    or in front of your subject, otherwise there won't be anything to fall out of focus.
  confounders:
    - "blaming the lens's maximum aperture; the condition is about the scene, not the equipment"
    - "assuming a wide aperture guarantees background separation"

- qa_id: qa_crl_0015
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Manual", sub-heading "All good photographers use Manual, right?" (spine 31)'
  question: >
    Carroll calls shooting in manual a waste of time. Reconstruct his argument, and state the one
    exception he allows and why he then removes it.
  answer: >
    The argument is about time, not quality. In manual the camera is still telling you what it
    thinks the correct exposure is, exactly as in every other mode; a photographer who then adjusts
    shutter and aperture to match that reading has shot in Program mode more slowly. So manual adds
    nothing to the picture while adding confusion and, worst of all, the risk of missing the shot.
    The exception he allows is wanting to override the camera and deliberately under- or overexpose
    — and he then removes it by pointing at exposure compensation as a faster and easier route to
    the same result. This is a deliberately contrarian position against camera-club orthodoxy,
    argued rather than demonstrated, and he scopes it to general day-to-day shooting.
  answer_type: source_position
  difficulty: hard
  knowledge_type: production_reasoning
  requires_application: false
  support: >
    Manual spread: in Manual the camera is still telling you what it thinks is correct exposure;
    people who match it are effectively shooting in P and taking longer; Manual adds nothing to the
    picture, slows you down and means you risk missing the shot; the one situation is deliberate
    over- or underexposure, for which exposure compensation is faster.
  confounders:
    - "the widespread view that manual gives more control; his counter is that it gives the same control more slowly"
    - "assuming he rejects manual for all photography; he scopes it to general day-to-day shooting"
    - "confusing this with his separate and differently-argued dismissal of scene modes"

- qa_id: qa_crl_0016
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Exposure compensation", sub-headings "The alternative to Manual" and "Detail from the shadows" (spines 32-33)'
  question: >
    You are photographing someone standing in front of a bright window and their face comes out as a
    silhouette. What does Carroll say is happening, what does he tell you to do, and what cost does
    he tell you to accept?
  answer: >
    The cause he gives is relative: the light inside is much darker relative to the light outside,
    so a subject in front of a window is routinely silhouetted and all facial detail is lost. The
    correction is exposure compensation scrolled towards +, which makes the whole image brighter.
    The cost he tells you to accept is explicit and is the part that is easy to get wrong — the
    highlights may well blow out, and he says not to worry too much about that as long as you can
    see the detail in your subject. He refuses to say how far to go, on the ground that it depends
    on the specific conditions. And remember to return the compensation to zero or it affects every
    subsequent frame.
  answer_type: repair
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: true
  support: >
    Exposure compensation spreads: a backlit subject often becomes silhouetted because the light
    inside is much darker relative to the light outside; to draw out shadow detail scroll towards +;
    the highlights might well blow out but don't worry too much as long as you can see detail in
    your subject; the precise amount depends on the conditions; always reset to 0.
  confounders:
    - "protecting the highlights, which is the modern digital default and the opposite of his instruction"
    - "reaching for fill flash, which he treats elsewhere as a different tool with an unnatural look"
    - "assuming a specific compensation value exists; he explicitly declines to give one"

- qa_id: qa_crl_0017
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Appendix "Troubleshooting", question "Should I use Aperture or Shutter Priority?" (spine 67)'
  question: >
    Carroll gives a one-question rule for choosing between the two semi-automatic modes. What is the
    question, and what does the rule reveal about how he thinks the decision should be made?
  answer: >
    The rule is to work backwards and ask: what is my picture about? If it is fundamentally about
    capturing a moving subject, use shutter priority; if it is more about controlling depth of
    field, use aperture priority. What it reveals is that he treats the mode decision as downstream
    of the picture's subject rather than of the lighting conditions — you decide which visual effect
    the picture depends on, take control of the corresponding variable, and hand the compensating
    variable to the camera. It is the same move as his case against manual.
  answer_type: application
  difficulty: easy
  knowledge_type: production_reasoning
  requires_application: true
  support: >
    Troubleshooting: work backwards — ask what your picture is about; if it's fundamentally about a
    moving subject use Shutter Priority, if it's more about controlling depth of field use Aperture
    Priority. Deep depth of field spread: select Aperture Priority so you're in control while the
    camera worries about the shutter speed.
  confounders:
    - "choosing the mode from the light level rather than from the subject of the picture"
    - "assuming manual is the answer when both matter; Carroll's position is the opposite"

- qa_id: qa_crl_0018
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Fast shutter speeds", sub-heading "The big freeze", and Ch. "Fill flash", sub-heading "Daylight flasher" (spines 24, 45)'
  question: >
    A photograph shows a subject in mid-air, completely frozen. Why does Carroll say you cannot
    conclude a fast shutter speed was used?
  answer: >
    Because flash freezes movement independently of the shutter. He makes the point explicitly about
    a daylight fill-flash photograph: when a flash fires it throws light on a subject that comes and
    goes in an instant, so any movement within the reach of the flash is frozen, and what you are
    looking at is the result of the flash rather than of a very fast shutter speed. The frozen
    appearance is evidence about the duration of the light, not about the duration of the exposure.
  answer_type: comparison
  difficulty: hard
  knowledge_type: production_reasoning
  requires_application: true
  support: >
    Fill flash spread: when a flash fires it throws light on a subject that comes and goes in an
    instant, causing any movement within the reach of the flash to be frozen, so what we're looking
    at is the result of the flash rather than a very fast shutter speed. Fast shutter spread:
    subjects appear frozen because in the instant the picture is taken nothing has time to move.
  confounders:
    - "reading frozen motion as a reliable signature of shutter speed"
    - "assuming the two mechanisms are equivalent; one limits how long the sensor is open, the other how long the subject is lit"

- qa_id: qa_crl_0019
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Modes", sub-heading "The good, the bad and the ugly" (spine 19)'
  question: >
    Carroll calls scene modes "junk". His reason is not that they produce poor results. What is it,
    and why does it matter for the rest of his book?
  answer: >
    His reason is that a scene mode is a factory preset that adjusts the camera to shoot a
    particular subject in a particular way, and — his actual objection — there is no single right
    way to photograph anything. The complaint is about a fixed answer being encoded, not about the
    quality of that answer. It matters because it is the same claim as "correct exposure is a matter
    of opinion", applied to subjects rather than to light: throughout the book he treats every
    setting as a choice about the picture, so a mode that decides for you removes the choice he is
    trying to teach.
  answer_type: source_position
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: false
  support: >
    Modes spread: P, S (Tv) and A (Av) are the only modes you need; scene modes are junk because
    they are factory presets that adjust settings to shoot a particular subject in a particular way,
    and there's no single right way to photograph anything; fully Auto is for quick snapshots.
  confounders:
    - "assuming he objects to automation as such — he recommends Program mode enthusiastically"
    - "confusing his objection to scene modes with his separate objection to fully automatic mode"

# ── LIGHT ────────────────────────────────────────────────────────────────────

- qa_id: qa_crl_0020
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Hard light", sub-headings "Hard light creates contrast" and "Hard light creates depth" (spines 36, 38)'
  question: >
    Carroll credits hard light with two different and separable effects. Name both and the single
    property of the light that produces each.
  answer: >
    The first is simplification by contrast: because hard light makes anything in its path a
    highlight and leaves everything else dark, the shadow areas become large masses that mask
    unnecessary detail, which drives the eye to the lit parts and can be used deliberately to
    abstract a composition. The second is modelling by shadow: the strong, razor-edged shadows that
    go with hard light create depth and three-dimensionality by describing the angles of what they
    fall across. The first comes from the division between lit and unlit; the second from the
    sharpness of the boundary. He adds the reciprocal reading — shadows tell you where the light is
    coming from and how intense it is.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: lighting
  requires_application: false
  support: >
    Hard light spreads: comes from one direction, typical of a spotlight or bright sunshine, and its
    common trait is high contrast; anything in its path becomes a highlight while everything else
    remains dark; the shadows form large areas of black which mask unnecessary detail; the strong
    decisive shadows create depth and three-dimensionality; shadows tell us where light is coming
    from and how intense it is.
  confounders:
    - "collapsing the two effects into one 'contrast' claim"
    - "treating hard light as simply harsh and undesirable; he presents both effects as usable"

- qa_id: qa_crl_0021
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Hard light", sub-heading "Hard light creates contrast" (spine 36)'
  question: >
    What cost does Carroll say hard light always carries, and why is his own remedy for it not
    actually a fix?
  answer: >
    The cost is that hard light is uneven, so you will lose detail somewhere — the range exceeds
    what can be held at once. His remedy is exposure compensation: scroll to + to bring out detail
    in the shadows, to − to bring out detail in the highlights. That is a choice, not a fix. The
    compensation moves the whole image, so it decides which end of the range you keep; it does not
    recover both ends. He says as much in the same breath — you will lose detail somewhere.
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: lighting
  requires_application: false
  support: >
    Hard light spread: the unevenness of hard light makes it tricky to work with, as you will lose
    detail somewhere; this is another situation where exposure compensation helps — scroll to + for
    shadow detail and to − for highlight detail.
  confounders:
    - "presenting exposure compensation as recovering the full range"
    - "confusing this with the backlit-subject case, where the choice is between subject and window"

- qa_id: qa_crl_0022
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Soft light", sub-heading "Soft light is flattering", and Ch. "Hard light", sub-heading "Hard light is brutal" (spines 41, 40)'
  question: >
    A brief calls for a flattering portrait. Which light does Carroll prescribe, what physical
    property of it does the work, and where does his own rule not apply?
  answer: >
    Soft, diffused light, and his instruction about the alternative is unqualified: if you are
    looking to flatter a subject then avoid hard light altogether. The property doing the work is
    the shadow edge — under soft light shadows curve around the lines of the body and their edges
    slowly fade rather than coming to an abrupt stop, which draws out form and features without
    being severe. Where it does not apply is where flattery is not the aim: in the same section he
    praises a photographer for using hard light to be confrontational and unflattering on purpose.
    So the rule is about matching light to intent, not about soft light being better.
  answer_type: application
  difficulty: medium
  knowledge_type: lighting
  requires_application: true
  support: >
    Soft light spreads: soft light is less intense so there isn't a stark divide between highlights
    and shadows and detail remains visible; shadows curve around the body with edges slowly fading;
    portrait photographers love soft diffused light as it draws out form without being severe. Hard
    light spread: hard light is unforgiving and exposes all; if you're looking to flatter a subject
    avoid it altogether.
  confounders:
    - "concluding soft light is generally superior; Carroll treats the choice as intent-driven"
    - "explaining the flattery by brightness or exposure rather than by shadow-edge quality"

- qa_id: qa_crl_0023
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Soft light" (continued), sub-heading "Soft light can be flat" (spine 39)'
  question: >
    This is the one place in the book where Carroll states an interaction between two of his own
    chapters. What is the interaction, and what does it imply about how much compositional work a
    picture needs?
  answer: >
    The interaction is between light and composition. Flat overcast light is very low in contrast
    and casts little or no shadow, so there are no dramatic shadows and highlights available to
    create depth and draw the eye — and therefore, he says, the composition alone has to guide the
    viewer around the image. The implication is that the amount of compositional work a picture
    requires is set by its light: under directional light, tone shares the guiding; under flat light,
    structure carries all of it. Note that he sets the reader an exercise here whose answer sits
    behind print-edition page references that are unresolvable in this copy.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: >
    Soft light can be flat spread: flat light casts little or no shadow and makes everything seem
    flatter; the blanket evenness means there are no dramatic shadows and highlights to create depth
    and draw the eye; this evenness means your composition alone has to guide the viewer around your
    image.
  confounders:
    - "treating flat light as simply a quality problem rather than as a shift in where the eye guidance comes from"
    - "assuming the fix is to add contrast in post; his answer is compositional"

- qa_id: qa_crl_0024
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Inbuilt flash", sub-heading "The light without love" (spine 44)'
  question: >
    Carroll gives a geometric reason why built-in flash produces the snapshot look. What is it, and
    what second effect does he attribute to its intensity?
  answer: >
    The geometry is that the flash lights the subject from the same angle you are shooting from. Its
    shadows are therefore thrown forward, away from the camera and out of sight, so the modelling
    that shadows normally provide is simply absent. The second effect is that its intensity causes
    anything in the very foreground, or anything slightly reflective, to become overexposed.
    Together these dominate the look and feel of the image, and used without skill they produce a
    snapshot look he calls wholly unflattering. Note the scope: this is about on-axis built-in
    flash. He says nothing about off-camera or bounced flash.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: lighting
  requires_application: false
  support: >
    Inbuilt flash spread: inbuilt flash dominates the look and feel of an image; as the flash lights
    your subject from the same angle as the one you're shooting from, harsh shadows are thrown
    forward and its intensity causes anything in the very foreground, or slightly reflective, to
    become overexposed; used less skilfully it creates a snapshot look that is wholly unflattering.
  confounders:
    - "attributing the look to colour temperature rather than to the light's angle"
    - "generalising the objection to all flash; his fill-flash spread recommends flash deliberately"

# ── LENSES ───────────────────────────────────────────────────────────────────

- qa_id: qa_crl_0025
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Standard focal length", sub-heading "Far from the standard treatment" (spine 52)'
  question: >
    Carroll's instruction for choosing a focal length has three links in it, and magnification is not
    one of them. Set out the chain.
  answer: >
    Think about how the focal length will affect your physical position in relation to your subject,
    and how that then affects the way people will read your images. So: focal length fixes the
    distance at which you must stand to get the framing you want; the distance you stand at is your
    actual relationship to the subject; and that relationship is legible in the finished picture. He
    works the chain in his example — a wider lens would have forced the photographer physically
    closer, which would have been invasive; a telephoto would have forced distance, which would have
    felt predatory; the standard focal length put her close without being too close. The reading
    claim at the end of the chain is asserted, never demonstrated, and is scoped to work about people.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: shot_design
  requires_application: false
  support: >
    Standard focal length spread: a standard focal length gets you close to your subject without
    being too close; when deciding which to use, think about how this will affect your physical
    position in relation to your subject, and how that then affects the way people will read your
    images; a wider lens would have been too invasive, a telephoto would have felt predatory.
  confounders:
    - "answering in terms of field of view or magnification, which is the link he explicitly bypasses"
    - "treating the standard lens as a neutral default rather than as a chosen social distance"

- qa_id: qa_crl_0026
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Wide angle / short focal length", sub-headings "It''s all about the context" and "Composition is the key" (spines 48-49)'
  question: >
    A wide-angle landscape comes back looking empty, with the point of interest reduced to nothing.
    What does Carroll say happened, and what two devices does he prescribe?
  answer: >
    Shorter focal lengths seemingly elongate distance, so points of interest that looked relatively
    close to the naked eye become insignificant details lost within a wider composition. Wide-angle
    lenses create a lot of space in an image, so — his phrase — you really have to nail your
    composition. The two devices he names are leading lines and foreground interest, used to
    emphasise the focal points and pull the composition together. He also gives a second instruction
    for the near field: get close to your subject, and watch the periphery, because with a short
    focal length the edge detail plays an all-important role.
  answer_type: repair
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: >
    Wide angle spreads: wide-angle lenses cause periphery details to play an all-important role;
    shorter focal lengths seemingly elongate distance; points of interest become insignificant
    details lost within a wider composition; you really have to nail your composition; look for
    leading lines and foreground interest; make sure you get close to your subject.
  confounders:
    - "reaching for a longer lens, which solves the emptiness but abandons the wide-angle picture"
    - "cropping in, which Carroll treats elsewhere as a fine tuner rather than a fix"
    - "assuming the problem is that the lens was too wide rather than that the composition was not built for the space"

- qa_id: qa_crl_0027
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Telephoto / long focal length", sub-headings "Are you a predator?" and "The telephoto effect" (spines 50-51)'
  question: >
    Carroll allows telephoto lenses in some circumstances and warns about them in others. What is
    the condition that separates the two, and what does he say the lens does to the space in the
    picture?
  answer: >
    The condition is whether you could have got close. Telephoto lenses are essential where you are
    unable to get physically close — his examples are sports and wildlife — but when you are able to
    get close and choose not to, the images can start to feel predatory. So the fault is not in the
    lens but in a decision the picture records. To the space, the lens gives the illusion of
    compressing depth: everything seems flatter, a receding avenue reads as a flat vertical strip
    rather than leading into the distance, and buildings behave like layered cut-out shapes, which
    he says makes images look more graphic. He calls the compression an illusion and explains it no
    further.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: shot_design
  requires_application: false
  support: >
    Telephoto spreads: telephoto lenses transform you into a hidden observer able to capture subjects
    unawares; essential when you're unable to get physically close, but when you are able to and
    choose not to, images can feel quite predatory; telephoto lenses give the illusion of
    compressing depth, making everything seem flatter and more graphic.
  confounders:
    - "treating the predatory reading as an absolute objection; Carroll concedes one photographer wanted it"
    - "explaining the compression optically; Carroll gives no mechanism and calls it an illusion"

# ── SEEING ───────────────────────────────────────────────────────────────────

- qa_id: qa_crl_0028
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Decisive moments", sub-heading "It''s all in the timing" (spine 56)'
  question: >
    What operational consequence does Carroll draw from the decisive moment being fleeting, and how
    does it collide with the composition discipline he teaches earlier in the same book?
  answer: >
    The consequence is that the camera must be configured before the moment: when it comes to it you
    will have no time to think, so set your camera up in advance — for him, shutter priority and a
    fast shutter speed — leaving only the timing decision live. The collision is with his own
    frame-scan discipline, where he says you cannot snap pictures like that, that they result from
    knowing exactly what is going on in every part of the frame, and that you should pause and glance
    around the frame before shooting. Both are his; he never reconciles them. They belong to
    different situations, and the honest reading is that the pre-set exists precisely because the
    scan is unavailable.
  answer_type: comparison
  difficulty: hard
  knowledge_type: creative_process
  requires_application: true
  support: >
    Decisive moments spread: knowing exactly when to press the shutter is one of the single most
    important aspects of photography; capturing it is all about anticipation and instinct; you'll
    have no time to think, so set your camera up in advance; use Shutter Priority and a fast shutter
    speed. Against Working the frame: you can't snap pictures like this.
  confounders:
    - "treating the decisive moment as fast reaction; Carroll's word is anticipation"
    - "assuming the two disciplines are compatible in one situation"

- qa_id: qa_crl_0029
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "The dangers of perfection", sub-heading "Perfect is often imperfect", and Ch. "The good from the bad", sub-heading "Photographs without excuses" (spines 57, 61)'
  question: >
    Carroll states one priority that is lenient and one discipline that is severe, and they are
    about the same photograph. What are they, and how do they fit together without contradicting?
  answer: >
    The lenient one is a priority between two things you cannot always both have: it is far better to
    capture the right moment with the wrong settings than the wrong moment with the right settings,
    because the settings can be better next frame and the moment cannot recur. The severe one is a
    test applied afterwards: a photograph that comes with an excuse — "just before I took this the
    light was incredible" — has failed, and the effort a shot cost must not be allowed to warp your
    idea of its quality. They fit because they apply at different times and to different things.
    Leniency about technique in the moment; severity about the result afterwards. What the second
    forbids is using the first as a defence.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    Dangers of perfection spread: sometimes you can't have it all and it's far better to capture the
    right moment with the wrong settings than the wrong moment with the right settings; the desire
    for perfection can choke your creativity. The good from the bad spread: a picture that comes
    without any excuses; shots with excuses require you to be tough with yourself; don't let the
    sole fact that they were hard to get warp your idea of their quality.
  confounders:
    - "reading the first as a general licence for technical sloppiness; it is scoped to unrepeatable moments"
    - "reading the second as public criticism; he addresses it to your own frames"
    - "missing that the second is a check on the first being used as an alibi"

- qa_id: qa_crl_0030
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "The good from the bad", sub-heading "Photographs without excuses" (spine 61)'
  question: >
    Apply Carroll's excuse test. A photographer shows you a frame and says, "the animal had been out
    of the hole for a full minute before this". What does the test say, and what is the reasoning
    behind it?
  answer: >
    The frame has failed his test. The excuse is the diagnostic: it is a statement about the picture
    that was not made, offered in place of the picture that was. His reasoning is that the viewer
    only ever has the frame, so any quality that has to be supplied by an explanation is not in the
    photograph. The second half is what makes it hard to apply to your own work — the effort the
    shot cost carries no information about its quality, so a shot that was difficult to get and did
    not come off should be written off as one that got away, however expensive it was.
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    The good from the bad spread: it's a picture that comes without any excuses; shots that come with
    excuses like "just before I took this the light was incredible" require you to be tough with
    yourself; write them off as the ones that got away; don't let the sole fact that they were hard
    to get warp your idea of their quality.
  confounders:
    - "accepting effort or difficulty as partial credit, which is exactly what he forbids"
    - "treating the excuse as context that helps you read the picture"
    - "the modern default of judging a shot against the photographer's intent rather than against the frame"

- qa_id: qa_crl_0031
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "A different point of view", sub-heading "Photography yoga" (spine 60)'
  question: >
    Carroll calls head height "boring". What exactly is his complaint, and what does he claim about
    telling good photographers from bad ones?
  answer: >
    His complaint is about familiarity, not about aesthetics: head height is an all too familiar
    point of view of the world, with what he calls a punch-pulling neutrality. Because the viewer
    occupies that viewpoint every day it carries no information of its own, so it contributes nothing
    to the reading. His claim about telling photographers apart is that you can do it without even
    looking at their pictures — good photographers are the contortionists, hunching, squatting,
    lying on the ground and climbing on benches. That is a rhetorical claim about behaviour offered
    with no evidence, not an assessment method.
  answer_type: concept_definition
  difficulty: easy
  knowledge_type: shot_design
  requires_application: false
  support: >
    A different point of view spread: good photographers are contortionists; they're the ones
    hunching, squatting and bending over backwards, down on the ground and climbing on benches; head
    height is boring, an all too familiar point of view with a punch pulling neutrality; always be
    looking for those unfamiliar and surprising viewpoints.
  confounders:
    - "reading the complaint as being about composition or framing rather than about familiarity"
    - "treating the contortionist claim as a real assessment method"

- qa_id: qa_crl_0032
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "Unexpected beauty", sub-heading "Don''t always look for nice" (spine 58)'
  question: >
    A brief asks for beautiful imagery and the obvious answer is a sunset. On Carroll's argument, why
    is that the hard option rather than the easy one?
  answer: >
    Because a conventionally beautiful subject arrives with its beauty already supplied, so the
    photograph has nothing left to contribute. He says the "nice" subjects — sunsets, pretty flowers,
    hot air balloons — offer a package deal of conventional beauty, and your photograph will at best
    act as a substitute for the real thing. Everyone loves a sunset; the picture of it adds nothing
    to the sunset. His alternative is a selection rule about your own motive: look for subjects that
    for whatever reason interest you, rather than the ones you think are photogenic. Note that his
    list of "nice" subjects is a snapshot of one photographic culture around 2014.
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: >
    Unexpected beauty spread: it's with the "nice" subjects — sunsets, pretty flowers, hot air
    balloons — that you'll struggle; they offer a package deal of conventional beauty and your
    photograph will at best act as a substitute for the real thing; look for subjects that interest
    you rather than the ones you think are photogenic.
  confounders:
    - "reading it as a claim that beautiful subjects photograph badly; his claim is that the photograph adds nothing"
    - "the slogan 'great photographers create their own beauty', which is the rhetoric rather than the argument"

- qa_id: qa_crl_0033
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "The importance of intrigue", sub-heading "Pose questions, not answers" (spine 64)'
  question: >
    What redirection of attention does Carroll prescribe for making a picture that holds a viewer,
    and what mechanism does he give?
  answer: >
    The redirection is away from the nominal subject: do not focus too much on "the subject", look
    instead for the little truths that say more, keep an eye on what is going on in between, and
    steer clear of "Kodak moments". The mechanism is that a picture which explains itself is finished
    at the first glance and leaves the viewer nothing to do, whereas holding a little back transfers
    part of the work to them — their own completion of the picture is what holds them in it. His
    formula is to pose questions, not answers, and to give the imagination somewhere to go. He gives
    no boundary between productive withholding and simple obscurity.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Importance of intrigue spread: don't feel like your photographs have to explain themselves; hold
    a little back; give our imagination somewhere to go; don't focus too much on "the subject",
    instead look for those little truths; steer clear of Kodak moments and keep an eye on what's
    going on in-between.
  confounders:
    - "reading it as advice to be obscure or to hide the subject; he asks for questions, not concealment"
    - "assuming it applies to work that must be understood at a glance; Carroll is writing about pictures made to be looked at"

- qa_id: qa_crl_0034
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "The power of a project", sub-heading "Photographs need photographs" (spine 65)'
  question: >
    Carroll reports having judged a famous body of work wrongly as a student. What was his error,
    what does he say the correct unit of judgement is, and what kind of evidence is this?
  answer: >
    His error was seeing the book as individual pictures and analysing each one separately, trying to
    work out why this one or that one was great. The correct unit, he says, is the series: as a
    series the pictures made sense, and together their style and subject matter carry a message that
    no single one alone could ever voice. Two properties of the set are load-bearing — the specific
    style and the order of the photographs are essential to their meaning. The kind of evidence is
    weak and should be labelled: it is autobiographical, a report of his own change of view two years
    later, not a demonstration. He also never says how to judge a series while making one.
  answer_type: source_position
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    The power of a project spread: I'd been seeing the book as individual pictures, analysing each
    one separately; as a series the pictures suddenly made sense; together their style and subject
    matter carry a message that no single one alone could ever voice; the specific style and order of
    photographs is essential to their meaning.
  confounders:
    - "reading it as advice to shoot more of the same thing; his claim is about style and order carrying meaning"
    - "treating the anecdote as evidence that series meaning exists rather than as a report of his own reading"

- qa_id: qa_crl_0035
  source_id: carroll-read-this-photographs
  source_title: "Henry Carroll, Read This If You Want to Take Great Photographs (Laurence King Publishing, 2014)"
  source_locator: 'Ch. "The power of a project" (spine 65), against Ch. "The good from the bad" (spine 61)'
  question: >
    You are reviewing twelve images made as one body of work. Which of Carroll's two assessment
    principles applies, and what does the other one get wrong here?
  answer: >
    Both are his and they pull in opposite directions, so the answer is that the unit has to be
    settled first. His excuse test is a per-frame test — this photograph either stands without an
    account of the circumstances or it does not. His series claim says the frame is the wrong unit
    for a body of work, because the meaning is carried by style and order across the set and
    assessing members independently destroys exactly the property being claimed. So for a body of
    work made and sequenced as one, the series claim governs; applying the excuse test frame by frame
    would be the error he says he made himself as a student. The honest limit is that he gives no
    method for judging a series, only for judging a frame.
  answer_type: application
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    The power of a project: seeing the book as individual pictures was looking at it all wrong; the
    style and order are essential to the meaning. The good from the bad: a photograph that comes with
    an excuse has failed. The two are stated four spreads apart and are not reconciled.
  confounders:
    - "applying the excuse test to each image and concluding the set is weak"
    - "assuming Carroll offers a method for evaluating a series; he offers only a claim that the unit is different"
    - "treating the two principles as compatible without settling the unit of observation"
