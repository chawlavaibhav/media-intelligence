- sk_id: sk_crl_0007
  source_terms:
    - "knowing exactly what's going on in every part of your frame"
    - "avoid 'passive' areas that don't add much"
    - "a little lower, a touch to the left, a couple of steps back"
    - "They ensure nothing is creeping into the frame that doesn't belong"
    - "You can't 'snap' pictures like this"
  source_id: carroll-read-this-photographs
  concept_label: every_region_of_the_frame_is_decided_not_snapped
  label_origin: extractor_assigned
  claim: >
    A finished composition is one in which every part of the frame has been accounted for, and the
    instrument for achieving it is a small change of the photographer's position — a little lower, a
    touch to the left, a couple of steps back — rather than a change of subject. Carroll names the
    failure as a "passive" area that adds nothing, and gives a set of concrete checks: is a vertical
    element actually vertical; is a passing object framed rather than cut in two; do the colours
    balance without one overpowering; is anything creeping into the frame that does not belong. His
    procedure is to pause before releasing the shutter and look around the frame.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Elements move relative to one another at different rates as the camera moves, because they lie
      at different distances. So a small change of viewpoint re-arranges the relationships in the
      frame without changing the subject, which is why minor adjustment is the right tool.
  scope:
    domain_discussed_by_source: [still_photography, street_photography]
    conditions: "any situation with enough time to adjust position before shooting"
  caveats:
    - text: >
        Explicitly incompatible with the timing-driven work Carroll praises elsewhere: he says
        pictures like this cannot be snapped, and the decisive moment leaves no time to think. The
        two disciplines apply to different situations and he does not reconcile them.
      origin: extractor_observed
    - text: >
        "Passive area" is defined only as an area that "doesn't add much" — an aesthetic judgement,
        not a testable property.
      origin: extractor_observed
  source_stated_problems:
    - "'passive' areas that don't add much"
    - "anything creeping into the frame that doesn't belong"
    - "the passing taxi is framed rather than cut in two"
  source_stated_remedies:
    - "change position – even very slightly – and keep an eye on how all the elements move around in relation to each other"
    - "pause for a moment and glance around your frame"
  examples:
    positive:
      - {description: "a street photograph in which no single part is said to be beautiful and the beauty comes from everything working together; not inspected", figure_ref: null}
