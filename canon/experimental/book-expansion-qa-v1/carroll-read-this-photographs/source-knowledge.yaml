- sk_id: sk_crl_0017
  source_terms:
    - "Hard light comes from one direction and is typical of a spotlight or bright sunshine"
    - "Hard light causes anything in its path to become a highlight, while everything else remains dark"
    - "You can use the contrasts created by hard light to abstract or simplify your composition"
    - "The strong, decisive shadows that go hand in hand with hard light create depth and three-dimensionality"
    - "Shadows tell us the whole truth about light. They show us where it's coming from and how intense it is"
    - "The unevenness of hard light makes it tricky to work with, as you will lose detail somewhere"
  source_id: carroll-read-this-photographs
  concept_label: hard_light_simplifies_by_contrast_and_builds_form_by_shadow
  label_origin: extractor_assigned
  claim: >
    Hard light — one direction, high intensity — does two separable things. Its contrast makes
    anything in its path a highlight and leaves everything else dark, which can be used deliberately
    to simplify a composition: the shadows become large masses that mask unnecessary detail, and
    attention is driven to the lit parts. Its shadows have razor-sharp edges, and those decisive
    shadows create depth and three-dimensionality by describing the angles of what they fall across.
    Carroll also states the reciprocal reading: shadows disclose where the light is coming from and
    how intense it is. The cost is unavoidable and he says so — hard light is uneven, so detail is
    lost somewhere, at one end of the range or the other.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A single intense source divides the scene into lit and unlit rather than grading between them.
      The division does the simplifying, because unlit areas stop presenting detail; the sharpness
      of the boundary does the modelling, because an abrupt edge follows the form it crosses. The
      same division is what puts part of the range outside what can be recorded at once.
  scope:
    domain_discussed_by_source: [still_photography, street_photography, landscape_photography]
    conditions: "direct sun, spotlights, or any single intense undiffused source"
  caveats:
    - text: >
        Both effects are argued through reproduced photographs which were not inspected. What is
        recorded here is the vocabulary and the stated mechanism, not the appearance of those images.
      origin: extractor_observed
    - text: >
        Carroll's remedy for the detail loss is exposure compensation, which chooses which end of
        the range to keep. It does not recover both. He is explicit that you will lose detail
        somewhere.
      origin: source_stated
