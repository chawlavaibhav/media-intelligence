- sk_id: sk_crl_0029
  source_terms:
    - "Don't feel like your photographs have to explain themselves. Hold a little back. Give our imagination somewhere to go"
    - "Pose questions, not answers"
    - "don't focus too much on 'the subject'. Instead look for those little truths that start to say so much more"
    - "Steer clear of Kodak moments and keep an eye on what's going on in-between"
  source_id: carroll-read-this-photographs
  concept_label: withholding_information_creates_intrigue
  label_origin: extractor_assigned
  claim: >
    Carroll's rule for holding a viewer is that the photograph should pose questions rather than
    answers, and the way to do it is to withhold — not to explain itself, and to leave the
    imagination somewhere to go. His operational advice is a redirection of attention: stop
    concentrating on "the subject" and look at what is going on in between, because the incidental
    details are what accumulate into a reading. He names the failure as the "Kodak moment", the
    fully explained picture. His stronger example is a portrait with no person in it, where the
    objects in the room are said to add up to someone.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A picture that answers its own question is finished at the first glance and the viewer has
      nothing left to do. Withholding transfers part of the work to the viewer, whose own completion
      of the picture is what holds them in it.
  scope:
    domain_discussed_by_source: [documentary_photography, still_photography, portrait_photography]
    conditions: "work intended to reward extended looking"
  caveats:
    - text: >
        No boundary is given between productive withholding and simple obscurity; Carroll offers no
        test for how much may be held back.
      origin: extractor_observed
    - text: >
        Directly opposed in aim to work whose purpose is immediate comprehension. Carroll writes for
        photographers making pictures that will be looked at, and does not address anything that
        must be understood at a glance.
      origin: extractor_observed
    - text: >
        The claim that a room without a person reads as a portrait is a report about a photograph
        that was not inspected.
      origin: extractor_observed
  source_stated_problems:
