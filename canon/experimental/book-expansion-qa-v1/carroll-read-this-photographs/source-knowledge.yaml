- sk_id: sk_crl_0008
  source_terms:
    - "visual weight"
    - "Don't see the world as it is. See it as a photograph"
    - "he reduced everything down to two-dimensional shapes and tones"
    - "your eyes are already pretty effective weighing scales"
  source_id: carroll-read-this-photographs
  concept_label: visual_weight_requires_seeing_the_scene_as_tone_and_shape
  label_origin: extractor_assigned
  claim: >
    Balancing a composition requires the photographer to stop seeing objects and start seeing the
    two-dimensional shapes and tones they will become, because it is the tones that carry weight: a
    dark area reads as heavier than a light one, and the amount of frame each element is given has
    to answer to that weight. Carroll adds that the skill is not new — it is the same judgement
    already used when deciding where to hang a picture or how to arrange food on a plate — so the
    task is transfer rather than acquisition.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [still_photography, landscape_photography]
    conditions: "compositions with distinguishable areas of differing tone"
  caveats:
    - text: >
        "Dark reads heavier than light" is stated once, about one photograph, with no general
        statement and no counter-case. It is asserted, not established.
      origin: extractor_observed
    - text: >
        The specific balance described — a grey door counterweighted by a white shape, spacing
        producing "absolute equilibrium" — is a claim about an image that was not inspected. It is
        recorded here as the source's report and is not endorsed.
      origin: extractor_observed
    - text: >
        The everyday analogy (hanging a picture, plating food) asserts that the skill transfers.
        No support is offered for that transfer.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "reduce everything down to two-dimensional shapes and tones"
  examples:
