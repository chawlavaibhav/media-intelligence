- sk_id: sk_crl_0002
  source_terms:
    - "Framing draws attention to a particular part of your composition"
    - "It's especially handy if you're shooting a busy scene"
    - "don't just frame any old thing"
    - "creating a photograph within your photograph"
  source_id: carroll-read-this-photographs
  concept_label: an_internal_frame_isolates_one_subject_in_a_busy_scene
  label_origin: extractor_assigned
  claim: >
    An opening found inside the scene — a doorway, a window, a hoop — placed around one element
    directs attention to that element, and the technique is most useful precisely where the scene is
    otherwise disorderly. Carroll attaches an explicit condition: the device is powerful, so it must
    not be spent on an element that does not deserve it. He describes the result as a photograph
    within the photograph.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The enclosure is what does the work: it separates one region from a field of competing
      elements, so the eye can settle on it instead of scanning. Its usefulness scales with the
      disorder of the scene, because that is where unaided attention has nowhere to land.
  scope:
    domain_discussed_by_source: [still_photography, documentary_photography, street_photography]
    conditions: "busy or anarchic scenes containing an available aperture, doorway or opening"
  caveats:
    - text: >
        "Find subjects that are worth putting a frame around" gives a condition but no test. Carroll
        supplies no way to decide in advance whether an element is worth framing.
      origin: extractor_observed
    - text: >
        The claim that the internal frame beats the surrounding crowd for attention is made about a
        reproduced photograph which was not inspected; that ordering of attention is not asserted
        here.
      origin: extractor_observed
  source_stated_problems:
    - "shooting a busy scene"
  source_stated_remedies:
    - "Look for doorways, windows and openings"
  examples:
    positive:
      - {description: "a festival photograph in which a leaping figure is said to be framed by a hoop against a crowded background; not inspected", figure_ref: null}
    counter: []
