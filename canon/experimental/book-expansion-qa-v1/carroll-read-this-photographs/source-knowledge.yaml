- sk_id: sk_crl_0026
  source_terms:
    - "It's a picture that comes without any excuses"
    - "A shot that does come with excuses like, 'just before I took this the light was incredible'"
    - "Shots with excuses – we've all taken them – require you to be tough with yourself"
    - "don't let the sole fact that they were hard to get warp your idea of their quality"
  source_id: carroll-read-this-photographs
  concept_label: a_photograph_that_needs_an_excuse_has_failed
  label_origin: extractor_assigned
  claim: >
    Carroll gives a self-assessment test with an unusually sharp form: a photograph that comes with
    an excuse has failed. The excuse is the tell — "just before I took this the light was
    incredible", "I was eating my lunch just as it poked its head out" — and it is a statement about
    the picture that was not made, offered in place of the picture that was. The second half is the
    part that does the work: the effort a photograph cost must not be allowed to warp the judgement
    of its quality. Shots that were hard to get and did not come off are to be written off as the
    ones that got away.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An excuse names the gap between what the photographer saw and what the frame contains. The
      viewer only ever has the frame, so any quality that has to be supplied by explanation is not
      in the picture. Effort is a separate fact about the photographer and carries no information
      about the result.
  scope:
    domain_discussed_by_source: [still_photography, landscape_photography, wildlife_photography]
    conditions: "reviewing one's own finished work"
  caveats:
    - text: >
        A test for self-editing, not for public criticism; Carroll addresses it to the reader's own
        frames.
      origin: extractor_observed
    - text: >
        No account is offered of the failure mode in the other direction — an excuse-free picture
        that is merely safe. Carroll warns about safety elsewhere but does not connect the two.
      origin: extractor_observed
  source_stated_problems:
    - "a shot that doesn't quite cut it"
    - "shots with excuses"
  source_stated_remedies:
