- sk_id: sk_crl_0010
  source_terms:
    - "This happy trio is inseparable. Each member is different. Each has its own job. And that's exactly why they rely on each other so much"
    - "SHUTTER SPEED controls the length of time that light enters your camera"
    - "APERTURE controls how much light enters your camera"
    - "ISO controls how sensitive your camera is to light"
    - "this term 'correct exposure', well, that's just a matter of opinion"
  source_id: carroll-read-this-photographs
  concept_label: correct_exposure_is_an_opinion_and_the_three_controls_are_inseparable
  label_origin: extractor_assigned
  claim: >
    Exposure is governed by three controls that do different jobs — shutter speed sets how long
    light is admitted, aperture sets how much, ISO sets how sensitive the recording is — and because
    they act on one quantity they cannot be set independently: changing one forces a compensating
    change in another. Carroll's consequential move is to deny that this yields a single right
    answer. "Correct exposure" is a matter of opinion, and adjusting the three is an exercise in
    creativity as much as in controlling light. Every later exposure claim in the book depends on
    that denial.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The three controls all determine the same outcome — how much light reaches the sensor — by
      different routes, so they trade against each other. The camera reports one balance among many
      that satisfy the exposure; which of those balances is wanted is a question about the picture,
      not about the light.
  scope:
    domain_discussed_by_source: [still_photography, camera_operation]
    conditions: "any camera offering control over shutter, aperture and sensitivity"
  caveats:
    - text: >
        Technology-contingent throughout. Carroll writes for a digital camera of about 2014, with
        mode dials, per-frame ISO changes, and named modes P/S(Tv)/A(Av)/M. The trade-off between
        the three controls is not contingent; the interface described around it is.
      origin: extractor_observed
    - text: >
        "A matter of opinion" is a stance, not a finding. It licenses the deliberate
        under- and over-exposure he teaches later, and should be read as his position.
      origin: extractor_observed
  source_stated_problems:
    - "overexpose your image, meaning it will be too bright"
    - "underexpose your image, meaning it will be too dark"
  source_stated_remedies: []
