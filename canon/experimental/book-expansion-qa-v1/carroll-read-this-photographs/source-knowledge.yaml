- sk_id: sk_crl_0013
  source_terms:
    - "changing your aperture also radically alters the 'depth of field' in your image"
    - "By throwing an area of your image out of focus you're effectively getting rid of detail. This causes your subject to really stand out"
    - "small f-number = small area of focus; big f-number = big area of focus"
    - "Landscape, and often portrait photography is generally less about capturing movement and far more about controlling your depth of field"
  source_id: carroll-read-this-photographs
  concept_label: aperture_sets_depth_of_field_and_therefore_where_attention_goes
  label_origin: extractor_assigned
  claim: >
    Aperture is presented as an attention control rather than a light control. A wide aperture (low
    f-number) gives a shallow depth of field, and Carroll's stated mechanism for why that helps is
    subtractive: throwing an area out of focus removes detail, and removing detail is what makes the
    subject stand out. A narrow aperture (high f-number) renders foreground through background
    sharp, which he uses to communicate the scale and detail of a landscape. His decision rule is to
    work backwards from the picture: if it is fundamentally about a moving subject, take control of
    the shutter; if it is about depth of field, take control of the aperture and let the camera
    settle the other.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Out-of-focus regions carry less detail, and detail is what competes for attention. So
      restricting the zone of sharpness is a way of removing competitors rather than of emphasising
      the subject directly.
  scope:
    domain_discussed_by_source: [portrait_photography, landscape_photography, still_photography, macro_photography]
    conditions: "lenses offering a usable range of apertures; a scene with depth"
  caveats:
    - text: >
        The narrow-aperture route carries a stated cost: the compensating shutter speed is slower,
        so a tripod or stable surface becomes necessary.
      origin: source_stated
    - text: >
        Carroll notes that on a camera with an optical viewfinder the effect is not visible before
        the exposure, only after. That is a 2014 statement about camera hardware.
      origin: source_stated
    - text: >
        "Small f-number = small area of focus" is a memory aid, not a description of the optics.
        Carroll offers no account of why aperture size governs depth of field.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "To achieve a shallow depth of field select 'Aperture Priority' and a wide open aperture (low f-number)"
    - "A narrow aperture (high f-number) causes everything from the foreground through to the background to be in focus"
