# ─────────────────────────────────────────────────────────────
# SEEING — timing, viewpoint, subject choice and self-judgement
# ─────────────────────────────────────────────────────────────

- sk_id: sk_crl_0024
  source_terms:
    - "the 'decisive moment'"
    - "four very separate, unrelated 'elements' as they come together for a single moment"
    - "Capturing the decisive moment ... is all about anticipation and instinct"
    - "When it comes to it, you'll have no time to think, so set your camera up in advance"
  source_id: carroll-read-this-photographs
  concept_label: the_decisive_moment_requires_the_camera_set_before_the_moment
  label_origin: extractor_assigned
  claim: >
    Knowing exactly when to release the shutter is, for Carroll, one of the single most important
    aspects of photography. What makes an instant decisive is convergence: separate, unrelated
    elements arriving in one arrangement for a moment, after which they disperse and never meet
    again. The capacity it requires is anticipation and instinct rather than reaction. The
    operational consequence is the part that transfers: because there will be no time to think, the
    camera must be configured before the moment — for him, shutter priority and a fast shutter —
    so that the only decision left at the moment is when to press.
