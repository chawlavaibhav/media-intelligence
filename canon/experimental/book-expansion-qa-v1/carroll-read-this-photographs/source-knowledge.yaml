- sk_id: sk_crl_0012
  source_terms:
    - "Fast shutter speeds do the opposite to slow shutter speeds – they freeze movement"
    - "Generally shutter speeds of 1/125 and faster will start to freeze movement"
    - "faster shutter speeds allow less light into the camera and if not enough light enters the camera, you'll underexpose your image"
  source_id: carroll-read-this-photographs
  concept_label: fast_shutter_speeds_freeze_movement_and_cost_light
  label_origin: extractor_assigned
  claim: >
    A fast shutter freezes movement because nothing in front of the camera has time to move during
    the instant the picture is taken; Carroll puts the onset of freezing at about 1/125 and faster
    for subjects like people jumping or running water. The cost is stated in the same breath and is
    the reason the trio matters: a faster shutter admits less light, so freezing movement is bought
    with underexposure unless aperture or ISO pays for it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Freezing and light admission are the same variable read two ways. Shortening the open period
      reduces the distance a subject can travel across the frame, and by exactly the same act
      reduces the total light collected.
  scope:
