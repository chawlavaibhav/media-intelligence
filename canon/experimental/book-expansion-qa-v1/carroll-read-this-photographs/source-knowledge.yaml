- sk_id: sk_crl_0021
  source_terms:
    - "Lenses do more than simply make something look closer or further away"
    - "They radically alter your relationship with your subject and the way you take pictures"
    - "Depending on its magnification, a lens can turn you into an active participant or a distant voyeur"
    - "think about how this will affect your physical position in relation to your subject, and how that then affects the way people will 'read' your images"
  source_id: carroll-read-this-photographs
  concept_label: focal_length_sets_your_physical_distance_and_therefore_the_reading
  label_origin: extractor_assigned
  claim: >
    Carroll's governing claim about lenses is a causal chain rather than an optical fact: the focal
    length you choose determines how close you must stand to fill the frame, where you stand
    determines what your relationship to the subject actually was, and that relationship is legible
    in the finished picture. So lens choice is a decision about the reading of the image, not about
    magnification. He instructs the reader to run the chain forwards before choosing. Alongside it
    he names secondary consequences of the physical object: weight affects mobility, size affects
    how conspicuous the photographer is, magnification decides between participant and voyeur.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Framing is fixed jointly by focal length and distance, so committing to one commits you to the
      other. Because the photographer's distance is a real event that occurred, and because the
      picture records the vantage that event produced, the choice of lens propagates into how the
      picture is read.
  scope:
    domain_discussed_by_source: [still_photography, documentary_photography, portrait_photography, street_photography]
    conditions: "any subject the photographer could in principle approach or withdraw from"
  caveats:
    - text: >
        The reading claim — that viewers can tell intimacy from intrusion from prediction — is
        asserted, never demonstrated, and is scoped to work about people.
      origin: extractor_observed
    - text: >
        Carroll refuses the sensor-size question outright, saying it will not help you take better
        pictures and directing the reader online. So "wide" and "long" are used in this book without
        a stated frame of reference, and the numeric table he supplies could not be inspected.
      origin: source_stated
