- sk_id: sk_crl_0028
  source_terms:
    - "It's with the 'nice' subjects – sunsets, pretty flowers, hot air balloons – that you'll actually struggle to find any of these things"
    - "The 'nice' subjects offer you a package deal of conventional beauty"
    - "your photograph will, at best, only act as a substitute for the real thing"
    - "Average photographers imitate beauty. Great photographers create their own"
  source_id: carroll-read-this-photographs
  concept_label: photogenic_subjects_yield_substitutes_not_photographs
  label_origin: extractor_assigned
  claim: >
    Carroll argues that conventionally beautiful subjects are the hardest to make a photograph of,
    not the easiest. A sunset or a pretty flower arrives with its beauty already supplied, so the
    photograph has nothing to add and can at best stand in for the thing itself. His diagnostic is
    the photographer's own reason for choosing: a subject chosen because it is "photogenic" is a
    warning, and the alternative is to choose subjects that interest you for a reason you could
    state. The claim underneath is that the beauty in a photograph should be made by the photograph
    rather than borrowed from the subject.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Where the subject already carries the interest, the photograph's own contribution is
      unnecessary and therefore invisible; the viewer credits the subject. Where the subject carries
      none, everything the viewer responds to had to be produced by the picture.
  scope:
