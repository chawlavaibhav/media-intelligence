  source_id: carroll-read-this-photographs
  concept_label: on_axis_flash_dominates_the_look_and_freezes_movement_itself
  label_origin: extractor_assigned
  claim: >
    Built-in flash overrides the look of an image rather than contributing to it, and Carroll gives
    the geometric reason: it lights the subject from the same angle the camera occupies, so shadows
    are thrown forward out of view rather than modelling the subject, and its intensity overexposes
    anything very close or slightly reflective. Used without skill this produces the snapshot look,
    which is wholly unflattering. Used deliberately in daylight — fill flash — it makes a foreground
    subject stand out and adds energy, at the cost of an unnatural look. He adds a diagnostic point
    that matters beyond flash: because the flash's light comes and goes in an instant, movement
    within its reach is frozen by the flash and not by the shutter, so frozen motion in a flash-lit
    frame is not evidence of a fast shutter speed.
