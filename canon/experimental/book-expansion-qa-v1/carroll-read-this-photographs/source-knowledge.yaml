- sk_id: sk_crl_0025
  source_terms:
    - "Sometimes you can't have it all and it's far better to capture the right moment with the wrong settings, rather than the wrong moment with the right settings"
    - "The technical flaws in this image ... are what make it so powerful"
    - "this desire for perfection can choke your creativity"
  source_id: carroll-read-this-photographs
  concept_label: the_right_moment_with_the_wrong_settings_beats_the_reverse
  label_origin: extractor_assigned
  claim: >
    Carroll states an explicit priority between two things that cannot always both be had: it is far
    better to capture the right moment with the wrong settings than the wrong moment with the right
    settings. He generalises it into a warning about self-editing — the pursuit of technical
    perfection chokes creativity and leads photographers to discard, or delete, work that falls
    short technically but succeeds otherwise. His supporting case is a set of badly composed, blurry
    war photographs whose flaws he argues are the source of their power, because they carry what the
    event was like rather than only what it looked like.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Technical faults are recoverable in the sense that another frame can be technically better;
      the moment is not, because it does not recur. So the two are not symmetric losses, and the
      irreversible one should win.
  scope:
    domain_discussed_by_source: [documentary_photography, street_photography, photojournalism]
    conditions: "unrepeatable events; not stated for repeatable or constructed subjects"
  caveats:
    - text: >
        Survivorship is unavoidable here. The case is one of the most famous sets of photographs
        ever made, whose flaws are partly the result of a darkroom accident. Photographs that were
        blurry and badly composed and did not become historic are not, and cannot be, in the book.
      origin: extractor_observed
    - text: >
        The priority is stated for unrepeatable moments. Carroll gives no comparable licence for
        work that could simply be reshot, and elsewhere insists on exacting frame discipline.
      origin: extractor_observed
    - text: >
        He immediately balances it with the opposite discipline, and the two must be read together:
        effort spent must not warp the judgement of the result.
      origin: source_stated
  source_stated_problems:
