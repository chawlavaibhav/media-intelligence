    - "To silhouette your backlit subject use 'Exposure Compensation' and scroll towards the −"
    - "Always remember to set your 'Exposure Compensation' back to 0"
    - "set your camera to 'Evaluative', 'Matrix' or 'Multi-Segment' metering. Then use 'Exposure Compensation'"
  examples:
