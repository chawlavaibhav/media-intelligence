- sk_id: sk_crl_0016
  source_terms:
    - "if you photograph something very bright, like snow, you'll find that it looks quite grey or underexposed"
    - "if you photograph something very dark, like the inside of a bar, you'll find it looks too bright or overexposed"
    - "This is because the light inside is much darker relative to the light outside"
    - "To draw out detail in the shadows, use 'Exposure Compensation' and scroll towards the +"
    - "the highlights might well blow out, but don't worry too much about this, as long as you can see the detail in your subject"
  source_id: carroll-read-this-photographs
  concept_label: metered_exposure_fails_predictably_on_extremes_and_backlight
  label_origin: extractor_assigned
  claim: >
    The camera's own exposure fails in a direction that can be predicted from the scene: a very
    bright subject such as snow comes out grey and underexposed, a very dark scene comes out too
    bright, and a subject in front of a window becomes a silhouette because the interior light is
    much darker relative to the exterior. Because the direction of the error is predictable, the
    correction is a single control: exposure compensation towards + to recover shadow detail,
    towards − to darken. Carroll attaches an explicit priority to the + case — accept blown
    highlights so long as detail in the subject survives — and treats the − case as a positive
    technique rather than a fault, since underexposing a backlit subject is how a silhouette is
    made. He warns that the compensation persists and must be returned to zero.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Metering measures all the light through the lens and offers an average. An average is wrong by
      a predictable amount whenever the scene is dominated by one extreme, and wrong in a
      predictable direction when the light behind the subject greatly exceeds the light on it.
  scope:
    domain_discussed_by_source: [still_photography, portrait_photography]
    conditions: "scenes dominated by very bright or very dark tones, and backlit subjects"
  caveats:
    - text: >
        "The precise amount to increase your exposure compensation by all depends on the specific
        lighting conditions" — Carroll gives the direction of the correction but explicitly refuses
        to give its size, referring the reader to experiment.
      origin: source_stated
    - text: >
        The averaging mechanism is not stated in the exposure-compensation spread; it appears in the
        Troubleshooting appendix under metering modes, where he also recommends leaving metering on
        the evaluative/matrix setting and using compensation instead. The mechanism recorded here is
        assembled from those two places in the book, not from one passage.
      origin: extractor_observed
  source_stated_problems:
    - "it looks quite grey or underexposed"
    - "it looks too bright or overexposed"
    - "they often become silhouetted and all facial detail is lost"
    - "you'll end up affecting all of your subsequent shots"
  source_stated_remedies:
