- sk_id: sk_crl_0030
  source_terms:
    - "I'd been seeing the book as individual pictures; analyzing each one separately"
    - "As a series, the pictures suddenly made sense"
    - "Together, their style and subject matter carry a message that no single one alone could ever voice"
    - "one where the specific style and order of photographs is essential to their meaning"
  source_id: carroll-read-this-photographs
  concept_label: a_series_says_what_no_single_photograph_can
  label_origin: extractor_assigned
  claim: >
    Carroll reports a change of mind as the argument: judging a body of work photograph by
    photograph was, he says, the wrong way to read it, and the pictures made sense only as a series.
    His claim is that a series carries a message no single image could voice, and that two
    properties of the set are load-bearing — the consistency of its style and the order the pictures
    are in. The consequence he draws is that shooting individual unrelated pictures yields a nice
    enough set of photographs but does not reach what the medium can do; committing to a series is
    what allows a constructed story to be told.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Meaning that depends on accumulation and on sequence cannot be located in any member, because
      it is a property of the relations between members. Assessing members independently therefore
      destroys exactly the thing being claimed.
  scope:
    domain_discussed_by_source: [documentary_photography, photographic_books, still_photography]
    conditions: "bodies of work made about one place, person or theme, presented in a fixed order"
  caveats:
    - text: >
        The evidence is autobiographical: Carroll recounts finding the work confusing as a student
        and understanding it two years later. That is a report of his own change of view, not a
        demonstration that the meaning is in the series.
      origin: extractor_observed
    - text: >
        He does not say how to judge a series while making it, nor what a failing series looks like.
        The claim is about how to read, with the making left implicit.
      origin: extractor_observed
  source_stated_problems:
    - "you'll end up with a nice enough set of photos, but you won't come close to exploring photography's full potential"
    - "seeing the book as individual pictures; analyzing each one separately"
  source_stated_remedies:
