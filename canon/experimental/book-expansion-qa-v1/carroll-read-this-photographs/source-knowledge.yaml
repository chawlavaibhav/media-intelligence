- sk_id: sk_crl_0001
  source_terms:
    - "leading line"
    - "Great compositions take you on a journey"
    - "One main leading line is often all you need"
    - "they're at their most powerful when they sweep in from the edge of the frame"
  source_id: carroll-read-this-photographs
  concept_label: a_leading_line_gives_the_eye_one_controlled_path
  label_origin: extractor_assigned
  claim: >
    A composition can carry the viewer's eye along a specific path to the place the photographer
    wants it to arrive at, and a line in the scene is the device that does it. Carroll's operating
    rules are three: one main leading line is usually enough; a leading line is at its strongest
    when it sweeps in from the edge of the frame; and the line may be made very overt without
    apology. He treats the line as available in ordinary material — converging rails, a tree
    branch, a crack in rock — rather than as something rare.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The line supplies structure: it fixes the order in which parts of the frame are reached, so
      the eye is drawn to the key elements rather than left to find them. Entering from the frame
      edge gives the path a start point outside the picture's interest, so the whole travel happens
      inside the image.
  scope:
    domain_discussed_by_source: [still_photography, street_photography, landscape_photography]
    conditions: "any composition in which the photographer can choose viewpoint before shooting"
  caveats:
    - text: >
        "One main leading line is often all you need" is a preference, not a limit; he never says
        what goes wrong with two, and no counter-example is shown.
      origin: extractor_observed
    - text: >
        The demonstration is a single reproduced photograph which was not inspected. The rules
        above are stated in words; the claim that this particular image works that way was not
        verified and is not asserted here.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "Use leading lines to give your composition structure and draw the viewer to key elements"
    - "look for leading lines and foreground interest"
  examples:
    positive:
      - {description: "a photograph in which railings and a kerb are said to carry the eye down and around to a passing cyclist; not inspected", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: qualified_by, target: sk_crl_0009, note: "the rule is a building block that great pictures may break"}
    - {relation: demonstrated_together_with, target: sk_crl_0019, note: "under flat light the leading line has to do the work light would otherwise do"}
    - {relation: demonstrated_together_with, target: sk_crl_0022, note: "he prescribes leading lines specifically as the fix for wide-angle emptiness"}
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, mechanism_given, repeated_within_source]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: 'Ch. "Leading lines", sub-heading "Look for the leading lines" (spine 8)'
    section: null
    page_start: null
    page_end: null
    figure_refs: []
