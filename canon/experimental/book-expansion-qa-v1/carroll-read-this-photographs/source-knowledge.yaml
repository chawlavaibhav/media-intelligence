- sk_id: sk_crl_0004
  source_terms:
    - "Very often, nothing kills an image more than keeping your distance"
    - "Think of cropping as a fine tuner rather than a way of fundamentally altering your image"
    - "It's important that Parr puts himself in the line of fire to get the shot"
  source_id: carroll-read-this-photographs
  concept_label: physical_closeness_cannot_be_recovered_by_cropping
  label_origin: extractor_assigned
  claim: >
    Filling the frame by standing close is not equivalent to standing back and cropping later.
    Carroll raises and rejects the substitution explicitly: cropping is a fine tuner, not a way to
    fundamentally alter the image. His stated reason is not optical but relational — the
    photographer's exposure to the subject is part of what the picture means, and a photographer who
    declines the risk of proximity produces work that loses its humour and begins to feel underhand.
    The gain he claims from closeness is the small telling detail that a wider composition loses.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Getting close forces the single observation that prompted the picture to occupy the frame, so
      the viewer cannot avoid it. The photographer's physical position is also legible in the
      result: a picture made from close carries the fact of the encounter; the same framing achieved
      from a distance carries the fact of the distance.
  scope:
    domain_discussed_by_source: [street_photography, documentary_photography, portrait_photography]
    conditions: "subjects a photographer could approach, where the approach is socially costly"
  caveats:
    - text: >
        The claim that a cropped-in frame reads differently from a close-shot frame is asserted, not
        demonstrated; no pair is shown.
      origin: extractor_observed
    - text: >
        Scoped to candid work about people. Carroll does not extend it to still life or to subjects
        that cannot be approached, and elsewhere he recommends telephoto precisely where approach is
        impossible.
      origin: extractor_observed
  source_stated_problems:
    - "keeping your distance"
    - "his pictures would lose their humour and start to feel too underhand"
  source_stated_remedies:
    - "get close. And then get closer"
    - "filling the frame with your subject"
  examples:
    positive:
      - {description: "a close portrait said to make small details — lipstick, jewellery, goggles — unavoidable; not inspected", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: trades_off_with, target: sk_crl_0023, note: "telephoto buys distance at the cost of the reading Carroll calls predatory"}
    - {relation: depends_on, target: sk_crl_0021, note: "an instance of the general claim that lens choice fixes your physical position"}
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, argued, mechanism_given, anecdotal]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: 'Ch. "Getting close", sub-heading "Get close. And then get closer." (spine 12)'
    section: null
    page_start: null
    page_end: null
    figure_refs: []
