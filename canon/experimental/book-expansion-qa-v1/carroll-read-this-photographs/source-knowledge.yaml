- sk_id: sk_crl_0003
  source_terms:
    - "foreground interest"
    - "offers the viewer a stepping stone into your image and heightens its sense of depth"
    - "This foreground mud isn't there by chance"
    - "Cover the foreground area with your hand and you're suddenly stranded"
  source_id: carroll-read-this-photographs
  concept_label: foreground_interest_is_the_viewers_step_into_the_picture
  label_origin: extractor_assigned
  claim: >
    Material placed deliberately in the near foreground gives the viewer an entry point into the
    picture and increases its sense of depth; without it the eye is left separated from the middle
    distance and background. Carroll's second, sharper point is that this material is not found, it
    is *positioned for*: the photographer moves to the exact spot at which the near material falls
    into the composition, and the landscape photographer's choice of tripod position is "exactly
    here", not "around about here".
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Depth is read from a chain of layers at different distances. A near layer supplies the first
      step of that chain; remove it and the eye has to jump straight to the middle distance, which
      reads as separation rather than depth.
  scope:
    domain_discussed_by_source: [landscape_photography, still_photography]
    conditions: "scenes with a usable near element and a photographer free to change position"
  caveats:
    - text: >
        Carroll gives an occlusion test — cover the near region with your hand and see whether the
        image collapses. He states it about one specific photograph, not as a general method. Read
        as a method it is the extractor's generalisation, and it is not asserted here as his.
      origin: extractor_observed
    - text: >
        Which near material qualifies as "interest" is not specified beyond the single case.
      origin: extractor_observed
  source_stated_problems:
    - "our eyes would feel too separated from the middle distance and background"
    - "the image would lose its sense of depth"
  source_stated_remedies:
    - "always keep an eye on what's going on immediately around you"
    - "hunt around for just the right spot"
  examples:
    positive:
      - {description: "a shipbreaking photograph in which textured mud in the very foreground is said to lead into a reflection and up to the ship; not inspected", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: depends_on, target: sk_crl_0021, note: "the near/far relationship this exploits is set by focal length and distance"}
    - {relation: demonstrated_together_with, target: sk_crl_0022, note: "prescribed together with leading lines as the fix for wide-angle emptiness"}
    - {relation: member_of_system, target: scs_crl_003}
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: figure_not_inspected
