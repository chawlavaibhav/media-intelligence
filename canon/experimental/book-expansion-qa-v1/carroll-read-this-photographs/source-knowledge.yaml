- sk_id: sk_crl_0015
  source_terms:
    - "shooting in 'Manual' (M) is a waste of time"
    - "In 'Manual' your camera is still telling you what it thinks is the 'correct exposure', in exactly the same way that it does in every other mode"
    - "By doing this they're effectively shooting in 'Program' (P), and taking a lot longer"
    - "using 'Manual' slows you down, adds confusion and, worst of all, means you risk missing the shot"
    - "'Scene modes' ... are junk"
  source_id: carroll-read-this-photographs
  concept_label: manual_mode_adds_nothing_and_risks_the_shot
  label_origin: extractor_assigned
  claim: >
    Carroll argues against manual exposure on grounds that are about time rather than quality. The
    camera proposes the same exposure in manual as in every other mode; a photographer who matches
    that proposal by hand has shot in Program mode more slowly, so manual adds nothing to the
    picture while adding confusion and the risk of missing the moment. He grants exactly one
    legitimate use — deliberately departing from the camera's proposal — and then removes even that
    by pointing at exposure compensation as a faster route to the same result. He dismisses scene
    modes separately and for a different reason: they encode one right way to photograph a subject,
    and there is no single right way to photograph anything.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Semi-automatic modes let the photographer fix the one variable the picture is about and hand
      the compensating variable to the camera. Manual makes the photographer do the compensation as
      well, which is arithmetic the camera has already done.
  scope:
    domain_discussed_by_source: [camera_operation, still_photography]
    conditions: "general day-to-day shooting with a camera offering P, S/Tv and A/Av"
  caveats:
    - text: >
        A deliberately contrarian position stated against what Carroll himself describes as
        camera-club orthodoxy. It is an argument, not a demonstration, and it is scoped by his own
        words to "general day-to-day shooting" — he does not address studio, flash-metered or
        multi-frame work where a fixed manual exposure is the point.
      origin: source_stated
    - text: >
        Contingent on 2014 camera behaviour: that the meter runs in manual, that P suppresses the
        flash, that exposure compensation is available on the mode dial or a button.
      origin: extractor_observed
  source_stated_problems:
