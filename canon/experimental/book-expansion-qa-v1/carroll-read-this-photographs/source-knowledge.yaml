- sk_id: sk_crl_0011
  source_terms:
    - "Slow shutter speeds blur movement"
    - "you'll start to see obvious signs of blur at shutter speeds slower than about 1/60. The slower you go, the greater the blur"
    - "'camera shake'"
    - "Camera shake caused by hand holding your camera is the most common cause of death for night shots"
    - "if you're going to use a shutter speed this slow, a tripod is the only cure"
  source_id: carroll-read-this-photographs
  concept_label: slow_shutter_speeds_blur_movement_and_expose_camera_shake
  label_origin: extractor_assigned
  claim: >
    A slow shutter blurs whatever moves during the exposure, and the blur increases as the shutter
    slows; for everyday moving subjects Carroll puts the onset of obvious blur at slower than about
    1/60. The same setting exposes the technique's failure mode — camera shake, where the camera
    itself moves and everything in the frame blurs rather than only the moving subject. He gives the
    differential diagnosis explicitly: a whole picture that looks out of focus is usually not a
    focusing fault but shake from too slow a shutter. Stabilisation buys some margin; at genuinely
    slow speeds a tripod is the only cure.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The shutter stays open longer, so anything that moves during that period is recorded across a
      range of positions instead of one. Whether the result is expressive blur or a ruined frame
      depends on whether it is the subject or the camera that moved.
  scope:
    domain_discussed_by_source: [still_photography, night_photography]
    conditions: "handheld shooting below roughly 1/60, or any deliberate long exposure"
  caveats:
    - text: >
        "About 1/60" and "a few seconds" are rules of thumb offered without qualification for
        subject speed, focal length or sensor size — all of which affect them. Carroll's own
        estimate of the exposure in his example ("perhaps three seconds") is a guess he flags as one.
      origin: extractor_observed
    - text: >
        Image Stabilization / Vibration Reduction is a technology claim of its period, described in
        the terms manufacturers used around 2014.
      origin: extractor_observed
  source_stated_problems:
    - "camera shake"
    - "everything in your image will look blurred"
    - "Why does my whole picture look 'out of focus'?"
  source_stated_remedies:
