- sk_id: sk_crl_0005
  source_terms:
    - "satisfying our primal need for order"
    - "there's a fine line between balance and boring"
    - "If everything is too perfectly mirrored, an image can feel a little soulless"
    - "Allow the human elements to creep in"
  source_id: carroll-read-this-photographs
  concept_label: symmetry_satisfies_order_but_flawless_symmetry_reads_soulless
  label_origin: extractor_assigned
  claim: >
    Symmetry has broad appeal because it satisfies a need for order, and centring the subject is a
    straightforward way to obtain it — but Carroll immediately names the failure on the other side:
    an image that is too perfectly mirrored feels soulless and phony. His remedy is a specific
    dose — admit small human elements that draw attention without upsetting the balance. He also
    warns against reading symmetry as literal mirroring; what he is after is an overall sense of
    harmony and balance.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [still_photography, street_photography, architectural_subjects, macro_photography]
    conditions: "compositions in which the subject can be centred or the scene mirrored"
  caveats:
    - text: >
        No threshold is given for "too perfectly mirrored", and no way to judge how large an
        asymmetric element may be before it stops being a saving grace and becomes an imbalance.
        The dose is asserted, not specified.
      origin: extractor_observed
    - text: >
        "Primal need for order" and "universal appeal" are claims about human response offered
        without evidence of any kind. They are the source's assertion, not a finding.
      origin: extractor_observed
    - text: >
        Both the symmetry and the saving asymmetry are described in a photograph that was not
        inspected, so the specific balance he reports was not verified.
      origin: extractor_observed
  source_stated_problems:
    - "too perfectly mirrored"
    - "a little too phony"
  source_stated_remedies:
    - "Placing your subject in the middle of the frame"
    - "Allow the human elements to creep in"
  examples:
    positive:
      - {description: "a centred figure with building lines converging on him, saved from perfection by a bag; not inspected", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: contradicts, target: sk_crl_0006, note: "centring for symmetry against off-centring for balance; Carroll offers both without ranking them"}
