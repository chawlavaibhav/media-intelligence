- sk_id: sk_crl_0006
  source_terms:
    - "the 'rule of thirds'"
    - "If you don't want to centre your subject, the rule of thirds helps maintain balance"
    - "Just use it as a rough guideline"
    - "be careful not to position your subject too near the edge of the frame, or only slightly off-centre, as this can look a little clumsy"
  source_id: carroll-read-this-photographs
  concept_label: the_rule_of_thirds_is_a_rough_aid_with_two_failure_edges
  label_origin: extractor_assigned
  claim: >
    The rule of thirds — dividing the frame in three horizontally or vertically and placing the
    focal point on that imaginary grid — is offered narrowly: it is what keeps an off-centre subject
    from looking wrong, and it is to be used as a rough guideline rather than a construction. Its
    value is in the two failures it steers between, both of which Carroll names: a subject placed
    too near the frame edge looks clumsy, and so does a subject placed only slightly off centre.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [still_photography, fashion_photography, street_photography, landscape_photography]
    conditions: "compositions with an identifiable focal point that is not being centred"
  caveats:
    - text: >
        Carroll records that many photographers reject the rule as too calculated and then adds
        that "they're all secretly at it". That is an assertion about other practitioners'
        behaviour, offered with no evidence, and it is his position rather than a finding.
      origin: extractor_observed
    - text: >
        "Too near the edge" and "only slightly off-centre" are both undefined. The rule's whole
        working value here is a pair of unquantified failure zones.
      origin: extractor_observed
  source_stated_problems:
    - "it doesn't look 'wrong'"
    - "this can look a little clumsy"
    - "it can feel too calculated"
  source_stated_remedies:
    - "splitting your frame into three sections – either horizontally or vertically – and positioning your focal point in line with this imaginary grid"
