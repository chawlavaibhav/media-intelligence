  source_id: carroll-read-this-photographs
  concept_label: wide_angle_enlarges_the_near_and_shrinks_the_far
  label_origin: extractor_assigned
  claim: >
    A short focal length takes in more of the scene, which has two consequences Carroll treats as
    the working facts. First, everything at the edges is now part of the picture: peripheral detail
    plays an all-important role and has to be watched as carefully as the subject. Second, short
    focal lengths seemingly elongate distance, so a near element looms and a distant one shrinks —
    points of interest that looked close to the naked eye become insignificant details lost in a
    wide composition. His remedies follow directly: get close to the subject, and use leading lines
    and foreground interest to pull the resulting space together, because with this much space in
    the frame the composition has to be exact.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The wider field of view spreads the same frame across more of the scene, so anything distant
      occupies a smaller share of it and anything near occupies a larger one. The apparent
      elongation of distance is that ratio, and the periphery becomes load-bearing because there is
      simply much more of it.
  scope:
    domain_discussed_by_source: [landscape_photography, still_photography, staged_photography]
    conditions: "short focal lengths, especially in landscape and constructed scenes"
  caveats:
