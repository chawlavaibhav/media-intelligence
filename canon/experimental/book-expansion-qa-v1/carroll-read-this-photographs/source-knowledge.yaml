- sk_id: sk_crl_0009
  source_terms:
    - "Good photographs conform to the rules. Really great photographs often break them"
    - "too much of that can make your photographs feel a bit safe and predictable"
    - "concentrate on creating compositions that capture the essence of your subject"
    - "an altogether uncomfortable composition, riddled with tension and anxiety"
  source_id: carroll-read-this-photographs
  concept_label: breaking_the_composition_rules_is_warranted_by_the_subjects_essence
  label_origin: extractor_assigned
  claim: >
    Carroll states the compositional techniques as essential building blocks and then subordinates
    all of them to a single test: does the composition capture the essence of this subject. Too much
    conformity produces work that feels safe and predictable; a photograph is entitled to violate
    the techniques when the discomfort it produces is the right reading of the subject. He supports
    this by inventorying, in one image, the things that normally read as wrong — a path that pulls
    the eye out of the picture, an element awkwardly meeting the very top of the frame, the subject
    pushed to the extreme edge with its gaze cut short by that edge, and a horizon line cutting
    through the subject's head — and then arguing that because the resulting tension and anxiety
    match this particular sitter, the composition is right.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The techniques exist to produce a settled reading. Where the subject is not settled, a settled
      composition misdescribes it, so the same features that are ordinarily faults become the means
      of a true reading. The warrant is correspondence between the composition's register and the
      subject's, not novelty.
  scope:
    domain_discussed_by_source: [portrait_photography, still_photography]
    conditions: "a photographer who already commands the techniques being departed from"
  caveats:
    - text: >
        The named cues — eye led out of the frame, an element awkwardly touching the frame edge,
        extreme placement with the gaze cut short, a horizon through the head — are stated about one
        reproduced photograph that was not inspected. They are recorded here as the vocabulary
        Carroll uses for compositional wrongness. Nothing is asserted about what that photograph
        looks like.
      origin: extractor_observed
    - text: >
        The essence test is unfalsifiable as stated: any broken rule can be justified after the fact
        by asserting that the discomfort suits the subject. Carroll supplies no way to tell a
        warranted break from a mistake, and the only case shown is one already canonised.
      origin: extractor_observed
    - text: >
        Survivorship is at its worst here. The claim that great photographs often break the rules is
        supported entirely by photographs that became famous. Photographs that broke the same rules
        and failed are not in the book and could not be.
      origin: extractor_observed
