- qa_id: qa_pex_0025
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "PATTERN & FIELD, converted-PDF pages 91 and 92"
  question: >
    You have photographed a market stall piled with identical brass pots. The heap fills most of
    the frame, but the outermost pots sit complete inside the frame with a strip of table visible
    beyond them. On Freeman's account of field images, what has gone wrong and what is the fix?
  answer: >
    The image will read as a finite heap of pots rather than as a field. Freeman calls it essential
    for a field image to frame so that the elements run off at all the edges, and gives the reason:
    this alone suggests that they go on and on. Elements severed by the frame edge are read as
    continuing past it, so the visible mass is taken as a sample of a larger one. The fix is
    framing, not arrangement — he says of his own LED lamps that he did not touch a thing to
    arrange them. Move in or crop so that pots are cut at every edge and no complete outermost
    element or surrounding table survives. He would add a prior question: the pattern also needs
    some surprise or curious element, or sheer weight of content, or it is not worth the frame at
    all.
  answer_type: application
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: >
    PATTERN & FIELD, converted-PDF page 91, with the diagram on converted-PDF page 92, which was
    rendered and inspected — the frame is drawn as a bright rectangle inside a larger pale
    continuation of the same cell pattern.
  confounders:
    - "reaching for a wider lens to include more pots, which increases the count but not the endlessness"
    - "arranging or adding pots, when his own case was shot exactly as found"
    - "assuming a strong pattern is sufficient; he explicitly rules out a brick wall"

- qa_id: qa_pex_0026
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "MOVING IN, converted-PDF page 148, and MOVING OUT, converted-PDF page 150"
  question: >
    A colleague shows you a street frame in which a cyclist is riding out of the right-hand edge,
    and says it breaks the rule about leaving space in front of a moving subject. Using Freeman,
    what would you need to look at before agreeing?
  answer: >
    You would look at whether the setting itself carries a direction. Freeman states the entry-side
    rule and then reverses it in the very next case, and the reversal is conditional. In his
    Torquay frame the lit façades of the harbour front give a clear impression of facing right
    toward an out-of-frame setting sun, so the whole scene is already directed that way and the
    girl walking out completes that direction rather than fighting it. If the cyclist's frame has
    such a vector — light, receding architecture, other elements oriented the same way — the
    departure reads as completion. If it does not, the criticism stands. Note also that Freeman
    hedges the original rule in the same paragraph he states it: not compulsory, just natural.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: >
    MOVING IN, converted-PDF page 148, states the rule and its perceptual reason; MOVING OUT,
    converted-PDF page 150, reverses it and gives the harbour-front vector as the justification.
  confounders:
    - "applying the leave-room rule unconditionally, which would reject Freeman's own preferred frame"
    - "treating the reversal as justified by novelty — he does say pulling attention away keeps interest alive, but the frame he defends has a scene-level reason as well"
    - "assuming the rule is his invention; the reversal, and its condition, are the part specific to him"

- qa_id: qa_pex_0027
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "SPOT, converted-PDF page 170"
  question: >
    A picture editor says a frame works because of a small red figure against a grey background.
    What single check does Freeman demonstrate for settling that, and what does his own result look
    like?
  answer: >
    Convert the frame to greyscale and look again. He shows exactly this on the facing page of his
    own picture and says the point is lost — the composition needs the spot colour. In his
    greyscale version the woman does not merely weaken; she becomes very hard to find at all
    against the weir behind her. The check is cheap, repeatable on any frame, and settles the
    specific claim being made rather than a general one about colour. Two cautions from the same
    case: he ran it on one picture to settle one argument, and a frame that survives desaturation
    is not thereby a worse colour photograph. He gives no threshold for how much loss counts.
  answer_type: repair
  difficulty: easy
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    SPOT, converted-PDF page 170, which was rendered and inspected; the greyscale version is the
    third image on that page and the collapse is more complete than the caption suggests.
  confounders:
    - "measuring saturation or chroma statistics, which answers a different question than whether the composition holds"
    - "assuming a frame that survives desaturation has failed at colour, which the test does not show"
    - "confusing the greyscale test with converting the picture to black and white as a treatment"

- qa_id: qa_pex_0028
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "MOMENT, converted-PDF pages 152 and 153"
  question: >
    You are photographing a row of brightly painted shopfronts and waiting for a passer-by to bring
    the scene to life. Following Freeman's method, what do you decide before anyone arrives, and
    what is the constraint that makes those decisions narrow?
  answer: >
    You decide, in advance, one or two specific gaps within the composition where you would like to
    catch a figure. The constraint that makes them narrow is his hard rule for this kind of scene:
    you cannot afford to let the figure cross over any graphic line. In a strongly graphic setting
    the divisions are already load-bearing, so a figure overlapping one damages the structure
    instead of adding to it, and only the intervals between divisions are usable. In his beach-cabin
    frame he had three anticipated positions and timed the shot for the central one, catching the
    girl exactly in a white space; he says most of the other frames were unsuccessful because of
    poor positioning, and that the windows of opportunity were very narrow. He also concedes the
    limit of the method — you can expect how a figure will move through the frame, but it is rarely
    completely certain.
  answer_type: application
  difficulty: medium
  knowledge_type: shot_design
  requires_application: true
  support: >
    MOMENT, converted-PDF page 152, with the three anticipated positions marked on converted-PDF
    page 153 and the failed outtakes on converted-PDF page 152.
  confounders:
    - "shooting a burst and choosing afterwards, which does not solve the problem he identifies — most of his outtakes failed on position, not on timing granularity"
    - "applying his entry-side placement rule here, which the graphic structure overrides"
    - "assuming any gap will do; the gaps have to be chosen from the composition's own divisions"

- qa_id: qa_pex_0029
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "HIGH, converted-PDF page 97"
  question: >
    You are asked to photograph a nineteenth-century lighthouse together with its tropical island
    setting, and every attempt from sea level either loses the setting or buries the lighthouse in
    foreground. What was Freeman's answer to exactly this brief?
  answer: >
    He climbed the lighthouse and shot down from its own top, so that the lighthouse is the subject
    of the picture without appearing in it — represented by its shadow, for which he waited until
    later in the day so the shadow would be longer. He arrives at this through a general
    observation: what is often missing from a high vantage point is any evidence of the viewpoint
    itself, and there are times when including it adds to the scene. His sea-level attempts, which
    he shows, are the workaround that fitted the lighthouse against a variety of foregrounds and
    failed to combine both elements. He is candid that the appeal of the high viewpoint is partly
    an illusion — commanding, putting us in charge — and that you may not always want evidence of
    the viewpoint interfering with the view.
  answer_type: application
  difficulty: hard
  knowledge_type: shot_design
  requires_application: true
  support: >
    HIGH, converted-PDF page 97, with the sea-level workarounds on converted-PDF page 98. The brief
    he states is combining two elements — lighthouse plus tropical context.
  confounders:
    - "reaching for a drone or aerial platform, which gives height but not the subject's own viewpoint and would not put the shadow in the frame"
    - "assuming the answer is a wider lens or a longer foreground search, which is the family of attempts he shows failing"
    - "supposing the shadow is incidental; the timing decision he reports is specifically about lengthening it"

- qa_id: qa_pex_0030
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "CURVES, converted-PDF pages 82 and 83"
  question: >
    Someone claims a photograph is structured by a strong diagonal mass running from the lower left
    to the upper right. What test does Freeman's own illustration method suggest for settling that,
    and what are its limits?
  answer: >
    Redraw the frame as three or four flat tonal masses, with all texture and detail removed, and
    ask the question again. If the claimed line or shape survives that reduction it was in the
    image; if it disappears it was in the description. Freeman does this in his cattle-camp case,
    where the reduction leaves only the bull's outline and the horn curves, and it is what carries
    his claim that the curved outline defines the corner so strongly that it almost separates. The
    limits are real. He never proposes it as a test — he performs it as an illustration — and he
    does not use it consistently, illustrating several shape cases with arrows over the unmodified
    photograph instead. His reductions are also hand-drawn, so they already encode his reading and
    cannot falsify it. Reading it as a diagnostic is an extrapolation, not his claim.
  answer_type: repair
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    CURVES, converted-PDF page 83, which was rendered and inspected — the second illustration is the
    photograph redrawn in four flat greys. The reading of it as a general test is ours and is
    recorded as such.
  confounders:
    - "attributing the test to Freeman, when he only performs the technique and never proposes it"
    - "assuming an automated posterisation is the same instrument as his hand-drawn reduction"
    - "using it on a colour, focus or motion claim, which it says nothing about"

- qa_id: qa_pex_0031
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "FREEZING, converted-PDF pages 142 and 143"
  question: >
    In the Kerala fisherman picture, what was the fast shutter speed actually spent on, and what
    does Freeman say happens to the frame without it?
  answer: >
    Not on the man. He says the straining movements of the fisherman's body were not the issue and
    that a modest shutter speed would have dealt with them. The 1/500 second was spent on the spurt
    of sand at his feet, which catches the eye because it is sharp and slightly unexpected, and
    which Freeman says makes the shot. His caption states the effect directly: the spurt, simply by
    being crisp and airborne, draws the eye down to the man's feet — and without it the immediate
    focus of attention is the torso. So a small frozen detail relocates the attention of the whole
    frame. He is measured about the size of the gain: at a slower speed the image would still have
    worked to an extent, but without that extra finesse.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    FREEZING, converted-PDF page 142, with the attention captions on converted-PDF pages 142 and
    143. The without-spurt version is a manipulation by the author, not a second exposure.
  confounders:
    - "assuming the shutter speed was set for the main action, which he explicitly says it was not"
    - "treating this as a sports-photography lesson about freezing the decisive element, when his decisive element is a by-product of the action"
    - "supposing the comparison is between two frames; it is one frame with the spurt removed"

- qa_id: qa_pex_0032
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "DISTANT, converted-PDF page 113"
  question: >
    A landscape frame taken with a 300mm lens shows a distant range of hills filling the upper half
    and nothing else. The photographer complains that it does not feel far away. Using Freeman's
    account, what is missing and what would you look for instead?
  answer: >
    What is missing is the evidence of the interval. Freeman separates being far away from a
    subject from showing distance: a telephoto deals with the first by bringing the subject closer
    in the frame and letting it be seen in detail, but that can leave nothing for the viewer to
    measure the gap against. What supplies distance is a set of visual clues — ground visible
    continuously from the foreground all the way to the subject, a viewpoint raised enough to let
    that ground be seen, aerial perspective, and in his Big Bend frame a sky of towering clouds
    that shows distance by standing over the mountains. He is explicit that this does not depend
    much on the lens: he qualifies himself by noting that some telephoto shots do carry strong
    distance, where the viewpoint is high enough to see mountains arranged one behind another with
    haze at work.
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: >
    DISTANT, converted-PDF page 113, with the continuous-ground and cloud-height caption on
    converted-PDF page 114. The cue list is his account of one photograph, not an enumeration.
  confounders:
    - "prescribing a wide-angle lens as the answer, when he says the dependency is not really on the lens"
    - "adding a foreground object for scale, which is a different device — his cue is the continuous visible ground, not a scale reference"
    - "treating haze as something to remove in processing, when here it is one of the cues"

- qa_id: qa_pex_0033
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "SHIFT, converted-PDF pages 133 and 134"
  question: >
    You are photographing a tall church from street level and the walls lean inward. Set out
    Freeman's optical solution, its prerequisite, and how he handles the obvious objection.
  answer: >
    The leaning comes from tilting the camera up to take in the building. His solution is not to
    tilt at all: aim straight, keep the camera level, and then shift the lens upward to bring the
    whole building into view. The prerequisite is a lens that projects an image circle larger than
    the sensor — ordinarily a waste of optics, and the reason a shift or perspective-control lens
    is a special item. His own diagram is honest about the intermediate state: levelling first cuts
    off the top of the church and shows unnecessary foreground, and the shift is what restores the
    view. The obvious objection is that this can be corrected in software, and he raises it
    himself, then answers it on preference rather than on result — "isn't it better to do it for
    real on the spot?" That is a practitioner opinion and should not be reported as a finding about
    which method produces the better picture.
  answer_type: application
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: true
  support: >
    SHIFT, converted-PDF page 133, with the level-then-shift diagram on converted-PDF page 134.
  confounders:
    - "confusing shift with tilt; tilt angles the lens plane, shift slides it while keeping it parallel"
    - "treating his preference for doing it optically as an argument that the digital correction is worse, which he does not make"
    - "assuming any lens can be shifted, when the larger image circle is the whole prerequisite"

- qa_id: qa_pex_0034
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "TRIANGLES, converted-PDF page 84"
  question: >
    A reviewer notes approvingly that a portrait "forms a strong implied triangle". On Freeman's own
    account of implied triangles, how much does that observation establish?
  answer: >
    Very little on its own. Freeman says implied triangles are the most frequent shapes in imagery
    simply because they happen with any three prominent points — even three badges thrown down
    connect in the eye. If a triangle is almost always present, noticing one is close to
    uninformative. He supplies the filter himself in the same case: a shape is worth the shot only
    where it is in some way unexpected or unpredictable, and he then widens that to photography in
    general — we like to see what we cannot predict, not what is already obvious. So the useful
    question is not whether a triangle is there but whether this one is surprising. His own example
    is a momentary triangle made by a cloth as a bather prepares to wrap it, which he says he was
    not quite expecting. Note that he never defines unpredictability or gives a test for it.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    TRIANGLES, converted-PDF page 84 — both the ubiquity claim and the unpredictability filter are
    in the same case.
  confounders:
    - "the composition-teaching habit of treating a found triangle as evidence of good structure, which his ubiquity claim undercuts"
    - "assuming the filter is about rarity of the subject, when it is about the viewer's expectation of the shape"
    - "supposing he offers a way to measure unpredictability; he does not, and it functions as taste stated as a principle"

- qa_id: qa_pex_0035
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "MUTED, converted-PDF page 163"
  question: >
    Two reviewers look at the same restrained colour photograph. One calls it muted, the other calls
    it drab. What does Freeman say resolves the disagreement?
  answer: >
    Nothing in the picture. He asks the question himself and answers that the difference does not
    lie in the actual colour scheme but in our own value judgement: if you are in the mood for
    colour pizzazz, then it is drab; if you feel like restraint, it is muted. He supplies the reason
    the category exists at all in the same passage — rich colours give plenty to react to and for
    exactly that reason quickly become too much for comfort, so visual excitement works best as part
    of a balanced diet. This is the sharpest epistemic statement in his colour part and it undercuts
    the rest of it: a named colour quality with no image-side definition cannot be detected in a
    frame, only reported by a viewer.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: colour
  requires_application: true
  support: >
    MUTED, converted-PDF page 163. The self-limiting argument for rich colour is in the opening of
    the same case.
  confounders:
    - "looking for a saturation threshold that separates them, which is exactly what he denies exists"
    - "assuming the subject matter settles it — his subject is Shaker design, whose restraint is doctrinal, and he still says the judgement is the viewer's"
    - "treating this as a claim about taste in general rather than about this specific pair of words"

- qa_id: qa_pex_0036
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "FOUR-SQUARE, converted-PDF pages 95 and 96"
  question: >
    A documentary series is shot entirely head-on and squared up, and the photographer says this
    makes it more objective. How would Freeman respond, and what would he grant?
  answer: >
    He would call the belief a delusion, and he uses that word. His position is that the treatment
    certainly looks as if you are approaching the subject head-on and without fancy dramatic angles,
    which is why it has become the treatment of choice for documenting things, people and places —
    but the look of objectivity is itself a compositional effect, not a property of the method. What
    he would grant is that the treatment is genuinely useful and that many serious photographers
    have used it, naming Sander, Strand and the Bechers. He would also grant a purely practical
    virtue with nothing to do with meaning: magazine picture editors and art directors like it for
    covers, because the horizontal and vertical alignments take headlines, mastheads and other
    typography very well.
  answer_type: source_position
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    FOUR-SQUARE, converted-PDF pages 95 and 96. The delusion remark, the list of photographers and
    the typography reason are all there.
  confounders:
    - "accepting the objectivity claim because of the photographers he lists, when the list is an appeal to practice and not evidence either way"
    - "assuming he dislikes the treatment; he calls it very useful and defends it against the charge of being unimaginative"
    - "confusing the typography reason with an aesthetic one — it is a production convenience"

- qa_id: qa_pex_0037
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "FOUR-SQUARE, converted-PDF page 95, and PRECISION, converted-PDF page 108"
  question: >
    A portrait is intended as a squared-up frontal document but the subject sits at a slight angle
    to the camera. Following Freeman, is that a defect, and does it matter which case you are in?
  answer: >
    It matters a great deal which case you are in, and in the four-square case it is a change of
    meaning rather than a defect. His caption is precise: even a slight angle to the subject becomes
    more casual, less deliberate. Nothing is broken; the picture now says something different from
    what was intended, which is a different kind of problem from a fault. In the precision case the
    verdict is harsher, and for a structural reason: where two identical forms are nested one
    behind the other the viewer has a perfect reference for alignment, so a small error is directly
    visible and, in his word, sloppy. The general rule under both is his ranking — most of the time
    there are more important things going on in front of the camera than exact alignments, such as
    expression, action and gesture — so alignment only becomes decisive when the subject makes it so.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    FOUR-SQUARE, converted-PDF page 95, for the casual/deliberate caption; PRECISION, converted-PDF
    page 108, for the nested-geometry condition and the ranking.
  confounders:
    - "applying a single alignment standard to every frame, which Freeman's ranking rejects for most photographs"
    - "treating the four-square deviation as correctable, when the change is in what the picture reads as"
    - "assuming nested geometry is unusual enough to ignore; his point is that when it is present the tolerance collapses"

- qa_id: qa_pex_0038
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "LOOKING THROUGH, converted-PDF pages 104 and 105"
  question: >
    An art director asks for a photograph that makes the viewer feel what it is like to walk down
    through a forest and come upon a village. What did Freeman actually do, and what convention did
    it break?
  answer: >
    He deliberately put unfocused tree trunks in the foreground, so that the viewer knows they are
    walking toward the edge of a forested slope and about to enter the village. The convention it
    breaks is that a viewpoint means a good view — clear, unobstructed, looking out over a
    worthwhile scene, of the kind that authorities signpost as scenic overlooks. He treats that
    convention as true and normal, citing Ansel Adams writing at length about one Yosemite vista he
    returned to many times, and offers the obstruction as an alternative rather than a correction.
    His own summary of the result is modest and worth preserving: not a neat view, but more
    personal, and perhaps with more of a sense of place. The brief was for a feeling, and the answer
    was to break the clear view.
  answer_type: application
  difficulty: medium
  knowledge_type: shot_design
  requires_application: true
  support: >
    LOOKING THROUGH, converted-PDF pages 104 and 105. The art director's brief is quoted in the text
    and the blurred-trunk caption is on converted-PDF page 104.
  confounders:
    - "framing the answer as a foreground interest device, when the obstruction is unfocused and specifically not offered as something to look at"
    - "assuming he is arguing against clear views in general, which he explicitly is not"
    - "supposing the effect comes from the wide framing rather than from the defocus of the near trunks"

- qa_id: qa_pex_0039
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "COLOR-WASH FOREGROUND, converted-PDF page 125"
  question: >
    Putting a blurred colour wash behind a subject and putting one in front of it look like
    symmetrical options. Freeman says they are not. What is the asymmetry?
  answer: >
    The background version is comparatively easy: choose an aperture wide enough to blur the far
    element while keeping the subject sharp, and in his still life he simply placed the colour
    source — a polished abalone shell — a few inches behind. The foreground version requires a
    different and, in his words, not natural shooting technique. You have to shoot through gaps or
    around the edges of a colourful subject close to the camera while focusing on something
    distant, and you have to keep the blurred foreground colours dominant, which is not what the
    camera or the situation wants. He shot his through the lettering on a food vendor's glass case
    at ƒ/2.8 on a 200mm and reports a lot of moving around to get the right amount of blur, which
    depends on how close the camera is to the lettering. The background case is also a constructed
    still life and the foreground case is found, so they are not equally repeatable.
  answer_type: comparison
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    COLOR-WASH FOREGROUND, converted-PDF page 125, set against COLOR-WASH BACKGROUND, converted-PDF
    page 123. The blur-distance dependency is captioned on converted-PDF page 126.
  confounders:
    - "assuming the two are mirror images of one optical setup, which is the reading he corrects"
    - "treating the foreground wash as a lens flare or overlay effect rather than as a real near object shot through"
    - "supposing a wider aperture alone solves the foreground case; the camera-to-foreground distance is what sets the blur"

- qa_id: qa_pex_0040
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "ACTION COINCIDES, converted-PDF page 190"
  question: >
    You have a crowded street scene that refuses to cohere. What three routes out does Freeman name,
    and how reliable does he say the third one is?
  answer: >
    He names camera angle, light, and the way the action unfolds. He puts the third last and
    immediately withdraws confidence from it: "Rely may be the wrong word, because things often
    don't work out, and you end up with just a busy scene." His own instance is a South Indian
    temple where a statue of the bull Nandin stood near a live cow. He waited and tried several
    things — people coming, praying, going — and calls all those shots mediocre. Then, briefly, the
    cow looked up at the statue just as one man reached down to touch its feet and another reached
    up to touch the statue. The actions were all separately motivated and simply came together,
    which he says brought some order out of chaos. He does not claim the coincidence was made; he
    claims it was waited for.
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: >
    ACTION COINCIDES, converted-PDF page 190, with the marked vectors on converted-PDF page 191,
    which was rendered and inspected, and the mediocre outtakes on converted-PDF page 190.
  confounders:
    - "expecting a compositional fix, when two of his three routes are decisions and the third is patience"
    - "assuming the coinciding actions were directed or arranged, which he denies"
    - "reading the marked vectors as converging on a point; rendering the diagram shows a closed loop of gaze and gesture, which is our observation and not his caption"

- qa_id: qa_pex_0041
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "SPOT, converted-PDF page 170"
  question: >
    Freeman places his red figure far off near a corner of a wide grey frame and says it still
    works. What licenses that placement, and where does his diagram go further than his text?
  answer: >
    What licenses it, in his text, is the strength of the hue: red is the most insistent and
    eye-catching of all colours, so the figure can be placed way off near a corner and the image
    still works. The frame was widened by a pan-and-stitch precisely because more of the same
    greyish background lay sideways, and he says the balance between a small strong colour and a
    large grey background works better that way. His middle diagram goes further than that. It plots
    progressively less colourful versions of the figure at positions progressively nearer the
    centre, which draws placement latitude as a function of chromatic strength rather than stating
    it for one colour. Reading it as a scale is ours, not his; his text claims only that red allowed
    a corner placement.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: colour
  requires_application: false
  support: >
    SPOT, converted-PDF page 170, which was rendered and inspected. The alternative-positions
    diagram is the middle image and its caption names it as positions for a less colourful version
    of the woman.
  confounders:
    - "assuming a small subject must be placed centrally or on a division to hold attention"
    - "treating the red claim as established perceptual fact; it is asserted without support"
    - "attributing the latitude scale to Freeman, when his text makes only the single-colour claim"

- qa_id: qa_pex_0042
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "THEME, converted-PDF page 165"
  question: >
    A picture editor asks you to assess whether a single photograph "has a colour theme". On
    Freeman's definition, what is wrong with the request?
  answer: >
    The unit is wrong. He defines a colour theme as something that covers a number of images and
    that works well for a picture story because it holds them together and gives them a sense of
    unity. It is a property of a set, not of a frame, so a single photograph cannot pass or fail the
    test. Two further points from the same case. It need not be intentional — he says you could
    simply select it from what you already shot, and in his own Akha assignment he only realised
    after a couple of weeks that the community lived within a certain range of colours. And the
    everyday vocabulary is legitimate: he notes that words like ochre and brick are understood by
    everyone better than hue-saturation-brightness descriptions, while still denoting a tight zone
    of the colour solid.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: colour
  requires_application: true
  support: >
    THEME, converted-PDF page 165, with the wedge diagram on converted-PDF page 166 and the other
    assignment images on converted-PDF page 167.
  confounders:
    - "conflating theme with palette, which he treats as a separate case attributed to a place or a style"
    - "assuming a theme must be planned, which he explicitly denies"
    - "treating a harmonious single frame as having a theme, which collapses the set-level definition"

- qa_id: qa_pex_0043
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "TABLEAU, converted-PDF page 186"
  question: >
    You photograph a family dinner squared up down the length of a long table and a viewer says it
    references a famous painting. Freeman anticipates this exact situation. What is his position?
  answer: >
    That the association operates whether or not you intended it. He says the Last Supper has become
    so iconic that almost any squared-up image of a long table with people sitting at it, talking,
    evokes some association at least — and he states plainly that his own picture is neither a
    reference to it nor an imitation of it. It is simply lunch among friends; the symmetrical
    arrangement and the light made him want to shoot it as the conversation became animated. The
    practical consequence is that the arrangement imports a reading you cannot switch off, so the
    choice is to accept it or to change the arrangement. One qualification worth keeping: the
    association is culturally specific and he states it as though universal — it holds for viewers
    formed by a particular pictorial tradition.
  answer_type: source_position
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: >
    TABLEAU, converted-PDF page 186. His disclaimer and the "evokes some association at least"
    claim are in the same paragraph.
  confounders:
    - "assuming intent controls reference, which is the position he rules out"
    - "treating the association as a fault to be avoided, when he accepts it and shoots anyway"
    - "supposing the claim is universal; it depends on the viewer carrying the reference"

- qa_id: qa_pex_0044
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "TABLEAU, converted-PDF pages 186 and 187"
  question: >
    In a very wide frame of a group at a table, where does Freeman say the picture is actually
    carried, and what did he do to secure it?
  answer: >
    At the ends. He says the key to the shot is the contrast between the two furthest figures, far
    left and far right — not the centre of the frame and not the middle of the group. To secure it
    he shot overlapping pairs for stitching, left and right, which gave him a choice of
    combinations of movement and expression for those two end figures. He had time to set up a
    tripod with nobody paying any attention, so the frame was deliberate rather than snatched. This
    is a placement claim about wide frames and it is independent of the association claim in the
    same case; he does not connect them.
  answer_type: application
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: >
    TABLEAU, converted-PDF page 186, with the left and right alternatives shown on converted-PDF
    page 187.
  confounders:
    - "assuming the centre of a symmetrical composition carries it, which the symmetry invites and he contradicts"
    - "reading the stitching as a way to fit more people in, when its stated value is the choice of end-figure moments"
    - "generalising to all wide frames; the claim is made about this tableau"

- qa_id: qa_pex_0045
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "MID-AIR, converted-PDF page 144"
  question: >
    A photographer wants a picture of a juggler's ball in flight and asks when to release. What are
    the only two moments Freeman considers worth the frame, and how does he relate this case to an
    earlier part of the book?
  answer: >
    One is the point at which the thing is just about to reach its destination — an object crashing
    to the ground, or in his shown example a piece of food on its upward journey to a mouth. The
    other is the still point, the exact instant at the peak of a parabola when something thrown into
    the air pauses before falling back; his example is a child thrown by a troupe of acrobats. He
    says the two work in different ways but share the same mid-air idea. He relates the case to the
    framing case he calls Just, in an earlier part of the book, as its equivalent in the world of
    photographing action — the same precision transposed from position to time. He gives no reason
    why these two moments and not others, and he deliberately avoids the obvious version of the
    first, saying he is showing food rather than the more predictable vase about to shatter.
  answer_type: application
  difficulty: medium
  knowledge_type: shot_design
  requires_application: true
  support: >
    MID-AIR, converted-PDF page 144, with the parabola caption on converted-PDF page 145. The
    reference to Just names a case in the live Parts 1-3 span; only the case title is used, because
    the book's page cross-references do not resolve in this copy.
  confounders:
    - "assuming the peak is chosen because the subject is briefly stationary and therefore easier to freeze; his framing is compositional, not technical"
    - "expecting a general rule about anticipating action, when he names exactly two instants"
    - "supposing the two moments are the same idea; he says they work in different ways"
