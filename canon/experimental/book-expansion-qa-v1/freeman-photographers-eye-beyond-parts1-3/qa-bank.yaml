# ── DEFINITIONS AND FACTS ────────────────────────────────────────────────────

- qa_id: qa_pex_0001
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "Part 4 Graphics, part introduction, converted-PDF page 72"
  question: >
    Freeman opens his Graphics part by making a distinction about what a photograph actually
    contains. What is it, and what does it imply about who supplies the lines and shapes?
  answer: >
    He says that strictly speaking graphics are the province of artwork and illustration, and that
    a photograph contains edges, contrast and whatever associations the eye and mind make up. The
    lines and shapes are therefore not in the photograph; they are what we think we see, completed
    by the viewer out of those edges. His practical conclusion is that graphics depend on the
    photographer to find and exploit — they are not given by the subject — and that by no means
    all photographs have them, which he says is part of their appeal when they do appear. He
    defines a graphic photograph as one in which lines and shapes play a strong part, often
    stronger than the subject.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    Part 4 introduction, converted-PDF page 72. The distinction between artwork and photography and
    the definition of a graphic photograph are both stated there.
  confounders:
    - "treating lines and shapes as objective features present in the scene, which is the position Freeman explicitly separates himself from"
    - "assuming a graphic photograph means a highly designed or posed one, when his criterion is only that lines and shapes outrank the subject"
    - "confusing this with the design-education sense of 'graphic', which is about deliberate mark-making"

- qa_id: qa_pex_0002
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "CLOSE, converted-PDF page 110"
  question: >
    Freeman is careful to distinguish "close" from "close-up". What is the difference in his terms,
    and what common assumption about equipment does he remove?
  answer: >
    Close-up, he says, is to do with magnification of small things. Close is a sense of being right
    up against the subject, shooting from nearer than most people would consider normal and
    possibly nearer than feels comfortable. The assumption he removes is that close means a
    wide-angle lens: he says close viewpoints do not always mean wide-angle lenses, and his own
    example was shot at close to normal, 48mm, with tight framing doing the work instead. He also
    separates the practical reasons for being close — no room to stand back, obstructions such as
    telegraph lines forcing an architectural photographer nearer — from the expressive one, and
    only the expressive one carries his claim about a personal and emotional connection.
  answer_type: comparison
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    CLOSE, converted-PDF page 110. The close/close-up distinction, the 48mm figure and the
    separation of practical from expressive reasons are all stated there.
  confounders:
    - "the widespread assumption that a close viewpoint requires a wide-angle lens, which he contradicts with his own focal length"
    - "reading 'close' as macro or detail work, which is exactly the confusion he is guarding against"
    - "assuming the emotional connection comes from the lens rather than from the physical distance and the subject's eye level"

- qa_id: qa_pex_0003
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "COUNTER FOCUS, converted-PDF page 131"
  question: >
    What does Freeman mean by "counter-focus", and what does he say about the status of the term?
  answer: >
    Counter-focus is tilting the lens back against a scene that lies tilting forward — the reverse
    of the ordinary forward tilt, which is used to lay the plane of sharp focus along a subject.
    Reversed, with the aperture wide open, he says it gives the most extreme selective focus
    possible. He flags the term as his own coinage, saying explicitly that it is just his term for
    it, and he notes that using the movements this way is the exact opposite of how these cameras
    were designed to be used. His own example is a scriptorium desk shot with a standard lens
    tilted right back and, on a 4x5-inch studio camera, the film back tilted far forward as well,
    so that only a few letters and a hand are sharp.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    COUNTER FOCUS, converted-PDF page 131, with the geometry set out in TILT, converted-PDF
    page 128. The coinage disclaimer and the design-intent remark are both in the counter-focus text.
  confounders:
    - "assuming this is established terminology, when Freeman says it is his own word"
    - "confusing it with the 'miniature faking' or tilt-shift look, which is a different aim from his — his purpose is to isolate a few letters, not to make a scene look like a model"
    - "supposing extreme selective focus is only an aperture matter, when the tilt is what makes it extreme here"

- qa_id: qa_pex_0004
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "RICH, converted-PDF page 158, and CONTRAST, converted-PDF page 171"
  question: >
    Describe the three axes of Freeman's colour cylinder and state where he locates "rich" and
    where he locates the strongest colour contrasts.
  answer: >
    Hue runs radially, like spokes of a wheel. Saturation runs from the centre outward, grey at the
    centre and intense at the rim. Brightness runs from black at the top to white at the bottom.
    Rich he locates close to the outer rim at a medium-dark level — he cuts away the upper section
    of the solid so the reader can see in to that level. The strongest colour contrasts are between
    opposite wedges of the hue circle: orange against blue, red against green, yellow against
    violet, which are also the complementary pairs. His stated point about contrast is that what
    counts as different for perception is the hue alone, not dark against light and not grey
    against saturated.
  answer_type: factual
  difficulty: easy
  knowledge_type: colour
  requires_application: false
  support: >
    RICH, converted-PDF page 158 for the three axes and the position of rich; CONTRAST,
    converted-PDF page 171 for opposite wedges and the hue-only claim.
  confounders:
    - "treating brightness and saturation contrast as kinds of colour contrast, which is the reading Freeman explicitly rules out"
    - "assuming rich means maximum saturation at any brightness, when he places it at a specific medium-dark level"
    - "confusing his cylinder with a colour wheel, which has only the hue axis"

- qa_id: qa_pex_0005
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "NEAR-FAR, converted-PDF page 177"
  question: >
    Freeman attributes the term "near-far" to Ansel Adams. What are its requirements as he states
    them, and what does he say does NOT qualify?
  answer: >
    It requires a very close foreground subject and another subject in the background, both
    impeccably sharp, and a meaningful relationship between them. What does not qualify is his own
    phrase — just slapping a rock in the foreground and a mountain behind. The two elements must
    compare in some way, either graphically or in meaning, or both. He adds a practical
    consequence: it is a wide-angle effect, so tiny adjustments to the camera position make a big
    difference to how the near and far elements register against each other. In his cormorant
    picture the whole result rests on exactly where the bird's head and neck fall against the edge
    of the boat and the man.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    NEAR-FAR, converted-PDF page 177, with the camera-position sensitivity shown on converted-PDF
    page 178.
  confounders:
    - "reducing near-far to 'include a foreground', which is precisely the lazy version he names and rejects"
    - "assuming the sharpness requirement is the hard part, when he treats the relationship requirement as the hard part and calls Adams meticulous about it"
    - "confusing it with compression, which relates near and far by the opposite optical route"

- qa_id: qa_pex_0006
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "COMPOSITE, converted-PDF page 197"
  question: >
    What does Freeman say distinguishes the Chinese "mountain-water" scroll from the European
    painting tradition, and what method does he report for building one?
  answer: >
    He names two differences. Long and vertical is not part of the European painting canon. And the
    Chinese approach is to express the essence of the landscape rather than an image of what can be
    seen. The method he reports is to combine elements from the landscape in general and stack them
    vertically, almost always leading to an upper peak. Attempting it photographically in the
    Nujiang gorge, he began with a shot of a footbridge and built upward from images taken within
    an hour or two's drive up and down the gorge, including a large rock window high above the
    valley. He accepts that the combined view is impossible and claims that, like a mountain-water
    painting, it shows more of the essence of the gorge than a single image could.
  answer_type: source_position
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    COMPOSITE, converted-PDF page 197. This is a photographer's summary of another tradition,
    offered without sources, and should be treated as his understanding of the form.
  confounders:
    - "treating his account as art history rather than as a practitioner's working summary"
    - "assuming vertical panoramas in Western photography are the same idea, when his stated point is the difference in aim — essence rather than view"
    - "reading the impossibility of the view as a defect, when he presents it as the form's whole premise"

# ── MECHANISMS ───────────────────────────────────────────────────────────────

- qa_id: qa_pex_0007
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "DIAGONALS, converted-PDF page 79"
  question: >
    In the St Peter's picture Freeman credits the energy of the frame to something more specific
    than "diagonals are dynamic". What is the actual mechanism he names, and what does his own
    counterfactual concede?
  answer: >
    The mechanism is opposition, not diagonality. He points out that the diagonals in that frame
    are entirely a creation of camera angle and lens, and that rotating the camera about its
    viewing axis turns every vertical in the building into a diagonal running counter to the
    already-diagonal shafts of sunlight. It is that counter-running of two diagonal sets he credits
    with the energy. His counterfactual is honest about the cost: had the camera been levelled, the
    shafts of light would have been longer, but the picture would have been less dynamic and more
    rigidly architectural. Something is given up as well as gained.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: composition
  requires_application: false
  support: >
    DIAGONALS, converted-PDF page 79, with the levelled version on converted-PDF page 80 and the
    rotation diagram on converted-PDF page 81.
  confounders:
    - "the generic claim that diagonals add movement, which Freeman also states but is not the mechanism he credits in this case"
    - "assuming the diagonals came from the architecture, when he says they are entirely a product of camera angle and lens"
    - "treating the levelled version as simply worse, when he grants it longer light shafts and calls it more formal"

- qa_id: qa_pex_0008
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "TRIANGLES, converted-PDF pages 84 and 86"
  question: >
    Freeman says any three prominent points are read as a triangle. What single change turns that
    flat reading into a depth reading, and why does he say it works?
  answer: >
    Making the three elements differ in size while they still look alike. He says that if there is
    a difference in size the eye puts them into perspective — literally — so the arrangement stops
    reading as a flat triangle and starts reading as recession. The reason is that similarity of
    kind licenses the assumption that the objects are really the same size, so any difference in
    apparent size can only be distance. His demonstration is three Mao badges shown first at
    matching sizes and then at graded sizes. His caption states the condition explicitly: if the
    objects look similar but vary in size, it suggests depth and perspective.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    TRIANGLES, converted-PDF page 84, with the two-state diagram on converted-PDF page 86, which
    was rendered and inspected for this extraction.
  confounders:
    - "assuming any size variation produces depth, when the similarity of kind is what licenses the inference"
    - "attributing the depth to overlap or to occlusion, which is a different cue and not the one he isolates here"
    - "supposing a real triangle is needed, when his whole point is that three distinct points suffice"

- qa_id: qa_pex_0009
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "TUNNEL, converted-PDF page 106"
  question: >
    Freeman treats lens vignetting as a compositional device. What mechanism does he give, and
    what conflict does he name between that use and the technical defaults?
  answer: >
    Vignetting is a darkening away from the centre, and because our eyes tend to look toward
    brighter areas it concentrates attention toward the centre. He is explicit that the effect on
    attention is separate from and more interesting than the effect on brightness. The conflict he
    names is that lens manufacturers consider vignetting an optical fault and engineer their lenses
    to minimise it, and that processing programs carry lens-correction modules that remove it by
    default — so using it means turning the correction off or lessening it rather than accepting it
    as automatic. He concedes the position is a taste one against an engineering consensus: some
    of us, he says, actually like it.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    TUNNEL, converted-PDF page 106, which was rendered and inspected. The attention mechanism, the
    manufacturer conflict and the correction advice are all in the running text there.
  confounders:
    - "treating vignetting purely as a mood or vintage effect, when his claim is specifically about where attention goes"
    - "assuming the darkening is added in processing, when his is optical and he is arguing against removing it"
    - "supposing he claims vignetting is always desirable, when he presents it as a minority taste"

- qa_id: qa_pex_0010
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "MOVING IN, converted-PDF page 148"
  question: >
    Why does Freeman say a walking figure looks most natural on the side of the frame it entered
    from rather than in the centre?
  answer: >
    Because the viewer extrapolates the motion. The figure is obviously moving, so we assume the
    movement will continue and project it forward in our minds — we sense the figure as being a
    little further into the frame than it actually is. Placing it back toward its entry edge
    therefore makes the perceived position land where a centred figure would only appear to be. He
    describes the figure as adding a vector to the image. He then hedges the rule in the same
    paragraph: this kind of placement is not compulsory, just natural.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    MOVING IN, converted-PDF page 148, with the placement diagram on converted-PDF page 149, which
    was rendered and inspected.
  confounders:
    - "the common 'leave room to walk into' advice, which prescribes the same placement for a different and vaguer reason — Freeman gives a perceptual account, not an etiquette"
    - "assuming the rule is firm, when he immediately calls it natural rather than compulsory and reverses it in the following case"
    - "confusing the projection effect with motion blur, which is a separate case in the same part"

- qa_id: qa_pex_0011
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "STACKING, converted-PDF page 181"
  question: >
    In the Grand Canyon picture, what actually converts the landscape into a stack of flat planes?
    Name the conditions Freeman lists and say which one carries the mechanism.
  answer: >
    He lists three. A long telephoto, 400mm, whose compression makes the successive rocky spurs
    seem almost equal in size. A viewpoint high enough to see over each spur. And summer haze with
    backlighting. The last one carries the mechanism: the haze and backlighting hide the detail
    inside each plane and so make them two-dimensional, and his caption puts it plainly — lacking
    detail because of the haze, each outcrop appears as a two-dimensional cut-out. Depth is then
    read from which flat shape sits in front of which, rather than from any modelling within them.
    That is the reverse of the usual account: the depth is produced by taking information away.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: composition
  requires_application: false
  support: >
    STACKING, converted-PDF page 181, with the plane count noted on converted-PDF page 182. The
    cut-out caption is on converted-PDF page 181.
  confounders:
    - "crediting the effect to the telephoto alone, which is the obvious reading and covers only one of his three conditions"
    - "assuming haze weakens an image, when here it is doing the constructive work"
    - "treating this as the same as aerial perspective supplying distance, which is his DISTANT case — there haze helps measure an interval, here it removes description"

- qa_id: qa_pex_0012
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "COLOR-WASH BACKGROUND, converted-PDF page 123"
  question: >
    What is Freeman doing with the abalone shell behind the quartz crystal, and what is the general
    permission he draws from it?
  answer: >
    He is using defocus to strip an object of its identity and keep only its hue. The crystal is
    colourless but refracts, so he placed a polished abalone shell several inches behind it and
    shot at a fairly wide aperture — just enough to keep most of the crystal sharp. At that distance
    and blur the shell is made completely abstract and unrecognisable for what it was, present only
    as iridescent blue and green which the crystal's facets then refract. The general permission he
    states is that there are times when colour will enliven an image and times when it matters less
    what those colours actually represent in real life.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: colour
  requires_application: false
  support: >
    COLOR-WASH BACKGROUND, converted-PDF page 123, with the shell shown separately on converted-PDF
    page 124.
  confounders:
    - "reading this as a bokeh or background-quality question, which is about the character of blur rather than about recruiting an object as pure colour"
    - "assuming the shell needed to be recognisable or thematically related, when he says the colours had nothing to do with the crystal"
    - "supposing this is a lighting technique; the colour comes from an object placed in the scene, not from a light"

- qa_id: qa_pex_0013
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "SELECTIVE, converted-PDF page 121"
  question: >
    Freeman claims the sharp-to-blurred gradient is a purely photographic phenomenon. What is his
    argument, and what practical conclusion does he draw from it?
  answer: >
    His argument is about ordinary vision: normal human eyesight does not experience optical blur.
    We see things at the periphery of vision as indistinct, but not as blurred. Because the
    gradient does not occur in direct experience, it reads as a photographic statement rather than
    as the viewer's own inattention, and he says this is what gives such images their visual
    appeal. The practical conclusions are two. What is not in focus is every bit as important as
    what is. And since the eye cannot help drifting toward whatever is sharp, the choice of exactly
    what to focus on is critical — the sharp point is a pointing device. He also sets aside the
    quality of the blur, telling the reader to forget bokeh, which he glosses as the subjective
    quality rather than the objective quantity.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    SELECTIVE, converted-PDF page 121, with the perceptual-layer diagram on converted-PDF page 122,
    which was rendered and inspected. The claim about human vision is asserted, not sourced.
  confounders:
    - "confusing this with depth-of-field mathematics, when his point is about how the result is read"
    - "assuming peripheral vision is blurred, which is the specific belief he denies"
    - "treating bokeh quality as the subject, which he explicitly sets aside"

- qa_id: qa_pex_0014
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "TILT, converted-PDF page 128"
  question: >
    State the Scheimpflug relationship as Freeman uses it, and say what shape the depth of field
    takes once the lens is tilted.
  answer: >
    In an ordinary camera the lens plane and the sensor plane are fixed parallel, so changing focus
    only moves the sharp zone nearer or farther and the depth of field runs near to far. Tilting
    the lens tilts the lens plane, and under the Scheimpflug Principle the point where the lens
    plane meets the sensor plane is also where the plane of sharp focus must meet — so the sharp
    plane swings away with the tilt. The resulting depth of field is wedge-shaped rather than
    slab-shaped, opening out as it recedes. His reason for wanting this is that what needs to be
    sharp is often not perpendicular to the sensor — objects on a table, a flat landscape.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    TILT, converted-PDF page 128, with the three-plane geometry drawn over a studio setup on
    converted-PDF page 130, which was rendered and inspected — the three coloured lines are parallel
    un-tilted and converge at a single lower-right point when tilted.
  confounders:
    - "describing tilt as increasing depth of field, when it reorients the sharp plane rather than deepening it"
    - "confusing tilt with shift, which slides the frame within the image circle and stays in one plane"
    - "assuming the wedge opens toward the camera; it converges at the meeting point and opens away from it"

- qa_id: qa_pex_0015
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "EYELINES, converted-PDF page 154"
  question: >
    What is Freeman's account of why an eyeline works, and what does he say happens when two
    eyelines converge?
  answer: >
    His account is curiosity: if we see someone looking intently at something, we want to see what
    it is and our eyes follow the gaze; and if the person suddenly looks up and away, he calls that
    irresistible — we can hardly help following the line of sight with our own eyes. When two
    individuals look at each other and the two eyelines converge, that point becomes almost
    magnetically the centre of attention. He adds an amplifier, half in jest: the effect is
    multiplied if someone is intently focusing a camera, because that suggests the subject really
    is worth looking at.
  answer_type: mechanism
  difficulty: easy
  knowledge_type: composition
  requires_application: false
  support: >
    EYELINES, converted-PDF page 154, with the converging pair illustrated on converted-PDF page 155.
  confounders:
    - "the film-grammar sense of eyeline match across a cut, which is about continuity between shots rather than about attention inside one frame"
    - "assuming eye contact with the camera is what he means; his cases are people looking at each other or at something in the scene"
    - "confusing this with his separate live-Canon claim that eyes attract attention more than any other subject — that is about salience, this is about direction"

# ── COMPARISONS AND TRADE-OFFS ───────────────────────────────────────────────

- qa_id: qa_pex_0016
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "WIDE-ANGLE IMMERSIVE, converted-PDF page 135, and TELEPHOTO COOLNESS, converted-PDF page 138"
  question: >
    Freeman sets the wide-angle and the telephoto against each other as an opposed pair. What is
    each one's effect on the viewer's position, and does he rank them?
  answer: >
    The wide angle used from close, inside a busy scene, produces what cinematography calls
    subjective camera — the camera is you — projecting the audience into the scene so they feel
    they are there rather than standing back observing. The telephoto used from across the street
    produces the opposite: a fly on the wall, an objective observer, quietly watching at leisure.
    He does not rank them. He calls the choice a matter of mood and personal taste, tells the
    reader not to pay attention if someone criticises them for being too shy to get close, and in
    the same passage rejects the blunt "just get closer". He also names an optical contributor to
    the cool version: at that distance depth of field covers everything, so the whole scene appears
    to lie on a similar plane.
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    WIDE-ANGLE IMMERSIVE, converted-PDF page 135, and TELEPHOTO COOLNESS, converted-PDF page 138.
    The refusal to rank is stated in the telephoto case.
  confounders:
    - "the street-photography orthodoxy that closer is braver and therefore better, which Freeman argues against by name"
    - "assuming the difference is only about how much of the scene fits in the frame, which he calls the merely functional use of a wide angle"
    - "supposing the flattening is a defect; he presents it as a contributor to the intended reading"

- qa_id: qa_pex_0017
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "HORIZONTAL LINES, converted-PDF page 73"
  question: >
    In the Yosemite Falls picture Freeman accepts a specific loss to buy a specific gain. What is
    the exchange, and why did the composition force it?
  answer: >
    He needed the silhouetted branches in the foreground and the distant falls to be equally sharp,
    because the effect depends on the branches reading as a flat overlay on the scene beyond rather
    than as a separate near object. That meant plenty of depth of field, so he stopped down to
    ƒ/32, which in that light gave 1/5 second — and he says plainly that he accepted some softness
    in the falling water as the price. The only moving thing in the frame is the thing that paid.
    He states the trade as a fact of the picture he made, not as a general exposure rule, and he
    does not claim the softness was desirable.
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: false
  support: >
    HORIZONTAL LINES, converted-PDF page 73. The aperture, shutter speed and accepted softness are
    all stated there.
  confounders:
    - "treating this as a generic depth-of-field lesson, when the requirement comes from a compositional decision about an overlay"
    - "assuming he wanted silky water, which is a common reason for a slow shutter on a waterfall and is the opposite of what he says"
    - "supposing a tripod or higher ISO would have resolved it; he reports the trade as taken, not as avoidable"

- qa_id: qa_pex_0018
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "PASTEL, converted-PDF page 161, and MUTED, converted-PDF page 163"
  question: >
    Pastel and muted are adjacent cases in Freeman's colour part and are easily confused. On his
    own colour solid, what is the difference?
  answer: >
    They move along different axes. Pastel is a move down the brightness axis to a lower, brighter,
    whiter level — he slides that section of the cylinder out to show the pale hues. He is explicit
    that the result is more about brighter than about less saturated: in his foggy Pennsylvania
    farm the grey wooden building is unsaturated, but the browns and greens still keep their
    colourfulness. Muted is the saturation move, inward from the rim, which he illustrates by
    drawing each main colour expanded back out to full saturation to show how much the soft grey
    light took away. He also gives a diagnostic for pastel: an overall pastel scene keeps its
    character by not containing black.
  answer_type: comparison
  difficulty: medium
  knowledge_type: colour
  requires_application: false
  support: >
    PASTEL, converted-PDF page 161, and MUTED, converted-PDF page 163, with the two cylinder
    diagrams on converted-PDF pages 162 and 164.
  confounders:
    - "treating both as desaturation, which is exactly the collapse Freeman corrects"
    - "assuming pastel means pale colours of any brightness, when he ties it to a specific level of the solid"
    - "supposing the no-black rule is a compositional principle, when it is a processing caution about the black-point control"

- qa_id: qa_pex_0019
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "DISTANT, converted-PDF page 113, and COMPRESSING, converted-PDF page 179"
  question: >
    Freeman gives two ways of relating a near element to a far one across a large gap, and they
    work in opposite directions. Compare them.
  answer: >
    Showing distance keeps the scale difference and makes the interval legible: a slightly raised
    viewpoint so the ground is visible continuously from foreground to subject, aerial perspective,
    and in his Big Bend frame a sky of towering clouds standing over the mountains. The viewer can
    measure the gap. Compression does the reverse — a very long lens from nearly end-on destroys
    the scale difference, so pedestrians along a bridge appear nearly the same size as each other,
    and figures on the far bank of the river appear nearly the same size as those on the bridge.
    That equalisation is what makes their relationship part of the composition. The cue that
    supports the first is the one the second removes.
  answer_type: comparison
  difficulty: hard
  knowledge_type: composition
  requires_application: false
  support: >
    DISTANT, converted-PDF page 113, and COMPRESSING, converted-PDF page 179, with the compression
    diagram on converted-PDF page 180, which was rendered and inspected.
  confounders:
    - "assuming a telephoto always flattens and a wide angle always shows depth, when Freeman's own qualification allows a telephoto frame with a strong sense of distance"
    - "treating compression as a distortion to be avoided rather than as a relating device"
    - "confusing the equalised sizes with the size-variation depth cue from his triangles case, which works the opposite way"

- qa_id: qa_pex_0020
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "STREAKING, converted-PDF page 146"
  question: >
    Freeman makes an asymmetry claim about two kinds of photographic unsharpness. What is it, and
    how confident is the claim?
  answer: >
    He says motion blur is one kind of photographic fuzziness that is thoroughly accepted by
    viewers and almost never rejected as some kind of mistake — and that the same cannot be said
    about out of focus. It is a claim about audience convention rather than about optics, and he
    offers no evidence for it. It also sits awkwardly beside his selective-focus case, where he
    argues that optical blur is read as a deliberate photographic statement because ordinary vision
    never produces it. He is similarly unwilling to give a rule for how much blur: asked whether
    there is a best shutter speed, he answers no, it is a matter of taste and of the balance you
    want between clear information and impression.
  answer_type: source_position
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    STREAKING, converted-PDF page 146, with the shutter-speed sequence and the two blur types on
    converted-PDF page 147, which was rendered and inspected.
  confounders:
    - "treating the acceptance claim as established rather than as an unsupported statement about viewers, which is period- and culture-bound"
    - "expecting a recommended shutter speed, which he explicitly declines to give"
    - "assuming he means all blur is acceptable, when his contrast is specifically between motion blur and defocus"

- qa_id: qa_pex_0021
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "PRECISION, converted-PDF page 108"
  question: >
    Where does Freeman rank exact alignment among the things going on in a frame, and what changes
    that ranking?
  answer: >
    He ranks it low. Most of the time, he says, there are more important things going on in front
    of the camera than exact alignments — things like expression, action and gesture. What changes
    the ranking is a particular kind of subject rather than a decision by the photographer: his
    word is "inevitably". A gate in a wall with an identical gateway directly beyond it can only be
    shot from the exact centre line, because from an angle the gateway skews and from any head-on
    position that shows the second gateway even a slight misalignment reads as sloppy. Nested or
    repeated identical geometry gives the viewer a perfect reference, so the error becomes directly
    visible instead of merely felt.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    PRECISION, converted-PDF page 108, with the two off-centre failures on converted-PDF page 109,
    which was rendered and inspected.
  confounders:
    - "the widespread assumption that careful alignment is generally a mark of good composition, which is the position Freeman contradicts for most photographs"
    - "reading the precision requirement as a preference of his, when he presents the subject as imposing it"
    - "confusing this with his four-square case, which is about a viewpoint and its meaning rather than about nested geometry"

- qa_id: qa_pex_0022
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "DEEP, converted-PDF page 117, and LAYERING, converted-PDF page 183"
  question: >
    Freeman argues for maximum sharpness in one case and declines available sharpness in another.
    What are the two, and what does the pair show about how he treats the control?
  answer: >
    In DEEP he places the camera as close as the depth of field at minimum aperture will just
    cover, and sets the focus plane slightly nearer than the middle of the range so it reaches both
    ends. In LAYERING he says he could have brought more of the mirror-mosaic pillar into focus,
    with a smaller aperture or with focus blending, and states plainly that this would have spoilt
    the merged overlaps of sky and stupas. He does not treat sharpness as a quantity to maximise
    but as a distribution to place — where in the frame the viewer is permitted to see clearly.
    That is why he can argue for ƒ/32 in one case and against a smaller aperture in another without
    contradicting himself.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    DEEP, converted-PDF page 117, and LAYERING, converted-PDF page 183, with the two-aperture
    comparison on converted-PDF page 184. Reading the two together as one stance is our synthesis;
    Freeman does not connect them.
  confounders:
    - "assuming more depth of field is generally better, which the layering case refuses"
    - "treating the layering refusal as a limitation of the equipment, when he names the alternatives and declines them"
    - "supposing this makes selective focus the answer, when the layering picture is not a selective-focus picture — the refusal is about how much of one plane is described"

- qa_id: qa_pex_0023
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "SILHOUETTE, converted-PDF page 188"
  question: >
    What technical capability does Freeman set his silhouette case against, and what general
    principle does he draw from the opposition?
  answer: >
    He sets it against shadow recovery. Advanced digital processing makes it possible to open up
    shadows and recover detail, which he grants is valuable for some images, but he says it has
    created a kind of obsession among some photographers for revealing everything in an image.
    Against that he states a general principle: sometimes you need to hold things back from the
    viewer in order to make the photograph more interesting. The silhouette is offered as one clear
    case where shadow detail is not wanted, since the picture relies entirely on two separated
    planes and on outline, and underexposure is what delivers it along with a rich saturated
    background.
  answer_type: source_position
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    SILHOUETTE, converted-PDF page 188. Note that the general principle is broader than the single
    case offered for it, and Freeman does not argue the wider claim.
  confounders:
    - "treating this as an exposure-technique item, when the argument is about what a photograph should withhold"
    - "assuming he opposes shadow recovery in general, when he says it is valuable for some images"
    - "reading the morning version of the same subject as a failure; he says the scene works in both lights and that dusk merely adds mystery"

- qa_id: qa_pex_0024
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_title: "Michael Freeman, The Photographer's Eye: A Graphic Guide (Focal Press, 2013), Parts 4-10"
  source_locator: "RHYTHM, converted-PDF pages 89 and 90"
  question: >
    Freeman tried two treatments of the same row of memorial arches. Which failed, which worked,
    and what did he say made the difference?
  answer: >
    The higher, more distant viewpoint — the one he calls part of the usual procedure — failed; he
    describes the result as uninspired. What worked was the opposite, taken the next morning: a
    closer viewpoint with a wide-angle lens, from lower, making use of the slight fog. His stated
    reason is that two kinds of perspective then combine, scale perspective from the wide lens and
    aerial perspective from the fog, and together they make a solid progression into the distance
    rather than a flat inventory of similar objects. The two frames also differ in weather, light
    and time of day, so viewpoint is not the only variable that changed.
  answer_type: comparison
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    RHYTHM, converted-PDF page 89, with the caption naming the two perspectives on converted-PDF
    page 90. The uncontrolled variables are our observation.
  confounders:
    - "assuming a distant elevated view is the natural way to show a repeating set, which is the treatment he rejects here even though he argues for high viewpoints elsewhere"
    - "crediting the wide-angle lens alone, when he names both perspectives working together"
    - "treating this as a controlled comparison; it is two photographs taken on different mornings"

