- sk_id: sk_pex_0046
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "the key to making spot color work as an image is framing"
    - "red is the most insistent and eye-catching of all colors"
    - "in black and white, the point is lost"
  concept_label: spot_colour_is_made_by_framing_and_desaturation_tests_whether_it_carries_the_frame
  label_origin: extractor_assigned
  claim: >
    Spot colour is defined as a single strong colour concentrated in a small area, dominating
    because the surroundings are drab, muted or at least consistent and different. The source says
    the key to making it work is framing, because the whole task is cutting out distractions and
    leaving one unit of colour against a relatively colourless background, and it names two
    framing moves — take a higher viewpoint, which removes the distance and the horizon, or crop
    in with a telephoto. It notes the situation is uncommon and getting rarer in cities, which it
    says are becoming more multi-coloured, so the potential has to be watched for. It then makes a
    claim about latitude: because red is the most insistent and eye-catching of all colours, the
    figure could be placed far off near a corner and the image still works. Finally it offers a
    test rather than an assertion — the same frame converted to greyscale, which it says shows
    that the composition needs the spot colour.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A single saturated area in an otherwise colourless field has no competitor for attention, so
      its salience does not depend on its size or on a central position.
  scope:
    domain_discussed_by_source: [still_photography_composition, still_photography_colour]
    conditions: >
      Requires a background that is consistently drab or of a single different colour. The source's
      own frame was widened by a pan-and-stitch specifically because more of the same grey
      background was available sideways.
  caveats:
    - text: >
        Rendering the page shows the source's middle diagram making a claim the prose only gestures
        at. Progressively less colourful versions of the figure are plotted at positions
        progressively nearer the centre, so placement latitude is drawn as a function of chromatic
        strength rather than stated as one. Reading it as a scale is ours; the source states only
        that red allowed a corner placement.
      origin: extractor_observed
    - text: >
        Rendering the greyscale version confirms the strength of the test — the figure does not
        merely weaken, it becomes very hard to find at all against the weir. The test is
        repeatable on any frame and is one of the few genuinely portable diagnostics in this span.
      origin: extractor_observed
    - text: >
        "Red is the most insistent and eye-catching of all colors" is asserted without support and
        is a claim about human vision.
      origin: extractor_observed
  source_stated_problems: ["it's all about cutting out the distractions"]
  source_stated_remedies: ["finding a higher viewpoint", "cropping in with a telephoto"]
