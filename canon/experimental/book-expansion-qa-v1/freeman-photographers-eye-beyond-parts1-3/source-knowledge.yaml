- sk_id: sk_pex_0054
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "“declared” composites in that they don't pretend to be single, unadulterated photographs"
    - "the viewer understands that they are separate, but at the same time they appear to make a whole"
    - "dodgier on the ethics front"
  concept_label: a_declared_composite_is_a_different_object_and_a_collage_needs_edge_fit_and_a_shared_premise
  label_origin: extractor_assigned
  claim: >
    The source separates combined images by what they admit to being. A declared composite does
    not pretend to be a single unadulterated photograph, and the source says the images in this
    part are all declared — "except one, possibly." Undeclared compositing it treats as a separate
    class, describing one of its own as dodgier on the ethics front because it sets out to fool
    the viewer, though with the aim of entertaining and exploring. Its framing of the dispute is
    about intent rather than about technique: it asks whether the photographer is trying to fool
    people, and then whether the intention is pure, by which it means art, or impure, by which it
    means making money or delivering an image it failed to get in one shot. It declines to settle
    the argument, saying you could go on forever and it is not likely to be rewarding. For the
    collage specifically it names two conditions for coherence: the images are separated by clear
    straight edges but positioned so certain edges fit neatly against others, and the selection
    must have something in common, which is why the viewer accepts them as grouped. It also notes
    a wholly unromantic reason for compositing at all — objects in different locations, at
    different sizes, or too unwieldy to move, where the alternative was scaffolding and another
    day or two of work.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A viewer who understands the pieces are separate can still read them as a whole, provided
      the edges align and the selection has an evident common premise; the declaration removes the
      question of deception without removing the unity.
  scope:
    domain_discussed_by_source: [still_photography_composition, photo_illustration]
    conditions: >
      The source notes compositing predates digital tools — its Star Wars props composite was made
      entirely in camera in 1990, before Photoshop — so the ethical question is not a consequence
      of the software.
  caveats:
    - text: >
        This is the source's own position, hedged and deliberately unresolved. It should not be
        reported as a rule about what is permissible, and the source refuses to make it one.
      origin: source_stated
    - text: >
        The layer-mode and brush procedures the source gives for building these images are
        software steps and are refused by this lane. Only the conditions for coherence and the
        stance on declaration are extracted.
      origin: extractor_observed
  source_stated_problems: ["is the photographer trying to fool people into believing that the image hasn't been manipulated?"]
  source_stated_remedies: ["positioning them so that certain edges fit neatly against others"]
  examples:
