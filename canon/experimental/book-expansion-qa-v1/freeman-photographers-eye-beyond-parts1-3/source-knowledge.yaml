- sk_id: sk_pex_0029
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "pulling together the different scales of a scene into one image"
    - "focal length and aperture are only tools for helping with the idea of deep"
  concept_label: deep_needs_two_scales_and_a_focus_plane_placed_nearer_than_the_middle
  label_origin: extractor_assigned
  claim: >
    The source demotes aperture and focal length to tools and puts the compositional idea first —
    "deep" means pulling the different scales of a scene into one image, from a bas-relief texture
    inches from the lens to galleries receding through a far gateway. What that requires is
    suitable close and distant subjects existing together, which means finding an exact camera
    position, then placing the camera as close as the depth of field at minimum aperture can just
    cover. And it places the focus plane deliberately off-centre in the range — not in the middle
    but slightly nearer the camera.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A wider angle gives a better chance of everything being pin-sharp at a small aperture; the
      depth of field is not symmetrical about the focus plane, so setting focus nearer than the
      midpoint is what makes the available depth cover both extremes.
  scope:
    domain_discussed_by_source: [still_photography_composition, still_photography_optics]
    conditions: >
      Requires a scene that actually contains two usable scales. The source is explicit that the
      physical limit is real and gets worse as magnification rises — the closer to macro, the
      less depth of field is available, and beyond a point it "can't be had by normal means."
  caveats:
    - text: >
        The source's answer to the physical limit is focus stacking — a software step, and refused
        by this lane as a post-processing procedure. Only the statement of the limit is extracted.
      origin: extractor_observed
    - text: >
        Rendering the page confirms the diagram places the focus plane about a third of the way
        into the scene and shows two shaded bands, the wide-aperture band covering neither the
        foreground nor the background. The proportion is the diagram's, not the prose's — the text
        says only "slightly nearer to the camera."
      origin: extractor_observed
  source_stated_problems: ["the laws of physics set limits to the depth of field possible with any particular lens"]
  source_stated_remedies: ["positioning the camera as close as possible for the depth of field at minimum aperture to just cover the range"]
