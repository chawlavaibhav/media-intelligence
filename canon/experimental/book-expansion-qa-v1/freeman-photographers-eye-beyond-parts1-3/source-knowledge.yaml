- sk_id: sk_pex_0055
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "mountain-water"
    - "express the essence of the landscape, not an image of what can be seen"
    - "we also need a varied visual diet"
  concept_label: a_vertical_stack_toward_a_peak_is_a_form_from_outside_the_western_canon
  label_origin: extractor_assigned
  claim: >
    The source imports a compositional grammar from a tradition unlike the rest of the book. The
    Chinese vertical scroll it calls mountain-water differs from Western imagery in two ways it
    names: long and vertical is not part of the European painting canon, and the aim is to express
    the essence of the landscape rather than an image of what can be seen. The method it reports
    is to combine elements from the landscape in general and stack them vertically, almost always
    leading to an upper peak. Attempting the form photographically it accepts that the resulting
    view is impossible, and claims that like a mountain-water painting it shows more of the
    essence of the gorge than a single image could. Alongside this the source gives a set-level
    reason for varying treatment at all: every picture in one of its books was a bowl of noodles,
    and just as no one wants to eat noodles continuously, a body of work needs a varied visual
    diet — which is why one image in it is deliberately made as illustration rather than as
    photograph.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A vertical stack accumulating toward a peak carries the character of a landscape rather than
      a view of it, because it is assembled from what the place contains rather than from what one
      position can see.
  scope:
    domain_discussed_by_source: [still_photography_composition, photo_illustration, photo_essay]
    conditions: >
      The source built its version from images taken within an hour or two's drive up and down one
      gorge, so the elements come from a single place even though no single viewpoint could see
      them together.
  caveats:
    - text: >
        The account of Chinese painting is a photographer's summary of another tradition and is
        offered without sources. Treat it as this source's understanding of the form, not as art
        history.
      origin: extractor_observed
    - text: >
        The essence claim is unfalsifiable as stated and the source presents it as its own
        judgement of its own picture.
      origin: extractor_observed
    - text: >
        The varied-diet argument is about a book, not about a frame. Its observation unit is a body
        of work over time and it has no meaning applied to a single image.
      origin: extractor_observed
  source_stated_problems: ["there are just so many ways to photograph noodle dishes and still show all the ingredients"]
  source_stated_remedies: ["built it upward, using images taken from within an hour or two's drive up and down the gorge"]
