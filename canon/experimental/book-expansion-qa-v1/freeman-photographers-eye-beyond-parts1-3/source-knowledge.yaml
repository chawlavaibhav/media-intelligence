    The source treats lens vignetting as a compositional device rather than a defect. Its claim is
    specific: vignetting is a darkening away from the centre, and because the eye tends toward
    brighter areas, it concentrates attention toward the centre. It names the effect on attention
    as separate from and more important than the effect on brightness, and it notes the conflict
