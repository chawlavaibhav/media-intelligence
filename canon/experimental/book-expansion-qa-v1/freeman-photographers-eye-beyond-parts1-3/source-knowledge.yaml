  concept_label: juxtaposition_puts_idea_first_and_the_implied_connection_is_usually_false
  label_origin: extractor_assigned
  claim: >
    The source sets out an explicit ordering for juxtaposition. It adds depth of two kinds, idea
    and graphic form, often only one and occasionally both. Graphic coincidence can be arranged
    and the source says it strengthens the case, but it is subordinate — "ultimately it's still
    all about idea." The mechanism it describes is a suggestion rather than a fact: placing one
    subject in front of another implies a connection, and the source states that often, and maybe
    even usually, no such connection exists in reality. It does not treat this as a problem. It
    calls the technique totally open to abuse and says that is good, because the openness is what
    admits the whole range of possible ideas. It also names who does and does not see the
    connection: in its worked case the participants are unaware, and only the photographer can see
    or suggest the link, through where they stand, the framing and the lens.
