- sk_id: sk_pex_0006
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "two coincidental curves beyond the obvious"
    - "the active part of the frame, where the curves cross over each other"
  concept_label: a_curve_earns_the_frame_when_it_crosses_another_curve
  label_origin: extractor_assigned
  claim: >
    The source says a curve is not worth the shot on its own — it "means doing something with them
    in the frame and not just settling for a straightforward shot." What made its Dinka cattle
    camp picture work was not the obvious curved horns but two further curves coinciding with
    them: the momentary curve of a man raising his arm to his head, and the point where that
    intersects the outline of a foreground bull. The source's own diagram labels the region where
    the curves cross as "the active part of the frame."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [still_photography_composition, reportage]
    conditions: >
      A scene already rich in one curve family. The source notes the subject supplied the curves
      culturally — the Dinka's cattle have deliberately shaped horns — so the raw material was
      not accidental.
  caveats:
    - text: >
        The source declines to explain why people respond to curves — "without getting into the
        psychology of curves" — while still asserting that they do, and that some curves make
        people smile.
      origin: source_stated
    - text: >
        The intersection claim is carried by the diagram, not by the prose. Rendering the page
        confirms the diagram traces curve directions with arrows and marks the crossing region;
        the prose only says the illustration "better explains why I think the image works."
      origin: extractor_observed
  source_stated_problems: ["settling for a straightforward shot"]
  source_stated_remedies: ["doing something with them in the frame"]
  examples:
