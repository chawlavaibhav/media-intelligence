- sk_id: sk_pex_0051
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "a stack of upright planes, like a pack of cards"
    - "the haze and backlighting hide the details in each plane and help to make them two-dimensional"
    - "each outcrop appears as a two-dimensional cut-out"
  concept_label: stacking_needs_height_and_haze_as_well_as_focal_length_and_detail_loss_makes_the_planes
  label_origin: extractor_assigned
  claim: >
    The stack-of-planes effect is presented as a conjunction of conditions, not as a lens result.
    The source lists them: a long telephoto for the compression, which makes the receding
    formations seem almost equal in size; a viewpoint high enough to see over each intervening
    spur; and haze with backlighting to hide the detail inside each plane. That last one carries
    the mechanism. Because the haze removes internal modelling, each outcrop reads as a flat
    cut-out, and depth is then read from the ordering of flat shapes rather than from any
    three-dimensional description of them. The source treats the whole thing as opportunistic —
    it says the abstracted result is not often possible with landscapes and is a welcome
    opportunity when it comes. It also names the cost: everything must be in focus, which on a
    long telephoto meant ƒ/32, a slow shutter speed, and the risk of movement from mirror slap.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Aerial haze and backlighting suppress the tonal variation within each land form, so nothing
      inside a plane suggests volume; the only remaining depth information is which flat shape
      occludes which, plus the graded aerial contrast between them.
  scope:
    domain_discussed_by_source: [still_photography_composition, landscape_photography]
    conditions: >
      Requires terrain that supplies overlapping planes — here successive bends in a gorge — plus
      atmospheric conditions and a high enough viewpoint. All three are found, not made.
  caveats:
    - text: >
        Two of the conditions pull against each other in the same frame. The source demands that
        everything be sharp, and simultaneously depends on the haze removing detail. Sharpness of
        edge and loss of internal description are both required, and the source does not remark on
        the tension.
      origin: extractor_observed
    - text: >
        This is the source's most striking depth claim and it is the reverse of the usual one.
        Depth here is produced by taking information away, not by adding cues.
      origin: extractor_observed
  source_stated_problems: ["long telephotos need special care for this", "the risk of movement from mirror slap"]
  source_stated_remedies: ["the viewpoint is high enough to see over each high rocky spur", "a very small aperture—ƒ/32"]
  examples:
