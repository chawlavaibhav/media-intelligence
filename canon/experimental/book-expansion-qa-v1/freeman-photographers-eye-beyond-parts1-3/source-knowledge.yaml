- sk_id: sk_pex_0009
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "implied triangles"
    - "even if just thrown down, they connect in the eye"
  concept_label: any_three_prominent_points_are_read_as_a_triangle
  label_origin: extractor_assigned
  claim: >
    The source holds that implied triangles are the most frequent shapes in imagery for a purely
    structural reason — they occur wherever there are any three prominent points, whether or not
    anything triangular is present. Its demonstration is three Mao badges thrown down at random,
    which it says connect in the eye regardless.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Three distinct points are sufficient; the eye supplies the connecting sides. Nothing about
      the objects need be triangular.
  scope:
    domain_discussed_by_source: [still_photography_composition]
    conditions: >
      Requires the three elements to be distinct — separable from each other and from the ground.
      The source says nothing about what happens with four or more.
  caveats:
    - text: >
        It follows from this that a triangle is almost never absent, which makes "there is a
        triangle here" a weak observation. The source implicitly concedes this by ruling that an
        implied shape only earns the shot when it is unpredictable.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "three Mao badges connected by drawn links; a real momentary triangle made by a bather's cloth, doubled by his outstretched arms", figure_ref: "converted-PDF page 86"}
    counter: []
  intra_source_relations:
    - {relation: qualified_by, target: sk_pex_0011, note: "frequency is exactly why the shape alone does not justify the frame"}
    - {relation: generalises, target: sk_pex_0010, note: "the size-variant case adds a depth reading to the same three points"}
