  claim: >
    Where the setting is graphic and already chosen, the source converts the moment problem into a
    spatial one before the subject arrives. It says to plan one or two specific gaps in the
    composition where a passing figure would be caught, and it states the hard constraint that
    makes those gaps narrow: the figure cannot be allowed to cross over any graphic line. In its
