- sk_id: sk_pex_0001
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "graphics"
    - "a graphic photograph"
  concept_label: graphics_are_read_into_a_photograph_rather_than_present_in_it
  label_origin: extractor_assigned
  claim: >
    Lines and shapes are, in the source's view, strictly the property of artwork and illustration.
    What a photograph contains are edges and contrast, plus whatever associations the viewer's eye
    and mind supply; the line or shape is something the viewer constructs from those. A "graphic
    photograph" is therefore one in which those constructed lines and shapes play a strong part,
    often stronger than the subject itself, and the source says that by no means all photographs
    have them — which is part of their appeal when they do.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Graphics in a photograph are the result of edges, contrast, and the associations the eye and
      mind make. They depend on the photographer to find and exploit, because they are not given.
  scope:
    domain_discussed_by_source: [still_photography_composition]
    conditions: >
      Stated as the framing premise for the whole of the source's Graphics part, before any case.
  caveats:
    - text: >
        The source treats "we think we see as lines and shapes" as self-evident and offers no
        account of why the eye completes them.
      origin: extractor_observed
  source_stated_problems: ["by no means all photographs have them"]
  source_stated_remedies: ["they depend on the photographer to find and exploit"]
  examples:
    positive: []
    counter: []
  intra_source_relations:
