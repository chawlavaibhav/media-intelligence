- sk_id: sk_pex_0008
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "the curved outline of the foreground bull"
  concept_label: reducing_a_frame_to_flat_tonal_masses_tests_a_shape_claim
  label_origin: extractor_assigned
  claim: >
    The source's method for demonstrating a shape claim is to redraw the photograph as three or
    four flat tonal masses with all texture and detail removed, and show that the claimed shape
    survives the reduction. It does not say this is a test; it performs it. Read as a method, it
    is a check: if a claimed line or shape disappears when the frame is posterised to a handful of
    flat tones, the shape was in the description rather than in the image.
  claim_type: source_interpretation
  interpretation_basis: >
    The reduction diagram is the source's, and it is the second illustration on the CURVES spread.
    Reading it as a general diagnostic procedure rather than as one illustration of one picture is
    ours. The source never proposes it as a test, and it uses the device unevenly across the part.
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [still_photography_composition]
    conditions: >
      Applies to claims about line, shape and mass. It says nothing about colour, focus or motion
      claims, which the source demonstrates by other means.
  caveats:
    - text: >
        This is our reading of the source's illustration technique, and the technique is not used
        consistently — several shape cases in the same part are illustrated with arrows over the
        unmodified photograph instead.
      origin: extractor_observed
    - text: >
        The reduction is hand-made by the author, so it already encodes what he believes the
        shapes to be. It cannot falsify his own reading; it can only communicate it.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "the cattle-camp photograph redrawn in four flat greys, in which the bull's outline and the horn curves are the only surviving structure", figure_ref: "converted-PDF page 83"}
    counter: []
  intra_source_relations:
