- sk_id: sk_pex_0044
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "the answer does not lie in the actual color scheme, but in our own value judgment"
    - "if you're in the mood for color pizzazz, then it's drab; if you feel like restraint, it's muted"
    - "they quickly become too much for comfort"
  concept_label: muted_and_drab_are_the_same_image_told_apart_only_by_the_viewers_mood
  label_origin: extractor_assigned
  claim: >
    The source asks itself what distinguishes muted from drab and answers that nothing in the
    image does. The difference lies not in the actual colour scheme but in the viewer's own value
    judgement — in the mood for colour, the same picture is drab; in the mood for restraint, it is
    muted. It supplies the reason muted exists at all in the same breath: rich colours give plenty
    to react to and for exactly that reason quickly become too much for comfort, so visual
    excitement works best as part of a balanced diet. Muted is therefore defined against a
    condition of the audience rather than against a property of the frame. The source is also
    careful to separate muted from pastel: pastel is a move toward brightness, not toward
    desaturation, and it notes that in a pastel scene the greens and browns keep their
    colourfulness while a pastel picture keeps its character by containing no black at all.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Strong colour is a sensory load; the same load is welcome or oppressive depending on the
      viewer's appetite at the time, and no property of the image resolves which.
  scope:
    domain_discussed_by_source: [still_photography_colour]
    conditions: >
      The source's muted example is a subject whose restraint is doctrinal — Shaker design, whose
      religious principle is simplicity and the avoidance of anything decorative — and it says the
      soft raining light was what made the treatment work. Subject and light are doing work that
      the colour classification alone does not.
  caveats:
    - text: >
        This is the sharpest epistemic statement in the colour part and it undercuts the rest of
        it. A named colour quality with no image-side definition cannot be detected in a frame,
        only reported by a viewer.
      origin: extractor_observed
    - text: >
        The no-black diagnostic for pastel is stated with an exclamation mark and no test. It is
        offered as a caution against reaching for the black-point slider, which is a processing
        note, not a compositional one.
      origin: extractor_observed
  source_stated_problems: ["they quickly become too much for comfort", "not to reach without thinking for the black-point slider"]
  source_stated_remedies: []
