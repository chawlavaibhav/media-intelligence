- sk_id: sk_pex_0027
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "an important difference between being far away from something and showing distance"
    - "a set of visual clues that show the viewer the distance between us and the subject"
  concept_label: showing_distance_is_not_the_same_as_being_far_away
  label_origin: extractor_assigned
  claim: >
    The source separates two things routinely conflated. A telephoto lens deals with a far subject
    by bringing it closer in the frame and letting it be seen in more detail — a functional
    solution to being far away. What that can lose is any sense of distance, which the source says
    depends not on the lens but on a set of visual clues: ground visible continuously from the
    foreground to the subject, a slightly raised viewpoint that lets that ground be seen, aerial
    perspective, and here a sky of towering clouds that shows distance by standing over the
    mountains. It then qualifies itself — some telephoto shots do carry strong distance, when the
    viewpoint is high enough to see mountains arranged one behind another with haze at work — and
    concludes "it doesn't depend so much on the lens."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Distance is inferred from a chain of intervening evidence. If the frame shows the whole
      ground between camera and subject, and shows atmosphere accumulating across it, the viewer
      can measure the gap; if the frame shows only the subject enlarged, there is nothing to
      measure against.
  scope:
    domain_discussed_by_source: [still_photography_composition, landscape_photography]
    conditions: >
      The source's own frame is a wide-angle one (21mm equivalent on large format) from a slightly
      raised viewpoint with a lot of sky. Its qualification covers the telephoto case, so the
      claim is about cues and not about focal length either way.
  caveats:
    - text: >
        The cue list is given as an account of one photograph rather than as an enumeration. It is
        not claimed to be complete and no cue is said to be necessary.
      origin: extractor_observed
  source_stated_problems: ["what may be missing from the equation is a sense of distance"]
  source_stated_remedies: ["the viewpoint is slightly raised so that we can see from the foreground all the way to the mountains", "taking in a lot of sky"]
