  label_origin: extractor_assigned
  claim: >
    The source makes a claim about a composition carrying a meaning independently of the
    photographer's intent. Taking tableau from painting and theatre — strictly a group of figures
    formally arranged to represent a historical scene, more loosely a set piece caught at a good
    moment — it observes that one particular tableau has become so iconic that almost any
    squared-up image of a long table with people talking at it evokes some association with it.
    Its own picture is simply lunch among friends and the source says explicitly that it is
    neither a reference to that painting nor an imitation of it. The association operates anyway.
    Separately, the source names where the picture is actually carried: the key to the shot is the
    contrast between the two furthest figures, far left and far right — the ends of a wide frame,
    not its centre.
