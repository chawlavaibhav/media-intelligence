- sk_id: sk_pex_0045
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "a color theme covers a number of images"
    - "photographers have to work with what is in front of them"
    - "the color palettes associated with places and with styles"
  concept_label: a_colour_theme_is_a_property_of_a_set_and_a_palette_is_found_rather_than_chosen
  label_origin: extractor_assigned
  claim: >
    The source moves the unit of observation from the frame to the body of work. A colour theme,
    it says, covers a number of images and works well for a picture story because it holds them
    together and gives them unity — so it is a property of a set, not of a picture. It also
    removes the requirement of intent: the theme need not be planned, since it can simply be
    selected from what has already been shot. It then borrows palette from painting and marks the
    difference the borrowing conceals: for a painter the palette is an entirely personal decision,
    while a photographer has to work with what is in front of them, with processing able only to
    bend the situation. Its worked example treats a palette as a property of a place — New Mexico's
    earthen yellows, ochres and tans set against blue-greens — and it tests the claim on a street
    photograph, reporting the result as an opinion.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Colours from one zone of the hue circle read as belonging together, so a run of images drawn
      from the same zone reads as a single body rather than as separate pictures.
  scope:
    domain_discussed_by_source: [still_photography_colour, photo_essay]
    conditions: >
      The theme example is a two-week assignment in which the source realised after the fact that
      the community lived within a certain range of colours. The claim is about a coherent
      assignment or story, not about arbitrary collections.
  caveats:
