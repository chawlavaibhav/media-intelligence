- sk_id: sk_pex_0032
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "the Scheimpflug Principle"
    - "counter-focus, though that's just my term for it"
    - "the exact opposite of the way these cameras were designed to be used"
  concept_label: tilting_the_lens_reorients_the_sharp_plane_and_reversing_the_tilt_maximises_selectivity
  label_origin: extractor_assigned
  claim: >
    The source's reason for tilt is that what needs to be sharp is often not perpendicular to the
    sensor — objects on a table, a flat landscape — so the plane of sharp focus should be steered
    rather than merely moved nearer or farther. Under the Scheimpflug Principle the lens plane,
    the sensor plane and the plane of sharp focus must all meet at one line, so tilting the lens
    forward tilts the sharp plane away and turns the depth of field into a wedge. The source then
    reverses the same instrument for the opposite purpose, under a term it says is its own:
    counter-focus, tilting back against a scene that tilts forward, which it claims gives the most
    extreme selective focus possible with the aperture wide open. It notes this is the exact
    opposite of what the equipment was designed for.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Where the lens plane meets the sensor plane is where the plane of sharp focus must also
      meet, so the sharp plane's angle is a consequence of the tilt and the depth of field becomes
      wedge-shaped rather than slab-shaped.
  scope:
    domain_discussed_by_source: [still_photography_optics, still_life_photography, architectural_photography]
    conditions: >
      Requires a camera whose lens and sensor planes can move independently — historically a
      large-format view camera, now a small number of tilt lenses for DSLRs. The counter-focus
      example was made on 4x5-inch film with both standards moved, and the source says the
      principle works either way.
  caveats:
    - text: >
        The counter-focus name and use are the source's own invention, flagged as such. It is a
        practitioner coinage, not established terminology.
      origin: source_stated
    - text: >
        The whole case is carried by the illustrations. Rendering the page confirms the diagram
        draws three coloured lines — lens plane, sensor plane, focus plane — parallel in the
        un-tilted state and converging at a single lower-right point in the tilted state. That
        convergence is the entire principle and it is nowhere drawn in the running text.
      origin: extractor_observed
  source_stated_problems: ["what you may want sharp in the image isn't necessarily from near to far at a perpendicular angle to the sensor"]
  source_stated_remedies: ["tilt either the lens or the back", "tilt back on a scene that is tilting forward"]
  examples:
    positive:
      - {description: "a tower shell at maximum aperture shown un-tilted and tilted, with the three-plane geometry drawn over a studio setup", figure_ref: "converted-PDF page 130"}
      - {description: "a scriptorium desk with a standard lens tilted right back and the film back tilted forward, sharp on only a few letters and a hand", figure_ref: "converted-PDF page 132"}
