  concept_label: compression_equalises_apparent_scale_and_the_source_admits_its_own_taxonomy_is_arbitrary
  label_origin: extractor_assigned
  claim: >
    Compression is presented as a way of relating things at different distances by removing the
    scale difference between them. A very long telephoto — the source used 600mm — shot from near
    end-on makes a bridge appear steeper than it is and makes pedestrians along its length appear
    nearly the same size as each other. The compositional payoff the source names is that figures
    on the far bank of the river then read at nearly the same size as those on the bridge, and the
    relationship between the two groups becomes an important part of the image. The source opens
    the case by saying it could as easily have placed it in the optics part, which is an explicit
    admission that its own chapter boundaries are organisational rather than principled.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      From a great distance the ratio of the distances to near and far elements approaches one, so
      their apparent sizes converge and the depth between them stops being readable as size.
  scope:
    domain_discussed_by_source: [still_photography_composition, still_photography_optics]
    conditions: >
      The source states a positional precondition — "you have to be nearly end-on for this to
      work" — and says the longer the focal length the better.
  caveats:
    - text: >
        Rendering the diagram confirms it carries two claims the text separates. A three-step
        sequence shows the arc apparently flattening and the ends drawing in as focal length rises
        and the camera retreats; a second, exploded rendering separates the pedestrian mass from
        the bridge structure and shows both tilted toward the camera. The tilting is a consequence
        the prose does not state.
