- sk_id: sk_pex_0005
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "entirely a creation of the camera angle and lens"
    - "diagonally counter to the light shafts"
    - "rotating around the Z-axis"
  concept_label: diagonals_are_a_camera_product_and_their_energy_comes_from_counter_diagonals
  label_origin: extractor_assigned
  claim: >
    The source says the diagonals in its St Peter's interior are entirely a creation of camera
    angle and lens, not of the building — they come into play when the camera is angled up or
    down, tilted, or the viewpoint shifted, especially on a wide-angle lens. And the energy is
    attributed not to diagonality but to opposition: rotating the camera around its viewing axis
    turns every vertical in the scene into a diagonal running counter to the diagonal shafts of
    sunlight, and it is that counter-running that the source credits.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Angling the camera makes all the scene's verticals diagonally counter to the light shafts,
      and this opposition brings a different kind of energy to the shot.
  scope:
    domain_discussed_by_source: [still_photography_composition, architectural_photography]
    conditions: >
      A scene that already contains one strong directional set — here the light shafts — and a
      body of orthogonal structure that rotation can convert into a counter-set.
  caveats:
    - text: >
        The source gives its own counterfactual and it is a mixed result, not a win. Levelled, the
        shafts of light would have been longer; the image would have been less dynamic and more
        rigidly architectural. Something is lost as well as gained.
      origin: source_stated
    - text: >
        "Diagonals carry the eye along them, up or down, and generally enliven things" is asserted
        without mechanism and inherits the unexplained direction-character assumption.
      origin: extractor_observed
  source_stated_problems: ["less dynamic, more rigidly architectural"]
  source_stated_remedies: ["angle the camera up, down, tilt it, or shift the viewpoint"]
  examples:
    positive:
      - {description: "St Peter's Basilica, camera rotated so verticals run counter to the sunlight shafts", figure_ref: "converted-PDF page 81"}
    counter:
      - {description: "the un-tilted version, described by the source as more formal and less energetic", figure_ref: "converted-PDF page 80"}
  intra_source_relations:
    - {relation: specialises, target: sk_pex_0002, note: "one direction-character claim worked out in a case"}
    - {relation: trades_off_with, target: sk_pex_0021, note: "the four-square viewpoint is the deliberate refusal of this move"}
