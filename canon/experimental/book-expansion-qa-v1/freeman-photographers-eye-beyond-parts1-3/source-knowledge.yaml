  concept_label: rhythm_dies_in_the_distant_elevated_view_and_lives_in_the_close_wide_one
  label_origin: extractor_assigned
  claim: >
    Faced with a repeating subject, the source tried the obvious treatment first — higher, more
    distant, taking in the whole set — and reports the result as uninspired. What worked was the
    opposite: closer, wide-angle, from lower, with slight fog. Its stated reason is that two kinds
    of perspective then combine, scale perspective from the wide lens and aerial perspective from
    the fog, and together they make a solid progression into the distance rather than a flat
    inventory of similar objects.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A distant elevated view renders the repeated elements at similar sizes and similar
      contrast, which is repetition. Getting close with a wide lens grades their size, and haze
      grades their contrast; the two gradients together read as progression.
  scope:
    domain_discussed_by_source: [still_photography_composition, architectural_photography]
    conditions: >
      Requires atmospheric conditions the source did not control — it waited until the next
      morning for the fog. Its own account makes the result partly a matter of weather.
  caveats:
    - text: >
        This is a two-image comparison the source made itself, not a controlled test. The two
        frames also differ in light, time of day and weather, so the viewpoint is not the only
        variable that changed.
      origin: extractor_observed
  source_stated_problems: ["the result is uninspired"]
  source_stated_remedies: ["a closer viewpoint with a wide-angle lens", "making use of the slight fog to enhance the scale of distance"]
  examples:
