- sk_id: sk_pex_0003
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "to keep it graphically simple"
    - "so that the vertical lines would dominate"
  concept_label: a_graphic_reading_is_produced_by_subtraction_and_by_raised_contrast
  label_origin: extractor_assigned
  claim: >
    Where the source wants lines to dominate an image, it works by removing everything that
    competes and by pushing tonal contrast up rather than balancing it. In the horizontal-lines
    case it cropped tightly with a telephoto to exclude the sky. In the vertical-lines case it
    says plainly that it was "far from wanting to balance tones" and actively wanted strong
    contrast, then processed for contrast and cropped away a window at the left and lit grass
    below, shaving the frame top and bottom. Both moves are subtractive.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Contrast is what separates a line from its surroundings sufficiently for the eye to read it
      as a line rather than as a boundary between two similar tones; anything else in the frame
      competes for the same attention, so it is removed.
  scope:
    domain_discussed_by_source: [still_photography_composition]
    conditions: >
      Both cases are ones where the source decided in advance that the image was about the lines
      rather than about the subject. The vertical-lines shot began as an architecture picture and
      was redirected mid-shoot.
  caveats:
    - text: >
        "Far from wanting to balance tones" is stated against a default the source assumes the
        reader holds. It is a reversal of a norm, not a general rule.
      origin: extractor_observed
    - text: >
        The source offers a further post-production step — distorting the roof ridge from diagonal
        to horizontal to permit a tighter crop — conditionally, prefaced with "if you don't mind
        altering the geometry in post-production." It is offered, not recommended.
      origin: source_stated
  source_stated_problems: ["slight distractions left and below", "anything that would distract from the verticals"]
  source_stated_remedies: ["cropping tightly with a telephoto lens", "processed for contrast", "shaved the frame at top and bottom"]
  examples:
    positive:
      - {description: "silhouetted horizontal branches read as a ladder over the falls, sky excluded", figure_ref: "converted-PDF page 74"}
      - {description: "Icelandic planking and picket fence at maximum contrast, uncropped original shown for comparison", figure_ref: "converted-PDF page 77"}
    counter:
      - {description: "the uncropped original frame, with the window and lit grass still present", figure_ref: "converted-PDF page 77"}
  intra_source_relations:
    - {relation: trades_off_with, target: sk_pex_0004, note: "the subtraction in the horizontal-lines case cost motion sharpness"}
    - {relation: depends_on, target: sk_pex_0001, note: "you can only strip a frame down to lines if lines are what the eye is completing"}
  evidence:
