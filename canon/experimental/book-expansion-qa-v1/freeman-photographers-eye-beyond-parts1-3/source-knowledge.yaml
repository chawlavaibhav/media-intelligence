  concept_label: each_line_direction_plays_a_different_game_with_the_eye
  label_origin: source_verbatim
  claim: >
    The source holds that line direction and line character are not interchangeable: a pronounced
    curve plays a different game with the eye than a straight line does, and a vertical line gives
    a different sensation from a horizontal one. It presents this as the reason the Graphics part
    is split by line type at all, and it states it without explaining it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [still_photography_composition]
    conditions: >
      Asserted at part level. The individual cases give the source's character readings —
      diagonals as movement and energy, curves as free-form flow, verticals as crisp contrast —
      but no case supplies a perceptual account of why.
  caveats:
