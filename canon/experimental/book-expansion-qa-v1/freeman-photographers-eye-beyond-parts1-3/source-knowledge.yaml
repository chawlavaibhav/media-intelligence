- sk_id: sk_pex_0010
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "the eye puts them into perspective—literally"
    - "if the objects look similar but vary in size, it suggests depth and perspective"
  concept_label: unequal_size_among_similar_elements_turns_an_implied_shape_into_depth
  label_origin: extractor_assigned
  claim: >
    The source claims that when three similar-looking elements differ in size, the eye stops
    reading them as a flat triangle and reads them as a receding arrangement instead — the size
    difference is taken as distance. The same three points therefore produce either a flat shape
    or a depth cue depending on whether the elements match in size.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Similarity of kind licenses the assumption that the objects are the same real size, so any
      difference in apparent size can only be distance.
  scope:
    domain_discussed_by_source: [still_photography_composition]
    conditions: >
      Requires that the elements be recognisably of a kind. Where the objects are plainly
      different things, the source does not claim the reading holds.
  caveats:
    - text: >
        Rendering the page confirms the second diagram draws the connecting links as tapering
        three-dimensional rods rather than flat lines, so the illustration is itself asserting the
        depth reading rather than letting the size difference alone produce it. The strength of
        the demonstration is weaker than it appears.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "the same three Mao badges shown at equal size and then at graded sizes, the second reading as recession", figure_ref: "converted-PDF page 86"}
    counter: []
  intra_source_relations:
    - {relation: specialises, target: sk_pex_0009, note: "the same three-point structure with one variable changed"}
    - {relation: demonstrated_together_with, target: sk_pex_0051, note: "the stacking case reads depth from a different single cue"}
