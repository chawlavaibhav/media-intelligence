- sk_id: sk_pex_0043
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "a cylinder of hue, saturation and brightness"
    - "close to the outer rim at this level"
    - "whatever is directly across the circle has the strongest color contrast"
  concept_label: the_named_colour_looks_are_regions_of_one_hue_saturation_brightness_solid
  label_origin: extractor_assigned
  claim: >
    The source's colour part is not seven separate treatments but one coordinate system used seven
    times. It builds a cylinder — hue running radially like spokes of a wheel, saturation
    increasing from the centre outwards, brightness from dark at the top to bright at the bottom —
    and then locates each named look as a region of that solid. Rich is close to the outer rim at
    a medium-dark level. Pastel is a slice lower down, where the colours are whiter. Muted sits
    inward from the rim. A theme is one wedge of the circle, and the inner, less saturated part of
    it. Contrast is opposite wedges. The consequence the source draws explicitly for contrast is
    that what counts as different for perception is hue alone — not dark against light, and not
    grey against saturated — so orange against blue, red against green and yellow against violet
    are the strongest oppositions, which are also the complementary pairs.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Hue, saturation and brightness are the three qualities by which the eye and brain naturally
      sort colour, so a solid built on those three axes lets any colour relationship be stated as
      a position or a distance rather than as a name.
  scope:
    domain_discussed_by_source: [still_photography_colour]
    conditions: >
      The source restricts itself to "seven of what I think are the most distinct kinds of color
      relationships in photography" and presents the set as its own selection, not an exhaustive
      taxonomy.
  caveats:
    - text: >
        The complementary-pair claim is the one place in this span where the source offers the
        reader something to run rather than something to accept — stare at orange against white
        for a minute, then look at the white and see blue. That is an invitation to a perceptual
        demonstration, not data, and it is not treated here as evidence within the source.
      origin: extractor_observed
    - text: >
        Rendering the cylinder page confirms the diagram does work the prose does not: arrows run
        from sampled patches in the photograph to specific points inside the solid, so the claim
        that a picture is "rich" is made as a measurement of position rather than as an adjective.
        In text the measurement is gone and only the adjective survives.
      origin: extractor_observed
    - text: >
        The source is candid that everyday colour words are more communicative than coordinates —
        ochre and brick are understood by everyone better than hue-saturation-brightness
        descriptions — while insisting they still denote positions in the solid.
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a Varanasi bathing ghat with patches mapped by arrows onto the outer rim of the cylinder at a medium-dark level", figure_ref: "converted-PDF page 160"}
      - {description: "the Grand Prismatic Spring, blue from water absorption against orange from pigmented bacteria, shown as opposite wedges", figure_ref: "converted-PDF page 172"}
