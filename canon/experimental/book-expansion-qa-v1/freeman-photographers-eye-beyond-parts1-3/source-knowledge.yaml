- sk_id: sk_pex_0035
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "a fly on the wall—an objective observer"
    - "cool, distanced moments are just as valuable"
    - "difficult to describe in words, so I'll let the illustrations tell the story"
  concept_label: the_telephoto_observer_position_is_a_choice_not_a_defect
  label_origin: extractor_assigned
  claim: >
    The source defends the opposite of immersion. Stepping back and switching to a telephoto puts
    the photographer in the position of an objective observer, which it says some people treat as
    a defect of the lens and it treats as a matter of mood and personal taste. It tells the reader
    to ignore the street-photography charge of being too shy to get close, and asserts that cool,
    distanced moments are just as valuable. It also names the optical contribution: at that
    distance depth of field covers everything, so the whole scene appears to lie on a similar
    plane. Attached to this object is the source's own admission, made in the tilt case, that one
    of its subjects becomes difficult to describe in words and that it will let the illustrations
    tell the story — the clearest statement in the book that its argument is not carried by text.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Distance removes the viewer's implied participation, and the flattening of depth removes the
      cues that would place the viewer inside the space, so the frame reads as observed rather
      than entered.
  scope:
    domain_discussed_by_source: [still_photography_composition, reportage, street_photography]
    conditions: >
      The source is careful to hold this as taste rather than as a rule, in both directions. It
      argues against "the more blunt 'just get closer'" as well as against the charge of shyness.
  caveats:
