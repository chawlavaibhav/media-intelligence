- sk_id: sk_pex_0004
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "I needed everything sharp, which meant plenty of depth of field"
    - "accepting some softness in the falling water"
  concept_label: sharpness_across_a_graphic_overlay_is_paid_for_in_motion_rendering
  label_origin: extractor_assigned
  claim: >
    The source's horizontal-lines image required a silhouetted foreground and a distant waterfall
    to be simultaneously sharp, because the effect depends on the branches reading as a flat
    overlay on the scene beyond rather than as a separate near object. That demanded a minimum
    aperture, ƒ/32, which in the available light gave 1/5 second — and it explicitly accepted
    softness in the falling water as the price.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A graphic overlay only reads as graphic if both planes are equally sharp; unequal sharpness
      separates them into foreground and background instead. Buying that with aperture costs
      shutter speed, and the only moving thing in the frame pays.
  scope:
    domain_discussed_by_source: [still_photography_composition, still_photography_exposure]
    conditions: >
      A frame containing both a near graphic element and a moving distant subject, shot in
      available light without additional exposure latitude.
  caveats:
    - text: >
        The source states the trade as a fact of the shot it made, not as a general exposure rule.
        It does not claim the softness was desirable.
      origin: extractor_observed
  source_stated_problems: ["accepting some softness in the falling water"]
  source_stated_remedies: ["I stopped down to ƒ/32"]
  examples:
    positive:
      - {description: "Upper Yosemite Falls with silhouetted branches; a clear unobstructed view of the falls is shown alongside as the version not taken", figure_ref: "converted-PDF page 75"}
    counter: []
  intra_source_relations:
    - {relation: qualified_by, target: sk_pex_0003, note: "the subtractive graphic move is what created this cost"}
    - {relation: demonstrated_together_with, target: sk_pex_0051, note: "the stacking case makes the same aperture trade and names a further cost"}
