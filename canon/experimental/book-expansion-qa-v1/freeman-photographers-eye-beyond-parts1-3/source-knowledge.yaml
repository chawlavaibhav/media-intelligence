- sk_id: sk_pex_0042
  source_id: freeman-photographers-eye-beyond-parts1-3
  source_terms:
    - "eyeline"
    - "the two eyelines converge"
    - "the actions, all separately motivated, just came together"
  concept_label: gaze_and_gesture_vectors_recruit_attention_and_can_close_into_a_circuit
  label_origin: extractor_assigned
  claim: >
    The source treats a direction of looking as a force in the frame. If we see someone looking
    intently at something we follow the gaze; if that person suddenly looks up and away, the
    source calls the pull irresistible. When two individuals look at each other and the eyelines
    converge, that point becomes almost magnetically the centre of attention. It adds an
    amplifier: the effect is multiplied when someone is intently focusing a camera, because that
    implies the subject really is worth looking at. In a separate case it applies the same idea to
    a crowded scene, where three separately motivated actions — a cow looking up at a statue of a
    bull, one man reaching down to touch its feet, another reaching up to touch the statue —
    coincide and, in the source's words, bring some order out of chaos.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Human curiosity makes a visible line of sight into an instruction; the viewer follows it,
      and where two such lines meet the attention is held at the intersection rather than passing
      through.
  scope:
    domain_discussed_by_source: [still_photography_composition, reportage]
    conditions: >
      The busy-scene version is explicitly unreliable. The source names three routes to making a
      crowded scene cohere — camera angle, light, or the way the action unfolds — and says of the
      third that "rely may be the wrong word, because things often don't work out."
  caveats:
    - text: >
        Rendering the coincidence diagram shows something the caption does not say. The marked
        vectors do not point at a single target; they form a closed loop — statue down to cow, cow
        up, man up, man down — so the attention is routed around a circuit rather than converged
        on a point. Reading it as a closed circuit is ours, not the source's.
      origin: extractor_observed
    - text: >
        The camera amplifier is offered half in jest, with an invented term the source itself
        declines to adopt.
      origin: extractor_observed
  source_stated_problems: ["you end up with just a busy scene"]
  source_stated_remedies: ["sometimes the camera angle can do it, or the light, but often you have to rely on the way the action unfolds"]
  examples:
    positive:
      - {description: "two converging eyelines in a Malaysian street portrait, described as drawing attention irresistibly to that part of the frame", figure_ref: "converted-PDF page 155"}
      - {description: "the Nandin statue scene, three coinciding gestures plus the statue's own eyeline", figure_ref: "converted-PDF page 191"}
    counter:
