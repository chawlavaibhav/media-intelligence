  concept_label: shift_solves_converging_verticals_by_refusing_to_tilt_the_camera
  label_origin: extractor_assigned
  claim: >
    Shift is presented as mechanically and optically simpler than tilt: the lens slides up, down or
    sideways but stays in the same plane, sliding different parts of the scene into the frame.
    That works only because the lens projects an image circle larger than the sensor — ordinarily
    a waste of optics. Its stated use is architectural: tilting a camera up from ground level to
    take in a building makes the sides lean inward, so instead you aim straight, keep the camera
    level, and shift the lens up to recover the top of the building. The source's own diagram is
    honest about the cost of the levelled starting position — levelling cuts off the top of the
    church and shows unnecessary foreground; the shift is what restores the view.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Converging verticals are a consequence of the sensor plane not being parallel to the
      building; keeping it parallel removes the convergence, and the shift then reframes without
      reintroducing it.
  scope:
    domain_discussed_by_source: [still_photography_optics, architectural_photography]
    conditions: >
      Requires a shift or perspective-control lens, or a large-format camera's front standard.
      Cannot be done with an ordinary lens because the image circle is not large enough.
  caveats:
    - text: >
        The source acknowledges the digital alternative and then rejects it on preference, not on
        result — "Yes, I know you can do this digitally in post-production, but isn't it better to
        do it for real on the spot?" That is a practitioner opinion and must not be reported as a
        finding about which method is better.
