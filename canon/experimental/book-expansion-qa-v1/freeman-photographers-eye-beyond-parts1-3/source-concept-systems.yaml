# Michael Freeman, The Photographer's Eye: A Graphic Guide — Parts 4-10 — concept systems
# EXPERIMENTAL — NOT LIVE CANON. Lane of book-expansion-qa-v1.
# scope_extension_of: freeman-photographers-eye-graphic-guide · independence: none — same work
#
# LOCATORS: no authored page exists in this converted copy. page_start / page_end are null
#   everywhere; locators are the source's own case titles plus "converted-PDF page N".
#
# Five systems. Two are substantially the source's own structure (scs_pex_001, scs_pex_003).
# Three are ours and say so at every structural level.

- scs_id: scs_pex_001
  source_id: freeman-photographers-eye-beyond-parts1-3
  label: colour_relationships_as_regions_of_one_solid
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    The source's colour part presents seven named looks — rich, pastel, muted, theme, palette,
    spot, contrast — and builds one three-axis solid to locate all of them. Hue runs radially,
    saturation from the centre outward, brightness from dark at the top to bright at the bottom.
    Each named look is then given as a region or a relation within that solid rather than as a
    separate technique, and every case page carries a diagram of the same cylinder with the
    relevant region cut, sliced or wedged out.
  whole_system_claim:
    text: >
      Because all seven looks are positions in one coordinate space, they are not seven separate
      skills but one skill exercised in different places: reading where a scene's colours sit and
      deciding whether to move them, keep them, or set them against their opposite. Two of the
      seven, however, resist the space they are placed in. Muted cannot be separated from drab by
      any position in the solid, and a palette is a property of a place the photographer must find
      rather than a region to be aimed at.
    origin: extractor_synthesis
    interpretation_basis: >
      The cylinder is entirely the source's, and so is the placement of rich, pastel, muted, theme
      and contrast within it. What is ours is the observation that this makes the seven cases one
      system rather than seven, and the identification of the two members that the coordinate
      system fails to distinguish. The source never says the solid is incomplete.
    source_ref: null
  members:
    - {sk_ref: sk_pex_0043, role_in_system: coordinate_frame, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_pex_0044, role_in_system: member_the_frame_cannot_separate, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_pex_0045, role_in_system: member_at_set_level, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_pex_0046, role_in_system: member, order: 4, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies:
      - {from: sk_pex_0045, to: sk_pex_0043, note: "a theme is defined as one wedge of the hue circle at reduced saturation"}
      - {from: sk_pex_0046, to: sk_pex_0043, note: "spot colour is a rim position against a near-centre surround"}
    tradeoffs:
      - {between: [sk_pex_0043, sk_pex_0044], note: "rich colour is the strongest position in the solid and the source says it is self-limiting for exactly that reason"}
    conflicts:
      - {between: [sk_pex_0043, sk_pex_0044], note: "the solid is offered as the way to describe every look, and the source then says muted and drab differ only in the viewer's mood"}
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, repeated_within_source, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The coordinate system and every member's placement in it are the source's. The claim that
      this constitutes a single system, and the identification of muted/drab and palette as
      members the system cannot handle, are ours.
  provenance:
    chapter: "Part 8 — Color"
    section: "Part introduction, converted-PDF page 157, through CONTRAST, converted-PDF page 171"
    page_start: null
    page_end: null
    source_support: text_and_visual

- scs_id: scs_pex_002
  source_id: freeman-photographers-eye-beyond-parts1-3
  label: involvement_versus_detachment_as_one_axis
  label_origin: extractor_assigned
  system_type: trade_off_set
  system_type_origin: extractor_inferred
  description: >
    Four cases in two different parts sit on a single axis running from putting the viewer inside
    a scene to leaving them outside it. At the involved end are the close viewpoint and the
    wide-angle used from within a busy scene; at the detached end are the telephoto observer
    position and the frame that shows distance rather than merely covering it. The source states
    the opposition directly in three of the four — stepping back would have given a cooler, less
    involved image; the camera is you; a fly on the wall, an objective observer — and it insists
    the choice is mood and taste rather than correctness.
  whole_system_claim:
    text: >
      Distance from the subject is not a technical variable that a lens compensates for. It sets
      the viewer's position in relation to the scene, and the lens choices in this book follow
      that decision rather than driving it — which is why the source can get the close effect at
      48mm and the detached effect at 180mm, and can say that showing distance does not depend
      much on the lens.
    origin: extractor_synthesis
    interpretation_basis: >
      The source's oppositions are stated pairwise and within parts. Reading them as one axis
      spanning Parts 5 and 6, and stating that lens choice follows the position decision rather
      than producing it, is ours. The source never assembles these four cases.
    source_ref: null
  members:
    - {sk_ref: sk_pex_0028, role_in_system: involved_pole, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_pex_0034, role_in_system: involved_pole, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_pex_0035, role_in_system: detached_pole, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_pex_0027, role_in_system: detached_pole, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_pex_0022, role_in_system: qualifier, order: 5, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies: []
    tradeoffs:
      - {between: [sk_pex_0034, sk_pex_0035], note: "the source presents these two as a directly opposed pair and refuses to rank them"}
      - {between: [sk_pex_0028, sk_pex_0027], note: "closeness produces connection, visible distance produces measurement"}
    conflicts:
      - {between: [sk_pex_0022, sk_pex_0035], note: "the subjective obstructed view puts the viewer inside without getting close, which the axis alone does not predict"}
  source_warns_against_isolated_use: true
  source_warning_ref: >
    TELEPHOTO COOLNESS, converted-PDF page 138 — the source explicitly warns against taking either
    pole as correct, telling the reader to ignore the charge of shyness and rejecting "the more
    blunt 'just get closer'" in the same paragraph.
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, repeated_within_source]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The pairwise oppositions are the source's own words. The axis, its five members and the claim
      that lens follows position are ours. A reader of the book would not find this system stated.
  provenance:
    chapter: "Part 5 — Viewpoint; Part 6 — Optics"
    section: "CLOSE 110, LOOKING THROUGH 104, DISTANT 113, WIDE-ANGLE IMMERSIVE 135, TELEPHOTO COOLNESS 138 — all converted-PDF pages"
    page_start: null
    page_end: null
    source_support: text

- scs_id: scs_pex_003
  source_id: freeman-photographers-eye-beyond-parts1-3
  label: sharpness_as_a_field_of_opposed_intents
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    The source's optics part is built as a set of opposed uses of one control. Deep pursues
    front-to-back sharpness and places the focus plane to buy the most of it. Selective throws
    almost everything away to point at one thing. Tilt steers the sharp plane to lie along the
    subject; counter-focus reverses the same movement to destroy as much sharpness as possible.
    Two further cases in Part 9 complete the field by refusing sharpness that was available — the
    reflection case declines a smaller aperture because it would spoil the merged overlaps, and
    the stacking case needs edges sharp while depending on haze to remove everything inside them.
  whole_system_claim:
    text: >
      Sharpness in this book is not a quality to be maximised but a distribution to be placed. Each
      member is the same decision — where in the frame the viewer is permitted to see clearly —
      and the members qualify each other rather than ranking, which is why the source can argue
      for ƒ/32 in one case and against a smaller aperture in another without contradiction.
    origin: extractor_synthesis
    interpretation_basis: >
      The oppositions inside Part 6 are the source's own and it cross-references them explicitly
      (counter-focus is introduced as the reverse of tilt and points back to the selective and
      colour-wash cases). Extending the field to include the two Part 9 refusals is ours, and so
      is the framing of sharpness as a distribution rather than a quantity.
    source_ref: null
  members:
    - {sk_ref: sk_pex_0029, role_in_system: maximising_intent, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_pex_0030, role_in_system: minimising_intent, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_pex_0032, role_in_system: steering_and_its_reversal, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_pex_0031, role_in_system: minimising_intent_used_for_colour, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_pex_0052, role_in_system: refusal_of_available_sharpness, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_pex_0051, role_in_system: internal_conflict, order: 6, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies:
      - {from: sk_pex_0031, to: sk_pex_0030, note: "the colour-wash cases are selective focus used for hue instead of for pointing"}
    tradeoffs:
      - {between: [sk_pex_0029, sk_pex_0030], note: "opposite intents for the same aperture control, stated as such by the source"}
      - {between: [sk_pex_0029, sk_pex_0052], note: "the source declines the sharpness the deep case pursues"}
    conflicts:
      - {between: [sk_pex_0051, sk_pex_0029], note: "stacking demands everything be in focus and simultaneously depends on haze removing internal detail; the source does not remark on the tension"}
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, argued, repeated_within_source, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The Part 6 oppositions and the cross-references between them are the source's. The two Part 9
      members and the identification of the stacking case as an internal conflict are ours.
  provenance:
    chapter: "Part 6 — Optics; Part 9 — Juxtaposing"
    section: "DEEP 117, SELECTIVE 121, COLOR-WASH 123 and 125, TILT 128, COUNTER FOCUS 131, STACKING 181, LAYERING 183 — all converted-PDF pages"
    page_start: null
    page_end: null
    source_support: text_and_visual

- scs_id: scs_pex_004
  source_id: freeman-photographers-eye-beyond-parts1-3
  label: implied_direction_as_a_force_in_the_frame
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: source_stated
  description: >
    Four consecutive cases in the motion part treat a direction the viewer infers — not a
    direction anything actually moves in the photograph — as something the composition must be
    built around. A walking figure carries a vector the viewer extrapolates forward. A scene can
    itself be directional, which is what licenses reversing the placement rule. A gaze recruits
    the viewer's own gaze, and two gazes meeting hold it. In a crowded frame several separately
    motivated gestures can coincide into an order that no single one supplies.
  whole_system_claim:
    text: >
      The source builds this set as a rule immediately followed by its exception, and the exception
      is the useful part: a figure belongs on its entry side because the viewer projects it
      forward, unless the setting already carries a direction of its own, in which case the figure
      should complete that direction and may leave the frame. Both halves are about the same
      quantity — the frame's net implied direction — and neither is a rule about placement as
      such.
    origin: extractor_synthesis
    interpretation_basis: >
      The rule-then-exception structure is the source's own and is built into the order of the
      cases: MOVING IN states the rule, MOVING OUT opens by saying there is always an opposite to
      the expected way and then gives the condition. Naming the shared quantity as the frame's net
      implied direction is ours, and the source does not use that idea to connect the eyeline case
      to the placement cases.
    source_ref: >
      MOVING IN, converted-PDF page 148, and MOVING OUT, converted-PDF page 150 — consecutive cases
      in which the source states a placement rule and then reverses it with a stated condition.
  members:
    - {sk_ref: sk_pex_0039, role_in_system: rule, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_pex_0040, role_in_system: stated_exception, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_pex_0041, role_in_system: overriding_constraint, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_pex_0042, role_in_system: same_force_from_gaze, order: 4, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: procedural, origin: source_stated}
    dependencies:
      - {from: sk_pex_0040, to: sk_pex_0039, note: "the exception is only meaningful against the rule"}
    tradeoffs:
      - {between: [sk_pex_0039, sk_pex_0041], note: "a strongly graphic setting removes the placement latitude the rule assumes"}
    conflicts:
      - {between: [sk_pex_0039, sk_pex_0040], note: "the two cases give opposite placements; the conflict is resolved by the source's stated condition, not left open"}
  source_warns_against_isolated_use: true
  source_warning_ref: >
    MOVING IN, converted-PDF page 148 — "This kind of placement is not compulsory, of course, just
    natural." The hedge is in the same paragraph as the rule.
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, argued, mechanism_given]
    source_uncertainty: source_hedges
    extraction_uncertainty: none
    system_level_uncertainty: >
      The rule, the exception and the condition are all the source's, stated in consecutive cases.
      Including the eyeline and coincidence case as a fourth member, and naming the common quantity,
      are ours.
  provenance:
    chapter: "Part 7 — Motion"
    section: "MOVING IN 148, MOVING OUT 150, MOMENT 152, EYELINES 154 — all converted-PDF pages"
    page_start: null
    page_end: null
    source_support: text_and_visual

- scs_id: scs_pex_005
  source_id: freeman-photographers-eye-beyond-parts1-3
  label: depth_read_from_flat_evidence
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    Scattered across three parts, the source gives several accounts of how a flat frame comes to
    read as three-dimensional, and they do not agree about what supplies the depth. Size variation
    among similar elements is read as recession. A focus gradient produces perceptual layers. A
    chain of visible ground plus aerial haze lets a viewer measure a distance. And in the stacking
    case, removing all internal description from each land form is what makes the frame read as a
    dozen receding planes — depth produced by taking information away rather than adding it. The
    same haze that supplies distance in one case removes description in another.
  whole_system_claim:
    text: >
      Depth in this source is never a property of the subject; it is always a property of what the
      frame lets the viewer compare. Size against size, sharp against blurred, near ground against
      far ground, occluding shape against occluded shape. Because it is comparative, a cue can be
      strengthened by adding evidence or by deleting the evidence that would contradict it, which
      is why haze appears on both sides.
    origin: extractor_synthesis
    interpretation_basis: >
      Every member claim is the source's; the grouping is entirely ours. The source distributes
      these across the graphics, viewpoint, optics and juxtaposing parts and never treats depth as
      a topic. It also never notices that its two uses of aerial perspective point in opposite
      directions. Nothing in the book states or implies this system.
    source_ref: null
  members:
    - {sk_ref: sk_pex_0010, role_in_system: size_comparison_cue, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_pex_0030, role_in_system: focus_comparison_cue, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_pex_0027, role_in_system: measurable_interval_cue, order: 3, membership_origin: extractor_inferred}
    - {sk_ref: sk_pex_0051, role_in_system: cue_produced_by_deletion, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_pex_0050, role_in_system: cue_suppressor, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_pex_0035, role_in_system: cue_suppressor, order: 6, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies:
      - {from: sk_pex_0051, to: sk_pex_0050, note: "the stack depends on compression to equalise the planes"}
    tradeoffs:
      - {between: [sk_pex_0027, sk_pex_0050], note: "compression buys a relationship between near and far by destroying the scale difference that would show the distance"}
    conflicts:
      - {between: [sk_pex_0027, sk_pex_0051], note: "aerial perspective is a distance cue in one case and a description remover in the other; the source uses both without reconciling them"}
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      This system is ours in full. The source has no chapter on depth, makes no claim that these
      cases belong together, and does not observe the conflict between its two uses of haze. Every
      member is a real source claim; the structure connecting them is not.
  provenance:
    chapter: "Part 4 — Graphics; Part 5 — Viewpoint; Part 6 — Optics; Part 9 — Juxtaposing"
    section: "TRIANGLES 84, SELECTIVE 121, DISTANT 113, TELEPHOTO COOLNESS 138, COMPRESSING 179, STACKING 181 — all converted-PDF pages"
    page_start: null
    page_end: null
    source_support: text_and_visual
