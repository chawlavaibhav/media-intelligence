# Q&A bank — Susan Sontag, "On Photography" (Picador/FSG; essays 1973-77, book 1977).
# source_id: sontag-on-photography
# EXPERIMENTAL — NOT LIVE CANON.
#
# LOCATORS: EPUB, reflowable. THERE ARE NO AUTHORED PAGE NUMBERS IN THIS COPY. Every source_locator
# is the essay title plus a short distinguishing phrase identifying the passage, with "(spine n)" as
# a file-position aid. No page number appears anywhere in this file and none was invented.
#
# WHAT THIS BANK IS AND IS NOT. Every question below is about how photographs are READ. Not one asks
# how to make anything, and not one answer contains an instruction. That is deliberate and it is the
# main constraint under which this bank was written: the project's own coverage map records that this
# source is "critique, not craft", and the fastest way to get it wrong would be to write a question
# whose correct answer is a production rule. Several items are phrased as situations a reader must
# reason about; in every case what is applied is a way of reading an image, never a way of making one.
#
# SOURCE POSITION: a critic arguing a position by accumulation and allusion. No study, no
# measurement, no survey, no controlled comparison. answer_type: source_position is the dominant
# type in this bank and that is the honest shape.
#
# DATE: 1977. Answers report what Sontag claims, in her frame, on her premises. Where a premise is
# visibly of its moment the answer says what she assumes — and never what is true now instead,
# because this lane has no source for that.

source_id: sontag-on-photography

qa_items:

# ── EVIDENCE AND AUTHORITY ───────────────────────────────────────────────────

- qa_id: qa_snt_0001
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Image-World", the passage on the photograph as a trace and the Shakespeare comparison (spine 10)'
  question: >
    Sontag locates photographic authority somewhere other than accuracy. Where, and what thought
    experiment does she use to isolate it?
  answer: >
    In the photograph being a trace. A painting, however exact, is never more than the stating of an
    interpretation; a photograph is never less than the registering of an emanation — light reflected
    by objects — and is therefore a material vestige of its subject in a way no painting can be,
    something directly stencilled off the real like a footprint or a death mask. The thought
    experiment: offered a hypothetical Holbein portrait of Shakespeare or a hypothetical photograph
    of him, most would take the photograph — and not merely because it would show what he looked
    like, since even a faded, barely legible brownish shadow would still be preferred. Her phrase for
    why is that having it would be like having a nail from the True Cross. The authority is
    relic-like: what is credited is the causal link, not the likeness, which is why a degraded
    photograph keeps an authority a perfect painting never acquires.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    The Image-World: a photograph is not only an image, an interpretation of the real, it is also a
    trace, something directly stencilled off the real; a photograph is never less than the
    registering of an emanation, a material vestige of its subject in a way no painting can be;
    having a photograph of Shakespeare would be like having a nail from the True Cross.
  confounders:
    - "locating the authority in accuracy or detail, which the faded-photograph case is designed to rule out"
    - "reading 'trace' as a metaphor; her argument turns on it being physical"
    - "assuming she therefore endorses the authority — she is explaining it, and elsewhere attacks what it licenses"

- qa_id: qa_snt_0002
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the passage beginning "Photographs furnish evidence" (spine 5)'
  question: >
    Sontag says a photograph is received differently from a written account or a drawing. State the
    difference precisely, and give the two features of the presumption she insists on.
  answer: >
    What is written about a person or an event is frankly an interpretation, and so are handmade
    visual statements like paintings and drawings; photographed images do not seem to be statements
    about the world so much as pieces of it, miniatures of reality. The two features she insists on:
    first, the presumption survives distortion — the picture may distort, and there is still always a
    presumption that something exists, or did exist, which is like what is in it; second, the
    presumption is indifferent to the maker. Whatever the limitations of amateurism or the pretensions
    of artistry, any photograph seems to have a more innocent, and therefore more accurate, relation
    to visible reality than other made images do. Her formulation of the consequence is that a
    photograph passes for incontrovertible proof that a given thing happened.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    In Plato's Cave: photographs furnish evidence; a photograph passes for incontrovertible proof
    that a given thing happened; the picture may distort but there is always a presumption that
    something exists or did exist which is like what's in the picture; whatever the limitations or
    pretensions of the individual photographer, a photograph — any photograph — seems to have a more
    innocent, and therefore more accurate, relation to visible reality.
  confounders:
    - "reading it as a claim that photographs are accurate; she says they are received as accurate"
    - "assuming skilled photographs carry more of the presumption; she says it is indifferent to the maker"

- qa_id: qa_snt_0003
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the passage on the presumption of veracity and the Farm Security Administration photographers (spine 5)'
  question: >
    Sontag's documentary example: photographers took dozens of frontal pictures of one subject until
    satisfied. What is the point of the example, and what does she say about photographers who work
    without discrimination?
  answer: >
    The point is that a standard is imposed on the subject by a decision that leaves no visible trace.
    They shot until they had the precise expression that supported their own notions about poverty,
    light, dignity, texture, exploitation and geometry — so the surviving frame agrees with a prior
    idea, and the agreement was produced by selection. Her general form is that in deciding how a
    picture should look, and in preferring one exposure to another, photographers are always imposing
    standards on their subjects, and that even those most concerned with mirroring reality are haunted
    by tacit imperatives of taste and conscience. About undiscriminating work she closes the escape:
    occasions when picture-taking is relatively promiscuous or self-effacing do not lessen the
    didacticism of the enterprise, because the passivity and ubiquity of the photographic record is
    itself photography's message and its aggression. Note that the reading of what the photographers
    were satisfied by is entirely hers, offered with no account of how she knows.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    In Plato's Cave: the FSA photographers would take dozens of frontal pictures until satisfied they
    had the right look — the precise expression that supported their own notions about poverty,
    dignity, texture, exploitation and geometry; in deciding how a picture should look, photographers
    are always imposing standards; this very passivity and ubiquity is photography's message, its
    aggression.
  confounders:
    - "reading it as a criticism of those photographers rather than as a claim about all selection"
    - "assuming neutral or artless shooting escapes the argument; she closes that route explicitly"

- qa_id: qa_snt_0004
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the passage on the consequences of lying (spine 8)'
  question: >
    "A fake painting falsifies the history of art. A fake photograph falsifies reality." Explain the
    asymmetry, and note the detail in her definition of a fake photograph that is easy to miss.
  answer: >
    The asymmetry follows from what each kind of image claims. A photograph makes a claim to be true
    that a painting can never make, so the consequences of lying are more central for photography
    than they ever can be for painting. A forged painting is a false attribution — a question about
    art's history. A faked photograph corrupts a claim about the world. The detail that is easy to
    miss is inside her parenthesis: a fake photograph is one which has been retouched or tampered
    with, **or whose caption is false**. The false caption is placed inside the definition of the
    fake, not outside it, which means the claim covers words attached to an entirely unaltered
    image.
  answer_type: comparison
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    The Heroism of Vision: a fake painting (one whose attribution is false) falsifies the history of
    art; a fake photograph (one which has been retouched or tampered with, or whose caption is false)
    falsifies reality; the consequences of lying have to be more central for photography because
    photographs make a claim to be true that paintings can never make.
  confounders:
    - "restricting 'fake' to image manipulation and dropping the caption clause"
    - "reading the sentence as a rule Sontag is proposing; it is a statement about what the two kinds of image claim"

- qa_id: qa_snt_0005
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the passage on anxiety before the camera and the invention of retouching (spine 8)'
  question: >
    Sontag reports that when retouching became publicly known in the 1850s, the appetite for being
    photographed rose. What does she say people want from a portrait, and what inference rule does
    she attach?
  answer: >
    She reports that the news that the camera could lie made getting photographed much more popular.
    What people want, on her account, is the idealised image — a photograph of themselves looking
    their best — and they feel rebuked when the camera does not return an image of themselves as
    more attractive than they really are; few, she says, are lucky enough to look better in
    photographs than in life. The inference rule is a nice one: that photographs are often praised
    for their candour and honesty indicates that most photographs are not candid, since a property
    is remarked on where it is not the default. Note that the causal joining — that the appetite rose
    *because* people want flattery — is not something she states; she puts the two adjacent, and this
    bank records the connection as an interpretation rather than as her claim.
  answer_type: source_position
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    The Heroism of Vision: many people are anxious when about to be photographed, not because they
    fear being violated but because they fear the camera's disapproval; people want the idealised
    image; they feel rebuked when the camera doesn't return an image of themselves as more attractive
    than they really are; the news that the camera could lie made getting photographed much more
    popular; that photographs are often praised for their candour indicates that most are not candid.
  confounders:
    - "predicting the opposite effect, which a straightforward account of trust would give"
    - "treating the causal connection as Sontag's; she states the fact and the desire separately"

# ── DECONTEXTUALISATION AND THE CAPTION ──────────────────────────────────────

- qa_id: qa_snt_0006
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the passage beginning "A new sense of the notion of information has been constructed around the photographic image" (spine 5)'
  question: >
    What does Sontag mean by saying that in a world ruled by photographic images all borders seem
    arbitrary, and what does she say a photograph therefore invites?
  answer: >
    A photograph is a thin slice of space as well as of time, so anything can be separated — made
    discontinuous — from anything else, since all that is necessary is to frame the subject
    differently; and conversely anything can be made adjacent to anything else. Her consequence is
    epistemic: the world becomes a series of unrelated, freestanding particles and history a set of
    anecdotes, a view that denies interconnectedness and continuity while conferring on each moment
    the character of a mystery. The camera, in her phrase, makes reality atomic, manageable and
    opaque. What a photograph therefore invites is not knowledge but speculation: because photographs
    cannot themselves explain anything, they are inexhaustible invitations to deduction, speculation
    and fantasy — the ultimate wisdom of the image being "there is the surface, now think, or rather
    feel, what the reality must be like if it looks this way."
  answer_type: mechanism
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    In Plato's Cave: the photograph is a thin slice of space as well as time; all borders (framing)
    seem arbitrary, anything can be separated from anything else, all that is necessary is to frame
    the subject differently; the world becomes a series of unrelated, freestanding particles; the
    camera makes reality atomic, manageable and opaque; photographs are inexhaustible invitations to
    deduction, speculation and fantasy.
  confounders:
    - "reading 'arbitrary borders' as a complaint about bad cropping rather than as a property of framing as such"
    - "assuming the invitation to speculate is a virtue in her account; she opposes it to understanding"

- qa_id: qa_snt_0007
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the passage beginning "Because each photograph is only a fragment" (spine 8)'
  question: >
    One photograph appears on a contact sheet, in a gallery, at a political demonstration, in a
    police file, in a news magazine and on a living-room wall. What does Sontag say has happened, and
    what formula does she borrow to state it?
  answer: >
    Each situation suggests a different use for the photograph, and none of them can secure its
    meaning. Because each photograph is only a fragment, its moral and emotional weight depends on
    where it is inserted, and the image changes according to the context in which it is seen. She
    borrows Wittgenstein's formula for words and applies it directly: the meaning is the use. She
    then extends the point from placement to time — the context that shapes a photograph's immediate,
    and especially its political, use is inevitably succeeded by contexts in which that use is
    weakened, so original uses are modified and eventually supplanted, most notably by the discourse
    of art, into which she says any photograph can be absorbed.
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    The Heroism of Vision: because each photograph is only a fragment, its moral and emotional weight
    depends on where it is inserted; a photograph changes according to the context in which it is
    seen; each of these situations suggests a different use but none can secure their meaning; as
    Wittgenstein argued for words, that the meaning is the use — so for each photograph.
  confounders:
    - "answering that the photograph means different things to different audiences, which understates it; her claim is that no placement fixes the meaning at all"
    - "assuming the original context is the true one; she says it is the one most reliably lost"

- qa_id: qa_snt_0008
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the passage on Benjamin, the caption and the film "A Letter to Jane" (spine 8)'
  question: >
    Sontag says two things about captions that pull in opposite directions. Give both, and say what
    goes wrong if only the first is taken.
  answer: >
    First: a photograph is physically mute and talks through the mouth of the text written beneath
    it, and words do speak louder than pictures — captions tend to override the evidence of our eyes.
    Second: no caption can permanently restrict or secure a picture's meaning; even an entirely
    accurate caption is only one interpretation, and a limiting one, and the caption-glove slips on
    and off too easily to hold. What goes wrong if only the first is taken is that a claim about
    instability becomes a technique — the caption starts to look like a control on meaning, which is
    exactly the position she is arguing against. She reports and rejects Benjamin's proposal that the
    right caption could rescue a picture and confer a revolutionary use value on it, on the ground
    that the moralists are demanding a photograph do what no photograph can ever do, which is speak.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: >
    The Heroism of Vision: this photograph, like any photograph, is physically mute, it talks through
    the mouth of the text written beneath it; words do speak louder than pictures, captions do tend to
    override the evidence of our eyes, but no caption can permanently restrict or secure a picture's
    meaning; even an entirely accurate caption is only one interpretation, necessarily a limiting one;
    what the moralists are demanding is that a photograph do what no photograph can ever do — speak.
  confounders:
    - "taking only the override half and reading it as a technique for controlling meaning"
    - "attributing Benjamin's right-caption proposal to Sontag; she reports it and argues against it"

- qa_id: qa_snt_0009
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the account of a wartime photograph and the caption supplied for it (spine 8)'
  question: >
    A photograph is released by one party and published by another with its own caption. On Sontag's
    reading, what happens to it — and what does that case establish and not establish?
  answer: >
    Its meaning can reverse. In her case a photograph released for one political purpose was
    published in a magazine whose caption gave it, in her account, close to the opposite meaning, and
    the revolutionary use-value it had for those who released it was sabotaged by what the magazine
    furnished as a caption. What the case establishes is her positive claim about asymmetry: the
    image supplies no assertion of its own, the text supplies one, and the text wins. What it does
    not establish is that captioning solves anything, because the same detachability that let the
    second caption override the first will let a third override that — which is why she insists the
    caption-glove slips on and off. Note the evidence: this is a film-essay's reading of one wartime
    photograph in one magazine, inside a specific political controversy of the early 1970s, doing the
    work of a general claim.
  answer_type: application
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    The Heroism of Vision: what the photograph meant when it was published in the French picture
    magazine in some ways reverses the meaning it had for those who released it; even more decisive
    than the new setting is how its revolutionary use-value was sabotaged by what the magazine
    furnished as a caption; the caption-glove slips on and off so easily.
  confounders:
    - "concluding that better captioning would have protected the image"
    - "treating a single contested case as demonstrated rather than argued"

- qa_id: qa_snt_0010
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the passage beginning "Photography implies that we know about the world if we accept it as the camera records it" (spine 5)'
  question: >
    "Photographs do not explain; they acknowledge." Give Sontag's reason — not the assertion, the
    argument — and the concession she makes in the same passage.
  answer: >
    The argument is about the form of understanding. An amorous relation is based on how something
    looks; understanding is based on how something functions; functioning takes place in time and
    must be explained in time; and therefore only that which narrates can make us understand. A
    photograph is a slice of time, so the object of understanding is not merely underrepresented in
    it — it is absent in kind. She takes Brecht's example, that a photograph of a great armaments
    works reveals virtually nothing about that organisation, and generalises it: the camera's
    rendering of reality must always hide more than it discloses. The concession is real and should
    not be dropped: photographs do fill in blanks in our mental pictures of the present and the past,
    and she names the case — images of 1880s urban squalor are sharply instructive to someone unaware
    it was that bad. Filling a blank is not explaining.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    In Plato's Cave: strictly speaking, one never understands anything from a photograph; the camera's
    rendering of reality must always hide more than it discloses; a photograph of the Krupp works
    reveals virtually nothing about that organisation; understanding is based on how it functions, and
    functioning takes place in time — only that which narrates can make us understand; photographs do
    fill in blanks in our mental pictures.
  confounders:
    - "answering that photographs lack detail or context, which is not her argument"
    - "dropping the concession and reading her as saying photographs convey nothing"
    - "attributing the armaments-works example to Sontag; it is Brecht's, reported by her"

- qa_id: qa_snt_0011
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the passage beginning "The painter constructs, the photographer discloses" (spine 8)'
  question: >
    You are asked to judge a tightly cropped photograph in which the subject is not identifiable —
    it reads as an abstract form. On Sontag's account, what has to happen before any judgement is
    possible, and what does that imply about the standing of formal qualities in photography?
  answer: >
    On her account the subject has to be identified first, and until it is, the judgement cannot be
    made at all. Her evidence is exactly this case: a photograph seen too closely or
    too distantly cannot be reacted to at all until the viewer knows what piece of the world it is.
    Two cases carry it. A photographed cabbage leaf reads as a fall of gathered cloth and needs a
    title to identify it — and the image then works in two ways, the form pleases and it is,
    surprisingly, a cabbage leaf, where gathered cloth would not have been beautiful because that
    beauty is already known from the fine arts. And a shape resembling a bare coronet becomes far
    more interesting once one learns it is a splash of milk. Her conclusion: the painter constructs
    and the photographer discloses, so the formal qualities of style — the central issue in painting —
    are at most of secondary importance in photography, while what a photograph is of is always of
    primary importance.
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    The Heroism of Vision: the identification of the subject of a photograph always dominates our
    perception of it, as it does not necessarily in a painting; the painter constructs, the
    photographer discloses; the subject of the cabbage-leaf photograph looks like gathered cloth and a
    title is needed; if it were gathered cloth it wouldn't be so beautiful; what looks like a bare
    coronet becomes far more interesting when we find out it is a splash of milk.
  confounders:
    - "reading it as advice about titling or captioning images; she is describing how they are processed"
    - "assuming she is dismissing composition; her claim is about the order in which the two questions are asked"

# ── AESTHETICISATION ─────────────────────────────────────────────────────────

- qa_id: qa_snt_0012
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the opening passage and the passage quoting Benjamin on the camera''s incapacity (spine 8)'
  question: >
    Sontag says photography beautifies. What makes this a claim about the medium rather than about
    photographers, and what route does she give for subjects that offer no beauty to find?
  answer: >
    It is a claim about the medium because it covers work that sets out to refuse beauty:
    notwithstanding the declared aims of indiscreet, unposed, often harsh photography to reveal truth
    and not beauty, photography still beautifies. Intending otherwise does not exempt you. She quotes
    Benjamin's 1934 statement that the camera is by then incapable of photographing a tenement or a
    rubbish-heap without transfiguring it, and that it has turned abject poverty itself, handled in a
    modish and technically perfect way, into an object of enjoyment. The route for unpromising
    subjects is her own sentence: the most enduring triumph of photography has been its aptitude for
    discovering beauty in the humble, the inane and the decrepit — because at the very least the real
    has a pathos, and that pathos is beauty. She opens the essay with the corollary: nobody ever
    discovered ugliness through photographs, but many, through photographs, have discovered beauty.
  answer_type: source_position
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    The Heroism of Vision: nobody ever discovered ugliness through photographs; photography still
    beautifies notwithstanding the declared aims of harsh photography to reveal truth, not beauty; the
    most enduring triumph of photography has been its aptitude for discovering beauty in the humble,
    the inane, the decrepit; at the very least, the real has a pathos, and that pathos is beauty.
    Benjamin, quoted: incapable of photographing a tenement or a rubbish-heap without transfiguring it.
  confounders:
    - "reading it as a criticism of particular photographers rather than of the medium"
    - "converting it into a recommendation about what to photograph or how — she makes none, and neither does this bank"

- qa_id: qa_snt_0013
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the closing passages beginning "In a consumer society, even the most well-intentioned and properly captioned work" (spine 8)'
  question: >
    Sontag's claim about images of suffering is that the medium works against the effect they were
    made to have. State it precisely, note the clause about intention, and say what it is not.
  answer: >
    Precisely: photographs can and do distress — protected inhabitants of the more affluent parts of
    the world learn about the world's horrors mainly through the camera — but the aestheticising
    tendency of photography is such that the medium which conveys distress ends by neutralising it.
    Two routes: cameras miniaturise experience and transform history into spectacle; and as much as
    photographs create sympathy they also cut sympathy and distance the emotions, producing a realism
    that is in the long run morally analgesic while remaining sensorially stimulating. The clause
    about intention is the part that bites: she says this of even the most well-intentioned and
    properly captioned work, so neither good intention nor accurate captioning exempts an image. What
    it is not: it is not advice. She does not say that images of difficulty should be composed
    differently, framed differently or avoided, and she recommends nothing at all here. Anything of
    that form would be an addition to what she wrote.
  answer_type: source_position
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    The Heroism of Vision: in a consumer society, even the most well-intentioned and properly
    captioned work of photographers issues in the discovery of beauty; photographs can and do
    distress, but the aestheticizing tendency is such that the medium which conveys distress ends by
    neutralizing it; cameras miniaturize experience, transform history into spectacle; as much as they
    create sympathy, photographs cut sympathy, distance the emotions.
  confounders:
    - "converting it into a rule about depicting difficult subjects, which is the characteristic way of misusing this source"
    - "assuming better intentions or accurate captions escape the tendency; she rules both out by name"

- qa_id: qa_snt_0014
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the opening passage on beauty being used up (spine 8)'
  question: >
    "Photographs create the beautiful and—over generations of picture-taking—use it up." What is the
    mechanism, and what qualification does Sontag put on her own explanation?
  answer: >
    The mechanism is assimilation, not boredom. A way of seeing is startling only against a habit it
    violates; challenged by the revelations of photographers, seeing accommodates to photographs, so
    photographic seeing has to be constantly renewed with new shocks — of subject matter or of
    technique — in order to keep producing the impression of violating ordinary vision. Each success
    therefore removes the condition that made it work. Her worked case is a generation of rigorous
    close-up studies — plants, shells, leaves, weathered wood, workers' hands — which became clichés
    of a merely photographic way of seeing: what once took a very intelligent eye to see, anyone can
    see now. Her example of the same thing happening to a subject is sunsets, which the
    image-surfeited find corny because they now look too much like photographs. The qualification is
    against her own tidiness: increased familiarity does not entirely explain why certain conventions
    of beauty get used up while others remain, and the attrition is moral as well as perceptual — a
    residue she does not analyse.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    The Heroism of Vision: photographs create the beautiful and, over generations of picture-taking,
    use it up; the image-surfeited are likely to find sunsets corny, they now look too much like
    photographs; photographic seeing has to be constantly renewed with new shocks; the close-up
    studies have become clichés of a merely photographic way of seeing; what it once took a very
    intelligent eye to see, anyone can see now; increased familiarity does not entirely explain it,
    the attrition is moral as well as perceptual.
  confounders:
    - "reading it as advice to seek novelty; she treats the search for new shocks as a treadmill, not a strategy"
    - "dropping her qualification and presenting familiarity as the whole explanation"

# ── ATTRITION OF RESPONSE ────────────────────────────────────────────────────

- qa_id: qa_snt_0015
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the passage beginning "The quality of feeling ... also depends on the degree of their familiarity with these images" (spine 5)'
  question: >
    Sontag's attrition argument has two parts, and only the second makes it a mechanism. Give both,
    and give her comparative example.
  answer: >
    First: photographs shock insofar as they show something novel, and the shock of photographed
    atrocity wears off with repeated viewing — she places it beside pornography, where the surprise of
    the first encounter also wears off after a few more. Second, and this is what makes it a
    mechanism rather than an observation: the ante keeps getting raised, partly through the very
    proliferation of such images. The supply of images draws down the stock of novelty on which any
    response depends, so the level required to produce a response rises with the number of images
    produced. Her example is two famine reportages a generation apart, the later having less impact
    for some viewers because such images had become banal, and a further set that she says must have
    seemed to many like an unbearable replay of a now familiar atrocity exhibition. Her conclusion is
    that concerned photography has, in recent decades, done at least as much to deaden conscience as
    to arouse it.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    In Plato's Cave: photographs shock insofar as they show something novel; unfortunately the ante
    keeps getting raised, partly through the very proliferation of such images of horror; the shock of
    photographed atrocities wears off with repeated viewings, just as the surprise of a pornographic
    movie does; the later famine photographs had less impact because those images had become banal;
    concerned photography has done at least as much to deaden conscience as to arouse it.
  confounders:
    - "giving only the wearing-off half, which is an observation and not a mechanism"
    - "reading it as advice about frequency or variation; she recommends nothing"
    - "assuming the effect is about the viewer's callousness rather than about the supply of images"

- qa_id: qa_snt_0016
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the passage beginning "The ethical content of photographs is fragile" (spine 5)'
  question: >
    An archive photograph that once moved people because of what it showed now reads mainly as
    poignant and old. Which of Sontag's two decays is this, how do you tell it from the other, and
    what exception does she allow?
  answer: >
    This is decay by time, not decay by repetition: it acts on every photograph rather than only on
    ones an audience has seen before, and you tell them apart by what changes — repetition lowers the
    response to a subject, whereas time changes what the image is affecting FOR. The ethical
    content of photographs is fragile and most do not keep their emotional charge; the demonstration
    is a substitution of what the image is affecting *for*. A photograph of 1900 that was affecting
    then because of its subject would today be more likely to move us because it is a photograph
    taken in 1900. The particular qualities and intentions of photographs are swallowed up in the
    generalised pathos of time past; aesthetic distance is built into the experience of looking at
    photographs, if not immediately then certainly with time; and time eventually positions most
    photographs, even the most amateurish, at the level of art. The exception she allows: photographs
    of certain horrors have gained the status of ethical reference points, and those do keep their
    charge.
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    In Plato's Cave: the ethical content of photographs is fragile; with the possible exception of
    photographs of those horrors that have gained the status of ethical reference points, most
    photographs do not keep their emotional charge; a photograph of 1900 that was affecting then
    because of its subject would today be more likely to move us because it is a photograph taken in
    1900; time eventually positions most photographs at the level of art.
  confounders:
    - "conflating this with attrition by repetition; the drivers and the scope differ"
    - "missing the ethical-reference-point exception"

- qa_id: qa_snt_0017
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the passage beginning "A photograph that brings news of some unsuspected zone of misery" (spine 5)'
  question: >
    Sontag says photographs cannot create a moral position. State the claim exactly, give the claim
    about order that follows from it, and name the case she sets against her own argument.
  answer: >
    Exactly: photographs cannot create a moral position, but they can reinforce one — and can help
    build a nascent one. An image bringing news of an unsuspected zone of misery cannot make a dent
    in public opinion unless an appropriate context of feeling and attitude already exists, and what
    determines the possibility of being affected morally is the existence of a relevant political
    consciousness; without a politics, such photographs are most likely experienced as simply unreal
    or as a demoralising emotional blow. The claim about order is sharper: it is never photographic
    evidence that constructs — more properly, identifies — an event; the contribution of photography
    always follows the naming of the event. The case she sets against herself is a single wartime
    photograph of a wounded child, which she says probably did more to increase public revulsion
    against a war than a hundred hours of televised barbarities. She does not reconcile the two.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: persuasion
  requires_application: false
  support: >
    In Plato's Cave: photographs cannot create a moral position, but they can reinforce one — and can
    help build a nascent one; a photograph that brings news of some unsuspected zone of misery cannot
    make a dent in public opinion unless there is an appropriate context of feeling and attitude; the
    contribution of photography always follows the naming of the event; the 1972 photograph probably
    did more to increase public revulsion than a hundred hours of televised barbarities.
  confounders:
    - "reading it as saying images have no effect; she says they reinforce and can help build"
    - "missing the ordering claim, which is the strong version"
    - "assuming she resolves the counter-case; she states both and leaves them"

- qa_id: qa_snt_0018
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the comparison of two wars and the discussion of internment photographs (spine 5)'
  question: >
    Two sets of photographs of comparable events reach the same public and only one changes anything.
    Reconstruct Sontag's explanation, and state what she says the other set's absence was caused by.
  answer: >
    Her explanation is that the reception was determined by the political understanding already in
    place, not by the images. Photographs of one war's suffering circulated because journalists felt
    backed in obtaining them, the event having been defined by a significant number of people as a
    savage colonialist war; the other war was understood as part of a just struggle, and given that
    characterisation photographs of the cruelty of unlimited firepower would have been irrelevant.
    That is what she says caused the absence — not censorship but the absence of a place for such
    images: ideologically, there was no space for them, so nobody brought back photographs showing
    that the enemy had a human face. Her other case runs the same way through time rather than
    across two events: photographs of a wartime internment were read as a crime by Americans who had
    arrived at a political understanding two decades later, and could not have been read that way by
    people who saw them at the time, because the grounds for that judgement were covered over by a
    pro-war consensus.
  answer_type: application
  difficulty: hard
  knowledge_type: persuasion
  requires_application: true
  support: >
    In Plato's Cave: the public did not see such photographs because there was, ideologically, no
    space for them; Americans did have access to photographs of the suffering of the Vietnamese
    because journalists felt backed in their efforts, the event having been defined by a significant
    number of people as a savage colonialist war; the Korean War was understood differently, and given
    that characterisation such photographs would have been irrelevant; few people who saw the
    internment photographs in the 1940s could have had so unequivocal a reaction.
  confounders:
    - "explaining the difference by the quality or availability of the photographs"
    - "explaining it by censorship alone; her claim is that there was no place for the images to land"

# ── ACQUISITION, TOURISM, CONSUMPTION ────────────────────────────────────────

- qa_id: qa_snt_0019
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Image-World", the passage beginning "Photography is acquisition in several forms" (spine 10)'
  question: >
    Sontag separates three forms of photographic acquisition. Name them, and say which she calls the
    most inclusive and why.
  answer: >
    First, in its simplest form, surrogate possession of a cherished person or thing — which she says
    gives photographs some of the character of unique objects. Second, a consumer's relation to
    events, both those that are part of our experience and those that are not, a distinction she
    says habit-forming consumership blurs. Third, and the one she calls the most inclusive: acquiring
    something as information rather than as experience, through image-making and image-duplicating
    machines. It is the most inclusive because the others follow from it — the importance of
    photographic images as the medium through which events enter our experience is, she says, only a
    by-product of their effectiveness in furnishing knowledge dissociated from and independent of
    experience. Through being photographed, something is fitted into schemes of classification and
    storage, and reality is redefined as an item for exhibition, a record for scrutiny and a target
    for surveillance.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    The Image-World: photography is acquisition in several forms — surrogate possession of a cherished
    person or thing; a consumer's relation to events, a distinction such habit-forming consumership
    blurs; and, most inclusively, acquiring something as information rather than experience; reality
    as such is redefined — as an item for exhibition, as a record for scrutiny, as a target for
    surveillance.
  confounders:
    - "collapsing the three into 'photographs are possessions'"
    - "assuming the first is the most important; she says the third is the most inclusive"

- qa_id: qa_snt_0020
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the passage beginning "As photographs give people an imaginary possession of a past that is unreal" (spine 5)'
  question: >
    Sontag says the camera both certifies experience and refuses it. Explain how one act does both,
    and give the second, anxiety-based function she attributes to it.
  answer: >
    It does both because what certifies the experience is precisely the object that replaced it.
    Photographs offer indisputable evidence that the trip was made, the programme carried out, the fun
    had; and taking them refuses the experience by limiting it to a search for the photogenic and
    converting it into an image, a souvenir — so travel becomes a strategy for accumulating
    photographs. The anxiety function is separate and she is explicit about it: the very activity of
    taking pictures is soothing and assuages the disorientation travel is likely to exacerbate.
    Tourists unsure of other responses put the camera between themselves and whatever is remarkable,
    which gives shape to the experience — stop, take a photograph, and move on. She adds that the
    method especially appeals to the work-driven, for whom photographing is a friendly imitation of
    work that appeases the anxiety of not working while on holiday. That passage is loaded with the
    national caricatures of its period, which are noted rather than repeated here.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    In Plato's Cave: a way of certifying experience, taking photographs is also a way of refusing it —
    by limiting experience to a search for the photogenic, by converting experience into an image, a
    souvenir; travel becomes a strategy for accumulating photographs; the very activity of taking
    pictures is soothing; most tourists feel compelled to put the camera between themselves and
    whatever is remarkable; stop, take a photograph, and move on.
  confounders:
    - "treating certifying and refusing as two separate effects rather than one act"
    - "reading the anxiety claim as evidenced; it is asserted about inner states"

- qa_id: qa_snt_0021
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the passages on photographic seeing and on Weston''s claims (spine 8)'
  question: >
    What does Sontag mean by "photographic seeing", what does she grant it, and where does she
    directly contradict the photographers she is discussing?
  answer: >
    Photographic seeing is both a new way for people to see and a new activity for them to perform,
    and its content is the mentality that looks at the world as a set of potential photographs. She
    grants it two things: an aptitude for discovering beauty in what everybody sees but neglects as
    too ordinary, and a freedom from the narrow choices painters had to make about what was worth
    contemplating, because cameras record anything quickly. The direct contradiction is of the
    photographers' own accounts: one of them described photography as a way of identifying oneself
    with nature, and Sontag replies that contrary to what he asserts, the habit of looking at reality
    as an array of potential photographs creates estrangement from, rather than union with, what is
    seen — and that photographic seeing, examined, turns out to be mainly a kind of dissociative
    seeing. She offers argument rather than evidence for preferring her account of their experience
    to theirs.
  answer_type: source_position
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    The Heroism of Vision: photographic seeing was both a new way for people to see and a new activity
    for them to perform; it meant an aptitude for discovering beauty in what everybody sees but
    neglects as too ordinary; contrary to what Weston asserts, the habit of photographic seeing — of
    looking at reality as an array of potential photographs — creates estrangement from, rather than
    union with, nature; photographic seeing turns out to be mainly the practice of a kind of
    dissociative seeing.
  confounders:
    - "reading photographic seeing as a skill she recommends"
    - "missing that she is contradicting the practitioners' own testimony about their experience"

- qa_id: qa_snt_0022
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Image-World", the passage beginning "Photography does not simply reproduce the real, it recycles it" (spine 10)'
  question: >
    An image of one thing is placed in an advertisement for something entirely unrelated, and the
    pairing works. Name the quality Sontag says photography specialises in producing, give her
    formula for it, and give the single sentence with which she shows how far the erasure goes.
  answer: >
    The quality is "the interesting", and the pairing works because interest is relational. The formula: what makes something interesting is that it can be
    seen to be like, or analogous to, something else — so interest is relational rather than a
    property of the thing. Her surrounding claim is that photography does not simply reproduce the
    real, it recycles it: things and events are put to new uses and assigned new meanings which go
    beyond the distinctions between the beautiful and the ugly, the true and the false, the useful
    and the useless, good taste and bad. Clichés recycled become meta-clichés; the recycling makes
    clichés out of unique objects and distinctive artefacts out of clichés. The sentence showing how
    far the erasure goes: in the form of a photograph, the explosion of an atomic bomb can be used to
    advertise a safe. She adds the underlying condition — images are always compatible, or can be
    made compatible, even when the realities they depict are not.
  answer_type: application
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: >
    The Image-World: photography does not simply reproduce the real, it recycles it; photography is
    one of the chief means for producing that quality which erases these distinctions — "the
    interesting"; what makes something interesting is that it can be seen to be like, or analogous
    to, something else; clichés, recycled, become meta-clichés; in the form of a photograph the
    explosion of an A-bomb can be used to advertise a safe; images are always compatible, or can be
    made compatible, even when the realities they depict are not.
  confounders:
    - "treating 'the interesting' as ordinary interest rather than as her quasi-technical term"
    - "reading the recycling claim as being about reuse of assets rather than about the erasure of distinctions"

- qa_id: qa_snt_0023
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the opening passages on photographs as the standard of the beautiful (spine 8), and "The Image-World", the passage on how reality has come to seem (spine 10)'
  question: >
    Sontag describes a reversal between the image and what it depicts. State it, give her example
    about the self, and give the boundary she puts on the claim.
  answer: >
    The reversal is that the copy becomes the measure: photographs, rather than the world, have
    become the standard of the beautiful, and instead of just recording reality photographs have
    become the norm for the way things appear to us — so it is reality which is scrutinised and
    evaluated for its fidelity to photographs. Her example about the self is exact: we learn to see
    ourselves photographically, so that to regard oneself as attractive is precisely to judge that
    one would look good in a photograph. She also reports the reversal in ordinary speech — people
    describing a violent event they were caught up in as having seemed like a movie, said not to
    diminish it but because other descriptions seem insufficient: it is how they explain how real it
    was. The boundary is hers and it matters: she says that in some non-industrialised countries
    people still felt apprehensive at being photographed, sensing a trespass, whereas people in
    industrialised countries seek to have their photographs taken and feel they are made real by
    them. The claim is scoped to the second case.
  answer_type: source_position
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    The Heroism of Vision: photographs, rather than the world, have become the standard of the
    beautiful; we learn to see ourselves photographically; instead of just recording reality,
    photographs have become the norm for the way things appear to us; it is reality which is
    scrutinized and evaluated for its fidelity to photographs. The Image-World: reality has come to
    seem more and more like what we are shown by cameras; "it seemed like a movie" is said in order
    to explain how real it was.
  confounders:
    - "reading it as a claim that people confuse images with reality; her claim is about which is the reference"
    - "dropping the scope, which she states explicitly"

- qa_id: qa_snt_0024
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the passage beginning "Photographs may be more memorable than moving images" (spine 5), with "The Image-World", the account of an operation watched in person and on film (spine 10)'
  question: >
    Sontag contrasts the still with the moving image. Give her contrast, her account of what a film
    takes from the viewer, and the cost she attributes to the still's stasis.
  answer: >
    The contrast: photographs may be more memorable than moving images because they are a neat slice
    of time rather than a flow — a stream of underselected images cancels each predecessor with its
    successor, whereas a still is a privileged moment turned into a slim object one can keep and look
    at again, whose force is that it keeps open to scrutiny instants the normal flow of time
    immediately replaces. What a film takes is agency, and she draws it from her own experience of
    the same procedure watched in person and on film: in the room she was the one who changed focus
    and made the close-ups and the medium shots, while on film the camera had already looked for her
    and obliged her to look, leaving as her only option not to look — with the sequence condensed and
    arranged to stir or shock. The cost of the still's stasis is stated just as plainly: the truths
    that can be rendered in a dissociated moment, however significant or decisive, have a very narrow
    relation to the needs of understanding. Note that "may be more memorable" is her hedge, and that
    the unification of these passages under a single idea about who controls the duration of looking
    is a reading, not something she states.
  answer_type: comparison
  difficulty: hard
  knowledge_type: photography
  requires_application: false
  support: >
    In Plato's Cave: photographs may be more memorable than moving images, because they are a neat
    slice of time, not a flow; television is a stream of underselected images, each of which cancels
    its predecessor; each still photograph is a privileged moment. The Image-World: in the operating
    room I am the one who changes focus and makes the close-ups; in the theatre the camera looks for
    me and obliges me to look, leaving as my only option not to look. The Heroism of Vision: the
    truths rendered in a dissociated moment have a very narrow relation to the needs of understanding.
  confounders:
    - "treating the memorability claim as established; 'may be' is her hedge and she offers one contrast"
    - "assuming she prefers the still; she states its cost in the same book"

# ── APPLYING THE READING, NOT THE MAKING ─────────────────────────────────────

- qa_id: qa_snt_0025
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the passages on the caption and on meaning as use (spine 8)'
  question: >
    An image is being assessed on its own, and it will be published with a headline. Using only what
    Sontag claims, what is wrong with that assessment — and what is NOT fixed by assessing the pair
    together?
  answer: >
    What is wrong is the unit. A photograph is physically mute and talks through the mouth of the
    text placed with it, and words do speak louder than pictures — captions tend to override the
    evidence of our eyes. So an image assessed without the words it will travel with is not a weaker
    assessment of the same artefact; it is an assessment of a different one from the thing anyone
    will encounter. What assessing the pair together does not fix is the meaning itself. No caption
    can permanently restrict or secure a picture's meaning; even an entirely accurate caption is only
    one interpretation, and a limiting one; and the caption-glove slips on and off, so the next
    placement supplies its own. Assessing the pair removes an error that is certain and settles
    nothing beyond that. Note that Sontag prescribes nothing here — this is her account of how
    images are read, and the inference about the unit of assessment is drawn from it rather than
    stated by her.
  answer_type: application
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    The Heroism of Vision: this photograph, like any photograph, is physically mute, it talks through
    the mouth of the text written beneath it; words do speak louder than pictures; captions do tend to
    override the evidence of our eyes; but no caption can permanently restrict or secure a picture's
    meaning; even an entirely accurate caption is only one interpretation.
  confounders:
    - "concluding that a well-written caption controls the reading"
    - "treating the inference about the unit of assessment as Sontag's own recommendation"

- qa_id: qa_snt_0026
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave", the attrition passage (spine 5), and "The Heroism of Vision", the passage on conventions being used up (spine 8)'
  question: >
    Someone summarises Sontag as "people get numb to images they see a lot of". Which two of her
    claims does that collapse into one, and what does she say that makes the collapse a mistake?
  answer: >
    It collapses attrition of *response* into attrition of *convention*, and they have different
    drivers and different objects. The first is about a subject: photographs shock insofar as they
    show something novel, the shock of atrocity wears off with repeated viewing, and the ante keeps
    getting raised partly through the very proliferation of the images. The second is about a way of
    seeing: photographs create the beautiful and, over generations, use it up, because seeing
    accommodates to photographs — what once took a very intelligent eye to see, anyone can see now.
    What makes the collapse a mistake is her own qualification: increased familiarity does not
    entirely explain why certain conventions of beauty get used up while others remain, and the
    attrition is moral as well as perceptual. She names a residue that familiarity cannot account
    for, and does not analyse it — so a summary that reduces both to numbness through exposure
    discards the part of her argument she flags as unfinished.
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    In Plato's Cave: photographs shock insofar as they show something novel; the ante keeps getting
    raised; the shock wears off with repeated viewings. The Heroism of Vision: photographs create the
    beautiful and use it up; seeing tends to accommodate to photographs; what it once took a very
    intelligent eye to see, anyone can see now; increased familiarity does not entirely explain why
    certain conventions of beauty get used up while others remain — the attrition is moral as well as
    perceptual.
  confounders:
    - "treating the two as one habituation effect, which is the collapse the question is about"
    - "supplying a modern account of feed fatigue in place of her claims; she wrote in 1977 and this bank adds nothing to what she says"

- qa_id: qa_snt_0027
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"In Plato''s Cave" (spine 5) and "The Image-World" (spine 10), across the passages on evidence, on the trace, and on what photographs cannot do'
  question: >
    Sontag holds that a photograph is credited with a more innocent relation to reality than other
    made images, and also that photographs are as much an interpretation as paintings are. Is that a
    contradiction, and what does it tell you about how to use this source?
  answer: >
    It is a tension she states deliberately and does not resolve, and her essay runs on the friction
    between the two. Both are claims about different things: the first is about reception — how a
    photograph is taken by the people who look at it — and the second is about production, what went
    into making it. Her whole argument about authority depends on the gap between them, which is why
    the passage moves straight from the presumption of veracity to photographers imposing standards
    on their subjects. What it tells you about using the source is that its claims come in pairs and
    the pairs must be kept together: taking the reception claim alone makes her sound credulous about
    photographic truth, and taking the production claim alone makes her sound as though the
    presumption does not exist. Neither half is her position.
  answer_type: source_position
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    In Plato's Cave: a photograph — any photograph — seems to have a more innocent, and therefore more
    accurate, relation to visible reality than do other mimetic objects; although there is a sense in
    which the camera does indeed capture reality, photographs are as much an interpretation of the
    world as paintings and drawings are. Both appear within a few sentences of each other.
  confounders:
    - "resolving the tension in one direction, which loses the argument"
    - "treating it as an inconsistency to be corrected rather than as the structure of her case"

- qa_id: qa_snt_0028
  source_id: sontag-on-photography
  source_title: "Susan Sontag, On Photography (Farrar, Straus and Giroux / Picador; essays 1973-77, book 1977)"
  source_locator: '"The Heroism of Vision", the aestheticisation passages (spine 8), against "In Plato''s Cave", the passage on moral position (spine 5)'
  question: >
    Someone cites Sontag to argue that a particular photograph should have been composed differently
    so as not to aestheticise its subject. Is that a use of her argument? Answer from the text.
  answer: >
    No, and the reason is in the shape of the claim rather than in a matter of taste. Her claim is
    that photography still beautifies notwithstanding the declared aims of harsh, unposed photography
    to reveal truth and not beauty, and that this holds for the most well-intentioned and properly
    captioned work. A tendency that survives the intention to defeat it, and survives accurate
    captioning, is not one a different composition escapes — so the claim cannot ground a
    recommendation about composing. She also nowhere recommends anything: she describes what the
    medium does to a viewer's relation to a subject and stops. Her related claim about what images
    can accomplish runs the same way — photographs reinforce a moral position and do not create one,
    which is a statement about what determines an image's effect, not a specification for making one.
    Using her to prescribe a composition attributes to her a kind of statement she does not make
    anywhere in the book.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    The Heroism of Vision: notwithstanding the declared aims of indiscreet, unposed, often harsh
    photography to reveal truth, not beauty, photography still beautifies; in a consumer society, even
    the most well-intentioned and properly captioned work issues in the discovery of beauty. In
    Plato's Cave: photographs cannot create a moral position, but they can reinforce one.
  confounders:
    - "reading the aestheticisation claim as an instruction, which is the standard misuse of this source"
    - "assuming that because she disapproves of an effect she must be recommending against a technique"
    - "concluding instead that she thinks such images should not be made; she says nothing of the kind"
