    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      MOSTLY OURS. This is the system with the best claim to being in the source, because Sontag
      does state each member as a limit and does return to the theme. It is still our unification.
