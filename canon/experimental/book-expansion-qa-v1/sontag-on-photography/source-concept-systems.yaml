- scs_id: scs_snt_003
  source_id: sontag-on-photography
  label: the_aesthetic_cycle_and_the_wearing_out_of_response
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    The cluster in which the medium beautifies whatever it records, becomes the standard against
    which reality is then measured, exhausts the conventions of beauty it establishes, neutralises
    the distress it conveys, and blunts response by repetition and by time.
  whole_system_claim:
    text: >
      The medium's characteristic effects work against the purposes images are usually made to
      serve, and they do so by the same route rather than by several. Attention to how something
      appears is an aesthetic relation; the medium converts every subject into an object of that
      attention; and an aesthetic relation, once established, is subject to habituation. So the
      beautification, the shifted standard, the exhausted conventions, the neutralised distress and
      the blunted response are one process observed at different points.
    origin: extractor_synthesis
    interpretation_basis: >
      Sontag states each effect and, in two places, states a link between two of them — the
      beautification neutralising distress, and photographs creating the beautiful and using it up.
      What is the EXTRACTOR'S is the claim that ALL FIVE are one process with a single route. She
      never says that, and one member resists it: she explicitly warns that increased familiarity
      does not entirely explain why certain conventions of beauty get used up while others remain,
      and that the attrition is moral as well as perceptual — a residue she does not analyse and
      which a single-route account cannot absorb. The system is recorded with that objection inside
      it rather than smoothed over.
    source_ref: null
  members:
    - {sk_ref: sk_snt_0011, role_in_system: root_claim, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_snt_0022, role_in_system: consequence, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0012, role_in_system: consequence, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_snt_0013, role_in_system: consequence, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_snt_0014, role_in_system: consequence, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0015, role_in_system: consequence, order: 6, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0020, role_in_system: precondition, order: 7, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: causal
      origin: extractor_inferred
    dependencies:
      - {from: sk_snt_0013, to: sk_snt_0011, nature: "the neutralising of distress follows from the beautifying", origin: source_stated}
      - {from: sk_snt_0012, to: sk_snt_0011, nature: "what is used up is the beauty the medium created", origin: source_stated}
      - {from: sk_snt_0022, to: sk_snt_0011, nature: "the standard could only shift to photographs because the medium beautifies", origin: extractor_inferred}
      - {from: sk_snt_0012, to: sk_snt_0020, nature: "the exhausted conventions are conventions of photographic seeing", origin: extractor_inferred}
    tradeoffs: []
    conflicts:
      - between: [sk_snt_0014, sk_snt_0012]
        nature: >
          Two different attritions are described and Sontag distinguishes them herself: response to a
          SUBJECT wearing out through repeated exposure, and a CONVENTION of beauty being used up by
          assimilation. She states that familiarity does not entirely explain the second, which is a
          warning against collapsing them into one — and this system's whole-system claim comes close
          to collapsing them, which is why the objection is recorded here.
        origin: source_stated
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded, historical_claim]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: none
    system_level_uncertainty: >
      MOSTLY OURS, and this is the system whose whole-system claim the source most directly resists.
      Sontag's own concession — that the attrition is moral as well as perceptual and that
      familiarity does not entirely explain it — is a statement that the single route we propose is
      insufficient. The system is retained because the members genuinely cluster and because the
      cluster is the part of this book most likely to matter to anyone thinking about images that
      repeat; the objection is retained with it.
