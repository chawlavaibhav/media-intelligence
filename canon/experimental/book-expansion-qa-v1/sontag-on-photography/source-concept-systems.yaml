- scs_id: scs_snt_002
  source_id: sontag-on-photography
  label: what_a_photograph_cannot_do_on_its_own
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    The cluster of limits: the frame severs the subject from its circumstance; meaning is therefore
    supplied by placement and no placement secures it; the caption speaks for the mute image and
    still cannot fix it; the photograph acknowledges but cannot explain; identification of the
    subject dominates the reading; an image lands inside a frame of understanding it cannot itself
    supply; and the still holds a moment open at the cost of the duration that understanding needs.
  whole_system_claim:
    text: >
      A photograph is not a self-sufficient unit of meaning. Everything that would fix what it means
      — the circumstance, the naming of the event, the narration of how the thing functions — lies
      outside the frame, and the devices that attach meaning from outside are detachable. The limits
      are therefore not defects to be designed around; they are constitutive, and any claim about
      what an image will do must be a claim about the image together with what surrounds it.
    origin: extractor_synthesis
    interpretation_basis: >
      Sontag states every limit and states several of them as limits. What is the EXTRACTOR'S is the
      claim that they are ONE limit seen from different sides — that severance, unsecured meaning,
      the detachable caption, the inability to explain and the dependence on a prior naming are the
      same insufficiency. She never says this; the members are spread across two essays and are
      raised in service of different arguments, the caption material in a discussion of Benjamin and
      the naming material in a discussion of American political consciousness. The unification is a
      hypothesis about her position, and it is contestable in one specific way: sk_snt_0010, that
      what a photograph is of dominates how it is seen, could as easily be filed under the authority
      cluster, since it follows from the photograph being received as a piece of the world.
    source_ref: null
  members:
    - {sk_ref: sk_snt_0006, role_in_system: mechanism, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0007, role_in_system: consequence, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_snt_0008, role_in_system: failed_remedy, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_snt_0009, role_in_system: limit, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0010, role_in_system: limit, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0016, role_in_system: limit, order: 6, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0017, role_in_system: qualification, order: 7, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0021, role_in_system: consequence, order: 8, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - {from: sk_snt_0007, to: sk_snt_0006, nature: "if the frame severed the circumstance, meaning must come from placement", origin: source_stated}
      - {from: sk_snt_0008, to: sk_snt_0007, nature: "the caption is the obvious candidate for securing meaning and she says it cannot", origin: source_stated}
      - {from: sk_snt_0016, to: sk_snt_0009, nature: "an image that cannot explain cannot supply the frame it needs to be read within", origin: extractor_inferred}
      - {from: sk_snt_0021, to: sk_snt_0007, nature: "recycling is possible precisely because no placement secures a meaning", origin: extractor_inferred}
    tradeoffs:
      - between: [sk_snt_0017, sk_snt_0009]
        nature: >
          The stasis that gives a still its force — keeping open to scrutiny an instant the flow of
          time would replace — is the same stasis that removes the duration understanding requires.
          Sontag states both.
        origin: source_stated
        source_ref: {chapter: '"In Plato''s Cave" and "The Heroism of Vision" (spines 5, 8)', page_start: null}
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
