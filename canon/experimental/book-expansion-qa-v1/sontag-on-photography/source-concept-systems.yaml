# SourceConceptSystem — Susan Sontag, "On Photography" (essays 1973-77, book 1977).
# source_id: sontag-on-photography
# EXPERIMENTAL — NOT LIVE CANON.
# LOCATORS: EPUB, reflowable. NO AUTHORED PAGE NUMBERS. page_start/page_end are null everywhere.
#
# THREE SYSTEMS, AND ALL THREE ARE LARGELY OURS. This is a book of essays that argues by
# accumulation and allusion; it contains no framework, no numbered set and no stated structure of
# any kind. Every whole_system_claim below therefore carries origin: extractor_synthesis with a
# non-null interpretation_basis, and every system_type_origin is extractor_inferred. A reader should
# treat these as three hypotheses about how her recurring arguments relate, not as anything she says.
#
# The temptation this file resists is worth naming: an essayist who returns to the same themes across
# six essays LOOKS like she is building a framework. She is not, and inventing one for her would be
# the characteristic way of getting this source wrong.

source_id: sontag-on-photography

source_concept_systems:

- scs_id: scs_snt_001
  source_id: sontag-on-photography
  label: the_authority_of_the_photograph_and_what_it_licenses
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    The cluster of claims about why a photograph is trusted differently from a made image, and what
    follows from that trust: the photograph as trace rather than depiction; its reception as a piece
    of the world rather than a statement about it; the selection that this reception conceals; the
    consequence that faking it falsifies reality rather than art history; and the acquisitive
    relation — possession, tourism — that the trust makes available.
  whole_system_claim:
    text: >
      The photograph's authority is causal rather than evidential: it is credited because light from
      the subject made it, not because it is accurate. Everything else in the cluster follows from
      that misattribution. Because the credit is given to the causal link, the human decisions that
      produced the frame are not looked for; because the image is received as a piece of the world,
      possessing it feels like knowing; and because the claim it makes is about the world rather than
      about its own authorship, corrupting it — by retouching or by caption — corrupts a claim about
      the world.
    origin: extractor_synthesis
    interpretation_basis: >
      Each member is stated by Sontag, several of them memorably, but she never assembles them and
      never presents the trace as the root of the others. The trace argument is in "The Image-World";
      the reception-as-evidence argument and the acquisitive relation are in "In Plato's Cave"; the
      faking argument is in "The Heroism of Vision". The claim that the first explains the rest is
      the EXTRACTOR'S ordering of three essays written up to four years apart. Two things make it
      contestable and both are recorded: the acquisition material can be read as an independent
      argument about consumption that owes nothing to the trace, and Sontag herself asserts within
      "In Plato's Cave" that photographs are as much an interpretation as paintings are, which sits
      awkwardly with a system organised around what makes them different in kind.
    source_ref: null
  members:
    - {sk_ref: sk_snt_0003, role_in_system: root_claim, order: 1, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0001, role_in_system: consequence, order: 2, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0002, role_in_system: qualification, order: 3, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0004, role_in_system: consequence, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_snt_0018, role_in_system: consequence, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_snt_0019, role_in_system: instance, order: 6, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: causal
      origin: extractor_inferred
    dependencies:
      - {from: sk_snt_0004, to: sk_snt_0003, nature: "the claim to be true, which faking corrupts, is the trace's claim", origin: source_stated}
      - {from: sk_snt_0019, to: sk_snt_0018, nature: "tourism is the acquisitive relation performed as travel", origin: source_stated}
      - {from: sk_snt_0001, to: sk_snt_0003, nature: "the presumption of veracity is credit given to the causal link", origin: extractor_inferred}
    tradeoffs: []
    conflicts:
      - between: [sk_snt_0001, sk_snt_0002]
        nature: >
          Sontag states within one passage both that a photograph seems to have a more innocent and
          therefore more accurate relation to reality than other made images, and that photographs
          are as much an interpretation of the world as paintings and drawings are. She does not
          reconcile them; the essay's argument runs on the friction between them.
        origin: source_stated
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, historical_claim, culturally_bounded]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      MOSTLY OURS. The members are hers and the causal ordering is ours, assembled across three
      essays. Sontag writes no system anywhere in this book. The whole cluster also rests on a
      premise she never examines because in 1977 it did not need examining — that an image which
      looks photographic was made by a camera pointed at something — and if that premise is the
      root, then the root is the least argued part of the structure.
  provenance:
    chapter: '"In Plato''s Cave" (spine 5), "The Heroism of Vision" (spine 8), "The Image-World" (spine 10)'
