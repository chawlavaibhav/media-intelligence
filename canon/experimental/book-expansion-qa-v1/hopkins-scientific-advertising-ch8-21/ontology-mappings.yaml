relationships:

# ── internal: checked resemblances rejected ──────────────────────────────────
- from: t_sa8_0035
  to: t_sa8_0034
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked and rejected as the same thing. The test campaign (ch.15) measures absolute levels in
    four or five towns with no comparison arm; the paired-town comparison (ch.13, ch.16) holds an
    arm back and compares. One answers "is this viable", the other "is A better than B", and only
    the second controls anything. The source uses "test" for both and never separates them, which
    is why the distinction is recorded here.

- from: t_sa8_0005
  to: t_sa8_0007
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Both are reasons a project cannot pay for itself and the mechanisms are unrelated. Altruistic
    advertising fails because the demand created leaks to rivals; the one-sale article fails because
    the customer, once acquired and retained exclusively, still does not spend enough. A remedy for
    one — co-operative advertising — does nothing for the other.

- from: t_sa8_0009
  to: t_sa8_0008
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Both make a narrow claim a bad choice and they are not the same failure. Waste circulation is
    arithmetic: the claim reaches too few. Claim interference is an asserted interaction: the narrow
    claim damages the broad one by being present. The source states the second without a mechanism
    and the two would be repaired differently — one by choosing the bigger claim, the other by
    removing the smaller one even where space is free.

- from: t_sa8_0010
  to: t_sa8_0019
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: >
    Checked because both are sample errors the source condemns in one chapter, and rejected as one
    concept. Charging retards the reply before it happens; promiscuous distribution spoils the
    reception after it happens. The remedies are opposite in direction — make it cost nothing, and
    do not give it to anyone who has not asked — which is the tension recorded at scs_sa8_004.

- from: t_sa8_0003
  to: t_sa8_0004
  relation: broader_than
  confidence_basis: extractor_judgement
  note: >
    Overshadowing the headline is one way of buying useless attention; the source also applies the
    broader term to colour used to amuse and to conspicuous dress in a salesman.

- from: t_sa8_0016
  to: t_sa8_0012
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Both are attribution failures at different levels. The secret tonic credits a whole growing
    business to its advertising; swung trade credits a redistribution between shops to a dealer aid.
    Both are corrected by choosing a different unit of measurement, which is why they are related
    rather than distinct — but the units differ (the business against the campaign; the town against
    the dealer).

- from: t_sa8_0017
  to: t_sa8_0004
  relation: same_mechanism
  confidence_basis: extractor_judgement
  note: >
    The source states the identity itself: fine stationery indicates "an effort to sell on other
    lines than merit" and "That has the same effect in letters as in ads", which is the same
    suspicion-of-visible-effort argument used against the eccentric picture. Recorded as
    `same_mechanism` on the source's own assertion, not on our inference.

- from: t_sa8_0034
  to: t_sa8_0036
  relation: related_to
  confidence_basis: extractor_judgement
  note: >
    Both compare arms. The letter cell test specifies arm count and cell size; the paired-town
    comparison specifies neither. Not equivalent — one runs inside a mailing list, the other across
    markets — but the same experimental idea, better specified in the direct-mail case.

