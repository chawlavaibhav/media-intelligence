#    this source cannot supply a second independent origin against the live chapters 1-7 — it is
#    the same book.
#  * `same_failure_family` is NOT used anywhere; it requires human review under SPEC-05 governance.
#  * Terms already registered by the live chapters 1-7 extraction are NOT re-created. Where
#    chapters 8-21 use the same word for the same thing, the live term stands and this file records
#    a relationship to it rather than a duplicate. Nine such checks were made; see
#    EXTRACTION-NOTES.md section 5.
#  * Relationships pointing at `t_hop_sa_*` are OBSERVATIONS against live Canon recorded from this
