# SPEC-05 knowledge ontology — terms, relationships, concepts.
#
# EXPERIMENTAL — NOT LIVE CANON. Lane: canon/experimental/book-expansion-qa-v1/.
# SCOPE EXTENSION of the live `hopkins_scientific_advertising_ch1_7`. Same work, same author.
#
# RULES OBSERVED HERE:
