source_id: hopkins-scientific-advertising-ch8-21
extraction_date: 2026-08-30

terms:

# ── problems ─────────────────────────────────────────────────────────────────

- term_id: t_sa8_0001
  term: the_serial_advertisement
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    A case split across issues, either as one claim at a time or as an advertisement continued
    later. The source's words: "There is no greater folly. Those serials almost never connect."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0001]

- term_id: t_sa8_0002
  term: space_spent_on_present_users
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    Any line of paid body copy addressed to people already using the product, who the source says
    have read and decided and will not read the advertising. "So never waste one line of your space
    to say something to present users, unless you can say it in headlines."
  first_seen: 2026-08-30
  verbatim: false
  arising_from: [sk_sa8_0003]

- term_id: t_sa8_0003
  term: useless_attention
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    Attention obtained from people who cannot become customers, at the cost of attention from those
    who can. "Don't, to gain general and useless attention, sacrifice the attention that you want."
    Applied to eccentric pictures and to colour used to amuse.
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0007, sk_sa8_0008]

- term_id: t_sa8_0004
  term: overshadowing_the_headline
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    A pictorial element that wins the reader's attention away from the headline, where the source
    says the main appeal lies. "Over-shadow that and you kill it."
  first_seen: 2026-08-30
  verbatim: false
  arising_from: [sk_sa8_0007]

- term_id: t_sa8_0005
  term: altruistic_advertising
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    Advertising that creates category demand which competitors share. The source's word, of a maker
    educating people to the tooth-brush habit: "The object is commendable, but altruistic. The new
    business he creates is shared by his rivals."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0011]

- term_id: t_sa8_0006
  term: the_same_folly_on_a_smaller_scale
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    Conceding that an object is unaffordable and then devoting a share of the advertising space to
    it anyway. "What cannot be done on a large scale profitably cannot be done on a small scale...
    That is only the same folly on a smaller scale."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0010]

- term_id: t_sa8_0007
  term: the_one_sale_article
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    A product whose consumption per customer is too small for the revenue to repay the cost of
    acquiring the customer, however wide its appeal. The source's case is a germicide sellable to
    half the homes in the country whose "revenue per customer might not in ten years repay the cost
    of getting".
  first_seen: 2026-08-30
  verbatim: false
  arising_from: [sk_sa8_0012]

- term_id: t_sa8_0008
  term: waste_circulation
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    The share of a bought circulation that cannot contain a prospect, which the source names as the
    dominant term in advertising cost: "The cost of advertising largely depends on the percentage of
    waste circulation." Its worked form is covering a hundred useless readers to reach one.
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0014, sk_sa8_0017]

- term_id: t_sa8_0009
  term: claim_interference
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    A narrow claim damaging a broad one by being present at all, rather than merely reaching fewer
    people. "To even mention the eczema claims might destroy the beauty claim." The source gives no
    mechanism for it.
  first_seen: 2026-08-30
  verbatim: false
  arising_from: [sk_sa8_0013]

- term_id: t_sa8_0010
  term: waifs_on_the_doorsteps
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    Samples distributed to people who did not ask for them and have not been told the story. "Samples
    distributed to homes, like waifs on the doorsteps, probably never pay... The product is cheapened.
    It is not introduced in a favorable way."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0027]

- term_id: t_sa8_0011
  term: a_convert_who_cannot_be_supplied
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    A prospect persuaded in a place where the product cannot be bought — the full cost of conversion
    paid and none of the revenue collectable. "Mailing a sample may make a convert who cannot be
    supplied." Its campaign-scale form: "nine in ten of the converts fail to find the goods."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0032, sk_sa8_0030]

- term_id: t_sa8_0012
  term: trade_swung_from_one_store_to_another
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    An effect visible at one dealer and absent from the town total, produced by dealer discounts,
    loading offers or window displays. "They merely swing trade from one store to another." The
    failure is one of measurement level as much as of expenditure.
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0038]

- term_id: t_sa8_0013
  term: a_sale_without_a_convert
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    A purchase made on a casual recommendation rather than by conviction, which the source says does
    not produce a permanent customer: "People who buy through casual recommendations do not often
    stick. Next time someone else gives other advice."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0039]

- term_id: t_sa8_0014
  term: frivolity_in_a_name
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    Triviality arrived at while seeking uniqueness in a coined name. "And that is a fatal handicap
    in a serious product. It almost prohibits respect."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0047]

- term_id: t_sa8_0015
  term: the_name_that_expires
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    A patented product's exclusive name becoming common property when the patent lapses — Castoria,
    Aspirin, Shredded Wheat Biscuit — which the source says "often makes a patent an undesirable
    protection".
  first_seen: 2026-08-30
  verbatim: false
  arising_from: [sk_sa8_0047]

- term_id: t_sa8_0016
  term: the_secret_tonic
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    Unmeasured advertising surviving by default attribution inside a growing business. "So he takes
    it like some secret tonic which others have endorsed. If the business thrives, the tonic gets
    the credit. Otherwise, the failure is due to fate."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0048]

- term_id: t_sa8_0017
  term: fine_stationery
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    Expensive paper, postage and printed pamphlets in a selling letter, which the source says
    actively reduce response: "They indicate an effort to sell on other lines than merit."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0044]

- term_id: t_sa8_0018
  term: the_postponed_action
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    An intention held and not executed. "People are naturally dilatory. They postpone, and a
    postponed action is too often forgotten."
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0045]

- term_id: t_sa8_0019
  term: charging_for_the_sample
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: problem
  definition_in_origin_frame: >
    Asking a prospect for a dime, a stamp, or half the price. "Putting a price on a sample greatly
    retards replies. Then it prohibits you from using the word 'Free' in your ads." The cost is
    given as 40 cents to $1 added to each reply.
  first_seen: 2026-08-30
  verbatim: false
  arising_from: [sk_sa8_0024]

# ── remedies ─────────────────────────────────────────────────────────────────

- term_id: t_sa8_0020
  term: every_important_claim_in_one_reading
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    "So present to the reader, when once you get him, every important claim you have." Length is not
    prescribed; completeness is, and the source states there is no fixed rule on brevity.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0001]

- term_id: t_sa8_0021
  term: the_accumulated_claim_list
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    A standing set of claims qualified individually by headline comparison and thereafter carried in
    every advertisement. "Gradually they accumulate a list of claims important enough to use. All
    those claims appear in every ad thereafter."
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0002]

- term_id: t_sa8_0022
  term: better_than_the_same_space_set_in_type
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    The admission test for any picture. "Use them only when they form a better selling argument than
    the same amount of space set in type." A comparison, not a quality standard.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0005]

- term_id: t_sa8_0023
  term: picture_the_coveted_condition
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    Depict the position the buyer wants to reach rather than the article or the defect: "picturing
    men whom others envy, in surroundings which others covet"; "Picture what others wish to be, not
    what they may be now."
  first_seen: 2026-08-30
  verbatim: true
  executable_by: physical_production
  executable_by_note: >
    In the source's frame this is a commissioned drawing or photograph for a 1923 print
    advertisement. Recorded as physical production and NOT translated into a generative
    instruction; the corresponding binding is a production candidate with a null target path.
  arising_from: [sk_sa8_0006, sk_sa8_0042]

- term_id: t_sa8_0024
  term: ride_the_created_want
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    "watch the development of a popular trend, the creation of new desires. Then at the right time
    offer to satisfy those desires" — as against paying to create the desire, which competitors
    share.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: unknown
  executable_by_note: >
    A market-timing decision taken outside any artefact. None of the five permitted values
    describes it; `unknown` is recorded rather than forcing a fit.
  arising_from: [sk_sa8_0011]

- term_id: t_sa8_0025
  term: the_commissioned_figure
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    Sending the product for measurement in order to convert a true but vague claim into an exact
    one, then restating it against a familiar comparison: "425 calories per pint. One pint is equal
    to six eggs in calories of nutriment."
  first_seen: 2026-08-30
  verbatim: false
  executable_by: unknown
  executable_by_note: >
    Commissioning a laboratory measurement is a research action, not an edit or a production step.
    `unknown` is the honest value.
  arising_from: [sk_sa8_0019]

- term_id: t_sa8_0026
  term: the_appointed_censor
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    A domain authority who passes on every advertisement in a technical line, guarding against a
    well-informed writer drawing wrong inferences from correct facts. Distinct from verifying the
    facts themselves.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0018]

- term_id: t_sa8_0027
  term: the_seeming_advantage
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    The source's own phrase for what a parity product must be given: "there is nearly always
    something impressive which others have not told. We must discover it. We must have a seeming
    advantage." Recorded verbatim; the source does not require the advantage to be real, only
    perceived.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0022]

- term_id: t_sa8_0028
  term: the_free_full_size_package_coupon
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    A coupon good at any store for a full-size package, pre-announced to dealers with a proof of the
    advertisement and the circulation of the media to be used, so that dealers stock ahead of the
    demand they can see arriving.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: physical_production
  executable_by_note: >
    Bearer coupons, retailer redemption, mailed proofs and printed circulation lists. Wholly a 1923
    physical distribution mechanism. NOT translated.
  arising_from: [sk_sa8_0031]

- term_id: t_sa8_0029
  term: local_redemption
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    Having a sample collected at a nearby shop rather than requested by post, on the reported ground
    that the same advertisement produced inquiries at 18-22 cents rather than 70 cents. "it is always
    best, where possible, to have samples delivered locally."
  first_seen: 2026-08-30
  verbatim: true
  executable_by: physical_production
  arising_from: [sk_sa8_0026]

- term_id: t_sa8_0030
  term: the_three_part_sample_gate
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    "Give samples to interested people only. Give them only to people who exhibit that interest by
    some effort. Give them only to people to whom you have told your story." Three conditions,
    stated as three sentences.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0027]

- term_id: t_sa8_0031
  term: only_one_sample_to_a_home
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    A printed declaration used in place of enforcement, alongside "adults only", unannounced offer
    dates and Sunday insertion. The source reports checking repeaters and finding the loss smaller
    than the cost of the check.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0028]

- term_id: t_sa8_0032
  term: naming_the_stocked_dealers
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    Listing stocked retailers in the first local advertisements, on the ground that "the average
    dealer wants to be included", and adding names as others stock until the trade can be referred
    to all dealers.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit
  arising_from: [sk_sa8_0030]

- term_id: t_sa8_0033
  term: routing_the_respondent_through_a_shop
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    Never posting the sample to an out-of-town inquirer; sending it instead to a shop near him and
    referring him there, because "the store which supplies the sample will usually supply demand".
  first_seen: 2026-08-30
  verbatim: true
  executable_by: physical_production
  arising_from: [sk_sa8_0032]

- term_id: t_sa8_0034
  term: the_paired_town_comparison
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    "Try one town in one way, one in another. Compare total sales in those towns." Used in chapter
    13 to settle whether sampling pays and in chapter 16 to settle whether dealer displays do. The
    measure is the town TOTAL, which is what distinguishes it from measuring at a dealer.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: unknown
  executable_by_note: >
    A market experiment, not an artefact operation. `unknown` recorded rather than forcing one of
    the four concrete values.
  arising_from: [sk_sa8_0029, sk_sa8_0038]

- term_id: t_sa8_0035
  term: the_test_campaign
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    Four or five towns, users started with a sample or free package, measuring cost per customer
    started and then repeat purchase, purchase volume and payback period. Cost put at $3,000 to
    $5,000. No comparison arm is required by the procedure as the source describes it.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: unknown
  arising_from: [sk_sa8_0033]

- term_id: t_sa8_0036
  term: the_letter_cell_test
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    "He may try twenty-five letters, each with a thousand prospects." Equal cells, twenty-five arms,
    run before a five-million-piece mailing is bought, capable of abandoning the plan as well as of
    ranking the letters. The most precisely specified design in the book.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: unknown
  arising_from: [sk_sa8_0043]

- term_id: t_sa8_0037
  term: the_becoming_individuality
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    A constructed manner and tone selected against the audience — rugged and honest, a good fellow,
    or an authority — and thereafter held constant, with writers coached into it: "He plays a part
    as an actor plays it."
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0040, sk_sa8_0041]

- term_id: t_sa8_0038
  term: assume_the_action
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    "Assume that people will do what you ask. Say, 'Send now for this sample.' Don't say, 'Why do
    you neglect this offer?'" Naming the negative behaviour is said to suggest that it is normal.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0042]

- term_id: t_sa8_0039
  term: the_dated_limit
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    An offer that expires on a stated date, used to force a prompt decision. "You can afford to pay
    for prompt action rather than lose by delay."
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0045]

- term_id: t_sa8_0040
  term: a_name_that_tells_a_story
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    A protectable name that also describes the product, so the prominent display it receives anyway
    carries a selling argument. Cream of Wheat, Dutch Cleanser, 3-in-One Oil, Holeproof.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0046]

- term_id: t_sa8_0041
  term: the_five_dollar_read_through_offer
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: remedy
  definition_in_origin_frame: >
    "End an ad with an offer to pay five dollars to anyone who writes you that he read the ad
    through." Proposed as a one-week diagnostic for advertising whose readership is unknown. The
    source predicts the result in the same breath and reports no run of it.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_sa8_0048]

# ── properties ───────────────────────────────────────────────────────────────

- term_id: t_sa8_0042
  term: cost_per_customer_started
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: property
  definition_in_origin_frame: >
    The first quantity a test campaign reads: what it cost to get one user started, before any
    question of whether that user repeats. Distinguished by the source from cost per reply and from
    cost per customer.
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0033]

- term_id: t_sa8_0043
  term: payback_period
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: property
  definition_in_origin_frame: >
    "How long does it take for the profit to return our cost of selling?" The output that determines
    how a national campaign must be financed — before the bills are due at one extreme, three months
    at another.
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0033]

- term_id: t_sa8_0044
  term: the_reachable_percentage
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: property
  definition_in_origin_frame: >
    "the percentage of readers to whom our product appeals", gathered by class because it may differ
    on farms and in cities. Its reciprocal is the multiplier on cost per result: one in a hundred
    against one in five is twenty times the cost.
  first_seen: 2026-08-30
  verbatim: true
  arising_from: [sk_sa8_0014, sk_sa8_0017]

- term_id: t_sa8_0045
  term: cost_of_inquiry_by_route
  origin: source
  origin_ref: hopkins-scientific-advertising-ch8-21
  kind: property
  definition_in_origin_frame: >
    The cost of one inquiry as a function of how the reader is asked to respond, holding the
    advertisement constant. Reported at 70 cents by mail against 18-22 cents when the coupon is
    presented at a local store.
  first_seen: 2026-08-30
