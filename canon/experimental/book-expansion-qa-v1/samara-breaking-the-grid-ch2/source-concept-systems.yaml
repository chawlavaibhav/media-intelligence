- scs_id: scs_sgb_002
  source_id: samara-breaking-the-grid-ch2
  label: the_named_strategies_for_breaking_structure
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    The chapter's catalogue of ways to organise without a conventional grid, each with the mechanism
    the source attributes to it. Two families deconstruct an existing grid — orthogonally by
    splitting, splicing and shifting, and non-orthogonally by deformation and distortion. One derives
    structure from the content's own verbal properties. One returns to the pre-grid classical
    architecture of the centred axis. The rest source structure from outside the page altogether:
    from formal instinct, from the imagery, from a narrative idea, from a borrowed vernacular, or
    from a chance operation. The source presents these as a set the designer chooses from, not as a
    progression, and states explicitly that they are neither comprehensive nor mutually exclusive.
  whole_system_claim:
    text: >
      Each strategy differs from the others in where the structure's authority comes from — the grid
      being altered, the format's centre, the language of the text, the designer's eye, the imagery,
      a depicted idea, a borrowed style, or a chosen generator — and that source of authority, rather
      than the resulting appearance, is what makes the arrangement legible as a system.
    origin: extractor_synthesis
    interpretation_basis: >
      The strategies and their mechanisms are the source's, stated under its own sub-headings and in
      its own vocabulary. The organising principle offered here — that they are distinguished by the
      origin of the structure's authority — is the extractor's, and the source never says it. It is
      recorded because without some organising principle the set is a list of nine unrelated
      techniques, and because that reading is what connects the set to the chapter's own statement
      that structural approaches may be combined.
    source_ref:
  members:
  - {sk_ref: sk_sgb_0010, role_in_system: member, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0014, role_in_system: member, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0015, role_in_system: member, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0019, role_in_system: member, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0023, role_in_system: member, order: 5, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0024, role_in_system: member, order: 6, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0025, role_in_system: member, order: 7, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0026, role_in_system: member, order: 8, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0027, role_in_system: member, order: 9, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0028, role_in_system: member, order: 10, membership_origin: source_stated}
