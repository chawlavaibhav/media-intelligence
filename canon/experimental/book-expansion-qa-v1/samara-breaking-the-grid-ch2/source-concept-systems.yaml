    - {from: sk_sgb_0034, to: sk_sgb_0033, note: "eye path is a gradient of contrast", origin: extractor_inferred}
    tradeoffs:
    - {between: [sk_sgb_0030, sk_sgb_0035], note: "the source's own 'without necessarily diluting its inventiveness' concedes the repair may cost some of the invention", origin: extractor_inferred}
