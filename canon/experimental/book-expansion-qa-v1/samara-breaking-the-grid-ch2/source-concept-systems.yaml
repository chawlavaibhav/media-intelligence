source_concept_systems:

- scs_id: scs_sgb_001
  source_id: samara-breaking-the-grid-ch2
  label: the_warrant_and_its_price
  label_origin: extractor_assigned
  system_type: decision_framework
  system_type_origin: extractor_inferred
  description: >
    The chapter's argument for departing from the grid, taken with the obligation it attaches. The
    licence and the duty are stated in different places — the licence in the chapter opening, the
    duty forty pages of running text later under "Considering the Practical in the Impractical" —
    and reading either without the other misrepresents the chapter. The grid is a convention fitted
    to particular goals; clarity means different things in different contexts; every structure is
    functionally as valid as any other and differs only in what it makes content mean; therefore
    context, not habit, selects the system. Having granted that, the source concedes in full that
    any approach flying in the face of convention will be fraught with difficulties, and makes the
    designer responsible for identifying those difficulties objectively and resolving them.
  whole_system_claim:
    text: >
      Departing from the grid is warranted when the content's own internal structure, the emotional
      or narrative reaction sought, or the depth of intellectual involvement wanted, is better served
      by some other organisation than by the grid — and the departure is only complete when the
      difficulties it creates for the viewer have been identified and addressed to a necessary level
      of practicality. The chapter is not a licence for arbitrary arrangement; it exchanges a
      structural constraint for a diagnostic one.
    origin: extractor_synthesis
    interpretation_basis: >
      Every clause is the source's, but the source never assembles them into a single conditional.
      The joining of the opening argument to the practicality obligation, and the characterisation
      of the exchange as one constraint for another, are the extractor's. Samara asserts the parts
      separately and in different registers — the opening is polemical, the practicality section is
      remedial.
    source_ref:
  members:
  - {sk_ref: sk_sgb_0001, role_in_system: premise, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0002, role_in_system: condition, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0003, role_in_system: premise, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0009, role_in_system: premise, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0030, role_in_system: obligation, order: 5, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0031, role_in_system: diagnostic, order: 6, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0041, role_in_system: boundary, order: 7, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: causal, origin: extractor_inferred}
    dependencies:
    - {from: sk_sgb_0030, to: sk_sgb_0001, note: "the obligation is what the licence costs", origin: extractor_inferred}
    - {from: sk_sgb_0031, to: sk_sgb_0030, note: "names the two places the diagnosis should look", origin: extractor_inferred}
    tradeoffs:
    - {between: [sk_sgb_0001, sk_sgb_0041], note: "freedom of structure against usability requirements the source refuses to relax", origin: extractor_inferred}
    conflicts: []
  source_warns_against_isolated_use: true
  source_warning_ref: sk_sgb_0030
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: none
    system_level_uncertainty: >
      The members are all explicit source claims and none was invented. The system is ours: Samara
      writes a chapter, not a decision framework, and the causal ordering imposed here is the
      extractor's reading. The strongest thing that can be said is that a reader who took only the
      opening three paragraphs would misstate the chapter's position, and this system exists to stop
      that.
  provenance:
    chapter: "2 Breaking the Grid"
