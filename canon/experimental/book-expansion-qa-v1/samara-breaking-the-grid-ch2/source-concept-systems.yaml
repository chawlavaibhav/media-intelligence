# SourceConceptSystems — Timothy Samara, "Making and Breaking the Grid", 2nd ed. (Rockport, 2017),
# Chapter 2 "Breaking the Grid" (spine 6).
# source_id: samara-breaking-the-grid-ch2   |   scope_extension_of: samara-making-breaking-grid-ch1
# EXPERIMENTAL — NOT LIVE CANON.
# LOCATORS: EPUB, reflowable. NO AUTHORED PAGE NUMBERS. page_start/page_end are null everywhere.
#
# Four systems are recorded. Two of them (001, 003) are close to the chapter's own architecture and
# say so; two (002, 004) are the extractor's arrangement of material the source presents as a list
# or as scattered exhibit commentary, and each states in system_level_uncertainty how much is ours.
