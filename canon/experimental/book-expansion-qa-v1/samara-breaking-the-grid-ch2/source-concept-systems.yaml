- scs_id: scs_sgb_003
  source_id: samara-breaking-the-grid-ch2
  label: making_the_impractical_practical
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: source_stated
  description: >
    The remedial half of the chapter, which the source itself presents as an ordered treatment under
    one heading: state the obligation, name the two aspects where navigation trouble originates,
    give the controls for each, then ease the dissonance the approach creates — first in the
    typography, then in the images, then in the information graphics, where the remedies are
    themselves explicitly ranked.
  whole_system_claim:
    text: >
      An unconventional layout is made workable by attending, in order, to whether the reader can
      tell what matters (optical differentiation), whether the reader can tell where to go next (eye
      path), and whether the parts read as one thing (dissonance) — with the strongest available
      repair tried before the weakest, as the information-design sequence makes explicit.
    origin: extractor_synthesis
    interpretation_basis: >
      The sub-headings and their order are the source's own. What is the extractor's is the reading
      of that order as a working sequence with a strongest-repair-first principle. The source states
      the ranking only once, for information graphics, and the generalisation of it to the other
      remedies is ours.
    source_ref:
  members:
  - {sk_ref: sk_sgb_0030, role_in_system: step, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0031, role_in_system: step, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0032, role_in_system: step, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0033, role_in_system: step, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0034, role_in_system: step, order: 5, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0035, role_in_system: step, order: 6, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0036, role_in_system: step, order: 7, membership_origin: source_stated}
  - {sk_ref: sk_sgb_0037, role_in_system: step, order: 8, membership_origin: source_stated}
  internal_structure:
