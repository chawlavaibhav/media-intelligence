- scs_id: scs_sgb_004
  source_id: samara-breaking-the-grid-ch2
  label: what_makes_disorder_read_as_designed
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    The chapter's account of why some structureless layouts read as crafted and others as chaotic.
    It is assembled from four places that never reference each other: the rule that a system of
    irregular parts must still hold two or three rules consistently; the observation that a variation
    which does not complete across a set disunifies; the exhibit commentaries that credit rhythmic
    cohesion to a restricted family of axes; and the exhibit commentaries that report apparently
    artless results as the product of obsessive control.
  whole_system_claim:
    text: >
      Disorder reads as intentional when a small, consistently applied substructure survives beneath
      it — few rules, completed variations, a restricted set of axes, decisively located parts — and
      reads as incompetence when nothing survives for the eye to find. The distinguishing feature is
      therefore not how irregular the surface is but whether there is a recoverable regularity
      underneath it.
    origin: extractor_synthesis
    interpretation_basis: >
      This is the most interpreted object in the lane and the claim is ours, not Samara's. He never
      poses the question in this form and never offers a test. What he does is describe individual
      projects using a recurring contrast — "cohesion instead of chaotic randomness", "carefully
      randomized", "decisively located", "rigorously controlled network of geometric axes" — and
      state, separately, a rule-count limit for irregular systems. The synthesis is the extractor's
      observation that these all point at the same underlying condition. It is offered as a reading
      of the chapter and must not be attributed to the source as a stated diagnostic. Its evidence is
      also entirely visual and entirely uninspected in this copy.
    source_ref:
  members:
  - {sk_ref: sk_sgb_0038, role_in_system: cause, order: 1, membership_origin: extractor_inferred}
  - {sk_ref: sk_sgb_0040, role_in_system: cause, order: 2, membership_origin: extractor_inferred}
  - {sk_ref: sk_sgb_0044, role_in_system: cause, order: 3, membership_origin: extractor_inferred}
  - {sk_ref: sk_sgb_0045, role_in_system: effect, order: 4, membership_origin: extractor_inferred}
  - {sk_ref: sk_sgb_0029, role_in_system: limiting_case, order: 5, membership_origin: extractor_inferred}
  - {sk_ref: sk_sgb_0013, role_in_system: cause, order: 6, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: causal, origin: extractor_inferred}
    dependencies:
    - {from: sk_sgb_0045, to: sk_sgb_0044, note: "the effortless appearance is bought by the axis discipline", origin: extractor_inferred}
    - {from: sk_sgb_0040, to: sk_sgb_0038, note: "a variation is a rule only if it completes", origin: extractor_inferred}
    tradeoffs:
    - {between: [sk_sgb_0038, sk_sgb_0044], note: "the more the substructure is constrained, the less of the unconventional energy the source wants to preserve remains", origin: extractor_inferred}
    conflicts:
    - {between: [sk_sgb_0029, sk_sgb_0044], note: "in the Universal/Unique exhibit the surviving substructure is a grid imposed before the content, which chapter 1 treats as the error case", origin: extractor_inferred}
  source_warns_against_isolated_use: false
  source_warning_ref:
  evidence:
    characteristics: [visually_demonstrated, practitioner_assertion, repeated_within_source, argued]
    source_uncertainty: none
    extraction_uncertainty: figure_not_inspected
    system_level_uncertainty: >
      Most of this system is ours. The members are source claims; the causal relation between them is
      an extractor synthesis, and every one of the exhibit-derived members rests on a layout that was
      not inspected. A reader should treat this as the extractor's best reading of what the chapter
      implies, not as a position Samara takes. There is also no negative control anywhere in the
      chapter: it never shows a project where apparent randomness turned out to be carelessness.
  provenance:
    chapter: "2 Breaking the Grid"
    section: "Considering the Practical in the Impractical — Systematizing the Organic; Exhibits — Design Projects Without Grids (spine 6)"
    page_start:
    page_end:
    source_support: text_and_visual
