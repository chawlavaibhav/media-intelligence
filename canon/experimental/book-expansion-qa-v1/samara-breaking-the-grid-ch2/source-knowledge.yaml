- sk_id: sk_sgb_0005
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      Where the Cranbrook experiments were still referring to the idea of structure, Carson's work
      ignored it.
    - >
      no overarching structure exists; the ferocity of the layouts and the continual destruction of
      conformity on every page visually define a system that is identifiable and understandable,
      despite the lack of a consistent editorial grid structure
    - "generating visual cohesion through intuitive, spontaneous relationships"
  concept_label: a_system_can_be_defined_by_consistent_destruction_of_conformity
  label_origin: extractor_assigned
  claim: >
    A publication can be a recognisable, understandable system with no overarching structure at all.
    In the source's account of Carson's Raygun, the ferocity of the layouts and the continual
    destruction of conformity on every page are themselves what define a system that is identifiable
    and understandable, despite the absence of a consistent editorial grid. The source draws a
    distinction inside the counter-tradition: the Cranbrook experiments were still referring to the
    idea of structure, whereas this work ignored it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      What is held constant is the act of breaking rather than any layout property. Consistency of
      the transgression, applied on every page, is what a reader learns and recognises as the
      system.
  scope:
    domain_discussed_by_source: [magazine_design, editorial_design]
    conditions: "a serial publication with many instalments; the source's cases are magazines, 1991-1996"
  caveats:
    - text: >
        "Identifiable and understandable" is asserted about a magazine famous for being hard to
        read. No reader evidence is offered, and the source elsewhere concedes that fragmenting text
        generally interferes with reading.
      origin: extractor_observed
    - text: >
        The mechanism is only usable at series scale. A single artefact cannot demonstrate the
        consistency of its own inconsistency; the source's cases are all runs of issues.
      origin: extractor_observed
    - text: "the source attributes the entry of this approach to a designer not trained as a graphic designer, which it treats as part of the point"
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "Raygun, 1991-1996, and the earlier Beach Culture layouts described as relying on an intuitive sense of placement that interpreted the experience of the content rather than organising it impartially", figure_ref: null}
  intra_source_relations:
