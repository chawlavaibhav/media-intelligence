    inspected: {text: true, figures: []}

- sk_id: sk_sgb_0016
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      Breaking phrases and words apart in a running text calls attention to the individual parts of
      speech; the presumed reading order may begin to change for the reader.
    - >
      Although generally this would interfere with reading, in some cases the resulting ambiguity
      may be appropriate to the content of the text, yielding associations between words or images
      that can be used to augment and comment upon its literal meaning.
  concept_label: fragmenting_running_text_interferes_with_reading_and_is_conditionally_warranted
  label_origin: extractor_assigned
  claim: >
    Breaking phrases and words apart in running text calls attention to the individual parts of
    speech and may change the reader's presumed reading order. The source concedes plainly that this
    would generally interfere with reading. It is warranted only in the cases where the resulting
    ambiguity is appropriate to the content of the text, and where the associations it yields
    between words or images augment and comment upon the literal meaning.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Fragmentation removes the ordering cues the reader uses, which is the same act as the one that
      creates the new associations. The cost and the benefit have one cause and cannot be separated.
  scope:
    domain_discussed_by_source: [typography, editorial_design, book_design]
    conditions: "running text; warranted only where the ambiguity suits the content"
  caveats:
    - text: >
        This is the chapter's most explicit concession that its own techniques have a cost, and it
        is the sharpest available guard against reading the chapter as permission for arbitrary
        difficulty.
      origin: extractor_observed
    - text: >
        "Appropriate to the content" is the whole of the test and is not operationalised.
      origin: extractor_observed
  source_stated_problems:
    - "generally this would interfere with reading"
    - "the presumed reading order may begin to change for the reader"
  source_stated_remedies: []
  examples:
    positive:
      - {description: "an essay gradually deconstructed over many pages by introducing space first between phrases and then between words, so that the verbal structure comes into focus while visual clarity decreases and the running text becomes a texture implying multiple reading directions", figure_ref: null}
  intra_source_relations:
    - {relation: qualifies, target: sk_sgb_0015, note: "the cost side of the same technique"}
    - {relation: depends_on, target: sk_sgb_0002, note: "the second and third meanings of clarity are what license the cost"}
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, practitioner_assertion, mechanism_given]
    source_uncertainty: source_concedes_difficulty
