- sk_id: sk_sgb_0006
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      The problem: to find the balance between a maximum of conformity with a maximum of freedom.
      Or: the highest number of constants combined with the greatest possible variability.
    - "It is a formal program, a priori for 'x' unknown contents."
  concept_label: the_design_problem_is_maximum_conformity_with_maximum_freedom
  label_origin: extractor_assigned
  claim: >
    The source quotes Karl Gerstner's 1968 formulation of what a structural system is for: the
    typographic grid is a proportional guideline and a formal program, set a priori for unknown
    contents, and the problem it poses is to find the balance between a maximum of conformity and a
    maximum of freedom — the highest number of constants combined with the greatest possible
    variability. The source reports this as the statement of the problem the discipline was working
    on, and chapter 2 is its answer from the freedom side.
  claim_type: source_interpretation
  interpretation_basis: >
    The quotation and its attribution are the source's. That this formulation states the problem
    which chapter 2 then answers from the other direction is the extractor's reading of the two
    chapters together; the source does not connect them in this sentence.
  mechanism:
    stated_by_source: true
    text: >
      A program fixed before its contents are known must trade constancy against variability,
      because every constant it fixes is a degree of freedom the unknown content cannot use.
  scope:
    domain_discussed_by_source: [graphic_design, typography]
    conditions: "systems designed in advance of the content they will carry"
  caveats:
    - text: "the words are Gerstner's, not the source's; the source is reporting an authority, not arguing"
      origin: extractor_observed
    - text: >
        This is the one object taken from chapter 1's "Coming to Order". It is included because it
        states a design problem rather than a chronology; the rest of that part is chronology and
        was refused.
      origin: extractor_observed
  source_stated_problems:
