- sk_id: sk_sgb_0012
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      A conventional grid structure repeated in different orientations could be used to explore a
      more dynamic architectural space by creating different axes of alignment.
    - >
      overlapping grids with modules of different proportions, or that run at right angles in
      relation to each other, can introduce a kind of order to the spatial and directional ambiguity
      that layering creates, especially if some elements are oriented on both layers simultaneously
  concept_label: repeated_or_overlapping_grids_order_the_ambiguity_that_layering_creates
  label_origin: extractor_assigned
  claim: >
    A conventional grid repeated in different orientations produces a more dynamic architectural
    space by creating several axes of alignment. Overlapping grids — with modules of different
    proportions, or running at right angles to each other — introduce a kind of order into the
    spatial and directional ambiguity that layering creates, and the effect is stronger where some
    elements are oriented on both layers simultaneously.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Layering by itself produces ambiguity. A second grid supplies a second set of alignments the
      viewer can resolve against, and an element belonging to both layers is the evidence that the
      two systems are related rather than merely superimposed.
  scope:
    domain_discussed_by_source: [poster_design, editorial_design]
    conditions: "compositions that layer material"
  caveats:
    - text: >
        Stated as a possibility - "could be used", "can introduce" - rather than as a rule, and
        offered without a worked example distinguishing an ordered layering from a merely confused
        one.
      origin: extractor_observed
  source_stated_problems:
    - "the spatial and directional ambiguity that layering creates"
  source_stated_remedies:
    - "repeat one grid in several orientations"
    - "overlap grids of different module proportions or at right angles"
    - "orient some elements on both layers simultaneously"
  examples:
