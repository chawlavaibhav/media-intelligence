- sk_id: sk_sgb_0017
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      These qualities of spoken and written language can be made visual, more than simply as a tool
      for clarifying hierarchy, and not just as intriguing eye candy—but to lay bare an author's
      methods and intent.
    - >
      It might even improve readability—the quality of and the degree to which the type engages its
      readers with the content.
  concept_label: readability_recast_as_engagement_may_be_improved_by_deconstruction
  label_origin: extractor_assigned
  claim: >
    The source defines readability here as the quality of, and the degree to which, the type engages
    its readers with the content, and claims that visualising the qualities of spoken and written
    language might even improve readability in that sense. The purpose offered is neither
    hierarchical clarification nor decoration but laying bare an author's methods and intent.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [typography, editorial_design]
    conditions: "texts whose authorial method is itself worth showing"
  caveats:
    - text: >
        This is the same author redefining a term he uses differently in chapter 1, where the live
        extraction records readability as a set of interacting measures - x-height, characters per
        line, interline space - sensitive to small shifts. Here it is engagement. The two senses are
        not reconciled anywhere in the book, and a reader who carries the chapter-1 sense into this
        sentence will read it as a much stronger claim than it is. Same author, one work; this is
        not two sources disagreeing.
      origin: extractor_observed
    - text: >
        Hedged - "might even" - and unsupported by any reader evidence.
      origin: extractor_observed
