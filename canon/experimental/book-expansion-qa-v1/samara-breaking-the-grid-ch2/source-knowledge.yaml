- sk_id: sk_sgb_0013
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      The conventional calendar grid that gave rise to this poster's overlapping layers remains as a
      vestige to help navigation
    - "the blue row structure directs reading from a familiar standpoint"
    - >
      Curvilinear deformations in this poster's structures retain their familiar column
      characteristics—which help viewers parse the unexpected shapes for text and images
  concept_label: a_recognisable_remnant_of_the_original_structure_preserves_navigability
  label_origin: extractor_assigned
  claim: >
    A deconstruction remains navigable when a recognisable trace of the structure it came from is
    left in place. The source states this twice in captions. In one, the conventional calendar grid
    that gave rise to a poster's overlapping layers remains as a vestige to help navigation: only a
    hint of the modular structure is visible, but a row structure directs reading from a familiar
    standpoint. In the other, curvilinear deformations retain their familiar column characteristics,
    which help viewers parse the unexpected shapes for text and images while the shapes themselves
    carry a pictorial reference supporting the subject.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The reader parses an unfamiliar arrangement by matching it to a familiar one. A remnant of the
      original structure supplies the familiar standpoint from which the departure can be read as a
      departure.
  scope:
    domain_discussed_by_source: [poster_design, editorial_design]
    conditions: "deconstructions and deformations of an existing structure"
  caveats:
    - text: >
        Both statements are figure captions describing specific posters. The general rule is the
        extractor's reading of the two together; the source does not state it as a rule in running
        prose.
      origin: extractor_observed
    - text: >
        Neither caption says how much remnant is enough, and the source elsewhere praises work in
        which no remnant survives at all.
      origin: extractor_observed
    - text: >
        The claim is about what a page looks like and both demonstrations are images that cannot be
        opened in this copy. The text alone does not establish that the vestige is doing the work
        claimed for it.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "leave a vestige of the originating grid visible to direct reading"
    - "keep deformed columns recognisable as columns"
  examples:
    positive:
      - {description: "a poster whose visible blue row structure is the surviving trace of the calendar grid its layers came from", figure_ref: null}
      - {description: "a poster with curvilinear column deformations that still read as columns", figure_ref: null}
  intra_source_relations:
    - {relation: qualifies, target: sk_sgb_0014, note: "the limit on how far deformation may go"}
    - {relation: depends_on, target: sk_sgb_0031, note: "navigation is the interest this protects"}
