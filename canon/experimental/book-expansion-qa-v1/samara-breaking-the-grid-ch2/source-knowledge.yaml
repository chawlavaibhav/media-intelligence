        The three cases are given as a single sentence with no worked test for deciding which one a
        project is in. The source supplies the categories, not a diagnostic for them.
      origin: extractor_observed
    - text: >
        The third case — deliberately demanding more of the audience — is the one most easily used
        to justify a layout that is merely difficult. The source does not supply the guard; the
        guards it does supply are elsewhere in the chapter.
      origin: extractor_observed
