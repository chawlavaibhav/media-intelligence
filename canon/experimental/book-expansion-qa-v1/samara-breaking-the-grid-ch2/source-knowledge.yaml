- sk_id: sk_sgb_0001
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "part of the status quo of designing"
    - >
      It's a convention and, like all conventions, it is suitable for achieving particular goals.
    - >
      Using a grid may not offer the best solution toward that end; assuming that one should be
      imposed may, in fact, compromise the information's integrity.
  concept_label: grid_use_is_a_convention_not_an_obligation
  label_origin: extractor_assigned
  claim: >
    Using a grid to organise text and imagery is the status quo of designing, but it is a convention
    and, like all conventions, is suitable for achieving particular goals rather than all of them.
    The designer's purpose is to facilitate the clearest and most compelling experience for the
    audience; a grid may not be the best route to that end, and assuming one should be imposed may
    compromise the information's integrity. There are numerous ways of delivering understandable,
    meaningful experiences that are equally valid and that run counter to the rationalist approach
    of grid-based structure; exploring them often creates opportunities to transcend the content's
    literal, pragmatic meaning and to engage with a richer, more specific and more memorable visual
    language.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A convention is fitted to the goals it was developed for. Imposing it where those goals do not
      hold makes the structure a cost paid against the content rather than a service to it.
  scope:
    domain_discussed_by_source: [graphic_design, editorial_design, publication_design, poster_design]
    conditions: "any project where a grid would be the default choice"
  caveats:
    - text: >
        This is the same author's own qualification of the position his chapter 1 argues. It is not
        a retraction — chapter 2 does not say grids are wrong, only that grid use is a choice with
        conditions. It must never be presented as a second source disagreeing with the first.
      origin: extractor_observed
    - text: >
        "Compromise the information's integrity" is asserted, not demonstrated; no case is given in
        which imposing a grid is shown to have damaged content.
      origin: extractor_observed
  source_stated_problems:
    - "assuming that a grid should be imposed"
  source_stated_remedies: []
  examples:
    positive: []
    counter: []
  intra_source_relations:
