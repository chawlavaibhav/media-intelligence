- sk_id: sk_sgb_0002
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Clarity can mean different things in different contexts"
    - "content has its own internal structure that must be upheld to be understood"
    - >
      content must ignore structure altogether to create specific kinds of emotional reaction, or to
      invoke an important narrative association
    - >
      it requires a more complex intellectual involvement on the part of the audience in order to
      resonate more profoundly
  concept_label: clarity_has_three_context_dependent_meanings
  label_origin: extractor_assigned
  claim: >
    Clarity means different things in different contexts, and the source names three. First, content
    may have its own internal structure that must be upheld for it to be understood. Second, content
    may have to ignore structure altogether in order to create a particular emotional reaction or to
    invoke an important narrative association. Third, content may require a more complex
    intellectual involvement from the audience in order to resonate more profoundly. These are the
    conditions under which the source holds that departing from a grid is warranted.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [graphic_design, editorial_design]
    conditions: "stated as a general property of communication, not scoped to a medium"
  caveats:
