  rationale: >
    Several objects in this lane point the opposite way from material already held about the same
    book's first chapter — building a grid before assessing content, whether grids enable or impede
    variation, whether fragmenting text harms or helps reading. Every one of those is one author
    qualifying his own earlier statement across a chapter boundary in a single work. The binding
    exists so that a later conflict-resolution step handles them as intra-source qualification and
    never as two sources disagreeing, and so that no aggregation counts this lane as corroboration of
    the first chapter.
  applicability:
    when: "any step that compares this lane's objects against material drawn from chapter 1 of the same book"
    limits: >
      This is a statement about provenance, not about layouts. It does not decide which of the two
      statements is right — in most cases the source itself does not, because the contexts differ —
