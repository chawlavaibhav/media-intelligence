source_id: samara-breaking-the-grid-ch2
qa_items:
- qa_id: qa_sgb_0001
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', opening argument (spine 6)
  question: 'Samara opens the chapter by describing grid use as "part of the status quo of designing."
    What exactly is his objection, and what is the harm he says follows from getting it wrong?

    '
  answer: 'His objection is not to the grid but to defaulting to it. He calls grid use a convention and
    says that, like all conventions, it is suitable for achieving particular goals — not every goal. The
    designer''s purpose is to facilitate the clearest and most compelling experience for the audience,
    and a grid may not be the best route there. The stated harm is specific: assuming a grid should be
    imposed may compromise the information''s integrity. So the failure he names is imposing structure
    without asking whether this content wants it, and the damage lands on the content rather than on the
    aesthetics.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: 'Chapter 2 opening: grid use is the status quo and a convention suitable for particular goals;
    using one may not be the best solution and assuming one should be imposed may compromise the information''s
    integrity.

    '
  confounders:
  - reading the chapter as anti-grid; Samara attacks the default, not the device
  - assuming the harm he names is visual dullness — he names damage to the information itself
  - the modern default that breaking a grid is a matter of taste or brand personality; his stated warrant
    is about the content
  requires_application_canon013: false
- qa_id: qa_sgb_0002
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', opening argument (spine 6)
  question: 'Samara says clarity means different things in different contexts. What three cases does he
    name, and why does the list matter for deciding whether to use a grid?

    '
  answer: 'He names three. Sometimes content has its own internal structure that must be upheld to be
    understood. Sometimes content must ignore structure altogether to create specific kinds of emotional
    reaction, or to invoke an important narrative association. And sometimes content requires a more complex
    intellectual involvement from the audience in order to resonate more profoundly. The list matters
    because it is his actual test: the question is not whether a layout looks clear but which of these
    kinds of clarity the content needs. Only the first case is obviously served by an imposed regular
    structure.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: 'Chapter 2 opening paragraph on clarity meaning different things in different contexts, listing
    internal structure, emotional or narrative reaction, and deeper intellectual involvement.

    '
  confounders:
  - treating 'clarity' as a single quantity that a grid maximises
  - reading the third case as licence for difficulty as such; Samara ties it to resonating more profoundly,
    not to obscurity
  - collapsing the second and third cases — emotional reaction and intellectual involvement are separate
    entries on his list
  requires_application_canon013: false
- qa_id: qa_sgb_0003
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical, opening (spine
    6)
  question: 'A designer cites this chapter to defend a layout as "intentionally unconventional" and dismisses
    a complaint that readers cannot navigate it. On Samara''s own terms, has the designer finished the
    job?

    '
  answer: 'No. Samara concedes the difficulty in full rather than denying it: any approach that flies
    in the face of convention will be fraught with difficulties, and he acknowledges that the usual objection
    is exactly this one — that the layout is too difficult to navigate. What he refuses is the inference
    that usability therefore precludes the approach. His answer is a duty, not a dismissal: identify the
    problematic aspects objectively and work to address them, after which even the most challenging solution
    may be resolved to a necessary level of practicality without necessarily diluting its inventiveness.
    A designer who cites the chapter to end the conversation is using the licence and skipping the obligation
    attached to it.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: '"Considering the Practical in the Impractical" opening: the perceived challenge for viewers,
    including being too difficult to navigate; the refusal of the conclusion; objective identification
    of problematic aspects; a necessary level of practicality without necessarily diluting inventiveness.

    '
  confounders:
  - the common reading of this chapter as 'anything goes'
  - assuming Samara denies the navigation problem exists; he grants it and assigns responsibility for
    it
  - assuming the fix must preserve the invention completely — his word is 'necessarily', which concedes
    it may cost some
  requires_application_canon013: true
- qa_id: qa_sgb_0004
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Readability,
    Navigation, and Hierarchy (spine 6)
  question: 'When an unconventional layout gives readers trouble, Samara says the fault is almost always
    in one of two places. Which two, and what does he claim about the tools available to fix them?

    '
  answer: 'The two are optical differentiation — whether the reader can identify the most important elements,
    or the ones a sequence starts from — and eye path, also called compositional flow, meaning how the
    first element optically connects the reader to what comes next. His claim about the tools is that
    nothing new is required: every means of constructing a clear hierarchy in a grid-based layout remains
    the same in a layout built on an alternative approach, and there is no reason an unusual composition
    cannot also be a friendly one. The difference is one of degree, not of kind — he recommends applying
    the familiar size and weight differences to greater extremes than usual.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: hierarchy
  requires_application: false
  support: '"Readability, Navigation, and Hierarchy": hierarchy means carry over unchanged; the two aspects
    that tend most often to be the root of navigation trouble are optical differentiation and eye path;
    bigger and bolder usually means seen first, so push the differences further than normal.

    '
  confounders:
  - assuming an unconventional layout needs a special hierarchy toolkit
  - confusing optical differentiation with legibility of the type itself
  - treating eye path as a fixed left-to-right scan; Samara derives it from contrast, and scopes the left-hand
    advice to Western readers
  requires_application_canon013: false
- qa_id: qa_sgb_0005
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — Grid Deconstruction: Orthogonal,
    ''Splitting, Splicing, and Shifting'' (spine 6)'
  question: 'Samara gives a procedure for orthogonal grid deconstruction. What is the first step, and
    why is that step the part most often misread?

    '
  answer: 'The first step is to install a base grid. Only then does the designer change how columns and
    rows relate to each other — separating them at irregular intervals, cutting through them in the opposing
    direction and sliding the parts horizontally or vertically, widening some but not others. It is misread
    because the chapter''s title suggests the grid is the thing being escaped, whereas here the grid is
    the instrument: there is nothing to split, splice or shift until a structure exists. He recommends
    starting from a familiar structure, even a simple two- or three-column grid, as the introduction to
    alternative structure.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: '"Splitting, Splicing, and Shifting": altering a familiar structure is an excellent introduction;
    first the designer installs a base grid, then changes how columns and rows relate.

    '
  confounders:
  - assuming deconstruction begins from a blank page
  - confusing this with the non-orthogonal route, which changes the shapes of columns rather than their
    positions
  - assuming the base grid must be elaborate; he specifically suggests a simple two- or three-column one
  requires_application_canon013: false
- qa_id: qa_sgb_0006
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — Grid Deconstruction: Orthogonal,
    ''Splitting, Splicing, and Shifting'' (spine 6)'
  question: 'Splicing and shifting move elements around. According to Samara, what is the actual payoff,
    and what does he tell the designer to do about it?

    '
  answer: 'The payoff is relational rather than formal. When information that would normally appear in
    its expected place — marking a structural juncture in the grid — is moved and lands beside some other
    kind of information, a new verbal connection is created that did not exist before. If a change in
    size or density accompanies the move, the shifted information may end up behind or on top of other
    material, and the resulting optical confusion will often make foreground and background appear to
    swap places. His instruction is telling: he says it is important to watch what happens. The connections
    are observed after the fact, not specified in advance.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: '"Splitting, Splicing, and Shifting": watching what happens when expected information is moved,
    the new verbal connection, and the foreground/background swap produced by optical confusion.

    '
  confounders:
  - reading the operation as purely visual restructuring; Samara's stated payoff is a change in meaning
  - assuming the new connections are planned; his verb is 'watch'
  - confusing the figure-ground swap, presented here as a benefit, with the same effect treated as a hazard
    in the practicality section
  requires_application_canon013: false
- qa_id: qa_sgb_0007
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — Grid Deconstruction: Non-Orthogonal,
    ''Deformation and Distortion'' (spine 6)'
  question: 'What distinguishes non-orthogonal deconstruction from splicing and shifting, and what optical
    effect does Samara say follows from it — including the condition that strengthens that effect?

    '
  answer: 'Splicing and shifting move columns and rows while leaving their shapes intact; deformation
    and distortion alter the shapes themselves. Pulling the edges of columns and rows out of parallel
    alignment emphasises diagonal axes and makes the orthogonal underpinning far less apparent, which
    he describes as a far more organic effect. The optical consequence is an illusion of perspective as
    the newly created angles converge. The condition that greatly enhances it is that the content inside
    the columns changes in size or spacing to correspond with the perceived change in spatial location
    from near to far. He adds that columns and rows may be made curvilinear as well as angular — circles,
    waves, free-form organic shapes.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: '"Deformation and Distortion": altering the actual shapes rather than the positions; diagonal
    emphasis; illusory perspective as angles converge, greatly enhanced if content changes size or spacing
    to match perceived depth; curvilinear as well as angular deformation.

    '
  confounders:
  - treating deformation as a stronger version of shifting rather than a different operation
  - forgetting the content-scaling condition, without which Samara says the depth effect is weaker
  - assuming deformation must be angular; he explicitly includes curves and free-form shapes
  requires_application_canon013: false
- qa_id: qa_sgb_0008
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — Verbal and Editorial Deconstruction
    (spine 6)
  question: 'You are laying out a transcript of a heated argument between three speakers. Using Samara''s
    verbal deconstruction, what is the source of the layout''s structure, and what specifically does he
    warn you are exchanging?

    '
  answer: 'The structure comes from the speech itself. Samara says the natural rhythm of spoken language
    is often used as a guide for changing weight, size, colour or alignment among lines of type, with
    louder or faster words set larger, bolder or in italics to correspond to stresses and lulls in actual
    speech; giving a voice to visual language can push words out of paragraphs or force columns into relationships
    where the natural logic of the writing creates a visual order. His own example is a book of dialogue
    in which each character''s voice is coded typographically and the columns are deconstructed by the
    quality of the speech — falling apart, becoming confused, interrupting each other. The exchange he
    names is explicit: breaking phrases and words apart in running text calls attention to the individual
    parts of speech and the presumed reading order may begin to change, which he says would generally
    interfere with reading; it is warranted only where the resulting ambiguity is appropriate to the content.
    A caption states the same trade in stronger terms — the verbal structure is brought into focus while
    the visual clarity is decreased.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: typography
  requires_application: true
  support: '"Verbal and Editorial Deconstruction": speech rhythm guiding weight, size, colour and alignment;
    the dialogue book with typographically coded voices; the concession that fragmenting running text
    generally interferes with reading and is warranted where the ambiguity suits the content; the caption
    stating that verbal structure comes into focus as visual clarity decreases.

    '
  confounders:
  - treating the typographic variation as decoration or emphasis rather than as the structure itself
  - assuming Samara considers the reading cost negligible — he concedes it twice
  - importing a modern accessibility argument as though it were his; he does not make one
  requires_application_canon013: true
- qa_id: qa_sgb_0009
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — Verbal and Editorial Deconstruction,
    closing (spine 6)
  question: 'Samara suggests deconstruction "might even improve readability." What does he mean by readability
    there, and how confident is the claim?

    '
  answer: 'He redefines the word. Readability in that sentence means the quality of, and the degree to
    which, the type engages its readers with the content — not the ease of decoding it. The claim is hedged:
    "might even", and it arrives immediately after his statement that these qualities should be made visual
    not merely as a tool for clarifying hierarchy and not just as intriguing eye candy, but to lay bare
    an author''s methods and intent. It carries no reader evidence of any kind. Read as a claim about
    decoding ease it would flatly contradict his own admission that fragmenting text interferes with reading;
    read as a claim about engagement it does not.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: typography
  requires_application: false
  support: 'Closing of "Verbal and Editorial Deconstruction": the hedged suggestion about readability,
    with the source''s own parenthetical definition of readability as engagement with the content.

    '
  confounders:
  - reading 'readability' in the standard legibility sense, which makes the sentence contradict the same
    section
  - treating a hedged aside as one of the chapter's supported claims
  - confusing it with the accessibility sense of readability, which this book does not discuss
  requires_application_canon013: false
- qa_id: qa_sgb_0010
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — Centered-Axis Structure (spine
    6)
  question: 'Why does Samara call centred composition "structurally antithetical" to grid-based visualisation?
    Give his three reasons.

    '
  answer: 'First, centring assumes only one governing alignment axis. Second, that axis is buried within
    the area of the material rather than being marked by its contours — unlike a grid, whose alignments
    show up at the edges of things. Third, the exterior contours, widths and depths of centred elements
    are mutually interdependent: they are not subject to predetermined intervals but driven by their fit
    and relative proportion as they come into central alignment. He allows that centred material may still
    have its proportions or positions guided by a grid, but the two allocate space by incompatible logics.

    '
  answer_type: concept_definition
  difficulty: hard
  knowledge_type: composition
  requires_application: false
  support: '"Centered-Axis Structure": the three stated reasons centring is structurally antithetical
    to grid-based visualisation, and the concession that a grid may still guide proportions or positions.

    '
  confounders:
  - treating a centred layout as a one-column grid
  - assuming Samara rejects centring; he classes it as the classical page architecture and gives it its
    own section
  - confusing the buried-axis point with the fact that a grid's guides are also invisible in print — his
    point is where the alignment is legible, at the contour or inside the mass
  requires_application_canon013: false
- qa_id: qa_sgb_0011
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — Centered-Axis Structure (spine
    6)
  question: 'A centred layout for a cultural institution has been criticised as inert. Samara predicts
    this failure. What does he say causes it, and what are his remedies — noting which dimension the remedies
    are allowed to touch?

    '
  answer: 'He says symmetry is unforgiving with regard to layout flexibility because it demands that every
    element adhere to a single axis, and elements that do not typically appear disunified from the whole.
    The resulting restfulness and uniformity are problematic relative to the goals of designed communication:
    a viewer is likely to gloss over the material and come to an intellectual rest quickly rather than
    investigate the work more intently. His remedies all work on the dimensions symmetry does not govern,
    because moving elements off the axis is precisely what is unavailable. Exaggerate contrasts in scale
    or proportion and in spacing, density and rhythm. Enlarge the symmetrically organised forms until
    they are clearly bigger than the remaining symmetrical spaces, so their confrontation with the format
    becomes tense and the static quality is reduced. Juxtapose dramatically different emphases in proportion,
    among both the forms and the spaces between them, under a defined logic of progression or alternation
    along the axis. And make radical changes in size or in lightness and darkness so that lateral movement
    is reordered as movement from near to far.

    '
  answer_type: repair
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: '"Centered-Axis Structure": symmetry unforgiving, elements off-axis appear disunified, viewer
    comes to intellectual rest quickly; exaggerating contrasts in scale and spacing as critical to optical
    vitality; oversized forms creating tension with the format; a logic of progression along the axis;
    radical size and value changes reordering movement dimensionally.

    '
  confounders:
  - recommending that elements be moved off the axis, which is the one repair symmetry forecloses
  - assuming restfulness is the goal of a symmetrical layout; Samara treats it as the problem
  - reaching for colour variety in general — his named levers are scale, spacing/density, and lightness/darkness
  requires_application_canon013: true
- qa_id: qa_sgb_0012
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — Centered-Axis Structure, caption
    to the paired advertisements (spine 6)
  question: 'Can symmetry and asymmetry be used in the same composition, on Samara''s account? State his
    position and its condition exactly.

    '
  answer: 'His position is that they rarely combine effectively, but that bringing the two kinds of organisational
    structure into confrontation can yield interesting results — on one condition, that the two compositional
    states remain distinct. He gives no test for how distinct is distinct enough. The condition is worth
    noticing because it is a rule shape that recurs through the chapter: a departure works while the state
    departed from is still legible as a separate state, which is also why he says a deconstructed grid
    should leave a recognisable vestige.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: 'Caption in "Centered-Axis Structure": symmetry and asymmetry rarely combine effectively, but
    confrontation can yield interesting results so long as the two compositional states are distinct.

    '
  confounders:
  - reading it as a straight prohibition
  - reading it as unconditional permission — the condition is the whole content of the claim
  - assuming the two states should be blended into each other, which is the opposite of what he requires
  requires_application_canon013: false
- qa_id: qa_sgb_0013
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — Other Kinds of Geometric Structure
    (spine 6)
  question: 'Samara claims that "being completely objective, the choice of one structural approach is
    no more valid, on a functional level, than that of another." What does he immediately require of the
    designer, and why does that requirement not contradict the claim?

    '
  answer: 'He requires the designer to confront the issue of a structure''s relevance on a communicative
    level. The two do not conflict because he separates function from meaning: every kind of structure
    will display content, so none is functionally better, but the different qualities of each impart extremely
    different perceptions of the content and therefore of its meaning — especially where the structure
    is one the viewer is likely to associate with a concrete experience. His example is blunt: if an arrangement
    is structured like a tree, the viewer will interpret it as a tree. So the freedom is real at the functional
    level and cancelled at the semantic one, which is where design decisions actually live.

    '
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: '"Other Kinds of Geometric Structure": all structures equally valid functionally; different
    qualities imparting different perceptions of content and meaning; the tree example; the surviving
    obligation to confront a structure''s communicative relevance.

    '
  confounders:
  - quoting the functional-equality claim on its own as licence for arbitrary structure
  - reading the tree remark as being about literal illustration rather than about unavoidable association
  - assuming 'no more valid' means 'no different in effect'
  requires_application_canon013: false
- qa_id: qa_sgb_0014
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — Other Kinds of Geometric Structure
    (spine 6)
  question: 'An arrangement shows no repetition or pattern among its parts. Does Samara consider it a
    structure? Give his reasoning.

    '
  answer: 'Yes. His starting point is that inserting any form into a space — even a solitary one — creates
    structure, meaning a set of visual relationships between its contour, the shape of its outer boundary,
    and its axis, the imaginary line separating its halves, and those of other forms. He then says explicitly
    that any structure may be fluid and irregular in proportion or interval, and that simply because an
    arrangement presents no perceptible repetition or pattern among its parts does not discredit it as
    a structure. He notes that because of our orientation to Earth we typically perceive forms as expressing
    two primary axes, horizontal and vertical, but offers nature as the counter-catalogue — radial flower
    petals, the irregular axes of constellations, hexagonal crystal lattices, the helical whorl of DNA.

    '
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: '"Other Kinds of Geometric Structure": any inserted form creates structure via contour and
    axis; orthogonal perception attributed to our orientation to Earth; nature''s non-orthogonal structures;
    the explicit statement that absence of perceptible repetition does not discredit a structure.

    '
  confounders:
  - equating structure with regularity or with a grid
  - assuming 'no pattern' means 'no structure', which is the specific inference he blocks
  - treating the natural examples as decorative rather than as his argument that geometricity does not
    require orthogonality
  requires_application_canon013: false
- qa_id: qa_sgb_0015
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — Other Kinds of Geometric Structure
    (spine 6)
  question: 'Where does Samara say the intervals of a structure can come from, if not from a column grid?
    Name the sources he actually lists.

    '
  answer: 'From outside the page. He names musical interval — the octave established by the seven unique
    tonal pitches of Western music, which he says book designers have used to create page divisions since
    the Middle Ages — and, by analogy, rhythmic or thematic alternation schemes applied to the distances
    between elements, in patterns such as A/B/A or A/B/A/C where each letter stands for one measurement.
    He also names any numeric progression or fractional relationship: odd-number ratios such as 1:3:5:7,
    and the Fibonacci progression in which each number is the sum of the preceding two, which he notes
    coincidentally drives the Golden Section. He closes by saying these approaches are neither comprehensive
    nor required to be used independently of one another.

    '
  answer_type: factual
  difficulty: easy
  knowledge_type: composition
  requires_application: false
  support: '"Other Kinds of Geometric Structure": musical intervals used by book designers since the Middle
    Ages; A/B/A alternation applied to distances; numeric progressions including odd-number ratios and
    Fibonacci; the note that the approaches are neither comprehensive nor mutually exclusive.

    '
  confounders:
  - attributing a preference for the Golden Section to him; he mentions it as a coincidence of the Fibonacci
    relationship
  - assuming these are historical curiosities rather than options he offers for use
  - assuming the schemes must be used one at a time — he says the opposite
  requires_application_canon013: false
- qa_id: qa_sgb_0016
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — Intuitive, Relational, and
    Conceptual: ''Spontaneous Composition'' (spine 6)'
  question: 'Spontaneous composition sounds like the absence of method. What is the step in Samara''s
    own description that makes it a method, and what does he say about its relationship to grid-building?

    '
  answer: 'The step is the adjustment pass. He describes the approach as starting fast and loose, the
    designer working as a painter does and making quick decisions as the material is put together and
    the relationships are first seen — and then, as the different optical qualities of the elements begin
    to interact, determining which qualities those initial decisions have affected and making adjustments
    to enhance or negate them in whatever way is most appropriate for the communication. The placement
    is intuitive; the correction is analytical. On grid-building, he says designers often use this method
    as a step in the process of building a grid, and that its use as an organisational idea on its own
    is just as valid — so he places it upstream of the conventional procedure rather than opposite to
    it.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: '"Spontaneous Composition": intuitive placement based on formal aspects; starting fast and
    loose; the read-back-and-adjust step; the note that the method is often a step within grid-building
    and is equally valid on its own.

    '
  confounders:
  - reading spontaneity as the absence of evaluation
  - assuming it is opposed to grid-building; he describes it as a phase within it
  - confusing it with chance operations, which import relationships the material did not already have
  requires_application_canon013: false
- qa_id: qa_sgb_0017
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — Intuitive, Relational, and
    Conceptual: ''Imagery as a Source'' (spine 6)'
  question: 'Samara asks what happens if the imagery is allowed to rule a layout. What reason does he
    give for expecting that inversion to be productive, and what are the two directions it can take?

    '
  answer: 'His reason is an asymmetry of vocabulary: typography is always a pattern of lines, whereas
    images present a radically greater range of form languages. Applying an image''s language to text
    therefore relieves the designer quickly of presumptions about how text should behave in a layout,
    or how layouts ought to be organised — presumptions he says are hard to dislodge because type and
    image are usually assumed to be mutually dominant and referential. The two directions are: one in
    which typographic elements become, in essence, part of the imagery; and one in which the imagery sets
    up the logic for how type responds to it pictorially, while the type retains its identity as a separate
    entity alongside the images.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: '"Imagery as a Source": type and image notoriously challenging to combine; typography always
    a pattern of lines against images'' greater range of form languages; the two named directions.

    '
  confounders:
  - reading it as advice to make type look like a picture in general
  - assuming the type must always merge into the image — he names a second direction in which it stays
    separate
  - assuming the correspondence must be literal; elsewhere he says the mere fact of a shared quality is
    enough
  requires_application_canon013: false
- qa_id: qa_sgb_0018
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — 'Imagery as a Source' and Considering
    the Practical — 'Pictorial Strategies' (spine 6)
  question: 'Two sections of this chapter address the relationship between an image and its layout, and
    they push in opposite directions. State both, and say what Samara offers for choosing between them.

    '
  answer: 'In "Imagery as a Source" the image governs: its visual aspects determine the overall compositional
    structure and even the compositional and stylistic attributes of the type. In "Pictorial Strategies"
    the environment governs: crisp, naturalistic images inset in rectangles will often dis-unify from
    an expressive, gestural or spatially ambiguous environment, and the remedy is to manipulate those
    images so they take on visual characteristics found in the surrounding typographic or graphic forms,
    downplaying dissonance and promoting a perception of totality. He offers nothing for choosing between
    them. The two sections are written for different situations — one is a generative strategy at the
    start of a layout, the other a repair applied to a layout that already exists — but he never sets
    them side by side or states a rule.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: '"Imagery as a Source" on letting imagery determine structure and type; "Pictorial Strategies"
    on crisp inset images dis-unifying and being given the surrounding forms'' characteristics.

    '
  confounders:
  - assuming the two sections say the same thing about integrating type and image
  - inventing a decision rule and attributing it to Samara; he gives none
  - assuming the pictorial repair means cropping or resizing — his instruction is to imbue the image with
    the environment's visual characteristics
  requires_application_canon013: false
- qa_id: qa_sgb_0019
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — ''Narrative Constructs: Pictorialization
    and Metaphorical Allusion'' (spine 6)'
  question: 'Distinguish Samara''s two narrative constructs, and say what he claims stays constant as
    a pictorialised layout runs across many pages.

    '
  answer: 'In narrative pictorialisation the layout is made to look like something discussed in the text
    — elements arranged to give the impression of objects swept up in a flood, or to construct a literal
    image of a car or other machine; in simplest terms the layout becomes a kind of illustration. In metaphorical
    allusion the layout structure and the visual language of its forms refer instead to a tangential idea
    that supports or manipulates perception of the meaning; his example is a film festival promotion splicing
    repeated images to refer to film editing. What stays constant across a pictorialised sequence is the
    governing logic: as the content progresses or takes a different direction from page to page or screen
    to screen, the subject the layout depicts changes while the logic that decides how to depict it does
    not.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: '"Narrative Constructs": pictorialisation as the layout looking like the text''s subject and
    becoming a kind of illustration; allusion as reference to a tangential idea; the governing logic remaining
    the same as the depicted subject changes.

    '
  confounders:
  - collapsing the two into one 'conceptual layout' idea
  - assuming the depicted subject must stay the same across a sequence — he says it changes and the logic
    does not
  - confusing metaphorical allusion with vernacularism, which borrows a style rather than depicting an
    idea
  requires_application_canon013: false
- qa_id: qa_sgb_0020
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — ''Narrative Allusions: Vernacularism''
    (spine 6)'
  question: 'You are designing an invitation to an exclusive art auction and propose using the brush lettering
    and graphic devices of supermarket advertising banners. What is the mechanism Samara says makes this
    work, and what is the limit an extractor should attach to it?

    '
  answer: 'That is Samara''s own example. The mechanism is that vernacular imagery, or a vernacular compositional
    conceit, imposes the look of something else onto the communication and embeds it in that new context,
    either to draw a comparison or to comment on the subject being communicated. Because "vernacular"
    means the ordinary, such gestures often trade on forms associated with low culture or with undesigned
    visual experience, and the distance between the borrowed world and the actual subject is what carries
    the comment. He traces the practice to Pop Art, citing Warhol''s Brillo boxes and Rosenquist''s paintings
    of spaghetti and cleaning products. The limit is that the effect is entirely dependent on the audience
    holding the association: Hatch Show Prints signify the American Midwest, and Victorian illustrated
    books signify small independent trade, only to people who already read them that way. Samara does
    not discuss what happens when the borrowed style is simply read as itself.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: '"Vernacularism": the auction-invitation example; imposing the look of something else to draw
    a comparison or comment; the low-culture note; the Pop Art lineage; the Hatch Show Prints and Victorian-illustration
    examples.

    '
  confounders:
  - treating vernacular borrowing as retro styling for its own sake
  - assuming the association transfers across cultures — every one of his examples is culture-specific
  - confusing it with pictorialisation; vernacularism borrows a style, it does not depict the subject
  requires_application_canon013: true
- qa_id: qa_sgb_0021
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — ''Chance Operations: Random
    Physical Effect'' and ''Programmatic Effect'' (spine 6)'
  question: 'Samara''s chance operations are often quoted as permission to place things arbitrarily. What
    does he actually say about control, and how do his two categories differ?

    '
  answer: 'He says the opposite of arbitrariness. Conducting a chance operation implies that the chance
    is being controlled to a certain degree, and he adds that this is usually the case; by selecting the
    type of operation, a designer skews the results in their favour, ensuring appropriateness in the form
    while letting unpredictability create relationships structured thinking will not reach. The two categories
    differ in foreknowledge, not in whether control is exercised. Random physical effect involves randomness
    to a greater degree, resting on an action that prevents explicit control of the outcome — flinging
    paint, scattering or dropping cropped images from a height — where the designer knows what kinds of
    pattern the brush size or the gesture tends to produce but cannot predict or effect a specific result.
    Programmatic effect uses planned mechanical or mathematical procedures which equally deny explicit
    control, but whose mechanical nature guarantees greater foreknowledge of the results.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: creative_process
  requires_application: false
  support: '"Chance Operations": chance controlled to a degree; selecting the operation type to skew results;
    random physical effect and its examples; programmatic effect and its greater foreknowledge.

    '
  confounders:
  - reading chance operations as randomness without judgement
  - assuming programmatic chance gives the designer control of the outcome — it gives foreknowledge of
    the kind of outcome
  - assuming the benefit claimed is novelty; his stated benefit is seeing the material more clearly through
    unexpected juxtaposition
  requires_application_canon013: false
- qa_id: qa_sgb_0022
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — ''Chance Operations: Programmatic
    Effect'' (spine 6)'
  question: 'Name three programmatic chance procedures Samara lists, and say what makes them programmatic
    rather than random.

    '
  answer: 'From his list: dissecting an image in a pattern of intervals based on an arbitrarily applied
    grid or a mathematical formula; automatically photographing or scanning elements, or a layout in progress,
    from a particular viewpoint at predetermined times and inserting the captures as images; augmenting
    the point sizes of successive lines of type by an arbitrary multiplier; and printing two layouts on
    top of one another then deleting the instances where elements overlap. They are programmatic because
    the procedure is planned and mechanical or mathematical, so although the designer still cannot control
    the specific outcome, the nature of the procedure guarantees greater foreknowledge of what kind of
    result will appear.

    '
  answer_type: factual
  difficulty: easy
  knowledge_type: creative_process
  requires_application: false
  support: '"Programmatic Effect": the four listed procedures and the statement that the mechanical nature
    of such procedures guarantees greater foreknowledge of results.

    '
  confounders:
  - assuming a programmatic operation is deterministic in its result; it is deterministic in its rule
  - confusing the arbitrarily applied grid here with a grid derived from content, which is a different
    idea in this book
  - assuming these are digital techniques — he includes overprinting and physical capture
  requires_application_canon013: false
- qa_id: qa_sgb_0023
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Exhibits — Design Projects Without Grids, the 'Universal/Unique'
    book exhibit (spine 6)
  question: 'In one exhibit Samara says a grid produced an organic, seemingly random result. What is his
    stated reason, and why must an extractor be careful with this passage?

    '
  answer: 'His reason is that the grid forces the deconstruction because its structure was created before
    the material it governs was assessed: the material ends up doing whatever it will as it is made to
    conform to predetermined criteria, and the result is a collage of texture, shadow, light and type
    that on closer inspection reveals its hidden order. Care is needed for two reasons. First, the same
    author elsewhere treats building a structure before reading the content as the error to avoid, so
    this is one author qualifying his own earlier position in a different context — not two sources disagreeing,
    and not a general licence to impose a grid blind. Second, the context is artificial: the project was
    made for an exhibition on the relationship between structure and freedom, whose brief required participants
    to use predetermined kernel elements — a grid, the word "word", and the image of an eye.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: 'Exhibit commentary on the "Universal/Unique" book: the master grid contributing to the organic
    quality; the grid forcing the deconstruction because it precedes assessment of the material; the exhibition
    brief and its predetermined kernel elements.

    '
  confounders:
  - generalising a single exhibit under an artificial brief into a method
  - presenting this as a contradiction between two sources rather than as the same author writing about
    a different situation
  - assuming the resulting disorder has no structure — he says the hidden order is revealed on closer
    inspection
  requires_application_canon013: false
- qa_id: qa_sgb_0024
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Readability,
    Navigation, and Hierarchy (spine 6)
  question: 'A key label in a dense, structureless poster is partly obscured. A colleague proposes repeating
    it in a clear area of the page. What does Samara say about that move, and what does he prefer?

    '
  answer: 'He allows it and then withdraws most of the allowance. Repeating partially obscured information
    in an open area may help, he says, but it may also confuse a viewer with its redundancy — better to
    give the information a little extra room where it appears in sequence. So his preference is to fix
    the element in place rather than duplicate it. He pairs this with a general fallback: when in doubt,
    simplify, because if the same visual effect can be achieved with fewer elements or less interference,
    the element will differentiate itself more efficiently from within a complicated field.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: hierarchy
  requires_application: true
  support: '"Readability, Navigation, and Hierarchy": repetition of obscured information may help or may
    confuse through redundancy, with extra room in sequence preferred; and the when-in-doubt-simplify
    rule with its reason.

    '
  confounders:
  - treating repetition as a straightforwardly safe redundancy strategy
  - assuming the fix is to increase the label's size, which is a different lever in his account
  - confusing this repetition with the repetition he recommends elsewhere, which marks which elements
    are alike in meaning
  requires_application_canon013: true
- qa_id: qa_sgb_0025
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Readability,
    Navigation, and Hierarchy (spine 6)
  question: 'Samara says hierarchy is not only about importance. What else does he say it is about, and
    which device carries that second job?

    '
  answer: 'It is also about relation — establishing which elements are alike in meaning, whether or not
    they are important. The device that carries it is repetition: repetition assigns relative meaning
    to elements that will be understood as related no matter where they occur within the visual field,
    even when separated by material that is clearly different. This matters more in an unstructured layout
    than in a grid, because a grid encodes relatedness by position and a structureless layout has no position
    to encode it with.

    '
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: hierarchy
  requires_application: false
  support: '"Readability, Navigation, and Hierarchy" diagram captions: repetition assigning relative meaning
    across the field; hierarchy as relation as well as level of importance.

    '
  confounders:
  - treating hierarchy as a strict ranking only
  - assuming proximity or enclosure carries relatedness here; his named device is repetition
  - assuming repeated elements must be equally important — he says explicitly that they need not be important
    at all
  requires_application_canon013: false
- qa_id: qa_sgb_0026
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Readability,
    Navigation, and Hierarchy (spine 6)
  question: 'How does Samara account for the order in which a reader moves through a layout that has no
    reading structure, and what does that account let a designer do?

    '
  answer: 'He accounts for it as a gradient. Compositional flow, or eye path, occurs as the viewer compares
    each hierarchic level''s degree of contrast against the others and senses the difference as a decrease
    in optical resistance — contrast restated as resistance — so the eye moves from the area of greatest
    overall contrast to the least. Because the order is produced by a gradient rather than by position
    in a structure, a layout with no grid can still have a reading order, and the designer can support
    the direction by positioning axes or by using graphical forms to point. Practically, he adds that
    each element to be encountered next must either differentiate from its context to a similar degree,
    since like things attract attention, or be positioned near where the eye is likely to leave the previous
    element; and that graphical markers or anchoring points inserted at strategic locations help focus
    attention and direct the flow.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: hierarchy
  requires_application: true
  support: '"Readability, Navigation, and Hierarchy": compositional flow as decreasing optical resistance;
    the eye moving from greatest to least contrast; supporting the direction with axes and pointing forms;
    like things attracting attention; markers and anchoring points.

    '
  confounders:
  - assuming reading order in an unstructured layout is arbitrary
  - treating eye path as a fixed scan pattern independent of the design
  - assuming the highest-contrast element is simply the largest; his variable is contrast against the
    field
  requires_application_canon013: false
- qa_id: qa_sgb_0027
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Readability,
    Navigation, and Hierarchy (spine 6)
  question: 'Which of Samara''s navigation instructions is explicitly limited to a particular readership,
    and what is the correct way to record that limit?

    '
  answer: 'The instruction to orient top-level elements toward the left-hand area of the layout. He states
    it as advice "for Western readers", and the related rule for type on a circular path — orient the
    entry point toward the upper left and, if possible, so that the first words are relatively horizontal
    — depends on the same convention. The correct handling is to keep the scoping attached to the claim:
    it is a reading convention, not a fact about perception, and it must not be carried over to readers
    of right-to-left or vertical scripts as though it were. Everything else in the same section — differentiation,
    contrast, the resistance gradient — is stated without that restriction.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: hierarchy
  requires_application: false
  support: '"Readability, Navigation, and Hierarchy": the explicit "For Western readers" scoping on left-hand
    orientation, and the upper-left entry point for type set on a curve.

    '
  confounders:
  - treating upper-left entry as a universal perceptual fact
  - assuming the whole section is culturally scoped; only the directional advice is
  - assuming Samara offers a substitute rule for other scripts — he does not discuss them
  requires_application_canon013: false
- qa_id: qa_sgb_0028
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Considering the Practical in the Impractical — Easing
    Dissonance, Enhancing Totality: ''Typographic Strategies'' (spine 6)'
  question: 'An expressive spread reads as a set of unrelated fragments. Samara''s typographic remedy
    has a fallback for when the running text cannot take it. State the remedy and the fallback.

    '
  answer: 'The remedy is to apply the layout''s macro-level compositional gestures to micro-scale elements
    such as text, at a smaller scale — which he says creates greater cohesion among disparate parts and
    alleviates the fractured or dissonant quality that often attends alternative compositional approaches.
    He notes that text at a legible point size will withstand a degree of manipulation without sacrifice.
    The fallback is for when that seems too challenging: treat subheadings and callouts or decks as a
    bridge between the macro and micro scales, so the gesture is carried by an intermediate element and
    the running text is left alone.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: typography
  requires_application: true
  support: '"Typographic Strategies": applying macro-level gestures to micro-scale elements; legible text
    withstanding a degree of manipulation; subheadings, callouts and decks as the bridge between macro
    and micro.

    '
  confounders:
  - assuming the remedy is to reduce the expressiveness of the large forms
  - forgetting the fallback, which is the part that keeps body text readable
  - reading 'macro gestures at micro scale' as simply matching typeface or colour, rather than repeating
    the compositional gesture itself
  requires_application_canon013: true
- qa_id: qa_sgb_0029
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Integrating
    Information Design (spine 6)
  question: 'A financial table has to sit inside a loose, gestural annual-report spread and looks alien.
    Samara gives three moves in a definite order. What are they, and what is the standing limit on all
    three?

    '
  answer: 'First, determine whether the data can take a form other than the one it was supplied in, since
    many kinds of statistical data can be visualised using different chart conventions; if it can, choose
    the data shape whose formal qualities most closely reflect those of the overall layout and recast
    the data into it. Second, if it cannot be recast, see whether the existing data structure is alterable
    enough to create adequate formal dialogue with the other elements. Third and only as a last resort,
    rotate the graph or table slightly, or position it over a more organic form, to diminish the presence
    of its corners and orthogonal axes. The standing limit is the data''s integrity, which he attaches
    to the last move explicitly and which governs the whole sequence: the point of preferring re-encoding
    to rotation is that re-encoding removes the conflict at source, whereas rotation only disguises it.

    '
  answer_type: repair
  difficulty: hard
  knowledge_type: production_reasoning
  requires_application: true
  support: '"Integrating Information Design": whether the data can take a different form; choosing the
    data shape reflecting the layout and recasting; altering the existing structure for formal dialogue;
    slight rotation or an organic backing as a last resort, without compromising the data''s integrity.

    '
  confounders:
  - reaching for rotation first, which is the move Samara ranks last
  - assuming the goal is to make the chart decorative; his limit is that the data's integrity must survive
  - assuming any chart type may be substituted freely — the first question is whether the data is permitted
    to change form at all
  requires_application_canon013: true
- qa_id: qa_sgb_0030
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Systematizing
    the Organic (spine 6)
  question: 'Samara gives exactly one numeric instruction in this chapter. What is it, what failure is
    it guarding against, and what is his stated mechanism?

    '
  answer: 'Limit the rules to two or three in total — and limit the numbers, kinds and degrees of their
    variations as well. It guards against the system falling apart: he says the more rules there are,
    the greater the number of variables for each, and the more extreme the expression of each variable,
    the greater the potential for that collapse. The mechanism is multiplicative. Rule count, variables
    per rule and the extremity of each variable compound, so the space of permitted outcomes grows past
    the point where the set still reads as one system. He adds that the result of keeping to the limit
    is a more easily controllable and unified system, and that rules and their variations must be applied
    consistently among the corresponding parts.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: '"Systematizing the Organic": the two-or-three limit including variations; the compounding
    of rules, variables and extremes; the more controllable and unified result; consistent application
    across corresponding parts.

    '
  confounders:
  - reading the limit as being about visual minimalism rather than about the size of the rule set
  - assuming it applies to grid-based systems; he states it for irregular, alternative ones
  - forgetting that the limit covers the variations of each rule, not only the rules
  requires_application_canon013: false
- qa_id: qa_sgb_0031
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Systematizing
    the Organic (spine 6)
  question: 'You have designed eight spreads intuitively and now need rules so the rest of the book can
    be built by someone else. What is Samara''s procedure, and what is unusual about the order it works
    in?

    '
  answer: 'Analyse, as specifically as possible, which formal conditions are the most prevalent among
    all those present, using questions he supplies: what kind of images am I using; is geometry important
    in the shapes or relationships; is there spatial depth and, if so, what creates it — transparency,
    scale change, overlap; do I sense movement and, if so, is it lateral, vertical, frenzied, calm, repeated.
    The answers to those questions are the system''s rules. Each rule is then given its permitted variables
    and their range — if cropping images into an irregular trapezoid is a rule, the trapezoids might all
    be one size and shape, or vary in size, or vary in the measures of their sides, or extend to parallelograms
    and triangles. What is unusual is the direction: the rules are read off work that already exists rather
    than being specified before it, which inverts the order in which a grid is normally derived. He also
    says a discrepancy should be treated as a prompt to reinvestigate the rules — edited out, or promoted
    into a new rule that must then be resolved among the existing elements.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: creative_process
  requires_application: false
  support: '"Systematizing the Organic": analysing the most prevalent formal conditions; the four diagnostic
    questions; the answers as the system''s rules; the trapezoid example of graded variation; treating
    a discrepancy as an incentive to reinvestigate the rules.

    '
  confounders:
  - specifying rules in advance, which is the opposite of the procedure described
  - treating the four questions as a closed checklist; he calls them a way to begin
  - assuming a discrepancy must always be removed — he allows it to become a new rule
  requires_application_canon013: true
- qa_id: qa_sgb_0032
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Systematizing
    the Organic, the poster-series caption (spine 6)
  question: 'In a four-poster series the main title is rotated to a different angle on each poster. Samara
    says one version of this works and a nearby version does not. What is the difference, and what general
    problem does it illustrate?

    '
  answer: 'The version that works has two titles oriented orthogonally and two diagonally, so the variation
    is controlled specifically against the fact that there are four posters: the system has a binary variation.
    The version that fails sets both diagonally rotated titles at the same angle, which he says would
    conflict with the logic of the other two, in which the angle differs in each. The general problem
    is that a variation repeating inconsistently among a system''s components causes the layouts sharing
    a similar variation to disunify, and that the number of component parts is one factor in how such
    a discrepancy should be resolved. The underlying point is that a variation reads as a rule only when
    its pattern completes across the set; a half-applied variation reads as a mistake.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: '"Systematizing the Organic" caption: inconsistent repetition of a variation causing disunity;
    component count as a factor; the four-poster binary variation and the conflicting alternative.

    '
  confounders:
  - assuming more variation is always the risk; here the failure is variation that does not complete
  - assuming the rule scales unchanged to large sets — he says component count is a factor and does not
    generalise
  - reading the two diagonal titles at the same angle as the more consistent option; he says it conflicts
    with the logic of the other pair
  requires_application_canon013: true
- qa_id: qa_sgb_0033
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Interaction
    Design Without Grids (spine 6)
  question: 'Samara says screen work should be more hospitable to alternative layout than print, yet grids
    dominate online. What does he grant to the grid there, and what does he refuse to relax?

    '
  answer: 'He grants that a grid readily addresses the requirements of responsive design and aids in rapidly
    templating multitudes of pages — but says there is no good reason those requirements cannot be equally
    well addressed through an alternative logic, and that screen-based interactivity, from scrolling to
    animation to flyout navigation to parallax, seems ready-made for alternative approaches. What he refuses
    to relax is the requirements themselves. He states that there really are no considerations or best
    practices for screen-based design from an alternative standpoint that diverge from those for conventional
    approaches, and lists them: content is of primary importance; navigation must be clearly different
    from content; text must be legible; users must be able to intuit functionality and page flow and trace
    the sequence of screens they have accessed; they must be able to get from any screen to any other;
    the site must load quickly; and it must be a compelling experience worthy of their time.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: '"Interaction Design Without Grids": grid benefits for responsive design and templating; the
    claim that alternative logic could serve them; the explicit statement that no screen best practices
    diverge for alternative approaches, followed by the list.

    '
  confounders:
  - assuming an unconventional site is held to a softer usability standard
  - reading his complaint as being about aesthetics; it is about an unexploited medium
  - treating his list as an accessibility standard — it is a designer's list and overlaps one without
    being one
  requires_application_canon013: false
- qa_id: qa_sgb_0034
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Interaction
    Design Without Grids (spine 6)
  question: 'A team wants to carry an unusual, spatial navigation concept down to phone screens. What
    does Samara say about that, and what does he deliberately leave unanswered?

    '
  answer: 'He says the limited area of the smartphone screen, which is a benefit for the process of grid
    construction, may here be a hindrance, because unusual layouts and unusual navigation functionality
    typically require large areas. He then leaves the conclusion open, and does so as two questions rather
    than an answer: simply because one can design for device responsiveness, should one always; and is
    it important that viewers be able to access every kind of online content on their phones. Any resolution
    of those questions is not his. The most that can be attributed to him is the observation that the
    constraint is real and that he thought the usual assumption worth interrogating.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: '"Interaction Design Without Grids": the smartphone screen as hindrance because unusual layouts
    require large areas; the two open questions about responsiveness and universal phone access.

    '
  confounders:
  - attributing to Samara a recommendation against responsive design; he asks, he does not answer
  - assuming the constraint is technical; his stated constraint is available area
  - assuming he thinks small screens simply cannot carry alternative layouts — he shows a case where a
    card layout survives by pinning corners off-screen
  requires_application_canon013: false
- qa_id: qa_sgb_0035
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Pacing and
    Sequencing (spine 6)
  question: 'In a book with no consistent page structure, where can the structure live instead, on Samara''s
    account?

    '
  answer: 'In time, across the sequence. He says unconventional layout strategies tend to be more experiential
    than expository, and so lend themselves to other ways of thinking about sequence and pace: visual
    elements may relate to each other in time as though in frames of a film, with an image moving across
    a format or changing from page to page and affecting images or text that appear later. This kinetic
    structure comes to be recognised and understood as the viewer experiences the succession of frames.
    He adds that decisions about ebb and flow will often still be driven by the content''s requirement
    for sequential clarity, but that a designer may treat sequence and pace as an idea in itself that
    establishes how the content ought to be delivered.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: '"Pacing and Sequencing": unconventional strategies as more experiential than expository; elements
    relating in time as film frames; kinetic structure recognised through the succession of frames; sequence
    and pace as an organising idea.

    '
  confounders:
  - assuming a layout without page structure has no structure at all
  - treating pacing purely as rhythm or variety rather than as a carrier of order
  - assuming content requirements are set aside — he says they often still drive the ebb and flow
  requires_application_canon013: false
- qa_id: qa_sgb_0036
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Exhibits — Design Projects Without Grids, commentary on the
    architecture-competition poster (spine 6)
  question: 'Two layouts are equally chaotic on first impression; one is praised in this book and the
    other would not be. Reading the exhibit commentaries, what does Samara consistently credit for the
    difference — and what is the honest limit on that reading?

    '
  answer: 'He consistently credits a restricted substructure. In one commentary the designers attend to
    the parallel or divergent nature of axes and their junctures, distributing them along a limited selection
    of planar levels and directions, which he says ensures well-crafted, rhythmic cohesion instead of
    chaotic randomness. In another, spatial confusion and complicated interference between overlapping
    shapes and text are said to be underpinned by a rigorously controlled network of geometric axes in
    which the edges of every element line up with, or point to, those of other elements. In both cases
    the disorder is on the surface and something constrained survives underneath. The honest limit is
    that Samara says this about particular projects and never states it as a test; turning it into a diagnostic
    is a reader''s generalisation, not his claim, and he offers no case anywhere in the chapter where
    apparent randomness turned out to be carelessness.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Exhibit commentaries: axes distributed along a limited selection of planar levels and directions
    ensuring rhythmic cohesion instead of chaotic randomness; the rigorously controlled network of geometric
    axes underpinning apparent spatial confusion.

    '
  confounders:
  - assuming the difference is the amount of visual disorder rather than what survives beneath it
  - attributing the generalisation to Samara; he describes projects and states no test
  - assuming a viewer can perceive the difference — the chapter asserts it and offers no reader evidence
  requires_application_canon013: true
- qa_id: qa_sgb_0037
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Exhibits — Design Projects Without Grids, commentaries on
    the exhibition catalogue and the improvisation poster (spine 6)
  question: 'What does Samara repeatedly report about how effortless-looking layouts were actually made,
    and why does that matter for judging a layout you did not watch being made?

    '
  answer: 'He repeatedly reports that the effortlessness is expensive. An exhibition catalogue whose apparent
    simplicity looks at a glance not really designed is said to depend on almost obsessive attention to
    the selection, ordering, cropping, colour transitions and colour-reversal logic of its images. A poster
    with no baselines, alignments or margins, letters floating as though scattered, is described as a
    carefully randomised layout with two spatial levels added for control, its forms placed precisely
    enough that legibility survives the overlap of red and black letterforms close in optical colour.
    A third project''s playful structure is called accessible because each part of the information is
    decisively located and components are separated so the eye can reach them. Why it matters is also
    the difficulty: what he is describing is process, not an inspectable property. Removing the grid removes
    the mechanism that placed things correctly by default, and that work transfers to the designer element
    by element — but a reader who arrives only at the finished artefact is given no test that separates
    the two cases.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'Exhibit commentaries: apparent simplicity belying almost obsessive attention; the carefully
    randomised improvisation poster whose precise placement preserves legibility; the playful structure
    accessible because each part is decisively located.

    '
  confounders:
  - reading apparent randomness as evidence of low effort
  - assuming Samara supplies a test for the finished artefact; he describes how the work was made
  - assuming the exhibits are a fair sample — they are projects he selected and is commending, with no
    failure case shown
  requires_application_canon013: false
- qa_id: qa_sgb_0038
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — captions in ''Grid Deconstruction:
    Orthogonal'' (spine 6)'
  question: 'A poster is built by overlaying and shifting a conventional calendar grid until almost none
    of it is visible. What does Samara say is doing the navigational work, and what general condition
    does the case illustrate?

    '
  answer: 'He says the conventional calendar grid that gave rise to the overlapping layers remains as
    a vestige to help navigation: although only a hint of the modular structure is visible in the stepped
    movement of the informational chunks, the blue row structure directs reading from a familiar standpoint.
    The images that would originally have occupied left- and right-hand columns have been spliced and
    reordered into a strong vertical substructure. The general condition is the chapter''s recurring one
    — the departure remains readable because the thing departed from is still partly legible. The same
    shape appears where he requires symmetry and asymmetry to stay distinct from each other, and where
    the exhibits credit cohesion to a surviving network of axes.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: 'Caption in "Grid Deconstruction: Orthogonal": the calendar grid remaining as a vestige to
    help navigation; the blue row structure directing reading from a familiar standpoint; images spliced
    and reordered into a vertical substructure.

    '
  confounders:
  - assuming a thorough deconstruction should erase every trace of the original grid
  - assuming the vestige is a stylistic residue rather than a navigational aid
  - confusing 'a hint of the structure' with a merely faint or low-contrast rendering of it
  requires_application_canon013: true
- qa_id: qa_sgb_0039
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', On the Other Hand — A Historical Survey, 'From an Unexpected
    Quarter' (spine 6)
  question: 'Samara says a magazine with no consistent editorial grid nonetheless had a system. What does
    he say defined it, and what does that imply about where cohesion can come from?

    '
  answer: 'He says that in the magazine''s design no overarching structure exists, and that the ferocity
    of the layouts and the continual destruction of conformity on every page visually define a system
    that is identifiable and understandable despite the lack of a consistent editorial grid structure.
    The implication he draws is that visual cohesion can be generated through intuitive, spontaneous relationships
    rather than through a repeated structure — that consistency of attitude can substitute for consistency
    of geometry. He distinguishes this from the earlier Cranbrook experiments, which he says were still
    referring to the idea of structure, whereas this work ignored it.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: '"From an Unexpected Quarter": no overarching structure in the magazine; the continual destruction
    of conformity defining an identifiable and understandable system; the contrast with Cranbrook work
    that still referred to structure.

    '
  confounders:
  - reading 'no structure' as 'no system'
  - assuming Samara treats this as the chapter's model case; he presents it as one point in a historical
    survey
  - assuming consistency of attitude replaces the practicality obligation he states later
  requires_application_canon013: false
- qa_id: qa_sgb_0040
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', On the Other Hand — A Historical Survey, 'Against the Establishment'
    and the survey's closing (spine 6)
  question: 'What conclusion does Samara draw from the history in this chapter, and why is that conclusion,
    rather than the history itself, the part worth keeping?

    '
  answer: 'The conclusion is that rational structure — the grid — is one of many possible systems for
    organising visual material, and that context is an important factor in determining which system is
    best for a specific project. He closes the survey by saying that intuitive and idiosyncratic approaches
    now participate on equal terms with rational, grid-based ones, and that the designer''s set of tools
    includes several methods from which the most appropriate for a given project can be chosen. That conclusion
    is the reusable part because the rest of the section is chronology — names, schools, dates — which
    carries no mechanism. The claim also does the load-bearing work for the chapter: it converts a historical
    narrative into the premise that selection, not habit, governs.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: '"Against the Establishment" and the survey''s closing: the grid as one of many possible systems
    with context determining which is best; intuitive approaches participating on equal terms; the designer''s
    set of tools and choosing the most appropriate.

    '
  confounders:
  - treating the historical narrative as the source's argument rather than as its setting
  - reading 'equal terms' as a claim that the approaches are interchangeable; his point is that selection
    is required
  - assuming the equality claim is about quality; it is about which system may legitimately be chosen
  requires_application_canon013: false
- qa_id: qa_sgb_0041
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — Grid Deconstruction: Non-Orthogonal,
    ''Deformation and Distortion'' (spine 6)'
  question: 'A long scrolling page feels monotonous. Samara offers a reason and a device drawn from grid
    deformation. What are they, and what does he say makes the effect register?

    '
  answer: 'His reason is that the conventional scrolling function of webpages can rapidly regularise perceived
    movement into a vertically constrained stream. His device is grid deformation, which he says can introduce
    greater, unexpected lateral movement and a perception of deeper space for improved visual interest.
    What makes it register is the frame: as the altered shapes of columns or rows come into view within
    the browser area and then recede, their irregularity is abruptly reinforced by the orthogonal consistency
    of the browser window''s edges. The deformation is read against the one rectangle that cannot be deformed.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: '"Deformation and Distortion", the web paragraph: scrolling regularising movement into a vertically
    constrained stream; deformation introducing lateral movement and deeper space; the irregularity reinforced
    by the orthogonal consistency of the browser window''s edges.

    '
  confounders:
  - assuming the remedy for monotony is more content variety rather than a change of structure
  - missing the role of the browser frame, which is what he says supplies the contrast
  - generalising this to a full-bleed or frameless display, where the reference rectangle he relies on
    is absent
  requires_application_canon013: true
- qa_id: qa_sgb_0042
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: 'Ch. 2 ''Breaking the Grid'', Alternative Architectures — Grid Deconstruction: Orthogonal,
    ''Splitting, Splicing, and Shifting'' (spine 6)'
  question: 'You want depth and directional ambiguity in a poster but not incoherence. Samara names a
    way to get ordered ambiguity from layering. What is it, and what detail does he say strengthens it?

    '
  answer: 'Use more than one grid rather than none. He says a conventional grid structure repeated in
    different orientations can be used to explore a more dynamic architectural space by creating different
    axes of alignment, and that overlapping grids with modules of different proportions, or running at
    right angles to each other, can introduce a kind of order to the spatial and directional ambiguity
    that layering creates. The detail that strengthens it is that some elements should be oriented on
    both layers simultaneously — an element belonging to two structures at once is what ties the layers
    together instead of leaving them as separate sheets.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: '"Splitting, Splicing, and Shifting": a conventional grid repeated in different orientations
    to create different alignment axes; overlapping grids of different module proportions or at right
    angles introducing order to the ambiguity layering creates, especially where some elements are oriented
    on both layers simultaneously.

    '
  confounders:
  - assuming ambiguity must be reduced rather than ordered
  - assuming layering means transparency effects; his subject is overlapping alignment structures
  - omitting the shared-element condition, which is the part he says makes the ordering work
  requires_application_canon013: true
- qa_id: qa_sgb_0043
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical — Readability,
    Navigation, and Hierarchy, diagram captions (spine 6)
  question: 'A poster has one element far more distinct than everything else, and the secondary material
    now reads as an undifferentiated mass. What does Samara say is happening?

    '
  answer: 'He describes exactly this. An element that distinguishes itself from the others becomes a focal
    point and therefore assumes the greatest level of importance — but where the primary element disconnects
    visually to an extreme degree, that extremity diminishes the effect of the other contrasts evident
    in the secondary material. The contrasts among the secondary elements have not changed; they are being
    read against a much larger difference and so register less. The general controls he names are contrast
    in relative size and in relative spacing, meaning density against openness, which he says account
    for the most effective ways to establish a clear hierarchy, enhanced by hue or value change.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: hierarchy
  requires_application: true
  support: 'Diagram captions in "Readability, Navigation, and Hierarchy": a distinguished element becoming
    a focal point of greatest importance; the extreme degree of disconnection diminishing the effect of
    other contrasts; size and spacing contrast as the most effective hierarchy controls.

    '
  confounders:
  - assuming the secondary contrasts were poorly designed, when the stated cause is the primary element's
    extremity
  - assuming the remedy is more contrast everywhere; that is the change that produced the problem
  - confusing this with the source's general advice to push differences to greater extremes, which he
    gives for a complicated field
  requires_application_canon013: true
- qa_id: qa_sgb_0044
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Alternative Architectures — Centered-Axis Structure, the
    responsive caption (spine 6)
  question: 'A centred layout that works on a desktop browser collapses on a phone. What does Samara say
    is lost, and what does he propose to recover some of it?

    '
  answer: 'What is lost is the contrast in lateral emphasis. He says maintaining a logic of contrasting
    form widths and margin spaces is easily accomplished in the generously wide format of a desktop browser
    but is more challenging within the narrow confines of a smartphone screen. His proposal is to force
    text elements to occupy a narrower-than-optimal width and to introduce punctuating graphical forms,
    which he says permits some of the contrast in lateral emphasis to translate into the smaller viewing
    area. Note the concession embedded in it: he accepts a sub-optimal measure in order to preserve a
    compositional contrast, and says only that some of the contrast survives.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: 'Caption in "Centered-Axis Structure": contrasting form widths and margin spaces easy in a
    wide desktop browser and harder on a smartphone; forcing text to a narrower-than-optimal width and
    introducing punctuating graphical forms so some lateral contrast translates.

    '
  confounders:
  - assuming the fix is to keep the optimal measure and drop the contrast
  - assuming the contrast fully survives; he says only that some of it translates
  - confusing this with his general advice to exaggerate contrast, which addresses inertness rather than
    width
  requires_application_canon013: true
- qa_id: qa_sgb_0045
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', Considering the Practical in the Impractical, opening — the
    concrete-poems and cubistic-composition captions (spine 6)
  question: 'Samara shows two ways of keeping difficult layouts readable. Describe both, and say what
    principle they share.

    '
  answer: 'In the first, a spread of concrete poems mitigates reading-sequence difficulty by positioning
    each poem''s title so that it directs readers to the conventional location for text to start — upward
    and to the left; once the reader has entered from that familiar point, careful attention to the proximities
    of sequential words and phrases carries them through unexpected orientations, changes in spacing and
    other obstacles. In the second, a multi-plane cubistic composition integrates columns of relatively
    extensive text into its visual language while leaving the text situated primarily within open negative
    space, so it keeps its distinct identity and its legibility free of textural interference. The shared
    principle is that the difficulty is retained and localised rather than removed: one supplies a conventional
    entry point into an unconventional field, the other gives the text a protected zone inside a complex
    space. In neither case is the invention diluted; in both, one specific reading requirement is guaranteed.

    '
  answer_type: repair
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Captions in "Considering the Practical in the Impractical": the concrete-poem titles directing
    readers to the conventional starting point and proximity carrying them onward; the cubistic composition
    keeping text within open negative space to preserve identity and legibility.

    '
  confounders:
  - assuming the repair means simplifying the whole layout
  - treating the entry point as a decorative device rather than as the navigational concession it is
  - assuming the text must be separated from the composition entirely; in the second case it is integrated
    into the visual language and only protected from textural interference
  requires_application_canon013: true
- qa_id: qa_sgb_0046
  source_id: samara-breaking-the-grid-ch2
  source_title: 'Timothy Samara, Making and Breaking the Grid: A Graphic Design Layout Workshop, 2nd ed.
    (Rockport Publishers, 2017)'
  source_locator: Ch. 2 'Breaking the Grid', whole chapter (spine 6) — read against Ch. 1's instructional
    sections
  question: 'Chapter 2 states several things that cut against positions taken in chapter 1 of the same
    book. Give two, and state the correct way to record such a conflict.

    '
  answer: 'Two clear cases. First, on building a structure before assessing content: chapter 1''s method
    treats the grid as a closed system that requires the content to be assessed first, whereas a chapter
    2 exhibit commends a book in which the grid forces the deconstruction precisely because its structure
    was created before the material it governs was assessed. Second, on variation: chapter 2 says grid-based
    thinking, for all the variation it encourages, tends to engender systems that are characteristically
    consistent and programmatic and that expressing variation is more difficult — a cooler assessment
    than chapter 1''s. A third, if wanted, is fragmenting running text, which chapter 2 concedes generally
    interferes with reading while also suggesting it might improve readability in the engagement sense.
    The correct record is that these are one author qualifying his own earlier statements across a chapter
    boundary within a single work, in different contexts and often for different purposes. They are not
    two sources disagreeing, and nothing in chapter 2 counts as independent corroboration of chapter 1
    — it is the same author, the same book, the same edition.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: composition
  requires_application: false
  support: 'Chapter 2''s "Universal/Unique" exhibit commentary on the grid preceding assessment of the
    material; "Systematizing the Organic" on grid-based thinking engendering consistent, programmatic
    systems in which variation is harder to express; "Verbal and Editorial Deconstruction" on interference
    with reading and the hedged readability remark.

    '
  confounders:
  - presenting the two chapters as two sources in disagreement
  - treating chapter 2 as corroborating evidence for chapter 1 because both are about grids
  - assuming one chapter supersedes the other; the contexts differ and the author does not adjudicate
  requires_application_canon013: true
