- sk_id: sk_r22_0030
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "The product versus the brand."
    - "The no-good product is the red herring of marketing."
    - "East Asia has a branding problem."
  concept_label: the_product_camp_against_the_brand_camp
  label_origin: extractor_assigned
  claim: >
    The authors frame the business world as divided into two camps: those who believe success comes
    from continuing development of superior products and services, and those who believe in
    branding. They say the product camp dominates and defends itself with a reductio — if the
    product is no good it will fail whatever it is called — which they dismiss by asking the reader
    to name a brand of any product that is actually no good. Their large claim is that the East
    Asian practice of putting a very wide range of products under one corporate name is a branding
    failure with financial consequences, and they state it in the strongest available form.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The mechanism offered is the Law of Expansion applied at corporate scale: when sixteen of the
      hundred largest Japanese companies market under one name, that name retrieves nothing, so the
      brands have no power in the prospect's mind and margin cannot be defended.
  scope:
    domain_discussed_by_source: [brand_strategy, corporate_naming, east_asian_industrial_groups]
    conditions: "asserted for East Asian conglomerates generally"
  caveats:
