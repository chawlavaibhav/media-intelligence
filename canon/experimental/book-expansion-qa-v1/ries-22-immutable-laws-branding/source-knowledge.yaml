  claim: >
    The authors address the obvious objection to the Law of Expansion — that some of the largest
    and most profitable companies in the world carry very broad names — by separating size from
    brand strength. General Electric, General Motors and General Dynamics are, on their account,
    weak brands that look strong because they are well known and long established. Where such a
