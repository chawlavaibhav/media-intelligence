- sk_id: sk_r22_0009
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "The Law of Contraction"
    - "A brand becomes stronger when you narrow its focus."
  concept_label: narrowing_the_focus_strengthens_the_brand
  label_origin: source_verbatim
  claim: >
    Law 2. The positive form of Law 1: a brand becomes stronger when its focus is narrowed. The
    authors' cases are all businesses that began in a broad format and cut it back — a coffee shop
    that sold everything reduced to coffee, a delicatessen reduced to the submarine sandwich, a
    children's store that threw out the furniture and kept the toys. They add an operational
    consequence besides the mental one: when you make only one thing you get better at making it,
    which they illustrate by contrasting the original eleven-item McDonald's menu with the sixty or
    seventy items a store carried when they wrote.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Two mechanisms are given, one mental and one operational. Mentally, a narrow brand can be
      retrieved by a single word, which the previous law says is the condition of power.
      Operationally, restricting the range concentrates practice, so quality of execution rises —
      the authors' explanation for why a chain that makes only submarine sandwiches makes them well.
  scope:
    domain_discussed_by_source: [brand_strategy, retailing, food_service]
    conditions: "stated as a law; every case given is a retail or food-service format"
  caveats:
