- sk_id: sk_r22_0025
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "To build a quality brand you need to narrow the focus and combine that narrow focus with a better name and a higher price."
    - "What can we put into our brand to justify the higher price?"
  concept_label: quality_perception_is_built_from_narrow_focus_a_better_name_and_a_higher_price
  label_origin: extractor_assigned
  claim: >
    The authors' constructive prescription for quality perception has three components, and they
    state that the way to build it is to follow the other laws rather than to improve the product.
    Narrowing makes a brand a specialist, and specialists are perceived to know more; a better name
    beats an equal competitor with a worse one; a high price is itself a benefit, because it lets a
    buyer take public satisfaction from consumption. They invert the conventional order of design:
    instead of building quality and pricing to match, start with a higher price and then ask what
    can be put into the brand to justify it.
