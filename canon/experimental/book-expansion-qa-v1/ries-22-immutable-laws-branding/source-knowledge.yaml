- sk_id: sk_r22_0010
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "Most retail category killers follow the same five-step pattern."
    - "Narrow the focus. Stock in depth. Buy cheap. Sell cheap. Dominate the category."
  concept_label: the_five_step_category_killer_pattern
  label_origin: source_verbatim
  claim: >
    The authors set out a five-step pattern they say most retail category killers follow, in order:
    narrow the focus by contracting rather than expanding the category; stock the narrowed category
    in depth (a Toys "R" Us store carrying ten thousand toys against three thousand in a large
    department store); buy cheap, which they say is where the money is actually made; sell cheap,
    which depth of buying makes possible while holding margin; and dominate the category, which
    they name as the ultimate objective of any branding programme.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The steps are causally chained by the authors: narrowing permits depth, depth permits
      buying power, buying power permits low prices at maintained margin, and the combination
      produces category domination. Domination is then said to make a brand extremely powerful.
  scope:
    domain_discussed_by_source: [brand_strategy, retailing, specialty_retail]
    conditions: "explicitly retail — the authors say 'most retail category killers'"
  caveats:
    - text: "steps 2 and 5 sit in visible tension with step 1 and with the Law of Contraction itself: the brand narrows what it sells while widening assortment within the narrowed category and enlarging its share of it, and the authors do not say where narrowing stops and depth begins"
      origin: extractor_observed
    - text: "the domination figures cited (Microsoft 95 per cent of desktop operating systems, Intel 80 per cent of microprocessors, Coca-Cola 70 per cent of the world cola market) conflict with the ceiling the authors state twice later, that a leading brand's rightful share is never more than about 50 per cent"
      origin: extractor_observed
    - text: "steps 3 and 4 are claims about retail economics for which the book supplies no figures at all"
      origin: extractor_observed
  source_stated_problems:
    - "adding more things to sell"
  source_stated_remedies:
    - "a powerful branding program always starts by contracting the category, not expanding it"
  examples:
    positive:
      - description: "Toys 'R' Us given as the model, with Home Depot, The Gap, Victoria's Secret, Blockbuster Video, CompUSA and Foot Locker named as the same pattern"
        figure_ref: null
    counter: []
