- sk_id: sk_r22_0003
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "You can build a brand in any category, including bread and milk, as long as you follow the laws of branding"
  concept_label: no_category_is_inherently_a_commodity_category
  label_origin: extractor_assigned
  claim: >
    The authors deny the conventional split between brand categories (beer, cigarettes) and
    commodity categories (bread, milk). They accept the split is "literally true" as a description
    of current buying behaviour but argue it describes only what has been done so far, not what is
    possible: a brand can be built in any category whatever, provided the laws are followed. Their
    demonstration case is bottled water, which they treat as the limiting case of a commodity
    because tap water is free and adequate.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [brand_strategy, consumer_packaged_goods]
    conditions: "asserted without category limit"
  caveats:
    - text: "no mechanism is offered for why a commodity can be branded — the argument is carried entirely by the existence of Evian, Lactaid, Silk and Earth Grains, with no account of how many attempts at branding a commodity failed"
      origin: extractor_observed
    - text: "the Evian price comparison (a 1.5-litre purchase, per-litre against Budweiser and Borden's milk on the same day) is a single anecdotal observation the authors made while shopping"
      origin: extractor_observed
  source_stated_problems:
