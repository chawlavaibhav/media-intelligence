      most people believe the specialist knows more, and the authors say from a marketing point of
      view it does not matter whether that is true. High price works socially rather than
      functionally: the Rolex wearer is not buying punctuality but the public fact of affordability,
      and the authors ask whether $100 jeans would sell at that price with the label inside.
  scope:
