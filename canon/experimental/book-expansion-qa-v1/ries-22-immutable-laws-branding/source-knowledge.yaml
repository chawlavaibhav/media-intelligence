      - description: "Prince with the oversize racquet, Callaway with the oversize driver and Domino's with home delivery, each preempting a category and then promoting it"
        figure_ref: null
    counter:
      - description: "Boston Chicken, first to focus on rotisserie chicken for take-home, which renamed itself Boston Market, added other meats, and fell into trouble"
        figure_ref: null
