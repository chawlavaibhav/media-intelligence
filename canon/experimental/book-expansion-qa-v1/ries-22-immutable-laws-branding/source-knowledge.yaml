- sk_id: sk_r22_0002
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "Marketing is not selling. Marketing is building a brand in the mind of the prospect."
    - "Branding 'pre-sells' the product or service to the user."
  concept_label: marketing_is_brand_building_and_selling_is_in_decline
  label_origin: extractor_assigned
  claim: >
    The authors hold that conventional marketing is built on selling when it should be built on
    branding, and that the two are so linked that marketing cannot be treated as one function
    among others — everything a company does contributes to the brand, so the whole company is the
    branding department. They further claim a "seismic shift" from selling to buying: most
    products and services are now bought rather than sold, self-service has spread from the
    supermarket across retailing, and the salesperson's verbal endorsement has been replaced by
    the brand name itself acting as the guarantee.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The brand carries the function the salesperson used to carry. In a self-service aisle nobody
      is selling, yet choosing happens; the authors locate the selling inside the brand name, which
      stands in for a personal recommendation. Branding is therefore described as a more efficient
      way to sell rather than an alternative to it.
  scope:
    domain_discussed_by_source: [brand_strategy, retailing, consumer_marketing]
    conditions: "self-service and multi-brand retail environments; they extend it to car dealers, bookstores, pharmacies and department stores"
  caveats:
    - text: "the retail-shift evidence is a list of sectors the authors say are moving that way, with no measurement of the shift and no counter-sector examined"
      origin: extractor_observed
    - text: "the claim that marketing will be replaced by 'branding' is offered explicitly as something they can 'visualize', i.e. a forecast"
      origin: source_stated
    - text: "period-bound: written before 2002 and framed against the retail landscape of that moment"
      origin: extractor_observed
  source_stated_problems:
    - "conventional marketing is based on selling when it should be based on branding"
  source_stated_remedies:
    - "if the entire company is the marketing department, then the entire company is the branding department"
  examples:
    positive:
      - description: "the one-price no-haggling Saturn strategy spreading among car dealers; department stores where salesclerks only ring up sales"
        figure_ref: null
    counter: []
  intra_source_relations:
