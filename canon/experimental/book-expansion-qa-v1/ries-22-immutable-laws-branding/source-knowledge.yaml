- sk_id: sk_r22_0007
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "If your competition is weak or nonexistent, you can often increase sales by weakening your brand."
    - "the only thing you have demonstrated is the weakness of the competition"
  concept_label: apparent_line_extension_success_is_attributed_to_weak_competition
  label_origin: extractor_assigned
  claim: >
    The authors state directly that a line extension can raise sales, and that where it does the
    result should be read as evidence about the competitor rather than about the extension. Sales,
    in their frame, are a joint function of a brand's power and of the strength or weakness of the
    brands it faces, so a weakened brand can still gain against brands that have weakened
    themselves further. Their worked case is Diet Coke, which they say Coca-Cola had nothing to
    lose by launching because Pepsi had already line-extended into Diet Pepsi.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Power and sales are separated. Because a competitive outcome is relative, the absolute
      question — did this extension weaken the brand? — cannot be read off the share number, so a
      share gain is not treated as disconfirming.
  scope:
    domain_discussed_by_source: [brand_strategy, soft_drinks, consumer_packaged_goods]
    conditions: "wherever the competing brands are themselves line-extended or absent"
  caveats:
    - text: "this is the escape clause that makes the Law of Expansion very hard to disconfirm inside the book's own method: a failed extension confirms the law and a successful one is reassigned to competitor weakness, and the book states no independent way to establish competitor weakness before the fact"
      origin: extractor_observed
    - text: "the same move is made twice more in the span — for Vaseline Intensive Care (printed p. 66, customers misread the descriptor as a brand name) and for General Electric (printed p. 36, all its competitors are equally weak)"
      origin: extractor_observed
  source_stated_problems:
    - "you can therefore draw the conclusion that line extension works"
  source_stated_remedies: []
  examples:
    positive: []
    counter:
      - description: "Diet Coke: a successful extension, re-described as a case where the competitor had already given away the same ground"
