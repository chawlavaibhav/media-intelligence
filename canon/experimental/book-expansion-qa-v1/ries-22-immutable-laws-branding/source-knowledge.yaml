# Al Ries & Laura Ries, *The 22 Immutable Laws of Branding* (HarperBusiness, 2002 combined ed.)
# SPEC-03 SourceKnowledge. EXPERIMENTAL — NOT LIVE CANON. book-expansion-qa-v1, non-merge.
#
# LOCATORS: Case 1. printed page = PDF page - 17, folio verified on six rendered pages by this
# lane (see PROVENANCE.md §2). page_start / page_end carry PRINTED numbers throughout. The real
# printed span of this volume is 1-240; the span extracted here is the Introduction (roman ix-xvi,
# recorded as null pages with the roman range in provenance.section) and chapters 1-22, printed
# pp. 3-110. Nothing here cites outside that.
#
# EVIDENCE LEVEL — STATED ONCE, AND IT GOVERNS EVERY OBJECT BELOW:
# The word "law" in this book is the authors' rhetoric, not a finding. These are two practising
# positioning consultants writing about their own clients and about companies whose outcomes were
# already known when they wrote. The book reports NO measurement of its own: no study, no
# controlled comparison, no base rate, no counting method, no sample. Every quantitative statement
# in this span is either a third-party figure reported second-hand, a before/after share pair with
# no comparison group, research invoked but not reported ("our research indicates", "years of
# observation have led us to this conclusion"), or a decorative count. `empirical_within_source`
# is therefore used ZERO times in this file. That is a finding about the source, not an omission;
# PROVENANCE.md §7 sets out the four rejected candidate cases individually.
# Accordingly every law-bearing object carries `practitioner_assertion`, most carry `anecdotal`
# and `outcome_claimed`, and every object resting on named companies carries `historical_claim`.
#
# SURVIVORSHIP AND HINDSIGHT ARE UNMANAGED IN THE SOURCE. Cases are selected after outcomes were
# known. Successes are read back as compliance with the laws; failures as violation of them. The
# book presents almost no focused brand that failed and almost no extended brand that kept
# succeeding — the three it cannot avoid (Diet Coke, Vaseline Intensive Care, General Electric)
# are each re-labelled rather than counted against the law. Every affected object carries an
# `extractor_observed` caveat saying so in its own terms. It is never softened into the `claim`.
#
# PERIOD. Every company example is pre-2002. This lane has deliberately NOT updated any example
# with what happened to those companies afterwards: there is no source for that here and doing so
# would be invention. `historical_claim` marks the affected objects.
#
# SUBJECT. This book is about brands and markets. It says nothing about generative media, and no
# inference about any model's capability has been drawn from it anywhere in this directory.
#
# FIGURES. The volume advertises "added illustrations"; none survive in this copy's text layer and
# none was inspected. Every object is `source_support: text`. See EXTRACTION-NOTES.md,
# `figure_semantic_binding_lost`.

source_id: ries-22-immutable-laws-branding

