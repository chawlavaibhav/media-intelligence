- sk_id: sk_r22_0004
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "most dotcom failures are branding failures"
    - "You can't build a brand in the real world, and you certainly can't build a brand on the Internet, if you violate the laws of branding."
  concept_label: outcomes_are_read_back_as_compliance_or_violation_of_the_laws
  label_origin: extractor_assigned
  claim: >
    The authors' method of demonstrating the laws, stated openly in the Introduction, is to take
    known outcomes and assign each one to a law that was followed or broken. Named failures are
    each attributed to the violation of a specific numbered law, and named successes are attributed
    to "good branding"; the authors then predict that companies following the principles will
    succeed. They also assert that the laws apply equally to the Internet and to the real world,
    so no market is outside their reach.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [brand_strategy, internet_commerce]
    conditions: "the authors state no condition; the laws are asserted to hold universally"
  caveats:
    - text: "recorded here as a description of the book's method, not as an endorsement of it: because every outcome can be assigned to some law after the fact, no outcome in this book is capable of counting against a law"
      origin: extractor_observed
    - text: "no base rate is given anywhere in the span — the reader is never told how many focused brands were launched, how many extensions were launched, or what share of each survived"
      origin: extractor_observed
    - text: "sharply period-bound: the dotcom cases are of 1999-2001 and their later fates are outside this copy"
      origin: extractor_observed
  source_stated_problems:
    - "the dotcom boom has become the dotcom bust"
  source_stated_remedies:
    - "study both the Internet itself and the laws of branding"
  examples:
