- sk_id: sk_r22_0006
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "Short term versus long term."
    - "milk brands rather than build them"
  concept_label: broadening_buys_short_term_sales_at_the_cost_of_long_term_brand_meaning
  label_origin: extractor_assigned
  claim: >
    The authors put the central trade-off of the book as a question about time horizon: broaden
    the line and increase sales now, or keep the line narrow, build the brand in the mind, and
    increase sales later. They state that most companies choose the short term, and that in the
    short term the conventional strategies do work — expansion and line extension can increase
    sales — but that in the long run they usually undermine the brand and decrease sales. The
    trade-off is not presented as a balance to be struck but as a choice the authors think is
    almost always made wrongly.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Brand meaning is treated as a stock that expansion draws down. Milking yields easy money now
      while wearing the brand down until it stands for nothing, at which point the sales that
      expansion was undertaken to produce are no longer available.
  scope:
    domain_discussed_by_source: [brand_strategy, consumer_packaged_goods]
    conditions: "the authors set no time constant; 'long term' is nowhere defined in years"
  caveats:
    - text: "the horizon at which the reversal is claimed to occur is never specified, which makes the claim difficult to test on any particular case"
      origin: extractor_observed
    - text: "the authors concede the short-term gain is real; the disagreement with conventional practice is entirely about the later half of the curve, for which the book supplies no measurement"
      origin: extractor_observed
  source_stated_problems:
    - "the emphasis in most companies is on the short term"
  source_stated_remedies:
    - "do you keep a narrow line in order to build the brand in the mind and increase sales in the future?"
  examples:
