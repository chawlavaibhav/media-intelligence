- sk_id: sk_r22_0008
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "There are thousands of tiny teeter-totters in the consumer's mind."
    - "most people try to assign one brand name to each product"
  concept_label: customers_assign_one_name_per_product_so_brand_hierarchies_do_not_survive_contact
  label_origin: extractor_assigned
  claim: >
    Against the masterbrand / superbrand / megabrand justification for line extension, the authors
    claim that people assign exactly one name to each product and choose whichever name best
    captures its essence — sometimes the parent name, sometimes the model name, sometimes a
    nickname — and that they are not consistent about which. Two names for one product cannot both
    be uppermost: the Lumina owner says "I drive a Chevrolet" while the Corvette owner says "I
    drive a Vette". They add that customers want brands that are narrow in scope and nameable in a
    single word, the shorter the better, and that overzealous compound brand names run against this.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The teeter-totter image is the mechanism: for each pairing of parent name and model name only
      one end can be up, so the mental hierarchy the marketer designed collapses into a single name
      per product, and which one survives is not under the marketer's control.
  scope:
    domain_discussed_by_source: [brand_strategy, brand_naming, automobiles, consumer_packaged_goods]
    conditions: "the authors state it as a general property of how people name things"
  caveats:
    - text: "the claim about how minds work is illustrated with two invented lines of dialogue and no observation of actual customers"
      origin: extractor_observed
    - text: "the list of 'ridiculously overzealous' names is a list of names the authors dislike; no evidence is given that any of them underperformed"
      origin: extractor_observed
  source_stated_problems:
    - "marketers constantly run branding programs that are in conflict with how people want to perceive their brands"
  source_stated_remedies:
    - "customers want brands that are narrow in scope and are distinguishable by a single word, the shorter the better"
  examples:
    positive:
      - description: "the Chevrolet/Lumina and Chevrolet/Corvette pairs, used to show which name comes up in each case"
        figure_ref: null
    counter: []
