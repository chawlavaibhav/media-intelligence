      origin: extractor_observed
    - text: "the evidence offered for Subway is Fred DeLuca's disclosed salary across 1990-1994, which is a fact about an owner's pay and not a measurement of the effect of narrowing"
      origin: extractor_observed
    - text: "in the same chapter the authors note in passing that Starbucks 'currently is busy getting into everything from ice cream to bottled drinks to tea' — their own hero example is, on their account, expanding — and they do not treat this as bearing on the law"
      origin: extractor_observed
    - text: "historical: all cases pre-2002"
      origin: extractor_observed
