- sk_id: sk_r22_0005
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "The Law of Expansion"
    - "The power of a brand is inversely proportional to its scope."
  concept_label: brand_power_is_inversely_proportional_to_scope
  label_origin: source_verbatim
  claim: >
    Law 1. The authors assert that putting a brand name on more things makes the name weaker, and
    state the relation in the strong form of an inverse proportion between power and scope. Their
    diagnostic is the "what comes to mind?" test: a name that returns nothing specific — Chevrolet
    returning "a large, small, cheap, expensive car . . . or truck" — has already lost its power.
    They separate power from sales explicitly: a brand that has been weakened by expansion can
    still sell well if its competitors are equally weak.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A brand's power lives in what the name retrieves from a mind. Attaching the name to more and
      more different things means no single meaning can be retrieved, so the name "no longer stands
      for anything". The authors describe the alternative to building as "milking": expansion
      converts accumulated brand meaning into present sales and does not replace it.
  scope:
    domain_discussed_by_source: [brand_strategy, automobiles, credit_cards, apparel, consumer_packaged_goods]
    conditions: "stated as a law without conditions; the authors' cases are all consumer categories with an established leader"
  caveats:
    - text: "the authors themselves note that sales are a function of the competition's strength as well as brand power, so market-share movements cannot on their own establish the law"
      origin: source_stated
    - text: "the market-share pairs offered as evidence (American Express 27% to 18%, Levi's 31% to 19%, Crest 36% to more than fifty SKUs at 25%) are two numbers each, with no comparison group, no alignment of periods and no test of the asserted cause; each brand also faced changes the book does not mention"
      origin: extractor_observed
    - text: "'inversely proportional' is used rhetorically — no quantity is ever computed anywhere in the book"
      origin: extractor_observed
    - text: "historical: every case is pre-2002"
      origin: extractor_observed
  source_stated_problems:
    - "when you put your brand name on everything, that name loses its power"
    - "line extension, megabranding, variable pricing . . . are being used to milk brands rather than build them"
  source_stated_remedies:
    - "you need to contract your brand, not expand it"
  examples:
    positive:
      - description: "Ford outselling Chevrolet, attributed to Ford's eight car models against Chevrolet's ten"
        figure_ref: null
    counter:
      - description: "Diet Coke, conceded to have worked, and explained away by the weakness of Pepsi's own line-extended Diet Pepsi rather than counted against the law"
        figure_ref: null
  intra_source_relations:
    - {relation: trades_off_with, target: sk_r22_0006, note: "the expansion decision is framed by the authors as a short-term/long-term trade"}
    - {relation: qualified_by, target: sk_r22_0007, note: "the weak-competition escape clause"}
    - {relation: generalises, target: sk_r22_0031, note: "the Law of Extensions is this law applied to product lines"}
    - {relation: contradicts, target: sk_r22_0041, note: "the Law of Siblings licenses a portfolio of several brands from one company; the authors reconcile this only by requiring separate identities"}
  evidence:
