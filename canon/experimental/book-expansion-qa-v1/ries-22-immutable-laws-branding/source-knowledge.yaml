- sk_id: sk_r22_0022
  source_id: ries-22-immutable-laws-branding
  source_terms:
    - "The Law of Credentials"
    - "The crucial ingredient in the success of any brand is its claim to authenticity."
    - "Credentials are the collateral you put up to guarantee the performance of your brand."
  concept_label: the_authenticity_claim_is_what_makes_other_claims_believable
  label_origin: source_verbatim
  claim: >
    Law 6. The authors start from customer disbelief: prospects are suspicious and discount most
    product claims. They argue one claim takes precedence over all others because it makes the
    others credible — the claim to authenticity, to being the real thing. Benefit claims made
    without credentials are, on their account, generally ignored, because every competitor makes
    the same sort of claim; the same benefit claims attached to a credential carry much more
    weight. They extend the point to buyer behaviour generally with the empty-restaurant
    observation: people prefer to wait for a table where there is a queue rather than eat in an
    empty room.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Credentials work as collateral. A claim about performance is unverifiable at the point of
      choice, so the prospect looks for something that stands behind it; where a brand supplies
      that, the prospect will believe almost anything else it says. Absent it, benefit claims fall
      into the undifferentiated mass that provokes "that's what they all say".
  scope:
    domain_discussed_by_source: [brand_communication, persuasion, advertising]
    conditions: "wherever prospects cannot verify a product claim before buying"
  caveats:
