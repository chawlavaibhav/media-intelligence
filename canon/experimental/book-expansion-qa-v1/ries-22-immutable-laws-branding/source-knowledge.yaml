  label_origin: extractor_assigned
  claim: >
    The authors make leadership the default credential and, where a brand does not lead, prescribe
    inventing a category narrow enough that it does. They add three operating rules: promote
    leadership even where the market is tiny, because the market may grow and the position is hard
    to dislodge later; never assume prospects know who leads, which they say matters most in new
    categories where prospects have no experience and gravitate to the leader; and accept that as a
    category matures the more adventurous customers will go out of their way to avoid the leader —
    write them off, because you cannot appeal to everybody.
