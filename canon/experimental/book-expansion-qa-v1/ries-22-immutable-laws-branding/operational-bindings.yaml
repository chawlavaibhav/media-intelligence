  target_schema: null
  target_schema_version: null
  role: [constrains, flags]
  governance_consumer: conflict_resolution
  observation_unit: null
  rationale: >
    This source contains conflicts INSIDE itself — a share ceiling against a domination objective, a
    smothering prescription against a welcoming one, "never change" against three permitted changes
    — and the project needs a settled way to hold them. The constraint this binding imposes is that
    intra-source conflict is retained and surfaced, never silently resolved by preferring whichever
    passage a retrieval happened to reach first. Any consumer that returns one side of a recorded
    conflict must return the other with it. The conflicts are enumerated in scs_r22_001's
    internal_structure and each is a pair of citable passages, so this is mechanically enforceable.
  applicability:
    when: "any consumer retrieves a claim from this source that appears in scs_r22_001's recorded conflict list"
    limits: >
      This governs how conflicts are held, not how they are decided — nothing here says which side
      of any pair is right, and this lane deliberately did not decide. Note also the scope of the
      rule: it covers conflicts WITHIN this source. Disagreements between this source and any other
      are outside it, are recorded as prose observations in EXTRACTION-NOTES.md, and require
      Controller review before anything at all is done with them.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_r22_0055]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_r22_008
  source_knowledge_refs: [sk_r22_0004, sk_r22_0007, sk_r22_0026, sk_r22_0049]
  source_system_refs: []
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains, flags]
  governance_consumer: evidence_interpretation
  observation_unit: null
  rationale: >
    The single largest hazard this source presents is lexical: it calls its contents "immutable
    laws", and the word will do evidential work downstream that the book does not support. The
    constraint is that no claim from this source may be weighted by the word "law" in its name.
    Every object here carries `practitioner_assertion`, most carry `anecdotal` and `outcome_claimed`,
    and none carries `empirical_within_source` — that is what a consumer must weight on. The binding
    also names the specific pattern that makes the claims untestable and that a consumer should
    flag: the weak-competition clause, by which a successful counter-example is reassigned to the
    competitor's weakness rather than counted, used four times in this span.
  applicability:
    when: "any consumer weighs a claim originating in this source, or compares it against a claim from a source that reports measurement"
    limits: >
      This is a rule about weighting, not about truth. Nothing here says the authors are wrong —
      several of their claims may well be right, and this lane took no position on any of them. It
      says only that this book supplies no evidence for them beyond selected anecdote, and that a
      consumer must not infer otherwise from the title. The rule cannot be used to dismiss the
      source either: `practitioner_assertion` is a real category of knowledge and this is an
      unusually articulate instance of it.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_r22_0061]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_r22_009
  source_knowledge_refs: [sk_r22_0005, sk_r22_0031, sk_r22_0041, sk_r22_0045, sk_r22_0046]
  source_system_refs: [scs_r22_001, scs_r22_003]
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains]
  governance_consumer: rule_application
  observation_unit: null
  rationale: >
    Several of this source's rules are stated absolutely and then qualified elsewhere in the book by
    a different law. "Never put your name on anything else" is qualified by the Law of Siblings.
    "Markets may change but brands shouldn't. Ever." is qualified by the Law of Change. "Narrow the
    focus" is qualified by the four permitted growth routes. Applying any of these in its absolute
    form is applying something the authors themselves did not hold. The constraint is that when a
    rule from this source is applied, its qualifying partner is applied with it, and the pairs are
    recorded in scs_r22_001 and scs_r22_003 so that the requirement is checkable rather than a
    matter of memory.
  applicability:
    when: "a rule originating in this source is being applied to a decision, as opposed to merely retrieved"
    limits: >
      The source supplies no criterion for when a qualification takes over — no test for when the
      'time and place' for a second brand has arrived, none for distinguishing a real market shift
      from a passing one, none for deciding whether a brand is weak enough in the mind to be
      changed. So this binding can make the qualification visible; it cannot make the rule
      decidable, and no consumer should treat a pair of qualified rules as an algorithm. The
      judgement remains a human one, exactly as it is in the book.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_r22_0033, t_r22_0034]
  repair_ontology_refs: [t_r22_0043, t_r22_0036]
  status: proposed
  status_reason: "experimental; not reviewed"
