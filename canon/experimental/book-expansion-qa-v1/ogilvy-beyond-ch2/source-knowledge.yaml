    Five times as many people read the headline as read the body copy, from which the source
    concludes that a headline which does not sell the product wastes ninety per cent of the money.
    Because eighty per cent of readers never reach the body copy, the brand name must be in the
    headline or those readers will never learn what is being advertised. He calls an advertisement
    with no headline at all a headless wonder and the silliest thing of all.
