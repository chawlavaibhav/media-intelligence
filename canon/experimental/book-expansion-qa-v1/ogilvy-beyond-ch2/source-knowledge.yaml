- sk_id: sk_ogx_0028
  source_id: ogilvy-beyond-ch2
  source_terms:
    - "Professor Tinker of Stanford has established that capitals retard reading. They have no ascenders or descenders to help you recognize words , and tend to be read letter by letter."
    - "The eye is a creature of habit."
    - "Which typefaces are easiest to read? Those which people are accustomed to reading... The more outlandish the typeface, the harder it is to read. The drama belongs in what you say, not in the typeface."
    - "You can't save souls in an empty church."
  concept_label: legibility_is_governed_by_reading_habit_and_typography_cannot_sell_but_can_prevent_selling
  label_origin: extractor_assigned
  claim: >
    The source's organising principle for typography is that the eye is a creature of habit: what
    is easy to read is what people are accustomed to reading. From this he derives both the
    failures and the settings. Failures: capitals retard reading because they have no ascenders or
    descenders and tend to be read letter by letter; headlines superimposed on the illustration;
    a full stop at the end of a headline, which he says stops the reader dead; a measure too wide
    or too narrow; copy used as raw material for designing shapes; and reverse type, white on
    black, which he calls almost impossible to read and reports counting forty-seven instances in
    one magazine issue. Settings: familiar faces such as the Century family, Caslon, Baskerville
    and Jenson, and a measure of about forty characters, the width people are used to in
    newspapers. He then states the limit of the whole subject himself: no housewife ever bought a
    detergent because the advertisement was set in Caslon, but an advertisement nobody can read
    cannot sell — you cannot save souls in an empty church. He notes that layouts are often pinned
    to a board and approved at fifteen feet, which leads to headlines set in seventy-two point that
    are impossible to read at the actual reading distance of twenty inches.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Reading is a trained habit, so legibility is a function of familiarity rather than of design
      quality; and typography is a necessary condition for selling rather than a cause of it.
  scope:
    domain_discussed_by_source: [print_advertising]
    conditions: "readers trained on the books, newspapers and magazines of the period"
  caveats:
    - text: "the reverse-type claim is the one point in the chapter where the source reports an actual comparison with a result: a charity running advertisements in reverse was persuaded to test black on white and raised twice as much money"
      origin: source_stated
    - text: "Tinker is cited by name and institution but without a study or a date, and the serif claim is supported by a novelist's opinion rather than by measurement"
      origin: extractor_observed
    - text: "the familiarity argument is explicitly relative to what readers of that period were accustomed to; it is a claim about trained habit, not about letterforms, and its conclusions move with the habit"
      origin: extractor_observed
    - text: "the direct response chapter names two exceptions to the reverse-type rule — theatre programmes read against stage light, and slides projected on a screen — both cases where the page is not the light source"
      origin: extractor_observed
  source_stated_problems:
    - "capitals retard reading"
    - "reverse type is almost impossible to read"
    - "layouts approved at a distance of 15 feet"
  source_stated_remedies:
    - "set headlines and copy in lower case, in familiar faces, at a familiar measure"
    - "set copy black on white"
    - "judge a layout at the distance it will actually be read"
