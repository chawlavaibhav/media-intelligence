# David Ogilvy, Ogilvy on Advertising (1983) — the chapters BEYOND chapter 2
# EXPERIMENTAL — NOT LIVE CANON. Lane: ogilvy-beyond-ch2, book-expansion-qa-v1. Non-merge.
#
# SCOPE EXTENSION of the live Canon source `ogilvy-ch2-advertising-that-sells`. This is the SAME
# WORK, not an independent origin against it. Chapter 2 is not re-extracted here. Where a later
# chapter qualifies or contradicts a chapter-2 claim, that is recorded as the SAME AUTHOR
# QUALIFYING HIS OWN EARLIER STATEMENT and never as two sources disagreeing.
#
# LOCATORS: EPUB, reflowable. THIS SOURCE HAS NO AUTHORED PAGE NUMBERS. Every page_start and
# page_end is null and no page number is invented anywhere. Locators are chapter number + chapter
# title + the book's own section heading, with the spine marker as a file-position aid only.
# Audit pattern: no_authored_page.
#
# EVIDENCE REGISTER: this source constantly asserts sales results. `outcome_claimed` is used
# wherever a result is claimed without controls. `empirical_within_source` is used ONLY where the
# source reports an actual measurement AND states what it returned. Where the source says research
# established something but never supplies the result, that is recorded in a caveat with the
# phrase "measurement asserted, result withheld".
#
# HISTORICAL: 1983, describing print, television, radio and direct mail of that era. Media
# economics and audience behaviour that no longer hold are labelled `historical_claim`. NOTHING
# here is modernised, and no 1983 television rule is translated into a claim about any later
# medium.
#
# CULTURE: some passages carry 1983 assumptions about audiences, particularly about women as the
# default reader of food and household advertising. Those are recorded as `culturally_bounded`
# statements of what this source held, never as actionable guidance.
#
# FIGURES: the book reproduces advertisements that carry its argument. In this copy those
# reproductions are absent and replaced by "Click here for hi-res image" placeholders. No visual
# claim is reconstructed from text. Objects that depend on an unseen advertisement carry
# `extraction_uncertainty: figure_not_inspected`.

