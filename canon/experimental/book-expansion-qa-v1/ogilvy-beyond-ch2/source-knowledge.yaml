  source_terms:
    - "My advice is to choose things that are unique to the country concerned. People don't go half the way round the world to see things they can equally well see at home."
    - "People dream about visiting foreign countries. The job of your advertising is to convert their dreams into action. This can best be done by combining mouth-watering photographs with specific how-to-do-it information."
    - "Why did I not project a progressive industrial society?... Because our research had shown that American tourists had no desire to see such things, that's why."
  concept_label: advertise_what_is_unique_to_the_place_and_convert_the_dream_with_practical_information
  label_origin: extractor_assigned
  claim: >
    In travel advertising the source says the most important factor is the choice of subject to
    illustrate, and the rule is to choose what is unique to the country: people do not travel to
    see what they could see at home, so ski resorts should not be advertised to the Swiss nor
    American food to the French. Because people already dream about foreign countries, the job of
    the advertising is to convert the dream into action, which he says is best done by combining
    appetising photographs with specific practical information — what it costs, what to wear, the
