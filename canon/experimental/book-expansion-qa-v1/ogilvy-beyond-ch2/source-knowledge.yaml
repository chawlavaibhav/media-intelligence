    reporting how consumers were observed to react to different stimuli. He illustrates the
    distinction with two speech acts he would actually perform: telling a copywriter that research
    shows celebrity commercials are below average at persuading people to buy and asking whether he
    is sure he wants one, and telling an art director that research suggests black type on white
