# ══ CHAPTER 3 — Jobs in advertising ════════════════════════════════════════════

- sk_id: sk_ogx_0003
  source_id: ogilvy-beyond-ch2
  source_terms:
    - "They have little or no system for retrieving research which has already been conducted."
    - "Even if somebody remembers that the research was done, nobody can find it. So we re-invent the wheel, year after year."
  concept_label: findings_are_lost_because_nothing_retrieves_them_and_the_people_move_on
  label_origin: extractor_assigned
  claim: >
    The source names a specific mechanism for the field's failure to accumulate knowledge:
    research reports are read, sometimes acted on and filed, and within about two years the
    researcher, the account executive, the copywriter and the brand manager have all moved to other
    jobs. Nothing retrieves the report and nobody remembers it exists, so the same question is
    researched again. He lists this among nine complaints about agency research departments,
    alongside their slowness, their inability to agree on methodology, and a perfectionism that
    refuses projects which would produce actionable results.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Loss is caused by two things acting together — no retrieval system, and personnel turnover
      fast enough that institutional memory of the report disappears with the people.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "advertising agency research departments as the author found them"
  caveats:
    - text: "this qualifies the live Canon object sk_ogl_c003_0019 from chapter 2, which states that the field refuses to learn its own rudiments; the later chapter supplies a concrete cause for that failure rather than attributing it to unwillingness. It is the same author extending his own earlier claim, not a second source"
      origin: extractor_observed
    - text: "the two-year figure and the account of turnover are asserted from the author's experience, without survey or count"
      origin: extractor_observed
  source_stated_problems:
