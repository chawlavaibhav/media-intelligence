# ── cross-lane, OBSERVATIONS ONLY — no promotion, no merge ─────────────────────
- {from: t_ogx_0067, to: t_sa8_0002, relation: related_to, confidence_basis: extractor_judgement, note: "OBSERVATION ONLY. Hopkins's term is space_spent_on_present_users, a problem; Ogilvy states in his chapter on Hopkins that this position was disproved by later research and that users read a product's advertisements more than non-users. That is one author reporting another as overturned, with no study named. It needs review, not a merge, and nothing is promoted here"}
- {from: t_ogx_0011, to: t_mla_0035, relation: related_to, confidence_basis: extractor_judgement, note: "OBSERVATION ONLY. Hopkins's ordinary_type_and_upper_and_lower_case and Ogilvy's capitals_retard_reading point the same way about capitals; the two are separated by decades and neither supplies a study, so this records a resemblance and asserts nothing"}
- {from: t_ogx_0031, to: t_mla_0032, relation: related_to, confidence_basis: extractor_judgement, note: "OBSERVATION ONLY. Hopkins's headline_as_salutation and Ogilvy's flag_them_down both treat the headline as selecting its audience rather than as announcing"}
- {from: t_ogx_0045, to: t_mla_0005, relation: related_to, confidence_basis: extractor_judgement, note: "OBSERVATION ONLY. Both are procedures for deciding by measured response rather than by argument; Ogilvy's split run varies one element inside a live advertisement, Hopkins's test campaign runs a whole campaign in a limited area. Similar purpose, different unit"}
- {from: t_ogx_0056, to: t_whip_0024, relation: distinct_from, confidence_basis: extractor_judgement, note: "OBSERVATION ONLY, and a negative one. Sullivan's two_second_outdoor_test compresses an out-of-home message to what can be read in passing; Ogilvy reasons from exposure duration in the opposite direction and warns explicitly against designing a transit card like a billboard. Both are about out-of-home and they are not the same claim"}

