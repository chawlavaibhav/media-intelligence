# David Ogilvy, Ogilvy on Advertising (1983) — chapters BEYOND chapter 2 — SPEC-05 ontology
# EXPERIMENTAL — NOT LIVE CANON. Lane: ogilvy-beyond-ch2, book-expansion-qa-v1. Non-merge.
#
# Terms keep the source's own words wherever he supplies one; `verbatim: false` marks a label of
# ours. No cross_source_concept (xs_) is created here — that is forbidden in this task. No
# `same_failure_family` is used — it requires human review under SPEC-05 governance.
#
# Cross-lane relationships appear below as OBSERVATIONS ONLY, restricted to related_to and
# distinct_from, and they promote nothing. In particular, the relation between this source's
# statement that users read a product's advertisements more than non-users and Hopkins's contrary
# rule is recorded as related_to with a note, NOT as a resolved contradiction: Ogilvy says the
# Hopkins position was disproved by later research he does not name, and that is a claim needing
# review, not a merge.
#
# `executable_by` on remedies: several of this source's remedies are physical print or mailing
# production, and those are NOT translated into any generative instruction. Several others are
# measurement or media procedures with no production form at all, and those carry `unknown`
# rather than being forced into a category that would misdescribe them.

terms:

# ── problems, in the source's frame ────────────────────────────────────────────

- term_id: t_ogx_0001
  term: headless_wonder
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    An advertisement run with no headline at all, which the source calls the silliest thing of all
    because headlines more than anything else decide an advertisement's success or failure.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0002
  term: blind_headline
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    A headline that does not say what the product is or what it will do for the reader. Reported at
    about twenty per cent below average in recall.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0003
  term: tricky_headline
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    A headline built on double meanings, puns or other obscurities, which the source calls
    counter-productive because the reader is travelling fast through a field of competing headlines.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0004
  term: brag_and_boast
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    Gallup's name, quoted by the source, for copy built on superlatives such as best in the world.
    Said to convince nobody.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0005
  term: readers_dont_complete_the_equation
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The failure of an analogy in copy: the reader does not perform the mapping step, and where the
    borrowed term is more vivid than the product the reader keeps the borrowed term.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0006
  term: the_celebrity_is_remembered_and_the_product_forgotten
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The reported failure of celebrity testimonials: high recall attaches to the celebrity, the
    product is forgotten, and the audience assumes the celebrity was paid.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0007
  term: the_disparaged_brand_becomes_the_hero
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The reported tendency for viewers of a comparative commercial that names a competitor to come
    away with the impression that the disparaged brand is the commercial's hero.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0008
  term: this_is_only_an_advertisement_skip_it
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The signal the source says advertising's inherited graphic conventions send to a reader before
    a word is read.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0009
  term: artdirectoritis
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The source's name for treating the copy in an advertisement as a design element and elevating
    principles of design over legibility.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0010
  term: reverse_type
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    White type on a black background, which the source calls almost impossible to read. He reports
    a charity that changed to black on white and raised twice as much money, and names two
    exceptions: theatre programmes read against stage light, and projected slides.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0011
  term: capitals_retard_reading
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    Setting headlines in capitals, which the source says slows reading because capitals have no
    ascenders or descenders to help word recognition and tend to be read letter by letter.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0012
  term: headline_superimposed_on_the_illustration
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    Setting a headline over the picture, named by the source as another way to make a headline hard
    to read.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0013
  term: full_stop_at_the_end_of_a_headline
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    A period closing a headline, which the source says stops the reader dead; he notes newspapers
    do not do it.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0014
  term: approval_at_fifteen_feet
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    Judging a layout pinned to a bulletin board at meeting distance as if it were a poster, which
    the source says leads to headlines set far too large to read at the actual reading distance.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0015
  term: miscomprehension
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The source's borrowed term for viewers taking a commercial to mean something other than what it
    meant. In the study he cites, all twenty-five commercials were miscomprehended, none by fewer
    than nineteen per cent of viewers.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0016
  term: opening_with_something_dull
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    A commercial whose first frames do not surprise, which the source says causes viewers to screen
    it out before the payoff the maker knows is coming.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0017
  term: visual_banality
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    Showing a viewer what she has seen many times — his examples are sunsets and happy families at
    the dinner table — in an environment he describes as thirty thousand commercials a year.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0018
  term: divergence_between_super_and_soundtrack
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    A superimposed line whose wording differs from the words spoken over it, which the source says
    confuses the viewer.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0019
  term: brand_misattributed_to_a_competitor
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The failure in which viewers remember a commercial and credit it to a competing brand, so the
    advertising works for the rival.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0020
  term: interchangeable_corporate_slogan
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    A corporate line any competitor could sign, which therefore identifies nobody; the source adds
    that such lines sit where nobody reads them and reduce readership of the copy by cluttering the
    layout.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0021
  term: babies_beagles_and_bosoms
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The source's phrase for decorating a technical advertisement with irrelevant attractive imagery,
    on the assumption that the reader finds the product as boring as the copywriter does.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0022
  term: the_writers_own_interest
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    Assuming that a subject which interests the person making the advertisement will interest
    consumers. The source's example of the failure is his own use of chefs.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0023
  term: self_indulgent_double_spread
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    A two-page spread bought for size rather than function; the source allows a functional exception
    for a product that must be shown horizontally, and qualifies the rule himself in a footnote.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0024
  term: response_device_selects_the_wrong_customer
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    Sweepstakes, premiums, free offers and low prices raise initial response while attracting a
    customer who is not always the one who becomes a long-term buyer.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0025
  term: research_as_a_lamppost
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The source's image for agencies and clients using research to prove they are right — as a
    drunkard uses a lamppost, not for illumination but for support.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0026
  term: findings_that_cannot_be_retrieved
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    Research read, sometimes acted on and filed, with no retrieval system, so that after the people
    involved have moved on nobody can find it and the same question is researched again.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0027
  term: advertising_approved_by_the_dealer_convention
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    The source's diagnosis of a category whose advertising is aimed not at consumers but at winning
    an ovation from the trade audience that approves it.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0028
  term: campaign_aborted_before_it_could_be_measured
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: problem
  definition_in_origin_frame: >
    A campaign begun with no clear objective and not tracked by research, then stopped before any
    stated objective could have been reached.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

# ── remedies, in the source's frame ────────────────────────────────────────────

- term_id: t_ogx_0029
  term: telegraph_what_you_want_to_say
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Write the headline so its message arrives on the first pass, because it is being scanned among
    hundreds of others.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_ogx_0030
  term: put_the_brand_name_in_the_headline
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Name the product where the eighty per cent who never read the body copy will see it.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_ogx_0031
  term: flag_them_down
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Put a word in the headline that causes the small relevant audience to select itself — a
    condition, an age, or the name of the city in a local newspaper.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_ogx_0032
  term: caption_carrying_the_brand_name_and_the_promise
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Never run an illustration without a caption beneath it, and make the caption carry the brand
    name and the promise, because captions outdraw body copy.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_ogx_0033
  term: editorial_graphics
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Set the advertisement in the conventions of an edited page rather than of an advertisement:
    copy given priority, serif type, columns of readable measure, a caption under every photograph,
    drop-initials, black on white. Physical print setting of the period; not translated.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: physical_production

- term_id: t_ogx_0034
  term: set_black_type_on_white
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    The reverse of reverse type. A print setting decision; not translated into any other frame.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: physical_production

- term_id: t_ogx_0035
  term: familiar_face_at_a_familiar_measure
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Set in lower case, in faces readers are accustomed to, at about forty characters — the measure
    of the newspapers they read. Physical print setting; not translated.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: physical_production

- term_id: t_ogx_0036
  term: drop_initial
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    An enlarged opening capital beginning the body copy, reported to increase readership by an
    average of thirteen per cent. Physical setting; not translated.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: physical_production

- term_id: t_ogx_0037
  term: cross_head
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    A subheading inserted after two or three inches of copy and thereafter throughout, some phrased
    as questions, to keep the reader marching forward. In direct response, written so that skimmers
    get the main points of the sales story.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_ogx_0038
  term: lead_the_paragraphs
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Line-spacing between paragraphs, reported to increase readership by an average of twelve per
    cent. Physical setting; not translated.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: physical_production

- term_id: t_ogx_0039
  term: open_with_the_fire
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Grab attention in the first frame with a visual surprise, because the viewer does not know a
    payoff is coming and will be gone before it arrives. Stated for the thirty-second commercial of
    1983.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_ogx_0040
  term: brand_name_within_the_first_ten_seconds
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Register the product name early and repeatedly, because the default failure is that the
    commercial is remembered and the brand is not.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_ogx_0041
  term: end_by_showing_the_package
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Close the commercial on the package, reported as more effective at changing brand preference
    than not doing so.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_ogx_0042
  term: super_matching_the_spoken_words
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Set the promise in type over the picture while the soundtrack speaks it, using exactly the same
    words.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_ogx_0043
  term: let_the_interviewer_attack_the_product
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Have the interviewer pretend to find fault so that a loyal user rises to the product's defence,
    which the source says produces far more conviction than asking what the user thinks.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_ogx_0044
  term: make_the_coupon_a_mini_ad
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Because readers skip from the headline to the coupon to find the offer, the coupon must carry
    the brand name, the promise and a small photograph of the product.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_ogx_0045
  term: split_run
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Run two advertisements differing only in the headline promise, each offering a free sample, so
    that half the circulation gets one and half the other; the headline drawing more applications
    wins. Only two can be tested at a time.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: unknown

- term_id: t_ogx_0046
  term: the_control
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Treat a mailing that produces profitable results as the baseline and test both additions and
    removals against it, on profit rather than response.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: unknown

- term_id: t_ogx_0047
  term: test_the_international_campaign_in_each_country
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Settle the dispute between a multinational campaign and a local objection by testing locally,
    using the campaign only where results are positive and modifying it for the local culture even
    then.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: unknown

- term_id: t_ogx_0048
  term: analyse_your_inquiries
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Survey a sample of inquirers about their intent, question the salespeople who followed the
    inquiries up about whether they led to sales, and relate inquiries back to the media that
    produced them.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: unknown

- term_id: t_ogx_0049
  term: change_when_the_tracked_series_flattens
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Read wear-out from the rate of improvement in a tracked attitude series rather than from its
    level, and change the advertising when the improvement stops.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: unknown

- term_id: t_ogx_0050
  term: reword_so_the_answer_needs_no_lie
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Change a survey question so that the answer the respondent wants to give is available without an
    admission — his case being a switch from whether people had read a book to whether they planned
    to.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_ogx_0051
  term: sensitise_then_solicit_personally
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    For a cause, use advertising to make the market aware and raise the money by personal
    solicitation, rather than judging the advertising by contributions returned in the mail.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: unknown

- term_id: t_ogx_0052
  term: change_the_audience_not_the_message
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: remedy
  definition_in_origin_frame: >
    Where a campaign reaches its intended audience without moving the behaviour, address a different
    audience within the same objective — his reported case moved from teenagers to their parents.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

# ── properties ─────────────────────────────────────────────────────────────────

- term_id: t_ogx_0053
  term: story_appeal
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: property
  definition_in_origin_frame: >
    Harold Rudolph's name, adopted by the source, for the quality in a photograph that makes the
    reader ask what is going on and read the copy to find out. Reported as dose-responsive.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0054
  term: the_eye_is_a_creature_of_habit
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: property
  definition_in_origin_frame: >
    The source's organising principle for typography and layout: what is easy to read is what
    readers are accustomed to reading, so legibility is a function of trained familiarity.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0055
  term: order_of_scanning
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: property
  definition_in_origin_frame: >
    Illustration first, then headline, then copy, top to bottom — the order the source says readers
    already move in and from which he derives his layout rule.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0056
  term: exposure_duration
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: property
  definition_in_origin_frame: >
    How long the audience is in front of the advertisement, combined with whether they have anything
    else to read. The source uses it to set copy length for a subway card at twenty-one minutes with
    eighty-five per cent of riders carrying nothing else.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

- term_id: t_ogx_0057
  term: visual_burr
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: property
  definition_in_origin_frame: >
    A touch of singularity that sticks in the viewer's mind, offered as the answer to a saturated
    commercial environment.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ogx_0058
  term: moment_of_confirmation
  origin: source
  origin_ref: ogilvy-beyond-ch2
  kind: property
  definition_in_origin_frame: >
    A beat in a commercial in which a user attests to the property being claimed. Reported as
