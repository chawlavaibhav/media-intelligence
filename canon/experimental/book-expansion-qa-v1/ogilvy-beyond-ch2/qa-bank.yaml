# David Ogilvy, Ogilvy on Advertising (1983) — chapters BEYOND chapter 2 — Q&A bank
# EXPERIMENTAL — NOT LIVE CANON. Lane: ogilvy-beyond-ch2, book-expansion-qa-v1. Non-merge.
#
# SCOPE EXTENSION of the live Canon source `ogilvy-ch2-advertising-that-sells`. Same work, not an
# independent origin. Chapter 2 is not re-covered. Where a later chapter qualifies a chapter-2
# claim, the item says so as the same author qualifying himself.
#
# LOCATORS: EPUB, reflowable. NO AUTHORED PAGE NUMBERS EXIST IN THIS FORMAT and none is invented.
# Every source_locator is chapter number + chapter title + the book's own section heading, with the
# spine marker as a file-position aid only. Audit pattern: no_authored_page.
#
# REGISTER: this source asserts sales results constantly. Every `support` field states whether the
# answer rests on a measurement whose result the source supplies, on a result claimed without
# controls, on a reported anecdote, or on the author's opinion. Where an item is about what Ogilvy
# holds rather than about how the world is, answer_type is `source_position`.
#
# HISTORICAL: 1983. Media economics, audience behaviour and print technology of that era are named
# as such in the answers. No 1983 television or print rule is translated into a claim about any
# later medium.

qa_items:

- qa_id: qa_ogx_0001
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Headlines' (spine 13)"
  question: >
    Ogilvy states that five times as many people read the headline as read the body copy, and then
    immediately draws a much stronger conclusion from it. What is that conclusion, and what step is
    hidden inside it?
  answer: >
    His conclusion is that unless the headline sells the product, ninety per cent of the money has
    been wasted. The hidden step is a move from a readership ratio to a spending ratio: the five-to-
    one figure is about how many people read two parts of an advertisement, and the ninety per cent
    is a claim about wasted expenditure, which requires the further assumption that readership of
    the headline is what the money buys. He also derives from the same ratio that the brand name
    must appear in the headline, since eighty per cent of readers never reach the body copy and
    would otherwise never learn what is being advertised.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: >
    Chapter 7 opens by naming its evidence base — factor analyses commissioned from Gallup and
    Robinson, the Starch Readership Service, direct-response test results and the author's own
    observation — then gives the five-times figure and the ninety per cent conclusion in adjacent
    sentences. The readership figure is a reported measurement; the ninety per cent is his
    inference, not a measured waste.
  confounders:
    - "reading the ninety per cent as a measured finding rather than as an inference from the readership ratio"
    - "assuming the claim is about attention span; it is about the fall-off between two elements of one advertisement"
    - "confusing this with the chapter-2 doctrine that advertising must sell rather than please — that is a different claim, about the criterion, not about where readership sits"

- qa_id: qa_ogx_0002
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Headlines', the Starch and retail-study passage (spine 13)"
  question: >
    On headline length Ogilvy reports two findings that point opposite ways and then refuses to
    choose between them. State both findings, and name the reconciliation that is available in his
    own text but which he does not make.
  answer: >
    Starch reports that headlines of more than ten words get less readership than short headlines;
    a study of retail advertisements found that ten-word headlines sell more merchandise than short
    ones. His stated conclusion is that a long headline is fine if you need one and a short one is
    fine too. The reconciliation he does not make is that the two studies measure different
    quantities — readership in the first, merchandise sold in the second — so both can be true at
    once, and the practical question becomes which quantity you are buying. Elsewhere in the same
    chapter a caption states flatly that long headlines sell more merchandise than short ones,
    which is stronger than his running text allows.
  answer_type: comparison
  difficulty: hard
  knowledge_type: copywriting
  requires_application: false
  support: >
    Both findings are quoted from named sources in the Headlines section with his own one-sentence
    conclusion. Neither carries a sample or date. The readership-versus-sales distinction is
    present in his wording and absent from his reasoning.
  confounders:
    - "concluding that Ogilvy favours long headlines; his running text explicitly declines to favour either"
    - "treating the two findings as a contradiction that one of them must lose; they measure different outcomes"
    - "importing the modern default that shorter is always better, which neither study supports"

- qa_id: qa_ogx_0003
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Headlines', the passage on tricky headlines (spine 13)"
  question: >
    A team defends a punning headline as memorable and rewarding to decode. On Ogilvy's stated
    reasoning, what is wrong with the defence, and what is the specific property of the reading
    situation his objection rests on?
  answer: >
    His objection is not that puns are in poor taste but that the headline is not read in
    isolation. He states that in the average newspaper a headline competes with three hundred and
    fifty others and that readers travel fast through that jungle, so anything requiring a second
    pass loses the reader before the reward arrives. Obscurity is therefore a failure of speed
    inside a competitive scan. His instruction is that the headline should telegraph what you want
    to say. The property the argument rests on is the density of competing headlines on a 1983
    newspaper page, which is a fact about that medium at that time rather than a general law.
  answer_type: application
  difficulty: medium
  knowledge_type: copywriting
  requires_application: true
  support: >
    Stated claim with a mechanism, in the Headlines section. No measurement of the penalty is
    offered; the three-hundred-and-fifty figure describes the newspaper page of his period.
  confounders:
    - "arguing that Ogilvy dislikes wit as such; his objection is about decoding time in a competitive scan"
    - "generalising the density figure to any medium; he states it for the newspaper page of his era"
    - "confusing this with his separate finding that 'blind' headlines run about twenty per cent below average in recall — that is about naming the product, not about obscurity of phrasing"

- qa_id: qa_ogx_0004
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Illustrations', item 5 of 15 (spine 13)"
  question: >
    Ogilvy holds that photographs beat drawings on readership, believability and memory, and then
    names a condition under which he found the reverse. What is the condition, what case does he
    give, and what does the reversal tell you about why photographs win in the first place?
  answer: >
    The condition is reproduction quality: photographs reproduce so badly in some newspapers that a
    line drawing gives a more lifelike picture. His case is that scratch-board drawings sold more
    shoes for one retail client than photographs did. The reversal tells you the advantage of a
    photograph is realism rather than the medium itself, so the advantage survives only as far as
    the printing preserves it — where reproduction destroys the realism, a drawing that keeps its
    form wins. This is one of the few boundary conditions in the book that names a physical
    circumstance and reports a case where the general rule flipped.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    Stated rule with an explicit exception and one reported counter-case, in the illustrations list.
    The general claim is reported from unnamed research; the exception is his own observation. The
    Come to Britain case in the same item reports readership tripling, which is a measurement, and
    tourism tripling, which is attributed with nothing else excluded.
  confounders:
    - "treating the exception as a preference for illustration style; it is a claim about the printing process"
    - "reading the tripled tourism as evidence for the photograph rule; only the readership figure is a measurement"
    - "assuming the rule concerns aesthetic realism rather than believability under degraded reproduction"

- qa_id: qa_ogx_0005
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Body copy', the opening question (spine 13)"
  question: >
    Asked whether anybody reads body copy, Ogilvy refuses a yes or no and decomposes the question.
    Into what, and why does the decomposition change what a low readership figure means about the
    advertisement?
  answer: >
    He decomposes it into two determinants: how many people are interested in that kind of product,
    and how many were enticed into the advertisement by its illustration and headline. Only the
    second is inside the advertiser's control. The consequence is that a low body-copy readership
    figure is not by itself evidence that the advertisement is bad, because the same craft applied
    in a low-interest category returns a smaller number. He puts average magazine body-copy
    readership at about five per cent and argues that five per cent of a large circulation is still
    an enormous number of people.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: false
  support: >
    Stated claim with a reported average readership figure, in the Body copy section. The category
    examples are given in the gendered terms of his period. The five per cent average and the
    circulation arithmetic describe magazines of 1983.
  confounders:
    - "reading it as 'nobody reads body copy, so keep it short' — which is the position he is refusing"
    - "assuming category interest can be raised by the advertisement; he places it outside the advertisement's control"
    - "treating the five per cent as a target rather than as an average he uses to argue about absolute numbers"

- qa_id: qa_ogx_0006
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Body copy', the passage on analogies (spine 13)"
  question: >
    Ogilvy advises avoiding analogies in copy. His Rembrandt example describes a failure sharper
    than mere confusion. What exactly goes wrong, and which other failure in the book has the same
    shape?
  answer: >
    In his example an advertisement compares the product to a Rembrandt portrait and readers come
    away thinking the painting is what is for sale. The failure is not that the comparison is
    missed but that the borrowed vehicle displaces the product as the subject of the advertisement.
    His general statement is that readers do not complete the equation. The same shape appears in
    his account of celebrity testimonials, where the viewer remembers the celebrity and forgets the
    product, and again in his warning that a named competitor in a comparative commercial can end
    up being taken for its hero. In all three a more vivid borrowed element takes the memory the
    product needed.
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: copywriting
  requires_application: false
  support: >
    Attributed to Gallup with no study, sample or rate of misunderstanding supplied — a finding
    asserted with its result withheld. The parallel to the celebrity and competitor cases is drawn
    from Ogilvy's own statements in chapters 7, 8 and 12; he does not connect them himself.
  confounders:
    - "reading the advice as a stylistic preference for plain language"
    - "assuming the failure is that the analogy is too difficult; his claim is that the vehicle is remembered instead"
    - "treating the Gallup attribution as a citation; no study, sample or result is given"

- qa_id: qa_ogx_0007
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Short copy or long?' (spine 13)"
  question: >
    Ogilvy lists nine long-copy successes with response counts and market-share reversals. Why does
    none of the nine actually support his long-copy claim, and which single sentence in the section
    is doing the real evidential work?
  answer: >
    None of the nine supports the claim because each reports what one long-copy advertisement
    achieved with no short-copy version of the same offer to compare against, so copy length is not
    separated from everything else about the advertisement; and the nine were selected because they
    succeeded. The sentence carrying the weight is his statement that in direct-response split-run
    tests long copy invariably outsells short copy, because a split run is the one design in the
    book that holds the offer constant and varies the copy. He supplies no test, no margin, no
    product and no source for it — the measurement is asserted and the result withheld.
  answer_type: source_position
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: >
    Nine cases with outcomes, plus one sentence citing split-run evidence without any of its
    particulars. He also names his own two failures with long copy, a popular-priced cigar and a
    premium-priced whiskey, without analysing either.
  confounders:
    - "counting the response totals as evidence of the length effect; a single-arm result cannot isolate it"
    - "assuming the split-run claim is documented somewhere in the chapter; it is not"
    - "treating his two failures as the boundary condition; he names the products and never states the condition"

- qa_id: qa_ogx_0008
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Short copy or long?', the two claims about the block of copy (spine 13)"
  question: >
    Ogilvy makes two further claims about long copy and marks them very differently. Identify both,
    say how he marks each, and explain why they pull against each other.
  answer: >
    The first is that advertisements with long copy convey the impression that you have something
    important to say, whether or not people read the copy — and he flags this himself as a belief
    held without any research to support him. The second is a condition: if you want long copy read
    you had better write it well, and in particular the first paragraph must be a grabber. They
    pull against each other because if part of the effect comes from the copy being seen rather
    than read, then the quality of the writing matters less than the second claim demands. He does
    not notice the tension.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: copywriting
  requires_application: false
  support: >
    Both claims are in the same short passage. The first is explicitly disclaimed by the author as
    unsupported; the second is asserted with a counter-example of a limp opening sentence from a
    resort advertisement.
  confounders:
    - "treating the importance-signal claim as one of his research findings; he says the opposite"
    - "reading the grabber rule as being about the headline; it concerns the first paragraph of body copy"
    - "assuming he resolves the tension — he does not raise it"

- qa_id: qa_ogx_0009
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Layouts', the scanning-order passage (spine 13)"
  question: >
    You are handed a print layout with the headline set across the top, a photograph beneath it and
    copy below that. State Ogilvy's objection, the figure he attaches to it, and the reason he gives
    for why the order matters.
  answer: >
    His objection is that readers look first at the illustration, then the headline, then the copy,
    and scan from top to bottom, so putting the headline above the illustration asks people to scan
    against their habit. The elements should run illustration, headline, copy down the page. He
    reports that headlines below the illustration are read by ten per cent more people on average,
    notes that ten per cent of a large circulation is a very large number, and observes that
    fifty-nine per cent of magazine advertisements nonetheless put the headline above. The reason
    is habit rather than aesthetics: the page should match the movement the eye already makes.
  answer_type: application
  difficulty: easy
  knowledge_type: hierarchy
  requires_application: true
  support: >
    Stated rule with a reported readership difference and a reported violation rate, neither given
    a sample or a source. The claimed scanning order itself is asserted rather than demonstrated in
    the text.
  confounders:
    - "justifying the rule by visual balance or composition; his ground is a claimed scanning habit"
    - "assuming the fifty-nine per cent violation rate proves art directors are wrong; it is equally consistent with their weighing something he does not measure"
    - "confusing the rule with his separate instruction never to superimpose a headline on the illustration"

- qa_id: qa_ogx_0010
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Layouts', the news-magazine format passage (spine 13)"
  question: >
    What does Ogilvy claim the conventional graphics of advertising communicate to a reader before
    a word is read, and what does he propose in their place?
  answer: >
    He claims the inherited graphic conventions of advertising telegraph to the reader that this is
    only an advertisement and can be skipped, and reports that roughly six times as many people
    read the average article as the average advertisement while very few advertisements are read by
    more than one reader in twenty. His proposal is to adopt editorial graphics instead: copy given
    priority over illustration, serif type, three columns of thirty-five to forty-five characters, a
    caption under every photograph, drop-initials, and black type on white. His instruction is to
    pretend you are an editor. The whole argument depends on a specific historical relationship
    between editorial and advertising conventions in the print of his period.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    Stated claim with a reported article-to-advertisement readership ratio, no source given. The
    six-element list is his description of the format shared by named news magazines in five
    countries.
  confounders:
    - "reading it as a preference for restraint or good taste; his claim is about a learned signal that triggers skipping"
    - "carrying the specific format list into any later medium; it describes printed magazines of 1983"
    - "confusing 'looks like editorial' with disguising the advertiser — he wants the graphics, and separately jokes about the required 'advertisement' slug"

- qa_id: qa_ogx_0011
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Layouts' and Ch. 11 'The secrets of success in business-to-business advertising', section 'Print' (spine 13 and spine 17)"
  question: >
    Ogilvy gives the caption a special status among the elements of a print advertisement. What is
    the claim, what must a caption contain, and what internal inconsistency does the book carry on
    this point?
  answer: >
    The claim is that more people read the caption under an illustration than read the body copy,
    from which he concludes that no illustration should ever run without a caption and that the
    caption should carry the brand name and the promise — in the business chapter he calls the best
    captions mini-advertisements in themselves. The inconsistency is in the multiplier: the print
    chapter says four times as many people read captions as read body copy, and the
    business-to-business chapter says twice as many. Neither figure carries a source, and he never
    notices the discrepancy.
  answer_type: factual
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    Two statements in two chapters, both reported as readership findings without sample or source,
    with different multipliers. The instruction about what a caption should contain is identical in
    both.
  confounders:
    - "assuming the caption is a courtesy label; he treats it as a second selling element"
    - "picking one of the two multipliers as the correct one; the book supports neither over the other"
    - "confusing the caption rule with the drop-initial and cross-head devices, which raise readership of copy already entered"

- qa_id: qa_ogx_0012
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Layouts' and the chapter's closing footnote on spreads (spine 13)"
  question: >
    Ogilvy tells you to swear off two-page spreads, then corrects himself in a footnote. What does
    the correction say, and why is the corrected version more useful than the rule it qualifies?
  answer: >
    The rule is that a spread costs twice a single page and seldom returns twice the readership or
    twice the coupons, so swearing off spreads buys twice as many insertions. The footnote, which
    he introduces by calling the rule one of his own over-simplifications, reports that Starch finds
    spreads average twenty-eight per cent higher rating than single pages, that for financial
    advertisers spreads average one hundred and fifty per cent more readership, and that
    advertisements for low-interest products benefit more from big space than those for
    high-interest products. The corrected version is more useful because it supplies the variable —
    the reader's prior interest in the category — that decides when the size premium is worth
    paying, instead of a blanket prohibition.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: media_planning
  requires_application: false
  support: >
    Rule in the running text; qualification in his own footnote, citing two different named sources
    measuring different populations. He states the low-interest generalisation but does not
    reconcile the two figures.
  confounders:
    - "keeping the rule and discarding the footnote; he flags the rule himself as an over-simplification"
    - "reading the financial-advertiser figure as an industry quirk rather than as an instance of the low-interest generalisation"
    - "confusing readership gain with order gain — the direct-response chapter states the spread question in orders, where he again says spreads seldom double them"

- qa_id: qa_ogx_0013
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Typography – the eye is a creature of habit' (spine 13)"
  question: >
    Ogilvy's typography advice runs off one organising principle. Name it, derive two of his
    specific rules from it, and state the limit he himself places on the whole subject.
  answer: >
    The principle is that the eye is a creature of habit: what is easy to read is what people are
    accustomed to reading. From it he derives that capitals retard reading, since they have no
    ascenders or descenders to help word recognition and tend to be read letter by letter, and that
    copy should be set about forty characters wide, the measure people are used to in newspapers;
    the same principle gives him familiar faces such as Century, Caslon, Baskerville and Jenson,
    and his line that the drama belongs in what you say, not in the typeface. The limit he states
    himself is that no reader ever bought a product because of the typeface, but an advertisement
    nobody can read cannot sell — you cannot save souls in an empty church. Typography is a
    necessary condition, not a cause.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: typography
  requires_application: false
  support: >
    Stated principle with derived rules. Tinker is cited by name and institution without a study or
    date; the serif preference is supported by a novelist's opinion. The familiarity argument is
    explicitly relative to what readers of that period had been trained on.
  confounders:
    - "treating the typeface list as an aesthetic canon rather than as a claim about reader familiarity"
    - "reading 'you can't save souls in an empty church' as a claim that typography sells; it says the opposite"
    - "assuming the familiarity claim is about letterforms; it is about trained habit, and moves with the habit"

- qa_id: qa_ogx_0014
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Typography', the reverse-type passage, with Ch. 12 'Direct mail, my first love and secret weapon', section 'Direct response advertising in magazines and television' (spine 13 and spine 18)"
  question: >
    Reverse type is the rule Ogilvy repeats most often. What is the one comparison he reports for
    it, and what two exceptions does he allow — and what do the exceptions have in common?
  answer: >
    The comparison is a charity that had been running advertisements in reverse — white type on
    black — and, on his suggestion, tested black type on white; he reports it raised twice as much
    money. The two exceptions, given in the direct-response chapter, are theatre programmes, which
    people read in the dark by holding them up against the light coming from the stage, and slides
    projected onto a screen. What they share is that the page is not the light source: in both, the
    surface is backlit or projected rather than reflecting, which reverses the legibility. These are
    the only boundary conditions he gives for a typography rule anywhere in the book.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: accessibility_legibility
  requires_application: false
  support: >
    A reported before-and-after comparison with a result supplied, and two exceptions stated in a
    later chapter. The shared property — the page not being the light source — is implicit in his
    own descriptions of both exceptions.
  confounders:
    - "treating reverse type as a matter of taste; he reports a fund-raising difference"
    - "generalising the exceptions to any bright display without noticing that his stated reason is the direction of the light"
    - "assuming the charity comparison was controlled — it is a before-and-after on one organisation with no other cause excluded"

- qa_id: qa_ogx_0015
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', sections 'Posters' and 'Subway cards' (spine 13)"
  question: >
    Ogilvy treats posters and subway cards very differently as evidential cases. Set the two side
    by side, and say what the subway case shows about how he thinks format should be chosen.
  answer: >
    On posters he states there has been little or no research, offers what little is known — make
    it a visual scandal, deliver the promise pictorially as well as in words, largest possible
    type, brand name visible at a distance, strong pure colours, never more than three elements —
    and closes by asking the reader to tell him if they know more. On subway cards he reasons from
    a measured property of the medium instead: the average New York rider is exposed to the card
    for twenty-one minutes and eighty-five per cent of passengers carry nothing else to read, so
    the card can carry a long message, and he warns explicitly against designing one like a
    billboard with five or six words. The subway case shows he thinks format should follow from
    exposure duration and the presence of competing reading matter, not from the physical resemblance
    of one out-of-home surface to another. Both figures describe the New York subway of his period.
  answer_type: comparison
  difficulty: medium
  knowledge_type: media_planning
  requires_application: false
  support: >
    Poster guidance explicitly marked by the author as unsupported by research, with an invitation
    to correct him. Subway guidance derived from two reported audience measurements. He states the
    exposure-duration reasoning for this case only.
  confounders:
    - "carrying the twenty-one-minute reasoning into any other medium; he applies it to one transit system in one era"
    - "treating the three-element poster rule as evidence-based; he says the opposite"
    - "assuming out-of-home is one category with one set of rules — the contrast is his point"

- qa_id: qa_ogx_0016
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Illustrations', item 10 of 15, and the Rinso caption (spine 13)"
  question: >
    A creative team argues for an illustration subject on the ground that everyone on the team finds
    it fascinating. Ogilvy has a specific answer to this, drawn from his own failure. What is it?
  answer: >
    He states as a rule that a subject interesting you will not necessarily interest consumers, and
    supports it with his own mistake: as a former chef he assumed everyone found chefs interesting,
    used them in an advertisement, and got miserable readership among the intended audience. He
    reports a colleague at a food company having independently observed the same reaction. The point
    is that the writer's own interest is not evidence about the audience's, and he treats his own
    enthusiasm as the thing that misled him. The passage is written in the terms of his period, with
    housewives named as the target audience for the food products in question.
  answer_type: application
  difficulty: easy
  knowledge_type: photography
  requires_application: true
  support: >
    Stated rule with one reported failure of his own and one colleague's agreement. No measurement
    of the readership deficit is given. It is his clearest self-correction in the print chapter and
    cuts against his habit of asserting from taste elsewhere in it.
  confounders:
    - "reading it as advice to be unimaginative or to avoid personal taste altogether"
    - "confusing it with his story-appeal rule, which is about arousing the reader's curiosity — this item says your judgement of what is curious is not self-validating"
    - "treating the housewife framing as a finding about who buys food; it is the assumption of his era"

- qa_id: qa_ogx_0017
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Warning' following 'Illustrations' (spine 13)"
  question: >
    Immediately after fifteen confident rules about illustration, Ogilvy prints a short section
    headed Warning. What does it say, and why does it sit awkwardly with the fifteen rules?
  answer: >
    It says that the illustrations in advertisements are often misunderstood, and gives a pilot-study
    case in which a photograph of a luxurious hotel foyer in a cigarette advertisement was taken by
    one respondent for a hospital ward for cancer patients. It sits awkwardly because all fifteen
    preceding rules assume the illustration is read as intended: story appeal, before-and-after,
    package-as-subject and the rest are claims about what a correctly understood picture does. He
    prints the warning and revises none of them. Note that the example inverts the meaning rather
    than blurring it.
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: >
    A pilot study and a single respondent, reported by a named former partner. No rate of
    misunderstanding is given for print, unlike the television chapter, which does supply one.
  confounders:
    - "assuming he quantifies print misunderstanding; the measured figure in the book is for television"
    - "reading the warning as an argument for captions; he makes the caption case separately, in the layout section"
    - "treating a single respondent as a finding rather than as the illustration of a possibility"

- qa_id: qa_ogx_0018
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', chapter opening before 'Above average' (spine 14)"
  question: >
    Before making a single craft claim, the television chapter states which measure it will use.
    What is it, what is the argument for it, and what does adopting it do to the rest of the book?
  answer: >
    The measure is change in brand preference, taken from factor analyses he commissions, and the
    argument for it is that people who register such a change after seeing a commercial subsequently
    buy the product three times more than people who do not. He rejects recall on the ground that
    some commercials scoring high on recall score low on brand preference and that there appears to
    be no correlation between recall and purchasing. What this does to the rest of the book is
    awkward: several central claims in his print chapter are recall claims — the twenty-two per cent
    news effect, the twenty-eight per cent quotation-mark effect, the twenty per cent penalty on
    blind headlines — and he never reconciles the two positions.
  answer_type: source_position
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: >
    Stated measure with a reported multiple linking preference change to later purchase; no study,
    sample or date given. He also concedes at the chapter's opening that his television experience
    is more limited than his print experience and that the chapter rests mostly on research and on
    watching other people's commercials.
  confounders:
    - "assuming he rejects all pre-testing; he rejects one measure and prefers another"
    - "treating the three-times multiple as showing the commercial caused the purchase; it links a measured attitude change to later behaviour"
    - "missing that the same book argues from recall figures elsewhere"

- qa_id: qa_ogx_0019
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Above average', item 1 (spine 14)"
  question: >
    On humour in commercials Ogilvy reverses a position he had held for years. State the reversal
    precisely, and say why the caveat he attaches makes it much less usable than it first appears.
  answer: >
    He had held, with Hopkins, that people do not buy from clowns, and says he believes this was
    true in Hopkins's day and until recently; the latest wave of factor analysis, he says, reveals
    that humour can now sell. The caveat is that very few writers can write funny commercials which
    are funny, and anyone who is not one of them should not try. That caveat does most of the work,
    because a technique whose success depends on a rare individual capability is not usable guidance
    for most readers. Note also that he dates the change rather than explaining it: he says humour
    can NOW sell, implying audiences changed rather than that the earlier measurement was wrong, and
    he does not say which.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: >
    Stated reversal attributed to a wave of factor analysis with no result, sample or date supplied
    — measurement asserted, result withheld — followed by his own execution caveat.
  confounders:
    - "reading it as a general endorsement of funny advertising"
    - "assuming he explains why the finding changed; he only dates it"
    - "confusing the humour reversal with his position on emotion, which he says researchers have not found a way to quantify at all"

- qa_id: qa_ogx_0020
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Above average', items 2, 5, 6 and 8 (spine 14)"
  question: >
    Ogilvy's list of formats that test above average on brand preference is dominated by formats
    agency people dislike. Name them, and say what he takes the pattern to show.
  answer: >
    Slice of life, in which one character argues with another about a product in a roughly realistic
    setting and the doubter is converted; problem-solution, which shows a familiar problem and the
    product solving it; talking heads, a pitchman extolling the product, which he says are
    particularly appropriate for announcing new products; and reason-why commercials, which he
    reports as slightly above average. Copywriters detest slices of life as corny and over-used, and
    agency people find talking heads non-creative. The pattern he takes from it is the gap between
    what the trade enjoys making and what moves the measure — the same argument he makes in the
    abstract in his chapter on the cult of creativity, stated here with named formats.
  answer_type: factual
  difficulty: easy
  knowledge_type: advertising
  requires_application: false
  support: >
    Four formats reported as above average with no numbers, no average and no sample. The
    new-product claim for talking heads rests on a single instance, a German cigarette brand said to
    be the only successful launch among more than a hundred.
  confounders:
    - "reading 'above average' as a measured effect size; the distribution is never given"
    - "assuming these formats are recommended for every objective — his direct-response chapter uses problem-solution differently, over two minutes and with several benefits"
    - "treating the German cigarette case as evidence for the general claim rather than as one instance"

- qa_id: qa_ogx_0021
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Above average', item 3 (spine 14)"
  question: >
    You are casting a testimonial commercial and have found a genuine loyal customer who happens to
    be an excellent, polished speaker. What does Ogilvy say about that, and what device does he
    recommend for producing conviction?
  answer: >
    He tells you to avoid users who would give so polished a performance that viewers would think
    they were professional actors, on the stated ground that the more amateurish the performance,
    the more credible it is. The device he recommends is to have the interviewer pretend to find
    fault with the product so that the loyal user rises to its defence, which he says produces far
    more conviction than simply asking what the user thinks — and he prefers filming users who do
    not know they are being filmed. The mechanism is that credibility comes from the speaker
    appearing not to be performing for the advertiser, and both clumsiness and spontaneous defence
    are signals of that.
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: >
    Stated rule with a reproduced hidden-camera script and one supporting case — a French campaign
    whose elderly heroine became recognised by three in four people, with the product reported to
    have moved from fourth to second in sales. The recognition figure is measured; the rank change is
    attributed with nothing else excluded.
  confounders:
    - "assuming production polish always helps; his claim runs the other way for this specific format"
    - "reading it as an argument for using real people generally, missing the defensive-response device"
    - "confusing this with his position on expert testimony, which works through standing rather than through amateurism"

- qa_id: qa_ogx_0022
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Above average', item 4 (spine 14)"
  question: >
    A client wants a demonstration commercial that names the competing brand and shows it losing.
    What does Ogilvy report about that, and what does he say the risk actually is?
  answer: >
    He reports that his agency's studies found commercials naming competing brands less believable
    and more confusing than commercials that do not, and names a specific risk: viewers tend to come
    away with the impression that the brand you disparage is the hero of your commercial. So the
    danger is not merely wasted attention but transferred credit. He notes the practice was illegal
    in Germany and encouraged by the United States government as consumer information, which is a
    regulatory position of 1983. His enthusiasm for demonstration itself is undiminished — he wants
    demonstrations, and insists they need not be dull.
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: >
    Studies by his own agency cited without design, sample, date or effect size, with the failure
    mode stated as a tendency. The business-to-business chapter states the opposite emphasis, urging
    demonstrations that compare performance with competitors', and he does not reconcile the two.
  confounders:
    - "concluding he opposes comparative demonstration in general; his business chapter recommends comparison"
    - "reading the risk as legal rather than perceptual"
    - "assuming the finding is about believability alone, missing the hero-transfer claim"

- qa_id: qa_ogx_0023
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Above average', item 10 (spine 14)"
  question: >
    Emotion is the one item on Ogilvy's above-average list that fails his own chapter's evidential
    standard. How does he handle that, and what two constraints does he attach?
  answer: >
    He states the failure openly: researchers have not yet found a way to quantify the effectiveness
    of emotion, and his position is a belief formed from watching commercials — that nostalgia,
    charm and even sentimentality can be enormously effective, and that emotion can be as effective
    as any rational appeal, particularly where there is nothing unique to say about the product. The
    two constraints are that consumers need a rational excuse to justify an emotional decision, so
    one should always be included, and that emotion should not be attempted by anyone who cannot
    deliver it. He also quotes a partner's warning that both clients and agency people overrate how
    much the rational benefits of their product matter to the consumer.
  answer_type: source_position
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: >
    Explicitly unquantified and marked as belief by the author, inside a chapter organised around a
    measure. The rational-excuse claim is asserted with no evidence at all and is a claim about the
    structure of a purchase decision rather than about a commercial.
  confounders:
    - "treating the emotion claim as one of his measured findings"
    - "reading the rational excuse as the persuader; he casts it as the justification the buyer needs afterwards"
    - "assuming the scope is general — he raises it particularly for products with nothing unique to say"

- qa_id: qa_ogx_0024
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Below average', item 2 (spine 14)"
  question: >
    Of the three formats Ogilvy reports as below average on brand preference, one carries evidence
    much closer to a controlled comparison than anything else in the chapter. Which, what is the
    evidence, and what boundary does he place on the finding?
  answer: >
    Cartoons. He reports a fabric-softener case in which two commercials were made, one live action
    and one cartoon: the cartoon had no effect on the downward sales trend and the live-action
    version reversed it. That is a same-product pair with opposite outcomes on the same trend, which
    is closer to a controlled comparison than the rest of the chapter — though he gives no sample, no
    market and no magnitude, and the two commercials differed in more than technique. The boundary
    he states is audience age: cartoons can sell things to children and are below average in selling
    to grown-ups, holding the viewer less well than live action.
  answer_type: comparison
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: false
  support: >
    A reported two-arm case with directions supplied for both arms, plus a stated audience boundary.
    The other two below-average formats, celebrity testimonials and musical vignettes, carry no
    comparison of this kind.
  confounders:
    - "extending the cartoon finding to children, which he explicitly exempts"
    - "treating the pair as a clean experiment; only the technique is named as differing, and no magnitudes are given"
    - "choosing celebrity testimonials as the best-evidenced item — that one rests on his account of why viewers discount them"

- qa_id: qa_ogx_0025
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 7 'Wanted: a renaissance in print advertising', section 'Body copy', with Ch. 8 'How to make TV commercials that sell', section 'Below average' item 1, and Ch. 12, section 'Direct response advertising in magazines and television' (spine 13, 14, 18)"
  question: >
    Ogilvy states the celebrity-testimonial problem three times in three chapters with three
    different framings. Give the three, and state the single exception that survives in all of them.
  answer: >
    In print he says celebrity testimonials get high recall scores but readers remember the
    celebrity and forget the product, and assume the celebrity was bought, which he says is usually
    the case. On television he says they are below average at changing brand preference, viewers
    guess the celebrity has been bought and are right, and he lists the fees of the period to show
    what is being paid for. In direct response he says simply not to use them. The exception that
    survives everywhere is relevant expertise: expert testimony persuades — his print example is an
    ex-burglar testifying that he could never crack a particular safe — and the direct-response
    chapter states it most precisely as recognised authorities only, such as a champion golfer on
    golf clubs. The celebrity case is also the example he uses to argue that recall and persuasion
    come apart.
  answer_type: comparison
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: >
    Three statements in three chapters, none with a study attached. His own worst-remembered
    instance is his own: paying a famous public figure to endorse a margarine, which he calls not one
    of his proudest memories.
  confounders:
    - "assuming fame is the variable; his stated mechanism is inferred payment destroying disinterest, plus memory attaching to the more memorable object"
    - "treating the expert exception as celebrity endorsement with a better-chosen celebrity"
    - "missing that celebrity commercials are his standing demonstration that high recall can coexist with low persuasion"

- qa_id: qa_ogx_0026
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Sixteen tips', items 1 and 2 (spine 14)"
  question: >
    Ogilvy treats getting the brand remembered as work that has to be done deliberately rather than
    as a by-product of a good commercial. What is the failure he says is the default, and what does
    he prescribe?
  answer: >
    The default failure is that a shocking percentage of viewers remember the commercial and forget
    the name of the product, and all too often attribute the commercial to a competing brand — which
    is worse than forgetting, because the advertising then works for the rival. His prescription is
    to use the name within the first ten seconds and to play games with it, such as spelling it out;
    he reports a commercial that repeated the brand name twenty times without irritating anyone, and
    says that for a new product you have to teach people its name on television. He also reports
    that commercials ending by showing the package change brand preference more effectively than
    those that do not, and notes that many copywriters think it crass to belabour the name.
  answer_type: repair
  difficulty: easy
  knowledge_type: brand_communication
  requires_application: false
  support: >
    The shocking percentage is never given and the research demonstrating it is not identified —
    measurement asserted, result withheld. The package finding is stated without numbers. The
    same practice appears in his account of Procter & Gamble, where the name is reported to appear
    in the first ten seconds and about three times thereafter.
  confounders:
    - "reading it as a claim that repetition is inherently persuasive; the claim is about attribution"
    - "assuming a memorable commercial is a memorably branded one — his point is that these come apart"
    - "treating misattribution as equivalent to forgetting"

- qa_id: qa_ogx_0027
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Sixteen tips', item 5 (spine 14)"
  question: >
    A director defends a slow, atmospheric opening on the ground that it sets up a strong payoff
    twenty seconds in. Give Ogilvy's answer in his own terms, including the asymmetry he names.
  answer: >
    His answer is open with the fire: with thirty seconds available, grabbing attention in the first
    frame with a visual surprise gives a better chance of holding the viewer, and commercials get
    screened out because they open with something dull. The asymmetry he names is that the maker
    knows great things are about to happen and the viewer does not — and the viewer will never find
    out, because she has left the room. So an opening judged by what it sets up rather than by what
    it shows loses the audience that would have received the payoff. His literal instruction is that
    when you advertise fire extinguishers, you open with the fire. All of this is stated for the
    thirty-second commercial in the broadcast environment of 1983.
  answer_type: application
  difficulty: easy
  knowledge_type: shot_design
  requires_application: true
  support: >
    Stated claim with a mechanism and no measurement. The thirty-second length and the surrounding
    exposure figures — thirty thousand commercials a year, a set on six hours a day — are facts about
    American television households of the period.
  confounders:
    - "reading it as a rule about pacing throughout the commercial rather than about the first frame"
    - "carrying the rule forward to any later medium; it is stated for broadcast television of 1983"
    - "confusing it with his separate instruction to use the brand name inside the first ten seconds — both make claims on the same opening"

- qa_id: qa_ogx_0028
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Sixteen tips', items 6, 7, 8 and 9 (spine 14)"
  question: >
    Set out Ogilvy's four findings about the sound layer of a commercial, and say which one he
    reports as a genuine null result.
  answer: >
    Voice-over holds the audience less well than actors talking on camera, and he reports a
    manufacturer who made two commercials identical except for this and found the on-camera version
    sold more. Supers — the promise set in type over the picture while the soundtrack speaks it —
    pay, but the words must be exactly the same as the spoken words, because any divergence confuses
    the viewer. Sound effects, such as sausages sizzling, can make a positive difference; he
    instances a commercial built round the sound of coffee percolating that ran five years. The null
    result is background music: research shows it is neither a positive nor a negative factor, doing
    no harm and no measurable good. Jingles, separately, are below average at changing brand
    preference and should never go on air until people who have not read the script can make out the
    words.
  answer_type: factual
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: false
  support: >
    The voice-over comparison is the closest thing to a controlled pair in the chapter — two
    commercials identical except for one variable, tested, direction reported — though the magnitude,
    product and method are not given. The music null is stated as a null, which is unusual in this
    book. His argument against background music is rhetorical rather than evidential.
  confounders:
    - "assuming music is discouraged because it hurts; he reports it as inert"
    - "conflating jingles with background music; he treats them as separate findings with different verdicts"
    - "treating the supers rule as being about emphasis rather than about exact correspondence with the spoken words"

- qa_id: qa_ogx_0029
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Sixteen tips', item 15 (spine 14)"
  question: >
    What did the 1979 miscomprehension study Ogilvy cites actually find, and what makes its floor
    more consequential than its ceiling?
  answer: >
    A study of twenty-five typical television commercials found that all of them were
    miscomprehended, some by as many as forty per cent of viewers and none by fewer than nineteen
    per cent. The floor matters more than the ceiling because it says the failure is universal
    rather than occasional: there was no commercial in the sample that everyone understood, so
    miscomprehension is a baseline condition of the medium rather than a defect of bad work. His
    stated remedy is to make commercials crystal clear, and he adds that he cannot understand more
    than half the commercials he sees. Having reported it, he revises none of his sixteen tips in
    the light of it.
  answer_type: factual
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: >
    A named academic study of 1979 with its result supplied, cited in a single tip. This is the
    measured counterpart of the unquantified warning about misunderstood illustrations in his print
    chapter.
  confounders:
    - "remembering the forty per cent and forgetting the nineteen per cent floor, which is the load-bearing number"
    - "reading it as a finding about badly made commercials; every commercial in the sample failed"
    - "assuming he adjusts his craft advice afterwards; he does not"

- qa_id: qa_ogx_0030
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 8 'How to make TV commercials that sell', section 'Radio – the Cinderella medium' (spine 14)"
  question: >
    How does Ogilvy describe the evidential position of radio in 1983, and how does he mark the
    advice he nevertheless gives?
  answer: >
    He says there is no research to measure the efficacy of radio commercials, so nobody knows what
    works. He then offers four factors from a pilot study he commissioned — identify the brand early,
    identify it often, promise the listener a benefit early, repeat it often — and reports that
    ninety commercials in a hundred do none of these. Everything beyond that he marks explicitly as
    opinion and nothing more: surprise them, arouse curiosity, wake them up, then talk to them as one
    human being to another. He closes by noting that in some developing countries radio still
    reached more people than television and that nobody knew what worked there either, asking whether
    it was not time somebody found out.
  answer_type: source_position
  difficulty: easy
  knowledge_type: advertising
  requires_application: false
  support: >
    Explicit statement that the evidence does not exist, with the author marking his own advice as
    opinion. This and the poster section are the two places in the book where he says plainly that
    he is guessing.
  confounders:
    - "treating the four pilot-study factors as established findings; they come from one pilot study"
    - "assuming his confidence is uniform across media — radio and posters are where he concedes ignorance"
    - "reading the ninety-in-a-hundred figure as a measured audit rather than as his characterisation"

- qa_id: qa_ogx_0031
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 9 'Advertising corporations', the passage listing nineteen corporate slogans (spine 15)"
  question: >
    Ogilvy prints nineteen real corporate slogans in a list. What test is the list designed to
    apply, and what does he say such lines cost the advertisement even when nobody objects to them?
  answer: >
    The test is interchangeability: he observes that all of them are interchangeable, that any
    company could use any of them, and therefore that they identify nobody and cannot differentiate.
    The cost he names is twofold — they generally sit at the foot of the advertisement where nobody
    reads them, and by cluttering the layout they reduce readership of the copy. So a line that does
    no persuading still takes something away. The transferable part is the test itself: ask whether
    a competitor could sign the same line.
  answer_type: failure_diagnosis
  difficulty: easy
  knowledge_type: brand_communication
  requires_application: false
  support: >
    An observation about nineteen reproduced slogans, stated as an observation rather than as a
    rule. The readership cost is asserted without measurement.
  confounders:
    - "reading the objection as being about vagueness of language rather than about non-identification"
    - "assuming the harm is only that the line is ignored; he claims it also depresses readership of the copy"
    - "treating it as advice against slogans in general — his positive case is a campaign whose sponsor he recognises without reading a word"

- qa_id: qa_ogx_0032
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 9 'Advertising corporations', the passage on short-lived campaigns and the Container Corporation caption (spine 15)"
  question: >
    A corporate campaign is up for review after eighteen months with no agreed measure of success.
    Using Ogilvy's account of why such campaigns fail, what would you say about the review itself —
    and what does his own reversal of judgement on one campaign add?
  answer: >
    On his account the campaign was already set up to fail: he says most corporate campaigns are
    short-lived because they do not start with any clear objective and because research is not used
    to track their progress, so they are aborted before they could achieve anything measurable —
    while the companies he names as successes had run for forty-five, sixty-two and seventy-five
    years. The review therefore has no basis for a verdict, and the fault is in the setup rather
    than in the work. His prescribed remedy for the budget question is to analyse the task: what
    will it cost to achieve a specific goal among a specific audience. His own reversal adds
    caution about short-horizon aesthetic judgement: he denounced one campaign as an exercise in
    pretension and, forty-five years later, judged it one of the best corporate campaigns ever run,
    saying he recognises its sponsor without reading the copy — like recognising a man who dresses
    unlike other men.
  answer_type: application
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Stated diagnosis with named long-running campaigns, plus his own recorded change of judgement.
    The chapter also reports a study of 731 corporations finding an average two per cent positive
    influence on share price — an average across firms whose advertising differed in every respect,
    which attributes nothing to any property of the advertising.
  confounders:
    - "reading the long-running examples as proof that duration causes success"
    - "using the two per cent share-price figure as evidence for a particular campaign"
    - "treating his change of mind as evidence about the campaign rather than as a caution about early aesthetic verdicts"

- qa_id: qa_ogx_0033
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 10 'How to advertise foreign travel', the passages on choosing subjects and on converting dreams (spine 16)"
  question: >
    A tourist board wants its campaign to feature its country's new industrial achievements.
    Ogilvy faced exactly this and gives both a rule and a warning. What are they?
  answer: >
    The rule is to illustrate what is unique to the country, because people do not travel half way
    round the world to see things they can see at home — do not advertise ski resorts to the Swiss
    or American food to the French. Research told him American tourists wanted history and tradition
    in Britain, so that is what he featured. The warning is the consequence: he was attacked in the
    British press for projecting a country living in the past and asked why he had not shown a
    progressive industrial society, and his answer was that research had shown American tourists had
    no desire to see such things. He reports the same conflict twice more, with a government
    directing that only economically depressed areas be featured and with a senator's home state
    being written into a campaign. Research-led travel advertising is routinely unacceptable to a
    government client, because the client wants the country it wishes to be rather than the one
    visitors want to see.
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: >
    Stated rule with three reported instances of the political conflict. He treats the conflict as
    an occupational hazard rather than as a reason to abandon the research. The reported tourism
    increases are attributed to the campaigns with nothing else excluded.
  confounders:
    - "assuming the rule is to show famous landmarks; the rule is uniqueness relative to the visitor's home"
    - "treating the client conflict as a failure of persuasion rather than as a structural difference of objective"
    - "reading the tourism outcomes as measurements; only the research on what visitors wanted is reported as measured"

- qa_id: qa_ogx_0034
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 10 'How to advertise foreign travel', the passage beginning 'People dream about visiting foreign countries' (spine 16)"
  question: >
    Ogilvy says travel advertising has a job different from creating desire. What is it, and what
    does he say the advertisement must therefore contain?
  answer: >
    He says people already dream about visiting foreign countries, so the job of the advertising is
    to convert the dream into action. What it must contain is mouth-watering photographs combined
    with specific how-to-do-it information — you show an ancient college and tell the reader what it
    costs to go and see it — and for little-known countries a great deal of it: in one two-page
    newspaper advertisement he reports telling readers what to wear, the weather to expect, the
    language, the food, the costs, every mortal thing. The reasoning is that the missing ingredient
    is not desire but the specific knowledge that closes the gap between wanting and booking; he
    adds that fear, as well as cost, obstructs travel and should be allayed.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: >
    Stated claim with a mechanism and a named campaign example. The list of American fears about
    foreign countries that he reports research finding is recorded in the terms of his period and is
    a report of 1983 attitudes, not guidance.
  confounders:
    - "reading it as a general preference for informative copy; the argument is specific to a category where desire pre-exists"
    - "assuming the photographs do the work; he insists on the pairing with practical detail"
    - "confusing dream-to-action with the brand-image argument of chapter 2, which is about personality rather than about closing a specific gap"

- qa_id: qa_ogx_0035
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 11 'The secrets of success in business-to-business advertising', section 'Print' (spine 17)"
  question: >
    A software company wants its advertising to lead on how large the company is. Ogilvy reports
    exactly this case. What happened, and what general rule does he draw?
  answer: >
    Research found the supplier's customers were not interested in size at all; they were looking
    for responsiveness, support, service and a good product. The general rule he draws is that what
    you promise must be important to your customer rather than to you, and that the promise must be
    specific — percentages, time elapsed, dollars saved rather than generalities, because you are
    talking to engineers. The reasoning is that a professional buyer evaluates against criteria he
    already holds, so a claim outside those criteria carries no weight however true it is, and a
    quantified claim can be checked against them.
  answer_type: application
  difficulty: easy
  knowledge_type: advertising
  requires_application: true
  support: >
    One reported research finding with its result supplied, generalised into a rule. The chapter
    states it draws heavily on research conducted by one business publisher, which is a party with an
    interest in businesses advertising in business publications.
  confounders:
    - "reading it as advice against ever mentioning company scale; the finding is about one customer set's criteria"
    - "assuming specificity is about credibility alone; here it is about checkability against a buyer's existing criteria"
    - "missing that a substantial part of this chapter's evidence base comes from an interested party"

- qa_id: qa_ogx_0036
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 11 'The secrets of success in business-to-business advertising', section 'Print', the passage on babies, beagles and bosoms (spine 17)"
  question: >
    Ogilvy names a specific failure that comes from a copywriter projecting his own boredom onto the
    reader. Describe it, and state the two conclusions he draws from the same premise.
  answer: >
    The failure is that, assuming the reader will find the product as boring as they do, copywriters
    try to inveigle him in with irrelevant attractive imagery — his phrase is pictures of babies,
    beagles and bosoms. He rejects it because the specialist buyer is more interested in the product
    than in anything else in the world, and says to play it straight. From the same premise he draws
    two conclusions: that copy of more than three hundred and fifty words attracts more readers than
    short copy in these publications, and that although body copy is read by no more than ten per
    cent of a publication's readers, that ten per cent are the prospects, so what is said to them
    decides the advertisement. Where prior interest is high and constant, the advertisement's job is
    information rather than seduction.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated failure with a mechanism, plus reported readership figures for business publications of
    1983 sourced from one publisher's research. The phrase quoted is Ogilvy's own and carries the
    register of his period.
  confounders:
    - "generalising 'play it straight' to consumer categories where he argues the opposite about curiosity and story appeal"
    - "reading the ten per cent as a weakness; he treats it as pre-qualified"
    - "assuming the length rule is about the medium; his reason is the reader's prior interest"

- qa_id: qa_ogx_0037
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 11 'The secrets of success in business-to-business advertising', sections 'How to stimulate inquiries' and 'Analyse your inquiries' (spine 17)"
  question: >
    Your boss asks what tangible results the trade advertising is producing. Ogilvy anticipates the
    question and gives three ways to answer it. What are they, and which does he say does most?
  answer: >
    Survey a sample of inquirers to find whether they intend to buy, are waiting for a salesman, or
    are simply keeping the product in mind. Question the salespeople who followed the inquiries up:
    did the inquiry lead to a sale, was it a new prospect, how did the salesman rate it. And relate
    inquiries to the media that produced them, which he says lets you fine-tune media selection — he
    reports one manufacturer cutting his budget by a quarter this way. He says the second does most
    in one specific sense: the discovery of a single major sale resulting from an inquiry can do
    more than anything else to demonstrate the value of the advertising.
  answer_type: application
  difficulty: medium
  knowledge_type: testing_method
  requires_application: true
  support: >
    Three stated methods with one reported budget outcome. This is the second measurable branch in
    the book alongside direct response, and he builds the same argument: where the response is
    attributable, the practice can be corrected.
  confounders:
    - "treating inquiry volume as the answer; he asks what the inquiries turned into"
    - "assuming the media analysis is about buying more; his reported outcome is a smaller budget"
    - "confusing this with brand tracking, which measures attitudes rather than attributable responses"

- qa_id: qa_ogx_0038
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 11 'The secrets of success in business-to-business advertising', section 'Print', the buying-influences passage (spine 17)"
  question: >
    What function does Ogilvy assign to business advertising, and what is his argument for it —
    given that he concedes an advertisement can seldom close a sale?
  answer: >
    Its function is to pave the way for salesmen by pre-selling the product and attracting leads. His
    argument is coverage rather than persuasion: industrial companies have an average of four buying
    influences, the sales force is unlikely to know all four, and sixty per cent of specifiers — the
    people who set the specifications that must be met — read advertisements to learn what is on the
    market. Advertising's contribution is therefore access to the decision-makers the sales force
    cannot reach. He supports it with the cost comparison of his period between a salesman's call, a
    letter, a telephone call and reaching a prospect through advertising.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: >
    Reported figures from one publisher's research, given with results. The cost figures, the four
    buying influences and the specifier percentage are 1983 data.
  confounders:
    - "reading it as a claim that advertising is more persuasive than a salesman; the argument is about reach"
    - "carrying the cost ratios forward; they describe 1983 selling costs"
    - "assuming the specifier is the buyer — his separate point is that top management and specifiers may need different campaigns"

- qa_id: qa_ogx_0039
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 12 'Direct mail, my first love and secret weapon', the passage beginning 'Advertisers who distribute their products in the normal way' (spine 18)"
  question: >
    Why, on Ogilvy's own account, is direct mail testable when general advertising is not — and what
    does the answer say about where the advantage actually lies?
  answer: >
    Because advertisers distributing through wholesalers and retailers have great difficulty
    isolating the results of their advertising from the other factors in the marketing mix, while
    direct-mail advertisers can measure the results of a mailing to the dollar. The advantage
    therefore lies in the distribution channel, not in the format: a closed loop between the piece
    sent and the order received removes the confound that defeats measurement elsewhere. This
    extends his chapter-2 argument that where direct response and general advertising diverge the
    measured party is likelier to be right, by supplying the reason the measurement is possible at
    all.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: testing_method
  requires_application: false
  support: >
    Stated claim with a mechanism. He also notes in the same chapter that direct mail is where the
    swindlers are found and reports one and a half million consumer complaints in 1980 — the branch
    he treats as his evidence base is also the one he says attracts fraud.
  confounders:
    - "attributing the testability to the mail format rather than to attributable response"
    - "assuming the conclusion transfers to any advertising that can be counted; his condition is that the order comes back to the advertiser"
    - "treating this as a new claim rather than as the reason behind his chapter-2 position"

- qa_id: qa_ogx_0040
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 12 'Direct mail, my first love and secret weapon', the passage on choosing which variables to test (spine 18)"
  question: >
    Ogilvy says everything in a mailing can be tested and then immediately says you cannot test it
    all. Explain the constraint, how he says practitioners resolve it, and the circularity in his
    resolution.
  answer: >
    The constraint is that only one variable can be tested at a time, so tests are serial and test
    capacity is finite; you therefore have to choose which variables to test. Experienced
    practitioners, he says, always test certain variables and seldom test those experience has taught
    them make little difference — and after the positioning of the product he names pricing, terms of
    payment, premiums and the format of the mailing as the most important. The circularity is that
    experience decides what gets tested while testing is what produces experience; he does not remark
    on it. It is nonetheless the most honest statement about measurement in the book, because it
    concedes that measurement is rationed.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: >
    Stated constraint with a stated priority order, asserted from practice. No evidence is given
    that these four variables move results more than others. The same serial limit appears in his
    research chapter, where a split run can test only two headlines at a time.
  confounders:
    - "reading the priority list as a finding rather than as practitioner convention"
    - "assuming multivariate testing is dismissed on principle; he states a practical serial limit of his period"
    - "missing that the same limit constrains his preferred split-run method for choosing a promise"

- qa_id: qa_ogx_0041
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 12 'Direct mail, my first love and secret weapon', the passages on terms of payment and on the Moscow Olympic coins (spine 18)"
  question: >
    Ogilvy reports two direct-mail tests whose results contradict the obvious expectation. Give both
    with their numbers where he supplies them, and say why these two items carry more evidential
    weight than most of the book.
  answer: >
    A magazine tested three subscription terms; the cheapest and shortest cut the price by forty per
    cent and generated thirty-five per cent more net revenue than the alternatives — he introduces it
    by inviting the reader to guess which won. And a coin collection sold better in its complete form
    when the mailing offered only the cheapest part of it, the silver coins, than when the mailing
    offered the complete collection itself. They carry more weight than most of the book because in
    both cases the test, its conditions and its numerical or directional result are all reported
    together, rather than a result being claimed for a campaign after the fact. He offers no
    mechanism for either and draws no rule beyond the instruction to test.
  answer_type: factual
  difficulty: medium
  knowledge_type: testing_method
  requires_application: false
  support: >
    Two reported tests with conditions and results supplied, each a single test in a single
    category. He presents them as illustrations of why testing is necessary rather than as findings
    that transfer.
  confounders:
    - "generalising the price result into a rule that lower prices raise revenue"
    - "reading the coin result as a rule about partial offers rather than as one surprising outcome"
    - "assuming he explains either result; he does not attempt a mechanism"

- qa_id: qa_ogx_0042
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 12 'Direct mail, my first love and secret weapon', the passage on premiums and terms (spine 18)"
  question: >
    A mailing with a sweepstake entry is beating the control on response rate by a wide margin. What
    would Ogilvy have you consider before adopting it, and what is the mechanism behind his warning?
  answer: >
    He would have you consider who the extra responses are coming from. Sweepstakes, premiums, free
    offers and low prices build up initial response, but the customer attracted by these devices is
    not always the customer who turns into a long-term buyer; asking full price with cash on order
    reduces the number who respond and may turn up more customers likely to stay with you over the
    years. The mechanism is that the device which lowers the barrier also changes who crosses it, so
    response rate and customer quality are moved by the same lever in opposite directions. His only
    resolution is that only testing will tell — which here means testing against a longer-horizon
    outcome than response.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: true
  support: >
    Stated trade-off with a mechanism, hedged throughout with 'not always' and 'may', so he is
    describing a risk rather than a measured effect. No figures are given for either side. It is the
    sharpest statement in the book that the measurable quantity and the wanted quantity can diverge,
    and it comes from the branch he treats as authoritative because it is measurable.
  confounders:
    - "treating response rate as the outcome, which is exactly the substitution he is warning about"
    - "reading it as advice against premiums; he recommends testing them and says to offer one when margin allows"
    - "assuming he quantifies the quality difference; he does not"

- qa_id: qa_ogx_0043
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 12 'Direct mail, my first love and secret weapon', the passages on the control and on making an expensive control cheaper (spine 18)"
  question: >
    Once a mailing is profitable, Ogilvy says it becomes the control. Testing then proceeds in two
    directions — name both, and say which one practitioners are likelier to neglect and why it
    matters.
  answer: >
    Upward: add a premium, an expiration date, enclosures such as a personalised letter from the
    president — they cost money, and he says that if they increase profit there is no reason to
    worry. Downward: test a smaller piece, drop the personalisation, print the brochure in two
    colours instead of four, or drop the brochure altogether, because an expensive control can
    sometimes be made cheaper without reducing orders — less can be more. The downward direction is
    the neglected one, because it produces no new creative work and asks whether existing spend is
    earning anything. It matters because the criterion is profit rather than response, so removing
    cost and adding response are equally valid experiments.
  answer_type: application
  difficulty: medium
  knowledge_type: testing_method
  requires_application: true
  support: >
    Both directions stated, the downward one marked as an expectation to be tested rather than as a
    finding — 'you may be in for a pleasant surprise'. The profit-rather-than-response criterion is
    explicit in his phrasing about premiums.
  confounders:
    - "optimising response rather than profit, which makes the downward tests look like losses"
    - "assuming the control should be replaced whenever a variant wins on any measure"
    - "reading his carrier-pigeon anecdote as evidence for novelty; it reports one sale with no comparison"

- qa_id: qa_ogx_0044
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 12 'Direct mail, my first love and secret weapon', section 'Direct response advertising in magazines and television', the coupon passage (spine 18)"
  question: >
    Ogilvy says readers of a response advertisement do something that general advertising does not
    plan for. What is it, and what does he conclude the coupon must therefore be?
  answer: >
    Readers often skip from the headline straight to the coupon, to find out what the offer is. The
    coupon is therefore a second entry point rather than a mechanism at the end of a linear read, so
    he concludes it must be a miniature advertisement in its own right — complete with the brand
    name, the promise and a small photograph of the product. He adds that many readers tell
    themselves they will mail the coupon later and never do, citing a survey that twice as much
    response is lost that way as is received, and names four holding devices: limited edition,
    limited supply, last time at this price, special price for promptness.
  answer_type: application
  difficulty: medium
  knowledge_type: copywriting
  requires_application: true
  support: >
    Stated reading behaviour with a design consequence, plus a cited survey whose ratio is given
    without source. This modifies the linear scan order — illustration, headline, copy — that his
    print chapter derives its layout rule from.
  confounders:
    - "keeping the coupon as a bare form because the copy above it already sells"
    - "assuming the scan-order rule from the print chapter applies unchanged where there is a coupon"
    - "reading the four urgency lines as general copy advice rather than as devices against a specific measured loss"

- qa_id: qa_ogx_0045
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 12 'Direct mail, my first love and secret weapon', section 'Television' (spine 18)"
  question: >
    Ogilvy's direct-response television advice contradicts a rule he praises elsewhere in the same
    book, and he flags the contradiction himself. What is it, and what reconciliation is available
    that he does not state?
  answer: >
    He says the demonstrations in a direct-response commercial should promise not one benefit but
    several, and adds in parentheses that this runs counter to the Procter & Gamble formula — the
    single-benefit rule he admires in his chapter on competing with that company. The reconciliation
    available but not stated is that the two rules serve different objectives: a commercial that must
    complete a sale in one exposure has to carry enough reasons to close it, while a campaign
    building a brand over years is trying to own one association. He also sets a length floor from
    the same reasoning — his most experienced colleague has almost never seen a commercial shorter
    than two minutes produce profitable sales, and twenty seconds must go to ordering information
    alone.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: >
    The conflict is marked by the author in his own parenthesis and left unresolved. The two-minute
    floor is attributed to one colleague's experience rather than to a test; the twenty seconds of
    ordering information is a requirement of 1983 telephone and mail ordering.
  confounders:
    - "concluding that Ogilvy abandons the single-benefit rule; he states both and marks the clash"
    - "carrying the two-minute floor into any other objective or era"
    - "assuming the several-benefits rule is about richness of content rather than about closing a sale in one exposure"

- qa_id: qa_ogx_0046
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 12 'Direct mail, my first love and secret weapon', section 'Television', the passage on programme quality (spine 18)"
  question: >
    Ogilvy reports that the better the programme a direct-response commercial appears in, the fewer
    sales it makes. What is his explanation, and what does he conclude about buying media on
    audience size?
  answer: >
    His explanation is that a bored viewer will pick up the telephone and a riveted one will not:
    when viewers are bored by an old film they are more likely to order than when they are gripped
    by a popular drama. The act being asked for competes with the programme for the same moment, so
    attention to the programme is a cost rather than a benefit. His conclusion is blunt — there is no
    correlation between the size of your audience and the number of orders you receive — and his
    colleague buys time by counting the orders received each time a station broadcasts a commercial
    and eliminating the stations and dayparts that do not pay. Reach is the wrong currency where the
    response is an action taken during the exposure.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: media_planning
  requires_application: false
  support: >
    Stated claim with a mechanism; no data are given for the no-correlation claim, which is stated
    as a thing to remember. The dayparts, months and programme titles named are those of 1983
    American television.
  confounders:
    - "generalising the finding to brand advertising, where the response is not an act performed during the exposure"
    - "reading it as an argument for cheap inventory rather than for a different buying currency"
    - "carrying the specific dayparts and months forward as recommendations"

- qa_id: qa_ogx_0047
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 12 'Direct mail, my first love and secret weapon', section 'Where to advertise' (spine 18)"
  question: >
    On repeated insertion Ogilvy says something in this chapter that sits against what he says in
    chapter 2 about repeating a winner. State both, and say precisely why this is not a disagreement
    between sources.
  answer: >
    In chapter 2 he reports research showing readership does not decline across at least four
    repetitions in the same magazine, argues the audience is a moving parade rather than a standing
    army, and advises repeating a good advertisement until it stops selling. Here he says that when
    you advertise repeatedly in the same magazine response rates almost always drop, and that the
    number of profitable insertions differs by publication — some support six a year, others twelve.
    This is not a disagreement between sources because it is one author in one book, and the two
    statements are about different measures: readership in the first case, orders in the second. He
    never sets them side by side, so the reconciliation is available and unmade. Treating it as two
    sources conflicting would be a mistake about what the evidence is.
  answer_type: comparison
  difficulty: hard
  knowledge_type: media_planning
  requires_application: false
  support: >
    Chapter 2 is live Canon and is not re-extracted here; the comparison is stated because the later
    chapter qualifies it. Neither statement carries a study, and the decay claim is given as
    practitioner experience.
  confounders:
    - "presenting the two as evidence that the field disagrees about wear-out; both are Ogilvy"
    - "assuming one statement supersedes the other; they concern different measures"
    - "confusing response decay with creative wear-out as measured by attitude tracking, which he discusses separately in the research chapter"

- qa_id: qa_ogx_0048
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 13 'Advertising for good causes', section 'Raising money' (spine 19)"
  question: >
    A charity plans to judge its advertising by the contributions that arrive in reply. Ogilvy warns
    against exactly this. What is the warning, and what does he say the advertising is actually for?
  answer: >
    His warning is that it is rare for any advertisement, however powerful, to bring in enough direct
    contributions to pay for the cost of the space — so contributions returned by post measure the
    campaign at the wrong place. What advertising can do is sensitise the market, making it easier
    to raise money by more personal methods of solicitation, since it is difficult to persuade people
    to give to a charity they know nothing about. The advertisement is not the transaction; it creates
    the knowledge that makes a later personal ask possible. His own case describes a campaign whose
    advertisements produced only modest cash in the mail and whose function was to prepare the ground.
  answer_type: application
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: true
  support: >
    Stated warning with a mechanism, and a reported case in which the campaign's function is
    described as sensitising rather than collecting. The chapter's behaviour outcomes elsewhere —
    teenage drinking falling, cancer clinic check-ups tripling — are attributed with nothing else
    excluded.
  confounders:
    - "keeping the response measure because it is the only attributable one; his point is that it is attributable and wrong"
    - "reading it as pessimism about cause advertising; he reports substantial effects, measured at a different place"
    - "confusing the sensitising claim with brand-image building, which is about personality rather than about enabling a later ask"

- qa_id: qa_ogx_0049
  source_id: ogilvy-beyond-ch2
  source_title: "David Ogilvy, Ogilvy on Advertising (London: Pan Books and Orbis, 1983; Vintage Books edition, 1985)"
  source_locator: "Ch. 13 'Advertising for good causes', section 'Teenage alcoholism in Norway' (spine 19)"
  question: >
    A public-health campaign aimed at teenagers records the highest readership ever measured in its
    market and the behaviour does not shift. Ogilvy reports a campaign that faced this. What was
    done, and what should you be careful not to claim about the outcome?
  answer: >
    The campaign began by addressing fourteen to sixteen year olds directly, with headlines quoting
    their own words, and recorded the highest readership ever measured in that country. It was then
    modified to address parents instead, explaining why children drink and the risks they run — a
    change of audience inside the same objective, rather than a change of message or craft. More than
    seventy per cent of parents are reported to have read those advertisements, and he reports that
    drinking among teenagers decreased for the first time in many years. What you should be careful
    not to claim is that the campaign caused the decrease: the readership figures are measurements
    and the behaviour change is attributed with nothing else excluded and no comparison group.
  answer_type: application
  difficulty: hard
  knowledge_type: persuasion
  requires_application: true
  support: >
    Two waves of a real campaign with readership measured and reported for both, and an uncontrolled
    behaviour outcome. The audience switch is the reusable move and Ogilvy does not draw it out as a
    principle; he reports it as what happened next.
  confounders:
    - "concluding the first wave failed; he reports record readership for it"
    - "treating the behaviour change as demonstrated by the campaign"
    - "reading the fix as better creative work rather than as a change in who is addressed"
