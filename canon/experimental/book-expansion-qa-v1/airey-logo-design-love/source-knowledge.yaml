- sk_id: sk_logo_0006
  source_id: airey-logo-design-love
  source_terms:
    - "your ideal design should work at a minimum of around one inch, with no loss of detail"
  concept_label: one_inch_minimum_reproduction_test
  label_origin: extractor_assigned
  claim: >
    The source states a numeric floor for reproduction: the design should work at a minimum of around
    one inch with no loss of detail. It states the number twice, in the "Think small" section and
    again as practical tip 17, and it names the only route it accepts to meeting it — keep the mark
    simple. This is the source's most nearly operational criterion for an effective mark.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Detail below the reproduction limit of the smallest carrier is lost, so a mark whose meaning
      depends on that detail stops working there. Simplicity is the only stated route to passing.
  scope:
    domain_discussed_by_source: [logo_and_brand_identity_design, print_and_physical_reproduction_of_marks]
    conditions: "identities that will appear on small physical carriers; the source names zip pulls and clothing labels as the cases clients are most demanding about"
  caveats:
    - text: "'around one inch' is a rule of thumb, not a measured threshold; no viewing distance, no substrate and no reproduction process is specified, and the source gives no derivation"
      origin: extractor_observed
    - text: "the number is stated in inches and reflects 2010 print practice; nothing in the source addresses screen rendering below that size beyond naming the favicon"
      origin: extractor_observed
  source_stated_problems: ["loss of detail at the smallest application"]
  source_stated_remedies: ["keep it simple", "design so it works at about one inch"]
