      origin: extractor_observed
    - text: "the closing section of the same chapter tells the reader that rules are made to be broken (see sk_logo_0046), so the source does not present this as a specification"
      origin: source_stated
    - text: "practitioner taste presented as a standard; the book offers no unsuccessful marks that lack these attributes, so the list is unfalsified within the source"
