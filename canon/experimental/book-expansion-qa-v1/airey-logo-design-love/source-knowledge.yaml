- sk_id: sk_logo_0047
  source_id: airey-logo-design-love
  source_terms:
    - "more often than not I give my clients a choice of two or three"
    - "it is much easier to choose one from two than it is to choose one from ten, even if all ten ideas are good"
    - "how can your client determine how many ideas are needed before the right one is created?"
  concept_label: concept_count_cannot_be_fixed_in_advance
  label_origin: extractor_assigned
  claim: >
    The source answers "how many concepts?" with a working number and then attacks the question. The
    number: sometimes one is all you need, but more often two or three, because a client is happier
    with a choice than with a single design handed to them. The limit: be careful about presenting too
    many, since it is much easier to choose one from two than one from ten even when all ten are good.
    The attack: quoting a fixed number of concepts in advance — as online client questionnaires do
    when they ask the client to select one, two, three or four — is bad practice, because neither the
    client nor the designer can know how many ideas are needed before the right one exists, and the
    designer cannot answer it until the design has started. The source extends the same argument to
    revision rounds: specifying a number at the outset only limits the outcome, and it refuses the
    implied bargain — you do not hand over a poor design because the client has not paid for more.
    Its preferred formulation to a client is "between one and four".
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The number of concepts required is discovered during the work, so committing to it beforehand
      caps the exploration at a number chosen in ignorance and creates a commercial incentive to
      present a weak option in order to fill the quota.
  scope:
    domain_discussed_by_source: [designer_client_process, logo_and_brand_identity_design]
    conditions: "identity projects quoted in advance; the source is describing its own freelance practice"
  caveats:
    - text: "the adjacent material is fee and quoting advice, deliberately not extracted; what is kept here is the reasoning about why a concept count cannot be known in advance"
