- sk_id: sk_logo_0009
  source_id: airey-logo-design-love
  source_terms:
    - "offer a one-colour version"
    - "you should also supply a version that uses only one"
  concept_label: single_colour_version_is_a_deliverable
  label_origin: extractor_assigned
  claim: >
    The source makes the single-colour version a required deliverable rather than an optional extra:
    whatever colours the mark carries, the designer should also supply a version using only one. It
    gives two reasons — it improves the overall versatility of the identity, and it saves the client
    having to come back to the designer if the company later opts for a one-colour print run.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A one-colour run is a decision the client may take later and for reasons the designer does not
      control (the source elsewhere names print budget). Supplying the reduction in advance removes
      that future dependency on the designer and widens the set of processes the identity can enter.
  scope:
    domain_discussed_by_source: [logo_and_brand_identity_design, print_and_physical_reproduction_of_marks]
    conditions: "identity deliverables handed to a client who will commission print without the designer"
  caveats:
    - text: "the source does not say how to derive the one-colour version, only that it must exist"
      origin: extractor_observed
    - text: "framed around commercial print runs of 2010; the reasoning is about print economics, not about screen or embroidery, though the source names embroidery-adjacent carriers elsewhere"
      origin: extractor_observed
  source_stated_problems: ["a client who commits to a one-colour print run and has no artwork for it"]
