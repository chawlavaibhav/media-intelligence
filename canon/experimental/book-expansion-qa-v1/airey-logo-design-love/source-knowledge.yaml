- sk_id: sk_logo_0005
  source_id: airey-logo-design-love
  source_terms:
    - "it is much easier to remember a single detail than five"
    - "if someone asked you to draw the McDonald's logo and then sketch the Mona Lisa, which would be more accurate?"
  concept_label: recall_load_argument_for_simplicity
  label_origin: extractor_assigned
  claim: >
    The source's third consequence of simplicity is memorability, and here it does give a mechanism:
    a viewer can hold one detail more reliably than five. It illustrates by asking the reader to
    recall the Mona Lisa's smile versus her clothing, hand position, eye colour, background and
    artist, then proposes a self-administered test — try to draw the McDonald's mark and then the
    Mona Lisa, and see which comes out more accurate.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Memory for a visual mark is limited by the number of independent details it contains. Reduce
      the count and the recall accuracy rises. The source states this as a fact about "how our mind
      works" without citing any evidence for it.
  scope:
    domain_discussed_by_source: [logo_and_brand_identity_design]
    conditions: "marks a viewer will see briefly and must recognise on a later encounter"
  caveats:
    - text: "an assertion about memory offered with no evidence, no citation and no measurement; the drawing test is proposed rhetorically and no result is reported"
      origin: extractor_observed
    - text: "the comparison is unfair on its own terms — a mark designed for recall is compared against a painting that was not"
      origin: extractor_observed
  source_stated_problems: ["a mark carrying several independent details, none of which is remembered"]
  source_stated_remedies: ["reduce to a single detail"]
