- sk_id: sk_logo_0017
  source_id: airey-logo-design-love
  source_terms:
    - "focus on one thing"
    - "just one. Not two, three, or four."
    - "the viewer would have been forced to consider an unnecessary element, which would make the design less memorable"
  concept_label: single_distinguishing_feature_rule
  label_origin: extractor_assigned
  claim: >
    The source's sharpest rule is a count: an iconic design that stands out has exactly one feature
    doing the standing out. It states the number emphatically and twice — one, not two, three or four —
    and gives the mechanism through a counterfactual rather than an example. The French Property
    Exhibition mark focuses on a single attribute, an open door in the tricolour. The source observes
    that the designer could have added an Eiffel Tower, that everyone would immediately associate an
    Eiffel Tower with France, and that this is precisely why it would have been wrong: the viewer would
    then have had to process an unnecessary element, making the design less memorable.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Every additional element in a mark is an additional thing the viewer must process inside the
      glance, and processing capacity inside a glance is the scarce resource. An element can be both
      relevant and harmful — the Eiffel Tower would have been relevant — because relevance does not
      buy back the attention it costs.
  scope:
    domain_discussed_by_source: [logo_and_brand_identity_design]
    conditions: "marks that must register in a quick glance; the source states the clients' customers will not spend long studying the logo"
  caveats:
    - text: "the counterfactual is asserted, not tested — no version with the Eiffel Tower was made or shown"
      origin: extractor_observed
    - text: "the source's own Tenth Church example (printed 101) is praised for carrying 'multiple conceptual themes of worship, welcome, transformation, outreach, and the cross' in one wordmark, which sits in tension with a strict reading of the one-feature rule. The tension is the source's."
      origin: extractor_observed
  source_stated_problems: ["a mark with too many elements", "an added element that is relevant but unnecessary"]
  source_stated_remedies: ["leave the client with a single thing to remember", "incorporate one feature only"]
  examples:
