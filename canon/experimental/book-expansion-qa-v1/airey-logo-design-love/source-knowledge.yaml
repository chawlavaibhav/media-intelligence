# David Airey, Logo Design Love (New Riders, 2010) — SPEC-03 SourceKnowledge
# EXPERIMENTAL — NOT LIVE CANON. Lane `airey-logo-design-love`, book-expansion-qa-v1.
# Non-merge, exploratory. Nothing here is accepted, corroborated or admitted Canon.
#
# LOCATORS: Case 1 of the locator addendum. The supplied text carries verified folios
# (printed page = PDF page - 13). Every page_start / page_end below is a PRINTED page number
# and falls inside printed 2-191, the span of the author's own text. Nothing was extracted
# from the appendix (192-197) or the index (198-204).
#
# COPY CAUTION, STATED ONCE AND ASSUMED THROUGHOUT: the local copy is a degraded, unattributed
# SPANISH machine translation of the English original (see PROVENANCE.md). Airey's own English
# wording is NOT recoverable from it. Every `source_terms` entry is therefore a back-translation
# into English of the Spanish text actually on the page, and every object carries
# `label_origin: extractor_assigned`. Where the brief asked for verbatim vocabulary — the
# logo / identity / brand distinction — the SUBSTANCE is recorded and the inability to verify
# the exact English words is stated in a caveat (see sk_logo_0034).
#
# FIGURE POLICY: this is a book about marks, and many claims are carried by a logo printed on
# the page rather than by the sentence. Where a claim depends on seeing the mark, the page was
# RENDERED AND LOOKED AT, and the object says so in `provenance.inspected.figures` and in the
# claim text. Where it was not, the object carries
# `extraction_uncertainty: figure_not_inspected` and the visual claim is NOT inferred from text.
# The full inventory and the honest counts are in EXTRACTION-NOTES.md.
#
# SURVIVORSHIP, STATED ONCE: Airey's examples are famous, surviving, commercially successful
# marks chosen after the fact. There is no unsuccessful comparison set anywhere in the book and
# no controlled comparison of any kind. Nothing below is evidence that these properties CAUSE
# success; they are properties the author observes in work he admires.

