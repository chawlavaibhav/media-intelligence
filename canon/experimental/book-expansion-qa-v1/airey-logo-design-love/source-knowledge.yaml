- sk_id: sk_logo_0049
  source_id: airey-logo-design-love
  source_terms:
    - "because of Nike's stature, standing and visibility in the market, the potential damage to the company's identity is much greater"
    - "sometimes a complete redesign could mean going a step too far when all that is needed is a refinement"
    - "sales of the Tropicana Pure Premium line plunged 20 per cent in less than two months"
  concept_label: redesign_risk_scales_with_existing_equity
  label_origin: extractor_assigned
  claim: >
    The source separates identity work into two categories with different risk profiles. Designing from
    scratch for a new company is the simpler case, because there is no brand equity for either party to
    take into account. Redesigning for an established company carries much higher risk for both, and
    the source makes the scaling explicit by contrast: Nike abandoning its internationally recognised
    swoosh for the outline of a shoe versus a new business called "Pete" commissioning a first identity
    — the potential damage is far greater in the first because of stature, standing and visibility.
    Three consequences follow in the same chapter. First, the redesign process is necessarily longer
    and stricter, with more thought and discussion per decision. Second, refinement is the right answer
    when the identity has become dated but consumer familiarity with it is high — the source's case
    keeps the distinctive red lettering so the equity around the old design stays intact. Third, the
    reasons must be sound: rebranding for its own sake or to follow trends can be a disaster, and
    without that guidance market leaders can throw away millions and their reputation with it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Brand equity is accumulated recognition held by the audience, not by the company, so replacing
      the carrier of that recognition destroys it. The Tropicana case is the source's demonstration:
      loyal customers could easily spot the old packaging when shopping, and the redesign removed the
      device they were spotting.
  scope:
    domain_discussed_by_source: [logo_and_brand_identity_design, brand_communication]
    conditions: "established companies with existing recognition; explicitly not applicable to start-ups with no equity"
  caveats:
    - text: "OUTCOME CLAIMED WITHOUT CONTROLS. The 20 per cent sales fall and the $33 million figure are cited to trade press, not to a controlled study; no alternative explanation is examined and the source does not claim to have one. The New Coke case is reported with a similar structure and the source openly says it does not know whether that was a deliberate manoeuvre or a genuine error."
      origin: extractor_observed
    - text: "the source itself notes that most brand redesigns do not go as badly as these two, and that both companies have probably had successful redesigns as well — the cases are selected for being famous failures"
      origin: source_stated
    - text: "the source's speculation that the dilution may have been a deliberate alignment with generic store-brand packaging is offered as an open question, not an answer"
      origin: source_stated
  source_stated_problems: ["rebranding for its own sake or to follow trends", "abandoning accumulated equity", "a redesign that removes the device customers use to find the product"]
  source_stated_remedies: ["establish the specific reasons for the rebrand first", "consider refinement rather than a complete overhaul where familiarity is high", "ask early whether any focus groups have been run, and suggest questioning existing and potential customers about brand perception"]
