- sk_id: sk_logo_0050
  source_id: airey-logo-design-love
  source_terms:
    - "let them know that what you need from them is strategic input and execution freedom"
    - "you have to trust that I can find the right design solution based on your feedback"
    - "what you are selling at this stage is the idea behind your best designs"
    - "clients are much less likely to resist your ideas going forward if they have seen a graphic representation of how their own strategic interpretation filters out"
    - "remember, it's a two-way process"
  concept_label: strategic_input_execution_freedom_and_showing_rather_than_arguing
  label_origin: extractor_assigned
  claim: >
    The source's governing rule for handling client feedback has three parts and they are stated
    separately. First, set the boundary in advance: tell the client that what you need is strategic
    input and execution freedom — say if the creative is not meeting the agreed strategy, but stop
    short of "make the blue darker" — because if the discussion becomes non-designers specifying
    colours and typefaces the identity will inevitably be weakened. Second, keep the presentation on
    the idea and the story behind the concepts, not on the intricacies of the mark or a particular
    typeface choice; those minor details can be settled once a single direction is agreed, otherwise
    you end up supplying revisions on more than one direction, which is an unnecessary expense for
    both parties. Third — and this is the repair move — when a client proposes a change you believe is
    wrong, do not become defensive. Build their request, pair it with the alternative you believe is
    better, explain why, and show both. The source reports that once the results were compared, the
    committee found it easier to see that its own idea was unsuitable. It generalises: clients are far
    less likely to resist your ideas later if they have seen a graphic representation of how their own
    strategic interpretation filters out. The source is equally clear about the other direction — be
    prepared to swallow your pride and listen, and it narrates a case in which the committee's
    rejected choice turned out, on reflection, to be much better suited to the firm.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A client's design suggestion is usually a strategic concern expressed in the only vocabulary
      they have. Building the suggestion converts an argument about authority into an observation
      about outcomes, which the client can concede without losing standing — and which can equally
      show the designer to be wrong.
  scope:
    domain_discussed_by_source: [designer_client_process]
    conditions: "presenting to a decision-making group; the source uses 'committee' for any client with more than one decision-maker"
  caveats:
    - text: "one narrated project in each direction; no measurement of whether the comparison method changes outcomes, and both accounts are the author's own"
      origin: extractor_observed
    - text: "the source records that in the Yellow Pages case the committee was unaware of the 'focus on one thing' idea, so the demonstration was doing the work of an explanation the designer had not given — which is an argument for explaining the principle, not only for showing the comparison"
      origin: extractor_observed
    - text: "the surrounding chapter contains agency-positioning tactics quoted from a consultant, including a scripted line to use when a contact resists. Those are business-development tactics and are deliberately not extracted."
      origin: extractor_observed
  source_stated_problems: ["design by committee", "non-designers specifying colours and typefaces", "revisions supplied on more than one direction", "the designer becoming defensive"]
  source_stated_remedies: ["ask for strategic input and execution freedom", "keep the presentation on the idea", "build the client's request and show it beside your alternative, with your reasons", "swallow your pride and listen"]
  examples:
    positive:
