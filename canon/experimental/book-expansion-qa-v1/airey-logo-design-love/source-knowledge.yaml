- sk_id: sk_logo_0002
  source_id: airey-logo-design-love
  source_terms:
    - "the simplest solution is usually the most effective"
    - "a simple logo helps satisfy most of the other requirements of iconic design"
  concept_label: simplicity_as_the_enabling_attribute
  label_origin: extractor_assigned
  claim: >
    Simplicity is not one attribute among equals in this source: it is the one that buys the others.
    The source states the reason directly — a simple mark helps satisfy most of the remaining
    requirements — and then spends three sub-sections demonstrating the three channels: simplicity
    makes a mark more versatile across media, easier to recognise (hence more likely to endure), and
    easier to remember.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A simple mark carries fewer elements, so it survives reduction, reproduces in more media,
      is recognised faster, and leaves less for a viewer to hold in memory. The source gives all
      three consequences explicitly and treats them as one causal chain running from simplicity.
  scope:
    domain_discussed_by_source: [logo_and_brand_identity_design]
    conditions: "marks intended for wide application across media and long service"
  caveats:
    - text: "the source nowhere defines 'simple' operationally; the nearest thing to a test it offers is the one-inch reduction (sk_logo_0006) and the describability test (sk_logo_0014)"
      origin: extractor_observed
    - text: "'usually the most effective' is a hedge the source itself supplies"
      origin: source_stated
  source_stated_problems: ["a mark carrying more detail than the smallest application can hold"]
  source_stated_remedies: ["take a minimalist approach"]
  examples:
    positive:
      - {description: "FedEx, Mitsubishi, Samsung, BBC named as marks that are simple and easier to recognise for it", figure_ref: "FedEx wordmark, printed 23 — rendered and inspected"}
    counter: []
  intra_source_relations:
