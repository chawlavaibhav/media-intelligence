    - "colour skews a client's ability to focus on the form and the ideas the logo communicates"
    - "no amount of fancy gradients or colour options will rescue a badly designed mark"
  concept_label: black_before_colour_sequencing
  label_origin: extractor_assigned
  claim: >
    The source treats colour as a step that comes last, and gives two distinct reasons drawn from two
    places in the book. The first is about the client's attention: an agency's standing practice is to
    present concepts initially in black and white only, because their designers have found that colour
    skews a client's ability to focus on the form and on the idea the mark communicates. The second is
    about the work itself: no amount of gradients or colour options will rescue a badly designed mark.
    The source adds a scheduling reason — colour is a detail that can easily be changed, and the last
    thing wanted is a client rejecting an effective idea because they dislike the colour scheme.
