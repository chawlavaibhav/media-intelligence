- sk_id: sk_logo_0001
  source_id: airey-logo-design-love
  source_terms:
    - "simple, relevant, enduring, distinctive, memorable, adaptable"
    - "the seven ingredients on the plate"
  concept_label: attribute_set_for_an_iconic_mark
  label_origin: extractor_assigned
  claim: >
    The source opens its central chapter by separating two standards. A merely successful design is
    one that meets the objectives set out in the design brief. An "iconic" design does that AND is
    additionally simple, relevant, enduring, distinctive, memorable and adaptable. The chapter then
    works through seven named headings — keep it simple; make it relevant; incorporate tradition;
    aim for distinction; commit to memory; think small; focus on one thing — and recaps them as a
    checklist. The list is the source's own and is stated twice.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
