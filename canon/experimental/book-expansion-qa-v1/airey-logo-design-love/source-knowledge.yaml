    violations: drop the fun approach for a law firm; no beach balls for a winter-holiday television
    programme; a smiling face will clearly not work for a cancer organisation; nothing too serious for
    a children's television programme; muted rather than bright fluorescent colours for a
    Michelin-starred restaurant. The source states the cost of the fit test: without a strong
    knowledge of the client's world you cannot expect to create a design that successfully separates
    the client's business from its nearest competitors.
