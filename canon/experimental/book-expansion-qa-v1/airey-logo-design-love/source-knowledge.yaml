- sk_id: sk_logo_0007
  source_id: airey-logo-design-love
  source_terms:
    - "don't forget your design may also need to accommodate smaller applications, such as zip pulls and clothing labels"
  concept_label: smallest_application_is_the_binding_constraint
  label_origin: extractor_assigned
  claim: >
    The source argues that designers default to imagining the mark large — on billboards — while the
    constraint that actually decides the design lives at the other end. It also names why clients
    care: an adaptable mark saves them money on print costs, brand-application meetings and potential
    redesigns, so the small-size requirement is one the client will press for on commercial grounds,
    not only an aesthetic preference of the designer's.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The smallest carrier sets the detail budget for every other carrier, because a mark that must
      be redrawn to survive it is no longer one mark. The client-side cost argument is stated
      separately: a mark that does not adapt generates print cost, meeting cost and redesign cost.
  scope:
    domain_discussed_by_source: [logo_and_brand_identity_design, print_and_physical_reproduction_of_marks]
    conditions: "clients whose identity reaches physical merchandise and garment applications"
  caveats:
    - text: "the cost saving is asserted, not quantified anywhere in the source"
      origin: extractor_observed
  source_stated_problems: ["designing for the billboard and discovering the mark fails on a zip pull"]
  source_stated_remedies: ["design for the smallest necessary application", "keep it simple, which also raises the chance of a design that lasts"]
