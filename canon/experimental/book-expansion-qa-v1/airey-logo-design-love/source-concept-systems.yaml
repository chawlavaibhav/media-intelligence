# David Airey, Logo Design Love — SPEC-03 SourceConceptSystems
# EXPERIMENTAL — NOT LIVE CANON. Lane `airey-logo-design-love`, book-expansion-qa-v1.
#
# FOUR systems, not five. A fifth candidate — a "redesign decision framework" assembled from
# Ch. 5 — was drafted and DROPPED, because on re-reading, the chapter is a sequence of narrated
# cases rather than a set of interacting principles: everything it teaches is already carried by
# sk_logo_0049 as a single object, and promoting it to a system would have been the extractor
# supplying structure the source does not have. Recorded here rather than silently omitted.
#
# Origin is marked at every structural level. Where the ordering, the hub, or the grouping is
# OURS, `system_level_uncertainty` says so plainly and `interpretation_basis` names the sentences
# in the source that the inference actually rests on.

source_id: airey-logo-design-love

source_concept_systems:

- scs_id: scs_logo_001
  source_id: airey-logo-design-love
  label: the_seven_elements_of_iconic_design
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    Ch. 3 names seven elements and recaps them as a checklist: keep it simple, make it relevant,
    incorporate tradition, aim for distinction, commit to memory, think small, focus on one thing.
    The membership is entirely the source's — it states the list twice, in the same order, with the
    same headings. What the source does NOT present is a structure over the list. It reads as seven
    peers. But the source itself says, in the first of the seven, that a simple logo helps satisfy
    most of the other requirements, and then spends the section demonstrating three of those
    satisfactions (versatility, recognisability, memorability) as consequences of simplicity. On the
    source's own account the set therefore has a hub, and treating the seven as peers loses the one
    piece of structure the source gives.
  whole_system_claim:
    text: >
      Simplicity is not one of seven requirements; it is the requirement that makes four of the
      others reachable. Versatility (think small), recognisability, memorability (commit to memory)
      and the distinctiveness route the source recommends (work in black, so the outline alone gives
      it away) are all stated by the source as consequences of, or as achieved through, simplicity.
      Relevance and tradition are the two members that do NOT flow from it — they come from
      research into the client's world, not from reduction — and they are the two that can pull
      against it, because an appropriate element and a heritage symbol are both things ADDED to a
      mark. The set's real tension is therefore between the reductive members and the additive ones,
      and the source resolves it once, at the French Property Exhibition, by ruling that a relevant
      element (an Eiffel Tower) must still be excluded if it is not the one thing.
    origin: extractor_synthesis
    interpretation_basis: >
      The hub structure rests on four things the source does state. (1) "A simple logo helps satisfy
      most of the other requirements of iconic design" — printed 22, stated as the answer to "why is
      the simplest solution usually the most effective?". (2) The three sub-sections that follow are
      each headed by a consequence of simplicity, not by an independent property. (3) "Working only
      in black and white can help create more distinctive marks... colour is really secondary to the
      form and the shape of your design" — printed 30 — makes the distinctiveness route reductive
      too. (4) "The only way to achieve this is to keep it simple" — printed 34 — makes the small-size
      member depend on it explicitly. The ADDITIVE / REDUCTIVE split, and the claim that this is
      where the set's tension lives, is entirely OURS; the source never contrasts the members with
      each other. It comes closest at printed 37, where a relevant element is excluded on
      one-thing grounds, and that single passage is the only textual support for it.
    source_ref: null
  members:
    - {sk_ref: sk_logo_0002, role_in_system: hub_enabling_member, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_logo_0020, role_in_system: additive_member, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_logo_0023, role_in_system: additive_member, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_logo_0013, role_in_system: reductive_member, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_logo_0016, role_in_system: reductive_member, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_logo_0006, role_in_system: reductive_member, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_logo_0017, role_in_system: reductive_member, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_logo_0001, role_in_system: the_source_s_own_statement_of_the_set, order: 8, membership_origin: source_stated}
    - {sk_ref: sk_logo_0046, role_in_system: exemption_clause, order: 9, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: none
      origin: source_stated
    dependencies:
      - {from: sk_logo_0006, to: sk_logo_0002, note: "the source states simplicity is the only way to achieve the small-size requirement", origin: source_stated}
      - {from: sk_logo_0016, to: sk_logo_0002, note: "memorability is presented as a consequence of a reduced detail count", origin: source_stated}
      - {from: sk_logo_0013, to: sk_logo_0002, note: "outline recognisability is reached by working in black, i.e. by reduction", origin: source_stated}
    tradeoffs:
      - {between: [sk_logo_0020, sk_logo_0017], note: "an element can be relevant and still excluded because it is not the one thing; the source rules this way once, at printed 37", origin: source_stated}
      - {between: [sk_logo_0023, sk_logo_0002], note: "incorporating heritage symbols adds elements that reduction would remove; the source never states this tension", origin: extractor_inferred}
    conflicts:
      - {between: [sk_logo_0001, sk_logo_0025], note: "Chermayeff's qualification a hundred pages later demotes simple-and-appropriate to necessary-but-insufficient; the source does not reconcile the two", origin: extractor_inferred}
  source_warns_against_isolated_use: true
  source_warning_ref: sk_logo_0046
  evidence:
    characteristics: [explicitly_stated, repeated_within_source, argued, practitioner_assertion]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The MEMBERSHIP and the LIST are wholly the source's, stated twice. The HUB is the source's in
      substance but not in presentation — it says simplicity satisfies most of the others without
      drawing the structure. The ADDITIVE / REDUCTIVE partition and the claim that the set's central
      tension runs along it are OURS, supported by exactly one passage. Anyone using this system
      should treat the list as the source's and the shape as an extractor's reading.
  provenance:
    chapter: "Ch. 3 — Elements of iconic design"
    section: "printed 22-39, including 'The seven ingredients on the plate' (38-39)"
    page_start: 22
    page_end: 39
    source_support: text_and_visual

- scs_id: scs_logo_002
  source_id: airey-logo-design-love
  label: the_reproduction_test_battery
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    Scattered through the book — but with six of them printed consecutively as tips 15 to 20 — is a
    set of checks that can be run against a finished mark rather than argued about: reduce it to
    about one inch; supply and check a single-colour version; supply and check a reversed version;
    check contrast against the ground AND between the mark's own elements; print it at a range of
    sizes and inspect it on paper; turn it upside down. Two further checks belong with them because
    they are administered the same way — can the mark be recognised from its outline alone, and can
    it be described in one short phrase. This is the most operational material in the source and the
    reason this lane exists.
  whole_system_claim:
    text: >
      These are not eight preferences. They are eight independent stress conditions on one artefact,
      and a mark can pass any seven and fail the eighth. They also partition into two groups that
      behave differently. Five are REDUCTIONS — take something away (colour, size, ground, the right
      way up) and see whether the mark survives; these have determinate outcomes and can be run by
      anyone. Three are JUDGEMENTS — outline recognition, one-phrase describability, and "clearly
      identified" contrast; these need a person and the source supplies no threshold for any of them.
      The practical consequence is that the reduction group can be automated and the judgement group
      cannot, and a checker that runs only the reductions will pass marks the source would reject.
    origin: extractor_synthesis
    interpretation_basis: >
      The source never groups these, never calls them tests, and never says a mark should be run
      through all of them. What it does is print six of them consecutively (tips 15-20, printed
      186-188) as a run of "supply this variant" and "check this property" instructions, which is a
      real adjacency in the source's own sequencing and not one we imposed. The one-inch figure
      (printed 34, restated 187), the outline standard (printed 30, restated 38) and the
      describability observation (printed 31) sit elsewhere and are pulled in by US on the grounds
      that they are administered identically — you apply them to a finished mark and get an answer.
      The REDUCTION / JUDGEMENT partition is entirely OURS and rests on the observable fact that the
      source supplies a determinate condition for the first group ("no loss of detail", "works on
      dark backgrounds") and none at all for the second ("clearly identified", "described easily",
      "gives it away").
    source_ref: null
  members:
    - {sk_ref: sk_logo_0006, role_in_system: reduction_test, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_logo_0007, role_in_system: scoping_condition_for_the_reduction_test, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_logo_0009, role_in_system: reduction_test, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_logo_0010, role_in_system: reduction_test, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_logo_0008, role_in_system: reduction_test, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_logo_0019, role_in_system: reduction_test, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_logo_0018, role_in_system: judgement_test, order: 7, membership_origin: source_stated}
    - {sk_ref: sk_logo_0013, role_in_system: judgement_test, order: 8, membership_origin: extractor_inferred}
    - {sk_ref: sk_logo_0014, role_in_system: judgement_test, order: 9, membership_origin: extractor_inferred}
    - {sk_ref: sk_logo_0015, role_in_system: judgement_test_scoped_to_lettering, order: 10, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - {from: sk_logo_0010, to: sk_logo_0018, note: "reversing the mark is precisely the case in which the figure-ground contrast changes, so the two checks interact", origin: extractor_inferred}
      - {from: sk_logo_0009, to: sk_logo_0011, note: "a mark developed in black is already its own one-colour version, so the black-first sequence makes this deliverable nearly free", origin: extractor_inferred}
    tradeoffs:
      - {between: [sk_logo_0006, sk_logo_0020], note: "a mark carrying enough specificity to be category-appropriate may carry more detail than the one-inch reduction survives; the source does not raise this", origin: extractor_inferred}
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, repeated_within_source, visually_demonstrated, practitioner_assertion]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      Every MEMBER is the source's own instruction, stated in its own words. The GROUPING is ours,
      though six of the ten sit consecutively in the source. The REDUCTION / JUDGEMENT partition and
      the claim about what can and cannot be automated are ENTIRELY OURS and are the most
      extractor-supplied structure in this lane. Three memberships are marked
      `extractor_inferred` for that reason. The source has no concept of a test battery.
  provenance:
    chapter: "Ch. 11 — 25 practical logo design tips; Ch. 3 — Elements of iconic design"
    section: "tips 15-20 (printed 186-188); 'Think small' (34); 'Aim for distinction' (30-31); tip 12 (185)"
    page_start: 30
    page_end: 188
    source_support: text_and_visual

- scs_id: scs_logo_003
  source_id: airey-logo-design-love
  label: the_concept_development_sequence
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: source_stated
  description: >
    Ch. 7 is organised as an ordered pipeline and the source presents it as one: mind map to widen
    the direction space; sketch on paper to generate volume without the computer's friction; move to
    the computer only once a concept has structure; render only the ideas you would accept; present
    in black and white; mock up in context; and apply colour only after the client is behind a
    direction. The chapter's own recap restates the order. The ordering is therefore the source's,
    not ours.
  whole_system_claim:
    text: >
      Each step in this sequence exists to keep a decision from being made too early on the wrong
      basis. Mapping defers committing to a direction; sketching defers committing to execution;
      withholding weak concepts defers the client's selection until the set is safe; withholding
      colour defers a taste judgement until after the form judgement; the mock-up defers the
      client's imagination-work until the designer has done it for them. What makes it a sequence
      rather than a checklist is that each deferral is only available while the previous one holds:
      once colour is on the page it cannot be taken off the client's mind, and once a weak concept
      is in the set it can be chosen.
    origin: extractor_synthesis
    interpretation_basis: >
      The ORDER is the source's, stated twice — once by the chapter's structure and once by its own
      recap at printed 117. The unifying reading — that every step is a deferral of a premature
      decision — is OURS. It is supported by the fact that the source gives a "too early" reason for
      four of the steps in its own words: colour "skews a client's ability to focus on the form and
      the ideas" (111); including uncertain ideas "introduces the possibility that your client will
      pick the weakest candidate" (110); the computer "requires unnecessary steps that hinder your
      creative flow" (96); mapping is needed "at the stage they are most needed" (90). The source
      never says these are the same reason.
    source_ref: "Ch. 7 recap, printed 117"
  members:
    - {sk_ref: sk_logo_0039, role_in_system: step, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_logo_0040, role_in_system: step, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_logo_0045, role_in_system: step, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_logo_0011, role_in_system: step, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_logo_0048, role_in_system: step, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_logo_0012, role_in_system: reason_supporting_step_4, order: 6, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: procedural
      origin: source_stated
    dependencies:
      - {from: sk_logo_0040, to: sk_logo_0039, note: "the source instructs the designer to sketch from words that came out of the map", origin: source_stated}
      - {from: sk_logo_0011, to: sk_logo_0045, note: "black-and-white presentation only helps if the set presented is already restricted to strong ideas", origin: extractor_inferred}
    tradeoffs:
      - {between: [sk_logo_0045, sk_logo_0047], note: "showing fewer concepts protects the outcome but the source separately refuses to fix the number in advance, so the designer cannot promise the restriction", origin: extractor_inferred}
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, repeated_within_source, visually_demonstrated, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      Low for the structure, higher for the claim. The sequence and its order are the source's own
      and are stated twice. The single unifying mechanism — that every step is a deferral of a
      premature decision — is OURS, and while the source supplies a "too early" reason for four of
      the five steps, it never generalises them into one.
  provenance:
    chapter: "Ch. 7 — From pencil to PDF"
    section: "printed 90-117, recap at 117"
    page_start: 90
    page_end: 117
    source_support: text_and_visual

- scs_id: scs_logo_004
  source_id: airey-logo-design-love
  label: logo_identity_brand_nesting
  label_origin: extractor_assigned
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    Three terms the source distinguishes and keeps distinguishing: the logo (one mark), the brand
    identity or visual identity (the applied system — stationery, vehicle graphics, signage,
    packaging, website), and the brand (mission, history, and people's perception). The source uses
    the distinction to do two opposite jobs, and that is what makes it a system rather than three
    definitions. Upward, it limits the designer's claim: an effective logo will not save a poor
    product or a weak mission. Downward, it expands the designer's engagement: a client asking for a
    logo in isolation should be advised that the value lies in applying it across the whole range of
    corporate literature, stationery and advertising.
  whole_system_claim:
    text: >
      The three levels are not a hierarchy of importance but of controllability, and the source uses
      them in both directions at once. Everything the designer controls sits at the bottom two
      levels; everything that decides whether the work succeeds commercially sits at the top one.
      This is why the same distinction can be honest ("a logo is not a brand") and self-interested
      ("so hire me for the whole identity") in the same book without contradiction — and the source
      makes both moves within two pages of each other.
    origin: extractor_synthesis
    interpretation_basis: >
      The three levels and their contents are the source's own, stated at printed 190 (tip 24) and
      printed 161-162. The CONTROLLABILITY reading, and the observation that the source deploys the
      distinction in two opposite directions, are OURS. The textual basis is that both moves are
      present and adjacent: the limiting claim at 190 ("will not save a poor product or service, or
      a company with a weak mission") and the expanding claim at 162 (advise a client who wants a
      logo alone that they should take the expert guidance on applying it across the full range).
      The source presents neither as an inference from the other.
    source_ref: null
  members:
    - {sk_ref: sk_logo_0034, role_in_system: the_distinction_itself, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_logo_0035, role_in_system: decision_inside_the_logo_level, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_logo_0029, role_in_system: what_holds_the_identity_level_together, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_logo_0036, role_in_system: the_claim_made_at_the_brand_level, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_logo_0049, role_in_system: what_is_at_risk_at_the_brand_level, order: 5, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: causal
      origin: extractor_inferred
    dependencies:
      - {from: sk_logo_0029, to: sk_logo_0034, note: "consistency is the property that makes a set of applications one identity rather than several", origin: extractor_inferred}
    tradeoffs: []
    conflicts:
      - {between: [sk_logo_0035, sk_logo_0037], note: "tip 5 says a symbol can restrict a company expanding into other markets; Ch. 2 says symbols are what let companies cross language barriers and compete globally. The source states both and reconciles neither.", origin: extractor_inferred}
  source_warns_against_isolated_use: true
  source_warning_ref: sk_logo_0034
  evidence:
    characteristics: [explicitly_stated, repeated_within_source, practitioner_assertion, mechanism_absent]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The three levels are the source's and are its own closing point. The reading of them as a
      controllability gradient, the observation that the source uses the distinction in two opposite
      directions, and the causal ordering are all OURS. One membership is marked extractor_inferred.
      A separate and serious caution applies to this system specifically: the brief asked for
      Airey's vocabulary VERBATIM, and this copy is a Spanish translation from which his English
      wording cannot be recovered — see the caveat on sk_logo_0034.
  provenance:
    chapter: "Ch. 11 — 25 practical logo design tips; Ch. 10 — Answers to your questions; Ch. 2"
    section: "tip 24 (printed 190); 'Usage rights' (161-162); tip 5 (180); Ch. 2 opening (8)"
    page_start: 8
    page_end: 190
    source_support: text
