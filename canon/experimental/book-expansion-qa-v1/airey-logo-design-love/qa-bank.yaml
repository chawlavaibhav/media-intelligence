# David Airey, Logo Design Love — Q&A bank
# EXPERIMENTAL — NOT LIVE CANON. Lane `airey-logo-design-love`, book-expansion-qa-v1.
#
# LOCATORS: Case 1 — a PDF with verified authored folios (printed page = PDF page - 13). Every
# locator cites PRINTED page numbers and every cited page lies inside printed 2-191, the span of
# the author's own text, and was read in the page-marked extraction. No page number is invented.
#
# COPY CAUTION: the local copy is a degraded Spanish machine translation of the English original.
# Airey's exact English wording is not recoverable from it, so nothing in this bank is presented
# as a verbatim quotation of his prose. Short phrases in quotation marks below are the extractor's
# English rendering of the Spanish text actually on the page, and every answer that turns on
# wording says so. See PROVENANCE.md.
#
# SOURCE POSITION: this is a practitioner's book. Its evidence is a set of famous surviving marks
# selected after the fact, with no comparison set and no controls anywhere. Where an item is about
# what this source holds rather than about how the world is, `answer_type: source_position` is
# used and the answer says so.

qa_items:

# ── DEFINITIONS AND FACTS ────────────────────────────────────────────────────

- qa_id: qa_logo_0001
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 190, tip 24 'A logo is not a brand'; and printed pp. 161-162, 'Usage rights'"
  question: >
    Airey draws a three-level distinction that his book keeps returning to. Name the three levels,
    say what belongs at each, and state the limit he draws from the distinction.
  answer: >
    The LOGO is one mark, and he says explicitly it is only one part of a company's brand identity.
    The BRAND IDENTITY — which he also calls the visual identity — is the applied system: he
    enumerates business cards, compliment slips, vehicle graphics and signage design, and elsewhere
    adds packaging, marketing materials, the website and company vehicles. The BRAND as a whole is
    larger again and is not a design artefact at all: the company's mission, its history, and
    people's perception of it. The limit he draws is a limit on his own trade — an effective logo
    plays an important role but will not save a poor product or service, or a company with a weak
    mission. He uses the same distinction in the other direction too, to argue that a client asking
    for a logo in isolation should be advised to take guidance on applying it across the full range
    of corporate literature.
  answer_type: concept_definition
  difficulty: easy
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Tip 24 states the three levels and the limit; printed pp. 161-162 gives the enumeration of what
    an identity project covers. The exact English wording could not be verified from this copy,
    which is a Spanish translation, so the substance is given rather than a quotation.
  confounders:
    - "collapsing identity and brand into one, which is the error the tip exists to correct"
    - "reading 'a logo is not a brand' as meaning the logo does not matter — he says it plays an important role"
    - "assuming the brand level is something a designer delivers; in his account it includes perception, which nobody delivers"

- qa_id: qa_logo_0002
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 34 'Think small', restated at printed p. 187 tip 17"
  question: >
    Airey gives one numeric target for a mark's reproduction. What is it, what condition attaches to
    it, and what does he say is the only way to meet it?
  answer: >
    The design should work at a minimum of around one inch, and the condition attached is "with no
    loss of detail". The only route he offers to meeting it is simplicity — he states plainly that
    the only way to achieve this is to keep the mark simple, and he ties it to the same claim
    everywhere else in the chapter, that simplicity is what makes the other requirements reachable.
    He states the figure twice, in the "Think small" section and again in tip 17. It is a
    practitioner's rule of thumb: no viewing distance, no substrate, no reproduction process and no
    derivation is given anywhere.
  answer_type: factual
  difficulty: easy
  knowledge_type: production_reasoning
  requires_application: false
  support: >
    Printed p. 34 states the one-inch minimum and the "no loss of detail" condition; printed p. 187
    repeats it. No derivation appears anywhere in the book.
  confounders:
    - "treating one inch as a measured threshold rather than a rule of thumb"
    - "confusing it with a screen or pixel dimension — the figure is stated in inches and is print-era"
    - "assuming the condition is legibility; the condition he states is loss of detail"

- qa_id: qa_logo_0003
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 186-188, tips 15, 16, 19 and 20"
  question: >
    Four of Airey's twenty-five tips concern variants and checks on a finished mark rather than on
    its design. Name them and, for each, say what he asks for.
  answer: >
    Tip 15, offer a one-colour version: whatever colours the mark carries, also supply one using
    only one. Tip 16, pay attention to contrast in the medium: keep an eye on the contrast between
    the logo and its background AND between the actual elements inside the logo, with the tonal
    range contrasting enough for the mark to be clearly identified. Tip 19, reverse it: offer an
    option that works on dark backgrounds, which he glosses as supplying a version in white. Tip 20,
    place it upside down: a design that looks right the correct way up may not look right inverted,
    so consider it from every angle before finalising. The internal-contrast half of tip 16 is the
    least obvious of the four and is the one a designer working only against white will not have
    tested.
  answer_type: factual
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: >
    The four tips are printed consecutively across printed pp. 186-188. Tip 16 names two contrast
    relationships, not one, which is the detail most summaries drop.
  confounders:
    - "remembering only the logo-versus-background contrast and dropping the element-versus-element half"
    - "treating the one-colour version as an optional extra; he presents it as something you should supply"
    - "confusing tip 18's print-and-inspect instruction, which is a physical paper check, with these four"

- qa_id: qa_logo_0004
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 38-39, 'The seven ingredients on the plate'"
  question: >
    Airey's central chapter closes with a recap list. What are the seven headings, and what
    discrepancy is there between that list and the adjectives he opens the chapter with?
  answer: >
    The seven are: keep it simple; make it relevant; incorporate tradition; aim for distinction;
    commit to memory; think small; focus on one thing. The chapter opens instead with six
    adjectives — an iconic design will be simple, relevant, enduring, distinctive, memorable and
    adaptable. The two lists do not line up: "incorporate tradition" and "think small" are headings
    with no matching adjective, and "enduring" is an adjective with no heading of its own. The
    mismatch is the book's, not a reading error, and it matters because it shows the seven are a
    teaching sequence rather than a specification. The chapter's final section confirms that reading
    by telling the reader rules are made to be broken.
  answer_type: factual
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    The adjective list is at printed p. 22; the seven headings run from p. 22 to p. 37 and are
    recapped at pp. 38-39; the exemption is at p. 39.
  confounders:
    - "assuming the six adjectives and the seven headings are the same list stated twice"
    - "treating the seven as a specification, which the chapter's own closing paragraph withdraws"
    - "adding 'legible' or 'timeless' to the list — legibility is tip 12, in a different chapter"

- qa_id: qa_logo_0005
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 30, 'Aim for distinction'"
  question: >
    Airey states an ordering between colour and form. What is the ordering, what working practice
    does he derive from it, and what does he say that practice does?
  answer: >
    The ordering is that colour is secondary to the form and the shape of the design. The practice
    he derives is to work only in black and white, and what he says it does is create more
    distinctive marks, because the contrast puts the emphasis on the shape or the idea. He offers
    this inside the distinctiveness section, as his answer to the question "how do you create a logo
    that is unique?" — so in his account working in black is not a presentation convention but a
    generation method. He restates the point negatively in tip 10: no amount of fancy gradients or
    colour options will rescue a badly designed mark.
  answer_type: concept_definition
  difficulty: easy
  knowledge_type: colour
  requires_application: false
  support: >
    Printed p. 30 states both the ordering and the working practice; printed p. 184 (tip 10) gives
    the negative formulation. No comparison of marks developed in colour against marks developed in
    black appears anywhere.
  confounders:
    - "reading this as the presentation argument from printed p. 111, which is a different claim about the client's attention"
    - "concluding that finished marks should be monochrome — his own examples on the facing pages are two-colour"
    - "treating it as a claim about colour psychology; it is a claim about which channel carries distinctiveness"

- qa_id: qa_logo_0006
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 62, opening of Ch. 5 'Skirting the dangers of a redesign'"
  question: >
    Airey splits identity projects into two categories with different risk profiles. What are they,
    and what is the comparison he uses to make the difference concrete?
  answer: >
    Either a newly formed company needing a first identity, or an established company wanting its
    identity redesigned or refined. He says designing from scratch is the much simpler case,
    because there is no brand equity for either the designer or the client to take into account. The
    comparison is Nike abandoning its internationally recognised swoosh in favour of, say, the
    outline of a shoe, versus a new business called "Pete" commissioning a visual identity to help
    sell custom T-shirts — because of Nike's stature, standing and visibility in the market, the
    potential damage is far greater. He adds two consequences: the redesign process is necessarily
    longer and stricter, with more thought and discussion per decision, and it therefore tends to be
    the more lucrative of the two for the designer.
  answer_type: comparison
  difficulty: easy
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Printed p. 62 sets out both categories, the Nike-versus-Pete comparison, and the observation
    about process length and fees.
  confounders:
    - "assuming the risk is to the designer's reputation; he frames it as damage to the company's identity"
    - "reading 'no brand equity' as meaning a start-up project is low-stakes rather than structurally simpler"
    - "confusing this with the separate refine-versus-replace decision at printed pp. 72-73"

- qa_id: qa_logo_0007
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 185, tip 13 'Be consistent'"
  question: >
    Whose responsibility does Airey say brand style guides are, and what chain of consequences does
    he attach to consistency?
  answer: >
    The designer's — he states that many logos are accompanied by style guides and that creating
    them is your responsibility. Their function is to make sure anyone inside the client's company
    who uses the design does so consistently. The chain he attaches is two links and he states it
    compactly: consistency breeds trust, and trust wins customers. He makes the same claim in the
    earlier chapter, that the same visual identity seen over and over generates trust and trust
    makes customers come back for more, and his historical case is the Kellogg signature, used on
    the front of every packet since 1906. Neither link is evidenced; Kellogg is a survivorship case
    with a century of confounded marketing behind it.
  answer_type: source_position
  difficulty: easy
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Tip 13 at printed p. 185 assigns the responsibility and states the chain; printed pp. 9 and 21
    give the earlier statement and the Kellogg case.
  confounders:
    - "assuming the client or their marketing team writes the guide"
    - "treating the trust-to-customers chain as an established finding rather than this author's assertion"
    - "confusing consistency with the template-per-application practice he praises at printed p. 15, which pulls the other way"

# ── MECHANISMS ───────────────────────────────────────────────────────────────

- qa_id: qa_logo_0008
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 22-24, 'Keep it simple'"
  question: >
    Airey does not treat simplicity as one requirement among seven equals. What does he say it does,
    and what are the three specific consequences he works through?
  answer: >
    He states that a simple logo helps satisfy most of the other requirements of iconic design — so
    on his own account simplicity is the member of the set that buys the others, not a peer of them.
    The three consequences he works through in order are: versatility, because a minimalist approach
    lets the mark be used across a wide range of media, from posters down to a website favicon;
    recognisability, which he says raises the chance of achieving a timeless, lasting quality; and
    memorability, because it is much easier to remember a single detail than five. He extends the
    dependency elsewhere — the small-size requirement is met only by simplifying, and the
    distinctiveness route he recommends works by removing colour so that shape carries the mark.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Printed p. 22 states the enabling claim and the versatility consequence; p. 23 gives
    recognisability and memorability; p. 34 makes the small-size dependency explicit.
  confounders:
    - "listing the seven elements as unstructured peers, which loses the one piece of structure he supplies"
    - "attributing to him a mechanism for WHY recognisability produces longevity — he asserts the link without arguing it"
    - "confusing versatility with adaptability across cultures; his versatility claim is about media and carriers"

- qa_id: qa_logo_0009
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 37, the French Property Exhibition case, 'Focus on one thing'"
  question: >
    Airey argues that an element can be genuinely relevant to the subject and still be wrong to
    include. What is the case he uses, and what is the mechanism that makes relevance insufficient?
  answer: >
    The case is a counterfactual, not an example: the redesigned French Property Exhibition mark
    focuses on one attribute, an open door read out of the tricolour. He observes that the designer
    could have added an Eiffel Tower, that everyone would immediately associate an Eiffel Tower with
    France — and that this is exactly why it would have been wrong. The mechanism he gives is
    processing cost inside a glance: the viewer would then have been forced to consider an
    unnecessary element, which would make the design less memorable. So relevance does not buy back
    the attention an element costs. This is the argument that makes his one-feature rule non-obvious;
    without it the rule reads as a preference for minimalism, and with it, it is a claim about what
    a second element does to the first.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    Printed p. 37 gives the Eiffel Tower counterfactual and the "forced to consider an unnecessary
    element" reasoning. The counterfactual is asserted; no version with the tower was made or shown.
  confounders:
    - "reading the rule as 'keep it minimal', which misses that the excluded element is relevant"
    - "assuming the Eiffel Tower version exists and was tested; it was neither made nor shown"
    - "confusing this with the relevance requirement at printed p. 25, which the one-thing rule here overrides"

- qa_id: qa_logo_0010
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 111-113, 'Black and white before colour'; and printed p. 184, tip 10"
  question: >
    Airey gives two entirely different reasons for withholding colour, from two places in the book.
    Distinguish them, and say which one is about the client rather than about the mark.
  answer: >
    The first is about the client's attention and is the agency practice he reports at printed p.
    111: present concepts initially in black and white only, because their designers have found that
    colour skews a client's ability to focus on the form and on the ideas the logo communicates. He
    adds the scheduling version of the same point — colour is a detail that can easily be changed,
    and the last thing you want is a client turned off an effective idea because they dislike the
    colour scheme. The second is about the work and is tip 10: no amount of fancy gradients or
    colour options will rescue a badly designed mark. The first is the client-facing reason; the
    second is a claim about the artefact. They are usually collapsed into one and they are not one —
    a designer could honour the second while breaking the first, by developing in black and then
    presenting in colour.
  answer_type: comparison
  difficulty: hard
  knowledge_type: colour
  requires_application: false
  support: >
    Printed p. 111 gives the client-attention reason and attributes it to one agency's standing
    practice; printed p. 113 gives the easily-changed-detail reason; printed p. 184 gives the
    gradients claim. There is a third, separate argument at printed p. 30, about working in black
    producing more distinctive marks.
  confounders:
    - "collapsing all of these into one 'work in black and white' rule"
    - "missing that the presentation reason is attributed to an agency's own experience, not to any study"
    - "assuming the mark must be delivered in black and white; the sequence ends with colour and Pantone swatches"

- qa_id: qa_logo_0011
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 110, 'Dressing for success', the Circle project"
  question: >
    Airey gives a sharper reason than "it looks unprofessional" for not showing a client every idea.
    What is it, and what happened when he broke his own rule?
  answer: >
    The sharp reason is that anything you show can be chosen: including ideas you are unsure of
    introduces the possibility that the client will pick the weakest candidate out of an otherwise
    strong set. The dilution point — that sub-par possibilities drag down the quality of the set —
    is the softer, secondary reason. When he broke it, on an early project for a South African web
    hosting company called Circle, he presented all his ideas for feedback in his eagerness to
    please. The effect he reports was not a bad choice but no choice: he overwhelmed the client,
    made it impossible to pick one idea out of so many possibilities, and the project stalled and
    was never completed. It is one narrated failure with no control, told by the person it happened
    to, and the stall may have had other causes.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed p. 110 gives both reasons and the Circle account. The rule is restated in the chapter
    recap at printed p. 117.
  confounders:
    - "giving only the dilution reason, which is the weaker of the two"
    - "assuming the failure was that the client chose badly; the reported failure was paralysis"
    - "confusing this with the separate 'how many concepts' answer at printed pp. 169-170, which is about a number"

- qa_id: qa_logo_0012
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 63-65, 'Don't squeeze too hard', the Tropicana rebrand"
  question: >
    In Airey's account of the Tropicana packaging redesign, what specifically was lost, and what
    outcome does he report? What should a careful reader not conclude from it?
  answer: >
    What was lost was a finding device. He notes that PepsiCo had for years used the "straw stuck in
    an orange" symbol, that consumers were used to it, and that brand-loyal customers could easily
    spot the packaging when shopping — and the redesign removed it, producing what he calls a
    diluted, almost generic identity. The outcome he reports is that sales of the Tropicana Pure
    Premium line fell 20 per cent in less than two months, costing PepsiCo $33 million in lost
    sales, and that the company reverted to the old packaging about two months after the launch. A
    careful reader should not conclude that the book establishes the causal link: both figures are
    cited to trade press, no controls exist, no alternative explanation is examined, and Airey
    himself floats an open speculation that the dilution may have been a deliberate alignment with
    generic store-brand packaging. He also says most redesigns do not go this badly and that both
    PepsiCo and Coca-Cola have probably had successful ones.
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Printed pp. 63-65. The 20 per cent figure is footnoted to AdAge and the $33 million to a
    branding blog; the reversion and the store-brand speculation are on printed p. 65.
  confounders:
    - "treating the 20 per cent figure as evidence that simplicity or genericness causes sales loss"
    - "identifying the lost element as the brand name; the name remained, set small and rotated vertically"
    - "confusing this with New Coke at printed pp. 66-68, where he says outright he does not know whether it was a deliberate manoeuvre or a genuine error"

- qa_id: qa_logo_0013
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 139-140, the Yellow Pages dart concept, 'Swallow that pride'"
  question: >
    A client group is convinced an element should be added that you believe will weaken the mark.
    What does Airey do instead of arguing, and what is the mechanism he says makes it work?
  answer: >
    He builds their request. On a Yellow Pages redesign, committee members were convinced that
    adding a dart beside the walking fingers would improve the design and he was sure it would not.
    Rather than becoming defensive, he executed the dart version — and paired it with another idea
    he believed was a better improvement, explaining why when he presented it. He reports that once
    the two results could be compared, it was easier for the committee to see that its own idea was
    unsuitable. The mechanism he generalises is that clients are much less likely to resist your
    ideas going forward if they have seen a graphic representation of how their own strategic
    interpretation filters out. He also records the reason the demonstration was needed: the
    committee was unaware of the "focus on one thing" idea from Chapter 3 — which is as much an
    argument for explaining the principle as for showing the comparison.
  answer_type: repair
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed pp. 139-140. Both concepts are printed on p. 140, the dart version above and the
    alternative below. One narrated project, no measurement of whether the method changes outcomes.
  confounders:
    - "assuming he refused and defended his position, which is the move he explicitly rejects"
    - "assuming he simply complied — he coupled the client's request with an alternative"
    - "reading this as always deferring to the client; he narrates the opposite case at printed p. 136, where the committee was right and he was wrong"

- qa_id: qa_logo_0014
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 90-94, 'Mind mapping'; and printed pp. 96-97, 'The fundamental need for the sketchpad'"
  question: >
    Airey puts two stages before any use of a computer. What does he say each is FOR — not what each
    is — and what does he demonstrate rather than merely assert?
  answer: >
    Mind mapping is for considering as many different design directions as possible, at the stage
    where that matters most: you write a word central to the brief, branch outward, and build the
    largest thought cloud you can. Sketching is for volume and freedom: paper is less restrictive
    and adds no intermediate steps, so more ideas get out before the computer is opened, and he says
    drawing skill is irrelevant because the point is documenting ideas so they can be built on or
    discarded. What he demonstrates rather than asserts is the mapping chain on the Ecometrica
    project: from "science" he associated to "DNA", from DNA to "personal", from personal to
    "fingerprint" — and basing the mark on a fingerprint became his central concept possibility.
    That chain is the evidence that word association moves the imagination into directions it would
    not otherwise take.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed pp. 90-91 state the purpose of mapping; pp. 93-94 give the Ecometrica chain; pp. 96-97
    give the sketching argument. One designer's practice throughout, with no comparison against work
    produced without it.
  confounders:
    - "describing the stages without giving the purpose, which is the reusable half"
    - "treating the two-day mapping figure as a finding; it is his habit, chosen so a night's sleep falls inside the stage"
    - "assuming he bans the computer outright; he excludes it until a concept has developed structure"

- qa_id: qa_logo_0015
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 33, 'Commit to memory'; and printed p. 36, 'Focus on one thing'"
  question: >
    Airey converts a claim about how a mark is SEEN into a constraint on how the designer WORKS.
    What is the exposure claim, what is the working constraint, and what is the inferential step
    between them that he does not defend?
  answer: >
    The exposure claim is that very often a quick glance is all the time you get to make an
    impression — his examples are a bus passenger looking out of the window at a billboard and a
    pedestrian looking up as a branded truck drives past, and he adds that the client's customers
    are not going to spend long studying the logo. The working constraint is to limit the time spent
    on each idea sketch, trying about thirty seconds. The step between them is his rhetorical
    question: otherwise, how can you expect a viewer to remember it with a quick glance? That
    equates the designer's sketching time with the viewer's processing time, which is an assumption,
    not an argument — and it plainly would not hold for a viewer who already knows the mark. The
    exposure claim itself is offered with no evidence and its examples are outdoor media of 2010.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: concept_development
  requires_application: false
  support: >
    Printed p. 33 gives the exposure claim and the thirty-second sketching cap; printed p. 36
    restates the brief-glance premise; printed p. 39 recaps it. No evidence is offered for either.
  confounders:
    - "treating thirty seconds as a claim about viewer attention rather than about sketching time"
    - "assuming the glance claim is measured; it is asserted"
    - "confusing it with the one-or-two-second reading window in tip 12, which is about legibility of lettering"

- qa_id: qa_logo_0016
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 31, the NAAs mark, 'Aim for distinction'"
  question: >
    Airey slips in a test a designer can run on their own prose rather than on the artwork. What is
    it, what does he claim, and in which direction does the claim actually run?
  answer: >
    Having described a mark in a single clause — an "open newspaper" symbol in the form of the
    letter A — he draws attention to how easy the description was and asserts a rule: distinctive
    marks are almost always simple enough to be described easily. The claim as stated runs only one
    way, from distinctiveness to describability. The useful diagnostic runs the other way — if you
    cannot describe your mark in a short phrase, it is probably carrying more than one idea — and
    that inversion is a reader's inference, not his claim. Two further limits are worth keeping: he
    hedges with "almost always", and the single demonstration is the author describing a mark whose
    intended meaning he had just been told, which is the opposite of the blind condition that would
    make the test informative.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: >
    Printed p. 31. The mark was rendered and inspected during extraction: a solid black form built
    from splayed page-fans that resolves into a capital A.
  confounders:
    - "attributing the reverse entailment to Airey; he states only that distinctive marks are describable"
    - "dropping his 'almost always' hedge"
    - "treating one self-administered description as evidence"

- qa_id: qa_logo_0017
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 129-130, 'Outlining the ground rules'"
  question: >
    Airey gives a phrase for the boundary he sets on client feedback. What is the boundary, what
    does he say happens if it is not held, and what does he suggest saying to make it concrete?
  answer: >
    The boundary is that what he needs from the client group is strategic input and execution
    freedom. If it is not held — if the discussion collapses into them telling you which colours or
    typefaces to use — he says the identity will inevitably be weakened, because you are taking
    design decisions from too many non-designers. To make it concrete he scripts both halves for the
    client: saying you think a blue is too weak for an organisation trying to present strength, or
    that a typeface feels too old-fashioned, is exactly what he wants — expressing those impressions
    is critical to a project's success. Saying "make the blue darker" or "why not try a modern
    typeface" is what he asks them to stop at, with the reason given as trust: you have to trust
    that I can find the right design solution based on your feedback.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed pp. 129-130. The two paired examples — the impression is welcome, the fix is not — are
    the operative part and are the half most summaries drop.
  confounders:
    - "reading it as a rule against client feedback; he says expressing impressions is critical"
    - "treating it as a claim about client competence rather than about where the boundary sits"
    - "confusing it with the separate instruction to keep the presentation on the idea rather than the details"

# ── COMPARISONS AND TRADE-OFFS ───────────────────────────────────────────────

- qa_id: qa_logo_0018
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 25, 'Make it relevant'; and printed p. 106, the La Internacional case"
  question: >
    Airey holds two positions on literal depiction that look contradictory. State both, and state
    the condition that reconciles them.
  answer: >
    Position one, at printed p. 25 and again as tip 4: a logo does not have to say what a company
    does. The BMW logo is not a car, the Hawaiian Airlines logo is not a plane, and he generalises —
    computer logos need not show computers, dentist logos need not show teeth, furniture shop logos
    need not show furniture. Position two, at printed p. 106: a logo does not have to reflect
    literally what the business is about, but when it does, and especially when it manages to do so
    without hitting you over the head with the idea, it can really be a winner. The reconciling
    condition is about MANNER, not about the fact of depiction: literalness is allowed provided it
    is not overstated. His approved case is a natural-medicine pharmacy whose chosen mark builds a
    capsule into the letterform and sets it in a green circle — literal twice over, and praised.
    Note that the criterion "without hitting you over the head" is taste, not a test.
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Printed p. 25 and tip 4 at printed p. 180 give the first position; printed p. 106 gives the
    second and the pharmacy case. The pharmacy page was rendered and inspected during extraction.
  confounders:
    - "reading the first position as a prohibition on depiction"
    - "assuming the reconciling condition is about how much of the mark is literal; it is about how overstated the reference is"
    - "missing that every non-depicting exemplar he names is a large established brand"

- qa_id: qa_logo_0019
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 22-39 (Ch. 3) against printed p. 145, Ivan Chermayeff quoted"
  question: >
    Somewhere outside the criteria chapter, Airey prints a quotation that demotes that chapter's
    central requirements. Whose is it, what does it say, and why does it matter?
  answer: >
    Ivan Chermayeff, quoted in the motivation chapter at printed p. 145: to be effective for a
    reasonably long lifetime, all identities must be simple and appropriate — however, if they are
    not original or in any way provocative, thought-provoking and remarkable, they will not do their
    job. It matters because Chapter 3 treats simple and relevant as the goal, and this reduces them
    to entry conditions. It is the only place in the book where the criteria are declared
    insufficient rather than merely defeasible, and Airey never carries the qualification back into
    Chapter 3 or reconciles the two. It also matters practically: the four sufficiency conditions
    are entirely unoperationalised, so nothing in the book tells you how to check them, whereas the
    necessary conditions come with reproduction tests attached.
  answer_type: source_position
  difficulty: hard
  knowledge_type: concept_development
  requires_application: false
  support: >
    Printed p. 145, in 'Never stop learning'. The criteria chapter runs printed pp. 22-39 and is
    never revised in light of it.
  confounders:
    - "attributing the qualification to Airey; it is a quoted designer's, printed without comment"
    - "reading it as agreeing with Ch. 3 — it grants the premise and then denies sufficiency"
    - "confusing it with the 'rules are made to be broken' passage at printed p. 39, which withdraws necessity rather than sufficiency"

- qa_id: qa_logo_0020
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 180, tip 5, against printed p. 13, 'Symbols transcend borders'"
  question: >
    Airey states two incompatible things about symbols and international expansion. Set them out,
    and say what the book does about the conflict.
  answer: >
    Tip 5, at printed p. 180: if the company is entertaining ideas about expanding into other
    markets, it might be better to opt for a distinctive logotype, because a mark or identifying
    symbol could prove restrictive. Chapter 2, at printed p. 13: to sell products internationally
    your brand has to speak a lot of languages, and easily identified symbols need no translation —
    recognisable regardless of culture or language, symbols let companies cross language barriers,
    compete globally and maintain consistency across a wide range of media. Under the same
    condition, planned expansion, one passage recommends the wordmark and the other recommends the
    symbol. The book does nothing about it: the two sit 167 pages apart and neither refers to the
    other, and Airey gives no reason for the restrictiveness claim in tip 5. Anyone citing him on
    this should cite both.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Tip 5 at printed p. 180; the symbols argument at printed p. 13. The conflict is genuine and
    unresolved in the source; neither passage cross-references the other.
  confounders:
    - "picking one passage and presenting it as his settled position"
    - "resolving the conflict by inventing a distinction he does not draw, such as one being about market entry and the other about market breadth"
    - "assuming tip 5's restrictiveness claim comes with a reason; it does not"

- qa_id: qa_logo_0021
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 72-73, 'Maybe just a few adjustments?', the JCJ Architecture case"
  question: >
    Airey names the condition under which refinement beats a full redesign. What is the condition,
    and what does the JCJ case keep and what does it change?
  answer: >
    The condition is a conjunction, and both halves must hold: refinement is the good option when
    the client's identity has become somewhat dated over recent years BUT consumer familiarity with
    it is high. He is explicit that a complete redesign could be a step too far when a few
    adjustments would do while still preserving the equity behind the visual. In the JCJ case what
    changes is the typeface — the old mark used Helvetica Neue, which he notes is a well-crafted
    face with nothing spectacularly wrong with it beyond some tight kerning, but which was used on
    seemingly every new design through a period in the nineties. What is kept is the distinctive red
    lettering, and he says explicitly that this is why the brand equity around the old design
    remains intact. The refined mark also establishes consistency and allows flexibility across
    print methods, from brochures to offset to office laser output.
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Printed pp. 72-73. Both marks are printed on p. 73 and were rendered and inspected during
    extraction; they differ subtly, which is itself the evidence for the refinement claim.
  confounders:
    - "giving only the 'dated' half of the condition and dropping the familiarity half"
    - "assuming refinement means changing less of the artwork; the criterion is what carries the equity, not how much changes"
    - "confusing this with the Tropicana case, which is the failure of the opposite decision"

- qa_id: qa_logo_0022
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 169-170, 'How many concepts?'; and printed pp. 171-172, 'Design revisions'"
  question: >
    Airey gives a working number for how many concepts to present and then attacks the question
    itself. Give both, and give the argument that makes the attack more than a dodge.
  answer: >
    The working number: sometimes one is all you need, but more often than not he gives clients a
    choice of two or three, on the reasoning that a client is happier with a choice than with a
    single design handed to them — while warning that it is much easier to choose one from two than
    one from ten, even if all ten ideas are good. The attack: quoting a fixed number in advance, as
    online client questionnaires do when they ask the client to pick one, two, three or four, is bad
    practice, because neither party can know how many ideas are needed before the right one exists,
    and the designer cannot answer it until the design has started. What makes it more than a dodge
    is the incentive he identifies: promising four creates pressure to present a weak idea to fill
    the quota. He runs the same argument for revision rounds — specifying a number at the outset
    only limits the outcome — and refuses the implied bargain outright: you do not hand over a poor
    design because the client has not paid for more. His preferred formulation to a client is
    "between one and four".
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed pp. 169-170 for the concept count and the questionnaire criticism; printed pp. 171-172
    for revisions and the refusal. "Two or three" and "between one and four" are his habits, not
    derived numbers.
  confounders:
    - "reporting 'two or three' as a rule; he presents it as his practice and then argues no number can be fixed"
    - "assuming the objection is commercial; his stated objection is that the count is unknowable before the work starts"
    - "confusing this with the separate rule about not showing ideas you would not accept"

- qa_id: qa_logo_0023
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 15, 'Symbols transcend borders', against printed p. 185, tip 13"
  question: >
    The Bethnal Green project is Airey's model of versatility, and the practice it demonstrates pulls
    against another of his own requirements. Explain both sides.
  answer: >
    The versatility side: the chosen star was picked over the team's other variations not only
    because it was a good design but because it could be used as a template and MODIFIED to suit any
    application or theme. The simplest form of the star is engraved into the pub's pint glasses; the
    screen-printed paper carries the same design drawn by hand. He calls the project a classic
    lesson in versatility and turns it into a standing question — always ask whether your logo can
    adapt to different media. The tension: tip 13 requires consistency, backed by a style guide whose
    job is to make sure everyone in the client's company uses the design the same way. Deliberate
    per-application modification and strict consistency are not the same instruction, and the book
    never says how much a template may vary before it stops being one mark — which is exactly the
    question a style guide has to answer.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Printed pp. 13-15 for the template practice and the engraved and screen-printed applications;
    printed p. 185 for the consistency requirement. Printed p. 15 was rendered and inspected during
    extraction.
  confounders:
    - "reading versatility as one fixed artwork appearing everywhere, which is what the project is NOT"
    - "assuming Airey addresses the tension; he does not raise it"
    - "treating the engraved application as decorative; it is the case with no colour at all, so only form survives"

- qa_id: qa_logo_0024
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 29, Malcolm Grear quoted, against printed pp. 136-137, 'Swallow that pride'"
  question: >
    Airey prints a demanding statement about the designer's own standard and, a hundred pages later,
    a story that cuts against it. Give both and say how they can be held together.
  answer: >
    Grear, at printed p. 29: the most difficult person to please on any logo design project should be
    the designer creating the mark — it is a challenge because the work has to be memorable and as
    timeless as possible, and "I don't want to be in vogue, I want to set the standard and not follow
    others." Against that, at printed pp. 136-137, Airey produced two strong concepts for Berthier
    Associates; the committee judged his preferred, more organic option too organic to represent the
    firm's structured approach and chose the other. Looking back, he says their choice was much
    better suited to the firm, and adds that it looks very good on their business cards. They can be
    held together only by separating two things Airey keeps separate himself: the standard applied
    while making the work, which is where Grear's demand belongs, and the openness applied while
    receiving feedback on it — even when everything inside you is saying no, it is always worth
    listening carefully and keeping an open mind.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed p. 29 for the Grear quotation; printed pp. 136-137 for the Berthier account and Airey's
    retrospective concession. Both are practitioner accounts, neither tested.
  confounders:
    - "reading Grear's standard as licence to override the client"
    - "reading the Berthier story as saying the client is usually right; it is one case, and the Yellow Pages case runs the other way"
    - "attributing Grear's words to Airey"

# ── DIAGNOSIS AND APPLICATION ────────────────────────────────────────────────

- qa_id: qa_logo_0025
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 34 'Think small'; printed p. 186 tip 15; printed p. 187 tips 16 and 18; printed p. 188 tips 19 and 20"
  question: >
    You have a finished wordmark for a new company and a single afternoon. Using only checks Airey
    actually specifies, what do you run, and which of your results are determinate and which are
    judgements?
  answer: >
    Six checks come straight from him. Reduce it to about one inch and confirm no detail is lost.
    Flatten it to one colour and confirm the one-colour version he requires actually works. Put it on
    a dark ground and confirm the reversed version reads. Check both contrast relationships he names
    — mark against ground, and element against element within the mark. Print it, replicated across a
    range of sizes and colours on one sheet, and confirm on paper that it is clean, holds contrast
    and is not pixelated. Turn it upside down and look. Determinate: the reduction, the flatten, the
    inversion, and the print sweep — something either survives or it does not, and you can say which
    elements were lost. Judgements: the two contrast checks, because his only pass condition is that
    the mark be "clearly identified", which is not a measurement — and, if the mark carries lettering,
    his legibility gate, which asks whether most people can read it straight away and specifies no
    population, no exposure time and no distance. Nothing in the book supplies a threshold for any of
    the judgements, so a result stated as a number would be yours, not his.
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    The checks are at printed p. 34 (one inch), p. 186 (one colour), p. 187 (contrast; print sweep),
    p. 188 (reverse; upside down), p. 185 (legibility). The determinate-versus-judgement split is a
    reading of what he does and does not supply a pass condition for.
  confounders:
    - "adding a numeric contrast ratio, which comes from accessibility standards and not from this source"
    - "treating the print sweep as a screen check; he specifies printing and inspecting paper"
    - "assuming the one-colour check is a mechanical desaturation; he asks for a supplied version, which a designer would redraw"

- qa_id: qa_logo_0026
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 185, tip 12 'Remember legibility'"
  question: >
    Two clients bring you a script wordmark that is hard to read at a glance. One is an unknown
    start-up; the other is a household name. What does Airey's legibility tip imply for each, and
    what is the sentence that makes the difference?
  answer: >
    For the start-up, his gate applies at full force: if most people cannot read it straight away,
    do not consider using it as a logo — his named failing case is a client's handwriting that may
    look pretty and still fails. For the household name, the gate is loosened by his own scoping
    clause, which is the sentence that makes the difference: legibility is key, "especially when the
    brand isn't well known". That concedes that recognition can substitute for reading, so an
    established mark can carry lettering that is not immediately readable. The reason he gives for
    the gate is exposure: the audience will most likely look at the logos you design for only one or
    two seconds before moving on. Note what he does not supply — no test population, no exposure
    timing and no viewing distance — so any specific test you run is yours, not his.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: typography
  requires_application: true
  support: >
    Printed p. 185. The scoping clause "especially when the brand isn't well known" is the operative
    qualification and is the half most often dropped.
  confounders:
    - "applying the gate identically to both, which ignores his own scoping clause"
    - "reading the one-or-two-second figure as measured; it is asserted"
    - "concluding that script faces are ruled out; his criterion is immediate readability, not the class of typeface"

- qa_id: qa_logo_0027
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 36-37, 'Focus on one thing'"
  question: >
    A client for a Himalayan eco-resort asks you to add a mountain silhouette to a mark that already
    has a single leaf device. The mountain is genuinely relevant. What does Airey's reasoning say,
    and what is the strongest counter-consideration from his own book?
  answer: >
    His reasoning rules against it, and rules against it precisely BECAUSE the mountain is relevant.
    The one-thing rule requires exactly one feature doing the work of standing out — one, not two,
    three or four — and the Eiffel Tower counterfactual at printed p. 37 is the same shape of case:
    an element everyone would immediately associate with the subject, excluded because the viewer
    would then be forced to consider an unnecessary element, making the design less memorable. So
    relevance is not a defence. The strongest counter-consideration from the same book is his own
    Tenth Church example at printed p. 101, a simple wordmark he praises for incorporating multiple
    conceptual themes — worship, welcome, transformation, outreach and the cross — in one graphic
    icon. That shows his rule counts DEVICES, not meanings: one device may legitimately carry
    several readings, and adding a second device is what he forbids. A mountain silhouette beside a
    leaf is a second device; a leaf whose outline also reads as a peak would not be.
  answer_type: application
  difficulty: hard
  knowledge_type: composition
  requires_application: true
  support: >
    Printed pp. 36-37 for the rule and the Eiffel Tower counterfactual; printed p. 101 for the Tenth
    Church wordmark and its five stated themes. The device-versus-meaning distinction is a reading
    that reconciles the two passages; Airey does not draw it explicitly.
  confounders:
    - "allowing the mountain because it is relevant, which is the exact error the counterfactual targets"
    - "reading the rule as forbidding multiple meanings, which his own Tenth Church example contradicts"
    - "treating this as a minimalism preference rather than a claim about processing cost inside a glance"

- qa_id: qa_logo_0028
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 111-113, 'Black and white before colour', the Woodmere Art Museum case"
  question: >
    You are about to send a client three concepts for a new wordmark, each already coloured because
    the palette is part of the idea. Following the practice Airey documents at Woodmere, what would
    you change, at which point would colour re-enter, and what does he say the risk is if you do not?
  answer: >
    You would present all three in black and white only, and hold colour back until the client is
    firmly behind one direction — at Woodmere the agency presented three concept families
    (monogram, signature, perspective) in black and white, and only once the client had settled on
    the monogram did its designers render in colour, delivering the final colours as Pantone swatches.
    The stated reason for the order is that colour skews a client's ability to focus on the form and
    on the ideas the logo communicates. The risk he names for doing otherwise is specific and not
    the obvious one: it is not that the client will choose a bad colour, it is that the client will
    be turned off an effective IDEA simply because they dislike the colour scheme — and colour, he
    points out, is a detail that can easily be changed afterwards, so it is the cheap variable being
    allowed to decide the expensive one. If the palette really is inseparable from the idea, you have
    a case his account does not cover, and you should say so rather than claim his support.
  answer_type: application
  difficulty: medium
  knowledge_type: colour
  requires_application: true
  support: >
    Printed pp. 111-113. The pages were rendered and inspected during extraction: thirty-two concepts
    across pp. 111-112, every one in black, white and grey, and the chosen mark in colour with three
    Pantone chips on p. 113.
  confounders:
    - "keeping colour because it 'is part of the brand', which is the objection his sequence is designed to defer, not to answer"
    - "presenting one concept in black and white and the rest in colour, which reintroduces exactly the skew"
    - "assuming the deliverable is monochrome; the sequence ends in colour"

- qa_id: qa_logo_0029
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 46-47, 'Asking the tougher questions'; and printed p. 179, tip 2"
  question: >
    A client mentions in passing that they promote themselves mainly through leaflets handed out at
    trade events. Airey treats that answer as changing the design, not just the media plan. What
    follows from it, and what should you have asked before designing?
  answer: >
    It changes the colour decision, and it changes it before any concept exists. He uses almost this
    exact case: if the company promotes itself through leaflets at trade events, you may need to
    remind the decision-maker that a multicoloured rainbow effect will cost more to produce than,
    say, a cool monotone grey design. The question you should have asked, and asked very early, is
    whether a print budget has been set — because colour usually costs more and can limit the scope
    of the design. He also warns not to assume: every printer's prices are unique, and with some the
    full-colour cost comes close to a one-colour job, though he says this is usually infrequent. He
    puts the duty on the designer: it is your job to inform the client about commercial print
    requirements and limitations at the start of the process. This is print economics of 2010, not a
    claim about any digital pipeline; the transferable part is the ordering — find out the constraint
    before you choose the palette.
  answer_type: application
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: true
  support: >
    Printed p. 46 gives the leaflet case and the rainbow-versus-monotone comparison; printed p. 179
    (tip 2) gives the print-budget question, the printer-pricing warning and the duty. He gives no
    figures and says so.
  confounders:
    - "treating the promotional-channel question as market research rather than as a production constraint"
    - "assuming full colour always costs substantially more; he explicitly allows the exception"
    - "delaying the question to the artwork-delivery stage, which is after the decision it should govern"

- qa_id: qa_logo_0030
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 160-161, 'Similar-looking logos'"
  question: >
    A designer is accused of copying a mark that does look similar to theirs. Reconstruct Airey's
    answer, including the discriminator he reports and the two things you should not take from it.
  answer: >
    His answer starts by normalising the resemblance: with millions of companies in existence and
    most iconic logos being simple in appearance, it is almost certain that if you search hard enough
    you will find a design similar to any other. Note the sting in that — the simplicity his own book
    demands is what shrinks the space of forms and makes collision likely. The discriminator he
    reports is what a trademark lawyer weighs most heavily: whether the two logos are used in the
    same industry or by the same profession. If they are not, he says the lawyer will probably tell
    you there is no case; if they are, he warns that lawyers are not cheap, so research well and be
    prepared to spend. Two things not to take from it. First, this is not legal advice: it is a
    designer's second-hand summary from 2010, tied to no jurisdiction or statute, and it moves
    between copyright infringement and trademark confusion inside one passage. Second, it is not
    absolution for the design process — he pairs it with Mike Davidson's discipline of telling
    yourself at every step that someone has surely already thought of this, and then asking what you
    can do to set yours apart, and with his own rule never to settle on an idea you have seen
    elsewhere.
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: >
    Printed pp. 160-161. The Davidson quotation and Airey's "original to the best of your knowledge"
    formulation are on p. 161. Tip 1 at printed p. 178 adds the preventive version — ask the client
    early about competitors and previous identities.
  confounders:
    - "treating the same-industry test as a statement of trademark law"
    - "reading the inevitability argument as meaning resemblance never matters"
    - "missing that the collision risk is a direct cost of the simplicity the book requires"

- qa_id: qa_logo_0031
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 63-65 and 72-73, Ch. 5"
  question: >
    A twelve-year-old regional food brand asks for a fresh identity. Its packaging is dated, but
    shoppers find it on the shelf by one distinctive device. Using Airey's Chapter 5 reasoning, what
    do you recommend and what is the specific failure you are avoiding?
  answer: >
    You recommend refinement, not replacement — his stated condition is exactly this pair: the
    identity has become somewhat dated over recent years, but consumer familiarity with it is high.
    A complete redesign would be going a step too far when a few adjustments would do while keeping
    the equity behind the visual intact, and his JCJ case shows the shape of it: change the typeface,
    keep the distinctive red lettering, and the equity around the old design survives. The specific
    failure you are avoiding is the Tropicana one: consumers were used to the "straw stuck in an
    orange" device and brand-loyal customers could easily spot the packaging when shopping; the
    redesign removed it, and he reports sales of the line falling 20 per cent in less than two
    months and the company reverting to the old packaging. Before designing anything, he would have
    you establish the client's actual reasons for rebranding, and ask early whether any focus groups
    have been run — if not, suggest that questioning existing and potential customers about brand
    perception should be the first order of business. State the reported outcome as this source's
    claim: it is cited to trade press, with no controls.
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Printed pp. 63-65 (Tropicana), pp. 67-68 (focus groups), pp. 72-73 (refinement and JCJ). The
    Tropicana and JCJ pages were rendered and inspected during extraction.
  confounders:
    - "recommending a full redesign because the identity is dated, which uses only half his condition"
    - "assuming refinement means a small change; the criterion is preserving what carries the equity"
    - "presenting the 20 per cent figure as demonstrated causation rather than as this source's uncontrolled claim"

- qa_id: qa_logo_0032
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 34, 'Think small'; and printed p. 35, the Sugoi applications"
  question: >
    A client insists the mark will only ever appear on a website and on large exhibition panels, so
    small-size behaviour does not matter. What is Airey's argument against accepting that, and what
    is his commercial argument rather than his aesthetic one?
  answer: >
    His argument is that the ambition to see work on billboards is exactly what makes designers
    forget the other end, and that the design may also need to accommodate smaller applications —
    his named cases are zip pulls and clothing labels, and the Sugoi mark is photographed on both a
    zip pull and a woven garment label. His commercial argument, which is the one to put to a
    client, is not about craft: an adaptable mark saves the client a considerable amount of money on
    print costs, brand-application meetings and potential redesigns, which is why he says clients
    are typically enthusiastic about and demanding of adaptability. Note the honest limit — he never
    quantifies that saving. Note also what your client is really asserting: that the set of future
    applications is known now, which is the assumption an identity designed to last the lifetime of
    the company cannot safely make.
  answer_type: application
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: true
  support: >
    Printed p. 34 for the argument and the client-cost reasoning; printed p. 35 for the Sugoi
    applications, which were rendered and inspected during extraction. The cost saving is asserted
    and never quantified.
  confounders:
    - "arguing only from craft, which gives the client nothing to weigh"
    - "citing the one-inch figure as a standard rather than as this author's rule of thumb"
    - "assuming a favicon is the small case he has in mind; his small cases are physical merchandise"

- qa_id: qa_logo_0033
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 44-47, 'Gathering preliminary information' and 'Asking the tougher questions'"
  question: >
    Airey gives a reason for each briefing question rather than just a list. Take three of his
    questions and state what each is actually FOR.
  answer: >
    "What does your audience care about?" — it focuses and directs the creative effort onto whatever
    appeals to the client's customers, and it demonstrates to the client that you have an interest in
    their customers rather than merely a wish to please personal tastes. "Which logos do you think
    will appeal to your customers, and why?" — the point is the redirection: by shifting the focus
    off the client's individual design tastes and onto their customers', the process stays oriented
    to the interest of the business as a whole rather than one person's preference. "Why does your
    audience need a new brand identity?" — it forces the client to justify the project, and it often
    exposes a knee-jerk response to a competitor's relaunch, in which case he instructs you to
    encourage the client to proceed slowly and carefully, because the company may have built
    enormous equity around a long-standing identity. His summary of why all this matters: logos that
    are pretty can win awards, but they do not always win market share.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed pp. 45-47 give the questions with their stated purposes; printed p. 48 gives the
    awards-versus-market-share line. He explicitly presents the set as a starting point, not a
    standard.
  confounders:
    - "reciting the questions without their purposes, which is the reusable half"
    - "treating the list as fixed; he says each sector and company varies and the reader should form their own"
    - "assuming the taste question is about gathering references; it is about moving the decision off one person's preference"

- qa_id: qa_logo_0034
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 57-58, the New Mexico Heart Hospital and Zia Pueblo"
  question: >
    A client wants their mark built on a symbol sacred to a living community. What does Airey's one
    worked case actually recommend, what harm does the designer in it name, and what should you be
    careful not to generalise?
  answer: >
    It recommends asking, through the client. The designer, aware that the Zia sun symbol was an
    ancient and sacred design belonging to Zia Pueblo, encouraged the doctors to request an audience
    with the elders at Zia Pueblo to ask for permission to use their identifying mark, rather than
    simply using it. The harm she names is concrete and current: people slapping the Zia at random
    onto the side of any old work van as an identity, which she says happens often in New Mexico —
    so the objection is not abstract offence but a pattern of appropriation she could see. Airey
    generalises it only as far as being sensitive to that kind of thing, adding that respecting
    traditions and differences can bring unexpected parties together, which matters for collective
    acceptance. What not to generalise: this is one narrated project with a favourable outcome
    recounted rather than tested, the Pueblo granted use and blessed the hospital grounds, and Airey
    frankly notes the public-relations benefit — so the case cannot be read as evidence that asking
    pays. It is a boundary condition on borrowing heritage symbols, and it is specific to a
    community that can be identified and asked.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Printed pp. 57-58. One project; the outcome is narrated, not tested, and no general procedure
    for identifying who holds a symbol is offered.
  confounders:
    - "generalising to any pre-existing symbol; his other heritage case, Vanderbilt's oak leaf, involves no living rights-holder to ask"
    - "reading the good outcome as evidence that permission-seeking is commercially advantageous"
    - "treating the designer's route as direct — she had the CLIENT request the audience"

- qa_id: qa_logo_0035
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 30, 'Aim for distinction'; and printed pp. 48-49, 'Homework time'"
  question: >
    A founder says their mark must "stand out". Using Airey, turn that into two things you can
    actually do, and name what each requires that the founder has not supplied.
  answer: >
    First: pursue outline recognisability. His stated best strategy is to focus initially on a design
    that is recognisable — so recognisable, in fact, that its shape or outline alone gives it away —
    and the route he recommends is working only in black and white, because the contrast puts the
    emphasis on the shape or idea, colour being secondary to form. What that requires and the founder
    has not supplied is a way to administer the test: he offers no protocol for who is shown the
    outline, against what, or what counts as passing. Second: define "out" as a set. He is explicit
    that a distinctive logo is one that can easily be separated from the competition, and his
    research instruction is to focus on how the client's competitors brand themselves, picking up any
    weaknesses you perceive and using them to your advantage — with the blunt framing that if your
    client is to win, there has to be a loser. What that requires and the founder has not supplied is
    the competitor set: without a named set there is nothing for distinctiveness to be relative to.
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: >
    Printed p. 30 for the outline standard and working in black; printed pp. 48-49 for the competitor
    instruction and the zero-sum framing; printed p. 173 for his refusal to quantify how much
    research is enough.
  confounders:
    - "treating 'stand out' as a property of the mark alone rather than relative to a named set"
    - "supplying a numeric distinctiveness score; the source has none and inventing one attributes it to him"
    - "confusing the outline test with the small-size reduction; they fail for different reasons"

- qa_id: qa_logo_0036
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 180, tip 5 'Not every brand needs a logo mark'"
  question: >
    A two-person consultancy asks for a symbol because "every real brand has one". What does Airey's
    tip 5 actually make you decide, when should you decide it, and what does his reason not include?
  answer: >
    It makes you decide whether there should be a symbol at all, rather than assuming there should.
    He states that sometimes the client just needs a professional logotype to identify the business
    and that using a symbol can be an unnecessary addition, and he tells you to ask the client
    whether they have a preference one way or the other. When: he is explicit that this is something
    to determine at the start of the project, before concept work, not something to arrive at. What
    his reason does not include is any argument. His one directional rule — if the company is
    entertaining ideas about expanding into other markets, it might be better to opt for a
    distinctive logotype, because a mark or identifying symbol could prove restrictive — is stated
    as a conclusion with no reasoning attached, and it is contradicted by his own earlier chapter,
    where symbols are what let companies cross language barriers and compete globally. So the usable
    part of tip 5 is the decision and its timing; the expansion rule is unsupported and disputed
    inside the same book.
  answer_type: application
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Printed p. 180. The conflicting passage is at printed p. 13. Neither refers to the other and no
    reason is given for the restrictiveness claim.
  confounders:
    - "applying the expansion rule as settled advice without noting the contradiction at printed p. 13"
    - "treating a symbol as the default and the wordmark as the exception, which reverses his framing"
    - "deferring the decision until concepts exist; he places it at the start"

- qa_id: qa_logo_0037
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 96-97, 'The fundamental need for the sketchpad'; printed p. 149; printed p. 155"
  question: >
    A designer says they think faster on screen than on paper. Reconstruct Airey's reasons for
    excluding the computer anyway, and state precisely where his exclusion stops.
  answer: >
    Three reasons, from three places. Friction: translating the same process to a computer requires
    unnecessary intermediate steps that hinder creative flow, whereas on paper you want a circle
    here, a stroke there — no problem, just do it. Volume: what matters is beating out as many ideas
    as possible before turning to the computer, sketching from a single mapped word, then combining
    two, then a group. Disinhibition: keep an open mind and do not limit yourself, make a visual note
    of every thought that passes even if the ideas seem far-fetched, and do not let weak drawing
    skill stop you, because the point is documenting ideas so you can build on them or discard them.
    He repeats it at printed p. 149 with a designer's addition that drawing "will teach you how to
    see". Where the exclusion stops is stated precisely: eventually your concept develops structure,
    and only then are you ready to use a computer. It is a stage rule, not a prohibition — and it is
    practitioner assertion throughout, with no comparison and no measurement anywhere in the book.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed pp. 96-97 for all three reasons and the stopping point; printed p. 149 for the repeat and
    the Huerta quotation; printed p. 182 (tip 7) for the compressed version.
  confounders:
    - "reading it as a general ban on digital tools rather than a stage rule"
    - "assuming the argument is about craft or nostalgia; his stated argument is throughput and freedom"
    - "treating 'drawing skills are not important' as encouragement; it is a claim about what the stage is for"

- qa_id: qa_logo_0038
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 187, tip 18 'Test at a variety of sizes'"
  question: >
    Airey's size test is a physical procedure with a specific layout instruction. State the
    procedure, the three properties checked, and the layout instruction with its reason.
  answer: >
    The procedure is to PRINT the work — this is a paper check, not a screen check. The three
    properties to confirm on the paper are that it is clean, that it has a good level of contrast,
    and that it is not pixelated. The layout instruction is not to print a single logo: replicate the
    design across a variety of sizes and colours on the sheet for variation, and his stated reason is
    that there is no point in using a full page of paper on one tiny design. The value of the
    instruction is that it makes the test a comparison across a range in one look rather than a
    sequence of single verdicts. What he does not supply is any pass criterion for the three
    properties; "clean", "good contrast" and "not pixelated" are left to the designer's eye.
  answer_type: factual
  difficulty: easy
  knowledge_type: production_reasoning
  requires_application: false
  support: >
    Printed p. 187. Explicitly a print-and-inspect instruction on paper output; it is production
    advice in the source's own frame and is not a rendering instruction.
  confounders:
    - "substituting an on-screen contact sheet, which is a different act with different failure modes"
    - "checking one size, which the instruction exists to prevent"
    - "assuming a numeric contrast criterion; he gives none"

- qa_id: qa_logo_0039
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 190, tip 22 'Don't neglect the substrate'; and printed pp. 175-176, 'Tools of the trade'"
  question: >
    Two of Airey's cautions are about the artwork's physical fate rather than its design. What are
    they, and why does he say each matters?
  answer: >
    The substrate: the paper or card a logo appears on can make a big difference to how it appears in
    the final presentation, because the colour and the sharpness of the mark can change drastically —
    so discuss all the possibilities for variation with the commercial printer, or advise the client
    to, before final production. And scalability: the delivered artwork must be scalable to any size,
    for use on posters or on the side of buildings, which is his reason for producing marks as vector
    artwork rather than in a photo editor. The failure case for the second is named earlier and is
    the sharper illustration: a low-resolution "save for web" logo file scaled up and used on the
    cover of a printed sales manual, which he says defeats the purpose of hiring a specialist. Both
    are physical-production cautions in his own frame, tied to 2010 commercial print, and neither
    comes with a method or a tolerance.
  answer_type: factual
  difficulty: easy
  knowledge_type: production_reasoning
  requires_application: false
  support: >
    Printed p. 190 (tip 22) for the substrate; printed pp. 175-176 for scalable vector artwork; the
    low-resolution failure case is at printed p. 47. Tool recommendations in the same passage are
    deliberately not treated as knowledge here.
  confounders:
    - "reading the substrate caution as being about paper quality rather than about colour and sharpness shifting"
    - "treating the scalability point as a software preference; his stated reason is size range"
    - "assuming he gives tolerances or a method; he gives neither"

- qa_id: qa_logo_0040
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 39, 'Remember that rules are made to be broken'"
  question: >
    Airey ends his criteria chapter by weakening it. What exactly does he withdraw, what precondition
    does he attach, and what does he claim the benefit is?
  answer: >
    He withdraws necessity. Having given the seven elements, he asks whether you always have to play
    by the rules and answers that rules are made to be broken — it is up to you to break new ground
    and cross boundaries in attempting designs that are a cut above the rest. The precondition is
    stated a chapter-opening earlier and is not decorative: you have to know the rules in any
    creative endeavour before you can successfully break them, illustrated by a Michelin-starred chef
    who does not pull ingredients out of thin air but takes a proven recipe and adapts it. The
    benefit he claims is not a better outcome — he is explicit that whether your results are
    successful will obviously be an open question — but a faster one: you will learn much more and
    much faster when the potential mistakes are your own rather than someone else's. The consequence
    for anyone quoting the seven elements as a specification is that they are reading the book
    against its own closing paragraph.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Printed p. 39 for the withdrawal and the open question; printed p. 22 for the know-the-rules
    precondition and the chef analogy.
  confounders:
    - "reading it as licence to ignore the criteria; the licence is scoped to a designer who knows them"
    - "assuming he claims rule-breaking produces better marks; he says the outcome is an open question"
    - "confusing this weakening of necessity with Chermayeff's denial of sufficiency at printed p. 145"

# ── BOUNDARIES, EXCEPTIONS AND FURTHER APPLICATION ───────────────────────────

- qa_id: qa_logo_0041
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 188, tip 19 'Reverse it'"
  question: >
    You supply a reversed version of a mark as Airey instructs, and it fails. What kind of mark
    fails, and does Airey give you a test for it?
  answer: >
    The kind that fails is a mark whose meaning lives in its own internal negative space, because
    inverting figure and ground can invert the reading. His own book is full of such marks — the
    Food Writers Guild nib containing a spoon, Ed's Electric where the white gaps between two black
    forms make the letters, the New Bedford Whaling Museum where the whale's fluke is white space
    between sails — and a naive reversal turns the negative shape into the positive one. He does NOT
    give you a test for it. Tip 19 states only that you should offer a version that works on dark
    backgrounds, glossed as supplying a version in white, with the stated reason being flexibility
    and the client appreciating you for it. It raises no possibility of failure at all. Worth adding:
    the mark printed on that very page, the "amp" wordmark, is shown in black on white, so the page
    does not demonstrate its own instruction. The best you can do with him is combine tip 19 with tip
    16's requirement that the elements inside the mark stay separable — which turns the reversal into
    a check rather than a deliverable.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    Printed p. 188. The page was rendered and inspected during extraction: the 'amp' mark is printed
    black on white and not reversed. The negative-space marks named are at printed pp. 7, 26 and 32,
    all rendered and inspected.
  confounders:
    - "assuming Airey addresses reversal failure; he does not raise it"
    - "treating the reversed version as automatic — a mechanical inversion is not what a designer would supply"
    - "confusing reversal with the one-colour reduction; a mark can survive one and fail the other"

- qa_id: qa_logo_0042
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 25, 'Make it relevant'; and printed p. 184, tip 11"
  question: >
    Airey teaches relevance almost entirely through negative examples. List the ones he gives, and
    say what kind of judgement they all are.
  answer: >
    From printed p. 25: drop the fun approach if you are designing for a lawyer; no beach balls for a
    winter-holiday television programme; a smiling face clearly will not work for a cancer
    organisation. From the chapter recap at printed p. 38: however much you might want to use a fun
    design that makes everyone smile, it is not ideal for the local crematorium. From tip 11 at
    printed p. 184: ditch the fun approach for a law firm; nothing too serious for a children's
    television programme; muted colours rather than bright fluorescents for a Michelin-starred
    restaurant. They are all the same kind of judgement — REGISTER violations, where the mark's tone
    is wrong for the category rather than its form being badly made. That is worth naming because it
    means the relevance requirement is not checkable the way his reproduction tests are: you can
    verify a one-inch reduction, and you cannot verify that a register is appropriate. It also means
    the examples are culturally bounded to Western commercial categories around 2010, which he does
    not say.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Printed p. 25, the recap at p. 38, and tip 11 at p. 184. All the examples are register
    judgements; none is a formal property of a mark.
  confounders:
    - "treating relevance as checkable in the way the reproduction tests are"
    - "reading the examples as being about subject matter rather than tone"
    - "assuming he flags the cultural boundedness; he does not"

- qa_id: qa_logo_0043
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 24, the NHS case, 'Keep it simple'"
  question: >
    Airey offers the NHS mark as evidence for simplicity. What does the designer actually give as his
    three reasons, and what does that do to the aesthetic reading of the case?
  answer: >
    Richard Moon's three stated reasons for keeping the design deliberately simple were: to make it
    easy to implement; to last as long as possible; and to avoid being attacked by the British media,
    which often view identity programmes of that kind as an extravagant use of public funds. Only the
    second is an aesthetic or design-longevity reason at all. The first is operational and the third
    is political — a simple mark is cheap-looking in the sense that matters when a newspaper is
    costing your identity programme. That complicates the case considerably as evidence for
    simplicity as a design virtue: the mark is simple partly for reasons that have nothing to do with
    how it is perceived by its audience. Airey's own framing around it is separate — the design going
    essentially unchanged for nearly twenty years is a testament to its success — which is a
    survivorship argument, using longevity as the evidence of quality and quality as the explanation
    of longevity.
  answer_type: source_position
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Printed p. 24, quoting Richard Moon of Moon Brand. The saving claim in the same passage — tens of
    millions of pounds by the NHS's own calculations — is an outcome asserted by a party to the
    project with no controls.
  confounders:
    - "reporting only the longevity reason and dropping the implementation and press reasons"
    - "reading the twenty-year survival as evidence that simplicity caused it"
    - "treating the NHS's own savings estimate as independent evidence"

- qa_id: qa_logo_0044
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 141, 'Swallow that pride'"
  question: >
    At the presentation itself, Airey says you are selling one thing and not another. What is the
    distinction, and what specific cost does he say you pay for getting it wrong?
  answer: >
    What you are selling at that stage is the IDEA behind your best designs — the story behind the
    concepts — and not the intricacies of the mark or the particular choice of typeface. He tells you
    to remind the client as often as necessary to focus on the idea alone, and says those minor
    details can be settled once a single direction has been agreed. The specific cost of getting it
    wrong is not vague dilution: you could end up supplying revisions on more than one direction,
    which is an unnecessary expense for both parties. That is the argument's strength — it gives the
    client a reason too, not just the designer. He follows it immediately with an honest admission
    that things do not always work out: of the sixty or seventy clients he had presented brand
    identity projects to, two or three of his earliest presentations were so unsuccessful that they
    stalled the process and both sides lost out.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed p. 141. The revisions-on-more-than-one-direction cost is his stated reason; the sixty to
    seventy client figure and the two or three failures are on the same page.
  confounders:
    - "reading it as advice to withhold detail from the client rather than to sequence the decisions"
    - "assuming the cost is aesthetic; the cost he names is duplicated revision work"
    - "confusing it with the ground-rules passage at printed pp. 129-130, which is about the boundary on feedback"

- qa_id: qa_logo_0045
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 155, 'Think laterally'"
  question: >
    You have produced twenty sketches for a wordmark and they all look like each other. Which of
    Airey's moves apply, and what account does he give of why you are stuck?
  answer: >
    His account of the problem is mechanical rather than mystical: the brain forms routine patterns,
    and the more often you perform the same task the more entrenched and natural the pattern becomes,
    so before you know it you are in a rut. Four moves follow. Turn your design concepts upside down.
    Look at them from a distance. Ask someone else to share some thoughts on your sketches. And the
    one from his own practice: sketch every idea that comes, then study those sketches WITH THE
    DESIGN BRIEF IN HAND, which he says produces further sketches that would not have come to mind
    without that analysis. Each works by presenting the same material under a condition the
    entrenched pattern does not cover — different orientation, different distance, different observer,
    or a re-reading against the brief. He frames all of it against the romantic view, quoting de Bono
    that creative thinking is a skill rather than a matter of individual talent, and not a matter of
    sitting by the river playing baroque music and hoping to be inspired.
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: >
    Printed p. 155. The pattern-formation account is asserted without evidence and the de Bono
    quotation is an appeal to authority.
  confounders:
    - "reaching for inspiration or reference-hunting, which is the approach the passage argues against"
    - "missing the brief-in-hand move, which is the only one specific to identity work"
    - "confusing the upside-down move here, which is for generating ideas, with tip 20, which is a finishing check"

- qa_id: qa_logo_0046
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 53-55, the FedEx renaming, 'Field research to the rescue'"
  question: >
    In Airey's FedEx account, research changed something bigger than the mark. What did the research
    find, what did it change, and what makes this his strongest example of research?
  answer: >
    A nine-month global study by the two organisations' research groups found that businesses and
    consumers were unaware of the company's global reach and full-service capabilities, believing it
    shipped only overnight and only within the United States. Further research on the name itself
    found that many people associated "federal" negatively with government and bureaucracy, and that
    "express" was over-used — more than 900 company names in the US alone employed it. On the
    positive side, people had already shortened the name into a generic verb ("I need to FedEx a
    package") regardless of which carrier they used, and testing with the target public confirmed
    that the short form conveyed more speed, technology and innovation than the formal name. What it
    changed was the name: Landor advised adopting "FedEx" as the communicative name while keeping
    "Federal Express Corporation" as the legal one. It is his strongest research example because it
    is the only place in the book where a finding contradicted the obvious move and the research
    output was a decision above the designer's own remit — with over 300 designs then created in the
    exploratory phase, ranging from evolutionary to revolutionary.
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Printed pp. 53-55. This is the only reported measurement in the extracted span; everything else
    in the book is practitioner assertion or narrated case.
  confounders:
    - "remembering the FedEx arrow, which Airey does not mention anywhere"
    - "assuming the research validated a design; it changed the name"
    - "treating the 300 explorations as a recommended concept count; his own guidance is two or three shown to the client"

- qa_id: qa_logo_0047
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 114-116, 'Where Photoshop comes into play'"
  question: >
    Airey requires concepts to be shown in context. What is his analogy, what is his stated reason,
    and what does he concede about what the practice is for?
  answer: >
    The analogy is a car: it might have a fresh paint job and that new-car smell, but unless you take
    a test drive you will not be entirely convinced. The stated reason is about the client's
    attention rather than the design's quality — most clients do not have the time to follow every
    step of the process and will be focused on the final result, so the more tangible your concepts
    appear, the more the client will be able to visualise the benefits. He also claims a variety
    effect: the greater the range of applications you create, the more consistent the use appears and
    the more attractive the result. What he concedes, and it is worth keeping, is the purpose:
    showing your logo designs in context may be what finally seals the deal with the client. That is
    a persuasion claim, not a decision-quality claim — and the obvious corollary he does not raise is
    that a well-made mock-up can make a weak mark look convincing too.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed pp. 114-116, including the test-drive analogy, the variety claim and the seals-the-deal
    concession. The Kerling mock-up pages were not rendered during extraction, so nothing is claimed
    here about what they show.
  confounders:
    - "reading it as improving the client's judgement; his stated function is helping them visualise and closing the sale"
    - "assuming he warns about flattering mock-ups; he does not"
    - "treating the tools named in the passage as part of the knowledge; they are 2010 tool recommendations"

- qa_id: qa_logo_0048
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 43-44, 'It's all in the design brief'"
  question: >
    Airey's argument for a written brief is not that it records requirements. What is it, and what
    does he explicitly say the brief does NOT let you do?
  answer: >
    It is that the brief settles disputes. He says pitfalls may arise along the way — your client may
    disagree with a decision you have taken — and it is at moments like that that you can return to
    the details of the brief to back up your position. What he explicitly says it does not let you do
    is refuse to change: that does not mean you will not make design changes as a result of a
    disagreement, since you want to please your client after all. The brief exists to provide BOTH
    parties with concrete reasons for the decisions taken throughout the process — so its function is
    to convert a clash of taste into a check against a shared prior commitment, not to give the
    designer a veto. He names a second function too: keeping his own work in bounds, admitting he has
    entertained some far-fetched ideas from time to time and that the brief helps keep relevance on
    course.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Printed pp. 43-44 for the arbitration function and the explicit qualification; printed p. 50 for
    the keeping-your-own-work-in-bounds function.
  confounders:
    - "reading the brief as a contract that lets the designer refuse changes, which he rules out in the next sentence"
    - "treating it as a requirements document, which is the function he does not emphasise"
    - "assuming it protects only the designer; he says it gives both parties concrete reasons"

- qa_id: qa_logo_0049
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 185, tip 13; printed p. 15, the Bethnal Green applications; printed p. 47"
  question: >
    A client will produce their own social posts, decks and signage using your mark. Using Airey,
    what do you deliver beyond the artwork, what failure are you preventing, and where does his own
    advice complicate the answer?
  answer: >
    You deliver a style guide. He says many logos are accompanied by style guides, that creating them
    is your responsibility, and that they exist so anyone within the client's company who uses the
    design does so consistently — and at printed p. 47 he frames the trigger as a briefing question,
    asking how many people are responsible for using the brand identity, which invites the follow-up
    conversation about guidelines and may lead you to offer a guide showing how to use, and how not
    to use, the design. The failure being prevented is stated as an extreme case: a low-resolution
    "save for web" logo file scaled up and used on the cover of a printed sales manual, which defeats
    the purpose of hiring a specialist. Where his own advice complicates it: at printed p. 15 the
    practice he praises is a mark used as a TEMPLATE and modified to suit any application — the same
    star engraved on glass and hand-drawn on screen-printed paper. Deliberate per-application
    variation and strict consistency are not the same instruction, and the book never says how much
    variation is still one mark, which is precisely what your guide has to decide.
  answer_type: application
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Printed p. 185 for the guide and the responsibility; printed p. 47 for the briefing question and
    the low-resolution failure; printed p. 15 for the template practice. He never reconciles the two.
  confounders:
    - "delivering artwork alone, which leaves the consistency requirement with no instrument"
    - "assuming consistency means one immutable lockup, which his own Bethnal Green case contradicts"
    - "treating the guide as optional; he assigns it to the designer as a responsibility"

- qa_id: qa_logo_0050
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 186, tip 14 'Match the type to the mark'; and printed p. 37, the French Property Exhibition typeface note"
  question: >
    Airey's only direct instruction about typeface selection is one line. What is it, and what does a
    designer on the facing side of the same book actually do?
  answer: >
    Tip 14: show a level of unity across your design — for example, if you show a playful mark, try
    matching it with a playful typeface. That is the whole of it: one example, one direction, no
    mechanism, and no treatment of the deliberate mismatch a designer might use for tension. What the
    designer of the French Property Exhibition mark actually says he did is different in kind: with
    three lines of text he chose regular, evenly weighted Avenir caps in order to keep the type flush
    with the lines of the mark. That is a proportion and alignment argument, not a register-matching
    one. Both are in the book and only the weaker of the two is elevated into a tip. The practical
    reading is that "match the type to the mark" underdetermines almost every real decision, and
    Airey's other constraint on lettering — tip 12's immediate-legibility gate — does more work.
  answer_type: source_position
  difficulty: medium
  knowledge_type: typography
  requires_application: false
  support: >
    Printed p. 186 for tip 14; printed p. 37 for Roy Smith's stated reasoning about Avenir caps. The
    two are different kinds of argument and the book does not connect them.
  confounders:
    - "elaborating tip 14 into a theory of type pairing; the book contains one sentence"
    - "assuming register-matching is his general position on type; the worked case reasons about alignment"
    - "confusing it with tip 12, which is a legibility gate rather than a matching rule"

- qa_id: qa_logo_0051
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 28, 'Incorporate tradition'; and printed p. 183, tip 8"
  question: >
    Airey rules against trends and then makes one concession that keeps the rule workable. State the
    rule, the standard it replaces, the concession, and the problem the rule cannot solve.
  answer: >
    The rule: leave trends to the fashion industry — trends come and go like the wind, and the last
    thing you want is to invest a significant amount of your time and your client's money in a design
    that will look dated overnight. The standard it replaces: longevity is key, and a logo should
    last the lifetime of the company it represents. The concession, without which the rule would
    forbid all change: the mark may be refined after a certain time to add some freshness, but the
    underlying idea must remain intact. The problem it cannot solve is telling a trend from a current
    convention while you are inside it. His own example of the error — the period in the nineties
    when Helvetica Neue seemed to be used on every new design — is identified only in retrospect,
    and the book offers no way to make that identification prospectively. The quoted designer's
    version, "I don't want to be in vogue, I want to set the standard and not follow others", is a
    statement of ambition, not a test.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Printed p. 28 for the rule, the standard and the refinement concession; printed p. 183 for tip 8;
    printed p. 73 for the Helvetica Neue observation; printed p. 29 for the Grear quotation.
  confounders:
    - "stating the rule without the refinement concession, which makes it unworkable"
    - "assuming he offers a way to identify a trend prospectively; his own example is retrospective"
    - "reading 'the underlying idea should remain intact' as forbidding visual change"

- qa_id: qa_logo_0052
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 25 and printed p. 180, tip 4, against printed pp. 10 and 21"
  question: >
    Airey's examples of marks that do not depict the business are BMW, Xerox, Virgin Atlantic, Tiger
    Woods and Hawaiian Airlines. Using something he says elsewhere in the same book, explain why that
    example set is weak support for a new brand, and what still survives of the claim.
  answer: >
    Every one of them is a large, long-established brand. At printed p. 10 he concedes the point
    himself, in a different context: for products and services with a strong brand identity it is the
    identity people often think of first rather than the product itself — but of course a huge
    marketing budget is needed to reach the recognition rates of organisations like those. So the
    examples show that a non-depicting mark can work AFTER decades of exposure, not that a new brand
    can carry one. The example set is survivorship-selected in the ordinary way — famous surviving
    marks chosen after the fact, with no unsuccessful non-depicting marks shown anywhere. What
    survives is the narrower and still useful claim: depiction is not a REQUIREMENT of relevance,
    which he demonstrates by separating the two ideas cleanly and by allowing a literal mark that
    does not overstate its idea. What does not survive is any inference about how a new brand with no
    recognition should choose.
  answer_type: source_position
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Printed p. 25 and tip 4 at printed p. 180 for the example set; printed p. 10 for the
    marketing-budget concession. Only Hawaiian Airlines is actually printed in the book; the rest are
    named in prose and the reader is asked to recall them.
  confounders:
    - "taking the example set as evidence for a start-up's choice"
    - "concluding depiction is therefore required for a new brand, which he never says"
    - "missing that four of the five marks are not reproduced in the book at all"

- qa_id: qa_logo_0053
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 22-24, 'Keep it simple'; and printed p. 8, Ch. 2 opening"
  question: >
    Airey's argument for simplicity rests on a memory claim and his argument for brand identity rests
    on a value claim. State each, and state what evidence he offers for either.
  answer: >
    The memory claim: it is much easier to remember a single detail than five — his illustration is
    the Mona Lisa, where the smile is recalled and the clothing, the hand position, the eye colour,
    the background and the artist are not, and he proposes a self-test, asking which you would draw
    more accurately, the McDonald's mark or the Mona Lisa. The value claim: people usually choose
    products based on their perceived value rather than their actual value — his illustration is a
    celebrity driving an Aston Martin rather than a Škoda, which he concedes is consistently rated
    car of the year in many European countries, offers much better mileage and is significantly
    cheaper, and is the logical choice, while the Aston Martin identity, evoking luxury and status,
    usually takes the sale. The evidence he offers for either is none. Both are stated as facts about
    how minds and markets work, with no citation, no measurement, and no reported result from the
    self-test he proposes. They are the two load-bearing premises of the book and both are assertions.
  answer_type: source_position
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: false
  support: >
    Printed p. 23 for the memory claim and the Mona Lisa test; printed p. 8 for the perceived-value
    claim and the Aston Martin comparison. Neither carries a citation anywhere in the book.
  confounders:
    - "treating the memory claim as drawing on cognitive research; he cites none"
    - "assuming the drawing test was actually run; it is proposed rhetorically and no result is reported"
    - "reading the perceived-value claim as a finding rather than as the premise the book is built on"

- qa_id: qa_logo_0054
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 30-31, 'Aim for distinction'; printed p. 34; printed p. 186; printed p. 188"
  question: >
    You are briefed to make a wordmark for a new prepaid-billing product with no existing recognition,
    to be used at favicon size, on a dark dashboard, in a one-colour invoice header, and on printed
    collateral. Which of Airey's requirements bind hardest here, and where does his advice stop being
    usable?
  answer: >
    Four bind hard and they compound. The dark dashboard and the one-colour header together mean the
    mark must be designed for the reduced case, not adapted to it: he requires a supplied one-colour
    version (tip 15) and a version that works on dark backgrounds (tip 19), and his generation
    argument at printed p. 30 says to work only in black and white anyway, because contrast puts the
    emphasis on the shape and colour is secondary to form. Favicon size is the extreme of his
    "think small" case — he names the favicon explicitly as the small end of the media range, and
    his one-inch rule with no loss of detail sets the floor. And because the brand is unknown, tip
    12's legibility gate applies at full strength by his own scoping — if most people cannot read it
    straight away, do not use it as a logo. Where his advice stops being usable: he gives no
    threshold for the dark-ground case beyond "clearly identified", no test for whether a mark
    survives reversal at all, nothing about screen rendering below one inch, and no way to
    administer the legibility gate — no population, no exposure time, no distance. Everything past
    those points is your judgement and must not be attributed to him.
  answer_type: application
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    Printed p. 30 (work in black; colour secondary to form), p. 34 (think small; favicon; one inch),
    p. 185 (legibility gate and its scoping clause), p. 186 (one-colour version), pp. 187-188
    (contrast; reverse it). The gaps named are gaps in the source, not omissions from the answer.
  confounders:
    - "importing a numeric contrast threshold from an accessibility standard and presenting it as Airey's"
    - "treating the dark-ground and one-colour requirements as delivery formats rather than as constraints on the design"
    - "dropping the legibility gate because the mark is a wordmark; the unknown-brand condition is exactly when he says it binds hardest"

- qa_id: qa_logo_0055
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 31, the NAAs mark; and printed p. 30, 'Aim for distinction'"
  question: >
    You have three candidate symbols and no way to test them on an audience. Using two checks Airey
    supplies that need neither a client nor a budget, how would you separate them, and what may you
    NOT report from the result?
  answer: >
    Two checks, both administered on the artwork and both free. The outline check: reduce each
    candidate to a filled silhouette and see whether the shape alone still gives it away — his stated
    strategy is to focus on a design that is recognisable, so recognisable in fact that only its
    shape or outline betrays it. The description check: try to describe each candidate in one short
    phrase, on his observation that distinctive marks are almost always simple enough to be described
    easily, demonstrated by his own one-clause description of the NAAs mark as an "open newspaper"
    symbol in the form of the letter A. A candidate that needs three clauses is carrying more than one
    idea, which is also what the "focus on one thing" rule forbids. What you may NOT report is a
    result as his. He gives no protocol for the outline check — no assessor, no comparison set, no
    pass mark — and the description claim runs only from distinctiveness to describability, hedged
    with "almost always", demonstrated once by an author who already knew what the mark meant. Any
    score you attach is yours.
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    Printed p. 30 for the outline standard and its restatement at p. 38; printed p. 31 for the
    describability observation and its single demonstration. Printed pp. 30-31 were rendered and
    inspected during extraction.
  confounders:
    - "reporting a numeric distinctiveness score as though it came from this source"
    - "using the description check on someone who has been told the intended meaning, which is his flawed demonstration condition"
    - "treating the silhouette check as the same as the small-size reduction; the two fail for different reasons"

- qa_id: qa_logo_0056
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed pp. 132-133, 'Keep the committee in question', the landscape gardening project"
  question: >
    A client's team already has a firm idea of the design they want and does not tell you. Airey lost
    a month to exactly this. What did he conclude he should have set up, and what does his account
    reveal about why they stayed quiet?
  answer: >
    He concluded he should have set the ground rules at the start, and he scripts what he should have
    said: with your help, we will create a number of possible design directions that suit your
    prospective customers perfectly; once the different ideas have been presented, we can choose the
    most effective option and either move ahead with it or adjust it slightly after your feedback.
    He adds a second, blunter omission — he should also have asked at the initial meeting whether the
    client had any preconceived design ideas, and did not. What his account reveals about the silence
    is the useful part and is not what you would guess: they were not being obstructive. They stayed
    quiet because they considered the possibility that he might create a design they liked even
    better, so they decided to keep it to themselves. The cost was a month of research, brainstorming,
    sketching and conceptualising that did not matter to them, because by then the committee members
    had already attached themselves to their own original idea.
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: >
    Printed pp. 132-133. One narrated project told by the person it happened to, with no control; the
    reason for the silence is his reconstruction of their reasoning.
  confounders:
    - "assuming the client was acting in bad faith; his account says the opposite"
    - "concluding the fix is a stricter contract rather than a question asked at the first meeting"
    - "reading it as an argument against committee involvement; he argues elsewhere that committee input made a project stronger"

- qa_id: qa_logo_0057
  source_id: airey-logo-design-love
  source_title: "David Airey, Logo Design Love: A Guide to Creating Iconic Brand Identities (New Riders, 2010)"
  source_locator: "printed p. 187, tips 16 and 18; printed p. 190, tip 22"
  question: >
    Three of Airey's checks are about physical output rather than about the design. Identify them,
    and say why it matters that they are kept in his frame rather than translated into a digital one.
  answer: >
    Printing the mark replicated across a range of sizes and colours on one sheet and inspecting the
    paper for cleanliness, contrast and pixelation (tip 18). Watching the contrast between the mark
    and its background and between its own elements when the mark is applied to promotional material
    and corporate stationery (tip 16). And discussing the substrate with the commercial printer before
    final production, because the paper or card can drastically change the mark's colour and sharpness
    (tip 22). It matters because each is defined on ink and stock and each has failure modes that do
    not exist elsewhere: dot gain, absorbency, sharpness loss on uncoated board. Rendering an on-screen
    contact sheet is a DIFFERENT act, and the source does not endorse it as a substitute — treating it
    as one would silently convert a press check into something it is not, and would attribute to Airey
    a claim about a pipeline he never discusses. The transferable content of all three is the ordering
    and the fact that the check exists, not the tolerances, of which he gives none.
  answer_type: application
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: true
  support: >
    Printed p. 187 (tips 16 and 18) and printed p. 190 (tip 22). All three are stated as physical
    acts and none carries a numeric criterion.
  confounders:
    - "restating tip 18 as an on-screen size check, which loses the paper-specific failure modes"
    - "assuming tip 16 is a design-stage rule; he scopes it to when the mark is applied to material"
    - "inventing tolerances for any of the three; the source supplies none"
