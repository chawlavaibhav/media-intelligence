- {from: t_logo_0026, to: t_logo_0029, relation: distinct_from, confidence_basis: extractor_judgement, note: "CHECKED AND REJECTED as the same act. One is a design-stage reduction check the designer performs on the artwork; the other is a physical print check on paper output. Only the second is physical_production, and conflating them would licence rewriting a press check as a rendering instruction."}
