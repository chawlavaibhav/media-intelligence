- {from: t_logo_0029, to: t_logo_0030, relation: related_to, confidence_basis: extractor_judgement, note: "both are physical print-stage checks and both are physical_production"}
- {from: t_logo_0031, to: t_logo_0011, relation: related_to, confidence_basis: extractor_judgement, note: "remedy and property"}
- {from: t_logo_0036, to: t_logo_0020, relation: related_to, confidence_basis: extractor_judgement, note: "remedy and problem; the legal characterisation is second-hand and unscoped, see the caveat on sk_logo_0031"}
- {from: t_logo_0039, to: t_logo_0040, relation: narrower_than, confidence_basis: extractor_judgement, note: "the source states the containment: a logo is one part of a brand identity"}
- {from: t_logo_0040, to: t_logo_0041, relation: narrower_than, confidence_basis: extractor_judgement, note: "the source states the containment: the brand as a whole represents much more"}
- {from: t_logo_0042, to: t_logo_0039, relation: narrower_than, confidence_basis: extractor_judgement, note: "a wordmark is one kind of logo; the source's decision is whether a symbol is added to it"}
- {from: t_logo_0043, to: t_logo_0045, relation: related_to, confidence_basis: extractor_judgement, note: "the brief is what the designer returns to when the committee's feedback exceeds the agreed strategy"}
- {from: t_logo_0007, to: t_logo_0006, relation: uncertain, confidence_basis: extractor_judgement, note: "RECORDED AS UNRESOLVED. Appropriateness argues for including what the category needs; the one-feature rule argues for excluding everything but one thing. The source rules once, in one direction, on one project (printed 37) and never states a general precedence. We do not supply one."}

