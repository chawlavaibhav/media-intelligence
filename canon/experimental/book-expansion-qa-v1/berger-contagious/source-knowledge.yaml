- sk_id: sk_ctg_0008
  source_id: berger-contagious
  source_terms:
    - "Social Currency"
    - "Triggers"
    - "Emotion"
    - "Public"
    - "Practical Value"
    - "Stories"
    - "Six key STEPPS"
    - "We share things that make us look good"
    - "Top of mind, tip of tongue"
    - "When we care, we share"
    - "Built to show, built to grow"
    - "News you can use"
    - "Information travels under the guise of idle chatter"
  concept_label: the_six_named_drivers_of_transmission
  label_origin: source_verbatim
  claim: >
    The source names six drivers of transmission, in his own terms, and gives each a one-line
    summary and a diagnostic question. Social Currency — does talking about this make people look
    good. Triggers — what cues in the environment will make people think of it. Emotion — does
    talking about it generate feeling. Public — can people see when others are using it. Practical
    Value — does talking about it help people help others. Stories — is it embedded in a narrative
    people want to tell, and is that narrative valuable as well as viral. He orders them to spell
    the acronym STEPPS and says plainly that the ordering is a memory aid.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Each driver names a distinct reason a person would pass something on: to look good, because
      something reminded them, because they were activated, because they could see others doing it,
      because it helps the receiver, and because it rides inside a narrative they wanted to tell
      anyway.
  scope:
    domain_discussed_by_source: [social_transmission, product_marketing, public_health_communication, political_communication]
    conditions: "content, meaning stories, news, information, products, ideas, messages and videos"
  caveats:
    - text: >
        The acronym is presentational. The source says he hopes ordering the principles this way
        will make them easier to remember and use; he does not claim the order is a priority order,
        a sequence, or a causal chain.
      origin: source_stated
    - text: >
        The six were derived by the author and collaborators noticing common themes across
        contagious content, which is an inductive procedure over cases. The source does not claim
        the set is exhaustive and offers no test that would show a seventh driver is missing.
      origin: extractor_observed
    - text: >
        The drivers are not measured on a common scale anywhere in the book, so 'more of the six is
        better' has no stated unit.
      origin: extractor_observed
  source_stated_problems:
    - "why do some products, ideas, and behaviors succeed when others fail?"
  source_stated_remedies:
    - "enhancing these components in messages, products, or ideas will make them more likely to spread"
