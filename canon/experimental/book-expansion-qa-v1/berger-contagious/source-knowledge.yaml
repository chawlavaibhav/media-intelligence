- sk_id: sk_ctg_0040
  source_id: berger-contagious
  source_terms:
    - "if you want to get people not to do something, don't tell them that lots of their peers are doing it"
    - "rather than making the private public, preventing a behavior requires the opposite: making the public private"
    - "the messages actually seemed to increase drug use"
  concept_label: publicising_an_undesired_behaviour_increases_it_and_the_public_lever_reverses
  label_origin: extractor_assigned
  claim: >
    The chapter's own disconfirmation, and the most valuable claim in it: the Public driver is
    signed, and applying it to a behaviour you want to stop makes the behaviour more common. An
    anti-drug advertisement says two things at once — drugs are bad, and other people are taking
    them — and the second is the one that transmits. The source reports third-party evidence that
    the campaigns not only failed but backfired, and states the reversal as a rule: preventing a
    behaviour requires making the public private, and where the wrong behaviour must be discussed,
    the message should state what people should do rather than reporting what they are doing.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Social proof does not distinguish approval from prevalence. Telling an audience that many
      peers do something supplies exactly the evidence that makes it seem normal, and the
      disapproval attached to the message does not undo it. The source adds a second route: the
      existence of a campaign is itself evidence of prevalence — nobody makes announcements about
      not cutting off your hand with a saw.
  scope:
    domain_discussed_by_source: [public_health_communication, anti_drug_campaigns, conservation, copyright_enforcement]
    conditions: "any campaign aimed at reducing a behaviour by describing how widespread it is"
  caveats:
    - text: >
        NOT Berger's research. The anti-drug finding is communications professor Bob Hornik's,
        published as Hornik, Jacobsohn, Orwin, Piesse and Kalton (2008) in the American Journal of
        Public Health. Design as described: data collected on thousands of teenagers over the period
        the National Youth Anti-Drug Media Campaign ran, recording exposure to the advertisements and
        marijuana use. The reported result — that twelve-and-a-half to eighteen-year-olds who saw
        the advertisements were MORE likely to smoke marijuana — is his, as is the quoted hypothesis
        about perceived prevalence.
      origin: extractor_observed
    - text: >
        The Hornik study is observational, and exposure was not assigned. Berger reports the causal
        reading without noting this.
      origin: extractor_observed
    - text: >
        The Petrified Forest evidence is also NOT Berger's: Bob Cialdini and colleagues (2006). It
        IS a genuine field comparison — different signs on different trails — and the reported
        result is that a sign describing how many past visitors had removed wood almost DOUBLED
        theft, while a sign asking visitors not to remove wood in order to preserve the park reduced
        it. That contrast between describing behaviour and prescribing it is the operative finding.
      origin: extractor_observed
    - text: >
        The RIAA illustration — a website citing that only 37 percent of music was paid for and 30
        billion songs illegally downloaded — is the author's reasoning about a message he expects to
        backfire, not a measured case. He says himself he is 'not sure' the message has the desired
        effect.
      origin: source_stated
    - text: >
        Note the tension inside the chapter that the source never resolves. The Arizona drinking
        campaign worked by PUBLICISING the true norm; the anti-drug campaigns failed by publicising
        prevalence. The distinguishing variable — whether the true norm favours the desired
        behaviour — is visible in the two cases but never stated as the rule.
      origin: extractor_observed
  source_stated_problems:
    - "making things more public can have unintended consequences when not applied carefully"
    - "even in cases where most people are doing the right thing, talking about the minority who are doing the wrong thing can encourage people to give in to temptation"
  source_stated_remedies:
