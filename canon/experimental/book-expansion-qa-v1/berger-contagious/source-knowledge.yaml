- sk_id: sk_ctg_0001
  source_id: berger-contagious
  source_terms:
    - "only 7 percent of word of mouth happens online"
    - "we also tend to overestimate online word of mouth because it's easier to see"
  concept_label: word_of_mouth_is_overwhelmingly_offline_and_systematically_misestimated
  label_origin: extractor_assigned
  claim: >
    Most word of mouth happens face to face, not online, and practitioners get this badly wrong in a
    predictable direction. The source reports a figure of 7 percent of word of mouth occurring
    online, against a typical estimate of around 50 percent. He gives two reasons for the
    overestimate: people spend roughly eight times as long offline as online, which creates far more
    occasions for offline conversation; and online conversation leaves a visible record while
    offline conversation leaves none, so the visible channel is mistaken for the large one. He also
    disputes the assumption that online reach is larger in practice — potential reach is larger, but
    most recipients never see a given message.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Availability of evidence, not size of effect, drives the estimate. Online talk is recorded and
      countable; offline talk is not, so it is undercounted by exactly the amount that is invisible.
  scope:
    domain_discussed_by_source: [word_of_mouth_marketing, social_transmission]
    conditions: "consumer word of mouth in the United States, in the platform environment of roughly 2011-2012"
  caveats:
    - text: >
        The 7 percent figure is not Berger's measurement. He attributes it to research by the Keller
        Fay Group, and his Notes point to Ed Keller and Brad Fay's book The Face-to-Face Book (2012)
        rather than to a study design. No sampling frame, definition of a word-of-mouth episode, or
        interval is given in the text, so the figure cannot be evaluated from this source.
      origin: extractor_observed
    - text: >
        The counter-estimate of about 50 percent IS Berger's own reported measurement, but it is an
        informal classroom poll of "hundreds of students and executives", not a study. It has no
        control, no sampling frame and no reported dispersion. It is recorded as his own because it
        is, and its informality is recorded here because that matters more than the number.
      origin: extractor_observed
    - text: >
        Strongly period-bound. The claim describes a specific media environment and the source does
        not claim the ratio is stable over time.
      origin: extractor_observed
    - text: >
        The source's own endnote adds a qualification the body text omits: which channel is better
        depends on where the desired action happens. Online word of mouth suits an action that is a
        click away; an in-store purchase may be better served by offline word of mouth.
      origin: source_stated
  source_stated_problems:
    - "people tend to ignore the importance of offline word of mouth"
  source_stated_remedies:
    - "harnessing the power of word of mouth, online or offline, requires understanding why people talk"
  examples:
    positive:
      - {description: "the author's own pop quiz: audiences average about 50 percent when the figure claimed is 7 percent", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: qualifies, target: sk_ctg_0002, note: "both attack the same assumption that social platforms are where transmission happens"}
  evidence:
    characteristics: [explicitly_stated, argued, empirical_within_source, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
