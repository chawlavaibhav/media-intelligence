    inspected: {text: true, figures: []}

- sk_id: sk_ctg_0002
  source_id: berger-contagious
  source_terms:
    - "Facebook and Twitter are technologies, not strategies"
    - "you have to look at both successes and failures"
  concept_label: publishing_is_not_transmission_and_viral_theories_built_on_hits_are_invalid
  label_origin: extractor_assigned
  claim: >
    Putting content on a platform does nothing on its own; word-of-mouth marketing works only if
    people actually talk. The source supports this with base rates — half of YouTube videos have
    fewer than five hundred views and only one-third of one percent exceed a million — and then
    makes a methodological point about how theories of virality are built. Because the popular
    theories are induced from a handful of hits, they identify features (humour, cuteness) that are
    equally present in the enormous population of content that failed. Explaining virality requires
    examining successes and failures together and asking whether a characteristic is more often than
    not linked to success.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Selecting cases on the outcome removes the comparison that would make the inference possible.
      The source's illustration: Bill Clinton, Bill Gates and Bill Cosby are all famous, and the
      conclusion that changing your name to Bill produces fame is patently ludicrous — the initial
      observation is correct and the inference is not.
  scope:
    domain_discussed_by_source: [word_of_mouth_marketing, online_content, research_method]
    conditions: "any attempt to infer what makes content spread from examples of content that spread"
  caveats:
    - text: >
        The base-rate figures are cited to a Business Insider article, not to a study Berger
        conducted, and refer to YouTube in roughly 2009.
      origin: extractor_observed
    - text: >
        The source states the correct method but does not, here, show that his own studies satisfy
        it. The claim that they do has to be checked study by study, and where they do — the
        BzzAgent and New York Times datasets are whole populations rather than hit lists — that is
        recorded on the objects concerned.
      origin: extractor_observed
    - text: >
        Sharply period-bound: 'social media' here means the 2011-2012 configuration of Facebook,
        Twitter and YouTube.
      origin: extractor_observed
  source_stated_problems:
    - "just putting up a Facebook page or tweeting doesn't mean anyone will notice or spread the word"
    - "by merely looking at a handful of viral hits, people miss the fact that many of those features also exist in content that failed"
  source_stated_remedies:
    - "to fully understand what causes people to share things, you have to look at both successes and failures"
  examples:
    positive:
      - {description: "public health officials can tweet daily bulletins about safe sex, but if no one passes them along the campaign fails", figure_ref: null}
    counter:
      - {description: "the inference that humour or cuteness causes virality, drawn only from popular cat and baby videos", figure_ref: null}
  intra_source_relations:
    - {relation: qualifies, target: sk_ctg_0001, note: "same target: the assumption that platforms are where transmission lives"}
    - {relation: depends_on, target: sk_ctg_0003, note: "if the messenger were the driver, message-level theories would not be the right unit"}
