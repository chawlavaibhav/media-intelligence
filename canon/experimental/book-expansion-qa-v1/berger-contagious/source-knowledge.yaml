- sk_id: sk_ctg_0053
  source_id: berger-contagious
  source_terms:
    - "virality is most valuable when the brand or product benefit is integral to the story"
    - "woven so deeply into the narrative that people can't tell the story without mentioning it"
  concept_label: the_message_must_be_structurally_inseparable_from_the_narrative
  label_origin: extractor_assigned
  claim: >
    The source's constructive rule, and the sharpest usable test in the book: the thing you want
    transmitted must be load-bearing in the story, such that removing it makes the story
    unretellable or unfunny. He applies the test destructively to his own favourite example — the
    Egyptian Panda cheese advertisements would be exactly as funny with a chicken suit and a used-car
    tagline, which shows the humour is not what does the work — and then shows the brand passes
    anyway, because the story cannot be told or understood without the panda. He applies it to
    Blendtec: it is impossible to tell the story of the clip that destroys an iPhone without saying
    that a blender did it, and without conveying that the blender is extraordinarily strong, which
    is exactly what the company wanted communicated.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      His analogy is a detective story, where some details are critical to the plot and some are
      extraneous. Critical details survive retelling because the story stops working without them.
      A brand made critical is therefore carried by the same process that discards a brand made
      decorative.
  scope:
    domain_discussed_by_source: [advertising, branded_content, campaign_design]
    conditions: "content designed to be retold rather than merely viewed"
  caveats:
    - text: >
        The test is offered without measurement. The Panda and Blendtec cases are analysed by the
        author, and the claim that audiences remember the brand 'days or even weeks later' is
        asserted rather than measured.
      origin: extractor_observed
    - text: >
        The test as stated is binary and the source gives no way to grade partial integration,
        which is what most real campaigns would produce.
      origin: extractor_observed
    - text: >
        The source's own counterfactual — that the Panda advertisement would be equally funny with a
        chicken and a used-car dealer — is unusually rigorous for this book, because it isolates the
        variable he cares about by holding the entertainment constant. It is an argument, not an
        experiment, but it is the right shape of one.
      origin: extractor_observed
  source_stated_problems:
    - "if people don't connect the content back to you, it's not going to help you very much. Even if it goes viral."
  source_stated_remedies:
    - "make sure the information you want people to remember and transmit is critical to the narrative"
  examples:
