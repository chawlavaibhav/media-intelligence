- sk_id: sk_ctg_0007
  source_id: berger-contagious
  source_terms:
    - "not all six ingredients are required to make a product or idea contagious"
    - "think of these principles less like a recipe and more like tasty salad toppings"
    - "the principles are relatively independent, so you can pick and choose whichever ones you want to apply"
    - "No one of the STEPPS is most important, but certain ones are definitely easier to apply in certain situations"
  concept_label: the_six_drivers_are_a_menu_of_relatively_independent_levers_not_a_recipe
  label_origin: extractor_assigned
  claim: >
    On what the six drivers are to each other, the source's actual position is a menu, not a
    conjunction and not a ranking. He states that not all six are required; that a product which is
    Public will not fail because it is not wrapped in a Story; that the principles are relatively
    independent and can be picked and chosen; that more is better; and, in the back-matter
    interview, that no one of them is most important. He also states that some are easier to apply
    to some categories than others — Emotion for nonprofits, Public for things with a physical
    component — and adds that the payoff lies in attempting the harder ones rather than only the
    easy ones. He explicitly disowns the recipe analogy at the point where it would imply
    joint necessity.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [framework_application]
    conditions: "applying the six-driver framework to any product, idea or behaviour"
  caveats:
    - text: >
        The independence claim is asserted, not tested. Nowhere does the source report a study in
        which the six drivers were measured together and found to contribute separably, and several
        of his own analyses cut across them — the New York Times study scored interest, usefulness
        and awe on the same articles and found all three predictive, which is consistent with
        independence but does not establish it.
      origin: extractor_observed
    - text: >
        The book's own summary language OVERCLAIMS relative to this footnote. The Epilogue says
        'there is a recipe for success' and closes 'if you follow these six key STEPPS, you can make
        any product or idea contagious', which reads as a sufficiency claim the footnote denies. The
        Epilogue's own hedge, 'or even just a few of them', sits two paragraphs away. This
        extraction takes the footnote and the interview as the source's position, and records the
        summary language as the source overstating itself.
      origin: extractor_observed
    - text: >
        The 'no one is most important' formulation comes from 'A Conversation with Jonah Berger',
        publisher back matter in the Simon & Schuster Readers Group Guide, not from the main text.
        It is consistent with the Introduction footnote and is cited as corroboration of it, not as
        an independent claim.
      origin: extractor_observed
    - text: >
        The source distinguishes independence from equal ease. Ease of application varies by
        category, and he warns against applying only the easy ones.
      origin: source_stated
  source_stated_problems:
    - "some of the principles are easier to apply to certain types of ideas or initiatives"
  source_stated_remedies:
    - "trying to incorporate the more difficult ones will really boost their impact"
  examples:
