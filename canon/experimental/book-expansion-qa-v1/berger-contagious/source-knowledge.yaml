- sk_id: sk_ctg_0006
  source_id: berger-contagious
  source_terms:
    - "when I say that doing X will make an idea more viral, I mean that it will be more likely to spread from one person to another"
    - "such long chains, however, may be less common with products and ideas"
  concept_label: viral_is_scoped_to_pairwise_transmission_likelihood_not_to_long_chains
  label_origin: extractor_assigned
  claim: >
    The source explicitly narrows what he means by "viral". He uses it to mean more likely to spread
    from one person to another, and expressly not to mean that one person generates a long
    transmission chain that infects a population. He states that the disease analogy holds only up
    to a point, that the key difference is the expected length of the transmission chain, and that
    long chains may be less common for products and ideas than the analogy implies.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [social_transmission, diffusion]
    conditions: "every use of the word 'viral' in this book"
  caveats:
    - text: >
        This is the book's most important self-limitation and it is placed in a footnote to the
        Introduction, where it is easy to miss. Read against it, the book's repeated promise to make
        things 'go viral' means only 'raise the pairwise probability of a pass-on'.
      origin: extractor_observed
    - text: >
        The evidence for short chains is third-party and appears only as a parenthetical citation:
        Goel, Watts and Goldstein (2012), 'The Structure of Online Diffusion Networks'.
      origin: extractor_observed
    - text: >
        The source hedges the empirical part: long chains 'may be less common' and the likelihood
        that one person generates one 'may be small'. He does not claim to have established this.
      origin: source_stated
