- sk_id: sk_ctg_0054
  source_id: berger-contagious
  source_terms:
    - "around 70 percent of the story details were lost in the first five to six transmissions"
    - "the stories didn't just become shorter: they were also sharpened around the main point or key details"
    - "critical details stick around, while irrelevant ones drop out"
  concept_label: transmission_strips_most_detail_and_sharpens_what_remains_around_the_critical_point
  label_origin: extractor_assigned
  claim: >
    The source reports the empirical basis for the whole valuable-virality argument: what survives
    retelling is not random. In a chained Telephone procedure, roughly 70 percent of a story's
    details were lost within the first five or six transmissions, and the loss was structured —
    across many chains the same details were consistently dropped and the same details consistently
    retained, with the account sharpening around the central event. The implication he draws is a
    design constraint: whatever must survive has to be one of the details the story cannot do
    without.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Retellers reconstruct rather than reproduce, and reconstruct around what makes the story a
      story. Peripheral setting details serve no narrative function and are dropped; the central
      conflict is what the story is for and is kept.
  scope:
    domain_discussed_by_source: [rumour, oral_transmission, storytelling]
    conditions: "serial retelling from person to person without access to the original"
  caveats:
    - text: >
        NOT Berger's research, and it is old. The study is Gordon Allport and Joseph Postman's,
        published in The Psychology of Rumor (1947). Design as described: one person views a
        detailed picture of an argument on a subway car — an Eighth Avenue Express passing Dyckman
        Street, five seated passengers including a rabbi and a mother with a baby, two men standing
        with one pointing and holding a knife — and describes it to a second person who cannot see
        it; that person then describes it to a third, and so on to a sixth, across dozens of chains.
        The 70 percent figure and the sharpening pattern are theirs.
      origin: extractor_observed
    - text: >
        The stimulus is a picture, not an experience, and the transmission is a laboratory chain,
        not conversation. Whether the same rates hold for stories people actually want to tell is
        not established here.
      origin: extractor_observed
    - text: >
        The original study is also known for a finding about which details were altered along racial
        lines, which the source does not mention. This extraction records the omission without
        drawing a conclusion from it.
      origin: extractor_observed
    - text: >
        This finding is in tension with the source's own chapter 1 claim that stories become MORE
        remarkable as they travel. Detail loss and detail amplification may both be true of
        different features, but the source never states the reconciliation.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "make sure your desired information is so embedded into the plot that people can't tell the story without it"
  examples:
    positive:
      - {description: "the subway picture, retold down to two men arguing and a knife, with the line and the street dropped", figure_ref: null}
    counter: []
