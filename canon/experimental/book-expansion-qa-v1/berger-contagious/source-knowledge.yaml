- sk_id: sk_ctg_0052
  source_id: berger-contagious
  source_terms:
    - "there's a big difference between people talking about content and people talking about the company, organization, or person that created that content"
    - "it's like building a magnificent Trojan Horse but forgetting to put anything inside"
    - "not just virality but valuable virality"
  concept_label: transmission_without_relevance_to_the_sponsor_produces_no_benefit
  label_origin: extractor_assigned
  claim: >
    The source's clearest failure condition, and the one that separates his position from ordinary
    virality advice: content can be enormously transmitted and produce no benefit whatever for whoever
    paid for it, because what spreads is the content and not the sponsor. His two cases are chosen to
    make the point unmissable. A stunt at the 2004 Olympics carried an online casino's name and was
    discussed worldwide; the discussion was about Olympic security, the disrupted Chinese divers and
    the perpetrator's trial, and the casino dropped out because it was irrelevant to every version of
    the story. Evian's "Roller Babies" reached more than 50 million views and was declared the most
    viewed online advertisement in history; the same year Evian lost market share and sales fell
    almost 25 percent. He names the diagnosis directly: people focus so much on getting people to
    talk that they ignore what people are talking about.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Retelling keeps what the story needs and drops what it does not. A sponsor attached to a story
      but not required by it is an extraneous detail, so it is either forgotten or omitted because
      including it does not make the story better.
  scope:
    domain_discussed_by_source: [advertising, guerrilla_marketing, branded_content]
    conditions: "content produced or sponsored by an organisation that wants to benefit from its spread"
  caveats:
    - text: >
        Both cases are recounted with third-party outcome figures and neither is a controlled test.
        The Evian sales decline is reported from an Adweek piece and is not attributed by anyone to
        the campaign; a year of falling sales has many possible causes, and the source's placement of
        the two facts side by side implies more than the evidence carries.
      origin: extractor_observed
    - text: >
        The claim that the casino was irrelevant is inferred from what commentators discussed, not
        from any measurement of brand recall.
      origin: extractor_observed
    - text: >
        The underlying research is Berger's own but is cited only in the Notes as a Wharton working
        paper by Ezgi Akpinar and Jonah Berger titled 'Valuable Virality' (2012). Its design is not
        described anywhere in the text, so the reader is given the conclusion without the study.
      origin: extractor_observed
    - text: >
        The source's own definition of viral in the Introduction — raised likelihood of a pairwise
        pass-on, not long chains — makes this failure mode structurally predictable rather than
        surprising, but the book does not connect the footnote to this chapter.
      origin: extractor_observed
  source_stated_problems:
    - "they focus so much on getting people to talk that they ignore the part that really matters: what people are talking about"
    - "the stunt had nothing to do with the product it was trying to promote"
  source_stated_remedies:
