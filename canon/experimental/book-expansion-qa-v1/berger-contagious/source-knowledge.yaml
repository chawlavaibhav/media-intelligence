  label_origin: extractor_assigned
  claim: >
    The source states the failure mode of his own driver: practical value selects for perceived
    usefulness, not for truth, so a false claim that seems useful spreads by the same mechanism and
    at the same speed. His case is the 1998 paper linking the measles, mumps and rubella vaccine to
    autism — subsequently found fraudulent, its author found guilty of serious professional
    misconduct and struck off — which spread widely and depressed vaccination rates. He notes the
