  claim: >
    The source reports his own administration of a scenario pair that separates felt value from
    actual price. One hundred people saw a barbecue grill reduced from $350 to $250 and another
    hundred saw the same grill reduced from $255 to $240; 75 percent of the first group said they
    would buy rather than keep looking, against 22 percent of the second — even though the second
    group would have paid ten dollars less. He explains this by prospect theory's reference point:
