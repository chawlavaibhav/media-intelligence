    to dispute — the listener cannot easily tell the teller their experience did not occur. Second,
    following a narrative consumes the cognitive resources that would otherwise be spent
    disagreeing. He adds a third function that is epistemic rather than rhetorical: a story provides
    proof by analogy, evidence that something happened to someone like the listener, which is
    weaker than a guarantee and stronger than a claim. He frames all of this against the alternatives
    — trial and error is expensive, direct observation is impractical, and advertising is
    discounted — so stories are how cultural knowledge is actually acquired.
