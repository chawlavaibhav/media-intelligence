      - {description: "the Panda advertisements, where the story cannot be told or understood without the panda", figure_ref: null}
      - {description: "'Will It Blend?', which cannot be recounted without naming a blender and conveying its strength", figure_ref: null}
    counter:
      - {description: "a funny animal-suit advertisement that would work identically for any product", figure_ref: null}
  intra_source_relations:
