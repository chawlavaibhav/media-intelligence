- sk_id: sk_ctg_0003
  source_id: berger-contagious
  source_terms:
    - "by focusing so much on the messenger, we've neglected a much more obvious driver of sharing: the message"
    - "social epidemics are driven by the products and ideas themselves"
  concept_label: transmission_is_driven_by_the_message_not_by_influential_messengers
  label_origin: extractor_assigned
  claim: >
    The source rejects the influentials thesis: the conventional view that social epidemics are
    driven by a small number of exceptionally persuasive or well-connected people. He concedes that
    some people are more persuasive and some have more friends, but says that in most cases this
    does not make them more influential in spreading information. His alternative unit of analysis
    is the message. His analogy is jokes — some jokes are funny enough that the room laughs
    regardless of who tells them — and his conclusion is that contagious content spreads regardless
    of whether the messenger is persuasive or has ten friends or ten thousand.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A social epidemic requires hundreds or thousands of ordinary people to pass something on, so
      the properties that determine whether an ordinary person passes it on dominate the outcome. He
      borrows Duncan Watts's forest-fire comparison: big forest fires are not caused by big sparks,
      and no one would claim the size of a fire depends on the exceptional nature of the initial
      spark.
  scope:
    domain_discussed_by_source: [social_transmission, diffusion, word_of_mouth_marketing]
    conditions: "diffusion of products, ideas and behaviours through ordinary social networks"
  caveats:
    - text: >
        The forest-fire comparison is Duncan Watts's, not Berger's; the source names him. It is an
        analogy offered in support, not a measurement.
      origin: extractor_observed
    - text: >
        The empirical support cited against the influentials thesis is third-party — Bakshy, Hofman,
        Mason and Watts's Twitter influence study (2011) and Watts and Dodds (2007) — and appears
        only in the Notes, not in the body text.
      origin: extractor_observed
    - text: >
        The source HEDGES this more than the body text suggests. His endnote reads that "right now
        there is little good empirical evidence" that people with more social ties or greater
        persuasiveness have a bigger impact. That is an absence-of-evidence statement, not a
        demonstration that messengers do not matter, and the body text's flat "conventional wisdom
        is wrong" is stronger than the endnote supports.
      origin: source_stated
    - text: >
        The source does not deny that individuals provide an initial spark — he names Tippi Hedren
        and George Wright as sparks — only that the spark's exceptional qualities explain the size of
        the result.
      origin: source_stated
  source_stated_problems:
    - "marketers spend millions of dollars trying to find these so-called opinion leaders"
  source_stated_remedies:
    - "focus on the message rather than the messenger"
  examples:
    positive:
      - {description: "jokes funny enough that everyone laughs even when the teller is not funny", figure_ref: null}
      - {description: "Vietnamese nail salons spreading through thousands of ordinary immigrants rather than through Tippi Hedren alone", figure_ref: null}
    counter:
      - {description: "Gladwell's mavens, connectors and salesmen; the claim that one in ten Americans tells the other nine what to buy", figure_ref: null}
  intra_source_relations:
    - {relation: generalises, target: sk_ctg_0005, note: "if the message is the driver, then the message can be engineered"}
  evidence:
    characteristics: [explicitly_stated, argued, historical_claim]
    source_uncertainty: source_hedges
    extraction_uncertainty: none
  provenance:
    chapter: "Introduction — Why Things Catch On; Epilogue"
    section: "Generating Word of Mouth; Epilogue second point"
    locator: "Introduction, section 'Generating Word of Mouth' and its endnote 'making things go viral'; restated in the Epilogue's second point with the forest-fire comparison (spine 5, spine 12, spine 17)"
    page_start: null
    page_end: null
    figure_refs: []
    source_support: text
    inspected: {text: true, figures: []}

- sk_id: sk_ctg_0004
  source_id: berger-contagious
  source_terms:
    - "word of mouth is at least ten times more effective"
    - "word of mouth, on the other hand, is naturally directed toward an interested audience"
  concept_label: word_of_mouth_outperforms_advertising_through_credibility_and_self_targeting
  label_origin: extractor_assigned
  claim: >
    The source gives two reasons word of mouth outperforms advertising. First, credibility:
    advertising will always argue its product is best, so it is discounted, whereas a friend will
    report a negative as readily as a positive, and that candour makes the report believable.
    Second, targeting: a sharer selects the recipient they judge will find the information relevant,
    so word of mouth is routed to interested people at no cost to the sender of the message. He
    describes each recipient as a searchlight looking through their own network for the person the
    thing suits.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Credibility comes from the sharer having no stake in the outcome and therefore being expected
      to report failures. Targeting comes from the sharer holding private knowledge about who would
      care, which no media buy can purchase.
  scope:
    domain_discussed_by_source: [word_of_mouth_marketing, advertising_effectiveness]
    conditions: "consumer products and services with a discoverable audience"
  caveats:
    - text: >
        Every figure in this passage is third-party and is cited only in the Notes: the "twenty to
        fifty percent of purchasing decisions" figure is a McKinsey Quarterly white paper (Bughin,
        Doogan and Vetvik 2010); the restaurant-sales figure is Godes and Mayzlin (2009); the Amazon
        review figure is Chevalier and Mayzlin (2006); the "at least ten times more effective"
        comparison rests on Stephen and Galak (then forthcoming) and Trusov, Bucklin and Pauwels
        (2009). None of them is Berger's measurement, and none of the designs is described in the
        body text.
      origin: extractor_observed
    - text: >
        The credibility argument is asserted from premises about incentives, not measured. The
        source offers no evidence that audiences actually discount advertising at the rate the
        argument requires.
      origin: extractor_observed
    - text: >
        The self-targeting mechanism is illustrated by a single anecdote about a publisher sending
        the author two copies of a book. That is an instance of the mechanism, not evidence of its
        magnitude.
      origin: extractor_observed
  source_stated_problems:
    - "because ads will always argue that their products are the best, they're not really credible"
    - "the company would still end up wasting money because lots of those people don't need new skis"
  source_stated_remedies:
    - "get people to do the targeting for them"
  examples:
    positive:
      - {description: "a publisher mailing two copies of a book so the recipient passes the second to the colleague it suits", figure_ref: null}
    counter:
      - {description: "a ski company advertising on lift tickets, reaching skiers who do not need skis", figure_ref: null}
  intra_source_relations:
    - {relation: depends_on, target: sk_ctg_0003, note: "the targeting advantage is a property of ordinary sharers, not of influentials"}
  evidence:
    characteristics: [explicitly_stated, argued, anecdotal, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: "Introduction — Why Things Catch On"
    section: "opening argument, before 'Generating Word of Mouth'"
    locator: "Introduction, the passage beginning 'Word of mouth is more effective than traditional advertising for two key reasons' (spine 5)"
    page_start: null
    page_end: null
    figure_refs: []
    source_support: text
    inspected: {text: true, figures: []}

- sk_id: sk_ctg_0005
  source_id: berger-contagious
  source_terms:
    - "Virality isn't born, it's made"
    - "regardless of how plain or boring a product or idea may seem, there are ways to make it contagious"
  concept_label: contagiousness_is_a_property_that_can_be_engineered_into_ordinary_things
  label_origin: extractor_assigned
  claim: >
    The source's central design claim is that contagiousness is not an inherent property of exciting
    subject matter but something that can be built into anything, including deliberately dull
    categories. He poses the question directly — are some products born contagious, or can any
    product be engineered to be more infectious — and answers for engineering.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A boring product can be given a property that is not boring. The Blendtec case is presented as
      the demonstration: the blender did not change, but a videotaped demonstration of it destroying
      marbles, golf balls and an iPhone gave a household appliance a remarkable property that people
      wanted to pass on.
  scope:
    domain_discussed_by_source: [product_marketing, content_design, nonprofit_and_public_health_communication]
    conditions: "products, ideas and behaviours whose owner controls the product or the messaging around it"
  caveats:
    - text: >
        The support is one recounted business case with outcome figures reported by the company and
        the trade press — six million views in the first week, more than three hundred million views
        for the series, retail blender sales up 700 percent within two years, made for less than a
        few hundred dollars an episode. No control condition exists and no other cause is excluded.
        This is `outcome_claimed`, not measurement.
      origin: extractor_observed
    - text: >
        The book's own later evidence bounds this claim rather than supporting it without limit: the
        BzzAgent analysis found that remarkable, novel and surprising products got no more ONGOING
        word of mouth than boring ones. So 'anything can be made contagious' is at best a claim
        about immediate transmission unless the engineering also supplies triggers.
      origin: extractor_observed
    - text: >
        The Epilogue restates this as 'any product, idea, or behavior can be contagious', a stronger
        universal than the evidence in the book establishes.
      origin: extractor_observed
  source_stated_problems:
    - "although the product was great, no one really knew about it. Awareness was low."
  source_stated_remedies:
    - "find the inner remarkability"
  examples:
