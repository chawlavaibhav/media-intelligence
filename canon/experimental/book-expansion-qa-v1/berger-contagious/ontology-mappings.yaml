  definition_in_origin_frame: >
    The physical traces or remnants an action leaves in its wake — a wristband, a sticker, a
    reusable bag, a shelf of novels — which keep the behaviour visible when it is not being
    performed. The source credits the term to Sam Gosling.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0054
  term: practical_value
  origin: source
  origin_ref: berger-contagious
  kind: property
  definition_in_origin_frame: >
    Usefulness to the RECEIVER — saving them time or money, or helping them have a good experience.
    The source's summary is news you can use, and he distinguishes it from social currency by whose
    interests the sharing serves.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0055
  term: valuable_virality
  origin: source
  origin_ref: berger-contagious
  kind: property
  definition_in_origin_frame: >
    Transmission that benefits the sponsor, because the brand or product benefit is integral to the
    story rather than attached to it. The source's test is whether people can tell the story without
    mentioning it.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0056
  term: immediate_word_of_mouth
  origin: source
  origin_ref: berger-contagious
  kind: property
  definition_in_origin_frame: >
    Talk that passes on the details of an experience soon after it occurs. The source reports that
    interest predicts it — and matters most for products with short reallocation cycles, such as
    films and new grocery items.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0057
  term: ongoing_word_of_mouth
  origin: source
  origin_ref: berger-contagious
  kind: property
  definition_in_origin_frame: >
    Talk in the weeks and months after the experience. The source's own study found that interest,
    novelty and surprise did NOT predict it, and that trigger frequency did.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0058
  term: social_proof
  origin: source
  origin_ref: berger-contagious
  kind: property
  definition_in_origin_frame: >
    The use of others' visible choices as information about what is good, under uncertainty — they
    probably know something we do not. The source credits the term to Cialdini and notes it is
    fallible, because observers see the choice and not the reason for it.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0059
  term: reference_point
  origin: source
  origin_ref: berger-contagious
  kind: property
  definition_in_origin_frame: >
    The comparison standard a price or offer is judged against, usually the price the buyer expects
    to pay. The source takes the term from prospect theory and uses it to explain why a higher price
    can feel like a better deal.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0060
  term: diminishing_sensitivity
  origin: source
  origin_ref: berger-contagious
  kind: property
  definition_in_origin_frame: >
    The principle that the same absolute change has a smaller felt impact the further it lies from
    the reference point — ten dollars off a thirty-five-dollar radio against ten dollars off a
    six-hundred-and-fifty-dollar television.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0061
  term: scarcity
  origin: source
  origin_ref: berger-contagious
  kind: property
  definition_in_origin_frame: >
    In the source's specific usage, a restriction on HOW MUCH of something is offered — through
    demand, limited production, or limits on the time or place it can be acquired.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0062
  term: exclusivity
  origin: source
  origin_ref: berger-contagious
  kind: property
  definition_in_origin_frame: >
    In the source's specific usage, a restriction on WHO may acquire something, by criteria — and he
    insists the criterion need not be money or celebrity: knowing something, or knowing someone who
    does, is sufficient.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

# ── ENTITIES ────────────────────────────────────────────────────────────────

- term_id: t_ctg_0063
  term: stepps
  origin: source
  origin_ref: berger-contagious
  kind: entity
  definition_in_origin_frame: >
    The source's acronym for his six drivers — Social Currency, Triggers, Emotion, Public, Practical
    Value, Stories — which he says is ordered this way as a memory aid, not as a sequence or a
    priority.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0064
  term: word_of_mouth_episode
  origin: source
  origin_ref: berger-contagious
  kind: entity
  definition_in_origin_frame: >
    A separate conversation in which someone says something positive or negative about an
    organisation, brand, product or service. The source reports the average American engaging in
    more than sixteen a day.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0065
  term: trigger
  origin: source
  origin_ref: berger-contagious
  kind: entity
  definition_in_origin_frame: >
    A stimulus that prompts people to think about a related thing. It may be direct, such as using
    the product, or indirect, such as peanut butter cueing jelly. The source calls triggers little
    environmental reminders for related concepts and ideas.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_ctg_0066
  term: trojan_horse_narrative
  origin: source
  origin_ref: berger-contagious
  kind: entity
  definition_in_origin_frame: >
    A carrier story whose surface plot is what people want to tell and whose cargo is the
    information the sponsor wants transmitted. The source distinguishes the surface plot from what
    is hidden inside it.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

relationships:

- {from: t_ctg_0047, to: t_ctg_0048, relation: distinct_from, confidence_basis: extractor_judgement, note: "Checked and rejected. Remarkability and trigger frequency both explain why a thing gets talked about, and the source's own data separate them: remarkability buys immediate talk and, in the BzzAgent analysis, no ongoing talk at all, while trigger frequency buys both. Collapsing them would erase the book's central empirical result."}
- {from: t_ctg_0046, to: t_ctg_0054, relation: distinct_from, confidence_basis: extractor_judgement, note: "Checked and rejected. The source separates these explicitly by whose interests the sharing serves — social currency is about the sender and how sharing makes them look, practical value is about the receiver. He concedes they overlap in effect and insists they differ in mechanism."}
- {from: t_ctg_0050, to: t_ctg_0051, relation: distinct_from, confidence_basis: extractor_judgement, note: "Checked and rejected, and this is the distinction the book is most often misread on. Arousal and valence are orthogonal dimensions in the source's own grid: anger is negative and high-arousal, contentment positive and low-arousal. Treating high-arousal as a synonym for negative, or positive as a synonym for shareable, misstates every figure in the chapter."}
- {from: t_ctg_0061, to: t_ctg_0062, relation: distinct_from, confidence_basis: extractor_judgement, note: "The source draws this line himself in one paragraph: scarcity restricts how much, exclusivity restricts who. They co-occur in his cases and are not the same lever."}
- {from: t_ctg_0036, to: t_ctg_0037, relation: distinct_from, confidence_basis: extractor_judgement, note: "Opposite-signed remedies for opposite goals. Making the private public spreads a behaviour; making the public private prevents one. The source states both and never gives the rule that selects between them, which is recorded as a gap rather than filled."}
- {from: t_ctg_0053, to: t_ctg_0052, relation: narrower_than, confidence_basis: extractor_judgement, note: "Behavioural residue is one way of achieving observability, the one that operates when the behaviour itself is not happening."}
- {from: t_ctg_0034, to: t_ctg_0052, relation: narrower_than, confidence_basis: extractor_judgement, note: "Self-advertising design is the other named route to observability, the one that operates during use."}
- {from: t_ctg_0049, to: t_ctg_0048, relation: broader_than, confidence_basis: extractor_judgement, note: "A habitat is the whole set of cues; trigger frequency is how often any of them occurs. The source uses habitat for the design object and frequency for the measured property."}
- {from: t_ctg_0058, to: t_ctg_0052, relation: related_to, confidence_basis: extractor_judgement, note: "Social proof is the inference; observability is its precondition. The source makes visibility the gate on the inference rather than part of it."}
- {from: t_ctg_0014, to: t_ctg_0058, relation: same_mechanism, confidence_basis: extractor_judgement, note: "The descriptive-norm backfire is not a malfunction of social proof but social proof working correctly on the wrong input: the audience is told, accurately, that many peers do the thing."}
- {from: t_ctg_0056, to: t_ctg_0057, relation: distinct_from, confidence_basis: extractor_judgement, note: "The source's own outcome split, and the one that turned a null result into a finding. Different predictors, different products depend on each, and reporting either without the other misstates it."}
- {from: t_ctg_0059, to: t_ctg_0060, relation: related_to, confidence_basis: extractor_judgement, note: "Both are consequences of the same prospect-theory value function, which the source takes from Kahneman and Tversky rather than establishing."}
- {from: t_ctg_0018, to: t_ctg_0059, relation: related_to, confidence_basis: extractor_judgement, note: "Routine discounting is the failure mode of the reference point: repeated sales migrate the standard to the sale price and destroy the gap."}
- {from: t_ctg_0055, to: t_ctg_0047, relation: related_to, confidence_basis: extractor_judgement, note: "Related and not the same. A thing can be highly remarkable and produce no valuable virality — the Olympic stunt and the roller-skating babies were both remarkable — because remarkability is a property of the content and valuable virality is a property of the relationship between the content and the sponsor."}
- {from: t_ctg_0017, to: t_ctg_0046, relation: related_to, confidence_basis: extractor_judgement, note: "The source's argument against paid referral is that payment substitutes for the social-currency motive rather than adding to it."}

