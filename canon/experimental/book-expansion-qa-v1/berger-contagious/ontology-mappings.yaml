# Jonah Berger, *Contagious* — SPEC-05 ontology (terms, relationships, concepts)
# EXPERIMENTAL — NOT LIVE CANON. book-expansion-qa-v1, non-merge, exploratory lane.
#
# No cross_source_concept (xs_...) is created — cross-source promotion is forbidden in this task.
# No `same_failure_family` relation is used — it requires human review under SPEC-05 governance.
# No cross-lane relationship is written: the parallel lanes' term ids are not resolvable from here,
# and an unresolvable reference is worse than a missing observation. The resemblances worth a
# reviewer's attention — above all the one between this source's `remarkability` and the live
# `heath-made-to-stick-introduction` extraction's `unexpectedness`, which are NOT the same claim —
# are recorded as prose in PROVENANCE.md §6 under "Observations for cross-source review (NOT
# promotions)" and nowhere else.
#
# REMEDIES. Every `kind: remedy` term carries `executable_by`. This source is about transmission
# BETWEEN PEOPLE. Almost every remedy in it is an act a person performs — a design decision, an
# editorial choice, a change to what a message says or where it is placed — so `human_edit`
# dominates. Two remedies are genuinely `physical_production` (a durable object, a distinguishing
# physical feature) and per SPEC-05 rule 6 they are NOT translated into generative instructions.
# One is `deterministic_composite` because it really is a mechanical rule. Two are `unknown`
# because the source names a desired state and supplies no procedure for reaching it.
# NOTHING here is a generative-model instruction and no remedy carries
# `generative_respecification`.

source_id: berger-contagious
