- sk_id: sk_disc_0033
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Facilitation is the conscious, balanced management of conversations toward a conclusion"
    - "that's about six people"
  concept_label: facilitation_defined_and_the_conversational_group_ceiling
  label_origin: extractor_assigned
  claim: >
    Facilitation is defined as the conscious, balanced management of conversations toward a
    conclusion: it begins from the objectives and purpose of the discussion and works to meet them
    by asking appropriate questions, ensuring shared understanding, and allowing participants to
    contribute. The authors argue it is not optional for critique but constitutive, because
    without it participants analyse different aspects against their own criteria and the
    sporadic, unstructured delivery makes it hard to tell what is useful. Two sizing claims are
    attached. The number of people directly determines the effort of managing the conversation and
    each participant's ability to follow it, so groups should start small — pairs when introducing
    critique — and grow. And the ceiling for a single undivided conversation is given as roughly
    six people; beyond that, either more active facilitation or splitting into smaller groups is
    required. The authors add that facilitation is not always a formal role — "sometimes it's just
    a matter of the questions you choose to ask and how you choose to ask them."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Structure is what makes contributions comparable. Facilitation supplies the shared frame —
      which aspect, against which objective, in what order — so that what each person says can be
      related to what the others said, and it supplies the bounded scope that keeps attention on
      one thing at a time.
  scope:
