- sk_id: sk_disc_0001
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Feedback itself is nothing more than a reaction or response"
    - "The issue with feedback lies in how nonspecific it is"
  concept_label: the_word_feedback_names_only_a_reaction_not_a_judgement
  label_origin: extractor_assigned
  claim: >
    The source locates the problem not in any particular bad comment but in the request itself.
    "Feedback" names any reaction or response whatsoever — the authors take the term from the
    interaction-design sense of a feedback loop, where feedback is the system's noticeable change
    of state after a user acts — so a request for feedback places no constraint on what comes
    back. Asking for it therefore returns an unpredictable mixture: a gut reaction, a list of
    instructions, or a description of what the critic would have made instead. The work of sorting
    which of that is usable falls entirely on the person who asked.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A word that categorises nothing cannot set an expectation. Because "feedback" covers every
      response, both parties can use it in good faith and still be doing different things: the
      asker wanting analysis, the giver supplying a reaction. The authors' remedy is not to ban
      the word — they concede they use it throughout the book — but to know which of the three
      forms one is asking for and to shape the request accordingly.
  scope:
    domain_discussed_by_source: [design_team_conversation, interface_and_product_design]
    conditions: "any conversation in which someone shares work in progress and asks for others' responses to it"
  caveats:
    - text: "the authors explicitly concede the point may look like semantics, and that giving up the word is 'damned difficult'"
      origin: source_stated
    - text: "this is an argument about vocabulary and expectation, offered without any measurement of how differently-worded requests actually perform"
      origin: extractor_observed
  source_stated_problems:
    - "we aren't being specific enough in describing what we want feedback on and why we are asking for it"
    - "weeding through all of that feedback to try to determine what's of use to us can be a struggle"
  source_stated_remedies:
    - "understand the differences in forms of feedback and use that understanding to inform how you ask people and facilitate the resulting conversations"
  examples:
    positive:
      - description: "the Ready For Zero payment-plan form, where moving a slider instantly readjusts the other values — the source's illustration of feedback in its original, non-human sense"
        figure_ref: "Figure 1-2"
    counter: []
  intra_source_relations:
    - {relation: generalises, target: sk_disc_0002, note: "the three-form taxonomy is the response to this problem"}
    - {relation: qualified_by, target: sk_disc_0019, note: "the channel used to ask also shapes what comes back"}
