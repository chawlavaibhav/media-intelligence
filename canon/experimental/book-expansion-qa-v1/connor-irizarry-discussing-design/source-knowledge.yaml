- sk_id: sk_disc_0023
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "personas, scenarios, goals and principles"
    - "Goals are the desired, measurable outcomes that result from the product being used"
    - "it's also best to avoid goals that are binary or output based"
  concept_label: the_four_foundation_elements_and_what_makes_a_goal_usable_as_a_yardstick
  label_origin: extractor_assigned
  claim: >
    The source names four artifacts that together constitute what it means by a product's
    objectives, and states the relation between them as a single sentence: the objectives for a
    product are to reach its goals, for the given audiences (personas), by creating a design with
    the right behaviours and characteristics (principles), to produce the desired experience when
    used in the applicable contexts (scenarios). Personas and scenarios supply the setting for the
    analysis — through whose eyes, with what expectations, in what contexts. Goals and principles
    supply the finish line. On goals specifically the authors give a quality test: a goal is a
    desired, measurable outcome that correlates to a change in user behaviour, and goals that are
    binary or output-based are to be avoided — "adding a 'remember me' feature" is an output the
    team either ships or does not, whereas "increase authenticated visits to our site by 15
    percent" is an outcome that can be checked.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An output-shaped goal cannot discriminate: once the thing is built the goal is satisfied
      regardless of whether anything improved, so it can never be used to judge a design decision.
      An outcome-shaped goal remains a live test after delivery and can therefore be argued
      against during design.
