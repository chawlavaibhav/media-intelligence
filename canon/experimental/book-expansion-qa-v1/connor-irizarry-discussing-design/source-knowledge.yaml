- sk_id: sk_disc_0030
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Critical thinking is the nemesis of creative or generative thinking"
    - "divergent thinking activities"
    - "convergent thinking activities"
    - "By incorporating critique as a precursor to voting or a voting-like activity, we prime the pump"
  concept_label: analysis_suppresses_generation_so_the_two_must_be_separated_and_ordered
  label_origin: extractor_assigned
  claim: >
    The source's explanation of why group idea-generation underperforms is that nothing prevents
    participants from thinking critically while it happens. Two distinct suppressions are named:
    participants who are analysing the ideas already on the table are not producing new ones, and
    participants who are producing ideas analyse them prematurely, judge them not worth
    mentioning, and keep them to themselves. A third obstruction is that people are pushed into
    discussion before they have formed their own view of the problem at all. The prescribed
    structure divides the time into a divergent phase, whose activities minimise the opportunity
    for critical thinking — typically via a time limit and a challenge, such as sketching six to
    eight ideas in five minutes — and a convergent phase that compares, consolidates and
    eliminates. Critique belongs at a specific point: incorporated into the second phase, before
    voting, so that ideas are retained or dropped on their strength against the product's
    objectives rather than on whatever private criteria each voter would otherwise use. The
    authors make the same point about design-by-committee: there is nothing wrong with combining
    elements from different ideas, and the weakness is the reason the combined elements were
    selected.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The authors ground this in their creative/analytical toggle: a mind in analytical mode is not
      generating, so admitting analysis into a generative phase costs ideas, and admitting
      generation into an analytical phase costs coordination. Sequencing the two protects both.
      Placing critique immediately before selection means the shared objectives, rather than
      unstated individual criteria, are what is fresh in participants' minds when they choose.
