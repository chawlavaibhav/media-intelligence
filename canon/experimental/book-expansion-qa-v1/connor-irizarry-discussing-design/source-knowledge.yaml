    - "Why or why not?"
  concept_label: the_four_question_procedure_for_producing_a_well_formed_critique
  label_origin: source_verbatim
  claim: >
    The source supplies a four-question procedure that produces the three required elements: what
    is the objective of the design; what elements of the design are related to that objective; are
    those elements effective in achieving it; and why or why not. The authors state that the first
    two questions may be reversed depending on how the work is being presented, and that the
    questions may be answered silently by the giver or asked out loud of the designer. Two
    properties are worth holding onto. The second question explicitly does not care whether the
    aspect was a conscious choice — "we are analyzing the effectiveness of the whole design as it's
    presented". The fourth asks not merely for a verdict but for the result the choice will
    actually produce, and admits the case where an element does not achieve the objective alone
    but contributes in conjunction with others.
