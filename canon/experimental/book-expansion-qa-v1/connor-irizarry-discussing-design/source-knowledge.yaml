- sk_id: sk_disc_0034
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Everyone is equal"
    - "HiPPO (Highest Paid Person's Opinion); it's a killer when it comes to effective critique"
    - "it isn't inherently true that their opinions are more accurate just because they're executives"
  concept_label: the_weight_of_a_judgement_must_not_come_from_the_position_of_its_giver
  label_origin: extractor_assigned
  claim: >
    The first of the source's four rules holds that in a critique everyone's observations are
    listened to equally, and that more attention must not be paid to a perspective because of the
    speaker's position. The argument is careful: the authors concede that an organisation may
    legitimately make its decisions on what its leaders think, but deny that seniority makes an
    observation more accurate, and insist the two be kept separate and sequenced — "we want to
    keep that separate, and hopefully after a critique." The named harm is suppression: where
    participants sense inequality they either stay quiet or go along with what was already said,
    and the group loses information. Crucially the authors state the rule must hold in both
    directions — contributors must also see themselves and others as equal contributors. The
    remedies are behavioural: ask quiet people directly during the session, speak to a
    weight-throwing participant afterwards, and, in Adam's practice, call a break to raise the
    problem with the organisation's leaders present. Weighing expertise is permitted, but later,
    when the collected feedback is reviewed.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Deference removes independent observations from the pool before they are voiced, so the
      session's output is narrower than the room's actual knowledge. Separating collection from
      decision preserves the observations while leaving the organisation's authority structure
      intact for the decision that follows.
  scope:
