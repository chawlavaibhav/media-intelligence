- sk_id: sk_disc_0027
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "We need to be able to clearly communicate the idea to others."
    - "We need to have the time to process the feedback we receive from the critique and use it to iterate on our idea."
    - "the best time to critique a solution is after it is 20 percent baked but before it's 80 percent baked"
  concept_label: the_window_in_which_critique_is_immediately_useful_is_bounded_at_both_ends
  label_origin: extractor_assigned
  claim: >
    The source bounds the useful period for critique by two conditions rather than by a schedule.
    The opening condition is communicability: before the maker has enough clarity to explain the
    idea, critique is premature — "as soon as the first person asked us to clarify things, all we
    would be able to answer with is 'I don't know'." The authors are careful that this does not
    require every detail to be settled; unanswered questions at this stage are expected. The
    closing condition is actionability: at the point where something must be let go so it can be
    produced, feedback can still be collected but cannot be used until the work comes round again.
    Between the two lies what the authors call the sweet spot, defined as the region where the
    maker can walk away and begin iterating right away. On the familiar "20 percent to 80 percent
    baked" shorthand the authors take an explicit position: such labels help people talk about
    timing but risk being taken too literally, and the durations depend on the scale of the
    problem, the idea, the team and the process — "in some cases, you'll get to that 20 percent
    mark very fast — maybe a matter of minutes or even seconds."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Critique consumes a description and produces changes. Before the description exists it has no
      input; after the change window closes it has no output. The window is therefore a property of
      the work's state and the process's cadence, not of the calendar.
