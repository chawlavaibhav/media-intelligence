  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Analysis in a group requires the participants to be attending to the same object in the same
      mode; a proposed solution introduces a second object and a second mode at once. The
      coordination is lost not because anyone is being unhelpful but because there is no longer a
      single question in the room.
