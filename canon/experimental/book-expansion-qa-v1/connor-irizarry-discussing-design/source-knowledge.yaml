- sk_id: sk_disc_0040
  source_id: connor-irizarry-discussing-design
  source_terms:
    - "Be careful when talking about constraints"
    - "some participants will often interpret the constraints we discuss as excuses or possibly even that we're casting blame"
  concept_label: constraints_volunteered_up_front_are_heard_as_excuses_and_cost_the_room_its_tone
  label_origin: extractor_assigned
  claim: >
    The source singles out constraints — legacy systems, infrastructure limits, deadlines, budgets,
    other business or technical decisions — as the rationale most likely to backfire when
    volunteered. Because the maker's motive for mentioning them is usually that the constraint was
    frustrating and forced a decision she considers less than ideal, participants often hear an
    excuse or an accusation, with a negative effect on the tone and energy of the discussion. The
    prescription is to let the constraint surface through a question about why a choice was made,
    to word it matter-of-factly rather than as blame, and if needed to set up separate time for
    it; in some cases to defer it entirely until after the critique, following up with the person
    whose insight it bears on and bringing in someone who can explain the constraint and possible
    ways around it. The source names exactly one exception: where the constraint was discussed
    with the group previously and the presentation is of the solution to it, in which case it is
    part of the context the group needs — with the same caution about wording.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An unrequested justification is read as anticipating an attack, which changes the register of
      the room from analysis to defence. Arriving as an answer to a question, the same fact carries
      no such implication because someone asked for it.
  scope:
    domain_discussed_by_source: [formal_critique_sessions, client_and_stakeholder_review]
    conditions: "a design shaped by constraints the maker did not choose"
  caveats:
    - text: "the effect on tone is asserted from the authors' experience of sessions; no observation of how differently-framed constraint disclosures land is reported"
      origin: extractor_observed
    - text: "the exception is narrow and specific, and it is the only one the source grants"
      origin: source_stated
  source_stated_problems:
    - "as a result, they can have a negative impact on the tone and energy of the discussion"
  source_stated_remedies:
    - "wait for someone to ask about why choices were made and, if relevant, explain the constraint(s), choosing your words thoughtfully"
    - "it can also be useful to wait to discuss constraints after the critique is over and insights are being reviewed"
  examples:
    positive:
      - description: "presenting a solution to a constraint the group already discussed in a previous session, where the constraint is context the group needs"
        figure_ref: null
    counter: []
