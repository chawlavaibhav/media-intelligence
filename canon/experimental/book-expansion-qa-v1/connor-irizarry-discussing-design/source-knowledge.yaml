  label_origin: extractor_assigned
  claim: >
    The source does not ask givers not to react — it takes reactions as inevitable — but to hold
    them, ask why the reaction occurred, and only then decide whether and when it belongs in the
    conversation. The triage has three outcomes, and the third is the interesting one. If the
