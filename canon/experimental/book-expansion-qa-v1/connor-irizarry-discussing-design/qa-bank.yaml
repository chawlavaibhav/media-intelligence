qa_items:
- qa_id: qa_disc_0001
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 3-5 (Ch. 1, 'The Problem with Asking for Feedback' / 'What Is Feedback?')
  question: 'Connor and Irizarry argue that the trouble with asking for feedback begins with the word
    itself, not with the people answering. What do they say "feedback" actually denotes, where do they
    take that sense from, and what do they say follows from it?

    '
  answer: 'They say feedback is nothing more than a reaction or response, and they take the sense directly
    from the interaction-design idea of a feedback loop, where feedback is the system''s noticeable change
    of state after a user acts. Because the word covers every possible response, a request for feedback
    constrains nothing about what comes back, and the authors say what returns is an unpredictable mixture:
    a gut reaction, a list of instructions on what to change, or comments describing how the design differs
    from what the critic would have made. The consequence they draw is that the sorting work — deciding
    which of it is usable — falls entirely on the person who asked. Notably they do not prescribe abandoning
    the word, conceding that giving it up is "damned difficult" and that they use it throughout the book;
    the remedy is to know which of the three forms you want and shape the request accordingly.

    '
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'The authors'' own definition and argument, printed pp. 3-5. Practitioner assertion with a
    stated mechanism; no measurement of how differently-worded requests perform is offered anywhere.

    '
  confounders:
  - reading the complaint as being about rude or unskilled feedback-givers, which is the opposite of the
    authors' point — their complaint is about the request
  - assuming they recommend banning the word 'feedback'; they explicitly decline to
  - confusing their 'feedback loop' derivation with the management-science sense of feedback as performance
    appraisal
  requires_application_canon013: false
- qa_id: qa_disc_0002
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 5-11 (Ch. 1, 'Three Kinds of Feedback'), restated printed p. 169 (Ch. 7)
  question: 'Name the three forms of feedback in this source''s taxonomy and state, for each, what the
    statement is actually about. What single property do the authors say the first two lack?

    '
  answer: 'Reaction, direction and critique. A reaction is about the responder''s own state — how they
    felt on seeing the work. A direction is about the responder''s preferred solution — what they would
    do instead. A critique is about the relationship between a specific element of the work and a stated
    objective, and why that element does or does not serve it. The property the first two lack is the
    one the authors care about throughout: neither helps you understand whether the design choices made
    will work toward the product''s objectives. Their summary formulation is that reaction and direction
    "are limited in their ability to help us understand if the design choices we''ve made might work toward
    the product''s objectives", while critique "is feedback that focuses on exactly that understanding".

    '
  answer_type: concept_definition
  difficulty: easy
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'The taxonomy as stated in Ch. 1 and restated in the Ch. 7 summary. Asserted by the authors;
    no argument is offered that the three forms are exhaustive.

    '
  confounders:
  - treating the three as a quality ranking of the same kind of thing rather than three different kinds
    of statement
  - assuming reaction and direction are useless — the authors say a reaction tells you something about
    a subconscious response and a direction may reveal an unstated concern
  - substituting a positive/negative or constructive/destructive split, which is a different distinction
    the source explicitly does not use as its primary one
  requires_application_canon013: false
- qa_id: qa_disc_0003
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: 'printed p. 9 (Ch. 1, ''Critique: The third form of feedback''), restated printed p.
    33 (Ch. 2, ''A Simple Framework for Critique'')'
  question: 'State the three elements the source says good critique is composed of. Which of them is the
    one most often missing from ordinary design feedback, and why does its absence matter more than it
    looks?

    '
  answer: 'Good critique identifies a specific aspect of the idea or a decision in the design; it relates
    that aspect or decision to an objective or best practice; and it describes how and why the aspect
    works to support or not support that objective. The second — naming the objective the judgement is
    being made against — is the one ordinary feedback almost never supplies, and it is the element that
    makes the judgement checkable by someone who was not in the room. Without it a statement may still
    be specific and may still give a reason, but the reason has no external referent, so there is no way
    for another person to agree or disagree except by preference. The authors demonstrate the decomposition
    on their own example, splitting it into the clause naming the objective, the clause naming the design
    choices, and the clause stating that the critic does not believe those choices will be effective and
    why.

    '
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'The three elements as listed at printed p. 9 and again at p. 33. The identification of the
    second element as the usual omission is drawn from the source''s own catalogue of bad critique, where
    the named defects are missing reasons and missing referents; the source lists the elements without
    ranking them.

    '
  confounders:
  - collapsing the second and third elements — relating to an objective and explaining why are separate
    requirements here
  - Catmull's five properties of a good note in Creativity, Inc. cover specificity and not demanding a
    fix, but contain no requirement to name the objective; do not import the missing element from there
  - assuming 'best practice' is a weaker substitute for an objective; the source admits it as a legitimate
    yardstick in its own right
  requires_application_canon013: false
- qa_id: qa_disc_0004
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 5-6 (Ch. 1, 'The first two types of feedback' / 'Why it can be an issue')
  question: 'The source describes two varieties of reaction-based feedback, not one. Describe the second,
    and explain why the authors treat it as a problem even though it sounds like praise.

    '
  answer: 'The first variety is the familiar gut reaction: fast, instinctive, driven by the responder''s
    own expectations, desires and values. The second is a reaction driven by the responder''s understanding
    of what they are expected to say — shaped by a cultural sense of the situation or by what they think
    the presenter wants to hear — and it produces "That''s wonderful! Great work!" or "I love what you
    did with…". The authors'' point is that this is not a response to the work at all: it is a response
    to having been asked for feedback in the first place. It therefore carries no information about any
    decision in the design, while looking exactly like a favourable judgement. The authors'' test for
    both varieties is a set of questions neither can answer: is the responder representative of the actual
    audience, are they looking at it as a user would, and does the reaction divulge anything specific
    about any design decision or its effectiveness.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 5-6; the second variety and the three diagnostic questions are the authors''.
    The observation that the two varieties are indistinguishable in form is an inference from their own
    account, not something they state.

    '
  confounders:
  - reading it as ordinary flattery or politics rather than as a category of feedback with a stated cause
  - assuming the authors want positive reactions suppressed; they say elsewhere that reactions are worth
    understanding, just not usable as iteration guidance
  - confusing it with the feedback sandwich, where the positives are deliberate rather than reflexive
  requires_application_canon013: false
- qa_id: qa_disc_0005
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 7-8 (Ch. 1, 'Direction' / 'Why it can be an issue')
  question: 'A stakeholder says: "Move the balance to the top of the screen and make it larger — I''m
    suggesting it because I don''t think people will notice it where it is." She has given a reason. On
    this source''s account, has she given a critique? Explain precisely what is still missing.

    '
  answer: 'No. The authors address this exact case: direction accompanied by an explanation is still direction.
    The explanation tells the designer what problem the giver believes exists — the authors say "you at
    least begin to understand the impetus and perhaps the issue she''s trying to address" — but it "still
    does not help you understand how or why the design you have is or is not effective at addressing that
    problem". What is missing is the analysis of the existing design: nothing has been said about why
    the current placement fails, only that a different placement is preferred. The finding the designer
    needs — this element, against this objective, fails for this reason — has been skipped over and replaced
    by its proposed remedy. The authors are careful that the suggestion may well be a good one; their
    claim is that at this point it is out of place.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'Printed pp. 7-8, where the source distinguishes bare direction from direction with an explanation
    and holds that both fail the same test. Argument from the authors'' stated premises; no evidence is
    offered about how often reasoned directions turn out to be right.

    '
  confounders:
  - treating the presence of any 'because' as sufficient — the source's requirement is a reason about
    the existing design, not about the proposal
  - judging it a critique because the reason mentions a plausible user outcome
  - concluding the suggestion should be rejected; the authors say the direction may be a good idea and
    is merely misplaced
  requires_application_canon013: true
- qa_id: qa_disc_0006
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 24-25 (Ch. 2, 'The Characteristics of Bad Critique — Incomplete')
  question: 'This source defines "actionable" feedback in a narrower and more specific way than the word
    usually carries. Give its definition, and state the boundary it immediately draws afterwards.

    '
  answer: 'Actionable, here, means the designer has enough understanding of what is and is not working,
    and why, that she can explore alternatives or make other adjustments. It is a property of her understanding,
    not of the instruction she received. The boundary the authors draw immediately afterwards is that
    this is different from prescription or direction: "Critique should not tell the designer how to act
    on something or specifically what changes she should make." So a statement can be fully actionable
    in this sense while containing no instruction at all, and a detailed instruction can be entirely unactionable
    in this sense because it leaves the designer unable to explore anything else. The repair the source
    prescribes for an incomplete critique is to attach the why — "Nobody is going to click on that because
    the current page design leads the eye down the left side of the screen away from the call-to-action"
    — not to attach a fix.

    '
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 24-25. The definition and the boundary are both stated by the authors in consecutive
    paragraphs. Practitioner assertion with a stated mechanism.

    '
  confounders:
  - the common industry sense of 'actionable feedback' as feedback specific enough to act on directly,
    which is what this source excludes
  - assuming the repair is to make the instruction more detailed
  - reading the prohibition as absolute; the source concedes elsewhere that some changes are small and
    obvious
  requires_application_canon013: false
- qa_id: qa_disc_0007
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 33-35 (Ch. 2, 'A Simple Framework for Critique')
  question: 'Give the four questions of the source''s critique framework in order. What variation in the
    order does the source explicitly permit, and what does the second question deliberately not care about?

    '
  answer: 'What is the objective of the design? What elements of the design are related to the objective?
    Are those elements effective in achieving the objective? Why or why not? The permitted variation is
    that the first two may be reversed depending on how the design is being presented. The second question
    deliberately does not care whether the aspect being analysed was a conscious choice by the designer
    — the source says so explicitly, "whether the aspect or element is the result of a conscious choice
    by the designer doesn''t matter. We are analyzing the effectiveness of the whole design as it''s presented."
    The fourth question is also more demanding than it sounds: it asks for the result the choice will
    actually produce and how close that is to the objective, and it admits the case where an element does
    not achieve the objective on its own but contributes to it in conjunction with other elements.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 33-35, with the four questions also shown as an ordered arrow flow in Figure 2-1
    (rendered and inspected for this extraction). The authors call the third question "the crux of critical
    thinking".

    '
  confounders:
  - assuming the order is free; the source fixes it and permits exactly one swap
  - reading the fourth question as asking for a verdict rather than a predicted result
  - restricting the second question to intentional decisions, which the source expressly rules out
  requires_application_canon013: false
- qa_id: qa_disc_0008
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 56-57 (Ch. 3, 'Lack of Foundation')
  question: 'A team runs regular, well-facilitated critiques and everyone participates, yet the sessions
    repeatedly appear to reach agreement and then the work that comes back shows people had different
    ideas of what was decided. What does this source say is most likely wrong, and why would better facilitation
    not fix it?

    '
  answer: 'The source''s diagnosis is a missing foundation: the team has not explicitly and jointly agreed
    what the product''s objectives are, so each participant is critiquing against their own. The authors
    describe this exact symptom — a meeting where everyone seemed to be talking about the same thing and
    left with their to-dos, and then the work revealed different understandings. The reason facilitation
    cannot fix it is structural rather than behavioural: critique is a comparison of an element against
    an objective, so if the objective differs per person the comparisons are not commensurable. The group
    is not disagreeing about the design at all; it is running several unrelated analyses that happen to
    be voiced in the same room, and nothing in the conversation surfaces that, because the objective is
    usually left implicit in each remark. The authors add that when they ask teams what the objectives
    of the product are, very few people can answer, and those who do rarely give the same answer.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 56-57, plus the Appendix A restatement as "Starting from Disparate Foundations"
    (printed p. 177). The observation about teams unable to name their objectives is reported from the
    authors'' consulting experience with no count, sample or method — it is the most empirical-sounding
    statement in the book and it is not a measurement.

    '
  confounders:
  - diagnosing a communication or listening problem, which is what the symptom looks like from inside
  - diagnosing a documentation problem — the authors' own text says agree the objectives, but Kim Goodwin's
    sidebar warns that writing them down is not the same as sharing them
  - assuming better note-taking would catch it; the divergence is in the premises, not the record
  requires_application_canon013: true
- qa_id: qa_disc_0009
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 57-58 and 63 (Ch. 3, 'Creating an Effective, Common Foundation')
  question: 'Name the four foundational artifacts this source means when it says "objectives", state the
    single sentence in which it relates them, and give its test for whether a goal is usable.

    '
  answer: 'Personas, scenarios, goals and principles. The relating sentence is that the objectives for
    a product are to reach its goals, for the given audiences (personas), by creating a design with the
    right behaviours and characteristics (principles), to produce the desired experience when used in
    the applicable contexts (scenarios). Personas and scenarios supply the setting for the analysis —
    through whose eyes, with what expectations, in what contexts; goals and principles supply the finish
    line. The test for a goal is that it must be a desired, measurable outcome correlating to a change
    in user behaviour, and that binary or output-based goals are to be avoided: adding a "remember me"
    feature is an output the team either ships or does not, whereas "increase authenticated visits to
    our site by 15 percent" remains a live test after delivery and can therefore be argued against during
    design.

    '
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed pp. 57-58 for the four elements and the relating sentence, p. 63 for the goal test.
    The example goals in Figure 3-5 (rendered and inspected) are all numeric and outcome-shaped, which
    is stronger than the prose alone conveys.

    '
  confounders:
  - treating the four as documentation deliverables rather than as the yardstick every critique runs against
  - assuming the source demands quantified goals only; it admits experiential objectives elsewhere (printed
    p. 10)
  - including the Mini Creative Brief as a fifth element — it is a container for the four, not one of
    them
  requires_application_canon013: false
- qa_id: qa_disc_0010
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: 'printed pp. 63-64 (Ch. 3, ''The end game: goals and principles''), with the negative
    form at printed p. 165 (Ch. 6, ''Step 4: Critique together'')'
  question: 'A team''s design principles are "delightful", "modern" and "fun". Applying this source''s
    own test, what is wrong with them, and what is the test — stated both in its positive and its negative
    form?

    '
  answer: 'They are too broad. The positive form of the test is that a good principle is specific and,
    by virtue of being specific, eliminates more design ideas than it retains — the source names "fun"
    and "amusing" as exactly the kind of quality that fails, because every member of a team interprets
    them differently and none of them rejects any candidate. The negative form appears in Chapter 6 and
    is the sharper one: "when asking whether design options adhere to a principle, more often the answer
    should be ''no''." A set of principles that never says no is evidence that the principles are too
    broad, not that the designs are good. The source''s example principles are written instead as first-person
    constraints with a reason attached — "Be where I am. Don''t be just another place I have to go log
    into" — which is a form the prose does not describe and only the figure carries.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 63-64 for the specificity test and the "fun" counter-example, p. 165 for the negative
    form. The example principles are in Figure 3-6, rendered and inspected for this extraction.

    '
  confounders:
  - judging the principles by whether they describe the brand accurately, which is not the test
  - assuming the fix is to define each word more precisely; the source's fix is a principle that discriminates,
    not a glossary
  - reading 'more often the answer should be no' as a numeric threshold — the source gives none
  requires_application_canon013: true
- qa_id: qa_disc_0011
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 40-42 (Ch. 2, 'Best Practices for Receiving Critique — Return to the foundation')
  question: 'In a critique, a comment arrives that you cannot connect to any of the project''s objectives.
    What does this source tell you to do, and what does it say the failure to connect it might mean? Why
    is that second possibility the interesting one?

    '
  answer: 'Try to relate it to the previously agreed objectives, if necessary by asking the giver follow-up
    questions that do the relating. The source treats both outcomes as informative. If a connection is
    found, the feedback is now understood and usable. If none can be found, the authors'' reading is not
    that the comment was worthless but that members of the team may hold different views of what the product''s
    objectives are — and they prescribe naming that explicitly, then deciding on the spot whether to resolve
    it now or table it for a separate conversation. That second possibility is the interesting one because
    it makes the test bidirectional: a judgement''s failure to bind to the stated objectives becomes evidence
    about the objectives, not only about the judgement. The same aperture appears on the giving side at
    printed p. 27, where feedback that is neither a best practice nor tied to a stated objective may be
    revealing an objective or constraint that has not yet been exposed.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 40-42, with the giver-side counterpart at p. 27 and the Appendix A note that a
    comment unrelatable to the foundation may mean the foundation is incomplete. Argument from the authors''
    stated premises.

    '
  confounders:
  - discarding the comment as off-topic, which is the move the source is arguing against
  - treating the foundation as fixed and authoritative; the source explicitly allows that it can miss
    something and that new information can reveal new elements
  - assuming the divergence must be resolved immediately — the authors leave the resolve-or-table decision
    to judgement and give no criterion
  requires_application_canon013: false
- qa_id: qa_disc_0012
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 61-62 (Ch. 3, sidebar 'Personas Help Visual Design Discussions, Too' — Kim
    Goodwin)
  question: 'A team has written personas, scenarios, goals and principles, circulated them, and reviewed
    them in a kickoff meeting. According to the sidebar in this book, what condition may still not be
    satisfied, and what behaviour does its absence produce?

    '
  answer: 'That the criteria are actually shared. Kim Goodwin''s sidebar states that evaluation criteria
    are not truly shared unless everyone both understands them and believes in them, and that teams mistakenly
    treat "written down somewhere or mentioned in a meeting" as sufficient. The behaviour the absence
    produces is criteria used as weapons rather than as tools — in her account, interaction designers
    wielding a persona as a trump card, "Trust us, we did the user research" — which erodes trust rather
    than settling anything. She attributes the gap to involvement: the visual designer in her story had
    limited participation in the research and the scenario work, which she notes is sometimes unavoidable
    on budget grounds but which his teammates could have done more to mitigate. Note that this is Goodwin''s
    contribution, not Connor and Irizarry''s own text, and it qualifies their argument rather than restating
    it.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 61-62, a signed sidebar by Kim Goodwin — a different practitioner''s assertion
    carried inside this book. The evidence is a single coaching anecdote about one three-person team.

    '
  confounders:
  - attributing the claim to Connor and Irizarry; their own text argues for establishing and referring
    back to the foundation and does not raise the belief condition
  - reading it as a communication problem fixable by better documentation, which is the position it contradicts
  - missing her closing caution — that using personas and goals 'like hammers to end arguments' backfires,
    which cuts against the return-to-the-foundation prescription the authors give elsewhere
  requires_application_canon013: true
- qa_id: qa_disc_0013
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: 'printed pp. 58-59 (Ch. 3, ''The background: personas and scenarios'')'
  question: 'What two specific cautions does this source give about writing personas, and what does it
    say is wrong with the second thing it warns against?

    '
  answer: 'First, state characteristics explicitly rather than hinting at them through narrative detail:
    the authors ask what it tells the team that a persona has two dogs and enjoys Saturdays in the park,
    and say not to use flowery stories or superfluous details to imply characteristics or behaviours.
    Second, do not get hung up on demographics. What is wrong with demographics is that they are used
    as stereotypes for behaviours and characteristics — the authors'' example is assuming a millennial
    persona must be good with technology — and they note counter-cases in both directions from their own
    acquaintance. Their positive instruction is to learn the real characteristics of the audience and
    state them explicitly, so that references to the persona later in the project do not have to be interpreted.
    They also state a format preference: half-page, succinct personas listing main points that can be
    read at a glance, rather than deeper narrative ones.

    '
  answer_type: repair
  difficulty: easy
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed pp. 58-59. Practitioner preference and assertion; the format preference is explicitly
    labelled by the authors as "our preference".

    '
  confounders:
  - assuming the objection to demographics is about fairness or bias in a social sense; the stated objection
    is that they are unreliable proxies for behaviour
  - reading the brevity preference as a rule rather than as the authors' stated preference
  - 'extending the caution to scenarios unchanged — the scenario caution is different: base them on real
    observations and make sure included thoughts and emotions are ones the design is meant to address
    or produce'
  requires_application_canon013: false
- qa_id: qa_disc_0014
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 113-114 (Ch. 5, 'Avoid Problem Solving')
  question: 'Why does this source hold that someone proposing a fix during a critique damages the session,
    beyond simply using up time? Give the mechanism, including what it says happens across the rest of
    the room.

    '
  answer: 'Because proposing a solution means that person has switched from analytical to creative thinking,
    and the source''s premise is that a brain does not consciously do both at once — it divides resources
    and actively switches. When that switch happens in public, the rest of the room scatters: some participants
    are still analysing the original design, some are analysing the new idea, some are generating alternatives
    of their own, and some are in a fourth process, simply trying to comprehend what was just proposed,
    with individuals jumping between them. The authors'' summary is that "the coordination becomes lost
    and everyone heads in different mental directions", and that the paramount thing is to keep everyone
    in the same mental process. The practical cost is stated separately and additionally: veering into
    problem solving on item two of five means items three to five are never reached.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed pp. 113-114. The cognitive premise about simultaneous analytical and creative thinking
    is asserted without citation or evidence anywhere in the book, and it carries the weight of the rule;
    it should be read as the authors'' working model.

    '
  confounders:
  - explaining it as rudeness, dominance or derailing — the source's account is cognitive, not social
  - assuming the source thinks the rule can be enforced by willpower; it says explicitly 'we can't' prevent
    a room from doing it
  - reading it as a ban on ever exploring solutions — the source permits deliberately switching the whole
    room to exploration
  requires_application_canon013: false
- qa_id: qa_disc_0015
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed p. 114 (Ch. 5, 'But it's too damned difficult to not solve problems')
  question: 'You are facilitating. Half the room has become absorbed in solving one problem in the design
    and will not return to the analysis, and how it gets solved would change what is worth analysing in
    the rest. What does this source tell you to do — and how does that differ from what it tells you to
    do when one person merely keeps elaborating a solution?

    '
  answer: 'In this case the source tells you to pause or postpone the remainder of the critique and switch
    the room right then to exploring solutions. That is the third of its three responses and it is a permitted
    exit from the analysis, offered precisely for the two conditions described: everyone is stuck on one
    issue, or the impact of how it might be solved brings further critique of the current design into
    question. It differs from the single-elaborator case, where you understand the issue already and the
    instruction is to get that person to hold the idea for a future discussion focused on exploration
    while the analysis continues. And both differ from the case where someone has jumped to a solution
    without naming the issue at all, where the instruction is to ask questions that identify the issue
    and relate it to the objectives. What is common to all three is the stated priority: keep everyone
    in the same mental process.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed p. 114, where the source gives three distinct responses for three distinct situations.
    Practitioner prescription; no reported outcome from applying any of the three.

    '
  confounders:
  - applying the parking-lot response universally, which is the response for one elaborating individual,
    not for a stuck room
  - treating the rule against problem solving as absolute and pressing on with the analysis
  - assuming the switch means the critique has failed; the source presents it as a legitimate facilitation
    decision
  requires_application_canon013: true
- qa_id: qa_disc_0016
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed p. 115 (Ch. 5, 'Don't Rush to Make Decisions on the Changes to Be Made')
  question: 'State what this source says the output of a critique should be, and the retrospective diagnostic
    it attaches to that claim. Why does it say deciding during the session costs you something?

    '
  answer: 'The output should be a set of new observations and understandings about the design and whether
    it is meeting the objectives set for it — explicitly not a list of specific changes for the designer
    to go back and make. The diagnostic follows immediately and is checkable after the fact: "If a list
    of changes is coming out of a critique session, problem solving is taking the place of analysis."
    The cost of deciding during the session is that most insights admit numerous possible responses, so
    committing to one while the analysis is still running means the choice is made on less information
    than the same choice would have afterwards — "it''s likely that we''ll miss opportunities for stronger
    ideas or make premature decisions that cause more problems down the road." The delay also serves the
    maker: she gets time to digest the feedback against the goals, principles, scenarios and personas
    and to follow up on specific points. Exploration is not cancelled, only sequenced after the analysis.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed p. 115, with the Appendix A restatement "Critique is not a list of revisions to be
    carried out like a short-order cook" at printed p. 178. Argument from the authors'' premises; the
    source concedes some changes are small and obvious and gives no criterion for how small.

    '
  confounders:
  - assuming the rule forbids acting quickly on anything; Adam's own follow-up routine starts by fixing
    typos and alignment
  - reading the diagnostic backwards — a change list is evidence about the session, not evidence that
    the changes are wrong
  - conflating 'no decisions' with 'no conclusions'; the session is meant to produce findings
  requires_application_canon013: false
- qa_id: qa_disc_0017
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 162-163 (Ch. 6, 'Dealing with Directive Feedback — Step 1')
  question: 'You asked a stakeholder for feedback and she has sent back her own mockup of how the screen
    should look. How does this source read that act, and what does it say the first thing you should do
    is — and why that first?

    '
  answer: 'The source reads it, in most cases it has encountered or observed, as an articulation failure
    rather than an insult: the person found it difficult to articulate everything she wanted to say and
    thought showing would be easier. The authors turn the design community''s own maxim back on it — "Show
    me. Don''t tell me" is the mantra designers use to describe the inefficiency of verbal description,
    so a stakeholder reaching for a picture is doing what designers themselves recommend. The first thing
    to do is to let your own reaction pass, and the reason is that the source applies its own reaction
    discipline to you: at that moment you are having an impulse and are not thinking critically yet, so
    anything you do now is reactive feedback of the kind the book spends five chapters displacing. The
    authors do not claim the motive is always benign — they say the later steps will reveal whether it
    is personally motivated, and that even then it is worth understanding, because you never know where
    a valuable insight might come from.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 162-163. The reframing is the authors'' own reading of situations they have encountered;
    no count is given. Kim Goodwin''s sidebar reaches the same explanation independently at printed pp.
    61-62, which is corroboration inside the book by a different practitioner, not external evidence.

    '
  confounders:
  - treating it as a boundary violation or a challenge to authority to be pushed back on
  - accepting the mockup and implementing it, which the source says would leave the diagnosis unstated
  - assuming benign intent is established rather than assumed — the authors recommend the assumption as
    a stance, not as a finding
  requires_application_canon013: true
- qa_id: qa_disc_0018
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: 'printed pp. 163-165 (Ch. 6, ''Step 3: Critique the directive feedback'' and ''Step
    4: Critique together'')'
  question: 'Continuing from a stakeholder''s alternative mockup: the source gives a two-stage procedure.
    What is the pivotal move that turns the meeting from a contest into a critique, and what is the one
    question about her design that people usually forget to ask?

    '
  answer: 'The pivotal move is the comparison target. Instead of comparing the two designs to each other,
    compare both against what the team previously agreed mattered — the personas, scenarios, goals and
    principles. The source says this "helps remove some of the my-idea-versus-your-idea atmosphere" and
    refocuses the conversation on what the right decisions are for the product; without an external referent,
    a two-design comparison can only be settled by preference or authority. The intended output is stated
    precisely: a critique of your own original design, constructed using her design or change list as
    a discussion tool. The forgotten question is about what she did not change — ask specifically about
    the things she is not recommending be altered, and the similarities between her design and yours,
    and whether she kept them for the same reasons you made them. The first stage, before any of this,
    is private: five questions asked of the proposal on your own, with the notes kept to yourself.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 163-165. The five private questions and the comparison-against-the-foundation
    move are both stated by the authors. Practitioner prescription with a stated mechanism; no reported
    outcome.

    '
  confounders:
  - going into the meeting to defend the original design, which the source treats as the failure mode
  - comparing the two designs feature by feature, which is the move the source is replacing
  - skipping the private stage — the source is explicit that the notes stay private, which is a deliberate
    exception to its own transparency norm
  requires_application_canon013: true
- qa_id: qa_disc_0019
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: 'printed p. 165 (Ch. 6, ''Step 4: Critique together'')'
  question: 'Halfway through comparing two designs against the project''s goals and principles, you find
    the goals and principles are not helping to settle anything. This source reads that as a finding.
    About what, and what does it prescribe?

    '
  answer: 'About the goals and principles, not about the designs. The source says this can be a sign that
    the goals and principles you set are too broad, and that the conversation is the chance to refine
    them: "Remember, when asking whether design options adhere to a principle, more often the answer should
    be ''no''." It gives a matching test for goals — if, trying to critique against a particular goal,
    you find you have no way to meaningfully measure whether it has been achieved, the goal needs refining.
    The diagnostic runs backwards through the method: the criteria are under test by the critiques they
    are supposed to enable. Where no goals or principles exist at all, the authors treat the same conversation
    as the occasion to generate some on the fly, using what you learn about which aspects matter most
    to the other person and how that compares with any research already done.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed p. 165, with the positive form of the principle test at pp. 63-64. Practitioner assertion;
    the source gives no threshold and no test for the opposite failure of over-narrow criteria.

    '
  confounders:
  - concluding the two designs are equally good
  - concluding critique does not work here and falling back on authority
  - assuming criteria are fixed inputs to a critique rather than something the critique can test
  requires_application_canon013: true
- qa_id: qa_disc_0020
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed p. 25 (Ch. 2, 'The Characteristics of Bad Critique — Preferential')
  question: 'Preferential feedback is a familiar complaint. What does this source say happens to it that
    makes it more than an isolated annoyance, and under what condition?

    '
  answer: 'The condition is that the person with the preference is also in a position of approval. The
    source says that in that situation the team begins, consciously or subconsciously, to prioritise that
    individual''s tastes alongside or above project and user goals, even where the two conflict. The preference
    stops being a bad comment in one meeting and becomes a standing criterion the team optimises against
    — and because it was never written down, it is never subject to the test that written objectives are
    subject to. The authors'' illustration is deliberately absurd, a website design discarded because
    the colour scheme reminded a stakeholder of a Christmas sweater given to him by his ex-wife, and they
    concede it "might seem ridiculous"; their claim is that milder versions are common. What the source
    does not supply is a way to tell a preference from a legitimate but unarticulated expert judgement
    at the moment it is voiced.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed p. 25. Practitioner assertion with a stated mechanism and an acknowledged-absurd illustration;
    no observation of teams drifting toward an approver''s taste is reported.

    '
  confounders:
  - treating preferential feedback as simply unhelpful, which is the ordinary complaint and not the source's
    addition
  - assuming the remedy is to overrule the approver; the source's remedies are to ask which persona, scenario,
    goal or principle the comment relates to
  - confusing this with the HiPPO rule, which is about weight given during collection rather than about
    taste becoming a criterion
  requires_application_canon013: false
- qa_id: qa_disc_0021
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 90-91 (Ch. 4, 'How Often Should You Critique?')
  question: 'This source retracts a position its own author took publicly. What was it, what is the position
    now, and what cues does it offer in place of a number?

    '
  answer: 'Asked at a talk whether there is such a thing as too much critique, Adam had answered "No.
    Not at all!" and gone on at length; the authors write that they wish they could find that audience
    member and apologise. The position now is that there absolutely is such a thing. In place of a number
    they give four cues: the advancement between critiques becomes so small that progress feels stalled;
    critiques circle, with the changes made from the collected insights not advancing the design; formal
    critiques are required so frequently that the team cannot push the design forward enough between them;
    and critique begins to be used as a validation mechanism because the team or the designer lacks confidence
    in the ideas. They decline to give any threshold, calling the judgement "an innate sense or sensitivity
    that a team or individuals develop over time" and advising teams to try different frequencies, ask
    each other how it feels, and adjust.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed pp. 90-91. Explicitly a self-correction of the authors'' earlier enthusiasm, offered
    with no measurement and no threshold. The fourth cue is a motive rather than an observable.

    '
  confounders:
  - assuming a book advocating critique would not bound its own recommendation
  - supplying a cadence the source does not give — it refuses numbers here as it does for the timing window
  - reading the fourth cue as being about the design's quality; it is about why the sessions are being
    held
  requires_application_canon013: false
- qa_id: qa_disc_0022
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed p. 147 (Ch. 6, 'Preventing Surprises from Quiet Participants')
  question: 'Why does this source treat a quiet participant as a specific risk rather than as a neutral
    outcome? Describe the pattern it names, and the limit it puts on chasing them.

    '
  answer: 'Because the judgement is not removed, only delayed past the point where it can be used. The
    pattern is that the person shares the thought with someone else instead — a teammate or a manager
    — and the comment then travels person to person until it reaches you days or even weeks later, when
    you may no longer be able to act on it. The source gives two typical causes: feeling overwhelmed by
    the process and subject matter, or fear of saying something that would be considered wrong. The remedies
    are to look for who is not saying much, to ask them for feedback directly if necessary, and to frame
    the request around their specific expertise or skillset, which makes contributing easier. The limit
    is explicit: do not keep pressing. If you sense the person simply has not found anything useful to
    say, leave it — they may just be quiet or shy — and try a one-to-one conversation after the session
    instead.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed p. 147, plus the corresponding session rule at printed p. 112 that non-participation
    leads to concerns being expressed afterwards when it is too late to act. Practitioner assertion with
    a stated mechanism.

    '
  confounders:
  - reading silence as agreement, which the source separately warns against in its material on cultural
    norms
  - assuming the remedy is to require everyone to speak; the source caps the pressure explicitly
  - attributing quietness to disengagement — the source's stated causes are being overwhelmed and fearing
    a wrong answer
  requires_application_canon013: false
- qa_id: qa_disc_0023
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 66-67 (Ch. 3, 'Personal Barriers to Critique — Additional Cultural Influences')
  question: 'This source names a bias that acts on the supply of judgement itself, and a matching reading
    error. Describe both, and say why the reading error is hard to detect.

    '
  answer: 'On the supply side: people raised on the principle that if you have nothing nice to say you
    should say nothing hold back honest critique they fear will upset the recipient — or, the authors
    say, worse, validate a direction they do not believe in. On the reading side: in communities where
    challenging or speaking up is seen as rude, silence is not agreement, and participants who assume
    it is will record a consensus that does not exist; the converse error is also named, that people used
    to being straightforward can be read as combative. The reading error is hard to detect because the
    filter is invisible — the observations were removed before they were voiced, so nothing in the room
    signals their absence. Adam''s own account is of a project with a team from India where he repeatedly
    found afterwards that the alignment he thought he had seen in meetings was not there, and that where
    he thought there had been disagreement there had been none. The prescription is to say before the
    session that stepping outside these norms is acceptable, and to clarify such gaps as soon as they
    are noticed.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed pp. 66-67. Explicitly culturally bounded; the source generalises about cultures and
    its illustration is one person''s recollection of one engagement. The related structural barrier —
    withholding out of intimidation or after repeatedly being told "no" — is at printed p. 55.

    '
  confounders:
  - treating it as a translation or language problem; the source's cases are about norms and body language,
    not vocabulary
  - assuming the prescription detects the filter in progress — it only pre-empts it, and the source offers
    no in-session detection
  - reading the source as making a claim about any particular national culture; it names one anecdote
    and generalises loosely
  requires_application_canon013: false
- qa_id: qa_disc_0024
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 111-112 (Ch. 5, 'Everyone Is Equal')
  question: 'The "everyone is equal" rule is often read as a claim that seniority should not affect decisions.
    That is not what this source says. What does it say, and what does it explicitly permit — and when?

    '
  answer: 'The source concedes that an organisation may legitimately make its decisions on what its leaders
    think. What it denies is that seniority makes an observation more accurate: "it isn''t inherently
    true that their opinions are more accurate just because they''re executives." The rule therefore governs
    the weight given during collection, not during decision, and the authors'' instruction is to keep
    the two separate and sequenced — "we want to keep that separate, and hopefully after a critique."
    What is explicitly permitted, and when, is stated plainly: as the collected feedback is reviewed afterwards,
    an individual''s expertise and experience may be taken into consideration rather than only their position
    in the hierarchy. The harm the rule guards against is suppression: participants sensing inequality
    either stay quiet or go along with what someone else said, and the group loses information it will
    not know it lost.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 111-112, with the later weighting permitted explicitly on p. 112 and reappearing
    at p. 138 as "source of the feedback" among four prioritisation considerations. The authors concede
    the rule is hard to implement depending on culture.

    '
  confounders:
  - reading it as flat decision-making or consensus governance, which the source does not claim
  - concluding expertise is irrelevant; it is permitted, just later
  - assuming HiPPO refers to the executive rather than to the weight the room gives their opinion
  requires_application_canon013: false
- qa_id: qa_disc_0025
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 155-157 and 161 (Ch. 6, 'Receiving Unsolicited Feedback' and 'Remember,
    this applies to positive feedback as well')
  question: 'Why does this source insist that a positive reaction needs the same treatment as a negative
    one? Give its argument, and the additional reason it gives for distrusting praise specifically.

    '
  answer: 'Because usability of feedback is a property of its structure, not of its sign. "I love it!"
    names no aspect of the work and relates it to no objective, so it cannot tell you what to keep, what
    to expand or what to change — exactly the defect that makes an unexplained rejection useless. The
    authors put it as a question: someone saying "I like this" might make us feel good, "but the question
    remains, what does he like?" The additional reason for distrusting praise is that people will often
    offer positive feedback because they do not want to hurt someone''s feelings, not because they think
    the work is heading in the right direction. The prescribed handling is identical for both signs: thank
    the person, make sure you understand what is being communicated, review it against your known objectives,
    and follow up with questions — what do they love about it, why, and how does it apply to the goals,
    personas, scenarios and principles.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 156-157 and 161. Argument from the authors'' own definition of critique; the claim
    that people praise to avoid hurting feelings is asserted and connects to their culturally bounded
    material at pp. 66-67 rather than to any observation.

    '
  confounders:
  - assuming positive feedback needs no scrutiny because it costs nothing to accept
  - treating this as the sandwich argument; that is about deliberate framing, this is about unexamined
    praise
  - concluding the source distrusts all positive feedback — it argues at length for discussing genuine
    strengths
  requires_application_canon013: false
- qa_id: qa_disc_0026
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 22 and 37-38 (Ch. 2, 'The Two Sides of Critique' and 'Asking for feedback
    without listening')
  question: 'This source describes a way in which a team''s supply of useful feedback can decay over time.
    Describe the loop, and name the two distinct triggers it gives for it.

    '
  answer: 'The loop is that responding to requests for judgement is voluntary, so when responding is seen
    to be pointless, people stop. The source names two triggers. The first is on the recipient''s side
    in the moment: asking for feedback without being ready to listen — the critics pick up on the disinterest,
    feel uninterested in sharing their thoughts, and over time become less inclined to participate in
    these kinds of conversations at all. The second is downstream and slower: if discussions repeatedly
    fail to produce action and changes, the desire to participate wanes. The authors are careful about
    what they are claiming for a single session — "everything said in a critique is not going to produce
    a discrete modification to the design" — and locate the requirement at the level of the pattern: participants
    should feel overall that the discussion they contributed to will play a role in improving the design,
    not merely in changing it.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed p. 22 for the action trigger and pp. 37-38 for the listening trigger. Practitioner
    assertion with a stated mechanism; the decay is never quantified or observed in the book.

    '
  confounders:
  - assuming the fix is to act on every piece of feedback, which the authors explicitly do not require
  - collapsing the two triggers into one — one is about attention in the room, the other about outcomes
    over months
  - reading it as a morale claim rather than a claim about the supply of information
  requires_application_canon013: false
- qa_id: qa_disc_0027
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 118-120 (Ch. 5, 'Avoid Ta-Da Moments')
  question: 'You are running a critique on Thursday. This source says showing the work for the first time
    in the room is a mistake. Give its reason, and state the two constraints it puts on what you send
    beforehand and the one thing it says you are not trying to achieve by sending it.

    '
  answer: 'The reason is temporal: critical thought takes time. Participants need to think through the
    design, determine the effects they believe it will have, and compare those effects to the objectives
    — so a room asked to do that on the spot can only supply responses it has not thought through, which
    is reactive feedback by construction. Send the designs a couple of days ahead, under two constraints:
    limit what you send to only the aspects you plan to discuss, because sending more invites people to
    fixate on parts that are irrelevant to the session; and preface them with a few clear notes on what
    the critique will focus on and what you expect from participants. What you are not trying to achieve
    is participants arriving with their feedback ready — the source is explicit about this. The aim is
    to jump-start the critical thinking process before the conversation begins.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 118-120. Practitioner prescription with a stated mechanism; the authors concede
    that some people will not look at what was sent and that "no matter which route we choose, there will
    always be people who do their own thing".

    '
  confounders:
  - sending the whole design for context, which the source specifically warns against
  - asking people to come with their feedback prepared, which the source explicitly says it is not doing
  - concluding you cannot critique at all if nothing could be sent — the source's fallback is to pace
    the opening slower and start with small, discrete aspects
  requires_application_canon013: true
- qa_id: qa_disc_0028
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed p. 120 (Ch. 5, 'Avoid Ta-Da Moments')
  question: 'You sent the designs ahead as instructed, and someone has replied by email with a list of
    changes — the exact outcome you were warned about. What does this source tell you to do, both now
    and in the session?

    '
  answer: 'Reply acknowledging the feedback, tell the sender you have noted it and that you plan to address
    it in the critique session. Then in the session, revisit that person''s feedback and ask whether it
    is still relevant now that more of the design has been discussed. The source reports two outcomes
    from doing this: either the individual understands why the decisions were made and rescinds the feedback,
    or it gets discussed further and more understanding is gained. The authors'' stated reason for handling
    it this way is that it signals the feedback is not being dismissed while still keeping the conversation
    facilitated rather than fragmented across email. They are candid that this happened to them — Adam
    sent the sample notification email reproduced in the book and got feedback back in reply — and that
    the situation is not ideal, but treat it as an opportunity to improve facilitation rather than as
    a reason to stop pre-sending.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed p. 120. Practitioner prescription; the two reported outcomes are the authors'' experience,
    not a measured distribution.

    '
  confounders:
  - answering the change list on email, which reintroduces the channel problem the source describes at
    pp. 43-44
  - ignoring it until the session without acknowledging, which the source says would read as dismissal
  - concluding the pre-send was a mistake — the source treats this as a known cost of a practice it still
    recommends
  requires_application_canon013: true
- qa_id: qa_disc_0029
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 121-122 (Ch. 5, 'Present Your Work Quickly and Efficiently')
  question: 'Most people presenting work for critique try to explain every decision up front. This source
    says to do the opposite. Give both reasons it offers, and the rule it gives for choosing what to say
    instead.

    '
  answer: 'The first reason is that pre-empting every question overwhelms participants and eats the meeting''s
    time; the authors read the over-explanation as an attempt to foreclose questioning at all — "it''s
    as if we''re trying to avoid the potential for questions." The second is the more interesting one:
    when the details arrive in answer to questions, they are more closely tied to the participants'' own
    insights and questions, so the explanation lands where someone actually needed it. The rule for what
    to say instead is to focus on what is not obvious or cannot easily be seen — participants do not need
    to be told that the navigation is at the top of the page — and the authors'' usual way of doing that
    is to present the design from a user''s perspective. Give enough for the team to understand how the
    design is intended to work, no more, and if you feel the pace ran fast, say so and invite questions.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed pp. 121-122. This interlocks deliberately with the giving-side advice at printed p.
    26, where the source says the presenter "likely hasn''t explained everything. Actually… hopefully
    he hasn''t." Practitioner assertion with a stated mechanism.

    '
  confounders:
  - assuming the aim is to save time; the authors give the tying-to-questions reason as the more important
    one
  - reading it as a licence to present badly or vaguely — the requirement is that the team understand
    how the design is intended to work
  - conflating it with the constraints caution, which is a specific case with its own reasoning
  requires_application_canon013: false
- qa_id: qa_disc_0030
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 122-124 (Ch. 5, 'Be Careful When Talking About Constraints')
  question: 'A legacy system forced a compromise you are not happy with. Should you explain the constraint
    when you present? What does this source say, what is its reasoning, and what single exception does
    it grant?

    '
  answer: 'Not up front, in general. The source''s reasoning is about how it is received: your motive
    for mentioning the constraint is usually that it was frustrating and forced a decision you consider
    less than ideal, and participants often hear that as an excuse or as casting blame, with a negative
    effect on the tone and energy of the discussion. The prescription is to let the constraint surface
    through a question about why a choice was made, word it matter-of-factly rather than as blame, and
    if needed set up separate time for it; in some cases to defer it entirely until after the critique,
    following up with the person whose insight bears on it and bringing in someone who can explain the
    constraint and how it might be worked around. The single exception is where the constraint was discussed
    with the group in a previous conversation and you are presenting your solution to it — then it is
    part of the context the team needs, with the same caution about wording.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 122-124. Practitioner assertion about how disclosures land; no observation of
    differently-framed constraint disclosures is reported. The exception is narrow and is the only one
    granted.

    '
  confounders:
  - assuming transparency is always better and stating all constraints up front
  - concealing the constraint entirely, which the source does not advise — it moves the disclosure, it
    does not suppress it
  - generalising the exception to any constraint the team already knows about; the source's exception
    is specifically about presenting the solution to a previously discussed constraint
  requires_application_canon013: true
- qa_id: qa_disc_0031
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 126-128 (Ch. 5, 'Defining the Critique Scope and Goals')
  question: 'This source defines the scope of a critique as two things, not one. What are they, and what
    does the second one buy you that naming the components alone would not?

    '
  answer: 'The scope is the identification of the components of the design the team will be analysing
    AND the objectives against which they will be analysed. Naming only the components leaves each participant
    free to bring their own yardstick, which is the condition the source identifies as producing unusable
    sessions: participants analysing different aspects against their own criteria. Fixing the objective
    too is what makes the resulting judgements comparable to one another. The source''s examples are of
    the pair: one session focused on critiquing visual styles against a particular set of design principles,
    another on a specific sequence of screens against the relevant scenario and goals. Having set the
    pair, you also gain a defined place to steer back to when the conversation leaves it — with anything
    outside noted for a separate discussion rather than dropped.

    '
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 126-127. Practitioner definition with a stated mechanism. The four default session
    goals that follow from a scope are on p. 127.

    '
  confounders:
  - treating scope as an agenda or a list of screens, which is the half the source says is insufficient
  - assuming out-of-scope comments should be shut down; the source says note them and plan additional
    discussions
  - conflating critique scope with product scope — the source distinguishes them when discussing scope
    creep at p. 35
  requires_application_canon013: false
- qa_id: qa_disc_0032
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 127-128 (Ch. 5, 'Defining the Critique Scope and Goals' — reverse planning)
  question: 'A usability study on a new digital claims-filing flow is scheduled in a few weeks. Using
    this source''s reverse planning method, derive what you should critique now and why — and state the
    three steps of the method in the order it gives them.

    '
  answer: 'Reverse planning runs: start from what actions you want to be able to take after the conversation;
    ask what questions must be answered in the critique to take them; and let those questions tell you
    which aspects of the design to present and focus on. Applied to the source''s own worked case: because
    a usability study is coming, the action you want afterwards is to have the prototype be the best available
    reflection of the process and experience before it is tested. Since there is time to iterate before
    the study, a logical scope is the scenarios that use the new claims process. The goals the source
    derives are to identify the aspects that do not support the desired experience; to identify the aspects
    that most effectively produce it, so they can perhaps be expanded; and to identify where there is
    the most question or disagreement among the team, so the usability study can take those into account
    and perhaps build them into its plan. That third goal is the one usually missed: disagreement inside
    the team is treated as an input to the study''s design.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 127-128, which is the source''s own worked example. Practitioner method; no reported
    outcome from running it.

    '
  confounders:
  - planning forward from what is ready to show, which is what reverse planning replaces
  - scoping to the whole application because the study will cover the whole application
  - omitting the disagreement goal — treating internal disagreement as noise rather than as something
    a study can be pointed at
  requires_application_canon013: true
- qa_id: qa_disc_0033
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 128-129 (Ch. 5, 'Implementing Active Listening')
  question: 'What does this source mean by active listening, what does it say the technique verifies,
    and which follow-up question does it single out as particularly effective when your restatement turns
    out to be wrong?

    '
  answer: 'Replying to a piece of feedback by repeating it back as you have understood it, so the person
    who gave it can confirm whether your understanding matches what they meant. The stated reason is that
    vocabulary and understanding of terminology vary among participants, so a piece of feedback cannot
    be taken at face value as meaning the same thing to everyone. What it verifies is that the words were
    understood — not that the judgement is correct, which the source does not claim. When the restatement
    is wrong, the source singles out asking what would happen if the thing were left as it is: the authors
    say this prompts the participant to describe the effect on the user or the behaviours and actions
    that are undesirable, which can then be related to the product''s objectives. When the restatement
    is confirmed, the next move is to go into specifics — in their news-feed example, asking what in the
    current treatment gives it that prominence: placement, type size, something else.

    '
  answer_type: mechanism
  difficulty: easy
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 128-129, including the source''s worked dialogue. Practitioner technique with
    a stated mechanism.

    '
  confounders:
  - assuming the restatement establishes that the feedback is right
  - treating the technique as a politeness device rather than as verification
  - missing that the source's own worked dialogue ends with the product owner proposing a solution, which
    the authors do not flag despite their rule against it
  requires_application_canon013: false
- qa_id: qa_disc_0034
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 133-134 (Ch. 5, 'Taking Notes')
  question: 'This source rejects the common practice of participants taking their own notes and sharing
    them afterwards. Why, and what does the alternative buy that a good private record would not? What
    second, different record does it recommend keeping?

    '
  answer: 'Because each person''s notes are their own interpretation of what was discussed, and merging
    notes from a group is confusing and time-consuming. The alternative — one designated note-taker recording
    where everyone in the discussion can see what is being captured — buys something a private record
    cannot: participants can look at exactly what is being written and question or clarify it if it does
    not match their understanding, at the moment it is written and while the speaker is still present.
    It puts the record itself under the same confirmation loop as active listening. The second, different
    record is private: notes on how people participated during the session, kept unobtrusively because
    taking them publicly "would be pretty awkward", and used afterwards to see which facilitation techniques
    worked, who engaged and who did not, and who to invite to future critiques.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 133-134. Practitioner assertion with a stated mechanism; the claim that merging
    notes is confusing is the authors'' experience, not a comparison.

    '
  confounders:
  - assuming the point is completeness of the record; the point is that the interpretation is checkable
    while the speaker is present
  - reading the tools mentioned (an easel pad, Acrobat, InVision) as the requirement — the requirement
    is visibility during capture
  - conflating the two records; the participation notes are explicitly not public
  requires_application_canon013: false
- qa_id: qa_disc_0035
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 134-135 (Ch. 5, 'Using Third-Party Facilitators')
  question: 'A team new to critique is offered an experienced facilitator from outside the project. What
    does this source say they gain, what does it say they lose, and what does it recommend over time?

    '
  answer: 'They gain a neutral party who guides the conversation and keeps it in scope without contributing
    feedback, which frees the designer to capture notes, present, clarify points and answer questions.
    What they lose is specific and is the more interesting half: the designer is the person who will act
    on the insights and therefore the person best placed to know where clarification is needed and where
    the focus should shift, while a facilitator unfamiliar with the design decisions or the everyday workings
    of the project "might not be able to pick up on when something that is useful has been shared, or
    how to guide reactive or directive feedback to a place of being useful." The practical symptom is
    a lot of back-and-forth between designer and facilitator during the session. The recommendation over
    time is that as the team becomes comfortable with critique it should take on the facilitation itself.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 134-135. Practitioner assertion of a trade-off; no comparison of sessions run
    by insiders and outsiders is reported.

    '
  confounders:
  - assuming neutrality is unambiguously good, which is the position the source complicates
  - reading the recommendation as against outside facilitators generally; the source says they help while
    a team is starting
  - attributing the loss to the facilitator's skill rather than to their lack of project knowledge
  requires_application_canon013: false
- qa_id: qa_disc_0036
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 135-136 (Ch. 5, 'Having the Designer Present')
  question: 'Designs are circulated and the team is asked to send feedback in a few days; the designer
    is not in the loop. What does this source say every insight produced that way rests on, and what mitigation
    does it prescribe when the designer genuinely cannot attend?

    '
  answer: 'Assumptions — all of them. The source''s claim is that without the designer present, the people
    giving critique are forced to assume why certain decisions were made and cannot check, and the recipient
    inherits insights whose premises are unknown: "All the insights shared are based on assumptions, which
    is a shaky foundation upon which to base our iterations and improvement." The authors dramatise it
    with two lines a participant might think — that they could ask if she were here, and that they cannot
    know whether their critique is right because there is no one to state the goals or the problems being
    solved. The mitigation, where attendance is genuinely impossible, is the same one they prescribe for
    asynchronous channels generally: note in your feedback the assumption you are making, so the designer
    can first check whether it matches her actual objectives. They accept the cost explicitly — "there
    might be some wasted feedback, but that is one of the trade-offs."

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'Printed pp. 135-136, connecting to the channel argument at pp. 43-44. Argument from the authors''
    premises; the source says "whenever possible", which is weaker than a prohibition.

    '
  confounders:
  - reading it as a rule against any absentee review; the authors concede such situations occur and give
    a mitigation
  - assuming the problem is missing context that better documentation would supply — the missing thing
    is the ability to ask
  - treating stated assumptions as resolving the problem rather than as labelling it
  requires_application_canon013: true
- qa_id: qa_disc_0037
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 137-138 (Ch. 5, 'Review the Findings')
  question: 'After a critique, this source describes turning notes into work. What is the reframing step,
    why does it matter to the book''s central distinction, and what does the source say about the prioritisation
    that follows?

    '
  answer: 'The reframing step converts each note into an exploration rather than a change: "The news feed
    is too prominent, because…" becomes "Explore options for decreasing the prominence of the newsfeed…".
    It matters because it carries the book''s central distinction past the end of the session — the to-do
    that leaves the room is an instruction to explore, not an instruction to change, which keeps the option
    space open for the same reason the session refused to produce a change list. About the prioritisation
    that follows, the source is unusually candid: four considerations are offered — relevancy to the product''s
    objectives, immediacy from the project plan, amount of agreement among participants, and the source
    of the feedback and that person''s expertise — and the authors then add, in their own parenthesis,
    "(As Adam says, this is completely unscientific.)" It is one practitioner''s routine, and they say
    it changes with every project depending on team, culture and timeline.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 137-138. The reframing example and the four considerations are the authors'';
    the unscientific label is their own. Adam''s routine also begins by fixing typos, copy-paste errors
    and small alignment issues before anything is reframed.

    '
  confounders:
  - treating the four considerations as a method the source stands behind, which its own parenthesis disclaims
  - assuming the agreement heuristic is safe — the source offers no protection against it amplifying a
    shared blind spot
  - missing that the source-of-feedback consideration deliberately reintroduces the weighting that the
    'everyone is equal' rule excluded during collection
  requires_application_canon013: false
- qa_id: qa_disc_0038
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed p. 138 (Ch. 5, 'Review the Findings', step 4)
  question: 'Of the four steps in the source''s follow-up routine, which one concerns the items you are
    NOT going to act on, and what specifically does it require you to do? What is its stated reason?

    '
  answer: 'The fourth step. Go through the prioritised list and determine which items will not be addressed
    — the source is explicit that "just because something is said in a critique does not mean that something
    will change in the design as a result of it" — and, for those, note why. The stated reason is practical
    and forward-looking: "I need to be ready to answer why it wasn''t changed when it comes up in future
    discussions." The effect is that a declined item becomes a recorded decision rather than a silent
    omission, so it can be defended or revisited instead of being re-raised indefinitely. The source pairs
    this with a related discipline earlier in the follow-up: pull the open questions and assumptions raised
    in the session into a separate list, share them, and assign responsibility for chasing specific items.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'Printed pp. 137-138. Practitioner routine, presented as one person''s approach rather than
    as a method.

    '
  confounders:
  - assuming every collected item must be acted on
  - recording the decision but not the reason, which is the half the source emphasises
  - conflating declined items with the open-questions list, which is a different artifact for a different
    purpose
  requires_application_canon013: false
- qa_id: qa_disc_0039
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 125-126 (Ch. 5, sidebar 'The Facade of Authority' — Brad Nunnally)
  question: 'A facilitator asks a room of senior stakeholders to close their laptops and is refused. What
    does the sidebar in this book say that reveals, and what does it prescribe instead of personal authority?

    '
  answer: 'It reveals that the facilitator never had authority to lose. Brad Nunnally''s sidebar argues
    that taking the facilitator role confers no real authority — it is "only as strong as your personality
    and overall social presence", and "the true owners of the room are the participants of the session".
    In his own account, a wisecrack acknowledging he had no authority ended any prospect of compliance,
    and the design studio that followed produced shallow rounds of critique and no group consensus on
    direction or priority. What he prescribes instead is to become a group leader rather than an authority
    figure, and to vest authority in external artifacts: an outline and agenda shared in advance, which
    establish "a social contract between you, the facilitator, and the group of participants"; and a timetable
    reviewed with the group at the start, which "allows time to be the authority in the room, which you
    the facilitator are simply enforcing." The general form is that the more external artifacts you can
    use as sources of authority, the easier the conversation is to manage.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 125-126, a signed sidebar by Brad Nunnally — a different practitioner''s assertion
    carried inside this book. The evidence is a single recounted session, and the causal chain from the
    laptop exchange to the absent consensus is the narrator''s own reading.

    '
  confounders:
  - attributing it to Connor and Irizarry, whose own chapter says it is the facilitator's job to see the
    rules are adhered to
  - concluding the fix is a more assertive facilitator, which is what the sidebar argues against
  - reading the agenda as an organisational convenience rather than as a transfer of authority away from
    the person
  requires_application_canon013: true
- qa_id: qa_disc_0040
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: 'printed pp. 130-131 (Ch. 5, ''Adding Simple Structures: Round Robin and Quotas'')'
  question: 'Describe Round Robin and Quotas as this source defines them, and state the cost it attaches
    to both and the advice that follows from that cost.

    '
  answer: 'Round Robin is the facilitator going around the room in a specific, repeatable order, calling
    on and collecting feedback from each participant — which removes the question of who speaks first,
    reinforces that everyone should participate, and gives people predictability about when their turn
    comes. Quotas set a number of things each participant should bring, often two that are not working
    and one that is, with the formula varied to see what works. The cost the source attaches is social
    rather than analytical: some groups find these structures annoying because they seem too basic, or,
    as the authors have heard, "too grade-school". The advice that follows is to hold them in reserve
    — wait until a team clearly has difficulty getting a critique started before proposing them — and
    to note that Round Robin can be run without announcing it, kept by the facilitator as a private structure.
    They also advise against using Round Robin for a whole session, since it does not fit a natural flow,
    though it works at the end to catch what was not said.

    '
  answer_type: tradeoff
  difficulty: easy
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed pp. 130-131. Practitioner technique with a stated cost; no evidence is offered that
    either structure changes what is said, only that it gets a stalled group talking.

    '
  confounders:
  - adopting them as defaults for every session, which the source advises against
  - assuming the cost is that the feedback gets worse; the stated cost is that participants resent the
    format
  - reading Quotas as a rule that criticism must outnumber praise — the formula is meant to be varied
  requires_application_canon013: false
- qa_id: qa_disc_0041
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 132-133 (Ch. 5, 'Putting on the Thinking Hats (Lens-Based Analysis)')
  question: 'What is the constraint this source adds to lens-based analysis that makes it a focusing device
    rather than a role-play exercise? What does it say teams may do beyond de Bono''s six hats?

    '
  answer: 'The constraint is simultaneity: when using the Six Thinking Hats, team members all wear the
    same colour hat at the same time. That is what keeps everyone analysing the design through the same
    lens and keeps the conversation focused — if each person picked their own, the technique would just
    relabel the fragmentation it is supposed to cure. Beyond de Bono''s six, the source says teams can
    devise their own lenses to fit their context, and gives the example of using each persona as a lens:
    analysing the design for a particular scenario in the context of one persona''s needs, expectations
    and behaviours before moving on to another. The method itself is Edward de Bono''s and is credited
    to him; the same-lens constraint and the own-lenses suggestion are how this source puts it to work.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed pp. 132-133. The Six Thinking Hats method is attributed by the source to Edward de
    Bono and his book of that name; the framing here is the authors''.

    '
  confounders:
  - assigning different hats to different people, which is the common misuse and the opposite of what
    the source says
  - assuming the six hats are the source's own contribution
  - treating the red hat as an invitation to preferential critique — in de Bono's scheme as the source
    describes it, it is a bounded slot for feelings, hunches, fears, likes and dislikes
  requires_application_canon013: false
- qa_id: qa_disc_0042
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed p. 117 (Ch. 5, 'Who Should We Include?') and printed p. 78 (Ch. 4, 'Start Small')
  question: 'How many people does this source say can hold a single critique conversation, what is its
    reasoning about numbers generally, and what does it say to do when you must exceed the limit?

    '
  answer: 'About six. The source''s framing is to think about the maximum number who can carry on a single
    conversation without it splintering into side discussions, and in its experience that is around six.
    The general reasoning about numbers is stated in Chapter 4: the number of people involved has a direct
    effect both on how much effort it takes to manage the conversation and on each participant''s ability
    to follow along, which is why the source advises introducing critique with small groups — maybe just
    pairs — and growing from there as people become comfortable. If you are required to have more people,
    the source does not say you cannot critique; it says it is likely to take a bit more active facilitation,
    or the session may need to be broken into smaller groups. On who to include, it advises looking beyond
    the design team — developers, marketing, business analysts, product managers, subject-matter experts,
    project managers, executives — and notes that subject-matter experts need no design background, since
    understanding the need being designed for is what makes their input valuable.

    '
  answer_type: factual
  difficulty: easy
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed p. 117 for the number and the attendee advice, p. 78 for the start-small reasoning.
    "About six" is a practitioner estimate of when a conversation splinters, not a measured threshold.

    '
  confounders:
  - treating six as a hard cap rather than as the point where a single conversation stops holding
  - restricting critique to designers, which the source spends both chapters arguing against
  - assuming subject-matter experts need design literacy to contribute
  requires_application_canon013: false
- qa_id: qa_disc_0043
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 148-149 (Ch. 6, 'Using Laddering to Expand on Feedback')
  question: 'Laddering is repeated "Why?". What makes it a test rather than an interrogation in this source''s
    hands — and what constraint does it place on how the whys are worded?

    '
  answer: 'That it has two possible terminations and the source treats both as successes. Either the questioning
    uncovers what the person is trying to communicate in a way that ties back to the objectives of the
    product, or it leads them to realise that the feedback rests on their personal preference and motivations
    rather than the objectives — "and therefore it should be left alone and the conversation can move
    on." A procedure that can return either answer is a test; one that can only extract agreement is not.
    The wording constraint the source treats as decisive is that a bare "Why?" can be seen or interpreted
    as aggressive or accusatory, and that the sense grows significantly stronger with repetition — so
    the whys should be worded "in a way that is more akin to an invite for the individual to continue
    sharing." The source''s own worked chain runs from "I think we should use less blue" to a differentiation
    objective: almost all the competitors'' sites are some shade of blue.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 148-149, borrowed from design research and related by the source to the "5 Whys".
    The authors concede that discerning motivations "isn''t easy"; no case where laddering fails is shown.

    '
  confounders:
  - assuming the goal is to make the person retract the feedback
  - reading the preference outcome as a failure of the technique rather than as one of its two results
  - treating the wording caution as a courtesy; the source says the aggressive reading compounds with
    each repetition
  requires_application_canon013: false
- qa_id: qa_disc_0044
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 159-161 (Ch. 6, 'Dealing with Reactive Feedback')
  question: 'Someone reacts to your work with "This is horrible." Give the order of the two questioning
    steps this source prescribes, why that order, and the stopping rule it gives for when to abandon the
    attempt.

    '
  answer: 'First get specific: ask which aspects of the design are not working. Only then ask the whys
    and hows — why those aspects are terrible, and how that relates to the objectives of the design. The
    order matters for a reason the source states: making the reaction specific tells you which parts of
    the design the person is responding to, which lets you either focus the rest of the conversation on
    those parts or discover that they are reacting to something outside what you wanted feedback on, and
    steer them back. Asking "why" before knowing "about what" has nothing to attach to. The stopping rule
    is explicit: if someone is nonresponsive to your attempts at clarification, or gets no less difficult
    as the conversation progresses, that is a sign you will not make progress and it is not worth following
    up. Thank them, move on to another topic or another person, and take note of how they interacted so
    you know what to expect — in some cases collecting their feedback another way, and where the person
    is not part of the project, excluding them from future critiques.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 159-161. Practitioner procedure with a stated rationale for the ordering. The
    source also advises considering the source of the feedback: someone with a history of being a problem
    whose comments can be ignored, probably should be.

    '
  confounders:
  - asking 'why do you say that?' first, which the source's ordering puts second
  - assuming the reaction must be salvaged; the source explicitly permits abandoning the attempt
  - confusing the stopping rule with giving up on the person — the source suggests changing how their
    feedback is collected, not always exclusion
  requires_application_canon013: true
- qa_id: qa_disc_0045
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 104-107 (Ch. 4, 'The Challenges Design Reviews Pose to Critique'), restated
    printed p. 179 (Appendix A, 'Confusing Critique with Review')
  question: 'A team says it already critiques, because it holds a design review at the end of every phase.
    Give the three characteristics by which this source identifies a design review, and the four reasons
    it says a review is a poor host for critique. What does it recommend — and what does it not recommend?

    '
  answer: 'A design review is generally held toward the end of the design phase; it includes a goal of
    collecting approval from someone so effort can shift to a new focus; and where approval is not captured
    it focuses on identifying the changes needed to obtain it later. The four reasons it hosts critique
    badly: its intended outcome is approval rather than iteration; the feedback it collects therefore
    arrives as a list of what must change — "It isn''t ready yet, but if you do these things and show
    it to us again, we''ll give you the OK" — which is directive feedback by construction; the attendees
    are largely there to ensure their own interests survive into the final design rather than to compare
    it to its objectives, and the group is usually too large for a coherent conversation, Adam having
    once been in one with more than seventy people, most by phone; and the timing is set by the project
    plan, so it is both too late to use the feedback and disjointed from when the team actually needs
    analysis. What the source recommends is to critique regularly in the run-up so the review can serve
    its own purpose as a focused forum for approval, plus mitigations — take a lead role, recap the objectives
    at the start, use the difficult-people techniques. What it does not recommend is abolishing reviews;
    it says for some organisations collecting sign-off is essential, and its mitigations are damage limitation,
    not a conversion.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'Printed pp. 104-107, with the Appendix A restatement at p. 179 and the "Do not rely on design
    reviews for critique" instruction at p. 107. Practitioner argument with a stated mechanism; the seventy-person
    review is a single recollection.

    '
  confounders:
  - assuming the source wants design reviews eliminated
  - reading the difference as one of formality or attendee seniority rather than of intended output
  - assuming applying the critique techniques inside a review turns it into a critique; the source presents
    them as improving the feedback collected, not as changing what the meeting is
  requires_application_canon013: true
- qa_id: qa_disc_0046
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 84-87 (Ch. 4, 'When Should You Critique?' — Early critique, Later critique,
    Finding the sweet spot)
  question: 'This source bounds when critique is worth holding by two conditions rather than by a schedule.
    State both bounds and what each is a condition on. What is its position on the familiar "20 percent
    to 80 percent baked" shorthand?

    '
  answer: 'The opening bound is communicability: critique is premature until the maker has enough clarity
    about the idea to explain it to someone else — before that, "as soon as the first person asked us
    to clarify things, all we would be able to answer with is ''I don''t know''." The authors are careful
    that this does not require every detail to be settled; unanswered questions at that stage are expected.
    The closing bound is actionability: at the point where something must be let go so it can be produced,
    feedback can still be collected but cannot be used until the work comes round again. Between them
    is what the authors call the sweet spot, defined by immediacy — the designer can walk away, think
    about the insights, and begin iterating right away. On the percentage shorthand their position is
    explicit: such labels can be useful for talking about timing but "still have the possibility of being
    taken a bit too literally for our comfort", and the durations depend on the scale of the problem,
    the idea, the team and the process — "in some cases, you''ll get to that 20 percent mark very fast,
    maybe a matter of minutes or even seconds." They prefer understanding the two conditions and using
    judgement.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed pp. 84-87. The source explicitly refuses numeric boundaries — "we can''t say that
    the first point comes exactly two days after the idea begins to form". It also concedes critique after
    the closing bound is still possible and worth doing; the claim is about immediacy of use.

    '
  confounders:
  - adopting 20-80 as the source's rule, when the source names it in order to qualify it
  - assuming the opening bound requires a finished or detailed artifact
  - reading the closing bound as a claim that late critique is worthless rather than not immediately usable
  requires_application_canon013: true
- qa_id: qa_disc_0047
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 94-96 (Ch. 4, 'Building Better Brainstorms')
  question: 'A workshop is meant to produce lots of ideas and then pick one, and it reliably produces
    four. What does this source say is happening, what structure does it prescribe, and at exactly which
    point does it place critique — and why there?

    '
  answer: 'Critical thinking is happening when it should not be — the source calls it "the nemesis of
    creative or generative thinking" — and it suppresses ideas in two distinct ways. Participants who
    are analysing the ideas already proposed are not producing new ones; and participants who are producing
    ideas analyse them prematurely, decide they are not worth mentioning, and keep them to themselves.
    A third obstruction is that people are pushed into discussion before they have formed any view of
    the problem themselves. The prescribed structure divides the time into a divergent phase, whose activities
    minimise the chance to think critically — usually via a time limit and a challenge, such as sketching
    six to eight ideas in five minutes — and a convergent phase that compares, contrasts, consolidates
    and eliminates. Critique goes inside the second phase, before any vote. The reason is stated: voting
    participants otherwise use criteria that vary and may have little to do with the project''s goals,
    whereas running critique first "primes the pump" so that ideas are kept or eliminated on their strength
    against the agreed objectives, and consensus about which ideas are strongest is often visible before
    the vote is taken.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 94-96. The authors report the typical brainstorm pattern as their repeated observation
    — "we can''t say that we''ve often seen it work out that way" — with no count of sessions or ideas.

    '
  confounders:
  - placing critique after the vote, as a check on the winner
  - placing critique in the divergent phase to raise idea quality, which is the failure being diagnosed
  - assuming the source rejects brainstorming; it calls having many ideas 'a worthy and righteous goal'
    and objects to how brainstorms are run
  requires_application_canon013: true
- qa_id: qa_disc_0048
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 102-103 (Ch. 4, 'When Not to Use Design Studio')
  question: 'Half your team has framed the problem; the rest have not seen the framing. Someone proposes
    running a generate-and-critique workshop tomorrow. Using this source''s stated conditions, what happens
    if you proceed, and what does it say you should have done?

    '
  answer: 'The source names this as one of the specific conditions under which not to run the activity,
    and describes two ways it goes wrong. Either the group becomes mired in debating what the framing
    should be instead of generating ideas — an important discussion, the authors say, but one that should
    have happened earlier, and its arrival at the kickoff means the group is not ready — or you get people
    sketching without an agreed framing, in which case they generate ideas from their own individual opinion
    of what the problem is, and the critique rounds inside the workshop then break down "because people
    are analyzing and judging the value of ideas on different sets of criteria." That is the same foundation
    failure the book diagnoses everywhere else, appearing inside a workshop. What you should have done
    is hold the framing conversation beforehand. The source''s other stated conditions are: the problem
    not being adequately framed at all; a concept already existing that the team cannot or will not stray
    from; and participants unwilling to take part — where it advises trying, but not forcing.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 102-103. Written about one named methodology (Design Studio, credited to architecture
    and art-school studio teaching and to Todd Zaki Warfel''s adaptation); the reasons given are about
    framing, agreement, latitude and willingness rather than about the method.

    '
  confounders:
  - running the session and treating the framing debate as valuable use of the time
  - assuming the fix is a better facilitator
  - concluding these conditions are peculiar to Design Studio — the mechanism given for the second condition
    is the general foundation failure
  requires_application_canon013: true
- qa_id: qa_disc_0049
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 91-92 (Ch. 4, 'What Should You Critique?'), with the reflexive case at printed
    p. 18 (Ch. 1)
  question: 'Your team has just written a set of design principles. Can they be critiqued, and if so against
    what? Use this source''s claim about what does and does not change between different things being
    critiqued.

    '
  answer: 'Yes. The source''s claim is that the framework does not change no matter what is being critiqued
    — what are the objectives, what elements relate to them, are those elements effective, why or why
    not — and that what changes is the set of objectives the thing is analysed against. For design principles
    the yardstick is the best practices for making design principles, and the source names two of them:
    a good principle should help you eliminate more ideas than you pursue, and it should be specific,
    avoiding overly subjective and ambiguous terms like "fun". The reflexive move is stated explicitly
    in both places: any artifact made toward an objective is critiquable, including personas, scenarios,
    journey maps, and the tools, methodologies and processes a team uses — "Critique. All. The. Things."
    The source adds two refinements: some product objectives are pertinent to one artifact and not another,
    since a colour palette may or may not bear on a goal of increasing authenticated visits; and different
    aspects of a design carry their own objectives, usually as principles and best practices specific
    to interaction or visual design.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 91-92 and p. 18. The invariance is asserted rather than demonstrated across artifact
    types; the critique of design principles against best practices for principles is the only worked
    case the source gives.

    '
  confounders:
  - assuming critique applies only to visual artifacts — wireframes, comps, prototypes
  - concluding a different framework is needed for non-visual artifacts, which is what the source denies
  - using the product's business goals as the yardstick for the principles, when the source's yardstick
    here is the best practices for writing principles
  requires_application_canon013: true
- qa_id: qa_disc_0050
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 153-154 (Ch. 6, 'The sandwich method')
  question: 'What position do these authors take on the feedback sandwich, and what exactly do they keep
    from it? Give their three objections.

    '
  answer: 'They describe it — positive, negative, positive — state the rationale offered for it, and then
    decline it while keeping the practice underneath. Their three objections: in practice the positive
    comments are superficial or vague, about a quality unrelated to what is being discussed or about no
    real strength at all, and most people see through them, so the opening praise "does little more than
    signal that something bad is coming"; because more cognitive energy and attention goes to processing
    negative situations than positive ones, the initial positives are forgotten as soon as the negative
    arrives; and for some people the whole method feels manipulative. What they keep is the balance: discussing
    strengths and weaknesses matters, and starting on a positive note can help set tone. Their condition
    is the operative part — the positive comments must be about real strengths, aspects thought about
    critically and believed effective and important to the objectives, "not just things we came up with
    at the spur of the moment to make a weakness we want to point out easier to handle." Their summary
    instruction: "Don''t worry about the ''sandwich''. Be honest with the recipient. Balance the conversation."

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 153-154. The authors refer to "research that it doesn''t work" without citing
    any; no reference, note or bibliography for it appears anywhere in the book, and the asymmetric-processing
    claim is likewise uncited. The position is theirs, argued, not measured.

    '
  confounders:
  - reading the rejection as 'do not say positive things', which inverts the authors' own instruction
  - treating the cited research as established because the authors invoke it — they name no source
  - conflating this with their separate argument for discussing strengths (pp. 29-30), which rests on
    reuse and on preventing silent regression, not on softening criticism
  requires_application_canon013: false
- qa_id: qa_disc_0051
  source_id: connor-irizarry-discussing-design
  source_title: 'Adam Connor and Aaron Irizarry, Discussing Design: Improving Communication and Collaboration
    through Critique (O''Reilly, 2015)'
  source_locator: printed pp. 29-30 (Ch. 2, 'Talk about strengths'), reinforced printed p. 178 (Appendix
    A, 'Focusing on What Isn't Working')
  question: 'Give the two reasons this source offers for discussing what works, neither of which is about
    making criticism easier to hear. Which of the two is a claim about what happens across iterations?

    '
  answer: 'The first is reuse: when the team talks about aspects that are working, the designer can examine
    those areas and abstract the concept or element behind them, then use it to strengthen other areas
    that are working less well. The authors tie this to their view that design proceeds by deconstructing
    and abstracting ideas and recombining them. The second is the one about iterations: with the understanding
    that the designer will iterate after a critique, an aspect that seemed effective but was never discussed
    carries no reason for the team not to change it, so it can be lost in the next revision without anyone
    noticing it was load-bearing — the authors pose it as the situation of arriving at the next critique
    to find a previously strong aspect has been changed and is no longer as effective. Both are stated
    explicitly as being separate from the common argument that positives make critical feedback easier
    to take, which the authors treat elsewhere and largely reject.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 29-30, reinforced in Appendix A where the suggested structure is two things working
    and two causing concern. The regression argument is put as a rhetorical question rather than as a
    reported occurrence, and "we spend the vast majority of time talking about what isn''t working" is
    asserted with no count.

    '
  confounders:
  - giving the morale answer, which is the argument the authors are distinguishing themselves from
  - assuming the reuse argument is about reusing components rather than about abstracting why something
    worked
  - missing that the regression claim depends on iteration actually following the critique
  requires_application_canon013: false
