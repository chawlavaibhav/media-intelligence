# Luke Sullivan, Hey Whipple, Squeeze This (6th ed., Wiley, 2022) — SPEC-04 OperationalBindings
# EXPERIMENTAL — NOT LIVE CANON. Lane: sullivan-hey-whipple, book-expansion-qa-v1. Non-merge.
#
# THE GAP, STATED ONCE AND REPEATED IN EVERY applicability.limits:
# This source is about advertising made by people, for paid and earned media, judged by a
# practitioner on professional and aesthetic grounds. It contains no measurement of any kind that
# would license a threshold, and its author explicitly rejects the testing of creative work. Every
# binding below therefore proposes his diagnostics as CHECKABLE QUESTIONS TO PUT TO AN ASSET, never
# as pass/fail criteria and never as evidence of effectiveness. Applying any of it outside
# human-made advertising is OUR extrapolation and is marked evidence_basis: extractor_inference.
#
# NO creative_ir binding is written. SPEC-01 was not supplied to this lane, so no target_path could
# be named honestly, and the schema contract forbids inventing one.
# NO governance binding is written: nothing in this source addresses taxonomy, retrieval, conflict
# resolution, evidence interpretation, rule application or cross-source synthesis, and a binding
# that fits none of the permitted consumers is not a governance binding.
# Per the schema contract, neither cross_source_supported nor empirically_supported appears anywhere.
#
# NOTHING HERE IS TRANSLATED INTO A MODEL INSTRUCTION. Two remedies in this lane are
# executable_by: physical_production (t_whip_0038, t_whip_0039). They are recorded in the source's
# own frame and left unbound, exactly as SPEC-04 requires.

source_id: sullivan-hey-whipple

operational_bindings:

- binding_id: bnd_whip_001
  source_knowledge_refs: [sk_whip_0001, sk_whip_0003, sk_whip_0004, sk_whip_0053]
  source_system_refs: [scs_whip_001]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, flags]
  observation_unit: whole_asset
  rationale: >
    The Canon currently has no way to ask whether a still asset has a single centre of attention or
    several competing ones. This source's model supplies a question that can actually be put to a
    finished piece — count the elements competing for salience, identify which one the maker intended
    the viewer to start from, and ask whether one was designated at all. The value is that the
    question is answerable by inspection and its answer is reportable; the model behind it is not
    imported as a rule, and the referenced objects carry the claim itself.
  applicability:
    when: "reviewing a single composed still asset that carries more than one element and is intended to be understood quickly"
    limits: >
      The source is a practitioner writing about print advertisements and billboards encountered by a
      person who did not seek them out. He offers no measurement of salience, no threshold for element
      count, and concedes he reached his own ideal — one element — once in a career. Reporting how
      many elements compete and whether an entry point was designated is defensible; treating a high
      count as a defect, or a low one as quality, is not something this source supports. Applying any
      of it to generated imagery is our extension of a claim made about human-made layouts.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_whip_0001]
  repair_ontology_refs: [t_whip_0017, t_whip_0021, t_whip_0018]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_whip_002
  source_knowledge_refs: [sk_whip_0032, sk_whip_0043, sk_whip_0048]
  source_system_refs: [scs_whip_006]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  observation_unit: whole_asset
  rationale: >
    The see-say is the most mechanically checkable diagnostic this source provides: read the text,
    describe the image, and ask whether the second restates the first. That question can be asked of
    any asset that pairs words with a picture, and unlike most of the material in this lane it does
    not require the reviewer to share the author's taste. The referenced objects hold the claim about
    why duplication costs anything.
  applicability:
    when: "an asset carries both a text element and an image element and both are intended to carry meaning"
    limits: >
      The source's own boundary is soft: his preferred pattern still requires the straight element to
      add something — to amplify emotional force or finish a thought — and he supplies no test for
      where support becomes restatement. So the diagnostic reliably identifies exact duplication and
      is a judgement call everywhere else. It is stated for print advertising by a practitioner and
      has no measurement attached.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_whip_0004]
  repair_ontology_refs: [t_whip_0021]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_whip_003
  source_knowledge_refs: [sk_whip_0030, sk_whip_0031, sk_whip_0021]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [flags]
  observation_unit: asset_set_over_time
  rationale: >
    This source's argument about worn imagery is comparative and its unit is a category, not a piece:
    an image is not tired in itself, it is tired relative to what a competitive set is already doing.
    That makes the useful operation a corpus comparison — assemble what the category is currently
    running and flag where a candidate asset lands inside it — rather than an inspection of the asset
    alone. Recorded because the Canon has no notion of category-relative distinctiveness at all.
  applicability:
    when: "a candidate asset can be compared against a assembled sample of current work in the same commercial category"
    limits: >
      The source's own examples are American category conventions of his period and he gives no
      method for assembling the comparison set or for deciding how close is too close. He also
      explicitly permits reuse of familiar imagery where it is re-angled to carry a product
      advantage, so a flag here is a prompt to look, never a defect. Nothing in the source measures
      the effect of distinctiveness on anything.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_whip_0006, t_whip_0007]
  repair_ontology_refs: [t_whip_0026, t_whip_0030]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_whip_004
  source_knowledge_refs: [sk_whip_0033, sk_whip_0034, sk_whip_0035, sk_whip_0036]
  source_system_refs: [scs_whip_005]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, flags]
  observation_unit: whole_asset
  rationale: >
    What makes this group operationally interesting is that its members are surface features a
    reviewer can enumerate without interpretation — exclamation points, asterisked claims, invented
    personal names, model numbers in headlines, "real"-prefixed reassurances, stock-photograph
    tropes. The referenced objects supply the reasoning for why the source treats each as a tell. The
    binding proposes only the enumeration and the flag, because the inference from presence to
    audience reaction is the source's and is untested.
  applicability:
    when: "an asset carries copy and the reviewer can enumerate its punctuation, qualifiers, named persons and identifier strings"
    limits: >
      The source asserts how readers respond to these signals and cites nothing. His historical
      account of why — an American collapse of institutional authority — is a sweeping cultural
      narrative with no evidence attached and does not transfer to other markets. Flagging presence
      is safe; concluding that an audience discounted the claim is not supported.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_whip_0010, t_whip_0008]
  repair_ontology_refs: [t_whip_0023, t_whip_0037]
