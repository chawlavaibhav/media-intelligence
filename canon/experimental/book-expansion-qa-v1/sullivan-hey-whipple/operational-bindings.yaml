- binding_id: bnd_whip_005
  source_knowledge_refs: [sk_whip_0060, sk_whip_0001]
  source_system_refs: [scs_whip_001]
  target_type: benchmark
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [evaluates]
  observation_unit: null
  governance_consumer: null
  rationale: >
    Two of this source's tests are procedures with a stated stimulus and a stated response, which is
    unusual in a book of this kind and is what makes them usable as a repeatable exercise rather than
    as an opinion: expose a layout for two seconds, withdraw it, and record what a viewer reports;
    and inspect the same layout from ten feet. Recorded as a benchmark because what it produces is a
    comparable observation across assets, not a verdict on any one.
  applicability:
    when: "comparing candidate short-form or out-of-home layouts where comprehension inside a very short exposure is the property of interest"
    limits: >
      The source offers these as informal studio checks, not as an instrument. There is no sample, no
      protocol, no scoring and no baseline, and the associated word count he quotes — about seven, up
      to ten or eleven — is reported as something that has been said rather than measured. Any use of
      this must report it as a rough exercise inherited from practice, and its results are not
      evidence about effectiveness.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_whip_0001, t_whip_0002]
  repair_ontology_refs: [t_whip_0024, t_whip_0040, t_whip_0017]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_whip_006
  source_knowledge_refs: [sk_whip_0010, sk_whip_0009]
  source_system_refs: [scs_whip_002]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [evaluates]
  observation_unit: asset_set_over_time
  rationale: >
    The compressibility sign in this source is the rare check here that has a mechanical form: state
    the governing premise of a body of work in one sentence and see whether the sentence holds. It
    is worth recording because it applies to a set rather than a piece — the question is whether
    several executions share one legible premise — and the Canon has no way of asking that. The
    second sign the source gives is social and is not proposed for binding, for the reason in limits.
  applicability:
    when: "reviewing several executions intended to belong to one campaign or platform, and asking whether they share a premise a reader could state"
    limits: >
      The source hedges the sign himself, calling it kind of weird, and offers the whole formula it
      sits inside as a tool rather than a rule. His second sign — that a working platform starts
      talking and other people spontaneously generate executions — is confounded by who is in the
      room and by the enthusiasm of whoever is presenting, and is deliberately excluded from this
      binding. All supporting cases are classroom work or campaigns described after their success.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_whip_0031]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_whip_007
  source_knowledge_refs: [sk_whip_0038, sk_whip_0066, sk_whip_0067]
  source_system_refs: [scs_whip_005]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [evaluates, flags]
  observation_unit: whole_asset
  rationale: >
    The interesting property of this group is its ordering, not its content. The source's own
    sequence puts a conformance question first, a distinctiveness question second, and an
    overriding relevance question last — and says the last survives when every other rule in his book
    is thrown away. Recording the ordering is the point: it is a prompt to ask "and is it relevant to
    this audience" after, not before, any judgement about how striking the work is.
  applicability:
    when: "an internal review of finished or near-finished work that has already satisfied its brief"
    limits: >
      Two of the three questions are answered by prediction, not observation: whether people would
      talk about it and whether the press would cover it are guesses about the future. The source
      supplies no test whatever for the relevance constraint he makes overriding, and separately
      concedes that genuinely new work cannot be judged by its maker at all. This binding therefore
      proposes a checklist ordering, not a scoring instrument, and must not be reported as one.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_whip_0005, t_whip_0014]
  repair_ontology_refs: [t_whip_0029, t_whip_0032]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_whip_008
  source_knowledge_refs: [sk_whip_0037, sk_whip_0055, sk_whip_0056]
  source_system_refs: [scs_whip_007]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, repairs]
  observation_unit: whole_asset
  rationale: >
    Two of this source's copy tests share one structure — remove a unit and see whether the whole
    still stands — applied at different scales, and one of them inverts the usual direction of blame
    by treating explanatory copy as a symptom of a failed headline rather than of bad copy. That
    inversion is what is worth binding: it tells a reviewer where to look, which is upstream of where
    the problem is visible.
  applicability:
    when: "an asset carries body copy beneath or beside a headline"
    limits: >
      The source is prescribing craft for advertising copy read by a person who has already been
      stopped by something else. The no-removable-sentence target can be met by a tightly written
      piece that says nothing, which he does not address, and the cut-by-a-third proportion is a
      working rule of thumb rather than a measured optimum. None of this has any measured effect
      attached, and none of it should be applied to copy whose function is instructional or legal.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_whip_0009]
  repair_ontology_refs: [t_whip_0020, t_whip_0022, t_whip_0021]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_whip_009
  source_knowledge_refs: [sk_whip_0011, sk_whip_0013, sk_whip_0014]
  source_system_refs: [scs_whip_002]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  observation_unit: sequence
  rationale: >
    This source supplies a structural question about narrative assets that can be asked without any
    judgement of quality: is there an opposing force present, and if not, does the piece open at the
    resolved state? Its unit is a sequence rather than a frame, and it is recorded because the
    Canon's existing advertising material — reason-why in tradition — contains nothing about dramatic
    structure at all. The referenced objects hold the argument for why the absence matters.
  applicability:
    when: "reviewing a time-based or multi-beat asset that is meant to hold attention across its length"
    limits: >
      The source's supporting mechanism is borrowed from a screenwriting manual and from a trade
      book's argument about interspecies alarm calls; neither is evidence about advertising. He also
      qualifies himself in the text — this is not an argument for negative advertising — and his
      exemplars are three of the most celebrated campaigns of their decades, with no case discussed
      in which conflict was present and the work still failed. Presence or absence of an opposing
      force is observable; its consequences are not established here.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_whip_0032]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_whip_010
