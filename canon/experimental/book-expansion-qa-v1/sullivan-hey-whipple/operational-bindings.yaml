- binding_id: bnd_whip_012
  source_knowledge_refs: [sk_whip_0005, sk_whip_0040]
  source_system_refs: [scs_whip_003]
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  observation_unit: whole_asset
  rationale: >
    What this source contributes here is not the advice but the two-sided failure structure: work can
    fail by being obvious and by being incomprehensible, and the two are repaired in opposite
    directions, so a single "make it better" note is always underspecified. Binding the pair means a
    reviewer must say which side an asset has fallen off, and the two named rebuttals give a second
    axis — credibility and relevance — with the same property.
  applicability:
    when: "recording why a reviewer rejected an asset, where the reason could be either obviousness or opacity"
    limits: >
      Neither axis is measurable and the source says so: finding the borders of the overlap is where
      essentially all the working time goes, and nothing tells the maker where they lie in a given
      case. He also concedes the incontestability advice does not apply to products with no real
      difference worth claiming. This binding therefore structures a rejection note; it does not
      evaluate anything on its own.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_whip_0014, t_whip_0007]
  repair_ontology_refs: [t_whip_0019, t_whip_0029]
  status: proposed
  status_reason: "experimental; not reviewed"
