  observation_unit: null
  governance_consumer: null
  rationale: >
    Recorded as a production candidate because what this source describes is a way of organising
    human working time: wide cheap exploration first, volume before selection, judgement deferred to
    a separate cold pass, and clustering of survivors to find the shared premise. It is the source's
    account of a studio practice, and it is recorded in that frame. It is NOT rewritten as a
    generation strategy, a sampling policy or any instruction to a system, and nothing here is
    evidence that any such translation would work.
  applicability:
    when: "planning how a human team spends time on an open-ended creative assignment"
    limits: >
      Every number in it is the author's own practice and none is measured: the hundred lines, the
      three-hour session, the fifty-versus-ten discard rate. The account is drawn from one career in
      American agencies from 1979 onward, and the source states plainly that whatever process a
      reader arrives at is their own and that he is describing his. The unification of four chapters
      into a single cycle is ours, not his — see scs_whip_004's system_level_uncertainty.
  evidence_basis: extractor_inference
  empirical_refs: []
