  rationale: >
    The triage rule in this source is the transferable part of its chapter on revision: distinguish
    changes that alter surface from changes that remove something load-bearing, concede the first
    class and argue only the second, and abandon the work once enough of the second class has
    landed. Recorded as a human working practice for handling review feedback, in the source's own
    frame, and left unbound to any system.
  applicability:
    when: "responding to a round of review comments on creative work where some comments affect surface and some affect structure"
    limits: >
      This is advice for a client-service business in which, as the source states, the client has
      paid for the right to their opinion. It presumes a commissioning relationship and a single
      identifiable idea to protect. The associated arguments against creative testing are the
      source's position, offered by him as ammunition for a conversation rather than as findings, and
      they come from the party whose work such testing evaluates — which he does not raise.
