- sk_id: sk_whip_0041
  source_id: sullivan-hey-whipple
  source_terms:
    - "what many agencies and clients start with isn't truth, but facts"
    - "the central human truth"
    - "clients don't own the brand and they don't own the truth; customers do"
  concept_label: a_fact_about_the_product_is_not_the_same_thing_as_a_truth_about_the_customer
  label_origin: extractor_assigned
  claim: >
    Sullivan distinguishes facts from truths and says the distinction decides whether a campaign has
    anywhere to go. Facts are measurable and fit on charts, which is why clients like them, and he
    argues nobody cares about them: his standing example is "milk builds strong bones", a fact
    everyone has heard since childhood which changes no behaviour. A truth is what is undeniably and
    universally the case about the product, the category or above all the customer, and he reports
    that the campaign which sold milk by the trainload came from ethnographic observation producing
    a different kind of finding — that milk is bought because it goes with things. He adds two
    consequences: a truth is generally known instinctively rather than researched, and clients
    frequently pay to uncover truths and then cover them back up.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A product fact describes the object; a truth describes the buyer's actual relationship to it,
      which is where the purchase is decided. Sullivan gives the behavioural evidence in the milk
      case: nobody sits down to a bowl of milk, so the product's real role is as an accompaniment,
      and a message built on that role matches how the purchase is actually made.
  scope:
    domain_discussed_by_source: [advertising, brand_communication, persuasion]
    conditions: "the strategy and messaging stage, before concepting"
  caveats:
    - text: "the source says you generally know a truth instinctively and will know it when you hear it, which supplies no way for two people to settle a disagreement about which candidate truth is the real one"
      origin: source_stated
    - text: "the milk case is a single celebrated campaign reported second-hand; the inference from its research method to a general rule about facts and truths is the source's"
      origin: extractor_observed
    - text: "he recommends stand-up comedy as a source of human truths, which is a route to sharply observed generalisations about a comedian's own audience, not to findings about a client's customers; the source does not note the difference"
      origin: extractor_observed
  source_stated_problems:
    - "clients generally love facts because they can measure them — plus, they fit on charts"
    - "nobody cares milk builds strong bones"
    - "many clients will spend massive amounts of time and money to uncover brand truths and then — frightened by the results — proceed to cover them back up"
  source_stated_remedies:
    - "find the truest thing you can say about your product or brand; explore the truths about the product, the brand, and the whole category"
    - "look for the truest things you can say about your customer — the central human truth"
    - "read past the demographics; find the emotion"
  examples:
    positive: [{description: "got milk? — researchers placed in paid participants' homes to shop and cook with them, producing the finding that milk is bought because it goes with things", figure_ref: "Figure 3.5"}]
    counter: [{description: "'Milk builds strong bones' — a fact on a chart the source says nobody has ever acted on", figure_ref: null}]
  intra_source_relations:
    - {relation: depends_on, target: sk_whip_0012, note: "the truth is the first term of the platform formula"}
    - {relation: qualifies, target: sk_whip_0040, note: "supplies the material that makes a message incontestable"}
    - {relation: member_of_system, target: scs_whip_003}
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given, anecdotal]
    source_uncertainty: none
