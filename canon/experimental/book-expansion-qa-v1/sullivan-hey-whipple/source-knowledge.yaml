- sk_id: sk_whip_0047
  source_id: sullivan-hey-whipple
  source_terms:
    - "show, don't tell"
  concept_label: demonstration_outperforms_assertion_and_can_remove_the_need_for_a_headline
  label_origin: extractor_assigned
  claim: >
    Sullivan states that telling people something is never as powerful as showing them, and draws a
    consequence about layout rather than only about persuasion: because the demonstration advertisement
    shows rather than tells, it does not need a clever headline. His strongest example inverts the
    usual relation between an advertisement and its medium — a magazine's own cover photograph, made
    with the advertised product, presented on the back cover with a line stating only how it was
    taken. He gives a second case where what is shown is the cause and the reader supplies the
    consequence: the mental image an anti-slip skate advertisement paints of children landing on
    their backsides, which he says is more powerful than showing them that way.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A demonstration is evidence rather than a claim, so it does not have to be believed on the
      advertiser's authority — which connects it to his broader argument about the collapse of
      authority. His second example adds the participation mechanism: what is withheld and completed
      by the reader lands harder than what is depicted.
  scope:
    domain_discussed_by_source: [print_advertising, advertising_concept_development]
    conditions: "products whose benefit can be exhibited; the source does not claim every product can be demonstrated"
  caveats:
    - text: "the two worked cases are reproduced advertisements the extraction could not see, and the argument turns on what those images do"
