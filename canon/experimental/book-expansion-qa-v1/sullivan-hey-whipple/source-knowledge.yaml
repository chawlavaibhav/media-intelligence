- sk_id: sk_whip_0059
  source_id: sullivan-hey-whipple
  source_terms:
    - "an idea isn't finished until it leads the customer somewhere"
    - "make sure every piece in the campaign makes sense all by itself"
  concept_label: each_piece_must_be_self_sufficient_and_must_end_by_moving_the_reader
  label_origin: extractor_assigned
  claim: >
    Sullivan states two completion conditions that both follow from the same fact: the maker does not
    control the order in which a customer meets a campaign. Because there is no walking a customer
    through a portfolio saying which piece comes first, every single element must be completely
    understandable and whole in and of itself. And because a piece that resolves and stops leaves the
    reader at a dead end, every piece — web page, bill stuffer, video — should end with a call to
    action, whether that is finding more information, downloading something or joining a group.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Encounter order is uncontrolled, so any piece may be the first one. The self-sufficiency
      requirement is the consequence, and he gives the image for it: each cell contains the DNA for
      the whole organism.
  scope:
    domain_discussed_by_source: [brand_communication, advertising_concept_development, copywriting]
    conditions: "multi-piece campaigns across media"
  caveats:
    - text: "the self-sufficiency requirement is in tension with his enthusiasm for platforms whose later executions gain from the earlier ones, and with the long open-ended brand story he describes in the storytelling chapter; the source does not reconcile them"
