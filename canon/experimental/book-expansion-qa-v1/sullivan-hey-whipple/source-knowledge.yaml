- sk_id: sk_whip_0036
  source_id: sullivan-hey-whipple
  source_terms:
    - "Official Marketing Bullshit mode"
    - "stop 'writing ads'; don't write, talk"
    - "the bar stool test"
  concept_label: the_business_register_is_a_failure_mode_and_the_bar_stool_test_detects_it
  label_origin: extractor_assigned
  claim: >
    Sullivan holds that being asked to write for publication makes most people adopt a scholarly,
    authoritative register in the belief it is more persuasive than plain English, and that the
    resulting voice communicates nothing. He supplies a portable diagnostic: imagine sitting with a
    friend in a bar who asks why they should use the product, and try to say your line to her face
    with a straight expression. Copy that cannot survive that delivery has failed. He demonstrates
    with a real 143-word corporate memo whose entire content was a nine-word sentence, and with the
    generic restaurant line he says most briefs produce.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The test works by changing the audience from an imagined public to a specific person who can
      react. Sullivan's stated reason is that the register is adopted for an audience the writer
      cannot see, and that a visible listener makes its emptiness audible. He recommends the same
      move structurally — write the copy as a letter to one named person, then delete the salutation
      — reporting that this was how a famous brand voice was actually produced.
  scope:
    domain_discussed_by_source: [copywriting, brand_communication]
    conditions: "any brand copy; the source applies it to headlines, body copy and brand voice alike"
  caveats:
    - text: "the bar-stool test detects a register failure but says nothing about whether the claim is true or the strategy right; the source does not claim otherwise but the test is easily over-read"
      origin: extractor_observed
    - text: "the conversational register he prescribes is itself a convention of a particular market and period, not a neutral default"
      origin: extractor_observed
  source_stated_problems:
    - "we seem to default to a kind of Official Marketing Bullshit mode we think sounds impressive but actually telegraphs overly packaged half-truths"
    - "four out of five people decide a scholarly and authoritarian tone is somehow more persuasive than clear English"
    - "companies that speak in the language of the pitch, the dog-and-pony show, are no longer speaking to anyone"
  source_stated_remedies:
    - "pretend you're talking to an actual human being who's capable of detecting bullshit"
    - "write like people talk; obey the rules of grammar and go easy on the adjectives"
    - "pretend you're writing a letter — put 'Dear Charlie' at the top and your name at the bottom, then delete them"
  examples:
    positive: [{description: "the reported method behind a famous car brand's copy voice: written as a letter to a named friend, then with the salutation and sign-off removed", figure_ref: null}]
    counter: [{description: "a 143-word corporate memo whose entire content was 'the program was killed because it was too costly'; and the brief-derived restaurant line 'you'll discover how flavors of ancient Italy tantalize your tongue'", figure_ref: null}]
  intra_source_relations:
    - {relation: demonstrated_together_with, target: sk_whip_0035, note: "the same inauthenticity failure, at the level of register"}
    - {relation: generalises, target: sk_whip_0054, note: "the craft rules for conversational copy follow from this"}
    - {relation: member_of_system, target: scs_whip_005}
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, mechanism_given, argued, repeated_within_source]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: "Ch. 3 — Tell the Truth and Run; and Ch. 5 — Brevity Is the Soul of Wit"
    section: "Ch. 3, 'To thine own brand, be true.'; Ch. 5, 'Or pretend you're writing a letter.' and 'Write like people talk.' (spines 13, 17)"
