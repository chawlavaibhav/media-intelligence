  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Reading order is not self-organising; if the makers have not decided where the reader starts,
      the reader decides, and the sequence the idea depends on is not delivered. The quoted
      formulation is about the makers reaching an explicit agreement, which makes it a working
      practice as much as a design property.
