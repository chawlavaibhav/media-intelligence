      origin: source_stated
    - text: "the empirical material here is reported second-hand from three trade books and a survey, and the sales attribution to the campaign specifically is not established by anything he cites"
      origin: extractor_observed
    - text: "the claim that the creative route reaches the same commercial destination is asserted and is the least defended step in the argument; no comparison of outcomes between the two schools is offered anywhere in the book"
      origin: extractor_observed
  source_stated_problems:
    - "I'm appalled by those who judge advertising exclusively on the basis of sales"
    - "if sales are achieved with work which is in bad taste or is intellectual garbage, it shouldn't be applauded no matter how much it sells"
