- sk_id: sk_whip_0070
  source_id: sullivan-hey-whipple
  source_terms:
    - "make the idea bigger, not the logo"
    - "the intersection between your story and your brand"
    - "Do > Invite > Capture > Share"
  concept_label: branded_content_must_satisfy_entertainment_and_marketing_at_once_and_its_platform_specifics_are_dated
  label_origin: extractor_assigned
  claim: >
    Sullivan's account of branded content has a durable core and a datable surface, and he marks the
    boundary himself in places. The core claim is that the work must satisfy two criteria at once:
    focus too much on the narrative and viewers may enjoy it without receiving any brand message, so
    the entertained audience must not leave without knowing the brand was involved. He states the
    strong form of the requirement — the idea cannot be a "brought to you by" attachment; it must
    come from and carry the brand's own material, and be relevant to the audience — and reports PJ
    Pereira's test: if it is impossible to talk about the idea without the brand, yet interesting
    enough to generate buzz, you have something. He records Edward Boches's participation sequence —
    do something interesting that communicates the brand's value, invite people into it, capture what
    they make, make it shareable — and notes the hard step is the first, which requires an idea worth
    advertising rather than an advertising idea. He states a bounding condition: whenever customers
    are asked for time or effort there must be a payoff commensurate with what was asked, or usage
    rates are very low. Everything platform-specific around this core — hashtag ceilings, which
    network's features to exploit, the stock-and-flow content vocabulary he footnotes as already out
    of use, the influencer arrangements — is contingent on the state of specific commercial platforms
    at the time of writing.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The two criteria pull against each other because the entertainment must be good enough to be
      chosen voluntarily while the brand must remain inseparable from it. Sullivan's own image is
      giving a dog a pill: the medicine cannot sit beside the treat, the two have to be one thing. The
      participation sequence works by converting the audience into producers, which he says yields
      material that can outlast and outgrow the original idea.
  scope:
    domain_discussed_by_source: [brand_communication, short_form, advertising_concept_development]
    conditions: "content a customer chooses rather than encounters; the durable claim is about the double criterion, not about any platform"
  caveats:
    - text: "everything in these chapters that names a platform, a feature, a format limit or a content-scheduling vocabulary is contingent on the commercial platforms of the writing period and must not be read as durable; the source himself footnotes one of his own terms as no longer in wide use"
      origin: extractor_observed
    - text: "the founding example — a car brand spending a year's whole budget on short films — is the single most celebrated case of its kind and is presented as having changed the field; no comparable attempt that failed is discussed anywhere"
      origin: extractor_observed
    - text: "the reported returns are the client's or agency's own figures relayed second-hand, with no method attached"
      origin: extractor_observed
    - text: "nothing in this material is evidence about what any automated or generative system can produce; the source is describing work made by people for commercial platforms"
      origin: extractor_observed
  source_stated_problems:
    - "if you focus too much on the narrative, viewers may dig your idea, but not get any brand messaging"
    - "your cool idea cannot just be a 'brought to you by the makers of' thing"
    - "'Sale ends Saturday' is not having something to say"
  source_stated_remedies:
