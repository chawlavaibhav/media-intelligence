- sk_id: sk_whip_0027
  source_id: sullivan-hey-whipple
  source_terms:
    - "play the angel's advocate"
    - "the quickest way to shut down your partner's contribution"
  concept_label: judgement_is_suspended_inside_the_team_during_generation
  label_origin: extractor_assigned
  claim: >
    Sullivan states a partner protocol with an explicit prohibition. Playing devil's advocate is
    legitimate when road-testing an idea before a client, and has no place in the early creative
    process; the substitute he endorses is the angel's advocate — ask what is good about the idea and
    what you like about it. He names the specific behaviour that does the damage: a smirk or an
    eye-roll at a bad idea, which he says must never be done even when the idea is genuinely bad, and
    prescribes the neutral reply instead. He frames the team's function not as one partner delivering
    finished work to the other but as taking whatever the partner puts out and returning it with a
    spin on it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An idea that one person cannot advance may be advanceable by the other — he reports getting
      stuck on a half-idea that his partner then carried. Visible contempt removes the supply of such
      half-ideas, because the partner stops offering them. The cost of the smirk is therefore paid in
      future material, not in the idea being dismissed.
  scope:
    domain_discussed_by_source: [creative_process]
    conditions: "the early, generative part of a two-person team's work; explicitly not the pre-client road test"
  caveats:
