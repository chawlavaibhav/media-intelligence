- sk_id: sk_whip_0056
  source_id: sullivan-hey-whipple
  source_terms:
    - "when you've finished writing something, go back and cut it by a third"
    - "read it aloud"
    - "write with your eraser"
  concept_label: two_stated_finishing_operations_a_fixed_cut_and_an_audible_read
  label_origin: extractor_assigned
  claim: >
    Sullivan prescribes two concrete finishing moves. First, a fixed-proportion cut: when the writing
    is done, go back and cut it by a third, on the stated principle that there is hardly anything
    that cannot be improved by making it shorter. He quotes Thomas Kemeny on what the cut is for —
    condensing and editing is not about making less copy to read but about making any length of copy
    more interesting to read. Second, reading aloud, which he says he learned the hard way in front of
    clients: weak writing reveals itself when spoken, in its stop-and-start cadences and jagged
    segues, and he extends the instruction beyond radio scripts to print, online and anything else.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Reading aloud changes the channel and so defeats the writer's familiarity with their own text —
      the cadence problems that the eye skates over are audible. The cut is justified by density
      rather than brevity for its own sake: removing a third raises the interest per line of what
      remains.
  scope:
    domain_discussed_by_source: [copywriting]
    conditions: "the final pass on any written piece"
  caveats:
