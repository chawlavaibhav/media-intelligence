      origin: extractor_observed
    - text: "the argument is embedded in a chapter urging provocation, and a reader could take it as licence to reject correct work; the source's own limit — the work must still be relevant — is stated elsewhere (see sk_whip_0067)"
      origin: extractor_observed
  source_stated_problems:
