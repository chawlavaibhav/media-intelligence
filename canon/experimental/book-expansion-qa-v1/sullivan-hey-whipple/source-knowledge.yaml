  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Reframing changes the answer set. He demonstrates with a phone brief whose stated question
      ("why upgrade when our camera is better?") confines the work to camera messages, then reframes
      it three ways and shows the reachable deliverables move well outside the media list on the
      brief. The stated reason the reframe is available at all is that the brief hands over a solution
      — a key message — disguised as a problem.
  scope:
