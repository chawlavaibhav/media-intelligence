  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Two mechanisms. On damage: an idea has load-bearing elements whose removal is not proportional
      to their size, so change count is a poor proxy for harm and battles must be chosen by what each
      change is holding up. On defence: the client's grounds for judgement are commercial rather than
      aesthetic — Sullivan notes marketing directors may spend as little as five percent of their
      time on advertising and that judging advertising is not what got them the job — so an argument
      pitched on strategy is one they can actually evaluate.
