- sk_id: sk_whip_0005
  source_id: sullivan-hey-whipple
  source_terms:
    - "clear and clever"
    - "I don't get it"
    - "I've seen that before"
  concept_label: the_idea_must_sit_in_the_overlap_of_clear_and_clever
  label_origin: extractor_assigned
  claim: >
    Sullivan models the writer's target as the overlap of two sets: all the ways the key message
    could be clearly communicated, and all the ways it could be cleverly spun into something
    interesting. Clarity alone yields boredom; cleverness alone yields something nobody gets. He
    holds that the client is entitled to expect clarity, but that the reader is not out looking for
    clarity — what customers notice is what is interesting. Quoting George Felton, he names the two
    rejections that mark the two failure directions: "I don't get it" (too weird) and "I've seen
    that before" (too obvious), and says finding the borders of the overlap is where essentially
    all the working time goes.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The two demands come from different parties. Clarity is owed to the client, who is paying for
      a message to arrive. Interest is owed to the reader, who owes the advertisement nothing and
      will not attend to a message merely because it is clear. Neither party's demand can be
      satisfied at the other's expense, so the target is an intersection rather than a point on a
      single scale.
  scope:
    domain_discussed_by_source: [copywriting, advertising_concept_development]
    conditions: "any execution working from a stated key message"
  caveats:
    - text: "the source presents this as a diagram, not a procedure; nothing tells the maker where the borders of the overlap actually lie in a given case, and he says so — finding them is the work"
      origin: extractor_observed
  source_stated_problems:
    - "dullness"
    - "irrelevant brilliance"
    - "if your idea is only clear it could be boring; if it's too clever, nobody will get it"
  source_stated_remedies:
    - "first say it straight, then say it great"
  examples:
    positive: [{description: "three headline-and-logo advertisements the source offers as sitting in the overlap: 'Call in rich tomorrow' (Mystic Lake Casino); 'We hear you need a new muffler' (Korman Muffler); 'For more information on lung cancer, keep smoking' (The Lung Association)", figure_ref: null}]
    counter: []
  intra_source_relations:
    - {relation: qualifies, target: sk_whip_0006, note: "say-it-straight-then-great is the procedure the diagram implies"}
    - {relation: trades_off_with, target: sk_whip_0001, note: "cleverness costs comprehension time"}
    - {relation: member_of_system, target: scs_whip_003}
  evidence:
