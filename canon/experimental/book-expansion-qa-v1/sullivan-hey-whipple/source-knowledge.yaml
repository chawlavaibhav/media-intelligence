- sk_id: sk_whip_0065
  source_id: sullivan-hey-whipple
  source_terms:
    - "Rong"
    - "perfectly wrong"
    - "the key is that the idea must be in direct opposition to all prevailing wisdom"
  concept_label: deliberate_inversion_of_category_convention_with_a_stated_degree_condition
  label_origin: source_verbatim
  claim: >
    Sullivan proposes systematically inverting the accepted executional norms of the category — put
    the logo where it never goes, make the small thing big, subordinate the headline to the copy — and
    reports Steve Dunn's observation that he is constantly surprised how often it works. Borrowing
    from Winsor and Bogusky, he names the target: doing something perfectly wrong, which he spells
    Rong. He states the degree condition explicitly and it is the substance of the claim: designing
    something wrong is easy, a little wrong is no good and a lot wrong is worse, and what works is
    the idea in direct opposition to all prevailing wisdom. He pairs it with a positive signal for
    the maker's own hesitation: if you catch yourself wondering whether they will even let you do
    this, you should definitely do it, because the forces you sense assembling against the idea may
    be a measure of the commotion it would cause. He is emphatic that this is not difference for its
    own sake, quoting Bernbach that provocation must stem from the product — standing a man on his
    head to get attention is wrong, doing it to show the product keeps things from falling out of his
    pockets is right.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Convention is what the audience expects, so an execution in direct opposition is unpredicted
      and therefore noticed; partial deviation is still read inside the convention and so buys
      nothing. Sullivan connects this to talkability — people make remarks about what is remarkable —
      which is why the degree condition matters rather than being pedantry.
  scope:
    domain_discussed_by_source: [advertising_concept_development, brand_communication]
    conditions: "the source frames this as work for makers who have already learned the conventions — Picasso learned to draw a realistic head first — and says explicitly it comes after the earlier chapters"
  caveats:
