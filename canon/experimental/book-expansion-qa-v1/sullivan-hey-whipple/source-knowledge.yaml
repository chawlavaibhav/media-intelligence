- sk_id: sk_whip_0007
  source_id: sullivan-hey-whipple
  source_terms:
    - "a smile in the mind"
    - "wit invites participation"
    - "that > CLICK <"
  concept_label: wit_works_by_making_the_viewer_travel_part_of_the_distance
  label_origin: extractor_assigned
  claim: >
    Quoting McAlhone and Stuart, Sullivan holds that a witty idea deliberately does not travel all
    the way to the audience: the audience must travel somewhere between five and forty percent of
    the way to unlock it. Leave too much out and you mystify; put too much in and you bore. The
    completion is the mechanism, not a side effect — the reader's own act of resolving the idea is
    what makes it register and persist. Sullivan reports the same structure in jokes, citing
    Koestler's claim that hearing a joke compels the listener to re-create it in imagination.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Participation puts the viewer's mind in gear. Sullivan adds a physiological gloss: the moment
      of resolution is accompanied by a small dopamine release, and he cites an NIH item suggesting
      dopamine influences how the brain evaluates whether a mental task is worth the effort. He
      also reports the authors' claim that an idea that happens in the mind stays in the mind and
      leaves a stronger trace, because the person can re-create the pleasure by recalling it.
  scope:
    domain_discussed_by_source: [advertising_concept_development, copywriting, graphic_design]
    conditions: "ideas that ask the viewer to complete something; the source does not claim every idea should be witty"
  caveats:
    - text: "the five-to-forty-percent range is quoted from another book and is a figure of speech, not a measurement; nothing in the source operationalises it"
      origin: extractor_observed
    - text: "the dopamine explanation is the source's own gloss connecting a general NIH finding about effort evaluation to advertising comprehension; the cited research is not about advertising"
      origin: extractor_observed
    - text: "the worked example is a printed advertisement the extraction could not see"
      origin: extractor_observed
  source_stated_problems:
    - "if you leave too much out, you'll mystify your audience"
    - "if you put too much in, you'll bore them"
  source_stated_remedies:
    - "when baiting a trap with cheese, always leave room for the mouse"
  examples:
    positive: [{description: "an Ogilvy Brasil advertisement for Band Sports, an all-sports cable network, which the source calls marvellously subtle and describes only by the click it produces", figure_ref: "Figure 5.5"}]
    counter: []
  intra_source_relations:
