    - "a silly contrivance"
  concept_label: exaggeration_is_the_default_technique_and_is_usually_reached_for_before_thinking
  label_origin: extractor_assigned
  claim: >
    Sullivan places exaggeration deliberately last on his list of concepting techniques and explains
    why: it is used so commonly that it is the first technique juniors apply, and its first hundred
    outputs are predictable inversions of the product benefit. He does not forbid it — he says great
    ideas do use it — but requires the maker to notice when they are using it. He adds Pete Barry's
    condition: an exaggeration must be based on a truth, or what remains is a silly contrivance, and
    quotes Teressa Iezzi's name for the degenerate form, the advertisement in which someone is so
    distracted by the product that they fail to notice some outrageous event.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The technique is reached for first because it requires no insight into the product — the
      benefit is simply amplified until it is absurd — which is exactly why its output converges on
      the same jokes for everyone. Anchoring it to a truth restores the product-specific content the
      device otherwise removes.
