- sk_id: sk_whip_0003
  source_id: sullivan-hey-whipple
  source_terms:
    - "reductionism"
    - "get it down to one thing"
  concept_label: every_element_added_reduces_the_importance_of_every_other_element
  label_origin: extractor_assigned
  claim: >
    Sullivan reports Neil French's stated arithmetic of a layout: every element you add to an idea
    reduces the importance of all the other elements, and every item you subtract raises the
    visibility and importance of what is left. French's demonstration begins with a conventional
    ad — headline, visual, body copy, tagline, logo — and removes them one at a time, each removal
    requiring the survivors to work harder, until the ad is one thing: sometimes a headline,
    sometimes a picture. Sullivan endorses the exercise and says the reduced version is almost
    always better than the version it started from.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Attention within a single layout is a fixed quantity divided among the elements present, so
      element count and per-element salience are inversely related. The claim is about relative
      prominence inside one composition, not about how much information a reader can absorb.
    
  scope:
    domain_discussed_by_source: [print_advertising, out_of_home_advertising]
    conditions: "a single layout or composition; the source concedes it is hard to pull off with a client who wants more in an ad rather than less"
  caveats:
    - text: "the source concedes he managed to reduce a print concept to a single image only once in an entire career, which is a strong admission about how rarely the ideal is reachable"
      origin: source_stated
    - text: "the arithmetic is asserted, not measured; no eye-tracking, recall or response data is offered anywhere in the chapter"
      origin: extractor_observed
    - text: "the demonstration is a hand-drawn napkin sequence reproduced as a figure; the figure was not inspected"
      origin: extractor_observed
  source_stated_problems:
    - "a client who wants to put more in an ad, not less"
  source_stated_remedies:
    - "can we make this ad work without the body copy? by making the headline work a little harder"
    - "is the tagline bringing any new information to the ad? then let's broom it"
    - "isn't there some way we can incorporate the logo into the visual?"
  examples:
    positive: [{description: "the source's own B2B ad for Lee jeans in Women's Wear Daily, reduced to a single image with no logo at all; he names it his favourite of his own work", figure_ref: "Figure 6.7"}]
    counter: []
  intra_source_relations:
    - {relation: generalises, target: sk_whip_0002, note: "the removal test is the case-by-case application of this arithmetic"}
    - {relation: depends_on, target: sk_whip_0053, note: "reduction only works if something is left to dominate"}
    - {relation: member_of_system, target: scs_whip_001}
