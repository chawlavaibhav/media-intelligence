- sk_id: sk_whip_0053
  source_id: sullivan-hey-whipple
  source_terms:
    - "something has to dominate the page"
    - "every design needs a boss"
  concept_label: one_element_must_be_designated_as_the_entry_point
  label_origin: extractor_assigned
  claim: >
    Sullivan states that whether it is a big headline, a large visual or a single word floating in
    white space, somebody has got to be the boss, and that every design needs an overall visual
    hierarchy — an implied order of the relative importance of the elements of the whole. He quotes
    Roy Grace for the operational version: there has to be a point on every page where the art
    director and writer want the reader to start, and there has to be an understanding, an agreement
    and a logical reason for where that is. He repeats the requirement inside the letter-or-postcard
    decision, which is why it functions as a precondition rather than as one recommendation among
    others.
