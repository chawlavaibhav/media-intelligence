  label_origin: extractor_assigned
  claim: >
    Sullivan states the consequence of choosing a visual solution rather than the advantage of one.
    Relying on the image means the image assumes added responsibilities: it has to carry the idea,
    the selling idea cannot be buried in the copy, and if readers do not get the point from the
    visual they will not get it and will move on. He sets this against the reported working
    assumption of the agency whose screen saver read that words are a barrier to communication and
