  label_origin: extractor_assigned
  claim: >
    Sullivan names three phases and attaches a diagnosis to the first two. Ideas that arrive
    immediately and easily should be distrusted precisely because they arrived easily: anyone else
    working the same problem will find the same ones. He says to record them and move on. The phase
