- sk_id: sk_whip_0002
  source_id: sullivan-hey-whipple
  source_terms:
    - "load-bearing beam"
  concept_label: the_removal_test_identifies_which_elements_the_idea_actually_needs
  label_origin: source_verbatim
  claim: >
    To decide whether an image, phrase or word belongs in an idea, take it out and see whether the
    idea still works. If it does not, that element was a load-bearing beam. If it does, the element
    was not needed and should go. Sullivan presents this as a general test applicable to any
    element of any concept, and elsewhere uses the same term for the diagnosis of client damage: a
    less experienced client is particularly good at asking for the removal of the one thing holding
    the whole idea up.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Necessity is established by subtraction rather than by argument. An element that can be
      removed without loss was carrying no meaning, and by sk_whip_0003 it was actively diluting
      everything that remained.
  scope:
    domain_discussed_by_source: [advertising_concept_development, print_advertising]
    conditions: "applies to any element of a concept — image, phrase, word, headline, tagline, logo — during editing and during client revision"
  caveats:
    - text: "the test depends entirely on the tester's own judgement of whether the idea 'still works'; the source offers no external check on that judgement"
      origin: extractor_observed
  source_stated_problems:
    - "taking out the load-bearing beam"
  source_stated_remedies:
    - "to determine whether you need a certain image, phrase, or word to make your idea work, try taking it out"
    - "taking everything out of the idea except the idea"
  examples:
