  concept_label: a_concepting_session_has_a_stated_working_length_and_a_stated_tool
  label_origin: extractor_assigned
  claim: >
    Sullivan gives two concrete working conditions as his own practice. First, session length: commit
    to three hours, which after interruptions yields two to two and a half hours of concepting; a
    single hour is unlikely to build momentum and much past three hours produces diminishing returns.
    Second, tool: do not use the computer the agency gives you. He gives two reasons — a claimed
    directness of hand to page, and the removal of the escape hatch, since the moment the work gets
