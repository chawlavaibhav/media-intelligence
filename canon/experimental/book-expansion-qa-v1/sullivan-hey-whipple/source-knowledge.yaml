  label_origin: extractor_assigned
  claim: >
    Sullivan reports Helmut Krone's requirement of a page style — that it should be possible to tell
    whose advertisement it is from twenty feet — and notes what is interesting about it: Krone was
    talking about print advertisements, not billboards. Sullivan endorses it and states a stronger
    version as his own view: the longer he has been in the business, the more convinced he is that
    art direction is where the major battle for brand building happens, because once a look is
    established and a design territory staked out, nobody else can use it without looking like your
    brand. He reports one instance of a look built by deliberate inversion of another: large pictures
    became small, small body type became large.
