  concept_label: brand_voice_is_a_learned_imitation_not_a_style_choice
  label_origin: extractor_assigned
  claim: >
    Sullivan describes voice as something to be acquired rather than invented. The route to an
    existing brand's voice is to study as much of its published work as possible, because successful
    brands find their own voices and stick with them year after year. The route to a writer's general
    capacity for voices is reading — he says a copywriter must be able to adopt different voices for
    different brands, and that writers do this by reading constantly, whatever it is. For a new
    brand or a new voice for an old one, he says the voice emerges from the human truth and the
    emotional centre already identified, and requires knowing the customer emotionally rather than
    demographically. He offers a test he says makes the difference visible: two headlines from one
