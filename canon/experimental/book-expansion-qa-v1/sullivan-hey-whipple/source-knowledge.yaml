- sk_id: sk_whip_0048
  source_id: sullivan-hey-whipple
  source_terms:
    - "the greater the polarity between the headline and visual, the bigger the shift in the reader's head"
    - "tension and release in an idea"
  concept_label: the_distance_between_word_and_image_is_the_variable_that_sets_the_size_of_the_effect
  label_origin: extractor_assigned
  claim: >
    Sullivan treats the headline-visual relationship as a quantity rather than a binary. Reporting
    Pete Barry, he says many concepts start with a headline that sets up a visual, the idea is then
    revealed by the visual, and the unexpectedness is what creates the tension between the two
    elements — and he states the scaling claim: the greater the polarity between headline and visual,
    the bigger the shift in the reader's head. He also states the relation is reversible: tension
    introduced by a headline can be released by the visual, or a dominant visual can be reframed in
    the reader's head by the headline that follows it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      This is the participation mechanism of sk_whip_0007 realised across two elements rather than
      inside one sentence: the gap between what is said and what is shown is the distance the reader
      travels, so widening the gap enlarges the reader's own contribution and with it the effect.
  scope:
    domain_discussed_by_source: [print_advertising, advertising_concept_development, graphic_design]
    conditions: "pieces with both elements; bounded at both ends — see sk_whip_0032 for zero polarity and sk_whip_0001 for polarity so wide the idea does not resolve in time"
  caveats:
