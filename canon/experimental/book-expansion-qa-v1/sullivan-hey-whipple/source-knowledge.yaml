- sk_id: sk_whip_0057
  source_id: sullivan-hey-whipple
  source_terms:
    - "if you have to have one, make your tagline an anthem"
    - "a good tagline is simply a summation of your idea"
    - "the full stop to your thinking"
  concept_label: a_tagline_is_written_last_summarises_the_idea_and_must_survive_alone_with_the_logo
  label_origin: extractor_assigned
  claim: >
    Sullivan states three constraints on taglines and prefaces all of them with a conditional — if you
    must craft one. First, ordering: save the job until the campaign is well started, possibly until
    the very end, then put the work on the wall and boil its essence down. Second, altitude: try to
    make it about something bigger than the client's product and own some high ground. Third, two
    tests: plug the line into the actual executions and see whether it finishes the argument, and
    check that it works by itself with only the logo for company. He reports Adam Tucker's
    counter-position against wordplay — taglines are not about puns or trickery, and the most famous
    of them contain none — and endorses it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A tagline that summarises the idea cannot be written before the idea exists, which is why the
      ordering constraint comes first. The stand-alone test follows from where taglines actually
      appear: a line that needs the execution around it will fail wherever it is used without one.
  scope:
    domain_discussed_by_source: [copywriting, brand_communication]
    conditions: "campaigns that require a tagline; the source's framing throughout is that one may not be needed, and he elsewhere recommends removing a tagline that brings no new information"
  caveats:
