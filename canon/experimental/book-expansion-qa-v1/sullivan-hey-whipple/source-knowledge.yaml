  label_origin: source_verbatim
  claim: >
    Sullivan reports Jim Aitchison's early fork: decide whether the piece is a letter or a postcard.
    A postcard is visually led — a single visual, sometimes a small amount of copy. A letter is
    predominantly copy-driven and is better for a more complex message. He adds a claim about
    long copy that does not depend on the copy being read: the sheer weight of body copy adds a sense
