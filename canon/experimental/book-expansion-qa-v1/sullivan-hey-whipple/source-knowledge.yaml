- sk_id: sk_whip_0067
  source_id: sullivan-hey-whipple
  source_terms:
    - "you must be relevant"
    - "you may have art, but you don't have an idea"
    - "once you've learned the rules, throw them out"
  concept_label: relevance_is_the_single_constraint_the_source_refuses_to_release
  label_origin: extractor_assigned
  claim: >
    Sullivan ends his provocation chapter by discarding his own book — learn the rules, then break
    them all — and then names the one exception. Even out in deep space, one rule must be obeyed: you
    must be relevant. He states the consequence in a form that concedes the aesthetic while refusing
    the professional claim: no matter how creative an idea seems, if it has no meaning to the
    audience you do not have an advertisement, and you may have art, but you do not have an idea. He
    couples this with an admission about judgement at that altitude, quoting Helmut Krone: when
    something is genuinely new you have no frame of reference, you distrust it, everyone distrusts
    it, and often it takes somebody else to tell you it has merit.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Relevance is what makes an execution an advertisement rather than an artefact: the piece exists
      to do something for an audience, and an audience for whom it means nothing has not been reached
      whatever the piece's other qualities. This is the same requirement as the "So what?" rebuttal,
      restated as a limit on rule-breaking rather than as a check on strategy.
  scope:
    domain_discussed_by_source: [advertising, advertising_concept_development]
    conditions: "experimental and rule-breaking work; the source presents it as the constraint that survives when all his others are discarded"
  caveats:
