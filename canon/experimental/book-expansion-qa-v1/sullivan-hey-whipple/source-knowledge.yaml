- sk_id: sk_whip_0034
  source_id: sullivan-hey-whipple
  source_terms:
    - "avoid fake people, avoid fake names"
    - "they serve only as a speed bump"
  concept_label: invented_characters_and_model_numbers_break_the_reading_of_a_headline
  label_origin: extractor_assigned
  claim: >
    Sullivan names two distinct headline faults with different mechanisms. The first is the invented
    person — a "Little Billy" — which he says readers recognise immediately as fake, and an
    irritating kind of fake, like the stock relatives supplied inside shop-bought picture frames. He
    grants an exception: where a name is the only way the concept can work, an experienced team can
    do it gracefully, and the difference is entirely in the execution. The second is the product or
    model number, which he says feels familiar to the maker because they work on the account, and
    functions for the reader as a speed bump: the characters are not words, so the reader must change
    gear mid-sentence to get through them.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Two mechanisms. The fake name fails by detection — the reader identifies the fabrication and
      transfers the judgement to the advertiser. The model number fails by processing: an
      alphanumeric string interrupts the reading of a sentence because it is not read as language.
      Sullivan also names the source of the maker's blindness to the second: familiarity from working
      on the account.
  scope:
    domain_discussed_by_source: [copywriting]
    conditions: "headlines and short lines; the fake-name prohibition is explicitly qualified, the model-number one is not"
  caveats:
    - text: "the exception for names is the source's own and is unusually candid — he says it comes down to style and to how gracefully and believably you pull it off, which is not a rule anyone can apply in advance"
      origin: source_stated
    - text: "the speed-bump account of alphanumeric strings is asserted from the author's reading experience; no reading measurement is cited"
      origin: extractor_observed
  source_stated_problems:
    - "anybody reading this kind of crap knows these ad names are fake — and an irritating kind of fake at that"
    - "product numbers force readers to switch gears in their heads"
  source_stated_remedies:
    - "avoid fake people; avoid fake names"
    - "avoid using product or model numbers in the headline"
  examples:
    positive: [{description: "a Taylor guitars advertisement by Vitro Robertson which the source says uses a person's name and is carried off beautifully because the team was seasoned", figure_ref: "Figure 5.12"}]
    counter: [{description: "'Little Billy's friends at school call him different.'", figure_ref: null}]
  intra_source_relations:
    - {relation: specialises, target: sk_whip_0035, note: "the fake name is a detected inauthenticity signal"}
    - {relation: member_of_system, target: scs_whip_005}
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: figure_not_inspected
  provenance:
    chapter: "Ch. 5 — Brevity Is the Soul of Wit"
    section: "Never use fake names in a headline (or anywhere else, for that matter). (spine 17)"
    page_start: null
    page_end: null
    figure_refs: ["Figure 5.12"]
    source_support: text_and_visual
    inspected:
      text: true
      figures: []

- sk_id: sk_whip_0035
  source_id: sullivan-hey-whipple
  source_terms:
    - "inauthentic claims of 'real' suggest something is fake"
    - "an asterisk suggests the claim it's attached to is not true"
    - "Happy White Mom with Shopping Bags"
  concept_label: reassurance_signals_are_read_as_evidence_against_the_claim_they_defend
  label_origin: extractor_assigned
  claim: >
    Sullivan identifies a family of signals whose presence is itself the tell. A package promising
    "made with real cheese" or "contains real fruit" invites the inference that something is not
    real, and he gives the reductio: nobody sells a phone by saying it is made with real phone. An
    asterisk on a price, he argues, can legitimately be read as the sentence saying "we're lying",
    because it announces that a briefcase of qualifications is propping the number up. Stock
    photography is his third case — the manufactured handshake, the executive staring thoughtfully
    into a screen — which he says reeks of inauthenticity, and he names the most-demanded stock image
    in his own count of the genre. His stated underlying principle, taken from Frank Rose, is that
    authenticity is scarce and value tracks scarcity.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Each signal is a defensive move that would be unnecessary if the claim were secure, so a
      reader who has learned the pattern treats the defence as a symptom. Sullivan grounds the
      learned pattern historically: the collapse of institutional authority since Watergate has
      produced a population of eye-rollers and sceptics who no longer accept "because we said so",
      so signals that once passed are now inspected.
  scope:
    domain_discussed_by_source: [advertising, brand_communication, copywriting]
    conditions: "consumer advertising addressed to an audience the source characterises as habitually sceptical; his historical account is specifically American"
  caveats:
    - text: "the causal history — Watergate, then a chain of fallen icons, therefore scepticism about advertising — is a sweeping cultural narrative offered without evidence, and is specific to the United States"
      origin: extractor_observed
    - text: "the asterisk reading is a rhetorical move, not a claim about how most readers actually process fine print; the source does not claim to have tested it"
      origin: extractor_observed
    - text: "the source's own remedy, authenticity, is not defined in a way that could be checked on a finished piece; he borrows a two-part split (brand authenticity and audience authenticity) from another author rather than supplying a test"
      origin: extractor_observed
  source_stated_problems:
    - "more advertisers decided to simply replace their bullhorns with bullshit"
    - "if those products were authentically cheese or fruit, would they feel the need to say those things?"
    - "inauthentic brand messaging leads to doubt, while inauthentic audience exchange leads to ridicule and backlash"
  source_stated_remedies:
    - "promote a message that honestly reflects the truth about a brand, and express it in a way that doesn't come across as bullshit to customers"
    - "admitting your commercial is a paid message with an agenda is one effective way to disarm distrust"
    - "embrace the suck: take an obvious weakness and use it to accentuate the product's main strength"
  examples:
    positive: [{description: "Domino's 'Pizza Turnaround', which opened by replaying focus-group video of customers saying the pizza was bad before stating the brand would fix it; and Buckley's cough syrup comparing its own taste to public-restroom puddle water under the line 'It tastes awful. It works.'", figure_ref: "Figure 3.4"}]
    counter: [{description: "a truck advertisement carrying an asterisked monthly payment; and the stock-photography genre the source lists by type", figure_ref: "Figure 3.3"}]
  intra_source_relations:
    - {relation: generalises, target: sk_whip_0033, note: "the exclamation point is one instance of the pattern"}
    - {relation: generalises, target: sk_whip_0034, note: "the fake name is another"}
    - {relation: demonstrated_together_with, target: sk_whip_0036, note: "corporate voice is the same failure at the level of register"}
    - {relation: member_of_system, target: scs_whip_005}
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given, culturally_bounded, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: figure_not_inspected
  provenance:
    chapter: "Ch. 3 — Tell the Truth and Run: Saying the Right Thing the Right Way"
    section: "Authority gets replaced with fake; To thine own brand, be true; Embracing the suck. (spine 13)"
    page_start: null
    page_end: null
    figure_refs: ["Figure 3.2", "Figure 3.3", "Figure 3.4"]
    source_support: text_and_visual
    inspected:
      text: true
