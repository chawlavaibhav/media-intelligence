- sk_id: sk_whip_0063
  source_id: sullivan-hey-whipple
  source_terms:
    - "ask a better question"
    - "try rewriting the brief's key message as a key question"
    - "the Toddler Socratic Method"
  concept_label: replacing_the_key_message_with_a_key_question_that_has_no_known_answer
  label_origin: extractor_assigned
  claim: >
    Sullivan reproduces Tom Monahan's exercise as a three-stage ladder with a precise terminal
    condition. Question one is basic and has a correct answer, so no creativity is involved; question
    two is derived from the previous answer and can be guessed at, so some is; question three is
    derived again and has no correct answer that can be known or guessed, so creativity is required —
    and that is the better question. He instructs the first question always to be why people should
    buy the brand and the first answer to be the key message, so the ladder starts from the brief and
    climbs away from it. He notes the search is not linear: many threads dead-end, and the move is to
    back up, rephrase the last question and continue, which he demonstrates on two worked student
    cases. He then generalises it into a proposal about briefs: hand the creative team a key question
    rather than a key message, on the stated ground that a question has more potential energy because
    it is unfinished, where a message is fully cooked and asks nothing.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Monahan's own explanation, quoted at length, is that ordinary questions let the answerer stay
      inside the known, because an answer is by definition something that already exists;
      progressively more probing questions leave no known available, so the mind is forced somewhere
      it has not been. The question does the forcing, not the answerer's effort.
  scope:
    domain_discussed_by_source: [advertising_concept_development, creative_process]
    conditions: "moving from an approved key message to a campaign idea; the source notes it can take thirty or forty rounds, not the three shown"
  caveats:
