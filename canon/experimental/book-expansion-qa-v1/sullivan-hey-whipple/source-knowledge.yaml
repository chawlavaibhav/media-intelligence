- sk_id: sk_whip_0042
  source_id: sullivan-hey-whipple
  source_terms:
    - "as an idea, Whipple isn't any damn good"
    - "would you also spit on the table to get my attention?"
  concept_label: the_sources_central_position_is_that_measured_sales_effect_does_not_by_itself_justify_an_advertisement
  label_origin: extractor_assigned
  claim: >
    The book's founding argument is built on a case that runs against its own thesis, and Sullivan
    states both halves. He reports the campaign was measurably successful — it sold billions of rolls,
    displaced the category leader, ran 504 executions over 26 years, and its actor was reported in
    1975 as the second most recognised face in America — and simultaneously that research found it
    among the most disliked commercials of its decade and last in believability across years of
    studies. His position is that effectiveness does not settle the question. He quotes Norman Berry
    against judging advertising exclusively on sales: advertising that does not sell is lousy by any
    definition, but sales achieved with work in bad taste should not be applauded however much it
    sells, because offensive and stupid advertising damages the industry and business generally. His
    own test is a personal one — whether he could describe the work to his son — and his rebuttal to
    the sales defence is a question: spitting on the table would also get attention, so would you?
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The argument is that an advertisement has two accounts to settle, only one of which sales
      measure. Sullivan's stated alternative route reaches the same commercial destination — enduring
      brands and market leadership — without the second cost, which is what makes it a claim about
      sufficiency rather than a rejection of effectiveness.
  scope:
    domain_discussed_by_source: [advertising, effectiveness, brand_communication]
    conditions: "judging finished advertising; the source is explicit that this is his position and calls it a fork in the road he invites the reader down"
  caveats:
