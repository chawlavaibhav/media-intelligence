- sk_id: sk_whip_0028
  source_id: sullivan-hey-whipple
  source_terms:
    - "work, don't talk, work"
    - "an idea talked about is never as exciting as the idea itself"
    - "just a disaster check"
  concept_label: describing_an_unfinished_idea_costs_more_than_it_returns
  label_origin: extractor_assigned
  claim: >
    Sullivan argues against talking about work in progress, and gives two distinct costs. The first
    is to the maker: talking converts energy that could go into being creative into talking about
    being creative. The second is to the idea's reception: an idea described is always less exciting
    than the idea itself, so early description spends down the listener's enthusiasm at the worst
    exchange rate. He does prescribe one late, bounded exception — once ideas are on paper and
    polished, walk them round the hallways before the creative director sees them, explicitly not
    seeking consensus but running a disaster check, and treat a problem raised independently by two
    people as real.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An unfinished idea has to be reconstructed in the listener's head from a verbal account that
      does not carry what makes it work, so the listener judges the account rather than the idea. The
      disaster check is placed after polish for exactly that reason.
  scope:
    domain_discussed_by_source: [creative_process]
    conditions: "work in progress inside an agency, before the internal review"
  caveats:
    - text: "the two-people-agree heuristic is offered with 'chances are it's real', which is a probability judgement rather than a rule"
