- sk_id: sk_whip_0001
  source_id: sullivan-hey-whipple
  source_terms:
    - "Speed of the Get"
    - "the fuse on your idea"
  concept_label: an_idea_has_a_fuse_length_that_can_be_too_long_or_too_short
  label_origin: extractor_assigned
  claim: >
    The time a viewer takes to understand an idea is itself a design variable, and it can be
    mis-set in either direction. Sullivan calls it the Speed of the Get and likens it to the fuse
    on a firecracker. A fuse that is too short means the idea resolves before the viewer has begun
    attending, and its instant, contentless bang tells them there is nothing there worth attending
    to. A fuse that is too long means the idea does not go off before the viewer has moved on. He
    holds that a quick get is the first and most important property an idea needs — more important,
    he says explicitly, than the creativity of the piece — and that in student work the error is
    almost always the long fuse, produced by over-complicating and thereby "encoding" the idea.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Comprehension time competes with a viewer's willingness to spend attention at all. The
      viewer is not looking for the message; they will not wait, so an idea that has not resolved
      inside the available window simply does not resolve. At the other end, an idea that resolves
      instantly and completely leaves nothing for the viewer to do, so nothing is registered.
  scope:
    domain_discussed_by_source: [print_advertising, out_of_home_advertising, advertising_concept_development]
    conditions: "advertising encountered by a viewer who did not seek it out; the permissible fuse length varies with how long the viewer dwells with the medium (see sk_whip_0060)"
  caveats:
    - text: "the source calls the priority of the quick get 'heresy' in his own field, which marks it as his position rather than a settled view"
      origin: source_stated
    - text: "no measurement is offered for either bound; 'too fast' and 'too slow' are named by example and by the author's judgement of student work"
      origin: extractor_observed
  source_stated_problems:
    - "encoding the idea"
    - "a get that takes three or four beats longer than it should"
    - "its quick, clueless bang makes it clear there's nothing there to be interested in"
  source_stated_remedies:
    - "taking everything out of the idea except the idea"
  examples:
    positive: [{description: "two ads the source says have exactly the right fuse: a mud-caked boat on a trailer for Jeep, with no headline and no product; and a Ford Expedition rear-view-camera ad. In both, the source says there is only one place to look, the image reads as slightly wrong, the viewer leans in, and the idea then goes off", figure_ref: "Figures 6.2, 6.3"}]
    counter: [{description: "a STOP sign — an instant read with too little substance to have any effect on the viewer", figure_ref: null}]
  intra_source_relations:
    - {relation: depends_on, target: sk_whip_0002, note: "the removal test is the operational way to shorten a long fuse"}
    - {relation: qualified_by, target: sk_whip_0060, note: "dwell time in the medium sets how long a fuse may be"}
    - {relation: trades_off_with, target: sk_whip_0007, note: "wit requires the viewer to travel some distance, which lengthens the fuse on purpose"}
    - {relation: member_of_system, target: scs_whip_001}
