  concept_label: an_established_image_carries_accumulated_meaning_that_can_be_borrowed_but_must_be_re_angled
  label_origin: extractor_assigned
  claim: >
    Sullivan argues that certain images have acquired fixed associations — red means anger, a dog
    means loyal, a hand coming out of water means help — and that the trade calls this accumulated
    meaning the image's equity. Because a metaphor says with one image what would otherwise take
    twenty words, it does a great deal of work quickly and simply, and he says it is particularly
    valuable where the product is intangible, since a metaphor makes it tangible. He then states the
    condition that separates use from failure: picking up a ready-made image and setting it beside
    the client's logo will not work; the established image must be given a spin and used in a new
    and unexpected way that relates to the product advantage. He notes verbal metaphors work equally
    well.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The image's accumulated associations are pre-installed in the audience, so the maker does not
      have to establish them — which is where the compression comes from. Sullivan grounds the
      existence of such associations in a claim he attributes to Jung, that the mind works, moves,
      thinks and dreams in symbols.
