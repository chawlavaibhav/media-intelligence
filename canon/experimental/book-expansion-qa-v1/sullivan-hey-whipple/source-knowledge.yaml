- sk_id: sk_whip_0023
  source_id: sullivan-hey-whipple
  source_terms:
    - "patterns are campaigns trying to come to life"
    - "convergent thinking"
    - "divergent thinking"
  concept_label: a_campaign_is_found_by_clustering_finished_ideas_not_by_setting_out_to_write_one
  label_origin: extractor_assigned
  claim: >
    Sullivan's stated route to a campaign runs backwards from the usual one. After the wall is
    covered and the herd thinned, the maker stands back and looks for overlaps — visual, verbal, or
    by medium — repositions similar ideas into clusters, and keeps looking. He states the finding as
    a slogan he repeats twice: patterns are campaigns trying to come to life. Once a cluster of even
    two ideas that plainly belong together is found, the process reverses: that pair is treated as
    the main idea and further ideas are pulled out of it. He names the two modes explicitly —
    convergent thinking groups possibilities, divergent thinking creates them — and says the process
    oscillates between them rather than running once.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The campaign idea is treated as latent in the work already made rather than as something to be
      specified in advance. The image he gives is a handful of pearls spread on a table with the
      thread still to be found — the shared narrative is discovered by inspecting what the maker's
      own output already has in common, which is information the maker did not have at the start.
  scope:
