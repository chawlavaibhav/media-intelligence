- sk_id: sk_whip_0040
  source_id: sullivan-hey-whipple
  source_terms:
    - "Yeah, riiiight"
    - "So what?"
    - "try to make your message incontestable"
  concept_label: two_named_rebuttals_map_to_two_separate_repairs
  label_origin: extractor_assigned
  claim: >
    Sullivan names the two things people fire back at an advertisement and attaches a different fix
    to each. "Yeah, riiiight" is a credibility failure, repaired by a message that is truthful,
    incontestable or measurably provable. "So what?" is a relevance failure, repaired only by having
    something that matters to somebody — something the customer wants or a problem they have. He
    states the consequence of failing the second bluntly: if there is nothing relevant to say, tell
    the client to put their money away, because no matter how well it is executed an unimportant
    message has no receiver. For the first he offers Pete Barry's stress test: imagine the loud man
    at the bar arguing back, and build the comeback that sinks his boat.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The two objections address different links in the chain. Credibility governs whether the claim
      is accepted; relevance governs whether accepting it changes anything for the hearer. Execution
      can repair neither, which is why he places both checks upstream of the creative work.
  scope:
    domain_discussed_by_source: [advertising, persuasion, brand_communication]
    conditions: "checking a strategy or key message before concepting"
  caveats:
    - text: "the source concedes the incontestability advice does not apply to products that are all image or have no real difference worth hanging a hat on, and names paper cups as his example"
      origin: source_stated
    - text: "the two-rebuttal scheme is a memorable heuristic, not a taxonomy; nothing establishes that these are the only two ways a message fails"
      origin: extractor_observed
  source_stated_problems:
    - "'Yeah, riiiight' and 'So what?'"
    - "an unimportant message has no receiver; the tree falls in the forest"
  source_stated_remedies:
    - "to prevent 'Yeah, riiiight', have a message that's truthful, incontestable, or measurably provable"
    - "state fact, not manufactured nonsense"
    - "whenever you can, go for an absolute — an -est, not an -er"
  examples:
    positive: [{description: "the source's stated preference for absolutes over comparatives: quietest, fastest, cleanest rather than quieter, faster, cleaner, on the ground that the middle-ground claims are grey and forgettable", figure_ref: null}]
    counter: [{description: "'We Put the Qua in Quality'; and leveraging a rice-paper-thin difference nobody cares about because legal will not permit anything stronger", figure_ref: null}]
  intra_source_relations:
    - {relation: qualifies, target: sk_whip_0016, note: "relevance is the floor a precise strategy has to clear"}
    - {relation: depends_on, target: sk_whip_0041, note: "truth is what makes a claim incontestable"}
    - {relation: member_of_system, target: scs_whip_003}
