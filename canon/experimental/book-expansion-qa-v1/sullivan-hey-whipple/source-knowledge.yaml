    - "just sorta lie there"
  concept_label: an_idea_that_satisfies_every_brief_requirement_can_still_fail_by_being_inert
  label_origin: extractor_assigned
  claim: >
    Sullivan describes a failure that passes every check: the obedient idea, which is on strategy,
    correctly targeted, and does nothing. He says he sees many of them as a creative director and as
    a teacher, and characterises them as work that dutifully ticks the boxes about what an
    advertisement should be and then lies there asking to be looked at. The claim matters because it
    asserts that brief-conformance is not sufficient, and it is the diagnostic counterpart to his
    argument that a campaign which is merely a transcription of the brief contains no creative leap.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Conformance checks are necessary and negative — they can rule work out, not in. Nothing in a
      brief requires the work to be interesting, and by Sullivan's account the reader supplies no
      attention on the strength of correctness alone.
  scope:
    domain_discussed_by_source: [advertising_concept_development, evaluation_diagnosis]
    conditions: "internal review of work that has already satisfied the brief"
  caveats:
