- sk_id: sk_whip_0068
  source_id: sullivan-hey-whipple
  source_terms:
    - "research is best used to help craft a strategy, not an execution"
    - "permission research"
    - "it's impossible to measure a live snake"
  concept_label: the_sources_stated_mechanisms_by_which_creative_testing_distorts_what_it_measures
  label_origin: extractor_assigned
  claim: >
    Sullivan sets out a list of specific reasons he holds creative testing invalid, distinct from
    simply disliking it. Testing by its nature looks for what is wrong rather than what is right, and
    will find something. It assumes an intellectual reaction where he says the real reaction is
    visceral and instantaneous. It asks people what they will like before they have seen it in the
    world. It rewards work that is happy, vague and fuzzy because that does not challenge the viewer,
    and rewards the derivative because familiarity scores higher than the unique, strange or new. It
    cannot convey tone, because pictures pasted to a board are not footage, voice-over and music. And
    it recruits ordinary people as advertising experts, after which they feel obliged to prove it. He
    names a second misuse, permission research, in which concepts are shown and liking is asked for,
    and argues its consensus and compromise grind ideas into vanilla or nonsense — illustrating with
    a 1990s art project that focus-grouped the ingredients of a perfect painting and commissioned the
    result. His constructive rule is a single line: the best people use research to generate ideas,
    not to judge them; it belongs at the beginning, to find out what to say, and when it is used to
    determine how to say it, ideas suffer.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The stated common mechanism is that the testing arrangement inverts the direction of
      advertising. He quotes Bernbach that we are so busy measuring public opinion we forget we can
      mould it, and states the consequence: in the testing room the dynamic of a commercial reaching
      viewers is replaced by viewers telling the commercial what to say.
  scope:
    domain_discussed_by_source: [testing_method, effectiveness, evaluation_diagnosis]
    conditions: "the pre-testing of rough creative concepts; the source explicitly exempts product, location, flavour, packaging and name testing, which he says pays off"
  caveats:
