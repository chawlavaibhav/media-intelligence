  label_origin: extractor_assigned
  claim: >
    Sullivan's stated writing opening is to build two lists and then collide them. The first is a
    BRAND list of product attributes taken straight from the brief. The second is built by choosing
    one theme implied by the product — where it is made, how long it takes, how it is made — and
    peeling off every word and idiomatic phrase that theme brings to mind, including cultural
    associations, films, sayings and slang. He then lets his eye jump between the lists, pairing
