- sk_id: sk_whip_0010
  source_id: sullivan-hey-whipple
  source_terms:
    - "it fits on a sticky note"
    - "it starts talking and won't shut up"
  concept_label: two_stated_signs_that_an_idea_is_actually_big
  label_origin: extractor_assigned
  claim: >
    Sullivan gives two checkable signs that an idea has reached platform size. First, it can be
    written on a sticky note: a big idea can be summed up in a sentence, and if setting the idea up
    takes more than a sentence or two the idea is probably not there yet. He demonstrates on his
    own example — "Coca-Cola company sues itself for 'taste infringement'" — and counts the
    characters. Second, once a working platform is spoken aloud, its rules start talking and the
    platform unpacks itself: other people in the room immediately begin generating executions
    without being asked. He reports this happening in his classroom the moment a student said
    "PetSmart is the only thing dogs and cats can agree on."
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Both signs are indirect measurements of the same property. Compressibility to a sentence
      indicates the idea has a single centre rather than an accumulation of parts; spontaneous
      generation by listeners indicates the rules are legible enough that other people can operate
      them, which is exactly what makes the world productive.
  scope:
    domain_discussed_by_source: [advertising_concept_development, creative_process]
    conditions: "evaluating a candidate platform before committing to it"
  caveats:
    - text: "the source calls the sticky-note sign 'kind of weird' and hedges the whole formula it sits inside as a tool rather than a rule"
      origin: source_stated
    - text: "the talking test is social, so it is confounded by who is in the room and by the enthusiasm of the person presenting; the source does not address this"
      origin: extractor_observed
  source_stated_problems:
    - "if you find yourself needing more than a sentence or two to set up an idea, well, your idea probably isn't there yet"
  source_stated_remedies:
    - "write the idea on a sticky note"
    - "speak the platform concept aloud and see whether the rules start talking"
  examples:
    positive: [{description: "student platforms that fit on notes: PetSmart as the only thing dogs and cats agree on; Reese's as 'the tragic love story of how Peanut Butter left Jelly for Chocolate'; Casper mattresses versus the 'Crazy Ex-Mattress'", figure_ref: "Figure 7.5"}]
    counter: []
