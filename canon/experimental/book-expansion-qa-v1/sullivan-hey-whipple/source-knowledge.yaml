- sk_id: sk_whip_0062
  source_id: sullivan-hey-whipple
  source_terms:
    - "why solve problems when finding problems is way cooler?"
    - "beginner's mind"
    - "how might we … ?"
  concept_label: problem_finding_is_distinguished_from_problem_solving_and_is_where_the_source_places_breakthroughs
  label_origin: extractor_assigned
  claim: >
    Sullivan separates two activities that a brief conflates. Problem-solving answers the question
    the brief asked, and he characterises most agency work as maintenance of this kind. Problem-
    finding challenges the question itself: the team steps back, questions its own assumptions, and
    studies the client's customers, stores, data and systems for bottlenecks, redundancies and unmet
    needs — and once an interesting problem is found, usually one the client did not know it had, the
    work becomes problem-solving again. He states why no brief will ever ask for it: you cannot place
    an order for something that does not exist yet. He gives two devices — beginner's mind, which
    asks the naive questions people too close to the problem look past, and Min Basadur's "how might
    we", where each word does stated work: how presumes solutions exist, might licenses ideas that may
    not work, we signals collaboration. He also places it in the schedule: a junior does it after
    delivering what the brief asked for, not instead.
