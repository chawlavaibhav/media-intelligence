  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Both tests move the criterion outside the maker's own judgement to a third party's behaviour —
      whether someone would repeat it — which Sullivan connects to Seth Godin's definition that
      something is remarkable when people make remarks about it. The press-release form works by
      forcing the idea to be describable as an event rather than as a piece of media, which he says
      is what stops it being thirty seconds of random theatre.
