- sk_id: sk_whip_0069
  source_id: sullivan-hey-whipple
  source_terms:
    - "start from where you are"
    - "never solve a problem from its original perspective"
    - "blow it all up; start over"
  concept_label: named_moves_for_when_an_idea_is_not_working
  label_origin: extractor_assigned
  claim: >
    Sullivan collects a set of repair moves and, unusually, distinguishes them by what has gone
    wrong. If the project is too large to start, take the piece that interests you most and begin
    there regardless of its position in the whole, because doors open on either side of a first idea
    that could not be seen before it existed. If you are stuck mid-problem, change something —
    anything — and he gives the specific form: solve the same problem as if it were a different
    medium, or with a radically different budget, then return. If the notebook is full of half-ideas
    that are not working, blow it all up and start on a fresh pad, on the stated ground that old
    half-ideas muddy the water and the maker may be subconsciously holding on to an approach that
    will never work. If an idea has been forced, abandon it: a forced idea bears the dents of the
    fight and lacks the elegance of one that arrived. And if anxiety has set in, treat it as the
    obstacle — he cites a neurologist that the more anxious you are the less likely you are to notice
    subtle insights — while noting that some pressure is required and that he manufactures it when a
    deadline is too far away. He also reframes being stuck as diagnostic: it is a sign you have
    passed the easy ideas and are approaching unexplored territory.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Two mechanisms. Changing the frame changes what is reachable — he quotes the rule never to
      solve a problem from its original perspective — and the medium or budget swap is a cheap way to
      force a new frame on a fixed problem. And existing partial work constrains the search: half-ideas
      in the notebook keep the maker inside the space that already failed, so removing them restores
      the range.
  scope:
    domain_discussed_by_source: [creative_process, copywriting]
    conditions: "the middle of a concepting project; the source treats being stuck as an expected stage rather than a fault"
  caveats:
