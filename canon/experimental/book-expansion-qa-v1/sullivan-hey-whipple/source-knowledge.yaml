      origin: source_stated
    - text: "he calls the process capricious and unscientific and simultaneously says it is here to stay; the chapter offers these as ammunition for a client conversation, not as an established finding, and says so"
      origin: source_stated
    - text: "no evidence is offered for any of the listed mechanisms; the painting illustration is a conceptual art project rather than a study of advertising testing, and its authors are described as working with tongue in cheek"
      origin: extractor_observed
    - text: "the source is not disinterested and the objections are those of the party whose work is being evaluated; this is not raised anywhere in the chapter"
      origin: extractor_observed
  source_stated_problems:
    - "testing, by its very nature, looks for what is wrong with an idea, not what is right"
    - "testing rewards advertising that's happy, vague, and fuzzy because happy, vague, and fuzzy doesn't challenge the viewer"
    - "testing rewards advertising that's derivative because a familiar feel will score higher"
    - "research is often used the way a drunk uses a lamppost: for support rather than illumination"
  source_stated_remedies:
