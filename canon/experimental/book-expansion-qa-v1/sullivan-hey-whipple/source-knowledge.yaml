- sk_id: sk_whip_0055
  source_id: sullivan-hey-whipple
  source_terms:
    - "vary your sentence length and pacing"
    - "spackle between the joints"
    - "an invisible thread"
  concept_label: prose_rhythm_and_joinery_are_treated_as_checkable_properties_of_body_copy
  label_origin: extractor_assigned
  claim: >
    Sullivan reproduces Gary Provost's demonstration in which a paragraph of uniform five-word
    sentences is shown to drone, and the same content with varied lengths is shown to acquire
    rhythm, and treats sentence-length variation as a requirement rather than a preference. He adds
    a structural requirement for body copy: it should read as an essay — an opening line that pulls
    the reader in, a supported middle, a closing call to action — with transitions carrying each
    sentence out of the one before, an invisible thread through the whole argument. He states the
    resulting test plainly: when it is done well, no sentence can be removed without disrupting the
    flow and structure of the entire piece. He also prescribes short paragraphs, particularly online,
    and explicitly denies this is an argument for dumbing the work down.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Uniform rhythm becomes inaudible: the demonstration works by making the reader experience the
      monotony before naming it. The joinery requirement supplies the second mechanism — a piece
      whose sentences are each entailed by the previous one has no place for the reader to stop.
  scope:
    domain_discussed_by_source: [copywriting]
    conditions: "body copy of any length; the short-paragraph advice is stated as particularly applying to online reading"
  caveats:
