- sk_id: sk_whip_0037
  source_id: sullivan-hey-whipple
  source_terms:
    - "don't have a 'pre-ramble'"
    - "if your headline needs to be explained, it's not working"
  concept_label: body_copy_that_explains_or_repeats_the_headline_indicates_the_headline_has_failed
  label_origin: extractor_assigned
  claim: >
    Sullivan reports Thomas Kemeny's diagnosis that body copy is too often treated as an explanation
    of the headline, and converts it into a test of the headline rather than of the copy: if the
    headline needs explaining, the headline is not working. He names the parallel junior error of
    opening the copy by restating what the headline already said, and prescribes the journalistic
    remedy — put the most interesting, surprising or persuasive point in the first line, following
    the inverted pyramid and not burying the lead.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The diagnosis inverts the usual direction of blame. Explanatory copy is a symptom whose cause
      sits upstream in the headline, so editing the copy cannot fix it. The remedy is borrowed from
      journalism's ordering convention: most fundamental material first, remaining details in
      descending importance.
  scope:
    domain_discussed_by_source: [copywriting]
    conditions: "long-copy and body-copy writing where a headline is present"
  caveats:
    - text: "the claim is a rule of thumb applied to a single failure pattern; the source does not address copy that legitimately develops a headline rather than explaining it, and the difference is left to judgement"
      origin: extractor_observed
  source_stated_problems:
    - "if your headline needs to be explained, it's not working"
    - "the other mistake juniors make is to repeat what's already been said in the headline"
    - "don't bury the lead"
  source_stated_remedies:
    - "just get to the point; put your most interesting, surprising, or persuasive point in the first line if you can"
  examples:
    positive: []
    counter: []
  intra_source_relations:
    - {relation: specialises, target: sk_whip_0032, note: "repetition between elements, in the copy rather than the visual"}
    - {relation: member_of_system, target: scs_whip_005}
