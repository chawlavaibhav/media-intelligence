- sk_id: sk_whip_0008
  source_id: sullivan-hey-whipple
  source_terms:
    - "paraprosdokian"
    - "parallelism"
    - "two-fers"
  concept_label: two_sentence_architectures_put_the_payload_at_the_end
  label_origin: extractor_assigned
  claim: >
    Sullivan names two distinct sentence structures for building tension into a headline, and says
    both require the key words to be pushed to the very end. In a paraprosdokian the second half is
    unexpected in a way that forces the reader to reinterpret the first half — the brain has
    already auto-filled a likely ending, and the actual ending overturns it. In a parallelism no
    reinterpretation is required; what is needed is opposition — this versus that, this but not
    that, not only this but that — a contrast that throws the benefit into relief. He adds that a
    full reinterpretation is not always necessary: simply holding the key word until the end can
    achieve a similar effect, because the punch line of a joke is at the end for a reason.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Both structures work on the order in which the reader receives the words. The
      paraprosdokian's mechanism is prediction failure — the reader's own completion of the
      sentence is what gets overturned. The parallelism's mechanism is contrast — the benefit is
      made legible by the thing it is set against. In both, delaying the operative word means the
      effect fires when the writer intends, "like a firecracker at the end of a fuse".
  scope:
    domain_discussed_by_source: [copywriting]
    conditions: "headlines and short lines; the source does not claim these are the only workable structures"
  caveats:
    - text: "the two structures are distinguished by the source explicitly — a parallelism does not require reinterpretation, only opposition — so treating them as one device loses the distinction he is making"
      origin: source_stated
    - text: "all the evidence is a selected set of celebrated headlines; no comparison against lines that used the same structures and failed"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "push the key words to the very end of your sentence; save your wrap-up punch for the end"
    - "start looking for 'two-fers': language that separates this versus that, this plus that, this but not that"
  examples:
    positive: [{description: "paraprosdokian: 'For more information on lung cancer, keep smoking' — the brain autofills 'ask for our free brochure' and is then made to reinterpret. Delayed key word: 'Refreshes your breath while you scream' (Altoids). Parallelism: 'You don't win silver. You lose gold.' (Nike); 'Cars people swear by, not at.' (Volvo); 'The best surprise is no surprise.' (Holiday Inn)", figure_ref: "Figure 5.7"}]
    counter: []
  intra_source_relations:
    - {relation: specialises, target: sk_whip_0007, note: "the same tension-and-release shift, realised inside one sentence"}
    - {relation: member_of_system, target: scs_whip_003}
