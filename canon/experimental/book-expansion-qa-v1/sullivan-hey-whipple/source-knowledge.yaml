- sk_id: sk_whip_0012
  source_id: sullivan-hey-whipple
  source_terms:
    - "TRUTH + CONFLICTS = possible platform"
    - "the truest thing you can say"
  concept_label: a_platform_is_generated_by_crossing_a_brand_truth_with_its_consequent_conflicts
  label_origin: source_verbatim
  claim: >
    Sullivan offers a two-step generator he says he has watched work repeatedly in teaching, while
    explicitly refusing to call it a rule. Step one: state the truest thing that can be said about
    the brand — which he notes is almost never in the brief, because it is usually the thing clients
    are taught to deny or minimise. Step two: look for the conflicts that arise as a consequence of
    that truth. The pair is then the jumping-off point for a platform. His worked example takes
    Crocs, sets aside the client's preferred truth (comfortable) for the student's truth (ugly),
    crosses ugly with its social consequence, and arrives at a platform whose rules are borrowed
    wholesale from the world of contraception while still permitting the comfort message the client
    needs. He states plainly what the formula actually delivers: focus.
