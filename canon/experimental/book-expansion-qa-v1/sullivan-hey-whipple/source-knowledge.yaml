  claim: >
    Sullivan proposes casting the brand as an archetype from the Hero's Journey and states the
    role assignment explicitly and against the usual practice: the brand is not the hero, the
    customer is, and the brand is the archetype the hero meets — the figure who teaches a lesson or
    grants a power before the hero returns transformed. He suggests the archetype's built-in
    character traits will start generating stories. Separately he reports two related compressions of
    a brand into a single part of speech: Dan Wieden's and Jean-Marie Dru's "brands are verbs" (IBM
    solves, Nike exhorts, Sony dreams) and his own "Brand = adjective" — the claim that a brand should
    be spot-welded to exactly one adjective and everything the brand makes should fall under it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Archetypes are shared: the audience already knows how a Caregiver, a Trickster or a Magician
      behaves, so casting the brand as one imports a stock of expected behaviour that can be drawn on
      without being established first. For the adjective, the stated mechanism is memory economy —
      shoppers face tens of thousands of products, do not have time to work out what a brand stands
      for, and will file it under a word if they file it at all.
