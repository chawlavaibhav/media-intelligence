- sk_id: sk_whip_0058
  source_id: sullivan-hey-whipple
  source_terms:
    - "don't set out to be funny; set out to be interesting"
    - "funny is a subset of interesting"
    - "funny isn't a language, funny is an accent"
  concept_label: humour_is_subordinate_to_interest_and_is_not_always_the_right_register
  label_origin: extractor_assigned
  claim: >
    Sullivan subordinates humour explicitly. Funny is a subset of interesting; it is not a language
    but an accent; and it may not even be the right accent for a given client. His stated ordering is
    that funny, serious and heartfelt are all irrelevant unless the work is interesting first.
    Elsewhere he supplies the constraint that decides the register: the emotional choice is always a
    combination of what the product is and who is being addressed, and he gives the negative case —
    slapstick does not belong on a hospital's website.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Interest is the necessary condition because nothing else operates without attention; humour is
      one of several available means to it, so treating it as the goal confuses a method with the
      requirement it serves.
  scope:
    domain_discussed_by_source: [copywriting, advertising_concept_development]
    conditions: "choosing tone for a piece; the source is a practitioner of comic advertising and is arguing against his own default"
  caveats:
