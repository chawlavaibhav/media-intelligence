      origin: extractor_observed
    - text: "the anxiety claim is supported by a general psychology essay about insight, not by anything about advertising"
      origin: extractor_observed
    - text: "'start from where you are' is borrowed from a novelist's writing advice and Sullivan's demonstration of it is his own writing of this book, not an advertising project"
      origin: source_stated
  source_stated_problems:
    - "all those old half-assed ideas may be serving only to muddy the waters"
    - "even when you do manage to force a decent idea onto paper, it usually bears the earmarks of a fight"
    - "the more anxious you are the less likely you are to notice any subtle insights"
  source_stated_remedies:
