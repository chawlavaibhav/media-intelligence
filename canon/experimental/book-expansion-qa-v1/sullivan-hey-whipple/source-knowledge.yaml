  claim: >
    Sullivan describes an explicit two-phase search. In the first phase the maker digs shallow holes
    all over the brief's territory — quick sketches, a billboard, a tagline, a script, enough only to
    show proof of concept — and does not stop to develop even a promising find. In the second phase,
