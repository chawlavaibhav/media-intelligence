- sk_id: sk_whip_0004
  source_id: sullivan-hey-whipple
  source_terms:
    - "we must limit ourselves to saying one thing"
    - "this is basically why they put the point on the end of the nail"
  concept_label: a_concept_that_makes_more_than_one_point_makes_none
  label_origin: extractor_assigned
  claim: >
    Sullivan states flatly that to create a simple advertising idea in any medium the maker must be
    limited to saying one thing, and that any advertising concept trying to make more than one
    point will not work. He extends this to the client request for a full-line advertisement: if a
    client has three important things to say, they need three advertisements, because customers
    shop for specific needs and never for a full line.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      He gives the mechanism as an analogy rather than a process: force concentrates at a point.
      For the full-line case he gives a stated reason — customer behaviour is need-specific, so an
      advertisement addressing a specific need matches how the purchase is actually made.
  scope:
    domain_discussed_by_source: [advertising_concept_development, print_advertising, television_advertising]
    conditions: "one advertising idea in one execution; the source allows secondary benefits a place in brochures, on packaging, and two or three clicks into a website"
