  concept_label: revision_damage_is_cumulative_and_the_defence_must_be_selective_and_strategic
  label_origin: extractor_assigned
  claim: >
    Sullivan holds that the serious damage to work is not a single rejection but an accumulation of
    small changes, and that less experienced clients are particularly good at asking for the removal
    of the load-bearing beam — the one element holding the whole idea up. His stated response is
    triage rather than resistance: let the body copy be changed, let the colours be changed, and
    protect the idea; if you get out with the big idea intact, count it a success. He states the
    stopping condition too — if enough changes have destroyed the original idea, kill it yourself.
    His defence tactics are correspondingly specific. Base the defence on strategy, not on the
    creativity of the execution, because strategy is the thing the client helped author; be able to
    track step by step how you arrived at the work. Do not attempt to solve the problem in the
    meeting — write down the concerns, play them back, and take it away. Never show work you do not
    want bought, because clients gravitate to the safer second-rate option. And do not pre-kill your
    best work on the client's behalf. He frames the underlying posture as a humility rule: enter
    every discussion believing there is a fifty percent chance you are wrong, which he argues makes
    the argument more persuasive because it does not feel forced.
