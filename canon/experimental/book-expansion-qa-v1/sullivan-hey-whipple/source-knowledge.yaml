  concept_label: two_prospective_tests_that_raise_the_bar_above_making_an_advertisement
  label_origin: extractor_assigned
  claim: >
    Sullivan offers two questions to be asked before committing, both designed to reject work that
    is merely competent. The first, from Alex Bogusky: if you are about to spend money on a campaign
    and cannot imagine anybody writing or talking about it, rethink it. The second is a stated
    process rather than a question — write the press release for the idea before making it, picturing
    the newspaper story that will exist after it runs. He reports the origin: an agency principal
    tired of hearing teams open with what happens in the commercial, on the grounds that the press
    covers news and news is what the agency is trying to make. Sullivan sets the bar for that test
    explicitly at general news rather than trade press. He states the underlying reframe as the
    biggest thing in the chapter and attributes it: stop trying to come up with advertising ideas and
    work instead on coming up with ideas worth advertising.
