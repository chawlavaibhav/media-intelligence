- sk_id: sk_whip_0011
  source_id: sullivan-hey-whipple
  source_terms:
    - "if you don't have conflict, you don't have a story"
    - "Area Bank Not Robbed"
    - "creativity happens in response to a problem"
  concept_label: an_idea_without_a_conflict_has_no_story_to_run_on
  label_origin: extractor_assigned
  claim: >
    Sullivan holds that a brand story requires an opposing force, and that most briefs remove it. The
    common brief describes life after purchase — a world with no cavities, no breakdowns, no
    overdrafts — which he says cuts to the end of the movie and short-circuits the structure that
    makes a story hold attention. His stated diagnosis of an uninspiring brief is that it states a
    solution rather than a problem, and he says creativity happens in response to a problem, so a
    brief phrased as a solution gives the maker nothing to respond to. He offers a headline test for
    the same point: nobody reads "Area Bank Not Robbed", not because the reader is bad but because
    attention tunes out an unchanged status quo.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Two mechanisms are given. First, structural: he reports Robert McKee's case that the mind is
      built to want a three-act movement from problem to unexpected solution, so removing the problem
      removes the structure. Second, attentional: he quotes Josh Weltman's account of interspecies
      alarm calls in a jungle to argue that heeding warnings is a deep default, which is why negative
      or threatening framings get through. Sullivan explicitly narrows this — it does not mean every
      advertisement should be a warning, only that a story needs both positive and negative forces in
      play.
  scope:
    domain_discussed_by_source: [advertising_concept_development, brand_communication, television_advertising]
    conditions: "brand storytelling and the writing of briefs; he allows conflicts as large as good versus evil or as small as a brand against a category annoyance"
