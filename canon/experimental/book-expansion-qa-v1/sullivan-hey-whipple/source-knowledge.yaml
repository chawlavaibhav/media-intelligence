- sk_id: sk_whip_0009
  source_id: sullivan-hey-whipple
  source_terms:
    - "a platform is a world with its own rules"
    - "platforms are ideas that create ideas"
    - "world building"
  concept_label: a_platform_is_a_rule_governed_world_not_a_campaign
  label_origin: extractor_assigned
  claim: >
    Sullivan draws a hard line between a campaign and a platform. A campaign he defines as a series
    of executions held together by similar messaging, typography, art direction, tone and
    architecture. A platform is a world with its own internal rules, and those rules can be used
    again and again to generate further stories — prequels, sequels, spin-offs. His governing claim
    is that the richer the set of rules in the world, the more stories can be pulled out of it, and
    that this is why platforms outlast campaigns. He applies the test to his own example: VW's
    computer-assisted parallel-parking campaign is excellent but is a world with essentially one
    rule — you change what is on either side of the parking space — whereas Coke Zero's "taste
    infringement" imports the whole rule set of the legal world and therefore keeps producing.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Rules are generative. A shared, internally consistent set of conventions gives a team a
      combinatorial space to recombine rather than a single idea to repeat, so the number of
      distinct further executions available is a function of the rule count rather than of further
      invention from scratch.
  scope:
    domain_discussed_by_source: [advertising_concept_development, brand_communication]
    conditions: "brand work intended to run over time; the source says a junior will be asked to add to campaigns before being asked to create platforms"
  caveats:
