- sk_id: sk_whip_0016
  source_id: sullivan-hey-whipple
  source_terms:
    - "big ideas transcend strategy"
    - "the strategy should be evident in the campaign, but the campaign should not be evident in the strategy"
    - "precise strategies liberate"
  concept_label: strategy_must_be_precise_but_must_not_become_the_execution
  label_origin: extractor_assigned
  claim: >
    Sullivan holds that a strategy has a workable band with a failure at each end. Quoting Norman
    Berry, he says vague strategies inhibit and precise strategies liberate — satisfy a tight
    strategy and the idea cannot be faulted however outrageous it looks. But he then states his own
    qualification: a strategy can become too precise, and when there is no play in the wheel it
    demands so narrow a range of executions that it has become an execution itself. He gives the
    test he wants applied, quoting Jean-Marie Dru's paired questions: could the campaign have been
    made without the brief (if yes, it lacks content), and is the campaign merely a transcription of
    the brief (if yes, there has been no creative leap). Separately he allows that a genuinely big
    idea may land off strategy, and that a good account team can retool the strategy around it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A strategy's function is to constrain the search without specifying the answer. Too little
      constraint gives the maker nothing to push against; too much leaves nothing to invent, so the
      brief has silently done the creative work and done it worse.
  scope:
    domain_discussed_by_source: [advertising_concept_development, brand_communication]
    conditions: "the relationship between an approved creative brief and the work made from it"
  caveats:
    - text: "the 'big ideas transcend strategy' allowance is stated as something that is 'sometimes okay' and depends on the account team being willing and able to retool; it is not a licence"
      origin: source_stated
    - text: "no test is offered for distinguishing a genuinely big off-strategy idea from a self-indulgent one, and the source's own metaphor — an idea as a nuclear bomb that need not land precisely on target — is an argument by analogy, not a criterion"
      origin: extractor_observed
  source_stated_problems:
    - "vague strategies inhibit"
