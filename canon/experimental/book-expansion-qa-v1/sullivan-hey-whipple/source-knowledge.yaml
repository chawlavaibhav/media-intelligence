- sk_id: sk_whip_0006
  source_id: sullivan-hey-whipple
  source_terms:
    - "first say it straight, then say it great"
    - "start literal, finish lateral"
  concept_label: write_the_flat_statement_first_then_spin_it
  label_origin: source_verbatim
  claim: >
    Sullivan's stated starting procedure is to write the thing you want to say flatly and without
    art, then make it memorable afterwards. He suggests literally beginning a headline with "This
    is an ad about …" and continuing, on the grounds that even if the result is unusable the writer
    has focused. He reports Thomas Kemeny's version — start literal, finish lateral — and endorses
    the image: you begin in a straight direction and then add spin, the way a knight in chess moves
    forward and then jukes sideways at the end.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Clarity is established before art is attempted, so the spin has something to be a spin on.
      The flat statement fixes what must survive, which is what stops the clever version from
      losing the selling idea in the act of expressing it.
  scope:
    domain_discussed_by_source: [copywriting, advertising_concept_development]
    conditions: "the opening move of a writing session, when the writer is working from a flat key message"
  caveats:
    - text: "presented as the author's own practice and one of several processes he offers, not as the only route"
      origin: source_stated
  source_stated_problems:
    - "you often lose the selling idea in the act of trying to express it creatively"
  source_stated_remedies:
    - "try beginning a headline with 'This is an ad about …' and then just keep writing"
    - "shorten it, punch it up, say it faster, say it in slang, add some attitude"
  examples:
    positive: [{description: "Kemeny's paired examples — literal 'A color printer for the price of a black-and-white printer' becoming lateral 'Millions of colors for the price of two'; literal 'Your teeth will be a bright shiny white' becoming lateral 'James, your smile is needed at the lighthouse'", figure_ref: null}]
    counter: []
