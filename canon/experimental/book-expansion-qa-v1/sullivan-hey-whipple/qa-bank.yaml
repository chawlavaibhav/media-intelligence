# Luke Sullivan, Hey Whipple, Squeeze This (6th ed., Wiley, 2022) — Q&A bank
# EXPERIMENTAL — NOT LIVE CANON. Lane: sullivan-hey-whipple, book-expansion-qa-v1. Non-merge.
#
# LOCATORS: EPUB, reflowable. THIS SOURCE HAS NO AUTHORED PAGE NUMBERS and none is invented.
# Every source_locator is chapter number + chapter title + the source's own section heading, with
# the spine marker as a file-position aid only. Audit pattern: no_authored_page.
#
# REGISTER: this source is a practitioner arguing from experience and taste. Where an item is about
# what Sullivan holds rather than about how the world is, answer_type is `source_position` and the
# answer says so. `support` states in every case whether the answer rests on a stated claim, a
# reported anecdote, or the author's opinion.
#
# SURVIVORSHIP: his examples are overwhelmingly award-winning or celebrated work — a selected sample
# he does not correct for. Items resting on such an example say so.
#
# SCOPE: advertising made by people for paid and earned media. No answer is translated into a model
# instruction and nothing here is evidence about generative capability.

qa_items:

# ── CONCEPT DEVELOPMENT: what an idea is ────────────────────────────────────

- qa_id: qa_whip_0001
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 6 'The Virtues of Simplicity', section 'Make sure the fuse on your idea isn't too long or too short' (spine 19)"
  question: >
    Sullivan calls comprehension speed the "Speed of the Get" and likens it to a fuse. Most advice
    about clarity treats slowness as the only failure. What is the second failure he names, and why
    does he say it is a failure at all?
  answer: >
    The fuse can be too short. An idea that resolves before the viewer has begun attending goes off
    with what he calls a quick, clueless bang, and that instant resolution tells the viewer there is
    nothing there worth being interested in. His example of the failure state is a STOP sign: an
    instant read with too little substance to have any effect. So the target is an optimum rather
    than a minimum. He immediately adds the asymmetry he actually observes in student work — almost
    all of it errs long, produced by over-complicating and thereby "encoding" the idea, giving a get
    that takes three or four beats longer than it should.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Stated claim, with the source's own two named failure directions and his stated judgement that
    students almost always err on the slow side. No measurement of either bound is offered.
  confounders:
    - "reading the fuse metaphor as 'faster is always better', which is exactly the reading the STOP-sign example is there to block"
    - "confusing this with the simplicity argument — reduction is his method for shortening a fuse, not the same claim as the fuse itself"
    - "assuming the too-short failure is the common one; he says the opposite about the work he sees"

- qa_id: qa_whip_0002
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 6 'The Virtues of Simplicity', section 'Keep paring away until you have the essence of your idea' (spine 19)"
  question: >
    Sullivan reports Neil French's arithmetic of a layout. State it in both directions, and say
    precisely what quantity it is a claim about.
  answer: >
    Every element added to an idea reduces the importance of all the other elements, and every item
    subtracted raises the visibility and importance of what is left. The quantity is relative
    prominence inside one composition — attention treated as fixed and divided among the elements
    present — not how much information a reader can absorb and not the piece's overall effect. This
    is why the removal test has force: an element that can be taken out without loss was not merely
    idle, it was diluting everything that stayed. French's demonstration removes body copy by making
    the headline work harder, then the tagline if it adds no new information, then attempts a visual
    that delivers the message alone with the logo absorbed into it.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Reported from a conversation with Neil French and endorsed by Sullivan, with a reproduced
    hand-drawn sequence. Asserted, not measured: no eye-tracking, recall or response data appears
    anywhere in the chapter.
  confounders:
    - "reading it as a claim about cognitive load or reading capacity rather than about salience within one layout"
    - "treating 'fewer elements' as the goal; the stated goal is that what remains should dominate"
    - "assuming the endpoint is always reachable — Sullivan concedes he reduced a print concept to a single image exactly once in a career"

- qa_id: qa_whip_0003
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 6 'The Virtues of Simplicity', section 'Make sure the fuse on your idea isn't too long or too short' (spine 19)"
  question: >
    A team is arguing about whether a supporting line should stay in a poster. One says it adds
    warmth; the other says it clutters. What operation does Sullivan give for settling this, and what
    does he call the element if the operation returns a particular result?
  answer: >
    Take it out and see whether the idea still works. If the idea fails without it, that element was
    what he calls a load-bearing beam and it stays. If the idea still holds up, the element was not
    needed and should go. The test replaces argument with subtraction, and Sullivan applies it to any
    element of any concept — image, phrase, word, headline, tagline, logo. Note what the test does
    not settle: it establishes necessity, not merit, and it depends entirely on the tester's own
    judgement of whether the idea "still works", for which he offers no external check.
  answer_type: repair
  difficulty: easy
  knowledge_type: concept_development
  requires_application: true
  support: >
    Stated remedy, in the source's own words. The same term is reused later as a description of
    damage: he says less experienced clients are particularly good at asking for the removal of the
    load-bearing beam.
  confounders:
    - "answering 'ask whether it is on strategy' — a different check that this source keeps separate"
    - "treating the removal test as a taste judgement about whether the line is good; it asks only whether the idea survives without it"
    - "assuming a load-bearing beam is always the largest or most prominent element"

- qa_id: qa_whip_0004
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'First say it straight, then say it great' (spine 17)"
  question: >
    Sullivan's clear-and-clever diagram is often summarised as "be clear but also interesting". What
    does his own explanation add that this summary loses?
  answer: >
    That the two demands are owed to different parties, which is why neither can be traded against
    the other. Clarity is owed to the client, who is paying for a message to arrive and is entitled
    to expect it. Interest is owed to the reader, who owes the advertisement nothing and, in his
    phrase, is not out there looking for "clear" — what customers notice is what is interesting. So
    the target is an intersection of two sets rather than a point on one scale, and each half has its
    own named failure: quoting George Felton, "I've seen that before" for the too-obvious end and "I
    don't get it" for the too-weird end. He is explicit that nothing tells you where the borders of
    the overlap lie in a given case, and that finding them is where essentially all the working time
    goes.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated claim plus a reproduced two-circle diagram; the two rejections are quoted from George
    Felton's textbook. Presented as a diagram rather than as a procedure, and the source says so.
  confounders:
    - "treating it as a single dial running from dull to clever, which is what the two-party argument denies"
    - "assuming the clever half is the hard one; his stated view is that both borders are hard and that finding them is the entire job"
    - "confusing the two rejections — 'I've seen that before' is the clarity-only failure, not the cleverness failure"

- qa_id: qa_whip_0005
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'The architecture of ideas' — 'A smile in the mind' (spine 17)"
  question: >
    Quoting McAlhone and Stuart, Sullivan says a witty idea does not travel all the way to its
    audience. What is the mechanism he claims this serves, and what does it cost?
  answer: >
    The audience must travel somewhere between five and forty percent of the way to unlock the idea,
    and their own act of completing it is the mechanism, not a side effect: it puts the mind in gear,
    and he reports the authors' claim that an idea that happens in the mind stays in the mind and
    leaves a stronger trace, because the person can re-create the pleasure by recalling it. He adds a
    gloss of his own about a small dopamine release at the moment of resolution. The cost is
    comprehension time — the distance the viewer travels is exactly what lengthens the fuse — so wit
    trades directly against his own Speed of the Get. Leave too much out and you mystify; put too
    much in and you bore.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: concept_development
  requires_application: false
  support: >
    Quoted from A Smile in the Mind and endorsed. The five-to-forty-percent range is a figure of
    speech from that book, not a measurement, and nothing in Sullivan operationalises it. The
    dopamine connection is his own, linking a general research item about effort evaluation to
    advertising comprehension; the cited research is not about advertising.
  confounders:
    - "treating the percentage range as a specification that could be applied"
    - "assuming Sullivan wants every idea to be witty; he claims only that this is how wit works when it is used"
    - "missing the trade-off with his fuse argument, which is the reason his simplicity chapter and his wit section are in tension"

- qa_id: qa_whip_0006
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'The paraprosdokian and the parallelism: Tension and release in a sentence' (spine 17)"
  question: >
    Sullivan names two sentence architectures for a headline and insists they are different. What
    does each require, and what single instruction applies to both?
  answer: >
    A paraprosdokian requires reinterpretation: the second half is unexpected in a way that forces
    the reader to reframe the first half, because the brain has already auto-filled a likely ending
    and the actual ending overturns it. A parallelism requires no reinterpretation at all — only
    opposition. Following Felton, you look for "two-fers": this versus that, this plus that, this but
    not that, not only this but that — a contrast that throws the benefit into relief. The shared
    instruction is positional: push the key words to the very end of the sentence, so the line goes
    off when the writer intends, like a firecracker at the end of a fuse. He adds that full
    reinterpretation is not always necessary; simply delaying the operative word can achieve a
    similar effect.
  answer_type: comparison
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated claim with worked headline examples for each structure. All the evidence is a selected set
    of celebrated headlines; no line that used the same structures and failed is discussed.
  confounders:
    - "collapsing the two into 'surprise endings', which loses the source's explicit point that a parallelism needs opposition and not surprise"
    - "assuming the delayed-key-word device is a third structure; he presents it as a weaker form of the same positional rule"
    - "treating the structures as sufficient — his own framing is that they build tension, not that they make a line good"

- qa_id: qa_whip_0007
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 7 'Why Is the Bad Guy Always More Interesting?', section 'Brand platforms: the mother of stories' (spine 21)"
  question: >
    A client asks for "a campaign that will last". Using Sullivan's own definitions, what is the
    difference between a campaign and a platform, and what property decides how long the thing keeps
    producing?
  answer: >
    A campaign, in his working definition, is a series of executions held together by similar
    messaging, typography, art direction, tone and architecture. A platform is a world with its own
    internal rules, and those rules can be used again and again to spin further stories — prequels,
    sequels, spin-offs. The property that decides longevity is the richness of the rule set: the more
    rules to your world, the more stories can be pulled out of it, which is why he says platforms
    outlast campaigns. He applies this to his own examples rather than exempting them: a
    One Show-winning parking-assistance campaign is excellent and is a world with essentially one
    rule — change what is on either side of the space — whereas a soft-drink platform that imported
    the entire rule set of the legal world kept generating spin-offs, a web mechanic and billboards.
  answer_type: comparison
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Stated definitions, explicitly offered "for the purposes of discussion" rather than as industry
    standard terms, with two named campaigns compared by inspection. Rule count is never defined or
    counted.
  confounders:
    - "answering in terms of duration or budget rather than in terms of a generative rule set"
    - "assuming a platform must be bigger or more expensive; his distinction is structural"
    - "treating Ogilvy's thirty-year durability test as the same idea — that is a criterion for a big idea, not an account of why a rule set keeps producing"

- qa_id: qa_whip_0008
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 7 'Why Is the Bad Guy Always More Interesting?', section 'Two signs you have a platform' (spine 21)"
  question: >
    Sullivan gives two signs that an idea has reached platform size. Name both, and say which one you
    should distrust most and why.
  answer: >
    First, it fits on a sticky note: a big idea can be summed up in a sentence, and needing more than
    a sentence or two to set it up means it is probably not there yet. Second, once spoken aloud its
    rules start talking and the platform unpacks itself — other people in the room begin generating
    executions unprompted. The second is the one to distrust, because it is a social measurement: it
    is confounded by who is in the room and by the enthusiasm of whoever is presenting, and Sullivan
    does not address this. He also hedges the first himself, calling it "kind of weird" and framing
    the whole formula around it as a tool rather than a rule.
  answer_type: source_position
  difficulty: hard
  knowledge_type: concept_development
  requires_application: false
  support: >
    Both signs are stated claims, demonstrated on his own example and on classroom work. The
    weakness of the second is an extractor observation about a confound the source leaves unexamined;
    the hedge on the first is his own.
  confounders:
    - "reporting the sticky-note sign as a length limit for a tagline; it is a test of whether the idea has one centre"
    - "treating spontaneous generation in a room as evidence about audiences rather than about colleagues"
    - "assuming these are tests of quality; they test for size and legibility of the rule set"

- qa_id: qa_whip_0009
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 7 'Why Is the Bad Guy Always More Interesting?', section 'Truth + conflicts = platform' (spine 21)"
  question: >
    A student is working on a footwear brand the client describes as "comfortable". Walk through
    Sullivan's two-step generator on that assignment and say what the second step is actually
    supposed to deliver.
  answer: >
    Step one is the truest thing that can be said about the brand — not the client's preferred truth.
    For his worked case the client's truth was "comfortable" and the class's truth was "ugly". Step
    two is to look for the conflicts that arise as a consequence of that truth: wearing ugly shoes
    makes you look stupid, or costs you your evening. The student's page read UGLY + YOU WON'T GET
    LAID. What the second step delivers, in Sullivan's own single word, is focus: the campaign now
    has three fixed requirements — communicate comfort, acknowledge that the shoes are ugly, admit
    that wearing them removes sex appeal — instead of an open field. The resulting platform borrowed
    its whole rule set from the world of contraception while still delivering the comfort message the
    client needed.
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: >
    The worked example is the source's own classroom case. He explicitly refuses the word formula and
    calls it a tool — "use it if it works for you". The campaign was never produced and no outcome is
    reported.
  confounders:
    - "starting from the client's stated benefit, which is the step the exercise exists to displace"
    - "treating the conflict as something to be found in the category; here it is a consequence of the truth"
    - "concluding the client's message gets abandoned — the platform is required to still deliver comfort"

- qa_id: qa_whip_0010
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 7 'Why Is the Bad Guy Always More Interesting?', section 'When everything is okay, we aren't interested' (spine 21)"
  question: >
    A brief reads: "We believe fresh food means better health." Sullivan's team could not work with
    this. What exactly is wrong with it on his account, and what is the general diagnosis?
  answer: >
    It states a solution, not a problem. His stated principle is that creativity happens in response
    to a problem, so a brief phrased as a solution gives the maker nothing to respond to — solutions,
    in his phrase, are about as interesting as filled-in crossword puzzles, because the interesting
    part is over. The general diagnosis is that most briefs cut to the end of the movie: they
    describe life after purchase, a world with no cavities and no breakdowns, which removes the
    opposing force that a story runs on. His headline test for the same point is that nobody reads
    "Area Bank Not Robbed" — not because readers are morbid, but because attention tunes out an
    unchanged status quo.
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: >
    The brief and the team's failure to work with it are the source's own report. The underlying
    story claim is drawn from Robert McKee's screenwriting book and from a trade book's argument
    about interspecies alarm calls; neither is evidence about advertising.
  confounders:
    - "diagnosing the brief as vague — it is specific, and its problem is structural"
    - "reading the argument as a case for negative advertising, which Sullivan explicitly denies in the same section"
    - "assuming any conflict will do; his exemplars all tie the conflict to the product's actual role"

- qa_id: qa_whip_0011
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 7 'Why Is the Bad Guy Always More Interesting?', sections 'To spark story, start with this versus that' and 'If a conflict isn't immediately apparent, make one up' (spine 21)"
  question: >
    You are handed an undifferentiated commodity — bananas — and asked for a campaign. Sullivan says
    the open assignment freezes his pen. What device does he impose, and what does he do when the
    category itself contains no conflict?
  answer: >
    He draws a rectangle with a line down the middle, treats the line as the word "versus", and fills
    either side with any opposition that comes to mind — life with the product versus without it, our
    product versus theirs, or anything else. He reports that the same assignment stated as an
    opposition ("Coke versus Pepsi") starts producing ideas where the open version produced nothing.
    When no in-category conflict exists, his instruction is to invent one, and for bananas
    specifically to go outside the category: good food versus junk food, has its own wrapper versus
    canned foods, ready to eat versus food you have to cook. His stated point is that any of these
    could carry a story more interesting than "bananas have potassium", which he calls "milk builds
    strong bones all over again".
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: >
    Stated device, demonstrated on his own worked list. The evidence that the framing helps is his
    introspective report of what his own pen does; no comparison of output under the two framings is
    offered.
  confounders:
    - "assuming the conflict has to be true of the category — he explicitly permits inventing one"
    - "treating this as competitive positioning; the opposition may have nothing to do with a competitor"
    - "answering with the truth-plus-conflicts formula, which is a different move that starts from a brand truth"

- qa_id: qa_whip_0012
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 7 'Why Is the Bad Guy Always More Interesting?', section 'Brand as archetype' (spine 21)"
  question: >
    Sullivan suggests casting a brand as an archetype from the Hero's Journey. He then adds a role
    assignment that most brand advertising gets backwards. What is it, and why does the archetype
    device work at all?
  answer: >
    The brand is not the hero. The customer is the hero, and the brand is the archetype the hero
    meets — the figure who teaches a lesson or grants a power before the hero returns transformed.
    The device works because archetypes are shared: the audience already knows how a Caregiver, a
    Trickster or a Magician behaves, so casting the brand as one imports a stock of expected
    behaviour that does not have to be established first, and the character traits start suggesting
    stories. He notes the related compressions — Wieden's and Dru's "brands are verbs" (IBM solves,
    Nike exhorts, Sony dreams) and his own "brand = adjective".
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Stated claim with a figure of his own brand-archetype pairings, which he presents as his and
    invites the reader to disagree with.
  confounders:
    - "casting the brand as the hero, which is the default the instruction is written against"
    - "treating archetype, verb and adjective as three names for one technique; they operate at different levels"
    - "assuming archetypes are universal — the stock of expected behaviour is culturally supplied"

- qa_id: qa_whip_0013
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 3 'Tell the Truth and Run', section 'Three final notes on strategy' — 'Insist on a precise strategy' (spine 13)"
  question: >
    Norman Berry's line is that vague strategies inhibit and precise strategies liberate. Sullivan
    endorses it and then qualifies it. What is the qualification, and what pair of questions does he
    want used to detect both failures?
  answer: >
    A strategy can become too precise. When there is no play in the wheel, an over-specified strategy
    demands so narrow a range of executions that it has become, by proxy, an execution itself. So
    there is a workable band with a failure at each end, and the strategy can be moved along a
    continuum between meaningless breadth and purse-lipped dictums. His stated test is Jean-Marie
    Dru's mirrored pair. Could the campaign have been created without the brief? If yes, the campaign
    is lacking in content. Is the campaign merely a transcription of the brief? If yes, there has
    been no creative leap and it lacks executional force. His summary is that the strategy should be
    evident in the campaign, but the campaign should not be evident in the strategy.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Berry and Dru are quoted; the qualification about over-precision is Sullivan's own. No test is
    offered for locating the band in a given case beyond the two questions.
  confounders:
    - "reporting only the 'precise strategies liberate' half, which is the received version and is the half he qualifies"
    - "treating the two Dru questions as the same question asked twice; they detect opposite failures"
    - "confusing this with his separate allowance that a big idea may land off strategy"

- qa_id: qa_whip_0014
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 3 'Tell the Truth and Run', section 'Start with a central human truth' (spine 13)"
  question: >
    Sullivan separates facts from truths and says the distinction decides whether a campaign has
    anywhere to go. Give his standing example of each, and say what kind of work produced the truth.
  answer: >
    The fact is "milk builds strong bones" — measurable, chart-friendly, which is why he says clients
    love facts, and, on his account, something nobody has ever acted on. The truth, which produced
    the campaign that sold milk by the trainload, is that milk is bought because it goes with things:
    nobody sits down to a bowl of milk, they sit down to cereal or cookies or a sandwich. It came
    from ethnographic work — researchers placed in paid participants' homes to shop and cook with the
    families — not from a survey. The general form is that a fact describes the object while a truth
    describes the buyer's actual relationship to it, which is where the purchase is decided. He adds
    that clients frequently pay to uncover such truths and then, frightened, cover them back up,
    because the client does not own the truth; customers do.
  answer_type: comparison
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: >
    Stated claim illustrated by one celebrated campaign reported second-hand. The inference from that
    single case to a general rule about facts and truths is the source's.
  confounders:
    - "treating a truth as simply a more emotional fact; his distinction is about whose relationship is being described"
    - "assuming truths come from research — he says you generally know a truth instinctively and that it is almost never in the brief"
    - "taking his recommendation to study stand-up comedians as a research method; it produces observations about a comedian's audience, not a client's customers"

- qa_id: qa_whip_0015
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 2 'The Creative Process', section 'Brand = adjective'; and Ch. 6 opening argument (spines 11, 19)"
  question: >
    Sullivan reports that audiences in every city he has lectured in answer "safety" when asked what
    Volvo stands for, and adds that Volvo has not recently appeared in lists of the safest cars. He
    reads this as evidence of one thing. What second reading does his own evidence permit that he
    does not draw?
  answer: >
    He reads it as the power of simplicity: a brand that successfully welded one adjective to its
    marque rides the benefit of that position in customers' minds long after its products stopped
    meriting the distinction. The reading he does not draw is the uncomfortable one — that a
    successfully installed brand adjective can survive the loss of the underlying truth, which makes
    the same mechanism a way of sustaining a claim the product no longer supports. His own argument
    elsewhere in the book is that advertising must be built on truth and that customers, not clients,
    own it; the Volvo case is a place where those two commitments pull against each other and he does
    not reconcile them.
  answer_type: source_position
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: >
    The audience-poll result and the observation about safety rankings are both his. The second
    reading is an extractor observation about a tension the source leaves open, not a claim he makes.
  confounders:
    - "treating the audience poll as a measurement; it is an informal show of hands at his own lectures, an audience already interested in advertising"
    - "concluding that Sullivan endorses making claims a product no longer supports — he does not raise the question at all"
    - "assuming the adjective must be the strongest available attribute; his advice where good adjectives are taken is to try a polar opposite or a flanking move"

# ── PROCESS: generating volume, judging, getting unstuck ────────────────────

- qa_id: qa_whip_0016
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Work fast. Fail faster.' (spine 15)"
  question: >
    Sullivan grants that a beginner can write a beautiful headline. Where does he locate a senior
    writer's actual advantage, and what arithmetic follows from it?
  answer: >
    Not in the quality of the first idea but in the speed of discard. He says he knows when to
    abandon an approach that is not working, and how to pick up an idea, inspect its possibilities
    and decide quickly to keep it or drop it. The arithmetic he states is that he can produce fifty
    really horrible ideas in the time it takes a junior to produce ten, and that the quantity
    produced in a fixed period is what raises the odds of striking quality sooner. Because the search
    is iterative — he quotes "all art is a series of recoveries from the first line drawn" — the
    bottleneck is evaluation speed, not generation quality.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Self-report about his own working speed, with no external measurement; the fifty-versus-ten
    figure is illustrative. He does not address the possibility that fast discard also discards good
    ideas faster.
  confounders:
    - "answering that experience produces better ideas, which is the claim he explicitly declines to make"
    - "reading 'fail faster' as tolerance of failure rather than as speed of judgement"
    - "confusing this with his separate rule that judgement is suspended during generation — the discard he means here is within the generating pass"

- qa_id: qa_whip_0017
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'If the idea needs a headline, write 100' (spine 17)"
  question: >
    Sullivan sets a volume target rather than a quality target for headline writing. State the target
    and the two conditions he attaches, one of which is usually dropped when this advice is repeated.
  answer: >
    Write a hundred lines, across several sessions. The first condition is that they all have to be
    pretty good — the target is a hundred workable lines ranging from decent to very strong, not a
    hundred attempts, and this is the condition usually dropped. The second is that between rounds
    you start over on a clean page and constantly pretend you have nothing so far. His argument for
    the number is that we cannot seriously believe a ticket-selling, brand-building campaign has been
    crafted after nineteen tries, and that a couple of hundred will be needed. He also gives the
    reason the target has to be set in advance: around half past two in the morning, "good" starts to
    look like "great", and volume produced earlier is what lets you refuse it.
  answer_type: factual
  difficulty: easy
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated target, illustrated by a reprinted working list of roughly fifty motorcycle headlines
    behind five finished advertisements. The hundred is a working figure he sets, not a measured
    optimum, and the reprinted list is the surviving work behind award-selected advertisements.
  confounders:
    - "reporting it as 'write a lot', which loses the quality condition that distinguishes it from undirected output"
    - "assuming one session; he explicitly spreads it across several"
    - "reading the reprinted list as a natural sample of a writer's output rather than as the working list behind five successful advertisements"

- qa_id: qa_whip_0018
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Low-hanging fruit, the barren wasteland, and eureka' (spine 15)"
  question: >
    Ideas are arriving easily in the first hour of a session and the team feels it is going well.
    What does Sullivan say this means, and what does he instruct?
  answer: >
    He says to distrust it. Early ideas that come quickly are easy, and his objection is availability
    rather than quality: pretty much everybody else working the same problem will see the same easy
    solutions. The instruction is not to discard them but to write down every too-easy idea and move
    on, because one may later be convertible into something new. He then names what comes next and
    says there is no shortcut through it — the stretch where nothing usable arrives, which he maps
    onto the incubation step of James Webb Young's five-step model and treats as an expected stage
    rather than as failure. His summary of the ordering is that the breakthrough arrives only after
    the slog.
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: >
    Stated claim. The availability argument is asserted, not shown — no instance is given of the same
    easy idea appearing independently. The incubation account is inherited from a 1940s copywriter's
    model that he endorses without testing, and he says plainly he does not know where ideas come
    from.
  confounders:
    - "treating ease as a sign of a strong idea, which is the intuition the passage is written against"
    - "discarding the easy ideas rather than recording them; he says to write them down"
    - "confusing the barren stretch with a failure of the assignment, which is exactly what he says it is not"

- qa_id: qa_whip_0019
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', sections 'Dig shallow holes everywhere' and 'Review all the ideas so far and look for patterns' (spine 15)"
  question: >
    Sullivan's search runs in two phases and then reverses. Describe the phases, say what the first
    is looking for, and say what he does when the second phase fails.
  answer: >
    First, dig shallow holes all over the brief's territory: quick sketches against simple executions
    — a billboard, a tagline, a script — and do not stop to develop even a promising find. What that
    phase is looking for is stated precisely in the book he quotes: proof of concept, just enough
    validation to know a direction could be worth digging into, not a finished idea. Second, once a
    direction is chosen, the Deep Dig drives it everywhere the brand meets people, which the quoted
    agency extends past advertising into store design, uniforms, customer experience, internal
    communications and product ideas. When the deep phase fails — and he says an idea that looks huge
    can resist being enlarged — the move is to go back to digging shallow holes and create more
    ideas. He describes the same alternation in the language of convergent thinking, which groups
    possibilities, and divergent thinking, which creates them.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Stated procedure; the two-phase account and the Deep Dig terminology are quoted from another
    agency's book and endorsed. No criterion is offered for how many shallow holes is enough.
  confounders:
    - "treating the shallow phase as brainstorming for volume; its stated purpose is proof of concept per direction"
    - "assuming the sequence runs once; he is explicit that it oscillates"
    - "confusing the Deep Dig with production — it is idea development across every brand touchpoint"

- qa_id: qa_whip_0020
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Review all the ideas so far and look for patterns' (spine 15)"
  question: >
    Most advice on campaigns starts by specifying the campaign idea. Sullivan's route runs the other
    way. Describe it, and name the sentence he repeats twice as its summary.
  answer: >
    After the wall is covered and the herd thinned by a cold edit, you stand back and look for
    overlaps between the surviving ideas — visual, verbal, or by medium — reposition similar ones
    into clusters and keep looking. His repeated summary is: patterns are campaigns trying to come to
    life. Once a cluster of even two ideas that plainly belong together appears, the gears reverse:
    the pair is treated as the main idea and further ideas are pulled out of it. The campaign is
    treated as latent in the work already made rather than as something specified in advance — his
    image is a handful of pearls on a table with the thread still to be found.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Stated procedure, with the summary line printed twice in the chapter. He concedes the divergent
    phase may fail, so a pattern found this way is not guaranteed to be a campaign.
  confounders:
    - "assuming clustering by resemblance is the same as clustering by shared mechanism; the source does not distinguish them"
    - "placing this step before the cold edit rather than after it"
    - "reading a found pattern as a platform — his platform criteria are separate and stronger"

- qa_id: qa_whip_0021
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', sections 'Try being half-rational, half-random' and 'Don't just start writing headlines willy-nilly' (spine 17)"
  question: >
    You have a spirits brand whose product description mentions a Kentucky creek, charred oak barrels
    and nine years of ageing. Apply Sullivan's two named session devices and say what metric he
    actually cares about.
  answer: >
    First the collider. Build a BRAND list straight from the description — hand-bottled, smooth,
    expensive, warming, nine years, strong — and a second list from one theme the product implies,
    say KENTUCKY, filled with every word and idiom the theme brings up: pure water, moonshine, creek,
    jug, hillbillies, old-fashioned, white lightning. Then let the eye jump between the lists pairing
    items, half by systematic permutation and half by accident. Crossing "expensive" with the feud
    imagery gave him "What the Hatfields would serve the Rockefellers." Second, the door-rattling
    method: work one attribute at a time — age, then what else happens in nine years, then place,
    then how the drink is taken — grouping output under each heading before moving on. The metric he
    states is not line count: it is how many different doors you went through, how many different
    ways you looked at the same problem.
  answer_type: application
  difficulty: medium
  knowledge_type: copywriting
  requires_application: true
  support: >
    Both devices and the worked lists are the source's own, from his files. He notes the printed
    lines conceal about five scratched-out starts each, and says the technique becomes automatic with
    practice — scaffolding rather than a permanent method.
  confounders:
    - "measuring the session by how many headlines were produced, which is the metric he explicitly displaces"
    - "assuming the second list must be distant from the product; in this device it is drawn from the product's own associations"
    - "treating the associations as portable — his Kentucky list runs on American regional stereotypes and folklore"

- qa_id: qa_whip_0022
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 8 'Rewiring Your Brain', section 'Monahan's Intergalactic Thinking' (spine 23)"
  question: >
    Intergalactic Thinking and the word collider both work by colliding two lists. What single
    setting differs between them, and what does Monahan say about how the second domain should be
    chosen?
  answer: >
    The distance of the second list. The collider draws it from the product's own associations; the
    intergalactic technique deliberately chooses a domain as far from the problem as possible.
    Monahan's stated selection criteria for that domain are three: fairly familiar to you, very
    unrelated to your line of work, and containing many data points — he names the farm, the ocean
    and the circus as good, and rejects backgammon, taxidermy and Russian musical instruments not
    because they are related but because they are thin. The underlying rule Sullivan quotes is that
    the promising connective question is not "what if we combine A and B" but "what if we combine A
    and Z". Sullivan's own near-domain variant runs the same machinery in reverse to produce a short
    telegraphic name for a campaign first, and then writes the campaign from the name.
  answer_type: comparison
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Quoted at length from Monahan's book with permission and endorsed. Sullivan's own live
    demonstration produces material he immediately says does not work; the one fully worked case
    reached a campaign that, he records in a footnote, the client killed within two minutes.
  confounders:
    - "assuming any unrelated subject will serve; thinness of the domain is Monahan's stated disqualifier"
    - "conflating the two variants, which differ precisely in the distance setting"
    - "treating the naming variant as a hashtag tactic; the claim is about producing the idea, not about distribution"

- qa_id: qa_whip_0023
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 8 'Rewiring Your Brain', section 'Tom Monahan's wonderful exercise: Ask a better question' (spine 23)"
  question: >
    Monahan's ladder has a precise terminal condition. State the three rungs by what kind of answer
    each admits, and say what Sullivan instructs the first question and first answer to be.
  answer: >
    Rung one is a basic question relevant to the problem for which there is a correct answer, so no
    creativity is involved. Rung two is derived from the previous answer and admits only an educated
    guess, so some creativity is involved. Rung three is derived again and has no correct answer that
    can be known or even guessed, so creativity is required — and that is the better question.
    Sullivan instructs that the first question always be "why should people buy this brand?" and the
    first answer be the key message you were given, so the ladder starts inside the brief and climbs
    out of it. He notes the search is not linear: many threads dead-end, and the move is to back up,
    rephrase the last question and continue. He calls it, in his own coinage, the Toddler Socratic
    Method.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: creative_process
  requires_application: false
  support: >
    Lifted whole from Monahan's book with permission; the teaching frame and the worked cases are
    Sullivan's. Monahan's own stated mechanism is that ordinary questions let the answerer stay
    inside the known, because an answer is by definition something that already exists.
  confounders:
    - "treating the three rungs as a fixed length; Sullivan says finding the right question can take thirty or forty rounds"
    - "starting from a creative ambition rather than from the brief's key message"
    - "assuming any unanswerable question qualifies; it must be derived from the previous answer and stay on the problem"

- qa_id: qa_whip_0024
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 8 'Rewiring Your Brain', section 'Try rewriting the brief's key message as a key question' (spine 23)"
  question: >
    Sullivan proposes replacing the key message on a brief with a key question. What is his argument,
    and what does he say the word "message" quietly presupposes?
  answer: >
    His argument is about potential energy. A key message is fully cooked and asks nothing of the
    maker; a question is unfinished, which is what gives it spring — it is a riddle that produces an
    itch a creative person will want to scratch with ideas. He also names the presupposition: the
    word "messaging" presupposes that the solution to the client's business problem is a message,
    which it may not be, and creatives compound this by reading the line item on the brief as the
    solution rather than as an input. He reports that a famous milk campaign's brief took exactly
    this form — not "milk builds strong bones" but "what happens if there's no milk?" — and describes
    the moment the right question is handed over as the point where "why" turns into "what if".
  answer_type: source_position
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Stated position, with one reported case. This is a proposal about how briefs should be written,
    argued from the psychology of the maker rather than from any evidence about outcomes.
  confounders:
    - "treating this as a claim that briefs should be vaguer; a key question is required to come out of the heart of the issue and be as clear and naked as possible"
    - "assuming the question replaces strategy; it replaces the message line item"
    - "reading it as advice for a junior's first week — he places problem-finding after the brief has been answered"

- qa_id: qa_whip_0025
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 8 'Rewiring Your Brain', section 'Why solve problems when finding problems is way cooler?' (spine 23)"
  question: >
    Sullivan distinguishes problem-solving from problem-finding and then concedes something that
    largely defeats his own recommendation. What is the distinction, and what is the concession?
  answer: >
    Problem-solving answers the question the brief asked, and he characterises most agency work as
    maintenance of that kind — inventory changes, expired music licences, a client changing their
    mind. Problem-finding challenges the question: the team steps back, questions its own
    assumptions, and studies the client's customers, stores, data and systems for bottlenecks,
    redundancies and unmet needs, and once it finds a problem the client did not know it had, the
    work becomes problem-solving again. He states why no brief will ever ask for it: you cannot place
    an order for something that does not exist yet. The concession is structural — agencies, like
    most businesses, hire only enough staff to service current business, so creatives rarely have the
    hours to think deeply about a client's bigger issues, and it is problem-solving around the clock.
    His practical placement is therefore: do it after delivering what the brief asked for.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Stated claim and stated concession, both his. His assertion that most agency leaders' biggest
    successes did not come from a brief is offered as something they would admit if honest — a claim
    about a counterfactual with nothing supporting it.
  confounders:
    - "treating problem-finding as a synonym for creative ambition; it is a specific activity aimed at the client's business rather than at the communication"
    - "missing the concession, which is what turns this from advice into an argument about how agencies are staffed"
    - "assuming a junior should do it instead of the brief rather than after it"

- qa_id: qa_whip_0026
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Allow your partner to come up with terrible ideas. Don't play devil's advocate.' (spine 15)"
  question: >
    Sullivan permits devil's advocacy in one place and forbids it in another, and he names one
    specific behaviour that must never happen. What is the split, what is the behaviour, and what
    does it actually cost?
  answer: >
    Devil's advocacy is legitimate when road-testing an idea before taking it to a client, and has no
    place in the early creative process, where the substitute is the angel's advocate: ask what is
    good about the idea and what you like about it. The forbidden behaviour is smirking or rolling
    your eyes at a bad idea — never, even when the idea is genuinely bad; the prescribed reply is a
    neutral "Hmmm, that's interesting" and moving on. The cost is not to the dismissed idea but to
    future supply: he reports getting stuck on a half-idea his partner then carried over the line, so
    an idea one person cannot advance may be advanceable by the other. Visible contempt stops the
    partner offering half-ideas at all.
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: >
    Stated rule with his own reported experience. Practice wisdom from his teams; no study of team
    behaviour is cited. He separately warns against the opposite excess — saying aloud every thought
    that arrives.
  confounders:
    - "reading it as a general ban on criticism; the pre-client road test is explicitly exempted"
    - "locating the cost in the rejected idea rather than in the partner's future contributions"
    - "confusing it with his instruction not to talk about work in the hallway, which concerns broadcasting, not the partner"

- qa_id: qa_whip_0027
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', sections 'Work. Don't talk. Work.' and 'Be objective' (spine 15)"
  question: >
    Sullivan tells makers not to talk about work in progress but prescribes one exception. Give the
    two costs he names and the exact terms of the exception.
  answer: >
    The first cost is to the maker: talking converts energy that could go into being creative into
    talking about being creative. The second is to the idea's reception — an idea described is never
    as exciting as the idea itself, so early description spends the listener's enthusiasm at the
    worst exchange rate. The exception is late and narrowly framed: once ideas are on paper and
    polished to your satisfaction, walk them round the hallways before the creative director sees
    them, explicitly not seeking consensus but running a disaster check, and treat a problem raised
    independently by two people as probably real. The reason it comes after polish is the second cost
    — an unfinished idea has to be reconstructed in the listener's head from an account that does not
    carry what makes it work.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Stated rule and stated exception. The two-people-agree heuristic is offered as "chances are it's
    real", a probability judgement rather than a rule.
  confounders:
    - "reading the rule as applying to the writing partner, which would contradict his account of teamwork"
    - "treating the hallway round as seeking approval; he says explicitly it is not a search for consensus"
    - "running the disaster check before the work is polished, which is what the second cost argues against"

- qa_id: qa_whip_0028
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 15 'Creative Mind Versus Monkey Mind', section 'What to do when you're stuck' (spine 37)"
  question: >
    A team has half a notebook of unfinished approaches, none of which is working, and two days left.
    Which of Sullivan's repair moves fits this specific situation, and what is his stated reason?
  answer: >
    Blow it all up and start on a fresh pad. His stated reason is that the old half-ideas may be
    serving only to muddy the waters, and that the maker may be subconsciously holding on to some
    approach they want to work but which never will. He gives a second move for a different symptom
    — if you are stuck mid-problem, change something: solve the same problem as if it were a
    different medium, or as if the budget were nearly nothing, then come back. And a third for a
    different symptom again: an idea that has been forced onto paper after hours of wrestling bears
    the dents of the fight and lacks the elegance of one that arrived, so abandon it rather than
    repair it. Note the tension he leaves unresolved — his other advice is to stay in the room and
    suffer through it, and he gives no rule for choosing between persisting and changing.
  answer_type: repair
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: >
    Stated remedies, each attached by the source to a different symptom. The unresolved tension
    between persisting and changing is an extractor observation.
  confounders:
    - "applying 'start from where you are', which is his move for a project too large to begin, not for a notebook of failed approaches"
    - "trying to rescue the best of the half-ideas, which is the behaviour the muddy-waters argument warns against"
    - "reading 'change something' as changing the strategy; his examples change the medium or the budget, leaving the problem fixed"

- qa_id: qa_whip_0029
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 15 'Creative Mind Versus Monkey Mind', section 'What to do when you're stuck' — 'Start from where you are' (spine 37)"
  question: >
    Sullivan borrows Anne Lamott's "start from where you are" for large projects. What is the
    mechanism he claims for it, and what does he offer as his own demonstration?
  answer: >
    The mechanism is that you cannot see the other doors until you go through the first one — he
    attributes the phenomenon, calling it creative adjacencies, to Steven Johnson. Faced with a
    project too large to begin, you reach into the pile and take the piece that interests you most,
    regardless of where it belongs in the whole, because interest is what will get you started; and
    as soon as one idea exists on that piece, doors open on either side of it that were invisible
    before. His demonstration is the book itself: he began writing at what became its sixth chapter,
    on simplicity, because that was the part he most wanted to write, and left the opening chapters
    until later.
  answer_type: mechanism
  difficulty: easy
  knowledge_type: creative_process
  requires_application: false
  support: >
    Borrowed from a novelist's writing advice and endorsed; the demonstration is his own writing of
    this book, not an advertising project.
  confounders:
    - "reading it as advice to do the easy part first; the criterion is interest, not ease"
    - "assuming the running order must then be preserved; the point is that sequence can be resolved afterwards"
    - "confusing it with his instruction to just start, which addresses resistance rather than scale"

- qa_id: qa_whip_0030
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Write hot. Edit cold.'; repeated in Ch. 5 'Flow and readability' (spines 15, 17)"
  question: >
    Sullivan repeats "write hot, edit cold" in two chapters. What is the mechanism he gives for the
    hot half, and what does he actually prescribe for the cold half?
  answer: >
    The mechanism for the hot half is mechanical and specific: if you try to edit too much in your
    head, your pen will stop moving. So generate without editing and let the words come out any way
    they want. The cold half is not merely "edit later" — he prescribes a cooling interval first, so
    the second pass is done with distance, and then a three-way sort: keep only the A-plus work, put
    the A-minus and B-plus in a separate pile to revisit, and either kill or shelve everything below.
    His strong form is that all first drafts are crap and all good copywriting is rewriting. What he
    does not supply is any criterion for what counts as A-plus; the grading is left entirely to the
    maker.
  answer_type: mechanism
  difficulty: easy
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated rule, printed in both the concepting and copywriting chapters. The grading scale is his
    own shorthand with no defined criteria.
  confounders:
    - "treating it as a preference for speed rather than as a claim about what simultaneous judgement does to production"
    - "omitting the cooling interval, which is what he says makes the cold pass cold"
    - "assuming everything below the top tier is discarded; two of the three tiers are retained"

# ── DIAGNOSIS: the source's named faults, applied ───────────────────────────

- qa_id: qa_whip_0031
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'The clever-headline, straight-visual rule' (spine 17)"
  question: >
    A poster shows a cracked windscreen; the headline reads "Your windscreen is cracked." A reviewer
    calls it clear and on-brief. What does Sullivan call this, and where does he locate the fault?
  answer: >
    A see-say advertisement — the rookie error of showing the headline. He describes the symptom as
    every element trying too hard and either repeating or tripping over one another, and states the
    rule in both directions: never show what you are saying or say what you are showing. The fault is
    not in either element individually but in the relation: he treats the distance between what is
    said and what is shown as the variable that sets the size of the shift in the reader's head, so a
    visual that closes that distance to zero leaves the reader nothing to do and wastes the second
    element. His requirement is that the visual amplify the headline or reinterpret it. He grants that
    a supporting element may be deliberately straight — his own preferred pattern is one clever
    element and one straight one — but the straight element must still add something, and he supplies
    no test for where support becomes restatement.
  answer_type: failure_diagnosis
  difficulty: easy
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    Stated failure with the source's own name for it, alongside his clever/straight rule. His
    positive example — a motorcycle advertisement whose visual alone is tame and whose headline alone
    is almost meaningless — is a reproduced image this extraction could not inspect.
  confounders:
    - "judging it acceptable because it is clear and on-brief, which is the reviewer position the diagnosis is written against"
    - "confusing the see-say with the clever-headline/straight-visual rule, which permits a plain visual that adds"
    - "locating the fault in the headline alone rather than in the relation between the two elements"

- qa_id: qa_whip_0032
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Get the visual clichés out of your system right away'; and Ch. 3 'Look at the competitors' advertising' (spines 15, 13)"
  question: >
    Sullivan says visual clichés are not general but category-specific. What working procedure does
    that imply, and what stops this from being a blanket ban on familiar imagery?
  answer: >
    It implies research rather than taste: go and learn which images your category is currently
    using — visit the competitors' sites, watch their videos, study what they post — and then do not
    use those. His examples are category-bound: grandfathers flying kites with grandchildren in
    insurance, earnest bespectacled people with a screen reflected in their glasses in technology.
    The mechanism is availability, the same argument he makes about early ideas: a cliché is what the
    whole category already reaches for, so using it puts the brand inside the category's existing
    visual field rather than distinguishing it from it. What stops it being a blanket ban is his own
    endorsement of borrowed image equity: an established image given a spin and used in a new and
    unexpected way that relates to the product advantage is the metaphor he recommends. The
    prohibition is on unmodified reuse, not on familiar imagery.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    Stated procedure and stated examples. Which images count as tired is judged by inspection and is
    time- and market-bound; his examples are American category conventions of his period.
  confounders:
    - "treating the cliché list as universal rather than as something to be assembled per category"
    - "reading it as a prohibition on recognisable imagery, which his metaphor advice contradicts"
    - "assuming novelty alone resolves it — his metaphor condition requires the new use to relate to the product advantage"

- qa_id: qa_whip_0033
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Think it through before you settle for the ol' exaggeration thing' (spine 15)"
  question: >
    Sullivan puts exaggeration last on his list of concepting techniques. Is he prohibiting it? State
    his actual position and the one condition he attaches.
  answer: >
    No. He says explicitly that great ideas do use exaggeration and that it is not off-limits; his
    objection is frequency and thoughtlessness. He places it last because it is used so commonly that
    it is the first technique juniors apply, and its first hundred outputs are predictable inversions
    of the benefit — his caricature is a water-heater brainstorm producing ice cubes from the tap,
    repeated because the water is cold. The requirement is awareness: just be aware when you are
    using it. The condition, taken from Pete Barry, is that an exaggeration must be based on a truth;
    without one, what remains is a silly contrivance. He names the degenerate form, quoting Teressa
    Iezzi: the advertisement in which someone is so distracted by the product that they fail to
    notice some outrageous event.
  answer_type: source_position
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Stated position with his own explicit qualification. The 'based on a truth' condition is quoted
    from another author, and no test is given for when an exaggeration is sufficiently grounded.
  confounders:
    - "reporting it as a prohibition, which he takes care to deny in the same paragraph"
    - "assuming the objection is that exaggeration is untruthful; the objection is that it is reached for before thinking"
    - "confusing the technique with hyperbole in copy — he is discussing a concepting lens applied to the message"

- qa_id: qa_whip_0034
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 3 'Tell the Truth and Run', section 'Authority gets replaced with fake' (spine 13)"
  question: >
    A pack promises "Made with real cheese" and a truck advertisement carries an asterisked monthly
    payment. Sullivan says both work against themselves. What is the shared inference, and what does
    he say created the audience that makes it?
  answer: >
    The shared inference is that the reassurance is evidence against the claim it defends: if the
    product were authentically cheese, it would not need to say so — his reductio is that nobody
    sells a phone by saying it is made with real phone — and an asterisk announces that a briefcase
    of qualifications is propping the number up, so the line can legitimately be read as saying "we're
    lying". Each is a defensive move that would be unnecessary if the claim were secure, so a reader
    who has learned the pattern treats the defence as a symptom. He grounds the learned pattern
    historically: the collapse of institutional authority, which he dates from a presidential
    resignation and traces through a chain of fallen public figures, produced what he calls a nation
    of eye-rollers and sceptics who no longer accept "because we said so". He places the same family:
    the exclamation point, the invented customer name, the stock photograph.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: >
    Stated claim. The causal history is a sweeping cultural narrative offered without evidence and is
    specific to the United States; the asterisk reading is a rhetorical move rather than a claim
    about how most readers process fine print.
  confounders:
    - "reading the objection as legal or ethical rather than as a claim about inference"
    - "assuming the remedy is to remove the qualifier, when his stated remedies are to have a claim that does not need one, or to embrace the weakness directly"
    - "treating the historical account as established; it is asserted"

- qa_id: qa_whip_0035
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 3 'Tell the Truth and Run', section 'Embracing the suck' (spine 13)"
  question: >
    A client's product has an obvious, well-known weakness, and the brief asks you to work around it.
    What does Sullivan recommend instead, and what does he say about client-mandated elements the
    team wants to bury?
  answer: >
    Take the weakness and use it to accentuate the product's main strength — what he calls embracing
    the suck. His modern example is a cough syrup whose campaign compared its own taste to public
    restroom puddle water and signed off "It tastes awful. It works." He treats admitting weakness as
    a way of disarming distrust, alongside admitting the commercial has an agenda at all, and reports
    a pizza brand opening a campaign by replaying focus-group video of its own customers saying the
    product was bad before promising to fix it. He extends the same move to a different case: when
    what sucks is not the product but a client mandate — a weak tagline, a jingle, a spokesperson —
    tackle it directly rather than doing something you think is cool and burying the mandated element
    in a corner or in the last ten seconds, because, quoting Jason Elm, good ideas often spill out of
    the very thing your instincts tell you to avoid.
  answer_type: repair
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: >
    Stated remedy with two named campaigns. The pizza case is reported with a share-price comparison
    across fourteen years, which is not a controlled attribution and the source does not present it
    as one.
  confounders:
    - "reading it as self-deprecation for its own sake; the weakness has to be turned to accentuate a strength"
    - "applying it only to product faults and missing the client-mandate case, which is where it is most immediately usable"
    - "treating the share-price figure as evidence that the campaign caused the change"

- qa_id: qa_whip_0036
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 3 'Tell the Truth and Run', section 'To thine own brand, be true' (spine 13)"
  question: >
    You have written: "Discover how the flavours of ancient Italy tantalise your tongue." What
    portable test does Sullivan give for copy like this, and what does the test actually detect?
  answer: >
    The bar-stool test: imagine sitting with a friend in a bar who asks why she should go there, and
    try to say your line to her face with a straight expression. His prediction for exactly this line
    is that she blinks and says "Duuude." The test works by changing the audience from an imagined
    public to a specific person who can react, because the register is adopted for an audience the
    writer cannot see, and a visible listener makes its emptiness audible. What it detects is a
    register failure — what he calls, quoting Mike Troiano, Official Marketing Bullshit mode — and
    only that. It says nothing about whether the claim is true or the strategy right. His instruction
    behind it: stop "writing ads"; do not write, talk — talk to the page, as if to someone capable of
    detecting nonsense.
  answer_type: repair
  difficulty: easy
  knowledge_type: copywriting
  requires_application: true
  support: >
    Stated test with the source's own worked line. The conversational register he prescribes is
    itself a convention of a particular market and period, not a neutral default.
  confounders:
    - "reading the test as a check on truthfulness or strategy, which it does not perform"
    - "assuming the remedy is shorter copy; the remedy is a different register"
    - "confusing it with reading aloud, which he prescribes separately and which detects cadence rather than register"

- qa_id: qa_whip_0037
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'Don't have a pre-ramble' (spine 17)"
  question: >
    A junior's body copy opens by explaining what the headline meant. Sullivan's diagnosis points
    somewhere other than the copy. Where, and what does he prescribe instead?
  answer: >
    At the headline. Reporting Thomas Kemeny's observation that body copy is too often treated as an
    explanation of the headline, he converts it into a test of the headline: if your headline needs to
    be explained, it is not working. That inverts the usual direction of blame — the explanatory copy
    is a symptom whose cause sits upstream, so editing the copy cannot fix it. He names the parallel
    junior error of opening by restating what the headline already said. The prescription is
    journalistic: get to the point and put the most interesting, surprising or persuasive point in
    the first line, following the inverted pyramid, and do not bury the lead.
  answer_type: failure_diagnosis
  difficulty: easy
  knowledge_type: copywriting
  requires_application: true
  support: >
    Reported from Kemeny and endorsed; the inverted-pyramid remedy is Sullivan's. A rule of thumb
    applied to one failure pattern — he does not address copy that legitimately develops a headline
    rather than explaining it.
  confounders:
    - "rewriting the opening paragraph, which treats the symptom"
    - "assuming all body copy following a headline is a pre-ramble; the fault is explanation or repetition specifically"
    - "confusing this with his instruction to keep the set-up short when presenting to a client, where he uses the same word"

- qa_id: qa_whip_0038
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'Never, ever, not even once, or even just a little bit, ever use exclamation points anywhere, ever' (spine 17)"
  question: >
    Sullivan bans the exclamation point. His objection is not that it is inelegant. What is the
    claim, and how does he demonstrate it?
  answer: >
    The claim is about a mismatch between intention and reception: the writer intends it to sound
    excited, and the reader receives a brand that sounds desperate. He calls it the used-car
    salesperson of advertising sentences, the jazz hands of punctuation, and kryptonite to
    authenticity — which ties it to his wider argument that a signal of enthusiasm supplied by the
    sender rather than earned by the content is read as a claim the content could not support. He
    demonstrates by making the point emphatically in the preceding sentence without using one, and
    then observing that he did.
  answer_type: source_position
  difficulty: easy
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated position. No evidence is offered that readers make this inference; the claim rests on the
    author's ear and is delivered in a joke, which makes the intended absoluteness hard to read —
    though the surrounding argument suggests he means it.
  confounders:
    - "treating it as a style preference rather than as a claim about how the mark is received"
    - "assuming it applies only to headlines; he states it for advertising copy generally"
    - "missing the link to his reassurance-signal family, which is what makes it more than a peeve"

- qa_id: qa_whip_0039
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'Never use fake names in a headline' (spine 17)"
  question: >
    Sullivan objects to both invented customer names and product model numbers in headlines, but for
    different reasons. Give both mechanisms, and say which of the two objections he qualifies.
  answer: >
    The fake name fails by detection: readers recognise the fabrication immediately, and an
    irritating kind of fabrication — his comparison is the stock relatives supplied inside shop-bought
    picture frames — and the judgement transfers to the advertiser. The model number fails by
    processing: a string like "TX-17" is not read as language, so it forces the reader to change gear
    mid-sentence and functions as a speed bump; and he names why makers are blind to it, which is
    that they work on the account and it feels familiar to them. He qualifies the first, not the
    second. There are times when using a person's name is the only way the concept will work, and in
    the hands of a seasoned team it can be done beautifully — it comes down, in his words, to how
    gracefully and believably you pull it off.
  answer_type: comparison
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated claims. The speed-bump account is asserted from his own reading experience with no reading
    measurement cited. His exception for names is unusually candid and is not a rule anyone can apply
    in advance.
  confounders:
    - "treating both as the same objection to artificiality"
    - "reporting the name prohibition as absolute, which he explicitly relaxes"
    - "assuming the model-number objection is about brand consistency rather than about reading"

- qa_id: qa_whip_0040
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'Get puns out of your system right away' (spine 17)"
  question: >
    Sullivan's line on puns is unusually flat. State it, and then state honestly what kind of claim
    it is.
  answer: >
    He says puns have no persuasive value, calls them the lowest thing on the joke food chain, and
    adds that any headline that rhymes is beyond saving. His instruction is not to avoid thinking of
    them but to clear them early: it is fine to write them down, provided they then go where they
    belong. What kind of claim it is: a strong professional prohibition stated in the grammar of a
    finding. He gives no mechanism and cites nothing, and it is one of the clearest places in the
    book where a taste position is delivered as fact. There is also an unstated tension — some of the
    work he admires uses wordplay close to punning, so the boundary he is actually drawing seems to
    be between wordplay that carries the argument and wordplay that replaces it, but he does not say
    so.
  answer_type: source_position
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated prohibition, with no mechanism and no evidence. The observation about the unstated
    boundary is an extractor observation, not a claim he makes.
  confounders:
    - "reporting it as an established finding about persuasion rather than as this practitioner's position"
    - "concluding that wordplay in general is prohibited, which his own admired examples contradict"
    - "assuming he forbids writing them; he explicitly permits writing them down and then discarding them"

- qa_id: qa_whip_0041
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 9 'Viral, Naughty, and Rong', section 'Making ideas that blow up. Or, advertising as vandalism' (spine 25)"
  question: >
    A piece of work is on strategy, correctly targeted and contains no identifiable fault. Sullivan
    has a name for it anyway. What is it, what is the underlying claim, and what is the risk in using
    this diagnosis?
  answer: >
    He calls it an obedient idea — work that dutifully ticks all the boxes about what an advertisement
    should be and then just lies there, asking to be looked at. The underlying claim is that
    brief-conformance is necessary and not sufficient: conformance checks are negative, they can rule
    work out but not in, and nothing in a brief requires the work to be interesting. It is the
    diagnostic counterpart of his argument that a campaign which is merely a transcription of the
    brief contains no creative leap. The risk is that "obedient" is his own coinage identified
    entirely by the reviewer's taste — no check is offered that distinguishes an inert idea from one
    the reviewer simply dislikes — and it appears in a chapter urging provocation, so it can easily
    become licence to reject correct work. His own limit is stated elsewhere: the replacement must
    still be relevant.
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: >
    Stated claim, from his experience as a creative director and a teacher. The caution about
    reviewer taste is an extractor observation about a gap he does not close.
  confounders:
    - "assuming that passing every brief requirement settles the question, which is the position the diagnosis is written against"
    - "reading it as permission to reject any work that is not provocative, without his relevance constraint"
    - "confusing it with work that fails one of his named surface faults; the obedient idea has none of them"

- qa_id: qa_whip_0042
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 3 'Tell the Truth and Run', sections 'Insist on a relevant strategy' and 'Try to make your message incontestable' (spine 13)"
  question: >
    Sullivan names the two things people fire back at an advertisement and attaches a different
    repair to each. Give both pairs, and state what he says to do if the second repair is unavailable.
  answer: >
    "Yeah, riiiight" is a credibility failure, repaired by a message that is truthful, incontestable
    or measurably provable — for which he offers Pete Barry's stress test: imagine the loud man at the
    bar arguing back and build the comeback that sinks his boat. "So what?" is a relevance failure,
    repaired only by having something that matters to somebody: something customers want, or a
    problem they have. Execution repairs neither, which is why both checks sit upstream of the
    creative work. If the second repair is unavailable — if there is nothing relevant to say — his
    instruction is to tell the client to put their money away, because no matter how well it is
    executed an unimportant message has no receiver. He does concede a limit on the first: the
    incontestability advice does not apply to products that are all image or have no real difference
    worth hanging a hat on, and he names paper cups.
  answer_type: repair
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: >
    Stated claim with a stated concession. The two-rebuttal scheme is a memorable heuristic, not a
    taxonomy; nothing establishes that these are the only two ways a message fails.
  confounders:
    - "matching the repairs to the wrong rebuttals — relevance does not fix disbelief and proof does not fix indifference"
    - "assuming better execution can rescue either, which is what he explicitly denies"
    - "missing the concession about parity products, which is where the incontestability advice stops applying"

- qa_id: qa_whip_0043
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 3 'Tell the Truth and Run', section 'Whenever you can, go for an absolute' (spine 13)"
  question: >
    Sullivan prefers an "-est" to an "-er". What is the argument, and what does he say happens when
    the absolute is not available?
  answer: >
    His argument is a claim about what is retained: quietest, fastest and cleanest are what people
    are going to remember, and all the claims in the middle ground — quieter, faster, cleaner — are
    grey and forgettable. Best is better than good, and where the product genuinely is the best, set
    up camp there. What happens when it is not available is the failure he describes rather than a
    remedy he offers: the client or agency ends up trying to leverage some rice-paper-thin difference
    nobody cares about, often because legal will not permit anything stronger. His instruction is to
    try your hardest not to settle for an "-er", and his related advice where a category's good
    adjectives are already taken is to try a polar opposite or a flanking move rather than the second
    best, because second best will not be different enough.
  answer_type: source_position
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: >
    Stated preference with an asserted claim about memory and no evidence. His flanking example — a
    condiment brand claiming "slowest" in a category competing to be the most tomato-ish, with sales
    reported up and staying up — is a single case relayed without a source.
  confounders:
    - "reading it as advice to overclaim; he requires the absolute to be true, and treats the parity case separately"
    - "assuming the answer to an unavailable absolute is a comparative, which is what he argues against"
    - "confusing the flanking move with de-positioning a competitor, which he discusses separately"

- qa_id: qa_whip_0044
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 3 'Tell the Truth and Run', section 'Listen to customers talk'; and Ch. 16 'Creative testing: be afraid. Be very afraid.' (spines 13, 39)"
  question: >
    Sullivan is hostile to focus groups and enthusiastic about listening to customers. These sound
    contradictory. What line is he actually drawing, and what is the strongest objection to his
    position that he does not raise?
  answer: >
    The line is between research used to generate ideas and research used to judge them. Listening —
    in reviews, forums, chat rooms, bars, malls, on social platforms, unprompted and unpaid — he calls
    the best way to learn what customers think and something it has become too easy not to do; it
    belongs at the beginning, to find out what to say. Asking recruited, paid participants to
    critique finished creative he rejects, and his single stated rule is that when research is used to
    determine how to say it, great ideas suffer. He also exempts product, location, flavour, packaging
    and name testing, which he says pays off. The objection he does not raise is that he is not
    disinterested: he is a member of the profession whose work such testing evaluates, and nowhere in
    either passage does he acknowledge the interest. A second unraised tension is that his own
    founding argument rests on survey research about dislike and believability.
  answer_type: source_position
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: >
    Stated position across two chapters, with his own stated exemptions. The interest objection and
    the tension with his founding argument are extractor observations about gaps he leaves open.
  confounders:
    - "reporting him as anti-research, which his enthusiasm for listening and his product-testing exemption both contradict"
    - "treating his objections as findings; he offers them as arguments for a client conversation and calls the process capricious rather than disproven"
    - "assuming he proposes a replacement check on work before it runs — he prescribes only an internal hallway disaster check"

- qa_id: qa_whip_0045
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 16 'Pecked to Death by Ducks', section 'Creative testing: be afraid. Be very afraid.' (spine 39)"
  question: >
    Sullivan lists specific mechanisms by which he says creative testing distorts what it measures.
    Give four of them, and name the common structure he claims underlies all of them.
  answer: >
    Any four of: testing by its nature looks for what is wrong rather than what is right, and will
    find something; it assumes an intellectual reaction where the real reaction is visceral and
    instantaneous; it asks people what they will like before they have seen it in the world; it
    rewards work that is happy, vague and fuzzy because that does not challenge the viewer; it
    rewards the derivative, because a familiar feel scores higher than the unique, strange or new; it
    cannot convey tone, because a dozen pictures pasted to a board are not footage, voice-over and
    music; and it recruits ordinary people as advertising experts, after which they feel obliged to
    prove it. The common structure he claims is a reversal of direction: quoting Bernbach that we are
    so busy measuring public opinion we forget we can mould it, he says that in the testing room the
    dynamic of a commercial reaching viewers is replaced by viewers telling the commercial what to
    say. He names a second misuse separately — permission research, showing concepts and asking
    whether people like them, whose consensus and compromise he says grind ideas into vanilla or
    nonsense.
  answer_type: mechanism
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: >
    Stated arguments, offered by the source explicitly as ammunition for a client conversation rather
    than as established findings. No evidence is offered for any of the listed mechanisms, and the
    conceptual-art illustration he uses is not a study of advertising testing.
  confounders:
    - "reporting these as demonstrated effects rather than as arguments"
    - "confusing permission research with pre-testing; he treats them as two different misuses"
    - "missing his own concession that clients test everything else and that much of that testing pays off"

# ── WORD AND IMAGE ──────────────────────────────────────────────────────────

- qa_id: qa_whip_0046
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Remember, something has to dominate the page' (spine 15)"
  question: >
    Sullivan says every design needs a boss. Roy Grace's version, which he quotes, makes the
    requirement about something other than the layout. What?
  answer: >
    About an agreement between the makers. Grace's formulation is that there has to be a point on
    every page where the art director and the writer want you to start — whether the centre, the top
    right corner or the left — and there has to be an understanding, an agreement, and a logical
    reason for where you want people to look first. So the requirement is a decision taken and shared,
    not a property discovered afterwards. Sullivan's own version is that whether it is a big headline,
    a large visual or a single word floating in white space, somebody has to be the boss, and that
    there must be an overall visual hierarchy — an implied order of the relative importance of the
    elements. He restates the requirement inside the letter-or-postcard decision, which is what makes
    it a precondition rather than one recommendation among others.
  answer_type: concept_definition
  difficulty: easy
  knowledge_type: hierarchy
  requires_application: false
  support: >
    Stated requirement, with the operational version quoted from an art director in a case-history
    collection. No method for establishing dominance is given beyond scale and isolation.
  confounders:
    - "treating it as a rule about which element should dominate; the requirement is that one be designated, not which"
    - "assuming the dominant element must be the visual"
    - "confusing it with balance or composition; the claim is about reading order"

- qa_id: qa_whip_0047
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Do I want to write a letter or send a postcard?' (spine 15)"
  question: >
    Aitchison's letter-or-postcard fork, as Sullivan reports it, is decided by one variable and
    carries one claim that has nothing to do with reading. Give both.
  answer: >
    The variable is message complexity: a postcard is visually led, one visual and sometimes a little
    copy, and suits one thought; a letter is predominantly copy-driven and suits a more complex
    message. The claim that has nothing to do with reading is about long copy specifically — the sheer
    weight of the body copy adds a sense of gravitas to the product regardless of whether the reader
    takes in a word of it. He frames the decision as a position on a sliding scale from all-visual to
    all-verbal, taken early rather than arrived at, and repeats that something must dominate either
    way. Note that the gravitas claim sits awkwardly against his own insistence elsewhere that
    anything not carrying meaning should be removed; he does not reconcile them.
  answer_type: comparison
  difficulty: medium
  knowledge_type: composition
  requires_application: false
  support: >
    Framework quoted from Jim Aitchison and endorsed, illustrated with a matched pair for one brand.
    The gravitas-without-reading claim is offered with no evidence.
  confounders:
    - "treating the choice as an outcome of execution rather than as a fork taken early"
    - "assuming Sullivan prefers the postcard; he reproduces and praises a 630-word advertisement in the same chapter"
    - "reading the gravitas claim as being about credibility of content rather than about the visible mass of type"

- qa_id: qa_whip_0048
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Can the solution be entirely visual?' (spine 15)"
  question: >
    A team decides to run a visually led execution. Sullivan states the consequence rather than the
    advantage. What does the decision oblige them to do, and what is the stated failure if they do
    not?
  answer: >
    Relying on the image means the image assumes added responsibilities: it has to carry the idea,
    and the main selling idea cannot be buried down in the copy — it must be baked right into the
    visual. The stated failure is terminal rather than partial: if readers do not get what you are
    trying to say from the visual, they will not get it, and they will move on. His mechanism is that
    visuals work fast, so the visual is where a reader giving the piece one pass will take meaning
    from. He allows the other direction — a good visual or headline may earn a reader who then goes
    on to read the copy — and he adds a second reason with a stated scope: as brands are marketed
    globally, visual solutions matter more because they translate better than words.
  answer_type: application
  difficulty: medium
  knowledge_type: composition
  requires_application: true
  support: >
    Stated claim, alongside a quoted provocation from another agency that people do not read
    advertisements — a position Sullivan does not hold in its strong form, since he praises long copy
    in the same chapter. The translation claim is asserted with no evidence.
  confounders:
    - "reading it as a general claim that visuals beat words, which his own long-copy examples contradict"
    - "assuming the copy can still carry the selling idea as a backstop; that is precisely what he forbids"
    - "treating the translation argument as settled — it would not survive contact with the culturally specific imagery he relies on elsewhere"

- qa_id: qa_whip_0049
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'Tension and release in an idea' (spine 17)"
  question: >
    Sullivan states a scaling claim about the relationship between headline and visual. State it, and
    then state the two bounds that stop it recommending maximum distance.
  answer: >
    The claim, reporting Pete Barry, is that the greater the polarity between headline and visual, the
    bigger the shift in the reader's head — the idea is revealed by the visual and the unexpectedness
    is what creates the tension between the two elements. The lower bound is his own see-say failure:
    polarity at zero wastes the second element and leaves the reader nothing to resolve. The upper
    bound is his fuse argument: the distance the reader travels is exactly what lengthens the fuse, so
    polarity beyond the medium's dwell time means the idea does not resolve at all. He also notes the
    relation is reversible — tension in a headline can be released by the visual, or a dominant visual
    can be reframed by the headline that follows it.
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: composition
  requires_application: false
  support: >
    Reported from Pete Barry and endorsed. "Polarity" is never defined or measured, so the scaling
    claim is directional and cannot be applied quantitatively; the two bounds come from elsewhere in
    the same book and the source does not connect them himself.
  confounders:
    - "applying the claim without bounds, which would recommend maximum distance and contradict his own simplicity chapter"
    - "assuming the headline always sets up the visual; he states the reverse ordering too"
    - "treating polarity as a measurable quantity because the claim is phrased as a scaling relation"

- qa_id: qa_whip_0050
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Metaphors must've been invented for advertising' (spine 15)"
  question: >
    Sullivan recommends borrowed image equity and elsewhere forbids the visual cliché. Both concern
    familiar images. Where exactly does he put the line, and what makes a metaphor worth using in the
    first place?
  answer: >
    The line is re-angling. Picking up a ready-made image or meme and setting it down next to the
    client's logo will not work; taking an established image, putting some spin on it, and using it in
    a new and unexpected way that relates to the product advantage is what he recommends. The
    prohibition is on unmodified reuse, not on familiar imagery. What makes a metaphor worth using is
    compression: certain images have acquired fixed associations — the trade calls that accumulated
    meaning the image's equity — so the maker does not have to establish them, and one image can say
    what would otherwise take twenty words. He adds that this is particularly valuable where the
    product is intangible, since a metaphor makes it tangible, and that verbal metaphors work equally
    well.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: >
    Stated claim with worked examples. His appeal to Jung is decorative rather than load-bearing and
    is uncited; the listed equities are culturally specific — colour associations in particular do not
    hold across cultures — and he presents them as general.
  confounders:
    - "concluding that familiar imagery is banned, which the equity argument denies"
    - "treating novelty as the criterion; the criterion is a new use that relates to the product advantage"
    - "assuming the listed associations are universal"

- qa_id: qa_whip_0051
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Coax an interesting visual out of your product or its benefit' (spine 15)"
  question: >
    Sullivan gives a systematic generator for visual ideas built on transforming the product. Give
    the operations, and state the constraint without which the exercise becomes something he
    elsewhere condemns.
  answer: >
    Rotate it, invert it, scale it up or down, make its image rubber and stretch it, marry it with
    other visuals and icons, put a door in it, give it legs or a brain, set it on fire, ask what other
    thing it looks like, what could be substituted for it, and what the perfectly wrong way to use it
    would be. He derives the exercise from watching a child reinterpret a toy car as a motorcycle, a
    boat and a rocket purely by which surface faced the ground. The constraint, stated throughout, is
    that you are trying to coax out of the product a dramatic image with a selling benefit: the
    transformation must dramatise a customer benefit, not merely alter the object. Without it the
    exercise becomes the graphic acrobatics he elsewhere condemns, quoting Bernbach, as running the
    imagination riot rather than harnessing it.
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: >
    Stated device with the source's own anecdote as illustration rather than as evidence. The benefit
    constraint is his and is stated in the same passage.
  confounders:
    - "treating the transformations as a stylistic device rather than as a search for a benefit-carrying image"
    - "dropping the benefit constraint, which is what separates it from arbitrary manipulation"
    - "assuming the product must appear in the finished work; the exercise generates the resemblance, not the layout"

- qa_id: qa_whip_0052
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', sections 'Show, don't tell' and 'Can you use the physical environment as your visual?' (spine 15)"
  question: >
    Sullivan's favourite demonstration advertisement is a phone advertisement on a magazine's back
    cover. What makes it work on his account, and what does he say a demonstration does to the
    headline?
  answer: >
    It works by making the magazine's own front cover the evidence: the line states only that the
    cover photograph was shot with the advertised product's portrait mode. It is simultaneously his
    "show, don't tell" case and his "use the environment as the visual" case — the site of the
    execution is an element of the concept rather than a container for it. What a demonstration does
    to the headline is remove the need for a clever one: because the piece is not telling us, it did
    not need one. His deeper mechanism is that a demonstration is evidence rather than a claim, so it
    does not have to be believed on the advertiser's authority — which connects it to his argument
    about the collapse of authority. He gives a second case where what is shown is the cause and the
    reader supplies the consequence: an anti-slip skate advertisement whose mental image of children
    landing on their backsides he says is stronger than showing them that way.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Stated claim with two reproduced advertisements this extraction could not inspect; the argument
    turns on what those images do. He does not separate the force of the demonstration from the force
    of the placement.
  confounders:
    - "reading 'show, don't tell' as a preference for imagery over copy generally"
    - "missing the second case, where the strongest version withholds the consequence rather than depicting it"
    - "assuming every product can be demonstrated; he does not claim that"

- qa_id: qa_whip_0053
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', sections 'Can your brand own something visual?' and 'Avoid style. Focus on substance.' (spine 15)"
  question: >
    Sullivan endorses Krone's twenty-foot test and then makes a stronger claim of his own. State
    both, and identify the tension between this and his instruction to study a category's current
    visual conventions.
  answer: >
    Krone's requirement is a page style: you should be able to tell whose advertisement it is from a
    distance of twenty feet — and Sullivan notes what is interesting about it, which is that Krone was
    talking about print advertisements, not billboards. Sullivan's stronger claim is that the longer
    he is in the business the more convinced he is that art direction is where the major battle for
    brand building happens, because once a look is established and a design territory staked out,
    nobody else can use it without looking like your brand. He pairs it with an instruction to pull
    the look from the brand's own DNA rather than from current fashion, since riding every passing fad
    makes work trendy and derivative. The tension: knowing and avoiding a category's current clichés
    requires close attention to exactly the conventions this instruction says to ignore. He states
    both and does not reconcile them.
  answer_type: source_position
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Krone is quoted from a 1968 trade interview; the stronger claim is Sullivan's own opinion, flagged
    by his phrasing, with no evidence. The colour-ownership examples are assertions about market
    perception with nothing measuring them. The tension is an extractor observation.
  confounders:
    - "treating the twenty-foot test as calibrated; no viewing condition is specified"
    - "reading 'avoid style' as indifference to craft rather than as a warning against period fashion"
    - "assuming ownership of a colour or a look is established rather than asserted"

- qa_id: qa_whip_0054
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 6 'The Virtues of Simplicity', section 'A few words about outdoor. (Few being the key word.)' (spine 19)"
  question: >
    You have a campaign that includes a roadside board and a subway poster. Sullivan treats these
    differently. What is the differentiating variable, what does he permit for each, and what two
    tests does he give?
  answer: >
    The variable is how long the audience dwells with the medium. For roadside boards he reports the
    received limit of about seven words, notes the logo adds two or three, calls ten pushing it, and
    says eleven can work with the right execution — helped by having no visual. For subway postings
    and bus stops he says concepts can risk a slightly longer fuse, because the audience dwells. The
    two tests: show it to someone for two seconds, take it away and ask what it said; and view the
    layout from ten feet away as a legibility check. His craft advice follows the same logic — when a
    campaign includes outdoor, start there and pretend there is no photography budget, because being
    forced to carry the idea in words boils the thinking down.
  answer_type: application
  difficulty: medium
  knowledge_type: short_form
  requires_application: true
  support: >
    Stated claims and stated tests. The seven-word limit is reported as something that has been said,
    not as a measurement he made. His own count that he can read fewer than ten percent of the
    billboards he passes is an informal personal observation, from which he reaches a strong
    conclusion — that highway outdoor may be best used only for directions.
  confounders:
    - "applying the same word limit to both placements, which is exactly the distinction he draws"
    - "treating seven words as a measured threshold"
    - "missing that his section is also a polemic — he quotes Gossage's argument that a billboard is not a medium at all, and notes cities that have banned them"

# ── COPY CRAFT AND FINISHING ────────────────────────────────────────────────

- qa_id: qa_whip_0055
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'Or pretend you're writing a letter' (spine 17)"
  question: >
    Sullivan reports a specific physical trick used to produce a famous car brand's copy voice.
    Describe it, and say what he claims it prevents.
  answer: >
    Bob Levenson is reported as writing "Dear Charlie" at the top of the copy and composing as though
    talking to his best friend, signing off "Yours sincerely, Bob" — then deleting the salutation and
    the sign-off. What is left is the voice. Sullivan's claim for the device is that it is intimate
    and that it keeps you from lecturing: the best copy feels more like a conversation than a speech,
    one person talking to another. It is his prescribed fallback when voice eludes a writer, and it
    sits alongside his general instruction to write to one person rather than to the masses, since it
    is one person reading the words.
  answer_type: factual
  difficulty: easy
  knowledge_type: copywriting
  requires_application: false
  support: >
    Reported second-hand from an art director who was at the agency, via a video interview. Anecdote
    about one writer's method, endorsed as a technique.
  confounders:
    - "treating it as a format for the finished copy rather than as a drafting device"
    - "assuming it produces informality; what he claims it produces is address to a single person"
    - "confusing it with the bar-stool test, which checks a line rather than generating a voice"

- qa_id: qa_whip_0056
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'Once you lay your sentences down, spackle between the joints' (spine 17)"
  question: >
    Sullivan gives a test for whether body copy is properly joined. State the test, and name the
    other test in this source that has the same structure.
  answer: >
    When it is done well, you should not be able to take out any sentence without disrupting the flow
    and structure of the entire piece. The other test with the same structure is the removal test for
    concept elements — take an image, phrase or word out and see whether the idea still works — and in
    both cases necessity is established by subtraction. He surrounds it with the structural
    requirement: read body copy as an essay, an opening line that pulls the reader in, a middle that
    supports it with facts, a closing call to action, with transitions carrying each sentence out of
    the one before, what Pete Barry calls an invisible thread. Note the difference in direction:
    applied to concept elements the removal test is a diagnostic for cutting; applied to copy it is a
    target to write toward, and a piece can pass it by being tightly written around nothing — which
    the source does not address.
  answer_type: comparison
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated test in both places. The observation that the same structure serves as a diagnostic in one
    chapter and as a target in another, and that the target can be met vacuously, is an extractor
    observation.
  confounders:
    - "reading the test as an instruction to write short copy; it is about joinery, not length"
    - "confusing it with the cut-by-a-third rule, which is a separate finishing operation"
    - "assuming a piece that passes must therefore be good"

- qa_id: qa_whip_0057
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', sections 'When you're done writing the copy, read it aloud' and 'When you've finished writing something, go back and cut it by a third' (spine 17)"
  question: >
    Sullivan gives two finishing operations. What does each detect or achieve, and what does he say
    the cut is actually for?
  answer: >
    Reading aloud detects weak writing by changing the channel: the stop-and-start cadences and jagged
    segues that the eye skates over are audible. He learned it presenting copy to five clients and
    discovering its weakness only while speaking it, and he extends the instruction beyond radio
    scripts to print, online and anything else. The cut of one third is not about making less to read
    — quoting Thomas Kemeny, condensing and editing is about making any length of copy more
    interesting to read. So the purpose is density: removing a third raises the interest per line of
    what remains. His general principle is that there is hardly anything that cannot be improved by
    making it shorter.
  answer_type: repair
  difficulty: easy
  knowledge_type: copywriting
  requires_application: true
  support: >
    Stated operations, one with his own reported experience. One third is a working proportion, not a
    measured optimum; he offers it alongside a nineteenth-century writer's advice to strike out every
    other word, which is rhetorical rather than calibrated.
  confounders:
    - "reading the cut as a brevity rule rather than as a density rule, which is the distinction he draws"
    - "limiting the aloud read to spoken formats, which he explicitly widens"
    - "treating one third as a specification"

- qa_id: qa_whip_0058
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'If you have to have one, make your tagline an anthem' (spine 17)"
  question: >
    Sullivan's tagline advice is conditional. What is the condition, when in the process does he
    place the work, and what two tests must the line pass?
  answer: >
    The condition is in the heading: if you have to have one. His framing throughout is that a tagline
    may not be needed, and his reduction exercise names it as the first element to remove if it brings
    no new information. If one is required, he places the work last — save it until the campaign is
    well started, possibly to the very end — then put the work on the wall and boil its essence down.
    The two tests: plug it into the actual executions and see whether it finishes the argument, and
    check that it works all by itself with only the logo to keep it company. He also endorses Adam
    Tucker's counter-position against wordplay: a good tagline is a summation of your idea, the full
    stop to your thinking, and the most famous of them contain no puns or trickery at all.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated conditional advice, with the ordering constraint stated explicitly. 'Own some high ground'
    is offered with a single celebrated example and no account of when altitude becomes vacuity.
  confounders:
    - "reading this as a recommendation to have a tagline, which the conditional framing and the reduction exercise both resist"
    - "writing the tagline first as a campaign anchor, which is the ordering he argues against"
    - "assuming cleverness is the aim; the quoted position is explicitly against wordplay"

- qa_id: qa_whip_0059
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 5 'Brevity Is the Soul of Wit', section 'Don't set out to be funny. Set out to be interesting.' (spine 17)"
  question: >
    Sullivan is a practitioner of comic advertising and writes this instruction against his own
    default. What is the claim, and what constrains the choice of register?
  answer: >
    That funny is a subset of interesting: funny is not a language, it is an accent, and it may not
    even be the right accent for your client. Funny, serious and heartfelt are all irrelevant unless
    the work is interesting first, so interest is the necessary condition and humour is one available
    means to it. What constrains the register is the pairing he states elsewhere: the emotional choice
    is always a combination of what the product is and who is being addressed, and his negative case
    is that pie-in-the-face humour should not be on the list for a hospital's website. He recommends
    deciding the mood early — thoughtful, angry, stark — on the ground that the decision itself gives
    focus, while noting you can change your mind later.
  answer_type: source_position
  difficulty: easy
  knowledge_type: copywriting
  requires_application: false
  support: >
    Stated position. The subset relation is a definition offered as an argument; nothing establishes
    it beyond his assertion. His own examples throughout the book are overwhelmingly comic, which his
    stated position does not require.
  confounders:
    - "reading it as advice against humour, which it is not"
    - "treating interest as one option among funny, serious and heartfelt rather than as the condition all three must meet"
    - "assuming the register is chosen by the brand alone; he pairs product with audience"

- qa_id: qa_whip_0060
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 4 'A Controlled Daydream', section 'Make sure every piece in the campaign makes sense all by itself' (spine 15)"
  question: >
    Sullivan requires every element of a campaign to be understandable on its own. What fact does he
    derive this from, and what does it sit awkwardly against elsewhere in the book?
  answer: >
    From the fact that the maker does not control encounter order. There is no walking a customer
    through a portfolio saying which piece kicks off the campaign, so any piece may be the first one
    someone meets, and every single element must therefore be completely understandable and whole in
    and of itself — his image is that each cell contains the DNA for the whole organism. He pairs it
    with the requirement that a piece end by leading somewhere, with a call to action, rather than at
    a dead end. It sits awkwardly against his enthusiasm for platforms, whose later executions gain
    from rules the earlier ones established, and against his description of the brand story as a long
    open-ended tale told over time. He states both and reconciles neither.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Stated requirement with a stated derivation. The tension with his platform material is an
    extractor observation. 'End with a call to action' is a near-universal trade convention rather
    than a claim particular to this source, and no evidence is offered for it.
  confounders:
    - "assuming the pieces must therefore be identical or interchangeable, which contradicts his same-yet-different requirement"
    - "reading it as an argument against sequencing a campaign at all"
    - "missing the tension with his platform argument, which is the interesting part"

# ── PROVOCATION, DEFENCE, EFFECTIVENESS, AND BOUNDARIES ─────────────────────

- qa_id: qa_whip_0061
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 1 'A Brief History of Why Everybody Hates Advertising', opening argument (spine 9)"
  question: >
    The campaign Sullivan names in his title was, by his own account, measurably successful. Set out
    both halves of the record he reports, and state the position he takes.
  answer: >
    On one side: it sold billions of rolls, displaced the previous category leader, ran to 504
    executions between 1964 and 1990, and in a 1975 survey its actor was reported as the
    second-most-recognised face in America. On the other: research he cites found it among the most
    disliked commercials of its decade and last in believability across years of studies, and the
    agency that created the character spent years trying and failing to replace him. His position is
    that effectiveness does not settle the question. Quoting Norman Berry: advertising that does not
    sell is lousy by any definition, but sales achieved with work that is in bad taste or is
    intellectual garbage should not be applauded no matter how much it sells, because offensive,
    dull, abrasive, stupid advertising is bad for the industry and for business generally. His own
    rebuttal to the sales defence is a question — spitting on the table would also get your attention,
    so would you?
  answer_type: source_position
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: false
  support: >
    Stated position, which he presents as his own — the opinions of one writer, and, in his words,
    "God knows, they aren't rules". The empirical material is reported second-hand from three trade
    books and a survey, and the sales attribution to the campaign specifically is not established by
    anything he cites.
  confounders:
    - "reading him as denying that the campaign worked, which he concedes at length"
    - "reading him as denying that advertising should sell, which the quoted position explicitly affirms"
    - "treating this as a finding about effectiveness rather than as an argument about sufficiency"

- qa_id: qa_whip_0062
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 1 'A Brief History of Why Everybody Hates Advertising', opening argument (spine 9)"
  question: >
    Sullivan's alternative to the campaign he attacks rests on one claim he never defends. Identify
    it, and say why it matters to the whole book.
  answer: >
    The claim is that the creative route arrives at the same commercial destination. He describes a
    fork in the road and says his path "leads to the same place — enduring brands and market
    leadership — but it gets there without costing anybody their dignity". That is the load-bearing
    step: without it his argument reduces to a preference, and with it the whole book becomes a claim
    about effectiveness as well as about taste. It is also the least supported step in the argument.
    No comparison of outcomes between the two schools appears anywhere in the book, and the evidence
    he does supply for his own tradition is a run of celebrated campaigns selected after the fact.
  answer_type: source_position
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: >
    The claim is stated in his own words in the first chapter. The observation that it is undefended
    and load-bearing is an extractor observation, not something the source raises.
  confounders:
    - "assuming he supplies evidence later; the celebrated examples throughout are a selected sample and are never compared against anything"
    - "treating the claim as obviously true because the named campaigns are famous, which is the survivorship the observation is about"
    - "confusing this with his separate concession that clients have the right to their opinion"

- qa_id: qa_whip_0063
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 9 'Viral, Naughty, and Rong', section 'Rong means going 180˚ against common sense' (spine 25)"
  question: >
    Sullivan recommends being "perfectly wrong". He then states a degree condition that is the actual
    substance of the advice. What is it, and what stops this from being novelty for its own sake?
  answer: >
    The degree condition: designing something wrong is easy, a little wrong is no good, and a lot
    wrong is even worse — what works is an idea in direct opposition to all prevailing wisdom in the
    category. The word doing the work is "perfectly". Partial deviation is still read inside the
    convention and buys nothing; only full inversion is unpredicted. What stops it being novelty for
    its own sake is his explicit refusal, quoting Bernbach: be provocative, but be sure your
    provocativeness stems from your product. Standing a man on his head to get attention is wrong;
    doing it to show that your product keeps things from falling out of his pockets is right. Merely
    letting the imagination run riot is not being creative — the creative person has harnessed and
    disciplined it.
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: >
    Stated claim, with the degree condition borrowed from Winsor and Bogusky and the constraint
    quoted from Bernbach. His most detailed example is a food campaign built on filming the product
    rotting, whose success is reported as being talked about worldwide rather than as a sales figure;
    he concedes such work is often polarising.
  confounders:
    - "reading it as licence to be different, which the degree condition and the Bernbach constraint both refuse"
    - "assuming a partial deviation is a safer version of the same move; he says it is worse"
    - "missing the survivorship — the chapter's examples are award winners, and inversions that failed are not shown"

- qa_id: qa_whip_0064
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 9 'Viral, Naughty, and Rong', section 'Are you sure they'll even let us do this idea?' (spine 25)"
  question: >
    You have an idea and catch yourself thinking "they'll never let us do this." What does Sullivan
    say you should conclude, what is his reasoning, and what is the obvious weakness in the heuristic?
  answer: >
    He says that if you find yourself wondering whether they will even let you do it, you should
    definitely do it — sit down and work out how to execute it and how you will sell it up the line.
    His reasoning is that we ask the question because we sense the idea could get a huge reaction, and
    that merely thinking about it summons the voices of all its enemies; the forces you sense
    assembling against an idea may be a measure of how much commotion it would cause if you pulled it
    off. He adds a division of labour: rejecting ideas is the client's job, not yours. The weakness is
    that the signal cannot distinguish resistance provoked by strength from resistance provoked by
    badness — an idea can be unbuyable because it is dangerous or because it is bad, and the heuristic
    reads both the same way. He does not address this.
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: >
    Stated heuristic. The weakness is an extractor observation about a gap he leaves open. It sits
    alongside a related instruction elsewhere: do not leave your best work on the agency floor — go
    as far as you can and let the client bring you back.
  confounders:
    - "treating the anticipation of resistance as evidence the idea is good"
    - "reading it as advice to present unbuyable work without a plan; he requires you to work out how to sell it"
    - "confusing it with his separate instruction never to show a client work you do not want them to buy"

- qa_id: qa_whip_0065
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 9 'Viral, Naughty, and Rong', section 'What is the press release of your idea?' (spine 25)"
  question: >
    Describe the idea-as-press-release process, the bar Sullivan sets for it, and the reframe he says
    is the biggest thing in the chapter.
  answer: >
    Before making the idea, write the press release for it — picture what the story in the newspaper
    will be after you implement it. Its origin, as he reports it, was an agency principal tired of
    hearing teams open with what happens in the commercial, on the grounds that the press covers
    news, and news is what the agency is trying to make for its clients. The bar he sets is
    explicit: not a story in the trade press, but the evening news. The reframe, which he attributes
    to strategist Gareth Kay and flags as the big one, is to stop trying to come up with advertising
    ideas and work instead on coming up with ideas worth advertising. It pairs with his other
    go/no-go question, from Alex Bogusky: if you cannot imagine anybody writing or talking about the
    campaign you are about to spend money on, rethink it.
  answer_type: factual
  difficulty: easy
  knowledge_type: concept_development
  requires_application: false
  support: >
    Stated process, quoted from an internal agency memo and endorsed. The reported outcome for his
    example is a sales claim without a figure followed by online view counts, which measure attention
    rather than effect.
  confounders:
    - "reading the press release as a communications deliverable rather than as a design constraint on the idea"
    - "setting the bar at trade coverage, which he explicitly excludes"
    - "treating talkability as equivalent to effectiveness, which is not what the chapter establishes even though it reads that way"

- qa_id: qa_whip_0066
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 9 'Viral, Naughty, and Rong', opening section on paid, owned and earned media (spine 25)"
  question: >
    A client asks for a viral video. What does Sullivan instruct you to say, and what does that imply
    about how "viral" should be treated in a brief?
  answer: >
    Politely point out that nobody makes viral videos: it is customers who make things viral, not us.
    Viral is not a strategy — it is a result of first coming up with a genuinely great idea. The
    implication is that "go viral" cannot be an objective on a brief, because it names an outcome
    that is not under the maker's control; what a brief can specify is the idea's quality and its
    designed shareability. He supports the point with his own counter-example: the creatives behind a
    print advertisement that became widely shared had no request to go viral on their brief, they
    simply pushed their thinking to the edge — and his stated lesson is that anything can blow up,
    including a print advertisement.
  answer_type: application
  difficulty: easy
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Stated position with one named case. The paid/owned/earned vocabulary he uses around it is a
    trade taxonomy of the writing period; the substantive claim — that virality is an outcome, not an
    instruction — does not depend on it.
  confounders:
    - "accepting 'go viral' as a specifiable objective, which is exactly what he refuses"
    - "assuming only video or social formats can spread, which his print example contradicts"
    - "confusing the refusal with indifference to earned attention, which he prizes"

- qa_id: qa_whip_0067
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 9 'Viral, Naughty, and Rong', sections 'Advice on working way out past the edge' and 'Build a small, cozy fire with the rule books' (spine 25)"
  question: >
    Sullivan ends by telling readers to throw out every rule in his own book, then names one
    exception. What is it, what is his statement of the consequence, and what does he concede in the
    same passage that makes the exception hard to apply?
  answer: >
    The exception is relevance: even out in deep space, you must be relevant, and you are never going
    to get so far out there that you can dare not to be. His statement of the consequence concedes the
    aesthetic while refusing the professional claim — no matter how creative you think an idea is, if
    it has no meaning to your audience you do not have an advertisement; you may have art, but you do
    not have an idea. What he concedes in the same passage is that at that altitude judgement fails.
    Quoting Helmut Krone: when something is genuinely new you have no frame of reference, you
    distrust it, everybody distrusts it, and very often it takes somebody else to tell you it has
    merit. So the one rule he keeps is also the one he says you may be unable to apply at the moment
    it matters, and he supplies no test for it.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: >
    Stated exception and stated concession, both his. The observation that the exception is
    untestable and that the concession undermines its application is an extractor observation.
  confounders:
    - "reading 'throw out the rules' without the exception, which is the half that makes the chapter coherent"
    - "assuming relevance is defined; it is left undefined and could mean anything from meeting a stated need to being culturally legible"
    - "treating the Krone quotation as encouragement rather than as a concession about the limits of self-assessment"

- qa_id: qa_whip_0068
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 16 'Pecked to Death by Ducks', section 'Protecting your work' (spine 39)"
  question: >
    A client returns twenty comments: colour changes, copy rewrites, and one request to remove the
    single visual the concept depends on. Apply Sullivan's triage rule, and give his stopping
    condition.
  answer: >
    Concede the first two classes and defend only the third. His rule is explicit: if they want to
    mess with your body copy, let them; if they want to change red to green, let them; protect the
    pyramid — if you get out with the big idea intact, consider yourself a genius. The request to
    remove the load-bearing element is the one to fight, and he names less experienced clients as
    particularly good at asking for exactly that. His stopping condition is unusual and worth stating:
    if one too many changes have hurt the original idea, pull the trigger yourself and kill it. He
    frames the whole thing as choosing battles — the moral being not to win battles and lose the war,
    since squabbling over body copy is not where advertising battles are won.
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: >
    Stated rule with a stated stopping condition. He frames it inside an explicit concession that
    advertising is a service industry and that clients have paid for the right to their opinion.
  confounders:
    - "defending every comment, which the triage rule exists to prevent"
    - "conceding the structural change because it is one comment among twenty"
    - "missing the stopping condition, which is the part that distinguishes triage from endless accommodation"

- qa_id: qa_whip_0069
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 16 'Pecked to Death by Ducks', section 'Base your defense on strategy' (spine 39)"
  question: >
    Sullivan says to defend work on strategy rather than on its creativity. What is his reason, and
    what fact about clients does he offer in support?
  answer: >
    His reason is that strategy is the ground the client can actually evaluate, and it is something
    they had a hand in authoring — so keeping the conversation there gives the work its best chance.
    Quoting Alastair Crompton: think like a creative person, but talk like an accountant. He wants
    the team able to track, step by step, how they arrived at the campaign, with the relevant
    product, market and customer facts at hand. The supporting fact is about how clients actually
    spend their time: marketing directors for consumer-products companies may spend as little as five
    percent of it on advertising issues, the rest on manufacturing, distribution, financing and
    product development, and the managerial strengths that got them the job likely had nothing to do
    with judging advertising. His conclusion is blunt: it is not a client's job to know great work
    when they see it.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: >
    Stated claim, with the five-percent figure asserted without a source. The advice is quoted from a
    1979 copywriting manual and endorsed.
  confounders:
    - "reading it as advice to abandon creative ambition rather than to change the register of the argument"
    - "treating the five-percent figure as sourced; it is asserted"
    - "assuming the point is that clients are unsophisticated; his point is that judging advertising was never their job"

- qa_id: qa_whip_0070
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 16 'Pecked to Death by Ducks', sections 'Do not try to solve the problem in the meeting' and 'Never show a client work you don't want them to buy' (spine 39)"
  question: >
    Give two of Sullivan's presentation rules that constrain what happens inside the meeting itself,
    and state the reasoning behind each.
  answer: >
    First: do not try to solve the problem in the meeting. When a client asks for a change you are
    not required to fix it or refute it on the spot — listen, write the issues down, play them back so
    both sides know they were heard, and take it away. Easy and obvious fixes are fine; major work in
    the room is not. Second: never show work you do not want bought, because clients gravitate to
    what they feel safer with and less scared by, and that is always the second-rate work — so
    presenting filler to round out a presentation is how the filler gets approved. Two related rules
    sit alongside: do not hand out materials before presenting, because the moment you hand someone a
    document you are competing with it; and do not describe your campaign as risk-taking, because
    clients want certainty and the word is close to the worst thing you can say to someone with a job
    on the line.
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: >
    Stated rules. The claim that clients gravitate to second-rate work is drawn from his own
    experience of presenting filler; no counting is offered.
  confounders:
    - "reading the first rule as refusing the change rather than deferring the work"
    - "treating filler as harmless presentation padding, which is the specific belief he reports holding and abandoning"
    - "confusing 'don't be slick' with 'don't prepare' — he insists on rehearsal and on anticipating every objection"

- qa_id: qa_whip_0071
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 16 'Pecked to Death by Ducks', section 'They may be right' (spine 39)"
  question: >
    Sullivan reports Bernbach's pocket note and then goes further. What is the note, what is his
    stronger version, and what does he claim it buys?
  answer: >
    The note Bernbach is said to have carried and consulted during disagreements with clients read:
    "They may be right." Sullivan's version starts, in his phrase, a few rungs further down the
    humility ladder — always enter any discussion, with clients, account executives or anyone,
    believing there is a fifty percent chance you are dead wrong, and really believe it. What he
    claims it buys is persuasive force: it adds a strong underpinning to the argument because to
    listeners it does not feel like you are forcing your opinion on them. His illustration is two
    kinds of minister — the quiet one who invites you to explore his faith, and the sweaty televised
    one telling you what happens if you do not repent — and the question of which is more persuasive.
  answer_type: source_position
  difficulty: easy
  knowledge_type: creative_process
  requires_application: false
  support: >
    Reported as agency legend for Bernbach; the stronger version and the claim about persuasiveness
    are Sullivan's own. Offered simultaneously as a posture and as a sincere belief, which is a
    demanding and unfalsifiable instruction.
  confounders:
    - "reading it as advice to concede, which his triage rule and his 'articulate defender' instruction both contradict"
    - "treating it as a rhetorical technique only; he says to really believe it"
    - "confusing it with 'listening doesn't mean saying yes', which he states separately as a distinct point"

- qa_id: qa_whip_0072
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 16 'Pecked to Death by Ducks', sections 'Somebody asks to cram more stuff into the idea' and 'Outlast the objections' (spine 39)"
  question: >
    A client wants one advertisement to cover their full product range. Give Sullivan's rebuttal and
    his stated reason, then give the fallback he offers when no argument works at all.
  answer: >
    The rebuttal is a redirection rather than a refusal: if the client has three important things to
    say, tell them they need three advertisements. His stated reason is customer behaviour — customers
    never go shopping for full lines of products, they have specific needs, so advertisements
    addressing specific needs are more effective. He calls full-line advertisements effective only as
    magazine thickener and quotes the proverb about the hunter who chases two rabbits catching
    neither. The fallback when nothing works is persistence, and he specifies its shape: not digging
    in your heels, but rolling past the resistance like a stream around a rock. His illustration is a
    year in which he presented fourteen campaigns to one difficult client on a single assignment; they
    killed thirteen, and the point of the story is that fourteen were presented.
  answer_type: repair
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: >
    Stated rebuttal and stated reason; the fourteen-campaign account is his own anecdote. He also
    states plainly that much of the time nothing you say will pull a concept out of the fire, and that
    clients' reasons for disliking work often defy analysis.
  confounders:
    - "refusing the request rather than converting it into a larger deliverable"
    - "reading persistence as holding out for the original idea; he means returning with new work"
    - "assuming the argument always succeeds — he says most of the time it will not"

- qa_id: qa_whip_0073
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 16 'Pecked to Death by Ducks', section 'Somebody says, Negative approaches are wrong' (spine 39)"
  question: >
    A client objects that your campaign is negative. Sullivan supplies a rebuttal and a reassurance.
    Give both, and state the condition he attaches.
  answer: >
    The rebuttal is the argument from drama: the most basic tenet of it is conflict, and without
    conflict there is no story and therefore no interest. He illustrates with a relentlessly positive
    photograph — happiness, camaraderie, everyone enjoying the product — which he says is boring
    precisely because there is no tension, no unanswered question, no story. He generalises: people
    do not slow down to look at the highway, they slow down to look at the accident, not out of
    morbidity but because we are wired to scan for interruptions to the status quo. The reassurance,
    and the condition, is the same sentence: as long as the client's product is ultimately portrayed
    in a positive light or is seen to solve a customer problem, the net takeaway is positive — because,
    quoting Tom Monahan, the true communication is not what you say but what the receiver takes away.
  answer_type: application
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: >
    Stated rebuttal with a reproduced photograph as the negative example. The underlying story claim
    is the same borrowed material as his storytelling chapter; the condition about net takeaway is
    asserted, with no measurement of what receivers actually take away.
  confounders:
    - "arguing that negativity is effective in itself, which the condition rules out"
    - "omitting the condition, which is what makes the rebuttal usable with a nervous client"
    - "confusing this with fear-based advertising; his claim is about dramatic structure, not about threat"

- qa_id: qa_whip_0074
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 16 'Pecked to Death by Ducks', section 'Somebody asks, Why are we wasting 25 seconds of our TV spot entertaining people?' (spine 39)"
  question: >
    A client asks why the commercial spends most of its length entertaining rather than selling.
    Reconstruct Sullivan's answer, including the sequence he claims and the starting position he says
    you are in.
  answer: >
    His answer is that there is no entitlement to the customer's attention; it is earned. The
    sequence he claims is ordered and each step depends on the one before: you are not welcome until
    customers like you, they will not like you until they listen to you, and they will not listen if
    you open with bulleted copy points about your product's superiority. So the "wasted" time is in
    fact the active ingredient. He adds the starting position: because of decades of bad advertising
    you are not starting from zero with customers but from below it, and there is a high wall around
    every customer with another brick added daily. His analogy is a door-to-door salesman — a client
    who says lose all the entertainment is proposing to skip the doorbell, jimmy the lock and walk
    into the kitchen with a fistful of facts.
  answer_type: application
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: >
    Stated argument. The like-then-listen sequence is asserted as a mechanism with no evidence
    attached; the below-zero starting position is his characterisation of the audience, consistent
    with his opening chapter but not measured.
  confounders:
    - "conceding the point and moving the product mention earlier, which is the request the argument is written against"
    - "reversing the sequence — he claims liking precedes listening, not the other way round"
    - "treating the argument as a claim about entertainment being effective in itself, rather than about earning attention"

- qa_id: qa_whip_0075
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 11 'Make the Idea Bigger, Not the Logo', section 'The hard part: come up with something that works from both an entertainment and a marketing perspective' (spine 29)"
  question: >
    Branded content has to satisfy two criteria at once. State them, state the failure Sullivan names
    for leaning too far one way, and give the test he quotes for whether a piece has succeeded.
  answer: >
    It must work as entertainment and as marketing. The named failure of leaning too far into the
    narrative is that viewers may enjoy the idea and take away no brand message — the entertained
    audience must not leave without somehow knowing the brand was involved in the joy. He states the
    strong form of the requirement: the idea cannot be a "brought to you by the makers of"
    attachment, it must come from, be inspired by and carry the brand's own material, and it must be
    relevant to the audience. His own image is giving a dog a pill — the medicine cannot sit beside
    the treat, the two have to be one thing. The test he quotes, from PJ Pereira: if you make it
    impossible to talk about the idea without the brand, yet interesting enough to generate some
    buzz, you have something special.
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: >
    Stated claim with the test quoted and endorsed. The founding example — a car brand spending a
    year's whole budget on short films — is the single most celebrated case of its kind, presented as
    having changed the field; no comparable attempt that failed is discussed anywhere.
  confounders:
    - "treating entertainment quality alone as the criterion, which is the failure he names"
    - "reading brand presence as sponsorship or logo placement, which the strong form explicitly excludes"
    - "assuming the reported returns are measured; they are the client's or agency's own figures relayed second-hand"

- qa_id: qa_whip_0076
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 11 'Make the Idea Bigger, Not the Logo', section 'Use do-invite-capture-share'; and Ch. 12 'Mastering good social media practices' (spines 29, 31)"
  question: >
    Sullivan reports a four-step participation sequence and one bounding condition that is easy to
    skip. Give the sequence, say which step he calls the hard one, and give the condition.
  answer: >
    Edward Boches's sequence: do something really interesting that communicates the value of your
    brand; conceive the idea so people can participate and find a way to invite them in; capture what
    is created or document the event so it lives beyond it; and make it shareable across every
    relevant channel. He names the first step as the hard one, because it cannot be an advertisement
    — it has to be, in his phrase, radioactively creative — and it is where his idea-worth-advertising
    reframe applies. The bounding condition, quoted from Scott Prindle, is about the exchange:
    whenever you ask customers for time or effort you must come through with a payoff, and it needs
    to be equal to or greater in value than the time contributed, or usage rates are very low.
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: >
    Reported from Boches and endorsed, with the payoff condition quoted from another practitioner.
    The supporting cases are award-circuit campaigns described after their success.
  confounders:
    - "treating capture and share as the substance; the source names the first step as the hard one"
    - "omitting the payoff condition, which is the part that predicts whether anyone participates"
    - "attributing the sequence to Sullivan; he credits Boches, a co-author of an earlier edition"

- qa_id: qa_whip_0077
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 12 'Concepting for the Hive Mind', section 'Mastering good social media practices' (spine 31)"
  question: >
    Sullivan's social-platform chapter mixes a durable claim with a great deal of dated specifics.
    Separate them: what survives, and name three kinds of material that should be labelled as
    contingent on the platforms of the writing period?
  answer: >
    What survives is the prime directive and the competitive frame behind it: be interesting,
    entertaining or useful, because — quoting Andy Blood — your competitive set is not other
    advertisers, it is all the content people care about. That is the same argument he makes about
    attention everywhere else in the book. What should be labelled contingent: first, per-platform
    tagging mechanics and ceilings, including how many are permitted and how a recommendation engine
    is said to respond; second, which named network's features to exploit and how influencer
    arrangements work; third, the content-scheduling vocabulary — he uses a stock-and-flow
    distinction and footnotes it himself as dating from around 2011 and no longer in wide use. Also
    contingent: the specific ratios in the rule-of-thirds content mix he reports. None of this should
    be presented as durable, and none of it is evidence about how any current platform behaves.
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: short_form
  requires_application: true
  support: >
    The prime directive is his stated claim. The contingency judgement is an extractor observation,
    supported by the source's own footnote conceding one of his terms is out of use. Nothing in this
    material is evidence about what any automated or generative system can produce.
  confounders:
    - "carrying platform-specific numbers forward as current practice"
    - "treating the prime directive as social-media-specific; it restates his general attention argument"
    - "assuming that because some of the chapter is dated, the whole of it is — the competitive frame is the same one that runs through the book"

- qa_id: qa_whip_0078
  source_id: sullivan-hey-whipple
  source_title: "Luke Sullivan, Hey Whipple, Squeeze This: The Classic Guide to Creating Great Advertising, 6th ed. (Hoboken, NJ: John Wiley & Sons, 2022)"
  source_locator: "Ch. 2 'The Creative Process', section 'Why nobody ever chooses Brand X' (spine 11)"
  question: >
    Sullivan warns against the gimmick and then names what he claims is the only legitimate source of
    material. What is the distinction, and what does he say you already have to work with?
  answer: >
    A gimmick captures attention for a few seconds and is unrelated to the product — his example is
    the manufactured sales event at a used-car dealership — and once the ruse is over the customer
    only resents you. His distinction: the best answers always arise out of the problem itself, out
    of the product, the customer, or the realities of the buying situation. Any shtick dragged into
    the situation that is not organically part of the product or customer reality will not be
    authentic and will ring false. What you already have, on his list, is more than enough: the
    client's product with its brand equities and benefits, the competitor's product and its
    weaknesses, the price-quality-value arithmetic of the two, and what the customer brings — pride,
    greed, vanity, envy, insecurity and a hundred other wants, one of which the product satisfies.
    Those, he says, are the only paints you have, and they are all you need.
  answer_type: concept_definition
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: >
    Stated claim. Asserted rather than demonstrated; the inventory of human motives is a mid-century
    list offered without derivation.
  confounders:
    - "reading the objection to gimmicks as an objection to entertainment, which he defends at length elsewhere"
    - "treating 'arises out of the problem' as a requirement to be literal; his own examples are highly figurative"
    - "confusing this with the Rong chapter's licence to invert conventions, which he also bounds by the requirement that provocation stem from the product"
