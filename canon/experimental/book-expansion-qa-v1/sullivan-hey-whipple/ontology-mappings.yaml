  verbatim: false
  executable_by: null

# ── REMEDIES: every one carries executable_by ────────────────────────────────

- term_id: t_whip_0017
  term: take_everything_out_except_the_idea
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    The source's stated method for shortening a long fuse: remove every element that is not the idea.
    His analogy is the apocryphal Michelangelo answer about chipping away everything that was not
    elephant.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0018
  term: reductionism_pass
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Neil French's demonstrated sequence, endorsed by the source: from a conventional layout, remove
    body copy by making the headline work harder, remove the tagline if it brings no new information,
    then attempt a visual that delivers the message alone with the logo incorporated into it.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0019
  term: first_say_it_straight_then_say_it_great
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Write the thing flatly first — the source suggests literally beginning "This is an ad about …" —
    and add the spin afterwards, so that clarity is fixed before art is attempted.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0020
  term: cut_it_by_a_third
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    On finishing a piece of writing, remove a third of it. The source's stated purpose is density
    rather than brevity: making any length of copy more interesting to read.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0021
  term: removal_test
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    To decide whether an image, phrase or word is needed, take it out. If the idea fails without it,
    that element was a load-bearing beam; if it survives, remove the element.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_whip_0022
  term: read_it_aloud
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Speak the finished copy — not only radio scripts but print and online copy — because weak writing
    reveals itself in cadence and segues when heard.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0023
  term: bar_stool_test
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Imagine saying the line to a friend in a bar who has asked why they should use the product, and
    try to deliver it to her face with a straight expression. Copy that cannot survive that delivery
    has failed.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_whip_0024
  term: two_second_outdoor_test
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Show an out-of-home layout to someone for two seconds, remove it, and ask what it said. Paired
    with a legibility check by viewing the layout from ten feet away.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_whip_0025
  term: write_one_hundred_lines
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Set a volume target of a hundred workable lines across several sessions, all of which have to be
    pretty good, and start over on a clean page between rounds pretending you have nothing.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0026
  term: dig_shallow_holes_everywhere
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Explore widely and cheaply across the brief's territory with quick sketches, seeking only enough
    validation to know a direction could be worth developing, and do not stop to develop a promising
    find.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0027
  term: write_hot_edit_cold
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Generate without editing, then judge ruthlessly after the draft has cooled: keep only the best,
    set the next tier aside, kill or shelve the rest.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0028
  term: angels_advocate
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    In the early creative process, ask what is good about a partner's idea rather than testing it;
    the source's explicit prohibition is smirking or eye-rolling at a bad idea, on the ground that it
    stops the supply of half-ideas.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0029
  term: ask_a_better_question
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Tom Monahan's ladder, reproduced with permission: from a question with a known answer, to one
    that can be guessed, to one with no knowable answer — the last being the better question, which
    forces a creative leap because no existing answer is available.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0030
  term: intergalactic_collision
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    List forty or fifty data points about the brand's own subject, build a second list from a
    familiar but maximally unrelated subject rich in data points, and connect points across the two.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0031
  term: name_the_idea_before_building_it
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Collide the brand's own list with a nearby subject drawn from product, category or customer
    truths to produce a short telegraphic name, then write the campaign from the name — the source's
    analogy is the book title before the book.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_whip_0032
  term: change_something_when_stuck
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Solve the same problem as if it were a different medium or a radically different budget, then
    return; or blow up the notebook entirely and start on a fresh pad, because old half-ideas
    constrain the search.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0033
  term: start_from_where_you_are
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Faced with a project too large to begin, take the piece that interests you most regardless of its
    place in the whole, on the stated ground that doors open on either side of a first idea that
    could not be seen before it existed.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0034
  term: protect_the_pyramid
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    In client revision, concede the changeable — body copy, colours, details — and defend only the
    idea itself. The source's success condition is getting out with the big idea intact.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0035
  term: base_the_defence_on_strategy
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Defend work on the strategy the client helped author and on a step-by-step account of how the
    work was reached, rather than on the creativity of the execution; the source's shorthand, quoted
    from Alastair Crompton, is to think like a creative person and talk like an accountant.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0036
  term: do_not_solve_it_in_the_meeting
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    On receiving a client change, write the concerns down, play them back to confirm they were heard,
    and take the problem away rather than reworking it in the room.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: human_edit

- term_id: t_whip_0037
  term: embrace_the_suck
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Take an obvious weakness — of the product, or a client-mandated element the team wants to avoid —
    and use it to accentuate the main strength, or tackle it directly rather than burying it.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0038
  term: do_invite_capture_share
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Edward Boches's sequence as reported by the source: do something interesting that communicates
    the brand's value, invite people to participate in it, capture what they make so it outlives the
    event, and make it shareable. The first step is named as the hard one.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: physical_production

- term_id: t_whip_0039
  term: use_the_environment_as_the_visual
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    Make the site of the execution an element of the concept rather than a container for it. The
    source's cases are physical placements — subway straps, trolley handles, a magazine's own back
    cover — built or bought in the world.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: physical_production

- term_id: t_whip_0040
  term: outdoor_first_no_photography_budget
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    When a campaign includes out-of-home, start there and pretend there is no photography budget so
    that the idea must be carried by words alone, which the source's first creative director said
    forces the thinking to boil down.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

- term_id: t_whip_0041
  term: educate_the_client_with_examples
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: remedy
  definition_in_origin_frame: >
    The source's stated best long-term defence: show clients what great work looks like via award
    annuals, shows and subscriptions, on the ground that judging advertising was never their job.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit

# ── PROPERTIES: the qualities the source's judgements are about ──────────────

- term_id: t_whip_0042
  term: speed_of_the_get
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    How quickly a viewer understands an idea, likened to the length of a fuse on a firecracker. The
    source calls a quick get the first and most important property an idea needs, above the
    creativity of the piece, and names the claim heresy in his own field.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0043
  term: stopping_power
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    The capacity of a simple layout to arrest a viewer, which the source attributes to there being
    only one place to look and to the image reading as slightly wrong so that the viewer leans in.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0044
  term: polarity_between_headline_and_visual
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    The distance between what a piece says and what it shows. The source states it scales: the
    greater the polarity, the bigger the shift in the reader's head. Never defined or measured.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0045
  term: visual_hierarchy_boss
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    The designated element from which reading starts. The source's formulation is that every design
    needs a boss, and Roy Grace's that there must be an understanding and a logical reason for where
    the reader is meant to look first.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0046
  term: brand_equals_adjective
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    The state of a brand having exactly one adjective spot-welded to it, which the source holds is
    how customers file a brand if they file it at all. He concedes the position is purist and that
    many brands do not admit such clean distinctions.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0047
  term: brand_platform
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    A world with its own internal rules, whose rules can be reused to generate further stories,
    distinguished by the source from a campaign, which is a series of executions held together by
    similar messaging, typography, art direction, tone and architecture. His working definitions,
    offered for the purposes of discussion.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0048
  term: central_human_truth
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    The undeniably and universally true thing about the customer, distinguished by the source from a
    fact about the product. Facts are measurable and fit on charts; truths are known instinctively
    and are what clients are taught to minimise.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0049
  term: smile_in_the_mind
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    Quoted from McAlhone and Stuart: the moment of resolution when a witty idea clicks, reached
