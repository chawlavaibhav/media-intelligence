  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0050
  term: page_style
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    A brand's owned visual territory, tested by Helmut Krone's requirement that you should be able to
    tell who is running an advertisement from twenty feet away. Reported of print work, not
    billboards.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0051
  term: rong
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    The source's spelling for perfectly wrong: an execution in direct opposition to all prevailing
    wisdom in its category. He states the degree condition — a little wrong is no good and a lot
    wrong is worse — and requires the provocation to stem from the product.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0052
  term: earned_media
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    Attention an idea receives without being paid for, through news coverage, buzz and sharing;
    contrasted by the source with paid media and with owned channels. He states that viral is a
