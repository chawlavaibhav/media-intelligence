  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0053
  term: idea_worth_advertising
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: property
  definition_in_origin_frame: >
    Attributed by the source to Gareth Kay and highlighted by him as a central point: the object of
