# Luke Sullivan, Hey Whipple, Squeeze This (6th ed., Wiley, 2022) — SPEC-05 ontology
# EXPERIMENTAL — NOT LIVE CANON. Lane: sullivan-hey-whipple, book-expansion-qa-v1. Non-merge.
#
# NO cross_source_concept (xs_...) is created here. Cross-source promotion is forbidden in this task
# and requires Controller review and Audit-Gate lineage records that do not exist.
# NO `same_failure_family` relation is used anywhere: it requires human review under SPEC-05
# governance.
# NO cross-lane relationship is written. The parallel lanes' term ids are not resolvable from this
# directory, and an unresolvable reference is worse than a missing observation. Where this source
# appears to agree or disagree with a live Canon source, that is recorded as PROSE in
# EXTRACTION-NOTES.md under "Observations for cross-source review (NOT promotions)".
#
# EVERY kind: remedy term carries `executable_by`. This source's remedies are decisions and edits
# made by people making advertising for paid and earned media. The honest value is `human_edit`
# almost throughout; a small number are `physical_production` (a thing built or staged in the world)
# and those are NOT translated into generative instructions. None is a model instruction and none
# implies anything about model capability.
#
# `verbatim: true` means the term is the source's own word or phrase. `verbatim: false` means it is
# our label for something he describes without naming.

source_id: sullivan-hey-whipple
extraction_date: 2026-08-30

terms:

# ── PROBLEMS: the source's own vocabulary for what goes wrong ────────────────

- term_id: t_whip_0001
  term: encoding_the_idea
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: problem
  definition_in_origin_frame: >
    Over-complicating a concept in the attempt to make it intriguing, so that the get takes three or
    four beats longer than it should. The source names it as the characteristic student error.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null

- term_id: t_whip_0002
  term: fuse_too_short
  origin: source
  origin_ref: sullivan-hey-whipple
  kind: problem
  definition_in_origin_frame: >
    An idea that resolves before the viewer is attending, whose quick, clueless bang makes it clear
    there is nothing there worth being interested in. The source's example of the failure state is a
    STOP sign: an instant read with no effect.
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null

