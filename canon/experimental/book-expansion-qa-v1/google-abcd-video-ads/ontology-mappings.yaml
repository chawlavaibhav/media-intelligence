terms:
- term_id: t_abcd_0001
  term: abcds
  origin: source
  origin_ref: google-abcd-video-ads
  kind: property
  definition_in_origin_frame: >-
    The publisher's name for its four principles of effective YouTube video ads — Attention,
    Branding, Connection, Direction — taken together as one set.
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  arising_from: [sk_abcd_0001]

- term_id: t_abcd_0002
  term: attention
  origin: source
  origin_ref: google-abcd-video-ads
  kind: property
  definition_in_origin_frame: >-
    The first principle: hook and sustain the viewer's attention with an immersive story built
    from audio and visuals together.
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  arising_from: [sk_abcd_0005]

- term_id: t_abcd_0003
  term: branding
  origin: source
  origin_ref: google-abcd-video-ads
  kind: property
  definition_in_origin_frame: >-
    The second principle: brand early, often and richly, using a broad range of branding elements
    to show and tell viewers who the advertiser is.
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  arising_from: [sk_abcd_0010]

- term_id: t_abcd_0004
  term: connection
  origin: source
  origin_ref: google-abcd-video-ads
  kind: property
  definition_in_origin_frame: >-
    The third principle: help people think or feel something, by way of the experience of the
    product rather than claims about it.
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  arising_from: [sk_abcd_0015]

- term_id: t_abcd_0005
  term: direction
  origin: source
  origin_ref: google-abcd-video-ads
  kind: property
  definition_in_origin_frame: >-
    The fourth principle: ask the viewer to take action, with clear, concise direction that is
    easy to follow.
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  arising_from: [sk_abcd_0019]

- term_id: t_abcd_0006
  term: jump_in
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Get to the heart of the story faster, using engaging pacing and tight framing to draw viewers
    in.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_abcd_0006]

- term_id: t_abcd_0007
  term: support_the_story_with_audio_and_supers
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Reinforce the message with audio and on-screen text, and avoid competing elements. The
    resources article names the same guideline "Emphasize key points".
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_abcd_0008]

- term_id: t_abcd_0008
  term: competing_elements
  origin: source
  origin_ref: google-abcd-video-ads
  kind: problem
  definition_in_origin_frame: >-
    Elements in the ad that pull against each other rather than reinforcing the same key message
    at the same moment. The source names the fault and does not define its threshold.
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  arising_from: [sk_abcd_0008]

- term_id: t_abcd_0009
  term: keep_visuals_bright_and_high_contrast
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Keep the ad's visuals bright and high in contrast so that they hold up across every device
    the ad may be watched on, small screens included.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: physical_production
  arising_from: [sk_abcd_0009]

- term_id: t_abcd_0010
  term: show_up_early_and_throughout
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Introduce the brand or the product from the start of the ad and maintain that presence across
    its length.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_abcd_0011]

- term_id: t_abcd_0011
  term: see_and_say
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Pair an on-screen brand visual with a spoken brand mention; the source claims the audio
    mention raises the visual's performance. Google Ads Help names the same guideline
    "Reinforce with audio".
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_abcd_0012]

- term_id: t_abcd_0012
  term: draw_on_all_your_branding_assets
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Work the brand identity into the story through a variety of branding elements — product
    shots, pack shots, in-situ branding, graphic elements, voice-overs, musical treatments —
    chosen to fit the message and the objective.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_abcd_0013]

- term_id: t_abcd_0013
  term: sound_on_experience
  origin: source
  origin_ref: google-abcd-video-ads
  kind: property
  definition_in_origin_frame: >-
    The source's assertion that YouTube is almost entirely watched with sound on, offered as the
    reason to treat the medium as multisensory. A claim about one platform at one time; the
    source states it for YouTube and for nothing else.
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  arising_from: [sk_abcd_0014]

- term_id: t_abcd_0014
  term: humanize_the_story
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Feature people and their experience of the product, and let the people shown represent the
    advertiser's consumer.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: physical_production
  arising_from: [sk_abcd_0016]

- term_id: t_abcd_0015
  term: focus_the_message
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Keep the ad's messaging and language focused and simple; do not attempt too much in one ad.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_abcd_0017]

- term_id: t_abcd_0016
  term: doing_too_much
  origin: source
  origin_ref: google-abcd-video-ads
  kind: problem
  definition_in_origin_frame: >-
    Attempting more than one ad can carry. The source places this fault under Connection, and
    states it as the limit on how far to push humour, surprise and other emotional levers.
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  arising_from: [sk_abcd_0017]

- term_id: t_abcd_0017
  term: engage
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Lean into emotional levers and storytelling techniques such as humour, surprise and intrigue.
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_abcd_0018]

- term_id: t_abcd_0018
  term: call_to_action
  origin: source
  origin_ref: google-abcd-video-ads
  kind: entity
  definition_in_origin_frame: >-
    The ad's explicit ask, chosen intentionally to drive a specific marketing objective and
    stating what the advertiser would like viewers to do. The source says it may be carried by
    written text, graphics, audio, or a scene from the story.
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  arising_from: [sk_abcd_0019, sk_abcd_0020]

- term_id: t_abcd_0019
  term: supercharge_ctas_with_audio
  origin: source
  origin_ref: google-abcd-video-ads
  kind: remedy
  definition_in_origin_frame: >-
    Reinforce the on-screen call to action with voice-over so that the next step is clear. The
    resources article names the same guideline "Boost CTAs with audio".
  first_seen: 2026-08-30
  verbatim: true
  executable_by: human_edit
  arising_from: [sk_abcd_0021]

- term_id: t_abcd_0020
  term: passive_viewer
  origin: source
  origin_ref: google-abcd-video-ads
  kind: problem
  definition_in_origin_frame: >-
    Treating the viewer as passive rather than as someone to be educated, inspired or
    entertained. Stated by the source as an instruction against — "Don't think of your viewer as
    passive."
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  arising_from: [sk_abcd_0015]

