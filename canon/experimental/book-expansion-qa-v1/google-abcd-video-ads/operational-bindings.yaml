  rationale: >-
    The source's own worked example is a minimal pair: one concept, one storyboard, taken through
    the four principles, and the two versions offered side by side. That construction — hold the
    idea fixed, vary only the execution — is the comparison this source is actually built to
    support, and it follows the source's own limit that the ABCDs govern execution and not the
    idea.
