- binding_id: bnd_abcd_008
  source_knowledge_refs: [sk_abcd_0003, sk_abcd_0004]
  source_system_refs: []
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains, flags]
  governance_consumer: evidence_interpretation
  rationale: >-
    Anything weighing this source's numbers against other evidence needs three facts that are not
    visible in the numbers themselves: the publisher sells the product the research validates; the
    study is named but not published, so no method, baseline or dispersion can be inspected; and
    the publisher's own three pages state the identical finding as an upper bound, as an average,
    and with no qualifier at all. Third-party involvement moderates the first of these and does not
    remove it. The figures may be reported; they may not be treated as an inspectable measurement.
  applicability:
    when: "any retrieval, comparison or aggregation involving this source's effectiveness figures"
    limits: >-
      The discount is qualitative. The source supplies no correction factor and none is invented
      here. The discrepancy between the three phrasings is recorded and deliberately not resolved:
      nothing in the source settles which is correct.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_abcd_009
  source_knowledge_refs: [sk_abcd_0014, sk_abcd_0002]
  source_system_refs: [scs_abcd_001]
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains]
  governance_consumer: rule_application
  rationale: >-
    Two limits on how this source may be applied, both of which a retrieval would otherwise strip.
    First, the sound-on assertion is scoped by the source to one named platform, and generalising
    it to short-form or feed video would invert the sound-off default those surfaces are usually
    designed against — every guideline in this source that depends on audio inherits that scope.
    Second, the source states its own boundary: the ABCDs are not a method for generating creative
    ideas, and applying them as one uses the framework for something it disclaims.
  applicability:
    when: "any application of this source outside YouTube video advertising, or at the concept stage"
    limits: >-
      This constrains application; it does not modify any claim. The scope restriction is the
      source's own statement about its own platform, not a finding about other platforms — nothing
      here is evidence about how any other surface is watched.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"
