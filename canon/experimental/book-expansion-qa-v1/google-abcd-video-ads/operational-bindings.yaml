# google-abcd-video-ads — OperationalBindings (SPEC-04)
# EXPERIMENTAL — NOT LIVE CANON.
#
# These are OUR interpretations of what today's system could do with this source, recorded as ours.
# None of them restates a source claim; each references one.
#
# Nothing here asserts or assumes that any generative model can execute these guidelines. Where a
# guideline is executed by a person shooting or cutting an ad, that is where it is left. No
# creative_ir and no production binding is proposed: this source describes evaluable properties of
# finished ads, not fields of an intermediate representation.
#
# Every applicability.limits below repeats the two standing cautions, because a binding is the
# place where a caution is most easily dropped: (1) the publisher sells advertising on the platform
# whose guidance this is; (2) the guidance is contingent on one platform's behaviour at one time.

- binding_id: bnd_abcd_001
  source_knowledge_refs: [sk_abcd_0006, sk_abcd_0007, sk_abcd_0011]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  observation_unit: sequence
  governance_consumer: null
  rationale: >-
    The source's opening guidance concerns how an ad begins and what has appeared by the time it
    has begun — how quickly the narrative reaches its point, how it is framed at the top, and
    whether the brand or product is present. None of that is visible in any single frame: it is a
    property of the opening span, and an evaluator receiving frames independently cannot see it.
    The unit of observation is therefore the opening sequence.
  applicability:
    when: >-
      evaluating the opening of a video ad intended for YouTube, where the campaign objective is
      known and the ad's own story has an identifiable point to reach
    limits: >-
      The source sets no duration for "the start" and no target time to the heart of the story, so
      this diagnoses direction only and cannot produce a pass/fail threshold. Any seconds figure
      used in an implementation is the implementer's, not the source's — the one number the source
      prints, five seconds, describes a single illustrative ad and is not stated as a rule. The
      guidance is for YouTube ads at the pages' stated dates and the publisher sells advertising on
      that platform; both cautions travel with any use of this binding.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_abcd_0006, t_abcd_0010]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_abcd_002
  source_knowledge_refs: [sk_abcd_0010, sk_abcd_0011, sk_abcd_0012, sk_abcd_0013]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, evaluates]
  observation_unit: whole_asset
  governance_consumer: null
  rationale: >-
    Three of the source's branding questions cannot be answered from a part of the ad. Whether
    presence is maintained throughout is a property of the whole; whether a variety of branding
    asset types was used is a count over the whole; and whether an on-screen brand visual is
    accompanied by a spoken mention requires the picture and the audio track of the same asset
    together. An evaluator that receives silent frames can answer none of them.
  applicability:
    when: >-
      evaluating a complete video ad, with its audio track, against the source's branding principle
    limits: >-
      "Early", "often" and "richly" are unquantified in the source, so this yields checkable
      questions and not thresholds. The see-and-say check presupposes the source's claim that
      YouTube audio is heard; on a surface where audio is off by default the check's premise fails
      and the source does not address that case. Publisher-interest and platform-contingency
      cautions apply.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_abcd_0010, t_abcd_0011, t_abcd_0012]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_abcd_003
  source_knowledge_refs: [sk_abcd_0019, sk_abcd_0020, sk_abcd_0021]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  observation_unit: whole_asset
  governance_consumer: null
  rationale: >-
    The Direction principle generates three questions about a finished ad — is there an explicit
    ask, does it name a specific action, and is it carried by both the picture and the voice-over —
    and the source itself widens the first: the ask may be carried by a scene rather than by a
    caption, so an evaluator looking only for end-card text would return a false negative.
  applicability:
    when: "evaluating a complete video ad, with its audio track, where a campaign objective is stated"
    limits: >-
      The source says nothing about where the ask should sit except within its objective table, so
      no placement rule may be drawn from the core guidance. The audio-reinforcement check rests on
      the sound-on premise. Publisher-interest and platform-contingency cautions apply.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_abcd_0019]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_abcd_004
  source_knowledge_refs: [sk_abcd_0008, sk_abcd_0017]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  observation_unit: whole_asset
  governance_consumer: null
  rationale: >-
    Two of the source's faults — competing elements, and doing too much — are both counts over an
    asset rather than properties of a moment, and neither can be judged from a still. The first
    asks whether picture, text and audio are carrying the same key message at the same time; the
    second asks how many distinct messages the ad attempts.
  applicability:
    when: "evaluating a complete video ad against the source's focus and reinforcement guidance"
    limits: >-
      Neither fault is quantified anywhere in the source. It defines no threshold for "too much"
      and no test for when two elements compete rather than reinforce, so any threshold used is the
      implementer's. Publisher-interest and platform-contingency cautions apply.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_abcd_0008, t_abcd_0016]
  repair_ontology_refs: [t_abcd_0007, t_abcd_0015]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_abcd_005
  source_knowledge_refs: [sk_abcd_0009]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [flags]
  observation_unit: whole_asset
  governance_consumer: null
  rationale: >-
    The source ties brightness and contrast to a stated purpose — the ad must survive being watched
    on a small screen — which turns an aesthetic preference into a checkable question about an
    asset. The unit is the whole asset rather than the frame because the source's concern is that
    the ad holds up across its length on the smallest device, not that any one frame does.
  applicability:
    when: "screening a finished video ad intended for viewing across device sizes"
    limits: >-
      The source supplies no measurable target — no contrast ratio, no luminance figure, no
      reference screen — and points readers elsewhere for specs. This binding can flag for human
      review; it cannot score. Publisher-interest and platform-contingency cautions apply.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_abcd_0009]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_abcd_006
  source_knowledge_refs: [sk_abcd_0022, sk_abcd_0023, sk_abcd_0024, sk_abcd_0025, sk_abcd_0026]
  source_system_refs: [scs_abcd_002]
  target_type: benchmark
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [derives]
  governance_consumer: null
  rationale: >-
    The objective table is already a comparison design. It holds the product and the four
    principles constant and varies only the marketing objective, which makes it a ready-made axis
    for a brief set: one proposition, four briefs, differing in exactly the way the source says
    they should differ. The differences it predicts are concrete enough to be checked — the ask
    should be softest under consideration, ordered after the context under action, and repeated
    with escalating directness under full funnel.
  applicability:
    when: "constructing a brief set or comparison set that varies marketing objective"
    limits: >-
      This yields a test axis, not a predicted result. The source attaches no evidence to any cell
      of the table, and its headline lift figures are stated for the ABCDs as a set, never
      decomposed by objective or by principle — so nothing here supports a claim about which
      variant will perform better. Publisher-interest and platform-contingency cautions apply.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

