- brief_id: BR-F01-HI
  body: |
    # Craft context

    ## Working out what matters most
    A commercial layout can only have one thing that is noticed first. When a brief asks for several
    elements to be prominent, that is not a layout problem to be solved by making everything large;
    it is a decision about priority that has to be made before any layout begins. Decide what a
    viewer must take away if they see the piece for only a moment, and let everything else be
    arranged around that. Size, weight, colour contrast and position all compete for the same
    attention, so using all of them on all elements cancels the effect.

    ## Handling conflicting instructions
    Briefs often contain requirements that cannot both be satisfied. When two instructions conflict,
    say so plainly rather than quietly choosing one. Offer a resolution and the reasoning behind it,
    or state the assumption being made so it can be corrected. A plan that silently drops one of the
    client's stated requirements will look complete and will fail review later.

    ## Register and tone
    Words like traditional, modern, premium and friendly describe a feeling rather than a
    specification. When a brief asks for two registers that pull against each other, blending them
    usually produces something that reads as neither. It is generally better to let one register
    lead and let the other appear in a specific, limited way — one element, one detail — so that both
    are present without the piece becoming incoherent.

    ## Typographic decisions
    Type carries meaning through more than the words. Weight, case, spacing and the relationship
    between sizes all signal how formal, how urgent and how expensive something is. Where copy must
    appear exactly as supplied, treat those strings as fixed content and design around them rather
    than adapting them to fit a layout. Legibility at the size the piece will actually be viewed
    matters more than how it looks at full size on a desktop screen.

    ## Offers and specifics
    Concrete terms tend to be more persuasive than general claims. A specific number, a specific
    deadline and a specific limit give a reader something to act on, where general assurances of
    value do not. If the brief supplies specifics, keep them intact and prominent.

    ## Before finishing
    Check that every required element is present, that nothing contradicts anything else, and that
    the single most important message is still the first thing a viewer would notice.

- brief_id: BR-F02-EN
  body: |
    # Craft context

    ## Photographing a product so it reads correctly
    A product shot has to do two things at once: present the object attractively and describe it
    accurately. When those pull apart, accuracy generally has to win, because a customer who receives
    something different from the image is a customer lost. Decide early which properties of the
    object the image must convey — its material, its size, its finish, what it is made of — and treat
    those as requirements rather than as aesthetic preferences.

    ## Materials and how light behaves on them
    Different surfaces need different treatment. A glossy or transparent object shows the light source
    itself in its surface, so the shape, size and position of that source becomes part of the object's
    appearance. Broad, soft light tends to produce long gradual highlights that describe a curved
    surface; small hard sources produce bright compact spots that can read as glare and can obscure
    what lies beneath. Transparent objects are usually described by what shows through them and by the
    edges where their material bends light, rather than by light falling on their front.

    ## Keeping labels and text legible
    Where a label carries the product's claim, its legibility is a functional requirement of the
    image. Reflections that fall across text are the usual cause of failure. So is a viewing angle
    that foreshortens the label, and a background whose tone sits too close to the label's own.

    ## Background and context
    A clean background keeps attention on the object and is generally the right choice when the
    product is unfamiliar. It also removes any cue about scale, so if size matters it has to be
    conveyed another way. Whatever the background, it should not introduce colours that contaminate
    the product's own.

    ## Composition
    Give the object enough space that it does not feel cramped, but not so much that it looks small
    and unimportant. A slightly elevated three-quarter view describes most objects better than a
    straight-on view, because it shows more than one surface and therefore more of the form.

    ## Colour accuracy
    Where a product's colour is part of its identity, the image has to represent it faithfully. Colour
    shifts introduced by the light source, by a coloured surface bouncing light back onto the object, or
    by heavy processing will all misrepresent it. Neutral lighting and a neutral environment make the
    product's own colour readable, and where a brand colour is specified it should be treated as a
    requirement to be checked rather than an approximate target.

    ## Consistency across a range
    A product shot rarely lives alone. It will sit beside other products from the same business, in a
    feed, on a listing page or in a catalogue. Establishing a repeatable approach — the same angle, the
    same lighting arrangement, the same distance and background — matters more than optimising any single
    image. An inconsistent set reads as amateur even when every individual frame is competent.

    ## Before finishing
    Confirm the object looks like what it actually is, that any required text is readable, and that
    nothing in the frame contradicts a claim the copy makes.

- brief_id: BR-F03-HG
  body: |
    # Craft context

    ## People in commercial imagery
    When a person appears with a product, the viewer reads the relationship between them before
    reading anything else. Decide what that relationship should say — that the person uses the
    product, trusts it, has been helped by it — and let the pose, expression and framing serve that.
    A person who looks like they are presenting a product to camera reads as an advertisement; a
    person who looks like they are using it reads as evidence.

    ## Credibility in sensitive categories
    Some categories carry consequences for the customer, and money is the clearest of them. In those,
    a viewer's first question is whether the business can be trusted, and everything in the creative
    either supports or undermines that. Visual signals of seriousness — restraint, clarity,
    consistency, accurate detail — do more for trust than statements of trustworthiness do.

    ## Reconciling opposed tones
    Briefs frequently ask for two tones that work against each other, such as authoritative and
    playful. Averaging them tends to produce something bland. A better approach is to decide which
    tone carries the responsibility of the message and which is allowed to colour the surface — for
    instance, a serious structure with a warm, informal voice. State that decision so it can be
    reviewed rather than leaving it implicit.

    ## Interfaces shown inside creatives
    When a screen appears in an advertisement it becomes a factual claim about the product. It should
    be the real interface, current, and legible at the size it will be viewed. An invented or
    outdated screen is both misleading and, in practice, the detail that customers notice.

    ## Assuming knowledge the audience lacks
    People who work on a product forget what it is like not to understand it. Terms that feel basic
    inside a company are often opaque outside it. Test the main message against someone with no prior
    knowledge, and prefer plain description of the benefit over category vocabulary.

    ## Calls to action
    If the purpose of the creative is to prompt an action, that action must be visible, specific and
    easy. A viewer who is persuaded but unsure what to do next is a wasted impression.

    ## Framing for the platform
    A creative made for a feed will be seen small, quickly, and often with other content directly above
    and below it. Decide early what the piece must communicate at that size, and check the composition
    by viewing it small rather than at full resolution. Faces and text survive scale reduction better
    than fine detail and thin type.

    ## Casting and representation
    Who appears in a creative tells the audience who it is for. The person shown should be plausibly a
    member of the audience being addressed rather than an idealised figure, particularly where the
    proposition is about accessibility or ease. Wardrobe, setting and grooming all contribute to this
    and should be chosen deliberately rather than defaulting to the most polished option available.

    ## Legibility of overlaid text
    Text placed over an image competes with whatever is behind it. Reserving a clear area for the copy
    at the composition stage works better than adding a darkening layer afterwards, which tends to make
    the image muddy while only partly solving the problem.

    ## Before finishing
    Check that the person, the product and the message tell the same story, and that nothing shown
    would be contradicted by the actual product experience.

- brief_id: BR-F04-EN
  body: |
    # Craft context

    ## Working from an existing campaign
    When a client asks for something consistent with work they already have, consistency is the
    requirement and not a preference. Before designing anything, establish what actually makes the
    existing work recognisable. It is rarely everything: usually two or three specific properties do
    the work — a palette, a type treatment, a compositional habit, a particular quality of light —
    while the rest varies freely. Identify those load-bearing properties explicitly, because copying
    everything produces a repeat rather than a companion piece.

    ## Asking rather than assuming
    If the reference is named but not supplied or described, that is a gap in the brief and should be
    raised. Inventing a house style and describing it as consistent is the common failure here, and
    it will not survive contact with the client's actual materials. It is legitimate and useful for a
    plan to state exactly what it needs to see.

    ## What should change and what should not
    A seasonal or campaign variation changes subject, mood and content while holding identity
    constant. Being clear about which axis is moving prevents a variation from reading as a rebrand.
    A useful test: if the new piece appeared beside the old one, would a customer recognise them as
    the same voice?

    ## Recognition takes time to build
    Visual identity accumulates value through repetition. Changing it for the sake of freshness
    discards that accumulated recognition, which is expensive and slow to rebuild. When something is
    already working and recognised, the burden of proof sits with any proposal to change it.

    ## Using supplied photography
    Client-supplied images constrain what is possible, and those constraints should be established
    early rather than discovered late. Consider what the existing images actually show, whether they
    are consistent with each other, and whether the required treatment can be applied to them.

    ## Minimal copy
    Where a single line carries the whole message, it needs enough space and contrast to be read
    without effort, and it should not compete with a busy area of the image.

    ## Before finishing
    Confirm the piece would be recognised as belonging to the existing campaign, and that any
    assumption made about the reference has been stated rather than buried.

- brief_id: BR-F05-HG
  body: |
    # Craft context

    ## Pace is a decision with consequences
    Cutting speed is not a surface style; it changes what a viewer can absorb. Fast cutting creates
    energy and urgency and reduces how much of each image is understood. Slower cutting allows detail
    and mood to register and risks losing attention. In a very short piece this choice cannot be
    hedged, because there is not enough time for the piece to be both.

    ## When a brief asks for both
    A request for energy and calm at once is a real conflict and should be surfaced as one. There are
    honest resolutions: let the pace change across the piece, so it opens calm and accelerates or the
    reverse; or hold the cutting slow and create energy inside the frame through movement instead.
    What does not work is cutting at a medium rate and hoping it reads as both.

    ## Every cut needs a reason
    A cut should deliver something the previous shot could not — new information, a new emotional
    beat, a change of scale. Cuts made only to keep things moving read as restlessness. In a very
    short piece each additional cut spends a meaningful fraction of the total duration, so the number
    of shots is itself a budget.

    ## Sound and picture share one attention
    Music, voiceover and effects compete with the image for the same limited attention. When a
    voiceover carries the main message, the image should support it rather than demand independent
    attention at the same moment. Dense visuals under a dense voiceover mean neither is absorbed.
    Silence, or a reduction in sound, is a legitimate way to make something visual land.

    ## Product presentation inside motion
    If a product must be recognised, at least one shot needs to hold long enough for it to be read,
    and the product should be lit and framed so its form and label are clear. Rapid cutting across a
    product that has never been established leaves a viewer with an impression but no recognition.

    ## Endings
    A short commercial usually ends with the one thing the viewer should retain. Whatever that is —
    a name, an offer, an action — it needs enough time on screen to be read at viewing size.

    ## Establishing before moving
    A viewer needs to know what they are looking at before they can appreciate how it is presented. In a
    short piece this means at least one early shot that clearly establishes the subject, held long enough
    to be read. Opening on an extreme close-up or a fast-moving detail is visually appealing and
    frequently leaves the audience a second behind for the rest of the piece.

    ## Music and its role
    Music sets expectation faster than image does, and a viewer forms a judgement about what kind of
    piece they are watching within the first moments of hearing it. Choosing music that matches the
    intended register, rather than music that is simply energetic, does much of the tonal work. Where a
    voiceover carries the message, the music must leave room for it.

    ## Consistency of the product across shots
    If a product appears in several shots it must look like the same object each time — the same colour,
    the same packaging, the same proportions. Viewers notice inconsistency in a familiar object
    immediately, and it undermines confidence in everything else the piece claims.

    ## Working within the duration
    Before planning shots, divide the available seconds among the beats the piece must contain. This
    usually reveals that the brief contains more than the time allows, which is far better discovered at
    the planning stage than during assembly.

    ## Before finishing
    Check the number of shots against the duration, and confirm the main message is legible.

- brief_id: BR-F06-EN
  body: |
    # Craft context

    ## Keeping a sequence coherent
    A sequence of shots reads as one continuous event only if the viewer can place each new shot in
    relation to the last. The main things that must hold are the direction a subject faces or moves,
    the position of things within the space, the appearance of the subject, and the continuity of
    sound. When one of these breaks, viewers may not identify what went wrong, but they feel that
    something did.

    ## Screen direction
    If a subject moves left to right in one shot and right to left in the next, they read as having
    turned around. Keeping the camera consistently on one side of the line of action preserves this.
    Where direction genuinely must reverse, a deliberate transitional shot can carry the change
    without confusion.

    ## Changing shot size and angle
    Cutting between two shots that are too similar produces a visible jump. Cutting between shots
    that differ clearly in angle and in size reads as a deliberate change of viewpoint. As a
    practical rule, change both at once rather than only one.

    ## Consistency of the subject
    Across a sequence the same person must remain recognisably the same person: the same face, the
    same clothing, the same details. This sounds obvious and is one of the most common failures in
    assembled sequences, because each shot is judged on its own before the sequence is watched as a
    whole. Check it by watching the shots in order rather than by reviewing them individually.

    ## Telling a story without dialogue
    Without speech, the sequence carries meaning through action, order and consequence. Each shot
    should advance a simple chain — a situation, a change, a result — and the viewer should be able
    to state what happened. Ambient sound and music set the emotional register but cannot supply
    information that the images do not contain.

    ## Register
    A brief asking for something that feels real rather than styled is asking for restraint:
    available light, ordinary settings, unposed action, imperfection left in. Polished lighting and
    posed framing will read as advertising however natural the performance.

    ## Light as a continuity element
    Light direction, quality and colour are part of what makes a sequence read as one continuous moment.
    Shots recorded under obviously different conditions will not cut together even when everything else
    matches. Where a sequence is meant to occur over a short period, the light should be consistent with
    that period.

    ## Rhythm without dialogue
    With no speech to structure the piece, shot duration carries the rhythm. Holding a shot slightly
    longer than feels necessary often allows a moment to register, where cutting on the beat of the music
    throughout produces something that feels like a montage rather than an observed event.

    ## Product visibility in a wearable category
    Where the product is worn rather than held, it needs at least one shot that shows it clearly enough
    to be recognised, and that shot has to be motivated by the action rather than inserted. A moment
    where the subject naturally interacts with the product is more effective than a detached insert.

    ## Before finishing
    Watch the sequence in order and confirm the subject stays consistent, the geography holds, and
    the intended action is understandable without any words.

- brief_id: BR-F06-HG
  body: |
    # Craft context

    ## Telling a complete story in very little time
    A short piece that must show a situation, an action and a result has roughly one beat per few
    seconds. That means each beat has to be immediately legible: a single clear action, framed so the
    important thing is obvious without searching. Anything requiring interpretation will be missed.

    ## Reducing what the viewer must process
    The less work a viewer has to do, the more of the message survives. Familiar situations, familiar
    objects and conventional framing all reduce that work. Novelty is expensive in a short piece,
    because a viewer spends their first moments working out what they are looking at rather than
    following what is happening.

    ## Structure
    A reliable structure for a short commercial piece is a problem the audience recognises, an action
    that addresses it, and a visible result. Naming what the audience actually wants — and what is
    getting in the way — usually matters more than describing the product's features. The result
    should be shown rather than claimed.

    ## Choosing what to leave out
    When a brief contains more than the duration can hold, the answer is subtraction rather than
    compression. Speeding everything up to fit produces a piece where nothing registers. Decide what
    the single necessary message is, keep it, and remove the rest, saying explicitly what was removed
    so the decision can be reviewed.

    ## Making the beats read
    Each transition should be motivated by the action, so the viewer follows the chain rather than
    noticing the edits. Where a device or interface appears, it needs enough time to be recognised at
    viewing size, which in practice means longer than it feels while editing.

    ## Ending on the action
    Where the purpose is to prompt a specific behaviour, the closing frames should carry that clearly
    and hold long enough to be read. A service promise expressed as a specific number is easier to
    remember than a general claim of speed.

    ## Legibility of screens and interfaces
    Where a device screen carries part of the story, it must be readable at viewing size, which usually
    means showing a simplified version of what is on it rather than the full interface. A screen the
    viewer cannot read contributes nothing except the general idea that a phone is being used.

    ## Continuity through a compressed sequence
    Even a very short sequence has to hold together: the same person, the same setting, the same objects
    in the same state. Compressed timelines make this harder rather than easier, because each shot has
    less time to re-establish context for the viewer.

    ## Sound in a sound-off environment
    Much short-form video is watched without sound. Anything essential to understanding should be
    carried visually or by on-screen text, with audio treated as reinforcement rather than as the primary
    channel.

    ## Before finishing
    Count the beats against the duration and confirm each one can be understood on a single viewing
    with the sound off.

- brief_id: BR-F07-HI
  body: |
    # Craft context

    ## A person speaking to camera
    When someone addresses the viewer directly, credibility comes from how they speak rather than
    from production polish. Natural delivery, ordinary surroundings and unforced framing support
    belief. Over-lit, over-composed treatments push the same words toward reading as a performance.

    ## Testimony and evidence
    A personal account carries weight because it is specific and because it is someone's own. Claims
    that are large and general invite doubt in a way that specific, bounded claims do not — a stated
    circumstance, a particular result, a named condition. Where a claim concerns a real outcome, it
    should be one the business can actually support, and the account should be genuine.

    ## The salesperson test
    A useful check for any commercial script is whether a person selling face to face would actually
    say those words to this customer. Language that would sound absurd in person usually reads as
    advertising noise on screen. This test tends to remove superlatives and slogans and leaves
    concrete reasons.

    ## Framing and background
    A medium shot that includes the hands allows a speaker to hold and show a product naturally. The
    background should establish context without competing — a real working environment usually does
    more for credibility than a neutral backdrop, provided it is not busy behind the speaker's head.

    ## Showing the product with the speaker
    If the product must be identified, it needs a moment where it is held still and clearly visible.
    A product waved while someone talks will not be recognised. Its packaging should be the current
    one, and legible at viewing size.

    ## Sound
    Speech intelligibility matters more than any other audio consideration. Location sound with
    background noise is acceptable and often desirable for authenticity, so long as every word is
    clear. Music, if present, should sit well under the voice.

    ## Length and structure
    A twenty-second piece supports roughly one claim and one closing line. Trying to fit several
    claims produces a rushed delivery and a viewer who retains none of them.

    ## Location and its meaning
    Where a speaker stands is itself an argument. A person filmed in the environment where they actually
    use the product carries more credibility than the same person against a neutral background, because
    the setting corroborates what they say. Any location should be checked for distracting elements
    behind the speaker before recording.

    ## Pacing of speech
    A single speaker delivering one claim needs time for the words to land. Rushing delivery to fit more
    in reduces both comprehension and believability. If the script does not fit comfortably in the
    available time, the script should be shortened rather than the delivery accelerated.

    ## Text supporting speech
    On-screen text that repeats or reinforces a spoken point helps retention, particularly where a
    viewer may be watching without sound. It should agree exactly with what is said; a mismatch between
    spoken and written versions of the same claim is noticed and undermines both.

    ## Before finishing
    Confirm the words are understandable, the product is identifiable, and the speaker reads as a
    real person rather than a presenter.

- brief_id: BR-F08-EN
  body: |
    # Craft context

    ## Two people in conversation
    A two-person exchange has to establish who is speaking, who they are speaking to, and how they
    relate — all quickly. Consistent eyelines are what make this work: each person should appear to
    be looking toward where the other actually is. If both appear to look the same way, they read as
    looking at a third thing rather than at each other.

    ## Cutting between speakers
    Cuts in dialogue are usually motivated by speech, but cutting exactly on each line makes an
    exchange feel mechanical. Letting a cut land slightly before or after a line begins — so that a
    reaction is seen, or a line starts over the previous shot — makes the exchange feel observed
    rather than staged. Sound running continuously across the cut helps hold the moment together.

    ## Consistency across shots
    Both people must remain recognisably themselves across every shot: same faces, same clothing,
    same positions relative to each other and to the room. Where a brief specifies a shot structure,
    that structure is a requirement, and the sequence should be checked as a whole rather than shot
    by shot.

    ## Emotional register in difficult categories
    Subjects involving risk, health or money can be approached through fear or through reassurance.
    Fear gains attention and frequently produces avoidance rather than action. Where a brief
    explicitly asks for warmth, that is a constraint on the whole approach, not a note about colour:
    the situation should be recognisable and ordinary rather than alarming, and the exchange should
    end somewhere the viewer can act from.

    ## Naming the real problem
    People act on how a situation makes them feel more than on its technical description. An
    exchange that surfaces an unspoken worry — uncertainty, not being sure, having assumed something
    — tends to land harder than one that states a fact about a product.

    ## Closing
    Where a piece ends on an instruction, that instruction should be simple, specific and achievable
    immediately, and should hold on screen long enough to be read.

    ## Setting and its implications
    The environment in which a conversation takes place carries meaning about the relationship between
    the people in it and about the seriousness of the subject. A domestic setting suggests an ordinary
    moment rather than a formal one, which is usually appropriate where the aim is to make a difficult
    subject approachable.

    ## Performance and naturalism
    Dialogue that reads well on the page can sound stilted when performed. Short exchanges, incomplete
    sentences and pauses tend to sound more like real speech than complete, balanced lines. Where a brief
    supplies exact dialogue, it should be delivered as written, but the surrounding performance can still
    be relaxed.

    ## Framing a two-person exchange
    Matching the framing of both people — the same shot size, the same height, the same distance — treats
    them as equals in the conversation. Deliberately mismatching it implies a power difference, which
    should be a choice rather than an accident of how the shots were composed.

    ## Duration and the number of beats
    A twenty-second piece containing two lines of dialogue and a closing card has room for the exchange
    to breathe, but not for additional business. Adding establishing material or extra action compresses
    the dialogue and undermines the moment the piece exists to create.

    ## Sound
    Speech clarity is the priority. Room tone should be continuous across cuts so the exchange feels like
    one moment, and music should not compete with the dialogue.

    ## Before finishing
    Check that both people stay consistent, that the eyelines match across every cut, and that the
    tone requested by the client is actually what the piece delivers.

- brief_id: BR-F08-HG
  body: |
    # Craft context

    ## When the brief does not fit the duration
    A fixed duration is a hard constraint, and requirements have to fit inside it. When a brief asks
    for more than the time allows — several lines, a product reveal, character establishment and a
    closing card in a very short piece — the honest response is to say so and offer options: remove a
    requirement, extend the duration, or simplify one element. Silently dropping something is the
    common failure, and it surfaces only at review.

    ## Deciding what to give up first
    Not all requirements cost the same. Some carry the message; others support it. Rank them
    explicitly, decide what can be lost with least damage, and state that reasoning. A plan that
    shows its priorities can be corrected; one that presents a reduced scope as if it were the full
    brief cannot.

    ## Establishing people quickly
    Character comes across through behaviour rather than through description. One clear action or one
    well-chosen line does more than several seconds of screen time. In a short piece there is no room
    for introduction, so the first thing each person does has to carry who they are.

    ## Objection and answer
    A structure where one person voices a doubt the audience shares, and another answers it, is
    efficient because it does the audience's thinking out loud. The doubt has to be the real one, and
    the answer has to be specific enough to be believed.

    ## Tone in categories involving money
    Humour gains attention; it can also undercut confidence when a significant purchase is involved.
    A workable approach lets the lighter tone carry the setup and the more serious tone carry the
    answer, so the piece is approachable without seeming casual about the customer's risk.

    ## Rules are guides, not laws
    Conventional practice exists because it usually works, not because it always does. Where a stated
    purpose is better served by departing from convention, that is legitimate — provided the
    departure is deliberate and stated rather than accidental.

    ## Location and context
    Where the exchange happens should support what is being discussed without demanding attention. A
    setting directly relevant to the subject does useful work; a busy or visually complex one costs the
    viewer attention they need for the dialogue.

    ## Delivering exact lines naturally
    Where dialogue is supplied verbatim it must be delivered as written, but the performance around it
    can still feel unforced. Reaction, timing and the moment before a line often do more than the line
    itself, and they cost no extra duration if planned into the shot rather than added afterwards.

    ## Showing a product or service credibly
    Where an application or service is the subject, whatever is shown of it must be the real thing and
    legible at viewing size. A brief glimpse of an unreadable screen adds nothing and takes time the
    piece does not have.

    ## Text at the close
    A closing line carries the message the viewer should leave with. It needs contrast against whatever
    is behind it and enough time on screen to be read once comfortably, which is longer than it appears
    when reviewing on a large display.

    ## Before finishing
    Add up what the duration actually has to contain, and confirm nothing required has been quietly
    left out.

- brief_id: BR-F09-HI
  body: |
    # Craft context

    ## Filming a physical exchange
    An object passing from one person to another is a small action that has to read clearly. The
    hands and the object should be framed so the moment of transfer is visible, and the object should
    remain the same object throughout — same size, same condition, held plausibly. Contact between
    hands and object is what makes the action believable; ambiguity about who is holding what breaks
    it immediately.

    ## Surfaces and their appearance
    Different materials behave differently under light. Fabric scatters light softly and shows its
    weave in shallow relief. Printed or laminated surfaces produce more directional highlights, and a
    reflection falling across printed matter will obscure it. Where a uniform or a package carries
    branding, that branding has to stay legible through the action, which constrains both the angle
    and where the light comes from.

    ## Consistency across the sequence
    Across a short sequence the same elements must hold: the same people, the same clothing, the same
    object, the same location and consistent light. Sound should also carry across cuts so the
    sequence feels like one continuous moment rather than assembled fragments.

    ## Copy that must appear exactly
    Where text is supplied as required copy, it is fixed content. It must be reproduced exactly as
    given, and any mark or accent within it is part of the word rather than decoration. Text should
    be checked character by character against the source rather than by eye, because a single altered
    character can change a word's meaning entirely while still looking plausible.

    ## Meaning before styling
    Establish what a piece is actually saying before deciding how it should look. Where a line has a
    specific sense, the design has to preserve that sense; treating supplied words as a shape to be
    arranged is how meaning gets lost.

    ## Register
    A brief asking for something simple and real is asking for ordinary settings, natural light and
    unforced performance. Everyday credibility does more for a service business than polish does.

    ## Timing a small action
    A brief physical action needs a moment before and after it to read clearly — the approach, the
    transfer, the acknowledgement. Cutting into the middle of the action and out again leaves the viewer
    assembling what happened rather than watching it.

    ## Framing at a doorway
    Doorways constrain where a camera can be placed and often produce a strong contrast between interior
    and exterior light. Deciding which side of that contrast the important detail sits on prevents faces
    or branding from being lost in shadow or blown out.

    ## Before finishing
    Confirm the transfer reads clearly, the branding stays legible, and all required text is exactly
    as supplied.

- brief_id: BR-F10-HI
  body: |
    # Craft context

    ## When two requirements cannot both be met in one shot
    Some briefs contain requirements that are physically incompatible within a single frame. Showing
    fine detail on a small object and showing a wide, expansive scene are the clearest example: the
    closer the framing, the more detail is legible and the less context is visible. This is not a
    matter of preference and cannot be solved by compromise, because a middle distance delivers
    neither.

    ## Resolving across shots rather than within one
    The normal resolution is to give each requirement its own shot. A wide frame establishes scale
    and setting; a close frame delivers the detail. Sequenced together, the viewer receives both. A
    plan should state this explicitly rather than presenting a single compromise framing and hoping
    it satisfies the brief.

    ## How tightly to frame
    How much space surrounds a subject changes what the image is about. A tight frame makes the
    subject the entire subject and removes context; a loose frame places it in a world and reduces
    its prominence. Choosing this deliberately, shot by shot, is one of the more consequential
    decisions available.

    ## Deciding between competing registers
    A request for two opposed styles — grand and contemporary, ornate and restrained — needs a
    decision rather than an average. Usually one register should structure the piece while the other
    appears in specific, limited ways. Say which is leading and why.

    ## Consistency across a short sequence
    Across several shots the same person must remain recognisably the same, wearing the same things,
    in the same setting, under consistent light. Where jewellery, clothing or ornament is the subject,
    it must be identical from shot to shot; changes read immediately as errors.

    ## Cultural specificity
    Where a piece depends on a particular cultural context — an occasion, its conventions, what is
    appropriate within it — accuracy matters and cannot be inferred from general design principles.
    Where that knowledge is not available, the honest course is to identify what needs to be verified
    rather than to approximate it.

    ## Planning a short sequence of shots
    With only three or four shots available, each one has to earn its place. A workable approach assigns
    each shot a distinct job — establish the setting, show the subject, deliver the detail, close on the
    brand — so that none duplicates another. Listing those jobs before choosing framings prevents a
    sequence of attractive but redundant images.

    ## Showing ornament and fine detail
    Small, reflective or intricate objects are described by how light moves across them. They generally
    need a light source that is directional enough to reveal form and broad enough not to produce harsh
    glare, and a framing close enough that the detail occupies real space in the frame rather than a few
    pixels of it.

    ## Wardrobe and continuity
    Where costume and ornament are the subject, every element must match exactly across shots. This is
    one of the most common continuity failures in sequences involving dress, because each shot looks
    correct in isolation.

    ## Text and brand at the close
    A business name and location shown at the end must be legible at viewing size and accurate. Where
    this text is supplied it should be reproduced exactly, and its legibility checked against whatever
    sits behind it.

    ## Before finishing
    Confirm the required detail is legible somewhere, that the sequence holds together, and that
    every stated requirement has been addressed or explicitly raised.
