representation_integrity:
  delivery_format: publisher_epub
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    HarperCollins EPUB, ISBN 9780062388438. No page exists in the file; every object locates itself
    by sub-section.
  inspection_state: inspected_figure_level
  visual_argument_role: figure_carries_content
  observed_loss_patterns:
    - pattern: named_loss_with_unstated_content
      affects: >
        A two-axis chart runs FAILS-WORKS against MAKES SENSE-SEEMS WEIRD with roughly two dozen
        items placed in the quadrants. The prose names only the top-right quadrant and one item,
        the bicycle. Every other placement exists solely in the image - Marxism, flossing,
        economies of scale, management consultancy and economics in makes-sense-and-fails;
        placebos, marketing, heuristics, evolution, constitutional monarchy and Red Bull in
        seems-weird-and-works. Several of these are the strongest claims on the page and they are
        made by position on a chart rather than by argument.
      detectability: named_by_text
      recoverability: recovered_in_this_copy
      evidence: >
        C-24. The text points at the figure - "this graph", "the top-right section of this graph" -
        so the absence is announced and an extractor would not miss it silently. What a text-only
        pass produces is the claim with none of the content that makes it contentful. Both images
        were opened and read.
    - pattern: no_authored_page
      affects: No printed page; provenance by sub-section only.
      detectability: named_by_text
      recoverability: unrecoverable_in_this_copy
      evidence: ledger page_layout status does_not_exist.
  claim_resolution_after_inspection: all_resolved
  consequence: >
    This is the case that justifies keeping the visual pass mandatory rather than triaging it by
    source class. The two preceding books in the same lane and the same domain had zero figures, so
    it would have been reasonable to treat a visual pass on an advertising source as a formality.
    Here one of two figures is the thesis. A pass skipped once a source class looks textual would
    have missed it.

evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 32 objects reviewed. This source is the sharpest of the three in its lane because it needs
    two origin values inside one extraction, and the frozen vocabulary has one.
  categories:
    - category: mixed_own_and_third_party
      sk_refs: [sk_sut_alc_0003, sk_sut_alc_0013, sk_sut_alc_0019, sk_sut_alc_0029, sk_sut_alc_0030]
      evidence: >
        Within a single processed section the same characteristic is correctly applied to the
        author's own field experiments - the envelope test and two other pieces of his agency's own
        work, sk_sut_alc_0003, 0013 and 0019, all carrying empirical_within_source - and correctly
        withheld from cited external research: Parker and Bollinger at Duke on the appendix with an
        effect size (sk_sut_alc_0029), and a 1996 Heritage Institute survey on religious practice
        (sk_sut_alc_0030). The file itself therefore contains the distinction the vocabulary cannot
        express. This entry names the source-level fact; the two sub-categories below name which
        objects fall where.
    - category: source_own_measurement_reported
      sk_refs: [sk_sut_alc_0003, sk_sut_alc_0013, sk_sut_alc_0019]
      evidence: >
        All three carry empirical_within_source in the frozen record. Sutherland's own experiments,
        with results reported.
    - category: third_party_measurement_reported
      sk_refs: [sk_sut_alc_0021, sk_sut_alc_0029, sk_sut_alc_0030]
      evidence: >
        Trivers and Kurzban on self-deception (sk_sut_alc_0021, a named third party's theory
        reported by the source), the Duke appendix research with named investigators, an
        institution, a date and an effect size (sk_sut_alc_0029), and the 1996 survey reported as a
        list of findings with no effect sizes, no sample and no controls (sk_sut_alc_0030). None
        carries empirical_within_source, correctly.
    - category: source_author_assertion
      sk_refs: [sk_sut_alc_0023]
      evidence: >
        Asserted as established. No study is named for emotional misattribution in this section,
        although a substantial literature exists; the source is not drawing on it here. 26 of 32
        objects carry practitioner_assertion.
    - category: source_quotes_named_third_party
      sk_refs: [sk_sut_alc_0022]
      evidence: >
        Two quotations from named advertising practitioners, used as the warrant for a strong claim
        about a whole research method.
  relation_to_evidence_characteristics: >
    Three books in one lane, three different failures of one field: Hopkins claims measurement and
    reports almost none; Heath reports measurement constantly and almost none is his own;
    Sutherland does both inside one section. That is the strongest recurrence signal in the corpus
    for area B, and it is why the origin question needs its own structure rather than a fourteenth
    evidence characteristic. Note that mixed_own_and_third_party is recorded at source level and
    overlaps deliberately with the two specific categories; the overlap is what makes the source-
    level fact aggregatable while keeping the object-level assignment exact.

