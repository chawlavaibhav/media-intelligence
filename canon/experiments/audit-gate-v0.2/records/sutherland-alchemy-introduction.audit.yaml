      existing_binding_refs: [bnd_sut_alc_0004, bnd_sut_alc_0005]
    - consumer: governance
      outcome: binding_exists
      existing_binding_refs: [bnd_sut_alc_0001, bnd_sut_alc_0002, bnd_sut_alc_0003]
      note: >
        Three of seven bindings are governance. The book is about how to evaluate evidence and when
        not to trust rational analysis, which is knowledge about interpretation rather than about
        an asset (C-28).
    - consumer: benchmark
      outcome: binding_exists
      existing_binding_refs: [bnd_sut_alc_0007]
    - consumer: deterministic_composition
      outcome: no_current_binding
    - consumer: human_workflow
      outcome: candidate_no_binding_made
      note: >
        Much of the argument is about how a team should test ideas - try the illogical option,
        distrust stated preferences. That is workflow guidance with no consumer. Seven of this
        book's remedy terms carry executable_by: [unknown] for the same reason.
  unbound_knowledge_of_note: []
  conclusion: >
    Source shape predicted which LAYER this source binds to, not merely how much it binds - heavily
    governance, lightly Creative IR. That is a useful signal for retrieval design and it is
    invisible in a binding count.

