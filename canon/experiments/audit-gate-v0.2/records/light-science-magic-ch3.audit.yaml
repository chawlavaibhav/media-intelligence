  conclusion: >
    Binds across all five SPEC-04 target types from only 20 objects, and does so on
    mechanism-bearing evidence. The corpus's counterexample to any reading of binding count as
    quality runs the other way - StoryBrand binds well on weak evidence - and this source shows the
    two can also coincide.

