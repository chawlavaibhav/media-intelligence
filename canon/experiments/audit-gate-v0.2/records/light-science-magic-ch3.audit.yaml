representation_integrity:
  delivery_format: repository_text_extract
  page_addressability: pages_unknown
  page_addressability_evidence: >
    The processed text is canon/sources/lsm-ch3-reflection.txt, 27,296 bytes, verified against the
    5th edition EPUB at 200 of 200 sentences over 70 characters once HTML entities were decoded.
    The underlying EPUB has no pages, and the repository text carries none.
  inspection_state: not_inspected_access_blocked
  visual_argument_role: figure_carries_content
  observed_loss_patterns:
    - pattern: named_loss_with_unstated_content
      affects: >
        Fourteen figures, 3.1 to 3.14, each with a numbered descriptive caption the text preserves.
        Seven are diagrams whose geometry the prose describes in enough detail that the loss is
        partial. Seven are photographs, and several are matched pairs differing in exactly one
        variable - 3.2 against 3.3 changes light size; 3.5 against 3.6 does the same for a shiny
        saw; 3.13 against 3.14 adds a polarising filter and changes nothing else. Those comparisons
        are the chapter's proof and they are unavailable.
      detectability: named_by_text
      recoverability: recoverable_not_attempted
      evidence: >
        The ledger records 14 figures named in text but unseen and 3 matched photographic pairs
        unavailable. The worked case is 3.13/3.14, where the polarising filter removes the
        reflection from black plastic while leaving the white feather unchanged, and the feather's
        unchanged brightness is what proves the exposure compensation was honest. That
        self-checking can only be confirmed by looking.
    - pattern: no_authored_page
      affects: The 5th edition EPUB has no page; no printed page number can be cited.
      detectability: named_by_text
      recoverability: unrecoverable_in_this_copy
      evidence: PROVENANCE and the extraction, which carries no page_start on any of the 20 objects.
  claim_resolution_after_inspection: not_applicable
  consequence: >
    Recorded as not_inspected_access_blocked rather than as a damaged artifact, because nothing is
    wrong with the source. The local book library became unreadable mid-batch - diagnosed as macOS
    privacy protection over Downloads, Documents and Desktop, not the Claude Code sandbox, and
    later fixed by the user granting access. This is the clearest reason inspection_state must be
    separable from artifact integrity: the same value that CANON-003 gave this source
    (blocked_visual_validation) was also given to Albers, whose file opened perfectly and whose
    evidence is permanently destroyed. One was a permission; the other is unrecoverable.

evidence_origin:
  audit_scope: notable_objects_only
  audit_scope_note: All 20 objects reviewed; two carry a non-default origin.
  categories:
    - category: source_own_measurement_reported
      sk_refs: [sk_lsm_c003_0005, sk_lsm_c003_0011]
      evidence: >
        Both carry empirical_within_source in the frozen record. The authors report their own
        photographic tests with stated conditions, which is measurement in the sense SPEC-03
        intends.
    - category: source_author_assertion
      sk_refs: []
      evidence: >
        The other 18 objects. Only three carry practitioner_assertion; 14 carry mechanism_given,
        because this source explains the physics rather than asserting practice. That profile is
        the opposite of Ogilvy's and the schema absorbed both without modification.
  relation_to_evidence_characteristics: >
    No strain. This source is where SPEC-03's evidence vocabulary works exactly as designed.

