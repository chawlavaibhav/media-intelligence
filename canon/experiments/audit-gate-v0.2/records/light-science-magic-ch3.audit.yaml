    No shared authorship, series, publisher or derivation with any corpus source.
  extractor_exposure:
    spec_contains_examples_from_this_source: true
    evidence: >
      This is the source B-17 was found on, and it is the sharpest exposure case in the corpus.
      SPEC-04's worked governance example bnd_gov_001 is this chapter's "specular" refusal, quoted
      in full, and SPEC-05 opens its rule section with the same refusal as its precedent. During
      CANON-001 the extractor read both. The fresh pass's governance binding therefore appeared to
      converge with the historical audit and did not, because the finding was already known. It was
      struck from the convergence column. Any later promotion involving this source's governance
      knowledge must treat that agreement as contaminated rather than independent.

