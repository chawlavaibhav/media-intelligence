technology_contingency:
  applicable: true
  applicability_basis: >
    A 1923 book about advertising, read 103 years later. Its apparatus - keyed coupons returned by
    post, traced against mail-order sales - is a measurement technology that no longer exists, and
    its claims about reader behaviour belong to a specific print culture.
  assessed: true
  classes:
    - class: durable_mechanism
      sk_refs: [sk_hop_sa_0008]
      evidence: >
        The salesmanship analogy - that an advertisement should do what a good salesperson does -
        is a claim about persuasion, not about a medium. The extraction records that it is asserted
        rather than demonstrated, which is a separate matter from whether it has dated.
    - class: technology_contingent
      sk_refs: [sk_hop_sa_0001, sk_hop_sa_0006]
      evidence: >
        Both carry historical_claim. The keyed-return apparatus and the mail-order-as-school
        doctrine depend on a postal response mechanism as the source of truth. The underlying
        principle - measure response and promote what wins - survives; the specific apparatus does
        not, and the two are stated together in the source.
    - class: historical_convention
      sk_refs: [sk_hop_sa_0010, sk_hop_sa_0013, sk_hop_sa_0035, sk_hop_sa_0054]
      evidence: >
        All carry culturally_bounded. Claims about what 1923 readers wanted, how they read and
        what they found persuasive.
    - class: uncertain
      sk_refs: [sk_hop_sa_0037, sk_hop_sa_0053]
      evidence: >
        Carry historical_claim; the audit cannot decide from the repository record whether these
        are period-bound or durable.
  existing_characteristics_relied_on: [historical_claim, culturally_bounded]
