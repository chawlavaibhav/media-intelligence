        Several of the twelve intangibles - discipline, appropriateness, ambiguity - are dispositions
        a designer should hold rather than properties an artefact should have. That is a fit with
        how a person works, and there is no consumer for it.
  unbound_knowledge_of_note:
    - sk_refs: [sk_vig_c003_0010, sk_vig_c003_0013]
      observation: >
        Carry historical_claim; statements about the state of design at the time of writing.
  conclusion: >
    Three consumers bound from thirteen objects. A high proportion of this source is disposition
    rather than specification, and the audit makes that visible where a binding count alone would
    read it as a thin source.

lineage:
  authors: [Massimo Vignelli]
  publisher: null
  series: null
  first_published: 2010
  copy_edition: null
  related_sources_in_corpus:
    - source_id: samara_making_breaking_grid_ch1
      relation: no_known_relation
      evidence: >
        Both descend from Swiss modernism and both treat the grid as central, so agreement between
        them looks like a school speaking twice. They share no author, publisher, series or
        derivation, so under the candidate rule this is a genuine independent convergence. Recorded
        because a reviewer might reasonably suspect otherwise, and the record should show the
        question was asked.
  independence_verdict: independent_origin
  independence_basis: >
    No shared authorship, series, publisher or derivation. Shared intellectual tradition is not
    shared origin, and the candidate rule deliberately does not treat it as such - if it did, most
    convergence within any single craft would be unprovable.
  extractor_exposure:
    spec_contains_examples_from_this_source: false
    evidence: Not quoted in SPEC-03, SPEC-04 or SPEC-05.

technology_contingency:
