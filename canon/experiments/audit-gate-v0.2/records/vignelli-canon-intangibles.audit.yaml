representation_integrity:
  delivery_format: native_digital_pdf
  page_addressability: authored_pages
  page_addressability_evidence: >
    PDF spreads 5-17 carry Part One's twelve named sections and render as the designed spreads.
    Colour is present on 9 of 13 spreads, up to 2,166 coloured pixels per 4,800 sampled.
  inspection_state: inspected_page_level
  visual_argument_role: illustrative_only
  observed_loss_patterns:
    - pattern: text_layer_order_damage
      affects: >
        Part One has twelve named sections. Eleven extract cleanly. The twelfth - Syntactics, one
        of the three concepts the book opens by announcing - did not, because it shares its spread
        with the New York City Subway Diagram, whose several hundred words of route legend are
        emitted around and through the Syntactics prose.
      detectability: detected_by_independent_check
      recoverability: recovered_in_this_copy
      evidence: >
        B-19. Every word is present and correct; this is an ordering failure, the mildest member of
        the family that blocked Lupton outright. It was caught by the contents page listing a
        section the extracted body text did not appear to contain, and then by rendering the spread
        and reading it. The full Syntactics argument was recovered.
  claim_resolution_after_inspection: all_resolved
  consequence: >
    A full-page graphic can bury an entire named concept in the text layer, and the cheap safeguard
    is an independent index of what should be present - here the contents page. That check found in
    this source what no amount of reading the body text would have found, and it is the same check
    that later confirmed nothing was buried in Grammar of the Edit and Murch.

evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 13 objects carry practitioner_assertion; none carries empirical_within_source,
    outcome_claimed or controlled_comparison.
  categories:
    - category: source_author_assertion
      sk_refs: []
      evidence: >
        All 13 objects. Vignelli states design values in his own voice as a manifesto. He offers no
        measurement and attributes no claim to another person.
  relation_to_evidence_characteristics: >
    The purest single-origin source in the corpus. Its evidence profile is uniform and the audit
    adds nothing in area B, which is the correct and cheap outcome.

