representation_integrity:
  delivery_format: publisher_epub
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    An EPUB reflows to the reader's screen. Figure filenames encode printed page numbers
    (f0021-01 is a figure from printed page 21) so figures remain citable, but the page as a
    designed object does not exist in the file.
  inspection_state: inspected_no_page_available
  visual_argument_role: source_is_its_own_specimen
  observed_loss_patterns:
    - pattern: no_authored_page
      affects: >
        The book argues for page structure and its own pages are built on a rigorous grid. It says
        so twice, citing its own baselines and its own leading measures, and one caption analyses
        one of its own spreads as a worked example. In an EPUB that evidence is not degraded, it is
        absent.
      detectability: named_by_text
      recoverability: unrecoverable_in_this_copy
      evidence: >
        visual-evidence-ledger.yaml records page_level_inspection_possible: false with 120 figures
        all present at usable resolution. LA-02 states the distinction that matters: this is not a
        digitisation fault a better scan would fix, it is what the publisher's chosen format is. It
        sits upstream of every step we perform and no change to extraction, rendering or validation
        can recover it.
    - pattern: in_figure_text_absent
      affects: >
        On printed p.28 the six worked examples of the book's modular-grid notation - 3x4, 3x6,
        5x8, 5x12, 6x12, 9x14 - exist only as pixels. A text-only pass receives the notation rule
        stated abstractly and not one instance of it, including the fact that its practical range
        runs from very coarse to very fine.
      detectability: silent
      recoverability: recovered_in_this_copy
      evidence: >
        LA-03. Nothing in the extracted text is missing, malformed or out of order, so no integrity
        check catches it; it is detectable only by opening the figures. Six figures were inspected
        and the notation was recovered.
    - pattern: caption_coverage_uneven
      affects: >
        11 of the 120 figure references carry no caption at all. The uncaptioned ones are not a
        random sample - f0034-01 is the positive demonstration of the book's central image rule,
        and the only caption on that page describes the error case instead.
      detectability: detected_by_independent_check
      recoverability: recoverable_not_attempted
      evidence: >
        LA-04, counted mechanically. Two pages earlier, p.24's caption is nearly a complete verbal
        description of its figure, so coverage varies widely inside one book.
  claim_resolution_after_inspection: all_resolved
  consequence: >
    Three different mechanisms in one source, with three different remedies: one permanent, one
    fixed by looking, one still open. Compressing them into a single visual-risk value would lose
    exactly the information a downstream reader needs, which is the central argument for recording
    patterns rather than a score.

evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 79 objects reviewed. No object carries empirical_within_source; one carries
    outcome_claimed. The source argues from demonstrated craft, with 59 objects visually
    demonstrated - the highest in the corpus.
  categories:
    - category: source_author_assertion
      sk_refs: []
      evidence: >
        All 79 objects, 72 carrying practitioner_assertion. Samara asserts in his own voice and
        demonstrates with his own and others' layouts; he reports no study and quotes no named
        authority as the warrant for a claim.
  relation_to_evidence_characteristics: >
    A second negative control for area B. Where the origin question is trivial, the audit costs one
    line and adds nothing - which is the correct behaviour for a mandatory step. The burden falls
    only on sources whose evidence is genuinely mixed.

application_fit:
  audited: true
  findings:
    - consumer: creative_ir
      outcome: binding_exists
      existing_binding_refs:
        [bnd_sam_c003_0001, bnd_sam_c003_0002, bnd_sam_c003_0005, bnd_sam_c003_0006, bnd_sam_c003_0008]
    - consumer: production_ir
      outcome: binding_exists
      existing_binding_refs: [bnd_sam_c003_0009]
      note: parked as a production candidate, target_path null.
    - consumer: evaluation
      outcome: binding_exists
      existing_binding_refs: [bnd_sam_c003_0003, bnd_sam_c003_0004, bnd_sam_c003_0007]
    - consumer: governance
      outcome: binding_exists
      existing_binding_refs: [bnd_sam_c003_0010, bnd_sam_c003_0011]
    - consumer: benchmark
      outcome: binding_exists
      existing_binding_refs: [bnd_sam_c003_0012]
    - consumer: deterministic_composition
      outcome: candidate_no_binding_made
      note: >
        This is the finding that made the consumer worth naming. LA-08 recorded that the most
        exactly executable knowledge in the book is the least bindable: nine of fourteen remedies
        are geometric operations a layout engine could perform exactly - add a column, hang a
        character, set a measure - and none of them is a generative control. SPEC-04 has no target
        type for a deterministic executor, so under the current schema they can only be recorded as
        unbound. The audit records the fit; it does not create the binding.
    - consumer: human_workflow
      outcome: no_current_binding
  unbound_knowledge_of_note:
    - sk_refs: [sk_sam_c003_0002, sk_sam_c003_0009]
      observation: >
        Culturally bounded claims about Western reading order and about the grid's Swiss-modernist
        lineage. Useful context, no current consumer, and no reason to force one.
  conclusion: >
    The only source in the corpus whose audit produced a candidate fit with no available binding
    target. That is information about SPEC-04's coverage, not about the book.

