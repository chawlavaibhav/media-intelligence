# CANON-012 — Creative IR instance CIR-PILOT-001-AIGHT-V1
#
# The project's first real Creative IR: WHAT should exist for the Aight festive promo — objective,
# audience, message, hierarchy, constraints and acceptance contract. Model-independent by
# construction: nothing here names a model, provider, workflow or production route.
#
# Governing spec: canon/knowledge/SPEC-01-creative-ir.md (v0.1, locked).
# Upstream object: canon/experiments/pilot-001/aight-normalized-request.yaml (NR-PILOT-001-AIGHT-V1).
#
# CANON-012 boundary: NO Canon knowledge was retrieved or applied. Every canon_refs list is
# deliberately empty, so this instance is a fair "base architecture" arm for later experiments.
# Creative decisions below are ordinary reasoning from the brief only, each labelled decide with a
# rationale.
#
# Confidence fields: SPEC-01 asks for numeric confidence (0.0–1.0) on derived / system_decided
# values, but PROJECT-CONTRACT separation 8 forbids invented decimal confidence and no calibration
# procedure exists. This instance records confidence: not_assigned throughout — friction F5 in the
# Controller Brief.
#
# Fixture values (12 s, 9:16) come from the CANON-012 task file, not the customer. SPEC-01's
# provenance vocabulary (user | derived | system_decided | brand_policy | customer_memory | default)
# cannot express this either; they are marked system_decided with fixture: true — friction F1.

