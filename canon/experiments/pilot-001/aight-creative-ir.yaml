# ── acceptance contract ──────────────────────────────────────────────────────────────────────────
# Two classes, kept apart as CANON-012 requires:
#   hard_requirements    — customer-stated or fixture; objectively checkable in principle
#   subjective_criteria  — customer-stated intent whose verification is human judgment
# The contract states WHAT must be observed, never how; instrument selection is Production IR's.
acceptance_contract:

  hard_requirements:
    - id: AC-01
      requirement: the string "Image ₹9" appears in the deliverable and matches exactly, glyph for glyph, including "₹"
      derived_from: brand.mandatories.T1 (user, exactness exact)
      class: customer_hard
      verification: { required: true, mode: hybrid }
      verification_note: >
        Two text standards exist in this project and any result must name its standard: no
        strict-exactness machine certifier exists (five configurations tested, all disqualified);
        Cloud Vision OCR is benchmark-qualified with a known, nonzero error rate — usable as an
        instrument, never as an exactness guarantee. Hence hybrid, not machine.
    - id: AC-02
      requirement: the string "Video ₹99" appears in the deliverable and matches exactly, glyph for glyph, including "₹"
      derived_from: brand.mandatories.T2 (user, exactness exact)
      class: customer_hard
      verification: { required: true, mode: hybrid }
      verification_note: same as AC-01.
    - id: AC-03
      requirement: wherever the aight wordmark appears, it matches the official wordmark master exactly
      derived_from: brand.logo.exactness (user, hard, conditional)
      class: customer_hard_conditional
      verification: { required: true, mode: unresolved }
      status: blocked
      blocked_reason: >
        The official wordmark master does not exist in this repository and was not supplied; there
        is no ground truth to verify against. Blocked is a recorded state, not a waiver.
    - id: AC-04
      requirement: deliverable duration is 12 seconds
      derived_from: delivery.duration (experiment-supplied fixture — NOT customer intent)
      class: fixture
      verification: { required: true, mode: machine }
    - id: AC-05
      requirement: deliverable aspect ratio is 9:16
      derived_from: delivery.aspect_ratios (experiment-supplied fixture — NOT customer intent)
      class: fixture
      verification: { required: true, mode: machine }
    - id: AC-06
      requirement: the deliverable is a video
      derived_from: NR R05 modality (customer_stated)
      class: customer_hard
      verification: { required: true, mode: machine }

  subjective_criteria:
    - id: AC-07
      criterion: the work reads as modern and premium
      derived_from: intent.success_criteria (user)
      verification: { required: true, mode: human }
    - id: AC-08
      criterion: the work reads as belonging to an Indian festive context
      derived_from: intent.success_criteria (user)
      verification: { required: true, mode: human }
      note: generic festive is sufficient — no specific festival was stated (AMB-01).
    - id: AC-09
      criterion: the treatment is not gaudy — restraint holds under the festive styling
      derived_from: brand.prohibitions (user)
      verification: { required: true, mode: human }
    - id: AC-10
      criterion: >
        a viewer takes away that aight is an outcome API — you ask, you receive finished media at
        a fixed small price
      derived_from: intent.objective / message.proposition (user positioning statement)
      verification: { required: true, mode: human }
    - note: >
        Per the pilot gate (CONTROL-STATE.md), human review must be blinded and these criteria
        frozen before any generation. No numeric threshold is defined here — thresholds are Eval's.

# ── readiness ────────────────────────────────────────────────────────────────────────────────────
readiness:
  information_coverage: not_computed
  specification_readiness: not_computed
  not_computed_reason: >
    SPEC-01 deliberately left the scoring formula unfrozen ("weights come from real examples, not
    from us guessing now"), and PROJECT-CONTRACT separation 8 forbids invented decimal confidence.
    Publishing a number here would be exactly that — friction F5.
  qualitative_summary:
    blocking_unknowns:
      - the official aight wordmark master (blocks AC-03 and any on-screen wordmark; PILOT gate condition 1)
    non_blocking_open_questions:
      - AMB-01 festival specificity (safe generic default chosen)
      - AMB-04 audience (soft system decision recorded)
      - AMB-05 audio treatment (no-dialogue decided; music left free)
      - AMB-06 whether getaight.ai appears / any CTA
      - AMB-07 placement and prominence of the price claims
