- qa_id: qa_lsmx_0028
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'What Is a "Normal" Exposure for Metal?'
  question: 'A brightly lit metal spatula sits on white paper. A grey-card reading gives a good exposure
    for the paper and ruins the metal; exposing for the metal renders the paper dark grey. What does the
    book say to do, and what does it say NOT to do?

    '
  answer: 'It says there is no normal exposure that works for both, and that if the metal and the white
    paper are both important the scene has to be relit. What not to do is look for an exposure compromise:
    the general rule of placing the middle greys accurately and letting the extremes fall where they may
    fails whenever the important subject is much brighter than an 18% grey card, because a near-pure direct
    reflection records at about the brightness of the source rather than at a reflectance of the illuminated
    scene. When the metal alone matters, the method is a spot reading on the metal opened two to three
    stops beyond the indicated value — the meter would place it at 18% grey and it should be brighter,
    and how much brighter is a creative decision. The relight the authors have in mind is their "elegant
    compromise": light filling the family of angles to make the metal bright, plus light from other angles
    producing diffuse reflection from the background.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 6, ''What Is a "Normal" Exposure for Metal?'' and ''The Elegant Compromise''. The advertisement
    needing legible black type on the paper is the source''s own example of the conflict.

    '
  confounders:
  - splitting the difference in exposure, which the source says cannot work
  - using an incident or grey-card reading, which the source says is fine only when the metal is DARK
  - treating the two-to-three-stop figure as a technical constant rather than a creative range
  requires_application_canon013: false
