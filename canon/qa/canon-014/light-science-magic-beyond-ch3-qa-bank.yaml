- qa_id: qa_lsmx_0027
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 5 'Revealing Shape and Contour', section 'How Much Tonal Variation is Ideal?'
  question: 'Why does the book say a simple cube can be lit with a black shadow and a white highlight
    while a product package usually cannot, and what does it refuse to give you?

    '
  answer: 'Because of where the detail is. A simple cube with no important detail on any of its sides
    can take the full range — the shadow can go black and the highlight white. A package that has to sell
    a product may have important detail on all three visible sides, and detail in either extreme would
    be lost, so the highlight must be only slightly brighter and the shadow only slightly darker than
    the third side. The depth clue is deliberately weakened in exchange for legibility. What the authors
    refuse to give is a number: they say they never specify lighting ratios in the book because the decision
    has to be based on the specific subject as well as personal taste. Their stated ideal — a highlight
    side, a shadow side and a side between — is offered as a standard for evaluating whatever lighting
    exists, not as a requirement good lighting must meet.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 5, ''How Much Tonal Variation is Ideal?'', which states both the refusal and the package
    case in the same short section.

    '
  confounders:
  - supplying a ratio anyway; the source's position is that it will not
  - treating the highlight/shadow/mid ideal as a rule rather than as an evaluation standard
  - assuming the package needs MORE contrast to look three-dimensional, which inverts the advice
  requires_application_canon013: false
