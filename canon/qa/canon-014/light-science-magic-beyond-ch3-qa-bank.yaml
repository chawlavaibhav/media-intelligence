- qa_id: qa_lsmx_0030
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'Dulling Spray'; Ch. 5, section 'Use Dulling Spray'
  question: 'Dulling spray is the last rung of two separate remedy ladders in this book. What does it
    physically do, what does it cost, and how do the authors'' warning and their own practice compare?

    '
  answer: 'It creates a matte surface that increases diffuse reflection and decreases direct reflection,
    which buys a little freedom to light without strictly obeying the limits of the family of angles.
    The costs are stated plainly. Metal with dulling spray on it no longer looks brightly polished and
    may not even look like metal. On a glossy box it can reduce the sharpness of the very detail it was
    applied to preserve, and if that detail is fine type the loss of sharpness may be worse than the loss
    of contrast it was curing. And the chemistry may not agree with the subject, so a small and hopefully
    insignificant area must be tested first. The authors add that heavy-handed use reveals rather than
    conceals an inability to light metal well — and immediately admit that all three of them keep dulling
    spray handy in their studios. Their prescription is to light as well as possible first and then add
    a little, only to an overly bright highlight or a disappearing edge, keeping as much gleam as possible.

    '
  answer_type: tradeoff
  difficulty: easy
  knowledge_type: production_reasoning
  requires_application: false
  support: 'Ch. 6, ''Dulling Spray'', and the parallel treatment at the end of the glossy-box ladder in
    ch. 5.

    '
  confounders:
  - treating it as a general anti-glare tool rather than a last resort
  - missing that it changes what the material looks like it IS, not only how bright it is
  - reading the authors' warning as a prohibition; they concede they use it
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0031
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', sections 'Using a Translucent White Background' and 'Using a Mirror
    Background'
  question: 'Compare a translucent white background and a mirror background for a white-on-white subject,
    on the two things the book says each costs or gives.

    '
  answer: 'A translucent background lit from behind decouples subject and background entirely — with a
    reasonably opaque subject the background can be taken to any brightness without affecting the subject
    — and it costs the ground shadow, because light from beneath erases any hint of one. The authors then
    turn that cost into an advantage: because the shadow is now independent of the subject''s lighting,
    it can be manufactured by tracing a pleasing test-light shadow onto paper, cutting it out and gluing
    the cut-out under the panel. A mirror is the easiest white background of all, because it reflects
    almost nothing but direct reflection and those reflections are much brighter than any diffuse white;
    a light large enough to fill the whole background''s family of angles usually produces shadows soft
    enough that no fill is needed, and it is one of the few arrangements where the background reflects
    fill light under the subject. Its costs are that the light must show no texture, since it will be
    sharply reflected, that the subject''s own reflection may be confusing depending on crop and shape,
    and that no ground shadow is obtainable at all.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 9, ''Using a Translucent White Background'' and ''Using a Mirror Background'', with the
    flower photographed on each.

    '
  confounders:
  - assuming the mirror produces a shadow the way any table would
  - treating both as simply 'brighter backgrounds' rather than as different reflection mechanisms
  - forgetting the mirror's requirement that the source itself be featureless
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0032
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', section 'Minimizing the Horizon'
  question: 'Why does the book say the table under a piece of glassware is an optical problem and not
    just a compositional one, and what does it rank as the options?

    '
  answer: 'Because an opaque table blocks light that is essential for edge definition — light that has
    to reach the lower edges of the subject from below and behind — which a transparent one passes as
    if the table did not exist. The usual compositional cures fight the requirement that the background
    barely fill the image area, so a bigger table or a taller sweep is not available. The options, in
    order of how completely they remove the horizon: a transparent glass or acrylic table, which the authors
    say resembles a nonexistent table more closely than anything else; a mirror, whose reflected background
    softens the tonal step and which can light glass surfaces almost as well as a transparent table, at
    the cost of a visible but less obtrusive horizon; and, where the horizon must go entirely, a paper
    strip taped to a large diffusion panel and cut to fit the field of view exactly, which they say costs
    no lighting quality. For either transparent surface they add a variation: mist it with water to disrupt
    and camouflage the subject''s reflection.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 7, ''Minimizing the Horizon'', including the explicit statement that an opaque table blocks
    light essential for edge definition.

    '
  confounders:
  - treating the horizon purely as a composition problem to be cropped or swept away
  - using white or silver reflectors on a dark table, which the source says is less effective because
    one light serves both
  - assuming a mirror removes the horizon; the source says it reduces it
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0033
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', sections 'Metal Boxes' and 'A Light Background'
  question: 'A brief calls for a metal tin standing on a dark surface, shot so all three of its faces
    show. The tin''s front face keeps going black and its bottom edge dissolves into the table. Using
    this book''s reasoning, what is happening and what is its easiest answer?

    '
  answer: 'Each visible face of the tin has its own family of angles, and they face different directions.
    The family defined by the FRONT face falls on the table where the tin stands, so the table is the
    light source for that face whether or not the photographer wants it to be — and a dark table is a
    source that emits almost nothing, so the front face has nothing to reflect and records black. The
    bottom edge dissolves for the related reason: a near-pure direct reflector records at about the brightness
    of what it reflects, and where the tin''s lower face and the surface it stands on reach the same brightness
    there is no tonal boundary left for the camera to record. No reflector card fixes this without appearing
    in the frame, because the family it must occupy is inside the picture; the authors say brightly polished
    metal boxes almost always exhibit the problem. Their easiest answer is a light-toned background: the
    background itself becomes the light source for much of the visible metal, and much of the work is
    done as soon as the tin is placed on it. The one requirement they stress is that the background must
    be large enough to fill the family of angles the metal reflects, not merely the area the camera sees.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 6, ''Metal Boxes'' for the three-families problem and the table-as-source consequence;
    ''A Light Background'' for the remedy and the fill-the-family-not-the-frame requirement; ''Other Resources''
    for the disappearing-edge mechanism. Shown in the pair of gift-box photographs on dark and light grounds.

    '
  confounders:
  - adding a front fill light, which either fails to enter the family or appears in the shot
  - raising the exposure, which cannot help a surface with no diffuse channel
  - sizing the background to the frame rather than to the family of angles
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0034
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', sections 'Keeping True Color' and 'Liquid
    as a Lens'
  question: 'A client wants a chilled amber lager against a textured slate-blue backdrop. The first frames
    show a dark, murky brown drink. Diagnose it in the book''s terms and describe the fix it prescribes,
    step by step.

    '
  answer: 'The diagnosis is the book''s stated rule that a liquid in a transparent container always takes
    on some of the colour and texture of its background: the mottled mid-toned backdrop is showing through
    the beer, and the drink is reading dark and unappealing as a result. The fix is a secondary background
    — a white or silver card sitting immediately behind the glass, lit separately, shaped so it fills
    as much of the area behind the liquid as possible without extending far enough to be visible past
    the edges of the glass. The authors build it in five steps: place the card behind the subject on a
    flexible wire taped to the table, not yet fixed; remove the camera and put a test light in its place,
    so the subject casts its shadow on the card; outline that shadow, take the card away and cut it out;
    reposition the cut-out, restore the camera, and check through the lens that no edge of the card is
    visible; then add a light that illuminates only the cut-out. They note that some photographers prefer
    a foil coloured like the liquid — gold for beer — rather than white or silver.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 7, ''Keeping True Color'', including the five numbered steps and the before-and-after
    beer photographs. The two-sided size constraint is what makes the tracing step necessary.

    '
  confounders:
  - changing the backdrop, which the client has specified
  - colour-grading the beer afterwards, which the source does not offer here and which would not restore
    the transmitted texture
  - using a card larger than the glass, which the source's constraint explicitly forbids
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0035
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', section 'Secondary Opaque Subjects'
  question: 'A labelled glass bottle has to look premium and its label has to be legible. The lighting
    that gives the bottle its describing highlight puts a sheen across the paper. Work through the book''s
    options and say which it rules out and why.

    '
  answer: 'The conflict is real and the book states it: most of a paper''s reflection is diffuse but some
    is direct, so the light producing the direct reflection on the glass is also likely to obscure the
    label. Two remedies work. Move the offending light higher, so the label''s direct reflection goes
    downward instead of toward the lens. Or, where good highlight placement forbids moving the light,
    interpose a small opaque card blocking exactly the angles that produce direct reflection on the label
    — and its size is critical: a gobo extending beyond the label''s own family of angles will itself
    reflect in the glass. A polarizing filter is the third option and the book rules it out in most cases:
    much of the desirable highlight on the glass is usually polarized already, so a polarizer that eliminates
    the label''s reflection is also likely to interfere with the light the glass needs. Underneath all
    three sits the prior question the authors insist comes first — which of the two is the principal subject
    — and they say that cannot be settled on a technical basis at all.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 7, ''Secondary Opaque Subjects'' for the three options and the gobo size constraint; ''Recognizing
    the Principal Subject'' for the prior decision.

    '
  confounders:
  - reaching for the polarizer first, which is the intuitive move and the one the source blocks here
  - oversizing the gobo, which converts a label fix into a black reflection in the glass
  - treating this as a legibility defect rather than as a scene lit for the wrong principal subject
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0036
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', sections 'Keeping the Metal Bright', 'Keeping the Metal Dark' and 'The
    Elegant Compromise'
  question: 'You are handed a brushed-steel flask and told it should read as a light mid-grey, sitting
    on a background that reads near-white, in one frame. Using only what this book gives you, how do you
    get both?

    '
  answer: 'Treat the two surfaces as reading different parts of the same source. The flask, being close
    to a pure direct reflector, responds only to whatever lies inside its family of angles; the background
    responds to the whole source through diffuse reflection. So one large soft source can serve both:
    the portion of it covering the family sets the flask''s tone, and the whole of it sets the background''s.
    Having more of the source inside the family makes the metal brighter; a source large enough that little
    of it falls inside makes the background brighter instead. Then use distance as the second control,
    since the background follows the inverse square law and the metal''s direct reflection does not —
    moving the light closer lifts the background toward white while the flask holds its tone exactly.
    The book''s phrase for this is the elegant compromise, and the claim worth taking from it is that
    the metal''s tone is placeable at any step between black and white independently of the rest of the
    scene. The bound to watch is the lens: from a close viewpoint the family is wide and the source may
    only just fill it, in which case the light cannot be moved without the flask''s edges going black.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 6, ''The Elegant Compromise'' for the single-soft-box arrangement, ''Controlling the Effective
    Size of the Light'' for both the distance control and the lens bound. The matched spatula frames show
    the tonal independence directly.

    '
  confounders:
  - using two lights and balancing their power, which works but misses that one large source already gives
    the control
  - expecting the metal to brighten when the light comes closer
  - ignoring the lens constraint, which is what makes the control fail from a close viewpoint
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0037
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', section 'The Best of Both Worlds'
  question: 'A photographer puts a set of glassware inside a white tent to get rid of the studio reflections,
    and the glass loses its outline entirely. Explain the failure using the book''s own account, and say
    what it prescribes for a frame that genuinely needs both fields.

    '
  answer: 'The tent removed the extraneous reflections and removed the edges with them. The part of the
    tent the camera saw became a light background, while the rest of the tent lit the glass — which is
    the light-on-light combination, and the one arrangement that cannot define an edge, because edge definition
    requires a tonal difference between the edge and the ground immediately behind it. The book attributes
    most failures in photographing glass to using bright field and dark field simultaneously, deliberately
    or naively, and it names this specific case. Where a picture genuinely needs both, the prescription
    is not to blend them but to keep them separate: divide the scene mentally, assign one region to bright
    field and the other to dark field. Wherever the two remain distinct the glass is well defined; only
    the transition area mixes them, and there can be a noticeable loss there, so the transition should
    be kept small. Note also that the tent is the remedy the same book recommends for round metal — right
    subject, wrong subject.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 7, ''The Best of Both Worlds'', which reports the tent failure and gives the divide-the-scene
    prescription; Ch. 6, ''Using a Tent'', for the contrasting recommendation.

    '
  confounders:
  - adding a light to 'bring back' the edges, which is the light-on-light problem again
  - assuming the tent was too bright or too dim; the failure is structural, not a level
  - carrying a metal solution to glass because both are direct reflectors
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0038
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 4 'Surface Appearances', sections 'The Angle of Light' and 'The Success and Failure
    of the General Rule'
  question: 'A photographer copies a small painting with lights at 45 degrees and gets a clean result;
    the same 45-degree set-up on a large canvas in a narrow gallery produces a hot spot. Nothing about
    the angle changed. What did?

    '
  answer: 'Two distances. The book''s correction to the 45-degree copy rule is that an angle stated to
    the CENTRE of a subject does not fix the angles to its edges, and that whether a light falls inside
    the family of angles depends on both the light-to-subject distance and the camera-to-subject distance.
    Two lights both at 45 degrees to the centre of the same subject can differ: the nearer one is inside
    the family and puts a hot spot on the surface, the farther one is outside it and lights the surface
    cleanly. Separately, working close to a large canvas with a wide lens enlarges the family of angles
    substantially and shrinks the range of acceptable lighting angles, so the light has to go much farther
    to the side than it did before. The authors add why the rule usually survives in practice anyway:
    photographers tend to move lights back for an unrelated reason, to get even illumination, and that
    incidentally takes them outside the family.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: lighting
  requires_application: true
  support: 'Ch. 4, ''The Angle of Light'' for the wide-lens case and ''The Success and Failure of the
    General Rule'' for the two-lights-at-45-degrees comparison.

    '
  confounders:
  - assuming the angle rule is simply wrong; the source says it usually works and explains why
  - blaming the lens rather than the viewpoint the lens permitted
  - moving the light closer to even out the illumination, which is exactly the move that puts it in the
    family
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0039
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', section 'Subject and Background' (both halves)
  question: 'A packshot of a white ceramic diffuser on white shows clean separation and good detail, and
    the art director says it reads as "product on grey" rather than white-on-white. Nothing is technically
    wrong. What does this book say has happened, and what is the fix?

    '
  answer: 'The lighting has put the extreme on the wrong element. Technically it does not matter which
    of the subject and background is the slightly darker — either way the tonal distinction is preserved
    and the shape is legible. Psychologically it matters a great deal: the brain is less willing to accept
    a grey background than a white one, so a scene lit to render the background white and the subject
    light grey reads as white-on-white, while the same scene relit so the subject is white and the background
    light grey reads as white-on-gray. The authors demonstrate exactly this with two frames of the same
    bust and say the second is not a bad picture, only not a white-on-white one. The fix is to relight
    so the BACKGROUND carries the extreme and the subject sits just inside it — for their examples, between
    half a stop and one stop darker at its edges. The same asymmetry holds in reverse at the dark end:
    a dark-grey subject on a black ground reads as black-on-black, a black subject on a dark-grey ground
    does not.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 9, ''Subject and Background'' in the white-on-white half, with the two bust frames, and
    the parallel passage in the black-on-black half with the crow.

    '
  confounders:
  - brightening everything, which loses the separation the frame currently has
  - treating it as a colour-temperature or white-balance issue
  - assuming the subject should be the whitest thing in a white-on-white picture
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0040
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', sections 'Using an Opaque Black Background' and 'Using a Glossy
    Black Surface'
  question: 'A matte black cosmetics compact has to be photographed on black, keeping detail in the product
    and a truly black ground. Black seamless paper is on hand. Walk through what this book says will happen
    and what to do.

    '
  answer: 'Black paper is one of the worst common choices, and the authors discuss it first only because
    it is usually the one available. The paper directly under the subject receives as much illumination
    as the subject, and since the compact has to be rendered dark grey rather than black to hold detail,
    the paper under it cannot be black either. A spotlight would keep the background darker but is ruled
    out, because producing direct reflection on the subject — which is how a black subject is rendered
    at all — requires a large source. Two things follow. First, replace the paper with a material producing
    less diffuse reflection than the subject: black velvet, at the same exposure, records far darker than
    the paper. Second, light the compact as if it were metal — find the family of angles and fill it.
    Velvet has two stated limits: a few subjects are so black that even velvet is not blacker, and the
    subject''s edges may merge with its own shadow. For those edges the book offers glossy black acrylic
    and invisible light, at the cost that the overhead source then fills the acrylic''s own family and
    the ground stops being black; the clean alternative is distance, putting the subject far enough from
    the background that lighting one does not touch the other.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 9, ''Lighting Black-on-Black Scenes'' through ''Keeping the Subject Away from the Background'',
    with the paper-versus-velvet pair at identical exposure.

    '
  confounders:
  - underexposing to darken the ground, which takes the subject's detail with it
  - using a spot or snoot to hold the background down, which the source rules out because the subject
    needs a large source
  - reaching for the glass support and polarizer that worked for metal, which the source withdraws for
    black subjects
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0041
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'A Transparent Background'; Ch. 9 'The Extremes', section 'Keeping
    the Subject Away from the Background'
  question: 'The transparent-glass support with a lens polarizer works beautifully under a metal box.
    A photographer tries it under a black lacquered box and the subject goes dead. Why, and what does
    that tell you about when the trick is available?

    '
  answer: 'The trick depends on the two surfaces polarizing DIFFERENTLY. Under metal it works because
    most of the direct reflection from the glass at that angle is polarized while direct reflection from
    metal is never polarized unless the light source itself is polarized — so the filter extinguishes
    the support''s reflection and passes the subject''s. A black lacquered box is an insulator, and much
    of a black subject''s direct reflection is likely to be polarized too, so the filter cannot discriminate:
    whatever orientation clears the table also darkens the subject, and since the subject is being rendered
    by direct reflection in the first place, killing it kills the subject. The general rule the case teaches
    is that a polarizer discriminates between two surfaces only where those surfaces differ in polarization
    — so the availability of the trick is a question about the two MATERIALS, not about the geometry.
    The book withdraws it explicitly in the extremes chapter, which is the same authors qualifying their
    own earlier prescription rather than a disagreement between sources.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 6, ''A Transparent Background'', for the working case; Ch. 9, ''Keeping the Subject Away
    from the Background'', for the explicit withdrawal. The conductor-versus-insulator guideline is chapter-3
    material and already live Canon.

    '
  confounders:
  - rotating the polarizer harder, as if the failure were a matter of angle
  - concluding polarizers do not work on dark subjects at all, which over-generalises
  - reading the withdrawal as an inconsistency in the book
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0042
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', section 'Stopping Flare'; Ch. 9, section
    'In Any Case, Keep the Background Small'
  question: 'A set of dark-field glass frames comes back looking flat and slightly milky, with no visible
    streak or fogged corner anywhere. Is flare a plausible cause on this book''s account, and what would
    you do?

    '
  answer: 'Yes, and the absence of visible streaking is not evidence against it. The book calls the basic
    dark-field arrangement probably the worst flare-producing arrangement one could encounter, because
    the very thing that makes it work — a large source surrounding a small dark background — puts non-imaging
    light just outside the field of view on all four sides at once. It states that even where the flare
    is not bad enough to produce visible fogging or streaking, the general degradation from all sides
    accumulates, and at best produces a picture with low contrast. The same invisible-uniform failure
    is named again in the extremes chapter for large white backgrounds. The remedy is a gobo that blocks
    non-imaging light from all four sides of the field of view — four cardboard blades, or a single board
    with a rectangular hole, clamped to a stand in front of the camera — positioned by the book''s own
    trick of looking into the front of the lens and moving the card until the offending source is no longer
    reflected there, then pulling back slightly.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'Ch. 7, ''Stopping Flare''; the gobo-positioning trick is from the ch. 5 sidebar ''Managing
    Flare''; the parallel white-background case is in ch. 9.

    '
  confounders:
  - ruling out flare because nothing is visibly streaked, which is the specific error the source warns
    against
  - raising contrast in post, which treats the symptom
  - gobo-ing only the top, which is standard practice and inadequate here
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0043
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', sections 'Light the Subject from Above' and 'Use a Gobo Above
    the Subject'
  question: 'A white-on-white packshot lit from above has good separation at the sides of the subject
    and has lost the top of it entirely into the background. What does the book prescribe, and how is
    the prescription tuned?

    '
  answer: 'Lighting from above puts the front of the subject slightly in shadow and fully illuminates
    the tabletop, which is what gives the good side separation — and it also fully illuminates the top
    of the subject, which is why the top has gone. The prescription is a gobo above the subject, casting
    just enough shadow on its top to bring that area down to a brightness similar to the front. The authors
    say this step is almost always necessary. It is tuned by two coupled controls: the closer the gobo
    is to the subject the harder its shadow becomes, and the farther away the softer but also the lighter.
    So start with a gobo about the size of the offending highlight, hold it in your hand while experimenting,
    and move it until the edge of its shadow blends with the edge of the highlight you are concealing.
    If the shadow blends but is too dark, cut the gobo smaller; if it becomes too light as you move away,
    use a larger one. They recommend a medium-sized main light from the start precisely to keep this adjustment
    available — too small and the gobo''s shadow cannot be made soft enough, too large and it cannot be
    made hard enough to shade effectively.

    '
  answer_type: repair
  difficulty: medium
