- qa_id: qa_lsmx_0001
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 4 'Surface Appearances', section 'Complex Surfaces'
  question: 'The book coins the term "complex surface". What does it mean by it, and what makes such a
    surface require a divided treatment rather than simply more light?

    '
  answer: 'A complex surface is the authors'' term for a single surface that requires both diffuse and
    direct reflection to be defined properly. Their example is glossy wood: only direct reflection can
    tell the viewer the wood is glossy, and only diffuse reflection can reveal the colour and grain beneath
    the gloss. The treatment must be divided because the two cannot occupy the same area of the surface
    — a region showing the direct reflection of the source is showing the source, not the wood. So they
    lit a polished wooden box with a source large enough to fill the entire family of angles and then
    blocked part of it with a gobo, so one part of the lid carries the gloss and the other shows the colour
    and grain. They note that the diffusely lit region is the only place the wood''s true colour is clearly
    apparent.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 4, ''Complex Surfaces'': the definition is given verbatim, and the gobo arrangement and
    its result are described and shown in the wooden-box figures.

    '
  confounders:
  - reading 'complex' as meaning geometrically complicated or many-faceted, rather than needing two reflection
    types
  - assuming the answer is a larger or softer light, when the source's answer is a large light partly
    blocked
  - confusing it with a mixed-material scene, where two different objects need different treatment; this
    is one surface
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_lsmx_0002
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', sections 'Bright-field Lighting' and 'Dark-field
    Lighting'
  question: 'Define bright-field and dark-field lighting as this book defines them, in terms of the family
    of angles rather than in terms of the resulting picture.

    '
  answer: 'Both are defined by what occupies the two extreme limits of the family of angles that acts
    on a glass edge — the points the book labels L. Bright-field lighting requires that there be NO light
    at those limits, so the edge stays dark, and the glass must therefore be shown against a bright background;
    the authors also call it the dark-on-light approach. Dark-field lighting requires that light come
    from those limits and from nowhere else, so the edge is bright, and the glass must be shown against
    a dark background; the light-on-dark approach. The two are the same geometric fact read in opposite
    directions, which is why the authors call them two attractive opposites.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 7, ''Two Attractive Opposites'' onward. The L-limits framing is the source''s own; the
    two step sequences give the practical form.

    '
  confounders:
  - defining them only by the resulting picture — dark glass on white, light glass on black — which misses
    that both are statements about where light may be
  - assuming dark-field means less light overall; it uses one very large source
  - supposing the whole family of angles matters, when the source says only its extreme limits do
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_lsmx_0003
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'A Glossy Background'
  question: 'What does this book mean by "invisible light", and what makes the light invisible?

    '
  answer: 'Invisible light is the authors'' name for lighting a subject by bouncing light off a glossy
    surface that sits inside the subject''s family of angles while its own family of angles excludes the
    camera. Their worked case is a metal box on glossy black acrylic: the family of angles for the box''s
    front face falls on the acrylic, so the acrylic is the only possible source for that face, and although
    the acrylic is too black to reflect diffusely it is glossy enough to reflect directly. A light placed
    under the camera bounces off the acrylic into the metal, which reflects it onward to the camera. The
    light is invisible because the camera lies outside the acrylic''s own family of angles, so it cannot
    see the acrylic doing the lighting. The source for the box is in the scene and cannot be seen to be
    one.

    '
  answer_type: concept_understanding
  difficulty: hard
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 6, ''A Glossy Background'', where the term is introduced and the geometry stated. The
    result is shown in the accompanying photograph of the box on black acrylic.

    '
  confounders:
  - thinking the light is hidden behind something; it is fully in the frame and simply outside the camera's
    view of the reflecting surface
  - confusing it with the transparent-glass support, where light passes through rather than bouncing off
  - assuming a black surface cannot light anything, which is the intuition the source sets up in order
    to break
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_lsmx_0004
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 5 'Revealing Shape and Contour', section 'Adding Depth to the Background'
  question: 'What does the book mean by "falloff", where does it recommend putting it, and what is it
    for?

    '
  answer: 'As the authors use the term, falloff means a transition in the scene from light to dark — deliberate
    uneven illumination of the background. It can occur in any area of the picture, and they say photographers
    most commonly place it at the top, both because it looks good there and because that is the easiest
    place to put it without interfering with the lighting of the primary subject. Its purpose is depth:
    a difference in tonal value between the foreground and background is another visual clue suggesting
    depth, and it separates the subject from the background. They produced it simply by aiming the light
    more toward the camera so less of it fell on the seamless paper at the back of the set, and they add
    a gobo over the lens because aiming the light that way risks serious camera flare.

    '
  answer_type: concept_understanding
  difficulty: easy
  knowledge_type: lighting
  requires_application: false
  support: 'Ch. 5, ''Adding Depth to the Background'', where the term is defined and the method given.

    '
  confounders:
  - confusing this with light falloff in the inverse-square sense, a property of the source rather than
    a compositional choice
  - assuming it needs a second light; the source produced it by re-aiming the existing one
  - forgetting the flare consequence, which is why the source pairs it with a gobo
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_lsmx_0005
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'Black Magic'
  question: '"Black magic" in this book is not a figure of speech. What is it, and how is its hardness
    controlled?

    '
  answer: 'Black magic is anything added to a lighting set-up solely to place a black reflection in a
    metal surface. Its uses are practical: a black reflection in an edge helps differentiate that edge
    from the background, and reflected across the centre of a slightly irregular surface it adds dimension.
    It usually means a gobo, and its hardness is set by which side of the diffusion sheet the gobo sits
    on. Between the diffusion sheet and the subject, it makes a hard black reflection. Behind the sheet,
    away from the subject, it makes a softly graduated one, and the farther back it goes the softer it
    becomes. Where the source is an opaque reflector rather than a diffusion sheet a gobo cannot graduate,
    and the authors substitute a soft-edged stripe of black spray paint across the reflector.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 6, ''Black Magic'', in the ''Other Resources'' group, which gives the purpose, the gobo
    placement rule and the painted-stripe alternative.

    '
  confounders:
  - assuming black magic means removing light, when its purpose is to place a specific dark shape
  - reversing the gobo rule — near the subject is hard, not soft
  - confusing it with a black card used as negative fill on a diffuse subject, which works by subtraction
    rather than by reflection
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_lsmx_0006
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', section 'Subject and Background' (white-on-white half)
  question: 'The book gives a rare numeric window for the separation between a white subject and a white
    background. What is it, and what fails on each side of it?

    '
  answer: 'For its own remaining white-on-white examples the book keeps the background between half a
    stop and one stop brighter than the greys at the edges of the primary subject. Below half a stop,
    part of the subject may disappear against the background. Above one stop, flare may scatter enough
    light inside the camera to cost contrast in the subject. The window is stated for the source''s examples
    rather than as a universal, so it is a reference point rather than a threshold, and it sits inside
    a larger claim: technically it does not matter whether subject or background is the darker, but psychologically
    it matters a great deal, because the viewer only accepts the scene as white-on-white if the BACKGROUND
    is the white one.

    '
  answer_type: factual_recall
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 9, ''Subject and Background'' in the white-on-white half: the window and both failure
    modes are stated in one paragraph, immediately after the white-on-white versus white-on-gray comparison.

    '
  confounders:
  - reading it as a lighting ratio for the subject rather than a subject-to-background difference; the
    book explicitly refuses to publish lighting ratios
  - assuming more separation is always safer, when the upper bound is a real flare limit
  - measuring against the subject's overall tone rather than the greys at its edges
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: factual
- qa_id: qa_lsmx_0007
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', section 'Set Up a Large Light Source'
  question: 'Dark-field lighting appears in the plan diagram to need light at only two points. Why is
    that wrong, and what does the book substitute?

    '
  answer: 'The two-point appearance is what the authors call a representational defect caused by drawing
    in two dimensions. In three dimensions the same reasoning demands more: a source above and behind
    to keep the rim bright, and on a stemmed glass yet another to illuminate the underside of the bowl.
    That is four large sources for one small glass, which they call unwieldy at best. They replace all
    of them with a single source large enough to illuminate the top, bottom and sides at once, and say
    its exact size is not critical — any size between ten and twenty-five times the diameter of the subject
    works well. It is a rare instance of a book that argues through diagrams warning the reader against
    one of its own.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 7, ''Set Up a Large Light Source'', where the defect is named and the ten-to-twenty-five-times
    band given.

    '
  confounders:
  - taking the two-light reading literally and building a two-strip set-up, which lights only a point
    on each side
  - treating the size band as a precise requirement; the source says the exact size is not critical
  - assuming the large source must also be bright, when its job is angular coverage
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0008
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 5 'Revealing Shape and Contour', sidebar 'Do Lenses Affect Perspective Distortion?'
  question: 'Photographers commonly say a wide lens introduces distortion. What does this book say instead,
    and how did it demonstrate the point?

    '
  answer: 'The authors say it is the camera''s position that determines perspective distortion, not the
    lens mounted on it. To prove it they made every frame of their chessboard comparison with the SAME
    wide-angle lens and simply moved the camera, enlarging the more distant frames so all three matched
    in subject size; the convergence of the board''s parallel lines still varies with camera distance
    alone. Had they used a longer lens for the distant shots they would not have needed to enlarge, and
    the shape of the board would have been the same. Focal length matters only in that it lets a chosen
    viewpoint fill the sensor: a short lens permits a close viewpoint that produces distortion, a long
    one permits a distant viewpoint that minimises it. They allow that extremely wide-angle and inferior
    lenses may produce other kinds of distortion — but not perspective distortion.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: photography
  requires_application: false
  support: 'Ch. 5, the sidebar ''Do Lenses Affect Perspective Distortion?'', which describes the controlled
    comparison and the conclusion.

    '
  confounders:
  - 'the common belief the source is correcting: that wide lenses stretch subjects'
  - over-generalising to 'lenses cause no distortion at all', which the source explicitly does not claim
  - missing why this matters in a lighting book — viewpoint also sets the family of angles
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0009
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 4 'Surface Appearances', sections 'Using Diffuse Reflection and Shadow to Reveal
    Texture' and 'Capitalizing on Direct Reflections'
  question: 'A raking light reveals the texture of a light-blue sponge beautifully and destroys the texture
    of a black leather notebook. Explain the mechanism, and give the book''s remedy for the leather.

    '
  answer: 'Texture is read as a tonal difference between two faces of each texture particle. Raking light
    creates that difference by shadowing one face and relying on diffuse reflection to light the other.
    The sponge is light-toned and strongly diffuse, so both halves are present. The leather is black,
    and a black subject by definition produces little diffuse reflection, so the shadow side survives
    and the diffuse highlight side does not — there is no difference left to read. The authors are explicit
    that the failure is caused by the subject, not by the technique. Their remedy is to switch the surface
    to the reflection channel it actually has: a large source above the subject, big enough to fill the
    whole family of angles, so the leather is rendered by direct reflection instead. They note this is
    the exact opposite arrangement on both variables — direction and size — and say the earlier theory
    taken alone would call it the worst possible way to light the leather. The texture highlight moves
    from near black to middle grey with the same light falling on the subject and no exposure increase.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: lighting
  requires_application: true
  support: 'Ch. 4, the sponge sequence and then ''Capitalizing on Direct Reflections''. The source states
    that the amount of light falling on the leather is the same in both leather frames, which is what
    rules out an exposure explanation.

    '
  confounders:
  - answering 'increase the exposure', which the source explicitly refuses on two stated grounds
  - assuming the leather needs an even harder or more raking light — more of the failing treatment
  - attributing the difference to colour rather than to the diffuse-reflection channel that colour implies
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0010
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'Controlling the Effective Size of the Light'
  question: 'Moving a soft box closer to a metal spatula on a white ground brightens the background and
    leaves the metal exactly as bright as it was. Why?

    '
  answer: 'Because two different laws are acting on the two surfaces from the same lamp. The background
    is lit by diffuse reflection, whose brightness follows the inverse square law, so it rises as the
    light comes closer. The metal is lit by direct reflection, whose brightness equals that of the source
    regardless of how far away the source is, so it does not change at all. The consequence is a near-independent
    control over the relative brightness of metal and background from a single light — the authors call
    it nearly infinite control and immediately hedge it, because the range is bounded by how much of the
    family of angles the source still covers as it recedes.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 6, ''Controlling the Effective Size of the Light'', with its matched pair of spatula photographs
    at two light distances. The two underlying laws are chapter-3 material, already live Canon; what this
    chapter contributes is running them against each other in one scene.

    '
  confounders:
  - assuming the metal must brighten too, since more light is falling on the whole set
  - attributing the effect to the light becoming effectively larger, which is a separate consequence of
    moving it
  - thinking the metal's constancy is an exposure artefact rather than a property of direct reflection
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0011
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'Controlling the Effective Size of the Light', the two-camera
    comparison
  question: 'Two cameras frame a metal subject identically, one close with a short lens and one far with
    a long one. The incident light is the same in both. Why is the background brighter in one of them,
    and which?

    '
  answer: 'Brighter in the distant, long-lens arrangement — and the reason is the lens''s indirect effect
    on the effective size of the light. A distant viewpoint produces a narrow family of angles, so the
    soft box is much larger than the family and can be moved a long way without the metal changing; that
    freedom lets the light be brought close, which brightens the background. A close viewpoint produces
    a wide family that the same soft box only just fills, so the light cannot be moved back without the
    edges of the metal going black, and the light must stay where it is. With the metal exposed identically
    in both, the background therefore comes out brighter in the distant arrangement and darker in the
    close one despite identical incident light. The authors say this surprises even highly experienced
    photographers, and they recommend a longer lens and a more distant viewpoint whenever the subject
    is bright metal and the camera position is free.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 6, ''Controlling the Effective Size of the Light'', the A/B camera diagram and the recommendation
    that follows it.

    '
  confounders:
  - assuming the lens changes the light directly, rather than through the width of the family of angles
  - getting the direction backwards — a wide lens close in feels like it should give more freedom, not
    less
  - 'forgetting the chapter-5 coupling: the viewpoint that frees the light also fixes the perspective'
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0012
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'Finding the Family of Angles'
  question: 'Describe the test-light procedure for locating the family of angles, and state the inversion
    the book says will make hot spots easy to find afterwards.

    '
  answer: 'Hang a white target where you think the family will be — larger than you think you need, and
    the less sure you are, the larger. Put a narrow-beam test light exactly at the lens position, removing
    the camera if necessary. Aim it at the point on the metal nearest the camera; where the reflected
    beam lands on the target is the near limit of the family, and you mark it with removable tape. Aim
    it at the farthest point for the far limit, and mark as many additional points as the subject''s shape
    requires. The procedure works because light paths are reversible: a beam sent from the camera''s position
    and reflected by the subject traces exactly the path a source would need to occupy. The inversion
    to remember is that the point reflecting in the metal edge at the BOTTOM of the image corresponds
    to the limit marked at the TOP of the test surface, and vice versa.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: false
  support: 'Ch. 6, ''Finding the Family of Angles'', the four numbered steps. The authors also record
    a reader''s suggestion of a laser pointer as the test light and endorse it untested, writing that
    it should work well.

    '
  confounders:
  - putting the test light where the main light will go, rather than at the camera
  - forgetting the top/bottom inversion, which is what makes the marked area interpretable
  - assuming the marked family must be filled exactly; the source says a source or gobo that exactly fits
    is almost never needed
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0013
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', section 'Position the Subject and Focus
    the Camera'
  question: 'Moving a glass closer to the camera improves its edge definition. The book insists this is
    not because bigger detail is easier to see. What is the actual reason?

    '
  answer: 'It is because moving the subject toward the camera also moves it AWAY from the lighted background,
    and the closer a subject is to a lit background the more of that background falls inside the family
    of angles that acts on the glass edge. Light from those angles is exactly what obscures the edge,
    so increasing the subject-to-background distance reduces the light reaching the edge and the outline
    sharpens. The authors state the wrong explanation explicitly in order to reject it, which is worth
    noting: the observable effect and the plausible reason for it are different things here.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 7, ''Position the Subject and Focus the Camera'' in the bright-field sequence, repeated
    in the dark-field one.

    '
  confounders:
  - the rejected explanation — larger detail is easier to see — which the source names and dismisses
  - attributing it to depth of field or focus, which the source addresses separately and says is negligible
  - thinking a larger background would help; the source says that is exactly what destroys the edge
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0014
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'A Transparent Background'
  question: 'A metal box stands on a sheet of clear glass. A polarizing filter on the lens turns the glass
    black and leaves the metal untouched. What makes the filter able to discriminate?

    '
  answer: 'The two surfaces polarize differently. Most of the direct reflection from glass viewed at that
    angle is polarized, so a lens polarizer can extinguish it. Direct reflection from metal is never polarized
    unless the light source itself is polarized, so the same filter passes it and the metal is unaffected.
    The filter is not selecting by object or by brightness; it is selecting by a physical property the
    two materials do not share. The book is careful about the boundary elsewhere: the same trick fails
    for a black subject on glass, because much of a black subject''s direct reflection is likely to be
    polarized too, so the filter that clears the table would probably blacken the subject as well.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 6, ''A Transparent Background'', with the before-and-after photographs; the withdrawal
    for black subjects is in ch. 9, ''Keeping the Subject Away from the Background''. The conductor-versus-insulator
    guideline behind it is chapter-3 material and already live Canon.

    '
  confounders:
  - assuming a polarizer reduces all reflections, which is the general belief the source contradicts
  - attributing the discrimination to the angle rather than to the material class
  - generalising the trick to any dark support, which the book explicitly blocks
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0015
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'Using a Tent', the closing paragraph on tent size
  question: 'Building a bigger tent to move the camera farther from a mirrored sphere feels like it should
    shrink the camera''s reflection. The book says the extra work is always wasted. Why?

    '
  answer: 'Because the camera is the one reflection whose size cannot be reduced by moving it away. Moving
    the camera back does shrink its reflection — and shrinks the image of the subject by the same factor,
    so a longer lens is needed to restore the framing, and that enlarges the camera''s reflection back
    to its original size. The ratio of the camera''s reflection to the subject is constant. The authors
    state the intuition, grant that it is intuitive, and then close it off; they are equally candid that
    the tent itself does not solve the problem, since the dark camera hole and the tent seams reflect
    in the subject and must be retouched. Its real value, they say, is that it makes the retouching easier.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 6, ''Using a Tent'', final paragraphs. The tent photograph shows the reflected camera
    hole as small dark marks on the ornaments.

    '
  confounders:
  - 'the intuition the source is refuting: distance shrinks reflections'
  - assuming a tent removes all reflections; it removes the studio and substitutes its own hole and seams
  - confusing this with flat metal, where a shift lens really can take the camera out of the family of
    angles
