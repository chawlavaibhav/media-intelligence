- qa_id: qa_lsmx_0029
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', section 'Shoot the Picture' in the dark-field
    sequence
  question: 'The edge highlights in a dark-field glass shot are far too small for an ordinary meter. What
    proxy does the book use, and why does it then insist on a bracket?

    '
  answer: 'The proxy is the light source itself. Because a pure direct reflection is as bright as the
    source that produces it, the reflections may be too small to read but the large source is not: place
    the meter close enough to read the source alone, read the EDGE of the source because that is the part
    illuminating the glass, and open two stops to place it near white rather than at the meter''s assumed
    18% grey. The bracket is required because that exposure is only correct if the highlight on the glass
    is a perfect un-polarized direct reflection, and in practice there is no realistic chance of it being
    both. So the authors treat that value as a theoretical starting point and try one, two and three stops
    more. They also note that a correct instrument would be a spot meter of much less than one degree,
    that few photographers own one, and that bracketing with a conventional meter is an acceptably close
    approximation — an explicit substitution of procedure for instrument.

    '
  answer_type: repair
  difficulty: hard
  knowledge_type: production_reasoning
  requires_application: false
  support: 'Ch. 7, the ''Shoot the Picture'' step of the dark-field sequence. The source-brightness fact
    and the dimming of polarized reflection are both chapter-3 material and already live Canon.

    '
  confounders:
  - metering the background, which is the bright-field procedure, not this one
  - treating the two-stop opening as the final answer rather than the start of a bracket
  - trying to lighten a dark-field background by increasing exposure, which the source says overexposes
