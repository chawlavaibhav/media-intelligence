- qa_id: qa_lsmx_0016
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 10 'Traveling Light', sections 'Do the Colors Mix?' and 'The Remedies'
  question: 'Why can a single white-balance or global colour correction fix a scene lit by fluorescent
    light plus ceiling-bounced flash, but not the same room with the flash aimed at the subject?

    '
  answer: 'Because of where the two colours meet. Bounced flash mixes with the fluorescent light before
    either reaches the scene, so the whole frame is lit by one new balance: the error is uniform, and
    a single global transform can remove it. Direct flash lights the foreground subject while the fluorescents
    light the rest, so different regions carry different errors, and whatever correction is right for
    one is wrong for the other — a compromise value leaves nothing in the scene right. The book calls
    these mixed and unmixed colour. Its remedy for the unmixed case is counter-intuitive: gel the sources
    so they match EACH OTHER as closely as possible, aiming for a single colour and not necessarily the
    correct one, and then let a global correction fix the whole scene. Its example is a light-green gel
    on the flash to approximate the overhead fluorescents.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: colour
  requires_application: true
  support: 'Ch. 10, ''Do the Colors Mix?'' for the distinction and ''Correcting Unmixed Colors'' for the
    remedy. The authors also flag a case that is easy to miss: a flash-cast shadow on a wall filled in
    by fluorescent light, which renders yellow-green.

    '
  confounders:
  - assuming a better white balance or a more capable camera resolves the unmixed case; the source says
    none can
  - gelling the flash to be 'correct' rather than to match the ambient, which is the opposite of the advice
  - treating local retouching as the first answer; the source calls it tedious and a last resort
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0017
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', section 'Liquid as a Lens'
  question: 'A wine glass is photographed against a background that exactly fills the camera''s frame,
    and the studio appears as a dark surround inside the bowl of the glass. What has happened, and why
    is the obvious fix barred?

    '
  answer: 'A round transparent container filled with liquid is optically a lens, and it sees a wider field
    than the camera does. A background large enough to fill the camera''s field of view is therefore not
    large enough to fill the field of view seen through the liquid, so the white rectangle in the centre
    of the glass is the background and the dark area around it is the rest of the studio. The obvious
    fix — a larger background, or one moved closer to increase its effective size — is barred because
    a background larger than the field of view extends into the family of angles acting on the glass edge
    and sacrifices the edge definition the whole chapter exists to protect. The book''s remedy is to move
    the CAMERA closer and, if necessary, fit a shorter lens to hold the image size, so the existing background
    fills the area seen through the liquid. The stated cost is increased perspective distortion, visible
    as a deeper ellipse at the rim, which may or may not be acceptable in a given scene.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 7, ''Liquid as a Lens'', with the before-and-after wine-glass pair; the bar on enlarging
    the background comes from ''Position the Camera'' earlier in the chapter.

    '
  confounders:
  - enlarging or approaching the background, which is the natural move and the one the source rules out
  - assuming the dark surround is a vignetting or exposure problem
  - forgetting that the remedy costs perspective, which the source states plainly
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0018
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 4 'Surface Appearances', sections 'The Distance of Light' and 'Doing the Impossible'
  question: 'The book says even illumination and glare-free illumination can be mutually exclusive goals
    on a flat subject. Set out the tension and the one solution it says always works — including why that
    solution is unusable at its limit.

    '
  answer: 'The closer the source is to the camera axis, the more directly it lights the subject and the
    more even the illumination; the farther to the side it is, the less likely it is to fall inside the
    family of angles that produces direct reflection. So the two goals pull in opposite directions. A
    shallow side angle avoids the glare and overlights the near edge, and a second light on the far side
    does not fix it — you get two overexposed edges with a dark centre. Moving the light toward the camera
    evens the illumination and is likely to put it inside the family, which the authors call the worse
    problem. The only solution that always works is to move the light farther away: in theory a light
    at infinite distance produces exactly equal diffuse reflection at every point of the surface even
    at the most shallow angle. It is unusable at the limit because a light at an infinite distance is
    also likely to be infinitely dim. The practical answer is a compromise distance — far enough for acceptably
    even illumination, close enough for acceptable exposure times. The authors say they could give formulas
    and that the reader would not use them, and prescribe judging by eye and checking with a meter.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: lighting
  requires_application: false
  support: 'Ch. 4, ''The Distance of Light'' and the opening of ''Doing the Impossible'', where the mutual
    exclusivity is stated and the working-space consequence spelled out in two bullets.

    '
  confounders:
  - adding a second light as the fix, which the source shows produces two hot edges rather than one
  - treating the infinite-distance case as the answer rather than as the limit that shows the direction
  - assuming a bigger softbox resolves it; the conflict is about position and distance, not softness
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0019
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 5 'Revealing Shape and Contour', section 'Fill Light', the silver-versus-white reflector
    discussion
  question: 'In a cramped tabletop set, when will a white fill card put more light on the subject than
    a silver one, and when is a silver card guaranteed to give a hard fill regardless of how big it is?

    '
  answer: 'A silver card reflects directly, so it behaves as a mirror and has its own limited family of
    angles; its aim is critical, and in a crowded arrangement the only position available may be one from
    which it reflects no light to the subject at all. A white card reflects mostly diffusely, so its angle
    is much less critical, and from some positions it will therefore deliver more light than a silver
    one despite reflecting less overall. On hardness, a silver card produces a mirror image of the main
    light and inherits that light''s size: a large silver card is a soft fill only if the main light is
    large, and if the main light is small the silver card is a hard fill regardless of its own size. A
    white reflector is the only reflector that can provide soft fill light from a small main light.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: lighting
  requires_application: true
  support: 'Ch. 5, ''Fill Light''. The reasoning is the family-of-angles idea applied to something that
    is not the subject — the reflector itself.

    '
  confounders:
  - ranking the two by reflectance alone, so silver always wins
  - assuming a large reflector is always a soft source, which is only true for the diffuse case
  - forgetting the source's separate warning that fill bounced from a coloured background can colour a
    pale subject
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0020
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 5 'The Glossy Box' compared with Ch. 6 'Metal Boxes'
  question: 'A glossy wooden box and a polished metal box present the same two families of angles from
    the same camera position. Why does the book spend a whole section removing direct reflection from
    one and go straight to creating it on the other?

    '
  answer: 'Because the two surfaces have different channels available. A glossy non-metallic box that
    is not black produces both diffuse and direct reflection, and the direct reflection obscures the diffuse
    one that carries the wood''s colour and grain — so the authors work through a ladder of remedies to
    suppress it. A polished metal box produces only direct reflection, and without it the box records
    as black; since they usually want metal to read bright, the job is to fill each family of angles rather
    than to vacate any. The book states the point explicitly: the theory is identical to that applied
    in the earlier picture, and the difference in material makes them likely to apply it the opposite
    way. It is the same author team inverting its own prescription because the surface class changed —
    not a contradiction and not a disagreement between sources.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 5, ''The Glossy Box''; Ch. 6, ''Metal Boxes'', where the cross-reference and the inversion
    are both stated.

    '
  confounders:
  - treating the two as inconsistent advice from one book
  - assuming the difference is about gloss level rather than about whether a diffuse channel exists
  - 'carrying the polarizer step across: it is a late resort for the glossy box and nearly useless on
    metal'
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0021
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 5 'Revealing Shape and Contour', section 'Try a Polarizer'
  question: 'Chapter 4 offers a polarizer among the first remedies for competing surfaces; chapter 5 demotes
    it to a next-to-last resort for a glossy box. What optical reason do the authors give, and how should
    the apparent inconsistency be recorded?

    '
  answer: 'The reason is that a glossy box usually carries polarized reflection on more than one side,
    and the reflection from one side is likely to be polarized perpendicular to the polarization of the
    other. So as the lens polarizer eliminates one polarized reflection it effectively increases another
    — the filter trades rather than solves. The authors therefore work through the geometric remedies
    first, so that whatever direct reflection remains is the single hardest case, and only then spend
    the polarizer on it. The apparent inconsistency should be recorded as the same authors qualifying
    their own earlier statement within a stated scope: the earlier advice was for competing flat surfaces
    in copy work, the later ordering is for a box with mutually perpendicular faces, and the source names
    the difference. It is not cross-source disagreement and must not be presented as two sources conflicting.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 5, ''Try a Polarizer'', which states both the perpendicular-polarization reason and the
    ordering, and refers back to the previous chapter''s advice.

    '
  confounders:
  - reading it as the book contradicting itself
  - presenting it as a disagreement between two sources, which it is not — one author team, one work
  - assuming the polarizer is simply weak, rather than that it redistributes among faces
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0022
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 4 'Surface Appearances', sidebar 'Using Light-polarizing Filters'
  question: 'Cross-polarizing the lights and the lens rescues an otherwise impossible copy job. The book
    still calls it a solution to avoid whenever possible. List the costs it actually names.

    '
  answer: 'Five. First, exposure: two perfect polarizers should cost two stops in theory, but real ones
    carry a lot of neutral density, so the actual reduction is likely to be four to six stops — and worse
    in non-copy work, where diffusion material absorbs more still. Second, the consequences of those lost
    stops: the resulting aperture may be too wide to hold adequate depth of field, or the exposure long
    enough that subject or camera movement becomes hard to avoid. Third, heat: polarizing filters are
    damaged by it, so they must be kept off incandescent lights at a tested distance, and photographers
    using strobes leave them off until they are ready to shoot and turn the modelling lights off first.
    Fourth, a minor effect on colour balance. Fifth, the opportunity cost the authors state directly:
    understanding and controlling the size and angle of the source makes polarizing the source unnecessary
    in most situations, and some photographers go for years without needing it.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: false
  support: 'Ch. 4, the sidebar ''Using Light-polarizing Filters'', which enumerates the drawbacks; the
    authors say they deliberately conceived the impossible copy problem as one of the rare cases where
    it is the only solution.

    '
  confounders:
  - quoting the theoretical two stops as the working figure
  - treating it as a general glare cure rather than a rare last resort
  - missing the heat hazard, which the source treats as a practical safety matter with a test procedure
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0023
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 5 'Revealing Shape and Contour', sections 'The Size of the Light' and 'Light on
    the Side'
  question: 'The book says a hard shadow often shows more depth than a soft one at the same grey. Does
    it conclude that hard lights are better, and what does it prescribe instead?

    '
  answer: 'No. It states the observation — two shadows recording as the same grey are not equally visible,
    and the harder-edged one is more visible, which is why a hard shadow often increases the illusion
    of depth — and then immediately blocks the inference. A shadow that is too hard can be so visible
    that it competes with the primary subject. The authors say explicitly that they cannot offer firm
    rules about what size light is always best, and they leave the trade-off itself as the thing to reason
    with. Their worked answer for a tabletop subject is not to soften the shadow away but to MOVE it:
    the least distracting place is directly under and in front of the subject, which means the light goes
    above and slightly behind, and only then do they substitute a soft box to make the relocated shadow
    unobtrusive. Softening it out of existence entirely is rejected, because the shadow proves the subject
    is sitting on the table rather than floating above it.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: lighting
  requires_application: false
  support: 'Ch. 5, ''The Size of the Light'' for the visibility claim, ''Light on the Side'' and ''Light
    above the Subject'' for the relocation and the grounding argument.

    '
  confounders:
  - concluding hard light is better for product work because it shows more depth
  - softening the shadow to nothing, which loses the contact cue
  - assuming the source ranks light sizes; it explicitly declines to
