- qa_id: qa_lsmx_0044
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', section 'Use a Gobo Above the Subject', the shallow-subject case
  question: 'Where does the gobo-above technique stop working, and what does the book offer instead?

    '
  answer: 'It fails on very shallow subjects. The gobo works by shading the top of the subject more than
    the background behind it, and it can do that because the background is farther from the gobo than
    the subject is, so the gobo''s shadow arrives on the background softer and often imperceptibly. On
    a tall enough subject there may be no perceptible shadow on the background at all. In the extreme
    case the authors name — a white business card on a white table — it is impossible to put a shadow
    on the card without shading the background equally, because the two are at effectively the same distance.
    In those situations they say the answer is one of the other backgrounds discussed later in the chapter,
    a translucent white background or a mirror, both of which decouple the lighting of subject and background
    entirely; or, failing that, masking or retouching after the photograph is made.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 9, ''Use a Gobo Above the Subject'', final paragraph, and the sections on the translucent
    and mirror backgrounds that follow.

    '
  confounders:
  - trying a smaller or harder gobo, which cannot separate two coplanar surfaces
  - assuming the technique fails because the subject is small rather than because it is flat
  - forgetting that the source explicitly permits retouching as the fallback here
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0045
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', section 'Using a Translucent White Background', the manufactured-shadow
    procedure
  question: 'A backlit translucent panel gives perfect subject-to-background separation for a pale product
    and leaves it apparently floating, with no ground shadow at all. The book turns this into an advantage.
    How?

    '
  answer: 'Because the shadow can now be controlled completely independently of the lighting of the subject.
    The procedure: turn off every light intended for the actual exposure; set up a test light purely to
    cast a pleasing shadow, without caring whether that light would be any good for the subject; slide
    a sheet of opaque or semi-opaque paper under the subject to act as a custom gobo, and trace the shadow
    pattern onto it in pencil; remove the paper and cut the pattern out; glue the cut-out under the translucent
    background; turn the test light off and light the subject in any manner you please. The shadow in
    the finished frame was not cast by the light illuminating the subject, and the authors say it certainly
    looks as though it was. This is the same tracing device they use twice elsewhere in the book — for
    the family of angles with a test light at the lens, and for the cut secondary background behind a
    glass of liquid.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 9, ''Using a Translucent White Background'', which gives the step sequence and cross-references
    its own earlier uses of the tracing method.

    '
  confounders:
  - adding a second light to cast a real shadow, which would also fall on the backlit panel
  - assuming the test light must be a good light for the subject; the source says explicitly it need not
    be
  - confusing this with a mirror background, where no ground shadow is obtainable at all
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0046
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'Keeping the Metal Dark'
  question: 'A brief calls for a steel component to read almost black in a soft, evenly lit scene. Simply
    putting the light near the camera does keep the metal dark and the authors reject the result. What
    is wrong with it, and what do they build instead?

    '
  answer: 'What is wrong is not the metal''s tone but the shadows: the position of the soft shadows that
    arrangement produces does nothing to delineate the shape of the object, so the component reads dark
    and formless. The arrangement they build instead uses the marked family of angles directly. Assume
    the white target used to find the family was much larger than the minimum needed to fill it. Back
    the light up so it illuminates that entire diffusion sheet as evenly as possible, then attach a gobo
    cut to barely fill the family of angles. Every point of the sheet except the family lights the scene,
    so the light is large and soft while the metal stays black. Two practical notes: the white test target
    must be removed if it is not being used as the source, because left in place it would reflect the
    general illumination and act as an additional light; and the technique fails with an opaque white
    reflector card, because the light illuminating the card also illuminates the gobo, which then behaves
    more like a reflector than a blocker even if it is black — though the authors concede that hybrid
    might be the most pleasing compromise of all.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 6, ''Keeping the Metal Dark'', including the removal of the test surface and the reflector-card
    failure condition.

    '
  confounders:
  - keeping the light near the camera and accepting the shadowless result
  - leaving the white finding-target in place, which quietly re-lights the metal
  - using a front-lit reflector card with a black gobo, which the source says does not work as a blocker
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0047
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'Round Metal' and its three remedies
  question: 'A polished sphere has to be photographed and the camera keeps appearing dead in the middle
    of it. Rank the book''s three remedies and say what each actually achieves.

    '
  answer: 'First the constraint: the family of angles for round metal is practically the whole environment
    including the camera, the camera''s reflection always falls exactly at the centre of the subject where
    it is most noticeable, and there are no view-camera tricks to move it out. So all three remedies are
    mitigations. Camouflage means any desirable clutter that makes the unwanted reflection less obvious
    — an irregular surface where the reflection can fall between the cracks, or additional subjects appropriate
    to the scene whose reflections break it up; the authors describe using ribbon and greenery this way
    on a department store catalogue cover. Keeping the light off the camera works because a camera in
    the dark cannot see itself reflected: confine the lighting to the subject, work farther away with
    a longer lens so less stray light falls on the camera, or cover it with black cloth or a black card
    with a hole — though that only works in a studio large enough that the surrounding walls do not reflect.
    A tent makes the environment and the source the same white enclosure, and the authors are candid that
    by itself it does not solve the problem: the dark camera hole and the tent seams reflect in the subject
    and must be retouched. Its value is that it makes the retouching easier.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 6, ''Round Metal'' through ''Using a Tent'', with the untented and tented ornament photographs.

    '
  confounders:
  - expecting one of the three to remove the reflection outright; none does
  - building a larger tent to shrink the camera's reflection, which the source shows is always wasted
  - assuming a black-covered camera works anywhere; the source restricts it to a large studio
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0048
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 4 'Surface Appearances', section 'Complex Surfaces'; Ch. 5, 'The Glossy Box'
  question: 'A lacquered wooden gift box has to show both its high-gloss finish and the grain and colour
    of the wood beneath. Using this book, how do you get both in one frame, and where does the same book
    warn you the approach can go wrong?

    '
  answer: 'Treat it as a complex surface — one that needs both diffuse and direct reflection — and divide
    the surface rather than compromising across it. The authors'' method is to position a source large
    enough to fill the entire family of angles required to produce direct reflection over the whole lid,
    so the gloss is available everywhere, and then block part of that source with a gobo so one region
    of the lid produces only diffuse reflection. In their frame the direct reflection sits camera-left
    and shows the gloss, and the diffusely lit camera-right region shows the grain and the true colour
    — and they note that the diffuse region is the only place the true colour of the wood is clearly apparent.
    The warning comes from the glossy-box section of the next chapter: on a three-dimensional box each
    visible face has its own family of angles facing a different direction, so the same large source that
    gives a pleasing gloss on the lid may put direct reflection on the sides too, and the ladder of geometric
    remedies — darker background, light toward the camera, camera height, falloff, black card on the tabletop,
    tipping the box, longer lens — exists for exactly that.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 4, ''Complex Surfaces'', for the divided-surface method; Ch. 5, ''The Glossy Box'', for
    the multi-face complication and the ordered remedies.

    '
  confounders:
  - using a medium source everywhere and accepting a partial gloss, which shows neither property well
  - removing the direct reflection entirely to save the grain, which loses the finish
  - assuming the lid solution transfers unchanged to the sides, which face different directions
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0049
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 4 'Surface Appearances', section 'Complex Surfaces', the closing figure
  question: 'The book says adding a three-dimensional object to a glossy flat surface both improves the
    picture and makes the lighting easier. Why does it help, and why does the chapter drop the idea immediately?

    '
  answer: 'It helps because the object''s reflection in the surface is unambiguous evidence of gloss in
    a way that a featureless bright area is not: the reflection of a pair of eyeglasses in a polished
    lid tells the viewer the wood is glossy, and the authors say adding a secondary subject reveals the
    surface better than they are likely to render it alone. It makes the lighting easier for the same
    reason — the proof of the finish no longer has to be carried entirely by the shaped highlight. The
    chapter drops it because it had committed at the outset to two-dimensional and nearly two-dimensional
    subjects, and the authors say they cannot pursue the approach far without breaking that promise; three-dimensional
    subjects are the next chapter''s business. So the claim is stated and demonstrated but deliberately
    not developed.

    '
  answer_type: source_position
  difficulty: easy
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 4, ''Complex Surfaces'', final paragraphs, with the eyeglasses-on-the-box frame.

    '
  confounders:
  - reading the secondary object as a composition device rather than as evidence about the surface
  - assuming the book recommends it generally; it raises it and sets it aside for structural reasons
  - confusing it with camouflage on round metal, which hides an unwanted reflection rather than supplying
    a wanted one
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0050
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 8 'Making Portraits', section 'Eyeglasses'
  question: 'A portrait sitter wears large eyeglasses and the main light reflects in them. The photographer''s
    instinct is to raise the light. What does this book say about that, and what does it call the only
    solution that always works?

    '
  answer: 'Raising the light might clear the reflection, but the authors say that depending on the size
    and shape of the glasses, by the time it is high enough it might fill the eye with shadow — so it
    is not reliable. The only solution that always works, in their words, is to change from short lighting
    to broad lighting, moving the main light to the same side as the visible ear. It works because that
    position puts the main light outside the family of angles that the eyeglass lenses define, which is
    the same reasoning the book applies to any mirror-like surface. Two corollaries follow. The size of
    that family scales with the diameter of the eyeglass lenses, so the problem is worse with big glasses.
    And with small lenses a smaller main light can sometimes preserve short lighting, because a smaller
    source is easier to position entirely outside the family.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: lighting
  requires_application: true
  support: 'Ch. 8, ''Eyeglasses''. Broad and short lighting are named in the preceding section by the
    position of the main light relative to the sitter''s visible ear.

    '
  confounders:
  - raising the light, which the source says can fill the eye with shadow
  - treating broad-versus-short purely as a stylistic preference; here it is an optical necessity
  - cross-polarizing the light and lens, which the source blocks for portraits on separate grounds
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0051
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 8 'Making Portraits', sections 'Eyeglasses' and 'Dark Skin'
  question: 'A still-life photographer moving to portraits proposes cross-polarizing the main light and
    the lens to eliminate eyeglass glare once and for all. What does the book say goes wrong, and what
    does the same fact about skin let you do elsewhere?

    '
  answer: 'Human skin itself produces a small amount of direct reflection, and eliminating all direct
    reflection in the highlights of a portrait may give the skin a lifeless appearance — so the technique
    that rescues an impossible copy job is blocked here, because it removes something the picture needs.
    The same fact is a resource in the other direction. Because direct reflection is most visible on a
    dark surface, a dark complexion is best rendered not by opening the aperture — which would ruin any
    light-toned subject in the same frame, the book''s example being a bride''s white dress — but by increasing
    the direct reflection from the skin. That means a much larger source: a human head is roughly spherical,
    so the family of angles producing a large direct reflection on it is itself large, and the authors
    are explicit that a slight increase in light size offers almost no improvement while the larger the
    light the better the result. The aperture may still need opening a little, but not much.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: lighting
  requires_application: true
  support: 'Ch. 8, the closing paragraphs of ''Eyeglasses'' and the section ''Dark Skin''. The mechanism
    — that direct reflection shows most where diffuse reflection is weak — is chapter-3 material and already
    live Canon.

    '
  confounders:
  - carrying the copy-work cross-polarization technique into portraits unchanged
  - increasing exposure for dark skin, which the source shows fails as soon as anything light is in frame
  - enlarging the light a little, which the source says achieves almost nothing on a roughly spherical
    subject
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0052
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', sections 'Overexposure', 'Underexposure' and 'Exposing White-on-White
    Scenes'
  question: '"Shoot it bright and pull it down later" is offered as a safe habit for a white-on-white
    packshot. On this book''s account, is it safe, and what does it prescribe instead?

    '
  answer: 'It is not safe, and the reason is that compression at the extremes is not recoverable. Increased
    exposure relieves shadow compression and makes highlight compression much worse; darkening the frame
    afterwards restores the overall tonality without restoring any distinction among the highlights, and
    the authors show that the corrected version still offers little additional separation between highlight
    tones. A white-on-white scene is already recorded on the least favourable part of the curve, so brightening
    it pushes exactly the tones that matter further into the compressed region. Their prescription is
    the opposite: reduce exposure by up to two and a half stops, which in practice means metering the
    white subject and using the reading WITHOUT the routine two-and-a-half-stop white correction, so the
    subject sits on the straighter part of the curve and away from the shoulder — then lift it in reproduction.
    They give two reasons: the reduced exposure reserves more choices for later, and the sensor''s response
    is not perfectly linear either. The one warning attached is a secondary black subject in the same
    scene, which will then lack shadow detail.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: false
  support: 'Ch. 9, ''Overexposure'' and ''Underexposure'' for the unrecoverability, ''Exposing White-on-White
    Scenes'' for the prescription and its caveat.

    '
  confounders:
  - the modern habit of exposing to the right, which is the specific move this passage argues against
    for this scene type
  - assuming Raw removes the problem; the source says the straightened curve looks flat and the compression
    is reintroduced deliberately
  - applying the reduced exposure to a scene containing an important black element
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0053
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', sections 'Exposing White-on-White Scenes' and 'Exposing Black-on-Black
    Scenes'
  question: 'The book gives the same magnitude — up to two and a half stops — for both extremes, in opposite
    directions. Are the reasons the same, and what single condition breaks both shortcuts?

    '
  answer: 'The magnitude matches and the reasons only partly do. Both shifts move the scene toward the
    middle of the curve, where the least detail is lost, and both are undone afterwards in reproduction.
    The white-on-white reduction is justified by the curve''s shoulder and by reserving choices for later.
    The black-on-black increase has an additional and different ground: digital noise in the shadow steps,
    which may be unnoticeable in a normal scene but is apparent in a black-on-black one — and the authors
    say that because of noise they are more likely actually to use the full extreme at the dark end. The
    condition that breaks both shortcuts is the same: a secondary subject at the opposite extreme. Reduced
    exposure leaves an important black subject without shadow detail; increased exposure overexposes any
    light-grey secondary subject. Whether it matters is explicitly a psychological judgement about that
    subject''s importance and size, not a technical one, and the authors say it is entirely reasonable
    to expose two technically identical scenes differently on that basis.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: false
  support: 'Ch. 9, the two exposing sections. The noise ground is stated as depending on camera quality
    and as present to some extent in all cameras at the time of writing.

    '
  confounders:
  - treating the two as a symmetric rule with one reason
  - assuming the noise argument applies equally at the highlight end
  - reading the secondary-subject test as a measurement rather than a judgement of importance
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0054
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 4 'Surface Appearances', section 'Capitalizing on Diffuse Reflections'
  question: 'The book says diffuse reflection tells you very little about what a surface is made of. What
    test does it offer, and what carries the material information instead?

    '
  answer: 'The test is a thought experiment about the book''s own page: had it been printed on smooth
    leather or glossy plastic instead of paper, the diffuse reflection would still look about the same.
    What diffuse reflection does carry is how black or how white a subject is — the page''s blacks and
    whites come from areas producing a great deal of diffuse reflection, the paper, and areas producing
    little, the ink — and, because diffuse reflection can reflect frequencies selectively, most of the
    colour information; the authors say a page printed with magenta ink on blue paper would announce itself
    through its diffuse reflection. What carries the material identity is the direct reflection: you could
    tell the difference in material by it. This is why copy work, which wants the colours and values of
    the original rather than the surface it sits on, is the case where only diffuse reflection is wanted.

    '
  answer_type: mechanism
  difficulty: easy
  knowledge_type: lighting
  requires_application: false
  support: 'Ch. 4, ''Capitalizing on Diffuse Reflections'', where the leather-and-plastic test and the
    copy-work consequence are both stated.

    '
  confounders:
  - assuming texture and material are the same question; texture can be shown by shadow, material by finish
  - attributing colour to direct reflection, which is a mirror image of the source and carries the source's
    colour
  - treating this as a claim about physics rather than about what each channel tells a viewer
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0055
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: 'Ch. 5 ''Revealing Shape and Contour'', section ''Photographing Cylinders: Increasing
    Tonal Variation'''
  question: 'A cylindrical aerosol can lit evenly reads as a flat shape. What does this book say cylinders
    need that boxes do not, and what does its remedy cost?

    '
  answer: 'Cylinders usually need a brighter highlight side or a darker shadow side than boxes do. The
    reason is that a box supplies abrupt tonal steps at its edges while a curved surface supplies only
    a gradient, so the shadows blend so gradually into the highlights that the dimensional distinction
    is lost and the subject reads flat. The remedy is to build more tonal variation into the scene, and
    the authors'' method is subtractive as much as additive: a light source on one side of the subject
    and a black card on the other. The cost is that placing the main light to one side puts the subject''s
    shadow on the table beside it — and shadows are least likely to become strong compositional elements
    when they fall at the bottom of the picture, under the subject. So when they do put the main light
    to the side of a cylindrical subject they usually use a large source, which softens that shadow and
    makes it less likely to compete.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 5, ''Photographing Cylinders: Increasing Tonal Variation'', including the black-card method
    and the resulting shadow problem.

    '
  confounders:
  - adding fill on the dark side, which reduces the very variation the cylinder needs
  - using a small hard light to increase contrast, which worsens the cast-shadow problem
  - assuming the black card adds nothing because it emits nothing; its job is to subtract
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0056
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 5 'Revealing Shape and Contour', sidebar 'Managing Flare'
  question: 'You need a gobo in front of the lens but the source is soft, so its shadow is too diffuse
    to see, and at full aperture the gobo itself is too unsharp to spot if it intrudes. What trick does
    the book give?

    '
  answer: 'Use the lens itself as the detector. The glass lens reflects like a mirror, so with the camera
    on a tripod you can look into the front of the lens and see the reflection of any light source likely
    to cause flare. Move the gobo in front of the lens just far enough that the source is no longer reflected
    there, then pull the gobo back slightly for safety. A gobo in that position eliminates almost all
    flare without extending into the image. The trick works because the set of sources the lens surface
    can see is exactly the set that can produce camera flare, so occluding them in that reflection occludes
    them at the lens. The authors set it up by first stating both difficulties — a hard source lets you
    place the gobo by its shadow, a soft one does not, and shallow depth of field at the composing aperture
    hides an intruding card.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: production_reasoning
  requires_application: false
  support: 'Ch. 5, the sidebar ''Managing Flare'', which distinguishes lens flare from camera flare and
    gives this positioning method for the latter.

    '
  confounders:
  - stopping down to check, which changes the framing conditions you were trying to judge
  - using a lens hood, which the source says often does not extend far enough forward to help
  - positioning by the gobo's own shadow, which is exactly what fails under a soft source
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0057
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 10 'Traveling Light', section 'Correcting Mixed Colors', the caution on highlights
  question: 'A frame with a visible lamp in it is colour-corrected globally and the lamp''s highlight
    comes out tinted. What has happened on this book''s account, and what does it prescribe?

    '
  answer: 'An area bright enough — a light source in the frame, or the mirror reflection of one — records
    as a white highlight regardless of the colour of the light that produced it, because it has clipped
    and carries no chromatic information of its own. When a correction is then applied to fix the rest
    of the scene, those highlights have nothing to shift and instead take on the colour of the correction.
    The book says the problem can be dealt with but requires more than the straightforward colour adjustment
    most people know how to do, that only first-rate printers have prepress departments able to handle
    it, and that it is a topic too far from photographic lighting to cover. Its own prescription is therefore
    preventive: either correct the colour while shooting the picture, or compose it so that it does not
    contain any troublesome highlights. As a diagnostic, the pattern is worth keeping — a tinted specular
    highlight matching a correction applied elsewhere is evidence of the correction rather than of the
    original lighting.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: colour
  requires_application: true
  support: 'Ch. 10, ''Correcting Mixed Colors'', the caution that follows the account of why mixed colour
    is easy to fix.

    '
  confounders:
  - assuming the tint reveals the true colour of the source
  - correcting the highlight separately as the first move; the source calls it beyond straightforward
    adjustment
  - reading it as an artefact of the display or the printer rather than of the correction itself
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0058
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 10 'Traveling Light', section 'Filtering Daylight'
  question: 'An interior is lit by tungsten photographic lights and by daylight through a window. Two
    gelling strategies both match the colours. Which does the book prefer, and on what ground that has
    nothing to do with colour?

    '
  answer: 'It prefers gelling the window. Blue gels on the photographic lights, shot at a daylight balance,
    would match the colours — but the photographic lights are probably weaker than the sun already, and
    filtering them absorbs light where it can least be spared. Orange theatrical gel on the OUTSIDE of
    the window, shot at a tungsten balance, achieves the same colour match and also better balances the
    intensity of the two sources, because the loss is now imposed on the stronger one. The general point
    the authors make first is the one still photographers overlook: a window is a light source and can
    be filtered like any other, which motion picture and video photographers do routinely.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: colour
  requires_application: true
  support: 'Ch. 10, ''Filtering Daylight'', which sets out both strategies and the intensity argument
    for choosing between them.

    '
  confounders:
  - choosing on colour accuracy alone, where the two strategies are equivalent
  - gelling the lamps because they are the controllable elements
  - raising ISO or opening up instead, which does not address the ratio between the two sources
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0059
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 5 'Revealing Shape and Contour', section 'Light above the Subject'; Ch. 9, 'Using
    a Mirror Background'
  question: 'Two arrangements in this book leave a subject with no ground shadow at all. Why does the
    book treat that as a serious loss, and which of the two offers no way back?

    '
  answer: 'Because the shadow carries information the picture cannot do without: it proves the subject
    is sitting on a surface rather than floating above it, and the relationship of the subject to the
    background is an essential part of the depth message. That is why the book relocates a competing shadow
    instead of softening it out of existence — the only way to stop it drawing the eye would be to soften
    it so much that it would not exist at all, and then the brain has no way of knowing where the subject
    is. The two shadowless arrangements in the extremes chapter differ. A translucent white background
    lit from behind erases the shadow, but the loss is recoverable and in fact becomes an advantage: the
    shadow can be manufactured by tracing a test light''s cast shadow, cutting it out and gluing it under
    the panel. A mirror background offers no way back — the authors say plainly that there is no way to
    obtain a ground shadow with that set-up, and that if the shadow is necessary for the subject, some
    other arrangement will be better.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 5, ''Light on the Side'' and ''Light above the Subject'' for why the shadow must be kept;
    Ch. 9, ''Using a Translucent White Background'' and ''Using a Mirror Background'' for the two shadowless
    cases.

    '
  confounders:
  - treating the ground shadow as decorative
  - assuming the manufactured-shadow trick can be applied to the mirror background too
  - softening a competing shadow to nothing, which is the move the source rejects
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0060
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 4 'Surface Appearances', opening argument
  question: 'The book opens the surface chapters with a claim about human vision rather than about light.
    What is it, what does the book decline to explain, and why does it matter to a photographer?

    '
  answer: 'The claim is that the brain edits a live scene and cannot edit a picture of one to the same
    degree. Every surface produces some mixture of the three reflection types, but a person standing in
    the room is not conscious of all of it: the brain suppresses reflection that is distracting or trivial
    and promotes whatever is needed to comprehend the scene, so the psychological image differs from the
    optical one. That editing does not survive into a photograph, which is why photographers discover
    defects in their images that they could not see at all when carefully examining the original scene.
    The authors explicitly decline to explain WHY pictures reveal what the scene conceals — they call
    it a question for another book, note that psychologists have not completely explained it, and say
    movement is part of it but not all. It matters because it sets the photographer''s job: to perform
    consciously, at the set, the editing that an observer of the scene performs unconsciously.

    '
  answer_type: source_position
  difficulty: easy
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'Ch. 4, the chapter opening, before ''Photographer as an Editor''. The claim is asserted from
    practitioner experience of spotting defects in images, not from a study the source cites.

    '
  confounders:
  - reading it as a claim about camera limitations rather than about perception
  - assuming the source explains the mechanism; it deliberately does not
  - treating checking the scene carefully as sufficient, which is exactly what the source says fails
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0061
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', section 'Keeping the Metal Bright'; and 'Flat Metal'
  question: 'A large fill light is added well outside the family of angles to lift a polished steel subject
    that is reading too dark. Nothing happens. Why, and what does that fact buy you elsewhere in the scene?

    '
  answer: 'Because polished metal produces almost no diffuse reflection, light coming from any angle other
    than inside the family of angles has practically no effect on it, regardless of how bright the light
    is or how long the exposure. The family is a hard boundary rather than a matter of degree. What that
    buys is the cleanest separation of controls in the book: everything outside the family acts only on
    the rest of the scene, so the metal''s tone can be set entirely by what occupies the family while
    the background is set independently. It also produces a practical trap the authors flag: the large
    white target used to FIND the family must be removed before shooting dark metal, because left in place
    it reflects the general illumination and quietly becomes an additional source inside the family.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: product_photography
  requires_application: true
  support: 'Ch. 6, ''Keeping the Metal Bright'' for the statement about off-family light, ''Keeping the
    Metal Dark'' for the test-surface warning. The spatula photographed from outside the family records
    as solid black on white paper.

    '
  confounders:
  - adding more power, which the source says makes no difference
  - lengthening the exposure, which the source names explicitly as also making no difference
  - assuming a dulling-sprayed or brushed surface behaves the same way; adding diffuse reflection is exactly
    what breaks this
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_lsmx_0062
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', section 'Recognizing the Principal Subject'
  question: 'The glass chapter ends by refusing to say when to use bright field and when to use dark field.
    What reason does it give, and what does it claim the chapter was actually for?

    '
  answer: 'It refuses because the nature of the subject determines the best lighting, and deciding which
    subject is more important is the first step in lighting any scene containing both glass and non-glass
    — a decision the authors say cannot be made on a purely technical basis. They put it bluntly: they
    might light two identical scenes differently depending on the intended picture caption, on who is
    paying the bill, or on personal whim. As for what the chapter was for, they say seeing how light behaves
    matters more than the mere ability to make a routine glassware shot look professional, and that they
    devote a whole chapter to glass because generations of photographers have found it one of the classic
    subjects that helps us learn to see. The methods are a vehicle; the editorial decision that selects
    between them belongs to the photographer and the client.

    '
  answer_type: source_position
  difficulty: easy
  knowledge_type: creative_process
  requires_application: false
  support: 'Ch. 7, ''Recognizing the Principal Subject'', the closing section of the chapter.

    '
  confounders:
  - expecting a decision rule the source explicitly declines to give
  - reading 'personal whim' as carelessness rather than as the authors' point that the choice is not technical
  - assuming the technical material is therefore optional; the source's claim is that the physics constrains
    without deciding
  requires_application_canon013: false
  source_status: hold
