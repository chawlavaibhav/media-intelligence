- qa_id: qa_lsmx_0024
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 6 'Metal', sections 'Photograph the Metal at an Angle' and 'Retouch the Reflection'
  question: 'Two of the four remedies for a camera reflecting in flat metal are not lighting solutions
    at all. Compare them on the terms the book uses.

    '
  answer: 'Shooting the metal at an angle and correcting the geometry afterwards always results in some
    quality loss, and it requires composing with generous extra space because the trapezoidal projection
    has to be cropped to a rectangle; the authors call it a bad remedy that may be better than no remedy,
    to keep in mind if circumstances force it. Retouching the reflection out — shooting straight on, letting
    the camera reflect, and removing it afterwards — loses no image quality at all, and they say that
    for some subjects, especially large ones, it is so much easier than any lighting solution that it
    should not be forgotten. Their comparison is explicitly economic rather than optical: spending half
    a day lighting instead of half an hour at a computer makes no sense. They flag that it is not a lighting
    solution and decline to discuss it in detail, but they do not discourage it.

    '
  answer_type: comparison
  difficulty: easy
  knowledge_type: production_reasoning
  requires_application: false
  support: 'Ch. 6, ''Keeping the Metal Square'', the third and fourth sub-sections.

    '
  confounders:
  - assuming a lighting book will always prefer the lighting answer
  - 'conflating the two: one loses quality, the other explicitly does not'
  - reading the view-camera solution as equivalent; the source calls that the best solution and these
    the fallbacks
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0025
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 9 'The Extremes', sections 'White-on-White' and 'Lighting Black-on-Black Scenes'
  question: 'Both extremes are described as mirror images of each other. On the availability of direct
    reflection they are not symmetrical in the obvious way. Explain what actually differs.

    '
  answer: 'The asymmetry is in visibility, not in production. White-on-white scenes generally have as
    much direct reflection as any other scene; white subjects do not produce less of it. What happens
    is that their diffuse reflection is bright enough to overpower it, so the camera cannot see much direct
    reflection and manipulating it accomplishes little — which is why the white case is deprived of one
    of the book''s favourite tools. Black subjects likewise do not produce any MORE direct reflection
    than others; theirs is simply more visible because it faces less competition from diffuse reflection.
    So the black case gets the tool back, and the authors'' rule of thumb follows: light black-on-black
    as if it were metal, regardless of the actual material — find the family of angles and fill it.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: lighting
  requires_application: false
  support: 'Ch. 9, the opening of ''White-on-White'' and the corresponding paragraphs of ''Lighting Black-on-Black
    Scenes''. The underlying mechanism — that visibility of the direct component is set by its ratio to
    the diffuse one — is chapter-3 material and already live Canon.

    '
  confounders:
  - 'the natural but wrong reading: white things reflect diffusely, black things reflect directly'
  - assuming the two cases are handled by inverting the same technique
  - forgetting the practical consequence, which is that the black case can borrow the metal chapter wholesale
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_lsmx_0026
  source_id: light-science-magic-beyond-ch3
  source_title: 'Fil Hunter, Steven Biver & Paul Fuqua, Light: Science & Magic, 5th Edition (Focal Press),
    chapters beyond ch. 3'
  source_locator: Ch. 7 'The Case of the Disappearing Glass', sections 'Defining the Surface of Glassware'
    and 'Position the Light'
  question: 'Compare a small bright highlight and a large dim one on the surface of a glass. What does
    the book say each does for the viewer, and what sets the difference in practice?

    '
  answer: 'They do opposite jobs. The tiny bright spots are distracting at the least and meaningless at
    best: they are too small and too bright to tell the viewer anything about surface detail or texture.
    A large highlight informs — it serves the constructive purpose of saying how the glass surface looks
    and feels. In practice the difference is set by how much of the relevant family of angles is filled
    with light, and, with a diffusion sheet, by the distance from the lamp head to the sheet: close in,
    only the centre of the sheet lights and the highlight is small and bright; pulled back, the whole
    sheet lights and reflects as a larger highlight. The authors add that the larger highlight should
    usually be kept dimmer, because a brightly lit whole sheet reflects as an obvious hard-edged rectangle
    that advertises a studio light and costs the scene its reality — and that strips of black tape on
    the sheet can make the reflection read as a window instead.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: product_photography
  requires_application: false
  support: 'Ch. 7, ''Defining the Surface of Glassware'', including the two matched highlight frames and
    the taped diffusion sheet.

    '
  confounders:
  - assuming brighter highlights read as more premium or more glossy
  - attributing the difference to the size of the source alone, ignoring the lamp-to-diffuser distance
  - missing that the source deliberately makes the large highlight dimmer, not brighter
  requires_application_canon013: false
