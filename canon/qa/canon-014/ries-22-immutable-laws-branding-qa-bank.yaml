qa_items:
- qa_id: qa_r22_0001
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. xi-xii (Introduction, the passage beginning 'Some managers believe that
    brands possess unique identities')
  question: 'Ries and Ries reject the whole vocabulary of brand architecture — flanker brands, megabrands,
    subbrands, model names. What test do they apply to reach that conclusion, and what definition of a
    brand do they put in its place?

    '
  answer: 'Their test is conversational: they ask the reader to imagine a customer saying to a friend
    "what do you think of this new flanker brand?" and answering "not much, I stick with megabrands or
    subbrands". Since nobody talks or thinks that way, they conclude the distinctions have no existence
    in the only place they regard as real — the prospect''s mind — and that on paper there is no difference
    between a company name, a product name and a brand name. In their place they put a definition with
    no hierarchy in it at all: a brand name is a word in the mind, specifically a proper noun, and any
    and every proper noun is a brand. That deliberately extends beyond registered trademarks to places
    (Philadelphia the cheese and the city, Patagonia the clothing and the region) and to people. They
    separately insist a brand name on a package is not the same thing as a brand name in a mind, since
    the same shopper may buy milk and bread as commodities and beer and cigarettes by brand on one trip.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'The authors'' own definition and the argument they use to reach it, printed pp. xi-xii. The
    entire support is the observation that customers do not say the words; no evidence is offered that
    customers cannot hold hierarchical structures.

    '
  confounders:
  - reading this as a claim that brand architecture never affects behaviour; their argument is narrower
    — the vocabulary is not spoken, so they treat it as an internal fiction
  - the modern brand-equity tradition, which treats a brand as a bundle of associations, awareness and
    perceived quality; that is not this definition
  - assuming they mean the legal trademark; they explicitly say brands are not limited to the 2.5 million
    registered US trademarks
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_r22_0002
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. ix-x (Introduction, 'the difference between selling and branding')
  question: 'The Introduction says you could sell a hundred-dollar Rolex and sell millions of them. Why
    do the authors treat that as an argument against doing it, and what general distinction is the example
    carrying?

    '
  answer: 'Because they separate selling from branding and hold that the two can point in opposite directions.
    Selling millions of cheap Rolexes would increase sales of Rolex watches in the short term and, they
    say, ultimately kill the expensive Rolex brand — a cheap Rolex destroys what the name means. The general
    distinction is that conventional marketing strategies, specifically expansion and line extension,
    can increase sales in the short term while in the long run undermining the power of the brand and
    decreasing sales. Behind it sits their claim that successful branding rests on singularity, which
    is also why they say no brand can have universal appeal: broadening the base, widening the appeal
    and extending the line are the same forces that increase share and undermine the brand.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: 'The authors'' framing of the book''s central trade-off, printed pp. ix-x. Practitioner assertion.
    No time horizon is specified anywhere for when the reversal is supposed to occur, and no case is measured.

    '
  confounders:
  - reading it as an argument about product quality; the objection is to what a cheap Rolex does to the
    name, not to the watch
  - the price-tiering practice of running a premium line and an accessible line under separate sub-labels,
    which is the very move the book's Law of Subbrands condemns
  - assuming they deny the short-term sales gain; they concede it explicitly and locate the whole disagreement
    in the later half of the curve
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0003
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. xiv-xv (Introduction, the dotcom failure list) and p. xiv ('all the laws
    of branding apply equally to the Internet')
  question: 'A colleague says the book proves its case because it can explain every dotcom failure. Using
    only what the Introduction actually does, explain why that is not a strength, and identify the one
    thing the book never supplies that would be needed to test any of its laws.

    '
  answer: 'The Introduction assigns each named failure to the violation of a specific numbered law — the
    retailer dotcoms to the Law of Either/Or, the common-name dotcoms to the Law of the Common Name, the
    give-it-away sites to the Law of Advertising — and assigns the successes to "good branding". Because
    a law can be found for any outcome after that outcome is known, no case in the book is capable of
    counting against a law; the explanatory success is a property of the method, not evidence for the
    laws. The missing thing is a base rate. The reader is never told how many focused brands were launched,
    how many extensions were launched, or what proportion of each survived, so the frequency with which
    following or breaking a law is followed by success cannot be assessed at all. Note that the same passage
    also asserts the laws apply equally to the Internet and the real world, which removes the last place
    an exception could have been located.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: true
  support: 'The Introduction''s own method, printed pp. xiv-xv. The observation that this makes the laws
    untestable is the extractor''s, recorded as such in sk_r22_0004 and PROVENANCE.md §6; the material
    it rests on is entirely the authors'' own text.

    '
  confounders:
  - concluding the laws are therefore false; nothing here shows that, only that this book supplies no
    test of them
  - treating the volume of examples as evidence — the book has many cases and no comparison group, which
    is a different thing
  - assuming the authors would disagree; they do concede elsewhere that nothing in branding is absolute
    (printed p. 101), but they never withdraw the post-hoc attribution
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0004
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 3, 6-7 (Ch. 1, 'The Law of Expansion')
  question: 'State the Law of Expansion in the authors'' own terms, and then explain the distinction they
    draw in the same chapter that stops market-share numbers from settling the question either way.

    '
  answer: 'The law is "the power of a brand is inversely proportional to its scope" — put the name on
    everything and the name loses its power. The distinction is between a brand''s power and its sales.
    Sales, they say, are a function not only of a brand''s power but of the strength or weakness of its
    competition, so if the competition is weak or non-existent you can often increase sales by weakening
    your brand, that is by extending it. A share gain following an extension therefore demonstrates only
    the weakness of the competitor, on their account. Their worked instance is Diet Coke: Coca-Cola had
    nothing to lose because Pepsi had already line-extended into Diet Pepsi. The practical consequence
    is that neither a rise nor a fall in share can settle whether the law held in a given case.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: 'Printed p. 3 for the law, pp. 6-7 for the power/sales distinction and the Diet Coke case.
    The authors state the distinction themselves; the observation that it makes the law hard to disconfirm
    is the extractor''s (sk_r22_0007).

    '
  confounders:
  - reading 'inversely proportional' as a quantity; nothing is computed anywhere in the book, and the
    phrase is rhetorical
  - assuming the American Express and Levi's share falls prove the law — they are two-number pairs with
    no comparison group, and the authors' own distinction says share cannot prove it
  - the portfolio-theory reading that more SKUs capture more shelf and more occasions, which is the position
    the chapter is arguing against
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0005
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 5-6 (Ch. 1, the teeter-totter passage)
  question: 'A car company argues that its parent name is a megabrand and its model names are the brands
    beneath it. What is the authors'' specific objection to that structure, and what image do they use
    to make it?

    '
  answer: 'Their objection is that people assign exactly one name to each product, and they choose the
    name that best captures its essence — sometimes the parent name, sometimes the model name, sometimes
    a nickname — and are not consistent about which. The hierarchy therefore does not survive contact
    with a customer. Their image is a teeter-totter: thousands of tiny ones in the consumer''s mind, and
    like real ones both sides cannot be up at once. On the Chevrolet/Lumina teeter-totter the Chevrolet
    side is up, so the owner says "I drive a Chevrolet"; on the Chevrolet/Corvette one the Corvette side
    is up, so the owner says "I drive a Vette". Which end rises is not the marketer''s choice. They add
    that customers want brands that are narrow in scope and distinguishable by a single word, the shorter
    the better.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 5-6. The mechanism is the authors'' own image; the supporting dialogue is invented
    by them, and no observation of actual customers is reported anywhere in the passage.

    '
  confounders:
  - assuming they say hierarchies confuse people; their claim is stronger and stranger — the hierarchy
    simply collapses to one name, and the marketer does not control which
  - the house-of-brands / branded-house distinction from later brand-architecture literature, which is
    not the frame here
  - reading the Corvette case as an exception to the law; the authors use it as an illustration of the
    teeter-totter, not as a licensed extension
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0006
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 10 (Ch. 2, 'The Law of Contraction', the five-step pattern)
  question: 'Give the five steps the authors say most retail category killers follow, in their order.
    Then identify the tension that steps 2 and 5 create with step 1 — a tension the book does not address.

    '
  answer: 'Narrow the focus; stock in depth; buy cheap; sell cheap; dominate the category. The authors
    chain them causally: narrowing permits depth, depth permits buying power, buying power permits low
    prices at maintained margin, and the result is domination, which they call the ultimate objective
    of any branding programme. The tension is that steps 2 and 5 are both expansions. Step 2 widens assortment
    inside the narrowed category — a Toys "R" Us store carrying ten thousand toys against a department
    store''s three thousand — and step 5 enlarges the brand''s share of it, with Microsoft at 95 per cent,
    Intel at 80 and Coca-Cola at 70 cited approvingly on the following page. So the brand contracts what
    it is about while expanding what it carries and how much of the category it takes, and the book never
    says where narrowing stops and depth begins. The domination figures also sit against the roughly 50
    per cent ceiling the same authors state twice later.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: 'Printed p. 10 for the five steps and the Toys "R" Us figures, pp. 10-11 for the domination
    percentages. The steps are the authors''; identifying the tension is the extractor''s reading, recorded
    in sk_r22_0010 and scs_r22_001 and checkable against those pages.

    '
  confounders:
  - resolving the tension by saying narrowing applies to category and depth to assortment — that is a
    plausible reading, but the authors do not make it and supply no boundary
  - assuming steps 3 and 4 are supported by figures; no retail economics of any kind appear in the chapter
  - treating the pattern as descriptive of all retail; the authors restrict it to 'most retail category
    killers'
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0007
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 11-12 (Ch. 2, the passage beginning 'let's say that you want to be rich')
  question: 'A founder wants to imitate the market leader in her category and points out that the leader
    has just launched into three adjacent categories. Apply the authors'' diagnostic from Chapter 2 to
    her reasoning, and state the correction they would make.

    '
  answer: 'They would say she is observing at the wrong point in the leader''s history. Their diagnostic
    is that people look at currently successful companies, see them expanding, and infer that expansion
    causes success — inverting the order, since the expansion is a consequence of success and not its
    cause. Their analogy is personal wealth: buying an expensive house, a Rolls-Royce and a Rolex will
    not make you rich and is likely to make you poor, because those are things rich people do after becoming
    rich. The correction is to look at what the leader did before it led. Their cases are Domino''s, Little
    Caesars and Papa John''s, each of which sold a wider menu at the outset — Papa John''s sold cheesesteaks,
    submarines, fried mushrooms, fried zucchini, salads and onion rings alongside pizza — and each of
    which narrowed. Note the analogy cuts against the book''s own method too, since its evidence is overwhelmingly
    companies observed after success.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 11-12. An argument by analogy; the authors do not establish that their example
    companies'' early behaviour was in fact narrowing rather than something else.

    '
  confounders:
  - the competitive-benchmarking default of studying what leaders currently do, which is exactly the error
    the passage names
  - concluding that a leader's expansion is always a mistake; the chapter's claim here is only about what
    a follower should imitate
  - reading the wealth analogy as evidence; it is an analogy, and the chapter offers nothing else
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0008
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 11 (Ch. 2, the parenthesis on Starbucks) with pp. 8, 13 (Starbucks as an
    exemplar)
  question: 'Starbucks is one of the book''s showcase cases for the Law of Contraction and again for the
    Law of Publicity. What does the same book note about Starbucks in passing, and why does that note
    matter to a reader assessing the Law of Contraction?

    '
  answer: 'In the middle of arguing that marketers wrongly copy what successful companies currently do,
    the authors note parenthetically that Starbucks "currently is busy getting into everything from ice
    cream to bottled drinks to tea". By their own Law of Expansion that is a brand widening its scope,
    and the note appears in the very chapter in which Starbucks stands as the demonstration of narrowing.
    The authors do not treat it as bearing on the law and do not return to it. It matters because the
    book''s central case is presented in a snapshot: the narrowing is credited for the success, and the
    subsequent broadening — which on the book''s own account should weaken the brand — is mentioned and
    dropped. A reader has no way to tell from this text whether contraction or something else produced
    the outcome being celebrated.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed p. 11 for the parenthesis; pp. 8-9 and 13 for Starbucks as exemplar of contraction
    and of publicity. The observation that the parenthesis undercuts the exemplar is the extractor''s,
    recorded as a caveat on sk_r22_0009.

    '
  confounders:
  - answering with what happened to Starbucks afterwards — that is outside this copy and this bank deliberately
    records nothing about it
  - assuming the authors retract the example; they do not, and the parenthesis is not presented as a qualification
  - reading this as the book conceding an exception; it is an unremarked inconsistency, not a stated exception
    like the Law of Change
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0009
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 13-16 (Ch. 3, 'The Law of Publicity') and p. 19 (Ch. 4)
  question: 'The Law of Publicity and the Law of Advertising appear to contradict each other. Explain
    how the authors reconcile them, including the specific sentence that states the relation and the reason
    they give for the transition.

    '
  answer: 'They are not alternatives but phases of one sequence, and the reconciling sentence is "first
    publicity, then advertising is the general rule" (printed p. 19). The distinction underneath it is
    between brand building and brand maintenance: advertising will generally not get a new brand off the
    ground, but a hefty budget may be needed to maintain an established one. The transition is caused,
    on their account, by publicity potential being finite and consumed in two phases — first the introduction
    of the new category, then the rise of the company that pioneered it. Once both stories have been told
    there is no news story left, so advertising takes over. Their illustration is Xerox: hundreds of articles
    on the 914 copier and the new category, then hundreds on the rise of the company from the ashes of
    Haloid, and after that nothing left to report.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: media_planning
  requires_application: false
  support: 'Printed pp. 13-14 for the building/maintenance split, pp. 18-19 for the two phases and the
    sequence sentence. Practitioner assertion with a stated mechanism; no measurement of either channel
    appears anywhere in the book.

    '
  confounders:
  - treating this as an integrated-communications point about channel mix; the authors' claim is a hard
    sequence with a stated cause, not a blend
  - assuming publicity is recommended because it is cheaper; their stated reason is credibility — what
    others say outweighs what you say
  - reading 'brands are born, not made' as being about product quality; it is about coverage potential
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0010
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 18-19, 21 (Ch. 4, 'The Law of Advertising')
  question: 'How do the authors tell a market leader to think about its advertising budget, and what do
    they say the budget actually buys? Quote the analogy they use.

    '
  answer: 'They tell leaders not to think of advertising as an investment that will pay dividends but
    as insurance protecting against losses caused by competitive attack. Their analogy is a national defence
    budget: "your advertising budget is like a country''s defense budget" — the tanks, planes and missiles
    buy nothing, they only keep the country from being overrun. What the money buys, on their account,
    is a raised price of admission: heavy spending forces any challenger to spend heavily too, which they
    say many competitors cannot afford and those who can will not bother, settling instead for crumbs.
    They go further and concede that advertising may not pay for itself, adding that if you are the leader
    it will at least make your competitor pay through the nose for the privilege of competing with you.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: 'Printed pp. 18-19 and 21. This is a practitioner position stated without any return figure;
    no calculation of advertising''s effect appears anywhere in the book.

    '
  confounders:
  - the effectiveness tradition's treatment of advertising as an investment with a measurable return and
    an optimal share of voice — this passage is the direct opposite of that position, and the book supplies
    no measurement on either side
  - assuming they recommend cutting advertising; they recommend massive spending, but for deterrence rather
    than return
  - reading it as advice for challengers; it is explicitly advice for leaders, and the chapter says advertising
    will not build a fledgling brand
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0011
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 19-21 (Ch. 4, 'what should a brand leader advertise?')
  question: 'The authors say a leader should advertise its leadership rather than its superiority. Set
    out the loop they describe, and explain why they say leadership claims are nevertheless rare.

    '
  answer: 'The loop: everyone believes the better product wins in the marketplace; most people want the
    better product, so most people buy the leading brand; buying it keeps it the leader; and its leadership
    sustains the perception that it is better. The claims land differently for that reason — "our product
    is better" gets the response "that''s what they all say", while "our product is the leader" gets "it
    must be better". Leadership is the one premise a prospect will accept on the advertiser''s word, because
    it is a fact about the market rather than a claim about the product. Such claims are rare, they say,
    because companies do consumer research and customers insist they would never buy a brand just because
    it leads, going out of their way to deny it and saying instead that they buy it because it is better.
    The authors treat the stated reason as unreliable and the circle as real; they also root the whole
    inference in an American belief that the better product always wins.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed pp. 19-21. The consumer''s inner responses are supplied by the authors as invented
    dialogue, and no test of the two claim types against each other is reported.

    '
  confounders:
  - treating this as social-proof psychology with an evidence base; the passage cites none
  - assuming the research finding refutes them; the argument is constructed so that a customer denial
    confirms the position, which means survey evidence cannot count against it
  - reading 'leadership' as category leadership only; the neighbouring chapter shows the authors will
    define a category narrowly enough to make the claim true
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0012
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 14 (Ch. 3, the Miller Regular case)
  question: 'Miller spent $50 million launching a beer called Miller Regular and the brand failed. The
    authors use this case to carry two separate claims at once. Name both, and explain why that weakens
    the case as evidence for either.

    '
  answer: 'The first claim is that advertising cannot build a new brand — fifty million dollars produced
    almost no perceptions among beer drinkers and very little sales, and they add that better, fresher
    creative work would not have built it either. The second is that a line-extended name has no publicity
    potential: there is, they say, no publicity potential in a regular beer with a line-extended name
    like Miller. The case cannot discriminate between the two, because both conditions held simultaneously
    in it. If the failure was caused by the name, it says nothing about advertising''s power to build
    brands with good names; if it was caused by the spending being on the wrong channel, it says nothing
    about line-extended names. The book presents no case that separates them, and no brand that advertised
    heavily at launch and succeeded is examined anywhere in the chapter.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: true
  support: 'Printed p. 14. The two claims are the authors''; the observation that the single case cannot
    separate them is the extractor''s, recorded as a caveat on sk_r22_0012.

    '
  confounders:
  - accepting the case as evidence for the Law of Publicity because the numbers are large; the size of
    the spend does not create a comparison group
  - assuming the authors acknowledge the confound; they do not, and they use the case for both purposes
    on the same page
  - supposing a third cause is offered — the chapter considers no alternative explanation for the failure
    at all
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0013
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 14-15 (Ch. 3, 'the best way to generate publicity is by being first')
  question: 'A client has a genuinely better version of an existing product and wants a publicity campaign
    built on that superiority. What would this book tell them to do instead, and what is the stated reason?

    '
  answer: 'It would tell them to stop announcing a product and announce a category. The authors'' rule
    is that the best way to generate publicity is by being first — the first brand in a new category —
    and the reason they give is about what news organisations want: the media want to talk about what
    is new, what is first and what is hot, not what is better. "Better" is not a story because every brand
    claims it; "first" is a story because it can only be told once. So the client''s superiority is, in
    this frame, unusable as a publicity asset, and the move is to define a category narrow enough that
    the product is first into it, and then launch on that. Their own consulting case is Lotus Notes, positioned
    as "the first successful groupware product" with the emphasis on the category word, which they say
    the press took up while Lotus''s own advertising ignored the idea.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 14-15 for the rule and its stated reason, p. 17 for the Lotus Notes case. The
    supporting material is a list of twenty-one brands the authors say were first in their category —
    all of them successes, with no first-but-failed brand anywhere in the chapter.

    '
  confounders:
  - recommending a comparative campaign, which is what the passage is arguing against
  - assuming 'first' means first to exist; the authors mean first into a category as the brand defines
    it, and the neighbouring chapter shows they will define categories narrowly to achieve that
  - treating the list of firsts as evidence that being first causes success; every brand on it succeeded,
    which is how it was assembled
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0014
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 26 (Ch. 5, 'The Law of the Word', the sacrifice passage)
  question: 'What argument do the authors give for why a brand cannot own more than one word, and what
    is the problem with the two quantities they compare?

    '
  answer: 'They give a capacity argument. The average adult knows the meanings of perhaps fifty thousand
    words, while about two and a half million trademarks are registered in the United States, and from
    that they conclude it is a physical impossibility for most brands to go beyond a single word — a limit
    they say could only be lifted if science replaced brain tissue with silicon chips. The practical instruction
    that follows is sacrifice: discard the laundry list of attributes and keep one that nobody else already
    owns in the category. The problem is that the two figures are not comparable quantities. One is an
    individual person''s vocabulary; the other is a national register of legal marks, the overwhelming
    majority of which no individual will ever encounter. Nothing follows from their ratio about how many
    attributes a mind can attach to a name, and no cognitive evidence of any kind is cited in the chapter.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed p. 26. The argument is the authors''; the objection to the comparison is the extractor''s,
    recorded as a caveat on sk_r22_0018.

    '
  confounders:
  - reading it as an application of cognitive load or memory research; no such research is cited and the
    chapter has no account of memory beyond the assertion
  - assuming 'physical impossibility' is meant loosely; the authors state it as a physical limit and reach
    for silicon to escape it
  - supposing the one-word rule is about slogans; it is about a single attribute a brand owns in a category
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0015
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 24 (Ch. 5, 'you can't become generic by overtaking the leader')
  question: 'A challenger brand outsells the category leader and its marketing director expects the brand
    name to become the generic term for the category. What boundary condition do the authors state, and
    what test do they give for whether a brand has actually got there?

    '
  answer: 'The boundary is absolute in their statement of it: you cannot become generic by overtaking
    the leader. A brand can own the category word only by having been the first brand and having established
    the category, and they say Pepsi would not become generic for cola even if it outsold Coke — noting
    that it once did outsell it in the supermarket distribution channel. Their test for whether a brand
    has the generic position is ordinary speech: people asking for a Xerox copy, a Q-Tip, Reynolds Wrap,
    Scotch tape, or asking someone to hand them a Kleenex while looking at a box of Scott tissue. The
    remedy they offer a brand that was not first is not to push harder on volume but to create a new category
    by narrowing the focus, and own the word there instead.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed p. 24 for the boundary and the speech test, pp. 24-25 for the narrowing remedy and
    the Federal Express illustration. No mechanism is given for why priority rather than usage fixes the
    generic term; the rule is stated and illustrated.

    '
  confounders:
  - the trademark-law worry about genericide, which is a different concern — the authors treat generic
    status as an asset, not a risk
  - assuming heavy advertising can buy the position; the chapter's whole point is that it cannot be bought
    after the fact
  - confusing owning the category word with owning an attribute word — the authors treat Kleenex (category)
    and Prego's 'thick' (attribute) as two different routes
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0016
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 26-28 (Ch. 5, 'what works is not expanding the brand, but expanding the
    market')
  question: 'A brand owns a single narrow word and the board demands growth. What do the authors offer
    as the alternative to broadening the brand, and what mechanism do they say makes it work?

    '
  answer: 'Expand the market rather than the brand: grow demand for the narrow thing the brand already
    owns instead of attaching the name to adjacent things. Their mechanism is that the brand''s narrowness
    is itself what makes the category desirable. Because Federal Express stood only for overnight delivery,
    a package arriving by it signalled that the contents were important — "hey, this package must be important
    because it came via Federal Express" — and that made overnight the in thing among executives, which
    grew the whole category. Mercedes is their second case: it built the market for expensive cars by
    pricing at about twice a comparable Cadillac and giving buyers an engineering claim as the excuse
    to buy one. Their closing instruction is to stop asking what percentage of an existing market the
    brand can take and ask instead how large a market it can create by narrowing and owning a word.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 26-28. Practitioner assertion with a stated mechanism. The counterfactual — that
    FedEx would have grown more by staying narrow — cannot be checked against anything in the book, and
    no market size before or after is given in any of the four "what was the market before X?" passages.

    '
  confounders:
  - reading 'expand the market' as reaching more buyer segments with a broader offer, which is the opposite
    of the recommendation
  - assuming the authors think FedEx's expansion damaged the company; they say explicitly it hurts the
    brand and may not hurt the company, so long as no competitor narrows against it
  - treating category expansion and brand expansion as the same thing — the whole passage rests on separating
    them
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0017
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 27 (Ch. 5, the two-part prestige procedure)
  question: 'The authors say a brand cannot simply claim prestige. Give their two-part procedure for building
    a prestige position, and the reason they give for the second part.

    '
  answer: 'First, make the product or service more expensive than the competition. Second, find a code
    word for prestige. The reason for the second part is a social one: the connotations of prestige work
    in brand building but the word itself does not, because it is not that people are not dying to own
    prestige brands — they just hate to admit it. The code word supplies a defensible reason for a purchase
    actually made on another one. Their case is Mercedes-Benz, priced at about twice a comparable Cadillac,
    with "engineered like no other car in the world" as the code; the price itself does work too, since
    the buyer infers that a car costing twice as much must be better. They note the same structure did
    for Mercedes what "overnight" did for Federal Express: it expanded the market by giving the owner
    an excuse to buy.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: 'Printed p. 27. Practitioner assertion; the claim about what buyers will and will not admit
    is stated, not measured. The authors themselves record on the following page that Mercedes has since
    moved into cheaper cars and is not the largest-selling luxury car in America.

    '
  confounders:
  - assuming high price alone is the recommendation; the code word is the half the authors say is hard
  - reading the code word as a euphemism for quality; it is a substitute justification, and the passage
    is explicit that the real motive is social
  - treating this as a general pricing rule; it is specific to prestige as the target attribute
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0018
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 29-31 (Ch. 6, 'The Law of Credentials')
  question: 'What do the authors mean by credentials, what problem do credentials solve, and what do they
    say happens to benefit claims that lack them?

    '
  answer: 'Credentials are the collateral a brand puts up to guarantee its own performance — most often
    a claim to authenticity or to leadership. The problem they solve is disbelief: customers are suspicious
    and discount most product claims, so a brand needs one claim that takes precedence over the others
    and makes them believable. Where the credentials are right, they say, the prospect will believe almost
    anything else the brand says. Benefit claims without credentials fall into an undifferentiated mass
    — tastes great, saves money, whitens teeth, bigger, smaller, lighter, faster, cheaper — which prospects
    meet with "that''s what they all say" and generally ignore. Structure the same benefits around a credential
    and they carry much more weight: if Act claims to cut your paperwork in half you tend to believe it,
    because Act is the largest-selling contact software.

    '
  answer_type: concept_understanding
  difficulty: easy
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed pp. 29-31. The universal form of the claim — "the crucial ingredient in the success
    of any brand" — is demonstrated by one advertising line and two of the authors'' own client cases,
    reported by them with the figures they chose to report.

    '
  confounders:
  - confusing credentials with proof; the authors' credential is a market fact like leadership, not evidence
    about performance
  - assuming credentials mean testimonials or certifications; neither appears in the chapter
  - reading 'authenticity' in the later sense of brand origin storytelling; here it means the claim to
    be the real thing as against imitators
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_r22_0019
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 31-33 (Ch. 6, the Datastream case and 'never forget leadership')
  question: 'A company leads a market that is currently tiny and its board wants to drop leadership messaging
    and sell the benefits of the category instead. Apply the authors'' position, including what they say
    about the sophisticated customers such a strategy will lose.

    '
  answer: 'They would keep the leadership claim and reject the board''s reasoning, which they state and
    dismiss in the chapter: the market is small, nobody cares that we lead, forget leadership and concentrate
    on selling the category''s benefits. Their answer is never to forget leadership no matter how small
    the market, because a leadership position is hard to lose once held and because new prospects in a
    young category have no experience of it and gravitate to the leading brand — and one should never
    assume people know which brand leads. Their case is Datastream, which held 32 per cent of a very,
    very small maintenance-software market, promoted itself as the leader in all its literature, and still
    dominated once the market grew. On the sophisticated customers: they say that as a category matures
    the more adventurous buyers go out of their way not to buy the leader, and the instruction is blunt
    — write them off, you cannot appeal to everybody.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 31-33. The durability claim rests on "a widely publicized study of twenty-five
    leading brands . . . in the year 1923" with no author, title or method given — a third-party figure
    reported second-hand, not a measurement made by this book.

    '
  confounders:
  - the category-education strategy of selling the category first in a new market, which is what the board
    proposes and what Chapter 8 recommends for a leader — the two chapters point differently here and
    the book does not reconcile them
  - assuming the small market makes the credential dishonest; the authors treat a true claim about a tiny
    market as fully usable, and say elsewhere they invented categories to create such claims
  - reading 'write them off' as segmentation advice; it is a refusal to chase a segment, which is the
    opposite
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0020
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 35 (Ch. 7, 'The Law of Quality', the Consumer Reports passage)
  question: 'What is the strongest piece of evidence the authors offer for the claim that measured quality
    does not track market success, and what exactly is wrong with it as evidence?

    '
  answer: 'It is a Consumer Reports ranking of sixteen small cars, from which they report that the number-one
    brand in quality was twelfth in sales, the number two was ninth, and the number three was last. Around
    it sits their methodological statement in full: "years of observation have led us to this conclusion".
    What is wrong with the ranking as evidence is that the ranking is undated and unnamed beyond "recent";
    the source of the sales ranking is not given; only three of the sixteen ranked brands are reported,
    and they are precisely the three that make the point; and no statistic of any kind is computed — the
    word "correlation" is used but nothing is calculated. It is the closest thing to a measurement in
    the whole book and it is still a selected illustration rather than a test. The blind taste test comparing
    Coke and Pepsi, cited on the previous page, is reported without any citation at all.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed pp. 34-35. This lane examined the passage specifically as a candidate for `empirical_within_source`
    and rejected it for the reasons above; see PROVENANCE.md §7.

    '
  confounders:
  - treating three reported pairs as a correlation; three points selected to make a point are not a sample
  - assuming the underlying claim is thereby false — it may well be right, and the objection here is only
    that this book supplies no test of it
  - reading 'years of observation' as fieldwork; no method, sample or data set is named anywhere
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0021
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 35-38 (Ch. 7, 'to build a quality brand you need to narrow the focus')
  question: 'If measured quality does not build a brand, what three components do the authors say do build
    a quality perception, and what do they say about the order in which price should be decided?

    '
  answer: 'A narrow focus, a better name and a higher price. Narrowing makes the brand a specialist and
    a specialist is perceived to know more — their analogy is the cardiologist against the general practitioner,
    and they add that from a marketing point of view it does not matter whether the perception is true.
    A better name wins where other factors are equal, and they say being a specialist and having a better
    name go together, since expanding a brand destroys your ability to choose a powerful name. High price
    is treated as a benefit to the customer rather than a cost, because it lets an affluent buyer take
    psychic satisfaction from public consumption — the Rolex wearer is not buying punctuality. On order:
    they invert the conventional sequence. Instead of building quality and pricing to match, deliberately
    start with a higher price and then ask what can be put into the brand to justify it — a bigger and
    heavier watch, an oversized driver, a fatter pen, more butterfat, longer ageing.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 35-38. The authors qualify their own advice on the same page: they say they always
    advise clients to build as much quality into their brands as they can afford, so this is a claim about
    what builds the brand, not a licence to build a worse product.

    '
  confounders:
  - reading this as advice to skimp on the product; the authors explicitly say the opposite in the same
    passage
  - the value-pricing default of matching price to delivered quality — 'quality is job 1' is the position
    the chapter names and rejects
  - assuming the price-first inversion is offered generally; it is offered for a sea of similar products
    at similar prices
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0022
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 36-37 (Ch. 7, the omnibus-brand passage)
  question: 'Very large diversified companies are the obvious objection to the Law of Expansion. How do
    the authors handle that objection, and what does their handling of it cost them?

    '
  answer: 'They separate size from brand strength and say omnibus or mile-wide brands are weak, not strong:
    they look strong because they are well known and have been in business for decades, but where such
    a brand succeeds it is because its competitors are equally broad. Their formulation is that when two
    weak brands compete the winner is a weak brand that happens to be less weak than its rival, and their
    test of real strength is what happens when a broad brand meets a specialist — General Electric losing
    about $300 million in mainframes against IBM, and selling its appliance business to another omnibus
    brand. What it costs them is disconfirmability. This is the third use in the book of the same move:
    a counter-example is re-described as a case of weak competition rather than counted, and the book
    offers no way to establish independently that a set of competitors is weak, so no successful broad
    brand can ever count against the law.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed pp. 36-37. The two GE cases are selected failures; GE''s successful businesses are
    not examined. The observation about disconfirmability is the extractor''s, recorded on sk_r22_0026,
    and the same move appears at printed p. 7 (Diet Coke) and p. 66 (Vaseline Intensive Care).

    '
  confounders:
  - accepting the two GE failures as a test; they are two cases chosen from a company with many businesses
  - assuming the authors deny the sales and profits of these companies; they concede them explicitly and
    relocate the disagreement to what 'strong' means
  - concluding that broad brands must therefore be strong — the passage establishes nothing either way,
    which is the point
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0023
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 39-42 (Ch. 8, 'The Law of the Category')
  question: 'Chapter 8 says a leading brand should promote the category rather than the brand. Set out
    the two things the authors say must be done at once when building a brand in a category that does
    not yet exist, and the reason they give for preferring category promotion.

    '
  answer: 'Launch the brand so as to create the perception that it is the first, the leader, the pioneer
    or the original — they say one of those words should invariably be used — and at the same time promote
    the new category. The reason for preferring the category is a claim about what customers care about:
    customers do not really care about new brands, they care about new categories. They do not care about
    Domino''s, they care about whether the pizza arrives in thirty minutes; not about Callaway, but about
    whether an oversize driver will cut strokes; not about Prince, but about whether an oversize racquet
    improves their game. Promoting the brand alone is easier, they concede, but not as effective. The
    money should go behind the concept so the concept takes off and pulls the brand with it, and while
    that happens the brand name becomes the category word.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 39-42. Practitioner assertion with a stated mechanism; the five "what was the
    market for X before Y? Almost nothing" passages carry no figures at all.

    '
  confounders:
  - reading it as category-development advertising in the usual sense; the authors want the pioneer's
    own budget spent on the category, not a trade body's
  - assuming the advice applies to a follower; it is for the pioneer and the leader of a young category
  - the Apple Newton case is used both as a category-naming failure and as a product failure, and the
    chapter does not separate them
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0024
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 42-43 (Ch. 8, 'the rightful share of a leading brand is never more than
    50 percent')
  question: 'A brand that created a category watches its share fall from 100 per cent to 70 as competitors
    arrive, and its leadership wants to fight them off. What does Chapter 8 tell it to do instead, and
    what number does the chapter attach to its expectations?

    '
  answer: 'It tells the leader to stop fighting competitive brands and start fighting competitive categories
    — take the bus and leave the driving to us, take your meals home and leave the cooking to us. Falling
    share in a growing category is treated as normal, and the number attached is that a leading brand''s
    rightful share is never more than 50 per cent: there is always room for a second brand and a train
    of lesser ones. Beyond that, competition is said to help the pioneer, because rival brands stimulate
    consumer interest in the category even while the leader''s share declines, so the smaller share is
    a share of something larger. Their counter-example is Polaroid, which forced Kodak out of instant
    photography and won a few million in court while removing a competitor that they say could have greatly
    expanded the market.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 42-43. The 50 per cent figure is asserted here and again at p. 60 as "our research
    indicates", with no research reported. It conflicts with the 95, 80 and 70 per cent domination figures
    the same authors cite approvingly at pp. 10-11, and the book does not address the conflict.

    '
  confounders:
  - the defend-share reflex the passage is written against, which is the conventional answer
  - assuming the 50 per cent ceiling is established; it rests on an unreported claim to research and contradicts
    the book's own domination figures
  - the Polaroid case is a counterfactual — that Kodak would have grown the market — and cannot be checked
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0025
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 44-45 (Ch. 9, 'The Law of the Name')
  question: 'What do the authors say a brand needs in the short term as against the long term, and what
    is the argument that gets them from one to the other?

    '
  answer: 'In the short term a brand needs a unique idea or concept: it needs to be first in a new category
    and to own a word in the mind. In the long term the unique idea disappears and all that is left is
    the difference between your name and your competitors'' names — or rather the perception of those
    names. The argument connecting the two is erosion by imitation. Xerox was the first plain-paper copier
    and in the beginning you could sell one by showing the difference between a Xerox copy and an ordinary
    copy; today all copiers are plain-paper copiers, so the technical asymmetry is gone. What remains
    is the name, which competitors cannot copy, and that is why they say the most important branding decision
    anyone makes is what to call the product, and that the most valuable asset of the Xerox Corporation
    is the Xerox name itself.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 44-45. Practitioner assertion with a stated mechanism. "In the long run" is never
    defined, and the valuation of the Xerox name is an assertion rather than a calculation.

    '
  confounders:
  - reading it as a claim that product quality does not matter at all; the same authors advise building
    as much quality as you can afford (p. 38)
  - assuming the erosion argument applies immediately; it is explicitly a claim about the long run, with
    no time constant supplied
  - confusing this with brand-equity valuation, which is a different apparatus and absent from the book
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0026
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 46-48 (Ch. 9, the East Asia passage)
  question: 'Chapter 9 ends with the claim that East Asia does not have a banking, financial, monetary
    or political problem but a branding problem. What figures are offered for it, and what would a careful
    reader need before accepting the inference?

    '
  answer: 'The figures are a comparison of top-hundred company results in a recent unnamed year: US sales
    of $3.2 trillion against Japan''s $2.6 trillion, but average profits of 6.2 per cent of sales in the
    US against 0.8 per cent in Japan, with Korea''s sixty-three largest companies posting a combined net
    loss of 0.4 per cent. Around them sit counts of how many of the hundred largest Japanese companies
    market under one name — sixteen under Mitsubishi, eight each under Matsushita and Mitsui — and Hyundai''s
    "chips to ships" range. A careful reader would need a great deal more: the source and date of the
    figures, which are given for neither; some consideration of accounting conventions, capital structure,
    cross-shareholding, exchange rates, the 1997-98 financial crisis, or any of the other differences
    between the economies, none of which the chapter mentions; and some reason to prefer brand architecture
    over all of them as the explanation. The chapter offers a single-cause reading of a two-number comparison.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed pp. 46-48. Third-party figures reported without source or date; the closing sentence
    is polemical restatement. Recorded in sk_r22_0030 as an example of how far the authors extend the
    Law of Expansion, not as something the book supports.

    '
  confounders:
  - accepting the profit gap as evidence because the numbers are specific; specificity is not provenance
  - assuming the extraction endorses the conglomerate-naming criticism; it records the claim and its support,
    and the support is a two-number comparison
  - answering with what happened to these groups later; that is outside this copy
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0027
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 51 (Ch. 10, 'management measures results with the wrong end of the ruler')
  question: 'The authors say one reason 90 per cent of new brands are line extensions is a measurement
    error. State the error precisely, name the second cost they say goes unmeasured, and give the question
    they use to expose it.

    '
  answer: 'The error is that management measures only the success of the extension and never measures
    the erosion of the core brand — the ledger records the new item''s sales and not what the new item
    took from the old one. The second unmeasured cost is opportunity: the new separate brand that could
    have been launched instead was not, so its foregone value never appears anywhere. The exposing question
    is about source of volume. When Coors was planning Coors Light they asked an executive where the business
    would come from and were told it would be taken from Budweiser and Miller; Budweiser said the same
    about Miller and Coors when planning Bud Light, and Miller said the same about the other two. The
    authors'' reply is that the Coors Light drinker is more likely to come from Coors, the Bud Light drinker
    from Budweiser and the Miller Lite drinker from Miller High Life — and they note the three regular
    brands all declined substantially after the three lights launched.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 51-52. The beer inference has no comparison group and no other cause considered,
    and the authors themselves acknowledge on p. 52 that the market genuinely shifted from regular to
    light beer — which they call "really two markets".

    '
  confounders:
  - treating incrementality analysis as what the authors mean; they describe the error, not a method,
    and offer no measurement technique
  - assuming the decline of the regular brands proves cannibalisation; a real demand shift is conceded
    in the same passage and is not separated from it
  - reading the 90 per cent figure as evidence that extensions fail; it says only how common they are,
    and is cited without source
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0028
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 53-55 (Ch. 10, the Bayer Select case and 'let sleeping brands lie')
  question: 'A brand team proposes a "reduced-sugar" version of the company''s flagship product under
    the same name. Apply the authors'' specific objection to extensions named by a subtracted attribute,
    and give the pre-launch test they prescribe.

    '
  answer: 'Their objection is that such an extension argues against its own parent. Names built on light,
    clear, healthy, fat-free or free-of-something tell the customer that the regular product has the defect
    the new one removes — a reduced-sugar version says the flagship is loaded with sugar, and the assertion
    comes from the manufacturer, which is the one source the customer has no reason to disbelieve on that
    point. They run the same reading across Heinz Light ketchup, Hellmann''s Light, Campbell''s Healthy
    Request and Crystal Pepsi. Their case is Bayer Select: a company launching five "aspirin-free" products
    under the name of an aspirin brand, which they gloss as asking why anyone should buy Bayer aspirin
    when the manufacturer says its aspirin-free products are better. The prescribed test is to ask, before
    launch, what customers of the current brand will think when they see the extension on the shelf. If
    the answer is that they will conclude something bad about the product they already buy, do not launch
    it; let sleeping brands lie.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 54-55. The Bayer figures — a $116 million programme, $26 million of first-year
    sales in a $2.5 billion market, regular Bayer falling about 10 per cent a year — are reported without
    source, and the authors themselves say the aspirin decline predated the launch, so the case cannot
    separate the two causes.

    '
  confounders:
  - the health-portfolio default of meeting a real dietary demand under the trusted name, which is the
    move the passage forbids
  - assuming the objection is about dilution generally; this is a narrower and more specific failure mode
    about what the name asserts
  - reading the Bayer numbers as proof; the parent brand was already declining for reasons the authors
    state themselves
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0029
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 55 (Ch. 10, closing rule) with pp. 77-82 (Ch. 15, 'The Law of Siblings')
  question: 'Chapter 10 forbids putting your name on a new thing and Chapter 15 licenses launching a second
    brand. State the rule that connects them, and the single criterion that separates the licensed move
    from the forbidden one.

    '
  answer: 'The connecting rule closes Chapter 10, and both of its branches begin the same way: if the
    market is moving out from under you, stay where you are and launch a second brand; if it is not, stay
    where you are and continue building your brand. Following the market with the existing name is not
    among the options. Chapter 15 then opens by conceding that the laws seem to suggest concentrating
    everything on a single brand, agreeing that this is true, and licensing a second, third and fourth.
    The criterion separating the two moves is whether the existing name is asked to carry new meaning.
    A line extension attaches the old name to the new thing; a sibling is a genuinely separate name —
    DeWalt rather than Black & Decker Pro, L''eggs rather than Hanes II, Olive Garden rather than an Italian
    Red Lobster. Note the authors give no test for whether a market shift is real, which is the judgement
    the whole rule turns on.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed p. 55 for the two-branch rule, pp. 77-81 for the concession and the sibling cases.
    The separating criterion is stated by this lane, not by the authors, who argue case by case; it is
    recorded as an extractor reading in scs_r22_003.

    '
  confounders:
  - assuming any second brand is licensed; Chapter 15 attaches six conditions, including that a sibling
    be launched only when it can create a new category
  - treating a subbrand as the middle ground; Chapter 14 condemns exactly that, and the criterion above
    is what separates it from a sibling
  - expecting a test for a real market shift; the book supplies none, and the rule cannot be applied without
    one
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0030
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 56-59 (Ch. 11, 'The Law of Fellowship')
  question: 'Why do the authors say a dominant brand should welcome competitors rather than merely tolerate
    them? Give the three mechanisms in the chapter.

    '
  answer: 'First, attention: competition increases the noise level in a category, makes customers more
    conscious of it and raises consumption per head — the best thing that happened to Coca-Cola, on their
    reading, was Pepsi-Cola, and they call it ironic that Coke fought Pepsi over the use of "cola" and
    fortunate that it lost. Second, comparison: choice is itself read by customers as a benefit, and where
    there is none they become suspicious — maybe the category has flaws, maybe the price is too high;
    who wants to buy a brand with nothing to compare it against? Third, focus preservation: two competing
    brands can each stay narrow and powerful while between them covering a market neither could cover
    alone, their example being one brand appealing to older customers and one to younger. They see the
    same effect geographically, in the clustering of used-car dealers, garment and diamond districts,
    and forty music theatres in a town of under four thousand people.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: 'Printed pp. 56-59. Practitioner assertion with three stated mechanisms; the clustering examples
    are descriptions of existing agglomerations offered as illustration, not evidence.

    '
  confounders:
  - assuming this is about antitrust or market structure; it is advice to a dominant brand about its own
    posture
  - reading the office-superstore example as showing competition helps everyone; the independents in the
    same passage fell from about ten thousand to three thousand
  - the Law of Advertising in the same book tells a leader to smother competitors and make them pay through
    the nose (p. 21); the two laws conflict and the book does not reconcile them
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0031
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 57-58 (Ch. 11, the wine passage)
  question: 'Where do the authors bound their own Law of Fellowship, and what is the weakest link in the
    case they use to bound it?

    '
  answer: 'They bound it at the point where choice becomes confusion: customers can have too much choice,
    and the more brands, flavours and varieties, the more confusion in the category and the lower the
    consumption per head. They name two major brands per category as apparently ideal and give five paired
    examples. Their case for the failure mode is wine — more than a thousand wineries and five thousand
    brands in California alone, an annual magazine ranking some twenty-four thousand individual wines,
    and no major brand having emerged. The weakest link is the inference they draw from American consumption
    being a tenth of France''s, a ninth of Italy''s and under a third of Germany''s. That comparison is
    cited without source and is used to make brand structure the cause of low consumption, with no consideration
    of drinking culture, licensing, taxation, price, climate or history — any of which a reader would
    reach for first. The five ideal pairs are also the five categories that fit.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed pp. 57-58. Third-party consumption figures with no source; the causal reading is the
    authors'' and the objection to it is the extractor''s, recorded on sk_r22_0035. The authors'' own
    forecast that someone will one day build a worldwide wine brand is recorded as a forecast.

    '
  confounders:
  - accepting the consumption comparison as support; it establishes a difference, not a cause
  - reading 'two brands is ideal' as a finding; it is an observation about five categories the authors
    chose
  - assuming this bound weakens the Law of Fellowship's core claim; the authors present it as a limit,
    not a retraction
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0032
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 60 (Ch. 11, 'our research indicates') with pp. 10-11 (Ch. 2, the domination
    figures)
  question: 'The book states a ceiling on a dominant brand''s market share and elsewhere cites shares
    well above it approvingly. Set out both, and say what the reader is left with.

    '
  answer: 'At printed p. 60 the authors say no brand can own an entire market absent a government-sanctioned
    monopoly, and that "our research indicates that 50 percent is about the upper limit", illustrated
    with Federal Express at 45 per cent of domestic overnight delivery and Coca-Cola at 50 per cent of
    domestic cola; above that level, they say, a company must launch separate brands. At pp. 10-11 the
    fifth step of the category-killer pattern is "dominate the category", named as the ultimate objective
    of any branding programme, and illustrated with Microsoft at 95 per cent of desktop operating systems,
    Intel at 80 per cent of microprocessors and Coca-Cola at 70 per cent of the world cola market. The
    two passages cannot both be operative as stated, and Coca-Cola carries two different figures without
    comment. The reader is left with an unreconciled conflict and no criterion for which passage governs
    — and with the fact that the ceiling''s only support is an appeal to unreported research.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed p. 60 and pp. 10-11. Both passages are the authors''. The identification of the conflict
    is the extractor''s, recorded in scs_r22_001''s conflict list and in sk_r22_0036, and is checkable
    against those two pages.

    '
  confounders:
  - reconciling them by domestic versus worldwide scope — the Coca-Cola figures do differ that way, but
    the Microsoft and Intel figures are worldwide and still exceed the stated ceiling
  - treating 'our research indicates' as a citation; no method, sample or categories are given anywhere
  - assuming one figure must be a misprint; both are stated in argument and used to support opposite instructions
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0033
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 63, 65-66 (Ch. 12, 'The Law of the Generic')
  question: 'What is the authors'' mechanism for why a generic brand name cannot differentiate, and what
    does it imply about how naming decisions are usually made?

    '
  answer: 'Their mechanism is that the mind deals in sounds rather than letters. Most brand communication
    happens verbally — they claim the average person spends nine times as long listening to radio and
    television as reading print — and even the printed word is processed through the sound it generates,
    so a reader cannot hear the difference between "general" and "General". Capitalising a common word
    therefore does not make it a proper noun in a mind. What it implies about practice is the chapter''s
    sharpest point: the naming process is usually conducted visually, with logotypes set in type, mounted
    on foamcore and passed round a boardroom, which is exactly the wrong sense for a decision that will
    be settled by ear. The same mechanism is their explanation for why line extensions fare poorly, since
    an extension typically pairs a brand name with a generic descriptor and the descriptor cannot create
    a separate identity — "Michelob Light" being heard as "Michelob light", a watered-down version of
    the regular beer.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: 'Printed pp. 63 and 65-66. The nine-to-one listening ratio is cited without source and concerns
    media time, not name processing. The historical objection — that General Electric and its peers succeeded
    — is handled by asserting they succeeded in spite of their names because they were first.

    '
  confounders:
  - assuming this is about descriptive versus suggestive marks in trademark practice; the concern here
    is retrieval from memory, not registrability
  - reading the Vaseline Intensive Care case as a counter-example the authors accept; they concede it
    and explain it as customers happening to treat the descriptor as a name
  - supposing the historical successes are counted against the law; they are reassigned to priority, so
    neither outcome can disconfirm it
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0034
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 64-65 (Ch. 12, 'take a regular word and use it out of context')
  question: 'A start-up in office supplies has shortlisted three names: General Office Products, Staples,
    and Supply Systems Inc. Apply the authors'' two constructive naming procedures to explain which they
    would choose and why the other two fail.

    '
  answer: 'They would choose Staples. It is their own worked example of the first procedure — take a regular
    word and use it out of context so that it connotes the brand''s primary attribute — and they point
    to the double entendre as making it particularly powerful: buy your office staples from Staples. The
    other two are the failure the chapter is about: common descriptive words that cannot separate the
    brand from anything, because the mind hears "general office products" and "supply systems" as descriptions
    no matter how they are capitalised, and every competitor can use the same words. The second procedure
    they offer is truncation — cutting a generic phrase down to something short and distinctive, as Intelligent
    Chip Company becomes Intel, with the point that all computers have intelligent chips inside but only
    some have Intel inside. Their warning case is the company that dropped McAfee, the only real name
    it owned, for Network Associates, and then spent $10 million including a Super Bowl spot trying to
    make two generics register.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 64-65. The procedures are illustrated only with names that succeeded; no failed
    displacement or truncation appears, and the chapter gives no way to tell in advance which ordinary
    word will work.

    '
  confounders:
  - choosing a descriptive name for search or clarity reasons, which is the modern default and the chapter's
    target
  - assuming an invented name is always best; the authors reserve invention for genuinely revolutionary
    products unlikely to be copied soon
  - reading the procedures as rules that can be applied in advance; they describe successful outcomes
    and specify no test
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0035
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 68-71 (Ch. 13, 'The Law of the Company')
  question: 'The authors say brands are brands and companies are companies, then recommend using the company
    name as the brand name. Explain how both positions sit together, and give the two-question test they
    offer.

    '
  answer: 'The separation is about whose point of view governs: a company is the organisation that produces
    a brand and is not the brand, but customers are brand-oriented while managers, being employees, are
    company-oriented, so the brand name should almost always take precedence. The recommendation follows
    from that rather than contradicting it — unless there are compelling reasons otherwise, the cleanest
    arrangement is for company and brand to be one name, so that the question has one answer: what is
    a Coca-Cola, a Zippo, a WD-40? Cola, windproof lighter, lubricating spray. Their test is a pair of
    questions: what is the name of the brand, and what is the name of the stuff inside the packaging?
    Both had better be the same or you have big problems. They push the identification hard — the liquid
    itself is Coca-Cola, not a cola made by a company — which is why they say a company that understood
    branding could never have introduced New Coke. They add a symptom: when customers feel they must say
    both names together, there is usually a branding problem, normally because a generic word was used
    as the brand name.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 67-71. Practitioner assertion; the Microsoft Excel and Microsoft Word contrast
    is an argument about what the authors say customers say, with no observation reported.

    '
  confounders:
  - assuming the advice is safe for any company; it holds only where the company makes one thing, which
    is the condition the Law of Expansion imposes — the authors do not state the dependency and Chapter
    9 gives the opposite advice for a company that makes many things
  - reading it as an endorsement of corporate branding as usually practised; the chapter's preference
    is for the brand name to dominate and the company name to sit in small type
  - confusing the recommendation with the house-of-brands approach it contrasts, where the maker is relegated
    to tiny type
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_r22_0036
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 73-74, 76 (Ch. 14, 'The Law of Subbrands')
  question: 'A budget hotel chain proposes a premium sub-line under its existing name. Apply the authors''
    diagnostic test, then state what they say about who gets to decide whether the new name is a brand.

    '
  answer: 'The test is to render the demand the sub-line serves as a sentence a customer would actually
    say. Did anybody ever walk into a Holiday Inn and ask the clerk "don''t you have a more expensive
    hotel I can stay at?" If no one would say it, the subbrand answers a demand that does not exist, and
    the customer''s reasoning runs the other way: if I am forking out the big bucks, I want to stay with
    a top hotel brand — why spend all that money and still stay at a Holiday Inn? Their case reports customer
    research at Holiday Inn Crowne Plaza returning exactly that — a nice hotel, but a little expensive
    for a Holiday Inn — after which the parent name was cut. On who decides: not the company. What the
    manufacturer sees as a brand the customer sees as a model, and what the manufacturer sees as a megabrand
    the customer sees as a brand; customers do not understand the megabrand concept at all, and you cannot
    apply your own branding system to a market that sees things differently.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 73-74 and 76. The customer research is the company''s own, reported second-hand
    by the authors with no method. The chapter also records Marquis by Waterford as "a big success" and
    disposes of it by predicting future erosion rather than by evidence.

    '
  confounders:
  - the endorser-brand strategy of using the parent for reassurance while the sub-line carries the positioning,
    which is the practice the chapter is written against
  - assuming the authors forbid multiple models under one brand; they explicitly allow it, provided the
    models do not detract from the singular idea that sets the brand apart
  - treating the Waterford success as an exception the authors accept; they concede it and predict it
    will erode the parent line
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0037
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 81-82 (Ch. 15, the six principles)
  question: 'Give the six principles the authors set for a family of sibling brands, and explain the one
    about names — including the phrase they use for getting it wrong.

    '
  answer: 'Focus on a common product area. Select a single attribute to segment, price being the most
    common. Set up rigid distinctions among the brands, which price makes easiest because numbers can
    be attached to each. Create different, not similar, brand names. Launch a new sibling only when you
    can create a new category — never to fill a hole in the line or to block a competitor. Keep control
    of the family at the highest level. On names: the instruction is that you do not want to create a
    family of brands, you want to create a family of different brands, and the phrase for getting it wrong
    is that alliteration is the curse of a sibling family. Their example is Chevrolet''s Cavalier, Camaro,
    Corsica, Caprice and Corvette, which they say are too similar to function as brands. The fifth principle
    is the one they call most often violated, and they name four Coca-Cola launches — Mr Pibb, Fruitopia,
    Mello Yello and Surge — each made to block a rival rather than to create a category.

    '
  answer_type: factual_recall
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed pp. 81-82. Practitioner assertion; the four Coca-Cola blocking launches are all reported
    as having gone nowhere, which is consistent with the principle and is again a set selected after the
    outcome was known.

    '
  confounders:
  - assuming a family look is desirable, which is standard practice and the opposite of principle four
  - reading principle six as a call for decentralisation; the authors say a sibling strategy needs more
    top-management supervision, not less, and blame decentralisation for General Motors
  - supposing any of the six is a test for when to launch; only the fifth constrains timing, and it constrains
    the reason rather than the moment
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: factual
- qa_id: qa_r22_0038
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 80-81 (Ch. 15, the General Motors passage)
  question: 'The authors say General Motors'' five brands were once instantly identifiable and later were
    not. What mechanism do they name for the decay, and what management conclusion do they draw from it?

    '
  answer: 'The mechanism is sibling rivalry: a pattern of corporate behaviour in which each brand copies
    the best features of its sibling competitors, so that a portfolio of distinct brands converges. They
    pair it with a second cause — control over the brands was lifted and each division allowed to set
    its own course, after which each division broadened the scope of its own brand, producing expensive
    Chevrolets, cheap Cadillacs and general confusion. Their summary is that all General Motors cars ended
    up with fins. The management conclusion runs directly against the common belief they quote, that a
    sibling strategy works best in a decentralised organisation: a sibling strategy requires more top-management
    supervision, not less, because the urgent long-term need is to maintain the separation between brands
    and human instincts work in the opposite direction.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 80-81. Practitioner assertion with a stated mechanism; no other cause of the convergence
    — platform sharing, cost structure, regulation — is considered anywhere in the passage.

    '
  confounders:
  - attributing the convergence to manufacturing economics, which is a plausible account the chapter never
    addresses
  - assuming decentralisation is recommended for brand portfolios generally; this passage is the argument
    against it
  - reading 'fins' literally; it is their shorthand for every brand acquiring every other brand's features
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0039
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 83-84 (Ch. 16, 'The Law of Shape', the typography passage)
  question: 'Why do the authors put legibility above expressive character in a logotype? Give the cycle
    they describe, and say what they concede about typographic mood.

    '
  answer: 'Because they hold the trade is not worth making. The cycle: to get an average prospect to notice
    the mood of a logotype you have to exaggerate the characteristics of the typography, and when you
    do that you lose the logotype''s legibility — and an illegible logotype has little or no meaning in
    the consumer''s mind, not because of the face but because the prospect cannot read the words and therefore
    cannot remember the name. Hence legibility is the most important consideration in selecting a typeface.
    What they concede is that perceptual differences are real: sans serif faces look modern and serif
    faces old-fashioned, bold looks masculine and light feminine. Their point is that these differences
    only become obvious through exaggeration — they ask whether you would really set a brand name in black-letter
    Gothic to look established, and answer that few prospects could then read it. They also say customers
    are only dimly aware of typeface differences, paraphrasing David Ogilvy to the effect that no one
    ever declined to buy a detergent over the choice of Futura Demibold.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: typography
  requires_application: false
  support: 'Printed pp. 83-84. The argument is the authors'' own with a stated cycle; no legibility measurement
    is cited, and the chapter''s only external authority is a paraphrase of Ogilvy.

    '
  confounders:
  - assuming they say typography carries no meaning; they concede specific perceptual associations and
    rank them below readability
  - reading this as an accessibility argument; the concern here is recall of a name, not readability for
    readers with impairments, and no criterion or threshold is given
  - the brand-expression default of choosing a face to express brand attributes, which is the practice
    the chapter is arguing against
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0040
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 84-85 (Ch. 16, the Nike and Shell/Mobil passages)
  question: 'What is the authors'' position on the visual trademark as against the name, and what specific
    disadvantage do they identify in a wordless mark?

    '
  answer: 'They hold the trademark is overrated and that the meaning lies in the word, not the visual
    symbol: it is the Nike name that gives meaning to the Swoosh, and the Swoosh does not give much meaning
    to the Nike brand. A symbol can come to represent a name after long association through a kind of
    rebus effect, but the name still carries the power, and the advantages of using the symbol alone are
    slim and situational — visibility at a distance, use on clothing where a name would look too commercial.
    Their specific disadvantage concerns succession: comparing Shell''s wordless mark with Mobil''s wordmark,
    they ask how people growing up and entering the market will learn that the yellow symbol means Shell,
    especially if they do not know Shell is a brand of petrol. They add that the elaborate crests, shields
    and coats of arms produced by design shops are for the most part wasted, and that only a handful of
    simple symbols work — if history has not already given you one, it is probably too late to make one.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: 'Printed pp. 84-85. Practitioner assertion. Note that in the copy inspected the argument is
    carried entirely by prose: no illustration survives in this file''s text layer, so a reader cannot
    see any of the marks being discussed.

    '
  confounders:
  - assuming they recommend abandoning symbols; they say a symbol may work, and question only what is
    gained by using it alone
  - reading this as an argument about design quality; their objection is that a symbol acquires meaning
    from the name rather than supplying it
  - treating the Nike example as evidence; the passage notes hundreds of millions a year for over a decade
    were spent linking the two, and then asks what the advantage is
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0041
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 87-88 (Ch. 17, 'The Law of Color', the Maxion tractor case)
  question: 'A new entrant in a category where the leader owns the category''s natural colour asks which
    colour to take. Apply the authors'' rule, and state the trade they say you should accept.

    '
  answer: 'Take the colour opposite the major competitor''s, not the one symbolic of the category — the
    leader has first choice, and the leader normally takes the symbolic colour. Their own worked case
    is a Brazilian tractor brand they named Maxion. John Deere, the leading tractor brand, had green,
    the colour of grass and agriculture; the second brand had red; so they made Maxion blue. The trade
    they say to accept is stated plainly: is blue a good colour for a farm tractor? No — but it is more
    important to create a separate brand identity than to use the right symbolic colour. They run the
    same logic through car rental (Hertz yellow, so Avis red, National green) and hold up Pepsi as the
    counter-case, having taken red and blue together and so struggled for decades against a world that
    seems awash in Coca-Cola red. They add that whatever colour is chosen must be held consistently over
    years, which is their reading of the Tiffany box.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: colour
  requires_application: true
  support: 'Printed pp. 87-89. The rule and the trade are the authors''; the chapter''s physiological
    justification — wavelengths focusing behind or in front of the retina — is offered without a source
    and does not support the cultural colour meanings the chapter derives from it. The associations listed
    are Western conventions.

    '
  confounders:
  - choosing the category-symbolic colour for recognisability, which is the move the passage explicitly
    rejects for a non-leader
  - assuming the leader's rule and the follower's rule are the same; the chapter separates them, and only
    the leader is told to take the symbolic colour
  - reading the red/blue physiology as established; it is asserted, and the emotional readings drawn from
    it are conventions rather than consequences of optics
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0042
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 89 (Ch. 17, the Miller and Tiffany comparison)
  question: 'The authors connect the Law of Color to the Law of Extensions through a single comparison.
    What is the comparison, and what does it claim?

    '
  answer: 'They compare Miller with Tiffany. Miller''s line extensions each need to be told apart from
    one another, so the brand uses an array of colour combinations, and in the process it loses the chance
    to differentiate its core brand from Budweiser, its key competitor — one of the many problems the
    authors attribute to those extensions is that they destroy the brand''s colour identity. Tiffany,
    by contrast, holds a single colour and holds it even at Christmas when every other brand and retailer
    turns to red and green, which they say makes it more noticeable under the tree rather than less. The
    claim they draw is a wager about recall: you have probably seen many more Miller cans than Tiffany
    boxes, but they would bet you know the hue of a Tiffany box and are not quite sure about Miller''s.
    The connection is that a colour is an asset only if it is both differentiated and held, and line extension
    destroys both conditions at once.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: colour
  requires_application: false
  support: 'Printed p. 89. The recall wager is rhetorical — no test of it is reported — and the claim
    that extensions destroyed Miller''s colour identity is asserted rather than demonstrated.

    '
  confounders:
  - reading exposure frequency as the driver of colour recall, which is the assumption the wager is set
    up against
  - assuming the point is about luxury versus mass brands; the argument is about consistency and differentiation,
    not price tier
  - supposing the Tiffany case shows a single colour is always best; the same chapter allows multiple
    colours where the object is physical stand-out, as with FedEx's orange and purple
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0043
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 91 (Ch. 18, 'The Law of Borders', the two ironclad beliefs)
  question: 'Chapter 18 opens with two beliefs the authors say most of their clients hold. Name both,
    explain why the pair produces line extension, and give the authors'' alternative resolution.

    '
  answer: 'The beliefs are that the brand''s market share cannot be substantially increased in its home
    country, and that the company needs to grow. Together they close off the obvious route and leave only
    one apparent exit: extend the brand into other categories, which the clients defend by saying it may
    be dangerous but it is the only way to grow. The authors say that reasoning falls victim to the first
    law of branding, the Law of Expansion. Their resolution satisfies both beliefs without breaking it:
    keep the brand''s narrow focus in its home country, and go global. Growth comes from more geography
    rather than from more categories, and nothing about what the brand means has to change. Heineken is
    their case — the leading brewery in a country of fifteen million becoming the second-largest brewery
    in the world by going global.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed pp. 91-92. The belief pair is quoted by the authors from their own consulting practice.
    Practitioner assertion; no comparison of the two growth routes is offered anywhere.

    '
  confounders:
  - assuming they think home-market share genuinely is capped; they argue elsewhere that the market itself
    can be expanded, which is a third route (printed p. 26)
  - reading 'no barriers to global branding' as being about trade; the same chapter lists duties, tariffs,
    quotas and inspections, and the claim is about mental barriers
  - supposing the route is generally available — the authors say plainly that not every brewery can do
    what Heineken did
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0044
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 92-94 (Ch. 18, the Heineken passage and 'there is no such thing as a global
    brand with a global perception')
  question: 'What two conditions do the authors set for a successful global brand, and why does their
    own leading example undercut the sufficiency of those conditions?

    '
  answer: 'Be first, and have a product that fits the perceptions of its country of origin. Country perception
    is treated as inescapable — every brand, like every person, is from somewhere, whatever the place
    of manufacture, and its name and connotations fix where. Coca-Cola bottled in Mexico is still, in
    their phrase, a gringo brand. Their example undercuts sufficiency because they explain Heineken''s
    success by three separate strokes of luck rather than by the two conditions. Beer is associated with
    Germany rather than Holland, but Holland is close to Germany geographically and ethnically so many
    drinkers take Heineken for German — the company has even distributed coasters printed in Germany.
    Its main German rival on world markets, Beck''s, is saddled with an English-sounding name. And the
    largest-selling German beer, Warsteiner, begins with a syllable that they say will not travel. If
    three accidents were needed on top of the two conditions, the conditions were not sufficient, and
    the chapter does not draw that conclusion.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: 'Printed pp. 92-94. The three strokes of luck are the authors'' own account; the observation
    that they concede insufficiency is the extractor''s, recorded as a caveat on sk_r22_0044. The country-perception
    pairs are the stereotypes of a particular period and readership.

    '
  confounders:
  - reading country of origin as a factual matter of where a product is made; the authors are explicit
    that it is a matter of name and connotation
  - assuming the mistranslation anecdotes later in the chapter carry argumentative weight; they are widely
    circulated marketing stories reproduced without any source
  - treating Corona as confirming the two conditions; that case works through an association with Mexican
    cuisine and a visible citrus wedge, which is a third route the chapter does not fold into the rule
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0045
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 97-98 (Ch. 19, 'The Law of Consistency', the Tanqueray and Coca-Cola beer
    passages)
  question: 'A leading gin brand watches a durable trend toward premium vodka and proposes launching its
    own vodka under the same name. Give the authors'' answer, the two questions they use to reach it,
    and the reductio they run alongside.

    '
  answer: 'Their answer is to stick with gin and hope the market swings back — when the market swings
    another way you have a choice between following the fad and destroying the brand, or hanging in there,
    and in their experience hanging in is the better approach. The two questions are: will the new vodka
    cut into the leading vodka''s market? Of course not. Will it undermine the gin business? Ultimately,
    yes. So the move can only take from itself. The reductio is Coca-Cola beer. They note that as children
    grow up they change their personality statements, moving from Coca-Cola to Budweiser, so if Coca-Cola
    tried to retain those customers by moving with the market it would logically introduce a beer — and
    they say that however foolish that sounds, it is conceptually no different from Tanqueray vodka, Coors
    water or Crystal Pepsi. Their governing line is that markets may change but brands should not, ever.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 97-98. Practitioner assertion; the Jack Daniel''s beer and coolers cases in the
    same passage are reported as outcomes without figures. The authors'' "in our experience" is the whole
    of the evidential basis for preferring to hang on.

    '
  confounders:
  - the brand-stretch reasoning that a strong name in spirits transfers across spirits, which the passage
    rejects using the brown-goods/white-goods distinction
  - assuming 'ever' is final; the very next chapter opens by saying nothing in branding is absolute and
    sets out three permitted changes
  - reading the badge argument as demographic targeting; it is an argument for staying still while customers
    move on
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0046
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 98-100 (Ch. 19, the boredom passage and the Arch Deluxe)
  question: 'What cause do the authors give for most violations of the Law of Consistency, and what diagnostic
    error do they say a company makes after such a violation fails?

    '
  answer: 'Boredom. Brand building is boring work, what works best is absolute consistency over an extended
    period, and when people do boring work they get bored — so every so often someone at a company like
    Volvo has a bright idea about branching out into exciting sports cars. They supply a verbal cue for
    the moment: run up a red flag whenever you hear the words "why should we limit ourselves?", because
    you should limit your brand, and that limitation is the essence of branding. The diagnostic error
    afterwards is misattribution: it is always the product that is declared a failure, never the branding
    concept. Their case is the Arch Deluxe — a hundred and fifty million dollars of advertising later
    it was declared a disaster and dropped, when on their reading McDonald''s is understood as a kid-oriented
    family restaurant, so an adult hamburger might taste good in the mouth but was never going to taste
    good in the mind.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'Printed pp. 98-100. Practitioner assertion. The durability examples in the same passage —
    Volvo selling safety for thirty-five years, BMW driving for twenty-five — are counts of years rather
    than measurements of effect, and the Little Caesars case attributes a fall to third place to one cause
    with no figures and no alternative considered.

    '
  confounders:
  - attributing violations to competitive pressure or growth targets, which are the obvious causes and
    not the one the chapter names
  - assuming the product/concept distinction is testable as stated; the chapter offers no way to tell
    which failed in a given case
  - reading 'why should we limit ourselves' as a rhetorical flourish; the authors offer it as an operational
    cue to watch for
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0047
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 101-103 (Ch. 20, 'The Law of Change')
  question: 'Name the three situations in which the authors say changing a brand is feasible, and explain
    the mechanism they give for the third — including why they say it will not work in a fast-moving field.

    '
  answer: 'First, where the brand is weak or non-existent in the mind: there is effectively no brand,
    so it can be used on any product in any category — who is to know? Intel leaving memory chips for
    microprocessors is their case, on the grounds that outside a handful of computer executives and purchasing
    agents nobody knew what Intel had stood for. Second, moving the brand permanently down the price ladder,
    which customers read as value received; going the other way, up the food chain, they call much harder
    if not impossible. Third, a slow-moving field where the change can be spread over a long period. The
    mechanism for the third is not persuasion but forgetting: Citicorp moved Citibank from a corporate
    to a consumer perception over twenty-five years, and the authors say little change actually occurred
    in any prospect''s mind — instead of changing minds, enough time was allowed to pass for the natural
    process of forgetting to take place. That is why it will not work in computers or consumer electronics:
    there is not enough time for forgetting.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 101-103. Practitioner assertion with a stated mechanism. The Citicorp figures
    describe a business mix, not the state of any prospect''s mind, which is what the claim concerns;
    the Intel case rests on an assertion about what the public knew.

    '
  confounders:
  - assuming a repositioning campaign can do the work; the chapter's position is that customers reject
    the message that a brand is now something else — 'customers are never wrong'
  - reading the first situation as easy to identify; it is the judgement a company is least able to make
    about itself, and no test is offered
  - confusing moving down the price ladder with a discount promotion; the authors specify a permanent
    lowering
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_r22_0048
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 106-108 (Ch. 21, 'The Law of Mortality')
  question: 'An established brand faces a technology shift into a new category and asks whether to carry
    its name across. Apply the authors'' position, including the valuation distinction they say managers
    get wrong.

    '
  answer: 'They would say do not carry the name, and put the money into a new brand instead. Their reason
    is that a brand''s power is confined to the meaning attached to its name and cannot be extended past
    it, which they argue through Kodak: Kodak stands for conventional photography, so the Kodak name has
    no power over videotape and, they predict, none over digital imaging. Their stronger claim is about
    succession — when a revolutionary new category develops, the inevitable winner is a revolutionary
    new brand name, as with Sony against the incumbent electronics names, Blockbuster against the incumbent
    retailers, and Dell against a long list of established computer makers. The valuation distinction
    managers get wrong is between how well known a brand is and what it stands for: a well-known brand
    that stands for nothing, or for something obsolete, has no value and has nowhere to go but down, while
    a brand that stands for something has value even if it is little known, because it can be worked with
    — especially in publicity.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 106-108. Practitioner assertion and a forecast made in the late 1990s about a
    transition then under way. The succession list is composed entirely of winners chosen after the fact;
    incumbents that did carry a name across a technology boundary are not examined. This bank deliberately
    records nothing about what became of Kodak — there is no source for it here.

    '
  confounders:
  - answering with what actually happened afterwards; that is outside this copy and outside the question
  - assuming the authors advise abandoning the old business immediately; they distinguish investing from
    harvesting and object to spending on both sides of the street at once
  - reading 'euthanasia' as a criterion; the chapter gives no test for when a brand has reached that point
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_r22_0049
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed pp. 109-110 (Ch. 22, 'The Law of Singularity')
  question: 'The book closes with two answers to the question ''what is a brand?''. Give both, explain
    the test that goes with them, and state the caveat the authors attach about brands that have failed
    the test and are still trading.

    '
  answer: 'A brand is a proper noun that can be used in place of a common word — instead of an imported
    beer you ask for a Heineken, instead of a safe car a Volvo, instead of a thick spaghetti sauce a Prego.
    And a brand is a singular idea or concept that you own inside the mind of the prospect. The test is
    the one that opened the book: say the name and see what comes back. What is a Chevrolet? A large,
    small, cheap, expensive car or truck. What is a Miller? A regular, light, draft, cheap, expensive
    beer. A name that returns a list of contradictory attributes has lost its singularity and, in their
    word, is burned out. The caveat is that such brands can remain on the marketing scene for many years
    because of the line-extension generosity of their competitors. Survival is therefore not evidence
    that singularity was retained — which is the fourth time in this span the authors use competitor weakness
    to keep an outcome from counting against them.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 109-110. The definitions and the caveat are the authors''. The observation that
    the caveat repeats the weak-competition move a fourth time is the extractor''s; the other three are
    at printed pp. 7, 36 and 66.

    '
  confounders:
  - reading the substitution test as being about generic trademark status; a brand can substitute for
    a phrase — a safe car, a driving machine — without owning the category word
  - assuming a surviving brand refutes the diagnosis; the caveat is written precisely to prevent that
    inference
  - treating this chapter as introducing something new; it restates the Law of Expansion and the Law of
    the Word, and was extracted for the closing definitions and the caveat
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_r22_0050
  source_id: ries-22-immutable-laws-branding
  source_title: Al Ries and Laura Ries, The 22 Immutable Laws of Branding (HarperBusiness, 2002 combined
    edition)
  source_locator: printed p. 101 (Ch. 20 opening), p. 105 (Ch. 21 opening), p. 77 (Ch. 15 opening)
  question: 'Someone cites ''immutable law'' as a reason to weight a claim from this book heavily. Using
    three passages from inside the book itself, show what the authors actually claim about the status
    of their laws, and say what those concessions do and do not fix.

    '
  answer: 'Chapter 20 opens by saying that nothing in life and nothing in branding is ever absolute, that
    there are always exceptions to every rule, and that the Law of Change is the biggest exception to
    the laws of branding — one member of the set is described as an exception to the others. Chapter 21
    opens by narrowing immutability to the laws themselves and excluding brands, which are born, grow
    up, mature and die. Chapter 15 opens by stating what the laws seem to suggest about concentrating
    on a single brand, agreeing it is true, and then licensing a second, third and fourth. So the authors
    themselves do not hold the twenty-two as independent universal axioms. What the concessions fix is
    the reading that every law applies always. What they do not fix is testability: no criterion is given
    anywhere for when an exception applies, so the concessions widen the laws rather than making them
    checkable, and they are never reconciled with the Introduction, which asserts the laws apply equally
    everywhere and assigns each named failure to the violation of a numbered law. The word "immutable"
    is a title, and it supplies no evidence.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed pp. 77, 101 and 105 — all three concessions are the authors'' own sentences. The reading
    that they widen rather than test the laws is the extractor''s, recorded in sk_r22_0049 and PROVENANCE.md
    §6. Nothing in this book is supported by measurement; see PROVENANCE.md §7 for the four candidate
    cases examined and rejected.

    '
  confounders:
  - concluding the laws are worthless; practitioner assertion is a real category of knowledge and this
    is an articulate instance of it — the point is only about how it should be weighted
  - assuming the concessions make the laws falsifiable; they name exceptions without giving any test for
    when one applies
  - treating the Introduction's universal framing as the authors' considered position and the concessions
    as slips, or the reverse; both appear in the book, unreconciled, and this lane did not choose between
    them
  requires_application_canon013: true
  source_status: hold
