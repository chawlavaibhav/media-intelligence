- qa_id: qa_ppm_0001
  source_id: pandey_pandeymonium
  source_locator: Ch. 7 'Scratching beneath the Surface'
  question: This author is known for rejecting research. What exactly does he reject, what does he keep,
    and what does he put in its place?
  answer: 'He rejects the PROCEDURES he has seen, not research as such — ''I reject the procedures that
    I have seen, but I don''t undervalue homework and thoroughness'', and he notes he has attended more
    research sessions than most creative people. What he keeps is homework and thoroughness, and his own
    preferred practice of chatting with people without an agenda. What he puts in place of self-report
    is direct behavioural observation: he describes throwing away the headphones behind a one-way mirror
    and watching body language instead, on the criterion that a respondent chatting and not looking at
    the commercial after five seconds is lost.'
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: '''I don''t want to hear stupid answers to stupid questions. I would much rather watch their
    body language.'''
  confounders: The usual summary — 'Piyush Pandey thinks research is useless' — is not what the source
    says, and the distinction he insists on is load-bearing.
  source_status: accepted
- qa_id: qa_ppm_0002
  source_id: pandey_pandeymonium
  source_locator: Ch. 7 'Scratching beneath the Surface'
  question: What specific failure of group self-report does this source describe, and why is the mechanism
    stronger than the evidence he gives for his conclusion?
  answer: 'That a respondent asked a question they have no genuine answer to will fabricate one to save
    face in front of a group, and that the fabrication then propagates: his example is a housewife shown
    a new pack and asked ''What do you feel on seeing this pack?'' — ''She feels bloody nothing'' — who
    concocts something, after which the next respondent says ''I feel the same'' and the chain continues
    until a conclusion is ''forwarded as God''s own truth''. The mechanism is stronger than his evidence
    because the mechanism is a real and independently recognisable failure of group self-report, described
    precisely, whereas the evidence he offers for his CONCLUSION — that the procedures should be rejected
    — is a list of his own campaigns he says the procedures would have killed, which is survivorship.'
  answer_type: mechanism
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''she concocts something to save her face. The next respondent in the room has it easy. She
    says, "I feel the same."'''
  confounders: The extraction binds the mechanism and explicitly not the conclusion.
  source_status: accepted
- qa_id: qa_ppm_0003
  source_id: pandey_pandeymonium
  source_locator: Ch. 7 'Scratching beneath the Surface'
  question: The author lists campaigns he says pre-testing would have killed. Why is this the weakest
    evidence in the book?
  answer: 'Because it is counterfactual throughout. No pre-test was run on the Cadbury Dairy Milk dancing
    girl, the Fevicol work or the Vodafone Zoozoos, so what a pre-test WOULD have returned is not established
    — it is a confident assertion about a test that never happened. Three further problems compound it:
    the commercial success of the campaigns is asserted and never evidenced, since no sales, share or
    tracking figure appears anywhere in the book; the only concrete detail, the Fevicol objection that
    ''we did not show furniture'', is a remembered objection rather than a recorded finding; and none
    of the work is reproduced in the book, so a reader cannot see what is being defended. It is also survivorship
    in the strict sense — campaigns that failed research AND would have failed in market are not counted,
    and neither are campaigns that passed research and succeeded.'
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''The Cadbury Dairy Milk girl dancing on the cricket field would have become a saint if she
    had been pre-tested.'''
  confounders: It is the rhetorical centre of his argument and the least supported thing in the book;
    those are compatible.
  source_status: accepted
- qa_id: qa_ppm_0004
  source_id: pandey_pandeymonium
  source_locator: Ch. 17 'Standing Up for One's Beliefs'
  question: In the Tata Cement story, what is the transferable observation, and how is it different from
    the lesson the author draws?
  answer: 'The lesson he draws is that a creative person convinced they are right should stand by the
    work. The transferable observation is about REVIEW CONDITIONS, and he states it himself in passing:
    the strategy review board that rejected a month''s work days before the pitch had not seen the work
    develop — ''If any of the board members had been involved from the outset, we wouldn''t have been
    in this sorry state.'' Reviewers who have not followed a work''s development judge it without the
    context the team holds and cannot see the alternatives already discarded. The two are different because
    the review-conditions point is a property of a process that can be changed, while the conviction lesson
    is drawn from a single case in which the bet paid — and the author supplies the counterfactual himself,
    noting he could have been sacked and that being sacked at that seniority would have ended his career.'
  answer_type: application
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: '''If any of the board members had been involved from the outset, we wouldn''t have been in
    this sorry state.'''
  confounders: A creative director who refused equally firmly and lost the pitch would have written no
    book. This is the book's clearest instance of survivorship, and the author half-acknowledges it.
  source_status: accepted
- qa_id: qa_ppm_0005
  source_id: pandey_pandeymonium
  source_locator: Ch. 6 'The Human Behind the Client'
  question: A creative team resents a client's approval process and treats it as an obstacle. What does
    this source argue instead, what is the mechanism, and what weakens the case?
  answer: 'That the process should be accepted as a SHARED constraint rather than fought, because accepting
    it converts the relationship from adversarial to joint: if the client''s requirement to test an idea
    is treated as a problem for the whole team, understanding deepens and the process eventually becomes
    ''a blur, a necessary chore''. The mechanism is that where two parties each treat the other''s constraints
    as obstacles, effort goes into the conflict; adopting the constraint as shared redirects that effort
    at the brief, and the shared difficulty itself becomes what binds them. What weakens the case is that
    every supporting instance is one in which the relationship went well and his career advanced, and
    his examples are of exceptional individual generosity — a brand manager waiving a launch commitment,
    a company sending cash on a bereavement — which evidence that good people exist rather than that the
    posture works.'
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: '''Once one accepts the realities of the processes, one instantly becomes part of a team.'''
  confounders: The same chapter says 'Don't be scared of systems and processes. There are ways to fool
    them. I found at least a hundred.' — in tension with accepting the process as shared, and unreconciled.
  source_status: accepted
- qa_id: qa_ppm_0006
  source_id: pandey_pandeymonium
  source_locator: Copyright page
  question: Why does this book, which argues from named visual campaigns, reproduce none of them — and
    what does that mean for what the source can support?
  answer: 'Because the publisher deliberately located them elsewhere. The copyright page states: ''All
    images and television commercials mentioned in this book are available for viewing on www.pandeymonium.in''.
    So the campaigns were never printed in the book, in print or digital, and a reader of the 2015 edition
    was in exactly the position a reader of this copy is. This is the Audit Gate''s source_evidence_never_printed
    pattern in its defining form: the gap is a property of how the work was published, not a digitisation
    loss, and filing it with digitisation losses would misattribute it. What it means for the source is
    precise: every claim about a named campaign is a claim about what Pandey SAYS about it, never about
    what the work looks like or what it achieved.'
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: Copyright page, quoted verbatim.
  confounders: The named route was unreachable in the CANON-014 session (no network egress), so the evidence
    is named, located and unreachable there — recoverable in principle, not in that environment.
  source_status: accepted
- qa_id: qa_ppm_0007
  source_id: pandey_pandeymonium
  source_locator: Ch. 25 'Domestic Multiculturalism'
  question: What structure does this source propose for a national agency operating across locations,
    and which part of the claim is the interesting one?
  answer: 'Two parts: a shared knowledge and resource pool that defines the culture and holds output quality
    up at any location, plus a locally knowledgeable team that understands local nuance and client expectation.
    He offers it as the claim that what applies to a global company across countries applies equally to
    a national company across locations within one country. The interesting part is that premise — that
    India is internally multicultural to a degree comparable with cross-border operation — and he asserts
    rather than argues it. The two-part structure itself is asserted, not derived, and his cases (the
    Madras office''s Konica film and India''s first brand music video for TI Cycles) illustrate rather
    than test it. The chapter''s most developed material is in fact about the durability of client relationships,
    not about the structure it opens by stating.'
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: '''Successful national companies ensure that there is a knowledge and resource pool that defines
    the culture…'''
  confounders: This passage appears twice in the available copy as a flattened pull-quote; the repetition
    is a conversion artefact, not authorial emphasis.
  source_status: accepted
- qa_id: qa_ppm_0008
  source_id: pandey_pandeymonium
  source_locator: Ch. 24 'Indian Advertising Has Been Unfair to Its Women'
  question: Where does this source locate the problem of women's representation in Indian advertising,
    and which part of his reasoning does the extraction separate out?
  answer: 'At RETENTION rather than entry: competent women leave and their accumulated knowledge is lost
    — ''a huge treasure of knowledge is lost when competent women leave our industry'' — and he states
    the conflict ''has to be resolved by the business, not by the woman'', naming extended maternity and
    paternity leave approvingly and contrasting advertising with Indian banking. The mechanism is that
    knowledge accumulated over a career leaves with its holder, so an industry that cannot retain people
    through a predictable life stage loses seniority rather than merely headcount. The extraction separates
    out his account of WHY the conflict exists, which rests on an essentialist premise stated in his own
    voice — that a woman ''is also the nurturer of the family'' and that the two roles conflict — because
    the locus-of-responsibility conclusion he draws does not depend on that premise.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''This conflict has to be resolved by the business, not by the woman.'''
  confounders: 'No data of any kind: no counts, no attrition rates, and the banking comparison names individuals
    rather than establishing that banking retains women better.'
  source_status: accepted
- qa_id: qa_ppm_0009
  source_id: pandey_pandeymonium
  source_locator: Ch. 18, 'Scam Ads'
  question: What two options does this source put to a young creative wanting awards, what is the mechanism
    for preferring one, and what is asserted without evidence?
  answer: 'Either produce unpaid speculative work for tiny or notional clients — ''barber shops, dentists,
    weight-loss clinics, your girlfriend''s boutique'' — or take a real issue and do genuine work on it,
    starting small in one''s own locality. The mechanism for preferring the second is that work which
    changes something real can propagate outward from a small beginning, which both produces the effect
    and supplies the award case, whereas ''a poster for a sweet shop will do nothing of the kind''. Asserted
    without evidence: that juries have become harder to fool. He also pre-empts the charge that his issue
    list promotes a government agenda, and answers it rhetorically rather than substantively.'
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: '''Even an award is difficult because the world and the juries have got smarter.'''
  confounders: He is a senior figure recommending unpaid public-issue work to juniors from a position
    where such work is career-safe for him; the asymmetry is not acknowledged.
  source_status: accepted
- qa_id: qa_ppm_0010
  source_id: pandey_pandeymonium
  source_locator: Preface
  question: What does this source give as its governing communication principle, where does it come from,
    and what kind of statement is it?
  answer: '''Whatever you say, say it with respect for the audience, say it in a context that the audience
    can understand, say it spontaneously, say it without fear, say it not to intimidate or frighten, but
    to delight.'' It comes from his father improvising verse to the household each morning in Jaipur,
    which he calls his ''kindergarten lessons in communication''. It is a credo, not a testable proposition:
    ''respect for the audience'' and ''delight'' are not defined and no way of checking whether a piece
    of work has them is offered.'
  answer_type: factual_recall
  difficulty: easy
  knowledge_type: advertising
  requires_application: false
  support: Preface, stated verbatim.
  confounders: The sentence appears twice in the available copy — once inside the paragraph and once as
    a flattened pull-quote — which is a conversion artefact, not emphasis.
  source_status: accepted
- qa_id: qa_ppm_0011
  source_id: pandey_pandeymonium
  source_locator: visual-evidence-ledger; PROVENANCE
  question: The archive's folders are named 'GoogleDoc/'. Why is this NOT evidence that the copy is a
    re-typeset non-publisher file, and what settled it?
  answer: 'Because the file carries Penguin''s complete copyright page: the Portfolio imprint, ''First
    published in Portfolio by Penguin Books India 2015'', both copyright lines including Amitabh Bachchan''s
    for the foreword, the cover-design credit to Rajiv Rao, the publisher''s liability disclaimer, the
    print ISBN 978-0-670-08859-1, and a separate digital-edition page whose e-ISBN 978-9-352-14004-6 MATCHES
    the ISBN declared in the OPF metadata. A re-typeset copy would not reproduce a matching e-ISBN. The
    folder name is a conversion-tool artefact. This is recorded rather than dropped because the corrected
    conclusion is load-bearing for admission and a reviewer should be able to re-run the check.'
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: Copyright page and digital-edition page; OPF metadata.
  confounders: The supplied filename also says 2016; the copyright page says 2015 twice and is authoritative.
  source_status: accepted
- qa_id: qa_ppm_0012
  source_id: pandey_pandeymonium
  source_locator: visual-evidence-ledger
  question: Ten sentences in this copy appear twice. What caused it, how was it found, and why does it
    matter beyond being untidy?
  answer: 'The printed book''s pull-quotes have been flattened into the body text, so each appears once
    inside its paragraph and once standing alone. It was found mechanically: a scan for sentences over
    90 characters occurring more than once returned exactly 10, each occurring exactly twice. It matters
    for two specific reasons rather than as untidiness. A naive extraction pass could read the standalone
    pull-quote as a second, separate claim and double-count it — which would inflate an object count and
    manufacture emphasis the author did not place. And any word-frequency or emphasis analysis over this
    copy is corrupted, because ten sentences carry double weight.'
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: Duplicate-sentence scan over the full text; 10 hits, each exactly twice.
  confounders: Each duplicated sentence is genuinely the author's; the defect is the duplication, not
    the content.
  source_status: accepted
- qa_id: qa_ppm_0013
  source_id: pandey_pandeymonium
  source_locator: Ch. 'Payback Time' region
  question: What condition does this source place on celebrity work, and why is it recorded as an observation
    rather than merged with another Indian source that says something similar?
  answer: 'That the viewer must find the celebrity, the script AND the idea memorable, not just the celebrity.
    It is recorded as an observation rather than merged with Parameswaran''s account of casting stars
    as characters for two reasons. First, no cross-source promotion is authorised by the task that produced
    this record. Second, and substantively, the two are not the same claim: Parameswaran gives a market-structure
    MECHANISM — differentiation erodes once every competitor holds the same asset, so it moves to how
    the asset is used — while Pandey states a bare craft requirement with no mechanism and no account
    of how to establish whether it has been met. Similar words, different claims; merging them would manufacture
    a convergence out of a shared topic.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''the viewer must find the celebrity, the script and the idea memorable, not just the celebrity'''
  confounders: The pair IS independent in lineage terms, so promotion is not blocked by dependence — it
    is declined on authorisation and on substance.
  source_status: accepted
- qa_id: qa_ppm_0014
  source_id: pandey_pandeymonium
  source_locator: whole book
  question: State precisely what this source can and cannot support, and give the one place the author
    counts the other branch.
  answer: 'It can support statements about what an eminent Indian practitioner believes and recommends,
    and about the mechanisms he articulates — the group self-report fabrication cascade, the review-without-context
    failure, the shared-constraint argument. It cannot support any claim that a practice CAUSES an outcome,
    for three reasons that hold across the whole book: every case offered is one that succeeded, no campaign
    outcome is evidenced anywhere (there is no sales, share or tracking figure in the book), and the work
    itself is not reproduced. The one place he counts the other branch is the Tata Cement story, where
    he notes that he ''could have been sacked'' and that being sacked at that seniority would have meant
    never getting a job in advertising again — an explicit acknowledgement that the lesson rests on a
    bet that happened to pay.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''Of course, what was unsaid was that I would be history if we didn''t win the pitch.'''
  confounders: The book is candid and likeable, which makes the survivorship easier to miss rather than
    harder.
  source_status: accepted
- qa_id: qa_ppm_0015
  source_id: pandey_pandeymonium
  source_locator: Ch. 7; operational-bindings
  question: A team wants to adopt this source's five-second attention criterion as a pass mark for a new
    evaluator. What does the record do, and why?
  answer: 'It refuses. The binding derived from this material supports asking whether a time-based asset
    holds attention through its opening, and its status_reason states that the five-second threshold is
    explicitly NOT adopted. The reason is that the figure is a practitioner''s rule of thumb offered in
    passing, with no validation, no account of how it was arrived at, and no proposed way of checking
    it. Adopting it would be inventing a pass mark, which this project forbids — the same discipline that
    keeps the temporal-video pass mark recorded as non-existent rather than guessed. There is a second
    reason too: the author executes his criterion as a human observer in the room, and an automated attention
    measure would be a different instrument with its own validation problem, about which this source supports
    nothing.'
  answer_type: application
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: '''If they are chatting and not looking at the TV commercial after five seconds, we have lost
    them.'' Binding bnd_ppm_0003 status_reason.'
  confounders: The criterion is concrete and plausible, which is precisely what makes it tempting to adopt
    without validation.
  source_status: accepted
- qa_id: qa_ppm_0016
  source_id: pandey_pandeymonium
  source_locator: Ch. 6 'The Human Behind the Client'
  question: The author approached the Pidilite account expecting a punishment posting. What did he find,
    and what does the episode actually establish?
  answer: 'He was told the category was boring, the client did not allow creativity and the budgets were
    small. He found the opposite: Pidilite wanted only creativity that worked for the brand, with no interference
    once an idea was agreed, no painful meetings and no research — and he says no company in his career
    won him more recognition, awards and respect. What the episode establishes is narrower than the lesson
    he draws about preconceived notions: it establishes that his prior expectation about one account was
    wrong, which is a good reason to hold such expectations loosely. It does not establish that preconceptions
    are generally wrong, because the accounts where the warning turned out to be accurate are not in the
    book.'
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: '''I look back and I wonder, what if I had wriggled out of the Pidilite account based on my
    preconceived notions?'''
  confounders: Same survivorship shape as the rest of the book, in a case where the point being made is
    nonetheless reasonable.
  source_status: accepted
- qa_id: qa_ppm_0017
  source_id: pandey_pandeymonium
  source_locator: audit record, application_fit
  question: Seven of this source's ten objects have no operational binding and none binds to Creative
    IR. Is that a gap?
  answer: No. The book is about how people work together and how work is judged, not about what an artefact
    should be, so most of it is professional and organisational knowledge for which this project has no
    consumer — agency-client relationship practice, standing by one's work, retention of women in the
    industry, the structure of a multi-office national agency. The nearest Creative IR candidate, that
    a celebrity must not be the only memorable element, is stated as a requirement with no account of
    how to establish whether it has been met, so it fills no field without our inventing the test. Genuine
    knowledge with no current application is a legitimate state, and the alternative — manufacturing bindings
    for coverage — is the failure the mandatory-binding rule was retired to prevent.
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: 'audit record application_fit: creative_ir no_current_binding; three bindings total.'
  confounders: 'A low binding count reads as a weak source and is not: the same audit records the strongest
    fit as two governance prohibitions that bear directly on live evaluator work.'
  source_status: accepted
