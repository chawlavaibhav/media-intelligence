- qa_id: qa_nnn_0001
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Introduction; Ch. 'The Tingling Freshness of Teens'
  question: The book's thesis is that advertising records social change. Where does the author record
    a case that runs against his own thesis, and why does that case matter more than the ones supporting
    it?
  answer: 'In the chapter on teenagers he notes that Hindi cinema was dominated by the Angry Young Man
    from 1975 to 1985, through the Emergency, high inflation and high unemployment, and then says plainly:
    ''In advertising, however, we don''t see much evidence of anger during that period.'' Film and advertising
    diverged for a full decade. It matters more than his supporting cases because his thesis as stated
    cannot fail — a campaign matching society confirms it, one running ahead of society confirms it, and
    one reaching into the past confirms it too — so the only informative evidence is a case he could have
    omitted and did not. He offers no mechanism for the divergence and no systematic survey of the period.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''The time was ripe for the rise of a new hero stereotype, the Angry Young Man… In advertising,
    however, we don''t see much evidence of anger during that period.'''
  confounders: The tempting wrong answer is to treat the exception as a minor aside; it is the book's
    only falsifying instance.
  source_status: accepted
- qa_id: qa_nnn_0002
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'Jo Biwi Se Kare Pyaar…', Airtel passage
  question: A team wants to use a corpus of Indian television commercials from 2014 as evidence about
    how common working-woman households were that year. On this source's own position, what is wrong with
    that, and what would the corpus actually be evidence about?
  answer: 'The author blocks the inference himself. Discussing a 2014 Airtel commercial in which a woman
    manager''s subordinate turns out to be her husband, he writes that the ad ''was a depiction of a future,
    not the current reality'', and that in most Indian homes the older division of roles still held. His
    stated mechanism is that good advertising deliberately runs one step ahead of the consumer, which
    decouples depiction from prevalence: the depiction is selected for aspirational pull. So the corpus
    is evidence about what advertisers judged aspirational in 2014, not about how common the arrangement
    was. Note the author does not say how far ahead is too far, and offers no test.'
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: '''But I would submit that the Airtel ad was a depiction of a future, not the current reality.'''
  confounders: The same ad drew opposite readings — praised as an ode to the new Indian woman, criticised
    for still putting her at the stove — and the author declines to adjudicate.
  source_status: accepted
- qa_id: qa_nnn_0003
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'No Squeeze, No Wheeze, No Navel Please!', Sweetex passage
  question: An agency has its storyboard approved by the broadcaster and shoots the film. What does this
    source's first-hand case say about what that approval guarantees, and what is the mechanism?
  answer: 'It guarantees nothing about the finished film. Under Doordarshan, clearance ran as two independent
    gates: the storyboard before production and the film afterwards. The author''s own Sweetex campaign
    cleared the storyboard and was then rejected on the finished film for showing the model''s navel in
    an opening close-up, forcing a reshoot at the advertiser''s cost. The mechanism he gives is that a
    storyboard is a pictorial abstraction which does not fix framing, duration or emphasis, so the censor
    assessing the film is assessing material the storyboard never showed and can reach a different verdict
    on the same concept. The book evidences the same independence twice: Doordarshan also withdrew a storyboard
    approval it had already given to KamaSutra.'
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: '''The agency did not see any problem since the storyboard was already approved. Then came
    the bombshell. Doordarshan rejected the film on the grounds of obscenity.'''
  confounders: This is a Doordarshan-era regime the author says kept changing; it is not a description
    of current Indian practice.
  source_status: accepted
- qa_id: qa_nnn_0004
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'No Squeeze, No Wheeze, No Navel Please!', Doordarshan rules
  question: A regulator forbids the single word a product category depends on. What does this source record
    an advertiser doing, what is the mechanism, and why is this not the same as a word wearing out through
    overuse?
  answer: 'Doordarshan forbade *gori* (''fair'') in fairness-cream advertising. The advertiser substituted
    *nikhri*, whose dictionary sense is ''improved'' or ''better'', and sustained use loaded the permitted
    word with the forbidden meaning until, the author says, nikhri came to mean ''fairer'' to the lay
    public. The prohibition changed the word and not the proposition. The mechanism is that a lexical
    ban acts on a token, not on the meaning an audience assigns: if one advertiser uses a permitted token
    consistently in the banned token''s slot, the audience learns the mapping. It is the opposite of a
    word wearing out — here a word ACQUIRES a meaning it did not have, under an external prohibition,
    driven by one advertiser''s sustained investment, whereas inflation is a word LOSING force through
    universal adoption by many writers with no prohibition involved.'
  answer_type: mechanism
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''They found a way around it by using the word nikhri… Though nikhri in Hindi literally means
    "improved".'''
  confounders: The claim that nikhri now means 'fairer' to the lay public is the author's assertion; no
    survey supports it. Nothing here endorses the category's proposition.
  source_status: accepted
- qa_id: qa_nnn_0005
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'No Squeeze, No Wheeze, No Navel Please!', ASCI passage
  question: ASCI was a voluntary self-regulator whose rulings members obeyed and non-members often ignored.
    What single change gave its findings reach over non-members, and what is the general shape of that
    move?
  answer: In 2007 the government of India amended the Cable TV Network Rules so that no advertisement
    ASCI found objectionable could be aired through any cable network. The general shape is that a self-regulator
    binds only its members, so attaching its findings to a distribution rule that applies to every carrier
    makes the finding effective against non-members too — the constraint moves from the advertiser, who
    may not be a member, to the channel that would have to carry the ad, which is bound regardless.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: '''the government of India in 2007 modified the Cable TV Network Rules to ensure that no ad
    found objectionable by ASCI could be aired through any cable network'''
  confounders: The account of member compliance is an insider's characterisation, not a compliance measurement;
    the book reports no upheld-complaint rate.
  source_status: accepted
- qa_id: qa_nnn_0006
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'No Squeeze…', KamaSutra passage
  question: A brand must enter a category whose only mass public framing is a government health programme,
    and wants to be premium. What three requirements does this source report a name having had to satisfy
    at once, whose finding is it, and how was it arrived at?
  answer: Maximum reach and intelligibility, an erotic connotation, and cultural legitimacy — satisfied
    simultaneously by naming the condom brand 'KamaSutra', positioned against the state's Nirodh family-planning
    framing as an enabler of better lovemaking and priced at a premium to both Nirodh and imported brands.
    The finding is the anthropologist William Mazzarella's, not the author's, and Mazzarella reached it
    by speaking with the campaign's creators after the fact — so it is a reconstruction of a naming decision
    rather than a record made at the time. The source presents the three requirements for this case and
    does not claim they generalise.
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''it instantly satisfied three crucial requirements: maximum reach/intelligibility, an erotic
    connotation, and cultural legitimacy'''
  confounders: The campaign's outcome was contested — ASCI ordered modifications, a Rajya Sabha member
    sought a ban, Doordarshan withdrew its storyboard approval, and the company fell back to shop displays.
    Commercial success is not established.
  source_status: accepted
- qa_id: qa_nnn_0007
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'I am a Complan Girl! I am a Complan Boy!', launch-timing passage
  question: A brand manager plans to run a children's snack campaign through the summer holidays, reasoning
    that children are free to watch television then. What counter-argument does this source record, whose
    is it, and what follow-on conclusion is drawn about media weight?
  answer: The author held exactly that position and records being argued out of it by the marketer T.
    Krishnakumar, who held that a child-directed product should launch while school is in session. The
    mechanism is that the child does not experience the ad as advertising but as tradeable news, and school
    is where the audience for that trade exists — the recipient is also a transmitter, so the value of
    an exposure depends on whether the recipient currently has an audience. The follow-on conclusion recorded
    is that the usual minimum-threshold weight principle need not apply to child-directed advertising,
    because amplification comes from retransmission rather than frequency.
  answer_type: application
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: '''the best time to launch a kid-focused product is when the kid is attending school''; ''we
    need not apply the minimum threshold principle to advertising'''
  confounders: No measurement supports either position — it is one senior practitioner's argument defeating
    another's, reported by the loser. The weight conclusion is 'propounded' with no test and no account
    of how far weight can be relaxed. The argument assumes a pre-digital school day supplying a shared
    physical assembly.
  source_status: accepted
- qa_id: qa_nnn_0008
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'I am a Complan Girl…', pester power passage
  question: A planner treats 'children influence household purchases' as a single quantity across a client's
    portfolio of soap, breakfast cereal and a family car. What three bands does this source report, and
    which distinction is the durable part?
  answer: Influence is strongest for low-value products aimed at the child (snacks, sweets, drinks); it
    reduces to a VETO rather than a positive selection in shared household categories such as soap, shampoo
    and toothpaste; and it is smallest in durables such as cars and television sets, though said to be
    rising because the child sometimes holds more product knowledge than the parent. So cereal sits in
    the first band, soap in the second, the car in the third. The durable part is the veto/selection distinction
    — the ability to block is not the ability to choose — because the specific category examples are period-
    and market-bound.
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: '''the child could have a "veto" in other products like soaps, shampoos, toothpaste etc.'''
  confounders: Attributed throughout to unnamed 'consumer researchers'; no study, sample or date is cited
    anywhere in the passage, and the chapter endnotes do not cover it.
  source_status: accepted
- qa_id: qa_nnn_0009
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'I am a Complan Girl…', Colgate sachet passage
  question: A brand plans to extend the sachet format from shampoo into toothpaste. What does this source
    predict, what is the proposed mechanism, and how confident is the author?
  answer: 'It predicts failure, and reports that Colgate''s sachet attempt did fail. The proposed mechanism
    is that a sachet prices a single occasion, which suits occasion-shaped consumption and not continuous
    consumption: shampooing was an occasional act in many Indian homes so a sachet could be bought for
    a special occasion, whereas a consumer ready to adopt a daily-use category would buy the full pack
    instead. The author''s confidence is explicitly low — he writes ''I suspect'', proposes no test, and
    extends the same conjecture to hair oil ''probably for the same reason'' without new evidence. The
    underlying usage-frequency premise is asserted, not measured.'
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: '''I suspect consumers did not see toothpaste as an occasional use product.'''
  confounders: This is the author's conjecture about an observed commercial pattern, not a reported study.
    Do not upgrade 'I suspect' to a finding.
  source_status: accepted
- qa_id: qa_nnn_0010
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'The [In] Complete Man', Emami/HUL passage
  question: A category leader has known for years from its own data that men use its women's product,
    and does nothing; a small entrant opens the category and the leader follows within months. What explanation
    does this source give, and what alternative does the author leave open?
  answer: 'The explanation is that the incumbent''s accumulated equity is an asset its own actions can
    damage, so its expected cost of a category-extending move includes a risk a newcomer with nothing
    to lose does not bear — the asymmetry can hand first-mover advantage to the smaller firm. The author''s
    instance is Emami''s Fair & Handsome in 2005 against Hindustan Unilever, which he says had long known
    men were using Fair & Lovely. He explicitly leaves open an alternative he never rules out: ''Was it
    just a lucky break?'' A single successful entrant is consistent with luck, and the case is survivorship-shaped
    — newcomers who took the same risk and failed are not counted.'
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: '''A newcomer has no such fears. They have nothing to lose.'''
  confounders: A separate named practitioner asserts in the same chapter that Indian male grooming was
    created single-handedly by marketing with no governmental or societal support — a strong causal claim
    with no evidence behind it here.
  source_status: accepted
- qa_id: qa_nnn_0011
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'Meri Khubsurti Ka Raaz', pre-testing passage
  question: Why does this source say celebrities are cast for reasons unconnected to whether they make
    the advertising work, and what general hazard does that name?
  answer: Because celebrities raise pre-test scores. The celebrity fee is a small fraction of the media
    budget — the author puts it at roughly 5 to 10 per cent — and the pre-test is the gate the marketing
    manager must clear, so the instrument itself creates a reason to cast a celebrity independent of effect.
    The general hazard is that when a measurement stands between work and its approval, and a controllable
    input reliably raises that measurement, the input gets bought whether or not it raises the outcome
    the measurement was meant to predict. The source names no instrument, gives no score differential,
    and never discusses whether pre-test score predicts in-market outcome at all.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: '''if you can get a good score in the pre-test, the marketing manager is not going to let that
    go'''
  confounders: The author is an agency principal, a party with an interest in how client-side testing
    is regarded. This says nothing about whether celebrities work.
  source_status: accepted
- qa_id: qa_nnn_0012
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'Meri Khubsurti Ka Raaz', casting and Cogito study
  question: This chapter states both that a star must now be cast as a character rather than as a star,
    and that a study found the star's 'aura' dominates the other measured dimensions. Are these consistent,
    and what does the source do about it?
  answer: 'They are in tension of EMPHASIS and are not logically inconsistent, and the source states both
    without reconciling them. A performer can carry high aura AND be deliberately cast as a character;
    on the source''s own account the second practice exists precisely BECAUSE the first became universal,
    so mere celebrity presence stopped distinguishing one advertiser from another and differentiation
    moved to how the asset is used. What the two do not agree on is where the effort should go: the casting
    claim puts it in the execution, while the reported Cogito 2002 study concludes that picking the star
    with the biggest aura matters more than the other two measured dimensions. The author states both
    in the same chapter and notices no tension. Note also that ''Aura'' is never defined anywhere in the
    book, so the dimension reported as decisive is the one whose construction is least visible, and the
    study is by his own agency''s consulting arm and is reported with no sample, method, outcome measure
    or effect size.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''The study showed that brands will do well to pick the star with the biggest aura''; ''you
    need to "cast" the film star as a character in a film rather than as a "star"'''
  confounders: The study's own conditional advice — heartthrobs for a youth brand, maturity for a serious
    category — is itself not obviously consistent with 'pick the biggest aura'.
  source_status: accepted
  amended_by: CANON-014 final reconciliation. The extraction had recorded these two objects as a structural
    `conflict` in scs_nnn_004, and this answer followed that framing. The conflict edge was removed because
    the statements create a tension without contradicting each other, and the answer is corrected to say
    exactly that. The observation that the source states both and reconciles neither is unchanged and
    survives in the system's system_level_uncertainty.
- qa_id: qa_nnn_0013
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: plate insert, Fevicol plate (images/00005.jpg)
  question: An adhesive brand has no product demonstration budget and no headline. What does the reproduced
    Fevicol execution do instead, and what does the device require of its audience?
  answer: 'It carries the whole argument in one photograph: an overcrowded Indian suburban train with
    dozens of men hanging off the side of a carriage, on which a ''FEVICOL — The Ultimate Adhesive'' panel
    is mounted. There is no headline and no body copy; the adhesion claim is made by the juxtaposition
    alone, and the viewer infers it rather than being told. What the device requires is that the scene
    already be culturally familiar — it recruits an everyday sight the audience knows, so it does not
    travel to an audience that has not seen an Indian suburban train. That dependence is the extractor''s
    observation from the plate, not something the source states; the book''s caption asserts only that
    good creative work is possible for a humble category.'
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: 'Caption: ''The Fevicol campaign was proof that scintillating creative advertising can happen
    for even a humble adhesive.'' Plate inspected at 566 px.'
  confounders: The source does not date this execution and gives no outcome data for it.
  source_status: accepted
- qa_id: qa_nnn_0014
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: plate insert, plates 1, 4, 11 and 15
  question: Four of this book's nineteen plates were opened and still did not establish what their captions
    assert. What is the shared shape of the failure, and give two of the four.
  answer: 'In each case the artefact reproduced is not the artefact the caption is about. The Rasna caption
    describes a television line heard across the country, but the plate is a press advertisement in which
    ''I love you Rasna'' appears only as a small lockup beside the logo. The Naukri caption quotes spoken
    abuse (''Hitler. Arrogant. Rascal. Idiot…'') but the plate is a single silent frame of a shouting
    man in which no words appear. The other two are Pepsi, whose caption quotes a line absent from the
    frame, and Asian Paints, whose caption says the campaign made ''Mera wala blue'' a household phrase
    while the plate is a later Janmashtami execution punning on the phrase as already established. The
    audit vocabulary for this is figure_inspected_claim_underdetermined: the figure was looked at and
    the claim still is not settled. It is a finding about the representation, not about the campaigns
    — the captions may well be true.'
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: All 19 plates inspected; four compared against their captions and found not to settle them.
  confounders: The wrong reading is that the captions are false. The point is that plate-plus-caption
    is not a settled pair, so a downstream consumer must not treat it as one.
  source_status: accepted
- qa_id: qa_nnn_0015
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: plate insert, Amul plate (images/00021.jpg)
  question: A brand wants a hoarding format it can produce fast enough to comment on this week's news
    while staying instantly recognisable. What structure does the reproduced Amul topical show, and what
    is the inferred reason it works?
  answer: A fixed form with exactly one variable slot. The plate shows a flat yellow ground, a large hand-lettered
    display pun as the only headline ('THOROUGHBREAD', over a horse-racing subject), a cartoon illustration
    of the Amul girl acting the pun out, and a constant brand signature — 'utterly butterly Amul' in a
    small casual hand. Only the pun and its illustrated subject change between executions; ground, character,
    lettering manner and signature do not. The inferred reason is that holding everything constant except
    the joke makes each new execution recognisable before it is read, so it can be produced and posted
    fast while remaining unmistakably the same campaign. Both the structure and the speed reasoning are
    the extractor's from one plate; the source says only that this was the first topical and that hundreds
    followed.
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: 'Caption: ''The first time Amul hoardings became "topicals"… hundreds of "topicals" have followed
    this one.'' Plate inspected.'
  confounders: Only ONE execution is reproduced in this copy, so the invariant set is inferred from a
    single instance plus the source's assertion that the series ran.
  source_status: accepted
- qa_id: qa_nnn_0016
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: plate insert, Tuffs plate (images/00002.jpg)
  question: The Tuffs advertisement became a fourteen-year obscenity case. What does the layout of the
    reproduced plate show, and what does the extraction record as inference rather than as the source's
    claim?
  answer: Roughly half the page is a full-bleed black-and-white photograph of two nude models embracing
    with a python, both wearing white trainers; the other half is a flat purple field carrying a small
    script line 'His. And hers.', two postage-stamp product insets, and 'TUFFS / HARDWEAR FOR FEET' in
    a heavy condensed sans. The product is the smallest element on the page. The source recounts the case
    at length and says nothing whatever about the composition, so the observation that the product is
    deliberately minimised relative to the shock image is the extractor's from the plate. Marked explicitly
    as inference and NOT supported by the source is the further suggestion that this asymmetry left the
    campaign with nothing to fall back on once the image itself was prosecuted.
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: Plate inspected at 566 px. Caption records only the court case.
  confounders: The plate is a black-and-white reproduction except for the purple field; colour fidelity
    is not established.
  source_status: accepted
- qa_id: qa_nnn_0017
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: plate insert, Coca-Cola plate (images/00013.jpg)
  question: What does the reproduced 'Thanda matlab Coca-Cola' plate show that the book's text does not
    say, and why does it matter?
  answer: 'Two things. The line ''Thanda matlab'' is set in DEVANAGARI beside the Latin Coca-Cola logotype,
    so the appropriation is of the Indian script as well as of the Hindi word — the text names the word
    and never mentions the script. And the setting is an ordinary unstyled small-town street: whitewashed
    wall, stacked red crates, a squatting child, a dog, a leaning pole, photographed without aspirational
    lighting. It matters because the mechanism is only visible in the image: appropriating a common noun
    makes the brand the default referent for a whole category of need, and setting it in the local script
    and an unstyled local place asserts that the claim already holds there rather than being addressed
    to it. A text-only pass would have recorded the word and missed both.'
  answer_type: application
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: Caption records the appropriation of the Hindi word and the use of Aamir Khan in the television
    work. Plate inspected.
  confounders: The plate is the outdoor execution and contains no celebrity, so the caption's claim about
    the television commercials is NOT settled by it. The footline small print is illegible.
  source_status: accepted
- qa_id: qa_nnn_0018
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: plate insert, Air India plate (images/00012.jpg)
  question: How does the reproduced Air India poster get an Indian carrier to claim a foreign destination,
    and why is the device repeatable?
  answer: By inserting the airline's Maharaja mascot into a set of foreign icons and scaling him down.
    The plate shows 'London' in a heavy blue display face over four flat-illustrated Buckingham Palace
    guardsmen in red tunics and bearskins, with the moustachioed Maharaja in a striped turban standing
    among them at roughly half their height. The joke is carried entirely by the scale relationship and
    the uniform rhyme; there is no copy. The inferred reason it repeats is that the mascot's small stature
    and deferential posture make the encounter comic rather than competitive, so the carrier can claim
    the destination without claiming parity with it — and only the icon set has to change for a new destination.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: 'Caption: ''one of the most widely recognized advertising icons for many decades''. Plate inspected.'
  confounders: Only one destination execution is reproduced, so repeatability is inferred from a single
    instance plus the source's statement that the icon ran for decades. The mascot is a mid-century caricature
    of an Indian aristocratic type, which the source does not discuss.
  source_status: accepted
- qa_id: qa_nnn_0019
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: plate insert, NDDB plate (images/00007.jpg)
  question: In the reproduced NDDB frames, where does the word 'doodh' appear, and what does that placement
    buy?
  answer: It is set as the picture itself — 'doodh' repeated four times in a heavy rounded yellow display
    face against black, beside the singer — rather than appearing as a subtitle beneath a scene. The inferred
    benefit is that typesetting the sung word as the image binds the audio and the visual to the same
    token, so the frame stays legible with the sound off and the jingle stays attributable with the picture
    unseen. The source's caption says only that the campaign used 'doodh' musically to make milk sound
    aspirational; the placement observation and the sound-off reasoning are both the extractor's.
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: 'Caption: ''The signature campaign used "doodh" musically to make milk sound cool and aspirational.''
    Plate inspected.'
  confounders: A two-frame composite of low-resolution grabs; nothing may be asserted about the commercial's
    edit, pace or duration.
  source_status: accepted
- qa_id: qa_nnn_0020
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'I am a Complan Girl…', SHOOTING BABIES sidebar
  question: A producer is scheduling a one-day shoot with an infant. What does this source record as standard
    practice, what is the reason, and what must not be inferred from it?
  answer: 'That a full day may yield only about five seconds of usable footage, because the subject''s
    state cannot be directed, and that consequently no baby shoot is booked with fewer than three infants
    standing by. The reason is that the performance cannot be directed, only waited for, so usable footage
    is a function of chance over time — adding interchangeable subjects multiplies the independent chances
    within the same booked day rather than extending the day. What must not be inferred: this is advice
    about photographing a live human infant and is evidence about nothing whatever concerning a generative
    model. Any binding from it stays a production candidate with a null target path.'
  answer_type: application
  difficulty: easy
  knowledge_type: production
  requires_application: true
  support: '''A full day shoot may end up delivering just five seconds of useful footage… all baby shoots
    have no less than three babies as stand by.'''
  confounders: The five-second figure is a sidebar rule of thumb, not a measured yield; no range or source
    is given.
  source_status: accepted
- qa_id: qa_nnn_0021
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Introduction, content-analysis passage
  question: The introduction invokes a frame-by-frame content analysis of fifty years of Indian television
    advertising. What does it report from it, and what is missing?
  answer: 'Two directional findings: that the presentation of women changed dramatically, and that the
    number of words used per advertisement increased, to the point that even soap now carries a wordy
    explanation. Missing is everything that would let a reader check it — no numbers, no sample, no period
    breakdown, no method, and no attribution anywhere in the passage or in the Introduction''s endnotes,
    which cite only Lears and Mehta, neither of which is a content analysis. This is the book''s clearest
    case of a measurement being claimed and its result not being supplied, and the word-count finding
    is interesting precisely because it is checkable in principle and uncheckable from this source.'
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: '''A frame-by-frame content analysis of consumer product television advertising in India, released
    over the last fifty years, shows some very interesting facts.'''
  confounders: The temptation is to treat the two directional statements as findings. They are the reported
    conclusions of a study the reader is never shown.
  source_status: accepted
- qa_id: qa_nnn_0022
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Introduction, television penetration passage, endnote 2
  question: A strategist wants to use this book's television penetration series as a growth curve. What
    is wrong with it as a series?
  answer: The measurement base changes across it. The figures are 55 'licensed television sets' in 1964,
    about 100,000 in 1975, a little over 2 million in 1982, 34 million 'families' owning a set in 1991,
    and over 60 per cent of 250 million 'homes' in 2014. Licensed sets, families and homes are three different
    units, so the numbers are not a consistent time series and must not be plotted as one. They are also
    third-party figures cited to N. Mehta's *Behind a Billion Screens* — this source measures nothing
    — and they are historical, so they cannot be used as current market context.
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: '''There were a grand total of fifty-five licensed television sets when Nehru died in 1964…
    over 60 per cent of the 250 million homes in India had a television set.'''
  confounders: The figures may each be individually correct; the defect is in treating them as one series.
  source_status: accepted
- qa_id: qa_nnn_0023
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'Bole Mere Lips, I Love Uncle Chipps'
  question: What changed about who wrote Indian advertising from the mid-1970s, and what is the precise
    distinction the source draws?
  answer: Through the 1960s and 70s the business was dominated by English-medium, convent-educated writers
    who had succeeded the departing British admen, and Indian-language writers were confined to a separate
    'Language Department'. From the mid-1970s writers such as Kamlesh Pandey began creating work ORIGINALLY
    in Hindi rather than translating into it, and the source names Piyush Pandey, Balki and Prasoon Joshi
    as continuing that. The precise distinction is origination versus translation — the source draws it
    explicitly, saying the work was 'all originally created in Hindi' — and it matters because confining
    a language to a translation function separates the language from the idea.
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: '''Indian language writers were confined to the "Language Department"… all originally created
    in Hindi'''
  confounders: An insider's history told through individuals he knew; no institutional data on department
    structure or staffing is offered.
  source_status: accepted
- qa_id: qa_nnn_0024
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: Ch. 'Meri Khubsurti Ka Raaz', Rajagopal passage
  question: What does this source report about Indian brands and bazaar art, whose claim is it, and why
    must this material not be treated as a primary source on the subject?
  answer: 'Reporting Arvind Rajagopal, it records that Indian brands borrowed totems from bazaar art —
    including images of gods — specifically when selling products the consumer was not yet familiar with,
    citing 1950s Pears advertising and Burmah Shell''s distribution of calendars featuring Hindu deities.
    The mechanism is that an unfamiliar product cannot be argued for in its own terms because the audience
    has no frame for it, so attaching it to imagery that already carries authority supplies one. It is
    Rajagopal''s claim, reported without a specific citation in the passage, and the author then extends
    it himself to 2010s celebrity endorsement as a likelihood. It must not be treated as a primary source
    because it is second-hand throughout: the author is reporting a scholar, not observing the material,
    so if a primary source on Indian calendar art were ever admitted this could not count as independently
    corroborating it.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''Professor Rajagopal says that brands borrowed from bazaar art to connect with the consumers
    when selling products the consumer was not familiar with.'''
  confounders: The Pears line quoted is from an old poster, undated and unsourced. The extension to celebrity
    endorsement is the author's own speculation and is marked as such.
  source_status: accepted
- qa_id: qa_nnn_0025
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: plate insert, Jenson & Nicholson plate (images/00008.jpg)
  question: A paint company wants an outdoor execution containing no product, no pack and no person. What
    does the reproduced Jenson & Nicholson poster contain, and what kind of claim is it making?
  answer: 'A white ground, one black headline — ''Whenever you see colour, think of us.'' — a single large
    red cross-shaped block in the centre, and a footline reading ''Jenson & Nicholson [J&N monogram] The
    most trusted name in paints''. No product, no pack, no person and no body copy. The claim is about
    memory attribution rather than about any product property: the headline instructs the viewer to associate
    an entire perceptual category with the advertiser, and the single saturated symbol supplies the category''s
    exemplar. The source''s caption asserts only that this was ''an iconic first in corporate brand-building''
    and gives no date, market or outcome, so that characterisation is unsupported.'
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: Plate inspected at 566 px; caption records only 'an iconic first in corporate brand-building'.
  confounders: The red cross form closely resembles a protected humanitarian emblem; the source does not
    raise this and the extraction records it as an observation about the plate, not as a legal claim.
  source_status: accepted
- qa_id: qa_nnn_0026
  source_id: parameswaran_nawabs_nudes_noodles
  source_locator: whole book; PROVENANCE
  question: Three kinds of research are reported in this book with different standing. Distinguish them,
    and say which carries a declared interest.
  answer: 'First, named external third-party work with real citations — Mehta on television penetration,
    UNICEF on the youth bulge, the Census, Goffman, McNeal, Padamsee — which survives in intact chapter-grouped
    endnotes and can be followed up. Second, work attributed to unnamed ''consumer researchers'' or ''research
    said'', as in the pester-power bands, where no study, sample or date is given and the endnotes do
    not cover it. Third, proprietary qualitative studies by Cogito Consulting, the consulting arm of the
    author''s own agency FCB Ulka — the ManMood and Youth Mood studies and the 2002 celebrity study —
    reported as findings with no method, sample or effect size. The third carries the declared interest:
    the publisher of those findings has a commercial interest in them, and the author is a principal of
    the firm.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: Endnotes for each chapter; 'FCB Ulka's account planning team conducts regular studies… The
    team publishes these reports as special Mood Studies in the Cogito Journal.'
  confounders: The presence of good citation discipline for the first category makes it easy to extend
    the same trust to the second and third, which the endnotes do not support.
  source_status: accepted
