- qa_id: qa_god_0001
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market", section "Forcing a focus" (spine 11)
  question: 'State Godin''s mechanism for why narrowing the audience improves the work. The answer is
    not that a smaller audience is easier to reach — what is it?

    '
  answer: 'The mechanism runs through the artefact, not the audience. Pursuing mass means aiming at the
    centre of the curve, which requires you to offend no one and satisfy everyone, and those are constraints
    on the thing you make: they force compromises and generalisations, and produce work that is average.
    Narrowing removes the constraints. With a small, specific audience you can go to their extremes, take
    a position where you alone are the perfect answer, and overwhelm their wants with attention — producing
    a change profound enough that people cannot help but talk about it. So the size question is asked
    as a floor, not a target: what is the minimum number of people you would need to influence for the
    effort to be worth it.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: 'Forcing a focus: the relentless pursuit of mass will make you boring, because mass means average,
    requires you to offend no one and satisfy everyone, and leads to compromises and generalisations;
    begin instead with the smallest viable market; find a corner of the market that can''t wait for your
    attention and go to their extremes.

    '
  confounders:
  - the efficiency reading — that a small audience is cheaper to reach, which is not his argument
  - reading 'smallest viable market' as a starting size to be grown out of rather than as a constraint
    that improves the work
  - dropping the word 'viable'; Godin says no fair shipping junk
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0002
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market", section "Specific is a kind of bravery" (spine 11)
  question: 'Godin says naming a specific audience takes bravery. Bravery against what? Give his mechanism,
    not the sentiment.

    '
  answer: 'Against being shown to have failed. His argument is that a specific audience makes the work
    accountable — it matched or it did not, it spread or it did not — whereas an unspecified audience
    cannot be contradicted by any outcome, so "everyone" functions as a place to hide. He names the comfort
    explicitly: you will never be able to serve everyone, which is comforting, since you are less likely
    to be disappointed when it does not happen. The claim is therefore about falsifiability, not about
    ambition. Note that this is a claim about practitioners'' motives, made from his observation of the
    people he teaches and no other evidence.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: 'Specific is a kind of bravery: specific means accountable — it worked or it didn''t, it matched
    or it didn''t, it spread or it didn''t; are you hiding behind everyone or anyone; you''ll never be
    able to serve everyone, which is comforting.

    '
  confounders:
  - reading the bravery as commercial risk-taking rather than as exposure to judgement
  - assuming he means courage to turn down revenue
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0003
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market", section "Shun the nonbelievers!" (spine 11)
  question: 'A campaign is widened to a general audience and the work gets progressively blander over
    three rounds of feedback. What does Godin say happened, and where does he say the mechanism operates?

    '
  answer: 'Seeking the largest possible audience guarantees mass rejection — the chorus of no becomes
    deafening, and the feedback arrives direct, personal and specific. Under that pressure the natural
    response is to sand off the edges and fit in, and to fit in more than anyone else. His point about
    location matters: the mechanism operates through the maker, not the audience. Nothing about the audience
    changed; the maker averaged the work in response to rejection from people it was never for. Since
    the edges were what made it fit its intended audience, more reach destroyed the thing that was working.
    His instruction is to resist, on the ground that the rejection carries no information: it is not for
    them.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Shun the nonbelievers: when we seek to serve the largest possible audience, that audience
    will turn us down and the chorus of no will become deafening; in the face of so much rejection it''s
    easy to sand off the edges and fit in, fit in all the way, fit in more than anyone else; resist, it''s
    not for them.

    '
  confounders:
  - attributing the blandness to committee process or client timidity rather than to the reach decision
  - concluding all negative response should be ignored; Godin separately distinguishes feedback from advice
  - assuming the audience changed; his mechanism is that the maker did
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0004
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market", section "It's not for you" (spine 11)
  question: 'Godin argues that saying "it''s not for you" is an act of respect. Set out the argument,
    and give the case in his own book that shows what it costs.

    '
  answer: 'The argument has two parts. Refusing to pursue someone respects them: you are not wasting their
    time, pandering to them, or insisting they change their beliefs, and "I made this for you, not for
    the other folks" and "it''s not for you" are two sides of one coin. And the alternative is unavailable
    anyway — every bestselling book has one-star reviews, and it is impossible to create work that both
    matters and pleases everyone. The cost shows in his restaurant case: a group that eliminated tipping
    had to accept that diners who enjoyed the status of leaving a large tip could no longer get it, and
    the honest formulation is "it''s not for you, sorry". So the choice is not how to avoid disappointing
    people; it is which people to disappoint.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: 'It''s not for you: shows the ability to respect someone enough that you''re not going to waste
    their time, pander to them, or insist that they change their beliefs; it''s impossible to create work
    that both matters and pleases everyone. No tipping at USHG: some diners find joy in the status of
    leaving a big tip and the group can no longer offer that thrill.

    '
  confounders:
  - reading exclusion as a marketing tactic for creating exclusivity rather than as an unavoidable consequence
    stated plainly
  - assuming the excluded group is unimportant; in his case they were paying customers with a preference
    he removed
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0005
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market", section "The comedian's dilemma" (spine 11)
  question: 'A piece of work fails badly in front of an audience. Godin says there are two candidate causes.
    What are they, what does he supply to tell them apart, and why does that matter?

    '
  answer: 'The two are: the work is not as good as it needs to be, or you failed to be clear about who
    it was for in the first place. His illustration is a skilled comedian bombing in front of a tour group
    that does not speak his language — total failure, no information about the material. What he supplies
    to tell them apart is nothing: in his own story the answer is discovered by accident after the show.
    It matters because the two diagnoses license opposite responses. Read as a quality failure you rewrite
    the work; read as an audience failure you keep the work and change who sees it. Acting before the
    diagnosis is made risks destroying work that was fine.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'The comedian''s dilemma: the comic brings his best material and no one laughs; then he discovers
    the audience is a tour group and no one understands English; it''s entirely possible that your work
    isn''t as good as it needs to be, but it''s also possible that you failed to be clear about who it
    was for in the first place.

    '
  confounders:
  - assuming Godin provides a test; naming the branch is all he does
  - defaulting to the quality diagnosis, which is what the symptom superficially suggests
  - treating this as licence to dismiss all criticism as audience mismatch
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0006
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 1 "Not Mass, Not Spam, Not Shameful . . .", section "The lock and the key" (spine
    8)
  question: 'What ordering constraint does Godin place on the work, what is his argument for it, and where
    in his own book does it sit uncomfortably?

    '
  answer: 'The constraint is that the audience is chosen before the artefact is built: it makes no sense
    to make a key and then look for a lock, so find the lock and fashion the key. His argument is asymmetry
    of difficulty — it is easier to make products and services for the customers you seek to serve than
    to find customers for the products and services you already made. Where it sits uncomfortably is his
    own account of what audiences can tell you: he says the crowd did not invent the Model T, the smartphone
    or rap, and that people are intimately aware of their wants but terrible at inventing ways to address
    them. So the audience is chosen first but not consulted first, and he does not reconcile the two.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'The lock and the key: it doesn''t make any sense to make a key and then run around looking
    for a lock to open; it''s easier to make products and services for the customers you seek to serve
    than to find customers for your products and services. Ch. 7: the crowd didn''t invent the Model T,
    the smartphone, or rap; people are terrible at inventing new ways to address their wants.

    '
  confounders:
  - reading it as an instruction to run customer research first, which he explicitly doubts
  - confusing it with the separate market-driven versus marketing-driven distinction, which is about whose
    voice is loudest
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_god_0007
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market", sections "What change are you trying to make?" and
    "The simple marketing promise" (spine 11), with "A Simple Marketing Worksheet" (spine 32)
  question: 'You are handed a brief that names a deliverable and a deadline. Applying Godin''s method,
    what two things must be settled before anything is produced, and what are the two ways he says the
    second one gets answered badly?

    '
  answer: 'Who is it for, and what is it for — the second in its strong form, what change are you trying
    to make. He treats these as generative rather than descriptive: once you are clear who it is for,
    the answer shifts the product you make, the story you tell and where you tell it, so a brief that
    starts from a deliverable has already skipped the decisions. The two bad answers he names are specific.
    First, the grandiose one — a change that has never been done by anyone with your resources — which
    he says is both a heavy burden and a convenient excuse when things go badly. Second, the reverse-engineered
    one, constructed backwards from what you were already going to make and loaded with buzzwords. His
    three-sentence template forces the answers: my product is for people who believe ___; I will focus
    on people who want ___; I promise that engaging with what I make will help you get ___.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: 'What change are you trying to make: Stumble 1, the grandiose change that has never been done
    — a heavy burden and a convenient excuse; Stumble 2, reverse-engineering a change to match what you
    were already selling, loaded with buzzwords. Who''s it for has the ability to shift the product you
    make, the story you tell, and where you tell it. The three-sentence promise template.

    '
  confounders:
  - answering with the two questions and missing the two named failure modes
  - treating 'what's it for' as a statement of the deliverable rather than of the change sought
  - the modern default of starting from the channel or format
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0008
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market", section "Worldviews and personas" (spine 11)
  question: 'What grouping rule does Godin substitute for demographics, what does he admit about it, and
    what tension does he leave unresolved?

    '
  answer: 'Group people by what they dream of, believe and want rather than by what they look like — psychographics
    rather than demographics — and treat the group as sharing a worldview, the lens, assumptions and biases
    through which they see. What he admits is that this is deliberate distortion: "yes, we''re typecasting
    — willfully exaggerating people''s attitudes and beliefs in order to serve them better". The unresolved
    tension is that he also writes, in the same passage, that everyone deserves to be treated as an individual,
    with dignity and respect for their choices. He states both and moves on. The payoff he claims is predictive
    — with evidence about someone''s worldview you can make pretty good assumptions about how they will
    respond — asserted with no accuracy claim and no failed prediction anywhere in the book.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'Worldviews and personas: begin by choosing people based on what they dream of, believe and
    want, not based on what they look like; use psychographics instead of demographics; a worldview is
    the shortcut, the lens each of us uses; everyone deserves to be treated as an individual; yes, we''re
    typecasting — willfully exaggerating people''s attitudes and beliefs in order to serve them better.

    '
  confounders:
  - treating his named personas as a taxonomy rather than as illustrative caricatures
  - assuming psychographics means observed behavioural data; his unit is the story people tell themselves
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_god_0009
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market", section "Worldviews and personas" (spine 11)
  question: 'Godin''s retail failure case: an incoming chief executive ended a chain''s constant discounting
    because he could not imagine a quality store behaving that way. What does Godin say the customers
    were actually buying, and how strong is this as evidence?

    '
  answer: 'They were not enduring the discounts, they were playing a game that made them feel like they
    were winning — so removing the discounts removed the product. The executive''s decision was made from
    his own worldview as a luxury buyer, and it abandoned the store''s true fans: people who loved the
    sport of bargain hunting. Godin reports sales falling by more than fifty per cent. As evidence it
    is weak and should be labelled: a single retrospective case, no controls, a figure reported without
    a source, a causal attribution to worldview mismatch in a decision with many other moving parts, and
    a US department-store episode of the early 2010s in a retail environment that no longer exists in
    that form.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: true
  support: 'Worldviews and personas: Johnson took that action based on his worldview, on his bias about
    how to shop; as a result sales plummeted by more than 50 per cent; he abandoned the true fans, people
    who loved the sport of bargain hunting, people whose worldviews differed from his; Penney''s customers
    were playing a game, one that made them feel like they were winning.

    '
  confounders:
  - treating the fifty-per-cent figure as evidence for the mechanism rather than as a reported outcome
  - reading the lesson as 'don't remove discounts' rather than 'don't decide from your own worldview'
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0010
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 5 "In Search of Better", sections "Empathy is at the heart of marketing" and "A
    million-dollar bargain" (spine 12)
  question: 'Godin''s empathy principle has a clause at the end that changes what it demands. State the
    principle with that clause, and give his strongest formulation of the consequence.

    '
  answer: 'The principle is that the people you seek to serve do not believe what you believe, do not
    know what you know and do not want what you want — and the clause is: they probably never will. That
    turns empathy from a stage on the way to persuasion into a standing constraint. You are not modelling
    them in order to bring them round; you are modelling them because they are not coming round. His strongest
    consequence inverts the usual ethics: if you are unwilling to have empathy for the narrative of the
    person you seek to serve, you are stealing — withholding a valuable option from someone who would
    have benefited. His supporting case is a fundraiser who cannot ask for a large donation because she
    cannot imagine making one, when the donation was never for her.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: persuasion
  requires_application: false
  support: 'Empathy is at the heart of marketing: people don''t believe what you believe, don''t know
    what you know, don''t want what you want; they probably never will (Ch. 2 executive summary). A million-dollar
    bargain: if you''re unwilling to have empathy for the narrative of the person you seek to serve, you''re
    stealing.

    '
  confounders:
  - reading empathy as a step toward eventually converting them, which the 'never will' clause rules out
  - reading 'you're stealing' as the claim rather than as the rhetoric on top of it
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0011
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 3 "Marketing Changes People Through Stories, Connections, and Experience", case
    study "VisionSpring—Selling glasses to people who need them" (spine 10)
  question: 'In Godin''s glasses case, the offer was reframed from a purchase to a decision about handing
    something back. What is his explanation for why that mattered, and what is the honest status of the
    result he reports?

    '
  answer: 'His explanation is about risk capacity, not about loss aversion in general. Shopping is a risk
    — you spend time and money on something that might be great — and it is enjoyable only to people for
    whom being wrong is not costly, because being wrong does not cost them dinner or a medical check-up.
    For an audience without that margin, the same offer reads as a threat rather than as fun. He draws
    the general rule that his own narrative about how to buy glasses is not better or worse, only his,
    and that insisting on it when it is not working is arrogance. The status of the result: he reports
    that removing the choice doubled the proportion who bought. That is an outcome claimed without controls
    — one afternoon, one village, one observer, no comparison group, no counts beyond "about a third"
    and "doubled" — and the risk-capacity explanation is his interpretation afterwards, not a tested hypothesis.
    It is not a rate and should not be used as one.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: persuasion
  requires_application: false
  support: 'VisionSpring case: about a third of those who needed and could afford glasses bought them;
    the offer was changed to "here are your new glasses, pay three dollars or give them back"; desire
    for gain versus avoidance of loss; to go shopping is to take a risk, and we''re able to take that
    risk because being wrong isn''t fatal; my narrative is simply my narrative.

    '
  confounders:
  - generalising it as 'loss aversion beats gain framing', which drops the risk-capacity condition that
    makes it his argument
  - citing the doubling as a measured effect size
  - assuming the finding transfers, when the point of the case is that the marketer's assumptions do not
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0012
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 5 "In Search of Better", section "The marketing of dog food" (spine 12)
  question: 'Why does Godin use dog food rather than a human product to make his point about performance
    and appeal, and what is the general claim it is there to support?

    '
  answer: 'Because it separates the two parties cleanly and unarguably: he has never seen a dog buy dog
    food. The premium ingredients and rising prices are for the owners — for how buying it makes them
    feel, the satisfaction of caring for an animal, the status of a luxury purchase — and we have no idea
    whether dogs enjoy the expensive kind, because we are not dogs. The general claim is that there is
    almost always a disconnect between performance and appeal, and that the engineer''s choice of the
    best price-performance combination is rarely the market''s choice. So a marketer trying to sell more
    dog food by making food that tastes better has taken on the wrong problem; the formula is food that
    owners want to buy.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'The marketing of dog food: I''ve never seen a dog buy dog food; dog food is for dog owners,
    for the way it makes them feel; there''s almost always a disconnect between performance and appeal;
    the engineer''s choice of the best price/performance combination is rarely the market''s choice.

    '
  confounders:
  - reading it as a claim about pet marketing rather than as an argument about buyer and user coming apart
  - assuming the point is that customers are irrational; his point is that the valuer is not the one you
    assumed
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0013
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 5 "In Search of Better", sections "Thinking about better" and "Better isn't up to
    you" (spine 12)
  question: 'Godin denies that "better" is transitive. What is his mechanism, and what does he explicitly
    exempt from the relativism?

    '
  answer: 'His mechanism is about memory. Nobody can hold two hundred and fifty motorcycles or nineteen
    thousand drink combinations in mind, so we remember the best one — and "best" is always best-for-
    me on the dimension I happen to care about. Memory holds one slot per person per dimension, not one
    ranking per category, so the same category has a different winner in each head. Price orders cleanly
    and carries no claim about quality: a more expensive handbag is more expensive, which is one of many
    things someone might care about. What he exempts is competence. Quality in the sense of meeting specification
    is required but no longer sufficient — and if you cannot deliver it, he says the book is no help to
    you. The relativism is about appeal, not about whether the thing works.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: 'Thinking about better: linear comparisons don''t make sense; an expensive bag is not therefore
    better. Better isn''t up to you: we remember the best one; best for what; best for us. Ch. 6: quality,
    the quality of meeting specifications, is required but no longer sufficient.

    '
  confounders:
  - extending the relativism to whether the product works, which he explicitly excludes
  - reading it as 'all preferences are equally valid' rather than as a claim about how memory stores options
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0014
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 5 "In Search of Better", sections "Positioning as a service" and "Choose your axes,
    choose your future" (spine 12)
  question: 'Set out Godin''s XY positioning method, and state the trade-off he attaches to the choice
    of axes — including what he says happens to the customer in the wrong case.

    '
  answer: 'Draw two axes, each an attribute people care about; plot every available alternative on them;
    and take a position at an extreme rather than in the middle. The trade-off is in choosing which attributes.
    It is tempting to pick the ones most people care about, and it is hard work to claim an edge nobody
    wants — but picking the popular axes puts you in a crowded quadrant, and without the magic of advertising
    you cannot grow there. What happens to the customer is the specific part: he does not know what to
    do, so he does nothing. Inaction, not a random pick. The alternative is to build your own quadrant
    from two overlooked axes and be the clear and obvious choice on them. Note the method organises a
    decision it does not make — Godin prints two dozen candidate axes and says you know your space better
    than he does.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: 'Positioning as a service: draw a simple XY grid; for each axis choose something that people
    care about; this involves going to extremes. Choose your axes: if you pick the popular one you''ll
    be choosing a crowded quadrant and without the magic of advertising it''s very difficult to grow there;
    your customer doesn''t know what to do, so he does nothing; the alternative is to build your own quadrant.

    '
  confounders:
  - assuming a crowded quadrant means losing share; his claim is that the customer stalls entirely
  - treating the axis list as prescriptive; it is a prompt
  - confusing this with mid-century positioning, which he says invented differentiating claims and no
    longer holds up
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0015
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 5 "In Search of Better", section "Positioning as a service" (spine 12), with Ch.
    6 "Beyond Commodities", section "But your story is a hook" (spine 13)
  question: 'Godin''s music-teacher example: one teacher claims rigour and competition results, another
    claims the whole student and refuses competitions. What does he say this costs the first teacher,
    and what general rule is the example there to demonstrate?

    '
  answer: 'It costs him his freedom of action. Having claimed rigour, he now has to actually be more rigorous
    and professional than other teachers, has to make the difficult decision of expelling students who
    are not serious enough, and has to persevere until his students really do win competitions. The general
    rule is that a position is an obligation: once you claim a story you are on the hook to deliver, and
    Godin contrasts this with merely offering an alternative, which he calls the low-risk path — take
    it or leave it. He also adds two modern conditions on the claims themselves: they must be true and
    continually doubled down on in all your actions, and they must be generous, existing as a service
    to the customer. And he notes, without softening it, that this is not a teacher he would have wanted
    himself — which is the "it''s not for you" principle applied to his own example.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: 'Positioning as a service: the teacher who chooses rigour and competition results now has his
    work cut out — he has to be more rigorous, to expel students who aren''t serious, and to persevere
    so they actually win; is this the teacher I wish I''d had? Absolutely not. It''s not for me. But your
    story is a hook: once you claim a story you''re on the hook to deliver.

    '
  confounders:
  - reading positioning as a communications choice with no operational consequence
  - assuming Godin endorses the rigorous teacher; he explicitly says it is not for him
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0016
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 16 "Price Is a Story", sections "Cheap is another way to say scared" and "Trust
    and risk, trust and expense" (spine 23)
  question: 'Godin argues against competing on price, and one of his claims runs against intuition. What
    are the two claims, and what exemption does he allow?

    '
  answer: 'The first is that cheapness promises no change: when you are the cheapest you are promising
    the same, but cheaper — which removes the only thing he says a marketer has to offer — and that the
    race to the bottom is tempting because nothing is easier to sell than cheaper, requiring no calculation
    or thought from the buyer. The counter-intuitive one is that lowering your price does not make you
    more trusted, it does the opposite: where a transaction is risky or expensive, people construct a
    story that justifies their commitment, and that story carries trust with it — which is why high-end
    restaurants and hotels survive bad reviews. The exemption is genuine efficiency: unless you have found
    an extraordinary new way to deliver, racing to be cheapest means you are not investing sufficiently
    in change. He is objecting to cheapness as a position, not to a real cost advantage. He also notes,
    without embarrassment, that every confidence trickster relies on the trust mechanism — which is reason
    enough to hold it loosely.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: 'Cheap is another way to say scared: unless you''ve found an extraordinary new way to deliver,
    racing to be cheapest means you''re not investing in change; when you''re the cheapest you''re promising
    the same, but cheaper; low price is the last refuge of a marketer who has run out of generous ideas.
    Trust and risk: when people are heavily invested they often make up a story to justify their commitment,
    and that story carries trust; lowering your price does the opposite.

    '
  confounders:
  - missing the efficiency exemption and reading it as a blanket rule against low prices
  - treating the trust-from-cost mechanism as established; it is cognitive-dissonance reasoning with no
    citation
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0017
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 10 "Trust and Tension Create Forward Motion", section "How the status quo got that
    way" (spine 17)
  question: '"The status quo doesn''t shift because you''re right." Reconstruct Godin''s full argument,
    including the chain he states in Chapter Nine.

    '
  answer: 'The status quo exists for a reason and is good at resisting insurgents. If truth alone were
    sufficient we would have changed long ago; if a better idea or a simpler solution or a more efficient
    procedure were sufficient, the change would have happened a year or a decade or a century ago. It
    shifts because the culture changes, and the engine of culture is status. The chain behind this is
    stated in Chapter Nine: behaviour is driven by the desire to fit in — do people like me do things
    like this — and by the perception of status, both of those forces push us to stay as we are, and therefore
    it takes tension to change them. That is why a correct argument does nothing: it addresses neither
    driver.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: 'How the status quo got that way: they''re good at resisting insurgents; if all it took was
    the truth we would have changed long ago; it shifts because the culture changes, and the engine of
    culture is status. Ch. 9: changing our behaviour is driven by our desire to fit in and our perception
    of our status; since both push us to stay as we are, it takes tension to change them.

    '
  confounders:
  - reading it as advice to argue better or to simplify the message
  - treating status as one factor among several; Godin makes it the engine
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0018
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 9 "People Like Us Do Things Like This", sections "People like us (do things like
    this)" and "Which us?" (spine 16)
  question: 'Godin''s phrase is "people like us do things like this". What is the loop he describes, what
    does he say the marketer''s first job is, and what does he say is the wrong way to do it?

    '
  answer: 'The loop is: normalisation creates culture, culture drives our choices, and those choices lead
    to more normalisation — with the individual choice made in answer to one question, do people like
    me do things like this. He adds that even outliers are aligning, with the behaviour of outliers. The
    marketer''s first job is simple and he states it as such: define "us". The more specific, the more
    connected and the tighter the "us", the better. The wrong way is to define it by outcome — "the people
    who give are people like us" — which he says is backwards. And the scope claim matters: we cannot
    change "the culture", only "a culture", our little pocket of the world, which is why he treats the
    smallest viable market as the unit that maximises the chance of changing anything at all.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: 'People like us: from the first day we can remember, our actions are primarily driven by "do
    people like me do things like this?"; normalization creates culture, and culture drives our choices,
    which leads to more normalization; we can''t change the culture, but each of us can change a culture.
    Which us?: the first job is to define "us"; the right answer is not "the people who give are people
    like us" — that''s backwards.

    '
  confounders:
  - treating it as a slogan about social proof rather than as a self-reinforcing loop with a defining
    step
  - defining the group by who already buys, which is the backwards definition he rejects
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0019
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 11 "Status, Dominance, and Affiliation", section "Six things about status" (spine
    18)
  question: 'Godin lists six properties of status. Give them, and say which one most often trips up a
    marketer who assumes what everyone wants.

    '
  answer: 'Status is always relative — there is no absolute scale and no highest number. It is in the
    eye of the beholder, so someone can be low status to outsiders and high status in their own narrative,
    both true at once. Status attended to is the status that matters; it is only relevant when the person
    engaged with cares about it. It has inertia: we are more likely to work to maintain our status, high
    or low, than to change it. It is learned, though a cohort can shift the perception quickly. And shame
    is the status killer, which is why shame is used as a lever — it works. The one that trips people
    up is inertia, together with the correction Godin draws from it: it is a mistake to believe everyone
    wants higher status, and equally a mistake to believe no one wants lower. Some people will fight to
    keep the role they have. All six are assertions in a numbered list, unsourced and untested.

    '
  answer_type: factual_recall
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: 'Six things about status: always relative; in the eyes of the beholder; status attended to
    is the status that matters; has inertia; is learned; shame is the status killer. Plus: it''s a mistake
    to believe that everyone wants to make their status higher — in fact, few people do.

    '
  confounders:
  - assuming a status offer is always an upgrade offer
  - treating the six as findings rather than as a practitioner's working list
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: factual
- qa_id: qa_god_0020
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 11 "Status, Dominance, and Affiliation", sections "Affiliation and dominion are
    different ways to measure status" and "Affiliation or dominance is up to the customer, not you" (spine
    18)
  question: 'Two audiences respond to completely different status signals. Distinguish Godin''s two measures,
    give the questions each asks, and say why the pair is not a segmentation.

    '
  answer: 'Dominion is vertical — above or below. Its questions are: who has more power; this is mine,
    not yours; I did this myself; my side dominating your side. Affiliation is horizontal — who is standing
    next to me. Its questions are: who knows you; who trusts you; have you made things better; where do
    you stand within the tribe. They also behave differently under abundance: affiliation admires the
    network effect, since more affiliation benefits everyone affiliated, while dominion is scarcity-bound
    because someone must be below. The reason it is not a segmentation is that Godin says the same person
    switches by situation — his example is a twelve-year-old who cares about nothing but beating the opposition
    on the field and cares a lot about who sits next to him on the bus. It describes a moment, not a personality.
    And the priority is stated: which measure applies is the customer''s, not yours.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'Affiliation and dominion: the affiliation questions (who knows you, who trusts you, where
    do you stand within the tribe) against the dominion ones (this is mine not yours, who has more power);
    dominion is vertical, affiliation horizontal; affiliation admires the network effect, abundance is
    welcome; the ball-field child who cares only about winning but also about who sits next to him; the
    way you see the world isn''t nearly as important as the worldview of those you seek to serve.

    '
  confounders:
  - using it as a persona split, when Godin makes it situational
  - assuming affiliation is the good one; he presents both as legitimate measures
  - projecting your own measure onto the audience, the error he names explicitly
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0021
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 10 "Trust and Tension Create Forward Motion", section "Tension is not the same as
    fear" (spine 17)
  question: 'Godin distinguishes tension from fear. State the distinction and its mechanism, then say
    why the test he offers is unsatisfactory.

    '
  answer: 'Fear is a dream killer: it puts people into suspended animation, holding their breath, paralysed
    and unable to move forward, and fear alone will not produce change. Tension is different in kind —
    it is the promise that we can get through that fear to the other side, the state of "this might work
    versus this might not work", and the state of being aware you do not yet know something. He calls
    it the hallmark of a great educational experience and says all effective education creates it. The
    mechanism is that both are discomfort and they differ in whether a route out is visible: where forward
    motion is available the discomfort is a reason to move, and where it is not, the same discomfort immobilises.
    The test is unsatisfactory because it is the maker''s own feeling — if you feel like you are coercing,
    manipulating or frightening people, you are probably doing it wrong — which gives the person on the
    receiving end no criterion at all. Several of his own approved cases sit close to the line he is drawing.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: persuasion
  requires_application: false
  support: 'Tension is not the same as fear: if you feel like you''re coercing people, manipulating them
    or causing them to be afraid, you''re probably doing it wrong; fear''s a dream killer, it puts people
    into suspended animation; there might be fear, but tension is the promise that we can get through
    that fear to the other side; tension is the hallmark of a great educational experience.

    '
  confounders:
  - treating tension and fear as points on one scale rather than as different states
  - accepting the maker's-feeling test as an operational criterion
  - the modern default of reading any manufactured urgency as illegitimate; Godin defends manufactured
    tension and rejects only fear
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0022
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 10 "Trust and Tension Create Forward Motion", sections "What are you breaking?"
    and "Marketers create tension, and forward motion relieves that tension" (spine 17)
  question: 'Godin says launching anything breaks something. What does he mean, and how does that connect
    to his claim that the tension is manufactured?

    '
  answer: 'The very existence of an alternative causes something else to stop being true. The second hotel
    in a town means the first is no longer the only one; an exclusive party makes the uninvited into outsiders;
    a fancier casino makes last year''s satisfied visitor ask whether he is the sort of person who goes
    somewhere this run-down. So a new offering does not merely add an option — it degrades the standing
    of what people already chose, and that degradation is the tension. The connection to manufacture is
    that Godin is unusually direct about it: none of these feelings existed before a marketer showed up
    with something that caused them; if there were no new album you would not feel left out for not having
    heard it. We intentionally create these gaps, these little canyons of tension people find themselves
    leaping over. His diagnostic is a question to the maker: when you arrive with your solution, do you
    also create tension — because if you do not, the status quo is likely to survive.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: persuasion
  requires_application: false
  support: 'What are you breaking?: the very existence of an alternative causes something else to no longer
    be true; when you host an exclusive party, the people who aren''t invited become outsiders; this is
    what tension feels like, the tension of being left behind. Marketers create tension: none of those
    feelings existed before a marketer showed up with something that caused them; we intentionally create
    these gaps.

    '
  confounders:
  - reading the tension as pre-existing demand that the offering satisfies
  - assuming 'breaking something' means damaging a competitor commercially rather than changing what a
    choice says about the person who made it
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0023
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 10 "Trust and Tension Create Forward Motion", section "Pattern match/pattern interrupt"
    (spine 17)
  question: 'You are launching into a category where every buyer already has an established routine. What
    does Godin say you are up against, and what timing rule does he derive from it?

    '
  answer: 'A pattern interrupt. Where a pattern exists, the routine has to be undone before any forward
    motion is possible, and the default answer to that request is no — because the pattern is established,
    time is precious and risk is feared. His mechanism is that undoing a pattern requires the person to
    accept their previous choice was wrong, which is a status cost on top of the switching cost. The timing
    rule follows: market to people who do not have a pattern yet. When life interferes — a new parent,
    someone recently engaged, someone who has just moved — there is nothing to match, so it is all interrupt
    and you do not have to persuade anyone that their old choices were mistakes. The same logic makes
    a brand-new platform the best time to launch an app on it. He also notes the institutional mirror:
    a purchasing manager has been taught that matching the pattern is how you keep a steady job with no
    surprises.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: media_planning
  requires_application: true
  support: 'Pattern match/pattern interrupt: a pattern interrupt requires some sort of jolt and most of
    the time the answer is no, because the patterns are established, time is precious and risk is feared;
    when life interferes, new patterns are established, which is why it''s profitable to market to new
    dads, engaged women and people who have recently moved; when you market to someone who doesn''t have
    a pattern yet, you don''t have to persuade them their old choices were mistakes.

    '
  confounders:
  - answering with message strategy when his answer is about timing and audience state
  - assuming a better offer overcomes an established pattern; the pattern must be undone first
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0024
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 13 "Semiotics, Symbols, and Vernacular", sections "What does this remind you of?"
    and "Why is Nigerian spam so sloppy?" (spine 20)
  question: 'Godin argues that badly spelled advance-fee scam mail is not incompetent. What is his reading,
    and what general claim about form does it illustrate?

    '
  answer: 'His reading is that the errors are a filter. The mail is sending a signal to people who are
    skeptical, careful and well-informed: go away. Putting anyone else into the process wastes the sender''s
    time, and they would rather lose you at the beginning than invest in you and lose you at the end.
    The general claim is that form acts before content does. Busy people scan rather than study, and while
    scanning they ask what this reminds them of — and the answer decides whether they are the audience
    and whether the maker is credible, before any argument is considered. So the vernacular of a category
    — typefaces, photo styles, copy — is a membership signal: you are not people like us if you do not
    talk the way we expect you to. Note this is an inference about the senders'' intent, not a reported
    finding about their strategy.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: 'Why is Nigerian spam so sloppy?: because it''s not for you; they''re sending a signal to people
    who are skeptical, careful and well-informed: go away; they''d rather lose you at the beginning than
    invest in you and lose you at the end. What does this remind you of?: we scan instead of study; we
    want to know if it''s for us, and if you''re the real deal.

    '
  confounders:
  - reading the sloppiness as low effort or poor language skills
  - treating semiotics as decoration on top of the message rather than as the thing read first
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0025
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 13 "Semiotics, Symbols, and Vernacular", sections "The flag is not for everyone"
    and "The same and the different" (spine 20)
  question: 'You need a piece of work to read as new without reading as untrustworthy. What two-part instruction
    does Godin give, and what paradox does he say sits underneath it?

    '
  answer: 'Send a signal that feels like a sign we already trust, then change it enough to let us know
    it is new and that it is yours. He explains why the first half is not laziness: most car ads look
    alike because the sameness signals that this is a car worth considering, a safe alternative for a
    large purchase, and most big-company logos resemble each other because the designers are trying to
    remind you of a solid company. The paradox is that to make change you have to go first, hanging over
    one edge or another, but that innovation reminds some people of a past thing that went wrong — so
    you begin with the audience that tolerates the resemblance, because it is the only audience that will
    give a new thing a chance. He adds that not flying a flag is as intentional as flying one, and that
    pretending your features are so good nothing else matters is the foolish move.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'The flag is not for everyone: send a signal that feels like a sign we already trust, then
    change it enough to let us know that it''s new, and that it''s yours; there''s a paradox — to make
    change we need to go first, but that innovation reminds some people of a past event that went wrong.
    The same and the different: most car ads look the same because the sameness signals a safe alternative;
    a good designer offers you the chance to fit in.

    '
  confounders:
  - reading category conventions as unimaginative rather than as a trust signal Godin defends
  - maximising distinctiveness, when his instruction is resemblance first and variation second
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0026
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 14 "Treat Different People Differently", section "In search of the neophiliacs"
    (spine 21)
  question: 'Godin says you should not spend a minute on people who are satisfied with what they have.
    Is that a judgement about those people? Give his actual reason.

    '
  answer: 'No — it is a resource argument. If someone is satisfied with what they have, you are unlikely
    to have the time or the money to reach out and make them dissatisfied enough to become interested,
    so the minute is wasted for both of you, which is why he calls the restraint humility rather than
    dismissal. The people worth beginning with are the neophiliacs, who are addicted to the new, thrilled
    by discovery and forgiving of missteps while the thrill lasts. His stark version is that the only
    people you can serve are the curious, the dissatisfied or the bored — everyone else can opt out and
    refuse to pay attention. And the exclusion is temporary in principle: it''s not for them, not right
    now; with persistence you may reach them later, horizontally, person to person.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: media_planning
  requires_application: false
  support: 'In search of the neophiliacs: good marketers have the humility to understand that you shouldn''t
    waste a minute on anyone who isn''t on the left part of the curve; if someone is satisfied with what
    they have, you''re unlikely to have the time or money to cause them to become dissatisfied; it''s
    not for them, not right now; with persistence you''ll get to them, perhaps, horizontally.

    '
  confounders:
  - reading it as writing those people off permanently
  - assuming a big enough budget solves it; his claim is about what dissatisfaction costs to manufacture
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0027
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 19 "The Funnel", sections "Bridging the chasm" and "Where's your bridge?" (spine
    26)
  question: 'Why does Godin deny that early adopters will carry your idea to the mass market, and what
    does he say the bridge actually is?

    '
  answer: 'Because the two groups want opposite things. The mass market wants something that works and
    is safe — a pattern match, not a pattern interrupt — and takes "people like us do things like this"
    very seriously; so satisfying the early adopters may require annoying the masses, and the very thing
    the innovation did, breaking things, is what the mass market does not want to happen. The bridge is
    structural rather than persuasive: an idea that works better when others also use it gives the early
    adopter a selfish reason to recruit, because their own life improves when their network joins. He
    reduces the design question to two: what will I tell my friends, and why will I tell them. And the
    negative is stated flatly — it is never the case that people tell their friends because you want them
    to, asked them to, or worked hard.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: false
  support: 'Bridging the chasm: the intuitive answer is that early adopters bring your idea to the masses,
    but often that''s not what happens; the mass market wants something that works, something safe, a
    pattern match not a pattern interrupt; in order to satisfy the early adopters you may just need to
    annoy the masses. Where''s your bridge?: the bridge lies in network effects; what will I tell my friends,
    why will I tell them.

    '
  confounders:
  - assuming enthusiasm or advocacy carries the idea across; his bridge is self-interest
  - treating the chasm as a marketing-spend problem rather than as a conflict of wants
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0028
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 19 "The Funnel", section "You might not find the bridge" (spine 26)
  question: 'Godin tells one failure story against himself. What did his project achieve, what did it
    lack, and which two lessons does he draw?

    '
  answer: 'The project — pages profiling products, with a share of the resulting commission going to a
    charity — achieved trial: thousands of pages were built. What it lacked was whales. Fewer than six
    people built more than a dozen pages or promoted them much. His diagnosis is that the tension dissipated
    too quickly, people felt they had no good reason to return after a single visit, and a typical page
    sold nothing in a month, so the dynamic that would have turned early users into connected ambassadors
    never formed. The two lessons he draws are that they did not tell a story about status, and that they
    were not nearly specific enough about who the first customers would be, what they might have wanted,
    believed and said. He adds that four months was a naïve amount of time in which to create an overnight
    success.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: false
  support: 'You might not find the bridge: we kept at it for months but we failed; we got trial, thousands
    of pages were built, but we failed to find any whales; the tension dissipated too quickly, people
    felt they had no good reason to return; we didn''t do enough to tell a story about status, and we
    weren''t nearly specific enough about who our first customers would be.

    '
  confounders:
  - attributing the failure to the offer's economics rather than to the absence of a reason to return
  - reading trial as evidence the mechanism was working
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0029
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 17 "Permission and Remarkability in a Virtuous Cycle", sections "Transform your
    project by being remarkable" and "Designing for evangelism" (spine 24)
  question: 'A team asks how to make an asset that people will share. Give Godin''s two constraints, and
    say why they rule out most of what is usually attempted.

    '
  answer: 'First, the verdict is not yours. Whether something is remarkable is decided by the user: if
    they remark on it, it is remarkable — so remarkability can be observed but never claimed. Second,
    the motive belongs to the teller. People spread the word when it benefits them, because talking about
    your thing is a way of talking about themselves — look how good my taste is, look how good I am at
    spotting important ideas — and never because it matters to you, because you asked, or because you
    worked hard. Together these rule out the usual attempts: adding a share prompt, appealing to the importance
    of the cause, and the stunt, which Godin says comes from a place of selfishness and warns is not the
    same thing as remarkable. What is left is designing the reason to tell into the product or service
    itself, which is why he says effective marketers are also in charge of the customer''s experience.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: 'Transform your project by being remarkable: whether something is remarkable isn''t up to you,
    the creator; if they remark on it, then it''s remarkable; you must do it with intent, building it
    deep into the product or service. Designing for evangelism: people aren''t going to spread the word
    because it''s important to you; they''ll only do it because it''s important to them.

    '
  confounders:
  - reaching for a share incentive or a call to action, which addresses neither constraint
  - assuming being talked about proves the mechanism worked; Godin notes criticism also spreads, as a
    signal to shun you
  - treating 'if they remark on it, it's remarkable' as a test rather than as the circular definition
    it is
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0030
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 17 "Permission and Remarkability in a Virtuous Cycle", sections "Permission is anticipated,
    personal, and relevant" and "Earn your own permission and own it" (spine 24)
  question: 'Godin defines permission and then gives a test that disqualifies most of what is called permission.
    State both, and give the two consequences he draws.

    '
  answer: 'The definition: the privilege of delivering anticipated, personal and relevant messages to
    people who want to get them. The test: if you stopped showing up, would people be concerned and ask
    where you went. He is explicit that real permission is not presumed or legalistic — having somebody''s
    address, their failure to complain, or a clause in a privacy policy is none of it. The two consequences.
    First, the promise made in exchange is binding until both sides agree to change it: a launch, the
    end of a quarter or a campaign does not create a right to break the deal you made. Second, an audience
    assembled on a platform is not an asset you own — you do not have permission to contact those people,
    the platform does, which makes you a sharecropper on someone else''s land.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: media_planning
  requires_application: false
  support: 'Permission is anticipated, personal, and relevant: real permission is different from presumed
    or legalistic permission; if you stop showing up, people are concerned, they ask where you went; the
    promise is the promise until both sides agree to change it. Earn your own permission: it''s not your
    land, you don''t have permission to contact people, they do.

    '
  confounders:
  - equating permission with consent under a privacy policy, which he explicitly excludes
  - counting followers on a platform as an owned permission asset
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_god_0031
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 15 "Reaching the Right People", section "Frequency" (spine 22)
  question: 'A team wants to change its campaign because everyone internally is sick of it. What does
    Godin say is happening, what is his memory claim, and what stopping rule does he actually supply?

    '
  answer: 'They are inside the dip — the gap between when the maker gets bored and when the audience gets
    the message — and changing now forfeits the trust that frequency was building. His memory claim is
    that people do not remember what they read, hear or see; they remember what they rehearse, the things
    seen again and again, and the market has been trained to associate frequency with trust, because the
    familiar is normal and the normal is trusted. The stopping rule he supplies is a quoted maxim: do
    not change your ads when you are tired of them, or when your employees are, or when your friends are
    — change them when your accountant is tired of them. That is a heuristic with no criterion in it,
    and it cannot distinguish persistence from stubbornness. He generalises the point well beyond advertising:
    people give a talk a few times and move on, or raise money and spend it fast, hitting the wall just
    before the good part.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: true
  support: 'Frequency: people don''t remember what they read, hear or see — we remember what we rehearse;
    the market has been trained to associate frequency with trust; there''s a very real dip, a gap between
    when we get bored and when people get the message; don''t change your ads when you''re tired of them,
    change them when your accountant is tired of them.

    '
  confounders:
  - treating internal boredom as evidence of audience wear-out
  - reading the accountant maxim as an actual decision criterion
  - confusing this with a claim about creative quality; his claim is about repetition and trust
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0032
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 15 "Reaching the Right People", sections "Brand marketing makes magic; direct marketing
    makes the phone ring", "A simple guide to online direct marketing" and "A simple guide to brand marketing"
    (spine 22)
  question: 'Godin says two paragraphs of his book should have paid for it. What is the separation they
    make, what opposite disciplines follow, and what does he say the real danger is?

    '
  answer: 'Direct marketing is action-oriented and is measured; brand marketing is culturally oriented
    and cannot be measured. The disciplines that follow are opposites, and he states both as instructions.
    For direct: measure everything — what attention costs, what a click costs, what an order costs — and
    if you cannot measure it, it does not count. For brand: be patient, refuse to measure, engage with
    the culture, focus and above all be consistent — and if you cannot afford to be consistent and patient,
    do not buy brand advertising at all. The danger he names is neither discipline done badly but the
    confusion of the two, which is what makes a shift to a measured environment destroy a business built
    on unmeasurable brand advertising. He adds the gate: if you cannot see the funnel, do not buy the
    ads, and if you can see it and it costs too much, fix the funnel first. And the narrowing rule still
    applies — you cannot afford to build a brand for everyone, so be specific.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: media_planning
  requires_application: false
  support: 'Brand marketing makes magic: direct marketing is action oriented and measured, brand marketing
    is culturally oriented and can''t be measured; the danger is in being confused; if you''re buying
    direct ads measure everything, if you''re buying brand ads be patient and refuse to measure; if you
    can''t afford to be consistent and patient, don''t pay for brand marketing ads. Ch. 19: if you can''t
    see the funnel, don''t buy the ads.

    '
  confounders:
  - trying to measure brand advertising, which he treats as the characteristic error
  - assuming digital measurement is always an improvement; his case is a business destroyed by the shift
  - treating attribution as the issue; his separation is about what the spending is for
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0033
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 19 "The Funnel", section "The truth about your funnel" (spine 26)
  question: 'Godin gives the direct-response funnel a careful treatment and then undercuts it. What is
    the undercut, and what does he say builds the brands that matter?

    '
  answer: 'The undercut is that the lifetime value of a new customer rarely exceeds the cost of the advertising
    needed to acquire one. People are distrustful, the web is cluttered, and the ads rarely have enough
    power to pay for themselves, so a self-running funnel of income is rare however carefully it is built.
    What builds the brands that matter, in his account, is everything after the first click: they are
    primed by advertising but built by good marketing — they grow because users evangelise to their friends,
    because they keep offering more value to the communities they serve, and because they find groups
    that coalesce around the change they produce. His warning is that attempts to build a perpetual motion
    machine of profit almost always end in bitterness, because they require you to push too hard and too
    fast to do anything that lasts.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'The truth about your funnel: it''s not going to be a magical fountain of results; the lifetime
    value of a new customer rarely exceeds the cost of running the ads necessary to get one; most brands
    that matter are primed by advertising but built by good marketing; attempts to build a perpetual motion
    machine of profit almost always end with bitterness.

    '
  confounders:
  - reading the funnel arithmetic as his recommendation rather than as a control he then qualifies
  - assuming better optimisation closes the gap; his claim is that the economics usually do not work
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_god_0034
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market" (spine 11) against Ch. 19 "The Funnel", section "Bridging
    the chasm" (spine 26)
  question: 'Godin tells you to serve the smallest viable market and also that the mass market wants the
    opposite of what those people want. Reconcile the two, and say what he does not resolve.

    '
  answer: 'They are consecutive stages, not competing strategies. The smallest viable market is where
    you begin, because a defined audience permits the extremity that makes the work worth remarking on
    and because it maximises the chance of changing a culture — one pocket of the world rather than the
    culture. The chasm is the cost of having begun there: satisfying that group may require annoying the
    mass market, whose wants are opposite. The bridge between the two is not persuasion, and it is not
    the early adopters'' enthusiasm; it is a network effect that gives the early adopter a selfish reason
    to recruit. What he does not resolve is what to do when the offering has no network effect — his own
    counter-example is a chocolate you like, which does not improve your life if others eat it. For those
    categories he names no bridge, and the sequence simply stops.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Ch. 4: the smallest viable market is the focus that leads to your growth; Ch. 9: it maximises
    your chances of changing a culture. Ch. 19: the mass market wants something that works, safe, a pattern
    match; in order to satisfy the early adopters, you may just need to annoy the masses; the bridge lies
    in network effects; there''s no reason to talk about a new kind of chocolate you like, it doesn''t
    make your life better if others eat it.

    '
  confounders:
  - treating the two as a contradiction rather than as stages
  - assuming the narrow audience simply grows into the mass market; Godin explicitly denies the glide
  - assuming every offering has a bridge available
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0035
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 4 "The Smallest Viable Market", section "Forcing a focus" (spine 11), with Ch. 8
    "More of the Who", section "What would Jerry do?" (spine 15)
  question: 'A client wants the widest possible reach and cites their competitors'' audience numbers.
    Using Godin''s argument, what do you tell them — and what is the weakest part of your own case?

    '
  answer: 'That the reach target is a constraint on the work, not a measure of it: aiming at the centre
    of the curve requires offending no one and satisfying everyone, which forces the compromises and generalisations
    that make work boring, and boring audiences are static and are not looking for you. The alternative
    is to ask the floor question — the minimum number of people we would need to influence for this to
    be worth doing — and then spend everything on making the work extreme enough for them to talk about.
    The weakest part of the case is the evidence. Every example Godin offers is a survivor: a restaurant
    that became famous, a band that grossed hundreds of millions, a lobbying organisation with millions
    of members. Projects that narrowed and simply stayed small are absent from the book and cannot appear
    in it, so the promise that focus leads to growth is supported by cases selected on the outcome it
    predicts.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: true
  support: 'Forcing a focus: mass means average and requires you to offend no one and satisfy everyone;
    what''s the minimum number of people you would need to influence to make it worth the effort; the
    smallest viable market is the focus that leads to your growth. Ch. 7: the marketplace of people who
    are happy with boring is static, they aren''t looking for better. Ch. 8: the survivor cases.

    '
  confounders:
  - arguing from efficiency or budget, which is not his case
  - presenting the survivor examples as evidence for the growth claim
  - dropping 'viable' and arguing for the smallest audience rather than the smallest sufficient one
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0036
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: 'Ch. 8 "More of the Who: Seeking the Smallest Viable Market", section "Why don''t people
    choose you?" (spine 15)'
  question: 'Godin sets an exercise for the people who buy from a competitor even though they know you
    exist. What is the exercise, what sentence must be completed, and what is it for?

    '
  answer: 'The exercise is to ask why those people are right — not why they are misinformed, and not what
    would change their minds. He is explicit that the tempting move is to denigrate their judgement, question
    their values and assume they are ill-informed, selfish or wrongheaded, and the exercise is to put
    that aside. The sentence to complete is: "For people who want what you want (___) and believe what
    you believe (___), your choice of ___ is exactly correct." It is for stretching the empathy muscle:
    people make perfectly rational decisions based on what they see, believe and want, so completing the
    sentence forces you to reconstruct the worldview under which the competitor is the right answer. His
    cooking-class illustration makes the point that both parties can be right at once — the student who
    substitutes an ingredient cares more about the story than about matching a taste profile, and the
    chef for whom the memory of the dish is everything reads substitution as disrespect for his work.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'Why don''t people choose you?: those people who don''t buy from you, who happily buy from
    a competitor even if they know you exist — why are they right?; it''s tempting to denigrate their
    judgement and assume they''re ill-informed, selfish or wrongheaded; find the empathy to fill in this
    sentence; people are quite likely to make perfectly rational decisions based on what they see, what
    they believe, and what they want.

    '
  confounders:
  - reframing the exercise as identifying objections to overcome, which reverses its purpose
  - treating the competitor's customers as a segment to be won rather than as people for whom your offering
    is not the answer
  - assuming Godin means they are right about the product; he means right given what they want and believe
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_god_0037
  source_id: godin-this-is-marketing
  source_title: 'Seth Godin, This Is Marketing: You Can''t Be Seen Until You Learn to See (Portfolio/Penguin,
    2018)'
  source_locator: Ch. 21 "Some Case Studies Using the Method", section "Getting the boss to say yes" (spine
    28)
  question: 'You need internal approval for a project. Godin says marketing to one person is not different
    in kind. Apply his method: what are you modelling, and what three moves does he say will not work?

    '
  answer: 'You are modelling the same things you would model for any audience. She is not eager to change
    her worldview; she sees things through the lens of her experience, not yours; she is aware of who
    the people like us are and what they think; and she wants what helps her achieve her goals, which
    probably include status, safety and respect. So the work is to see the status roles, decode whether
    she is measuring dominion or affiliation, and use trust to earn enrollment — turning her from a customer
    into a student, step by step. The three moves he says will not work: going to her with what you want;
    leading on price, features or false urgency; and asking for authority without offering responsibility.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'Getting the boss to say yes: it''s one thing to market to the world and it feels different
    to market to one person, except it''s not, not really; your boss is probably not eager to change her
    worldview, she sees things through the lens of her experience, she wants what helps her achieve her
    goals, which probably include status, safety and respect; if you go to her with what you want, with
    a focus on price or features or false urgency, it''s unlikely to lead to the answer you seek; if you
    ask for authority without offering responsibility, that too is unlikely.

    '
  confounders:
  - building a business case on features and cost, which is the first move he rules out
  - assuming internal persuasion is a different discipline requiring different tools
  - leading with urgency, which he names as the false version
  requires_application_canon013: true
  source_status: hold
