- qa_id: qa_mla_0001
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 1-2 (Chapter One, 'Early Influences', opening argument); restated printed
    p. 172 (Chapter Sixteen)
  question: 'Hopkins opens the book by separating two things that are both ordinarily called failure in
    advertising. What is the distinction, which of the two does he call inexcusable, and what reason does
    he give?

    '
  answer: 'An ordinary failure is a small venture that does not respond. He treats that as expected, cheap
    and informative — every venture in its initial stage is only a way of feeling the public pulse. A
    disaster is a large and costly commitment made before any response has been observed, and that he
    calls rashness: needless and inexcusable. The reason he gives is not that practitioners are careless
    but that no amount of experience guides a man correctly in even the majority of cases, so being wrong
    is normal and only incaution is culpable. He restates it later as an operating rule: never involve
    the advertiser to any large extent before a profit is sure. He offers no figure anywhere for how often
    a small test misleads.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: testing_method
  requires_application: false
  support: 'Printed pp. 1-2, the book''s opening pages, where advertising disasters are attributed to
    rashness; the decision rule is restated at printed p. 172. Practitioner assertion with a stated mechanism,
    no supporting figures.

    '
  confounders:
  - the modern fail-fast reading, in which failure itself is the teacher; Hopkins's point is about the
    size of the commitment, not about the value of failing
  - reading it as general caution about advertising, when he is prescribing small ventures rather than
    fewer ones
  - treating it as a claim that tests are reliable; he claims the opposite about judgement and says nothing
    about test reliability
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_mla_0002
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 175-177 (Chapter Seventeen, 'Scientific Advertising', opening)
  question: 'Hopkins states directly where his principles came from. Summarise the evidence base he claims,
    and then state what the book itself actually exhibits of it.

    '
  answer: 'He claims thirty-six years of traced advertising, campaigns on some hundreds of different lines,
    and comparison by keyed returns of thousands of pieces of copy on some lines, always facing records
    on cost and result. He adds that mail order gives the most exact basis but that most advertising can
    be conducted so as to give an approximate guide. What the book exhibits is very much less: no dataset,
    protocol, sample size, date range, product list or result table appears anywhere in it. A handful
    of figures across roughly half a dozen campaigns is the whole of the displayed evidence. The claimed
    corpus is asserted; it is not shown.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: testing_method
  requires_application: false
  support: 'Printed pp. 175-176, where the thirty-six years, hundreds of lines and thousands of pieces
    of copy are stated. The absence of exhibited evidence is an extraction observation about the book
    as a whole, not a claim by the source.

    '
  confounders:
  - treating the claimed corpus as though it were published data; it is a recollection stated in one paragraph
  - assuming keyed returns imply a controlled comparison — he describes ranking advertisements one by
    one, with nothing held constant
  - confusing this book with Scientific Advertising (1923), which is the book he says the phrase attached
    to; that book is not reproduced here
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0003
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 175-176 (Chapter Seventeen, on why he distrusts most advertising theories)
  question: 'Hopkins gives an explicit rule for refusing evidence: why does he say most advertising theories
    deserve little respect, and what alternative explanations does he name for a commercial success whose
    returns were never traced?

    '
  answer: 'He says most theories are unproved and rest on limited experience and exceptional conditions,
    and that some lines appear to succeed on methods every traced return proves impossible. His named
    alternatives are that the line may have succeeded in spite of its advertising; that unadvertised lines
    become successful because people discover a wanted quality; that dealers may have been induced to
    feature it; or that the name itself tells an appealing story. He names gum and a breakfast cereal
    as name-driven cases with almost no story to tell, and adds the sharpest move in the passage: the
    very men who succeeded with one such name failed again and again with others, which is a disconfirmation
    test applied to the rival explanation. His conclusion is that conclusions drawn from untraced successes
    lead others astray.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: testing_method
  requires_application: true
  support: 'Printed pp. 175-176. Argued position with named cases, no figures.

    '
  confounders:
  - reading it as a claim that untraced advertising does not work, rather than that it carries no information
    about what worked
  - the modern attribution framing of incrementality; Hopkins's argument is about overdetermination of
    the outcome, not about a control group
  - assuming he exempts himself; he does not address whether his own untraced narratives fall under the
    rule
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0004
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 175-176 (Chapter Seventeen), applied against the campaign narratives throughout
  question: 'Apply Hopkins''s own refusal rule to Hopkins. A reader takes the Schlitz, Van Camp and Palmolive
    chapters as proof of the principles they illustrate. On the source''s own stated criterion, what is
    wrong with that, and what defence does the book leave open?

    '
  answer: 'On his own criterion the narratives do not qualify. He says safe principles are evolved only
    by those who know with reasonable exactness what the advertising does and who compare results on many
    lines with thousands of pieces of copy — and nearly every campaign he recounts is an outcome asserted
    decades later with no control, no comparison and usually no figure. By his rule those accounts illustrate
    the principles rather than establishing them. The defence the book leaves open is the one he implies
    at printed pp. 175-176: the principles came from the traced work, and the narratives are exposition.
    That defence is available but unverifiable here, because the book never exhibits the traced work.
    He nowhere applies the rule to himself.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: 'The refusal rule is at printed pp. 175-176; the campaign narratives run through Chapters Seven
    to Fifteen. The reflexive application is an extraction observation using the source''s own stated
    criterion, not a claim the source makes.

    '
  confounders:
  - treating the book's confidence of tone as evidence quality
  - dismissing the principles as false; the point is that these accounts do not test them, not that they
    are wrong
  - assuming the keyed Pepsodent work at printed pp. 153-156 supplies the missing data; that passage reports
    the loop existed, not what it returned
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0005
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 150 and 156 (Chapters Thirteen and Fourteen, the two statements of the rule
    against relying on judgement)
  question: 'Hopkins states his most general methodological rule twice, and supports it with a concession
    about himself. What is the rule, what is the concession, and what is wrong with the ratio he offers
    alongside it?

    '
  answer: 'The rule is that none of us can afford to rely on judgement or experience: new problems require
    new experience, undertakings must be tested in the most exact way possible, and mistakes must be learned
    and corrected. The concession is the strongest support he gives it — he had spent nearly thirty years
    in advertising and learned from hundreds of campaigns when he himself prepared a Pepsodent series
    he says would have wrecked the business in three months. The ratio he offers beside it, that perhaps
    one guess in fifty is right while fifty tests in fifty tell you what to do and avoid, is rhetoric:
    no derivation is given, and the second half is false as literally stated, since a test can also mislead.
    He also does not apply the rule uniformly — he repriced the Quaker puffed-grain line on conviction
    rather than test.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: 'Printed p. 150 (one time in fifty; fifty times in fifty) and printed p. 156 (none of us can
    afford to rely on judgment or experience, after the near-fatal series). The repricing decision is
    at printed pp. 143-144.

    '
  confounders:
  - treating the fifty-in-fifty figure as an empirical result rather than a rhetorical flourish
  - reading it as a claim that experience is worthless; he claims experience does not transfer to a new
    problem, which is narrower
  - assuming he applied the rule consistently; the pricing decision at printed pp. 143-144 is his own
    counter-example
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0006
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 92-94 (Chapter Eight, 'My Liquozone Experience')
  question: 'The Liquozone account is the one place in the book where a measurement, a waiting period
    and the same measure at national scale are all stated. Give the figures, and say why the thirty-day
    wait is the load-bearing part of the procedure.

    '
  answer: 'In a dozen small Illinois test cities, inquiries for the free bottle cost 18 cents each. He
    then waited thirty days deliberately, and found sales averaged 90 cents per inquirer; claims under
    the money-back guaranty came to less than 2 per cent of sales. Rolled out nationally the following
    year, the campaign produced over 1,500,000 requests at an average cost of 18 cents — the same figure
    — with an average sale of 91 cents per request. He reports first-year net profits of $1,800,000. The
    wait is load-bearing because the free bottle only produces a countable inquiry; the revenue per inquirer
    does not exist until the response has had time to convert, so reading the ratio early would have measured
    the offer and not the business. Note this is a single unreplicated instance, reported from memory
    two decades later, on a product whose advertising he elsewhere disowns as a class.

    '
  answer_type: factual_recall
  difficulty: medium
  knowledge_type: testing_method
  requires_application: false
  support: 'Printed pp. 92-94, where the 18-cent inquiry cost, the thirty-day wait, the 90-cent and 91-cent
    sale figures, the sub-2-per-cent claim rate and the 1,500,000 requests are all stated. The repudiation
    of medicine advertising as a class is at printed pp. 73-75.

    '
  confounders:
  - treating the test-to-scale agreement as a controlled result; nothing tells us what a different plan
    would have returned
  - confusing the 18-cent inquiry cost with the 25-cent free-sample figure quoted for puffed grains at
    printed p. 147
  - reading the sub-2-per-cent guaranty claim rate as a general rate for money-back offers; it is one
    product, one year, on a remedy whose effect a buyer could not judge
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: factual
- qa_id: qa_mla_0007
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 153-156 (Chapter Fourteen, 'Pepsodent', the keyed reporting loop)
  question: 'Describe the reporting loop Hopkins ran on Pepsodent, and state precisely what he claims
    it bought him. Be careful to state the claim he actually makes rather than the stronger one.

    '
  answer: 'Every advertisement carried a keyed coupon; hundreds of advertisements were tried; results
    came back to him week by week, and each report arrived with the headline that had produced it, so
    the appeal and its response stayed attached. The claim he actually makes is about the cost of being
    wrong, not about finding the right answer: one series he had himself prepared would, he says, have
    wrecked the business in three months, he caught it by the coupon within about a week, and reversed
    strategy at once. So the loop caps the price of a wrong theory at roughly a week of spending. He adds
    that competitors who fell down did so because they were wedded to a theory and did not check results
    quickly enough. He never says what was wrong with the series, never quotes it, and gives no figures
    from the loop.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: testing_method
  requires_application: false
  support: 'Printed pp. 153-156. The wrecking series and the one-week detection are stated at printed
    p. 155; the competitor diagnosis at printed p. 156. Outcome claimed, no figures given.

    '
  confounders:
  - the stronger claim that the loop finds the winning appeal; his stated benefit is bounding the loss
  - reading hundreds of freely varying advertisements read on weekly returns as a controlled test; nothing
    separates a headline effect from a week, a season or a medium
  - assuming the loop catches every kind of failure — his own Mitchell case at printed pp. 119-120 is
    a campaign with excellent response and a ruinous outcome
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0008
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 153-156 (Pepsodent loop) read against printed pp. 119-120 (Chapter Ten,
    the Mitchell campaign)
  question: 'A team runs Hopkins''s weekly keyed loop faithfully and every reading is excellent — coupon
    response is high and rising. On the source''s own evidence, what class of failure would this loop
    not see, and which case in the book demonstrates it?

    '
  answer: 'The loop measures response to the advertising, so it cannot see a failure that occurs after
    the purchase. The case is the automobile campaign at printed pp. 119-120, which he calls the most
    successful automobile advertising he ever did and which destroyed the client: inquiries ran at a rate
    he says he never saw matched and sales started at an amazing rate, but the car had been skimped in
    every detail, hundreds came back, and the larger the sales the worse the ruin. His own formulation
    is that the note played was too high for the product available. His other criterion is where the check
    belongs — the repeat-sale test at printed p. 135, which asks whether repeat business paid for the
    advertising before the bills fell due. He does not connect the two, and nowhere draws the conclusion
    that response volume is not evidence of a successful campaign.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'The loop is at printed pp. 153-156; the Mitchell collapse at printed pp. 119-120; the repeat-sale
    criterion at printed p. 135 and printed p. 155. The observation that he never joins them is an extraction
    observation.

    '
  confounders:
  - assuming a high response rate is what Hopkins means by a campaign paying; his stated criterion is
    repeat sales inside the billing period
  - attributing the Mitchell failure to the advertising; he attributes it to the product and to the height
    of the claim
  - reading this as a general warning about vanity metrics; the specific mechanism he describes is that
    each additional sale converts into an additional damaged reputation
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0009
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 135 (Chapter Twelve, Palmolive at Benton Harbor) and printed p. 155 (Chapter
    Fourteen, the first Pepsodent test city)
  question: 'What does Hopkins treat as the signal that a tested campaign may be scaled? State the criterion
    in his terms and say what makes it a stricter test than an inquiry count.

    '
  answer: 'The criterion is a cash-cycle test: repeat sales in the test town must pay for the advertising
    before the advertising bills fall due. He reports it met at Benton Harbor for Palmolive, in the first
    Pepsodent test city on $1,000 which came back with a profit before the bills were due, and on Liquozone
    where profit on sales more than paid the advertising before the bills fell due; in each case that
    was the signal to raise capital and scale. It is stricter than an inquiry count because a first purchase
    measures the advertising and a second measures the product, so requiring repeat revenue inside the
    credit period tests both the appeal and the article. He calls the question of what users do after
    they try the product the most vital factor in advertising. He reports the criterion met in every campaign
    he scaled and no case where it failed, which is what survivorship would predict.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: testing_method
  requires_application: false
  support: 'Printed p. 135 for the most-vital-factor statement and the Benton Harbor repeat sales; printed
    p. 155 for the $1,000 Pepsodent test city. He flags the Palmolive figures as possibly inexact and
    dating from 1911.

    '
  confounders:
  - reading it as payback or ROI in the modern sense; the deadline is the advertising credit period, an
    artefact of how his bills were settled
  - confusing it with the coupon-response loop, which is a copy-selection device and not a scaling gate
  - assuming the criterion is generally available; it only exists for goods repurchased fast enough to
    clear a billing cycle
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_mla_0010
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 133-137 (Chapter Twelve, Benton Harbor) and printed p. 154 (Chapter Fourteen,
    the 52-countries claim)
  question: 'The whole of Hopkins''s test-then-scale method rests on one assumption about transfer. State
    it in his terms, state the strongest form he gives it, and name the internal evidence against it.

    '
  answer: 'The assumption is that a result obtained in one small market transfers: human nature over the
    country is about alike, and the appeal that won in Benton Harbor won from coast to coast. The strongest
    form is international — he says Pepsodent was sold in 52 countries and advertised in 17 languages
    and that in each the appeal proved equally effective, with no comparative figures offered. The internal
    evidence against it is his own: he records certain evaporated-milk brands holding certain markets
    for years regardless of advertising, for no reason he can find but familiarity; and his own doctrine
    that a campaign''s key-note must be drawn from the current local preoccupation sits badly with one
    appeal working equally in seventeen languages. The deepest problem is structural — only successful
    transfers are reported, and a book written by the man who chose which tests to scale cannot tell us
    how often a local success failed to generalise.

    '
  answer_type: source_position
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: 'Printed pp. 133-137 for the Benton Harbor test and the human-nature claim; printed p. 154
    for the 52 countries and 17 languages; printed p. 103 for the evaporated-milk observation; printed
    pp. 120-121 for the key-note doctrine. He himself flags the 1911 figures as possibly inexact.

    '
  confounders:
  - treating test-to-scale agreement on Liquozone as evidence for the general transfer claim; it is one
    product
  - reading the 17-languages claim as a measured finding; no figure accompanies it
  - assuming the survivorship problem is one he acknowledges; he does not raise it anywhere
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0011
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 149-150 (Chapter Thirteen, Two-minute Oats and Quick Quaker Oats)
  question: 'Hopkins tested two reformulations of the same product and got opposite results. Describe
    the principle he draws, and identify the procedural difference between the two tests that he does
    not remark on.

    '
  answer: 'The principle is that a product change must be judged by the existing users who would have
    to accept it. Two-minute Oats was thought so obviously right that most people involved wanted to adopt
    it without testing; he insisted on trying it in a few towns with a free package and a letter asking
    users their opinion, and the verdict went against him — the flavour differed from oatmeal as they
    knew it, and although new users would probably have preferred it there were too few of them to matter.
    A later version cooking in three to five minutes, with no unique flavour, was opposed by most of the
    directors precisely because the first had failed; he insisted on another test, and some 90 per cent
    of users voted for it. The difference he does not remark on is procedural: in the second test he bought
    the first package rather than giving it, and told every user he did not care which they preferred.
    Both moves are ones he elsewhere says change behaviour, so the two tests are not the same procedure
    and their results are not cleanly comparable.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: 'Printed pp. 149-150. The free package and the letter for Two-minute Oats; the bought package,
    the disclaimer of preference and the 90 per cent figure for Quick Quaker. The 90 per cent has no denominator,
    method, geography or date beyond a few towns. The free-versus-bought distinction is his own doctrine
    at printed pp. 133-134.

    '
  confounders:
  - concluding that faster cooking was the variable; his stated variable is the flavour familiar to existing
    users
  - reading the second test as a replication of the first; the offer and the framing both changed
  - assuming the directors were wrong to hesitate; his own account is that they were reasoning from the
    first result, which was real
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0012
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 158-159 (Chapter Fifteen, the five-dollar mail-order article)
  question: 'Give the cost-per-reply figures in Hopkins''s clearest documented comparison, and state what
    conclusion he draws from it. His conclusion is not the one most readers take.

    '
  answer: 'An advertiser selling a five-dollar article by mail had replies costing 85 cents and sales
    about $2.50, and was becoming unprofitable. Hopkins''s agency prepared an advertisement the advertiser
    rejected as too unattractive; a rival agency''s larger, more alluring advertisement was run instead
    and produced replies at $14.20 each on a five-dollar article. The advertiser then ran the rejected
    one and replies cost 42 cents, a level he says held for years on some 250,000 replies a year. The
    conclusion he draws is not about layout. It is about decision-making: advertisers without a trace
    on cost judge advertisements by appearance, and they lose on the same scale as this man did. Appearance
    is the only signal available to a decider with no cost trace, so in the absence of measurement the
    selection criterion is systematically wrong rather than merely noisy.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: false
  support: 'Printed pp. 158-159, where the 85-cent, $14.20 and 42-cent figures and the 250,000 replies
    a year are stated. Neither advertisement is described beyond attractive and unattractive; no dates,
    media, offer or seasonality are given, and Hopkins was a party to the comparison.

    '
  confounders:
  - reading it as a rule that plain layouts outperform attractive ones; his rule is that appearance is
    not the signal to decide on
  - treating the 34-fold spread as a clean copy effect; nothing rules out media, offer or season, none
    of which is reported
  - confusing cost per reply with cost per sale; both are given and they are different figures
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0013
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 157 (Chapter Fifteen, why he kept doing mail-order work)
  question: 'Hopkins says he did mail-order advertising throughout his career against his own financial
    interest. What are his two distinct reasons, and what is the logical form of the second?

    '
  answer: 'The first reason is calibration of the practitioner: the work is educational, keeps one on
    his mettle and fixes one''s viewpoint on cost and result, so a man who keeps doing it cannot drift
    into judging work by appearance. The second is a reason for imitating surviving mail-order advertisements:
    they are known to be profitable, else they would not continue, and they are usually the residue of
    many traced experiments, so they represent the best method yet found for that line. The logical form
    of the second is a survivorship argument, used deliberately as a selection filter. It is used correctly
    here — but it inherits the conclusions of experiments run on other products in other conditions, and
    he states elsewhere that methods succeeding in one line cannot be applied to another.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: testing_method
  requires_application: false
  support: 'Printed p. 157. The qualification that methods do not transfer between lines is at printed
    p. 176. He concedes in the same passage that the work seldom ran to large amounts and was not worth
    the effort from a writer''s standpoint.

    '
  confounders:
  - reading it as advice to run mail-order campaigns; the stated benefit is to the practitioner's judgement,
    not to the client
  - missing that the second reason is survivorship reasoning, which he does not name as such
  - assuming what transfers is settled; his own statement at printed p. 176 that methods do not transfer
    between lines cuts against the copying
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0014
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 6 (Chapter One) and printed p. 174 (Chapter Sixteen, closing paragraph)
  question: 'Hopkins draws an explicit boundary around the market he claims to understand. State it, name
    the products he says he would expect to fail on, and say what he concedes about the field he excludes
    himself from.

    '
  answer: 'He limits himself to ordinary wage-earning purchasers — what he calls the common people — and
    says he does not know the reactions of the rich. He names Rolls-Royce, Tiffany and a Steinway piano
    as lines he would expect to fail on. What he concedes is important: the exclusive-appeal field, which
    he typifies by Cadillac advertising, is a real and ably occupied field, and people of small incomes
    can well be excluded from it. So this is a statement about the limits of his own contact, not a claim
    that exclusive-appeal advertising does not work. It is the single most important boundary condition
    on the whole book: nearly every other principle in it was derived inside this scope, and he nowhere
    claims any of them holds outside it. The surrounding passages carry 1920s American class framing —
    simple folks, plebeian, the vast majority — which is his own framing of his audience and not a taxonomy
    of buyers.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: 'Printed p. 6 for the naming of Rolls-Royce, Tiffany and Steinway; printed p. 174 for the Cadillac
    concession and the confinement of his appeals to the common people. Explicit source statement, culturally
    bounded.

    '
  confounders:
  - reading it as a claim that luxury advertising fails; he says the opposite, that the field is ably
    occupied
  - treating his principles as unrestricted because he states them without qualification elsewhere; this
    passage is the qualification
  - taking his class vocabulary as an analytical segmentation rather than as period framing
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0015
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 73-75 (Chapter Seven, 'Medical Advertising', opening pages)
  question: 'Before recounting the medicine campaigns that made his reputation, Hopkins states a reversal.
    What exactly does he repudiate, what does he not repudiate, and what reason does he give?

    '
  answer: 'He repudiates the class of product. He says he no longer approves of medicine advertising,
    has not advertised a medicine except for simple ailments for seventeen years or more, would not do
    so under any circumstances, and is refusing an appropriation of $900,000 to advertise one as he writes.
    His reason is external to advertising technique: medical science advanced, doctors turned away from
    drugs, and it came to be understood that an ailing person needs a diagnosis rather than the quelling
    of symptoms. What he does not repudiate is the practitioners — he still defends the medicine-makers
    as high-minded and believes they did more good than harm, even though the good came largely through
    mental impressions — and he does not withdraw a single technique. The guaranty, the free first bottle,
    the keyed return and the test-city method all come out of these campaigns and are urged on the reader
    elsewhere without qualification. He asks the reader to remember that what he describes happened many
    years earlier and accorded with the practices of that time. This is recorded as his 1927 position
    and as historical record, not as guidance.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: 'Printed pp. 73-75. The $900,000 refusal, the seventeen-year abstention and the separation
    of how advertising works from what ought to be advertised are all stated there. Ethically dated material,
    recorded as the source''s own position.

    '
  confounders:
  - reading the repudiation as extending to the methods; it does not, and the book keeps recommending
    them
  - reading it as a full retraction; he continues to defend the makers in the same passage
  - assuming the methodological point he makes about these campaigns — that nothing but the advertising
    could sell the goods, so profit and loss attached to the advertising alone — is an ethical defence;
    it is an argument about measurement
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0016
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 182-183 (Chapter Seventeen, on art and colour in advertising)
  question: 'On expensive art and colour printing, Hopkins does something he does almost nowhere else
    in the book. What is it, and what exactly does he say the state of the evidence is?

    '
  answer: 'He marks the question as unresolved instead of settling it. He reports advertisers paying $1,500
    to $4,000 per drawing, says no test he knows proves such expense profitable, and says he knows of
    no case where coloured pictures paid better than black-and-white; he notes people use colour more
    and more but rarely on traced advertising, and that when a great advertising journal appealed for
    proofs that colour advertising paid, no actual proof came to his attention. He then concedes he is
    prepared to believe colour may prove profitable on some lines, naming fruits and desserts, calls it
    a question for further experiment, and doubts the results could ever be applied to all lines. His
    own explanation — that fine art work, like fine language, simply makes buyers wary — he offers explicitly
    as his idea, not as a finding. This is the clearest place in the book where he separates what he has
    proved from what he believes.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: creative_process
  requires_application: false
  support: 'Printed pp. 182-183, where the $1,500-$4,000 range, the absence of proof, the fruits-and-desserts
    concession and the phrase marking it a question for further experiment all appear. Absence of proof
    within one practitioner''s traced work is weak evidence of absence, which is in effect why he leaves
    it open.

    '
  confounders:
  - reading it as a finding that colour does not pay; he says he has no proof either way and expects exceptions
  - carrying the conclusion to any later medium; colour reproduction cost and quality in the 1920s are
    what the argument is about
  - conflating this with his firmer rule in the same chapter that pictures must have selling value and
    none be used for decoration — that one he does assert
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0017
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 204 (Chapter Nineteen, 'Some Things Personal')
  question: 'Hopkins closes with a scope claim about his own book that has two halves in tension. State
    both halves, and say what the tension costs the strong reading.

    '
  answer: 'The first half is concessive: the tempo of American life is changing, fads, fancies and desires
    change like a kaleidoscope, certain styles in advertising are changing, and every campaign has always
    required a different key-note because imitators never succeed. The second half is the assertion: human
    nature does not change, and the principles set down in the book are as enduring as the Alps. He does
    not reconcile them. If every campaign needs a key-note drawn from the current public preoccupation,
    then a large part of what the book teaches is contingent, and the enduring residue is smaller than
    the Alps claim implies. A great deal of the content is plainly period-bound in any case: coupon redemption
    at independent retailers, one-cent letters to dealers, 8-point reading matter, $10 per word, publisher-paid
    commissions, untargetable circulation, and door-to-door canvassing. The claim is recorded as a 1927
    position by one American practitioner working in one market and one class, not as a finding.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: 'Printed p. 204, where both halves appear within a few sentences. The key-note doctrine he
    is in tension with is at printed pp. 120-121. The list of period-bound mechanics is an extraction
    observation across the book.

    '
  confounders:
  - quoting the Alps sentence without the concession that precedes it
  - treating the research analogy he draws to medical research as evidence of a protocol; no protocol,
    dataset or replication appears in the book
  - assuming he means the specific tactics endure; his claim is about principles, and he says the tactics
    must change every campaign
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0018
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 189 and 192-193 (Chapter Eighteen, 'My Great Mistake')
  question: 'Chapter Eighteen is titled ''My Great Mistake''. What was the mistake, and why does that
    matter for reading the book as an account of advertising failure?

    '
  answer: 'The mistake is not an advertising error at all. It is that he stayed as an employee. Bissell
    told him the day before Christmas that he was too good a man to work for him and should start out
    for himself; Hopkins says his Scotch conservatism led him to stay, that he married soon after, and
    that he thus tied himself to a lifetime of service as an employee. He adds that he watched coworkers
    found their own companies on lines he had taught them, and that had he invested merely his commissions
    in the enterprises he fostered the amount would run into many millions. It matters because the chapter
    with the most confessional title in the book contains no admission of an advertising mistake — his
    regret is about who captured the value he created. The book''s actual admitted campaign failure is
    elsewhere, at printed pp. 147-148, where he calls the Quaker Oats habit-change campaign one of the
    greatest mistakes of his life.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: 'Printed p. 189 for the Bissell advice and the decision to stay; printed pp. 192-193 for the
    commissions calculation and the switch to working for himself. The Quaker Oats admission is at printed
    p. 147.

    '
  confounders:
  - expecting a campaign post-mortem from the chapter title; the chapter is about career structure
  - reading it as a claim about advertising risk; the risk asymmetry he describes is between practitioner
    and owner
  - treating the many-millions estimate as a computation; it is a retrospective figuring with no working
    shown
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0019
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 154 (Chapter Fourteen, why featuring the free offer divided results by four)
  question: 'Hopkins reports that the same device helped in one category and hurt badly in another. Give
    both results, his explanation, and — the part usually got wrong — what he actually changed in response.

    '
  answer: 'On food products the word free was appealing and multiplied the readers of his advertisements.
    On a hygiene product, featuring a free offer at the top of the advertisement divided results by four.
    His explanation is about the role the advertiser appears to occupy: professing to offer benefits of
    vast importance, a featured giveaway made them traders simply seeking to sell rather than scientists
    seeking to benefit, and so discredited the very factors that brought converts. What he changed was
    placement, not the offer. The sample stayed free; the free offer was moved out of the position of
    chief appeal, so the apparent object of the advertisement was to prove at the advertiser''s own cost
    what the product could do. Reading this as a rule against free samples reverses him. He also stresses
    that such things are not easy to discover and that he found it only through keyed coupons.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed p. 154. Divided our results by four is a single reported ratio with no absolute figures,
    no denominator and no statement of what else differed between versions. The altruistic framing he
    substituted is described at printed p. 153.

    '
  confounders:
  - concluding that free offers do not work in hygiene categories; the sample remained free
  - generalising the divide-by-four ratio; it is one comparison on one product with no denominator
  - assuming he presents this as a limit on his own generalisations; he presents it as a discovery about
    psychology, though it is the book's strongest evidence that his rules are category-conditional
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0020
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 147 (Chapter Thirteen, the cost of charging for a sample)
  question: 'Hopkins gives his sharpest arithmetic warning about charging for a trial. State the figures,
    and the companion finding he attaches about half-price and free-with-purchase offers.

    '
  answer: 'Inquiries for free samples may cost about 25 cents each; ask ten cents for the same sample
    and the inquiries may cost $1.25 or more. So to gain that ten cents you may lose a dollar, and start
    only a fifth as many users for the money you spend. He calls economy on this point one of the greatest
    follies in advertising, and states the rule as: remember you are the seller, make trial easy for the
    people you have interested, and do not ask them to pay for your efforts to sell them. The companion
    finding is that tens of millions of advertisements offering one puffed grain free with the purchase
    of the other were ineffective, because such an offer is simply a price reduction — and it is just
    as hard to sell at half price as at full price to people who are not converted. The figures are given
    as illustrative magnitudes, in the form may cost and may be, not as the result of a specific dated
    test.

    '
  answer_type: tradeoff
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed p. 147 for the 25-cent, ten-cent and $1.25 figures and the one-fifth claim; printed
    p. 146 for the free-with-purchase finding and the half-price reasoning.

    '
  confounders:
  - treating 25 cents and $1.25 as measured results; they are stated as magnitudes that may obtain
  - extending the finding to price promotion generally; his stated mechanism is that price is not the
    obstacle for an unconverted buyer
  - reading it as contradicting his earned-sample rule at printed p. 146; the reconcilable form is that
    effort in attention may be demanded and effort in money may not
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0021
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 146 (Chapter Thirteen, why promiscuous puffed-grain sampling was stopped)
  question: 'Hopkins distinguishes two practices both called sampling and says one is nearly worthless.
    Draw the distinction as he draws it, and give the four specific objections he raises to the bad one.

    '
  answer: 'The distinction is whether the recipient did anything to get the sample. Distributing samples
    to people who did not ask — house to house, cast on the doorstep, handed out at large — he calls a
    very bad plan; he reports distributing millions of puffed-grain samples this way and winning few users,
    then stopping. His objections are that the product has no prestige and the giving itself cheapens
    it; that the stores are not stocked when the sample is used; that grocers are offended by free distribution
    of goods they sell; and that the samples are like waifs, arriving with no reason to be wanted. The
    good form is sampling into an interest the advertising has already created: the reader must read the
    story to know the sample exists, cut the coupon and present it at a grocery, and finds the product
    in stock. His rule is to give samples only to people who take some action to acquire them because
    of an interest created — give the product an atmosphere, otherwise it will never make a lasting impression.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: 'Printed p. 146. The promiscuous-sampling failure is reported without figures and sits in the
    same passage as a separate failure about medium choice, so the two causes are not separated.

    '
  confounders:
  - treating the effort required as a purchase; his other rule at printed p. 147 is that charging anything
    collapses response
  - reading this as a claim about sample quality or the product; his mechanism is entirely about how the
    sample was obtained
  - assuming the grocer objection is incidental; retail stocking is load-bearing in his account, since
    the sampled user must be able to buy
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0022
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 133-134 (Chapter Twelve, the two-stage Palmolive introduction)
  question: 'Describe the two-stage introduction plan Hopkins says he originated for Palmolive, and explain
    why he insists that we will buy is a better headline than a free offer.

    '
  answer: 'Stage one runs two or three advertisements carrying the product story, each with a boxed announcement
    above it that in a few days the advertiser will buy a cake of the product for any woman who applies.
    He claims this announcement multiplies the readership of the story advertisements, because a woman
    told that something is to be bought for her wants to know what it is. Stage two, once sufficient desire
    exists, is a full page carrying a coupon redeemable at any store, with the dealer authorised to hand
    over the goods and charge the advertiser the retail price. He says the plan produces, in about two
    weeks, both a general understanding of the product and thousands of users. His argument for we will
    buy over free is that paying the dealer full retail shows supreme confidence that the article will
    please, whereas a free offer cheapens the product and creates resistance to paying later for what
    was first received as a gift. He never supports this with a traced comparison of the two headlines
    anywhere in the book.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: 'Printed pp. 133-134, where the boxed pre-announcement, the coupon page and the we-will-buy
    versus free argument are set out. The superiority claim is argued psychologically, not measured.

    '
  confounders:
  - reading it as a rule against the word free; at printed p. 154 he reports free multiplying readers
    on food products
  - collapsing the two stages into one; the delay between announcement and coupon is what he says builds
    the desire
  - assuming the retail-redemption mechanic has a modern equivalent; it is a physical mechanic of independent
    retailers and paper coupons
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0023
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 92-95 (Chapter Eight, the successive guaranty forms) read with printed p.
    85 (Chapter Seven, the guaranteed shoe fit)
  question: 'Hopkins built risk transfer into successively stronger forms. Trace the escalation, state
    his general finding about people who are trusted, and name his own counter-case.

    '
  answer: 'The escalation runs: a druggist-signed money-back warrant on a remedy; then a warrant covering
    a five-dollar lot of six bottles, so that a single-bottle purchase was underwritten by it; then paying
    outright for the buyer''s first fifty-cent bottle and warranting the six that followed. His formulation
    is that asking a person to take a chance on you means a fight, while offering to take a chance on
    him makes the way easy, and that he analysed his propositions until he was sure the buyer had the
    best end of the bargain. His general finding is that very few people cheat a seller who offers a square
    deal — try to hedge or protect yourself and human nature likes to circumvent you — and that he has
    been robbed often but at roughly a tenth of what enforcing a safe proposition would have cost. His
    own counter-case is the Racine Club shoe scheme, where he guaranteed a fit and the returns absorbed
    most of the profit. So the cost of risk transfer depends on how often the product actually disappoints.

    '
  answer_type: tradeoff
  difficulty: hard
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed pp. 92-95 for the escalating guaranty forms and the under-2-per-cent claim rate on
    Liquozone; printed p. 85 for the guaranteed shoe fit. The strongest applications are on patent medicines
    whose advertising he elsewhere disowns.

    '
  confounders:
  - generalising the sub-2-per-cent claim rate; it is one product in one year on a remedy whose efficacy
    a buyer could not judge
  - assuming a guarantee is a contract the buyer intends to use; his account is that it functions as a
    statement of the seller's confidence
  - separating the mechanism from its evidence too cleanly; the evidence comes from campaigns he repudiates
    as a class
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0024
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 76 (Chapter Seven, the neighbourhood druggist's signature on the guaranty)
  question: 'Hopkins claims a guarantee''s force comes from something other than its terms. What, and
    what second effect does he report that does not follow from the terms at all?

    '
  answer: 'It comes from who signs it. He observes that many an advertiser a thousand miles away offered
    to guarantee results, but the guarantors were strangers, so the promise carried no weight — redress
    from a stranger is not a real option to the buyer. His move was to have the neighbourhood druggist,
    to whom people actually paid their money, sign the guaranty. The second effect is the interesting
    one: the guarantee was written against a six-bottle, five-dollar purchase, few users ever bought that
    amount, and it nonetheless gave them confidence in every single-bottle purchase. That does not follow
    from the terms — it follows only if the guarantee is being read as a statement of the seller''s confidence
    rather than as a contract. He reports the plan worked on a cough remedy and then on two further remedies
    and secured most of the trade, with no figure for this mechanism in isolation.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed p. 76. Outcome reported as enormous, with no figures for the guarantor effect alone;
    the one claim-rate figure in the book belongs to the later Liquozone campaign, which combined the
    guarantee with a free first bottle. Bounded to a retail structure of independent neighbourhood druggists
    with standing local reputations.

    '
  confounders:
  - reading it as a rule about guarantee terms — coverage, duration, conditions — which is exactly what
    he says does not matter
  - treating it as third-party endorsement in the modern sense; his mechanism is that redress must be
    locally collectible
  - assuming the scope effect is a mistake by buyers; he reports it as the mechanism working
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0025
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 163-165 (Chapter Fifteen, the mail-order catalogue and the sales manager's
    card)
  question: 'A category where four competitors present near-identical offers at the moment of choice.
    Give Hopkins''s unit economics for it, where he placed his intervention, and the one design rule he
    puts on the intervention itself.

    '
  answer: 'His economics: inducing a woman to write for a catalogue cost about 25 cents, the colour catalogue
    at least 35 cents, so about 60 cents was invested per inquirer; she typically wrote to three or four
    advertisers, so about $2.40 was being spent across the field to produce an average sale of around
    $10, and which catalogue she ordered from turned largely on chance or fancy. He placed his intervention
    at the ordering moment rather than at the inquiry: every inquirer received a personal card from the
    sales manager, worded differently for new and returning customers, instructing that her order be referred
    to him personally so he could include a present. The design rule is that the gift was deliberately
    not described, because curiosity makes a stronger appeal than description — describe a gift and some
    decide they want it while more decide they do not, whereas everybody wants a secret gift. He adds
    a strict condition: the gift must not disappoint and must be something every recipient wants. The
    result is reported only as sales per catalogue enormously increased, with no figure — conspicuous
    in a passage where he gives precise unit economics for everything else.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: 'Printed pp. 163-165, where the 25-cent, 35-cent, 60-cent, $2.40 and $10 figures appear, along
    with the card wording, the undescribed gift and the condition on it. The outcome is qualitative.

    '
  confounders:
  - placing the intervention at the inquiry stage, which is where the competitive spending already was
    and where he says it is wasted
  - describing the gift, which is precisely the move he says loses more people than it wins
  - treating the enormous increase as a measured result; it is the one unquantified outcome in a heavily
    quantified passage
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0026
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 106 (Chapter Nine, the unnamed present) and printed p. 164 (Chapter Fifteen)
  question: 'Hopkins names curiosity as the strongest activating factor he knows and derives a specific
    rule from it. State the rule and the selection argument behind it, and give the condition he attaches.

    '
  answer: 'The rule is that an undisclosed reward outperforms a described one. His argument is about selection
    rather than about excitement: describe a gift and some will decide they want it while more will decide
    they do not, whereas everybody wants a secret gift — description gives the reader enough information
    to refuse, and withholding it removes the ground for refusal. He applies the same logic to campaign
    concepts, citing foods shot from guns, grains pictured at eight times normal size, and a pamphlet
    about convict-cut Indian wood hauled to the Ganges by elephants, all built to make the reader want
    to see the thing. His condition is hard: the undisclosed gift must not disappoint, must be something
    every recipient wants, and should be somewhat better than expected; and the offer should be handled
    quietly rather than blazoned. No comparative figure for described versus undisclosed rewards appears
    anywhere in the book.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed p. 106 for the wrapped unlabelled presents in grocers'' windows and the curiosity
    claim; printed p. 164 for the undescribed gift on the sales manager''s card. He also states in the
    same material a period belief that curiosity is especially strong with women, which is 1920s framing
    and is not extracted here as a claim about buyers.

    '
  confounders:
  - reading it as a general endorsement of mystery or teasing; his mechanism is specifically about removing
    grounds for refusal
  - ignoring the disappointment condition, without which the device damages the seller on delivery
  - assuming a measured comparison supports it; there is none in the book
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0027
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 77-78 (Chapter Seven, the conditions for entering an occupied field)
  question: 'State Hopkins''s entry condition for a new advertiser, including the softening clause that
    makes it far easier to satisfy than it first appears.

    '
  answer: 'Before committing, one must know the competition, know what others offer, know what people
    want, and be able to outbid the field in some way — on qualities, on service, or on terms. Crying
    a name or a brand does not satisfy the condition, and until one feels sure the advantages are strongly
    on his side it is folly to risk a battle. He adds a second constraint: never pay the cost of acquiring
    customers without seeing how they will be kept. The softening clause is that, failing a real advantage,
    one may create a seeming advantage by citing facts which others fail to cite. That makes the condition
    satisfiable by communication alone, and it is the clause his Schlitz and Van Camp campaigns actually
    run on. He gives no method for judging in advance whether an available claim is exceptional enough;
    his operational answer is elsewhere — run a cheap local test and read the repeat sales.

    '
  answer_type: concept_understanding
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed pp. 77-78. The seeming-advantage clause is stated there in his own terms; the commonplace-facts
    method it licenses is at printed pp. 79-82, and the repeat-sale test at printed p. 135.

    '
  confounders:
  - reading the condition as requiring a genuine product advantage; the seeming-advantage clause explicitly
    does not
  - treating it as a differentiation doctrine; his own account is that the article need not be unique
    and may embody no advantage at all
  - omitting the retention constraint, which is half the rule
  requires_application_canon013: false
  source_status: hold
  answer_type_as_written: concept_definition
- qa_id: qa_mla_0028
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 185-186 (Chapter Seventeen, things too costly to attempt)
  question: 'Hopkins names two conditions that disqualify a product from advertising regardless of how
    good the campaign would be. State both, and say which of the two is an artefact of his era''s media
    and which is not.

    '
  answer: 'The first is narrow incidence: an ointment, a germicide, a treatment for asthma or hay fever,
    a rub for rheumatism appeal to a small percentage, and the cost of reaching them in mediums of universal
    circulation is excessive — it cannot come back for decades. The second is a long repeat cycle: there
    are products every home should have, on convincing reasons, where a single purchase lasts months or
    years, so the cost of securing a customer exceeds the first-sale profit and further profits are so
    long deferred that advertiser and advertising man are discouraged before the tide can turn. The first
    is an artefact of media economics — circulation was bought whole and a narrow product paid for everyone
    it could not sell — and must not be carried forward as a general property of narrow products. The
    second is not media-dependent; it is plain unit economics and holds wherever acquisition cost must
    be recovered from purchases. He says the world is full of such things and that he has seen many men
    of great ability discouraged by them.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: media_planning
  requires_application: true
  support: 'Printed pp. 185-186. He names the excessive cost of reaching a small percentage through universal-circulation
    mediums, and the repeat-sales-too-far-apart condition, in adjacent paragraphs. The separation of which
    condition is era-bound is an extraction observation.

    '
  confounders:
  - carrying the narrow-incidence rule forward as though reach were still untargetable
  - reading the long-cycle condition as solved by his auxiliary-products structure at printed p. 197;
    he never connects the two
  - treating this as advice about campaign quality; his point is that these products are ruled out before
    any campaign is designed
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0029
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 191-192 (Chapter Eighteen, why he specialised on repeat-purchase goods)
  question: 'Hopkins states the rule that governed which products he took on at all. State it, and explain
    what it does to the reported success rate in this book.

    '
  answer: 'He specialised on proprietaries and foods — products people buy over and over — because the
    whole profit on a one-sale article must be made on that sale, which caps what may be spent to obtain
    it, whereas a product in daily consumption permits almost unlimited acquisition spending. His stated
    ideal is products that appeal to nearly every home and must be advertised forever, giving the example
    of foods mothers teach their children to use. He reports accepting a premium costing more than the
    profit on the six purchases required to earn it, because those six purchases made the brand familiar
    and the user then asked for it by name. What it does to the book is create a survivorship effect he
    built deliberately: his reported success rate is conditioned on a selection rule that excluded the
    hardest cases in advance. He also concedes the counter-case — a carpet sweeper lasting ten years at
    about a dollar of profit, which he says nobody has found an ordinary way to advertise profitably.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: 'Printed pp. 191-192. Hardly a limit is rhetorical — the real limit is discounted lifetime
    value, which he computes nowhere, and his own screen at printed pp. 185-186 is exactly where that
    arithmetic bites.

    '
  confounders:
  - reading hardly a limit literally; he gives no ceiling and computes no lifetime value
  - treating the selection rule as separate from his results; it is the reason the results look as they
    do
  - confusing this with the repeat-sale scaling test at printed p. 135; that is a gate on a campaign,
    this is a gate on which products to take
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0030
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 193-195 (Chapter Eighteen, the cosmetic line he prepared and abandoned)
  question: 'Hopkins prepared a complete cosmetic line and then decided to abandon it. What was present,
    what was missing, and what does his own word for the missing thing tell you about his screen?

    '
  answer: 'Present were market size and a finished product: he had learned that American women spent $700,000,000
    a year on cosmetics, more than on all other advertised lines combined, and he had prepared the line.
    Missing was what he calls a theory. The field was overcrowded, leading dealers held thousands of kinds,
    scores of new makers solicited them weekly, no line dominated, and a converted buyer arriving at a
    store faced a dozen demonstrators pushing something else. He sent men to Paris and Vienna to find
    something unique, some claim that would give him an advantage, and they found none — so he decided
    to abandon the line. His word for the missing element tells you the screen is not about the product''s
    merit or the market''s size: it is about whether a specific proposition exists around which an appeal
    can be built, and in the absence of one he treats abandonment as correct even after the goods exist.
    The venture resumed only when a proposition appeared, and the theory he eventually adopted was a person
    rather than a product property.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed pp. 193-195, where the $700,000,000 figure, the overcrowding, the Paris and Vienna
    search and the abandonment decision appear, followed by the account of the theory he found. He held
    an ownership interest in the resulting business and reports its performance as proprietor.

    '
  confounders:
  - reading market size as the entry signal; it is present in this case and he abandons anyway
  - assuming a theory means a product differentiator; the one he adopted was a named person
  - taking the recovery as the lesson; the abandonment decision is the transferable part, and he spends
    more space on the recovery
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0031
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 131-132 (Chapter Twelve, the agency advisory board)
  question: 'Hopkins reports refusing most of the propositions brought to his agency. Give the ratio,
    the observation he attaches about who hesitates, and the reason he states for the agency''s refusing
    posture — which is not the reason a reader expects.

    '
  answer: 'Of several hundred men with dubious prospects who came to the agency''s standing advisory board
    of some sixteen experienced men, open without obligation, nineteen in twenty were advised not to proceed.
    His attached observation is that the men who hesitated over their own propositions were the large
    advertisers with most at stake, and that this is generally so. The reason he gives for the posture
    is frankly self-interested rather than protective: failures and disasters damage advertising as a
    whole and therefore damage the agency, while one conspicuous success encourages many new ventures.
    Two limits: nineteen in twenty is a ratio over a self-selected population — men with dubious prospects
    who walked in — and not a base rate for propositions generally; and nothing tells us how the refused
    propositions actually fared.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: 'Printed pp. 131-132. The refusal criteria are not stated in this passage; they have to be
    assembled from his screening rules scattered elsewhere, principally printed pp. 77-78 and 185-186.

    '
  confounders:
  - reading nineteen in twenty as a failure rate for advertising propositions in general
  - assuming the stated motive is client protection; he gives a reputational-externality argument for
    the agency
  - expecting the criteria to be in this passage; they are not, which is why the ratio alone teaches nothing
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0032
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 103 (Chapter Nine, the evaporated-milk advice)
  question: 'Hopkins advised a client against advertising a standard product on a superiority basis. What
    is his stated reason, what did he do instead, and where does this sit against his own commonplace-facts
    doctrine?

    '
  answer: 'His reason is that one cannot establish or claim an advantage on natural or standard products
    — evaporated milk was made to government requirements — and he names eggs, butter, lard, flour and
    oatmeal as the same case, saying many millions have been wasted trying to tie people to a brand of
    a staple. His diagnosis of the category was that dominance there was not produced by advertising at
    all: certain brands held certain markets for years against every effort to displace them, and the
    only apparent reason was familiarity. So instead of arguing superiority he set out to manufacture
    familiarity. Where it sits is awkwardly: his commonplace-facts doctrine at printed pp. 79-82 was applied
    to beer and to canned beans, both arguably standard products. He does not draw the line, and the practical
    difference appears to be whether the production process is unfamiliar enough to the public to be worth
    publishing. Note also that the advice was not taken as stated — the campaign ran on the familiarity
    basis instead, so the rule itself was never tested.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed p. 103, where the standard-product argument, the eggs-and-butter list and the familiarity
    diagnosis appear. The tension with printed pp. 79-82 is an extraction observation; the source does
    not remark on it.

    '
  confounders:
  - resolving the tension in his favour by assuming beer and beans are not standard products; he never
    draws that line
  - treating familiarity as brand-building in the modern sense; his claim is narrower, that recognition
    is the operative variable where argument is unavailable
  - reading the rule as tested; the campaign that ran was the alternative
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0033
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 79-82 (Chapter Seven, the Schlitz brewery visit and the purity campaign)
  question: 'Hopkins built a famous campaign out of facts that were true of every competitor. Describe
    the mechanism, and state the precondition without which it does not work.

    '
  answer: 'Going through the brewery he found filtered-air cooling rooms, wood-pulp filters, pumps and
    pipes cleaned twice daily, bottles cleaned four times, a 4,000-foot artesian well beside Lake Michigan,
    six-month ageing, and a mother yeast cell developed through 1,200 experiments — and was told by the
    brewers that none of it was worth saying because all good brewers did it. He published it, and says
    he thereby gave the word purity a meaning that rival claims of Pure did not have. The mechanism is
    a communication asymmetry, not a product advantage: a category-wide claim word carries no information
    and is discounted, whereas the same claim supported by concrete process facts is believed; and because
    the facts are unfamiliar to the public though ordinary in the trade, the first to publish them is
    taken to own them and a later claimant appears to be imitating. He is explicit that the article need
    not be unique and may embody no advantage at all. The precondition is that no rival has already told
    the story. The outcome — fifth place to neck-and-neck with first in a very few months — is asserted
    with no figure, date or source, some thirty years after the fact, and no other cause is examined.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: 'Printed pp. 79-82 for the brewery facts, the brewers'' dismissal and the purity claim; the
    same method is reported for Van Camp beans at printed pp. 98-103, where every process fact told was
    standard canning practice.

    '
  confounders:
  - reading it as a product-differentiation strategy; he insists the product need not differ at all
  - assuming being first is optional; the whole effect rests on nobody having said it yet
  - treating the Schlitz outcome as evidence for the mechanism; it is an uncontrolled recollection decades
    later
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0034
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 81-82 (Chapter Seven, the brewers on their own processes) with printed pp.
    124-125 (Chapter Eleven)
  question: 'You interview a manufacturer and he says a detail of his process is too ordinary to mention
    because every competent maker does it. Separately, he volunteers at length the thing he is proudest
    of. On Hopkins''s account, what should you conclude about each, and why?

    '
  answer: 'His diagnostic runs in both directions. The fact the maker dismisses as commonplace is the
    cue that it may be the campaign, because his dismissal is caused by familiarity and familiarity is
    exactly what the buyer lacks — he is too close to his product, sees only the ordinary in his own methods,
    and does not realise the world at large might marvel at them. The thing he volunteers is what he takes
    pride in, and Hopkins''s repeated finding is that this is usually of no interest to the buyer: makers
    talk construction because construction is what interests them. The Goodyear case is the paired example
    — the company promoted a construction name while the two results it produced went unmentioned. Two
    limits Hopkins does not supply: a fact being unfamiliar does not make it interesting, and he offers
    no test for which commonplace facts are worth telling short of running the campaign. The discipline
    that keeps the cue from licensing any process fact at all is his own procedure elsewhere — find out
    what buyers say they want first, then get figures on those things.

    '
  answer_type: repair
  difficulty: hard
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed pp. 81-82 for the brewers'' dismissal and the maker''s blindness to his own methods;
    printed pp. 124-125 for the construction-versus-result case; the wants-first procedure is at printed
    pp. 140-142.

    '
  confounders:
  - inverting the cue and treating the maker's enthusiasm as the signal, which is what he says produces
    bad copy
  - assuming any dismissed fact will do; unfamiliar is not the same as interesting, and he gives no filter
  - reading it as a research method; it is a cue observed during an interview, and the actual method he
    prescribes is buyer interviews first
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0035
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 124-125 (Chapter Eleven, the straight-side tire renamed)
  question: 'A manufacturer''s advertising is built on a construction feature the trade is proud of. Hopkins
    faced exactly this on Goodyear. What did he do, and what is the general move?

    '
  answer: 'He had seen the straight-side tire advertised repeatedly without ever learning what it meant.
    On asking, he found the construction produced two results: the tire would not rim-cut, and it held
    ten per cent more air size for size. He renamed the product for the result and headed every advertisement
    with those results. The general move is to convert a construction fact into a result claim, and Hopkins
    treats that conversion as often being the whole campaign. His stated reason is that the buyer is not
    a mechanic and cannot evaluate construction, so a construction claim carries her no value, whereas
    the same fact expressed as an outcome is immediately valuable — results are what people are after
    and they care not how you get them. His strongest counter-case is in the same book: for Palmolive
    Shaving Cream he published laboratory process figures as the campaign, and his reconciliation is that
    those figures answered wants buyers had stated. The ten-per-cent figure is the manufacturer''s own;
    he records no independent verification.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: copywriting
  requires_application: true
  support: 'Printed pp. 124-125. The same point is made earlier against broom action, patent dumping devices
    and cyco bearings on carpet sweepers, at printed pp. 40-41.

    '
  confounders:
  - assuming technical detail is always wrong; the Palmolive shaving-cream campaign at printed pp. 140-142
    is built entirely on laboratory figures
  - reading the rename as branding; the name was made to carry the result claim, which is a copy decision
    in his account
  - treating the ten-per-cent oversize claim as verified; it is the client's figure
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0036
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 184-185 (Chapter Seventeen, on superlatives and definite figures)
  question: 'Hopkins claims superlatives are worse than useless. Give his two-part argument, the credibility
    condition it depends on, and the tungsten-lamp illustration.

    '
  answer: 'Part one: a superlative such as the best in the world makes no impression whatever, because
    it is the expected claim — the reader may not blame you for exaggeration, but you lose much of his
    respect. Part two is the damage: he naturally minimises whatever else you say, so the superlative
    discounts the rest of the advertisement. Definite figures behave in the opposite way. Such definite
    statements are either facts or lies, and people do not expect that reputable concerns will lie, so
    the figures are accepted at par. His illustration: say a lamp gives more light than other lamps and
    people are mildly impressed; say it gives three and a half times the light of carbon lamps and they
    realise you have made actual comparisons. The condition the whole argument rests on is institutional
    and era-specific, and he states it twice — readers know you cannot, in the better mediums, deliberately
    mislead them. Note the mechanism rewards whoever quantifies first rather than whoever is better: he
    says plainly that rivals could probably meet the same shaving-cream specifications.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: 'Printed pp. 184-185. The tungsten figure, the either-facts-or-lies formulation and the better-mediums
    condition are all stated there; the shaving-cream concession is at printed pp. 140-142 and the three-per-cent
    margin case at printed p. 166.

    '
  confounders:
  - reading it as a claim that specificity is persuasive in itself; his mechanism runs through checkability
    and legal exposure
  - dropping the better-mediums condition, which is a fact about 1920s publishing and not a general property
    of figures
  - assuming a definite figure implies superiority; he says the device rewards quantifying first, not
    being better
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0037
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 165-166 (Chapter Fifteen, the three per cent net profit)
  question: 'Six mail-order competitors were all guaranteeing lowest prices. Hopkins was asked for a more
    impressive claim. What did he do, why did he say the existing guarantees were worthless, and what
    can a reader actually check about his answer?

    '
  answer: 'All six blazoned low-price claims and published guarantees to undersell any other price, with
    money back to anyone who found a better bargain. His diagnosis is that in a chorus of that kind all
    are on the same plane and all are as ineffective as though they made no claims at all. He looked up
    his client''s figures, found the average profit for years past had been less than three per cent,
    advertised that profit, and promised not to exceed it — the argument being that prices quoted on a
    three per cent profit must be close to minimum and could not be materially decreased, so those quotations
    were accepted as bottom prices despite everyone else''s guarantees. What a reader can actually check
    is nothing: a margin is not verifiable by a buyer, the figure came from the client''s own historical
    accounts, and no independent verification is reported. So the device works, on his own account, because
    definite figures are believed rather than because this one was confirmable.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: copywriting
  requires_application: false
  support: 'Printed pp. 165-166. The chorus-of-bargains diagnosis, the three per cent figure and the undertaking
    not to exceed it are stated there; the general credibility argument is at printed pp. 184-185.

    '
  confounders:
  - treating the margin claim as more verifiable than a lowest-price guarantee; it is less so
  - reading the guarantees as failing because they were untrue; his argument is that identical claims
    cancel
  - assuming a competitor could not copy the move; nothing in his account prevents it
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0038
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 177-178 (Chapter Seventeen) and printed pp. 99-100 (Chapter Nine)
  question: 'Hopkins names two specific phrases-and-postures he says kill advertisements. Name both families,
    quote the short phrases he gives for the first, and state the single mechanism that condemns both.

    '
  answer: 'The first family is brand insistence: insist on this brand, avoid imitations, look out for
    substitution — to which he adds buy my brand, mine is the original, be sure to get the genuine. He
    says such appeals have no good effect and indicate a motive with which buyers cannot sympathise, and
    that he has seen many an advertisement killed by a single unfortunate phrase of this kind. The second
    family is institutional boasting: about the plant, the output, the age of the firm, anything more
    interesting to you than to your prospect. Boasting is repulsive, he says, and he identifies it as
    the recurring reason he lost large accounts. The single mechanism is that both make the advertiser''s
    own interest the visible content of the appeal. Every such phrase is in substance a request to transfer
    money from a competitor for the advertiser''s benefit — a grocer would not say come to my store rather
    than the next store, he offers an advantage. His estimate that nine-tenths of advertising money is
    lost to selfish purposes openly displayed is rhetorical, with no computation given, and he elsewhere
    concedes that name-crying may sometimes pay to an extent.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: copywriting
  requires_application: false
  support: 'Printed p. 177 for the insist-on-this-brand phrases and the killed-by-a-single-phrase claim;
    printed p. 178 for do not boast and boasting is repulsive; printed pp. 99-100 for the buy-my-brand
    diagnosis and the account-loss dynamic.

    '
  confounders:
  - reading these as tone problems; his mechanism is about whose interest is visible
  - assuming brand insistence fails because of wording; he says the motive is what buyers detect
  - taking nine-tenths as a measurement
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0039
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 66-70 (Chapter Six, 'Personal Salesmanship') and printed p. 177 (Chapter
    Seventeen)
  question: 'A manufacturer wants copy that asks people to buy his product, states where it is stocked
    and quotes the price. On Hopkins''s doctrine, what is wrong with all three, what does he substitute,
    and what does he concede about the substitution?

    '
  answer: 'All three make the seller''s interest the content of the appeal, and his position is that no
    selfish appeal produces a reading or an action. He says he never asks people to buy, rarely says the
    goods are stocked by dealers, and seldom quotes a price. What he substitutes is service: the appeal
    must consist of something useful offered to the reader, with the seller''s gain left unmentioned.
    His own worked case is selling shortening to bakers at above the market price, which six salesmen
    had failed to do at all, by never discussing the product — he offered each baker a printed pie card
    for his shops, or a signed railcar advertising the baker''s own pies for nine hundred miles, on condition
    that he order the shortening. What he concedes is that the appearance is engineered: the advertisements
    sound altruistic and the advantage to himself was covered up in his efforts to please. This is a persuasion
    technique presented as such, not an ethical claim. He also concedes a hard failure condition located
    in the client rather than in the method — he could not make it work at Swift and Company, which refused
    to give anything away, and says he knows of no advertising success made by a packing house.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: persuasion
  requires_application: true
  support: 'Printed pp. 66-70 for the Cotosuet pie cards and railcar cases and the covered-up advantage;
    printed p. 177 for from start to finish offer service. The Swift failure is his own counter-case;
    the six-salesmen comparison is not a controlled one, since they were selling at a price the trade
    had already refused.

    '
  confounders:
  - reading the doctrine as an ethical commitment; he states plainly that the altruistic appearance is
    constructed
  - assuming service means customer service; in his cases it is a concrete useful thing given to the buyer
  - generalising the Cotosuet result; his own Swift case shows the method failing on a client's refusal
    to give anything
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0040
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 177 (Chapter Seventeen, brilliant writing has no place in advertising) and
    printed p. 22 (Chapter Two)
  question: 'A team is pleased that readers call their advertisement beautiful and admire the writing.
    What does Hopkins say that reaction indicates, and what is the mechanism he proposes?

    '
  answer: 'He treats admiration as evidence against the advertisement. His claims are that brilliant writing
    has no place in advertising, that a unique style takes attention from the subject, that any apparent
    effort to sell creates corresponding resistance, and that persuasive ability arouses the fear of over-influence.
    His prescription follows: be natural and simple, keep the language inconspicuous, use the shortest
    words possible, never try to show off — in fishing for buyers, as in fishing for bass, one should
    not reveal the hook. The mechanism is signalling: visible skill signals intent to persuade, and a
    buyer who detects intent to persuade discounts the content, exactly as a buyer becomes wary of an
    over-dressed salesman. Two limits worth stating. He scopes the claim to his own audience of ordinary
    purchasers spending their own money, and he offers no traced comparison anywhere of a plain against
    a stylish text where only style differed — the nearest evidence, the mail-order cost-per-reply case,
    varies size, type, decoration and copy together.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: copywriting
  requires_application: true
  support: 'Printed p. 177 for the four claims and the fishing image; printed p. 22 for the earlier statement
    that style is a handicap and that education and literary style hinder this work. The claim shades
    into his stated personal hostility to formal education at printed pp. 7-8.

    '
  confounders:
  - reading it as advice to write badly; he prescribes plainness, not incompetence
  - treating the mail-order 42-cent case at printed pp. 158-159 as isolating style; several variables
    move together there
  - carrying the claim outside the audience he scopes it to at printed p. 6
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0041
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 152-153 and printed p. 185 (Chapters Fourteen and Seventeen, on prevention
    and negative appeals)
  question: 'A hygiene brand proposes a campaign showing the consequences of neglect in order to frighten
    people into buying. State Hopkins''s objection in two parts — one psychological, one economic — and
    the exception he grants.

    '
  answer: 'The psychological part: people will do little to prevent troubles they do not have, because
    they do not cross bridges in advance; they are seeking happiness, safety, beauty and content, not
    avoiding hypothetical harms. He couples this with an absolute rule against negative presentation —
    never advertise negatively, do not picture or feature ills, show the happier results — and reports
    that every illustration he used showed attractive people and good teeth. The economic part is the
    sharper half and is usually missed: people will do anything to cure troubles which exist, but legitimate
    advertising has little scope there, because those who have met the misfortune form in most lines a
    percentage too small to consider. So the exception is real — fear works where the trouble already
    exists — and it is ruled out by audience size, not by psychology. His evidence is that scores tried
    to scare people into using a dentifrice and none succeeded so far as he knows, which is an absence
    of success in his own recall rather than a comparison.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: persuasion
  requires_application: true
  support: 'Printed pp. 152-153 for the prevention-versus-cure reasoning and the resolution to advertise
    the tooth paste as a creator of beauty; printed p. 185 for never advertise negatively and the too-small-a-percentage
    statement.

    '
  confounders:
  - stating the rule as fear never works; he says it works where the trouble exists and is uneconomic
    there
  - reading the beauty appeal as a creative choice; he reports verifying by keyed returns that beauty
    was the appeal that drew
  - treating the claim as measured; it rests on his not knowing of a successful fear campaign
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0042
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 151-153 (Chapter Fourteen, the film and the beauty appeal)
  question: 'Hopkins initially refused the Pepsodent proposition. What changed his mind, and what is the
    device he used, stated generally?

    '
  answer: 'He refused because it was a technical proposition and he did not see a way to educate the laity
    in technical tooth-paste theories. He then read book after book by dental authorities and in the middle
    of one found a reference to the mucin plaques on teeth, which he afterwards called the film. The device,
    stated generally, is to name a concrete obstacle and attach a wanted outcome to removing it: rather
    than teaching the buyer a theory, give her a single named thing standing between her and something
    she wants — here, beauty — and let the product be the removal of it. He then verified by keyed returns
    that beauty was the appeal that drew. Two things to keep in view. The obstacle was renamed by the
    advertiser, from a term of art to a coined word, so the device includes constructing the category
    in which the product wins. And he held a stock option in the enterprise and reports making a million
    dollars on it, which bears on how his retrospective account of his own foresight should be read.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed pp. 151-152 for the initial refusal, the option on a block of stock, the reading and
    the film; printed p. 153 for beauty as the chief appeal learned from the coupon reports.

    '
  confounders:
  - reading it as consumer education; he explicitly rejected educating the laity in the theory
  - treating film as a technical term he adopted; it is a word he coined for one
  - reading his initial scepticism as modesty; it is a useful record of how uncertain the decision was
    in advance
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0043
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 140-142 (Chapter Twelve, Palmolive Shaving Cream)
  question: 'Hopkins entered a category of loyal users with a product he says had no real advantage. Give
    his two-step procedure, say why the order of the two steps matters, and state what he concedes about
    the resulting advantage.

    '
  answer: 'Step one: send research men to interview men by the hundreds and record what they say they
    most desire in the product. Step two: take those stated wants to the chemist and require measured
    figures on each of them for your own product. The resulting claims were lather multiplied 250 times,
    fifteen per cent of water absorbed by the beard within one minute making the hairs wax-like for cutting,
    and lather holding its fulness ten minutes on the face. The order matters because interviewing establishes
    which attributes buyers will attend to, so measurement effort is spent only where it will be credited
    and the figures answer questions buyers were already asking; reversed, you get measured facts nobody
    asked for. What he concedes is decisive: rivals could probably meet the same specifications, and he
    has no idea that one maker far excels others in the line — the advantage came from being first to
    give figures on results. One wrinkle in his own procedure: the chemist volunteered a further factor
    buyers had not named, so the method as described also permits adding wants buyers never expressed.

    '
  answer_type: mechanism
  difficulty: hard
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 140-142. Interviews reported with no sample definition, method, geography or date
    beyond men by the hundreds; the outcome of domination in eighteen months is explicitly reported as
    hearsay — he says he is told it happened.

    '
  confounders:
  - reading it as product development; nothing about the product changed
  - reversing the steps into measure-then-message, which is the failure mode the procedure is designed
    against
  - treating the eighteen-month domination as a reported result; he marks it as something he was told
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0044
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 98-103 (Chapter Nine, the Van Camp investigation)
  question: 'Every advertiser in a category is arguing against the other brands. Hopkins investigated
    and concluded they were all fighting over the wrong thing. What did he find, what did he do, and what
    is the general principle?

    '
  answer: 'He found that 94 per cent of housewives baked their own pork and beans, so only 6 per cent
    were amenable to any canned-bean argument — and every advertiser in the field was crying buy my brand
    at that six per cent. His move was to change the opponent: he could not bake better beans than his
    rivals, but he could bake better beans than any woman at home, so the campaign attacked the home practice
    on its specific weaknesses — sixteen hours of cooking, crisped beans on top and mushy beans below,
    fermentation, poor digestibility. The general principle is that advertising can only win a buyer away
    from whatever she is doing instead, so where the dominant alternative is a household practice rather
    than a rival product, arguments aimed at rival products address a small minority and leave the real
    contest untouched. Two cautions. The 94 per cent figure is reported without method, sample, geography
    or date, attributed to investigators he sent out. And this sits in direct tension with his later Quaker
    Oats conclusion that habits cannot be changed profitably in paid print — a contradiction he never
    addresses.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: concept_development
  requires_application: false
  support: 'Printed pp. 98-103 for the 94 per cent finding, the attack on home baking and the restaurant
    distribution used as evidence to women. The contradiction is with printed pp. 147-148.

    '
  confounders:
  - reading it as competitive positioning against brands, which is exactly the framing he rejects
  - assuming the 94 per cent is a measured statistic; no method is reported
  - resolving the contradiction with the habit-change chapter by assuming he changed his mind; he presents
    both as lessons and never reconciles them
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0045
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 147-148 (Chapter Thirteen, the Quaker Oats educational campaign)
  question: 'Hopkins calls the Quaker Oats campaign one of the greatest mistakes of his life. What was
    the reasoning that led him into it, why did it fail on his account, and what is the sweeping conclusion
    he draws — including the part of it that is narrower than he admits?

    '
  answer: 'The reasoning was share arithmetic: the company controlled a large percentage of the oatmeal
    business, so increasing total consumption of oatmeal would bring it most of the benefit. He employed
    hundreds of men to gather data and ran an educational campaign to create new users. He says it was
    far-reaching and effective as far as it went and did not pay, because no new user would repay the
    cost of his conversion in his lifetime. The sweeping conclusion: no one can profitably change habits
    in paid print; new habits are created by general education and largely by writers who occupy free
    space; if it cannot be done on a large scale it certainly cannot be done on a small one; every line
    and every word directed to that end is waste; the advertiser comes in after the habit is changed and
    says which method is right. The narrower truth is in his own diagnosis of this case: everybody already
    knew the value of oatmeal, so those not using it had a reason hard to overcome. That is a specific
    feature of this category, not a general law, and the conclusion drawn from it is much wider than the
    case supports. He offers a second costing — converting a person to the tooth brush at some $25 a convert
    — as his own figuring, with no derivation.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed pp. 147-148. The one-line structural argument he does not make explicit but which
    follows from his text is that one advertiser bears the whole cost of conversion while every competitor
    shares the benefit.

    '
  confounders:
  - reading it as a claim that category growth never pays, when his own diagnosis rests on oatmeal already
    being universally known
  - treating the $25 conversion cost as measured
  - missing that it contradicts the Van Camp account at printed pp. 98-103, where he claims to have moved
    women off home baking
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0046
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 98-103 (Van Camp) read against printed pp. 147-148 (Quaker Oats)
  question: 'Hopkins reports moving housewives off home baking and also concludes that habits cannot be
    changed profitably in paid print. Both are his own accounts, both are asserted as lessons. State the
    distinction that could reconcile them, and be clear about whose distinction it is.

    '
  answer: 'The distinction that could reconcile them is that Van Camp substituted a purchase for a task
    the housewife was already performing — she already wanted baked beans and the change was who did the
    baking — whereas the Quaker campaign tried to make people who did not eat oatmeal start eating it,
    which is adoption of a practice rather than substitution of a supplier for one. On that reading, converting
    existing demand is cheap and creating demand is not. It must be stated plainly that this distinction
    is not Hopkins''s. He never addresses the contradiction, never qualifies either conclusion by reference
    to the other, and states both in the strong form. A reader who attributes the reconciliation to the
    source is putting words in his mouth; what the source actually provides is two opposed lessons drawn
    from two of his own campaigns.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: false
  support: 'Printed pp. 98-103 and printed pp. 147-148. The contradiction is an extraction observation;
    the proposed distinction is the extractor''s, offered as the available reconciliation and marked as
    such.

    '
  confounders:
  - attributing the substitution-versus-adoption distinction to Hopkins
  - assuming the later chapter supersedes the earlier one; the book presents both as standing lessons
  - resolving it by chronology; he does not date the two conclusions against each other
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0047
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 120-121 (Chapter Ten, choosing the key-note) and printed p. 149 (Chapter
    Thirteen, calories)
  question: 'Hopkins treats the choice of a campaign''s central note as a decision about something other
    than the product. About what, and give two of his own examples with the period condition each depended
    on.

    '
  answer: 'About what the public is currently preoccupied with. He says one can never strike the right
    chord until he knows the trend of popular opinion, that one must know what buyers are thinking about
    and coming to want, and that he re-educated himself in current conditions after years away from a
    category because the situation changes like a kaleidoscope. Examples: he chose efficiency as the key-note
    for a car in a period when efficiency was a general business preoccupation; he chose engineering in
    a period when cars broke down and buyers valued engineering above everything; and on Quaker Oats during
    the war, when meat substitution was urged and calorie counting had become a fad, he presented cost
    per thousand calories at about a tenth the cost of meat and reports sales doubled. Each depends on
    its moment, and he says so. Two cautions: the doubling coincides with wartime meat scarcity and a
    national campaign for meat substitutes, and he claims the presentation as the cause; and his most
    successful key-note choice by his own account destroyed the client, so matching the preoccupation
    is necessary and plainly not sufficient.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: concept_development
  requires_application: true
  support: 'Printed pp. 120-121 for the trend-of-popular-opinion argument and the efficiency choice; printed
    p. 149 for the calorie presentation and the doubling claim. The destroyed client is at printed pp.
    119-120.

    '
  confounders:
  - deriving the key-note from the product, which is the move he argues against
  - reading the calorie doubling as isolated from wartime conditions
  - treating a well-chosen key-note as sufficient; his Mitchell case is the counter-example in the same
    chapter
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0048
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 119-120 (Chapter Ten, the efficiency campaign that ruined its client)
  question: 'Hopkins reports a campaign he calls the most successful automobile advertising he ever did,
    which ended in the client''s destruction. Trace the mechanism, and state the governance conclusion
    he does not draw.

    '
  answer: 'The key-note was efficiency, chosen because efficiency was a general preoccupation and the
    firm had a genuine efficiency expert and an efficient plant. Inquiries ran at a rate he says he never
    saw matched, sales started at an amazing rate, the company was recapitalised — and the car had been
    skimped in every detail. Hundreds came back, every car sold damaged the name, the bad reputation spread
    so widely that recovery proved impossible, and his own formulation is that the larger the sales the
    worse became the ruin. The mechanism is that advertising accelerates trial, so where the product fails
    on trial each additional sale converts into an additional damaged reputation, and the rate of destruction
    rises with the effectiveness of the advertising rather than falling. His own phrase is that they played
    too high a note for the product they had to sell. The governance conclusion he does not draw, anywhere
    he discusses how success should be judged, is that inquiry volume and early sales are not evidence
    of a successful campaign. The account is qualitative throughout, in a chapter where he elsewhere gives
    figures freely.

    '
  answer_type: failure_diagnosis
  difficulty: medium
  knowledge_type: evaluation_diagnosis
  requires_application: true
  support: 'Printed pp. 119-120. No figures are given for this campaign. The observation that he does
    not generalise it into a rule about judging campaigns is an extraction observation.

    '
  confounders:
  - diagnosing it as a copy failure; the copy worked, which is the point
  - reading too high a note as exaggeration in the claims; his account is that the claim was true of the
    plant and false of the car
  - assuming he draws the measurement lesson; he presents it as an accepted lesson about products, not
    about how to read response
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0049
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 116-117 (Chapter Ten, the trend of the crowd)
  question: 'Hopkins names one device the single most effective thing he ever found in advertising. Which,
    on what reasoning, and what does every case he reports have in common that limits the claim?

    '
  answer: 'The trend of the crowd — the observable direction of other buyers. His reasoning is that people
    cannot judge values and know they cannot, so they accept the verdict of the majority; it is hard for
    them to analyse reasons and worth, so they follow the crowd. He built whole campaigns on it: a car
    sold on the story of demand outrunning a bankrupt factory until production moved into tents; a tire
    brand whose growth in demand was featured in pictures and type until it seemed the whole motor world
    was turning to it; a car sold on multiplying sales and the production economies they permitted. He
    adds a variant for categories where ordinary buyers cannot measure — cite the choices of commercial
    users who do measure, since the ordinary buyer knows fleet operators do not choose on guesswork. What
    every case has in common is a brand that was already growing. The device requires a real trend to
    point at, so on his own evidence it amplifies momentum rather than creating it, and he does not distinguish
    it from a claim that the crowd is right. He also concedes that the figures in the Overland story may
    not be accurate and that he tells it from memory.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed pp. 116-117. The commercial-user variant appears in the tire material at printed pp.
    123-130. He hedges the Overland figures explicitly.

    '
  confounders:
  - reading it as social proof that can be manufactured; every case he gives has an underlying real trend
  - assuming he claims the crowd judges well; his claim is that buyers substitute the crowd's verdict
    for a judgement they cannot make
  - treating the commercial-user variant as third-party testing; it is borrowed judgement from buyers
    who do measure
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0050
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 125 (Chapter Eleven, after rivals adopted the same tire construction)
  question: 'Hopkins''s most successful differentiation campaign forced every rival to copy the feature.
    What happened next, what did he do, and what does his successor argument require that makes it unavailable
    to most advertisers?

    '
  answer: 'Within two or three years the advantage the campaign had been built on no longer existed, because
    the campaign itself had forced all rivals to that type of tire and Goodyear could no longer claim
    it. His response had three parts: he gradually reduced the coined product name, promoted the house
    name in its place, and shifted the argument to a different and, he says, more impressive talking point
    — the demonstrable growth of demand. He reports the same pattern in sampling, where rivals adopted
    the coupon plan and a new mechanism had to be invented, and states generally that few who dominate
    a field have any exclusive advantage and there are few advertised products which cannot be imitated.
    What the successor argument requires is a visible lead in demand, which is available only to a brand
    that is already winning. He offers no successor at all for a brand whose differentiator expires while
    it is behind. The two-or-three-year timing is one observation in one category in one period and he
    does not offer it as a general figure.

    '
  answer_type: boundary_condition
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: false
  support: 'Printed p. 125. The general statement that few who dominate have any exclusive advantage is
    at printed p. 82.

    '
  confounders:
  - reading the retreat to the house name as brand-building strategy; in his account it is what remains
    when the claim expires
  - treating two or three years as a rule of thumb he endorses
  - assuming the demand-trend successor is generally available; it is available only to the leader
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0051
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 125-126 (Chapter Eleven, on names that tell a story)
  question: 'Why does Hopkins treat naming as a principal creative decision rather than a labelling step,
    and what does he concede about names that succeeded without one?

    '
  answer: 'Because the name is the part always displayed — in every advertisement and on every package
    — so a name that states the claim forms an advertisement in itself and delivers the claim at every
    exposure, including exposures where nothing else is read. He says coining the right name is often
    the major step in good advertising and that no doubt such names often double the results of expenditures,
    which is offered as no doubt and carries no measurement. His cases: a tire named from the result its
    construction produced; an anti-skid tread named for the usage he wanted to establish, all wheels and
    all weathers, which he says became the custom largely through that influence; a cereal renamed so
    that two products could be advertised as a pair; a car reframed as a numbered model signed by its
    designer as a farewell creation. What he concedes is substantial: some products succeeded on fortunate
    names with almost no story to tell, and the very men who succeeded with one such name failed repeatedly
    with others — cases from which, he says, no principle can be drawn. He also concedes that a name built
    on a differentiator inherits that differentiator''s expiry.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: false
  support: 'Printed pp. 125-126 for the name-tells-a-story argument and the doubling estimate; printed
    p. 176 for the fortunate-name concession and the repeated failures of the same men.

    '
  confounders:
  - treating the doubling claim as measured
  - reading the fortunate-name cases as supporting naming generally; he cites them as cases yielding no
    transferable principle
  - assuming a claim-carrying name is permanent; he retired one himself when the claim expired
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0052
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 110-111 (Chapter Ten) and printed p. 145 (Chapter Thirteen, Professor Anderson)
  question: 'Hopkins says he attached a named individual to a product wherever possible. Give his stated
    reasons, the three uses he reports, and the thing he says openly about where such names come from.

    '
  answer: 'His reasons: personalities appeal while soulless corporations do not; make a man famous and
    you make his creation famous; it is far easier to make a man famous than an institution; and an individual''s
    name is usually better than a coined name and far better than a trade mark. His uses: featuring an
    unknown chief engineer by name, which he says gave a mid-priced car a distinction against a better-known
    and handsomer rival at the same price; making a designer sign the advertisements, borrowing his existing
    reputation; and writing an entire selling book in the name and voice of an independent practical chicken
    raiser who cared more for serving than for selling, producing a catalogue unlike the five or six identical
    ones the prospect had requested. He also established the inventor of puffed grains as the personality
    on that campaign. What he says openly is that the device is constructive — such names are often created
    for the purpose, as in theatre, film and authorship, and he wrote a book in another man''s name on
    facts that man supplied. The strongest case he reports is a single uncontrolled comparison in which
    price, reputation and appearance all differed as well.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 110-111 for the personality doctrine and the engineer and designer cases; printed
    p. 145 for the establishment of Professor Anderson on puffed grains. His largest later use of it was
    a business in which he held equity.

    '
  confounders:
  - reading it as spokesperson endorsement; his claim is that advertising makes the person prominent and
    the name then becomes an exclusive asset
  - assuming the person must already be famous; he says such names are often created for the purpose
  - treating the Chalmers-against-Cadillac comparison as isolating the device
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0053
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 99 (Chapter Nine, 'Try Our Rivals, Too')
  question: 'Faced with substitution once imitators arrived, rival advertisers insisted on their own brands.
    Hopkins did the opposite. What did he do, what is his stated reading of why it worked, and what does
    the move presuppose?

    '
  answer: 'He came out with headlines urging readers to buy the named competing brands and compare them
    with his own. His stated reading is that the willingness to invite comparison is itself the evidence:
    if we were certain enough of our advantage to invite such comparisons, people were certain enough
    to buy. So the operative effect is the buyer''s inference from a costly signal — directing a buyer
    to a rival is expensive to fake — rather than the comparison itself. He reports the rivals'' brand
    insistence fell on deaf ears. What it presupposes is a genuine advantage, or at least a strongly held
    claim; and here his own account of the category cuts against him, since he says the product was materially
    like its rivals and that in a blind serving of half a dozen brands nobody present could identify it.
    No response figures are given; the outcome is reported only as the appeal winning over others.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed p. 99 for the Try Our Rivals headlines and the certainty argument; printed p. 101
    for the blind serving in which the brand could not be identified.

    '
  confounders:
  - reading it as comparative advertising in the modern sense; he is not claiming the comparison will
    be won on merit
  - assuming the advantage must be real; his own account suggests it was not, which is the interesting
    part
  - treating the rivals' failure as evidence for his mechanism; neither side's returns are reported
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0054
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 160-161 (Chapter Fifteen, the women's garment credit business)
  question: 'Hopkins set up a mail-order business on terms identical to a competitor next door and says
    he drove that competitor out. Since the terms were the same, what changed, and what is the general
    principle?

    '
  answer: 'Everything about how accepting the offer would feel. He gave the business a woman''s name,
    selected a capable middle-aged woman and pictured her in every advertisement, had her sign them, and
    made the appeal from one woman to another. The advertisements never mentioned instalments; they dealt
    with credit, appealed to young women who wished to appear at their best, and pointed out what that
    meant in a woman''s career. Six months to pay was presented as an accommodation extended between equals
    — made to resemble the thirty-day store credit that richer women received — rather than as a concession
    to need. His formulation is that the offer was flattering, not humiliating, and that cold commercialism
    could not compete with the atmosphere created. The general principle is that where an offer implies
    something about the buyer''s circumstances, the framing decides whether accepting it is degrading
    or flattering; borrowing the framing of a higher-status arrangement lets the buyer accept without
    admitting need. The outcome is asserted with no figures and no date, and he was selling a second line
    into the same customer base at the same time.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed pp. 160-161. Culturally bounded: the appeal, the class comparison and the woman-to-woman
    device belong to American commerce and gender conventions of the 1910s and are recorded as the source''s
    own framing.

    '
  confounders:
  - attributing the result to better terms; the terms were identical by his own statement
  - reading it as tone of voice; the specific move is borrowing a higher-status arrangement's frame
  - treating the competitor's closure as demonstrated causation; no figures or dates are given
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0055
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 173-174 (Chapter Sixteen, the reason is rarely economy)
  question: 'A brand aimed at buyers of limited means proposes to lead on how much money the product saves
    them. State Hopkins''s objection, his substitute, and the character of the evidence he offers.

    '
  answer: 'His objection is that the reason for a purchase is rarely economy, and that where economy is
    a necessity most people like to defy it: suggest a thing because it is economical and you arouse opposition,
    you hurt their pride. A price appeal classifies the buyer, and buyers who must economise experience
    that classification as an injury. His substitute is to direct the appeal to those who do not consider
    cost, so that the buyer who must economise can include herself without accepting the classification
    — she demands what the best people use. His evidence is his own observation of the gardeners, their
    families and the village folk near his country home, whom he presents as typifying the ninety-five
    per cent who are his customers; and a cosmetics experience in which a low price on perfume did not
    appeal to the girl who should have economised. That is a convenience sample chosen and interpreted
    by him and presented as authoritative. The passage is heavily bounded by 1920s American assumptions
    about class, pride and gender, and is recorded as his framing, not as a finding about buyers.

    '
  answer_type: source_position
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: 'Printed pp. 173-174. He states in the same passage that he does not consult managers and boards
    of directors and submits campaigns to the simple folks around him instead.

    '
  confounders:
  - reading it as a rule against price mechanics; he used coupons, free bottles and a published margin
    extensively
  - treating the country-place observations as research
  - generalising it beyond the socially visible goods and the 1920s American context he draws it from
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0056
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 19-21 (Chapter Two) and printed p. 174 (Chapter Sixteen)
  question: 'Hopkins says the people deciding a campaign are systematically the wrong judges of it. State
    his mechanism, the remedy he prescribes, and the weakness in the remedy.

    '
  answer: 'The mechanism is structural rather than a failure of intelligence: preferences are formed by
    surroundings and the prosperous mingle with the prosperous, so the further a decider has moved from
    ordinary purchasers the less his own reaction predicts theirs. His formulations are that we must never
    judge humanity by ourselves, that he knows nothing more ridiculous than grey-haired boards of directors
    deciding what housewives want, and that where men insisted on judging the world by themselves, four
    times in five they failed. His remedy is to submit the question to ordinary members of the buying
    public rather than to managers and boards — he says he does not consult managers and directors because
    their viewpoint is nearly always distorted, and submits campaigns to the simple folk around his country
    place. The weakness is that his own alternative is a convenience sample he chose, living on his own
    property, presented as authoritative; and the four-times-in-five figure is asserted with no basis,
    sample or definition of failure. He also concedes that people who judged the world by themselves sometimes
    succeeded.

    '
  answer_type: mechanism
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 19-21 for the childhood origin — a book he was certain everyone wanted, refused
    by the town mayor on moral grounds and then sold seven times over in one business office — and the
    four-times-in-five claim; printed p. 174 for the remedy.

    '
  confounders:
  - reading it as an argument for consumer research; his remedy is asking the people around him, not a
    designed study
  - treating four times in five as a measurement
  - assuming he exempts his own judgement; the whole passage is offered as why his judgement was better,
    which is the same structure he criticises
  requires_application_canon013: false
  source_status: hold
- qa_id: qa_mla_0057
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 42-44 (Chapter Four, the Christmas display racks and the twelve woods)
  question: 'A manufacturer needs independent retailers to stock a slow-moving item and to give it window
    display. He has no sales force and refuses to concede margin. Hopkins faced exactly this at Bissell.
    What form did he give the offer, what did he require in return, and what does he say the form itself
    accomplished?

    '
  answer: 'He offered the dealer something the dealer wanted — a display rack and show cards for Christmas,
    and later a run of sweepers built in twelve distinguished woods, twelve to the dozen — and he offered
    it free but explicitly not as a gift: as a reward, and as a privilege the dealer had to apply for.
    In return he required a signed agreement that the dealer would display the goods on the furnished
    rack with the furnished cards until sold, and would enclose his pamphlets in every package leaving
    the store for three weeks. Scarcity was stated into the offer — the twelve woods would never be offered
    again. His account of why the form works is that it made the dealer solicit him: he appeared as a
    benefactor rather than a salesman, and he never asked for a purchase, which he calls useless. The
    figures he reports are dealer-side only: about five thousand letters brought a thousand orders, and
    the whole stock of 250,000 sweepers cleared in three weeks. He reports no consumer-sales measurement
    for the twelve-woods run at all.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: 'Printed pp. 42-44. The privilege-not-inducement formulation, the signed display agreement,
    the 5,000 letters and 1,000 orders, and the three-week clearance of 250,000 sweepers are all stated
    there. Practitioner assertion with reported order figures and no consumer-side measurement.

    '
  confounders:
  - the modern trade-promotion default — a discount, a rebate, or free goods with the order; Hopkins is
    specifically avoiding a margin concession and says so at pp. 129-130 and pp. 195-196
  - reading it as a merchandising giveaway; the conditional signed agreement is the load-bearing part,
    not the free rack
  - assuming the 1,000 orders measure consumer demand; they measure dealer response to a letter
  - confusing it with the pre-announced coupon plan of pp. 103-105, which forces stocking through consumer
    demand rather than through a privilege offered to the dealer
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0058
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 40-41 (Chapter Four, the Powers pamphlet for the Bissell Carpet Sweeper
    Company)
  question: 'A client must choose between a pamphlet by the most celebrated copywriter of the day and
    one by an unknown who has spent years inside the trade. On Hopkins''s account of this exact episode,
    what was wrong with the celebrated writer''s work — and, applying Hopkins''s own evidence rule, what
    does the outcome of the episode actually establish?

    '
  answer: 'His objection is not to the writing. He grants that the man was at the height of his fame and
    remembers the opening line. The objection is that the writer knew nothing about carpet sweepers, had
    given no study to the trade situation, knew none of the company''s problems, and had never spent a
    moment on a woman''s possible wish for a sweeper — so there was not one word in the pamphlet that
    would lead a woman to buy. General craft did not substitute for knowledge of the specific buying situation.
    Applying his own refusal rule from pp. 175-176, the outcome establishes much less than it appears
    to. What is reported is that the company decided against the famous writer, that the writer sued for
    his fee, and that the company fought and won the suit on Hopkins''s pamphlet. That is an internal
    preference and a court result. No keyed comparison of the two pamphlets selling sweepers is reported,
    and by the standard Hopkins states elsewhere — an untraced success is not evidence about the advertising
    that accompanied it — this case is an anecdote in favour of his rule, not a test of it.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 40-41 for the episode and for the "not one word which will lead women to buy"
    objection; printed pp. 175-176 for the refusal rule applied back against it. The pamphlet comparison
    was decided by the client and by a lawsuit, not by traced returns.

    '
  confounders:
  - reading it as an argument against hiring good writers; his argument is about what the writer investigated,
    not about ability
  - treating the lawsuit outcome as evidence that the pamphlet sold better
  - the modern brief-versus-craft framing, in which the fix is a better brief; Hopkins's fix is the writer
    doing the investigation himself
  - confusing it with his separate claim at pp. 22 and 177 that literary style is itself a handicap —
    a different objection with a different mechanism
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0059
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 79 (Chapter Seven, the Montgomery Ward sewing-machine inquiry)
  question: 'A mail-order house receives an enquiry about one specific product and its standing practice
    is to mail the general catalogue to every enquirer alike. Hopkins changed exactly this at Montgomery
    Ward. What did he substitute, what second element did he add, and what is the general principle he
    draws?

    '
  answer: 'He argued that a woman who writes in about a sewing-machine has that and nothing else on her
    mind, and should be treated like a prospect who had walked into a store. So the general catalogue
    was replaced by a special sewing-machine catalogue showing every style and price. The second element
    was social proof made local and checkable: each enquirer was also sent the names of everyone in her
    own vicinity who had bought one of their sewing-machines, and was asked to go and see the machines
    and talk to their owners. The principle he draws is that in a wide-reaching campaign we are too apt
    to regard people in the mass and broadcast seed hoping some part takes root, which he calls too wasteful
    ever to bring a profit; we must get down to individuals and treat people in advertising as we treat
    them in person, centring on the desires the person actually expressed. He reports no figures for the
    change.

    '
  answer_type: repair
  difficulty: medium
  knowledge_type: advertising
  requires_application: true
  support: 'Printed p. 79, the Montgomery Ward passage he handled through the J. L. Stack agency. The
    special catalogue, the names of nearby owners, and the "get down to the units" formulation are all
    stated there. Asserted as a valuable principle learned; no result is reported.

    '
  confounders:
  - the modern personalisation/segmentation reading; his unit is the single expressed desire in a single
    letter, and his tool is a different catalogue plus a list of neighbours
  - reading the neighbour list as a testimonial device supplied by the seller; he sends her to talk to
    them unmediated
  - assuming the change was measured; nothing is reported beyond his advocacy of it
  - confusing it with the trend-of-the-crowd argument at pp. 116-117, which works on an anonymous mass
    verdict rather than on named local owners
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0060
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 101-102 (Chapter Nine, the blind tasting at the Van Camp factory) read against
    printed p. 103 (the evaporated-milk refusal)
  question: 'A client''s product cannot be told from its rivals in a blind comparison, and he concludes
    that advertising cannot help him. Hopkins met this literally — in the Van Camp factory a half-dozen
    brands were served and nobody present could pick out Van Camp''s. What did he do, and where does he
    say this move stops working?

    '
  answer: 'He did not look for a superiority claim. He told the ordinary facts of good canning practice
    that no competitor had bothered to state: beans grown on particular soils, vine-ripened Livingston
    Stone tomatoes, every lot analysed, steam ovens baking for hours at 245 degrees, boiling in soft water
    so the skins would not toughen, sealing so flavour could not escape. He says plainly that this was
    the same story any rival could have told, and that the others thought it too commonplace to tell.
    The claim is not that the product is better; it is that the article first allied with those facts
    comes to typify them. The boundary is on the facing page. When Van Camp went into evaporated milk,
    Hopkins advised against advertising it, because it is a standard product made to government requirements
    — no advantage can be established or claimed on a natural or standard product, and he lists eggs,
    butter, lard and flour as the same case. So the move applies where practice varies and is untold,
    not where the product is standardised by specification and there is nothing left to tell.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: brand_communication
  requires_application: true
  support: 'Printed pp. 101-102 for the indistinguishable brands and the list of commonplace facts he
    told; printed p. 103 for the refusal on evaporated milk and the eggs/butter/lard/flour comparison.
    The Van Camp campaign outcome is asserted as an enormous success with a price premium; no traced figures
    for it are given anywhere in the chapter.

    '
  confounders:
  - the modern positioning default of finding or manufacturing a differentiator; Hopkins is explicitly
    conceding parity and claiming the untold fact instead
  - reading it as permission to imply superiority from a parity fact; he says the story is one any rival
    could tell
  - assuming the Schlitz and Van Camp move is universal; p. 103 is his own stated exception and he acted
    on it against his own billings
  - confusing 'standard product' with 'commodity category' — his test is a specification others must also
    meet, not merely a crowded market
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0061
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 103-105 (Chapter Nine, the Van Camp's Milk coupon page in New York)
  question: 'A brand has almost no shelf presence in a city dominated by a rival, and no budget for salesmen
    to call on grocers. Apply Hopkins''s Van Camp''s Milk plan: what is the sequence, what makes the grocer
    stock, and what did he report it cost and return?

    '
  answer: 'The sequence is announce, then redeem. For three weeks he announced in the newspapers that
    a coupon good at any store for a ten-cent can would appear, and told housewives what to expect from
    the milk. In parallel he mailed proofs of those advertisements to grocers, telling them every one
    of their customers would receive a coupon. The grocer''s own arithmetic does the stocking: each coupon
    is a ten-cent sale that goes to a competitor if he cannot fill it — the manufacturer pays the grocer
    his retail price on redemption, so the grocer takes his normal profit and carries no risk. Then the
    coupon ran on a single Sunday page. In New York he reports 97 per cent distribution secured within
    three weeks, largely by letter; 1,460,000 coupons presented from that one page; $146,000 paid out
    to grocers to redeem them; a total enterprise cost of $175,000 including the advertising; and the
    cost returned with a profit in under nine months. These are his own retrospective figures, unaudited,
    and he warns in a neighbouring chapter that his memory of dates and sums may be at fault.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: media_planning
  requires_application: true
  support: 'Printed pp. 103-105. The three-week pre-announcement to consumers and to grocers, the 97 per
    cent distribution figure, the 1,460,000 coupons, the $146,000 redemption, the $175,000 total and the
    under-nine-months payback are all stated there. Era-bound: paper coupons redeemed at independent grocers,
    general-circulation newspapers, no targeting.

    '
  confounders:
  - the modern digital-coupon or trade-listing analogy; the whole mechanism depends on the grocer physically
    fearing a lost ten-cent sale to the shop next door
  - treating the 1,460,000 coupons as 1,460,000 converted users; he claims homes trying the milk in a
    single day, and the repeat question is answered separately at p. 135
  - confusing it with promiscuous house-to-house sampling, which he attacks on the very next page as cheapening
    the product and offending grocers
  - assuming the figures were audited; they are his recollection two decades later
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0062
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 117-118 (Chapter Ten, on the desire for a change) with printed p. 183 (Chapter
    Seventeen)
  question: 'A campaign is still producing, but the client, the account team and the writer are all tired
    of it and want something new. Apply Hopkins: whose fatigue is this, what does he say about the reader,
    and what is the one condition under which he would change?

    '
  answer: 'He treats the fatigue as belonging to the wrong people. Continuous advertising along one line
    grows monotonous to the advertiser, who feels the public reads his story as often as he does, and
    it bores the man who writes it; both come to long for a change. The reader, on his account, reads
    the story once, as he reads a news item, and Hopkins says he knows of no reason why the reader should
    read it again — which is also why he insists every advertisement must carry the complete case rather
    than deferring anything to a later insertion. His default is therefore to keep a course that is working:
    there may be another way to success, even greater success, but the chances are against it, and the
    best way found to sell a product to thousands is probably the best way to sell other thousands. The
    condition he states for changing is not boredom and not elapsed time: he hesitates to drop a profitable
    method until he has found and proved a better one by some local tests. He offers no figure anywhere
    for how long a campaign keeps working.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: effectiveness
  requires_application: true
  support: 'Printed pp. 117-118 for the monotony argument, the read-once claim and the local-test condition;
    printed p. 183 for the complete-story consequence. Practitioner assertion; no wear-out data of any
    kind is reported.

    '
  confounders:
  - modern creative-wear-out and frequency-decay findings, which describe an audience effect Hopkins denies
    exists in his medium
  - reading him as forbidding change; his rule is to change only against a locally tested alternative
  - his own aside on the same pages that he personally lost interest once a campaign was on a clear course
    — a remark about his temperament, not a rule
  - generalising the read-once premise past 1920s general-circulation print, where a given reader met
    one insertion in one issue
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0063
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 126-127 (Chapter Eleven, naming the stocking dealers in the Goodyear newspaper
    campaign)
  question: 'Dealers in a category buy hand-to-mouth and will not hold stock. Hopkins solved this on Goodyear
    with a device that used no salesmen and no discount. What was it, what was the qualifying condition,
    and what does he say makes it compound?

    '
  answer: 'He ran a large local newspaper campaign and offered to name, in every advertisement, every
    dealer who stocked. The qualifying condition was a minimum stock — he states $250 — so the dealer
    had to buy in before he could appear. He reports inducing some 30,000 dealers to stock Goodyear tires
    on that basis within a few months, and says the campaign did much to change the whole complexion of
    the tire business. The compounding mechanism he gives is peer visibility rather than economics: no
    dealer likes to see his rivals named in a big campaign with his own name omitted, so the more dealers
    who join, the easier it becomes to get the rest. He claims to have secured almost universal distribution
    on new products this way more than once, and calls the plan an almost irresistible inducement to stock.
    No cost-per-dealer or sell-through figure is given.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: media_planning
  requires_application: false
  support: 'Printed pp. 126-127. The $250 minimum, the ~30,000 dealers, the omitted-name mechanism and
    the "few plans are more effective" assessment are stated there. Outcome claimed, no traced figures.
    Era-bound: local newspapers with space enough to print a long list of dealer names.

    '
  confounders:
  - reading it as co-operative advertising, in which the dealer pays a share; here the manufacturer pays
    and the dealer's price of entry is holding stock
  - the modern retailer-locator or store-finder analogy, which is a service to the shopper rather than
    a lever on the dealer
  - confusing it with the pre-announced coupon plan at pp. 103-105, which works through consumer demand
    the grocer cannot afford to miss
  - assuming a margin concession is involved; the whole point at pp. 129-130 is that he refuses to pay
    the trade
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0064
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 129-130 (Chapter Eleven) restated at printed pp. 195-196 (Chapter Eighteen)
  question: 'A launch plan has two halves: a consumer campaign, and a sales force selling jobbers and
    retailers with free goods and extra margin to secure listings. Hopkins states a doctrine that rules
    on this directly. What is the doctrine, what failure does he describe, and what does he say he actually
    did across his own accounts?

    '
  answer: 'The doctrine is that one cannot afford to sell anything twice: selling margins are not sufficient
    to accommodate both consumer demand and bought trade distribution, so an advertiser must choose. If
    a line can be sold by interesting dealers, let the dealer sell; but if you are going to do the selling
    for him, he can be paid no more than a distributor''s profit. The failure he describes is doubled
    selling expense — the advertiser wins the consumer, which is expense enough, then gives his profits
    away in free goods and inducements to jobbers and dealers who thereupon become mere order-takers and
    supply a demand they did not create. He adds two reasons the concession never ends: whatever margin
    you offer, somebody will bid higher, and jobbers and retailers have their own brands, on which he
    says they make four times as much, so they have no interest in giving you a hold. In Chapter Eighteen
    he restates it with numbers on the trade''s side — the wholesaler wanting some 20 per cent and charging
    you his cost of competing, the retailer demanding a dozen free in ten — and reports that most lines
    he advertised never employed a salesman at all. It is a doctrine he repeats and illustrates; he reports
    no comparison of the two routes run side by side.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: true
  support: 'Printed pp. 129-130 for the choose-one doctrine and the doubled-expense failure; printed pp.
    195-196 for the restatement, the 20 per cent jobber margin, the dozen-free-in-ten demand and the never-employed-a-salesman
    claim. Repeated within the source; asserted, not measured.

    '
  confounders:
  - the modern omnichannel default in which trade investment and consumer demand are complements to be
    balanced
  - reading it as advice to skip retail; he wants the retailer to stock, but pulled in by consumer demand
    rather than paid in
  - confusing it with his approval of the dealer-privilege offer at pp. 42-44 and the dealer-naming plan
    at pp. 126-127 — both give the dealer something he wants without giving him margin
  - treating the 20 per cent and dozen-free-in-ten as market data; they are his characterisation of the
    trade's demands
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0065
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 133-134 (Chapter Twelve, the Benton Harbor introduction of Palmolive) with
    printed p. 154 (Chapter Fourteen)
  question: 'The same coupon offer can be headlined two ways: the advertiser will buy a cake of the soap
    for every woman who applies, or a ten-cent cake is free. Chapter Twelve argues for one of these. Which,
    what mechanism does Hopkins give, and what later page in the book complicates it?

    '
  answer: 'He argues for the buying frame — he states outright that "We Will Buy" is a much better headline
    than a ten-cent cake free. His mechanism is about what each frame signals and what it costs later.
    Offering to buy the article for her at the dealer''s own price shows supreme confidence that the article
    will please, and it is more impressive because the advertiser is paying what she would pay; a free
    offer cheapens the product, and there is a resistance to afterwards paying for something that first
    arrived as a gift. He adds a distribution effect: the coupon is as good as a dime, women will not
    throw it away, and if one dealer will not redeem it another will, so proofs mailed to dealers obtain
    general distribution without salesmen. The complication is on p. 154. On food products the word free
    multiplied the readers of his advertisements; on a hygiene product, featuring the same free offer
    at the top divided results by four, because the woman did not want her interest in that class of product
    read as an admission about herself. So the frame''s effect is not a constant. He gives no split-test
    figures for the "We Will Buy" headline itself.

    '
  answer_type: comparison
  difficulty: hard
  knowledge_type: persuasion
  requires_application: true
  support: 'Printed pp. 133-134 for the two-stage plan, the "We Will Buy" preference and the cheapening
    argument; printed p. 154 for the food-versus-hygiene reversal. The headline preference is asserted
    psychologically; the reversal is the one place he reports a magnitude. OCR note: the losing headline
    is set in damaged display type on printed p. 134 and reads as garbage in both the working text and
    a fresh pdftotext pass; "ten-cent cake free" is the reading the surrounding argument requires, and
    it is given here as a paraphrase rather than as a quotation. "We Will Buy" itself is clean in the
    scan.

    '
  confounders:
  - the modern promotional default that free maximises trial, which is what p. 154 shows failing in one
    category and working in another
  - reading the buying frame as a discount mechanic; the consumer pays nothing either way, and only the
    framing and the dealer's settlement differ
  - confusing this with his separate rule at pp. 146-147 that charging even ten cents for a sample multiplies
    acquisition cost
  - treating 'We Will Buy' as tested; the Benton Harbor result at p. 135 tests the whole introduction,
    not the headline pair
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0066
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 143-144 (Chapter Thirteen, the repricing of Puffed Rice and Wheat Berries)
  question: 'Two products are in decline, their makers are convinced they cannot succeed, and there is
    no money for a campaign. Hopkins''s first act on this exact brief was not a creative one. What was
    it, how does the arithmetic work, and what did he assert rather than establish?

    '
  answer: 'His first act was to raise the prices. Puffed Rice went from ten cents to fifteen and Wheat
    Berries from seven cents to ten — renamed Puffed Wheat so the two could be advertised together — and
    he states that this added an average of $1.25 per case to the billing price. That increment was the
    advertising appropriation: the fund to develop new users came out of the price rather than out of
    the client''s existing margin, on a line the client had already written off. What he asserts rather
    than establishes is the demand side. He says he was sure the extra price would not reduce the sale
    in view of the advertising effort, and reports no test of the price change on its own, no before-and-after
    unit figures, and no attempt to separate the price effect from the campaign effect. He is also candid
    on the following pages that the same campaign then wasted large sums in newspapers, so the appropriation
    he created was partly spent on a medium he later proved could not pay for this line.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: true
  support: 'Printed pp. 143-144 for the two price rises, the renaming and the $1.25 per case; printed
    pp. 145-146 for the newspaper waste that followed. Outcome claimed for the campaign as a whole; the
    price decision itself is asserted with no isolating test.

    '
  confounders:
  - modern price-elasticity reasoning, which would want the demand response measured; Hopkins states his
    confidence and moves on
  - reading it as premium positioning; the stated purpose of the increase is to fund the advertising,
    and the appeals he then built were curiosity and the puffing process, not price
  - assuming the price rise was validated by the campaign's success; the two were changed together and
    he separates them nowhere
  - confusing it with his rule at pp. 173-174 that an economy appeal offends the buyers who most need
    to economise — a different argument about what copy may say
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0067
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 145-146 (Chapter Thirteen, why puffed grains left newspapers for magazines)
  question: 'A medium offers the widest reach in the market at the lowest cost per thousand, and the product
    is priced above what most of that audience can pay. Hopkins made this mistake in the open. What was
    it, what is the criterion he substitutes for reach, and what limits the transfer of this rule?

    '
  answer: 'He spent large sums on newspaper advertising for the puffed grains, and states the reason it
    could not pay: newspapers reach all the people, while this expensive food line appealed only to the
    classes, so nine in ten of those he reached could not afford the product. They finally proved that
    magazine advertising was their only possibility. The criterion he substitutes is not audience size
    or cost per reader but the proportion of the audience that can afford the product — waste is measured
    against affordability, not against reach. He states the same idea as a screen in Chapter Seventeen,
    where things that appeal to one per cent are ruled out because the cost of reaching them in mediums
    of universal circulation is excessive and cannot come back for decades. The transfer is limited by
    his own era: in 1920s American print the only instrument of selection available to him was the choice
    of vehicle, so the whole rule is a statement about buying a publication whose readership happens to
    match a price point. He describes no other targeting mechanism because he had none.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: media_planning
  requires_application: true
  support: 'Printed pp. 145-146 for the newspaper waste, the nine-in-ten figure and the move to magazines;
    printed pp. 185-186 for the same reasoning stated as a general cost screen. The nine-in-ten is his
    characterisation, not a measured readership figure.

    '
  confounders:
  - the modern targeting default, in which a broad vehicle is made narrow by audience selection; Hopkins's
    only lever is which publication he buys
  - reading it as a rule against newspapers; he calls newspapers the cheapest distribution available for
    an offer at p. 77, on a differently priced line
  - treating cost per thousand as the thing he is optimising; his objection survives a cheap newspaper
    because the wasted nine-tenths cannot buy at any price
  - assuming the class/mass split is a market measurement; it is a 1920s social categorisation stated
    as one
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0068
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 146 (Chapter Thirteen, the free Puffed Wheat with every Puffed Rice)
  question: 'A team proposes driving trial by giving one product free with the purchase of its sister
    product. Hopkins ran precisely this offer across tens of millions of advertisements. What was the
    result, what does he say such an offer actually is, and what did he substitute for it?

    '
  answer: 'He reports that the offer was ineffective — and generalises, saying such offers always are
    — because it amounts simply to a price reduction. His argument is that it is just as hard to sell
    at half price as at full price to people who have not been converted, so a coupon good for half the
    price is a small inducement; all those millions of advertisements brought few new users. What he substituted
    was a coupon good at any grocery store for a full package of Puffed Wheat or Puffed Rice, published
    in magazines. The difference he draws is not the discount depth but who ends up holding the coupon:
    the reader met the story first, and if she cut the coupon out it was because the story had interested
    her, so the sample went only to people whose interest had already been created and who then found
    in the package what they had been led to look for. This sits with his rule on the same page that a
    sample must be earned by an act of interest and never cast on the doorstep. He gives no response figures
    for either version.

    '
  answer_type: comparison
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: 'Printed p. 146. The ineffective free-with-purchase offer, the "simply a price reduction" reading,
    the half-price/full-price argument and the full-package magazine coupon are all stated there. Outcome
    claimed for both; no traced numbers reported at this point in the chapter.

    '
  confounders:
  - the modern promotional default that bundling and BOGO drive trial cheaply
  - reading it as a general objection to discounting; his objection is that a discount does no persuading,
    not that a lower price never sells
  - confusing it with his separate finding at pp. 146-147 that charging ten cents for a sample can push
    the cost of an inquiry from about 25 cents to $1.25 or more — that one has figures, this one does
    not
  - assuming the full-package coupon worked because it was more generous; on his account it worked because
    the story came first and the coupon selected for interest
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0069
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 178-179 (Chapter Seventeen, on the climax and getting action)
  question: 'An advertisement carries a strong argument, is read attentively, and ends. Hopkins names
    a specific loss that occurs at exactly this point. What is it, what device does he prescribe, and
    what does he claim as evidence for the device?

    '
  answer: 'The loss is the half-made convert. His picture of the moment is precise: the reader has paused
    because the subject or the headline caught her, and in a moment she will be interested again in her
    reading and will usually forget you — so many an advertiser loses most of his half-made converts to
    procrastination, which he says one cannot afford. The climax must therefore inspire immediate action
    in those already interested. His usual device is the coupon, and his account of why it works is physical
    rather than economic: people do not put the magazine aside, they clip the coupon as a reminder of
    something they have decided to do — a woman lays it on her desk, a man slips it into his vest pocket
    — and on some convenient occasion it turns up and is sent in, giving the advertiser a chance to follow
    up. He names other action devices: week sales, retail offers good for a certain day or hour, and limited
    offers of every sort. As evidence he says countless tests have proved coupons multiply returns, and
    that he has seen mail-order houses run catalogue advertisements with and without coupons where the
    difference in returns was enormous. He gives no numbers, no lines and no dates for any of it.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: persuasion
  requires_application: true
  support: 'Printed pp. 178-179. The half-made convert, the clipping behaviour, the week sales and limited
    offers, and the claim that countless tests proved coupons multiply returns are all stated there. Measurement
    asserted, magnitude withheld — the characteristic evidence pattern of this source.

    '
  confounders:
  - the modern call-to-action or conversion-rate framing, which treats the device as an interface element
    rather than as a physical token the reader carries away
  - reading the coupon here as a sampling or discount mechanism; on these pages its whole function is
    to defeat delay and open a follow-up
  - assuming the enormous difference is a reported figure; he describes tests he has seen and states no
    result
  - confusing urgency devices with his warning at pp. 152-153 against appeals to fear, which is about
    what the argument may say rather than about how it closes
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0070
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 179-180 (Chapter Seventeen, on frivolity and on competing with the reading
    matter)
  question: 'An agency presents a comic campaign that will be widely enjoyed, laid out to read like the
    magazine''s own editorial pages. Hopkins objects to both halves, on two different grounds. Give each
    objection, the exception he grants, and the kind of evidence he offers.

    '
  answer: 'Against the humour his ground is what money means to the reader. Spending money is serious
    business; money represents life and work and is highly respected; to most people spending in one direction
    means skimping in another, so the choice is a serious one and people want full value. Appeal for money
    in a lightsome way, he says, and you will never get it — people do not buy from clowns. He grants
    one exception explicitly: this does not apply to amusement advertising. Against the editorial disguise
    his ground is different and is about selection, not tone. You may win attention that way but not valuable
    attention, because most of the people attracted by amusement have no interest in your subject; the
    advertising columns and the reading matter have separate purposes, you cannot fool people by a resemblance,
    and any product worth advertising is, rightly presented, more interesting to an interested reader
    than a story. His evidence is weak by his own standards. He names "Sunny Jim" and "Spotless Town"
    as campaigns that proved his point and says many others are long forgotten, then rests on a challenge
    — nobody can cite a permanent success built on frivolity. That is an invitation to produce a counter-example,
    not a traced comparison, and it is the form of argument he refuses to accept from others at pp. 175-176.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: copywriting
  requires_application: true
  support: 'Printed pp. 179-180 for both objections, the amusement-advertising exception, the two named
    campaigns and the no-permanent-success challenge; printed pp. 175-176 for the evidence standard he
    applies to others. Argued and asserted; no traced returns are offered on either point.

    '
  confounders:
  - the modern view that entertainment buys attention and attention is the scarce good — which is close
    to the position he is attacking, and which he answers on the quality of the attention rather than
    its quantity
  - collapsing the two objections into one; the humour argument is about the seriousness of spending,
    the editorial-mimicry argument is about attracting uninterested readers
  - forgetting the amusement-advertising exception, which he states in the same breath
  - treating the two named campaigns as evidence; they are cited as known failures without figures
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0071
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 181-182 (Chapter Seventeen, on type size and on capitals)
  question: 'A designer argues for large display type and all-capital headlines so the advertisement will
    command attention. Hopkins answers both. What are his two arguments, and on what basis does he make
    them — which is not the basis a modern reader will assume?

    '
  answer: 'On size he argues from habit and from cost. Ordinary reading of the period was done in 8-point
    type; most mail-order advertisers, presenting something more interesting than ordinary reading matter,
    had gone down to 6-point. The easiest type to read, he says, is the ordinary, because anything unusual
    presents difficulties; advertisers use big type because they are trying to demand attention rather
    than induce it; and anyone who traces results can quickly prove that oversize type does not pay, because
    doubling the space you need doubles your cost. His summary is that if the story is interesting people
    will read it in their accustomed type, and if it is not they will not read it in any size. On capitals
    he argues from habit alone: all our reading is done in upper-and-lower case, so lines set in capitals
    have to be studied out — a detriment always, though he concedes it may not be a severe one. The basis
    is what readers are accustomed to, plus space economy, and not legibility as a measurable property
    of the letterforms. He runs no vision experiment, cites no study, and the point sizes he names are
    the reading conventions of 1920s American print rather than thresholds.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: typography
  requires_application: true
  support: 'Printed pp. 181-182. The 8-point ordinary reading, the 6-point mail-order convention, the
    demand-versus-induce framing, the doubling of cost with space, and the all-caps habituation argument
    are all stated there. Argued from habit and cost; the claim that traced results prove it is asserted
    without figures.

    '
  confounders:
  - modern legibility research and accessibility minimums, which reason from vision and prescribe larger
    sizes — the opposite conclusion from a different premise
  - reading the 6-point and 8-point values as recommended settings rather than as the reading conventions
    of his period
  - assuming his objection to capitals is about shouting or tone; it is about the reader having to study
    out an unaccustomed form
  - treating 'anyone who traces results can quickly prove it' as a reported test
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0072
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 183 (Chapter Seventeen, that advertisements should tell the full story)
  question: 'A campaign is planned as a sequence: the first advertisement raises the problem, the second
    gives the proof, the third closes. Hopkins rules this out. What is his premise, what does he require
    instead, and how does he decide what goes in?

    '
  answer: 'His premise is that people do not read advertisements in series. The advertiser who attracts
    a reader today may not get her attention again for months, so nothing can be deferred to a later insertion:
    when you get a reading, present all your arguments, because you will not get another chance to convince
    her and she will not read a second advertisement of yours if the first failed to offer something she
    wanted. What he requires instead is that every appeal that has proved important appear in every advertisement,
    since some buy for one reason and some for another, and an omitted appeal simply fails to reach the
    readers it would have convinced. The selection is not a matter of taste: appeals are tested by being
    featured as headlines, and he keeps the facts that bring a great deal of interest and drops the ones
    that bring little or none. He accepts the consequence openly on the following pages — completeness
    means similarity, so good advertisements on a line cannot vary greatly, and the real difference between
    them lies in the headline.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: copywriting
  requires_application: true
  support: 'Printed p. 183 for the no-series premise, the every-appeal-in-every-advertisement rule and
    the headline method of selecting appeals; printed p. 187 for the completeness-means-similarity consequence.
    Argued from a premise about reading behaviour that he asserts rather than measures.

    '
  confounders:
  - modern sequenced messaging and funnel-stage creative, which presume a reachable individual across
    insertions — the thing his premise denies
  - reading it as an argument for long copy as such; the length is a consequence of including every proved
    appeal, not a target
  - assuming the appeal set is fixed by judgement; he says it is settled by featuring claims in headlines
    and watching the interest each brings
  - confusing it with the monotony passage at pp. 117-118, which answers why repetition does not tire
    the reader — a related but distinct claim
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0073
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 186-187 (Chapter Seventeen, on headlines)
  question: 'A campaign is underperforming and the team proposes rewriting the body copy. On Hopkins''s
    account, where is the leverage, what magnitudes does he claim for it, and what does he not supply?

    '
  answer: 'The leverage is the headline, and he puts it there for a structural reason: because every advertisement
    must be complete, good advertisements on a line cannot vary greatly, so the great difference lies
    in the headline. Its function is selection rather than persuasion — it salutes the people you want
    to reach, like a bell-boy in a hotel calling for Mr. Jones, or like the heading on a news article
    that lets a reader pick, out of far more than he has time for, the few things he will read. The magnitudes
    he claims are large: again and again, he says, he has multiplied the results of an advertisement by
    eight or ten through a simple change of headline, and one sort of headline may appeal to 25 per cent
    of prospects where another appeals to 50 per cent. He states the method that establishes this — keyed
    tests comparing one headline against another — and says anyone can quickly prove it with keyed returns.
    What he does not supply is any of the evidence: no campaign, no line, no date, no volume of returns,
    and never the losing headline against the winning one. The multiples are recalled, not shown.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: testing_method
  requires_application: true
  support: 'Printed pp. 186-187. The bell-boy and news-heading images, the eight-or-ten multiplication,
    the 25-versus-50-per-cent contrast and the keyed-test method are all stated there. This is the clearest
    instance in the book of measurement asserted with the result withheld.

    '
  confounders:
  - modern headline-testing practice, which would report the pair, the sample and the interval; Hopkins
    reports only the multiple
  - reading the headline as the persuasive element; on his account it selects the audience and the complete
    body carries the case
  - treating eight-or-ten and 25-versus-50 as findings rather than as recollections offered without cases
  - assuming he therefore rates body copy unimportant; he requires it to be complete, and says the similarity
    between good advertisements is why the headline is where the variance lives
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0074
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 170-172 (Chapter Sixteen, the three interests and the economics of a test
    campaign)
  question: 'A client with money to spend asks why his agency insists on a small test first. Hopkins answers
    this from his own books rather than from principle. Reconstruct his arithmetic, and state what it
    implies about whose interest the small-test rule also serves.

    '
  answer: 'His figures are these. A valuable new client arrives with an opportunity that consists of a
    test campaign costing under $5,000, on which the agency commission is $750. Developing that test rarely
    costs under $20,000 if a competent man is employed, because the men in charge may spend weeks reading
    and researching. So the advertiser usually gets his money back whatever the outcome, while the real
    stake is the agency''s: failure means the advertiser loses a trifle and the agency loses much, and
    success may mean millions to the advertiser but only 15 per cent commission to the agency, and only
    for as long as the advertiser''s goodwill lasts. He draws the conclusion himself — he feels no obligation
    to an advertiser who permits him to make a test, because the speculation is his. The implication he
    does not hide is that the rule is doubly motivated. Keeping the advertiser''s exposure small until
    a profit is sure protects the advertiser from a loss he would denounce advertising for, and it also
    protects the agency''s development investment and its relationship. He ranks the three interests in
    the same passage in an order most readers find surprising: the publisher first, because the publisher
    pays the commission; the agency second; and the advertiser last, while conceding that everything depends
    on the advertiser''s attitude.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 170-172. The under-$5,000 test, the $750 commission, the $20,000 development cost,
    the 15 per cent commission, the "mine is the speculation" conclusion and the publisher-first ordering
    are all stated there. His own accounting of his own trade, offered as such.

    '
  confounders:
  - reading the small-test rule as purely an evidence discipline; he states its commercial logic himself
    on these pages
  - assuming the client bears the risk of a test, which is the modern default and the reverse of his arithmetic
  - treating the publisher-first ordering as a claim about who matters most; he ranks by who pays the
    commission and says the advertiser's success is what everything depends on
  - generalising the 15 per cent publisher-paid commission structure past its era; it is the pre-fee agency
    economics of the period
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0075
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 161-162 (Chapter Fifteen, the reciprocal credit letters between the garment
    house and the house-furnishing house)
  question: 'Two mail-order businesses each hold a list of customers who have paid their instalments as
    agreed, in different product lines. Hopkins built a mechanism on exactly this. What was it, why does
    he say the offer was almost irresistible, and what should a reader note about how it works?

    '
  answer: 'Each house wrote to the other''s good payers. The president of the house-furnishing concern
    told the garment company''s customers that he had met the proprietress, that she had said they were
    valued customers who had paid as agreed, and that he was therefore opening a like account: here is
    our catalogue, disregard the terms in it that ask for payment in advance, order what you want, send
    no money at all, begin paying in a month if the goods satisfy you. The garment seller then wrote the
    mirror-image letter to the house-furnishing customers. His account of the force is social rather than
    financial. These women had ordered clothing on credit wondering whether they would even receive it
    and could hardly believe strangers would trust them; a flattering offer of that kind, he says, makes
    any woman who receives it try to find some way to use it. He reports extending it to a third business
    in men''s clothing and says that by making a customer in one line a buyer of another they multiplied
    ordinary results, so that nobody on a single line could compete. Two things a reader should note:
    he reports no figures for the loop, and the whole mechanism runs on one business disclosing a named
    customer''s payment record to another, with no consent step described anywhere — a 1920s mail-order
    practice recorded here as historical fact, not as a recommendation.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: persuasion
  requires_application: false
  support: 'Printed pp. 161-162, following the garment business he set up at pp. 160-161. The paraphrased
    letters, the "could hardly believe strangers would trust them" reading, the men''s-clothing extension
    and the multiplied-results claim are stated there. Outcome claimed; no figures.

    '
  confounders:
  - modern cross-sell or lookalike-audience framing, which treats the shared list as data rather than
    as a personal introduction between two named proprietors
  - reading the flattery as the offer of credit itself; on his account it is being vouched for by name
    that does the work
  - assuming any consent or privacy consideration is present in the source; none is mentioned, and its
    absence is part of the historical record
  - confusing it with the framing lesson at pp. 160-161, where identical terms were made flattering rather
    than humiliating — that item is about how one offer is worded, this one about how two businesses feed
    each other
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0076
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 190-191 (Chapter Eighteen, 'My Great Mistake', why the man who builds an
    account loses it)
  question: 'An agency built a client from nothing; the business is now large and the client is being
    told that ordinary work would keep it going. Diagnose this with Chapter Eighteen: what is the structural
    dynamic, and what does Hopkins say is the only remedy available to the agency side?

    '
  answer: 'He describes it as near-inevitable and in stages. At the start the advertising does nine-tenths
    of the work while the trade-mark owner ventures little or nothing — it is not hard to make a breakfast
    food, a tooth paste, a soap or a cleanser, most advertisers employ others to make them, salesmen can
    aid but little. If the test fails the advertising man is the main loser, having spent his time and
    talent; if it succeeds he takes a commission on the expenditure while the profits go to others, and
    being anonymous he does not even get the credit. Then the business acquires momentum, and a time comes
    when even mediocre advertising will keep it going upward — advertising which, he says pointedly, could
    never have started it. Meanwhile the advertising man clings to the methods he established and fears
    to change, which Hopkins says is in fact usually right, since the best way to win new customers is
    usually the way that won millions. But the work becomes monotonous to the men who read every advertisement,
    and they come to want something new. So the man who builds a big account is pretty sure to lose it
    sooner or later. The only remedy he offers is not defensive: to keep up his volume and his earnings
    he must always be starting new ventures.

    '
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 190-191. The nine-tenths claim, the asymmetry of loss and gain, the momentum stage
    where mediocre advertising suffices, the clinging-and-monotony sequence and the always-starting- new-ventures
    remedy are all stated there. His own career pattern generalised into a dynamic; no cases outside his
    own are cited.

    '
  confounders:
  - reading the boredom as market wear-out; at pp. 117-118 he insists the reader is not tired, only the
    men who read every advertisement are
  - the modern account-management framing in which the fix is deeper client relationships; his stated
    fix is a pipeline of new ventures
  - treating 'even mediocre advertising will keep it going' as a claim that advertising stops mattering;
    his point is that maintaining and starting are different problems
  - assuming this is offered as the great mistake of the title; the mistake is his own decision at p.
    189 to stay an employee rather than start out for himself
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0077
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed p. 197 (Chapter Eighteen, the Edna Wallace Hopper line of twenty-three products)
  question: 'A line''s advertised item cannot recover its acquisition cost, and the finance side wants
    it stopped. Hopkins reports running a business on exactly that footing. What is the structure, what
    figures does he give, and what should be said about their standing as evidence?

    '
  answer: 'The structure is that the first sale is not required to pay. His cosmetic line ran to twenty-three
    products, each a formula attributed to Miss Hopper, and his claim is that a woman who tries one wants
    to try the rest — the converts to Miss Hopper are converts to her line. The figures he gives are an
    average of $1.78 per sale on that line, against 50 cents for a tooth paste, 35 cents for a shaving
    cream and 10 cents for a soap. He then states the point plainly: the profit on what they sell from
    the advertising would never pay its cost, but one thing sells another, and the whole profit comes
    in auxiliaries — which he says is so in many lines. It is the same economics he states as a selection
    rule at pp. 191-192, where he specialised in products bought over and over because the whole profit
    on a one-sale article must be made on that sale. On their standing: these are unaudited figures for
    his own young business, given in the year he wrote the book, by an owner with an interest in the account,
    and he concedes on the same page that some of his new enterprises will fail. They are a description
    of how he set the venture up, not a demonstration that it worked.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: effectiveness
  requires_application: true
  support: 'Printed p. 197 for the twenty-three products, the $1.78 average and the 50/35/10-cent comparisons,
    and for the auxiliaries conclusion; printed pp. 191-192 for the same logic as a selection rule. Self-reported
    figures for his own current business.

    '
  confounders:
  - modern lifetime-value or loss-leader framing, which would want retention and repeat-rate data; he
    offers an average order value and an assertion about cross-buying
  - reading the $1.78 as a measured lift; it is the line's average sale compared with single-product categories,
    not a before-and-after
  - assuming the auxiliaries logic licenses any unprofitable acquisition; at pp. 185-186 he rules out
    whole categories precisely because repeat sales are too far apart
  - treating his ownership of the business as incidental to the claim
  requires_application_canon013: true
  source_status: hold
- qa_id: qa_mla_0078
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 197-198 (Chapter Eighteen, closing pages) with printed p. 189
  question: 'A young practitioner reads Chapter Eighteen and concludes that the book''s advice is to stop
    working for others and own the enterprises you build. Hopkins addresses this directly. What does he
    actually say, and what makes his own case a poor template?

    '
  answer: 'He withdraws the recommendation in the same breath as the account. Having described starting
    his own ventures, he says plainly that this is not, as he well realises, good advice to the majority:
    the average man should work under direction, success depends on many qualities of which he has but
    few, and his own adventure was made only after decades of working in co-operation. He closes by telling
    readers to deduce what suggestion and direction they can, saying he has tried to point out the ways
    to success in advertising, that those ways lead in many directions, and that each must decide what
    is best. What makes his case a poor template is the position he was in when he took it. He was already
    wealthy and famous, with the Pepsodent holding behind him — $13,000 put in, some $200,000 taken in
    dividends, the stock sold for $500,000 — and a career of commissions that reached $185,000 in a year.
    He also states that his failures now cost him a trifle and would have cost the same had he failed
    for someone else, which is a claim available only to someone who can absorb them. And the regret at
    p. 189 is about a refused opportunity at twenty-one, framed by his own account as a shortage of courage
    rather than of equipment.

    '
  answer_type: boundary_condition
  difficulty: medium
  knowledge_type: creative_process
  requires_application: true
  support: 'Printed pp. 197-198 for the explicit withdrawal, the failures-cost-a-trifle remark and the
    closing instruction to each reader; printed p. 193 for the Pepsodent figures; printed p. 168 for the
    $185,000 year; printed p. 189 for the Bissell conversation. Source position, stated by the source
    about its own advice.

    '
  confounders:
  - the modern founder-versus-employee reading, which the book's title invites and which its closing pages
    decline
  - treating the Pepsodent return as evidence that the strategy generalises; it is one holding in a company
    he himself built the advertising for
  - assuming 'my great mistake' names the account-loss dynamic; it names his decision at twenty-one to
    stay employed
  - reading the closing hedge as modesty; it is a stated limit on the applicability of his own example,
    and belongs in the answer
  requires_application_canon013: true
