- qa_id: qa_mla_0080
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 17-18 (Chapter Two, the silver polish sold door to door) with printed pp.
    146-147 (Chapter Thirteen)
  question: 'A client refuses to fund samples on two grounds — they cost too much, and the same people
    will keep asking for them. Hopkins names both objections and answers them. What is his answer, what
    comparison is it built on, and what three conditions elsewhere in the book restrict it?

    '
  answer: 'His answer is that persuasion alone is vastly more expensive: a good article is its own best
    salesman, and selling without samples, in print or in person, is uphill work. The comparison it rests
    on is a childhood one. Selling his mother''s silver polish house to house, he sold about one woman
    in ten by talking the polish at the door, and nearly all of them when he could get into the pantry
    and demonstrate it. He generalises from street fakers, who never tried to sell without showing in
    some dramatic way what the product would do, and says advertisers would not dream of sending a salesman
    out without samples yet spend fortunes urging people to buy without seeing or testing. Three conditions
    elsewhere restrict it. The sample must be earned by some act of interest — promiscuous distribution
    on the doorstep gives the product no prestige and he calls it a very bad plan (pp. 134, 146). It must
    not be charged for: free-sample inquiries may cost about 25 cents each, and asking ten cents can push
    an inquiry past $1.25, so the ten cents recovered can cost a dollar (pp. 146-147). And the free framing
    is not universal — on a hygiene product, featuring it at the top divided results by four (p. 154).
    The one-in-ten figure is a recollection of his own boyhood selling, not a controlled comparison.

    '
  answer_type: application
  difficulty: medium
  knowledge_type: testing_method
  requires_application: true
  support: 'Printed pp. 17-18 for the silver-polish comparison, the two objections he names and the street
    fakers; printed pp. 134 and 146 for the earned-sample condition; printed pp. 146-147 for the cost-of-charging
    figures; printed p. 154 for the category reversal. The pantry comparison is anecdotal; the 25-cent
    and $1.25 figures are among the few he states.

    '
  confounders:
  - the modern free-trial default, which treats sampling as unconditionally good; three of his four conditions
    are restrictions on it
  - reading the one-in-ten versus nearly-all as a measured conversion rate
  - assuming cost is his answer to the cost objection; his answer is that the alternative costs more,
    which he asserts rather than prices
  - confusing the repeaters objection with his own separate warning that a sample given to someone with
    no created interest is wasted regardless of who asks
  requires_application_canon013: true
  source_status: hold
