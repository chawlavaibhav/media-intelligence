- qa_id: qa_mla_0079
  source_id: hopkins-my-life-in-advertising
  source_title: Claude C. Hopkins, My Life in Advertising (Harper & Brothers, 1927)
  source_locator: printed pp. 64-69 (Chapter Six, 'Personal Salesmanship', the Cotosuet calls on New England
    bakers)
  question: 'A product is identical to a cheaper rival, the price premium is essential to profit, and
    the sales force reports the premium cannot be held. Hopkins was sent to prove otherwise. What did
    he actually sell, what is the general form he draws from it, and what did he refuse to claim afterwards?

    '
  answer: 'He did not sell the product. He arrived at the largest bakery with the proof of a street-car
    card picturing an ideal pie, set it up fifty feet away, explained what it had cost and how it was
    printed, and asked the baker — a pie expert — to criticise it, which turned the man from a reluctant
    buyer into an adviser defending his own verdict. Then he offered a card like it for every store selling
    that baker''s pies, carrying a line that only Swift''s Cotosuet was used in the shortening, at 250
    cards per carload ordered. He repeated it down the New England cities, and for a baker who could not
    have the card he offered signs on both sides of two railway cars announcing Mansfield''s pies for
    nine hundred miles. He reports selling more Cotosuet in a week than six salesmen had sold in six weeks,
    with no complaint about price. The general form he draws is that the appeal must consist of a service
    useful to the buyer with the seller''s own advantage covered up — the average salesman''s plea, buy
    mine and not the other fellow''s, is a selfish appeal to selfish people and meets resistance. What
    he refused was to teach it: asked by Mr. Swift to train the other men, he said it cannot be taught,
    and says in 1927 that he is still of that opinion. Two things a reader should hold onto: the week-against-six-weeks
    comparison is his own recollection with no records behind it, and the boxcar sign is precisely the
    vanity advertising — keeping your name before the people — that he condemns everywhere else, which
    he half-concedes on the page.

    '
  answer_type: application
  difficulty: hard
  knowledge_type: persuasion
  requires_application: true
  support: 'Printed pp. 64-69. The pie card and its critique, the 250-cards-per-carload offer, the boxcar
    signs at Springfield, the week-versus-six-weeks claim, the service-not-selfishness formulation and
    the "it cannot be taught" reply are all stated there. Anecdotal, with an outcome claimed and no records.

    '
  confounders:
  - reading it as a co-operative-advertising or point-of-sale programme; on his account the card is the
    whole sale and the shortening goes with it
  - the modern value-add or partnership framing, which would state the mutual benefit openly; Hopkins
    requires his own advantage to be covered up
  - treating the six-salesmen comparison as a controlled result
  - missing that the Mansfield boxcar sign is name-spreading of the kind he calls folly elsewhere, sold
    to a customer who wanted it
  requires_application_canon013: true
