- qa_id: qa_jgb_0001
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 4, section "a 'superhuman' realism", printed pp. 191-193
  question: State the frontal-gaze constraint as this source records it, including what happens when it
    collides with the action being depicted, and separate the constraint from the reason given for it.
  answer: 'The constraint, from the Meerut calendar artist Yogendra Rastogi, is that the figure must look
    out of the frame at the viewer WHATEVER THE FIGURE IS DOING — and his examples are secular as well
    as divine: a woman putting on a slipper for a footwear advertisement, a woman rolling a beedi, a woman
    washing clothes for a soap advertisement, ''she has to look at you''. Where it collides with the action
    he is explicit about which wins: ''that child who is studying, if he''s reading his eyes will be downcast,
    and if his eyes are downcast the calendar will not sell.'' The depicted action loses. The compositional
    consequence Jain reports is an intense emphasis on face and eyes, with the eyes typically painted
    last as part of the finishing strokes. THE REASON IS A SEPARATE THING FROM THE CONSTRAINT and must
    not be absorbed into it: the reason given is devotional — a viewer will say that if the deity is not
    looking at us it cannot bestow benevolence. The constraint is attested by practice across a trade
    and was confirmed by direct inspection of the plates in this pass; the reason is a practitioner''s
    theory of his own customers.'
  answer_type: source_position
  difficulty: medium
  knowledge_type: production
  requires_application: false
  support: '''she has to look at you''; ''if his eyes are downcast the calendar will not sell.'''
  confounders: The tempting compression is 'Indian religious images face the viewer because of darshan'.
    The trade behaviour is well attested; the causal story is testimony, and it is offered about customers
    the informant is not.
  source_status: accepted
- qa_id: qa_jgb_0002
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 4, section 'when color shouts, what does it say?', printed pp. 183-187
  question: This source documents a production convention that outlived the constraint which produced
    it. Describe the convention, the original constraint, and what happened when the constraint lapsed.
  answer: 'The convention is extensive MANUAL colour retouching of separated negatives at the pre-press
    stage — brushing on photo opaque and pink wash, scratching off emulsion, anything from two to twenty
    hours per separation — plus two blue and two red plates in addition to yellow and black, to reach
    maximum saturation, tonal contrast and strong highlights. The original constraint was technical: poor
    filters and insensitive film meant the separations did not reproduce the artwork faithfully without
    intervention. What happened when digital scanning removed that constraint is the finding: the practice
    did not lapse, it MIGRATED INTO SOFTWARE and continued. Jain states what it is doing now instead:
    ''retouching is not about faithful reproduction but primarily indexes the printers'' perceptions of
    what they think their audience wants.'' The practitioners describe the intended effect themselves
    — Indra Sharma on gaudy, distracting (chatkile bhatkile) colours, ''whether or not your gaze wants
    to go there it still goes''. Direct inspection of fig. 88, which photographs a print beside the original
    painting it was made from, confirms the print is visibly more saturated and higher in contrast.'
  answer_type: mechanism
  difficulty: hard
  knowledge_type: production
  requires_application: false
  support: '''retouching is not about faithful reproduction but primarily indexes the printers'' perceptions
    of what they think their audience wants.'''
  confounders: The interesting fact is not that the colours are saturated but that the step survived the
    disappearance of its justification and acquired a new one. That is a general hazard, and this is a
    fully documented instance of it.
  source_status: accepted
- qa_id: qa_jgb_0003
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 4, printed pp. 193-196; restated with sources in Ch. 7, printed pp. 323-325
  question: What is the injunction against divine musculature, what reason do the practitioners give,
    and what breaks when they try to depict action?
  answer: 'The injunction, attested from several independent practitioners, is that the divine body is
    not rendered with visible anatomy. Indra Sharma: ''Now the body is very strong, but we will not show
    the anatomy. For god''s body, the description is of a gentle, beautiful (sukomal) body. . . . There
    won''t be any muscles, we people avoid muscles.'' Expressions must likewise be tranquil, almost meditative.
    The reason given is doctrinal: divine agency in the Vaishnava schema is a matter of lila, sacred play,
    not of labour — Ram Waeerkar, first illustrator of the Amar Chitra Katha comics, puts it as ''Bhagwan
    Krishna, Prabhu Ram . . . they have succeeded in fighting, but they are not fighters''. What breaks
    is action: attempting to depict bodily agency within these constraints ''render[s] irreconcilable
    the differences between narrative "realism" and sacred textual imperatives'', which is a constraint
    conflict the artists themselves run into and name. Direct inspection of fig. 93 confirms it — Ram
    and Lakshman drawing bows in battle, with half-lidded eyes and unmuscled bodies.'
  answer_type: source_position
  difficulty: medium
  knowledge_type: production
  requires_application: false
  support: '''There won''t be any muscles, we people avoid muscles.'''
  confounders: This is the strongest-attested constraint in the source AND it was breached from the late
    1980s — see qa_jgb_0016. Citing it without the breach misrepresents the source.
  source_status: accepted
- qa_id: qa_jgb_0004
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 1, section 'subject, style, speed, locality', printed pp. 58-61
  question: What are the regional iconographic codes described here, and what role do they play in whether
    an image is accepted?
  answer: 'They are a well-defined regional iconography — reported consistently by artists, printers,
    distributors and clients — operating not only at the level of which deities are favoured but at the
    level of their attributes and formal treatment. Jain''s enumerated examples: Lakshmi and Shiva preferred
    standing in the north and seated in the south; the eyes of Shiva and Hanuman wide open in the south
    and often half-closed in the north; Ganesh''s ears and trunk longer in the north, his face paler in
    Bengal; Lakshmi accompanied by an owl in Bengal and nowhere else; Radha often portrayed with her garments
    askew in the north, while in Bengal all goddesses are covered to the point that even their ears are
    hidden. Their role is that they are THE MAIN GROUND OF REJECTION: artists develop a thorough knowledge
    of the codes because accuracy in following them is a particularly stringent requirement, and getting
    one wrong is what gets a design turned back. Note the direction of the reported evidence, which the
    source is clear about: the codes are reported by the trade as things it must satisfy, and the acceptance
    behaviour is the trade''s.'
  answer_type: source_position
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: accuracy in following the regional codes is 'a particularly stringent' requirement
  confounders: The enumerated list looks like a code that could be turned into a checkable specification.
    Jain reports illustrative examples from informants, not a complete or dated code, and reports no survey
    of prints against it.
  source_status: accepted
- qa_id: qa_jgb_0005
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 1, printed pp. 31-76; restated in the Conclusion, printed pp. 362-365
  question: What does 'vernacularizing capitalism' claim, and what is the evidence that it is two-way
    rather than one-way?
  answer: 'It claims that the spread of centralised commodity manufacture into vernacular constituencies
    runs in BOTH directions: the incorporation of those constituencies into a regnant capitalist order
    on one side, and the protean adaptation of capital''s own workings to varying local circumstances
    on the other, producing multiple cultures of capitalism rather than one. The evidence is the calendar
    industry''s own mechanics, observed first-hand: a centralised offset economy of scale in Sivakasi
    combined with LOCAL LETTERPRESS OVERPRINTING for personalisation, mobile self-employed agents, home-based
    artists, and annually refreshed catalogue ''files'' segmented by religion and region. That mixture
    is the argument — a purely one-way account would predict the centralised process displacing the local
    one, and here the two are structurally interlocked, with the cheap local step being what makes the
    centralised product saleable in each place. Jain states the consequence against the cultural-imperialism
    thesis directly: ''the industry has thrived on the commodification of cultural difference.'''
  answer_type: concept_understanding
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: '''the industry has thrived on the commodification of cultural difference'''
  confounders: The claim is about a mechanism observed in one industry over roughly a decade. It is not
    measured, and the source offers no comparison with an industry where the prediction failed.
  source_status: accepted
- qa_id: qa_jgb_0006
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 1, printed pp. 53-55
  question: Why does this source say the calendar catalogues are not evidence of what consumers want?
    Reconstruct the layers.
  answer: 'Because the purchaser is not the viewer, and the source is precise about how many parties sit
    between them. Sivakasi calendars are mostly advertisements given out free rather than commodities
    bought by end-users, so ''the calendar files are not direct indices of market demand but represent
    several layers of second-guessing and self-projection''. The layers: the files index what PUBLISHERS
    think will interest their CLIENTS — the people responsible for a firm''s publicity; which in turn
    indexes not just what those clients think will please their own customers, but also HOW THOSE CLIENTS
    WANT THEMSELVES TO BE SEEN. Jain adds what that makes the artefact: ''if a calendar is primarily a
    commodity from the point of view of the publishers, from the point of view of their clients it is
    primarily the formal expression — and the vehicle — of a relationship.'' The general form is that
    a demand signal read at the wrong end of a gifting chain measures the giver''s self-presentation,
    not the recipient''s preference, and every additional party adds a layer of projection.'
  answer_type: mechanism
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: '''the calendar files are not direct indices of market demand but represent several layers
    of second-guessing and self-projection.'''
  confounders: The catalogues are the most quantitative-looking evidence in the industry — dated, segmented,
    annually refreshed — which is exactly why the layering matters. Their form invites the misreading.
  source_status: accepted
- qa_id: qa_jgb_0007
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 1, printed pp. 55-57; Ch. 4, section 'the reincarnation of the author', printed
    pp. 204-213
  question: How do buyers in this market select, and what production constraint does that create?
  answer: 'By SUBJECT, not by author. ''Clients, and their customers in turn, are primarily interested
    in the "subject" of a calendar and are unconcerned about other issues of provenance''; artists'' names
    ''almost never register in conversations between publishers and their clients'', and most end-users
    could not name any calendar artist beyond Ravi Varma. Jain quotes an Old Delhi pharmaceuticals trader:
    ''I have no relation with the artist, I have a relation with the picture.'' The constraint this creates
    is a novelty-within-sameness squeeze. Customers often want a picture of the same deity year after
    year, so artists and printers must supply a constant stream of ''new'' designs on the ''same'' subjects
    — while iconographic recognisability limits what may change. A Sivakasi printer states the resulting
    envelope: ''mythological means gods. In that we cannot change anything. Only colors we can change,
    dress we can change.'' So variation is pushed into whichever attributes are not recognition-bearing,
    which is a general consequence of the selection rule rather than a fact about deities.'
  answer_type: mechanism
  difficulty: medium
  knowledge_type: production
  requires_application: false
  support: '''I have no relation with the artist, I have a relation with the picture.'''
  confounders: Read as a fact about religious images, this misses the structure. The same squeeze arises
    wherever selection is by subject and recognition constrains the form.
  source_status: accepted
- qa_id: qa_jgb_0008
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 3, printed pp. 134-142; Ch. 4, printed pp. 190-199
  question: What is the distinction between naturalist techniques and the schemata that carried them,
    and what did Indian practice take up?
  answer: 'The techniques are perspective, anatomy, modelling and the rendering of light and shadow. The
    schemata are the institutionally sanctioned ''post-sacred'' systems of signification through which
    those techniques entered the colonial context: romanticism and the picturesque, neoclassicism, bourgeois
    realism, ethnographic documentation. Jain reports Geeta Kapur''s observation, and builds on it, that
    realism was construed in nineteenth-century Indian discourse ''to mean an ENABLING TECHNIQUE rather
    than a philosophically accredited style of representation within a specific historical context''.
    THE TECHNIQUES WERE TAKEN UP AND THE SCHEMATA LARGELY WERE NOT. She records the vernacular word some
    artists used instead of the English ''realism'' — sajivta, ''livingness'' or ''lifelikeness'' — and
    what it puts at issue: ''at issue here is not the reality of the gods, but how alive they are''. So
    naturalist rendering here is in the service of presence rather than of documentary truth, which is
    why a picture can be highly modelled and make no claim to have depicted an event.'
  answer_type: concept_understanding
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: realism as 'an enabling technique rather than a philosophically accredited style of representation'
  confounders: The assumption that naturalist technique brings a realist truth-claim with it is exactly
    what this passage denies, and it is a common way of misreading images that borrow a technique across
    traditions.
  source_status: accepted
- qa_id: qa_jgb_0009
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 4, section 'distinction as rhetorical performance', printed pp. 176-183
  question: This source finds a gap between what its informants said about their audience and what they
    did. Describe the gap, and describe what the author does with it — which is the methodologically interesting
    part.
  answer: 'The gap: artists, publishers and printers routinely described the consumers of calendar art
    as ''ordinary people'', ''the masses'', ''villagers'', ''the labor class'', ascribing to them unrefined
    taste and religious credulity — while, as Jain observes, ''my interviewees were more often than not
    sitting under the benign gaze of a printed deity, usually of the very type they were denigrating'',
    and most had similar images in a shrine at home. She also records countervailing testimony from the
    one secular artist in her sample, Ram Kumar Sharma: ''The picture of Ramchandraji will be up in the
    home of a man of a modern progressive mind, and in that of a mythological man as well.'' WHAT SHE
    DOES WITH IT IS THE POINT: she does not discard the testimony as unreliable, and she does not accept
    it as a description of the audience. She treats the DISCREPANCY ITSELF as the finding, reading the
    high-low distinction as deployed at a primarily rhetorical level, as a means of performing solidarity
    between educated interlocutors. Her method is stated in advance — she attends deliberately to rhetorical
    disavowals or inconsistencies between informants'' discourse and their practices — so a finding is
    derived from the gap between what people say and what they do.'
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: '''my interviewees were more often than not sitting under the benign gaze of a printed deity,
    usually of the very type they were denigrating'''
  confounders: The naive handling is to average the testimony or to pick the more credible informant.
    Both discard the signal, which is in the inconsistency.
  source_status: accepted
- qa_id: qa_jgb_0010
  source_id: jain_gods_in_the_bazaar
  source_locator: Introduction, printed pp. 7-13
  question: What does this source say is wrong with judging an image only as true-or-false or good-or-bad,
    and what does it propose instead?
  answer: 'That the frame is juridical and forensic — treating an image either as evidence (true or false,
    real or fake) or as a perpetrator (good or bad, objectifying or empowering) — and that it is systematically
    blind to other forms of power an image has. Jain names the cost sharply and it cuts against her own
    political sympathies: ''the more explicitly politically invested the critical analysis of an image,
    the likelier it is to resort to the representational realism that has come to us epistemically and
    institutionally bundled with the modern discourse of justice ... As a result, the less likely it is
    to be able to engage — to apprehend or to counteract — the other forms of power available to the image.''
    Her alternative is to treat images ''as much objects as they are signs'', attending to their efficacy
    as circulating things: as icons, commodities, gifts and items of ritual exchange. THE GENERAL SHAPE
    IS A CLAIM ABOUT FRAMES: a frame that asks only whether an image is adequate to a truth cannot see
    properties residing in how it moves and what it is used for.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: images should be treated 'as much objects as they are signs'
  confounders: This is an argued theoretical position, not a finding, and it is bound to nothing operational
    in the Canon record. It is retained because the frame-blindness point is general, not because the
    book demonstrates it.
  source_status: accepted
- qa_id: qa_jgb_0011
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 6, printed pp. 291-295
  question: What is 'meta-popularity' as used here, why is the operation described as triangular, and
    what does the same mechanism make an image vulnerable to?
  answer: 'Meta-popularity is ''the popularity of popularity'': after a point it is not an iconic figure''s
    attributes that matter but the very fact of its popularity, a distinctive logic of appeal that Jain
    derives from Michael Warner on publics and René Girard on mimetic desire. It is triangular because
    the relation is not between viewer and image alone but ''between the image, the viewer, and the viewer''s
    sense of what others see, think, and feel'', so that desire for the icon ''is enhanced, even produced,
    by witnessing — or, crucially, even just imagining — the intensity and desire of others''. The third
    party need not be present or real; an imagined public will do. THE VULNERABILITY IS THE SAME MECHANISM
    RUN BACKWARD: because presentation before the public gaze is what renders an image valuable and powerful,
    ''by the same token it also renders them vulnerable to disinvestment'', which is why desecration becomes
    a site of violence. Value that is constituted publicly can be destroyed publicly, and by the same
    route.'
  answer_type: concept_understanding
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: '''the popularity of popularity, a meta-popularity'''
  confounders: This is argued from theory and illustrated by cases, several involving real political violence.
    Nothing in the source measures it.
  source_status: accepted
- qa_id: qa_jgb_0012
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 7 opening, printed pp. 316-320; restated in the Conclusion, printed pp. 369-371
  question: This source argues that condemning an image can strengthen it. What is the mechanism, and
    what does the author recommend instead?
  answer: 'The mechanism is that speech about an image is performative, not descriptive: ''the very act
    of paying attention to an image and framing it in a particular way is an encounter or actualization
    that changes the character of the image.'' So critique is not a neutral observation of an image''s
    power but an intervention in it, and public condemnation supplies exactly the public attention that
    constitutes the power being condemned — the same machinery as meta-popularity, running through the
    critic. What she recommends instead is that what is required ''is not so much the condemnation or
    censorship of particular kinds of images, which chiefly serves to shore up their power and efficacy,
    but a creative, expropriative reframing within the context of alternative narratives''. She restates
    it in the Conclusion, noting that the forces she opposes ''are strengthened by the secular mistrust
    of all forms of contemporary religiosity''. THIS IS A POSITION, NOT A DEMONSTRATION: no case in the
    book measures the effect of a condemnation, and the record binds nothing to it.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: condemnation 'chiefly serves to shore up their power and efficacy'
  confounders: 'The argument is self-referentially awkward in a way the author accepts: a book about the
    power of these images is itself an intervention in it, and she says so.'
  source_status: accepted
- qa_id: qa_jgb_0013
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 6, printed pp. 292-294
  question: In this account, is iconographic correctness a criterion that makes an image better, or something
    else? Give the distinction and the trade behaviour that follows from it.
  answer: 'Something else, and the distinction is the useful part. Jain reports Richard Davis''s ''aesthetics
    of presence'' — the idea, informing most icon worship in South Asia since the medieval period, that
    the icon is a privileged housing for the divine essence, an embodiment as much as a signifier — and
    states the operational consequence: ''if an icon is not produced in accordance with iconographic prescriptions
    it will not "work" (that is, it will not accrue efficacy, value, and power) — or worse, it will have
    the opposite effect, becoming inauspicious and bringing bad fortune.'' So correctness is an ENABLING
    CONDITION, not a grading criterion: an incorrect icon is held not to be a worse image but a vacant
    one, and the failure mode is not disappointment but inauspiciousness. The trade behaviour follows:
    artists report iconographic accuracy as the main thing changed before a design goes to press, and
    a printer''s reasoning runs the same way — South Indians prefer seated Lakshmis because ''if she sits
    down, wherever you keep the calendar, the god or goddess will stay in that place''. Jain draws out
    the triangulation implied: before the deity can look at the worshipper through an image, it must first
    recognise itself in it and decide to inhabit it. What is established is the TRADE''s behaviour; that
    buyers reject incorrect images is imputed to consumers by printers, at one remove.'
  answer_type: concept_understanding
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: an incorrectly produced icon 'will not "work" ... or worse, it will have the opposite effect,
    becoming inauspicious'
  confounders: 'Most quality vocabulary assumes grading — better and worse on a scale. This is a threshold
    of function, and the two behave differently: you cannot trade a little correctness for a little more
    beauty.'
  source_status: accepted
- qa_id: qa_jgb_0014
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 3, printed pp. 120-132
  question: What does the Woodward's Gripe Water calendar demonstrate, on this reading, and what is the
    general claim it supports?
  answer: 'Jain reads M. V. Dhurandhar''s 1932 calendar as deploying TWO DISTINCT REGISTERS OF SIGNIFICATION
    AT ONCE: a perspectival, narrative, allegorical register aimed at a modernising Indian and European
    resident elite, and an indexical, frontal, iconic register that institutes a divine presence. A single
    image addresses two constituencies that read pictures differently, without either being asked to read
    the other''s way. The general claim it supports is that the deployment of new image-making techniques,
    including technological mass reproduction and elements of Western naturalism, ''helped mass-manufactured
    images to forge an arena of common address across varying social constituencies — that is, to "naturalize"
    an expanded category of the popular''. She states the consequence: ''commodity aesthetics provided
    a ground for reformulations of community and locality'', driven by the opposing expansive and conservative
    imperatives of mass manufacture. This is an art-historical argument about a specific colonial episode,
    read from one image; it is not a general finding about how images address audiences.'
  answer_type: source_position
  difficulty: hard
  knowledge_type: advertising
  requires_application: false
  support: new techniques 'helped mass-manufactured images to forge an arena of common address across
    varying social constituencies'
  confounders: One image, closely read, is the whole evidence for this reading. The reading is careful
    and the evidential base is a single artefact.
  source_status: accepted
- qa_id: qa_jgb_0015
  source_id: jain_gods_in_the_bazaar
  source_locator: Conclusion, printed pp. 356-365
  question: What does this source say changed after economic liberalisation, and why is this the object
    in the record most likely to be out of date?
  answer: 'She describes a double movement: ''one set of processes creates identifiable symbols of cultural
    identity while another lays down the universal ground within which these markers of difference operate.''
    The mechanism she names in the trade is concrete — ''advertising agencies in India — the new Ravi
    Varmas, if you will — often use proprietary analytical models from their parent companies overseas,
    filling in the blanks with content specific to Indian market segments.'' With it comes a narrowing
    of what ''culture'' is taken to mean: circumscribed, globally portable signs of heterogeneity — language,
    dress, food, music, art, rituals, festivals — grafted onto the protocols of a putatively universal
    modernity, which relegates cultural difference to leisure and harnesses it to niche marketing. IT
    IS THE MOST DATED OBJECT IN THE RECORD because it is a characterisation of a media landscape observed
    to roughly 2004-06, drawn largely from one firm''s transformation seen at two points, and it precedes
    the Indian smartphone, cheap mobile data, UPI and streaming entirely — any of which would change the
    picture materially.'
  answer_type: source_position
  difficulty: medium
  knowledge_type: advertising
  requires_application: false
  support: agencies 'use proprietary analytical models from their parent companies overseas, filling in
    the blanks with content specific to Indian market segments'
  confounders: The template-plus-local-content observation is sharp and quotable, which is precisely why
    its date and its narrow evidence base need to travel with it.
  source_status: accepted
- qa_id: qa_jgb_0016
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 7, printed pp. 320-333
  question: 'Describe the documented breach of the muscularity injunction: what shifted, when, what the
    author accepts from another scholar, and where she departs from her.'
  answer: 'What shifted: depictions of Ram moved from soft, smooth-bodied, almost pudgy, smiling, benign
    and tranquil to muscular versions whose mood is predominantly ugra — ''angry, exercised . . . punishing''
    — emphasising his bow and arrows as weapons rather than as iconographic markers. When: from the late
    1980s, in confluence with the Ramjanmabhumi movement. What Jain accepts from Anuradha Kapur is the
    SHIFT ITSELF — that it is real and dateable. Where she departs is the EXPLANATION: Kapur attributes
    it to colonial ''realism'', and Jain argues instead that it was enabled by the one figure for whom
    musculature had long been acceptable — Hanuman, whose muscular body posed no threat to the location
    of agency in Ram because it was framed as that of an animal, a devotee and a servant. She proposes
    Hanuman as the site at which muscularity was naturalised in the bazaar artists'' expressive vocabulary
    and from which it transferred. THE EVIDENTIAL ASYMMETRY IS THE POINT: the shift is well attested and
    accepted from another scholar, while the route is Jain''s own counter-proposal, offered in a chapter
    she introduces as ''an experiment'' whose narrative ''unapologetically index[es] a certain will to
    power''. It is also the object that qualifies qa_jgb_0003: the strongest-attested constraint in the
    book was breached within the period the book covers.'
  answer_type: failure_diagnosis
  difficulty: hard
  knowledge_type: cultural
  requires_application: false
  support: the chapter is introduced as 'an experiment' whose narrative 'unapologetically index[es] a
    certain will to power'
  confounders: Accepting a shift and accepting an explanation of it are separate acts, and the source
    performs them separately. A summary that merges them attributes to Jain a confidence she declines.
  source_status: accepted
- qa_id: qa_jgb_0017
  source_id: jain_gods_in_the_bazaar
  source_locator: Conclusion, printed p. 372
  question: How does this book end on the question of image power, and how does the author immediately
    qualify it?
  answer: 'With an explicit denial of the position her subject matter invites: ''Images are not powerful
    in and of themselves. It is we — iconolaters and iconoclasts, devotees and secularists alike — who
    make them powerful through what we do with them and what we say about them.'' The qualification follows
    in the same breath and matters as much: because this power unfolds in a trans-subjective arena, ''it
    is not fully controllable by individual subjects, whether at the point of "production" or of "reception"''.
    So the power is neither in the artefact nor at anyone''s disposal. That closes off two convenient
    readings at once — that a well-made image carries force in itself, and that whoever makes or frames
    it can direct that force. A book documenting production constraints for images held to house a divine
    presence ends by locating their efficacy in circulation and in speech about them, and denying that
    any single party controls it.'
  answer_type: source_position
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: '''Images are not powerful in and of themselves.'''
  confounders: Quoting the first sentence without the qualification produces a straightforwardly voluntarist
    reading — make them powerful by talking about them — which the second sentence denies.
  source_status: accepted
- qa_id: qa_jgb_0018
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 4, printed p. 174
  question: What does the author say her interview evidence is, and what does that statement bound?
  answer: 'She states it at the head of the chapter that rests most heavily on interviews: ''As with all
    such ethnographic materials, the status of the accounts emerging from my interviews is not so much
    that of transparent, consistent truths but of narratives, produced largely for my benefit, about things
    that people might not otherwise talk about, or even pay attention to, in the way that I was calling
    upon them to do. Accordingly, these accounts and their production are subject to reading, interpretation,
    and analysis as with any "text".'' She adds that she attends deliberately to rhetorical disavowals
    or inconsistencies between informants'' discourse and their practices. WHAT IT BOUNDS IS EVERYTHING
    IN THIS SOURCE THAT COMES FROM AN INFORMANT — which is most of the production constraints, all of
    the reasons given for them, and every claim about what buyers want. The constraints themselves are
    corroborated by the artefacts, so they survive the bound; the REASONS do not, because a reason offered
    in an interview is exactly the kind of narrative she is describing. This is the most load-bearing
    object in the record and it is grouped with the objects that depend on it so it cannot be retrieved
    separately from them.'
  answer_type: source_position
  difficulty: medium
  knowledge_type: cultural
  requires_application: false
  support: the accounts are 'narratives, produced largely for my benefit'
  confounders: It is a statement about the author's own evidence, made by the author, in the chapter it
    most affects. Skipping it and quoting the interviews as fact reverses her explicit instruction.
  source_status: accepted
- qa_id: qa_jgb_0019
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 4, printed pp. 183-187; Ch. 1, printed pp. 53-55
  question: A team maintains a production step nobody can justify beyond 'we've always done it'. What
    does this source's retouching case actually license you to conclude, and what would you still have
    to establish?
  answer: 'It licenses a hypothesis and a diagnostic sequence, not a conclusion. The documented case is
    exact: manual colour retouching began because poor filters and insensitive film made separations unfaithful,
    digital scanning removed that constraint, and the practice continued into software with a new justification
    attached — ''retouching is not about faithful reproduction but primarily indexes the printers'' perceptions
    of what they think their audience wants''. The transferable move is therefore to ask THE TWO QUESTIONS
    SEPARATELY: what constraint did this step originally answer, and does that constraint still obtain?
    A step whose original constraint has lapsed is not thereby useless — Jain''s printers were not doing
    nothing, they had acquired a second purpose — but it is now doing something other than what it is
    described as doing, and nobody has checked whether it does that well. What you would still have to
    establish is the part the source cannot give you: whether the NEW purpose is real and whether it is
    achieved. Jain establishes that the printers believe the saturation serves their audience; she establishes
    nothing about whether it does, because nothing in the book measures any audience. So the case supports
    investigating the step, and does not support either keeping it or removing it.'
  answer_type: application
  difficulty: hard
  knowledge_type: production
  requires_application: true
  support: '''retouching is not about faithful reproduction but primarily indexes the printers'' perceptions
    of what they think their audience wants.'''
  confounders: The neat lesson — 'kill steps whose justification has lapsed' — is not what the case shows.
    The step acquired a second life, and the source's finding is that nobody tested it.
  source_status: accepted
- qa_id: qa_jgb_0020
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 1, printed pp. 53-55
  question: A team ranks image styles by what a corporate-gifting catalogue sold most of last year, and
    proposes to generate future images in the winning styles. Using this source, say what that ranking
    measures.
  answer: 'It measures the buyers'' self-presentation to their recipients, filtered through the catalogue
    publisher''s guess about the buyers — and it measures the eventual viewer''s preference not at all.
    Jain''s calendar file is exactly this structure: because the calendars are advertisements given out
    free rather than commodities bought by end-users, the files ''are not direct indices of market demand
    but represent several layers of second-guessing and self-projection''. Unpacked for the gifting case:
    the catalogue''s contents index what the publisher thinks will interest the purchasing firm; the purchase
    indexes not only what the firm thinks its recipients will like but HOW THE FIRM WANTS TO BE SEEN;
    and the recipient''s response is never recorded anywhere in the chain. Jain''s formulation applies
    directly — from the buyer''s point of view the object is ''the formal expression — and the vehicle
    — of a relationship''. So the ranking is a real signal about a real thing and is mislabelled: optimising
    against it optimises corporate self-image. What the source does NOT give you is a correction. It supplies
    no method for recovering recipient preference, and its own investigation of what viewers do with these
    images is explicitly bounded by the author''s statement about her interview evidence. Naming what
    the signal measures is the whole of what transfers.'
  answer_type: application
  difficulty: hard
  knowledge_type: advertising
  requires_application: true
  support: the files 'represent several layers of second-guessing and self-projection'
  confounders: The data can be perfectly accurate and still answer a different question. Sales rankings
    in a gifting chain are the clean case, and they look like demand data in every respect except what
    they measure.
  source_status: accepted
- qa_id: qa_jgb_0021
  source_id: jain_gods_in_the_bazaar
  source_locator: Ch. 6, printed pp. 292-294; Ch. 4, printed pp. 191-196
  question: A generative system is asked to produce devotional images for the Indian market and is trained
    mostly on general naturalist photography. Which constraints in this source would it violate by default,
    which of them can actually be checked, and what should not be built from this material?
  answer: 'Three would be violated by default, because naturalist priors run against each. The frontal
    gaze: a naturalist prior renders a figure attending to whatever it is doing, and the trade constraint
    is that the figure looks out at the viewer regardless — ''if his eyes are downcast the calendar will
    not sell''. The unmuscled divine body: a naturalist prior renders a figure drawing a bow with visible
    anatomy, and the constraint is ''there won''t be any muscles, we people avoid muscles''. And saturation:
    a naturalist prior reproduces the reference faithfully, where the trade adds saturation deliberately.
    Both of the first two were confirmed by direct inspection of the plates in this pass, so they are
    not merely reported. WHAT CAN BE CHECKED is limited: whether a face is turned out and whether a body
    is modelled are inspectable properties of an output, so a human reviewer can apply them. Regional
    attribute codes are a harder case — Jain gives illustrative examples from informants, not a complete
    or dated code, and reports no survey of prints against it, so it is not a specification. WHAT SHOULD
    NOT BE BUILT is a scored conformity metric. Jain warns that these are ''primarily discursive categories,
    part of the bazaar''s self-understanding'' rather than observed regularities of the artefacts; her
    code is illustrative and undated; and the muscularity injunction was breached from the late 1980s,
    so a metric built on it would penalise images the tradition itself now contains. There is also no
    numeric form of any of this in the source: no angle, no tolerance, no test.'
  answer_type: application
  difficulty: hard
  knowledge_type: production
  requires_application: true
  support: '''There won''t be any muscles, we people avoid muscles.'''
  confounders: The constraints are unusually crisp for a cultural source, which makes them feel specifiable.
    Crispness of statement is not the same as having a threshold, and the source supplies none.
  source_status: accepted
