# STATUS: PROPOSED — Canon-stream worker output; no Controller decision adopts it;
# coordination/CONTROL-STATE.md governs.
#
# PROPOSED-domain-vocabulary-v1 — controlled two-axis vocabulary for
# scope.domain_discussed_by_source, plus a mechanical label->term mapping and a review queue.
#
# Problem (GAP-13 / CD-domain-label-chaos): the field is free text — 1,335 mentions across the
# accepted corpus resolve to 331 unique labels, 197 of them singletons (59.5%). Free text cannot
# drive pack routing or coverage counting. This file replaces it with a closed 22-term enum
# (11 medium + 11 subject) and maps every accepted label to terms or, when a label is a homonym,
# a method, or out of scope, into an explicit review queue. No label is silently dropped.
#
# This is a mapping layer over committed extractions, not a rewrite of them.
# Validate: python3 canon/validation/validate_domain_vocabulary.py
domain_vocabulary_version: v1
status: PROPOSED
census:
  field: scope.domain_discussed_by_source
  corpus: canon/knowledge/current/*/source-knowledge.yaml (accepted sources only)
  accepted:
    mentions: 1335
    unique_labels: 331
    singletons: 197
  full_corpus_including_hold_informational_only:
    mentions: 3305
    unique_labels: 711
    singletons: 398
    note: Reported for scale only. HOLD material (canon/candidates/) is NOT mapped here and must never
      be consumed via this file; its labels enter the mapping only if the Controller admits the source.
    recompute: python3 -c "import yaml,glob,collections; c=collections.Counter(); [c.update(dm for o in
      yaml.safe_load(open(f))['source_knowledge'] for dm in (o.get('scope') or {}).get('domain_discussed_by_source')
      or []) for f in glob.glob('canon/knowledge/current/*/source-knowledge.yaml')+glob.glob('canon/candidates/*/*/source-knowledge.yaml')];
      print(sum(c.values()), len(c), sum(1 for v in c.values() if v==1))"
  recompute: 'python3 -c "import yaml,glob,collections; c=collections.Counter(); [c.update(dm for o in
    yaml.safe_load(open(f))[''source_knowledge''] for dm in (o.get(''scope'') or {}).get(''domain_discussed_by_source'')
    or []) for f in glob.glob(''canon/knowledge/current/*/source-knowledge.yaml'')]; print(sum(c.values()),
    len(c), sum(1 for v in c.values() if v==1))"  # expect 1335 331 197'
coverage:
  mapped_labels: 295
  mapped_mentions: 1283
  mapped_mention_share: 0.961
  review_queue_labels: 36
  review_queue_mentions: 52
  note: 'Every one of the 331 accepted labels appears exactly once: in `mapping` or in `review_queue`.
    No silent drops. All four figures above are recomputed, not trusted, by canon/validation/validate_domain_vocabulary.py.'
vocabulary:
  axes:
  - medium
  - subject
  closed_enum: true
  medium:
  - term: m_moving_image_editing
    definition: 'assembly of moving images after capture: cutting, pacing, transitions, sound editing
      and mixing, grading'
  - term: m_moving_image_production
    definition: 'making moving images before and at capture: directing, staging, casting, sets, costume,
      production craft of film/TV/ad film'
  - term: m_cinematography_lighting
    definition: 'camera and lighting craft: exposure, angles, movement, lighting setups and equipment'
  - term: m_photography
    definition: still photography in all genres
  - term: m_graphic_print_design
    definition: 'page-bound graphic design: editorial, publication, book, identity, packaging, illustration,
      print production'
  - term: m_typography
    definition: type design and typesetting as a distinct craft
  - term: m_colour
    definition: colour theory, study and use as a distinct craft
  - term: m_web_interactive
    definition: web, interaction and screen-interface design
  - term: m_outdoor_print_media
    definition: posters, outdoor, signage and display print media
  - term: m_fine_art
    definition: 'art practice and art objects: painting, sculpture, bazaar/calendar art as imagery'
  - term: m_short_form_feed_video
    definition: feed-native short-form video (6-60s, usually vertical, platform-distributed)
    reserved: true
    rationale: 'Zero accepted labels map here and that is the point: no accepted source discusses feed-native
      short-form video. The newest accepted moving-image source is 2011 (kenworthy; grammar-of-the-edit
      2009, murch 2001, ondaatje 2002 per their PROVENANCE.md), and the only feed-native source in the
      corpus, google-abcd-video-ads, is HOLD (canon/candidates/) and therefore not mappable. The term
      is kept in the closed enum so coverage tooling reports the hole explicitly instead of absorbing
      feed-video demand into film-era terms. It becomes populatable only by Controller admission of a
      feed-native source.'
  subject:
  - term: s_advertising_craft
    definition: 'how advertisements are made: copy, campaigns, endorsement, selling technique'
  - term: s_advertising_effectiveness
    definition: 'whether and why advertising works: measurement, pre-testing, response evidence'
  - term: s_marketing_strategy
    definition: markets, segmentation, pricing, branding, forecasting, go-to-market
  - term: s_india_market_culture
    definition: Indian market, consumers, visual culture, cinema culture and their history
  - term: s_narrative_storytelling
    definition: story, character, genre, screenwriting
  - term: s_persuasion_psychology
    definition: why people attend, believe, decide and change behaviour
  - term: s_creative_practice_process
    definition: 'how creative work gets made and learned: practice, craft learning, critique'
  - term: s_org_management
    definition: creative organisations, agencies, management, meetings
  - term: s_regulation_compliance
    definition: clearance, regulation, industry ethics
  - term: s_composition_attention
    definition: composition, visual attention and perception in the frame
  - term: s_category_specific
    definition: product-category-specific conventions (dairy, fmcg, footwear, ...)
rules:
  axis_rule: A label maps to at most one medium term and at most one subject term (one, the other, or
    one of each). Never two terms on the same axis.
  future_extraction_rule: New extractions populate scope.domain_discussed_by_source from this closed vocabulary.
    When no term fits, the extractor keeps a free-text label AND appends it to this file's review_queue
    with count and source dir (escape hatch); the free-text label is data, not a new term. The enum itself
    grows only by Controller decision.
  consumption_note: 'This mapping is an input to pack/coverage tooling (e.g. the live-coverage generators
    in canon/planning/). It is a mapping layer: committed extraction files in canon/knowledge/current/
    are not rewritten and remain byte-identical.'
