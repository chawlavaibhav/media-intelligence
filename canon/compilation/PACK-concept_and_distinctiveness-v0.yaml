  craft; ctg/hea/sut = word-of-mouth/communication research. Nothing treats 9:16 feeds, sound-off autoplay
  or sub-10 s ads: CD-D9''s short-form rules are untested transfers; CD-D5, D9, D10 need a timeline (D10
  sound) — for a static image nothing here replaces them.

  - India: only Dwyer/Patel (Hindi cinema to 2002, posters mainly pre-1990) and Pandey (2015) are Indian;
  category conventions, festival ideas, regional-language humour, Hinglish, the Indian buyer''s emotional
