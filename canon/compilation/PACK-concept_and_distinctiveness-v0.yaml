  CHECK: One named person, one specific figure or sensory fact; no superlative, no exclamation mark; hailing
  word opens.


  CD-D7 [ASSERTED-hedged|DATED|CULTURE-BOUND|MULTI-ORIGIN(5)]

  Q: What should the audience feel; which register; humour?

  DEFAULT: Feeling first: what they remember is how they felt (murch_0020); to care is to feel (hea_mts_0015);
  the effective emotion is often not the obvious one (0017). Emotion sells as well as reason, most where
  nothing is unique — add a rational excuse (ogx_0036). Register = product × audience: interesting first,
  funny an accent, no slapstick on a hospital (whip_0058); humour can now sell but only the very few write
  funny — else don''t (ogx_0032); celebrity, cartoon-for-adults, vignette parade below average (0038),
  a celebrity never the only memorable thing (ppm_0031). Respect; delight, never intimidate (ppm_0001).

  CHECK: One target feeling and its rational excuse; register fits product and audience; humour only under
  a brief clause.


  CD-D8 [ASSERTED-hedged|QUALIFIED|DATED|FIGURE-UNVERIFIED|SINGLE-ORIGIN]

  Q: Too obvious or too weird — how long is the fuse?

  DEFAULT: Sit where clear and clever overlap; ''seen it before'' and ''don''t get it'' mark the edges
  (whip_0005). Write it flat, then spin (0006). Wit makes the viewer travel 5–40%; the completion is what
  sticks (0007), but the quick get outranks creativity (0001) and dwell time sets the fuse: two seconds,
  then ask what it said (0060). Exaggeration is everyone''s first reach — use it knowingly, only on a
  truth (0031); puns and rhymes arrive first; throw them away (0029).

  CHECK: A stranger gets it in one viewing; flat statement beside the spun one; exaggeration names its
  truth; no pun, no rhyme.


  CD-D9 [ASSERTED-our_reading-hedged|CONTESTED|QUALIFIED|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(5)]

  Q: What is left out; how does the idea survive 15–30 s?

  DEFAULT: Grunt test: offer, benefit, action in five seconds (sb_0015). Each added element weakens the
  rest; remove each, keep only the load-bearing (whip_0003, 0002). Most with the least; past a point,
  detail makes spectators (murch_0015, 0016). Keep all six cut criteria where possible (0031); else give
  up from the bottom — never emotion before story, story before rhythm (0027, 0019; emotion outweighs
  the rest, weights hedged, 0029). Every device motivated, stillness chosen, method unnoticed (ms_0002,
  0018); staging alone can direct attention (0017); combine techniques, never two competing cues (0008,
  0019); strength by contrast, not impact (vig_0009).

  CHECK: Every element passes the removal test; one cue per beat; grunt answers in five seconds; emotion
  and story survive the cut.


  CD-D10 [ASSERTED-hedged|QUALIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(2)]

  Q: What does sound do for the idea?

  DEFAULT: Music seems to work best channelling an emotion the film has already made, not supplying one
  (conv_0007); music from inside the scene reads as accident, not commentary (0009), and wears out with
  overuse (0011). Opening music promising a register the film does not keep is a fault however good (0023).
  Withdraw dialogue and sound reads as speech (0019). Actors on camera over voice-over; supers = spoken
  words; music no measurable good, effects can help, jingles below average (ogx_0042).

  CHECK: Emotion made before music enters; opening sound matches the register; supers = speech; no jingle
  carries the message.


  PRE-ARBITRATED CONFLICTS (the rule already decides; do not re-arbitrate):

  CF-01 ogx_0040 vs ogx_0039: Surprise in frame one (0040); name within ten seconds, end on the pack (0039).

  CF-02 whip_0005 vs whip_0001: Say it straight first; keep the spin only while a stranger gets it in
  one viewing (0001; bound by medium, 0060).

  CF-03 whip_0007 vs whip_0001: Travel of 5–40% only inside the medium''s dwell time (0060); a scroll
  before the get = fuse too long.

  CF-04 whip_0013 vs sa8_0042: The conflict is the product''s absence (0013), never the buyer''s own defect
  or a named rival (0042).

  CF-05 ctg_0013 vs ctg_0021: Remarkability buys attention and immediate talk (0013), not action; for
  a behaviour objective tie the idea to a cue at the buying moment (0021).


