  Recognising a star is bounded to viewers inside the culture (dpci_0090, no measurement).

  CHECK: Target India named by two or more variables; each non-Indian-source default applied is listed
  with why it holds here or marked culture-untested; the product does not replace a tradition unless a
  brief clause says so.

  LIMIT: jgb_0040 codes are deity attributes for prints; no contributor gives regional codes for products
  or people.


  IN-D3 [ASSERTED-our_reading-hedged|QUALIFIED|DATED|CULTURE-BOUND|FIGURE-UNVERIFIED|MULTI-ORIGIN(3)]

  Q: Which visual register do Indian viewers read — dress, props, setting, festival?

  DEFAULT: State each code''s meaning on the board. Sari grammar by occasion, season, formality, with
  a colour code — red, green, yellow festive; white or pale for widows; black largely Western — and its
  cinematic use: sari as chastity, sober saris on mothers, Western clothes on the unmarried heroine with
  no negative charge by the 1990s (dpci_0070, Hindi cinema to 2002, ''almost invariably'', no counts).
  Character types — good/bad, rich/poor, traditional/modern — are a code the audience holds, ''not universally
  recognized'', unmarked by clothing after about 1990 (dpci_0120). Props carry period and class — tonga
  rural/historical, train modernity, bicycle youth, car wealth, auto and taxi the middle and working city
  — two entries dated by decade: period-bound description, not a rule (dpci_0040). In the melodramatic
  mode, setting and costume externalise feeling — ''glamorous realism'' (dpci_0030; not all Hindi cinema).
  Attested vernacular setting: an unstyled, unaspirationally lit small-town street (nnn_0019). Festival:
  chocolate entered the Diwali sweets exchange only when packed in the traditional clay lamps, not via
  Indian motifs in ads (rbwl_0120, undated). The source''s expiry notice governs the three cinema codes:
  their ''filmi'' style is ''a thing of the past'' by 2002 (dpci_0190) — deliberate period codes, never
  the current default.

  CHECK: Each garment, prop and setting has its stated code and date range; filmi-era codes marked ''period,
  deliberate''; a festival execution names the practice joined, not just the motif.


  IN-D4 [REASONED-hedged|QUALIFIED|DATED|CULTURE-BOUND|FIGURE-UNVERIFIED|MULTI-ORIGIN(2)]

  Q: Does the figure look out at the viewer — frontal address or gaze-follows-action?

  DEFAULT: Where an image is bought for a two-way look, the calendar trade''s constraint is that the figure
  looks out at the viewer whatever the action — a woman putting on a slipper, washing clothes, ''she has
  to look at you''; eyes painted last; the reason given is devotional, from one artist, marked by Jain
  as partly discursive (jgb_0010, calendar art 1994–2001), resting on iconographic correctness as the
  condition on which an image works at all (jgb_0130, trade belief, no consumer study). Frontality and
  the tableau are a reading category built on early and 1950s film, not a production instruction (dpci_0020);
  darshan is accepted by Dwyer only inside the film, to produce the star (dpci_0010, contested). Decide
  address per shot; do not default a product ad to frontal on this corpus.

  CHECK: Per hero figure: frontal-to-viewer or gaze-follows-action, with the reason; a devotional or calendar-register
  execution is frontal with eyes finished.


  IN-D5 [ASSERTED-hedged|DATED|CULTURE-BOUND|MULTI-ORIGIN(2)]

  Q: Celebrity — cast one, and if so how?

  DEFAULT: If a celebrity is cast, the viewer must find celebrity, script and idea all memorable, not
  the celebrity alone (ppm_0031, stated, untested). Once celebrity use became near-universal a star declaring
  use ceased to differentiate; the reported move is the star cast as a character in a story (nnn_0041,
  author-selected examples, 2000s). Instrument effect: celebrities raise pre-test scores and the pre-test
  is the gate — a reason to cast independent of whether the ad works (nnn_0040; silent on whether celebrities
  work). A 2002 agency-owned study says ''aura'' dominates fit; youth brands take current heartthrobs,
  serious categories maturity (nnn_0042; no sample, method or effect size). Author''s own likelihood:
  celebrity now does the bazaar totem''s job — imagery borrowed to introduce products the buyer had no
  frame for (nnn_0043, second-hand). CC-D7 (Ogilvy, US 1983) rates the celebrity below average — other
  market, other era.

  CHECK: If a celebrity appears: script and idea memorable without them; the star plays a named character,
  not ''I use X'', unless a brief clause asks; a pre-test motive is recorded.


  IN-D6 [ASSERTED-hedged|DATED|CULTURE-BOUND|SINGLE-ORIGIN]

  Q: Which claim and clearance norms bind an Indian ad?

  DEFAULT: The corpus records institutions, not rules: ASCI (1985, UK model) hears complaints through
  its CCC and orders modification; since a 2007 Cable TV Network Rules amendment an ad it finds objectionable
  cannot air on any cable network (nnn_0012, insider account). The Animal Welfare Board regulates real
  animals on shoots — settle that route before approving an animal script; cinema shorts need a censor
  certificate (nnn_0013). The gori→nikhri substitution is history — the ban changed the word, not the
  proposition — not endorsed (nnn_0011). Plan every claim for an ASCI check outside Canon.

  CHECK: HARD_CONSTRAINT_CHECK lists ''ASCI Code check: outside Canon'' against every claim; a real animal
  names its AWBI route; no euphemism carries a banned meaning.


  PRE-ARBITRATED CONFLICTS (the rule already decides; do not re-arbitrate):

  CF-01 nnn_0041 vs nnn_0042: Which star and how the star appears are separate: 0042 speaks only to which
  (aura, with its category conditions); 0041 to how (as a character). Neither is measured; apply 0041
  to the script whichever star 0042 picks.


  PACK LIMITS:

  - Devanagari correctness criteria do not exist in Canon — never generate Devanagari glyphs; composite
  text deterministically.

  - Coverage delta: LIVE37 critical_limited — five contributors, none a product-advertising manual: rbwl_*
  = market strategy to 2009 (short shelf life by the author''s own word); dpci_* = Hindi cinema and film
  posters to 2002; jgb_* = Sivakasi calendar trade 1994–2001; ppm_* = one practitioner''s credo, 2015;
  nnn_* = an insider''s survey of Indian ad history, 2016. None treats 9:16 feeds, phones, sound-off or
  a post-2016 India; none measures whether any of it sells — every default transfers untested.

  - Uncovered, assume neither way: Hinglish and code-mixing; every non-Hindi language or script; English-versus-regional
  per surface; voice-over language; festival calendar or colour by festival; family, gender and body norms;
  menswear, regional dress, a modern home, food, jewellery; religious-imagery restraint for brands; humour
  by region. A14 (Devanagari & Indic typography) has no contributor.

  - Regulation: ASCI appears only as an institution and its 2007 cable sanction (nnn_0012); the ASCI Code''s
  rules, fairness, celebrity and influencer guidelines, celebrity due diligence, CCPA, MRP display and
  platform policies are not in Canon — check every claim outside Canon. Bijapurkar''s consumer claims,
