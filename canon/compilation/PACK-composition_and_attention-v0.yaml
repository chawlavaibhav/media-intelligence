  Q: Where does the subject sit in frame?

  DEFAULT: Off-centre within one of three approximate zones (fre_001; fre_0017, 0018); centre only when
  the scene points inward (0019); extreme placement needs a visible reason (0021). The source rejects
  coordinate rules (0016, vs its nod to classical proportion, 0028): zones are regions, never grids or
  named ratios.

