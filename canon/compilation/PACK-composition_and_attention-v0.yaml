  or grid line.


  CA-D3 [ASSERTED-hedged|CONTESTED|QUALIFIED|FIGURE-UNVERIFIED|SINGLE-ORIGIN]

  Q: How does the frame hold the subject at its edges?

  DEFAULT: One edge treatment per shot (fre_002): tight fit with a slight deliberate gap (fre_0006); busy
  scene, edges stop mattering (0005); deliberate halving of a symmetrical subject (0007). Straight subject
  edges near frame edges read magnetic (0003); thin any bright framing element (0004).

  CHECK: The edge treatment is one of the three, named; no accidental near-tangency between a subject
  edge and a frame edge.


  CA-D4 [ASSERTED-hedged|QUALIFIED|FIGURE-UNVERIFIED|SINGLE-ORIGIN]

  Q: Use a frame within the frame?

  DEFAULT: No compulsion (fre_0022); when a subject passes behind an opening, the near-universal reaction
  is to shoot the moment it sits cleanly inside, breaking no edges; thin a bright framing element or it
  takes over (0004).

  CHECK: A framing element used is darker or thinner than the subject it frames.


  CA-D5 [ASSERTED-hedged|CONTESTED|QUALIFIED|DATED|FIGURE-UNVERIFIED|SINGLE-ORIGIN]

