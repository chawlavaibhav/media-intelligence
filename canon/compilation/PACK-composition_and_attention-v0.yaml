  Q: What reads first, second, third?

  DEFAULT: One dominant element by contrast — visual power is achieved by contrast, not ''impact'' (vig_0009);
  eyes attract more strongly than probably any other subject (fre_0020); competing cues confuse rather
  than direct (repeated focus-shifting is the type case, ms_0019); complete control of attention is self-defeating
  (murch_0018); misdirection (murch_0033) is the scoped exception, only to set up a reveal.

