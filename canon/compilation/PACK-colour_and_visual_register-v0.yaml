  CHECK: Each text zone reports its ratio at darkest and lightest point: ≥ 4.5:1, or ≥ 3:1 with size and
  weight; no all-caps running line; no thin face.


  CV-D9 [ASSERTED-our_reading-hedged|QUALIFIED|DATED|CULTURE-BOUND|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(2)]

  Q: Indian audience — saturation, regional codes, vernacular register?

  DEFAULT: Saturation as a claim on attention is a documented convention, not a rule: Sivakasi presses
