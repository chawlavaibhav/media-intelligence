  CV-D1 [ASSERTED-hedged|CONTESTED|DATED|MEDIUM-UNTESTED|MULTI-ORIGIN(3)]

  Q: What is the palette; which one element is saturated?

  DEFAULT: One saturated element on a graded-down ground, and it is the product — the hero wherever possible
  (ogl_0014). A contrasting colour finds the product even blurred and distant if one hue is nearly the
  only colour in frame and the link was made in an earlier, closer shot (ms_0016); two competing cues
  confuse (0019). Strength is contrast, never impact — usually vulgarity (vig_0009); primary shapes and
  colours, message over titillation (0011).

  CHECK: Board names the one saturated element and the graded-down ground; nothing else competes; in video
  the colour is tied to the product in a closer shot first.


  CV-D2 [ASSERTED-our_reading-hedged|CONTESTED|QUALIFIED|DATED|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(2)]

  Q: Which one cue moves attention in a moving frame?

  DEFAULT: One cue per beat. Colour directs attention as well as any camera move (ms_0016); a static wide,
  dominant subject facing camera, needs no move (0017); a wanted move hides behind an action (0010). Never
  rack focus between planes — cut to a close-up (0019). Every move and every hold has a reason (0002);
  the camera is the audience''s eye, too much movement covers up (alt_0014); the audience registers the
  product, not the method (ms_0018).

  CHECK: Each beat names its one cue; no focus racking; each move or hold has a reason.


  CV-D3 [ASSERTED-hedged|QUALIFIED|SINGLE-ORIGIN]

  Q: How is any colour judged — alone or against its neighbours?

  DEFAULT: Never alone: a colour is almost never seen unrelated to others (alb_0006); colour is the most
  relative medium (0011). One colour on two grounds reads as two (0012); influence runs on lightness and
  hue at once (0014), some colours influence, others accept (0013), strongest for a small piece on a large
  ground (0015); meaning is in the relations (0007). Very few judge lightness across hues by eye (0018):
  measure.

  CHECK: Colour judged on a composite of the real frame, never a swatch; lightness differences are measured
  luminance.


  CV-D4 [ASSERTED-hedged|QUALIFIED|DATED|FIGURE-UNVERIFIED|MULTI-ORIGIN(4)]

  Q: How is the brand colour specified and verified?

  DEFAULT: By value, on pixels. A colour name yields as many colours as listeners (alb_0001); colour memory
  is poor (0002); nomenclature is inadequate (0003). Supply the exact value; verify it on delivered pixels
  against the actual ground, which shifts it (0012, 0006); a miss is a fix. Supplied mark untouched —
  an established logo is equity, identity is the system (vig_0013, 0011); the same image year after year
  (ogl_0007). Logotype text escapes contrast only under a brand mandate (wcag_0004), never by author choice
  — use the higher-contrast variant (0034).

  CHECK: No brand colour by name alone; delivered brand pixels in context match the value or are corrected;
  mark is the supplied file; logotype under 3:1 is the brand''s own variant.


  CV-D5 [ASSERTED-hedged|CONTESTED|QUALIFIED|DATED|FIGURE-UNVERIFIED|MULTI-ORIGIN(3)]

  Q: How does the product separate from its ground, hue aside?

  DEFAULT: By tone, either direction (alt_0015); the dark-to-light progression (0017) governs only staged
  depth planes. Cold grounds separate warm subjects; warm blends into warm (0003, monochrome film). Colour
  is never the only means of a distinction (wcag_0007); a ≥ 3:1 lightness difference is itself the second
  means unless the hue must be identified (0038). Few judge lightness across hues (alb_0018): measure
  the product edge.

  CHECK: Separation survives grayscale; product edge ≥ 3:1 luminance, or a second non-colour cue (edge,
  shadow, finish) named; depth planes near-dark to far-light.


  CV-D6 [ASSERTED-hedged|QUALIFIED|DATED|FIGURE-UNVERIFIED|SINGLE-ORIGIN]

  Q: What makes the mood — level, or light character and grade?

  DEFAULT: Character. Mood comes from the quality of light — direction, diffusion, shadows — never from
  exposure level (alt_0025); quantity is exposure, quality is orientation, mood, beauty, depth (0013).
  One consistent direction — audiences read light untaught (0026); aim at the viewer''s mental image,
  not literal nature (0027). Level follows the dramatic line: bright for gaiety, lower for sadness, deep
  blacks and glaring whites for tragedy (0022).

  CHECK: Mood attributable to named light character and grade, not a brightness slider; one light direction
  per shot; a level change between beats has a reason.


