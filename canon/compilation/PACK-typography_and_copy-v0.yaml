  TC-D1 [ASSERTED-hedged|QUALIFIED|DATED|MEDIUM-UNTESTED|SINGLE-ORIGIN]

  Q: What must the words do?

  DEFAULT: Grunt test: a stranger reads what you offer, how it helps, what to do — in five seconds (sb_0015);
  a clearer offer beats a better product (0018). Readers keep only what helps them thrive — company history
  and scale are filtered out (0002); effortful words lose them (0003); story pre-orders the message (0004).
  At any moment the copy says what the hero wants, what opposes them, life either way (0014).

  CHECK: Offer, benefit, action present as words; a stranger answers the three questions from the key
  frame.


  TC-D2 [ASSERTED-hedged|QUALIFIED|DATED|FIGURE-UNVERIFIED|MULTI-ORIGIN(2)]

  Q: Whose story do the lines tell; how many things do they say?

  DEFAULT: Customer as hero, brand as guide (sb_0008) — the archetype that grants the power, never the
  hero (whip_0015). One point per execution; three things to say is three ads (0004): each element added
  lowers every other (0003). One adjective per brand; every line sits under it (0015).

  CHECK: Lines address the customer''s want, not the brand''s greatness; board names the one point and
  one adjective.


  TC-D3 [REASONED-hedged|CONTESTED|DATED|MULTI-ORIGIN(2)]

  Q: What conflict and stakes do the lines carry?

  DEFAULT: Give the copy an opposing force; ''Area Bank Not Robbed'' goes unread — nothing changed (whip_0011).
  Prefer life without the product to life with it (0013). Name what the customer loses by not acting,
  dosed like salt (sb_0012).

  CHECK: Headline or opening line states a problem or absence, not the solved state; one stake named.


  TC-D4 [REASONED-hedged|QUALIFIED|DATED|FIGURE-UNVERIFIED|SINGLE-ORIGIN]

  Q: How clever may the line be; how fast must it get?

  DEFAULT: Write the flat statement, then spin it (whip_0006); the line lives where clear and clever overlap
  — ''I don''t get it'' and ''I''ve seen that before'' are the edges (0005). The quick get outranks creativity
  (0001); wit leaves the viewer 5–40% of the way to travel (0007). Dwell sets the fuse: a passing screen
  takes about seven words, logo extra; two-second test — show, remove, ask what it said (0060). Cut any
  element the idea survives without (0002).

  CHECK: Flat statement on the board beside the final line; a stranger states its meaning after two seconds;
  nothing unneeded survives.


  TC-D5 [ASSERTED-hedged|DATED|CULTURE-BOUND|FIGURE-UNVERIFIED|SINGLE-ORIGIN]

  Q: What register; what is never written?

  DEFAULT: Interesting first; funny is an accent, set by product and audience — no slapstick on a hospital
  (whip_0058). No puns, no rhyming headline (0029). No exclamation mark — it reads as desperation (0033).
  Exaggeration only on a truth, knowingly (0031). No ''real'', no asterisked price, no stock handshake
  — reassurance reads as the lie it covers (0035). No invented person or model number (0034).

  CHECK: Copy has zero ''!'', no pun or rhyme, no ''real/genuine'', no asterisk, no fictional name or
  SKU; register named with its product-and-audience reason.


  TC-D6 [ASSERTED-hedged|QUALIFIED|FIGURE-UNVERIFIED|MULTI-ORIGIN(2)]

  Q: Which element is the boss, how much copy, how is the rest ranked?

  DEFAULT: Postcard (one visual, little copy) or letter (copy-led, complex message) — decide first; something
  dominates either way (whip_0045). One entry point, with a reason (0053). One clever element only: clever
  visual, quiet headline, or the reverse (0043); never show what you say (0032) — word–image polarity
  sets the shift (0048). Rank the rest by scale and weight: bold against light is strength, mere impact
  is vulgarity (vig_0009); type beyond trend (0011). A headline that needs explaining has failed; lead
  with the strongest point (whip_0037). Tagline only if it finishes the argument and stands alone with
  the logo (0057).

  CHECK: Board states postcard/letter, entry element and reason; one clever element; visual does not restate
  the headline; at most three type sizes, each a rank; tagline stands with logo alone or goes.


