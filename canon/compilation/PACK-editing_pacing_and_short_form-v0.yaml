  - No source sets a target duration for hook, brand entry or hold (''early'', ''faster'', ''often'' are
  unquantified); attach no seconds.

  - B12 motion design / animated type has no contributor (no default for animated supers or kinetic type).
  B09 dialogue is thin (sk_conv_c003_0019, sk_ms_c003_0017): no shot/reverse-shot or reaction-cut default.

  - Uncovered: caption timing for sound-off autoplay, the loop point of a looping clip, cutdown versioning
  — no default; state the gap.

  - image_sequence: EP-D7 durations and the sound decisions (EP-D8, EP-D10) need a timeline and an audio
