terse_injection_text: 'CANON DOCTRINE PACK editing_pacing_and_short_form v0 (accepted corpus 3f7e3fadb3fb).
  10 decisions. Each DEFAULT is a decision already made: accept it, or override it in DOCTRINE_DEVIATIONS
  citing the brief clause that forces the override. Answer every CHECK in FAILURE_PREVENTION as pass or
  fix, by decision id. Id legend: ids drop the sk_/scs_ prefix and _c003 infix (fre_0020 = sk_fre_c003_0020;
  3-digit = scs_ system); bare NNNN continues the last-named source.


  EP-D1 [ASSERTED-hedged|DATED|MULTI-ORIGIN(2)]

  Q: How does the film open?

  DEFAULT: Open mid-action or on a close-up, with bold imagery (sk_abcd_0007); reach the heart of the
  story faster — engaging pacing, tight framing (0006); hook, then sustain, audio and visuals together
  (0005). The opening sets how the whole is read (sk_conv_c003_0024); opening music that sets an expectation
  the film fails to meet is a fault however good (0023).

  CHECK: First shot is mid-action or a close-up; hook and what sustains it are named; opening music matches
  what follows.


  EP-D2 [ASSERTED-hedged|QUALIFIED|MULTI-ORIGIN(2)]

  Q: What must every cut carry, and what lets us leave the shot?

  DEFAULT: Every shot cut TO gives information the viewer lacks, visual or aural (sk_gote_c003_0004);
  every departure FROM a shot is motivated by a movement or sound in it at that moment (0006). Cut where
  action is continuous, impact must change, or information or locale changes (0027). The edit is the order
  and rate at which information is released, not the material (sk_murch_c003_0013).

  CHECK: Per cut: the incoming shot''s new information and the outgoing shot''s motivating movement or
  sound are named; a cut with neither goes.


  EP-D3 [ASSERTED-hedged|QUALIFIED|MEDIUM-UNTESTED|SINGLE-ORIGIN]

  Q: When candidate cuts compete, which wins?

  DEFAULT: Rank: true to the emotion of the moment, advances story, rhythmically right, eye-trace, planarity,
  3-D continuity (sk_murch_c003_0019); emotion outweighs the other five combined (0020). Aim for all six;
  it usually can be done (0031). Only when it cannot, sacrifice bottom-up: never emotion before story,
  story before rhythm, rhythm before eye-trace, eye-trace before planarity, planarity before space (0027).

  CHECK: A cut that breaks space or planarity names the higher criterion it keeps; none trades emotion
  or story for continuity.

  LIMIT: Murch''s list is scoped ''for me'' and to narrative film; transfer to a product film is untested.


  EP-D4 [ASSERTED-hedged|CONTESTED|QUALIFIED|DATED|CULTURE-BOUND|MEDIUM-UNTESTED|MULTI-ORIGIN(2)]

  Q: How long does each shot hold?

  DEFAULT: A shot that must be read (product, pack, super, establishing) holds as long as silently describing
  its contents takes; a busier frame earns longer (sk_gote_c003_0053). Beat-driven cuts go by felt beat,
  not frame count (0009). The sub-three-second norm is no rule: the source gives quick cuts their place
  but separates what an action passage bears from a love scene (0052). Shots changed too often read as
  a guide who cannot stop pointing (sk_murch_c003_0018).

  CHECK: Every shot that must be read holds at least its describe-aloud duration; every shorter shot sits
  in a declared action passage.


  EP-D5 [ASSERTED-hedged|QUALIFIED|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|SINGLE-ORIGIN]

  Q: How do movement and screen direction hold across cuts?

  DEFAULT: Keep screen direction across every cut that continues a movement (sk_gote_c003_0017): shoot
  from one side of the action line unless the line is seen to change on screen (0054); crossing it reverses
  left-right (0055). A subject keeps its side of frame across a scene unless it moved on screen (0018).
  Where a shot contradicts established direction, insert a narrative-continuing shot that breaks attention
  on the direction of travel (0017).

  CHECK: Each movement continued across a cut travels the same way; a contradiction is bridged by an inserted
  shot, never cut directly.


  EP-D6 [ASSERTED-our_reading-hedged|CONTESTED|QUALIFIED|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|SINGLE-ORIGIN]

  Q: Move the camera, hold it, or cut — and how is attention moved?

  DEFAULT: Every move has a reason and so does every held camera — never move just because you can, never
  sit still from laziness (sk_ms_c003_0002). Where it fits, move attention inside one shot (cutting is
  fine, less flowing): hide the move behind an action (0010); hold a static wide, block so the dominant
  subject faces camera (0017); tie a colour to the subject in an earlier closer shot so it reads in a
  beat when small or blurred (0016). Never rack focus back and forth between planes — it confuses; after
  a shock, cut to a close-up (0019).

  CHECK: Each shot states move or static, with reason; none relies on repeated focus shifts; a figure
  that must register small or blurred had its colour set earlier and closer.


  EP-D7 [ASSERTED-hedged|CULTURE-BOUND|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|SINGLE-ORIGIN]

  Q: Cut, dissolve or fade — which, and what does it say?

  DEFAULT: The cut is the working default (sk_gote_c003_0027). A dissolve carries a languid, somber, thoughtful
  register — the ''tear jerker'', for romantic or sad passages (0031) — and reads by duration: a few frames
  imitates a jump cut, several seconds a superimposition; last as long as its purpose needs, never the
  one-second software default by reflex (0028). A fade marks the start or end of a programme, act, scene
  or sequence (0037); fade audio up under black before picture fades in.

  CHECK: A dissolve sits on an emotional or slowed passage with a chosen duration; a fade only at a boundary;
  no fade-in over silence.


  EP-D8 [ASSERTED-hedged|QUALIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(2)]

  Q: What does sound do that picture cannot, and how does music enter?

  DEFAULT: Sound establishes reality faster than picture (sk_gote_c003_0048); a sound begun under the
  outgoing shot and explained by the incoming one motivates a cut across place or subject (0007). Score
  channels an emotion the picture has already created, seldom supplies one, a tendency not a rule (sk_conv_c003_0007);
  music with a visible origin in the scene takes a different route — the scene explains it, so it is not
  read as manipulation (0009). Where voice withdraws, the audience searches the remaining sound for meaning
  and hears it as speech (0019).

  CHECK: Each music cue names the emotion already built, or its visible source; each cut across place
  or subject has a sound bridge or a reason for none; passages without voice carry designed sound.


  EP-D9 [ASSERTED-hedged|QUALIFIED|DATED|SINGLE-ORIGIN]

  Q: Where and how does the brand appear across the film?

  DEFAULT: Introduce the brand or product from the start and keep it present to the end — an early appearance
  that lapses does not satisfy (sk_abcd_0011). Brand early, often, richly — richly means variety of asset,
  not repetition (0010): product shots, pack shots, in-situ branding, graphics, voice-over, music, fit
  to message and objective (0013). Core rule first, then tailor emphasis to the marketing objective; nothing
  dropped (0022). Full-funnel: start with a mix of branding elements, finish on the product (0026).

  CHECK: Brand or product present in every shot, no lapse; more than one asset type carries it; a full-funnel
  film closes on the product.


  EP-D10 [ASSERTED-hedged|QUALIFIED|DATED|SINGLE-ORIGIN]

  Q: How is the ask made, and how are audio and on-screen channels paired?

  DEFAULT: Ask for action with a clear, concise instruction carried by a written CTA, graphics, audio,
  or a scene from the story (sk_abcd_0019); choose the CTA against one specific objective and say plainly
  what to do (0020). Pair the on-screen CTA with a voice-over saying the same (0021) and on-screen branding
  with an audio brand mention (0012); audio and supers reinforce key points, never compete (0008); these
  pairings rest on sound-on viewing, stated for YouTube only (0014). Full-funnel: CTAs throughout, more
  direct as the film proceeds (0026).

  CHECK: One named objective, one CTA tied to it; on-screen CTA and brand each have a matching audio line
  at the same moment; text, audio and picture agree.

  LIMIT: Audio pairings assume sound is heard (YouTube only); on a sound-off feed the on-screen channel
  carries ask and brand alone — the corpus does not say how.


  PRE-ARBITRATED CONFLICTS (the rule already decides; do not re-arbitrate):

  CF-01 gote_0053 vs gote_0052: 0053 governs any shot whose job is to be read: it holds its describe-aloud
  duration. 0052 licenses faster cutting only in an action passage, not a love scene; cutting a shot that
  must be read shorter is a deviation.

  CF-02 ms_0017 vs ms_0010: By scene: continuous movement between two people takes 0017 (static wide,
  dominant actor faces camera, hands-and-feet coverage as cut fallback); a shift between locations or
  points of interest takes 0010 (hide the move behind an action). Either needs its reason (0002).

  CF-03 murch_0018 vs murch_0033: 0018 governs cut frequency: never so many shot changes that the viewer
  never chooses where to look. 0033 (not compiled here; named so the boundary is visible) governs where
  attention is sent inside the shots made.


