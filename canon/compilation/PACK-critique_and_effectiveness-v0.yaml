  or sound in the outgoing shot (0006). Length = time to describe the contents silently (0053), against
  a fast-cut norm calling three seconds long; action pace is not love-scene pace (0052). Dissolves are
  said to read languid, somber (0031); fades bound an act, audio up first (0037). The camera is the audience''s
  eye; too much movement covers up (alt_0014). The film world keeps constant direction and distance (gos_0006);
  screen direction holds until a change is shown — exit left, enter right (0007); a contradicting shot
  needs a break shot (gote_0017).

  CHECK: Per cut: new thing, reason to leave; shot no shorter than its contents read; transitions, moves
  motivated; no unshown reversal.


  CE-D9 [ASSERTED-hedged|CONTESTED|QUALIFIED|DATED|FIGURE-UNVERIFIED|MULTI-ORIGIN(5)]

  Q: Any colour, tone, text or frame judged alone?

  DEFAULT: A colour is almost never seen alone — judge each against its neighbours; the most relative
  medium (alb_0006, 0011). Few judge value across hues by eye (0018). Depth by tonal separation of subject
  and ground, either way (alt_0015); genre sets the key before any scene is lit (0018), level follows
  the dramatic line (0022). Text over image needs enough value contrast and follows the structure (sam_0021);
  differentiated letters read easier, all-caps hardest (alb_0005). Strength is contrast — scale, bold
  vs light — never impact (vig_0009). Placement: one of three zones, not a coordinate (fre_0017); a vertical
  frame alone gives no tallness — oppose elements at the long axis''s ends (0008).

  CHECK: Grayscale: subject/ground, text/image separate; one key, level follows the emotional line; no
  all-caps; strength = contrast; zone, not ratio.


  CE-D10 [ASSERTED-hedged|CONTESTED|QUALIFIED|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(3)]

  Q: How is the verdict stated, and what gives first?

  DEFAULT: A verdict is analysis against the brief''s objectives — not reaction, not redesign (disc_0005);
  each finding names element, objective, and why it does or does not serve it (0006). A good note: what
  is wrong, missing or unclear; early, specific, no demand; a fix only illustrates (cat_0015). The visible
  fault is usually a symptom — target the cause (0011); a right alarm with a wrong diagnosis still helps
  (0017). When a cut cannot meet all six criteria, give up from the bottom — never emotion before story,
  story before rhythm (murch_0019, 0027); emotion first (0020).

  CHECK: Finding = element + objective + why; no change list; fixes only illustrate; competing criteria
  take the sacrifice order.


  PRE-ARBITRATED CONFLICTS (the rule already decides; do not re-arbitrate):

  CF-01 ogx_0040 vs ogx_0039: Surprise in frame one; name by ten seconds; end on the pack.

  CF-02 whip_0005 vs whip_0001: Spin only while a stranger gets it in one viewing.

  CF-03 mla_0064 vs ogx_0032: No humour unless the brief asks and the writer is one of the few; record
  it.

  CF-04 alt_0018 vs alt_0011: Not the exempt genre: one nameable source unless the brief names a pastiche.

  CF-05 gos_0007 vs gos_0012: Crossed line = fault unless a shown change or a break shot restores direction.

  CF-06 alt_0015 vs alt_0017: 0015: subject vs ground, either way; 0017: only three or more staged depth
  planes.

  CF-07 ogl_0014 vs ogl_0021: Hero is the form, selling the criterion: a hero shot that does not sell
  fails.

  CF-08 ogx_0031 vs ogx_0006: Film/video: brand-preference change; recall figures are print claims.


  PACK LIMITS:

  - Devanagari correctness criteria do not exist in Canon — never generate Devanagari glyphs; composite
  text deterministically.

  - Coverage: ogx = 1983 US 30 s TV on brand preference; hop/mla = 1920s print; gote/gos/murch/conv/alt
  = film/TV craft; disc/cat = design/animation reviews. None treats 9:16 feeds, sound-off autoplay, sub-10
  s ads, thumb-stop metrics, or whether a piece must work with audio removed — CE-D6 governs only the
  audio present.

  - India: only Pandey (2015) and Parameswaran (agency history); ASCI, category/festival codes, regional
  register uncovered — check ASCI outside Canon.

  - Uncovered: liking, views, engagement as predictors (0031 rejects recall for TV only); emotion''s effect
  unquantified (0036); pre-testing; checker independence; ''enough'' contrast (sam_0021).

  '
what_a_pass_does_not_establish: Relevance to any brief, doctrine quality, medium fit, outcome improvement,
  or adoption. A validator PASS is a structural fact about committed bytes; adoption is a Controller decision.
