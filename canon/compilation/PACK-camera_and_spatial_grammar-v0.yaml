    still from laziness, is one error (ms_0002). The camera is the audience's eye; too much movement is
    as bad as none (alt_0014). To move attention without a cut, hide the move behind an action (ms_0010)
    or hold a static wide, dominant subject blocked to face camera (0017); colour set on the subject in
    an earlier closer shot directs attention like a move (0016). Never rack focus back and forth; cut
    to a close-up (0019). A long-to-close move carries two lightings — the slower setup (alt_0021).
