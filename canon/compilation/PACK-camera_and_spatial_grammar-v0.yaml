  defaults transfer untested.

  - No contributor is Indian or treats frontality, darshan or an Indian viewer''s reading of the camera;
  no packshot convention in Canon; assume neither way.

  - Line, eye-line, reciprocal and move/hold rules are stated for talent; none motivates a move or cut
