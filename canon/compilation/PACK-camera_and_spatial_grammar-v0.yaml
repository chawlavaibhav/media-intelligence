terse_injection_text: 'CANON DOCTRINE PACK camera_and_spatial_grammar v0 (accepted corpus 3f7e3fadb3fb).
  8 decisions. Each DEFAULT is a decision already made: accept it, or override it in DOCTRINE_DEVIATIONS
  citing the brief clause that forces the override. Answer every CHECK in FAILURE_PREVENTION as pass or
  fix, by decision id. Id legend: ids drop the sk_/scs_ prefix and _c003 infix (fre_0020 = sk_fre_c003_0020;
  3-digit = scs_ system); bare NNNN continues the last-named source.


  CG-D1 [ASSERTED-hedged|CONTESTED|DATED|CULTURE-BOUND|MEDIUM-UNTESTED|MULTI-ORIGIN(4)]

  Q: How is each beat planned — shot size, lens, key?

  DEFAULT: Plan outside-in: wider shots establish, tighter shots reach detail as the action develops (gos_0017).
  Cover every angle and framing the edit needs (0001) so the most revealing angle is chosen per beat (murch_0009;
  conv_0027). The director owns the lens — a random lens is a random shot (ms_0003); each face has the
  lens and distance that renders it most itself, found by test (conv_0025). Decide the key of the whole
  picture before scene work (alt_0018); in drama the level follows the dramatic line and the long shot''s
  job is mood as well as geography (0022).

  CHECK: Each beat names size, lens and level with a reason; wider to tighter or a recorded deviation;
  key named once.

  LIMIT: No product focal length or size ladder in Canon; lens claims are about faces; Alton''s key categories
  are 1949 genres — the order transfers, not the table.


  CG-D2 [ASSERTED-hedged|CONTESTED|QUALIFIED|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|SINGLE-ORIGIN]

  Q: Where is the line of action, and how do direction and side of frame hold across cuts?

  DEFAULT: The film world keeps constant rules of direction; the frame edges are the viewer''s reference
  (gos_0006; 0005). Trace the line along the sight line or the movement (0009; gote_0054); keep every
  setup inside one 180° arc on its one side (gos_0010). A far-side shot reverses left and right — fine
  alone, wrong in the cut (0012; gote_0055). Exit frame left, enter frame right (gos_0007); a continued
  movement keeps its direction (gote_0017); a subject keeps its side unless seen to move (0018); bridge
  a contradiction with an insert (0016). Cross the line only for a recorded creative reason (gos_0013).

  CHECK: Line on the board; every setup on one side; direction and side of frame hold across every cut,
  or a bridge or on-screen change exists.


  CG-D3 [ASSERTED-hedged|QUALIFIED|MEDIUM-UNTESTED|SINGLE-ORIGIN]

  Q: Where do eye-lines go, and how is two-person coverage matched?

  DEFAULT: A look creates a sight line as movement does; the viewer builds the space from them (gos_0008).
  A look off-frame obliges a payoff from a direction, angle and height near the looker''s (0016). A single
  from a two-shot keeps its side and direction of attention (0011); both singles from one side of the
  line, or both read as looking at an unseen third (gote_0056). Reciprocal coverage matches size, height,
  lens and angle from the mirrored arc position (gos_0015).

  CHECK: Every off-frame look paid off from a matching vantage; singles keep sides and looks; reciprocal
  singles match size, height, lens.


  CG-D4 [ASSERTED-hedged|CONTESTED|QUALIFIED|DATED|FIGURE-UNVERIFIED|MULTI-ORIGIN(2)]

  Q: What angle and height on the product, and how is it staged in depth?

  DEFAULT: Default the camera to a neutral hat: the most revealing angle, the viewer thinking about the
  action (conv_0015); make it a presence only by decision. The most revealing angle on a solid shows the
  most surfaces — move to one side and raise until none is gained (alt_0010). Depth is tonal separation
  of foreground from background, either direction (0015); a complete picture: that angle, each surface
  a different brightness, a ground of another tone (0015; 0010). Where distance must read, the most distant
  part is lightest, a full black-to-white scale (0017). A flat monotone wall is broken by cast shadow
  (0016).

  CHECK: Each angle names the surfaces it shows; subject-to-ground separation survives grayscale; distance,
  where it must read, lightens toward the far; no flat monotone ground without shadow or reason.


  CG-D5 [ASSERTED-our_reading-hedged|CONTESTED|QUALIFIED|DATED|CULTURE-BOUND|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(2)]

  Q: Does the camera move in this shot, and why?

  DEFAULT: Every move has a reason and so does every held camera — moving because you can, or sitting
  still from laziness, is one error (ms_0002). The camera is the audience''s eye; too much movement is
  as bad as none (alt_0014). To move attention without a cut, hide the move behind an action (ms_0010)
  or hold a static wide, dominant subject blocked to face camera (0017); colour set on the subject in
  an earlier closer shot directs attention like a move (0016). Never rack focus back and forth; cut to
  a close-up (0019). A long-to-close move carries two lightings — the slower setup (alt_0021).

  CHECK: Each shot states move or static with a reason; a push-in declares lighting at both ends; no repeated
  focus shifts.


  CG-D6 [ASSERTED-hedged|QUALIFIED|DATED|CULTURE-BOUND|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(2)]

  Q: What joins the shots, how far apart, how long does each hold?

  DEFAULT: The edit is the order and rate of release of information (murch_0013). Every shot cut TO gives
  information the viewer lacks (gote_0004); every departure is motivated by a movement or sound in the
  outgoing shot (0006). Cut by default — continuous action, change of impact, of information or locale
  (0027); consecutive shots of one subject sit at least 30° apart on the arc or change focal length, else
  they jump (gos_0014). A dissolve reads by its duration (gote_0028); its register is languid and sombre
  — effective in romantic or sad passages (0031). A fade bounds a programme or act, or a change of time
  or locale; audio up under black first (0037). A readable shot holds its describe-aloud duration, a busier
  frame longer (0053); fast cutting belongs to an action passage (0052).

  CHECK: Per cut: new information in and motivation out named; consecutive shots of one subject at least
  30° apart; each dissolve or fade names its condition; readable shots hold their describe-aloud time.


  CG-D7 [ASSERTED-hedged|QUALIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(2)]

  Q: When a cut cannot keep everything, what gives first?

  DEFAULT: Aim for all six at once — emotion, story, rhythm, eye-trace, planarity, 3-D continuity; it
  usually can be done (murch_0019; 0031). Emotion outweighs the other five together (0020). Otherwise
  sacrifice from the bottom: space, then planarity, eye-trace, rhythm, story, never emotion (0027); a
  met higher criterion seems to hide a failed lower one (0028). The Grammar''s rules yield to a creative
  reason, crossing the line included (gos_0013); record the deviation with it.

  CHECK: A cut breaking the line, side of frame or 30° names the higher criterion it keeps, in DOCTRINE_DEVIATIONS.

  LIMIT: Murch''s six are scoped ''for me'' and to narrative film; product-film transfer untested.


  CG-D8 [ASSERTED-hedged|QUALIFIED|FIGURE-UNVERIFIED|MEDIUM-UNTESTED|MULTI-ORIGIN(2)]

  Q: What does the soundtrack do for the space the camera shows?

  DEFAULT: Sound creates reality faster than picture; stimulate the ear to help the eye (gote_0048). Shots
  sharing time and place share sound across the cut, level following distance (0019). Music channels an
  emotion the film has already created, seldom supplies one — a tendency, not a rule (conv_0007); music
  with a visible origin in the scene takes a different route (0009). Opening music that sets an expectation
  the film does not meet is a fault however good (0023). Withdraw dialogue and the audience hears the
  rest of the track as speech (0019).

  CHECK: Sound continues across every same-place cut, level by shot size; the opening cue matches what
  follows; each cue names its emotion or visible source.


  PRE-ARBITRATED CONFLICTS (the rule already decides; do not re-arbitrate):

  CF-01 gos_0007 vs gos_0012: 0007 governs every cut continuing a movement or look; a far-side shot (0012)
  is cut in only under 0013''s creative reason, recorded.

  CF-02 gos_0010 vs gos_0012: Setups stay inside the arc (0010); a far-side setup (0012) needs 0013''s
  reason on the board and a bridge (gote_0016) where the cut reverses direction.

  CF-03 ms_0017 vs ms_0010: Two people in continuous movement: 0017 (static wide, dominant subject faces
  camera); a shift between places: 0010 (move hidden behind an action); either with its reason (0002).

  CF-04 alt_0015 vs alt_0017: 0015 governs subject against ground, either direction; 0017 governs the
  reading of distance itself: the most distant part lightest, a full black-to-white scale (near dark,
  far light).

  CF-05 gote_0053 vs gote_0052: 0053 governs any shot that must be read; 0052 licenses faster cutting
  only in an action passage; a readable shot cut shorter is a deviation.

  CF-06 gote_0019 vs gote_0021: 0019 governs by default; removing or contradicting the expected sound
  (0021, not compiled here) is a device only when declared — a deviation on CG-D8.

  CF-07 alt_0018 vs alt_0011: A product film is not the exempt genre: the key agrees with the fictional
  source (0011, not compiled here) unless the brief names a theatrical pastiche, recorded as a deviation
  on CG-D1.


