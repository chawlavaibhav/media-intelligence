    action (conv_0015); make it a presence only by decision. The most revealing angle on a solid shows
    the most surfaces — move to one side and raise until none is gained (alt_0010). Depth is tonal separation
    of foreground from background, either direction (0015); a complete picture: that angle, each surface
    a different brightness, a ground of another tone (0015; 0010). Where distance must read, the most
