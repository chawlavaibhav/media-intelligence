pack_limits:
  - "Coverage: ogx = 1983 US 30 s TV on brand preference; hop/mla = 1920s print; gote/gos/murch/conv/alt = film/TV craft; disc/cat = design/animation reviews. None treats 9:16 feeds, sound-off autoplay, sub-10 s ads, thumb-stop metrics, or whether a piece must work with audio removed — CE-D6 governs only the audio present."
  - "India: only Pandey (2015) and Parameswaran (agency history); ASCI, category/festival codes, regional register uncovered — check ASCI outside Canon."
  - "Uncovered: liking, views, engagement as predictors (0031 rejects recall for TV only); emotion's effect unquantified (0036); pre-testing; checker independence; 'enough' contrast (sam_0021)."
