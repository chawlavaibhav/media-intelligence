pack_id: editing_pacing_and_short_form
applicability: [video, image_sequence]
decisions:
- decision_id: EP-D1
  question: "How does the film open?"
  default: "Open mid-action or on a close-up, with bold imagery (sk_abcd_0007); reach the heart of the story faster — engaging pacing, tight framing (0006); hook, then sustain, audio and visuals together (0005). The opening sets how the whole is read (sk_conv_c003_0024); opening music that sets an expectation the film fails to meet is a fault however good (0023)."
  check: "First shot is mid-action or a close-up; hook and what sustains it are named; opening music matches what follows."
  ids: [sk_abcd_0006, sk_abcd_0007, sk_abcd_0005, sk_conv_c003_0023, sk_conv_c003_0024]
  feeds: [AUDIO_AND_EDIT, PRODUCTION_RECIPE, FAILURE_PREVENTION]
  limits: []
- decision_id: EP-D2
  question: "What must every cut carry, and what lets us leave the shot?"
  default: "Every shot cut TO gives information the viewer lacks, visual or aural (sk_gote_c003_0004); every departure FROM a shot is motivated by a movement or sound in it at that moment (0006). Cut where action is continuous, impact must change, or information or locale changes (0027). The edit is the order and rate at which information is released, not the material (sk_murch_c003_0013)."
  check: "Per cut: the incoming shot's new information and the outgoing shot's motivating movement or sound are named; a cut with neither goes."
  ids: [sk_gote_c003_0004, sk_gote_c003_0006, sk_gote_c003_0027, sk_murch_c003_0013]
  feeds: [AUDIO_AND_EDIT, MESSAGE_AND_INFORMATION_HIERARCHY, FAILURE_PREVENTION]
  limits: []
- decision_id: EP-D3
  question: "When candidate cuts compete, which wins?"
  default: "Rank: true to the emotion of the moment, advances story, rhythmically right, eye-trace, planarity, 3-D continuity (sk_murch_c003_0019); emotion outweighs the other five combined (0020). Aim for all six; it usually can be done (0031). Only when it cannot, sacrifice bottom-up: never emotion before story, story before rhythm, rhythm before eye-trace, eye-trace before planarity, planarity before space (0027)."
  check: "A cut that breaks space or planarity names the higher criterion it keeps; none trades emotion or story for continuity."
  ids: [sk_murch_c003_0019, sk_murch_c003_0020, sk_murch_c003_0027, sk_murch_c003_0031]
  feeds: [AUDIO_AND_EDIT, FAILURE_PREVENTION]
  limits:
  - "Murch's list is scoped 'for me' and to narrative film; transfer to a product film is untested."
- decision_id: EP-D4
  question: "How long does each shot hold?"
  default: "A shot that must be read (product, pack, super, establishing) holds as long as silently describing its contents takes; a busier frame earns longer (sk_gote_c003_0053). Beat-driven cuts go by felt beat, not frame count (0009). The sub-three-second norm is no rule: the source gives quick cuts their place but separates what an action passage bears from a love scene (0052). Shots changed too often read as a guide who cannot stop pointing (sk_murch_c003_0018)."
  check: "Every shot that must be read holds at least its describe-aloud duration; every shorter shot sits in a declared action passage."
  ids: [sk_gote_c003_0053, sk_gote_c003_0052, sk_gote_c003_0009, sk_murch_c003_0018]
  feeds: [AUDIO_AND_EDIT, PRODUCTION_RECIPE, FAILURE_PREVENTION]
  limits: []
- decision_id: EP-D5
  question: "How do movement and screen direction hold across cuts?"
  default: "Keep screen direction across every cut that continues a movement (sk_gote_c003_0017): shoot from one side of the action line unless the line is seen to change on screen (0054); crossing it reverses left-right (0055). A subject keeps its side of frame across a scene unless it moved on screen (0018). Where a shot contradicts established direction, insert a narrative-continuing shot that breaks attention on the direction of travel (0017)."
  check: "Each movement continued across a cut travels the same way; a contradiction is bridged by an inserted shot, never cut directly."
  ids: [sk_gote_c003_0017, sk_gote_c003_0054, sk_gote_c003_0055, sk_gote_c003_0018]
  feeds: [PRODUCTION_RECIPE, GENERATION_PROMPTS, FAILURE_PREVENTION]
  limits: []
- decision_id: EP-D6
  question: "Move the camera, hold it, or cut — and how is attention moved?"
  default: "Every move has a reason and so does every held camera — never move because you can, never sit still from laziness (sk_ms_c003_0002). Prefer moving attention inside one shot: hide the move behind an action (0010); hold a static wide, block so the dominant subject faces camera (0017); tie a colour to the subject in an earlier closer shot so it reads in a beat when small or blurred (0016). Never rack focus back and forth between planes — it confuses; after a shock, cut to a close-up (0019)."
  check: "Each shot states move or static, with reason; none relies on repeated focus shifts; a figure that must register small or blurred had its colour set earlier and closer."
  ids: [sk_ms_c003_0002, sk_ms_c003_0010, sk_ms_c003_0017, sk_ms_c003_0016, sk_ms_c003_0019]
  feeds: [PRODUCTION_RECIPE, GENERATION_PROMPTS, FAILURE_PREVENTION]
  limits: []
- decision_id: EP-D7
  question: "Cut, dissolve or fade — which, and what does it say?"
  default: "The cut is the working default (sk_gote_c003_0027). A dissolve carries a languid, somber, thoughtful register — the 'tear jerker', for romantic or sad passages (0031) — and reads by duration: a few frames imitates a jump cut, several seconds a superimposition; last as long as its purpose needs, never the one-second software default by reflex (0028). A fade marks the start or end of a programme, act, scene or sequence (0037); fade audio up under black before picture fades in."
  check: "A dissolve sits on an emotional or slowed passage with a chosen duration; a fade only at a boundary; no fade-in over silence."
  ids: [sk_gote_c003_0027, sk_gote_c003_0031, sk_gote_c003_0028, sk_gote_c003_0037]
  feeds: [AUDIO_AND_EDIT, FAILURE_PREVENTION]
  limits: []
- decision_id: EP-D8
  question: "What does sound do that picture cannot, and how does music enter?"
  default: "Sound establishes reality faster than picture — stimulate the ear to help the eye (sk_gote_c003_0048); a sound begun under the outgoing shot and explained by the incoming one motivates a cut across place or subject (0007). Score channels an emotion the picture has already created, never supplies one (sk_conv_c003_0007); music with a visible origin in the scene takes a different route — the scene explains it, so it is not read as manipulation (0009). Where voice withdraws, the audience searches the remaining sound for meaning and hears it as speech (0019)."
  check: "Each music cue names the emotion already built, or its visible source; each cut across place or subject has a sound bridge or a reason for none; passages without voice carry designed sound."
  ids: [sk_gote_c003_0048, sk_gote_c003_0007, sk_conv_c003_0007, sk_conv_c003_0009, sk_conv_c003_0019]
  feeds: [AUDIO_AND_EDIT, FAILURE_PREVENTION]
  limits: []
- decision_id: EP-D9
  question: "Where and how does the brand appear across the film?"
  default: "Introduce the brand or product from the start and keep it present to the end — an early appearance that lapses does not satisfy (sk_abcd_0011). Brand early, often, richly — richly means variety of asset, not repetition (0010): product shots, pack shots, in-situ branding, graphics, voice-over, music, fit to message and objective (0013). Core rule first, then tailor emphasis to the marketing objective; nothing dropped (0022). Full-funnel: start with a mix of branding elements, finish on the product (0026)."
  check: "Brand or product present in every shot, no lapse; more than one asset type carries it; a full-funnel film closes on the product."
  ids: [sk_abcd_0011, sk_abcd_0010, sk_abcd_0013, sk_abcd_0022, sk_abcd_0026]
  feeds: [MESSAGE_AND_INFORMATION_HIERARCHY, AUDIO_AND_EDIT, FAILURE_PREVENTION]
  limits: []
- decision_id: EP-D10
  question: "How is the ask made, and how are audio and on-screen channels paired?"
  default: "Ask for action with a clear, concise instruction carried by a written CTA, graphics, audio, or a scene from the story (sk_abcd_0019); choose the CTA against one specific objective and say plainly what to do (0020). Pair the on-screen CTA with a voice-over saying the same (0021) and on-screen branding with an audio brand mention (0012); audio and supers reinforce key points, never compete (0008); these pairings rest on sound-on viewing, stated for YouTube only (0014). Full-funnel: CTAs throughout, more direct as the film proceeds (0026)."
  check: "One named objective, one CTA tied to it; on-screen CTA and brand each have a matching audio line at the same moment; text, audio and picture agree."
  ids: [sk_abcd_0019, sk_abcd_0020, sk_abcd_0021, sk_abcd_0012, sk_abcd_0008, sk_abcd_0014, sk_abcd_0026]
  feeds: [MESSAGE_AND_INFORMATION_HIERARCHY, AUDIO_AND_EDIT, HARD_CONSTRAINT_CHECK, FAILURE_PREVENTION]
  limits:
  - "Audio pairings assume sound is heard (YouTube only); on a sound-off feed the on-screen channel carries ask and brand alone — the corpus does not say how."
conflicts:
- conflict_id: CF-01
  decision_ref: EP-D4
  kind: qualified_by
  between: [sk_gote_c003_0053, sk_gote_c003_0052]
  nature: "the describe-aloud hold for an informational shot against a prevailing fast-cut norm in which a shot over three seconds is called boringly long; the source states both"
  resolution_rule: "0053 governs any shot whose job is to be read: it holds its describe-aloud duration. 0052 licenses faster cutting only in an action passage, not a love scene; cutting a shot that must be read shorter is a deviation."
- conflict_id: CF-02
  decision_ref: EP-D6
  kind: contradicts
  between: [sk_ms_c003_0017, sk_ms_c003_0010]
  nature: "the chapter's default hides a camera move behind an action so attention shifts without a cut; technique 8.7 solves the same problem with no move at all and accepts a cut as its fallback"
  resolution_rule: "By scene: continuous movement between two people takes 0017 (static wide, dominant actor faces camera, hands-and-feet coverage as cut fallback); a shift between locations or points of interest takes 0010 (hide the move behind an action). Either needs its reason (0002)."
- conflict_id: CF-03
  decision_ref: EP-D4
  kind: contradicts
  between: [sk_murch_c003_0018, sk_murch_c003_0033]
  nature: "the editor should misdirect attention as a magician does, against the warning that pursuing complete control of attention is self-defeating; the source states both in one section"
  resolution_rule: "0018 governs cut frequency: never so many shot changes that the viewer never chooses where to look. 0033 (not compiled here; named so the boundary is visible) governs where attention is sent inside the shots made."
waivers:
- ref: sk_abcd_0022
  relation: qualifies
  partner: sk_abcd_0001
  reason: "0001 names the four ABCD principles as a joint set; EP-D9 consumes 0022 only for its two-stage rule (core first, then tailor emphasis by objective; nothing dropped). Membership of the set is not at issue and 0001 does not change the branding sequence."
- ref: sk_ms_c003_0019
  relation: qualifies
  partner: sk_ms_c003_0008
  reason: "0008 encourages combining techniques within a scene; EP-D6 consumes 0019 only as the stated limit on one combination (repeated focus shifts between planes) and does not compile the combination advice, so the encouragement it bounds is not in the pack."
- ref: sk_ms_c003_0019
  relation: qualifies
  partner: sk_ms_c003_0014
  reason: "0014 is the reflection technique inside which the limit is stated; EP-D6 consumes the limit as the source says it applies beyond that technique. The reflection technique itself is not compiled and does not change the default."
- ref: sk_ms_c003_0016
  relation: trades_off_with
  partner: sk_ms_c003_0014
  reason: "the trade-off is a lens choice deciding what the background does (blur for 0016, a legible reflection for 0014). EP-D6 consumes 0016 only for the rule that a colour tied to the subject in an earlier closer shot identifies it when small or blurred; it does not decide lens, and the reflection technique (0014) is not compiled — a shot that needs a legible reflection is outside this default."
- ref: sk_ms_c003_0010
  relation: qualified_by
  partner: sk_ms_c003_0001
  reason: "0001 says every recipe is stated as geometry and timing of a move, not as a rig. EP-D6 consumes 0010 only for the principle of hiding a move behind an action; how the move is executed does not change whether attention is moved by move, blocking, colour or cut."
- ref: sk_ms_c003_0010
  relation: qualified_by
  partner: sk_ms_c003_0004
  reason: "0004 ranks the reader's own camera test above every recommendation in the book, which conditions the status of each recipe as a proposal to test. EP-D6 consumes 0010 as a default to be edited, which is the same status; 0004 does not change what the default says."
- ref: sk_murch_c003_0019
  relation: qualified_by
  partner: sk_murch_c003_0011
  reason: "0011 says what counts as a bad bit is specific to the film being made — a criterion for what to remove. EP-D3 consumes 0019 only as the ranked tie-break between candidate cuts; the film-relative criterion does not reorder the six, and the source records the tension as its own caveat. The narrative-film scope is carried as the EP-D3 limit line."
- ref: sk_conv_c003_0009
  relation: qualified_by
  partner: sk_conv_c003_0011
  reason: "0011 bounds source music (and every repeatable device) by overuse. EP-D8 consumes 0009 only as the scope boundary of 0007 — music with a visible origin takes a different route; whether that route is overused does not change which route a given cue takes."
- ref: sk_murch_c003_0019
  relation: qualified_by
  partner: sk_murch_c003_0028
  reason: "0028 is the perceptual justification for the ordering (a met higher criterion hides a failed lower one). EP-D3 consumes the ordering itself; the justification does not change it. Left out for the terse budget."
- ref: sk_murch_c003_0019
  relation: qualified_by
  partner: sk_murch_c003_0029
  reason: "0029 hedges the percentages and says the intervals are the point. EP-D3 cites no percentage; the ordering and the emotion-outweighs-the-rest claim it consumes are stated in 0019/0020 without figures, so the hedge does not change the default."
- ref: sk_murch_c003_0019
  relation: qualified_by
  partner: sk_murch_c003_0032
  reason: "0032 states the preoccupation underlying the six criteria (occupy the audience's position). It grounds the ranking; it does not alter it. Left out for the terse budget."
- ref: sk_murch_c003_0027
  relation: qualified_by
  partner: sk_murch_c003_0030
  reason: "0030 says emotion, story and rhythm are tightly bound and seldom come apart, which limits how often the sacrifice rule bites among the top three, not what it says when it does. EP-D3 consumes the rule as ordered pairs; 0031 (cited) already bounds when it applies."
- ref: sk_ms_c003_0002
  relation: qualified_by
  partner: sk_ms_c003_0018
  reason: "0018 is the invisibility test (the audience registers the scene, not the method) — the other face of the motivation rule, as the source says. EP-D6 consumes the motivation rule; the test does not change what the default says. Left out for the terse budget."
- ref: sk_gote_c003_0018
  relation: qualified_by
  partner: sk_gote_c003_0008
  reason: "0008 says an object's apparent size sets its sound level. EP-D5 consumes 0018 only for side-of-frame continuity; sound level does not change which side a subject keeps. Left out for the terse budget."
pack_limits:
- "No accepted contributor treats fixed 9:16 feed frames or sound-off autoplay: Grammar of the Edit (2009), Murch, Ondaatje/Murch and Kenworthy predate feed video; ABCD guidance is YouTube-only at its page dates. Transfer of every hold, transition and audio-pairing default to vertical short-form feeds is untested."
- "No source sets a target duration for hook, brand entry or hold — 'early', 'faster', 'the start', 'often' are unquantified; attach no seconds."
- "B12 motion design / animated type has no contributor: no default for animated supers, kinetic type or motion-graphic transitions. B09 dialogue is thin: only sk_conv_c003_0019 and sk_ms_c003_0017; no shot/reverse-shot or reaction-cut default."
- "image_sequence: EP-D7 durations and every sound decision (EP-D8, EP-D10 pairings) need a timeline and an audio track."
