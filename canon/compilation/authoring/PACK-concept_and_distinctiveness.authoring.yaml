pack_id: concept_and_distinctiveness
applicability: [static_image, video, image_sequence]
decisions:
  - decision_id: CD-D1
    question: "The one proposition; is the product load-bearing in it?"
    default: "One promise of a benefit, unique as well as persuasive — one a rival could make fails (ogx_0060). Core by exclusion; proverb, not sound bite (hea_mts_0009, 0008). One adjective per brand; if taken, a polar opposite or a flank (whip_0015; one point per execution, 0004). Big-idea test: gasp, wish I'd thought of it, unique, fits strategy, thirty years, one personality (ogl_0012, 0013, 0007). Unretellable without the benefit; spread without the sponsor is worthless (ctg_0053, 0052). Product as hero of the picture (ogl_0014): in use, end result, close-up, one device repeated for years (ogx_0041)."
    check: "Promise in one sentence, adjective in one word; no rival's name swaps in; unretellable without the product; product in use."
    ids: [sk_ogx_0060, sk_hea_mts_0009, sk_hea_mts_0008, sk_whip_0015, sk_whip_0004, sk_ogl_c003_0012, sk_ogl_c003_0013, sk_ogl_c003_0007, sk_ctg_0053, sk_ctg_0052, sk_ogl_c003_0014, sk_ogx_0041]
    feeds: [CORE_CREATIVE_IDEA, OBJECTIVE_INTERPRETATION, MESSAGE_AND_INFORMATION_HIERARCHY, GENERATION_PROMPTS, FAILURE_PREVENTION]
    limits: []
  - decision_id: CD-D2
    question: "What makes the idea distinctive, not generic?"
    default: "Remarkable = worth remarking: break an expectation the audience holds about the category, or leave a question open (ctg_0013). Learn the category's worn images, then refuse them (whip_0030). Shared logic gives rivals the same answer; advantage is in what nobody tests (sut_alc_0017, 0004; overreach, not reason, 0032). Invert category norms only in full opposition — a little wrong is no good (whip_0065); relevance is the one rule never released (0067)."
    check: "Board names the expectation broken or question opened, the clichés avoided, why it matters to this buyer."
    ids: [sk_ctg_0013, sk_whip_0030, sk_sut_alc_0017, sk_sut_alc_0004, sk_sut_alc_0032, sk_whip_0065, sk_whip_0067]
    feeds: [CORE_CREATIVE_IDEA, FAILURE_PREVENTION]
    limits: []
  - decision_id: CD-D3
    question: "Which borrowed forms and codes may the idea use?"
    default: "Borrow a fixed-meaning image only re-angled to the product advantage; unmodified beside the logo it is cliché (whip_0046, 0030). Award work is pattern-bound: a template is a form, never the idea (hea_mts_0025). No analogies: readers do not complete them; the vehicle displaces the product (ogx_0020). Audience codes hold only for their audience and date: Hindi-cinema types, dress and props are a pre-1990s style the book calls past (dpci_0120, 0070, 0040, 0190); a colour identifies a figure only if established earlier (ms_0016). Keep an established mark: retouch, never replace (vig_0013, 0011)."
    check: "Each borrowed image names its re-angle; cinema codes dated and scoped; logo = supplied mark; no analogy carries the claim."
    ids: [sk_whip_0046, sk_whip_0030, sk_hea_mts_0025, sk_ogx_0020, sk_dpci_0120, sk_dpci_0070, sk_dpci_0040, sk_dpci_0190, sk_ms_c003_0016, sk_vig_c003_0013, sk_vig_c003_0011]
    feeds: [CORE_CREATIVE_IDEA, VISUAL_SYSTEM, FAILURE_PREVENTION]
    limits: []
  - decision_id: CD-D4
    question: "If the idea is a story: hero, opposing force, stakes?"
    default: "Customer hero, brand guide; a brand playing hero competes with the customer (sb_0008, whip_0015). Cross the brand's truest thing — a customer truth, not a product fact — with the conflicts it causes (whip_0012, 0041). No conflict, no story; life-after-purchase cuts to the end of the movie (0011); absence of the product is usually more interesting than presence (0013). Stakes named, dosed like salt (sb_0012); want, obstacle, life either way always answerable (0014). Story pre-orders the message (0004) and rehearses action (hea_mts_0018)."
    check: "Hero, guide, truth, conflict, stakes one line each; no opening after the problem is solved; brand not the hero."
    ids: [sk_sb_c003_0008, sk_whip_0015, sk_whip_0012, sk_whip_0041, sk_whip_0011, sk_whip_0013, sk_sb_c003_0012, sk_sb_c003_0014, sk_sb_c003_0004, sk_hea_mts_0018]
    feeds: [CORE_CREATIVE_IDEA, MESSAGE_AND_INFORMATION_HIERARCHY, FAILURE_PREVENTION]
    limits: []
  - decision_id: CD-D5
    question: "Surprise, curiosity, or order of release?"
    default: "Violate an expectation to get attention (hea_mts_0010): a visual surprise in frame one, one singular burr; a parade of short scenes is below average (ogx_0040). Surprise decays; to hold, open a gap in what the viewer knows, then fill it (hea_mts_0011). The material is when and in what order information is released (murch_0013). Name within ten seconds, end on the pack (ogx_0039)."
    check: "Board states the expectation violated, the gap and its close, the release order, the burr image."
    ids: [sk_hea_mts_0010, sk_ogx_0040, sk_hea_mts_0011, sk_murch_c003_0013, sk_ogx_0039]
    feeds: [CORE_CREATIVE_IDEA, MESSAGE_AND_INFORMATION_HIERARCHY, AUDIO_AND_EDIT, FAILURE_PREVENTION]
    limits: []
  - decision_id: CD-D6
    question: "How concrete and credible is the idea?"
    default: "Human actions and sensory detail — the only way an idea means the same to everyone (hea_mts_0012); feeling attaches to an individual, not a category (0016); the proverb makes the abstract concrete (0008). Specifics — a figure, a time, a sum — beat generalities; superlatives convince nobody (ogx_0009). Flag the buyer or the place by name (0007). Exclamation marks read as desperation (whip_0033)."
    check: "One named person, one specific figure or sensory fact; no superlative, no exclamation mark; hailing word opens."
    ids: [sk_hea_mts_0012, sk_hea_mts_0016, sk_hea_mts_0008, sk_ogx_0009, sk_ogx_0007, sk_whip_0033]
    feeds: [MESSAGE_AND_INFORMATION_HIERARCHY, GENERATION_PROMPTS, FAILURE_PREVENTION]
    limits: []
  - decision_id: CD-D7
    question: "What should the audience feel; which register; humour?"
    default: "Feeling first: what they remember is how they felt (murch_0020); to care is to feel (hea_mts_0015); the effective emotion is often not the obvious one (0017). Emotion sells as well as reason, most where nothing is unique — add a rational excuse (ogx_0036). Register = product × audience: interesting first, funny an accent, no slapstick on a hospital (whip_0058); humour can now sell but only the very few write funny — else don't (ogx_0032); celebrity, cartoon-for-adults, vignette parade below average (0038), a celebrity never the only memorable thing (ppm_0031). Respect; delight, never intimidate (ppm_0001)."
    check: "One target feeling and its rational excuse; register fits product and audience; humour only under a brief clause."
    ids: [sk_murch_c003_0020, sk_hea_mts_0015, sk_hea_mts_0017, sk_ogx_0036, sk_whip_0058, sk_ogx_0032, sk_ogx_0038, sk_ppm_0031, sk_ppm_0001]
    feeds: [CORE_CREATIVE_IDEA, FAILURE_PREVENTION, DOCTRINE_DEVIATIONS]
    limits: []
  - decision_id: CD-D8
    question: "Too obvious or too weird — how long is the fuse?"
    default: "Sit where clear and clever overlap; 'seen it before' and 'don't get it' mark the edges (whip_0005). Write it flat, then spin (0006). Wit makes the viewer travel 5–40%; the completion is what sticks (0007), but the quick get outranks creativity (0001) and dwell time sets the fuse: two seconds, then ask what it said (0060). Exaggeration is everyone's first reach — use it knowingly, only on a truth (0031); puns and rhymes arrive first; throw them away (0029)."
    check: "A stranger gets it in one viewing; flat statement beside the spun one; exaggeration names its truth; no pun, no rhyme."
    ids: [sk_whip_0005, sk_whip_0006, sk_whip_0007, sk_whip_0001, sk_whip_0060, sk_whip_0031, sk_whip_0029]
    feeds: [CORE_CREATIVE_IDEA, MESSAGE_AND_INFORMATION_HIERARCHY, FAILURE_PREVENTION]
    limits: []
  - decision_id: CD-D9
    question: "What is left out; how does the idea survive 15–30 s?"
    default: "Grunt test: offer, benefit, action in five seconds (sb_0015). Each added element weakens the rest; remove each, keep only the load-bearing (whip_0003, 0002). Most with the least; past a point, detail makes spectators (murch_0015, 0016). Keep all six cut criteria where possible (0031); else give up from the bottom — never emotion before story, story before rhythm (0027, 0019; emotion outweighs the rest, weights hedged, 0029). Every device motivated, stillness chosen, method unnoticed (ms_0002, 0018); staging alone can direct attention (0017); combine techniques, never two competing cues (0008, 0019); strength by contrast, not impact (vig_0009)."
    check: "Every element passes the removal test; one cue per beat; grunt answers in five seconds; emotion and story survive the cut."
    ids: [sk_sb_c003_0015, sk_whip_0003, sk_whip_0002, sk_murch_c003_0015, sk_murch_c003_0016, sk_murch_c003_0027, sk_murch_c003_0019, sk_murch_c003_0029, sk_murch_c003_0031, sk_ms_c003_0002, sk_ms_c003_0018, sk_ms_c003_0017, sk_ms_c003_0008, sk_ms_c003_0019, sk_vig_c003_0009]
    feeds: [CORE_CREATIVE_IDEA, AUDIO_AND_EDIT, PRODUCTION_RECIPE, FAILURE_PREVENTION]
    limits: []
  - decision_id: CD-D10
    question: "What does sound do for the idea?"
    default: "Music seems to work best channelling an emotion the film has already made, not supplying one (conv_0007); music from inside the scene reads as accident, not commentary (0009), and wears out with overuse (0011). Opening music promising a register the film does not keep is a fault however good (0023). Withdraw dialogue and sound reads as speech (0019). Actors on camera over voice-over; supers = spoken words; music no measurable good, effects can help, jingles below average (ogx_0042)."
    check: "Emotion made before music enters; opening sound matches the register; supers = speech; no jingle carries the message."
    ids: [sk_conv_c003_0007, sk_conv_c003_0009, sk_conv_c003_0011, sk_conv_c003_0023, sk_conv_c003_0019, sk_ogx_0042]
    feeds: [AUDIO_AND_EDIT, PRODUCTION_RECIPE, FAILURE_PREVENTION]
    limits: []
conflicts:
  - conflict_id: CF-01
    decision_ref: CD-D5
    kind: trades_off_with
    between: [sk_ogx_0040, sk_ogx_0039]
    nature: "the first ten seconds must carry both the surprise that stops the screen-out and the brand name that prevents misattribution"
    resolution_rule: "Surprise in frame one (0040); name within ten seconds, end on the pack (0039)."
  - conflict_id: CF-02
    decision_ref: CD-D8
    kind: trades_off_with
    between: [sk_whip_0005, sk_whip_0001]
    nature: "cleverness is bought with comprehension time; the quick get is named more important than creativity"
    resolution_rule: "Say it straight first; keep the spin only while a stranger gets it in one viewing (0001; bound by medium, 0060)."
  - conflict_id: CF-03
    decision_ref: CD-D8
    kind: trades_off_with
    between: [sk_whip_0007, sk_whip_0001]
    nature: "wit deliberately lengthens the fuse by making the viewer travel part of the way"
    resolution_rule: "Travel of 5–40% only inside the medium's dwell time (0060); a scroll before the get = fuse too long."
  - conflict_id: CF-04
    decision_ref: CD-D4
    kind: contradicts
    between: [sk_whip_0013, sk_sa8_0042]
    nature: "Sullivan prefers dramatising life without the product ('usually', for categories where absence is conspicuous); Hopkins (1923 print, uncompiled) shows the condition desired, never the defect, and never attacks a rival"
    resolution_rule: "The conflict is the product's absence (0013), never the buyer's own defect or a named rival (0042)."
  - conflict_id: CF-05
    decision_ref: CD-D2
    kind: contradicts
    between: [sk_ctg_0013, sk_ctg_0021]
    nature: "remarkability (breaking a category expectation) against the source's own controlled test in which a corny, less-liked message tied to an environmental cue changed behaviour and the clever one did not (0021, uncompiled)"
    resolution_rule: "Remarkability buys attention and immediate talk (0013), not action; for a behaviour objective tie the idea to a cue at the buying moment (0021)."
waivers:
  - {ref: sk_ogl_c003_0007, relation: qualified_by, partner: sk_ogl_c003_0017, reason: "0017 (repeat a winning advertisement until it stops selling) is the flighting form of consistency; CD-D1 consumes only that the image projects the same personality year after year; media repetition is no decision of this pack."}
  - {ref: sk_ogl_c003_0014, relation: contradicts, partner: sk_ogl_c003_0021, reason: "0021 sets selling-not-style against the pursuit of originality (Reeves: the most dangerous word); CD-D1 consumes only the product-as-hero instruction and CD-D2 already bounds distinctiveness by relevance (whip_0067); the selling criterion is carried as commercial_communication CF-05 on CC-D4 and does not change the product-as-hero default here."}
  - {ref: sk_sb_c003_0012, relation: contradicts, partner: sk_sb_c003_0017, reason: "0017 hardens the seven elements into rules that cannot be broken; 0012 is the source's own statement that the elements are not applied evenly. CD-D4 consumes 0012 (stakes named and dosed); the rules-cannot-be-broken framing is not compiled and does not change the dose (same ruling as commercial_communication CF-06, there as a conflict)."}
  - {ref: sk_ms_c003_0017, relation: contradicts, partner: sk_ms_c003_0010, reason: "0010 is the chapter's organising problem (move attention within one continuous shot rather than cut) and 0017 solves it without a camera move and accepts a cut as fallback; CD-D9 consumes only that staging alone can carry attention — the shot-versus-cut choice is camera_and_spatial_grammar CG-D5 / editing EP-D6 territory and no default here depends on it."}
  - {ref: sk_whip_0004, relation: qualified_by, partner: sk_whip_0061, reason: "0061 qualifies the one-point rule in client revision (the full-line request is the change most asked for); CD-D1 is decided at brief time; the revision-defence doctrine does not change the default (same waiver as commercial_communication)."}
  - {ref: sk_whip_0005, relation: qualified_by, partner: sk_whip_0016, reason: "0016 qualifies the clear/clever overlap as the execution-level form of strategy precision (a brief can be too vague or too precise); CD-D8 operates on a brief already given and consumes only the overlap and its two failure marks (same waiver as commercial_communication)."}
  - {ref: sk_whip_0003, relation: depends_on, partner: sk_whip_0053, reason: "0053 (one element designated the entry point) is the layout consequence of reduction — typography_and_copy TC-D6 compiles it; CD-D9 consumes only the dilution arithmetic that motivates the removal test."}
  - {ref: sk_ogl_c003_0014, relation: contradicts, partner: sk_ogl_c003_0020, reason: "the stored opposition sets product-as-hero against the cult of creativity; 0020's content (copy direct-response on commercial length, daypart, copy length) is not consumed by CD-D6, which takes only the product-as-hero instruction (same waiver as commercial_communication)."}
  - {ref: sk_ogx_0038, relation: depends_on, partner: sk_ogx_0031, reason: "0031 names the measure (change in brand preference, not recall) in which the format judgements are expressed; CD-D7 repeats them in the source's own brand-preference terms and consumes nothing of the measure's derivation; the marker carries the evidence character."}
  - {ref: sk_ogx_0042, relation: depends_on, partner: sk_ogx_0031, reason: "as above: the jingle judgement is stated in brand-preference terms in CD-D10; the measure itself is not compiled."}
  - {ref: sk_ogx_0060, relation: depends_on, partner: sk_ogx_0061, reason: "0061 is the split-run method for choosing between promises; CD-D1 consumes the two criteria (persuasive and unique) as stated and runs no test; the method does not change them."}
  - {ref: sk_ctg_0053, relation: depends_on, partner: sk_ctg_0054, reason: "0054 is the 1947 Allport-Postman evidential basis (transmission strips detail and sharpens around the critical point); CD-D1 consumes the load-bearing test as stated; the marker carries the evidence character."}
  - {ref: sk_ctg_0052, relation: depends_on, partner: sk_ctg_0054, reason: "as above: the failure condition is consumed as stated; its detail-stripping mechanism is not compiled."}
  - {ref: sk_dpci_0120, relation: depends_on, partner: sk_dpci_0100, reason: "0100 is the star-portrait carrier of the poster code (Bachchan's persona, 1970s–80s); CD-D3 consumes the character-type code with its dating and audience scope and makes no star-casting decision."}
  - {ref: sk_ms_c003_0016, relation: trades_off_with, partner: sk_ms_c003_0014, reason: "0014 (reflection shows subject and reaction) trades off with 0016 on the lens choice that decides what the background does; CD-D3 consumes only that a colour identifies a figure instantly when established earlier — no lens or reflection decision is made here (camera_and_spatial_grammar territory)."}
  - {ref: sk_murch_c003_0019, relation: qualified_by, partner: sk_murch_c003_0011, reason: "0011 makes what counts as a bad bit film-relative; CD-D9 consumes only the ranked priority list as the order in which an idea gives things up under compression; which bit is bad in this film remains the producer's judgement and the ranking is unchanged by it."}
  - {ref: sk_ctg_0052, relation: qualified_by, partner: sk_ctg_0006, reason: "0006 scopes 'viral' to pairwise transmission, not long chains — it reinforces 0052 (views are not value) and adds no condition to the load-bearing test CD-D1 consumes."}
  - {ref: sk_murch_c003_0019, relation: qualified_by, partner: sk_murch_c003_0028, reason: "0028 is the perceptual justification for the ranking (higher criteria obscure lower failures); CD-D9 consumes the ranking as an order of sacrifice, which 0028 supports and does not alter."}
  - {ref: sk_murch_c003_0019, relation: qualified_by, partner: sk_murch_c003_0032, reason: "0032 states the editor's standpoint (occupy the audience's position; what do you want them to feel) underlying the six criteria; CD-D7 already takes that standpoint through 0020's question; the ranking CD-D9 consumes is unchanged by it."}
  - {ref: sk_murch_c003_0027, relation: qualified_by, partner: sk_murch_c003_0030, reason: "0030 says the top three are too tightly bound to trade easily; CD-D9 trades only upward from the bottom and states the top-three order verbatim — the bound stands stated and no trade among the top three is made."}
  - {ref: sk_ogx_0038, relation: trades_off_with, partner: sk_ogx_0034, reason: "0034 (unpolished user testimony under challenge) is the credible end of the same perceived-interest axis; CD-D7 consumes only the below-average verdict on celebrity, cartoon and vignette; testimonial casting is commercial_communication CC-D7's decision."}
  - {ref: sk_ogx_0060, relation: qualified_by, partner: sk_ogx_0065, reason: "0065 bounds what research can decide (the promise, not the campaign's long-run value); CD-D1 runs no research and consumes the two criteria as stated."}
  - {ref: sk_ogx_0060, relation: qualified_by, partner: sk_ogx_0066, reason: "0066 bounds who a promise can reach (repertory buying; launch decisive); CD-D1 decides what the promise is, not whom post-launch advertising reaches; the reach bound belongs to no decision of this pack."}
  - {ref: sk_sut_alc_0004, relation: qualified_by, partner: sk_sut_alc_0006, reason: "0006 explains why the untested options matter (logic has already been applied everywhere); it reinforces the search-space argument CD-D2 consumes and adds no condition."}
  - {ref: sk_sut_alc_0017, relation: qualified_by, partner: sk_sut_alc_0016, reason: "0016 gives the organisational reason (blame, not results) nobody tests the counterintuitive option; CD-D2 consumes the competitive consequence only; incentive design is no decision of this pack."}
  - {ref: sk_whip_0001, relation: trades_off_with, partner: sk_whip_0048, reason: "0048 (headline–visual polarity sets effect size and lengthens the fuse) is a layout variable compiled in typography_and_copy TC-D6; CD-D8 consumes only the fuse bound, and the trade resolves as CF-02/CF-03 do — inside the medium's dwell time (0060)."}
pack_limits:
  - "Coverage delta: ogx_* = 1983 US 30 s TV; ogl_*/sa8_* = 1920s–80s print; murch/conv/ms = feature-film craft; ctg/hea/sut = word-of-mouth/communication research. Nothing treats 9:16 feeds, sound-off autoplay or sub-10 s ads: CD-D9's short-form rules are untested transfers; CD-D5, D9, D10 need a timeline (D10 sound) — for a static image nothing here replaces them."
  - "India: only Dwyer/Patel (Hindi cinema to 2002, posters mainly pre-1990) and Pandey (2015) are Indian; category conventions, festival ideas, regional-language humour, Hinglish, the Indian buyer's emotional target, ASCI: uncovered — check ASCI outside Canon."
  - "Uncovered: intellectual property (trademark, copyright, parody of a rival, a real person's likeness — whip_0046 is about meaning, not rights); metaphor choice beyond ogx_0020; Berger's triggers."
