- decision_id: CA-D1
  question: What reads first, second, third?
  default: 'One dominant element by contrast — power is contrast, not ''impact'' (vig_0009); eyes attract more than probably
    anything (fre_0020); competing cues confuse (ms_0019); total control is self-defeating (murch_0018; misdirection 0033
    per CF-15). A late-found second element stays findable — too small or dim and the viewer leaves (fre_0025); a scale figure
    registers only above a size the delivered size sets (0024). Coded figures, dress and props read as the code the audience
    holds (dpci_0120, 0070, 0040; a style dated as ended, 0190): state the meaning, period code only.'
  check: Three reads, one dominant cue each; second reads visible at delivered size; coded elements dated.
  ids:
