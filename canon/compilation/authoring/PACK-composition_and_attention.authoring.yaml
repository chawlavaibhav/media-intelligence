- decision_id: CA-D10
  question: How long may a shot hold; what joins shots?
  default: Silently describe the shot's contents; that time is its length (gote_0053); the fast-cutting norm (alarming, says
    the source) is the ambient pace (0052). A dissolve reads by duration — frames a jump cut, seconds a superimposition —
    lasting as its purpose needs, never the software default (0028); said to read languid, sombre (romantic or sad passages,
    0031). A fade bounds an act, scene or programme or a time/place change; audio first (0037). Sound creates reality faster
    than picture; stimulate the ear to help the eye (0048).
  check: No shot outlasts its describable content; dissolves name purpose and duration; fades bound, audio first.
