- decision_id: CA-D5
  question: Balance or restless; depth and key in tone?
  default: 'Classical balance by default, weighing size AND tone (fre_0028, 0029; fre_005); refusing the eye rest (0032) is
    the declared energetic exception; symmetry orders a subject that has none (0030); diagonals divide against strict rectilinears
    (0033, 0034 per CF-07). Depth: foreground against background in tone, either direction (alt_0015; 0017 per CF-18). Key:
    set for the whole piece by its category before any scene (0018) — comedy high, low key spoils it; drama follows the dramatic
    line: bright gaiety, lower sadness, deep blacks and glaring whites for tragedy (0022).'
  check: Declared balanced or restless; in grayscale size and tonal weight agree, subject separates from ground; key set for
    the whole, level on the dramatic line.
