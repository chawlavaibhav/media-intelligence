  question: How do the edges hold the subject?
  default: 'One edge treatment per shot (fre_002): tight fit, slight deliberate gap (fre_0006); busy scene, edges stop mattering
    (0005); deliberate halving of a symmetrical subject (0007); straight edges near the frame read magnetic (0003); thin a
    bright framing element (0004).'
  check: One named treatment; no accidental near-tangency at the frame edge.
