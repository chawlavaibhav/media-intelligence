    lens, and the reflection technique is not compiled (same waiver as camera_and_spatial_grammar, colour_and_visual_register,
    editing_pacing_and_short_form).
- ref: sk_dpci_0120
  relation: depends_on
  partner: sk_dpci_0100
  reason: 0100 is the star-portrait carrier of the poster code (a persona's fixed facial features trigger recognition, bounded
    to Bachchan in the 1970s–80s); CA-D1 consumes 0120 only for the character-type code being read through familiarity, its
    dating and its clothing carrier (0070, cited). A product ad's figure is not a film-star portrait, so the star-recognition
    mechanism does not change the default; the film-poster star doctrine is not compiled in any pack (indian_indic_context
    limits).
- ref: sk_gote_c003_0035
  relation: contradicts
  partner: sk_gote_c003_0012
  reason: 0012 is the thirty-degree rule (consecutive shots of one subject change angle or focal length or they jump), which
    the wipe also waives; CA-D7 consumes 0035 only as the exception to the composition-difference requirement at the cut (CF-12).
    The thirty-degree rule is camera_and_spatial_grammar scope (CG-D6) and is not compiled here; at a straight cut it stands
    unchanged. Was CF-13 in the pilot; converted to a waiver for budget — the waiver carries the same visibility.
- ref: sk_murch_c003_0025
  relation: contradicts
  partner: sk_murch_c003_0026
  reason: 0026 is the film-school tradition (three-dimensional continuity first) that the source reports in order to argue
    against it; CA-D8 consumes 0025's last rank, which IS the source's position against that tradition. Naming the tradition
    does not change the default. Was CF-17 in the pilot ('named for closure, not doctrine'); converted to a waiver for budget.
- ref: sk_alt_c003_0018
  relation: contradicts
  partner: sk_alt_c003_0011
  reason: '0011 requires the key to agree with an established fictional source; the stored contradiction is 0018''s musical-comedy
    exemption from that requirement. CA-D12 decides key and level by category only; source agreement is product_appearance
    PA-D4''s default and the exemption is arbitrated there (PA CF-03: commercial imagery is not the exempt genre). Neither
    changes key-by-category, so 0011 is not consumed here.'
