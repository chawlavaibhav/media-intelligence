- decision_id: CA-D2
  question: Where do subject, text and mark sit?
  default: 'Off-centre in one of three approximate zones (fre_001; fre_0017, 0018); centre only when the scene points inward
    (0019); extreme placement needs a visible reason (0021); no coordinate rules (0016 vs 0028; CF-05) — zones, never grids
    or ratios. Text over the image: value contrast to read, playing off the image, following the structure beneath (sam_0021);
    the supplied mark is placed, never redrawn: an established logo is equity, identity the system, never change for its own
    sake (vig_0013; timeless, 0011).'
  check: Zone plus reason, no ratio or grid; text reads by value contrast on the structure; mark unaltered.
