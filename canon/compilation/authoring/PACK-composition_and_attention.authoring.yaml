  - sk_murch_c003_0032
  - scs_murch_c003_001
  feeds:
  - AUDIO_AND_EDIT
  - FAILURE_PREVENTION
  limits: []
- decision_id: CA-D9
  question: Screen direction and the line?
  default: Frame edges are the audience's directional reference (gos_0005); keep setups within one 180-degree arc
    (0010; gos_001); movement and position persist across cuts (gote_0017, 0018; gos_0011); reciprocal coverage
    obeys the line (gote_0056). A far-side setup is good in itself — the reversal shows only at the cut (gos_0012,
    contradicting 0007/0010); crossing needs a declared creative reason (0013).
  check: Screen direction and side-of-frame persist across consecutive shots, or something on screen shows the change
    (gos_0007), or the crossing is declared in DOCTRINE_DEVIATIONS.
  ids:
  - sk_gos_c003_0005
