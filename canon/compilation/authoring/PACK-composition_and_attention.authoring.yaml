- decision_id: CA-D7
  question: How does attention travel across cuts?
  default: 'The edit is when and in what order information is released (murch_0013): every new shot carries new information
    (gote_0004), every departure is motivated (0006); alternate placement to drive eye-trace (0010), difficulty near optimum
    (0011); composition differs at the cut (0026), wipe excepted (0035). Or in one shot: a hidden move (ms_0010; ms_002),
    a blocked static wide (0017), or a colour tied to the figure in an earlier closer shot finds it blurred (0016); one device
    per beat.'
  check: 'Per cut: new information and motivation; per beat: one device.'
