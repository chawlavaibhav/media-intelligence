- decision_id: CA-D8
  question: Cut criteria conflict — what goes first?
  default: 'Rule of Six (murch_001; 0019): emotion 51 (0020) > story 23 (0021) > rhythm 10 (0022) > eye-trace 7 (0023) > planarity
    5 (0024) > 3D 4 (0025). Aim for all six (0031), else sacrifice upward from the bottom (0027) — higher criteria hide lower
    failures, never the reverse (0028). Weights hedged, intervals the point (0029); top three bind tightly (0030); ''bad''
    is film-relative (0011); the list serves the audience''s position (0032).'
  check: An imperfect cut names the bottom criteria sacrificed, never emotion.
