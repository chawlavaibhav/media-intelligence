conflicts:
- conflict_id: CF-01
  decision_ref: CA-D3
  kind: contradicts
  between:
  - sk_fre_c003_0002
  - sk_fre_c003_0005
  nature: exact edge-proportioned framing against loose framing whose edges stop mattering
  resolution_rule: Curve-proportioned cut in a sparse frame (0002); in a busy scene edges stop mattering (0005).
    Declare the case.
- conflict_id: CF-02
  decision_ref: CA-D3
  kind: contradicts
  between:
  - sk_fre_c003_0005
  - sk_fre_c003_0006
  nature: busy-scene edge indifference against fragile tight fit
  resolution_rule: Tight fit (0006) is a sparse-frame device, unavailable in a busy scene (0005); one treatment
    per shot, named.
- conflict_id: CF-03
  decision_ref: CA-D3
  kind: contradicts
  between:
  - sk_fre_c003_0006
  - sk_fre_c003_0007
  nature: the source presents deliberate frame break (halving) as the opposite of frame fit
  resolution_rule: Halving (0007) needs a symmetrical subject and a stated reason; else fit-with-gap (0006).
- conflict_id: CF-04
  decision_ref: CA-D3
  kind: contradicts
  between:
  - sk_fre_c003_0007
  - sk_fre_c003_0030
  nature: halving pulls the eye apart; centred symmetry draws it inward
  resolution_rule: Centred symmetry (0030) imposes order on a disordered subject; halving (0007) creates tension
    on an ordered one. State the intent.
- conflict_id: CF-05
  decision_ref: CA-D2
  kind: contradicts
  between:
  - sk_fre_c003_0016
