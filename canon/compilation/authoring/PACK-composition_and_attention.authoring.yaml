- decision_id: CA-D10
  question: How long may a shot hold?
  default: Set length by silently describing the shot's contents; the description's time is the shot's (gote_0053).
    The fast-cutting norm — which the source calls alarming — is the ambient pace (0052).
  check: No shot outlasts its describable content; the stated pace names the prevailing norm it assumes.
  ids:
