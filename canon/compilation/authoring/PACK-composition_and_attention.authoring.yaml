- decision_id: CA-D8
  question: When cut criteria conflict, what is sacrificed first?
  default: 'Murch''s Rule of Six (murch_001; murch_0019): emotion 51 (0020) > story 23 (0021) > rhythm 10 (0022)
    > eye-trace 7 (0023) > planarity 5 (0024) > 3D space 4 (0025). Aim to satisfy all six (0031); else sacrifice
    upward from the bottom (0027) — higher criteria obscure failures of lower ones, never the reverse (0028). Weights
    hedged, intervals the point (0029); top three bind tightly (0030); ''bad'' is film-relative (0011); the list
    serves occupying the audience''s position (0032).'
  check: An imperfect cut names the bottom criteria sacrificed; never sacrifice emotion for eye-trace, planarity
    or 3D continuity.
  ids:
  - sk_murch_c003_0019
  - sk_murch_c003_0020
  - sk_murch_c003_0021
  - sk_murch_c003_0022
