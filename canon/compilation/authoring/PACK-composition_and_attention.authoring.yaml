# Exported from the in-code tables of compile_pilot_packs.py (REP-05) on 2026-09-22 so the two pilot packs are authored like the other eight; to be extended to their seed lists under CONTROLLER-CANON-COMPLETION-2026-09-22.
pack_id: composition_and_attention
applicability:
- static_image
- video
- image_sequence
decisions:
- decision_id: CA-D1
  question: What reads first, second, third?
  default: One dominant element by contrast — visual power is achieved by contrast, not 'impact' (vig_0009); eyes
    attract more strongly than probably any other subject (fre_0020); competing cues confuse rather than direct
    (repeated focus-shifting is the type case, ms_0019); complete control of attention is self-defeating (murch_0018);
    misdirection (murch_0033) is the scoped exception, only to set up a reveal.
  check: Name the 1st/2nd/3rd read; each carried by exactly one dominant cue; no two cues compete for one beat.
  ids:
  - sk_fre_c003_0020
  - sk_vig_c003_0009
  - sk_murch_c003_0018
  - sk_ms_c003_0019
  - sk_murch_c003_0033
  feeds:
  - VISUAL_SYSTEM.attention_order
  - MESSAGE_AND_INFORMATION_HIERARCHY
  - FAILURE_PREVENTION
  limits: []
- decision_id: CA-D2
  question: Where does the subject sit in frame?
  default: 'Off-centre within one of three approximate zones (fre_001; fre_0017, 0018); centre only when the scene
    points inward (0019); extreme placement needs a visible reason (0021). The source rejects coordinate rules (0016,
    vs its nod to classical proportion, 0028): zones are regions, never grids or named ratios.'
  check: Placement is stated as a zone plus the reason for it; no placement is justified by a named ratio or grid
    line.
  ids:
  - sk_fre_c003_0015
  - sk_fre_c003_0016
  - sk_fre_c003_0017
  - sk_fre_c003_0018
  - sk_fre_c003_0019
  - sk_fre_c003_0021
  - sk_fre_c003_0028
  - sk_fre_c003_0029
  - scs_fre_c003_001
  feeds:
  - VISUAL_SYSTEM.placement_zone
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: CA-D3
  question: How does the frame hold the subject at its edges?
  default: 'One edge treatment per shot (fre_002): tight fit with a slight deliberate gap (fre_0006); busy scene,
    edges stop mattering (0005); deliberate halving of a symmetrical subject (0007). Straight subject edges near
    frame edges read magnetic (0003); thin any bright framing element (0004).'
  check: The edge treatment is one of the three, named; no accidental near-tangency between a subject edge and a
    frame edge.
  ids:
  - sk_fre_c003_0002
  - sk_fre_c003_0005
  - sk_fre_c003_0006
  - sk_fre_c003_0007
  - sk_fre_c003_0003
  - sk_fre_c003_0004
  - sk_fre_c003_0030
  - scs_fre_c003_002
  feeds:
  - VISUAL_SYSTEM
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: CA-D4
  question: Use a frame within the frame?
  default: No compulsion (fre_0022); when a subject passes behind an opening, the near-universal reaction is to
    shoot the moment it sits cleanly inside, breaking no edges; thin a bright framing element or it takes over (0004).
  check: A framing element used is darker or thinner than the subject it frames.
  ids:
  - sk_fre_c003_0022
  - sk_fre_c003_0004
  feeds:
  - VISUAL_SYSTEM
  - GENERATION_PROMPTS
  limits: []
- decision_id: CA-D5
  question: Balance the frame, or refuse the eye rest?
  default: Classical balance is the default; it weighs size AND tone together (fre_0028, 0029; fre_005); refusing
    the eye a resting place (0032) is the declared energetic exception. Symmetry imposes order on a subject that
    has none (0030); diagonals need strict horizontals and verticals to divide against (0033, 0034 per CF-07).
  check: Declared balanced or deliberately restless; if balanced, a grayscale check shows tonal weight agreeing
    with size weight.
  ids:
  - sk_fre_c003_0028
  - sk_fre_c003_0029
  - sk_fre_c003_0030
  - sk_fre_c003_0032
  - sk_fre_c003_0033
  - sk_fre_c003_0034
  - sk_fre_c003_0007
  - sk_fre_c003_0016
  - scs_fre_c003_005
  feeds:
  - VISUAL_SYSTEM
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: CA-D6
  question: Which orientation and aspect?
  default: 'Choose by the scene''s shapes (fre_003): a vertical frame is not itself tallness (fre_0008); a square
    reads strict and draws the eye inward (0009, 0010); a wide frame needs shapes that call for it (0011).'
  check: The stated aspect is justified by a named shape in the scene, not by the platform alone.
  ids:
  - sk_fre_c003_0008
  - sk_fre_c003_0009
  - sk_fre_c003_0010
  - sk_fre_c003_0011
  - scs_fre_c003_003
  feeds:
  - VISUAL_SYSTEM
  - DELIVERABLE
  - FAILURE_PREVENTION
  limits:
  - 'No accepted source treats fixed 9:16 feed frames (A01/G2): every aspect and orientation claim here predates
    vertical-feed formats; transfer is untested.'
- decision_id: CA-D7
  question: How does attention travel across cuts (video)?
  default: 'Every new shot carries new information (gote_0004) and every departure is motivated (0006); drive eye-trace
    by alternating frame placement (0010), keeping difficulty near the optimum (0011); composition must differ at
    the cut (0026) — the wipe waives it (0035). Alternatives: move attention inside one continuous shot (ms_0010;
    ms_002), or block with a static wide (0017). One device per beat.'
  check: 'Per cut, name the new information and motivation; per beat, state the one device: cut, camera move, or
    blocking.'
  ids:
