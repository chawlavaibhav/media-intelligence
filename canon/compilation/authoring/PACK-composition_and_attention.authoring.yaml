  limits: []
- decision_id: CA-D11
  question: Does the camera move, and why?
  default: 'Every move is motivated and stillness is chosen (ms_0002); an object in transit licenses a move across
    a location (0011); do the most with the least (murch_0015); shared success criterion: the technique goes unnoticed
    (ms_0018; ms_003).'
  check: Each camera move names its motivation; unmotivated moves are replaced by stillness or a cut.
