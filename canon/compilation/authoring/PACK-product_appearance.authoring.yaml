# Exported from the in-code tables of compile_pilot_packs.py (REP-05) on 2026-09-22 so the two pilot packs are authored like the other eight; extended to its 13-claim seed list the same day under CONTROLLER-CANON-COMPLETION-2026-09-22 ruling 3 (PA-D7 extended; PA-D11, PA-D12 added; existing prose tightened without change of meaning — see BUILD-NOTE-product_appearance-extension.md).
pack_id: product_appearance
applicability:
- static_image
- video
- image_sequence
decisions:
- decision_id: PA-D1
  question: Which reflection type dominates each key surface — diffuse (matte), direct (glossy) or glare?
  default: Declare a finish per named object before any prompt and light for it; the three types are a contrast
    set (lsm_001) — finish belongs to the surface, not the light.
  check: One declared finish per key object; same-tone surfaces still differ by finish; none reads both matte and
    mirror-glossy.
  ids:
  - sk_lsm_c003_0001
  - sk_lsm_c003_0002
  - sk_lsm_c003_0003
  - sk_lsm_c003_0004
  - sk_lsm_c003_0010
  - sk_lsm_c003_0008
  - sk_lsm_c003_0015
  - sk_lsm_c003_0020
  - scs_lsm_c003_001
  feeds:
  - VISUAL_SYSTEM.surface_finish_per_key_object
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: PA-D2
  question: Where may the highlight sit on each glossy surface?
  default: One highlight per surface, from one implied source placed inside or outside the family of angles by intent
    (lsm_002); the reflection reports the source's size.
  check: Highlights agree with the one implied source, not dimming with its distance; a large soft source reads
    large, never hard.
  ids:
  - sk_lsm_c003_0013
  - sk_lsm_c003_0014
  - sk_lsm_c003_0011
  - sk_lsm_c003_0012
  - sk_lsm_c003_0006
  - sk_lsm_c003_0008
  - sk_lsm_c003_0020
  - scs_lsm_c003_002
  feeds:
  - VISUAL_SYSTEM.implied_light_source
  - PRODUCTION_RECIPE
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: PA-D3
  question: Hard or soft source?
  default: Large/soft relative to subject unless the brief forces drama; pick the instrument by the shadow edge
    it must produce (alt_0006); for direct reflection, source size sets highlight size (lsm_0014).
  check: Shadow edge and highlight size agree — a soft shadow with a pinpoint specular, or the reverse, contradicts.
  ids:
  - sk_lsm_c003_0006
  - sk_lsm_c003_0007
  - sk_alt_c003_0006
  - sk_lsm_c003_0014
  feeds:
  - PRODUCTION_RECIPE
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: PA-D4
  question: What is the fictional light source; does everything agree with it?
  default: Name the fictional source first, then place the key to agree (alt_0011); build in alt_002's order — one
    source photographs flat, added lights restore roundness (0009), interiors imitate daylight's structure (0008);
    one consistent direction, since audiences read light untaught (0026).
  check: One nameable fictional source; key direction agrees; no shadow in frame contradicts it.
  ids:
  - sk_alt_c003_0008
  - sk_alt_c003_0009
  - sk_alt_c003_0011
  - sk_alt_c003_0026
  - sk_alt_c003_0018
  - scs_alt_c003_002
  feeds:
  - VISUAL_SYSTEM.implied_light_source
  - PRODUCTION_RECIPE
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: PA-D5
  question: How does the product separate from its ground?
  default: By tonal separation, either direction (alt_0015); the dark-to-light progression (0017) only for staged
    depth planes. Cold, plain grounds separate warm subjects (0003); a deliberately shiny prop (0004) trades off
    against a quiet ground (CF-02).
  check: Product-to-ground contrast survives grayscale; staged depth planes run dark near, light far.
  ids:
  - sk_alt_c003_0015
  - sk_alt_c003_0017
  - sk_alt_c003_0003
  - sk_alt_c003_0004
  feeds:
  - VISUAL_SYSTEM.placement_zone
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: PA-D6
  question: What key level does the mood require?
  default: Set the key by genre and mood before lighting (alt_0018); level follows the dramatic line (0022); mood
    from the character of the light, not exposure (0025); the fictional source still governs (0011).
  check: Mood traces to light character — direction, hardness, contrast — not brightness; key level declared and
    held across shots.
  ids:
  - sk_alt_c003_0018
  - sk_alt_c003_0022
  - sk_alt_c003_0025
  - sk_alt_c003_0011
  feeds:
  - VISUAL_SYSTEM
  - PRODUCTION_RECIPE
  - FAILURE_PREVENTION
  limits: []
- decision_id: PA-D7
  question: Does the imagery earn its space commercially?
  default: The picture is a salesman that must earn its space (hop_sa_0026); assume the viewer decides from a glance
    at headline or picture (0035); size imagery by importance to the sale, never decoration; plan for one imagined
    typical buyer and do what a salesman would face to face — never amuse, boast or show off (0014).
  check: 'One line: what the hero image sells at a glance, to which typical buyer; if it needs the body copy, the
    image fails.'
  ids:
  - sk_hop_sa_0026
  - sk_hop_sa_0035
  - sk_hop_sa_0014
  - scs_hop_sa_003
  feeds:
  - MESSAGE_AND_INFORMATION_HIERARCHY
  - CORE_CREATIVE_IDEA
  - FAILURE_PREVENTION
  limits: []
- decision_id: PA-D8
  question: Glass, dark or mirror-glossy object — special handling?
  default: 'Dark subjects reveal direct reflection, producing less diffuse (lsm_0017); black-on-black: light black
    as if metal — find and fill the family (lsmx_0057). Identify polarized reflection by its diagnostics (lsm_0018);
    a polarized source makes it manageable (0019) but sits late in the ladder on cost: darker background, source
    toward camera, camera height first (lsmx_0023); cross-polarizing source and lens buys freedom from geometry
    at large cost (0009). Polarized direct reflection is dimmer than ordinary (lsm_0015).'
  check: Every specular on glass, dark or glossy surfaces is declared wanted or removed; none accidental.
  ids:
  - sk_lsm_c003_0015
  - sk_lsm_c003_0017
  - sk_lsm_c003_0018
  - sk_lsm_c003_0019
  - sk_lsmx_0009
  - sk_lsmx_0023
  - sk_lsmx_0057
  feeds:
  - PRODUCTION_RECIPE
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: PA-D9
  question: Which angle is the hero angle?
  default: The angle showing the most surfaces (alt_0010) — Canon's only committed angle-choice criterion.
  check: Count visible faces; prefer the angle showing more unless it breaks PA-D2 or PA-D5.
  ids:
  - sk_alt_c003_0010
  feeds:
  - PRODUCTION_RECIPE
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits:
  - 'Packshot convention absent from Canon (A13 application_unbound): hero-angle, label-legibility and scale-cue
    conventions are not in the corpus; this default is one 1949 cinema-era claim — do not overgeneralize.'
- decision_id: PA-D10
  question: When may any of the above be overridden?
  default: 'Technique serves a creative decision it does not make (lsm_0020): any default here yields to an explicit
    creative decision, recorded in DOCTRINE_DEVIATIONS with its forcing brief clause.'
  check: Every deviation from a PA decision sits in DOCTRINE_DEVIATIONS with its forcing brief clause; none silent.
  ids:
  - sk_lsm_c003_0020
  feeds:
  - DOCTRINE_DEVIATIONS
  - HARD_CONSTRAINT_CHECK
  limits: []
- decision_id: PA-D11
  question: Where does the product sit, and how do height, scale and a second read register?
  default: 'Place by zone (around the centre, near an edge or corner, off-centre), never a coordinate (fre_0017).
    A vertical frame is not itself tallness: oppose two elements at the ends of the long axis (0008). With nothing
    of familiar size in frame, size does not read; a small figure supplies it, as small as possible yet seen at
    the delivered size (0024). A late-found second element must stay findable; too small or dim and the viewer leaves
    (0025). The camera is the audience''s eye on the product: a move that hides it covers up, as bad as no move
    (alt_0014).'
  check: Zone and reason named; scale cue and second read visible at delivered size; each move names what it shows.
  ids:
  - sk_fre_c003_0017
  - sk_fre_c003_0008
  - sk_fre_c003_0024
  - sk_fre_c003_0025
  - sk_alt_c003_0014
  feeds:
  - VISUAL_SYSTEM.placement_zone
  - GENERATION_PROMPTS
  - FAILURE_PREVENTION
  limits: []
- decision_id: PA-D12
  question: What do props, dress and figures staged with the product signal?
  default: 'Each is a code the audience already holds — props for period, class and modernity (dpci_0040), dress
    for occasion, formality and colour (0070), a figure for its type (0120): Hindi-cinema codes to 2002, a style
    the source dates as ended (0190). Use as deliberate, dated period codes, never the current default (tables:
    IN-D3).'
  check: Each prop, garment and figure has a stated meaning and date range; filmi-era codes marked 'period, deliberate'.
  ids:
  - sk_dpci_0040
  - sk_dpci_0070
  - sk_dpci_0120
  - sk_dpci_0190
  feeds:
  - MESSAGE_AND_INFORMATION_HIERARCHY
  - VISUAL_SYSTEM
  - GENERATION_PROMPTS
  limits: []
conflicts:
- conflict_id: CF-01
  decision_ref: PA-D5
  kind: contradicts
  between:
  - sk_alt_c003_0015
  - sk_alt_c003_0017
  nature: symmetrical tonal separation against a preferred direction for distance; both stated in the source
  resolution_rule: '0015: subject-against-ground, either direction; 0017: three or more staged depth planes, near
    dark, far light. Apply by the frame''s structure.'
- conflict_id: CF-02
  decision_ref: PA-D5
  kind: trades_off_with
  between:
  - sk_alt_c003_0003
  - sk_alt_c003_0004
  nature: cold, quiet grounds against deliberately shiny props — speculars wanted on one, banned on the other
  resolution_rule: 'Per object: a glossy prop keeps its declared speculars; the ground behind stays cold and quiet;
    never both on one surface.'
- conflict_id: CF-03
  decision_ref: PA-D6
  kind: contradicts
  between:
  - sk_alt_c003_0018
  - sk_alt_c003_0011
  nature: musical comedy is exempted from the requirement that lighting agree with an established source
  resolution_rule: 'Commercial imagery is not the exempt genre: follow 0011 unless the brief names a theatrical
    pastiche, recorded as a deviation.'
- conflict_id: CF-04
  decision_ref: PA-D1
  kind: contradicts
  between:
  - sk_lsm_c003_0004
  - sk_lsm_c003_0010
  nature: diffuse reflection is angle-independent; direct reflection is a mirror image visible at one determined
    angle
  resolution_rule: 'By declared finish (PA-D1): 0004 governs matte/diffuse, 0010 glossy/direct; both hold on different
    surfaces.'
- conflict_id: CF-05
  decision_ref: PA-D3
  kind: contradicts
  between:
  - sk_lsm_c003_0006
  - sk_lsm_c003_0014
  nature: source size does not change a diffuse reflection; for direct reflection source size and placement change
    everything
  resolution_rule: 'By reflection type: 0006 diffuse; 0014 whether and how large the mirror image appears on direct
    surfaces.'
- conflict_id: CF-06
  decision_ref: PA-D2
  kind: contradicts
  between:
  - sk_lsm_c003_0008
  - sk_lsm_c003_0012
  nature: diffuse brightness falls with distance by the inverse square law; a shiny surface reports the source's
    size, not its distance
  resolution_rule: 'By reflection type: falloff reasoning on diffuse only; on shiny surfaces reason about apparent
    source size.'
- conflict_id: CF-07
  decision_ref: PA-D2
  kind: contradicts
  between:
  - sk_lsm_c003_0011
  - sk_lsm_c003_0008
  nature: the two reflection types respond oppositely to source distance
  resolution_rule: Direct-reflection brightness is distance-independent (0011); diffuse follows the inverse square
    law (0008); never swap the rules.
- conflict_id: CF-08
  decision_ref: PA-D8
  kind: cross_source_tension
  between:
  - t_alt_c003_0021
  - t_lsm_c003_0008
  tension_ref: T5
  ledger_record: xj_0023
  ledger_file: 'canon/candidates/ontology-join/cross-source-candidates-v0.yaml — candidate ledger cross-reference
    — unadopted, informational only (status: proposed; no candidates-lane content is consumed)'
  nature: Alton dresses sets with highly reflective objects so specular highlights give the image life, contingent
    on antihalo film stock (t_alt_c003_0021); LSM names a mirror image of the source appearing where the photographer
    does not want it the unwanted direct reflection (t_lsm_c003_0008)
  resolution_rule: Every specular is declared wanted — a shiny prop keeps its highlights (alt_0004) — or identified
    and removed (lsm_0018, 0019); technique serves the decision (0020); Alton's term is antihalo-stock contingent
    (DATED).
- conflict_id: CF-09
  decision_ref: PA-D8
  kind: contradicts
  between:
  - sk_lsmx_0023
  - sk_lsmx_0035
  nature: the glossy-box ladder suppresses direct reflection stepwise; on a polished METAL box the source instead
    embraces it — the table becomes the light source and a light background is the easiest answer, since polished
    metal reads as black without a reflection to carry
  resolution_rule: 'Material decides: a glossy dielectric box works the suppression ladder (0023); a polished metal
    box embraces direct reflection — the surroundings become the source (0035, uncompiled).'
- conflict_id: CF-10
  decision_ref: PA-D8
  kind: contradicts
  between:
  - sk_lsmx_0057
  - sk_lsmx_0036
  nature: black-on-black borrows the metal playbook (find and fill the family) but the source withdraws the metal
    support tricks where polarization differs — the transparent/glossy-black support arrangements are stated for
    metal boxes, not for black subjects generally
  resolution_rule: Light black as if metal (0057); the metal SUPPORT arrangements (0036, uncompiled) carry across
    only for actual metal — withdrawn where polarization behaviour differs.
- conflict_id: CF-11
  decision_ref: PA-D8
  kind: contradicts
  between:
  - sk_lsmx_0009
  - sk_lsmx_0038
  nature: cross-polarization removes direct reflection wholesale; metal rendering depends on direct reflection —
    the purer the metal, the more its edges vanish without a controlled reflection to carry them (the disappearing-edge
    failure)
  resolution_rule: Cross-polarization (0009) is a dielectric-glare last resort; never on metal, whose edges the
    direct reflection constitutes (0038, uncompiled).
