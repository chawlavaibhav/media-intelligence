pack_limits:
- 'Coverage note (GAP-16 resolved by the DN-06 admission): the source''s later chapters are accepted as light-science-magic-beyond-ch3,
  a scoped extension of ch3. Its three self-qualification claims are compiled where they bite (PA-D8: sk_lsmx_0009,
  sk_lsmx_0023, sk_lsmx_0057 — polarizer demoted on cost grounds; glossy-box remedy ladder ordered cheapest-first;
  black-on-black lit as if metal). The remainder of the extension awaits the full live-37 pack compile.'
- 'Coverage delta: jain-gods-in-the-bazaar (frontality/darshan staging, iconographic codes; CV-D9, IN-D2), carroll-read-this-photographs,
  hopkins ch8-21: nothing compiled here — absent, not arbitrated.'
- 'Category gap: no claim covers watch conventions (hand positions) or brushed/sunburst anisotropic surfaces; PA-D1''s
  types do not model radial glow — state the gap, never force a type.'
- 'Transfer untested: fre_0008/0024 landscape, 0017 a 3:2 still, alt_0014 narrative film, dpci codes one audience
  to 2002 — packshots, 9:16 and other audiences assume neither way.'
