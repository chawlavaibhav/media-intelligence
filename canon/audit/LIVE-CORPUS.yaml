# Live Canon corpus register
#
# Authoritative statement of which sources are in the repository and what each one is allowed to be
# used for. Introduced by CANON-006, because the Audit Gate created a state the repository could not
# previously express: a source that is real, validated and worth keeping, but not cleared for
# downstream use.
#
# gate_status:
#   accepted             passed Audit Gate v0.2. Has exactly one active v0.2 audit record under
#                        canon/audit/records/. May be used for cross-source promotion, downstream
#                        product/application use, and Canon-consumption/retrieval.
#   source_evidence_only present, mechanically valid, and NOT cleared for any of those uses. Must
#                        have NO audit record and must carry a blocked_reason. This is a legitimate
#                        adjudication outcome, not a defect and not a lower grade of knowledge.
#
# The register is not a ranking. Order is alphabetical by directory and carries no meaning.
#
# Historical note: CANON-003 closed at 16 accepted books and CANON-004 tested the Audit Gate against
# those same 16. Both numbers are fixed forever. This register describes the CURRENT live corpus,
# which is a different question.

register_version: v1
historical_method_test_corpus: 16   # CANON-003 accepted / CANON-004 tested. Never changes.

