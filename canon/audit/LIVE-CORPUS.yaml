  - dir: ondaatje-conversations-ch3
    gate_status: source_evidence_only
    adjudicated_by: CANON-006
    blocked_reason: >
      Blocked on a lineage-representation limit, not on any defect in the extraction. The recovered
      record is complete and passes every current SPEC-03/04/05 mechanical check with zero errors.

      This source is bibliographically authored by Michael Ondaatje and consists substantially of
      Walter Murch speaking. The live corpus already contains murch-blink-p1-25, which Murch wrote.
      The same argument appears in both — the Egyptian-painting passage, a footnote in Blink and a
      full passage here — and so does the concept `planarity`. They are not two independent origins;
      they are one practitioner recorded twice by two different authors.

      None of Audit Gate v0.2's seven lineage relations states that truthfully. `shared_author` is
      false — Murch is not the bibliographic author. `derivative_of` is false — neither book derives
      from the other. `same_series`, `companion_volume` and `shares_publisher_only` are false
      (Knopf 2002 against Silman-James Press 2001). `cites_source` is not established from committed
      evidence and, under the adopted SPEC-05 rule, would not defeat independence even if it were —
      so using it would let the pair pass as independent, which is the exact error the rule exists to
      prevent. `no_known_relation` is plainly false.

      Writing any of those would be a false statement in an authoritative record. Leaving the source
      unaudited is truthful, so it stays as source evidence and is blocked from every downstream
      gate. See canon/findings/CANON-006-CONTROLLER-BRIEF.md and the minimum method-change proposal
      at canon/PROPOSED-METHOD-CHANGE-CANON-006-LINEAGE.md.
  - dir: samara-making-breaking-grid-ch1
    gate_status: accepted
  - dir: sutherland-alchemy-introduction
    gate_status: accepted
  - dir: vignelli-canon-intangibles
    gate_status: accepted
