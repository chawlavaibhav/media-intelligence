      example and others); no SPEC quotes WCAG. WCAG-style contrast ratios appear in this
      repository only downstream of this extraction.

technology_contingency:
  applicable: true
  applicability_basis: >
    The criteria are defined over web content rendered by user agents under user control — a
    technology surface that changes — and several thresholds inherit from older print and
    measurement conventions. The source itself versions and republishes, which is why the
    REP-07 pass pinned the exact version.
  assessed: true
  classes:
    - class: durable_mechanism
      sk_refs: [sk_wcag_0002, sk_wcag_0009, sk_wcag_0030, sk_wcag_0031, sk_wcag_0036, sk_wcag_0038]
      evidence: >
        The relative-luminance contrast formula, the perceptual rationale for contrast serving
        low-vision users, the hue-vs-lightness distinction and the required-for-understanding
        test rest on properties of human vision, not of any device generation; the Understanding
        rationale grounds them in vision measurement, and nothing about them expires with a
        rendering technology.
    - class: technology_contingent
      sk_refs: [sk_wcag_0001, sk_wcag_0003, sk_wcag_0004, sk_wcag_0005, sk_wcag_0006,
                sk_wcag_0007, sk_wcag_0008, sk_wcag_0010, sk_wcag_0011, sk_wcag_0012,
                sk_wcag_0013, sk_wcag_0014, sk_wcag_0015, sk_wcag_0016, sk_wcag_0017,
                sk_wcag_0018, sk_wcag_0019, sk_wcag_0020, sk_wcag_0021, sk_wcag_0022,
                sk_wcag_0023, sk_wcag_0025, sk_wcag_0026, sk_wcag_0027, sk_wcag_0028,
                sk_wcag_0029, sk_wcag_0032, sk_wcag_0033, sk_wcag_0034, sk_wcag_0035,
                sk_wcag_0037, sk_wcag_0039]
      evidence: >
        Conformance requirements stated over web technologies as they stand at the pinned
        version: user-agent behaviour, CSS-adjustable spacing, viewport resizing, the
        user-interface-component vocabulary. Valid relative to WCAG 2.2 as republished
        2024-12-12; a future version can tighten, relax or restructure them (2.2 itself changed
        2.1's set), which is exactly why the pin exists.
    - class: historical_convention
      sk_refs: [sk_wcag_0024]
      evidence: >
        The 14/18-point large-text thresholds are inherited from pre-existing large-print
        conventions, not derived from a contrast experiment — the source says so itself, and the
        frozen object carries historical_claim.
  existing_characteristics_relied_on: [historical_claim]
