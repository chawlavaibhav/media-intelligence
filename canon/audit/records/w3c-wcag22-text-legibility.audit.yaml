representation_integrity:
  delivery_format: repository_text_extract
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    Web-published standard with no pagination of any kind. Locators are SC number + title,
    glossary term, or Understanding document + section heading; page_start/page_end are null on
    every object and no page number was invented. All locators re-resolve on the byte-pinned
    snapshots (per-document SHA-256 in visual-evidence-ledger.yaml).
  inspection_state: inspected_figure_level
  visual_argument_role: illustrative_only
  observed_loss_patterns:
    - pattern: no_authored_page
      affects: "the whole source"
      detectability: detected_by_independent_check
      recoverability: not_applicable
      evidence: >
        The format has no page; SC-number and section-heading locators are the stable citation
        unit and all resolve on the pinned version.
    - pattern: no_loss_detected
      affects: "the visual dimension of the extracted span"
      detectability: detected_by_independent_check
      recoverability: not_applicable
      evidence: >
        The REP-07 figure pass (ledger, inspection) enumerated all 53 figure elements across the
        seven pinned Understanding documents, opened all 18 image-backed figures and rendered the
        runbook-named HTML demos (SC 1.4.11 Figures 8-14) from the pinned markup. Every figure
        illustrates content its caption or surrounding prose states exactly — hex values, ratios
        and pass/fail verdicts are all in the text — so the text-only extraction lost nothing.
        The three figure_not_inspected caveats (sk_wcag_0034, sk_wcag_0036, sk_wcag_0038) are
        resolved with no change to any frozen claim.
  claim_resolution_after_inspection: all_resolved
  consequence: >
    The pinned version is the 12 December 2024 W3C Recommendation — the same republication the
    extraction's identity table names. Verdict totals 39 match / 0 changed / 0 gone across
    locators, quotations and numeric criteria. living_artifact_not_fingerprinted no longer
    applies; the version-identity gap that made this candidate HOLD-blocked is closed.

evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    39 objects. A standards document: the dominant origin is the working group stating normative
    requirements and definitions in its own corporate voice, with the Understanding notes
    supplying non-normative rationale. The extraction tracks the normative/non-normative split
    per object; this audit categorises origin, which is a different axis.
  categories:
    - category: source_author_assertion
      sk_refs: [sk_wcag_0001, sk_wcag_0002, sk_wcag_0003, sk_wcag_0004, sk_wcag_0005,
                sk_wcag_0006, sk_wcag_0007, sk_wcag_0008, sk_wcag_0009, sk_wcag_0010,
                sk_wcag_0011, sk_wcag_0012, sk_wcag_0013, sk_wcag_0014, sk_wcag_0015,
                sk_wcag_0016, sk_wcag_0017, sk_wcag_0018, sk_wcag_0019, sk_wcag_0020,
                sk_wcag_0021, sk_wcag_0022, sk_wcag_0023, sk_wcag_0024, sk_wcag_0025,
                sk_wcag_0026, sk_wcag_0027, sk_wcag_0028, sk_wcag_0029, sk_wcag_0030,
                sk_wcag_0031, sk_wcag_0032, sk_wcag_0033, sk_wcag_0034, sk_wcag_0035,
                sk_wcag_0036, sk_wcag_0037, sk_wcag_0038, sk_wcag_0039]
      evidence: >
        Every object is the Accessibility Guidelines Working Group speaking in its own voice —
        normative criteria and glossary definitions (sk_wcag_0001-0029) or non-normative
        Understanding rationale (sk_wcag_0030-0038, plus 0039). Where the rationale mentions
        research bases (e.g. that the contrast ratios derive from ISO and ANSI standards and
        low-vision measurement conventions, or that the 14/18-point thresholds come from
        large-print conventions rather than a contrast experiment — sk_wcag_0024), the source
        names conventions and standards, not a study with supplied results, so no object rises
        to a measurement-reported category. No object carries empirical_within_source in the
        frozen record, consistently.
  relation_to_evidence_characteristics: >
    Consistent with the frozen record: empirical_within_source appears on zero objects, and no
    origin category here asserts a supplied measurement. sk_wcag_0024 carries historical_claim
    (thresholds inherited from pre-existing large-print conventions), which this audit's
    technology_contingency section classes accordingly.

application_fit:
  audited: true
  findings:
    - consumer: creative_ir
      outcome: no_current_binding
      existing_binding_refs: []
      note: >
        The criteria evaluate rendered artifacts; they are not fields of an intermediate
        representation. The extraction's central caution stands: applying conformance thresholds
        to creative surfaces is extractor extrapolation, confined to bindings marked
        evidence_basis: extractor_inference.
    - consumer: production_ir
      outcome: no_current_binding
      existing_binding_refs: []
      note: No physical production procedure is prescribed.
    - consumer: evaluation
      outcome: binding_exists
      existing_binding_refs: [bnd_wcag_001, bnd_wcag_002, bnd_wcag_003, bnd_wcag_004, bnd_wcag_005, bnd_wcag_006]
      note: >
        Six evaluation bindings over the computable criteria (contrast ratios, resize, spacing,
        images-of-text) — numbers that replace judgement, the property that makes this source the
        corpus's best weak-model doctrine; every binding's applicability.limits records the
        web-content scope and the accessibility (not effectiveness) purpose.
    - consumer: governance
      outcome: binding_exists
      existing_binding_refs: [bnd_wcag_007, bnd_wcag_008]
      note: >
        bnd_wcag_007 (evidence_interpretation) governs the standard's own authority split
        (normative vs Understanding); bnd_wcag_008 (rule_application) constrains application
        outside web content rendered by a user agent.
    - consumer: benchmark
      outcome: binding_exists
      existing_binding_refs: [bnd_wcag_009, bnd_wcag_010]
      note: Benchmark bindings over the mechanically checkable thresholds.
    - consumer: deterministic_composition
      outcome: candidate_no_binding_made
      existing_binding_refs: []
      note: >
        The contrast-ratio and spacing formulas are exactly computable (relative luminance is
        defined to the formula) and could back a deterministic checker; no binding was made in
        the extraction and none is manufactured here.
    - consumer: human_workflow
      outcome: no_current_binding
      existing_binding_refs: []
      note: The source addresses artifacts, not working procedure.
  unbound_knowledge_of_note:
    - sk_refs: [sk_wcag_0036]
      observation: >
        The operational test for "required for understanding" is a reusable judgement procedure
        (identify the meaning-carrying part, test that part's contrast) that generalises beyond
        any single criterion and currently binds to nothing.
  conclusion: >
    Right-shaped fit for a conformance standard: evaluation, benchmark and governance bindings
    exist; nothing pretends the thresholds are creative-effectiveness rules. The deliberate
    non-claim — WCAG never says meeting 4.5:1 makes communication effective — is preserved
    everywhere it matters.

