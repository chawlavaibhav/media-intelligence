technology_contingency:
  applicable: true
  applicability_basis: >
    The entire source is guidance about one company's ad products, on one platform, under one set
    of playback behaviours, at one time — the source itself dates its pages and its study, and
    the extraction carries a platform-contingency caveat on every object. The Controller's
    admission-boundary ruling (c) for exactly this class of material was resolved by DN-06
    ("Admit both, marked"): the source is admitted carrying the explicit platform_contingent
    admission condition at the head of this record, which rests on the facts this section
    records.
  assessed: true
  classes:
    - class: technology_contingent
      sk_refs: [sk_abcd_0001, sk_abcd_0003, sk_abcd_0004, sk_abcd_0005, sk_abcd_0006,
                sk_abcd_0007, sk_abcd_0008, sk_abcd_0009, sk_abcd_0010, sk_abcd_0011,
                sk_abcd_0012, sk_abcd_0013, sk_abcd_0014, sk_abcd_0015, sk_abcd_0016,
                sk_abcd_0017, sk_abcd_0018, sk_abcd_0019, sk_abcd_0020, sk_abcd_0021,
                sk_abcd_0022, sk_abcd_0023, sk_abcd_0024, sk_abcd_0025, sk_abcd_0026]
      evidence: >
        Platform- and product-contingent guidance: valid relative to YouTube's ad formats,
        playback behaviour and measurement products as they stood at the pages' dates. The
        sharpest instance is sk_abcd_0014 ("YouTube is almost entirely a sound-on experience") —
        a platform-behaviour claim made once, on one page, with no measurement, pointing the
        opposite way from the sound-off default common on other feed surfaces; the frozen object
        and its caveats refuse the generalisation. All 25 of these objects carry historical_claim
        in the frozen record.
    - class: uncertain
      sk_refs: [sk_abcd_0002]
      evidence: >
        The NCSolutions claim (creative is the No. 1 driver of campaign effectiveness) is stated
        as a general research finding, not a platform behaviour, but with no study detail its
        durability cannot be classed; the frozen object is the one of 26 without
        historical_claim.
  existing_characteristics_relied_on: [historical_claim, culturally_bounded]
