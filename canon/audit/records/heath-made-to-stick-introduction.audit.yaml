    - consumer: governance
      outcome: binding_exists
      existing_binding_refs: [bnd_hea_mts_0006, bnd_hea_mts_0007, bnd_hea_mts_0009]
      note: >
        bnd_hea_mts_0006 is rule_application and carries a distinction the schema could not: the
        source does not merely fail to warn against using its six principles in isolation, it
        explicitly licenses partial use - "you don't need all of these traits in order to be
        great". SPEC-03's source_warns_against_isolated_use is boolean, so silence and explicit
        permission both record as false (C-14).
    - consumer: benchmark
      outcome: binding_exists
      existing_binding_refs: [bnd_hea_mts_0008]
    - consumer: deterministic_composition
      outcome: no_current_binding
    - consumer: human_workflow
      outcome: no_current_binding
  unbound_knowledge_of_note: []
  conclusion: >
    Four consumers bound, including four Creative IR bindings from 28 objects - a high rate,
    because a framework for making a message stick is close to what our product's message fields
    are for. That closeness says nothing about whether the framework is correct.

