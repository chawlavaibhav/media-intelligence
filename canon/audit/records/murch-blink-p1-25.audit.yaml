representation_integrity:
  delivery_format: authored_print_scan
  page_addressability: authored_pages
  page_addressability_evidence: >
    Every one of the 81 PDF pages carries exactly one full-page greyscale image with an OCR layer
    over it - the signature of a page-image scan. The printed pages are therefore the real ones.
    All seven section titles from the contents page were found starting on the printed pages the
    contents page names.
  inspection_state: inspected_page_level
  visual_argument_role: no_visual_argument
  observed_loss_patterns:
    - pattern: text_layer_order_damage
      affects: >
        Each PDF page is a two-page spread, so naive full-page extraction reads lines across both
        printed pages by vertical position and interleaves them. On spread 15 it emitted a line
        from the left page, then a line of the right page's "The Rule of Six" opening, then back to
        the left page - two unrelated arguments spliced together.
      detectability: detected_by_independent_check
      recoverability: recovered_in_this_copy
      evidence: >
        The ledger records the failure and the fix - cropping each spread into halves with
        -x 0 -W 387 and -x 387 -W 387 against a 774pt page width - and states explicitly that this
        is a mechanical choice respecting the artifact's physical geometry, not reading through
        damage. This is the same failure family that blocked Lupton, at a severity where the copy
        can be repaired.
    - pattern: display_type_ocr_damage
      affects: >
        Character-level slips at 0.03 per cent of 6,493 words - "000feet" for 1,250,000 feet, a
        stray capital I from a drop-cap T read twice, two words clipped by the scan on printed p.1.
      detectability: detected_by_independent_check
      recoverability: recovered_in_this_copy
      evidence: >
        ledger ocr_damage: 2 letter-digit confusions, 0 vowel-less words over 3 characters, no
        structural damage. Verdict usable. Every damaged instance is locally obvious and none falls
        inside a claim the extraction records.
  claim_resolution_after_inspection: not_applicable
  consequence: >
    Two conclusions that pull in opposite directions. The interleaving shows that a source can look
    catastrophically damaged and be fully recoverable once the artifact's geometry is respected -
    which bounds, but does not overturn, the Lupton block. And verified_page_level here means the
    pages were rendered and there was nothing visual to lose, which is a positive result about the
    source rather than an absence of checking.

evidence_origin:
  audit_scope: notable_objects_only
  audit_scope_note: >
    All 39 objects reviewed; one needed a category other than plain authorial assertion.
  categories:
    - category: source_own_measurement_reported
      sk_refs: [sk_murch_c003_0001]
      evidence: >
        Carries empirical_within_source in the frozen record. Murch reports his own footage count
        for Apocalypse Now, a figure from his own work on the film rather than a claim about
        anyone else's practice.
    - category: source_author_assertion
      sk_refs: []
      evidence: >
        The other 38 objects. All 39 carry practitioner_assertion; seven carry anecdotal, all of
        them Murch's own recounted cases from films he cut.
  relation_to_evidence_characteristics: >
    A clean case where empirical_within_source is used exactly as SPEC-03 defines it - the source
    reporting its own measurement - and the audit simply confirms the reading. Contrast Hopkins,
    where the same characteristic had to be withheld from thirty-three claims that assert
    measurement and supply no result.

application_fit:
  audited: true
  findings:
    - consumer: creative_ir
      outcome: binding_exists
      existing_binding_refs: [bnd_murch_c003_0007]
      note: one binding only, from 39 objects.
    - consumer: production_ir
      outcome: no_current_binding
      note: nothing in the span is a physical production action.
    - consumer: evaluation
      outcome: binding_exists
      existing_binding_refs: [bnd_murch_c003_0006, bnd_murch_c003_0008]
    - consumer: governance
      outcome: binding_exists
      existing_binding_refs:
        [bnd_murch_c003_0001, bnd_murch_c003_0002, bnd_murch_c003_0003, bnd_murch_c003_0004, bnd_murch_c003_0005]
      note: >
        Five of eight bindings are governance - the highest proportion in the corpus. The Rule of
        Six is a stated priority order for resolving conflicts between competing editing criteria,
        which is conflict_resolution knowledge about how to weigh evidence, not knowledge about
        what an asset should contain.
    - consumer: benchmark
      outcome: no_current_binding
      note: the source offers no minimal pair and no reproducible test case.
    - consumer: deterministic_composition
      outcome: no_current_binding
    - consumer: human_workflow
      outcome: no_current_binding
      note: >
        The Rule of Six governs a cutting decision, not a team behaviour. It is close to the
        boundary and is recorded as no binding rather than stretched.
  unbound_knowledge_of_note:
    - sk_refs: [sk_murch_c003_0001]
      observation: >
        The Rule of Six is stated with explicit numerical weights - emotion at 51 per cent, story
        at 23, and so on - and SPEC-03's priority_order can record the rank but not the sizes
        (LB-10). The binding that carries it therefore loses the fact that the first criterion
        outweighs the other five combined. Recorded as an audit observation; no schema change is
        proposed from one source.
  conclusion: >
    A source whose knowledge is overwhelmingly about how to decide, not about what to make. That
    profile is invisible in a raw object count and visible immediately in the binding target
    distribution, which is an argument for reading fit by consumer rather than by volume.

