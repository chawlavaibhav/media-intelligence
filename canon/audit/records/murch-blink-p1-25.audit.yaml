      evidence: >
        Different author, publisher and decade, writing on the same subject. Where Murch and the
        Grammar books agree - for instance that a cut needs a reason beyond removing bad material -
        that IS convergence between independent origins, and is the corpus's clearest positive case
        for what the promotion rule should let through.
  independence_verdict: independent_origin
