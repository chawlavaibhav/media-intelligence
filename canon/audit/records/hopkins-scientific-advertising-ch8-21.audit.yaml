representation_integrity:
  delivery_format: authored_print_scan
  page_addressability: authored_pages
  page_addressability_evidence: >
    Internet Archive scan of the 2009 Snowball/BN Publishing reprint, 88 PDF pages, with real
    printed folios. The REP-07 scan-page pass (visual-evidence-ledger.yaml) opened every page of
    the span (PDF 33-72 = printed 25-64) and read the printed folio off each render: printed =
    PDF - 8 holds at all 40 points, and all 14 chapter headings sit on exactly the printed pages
    the extraction's chapter table records. The span boundary was verified by opening printed
    65-68 (blank leaves and the reprint's Recommended Readings page).
  inspection_state: inspected_page_level
  visual_argument_role: no_visual_argument
  observed_loss_patterns:
    - pattern: no_loss_detected
      affects: "the visual dimension of printed pp.25-64"
      detectability: detected_by_independent_check
      recoverability: not_applicable
      evidence: >
        All 40 pages opened: zero figures, illustrations, tables, diagrams or reproduced
        advertisements; clean single-column body text throughout; every load-bearing number the
        extraction cites re-read on the page render and matching ($20-$25, 4%/96%, 425 calories,
        1,460,000, 70c vs 18-22c, 91%, 75%, four to one, $700,000 and the rest - full list in
        the ledger).
    - pattern: source_evidence_never_printed
      affects: >
        Every advertisement Hopkins argues from in chapters 8-21 - Arrow Collar, the Puffed
        Grains pictures, Marmon's columns of copy, the coupon and "before and after taking"
        advertisements, the positive/negative pair said to outpull four to one. Not one is
        reproduced.
      detectability: named_by_text
      recoverability: not_applicable
      evidence: >
        Established in this pass by exhaustive page inspection, not text-layer inference. A 1923
        reader was in the same position; no better copy repairs it. Chapter 9 (p.28) even
        instructs the reader to look at mail order advertisements the book does not show.
        figure_semantic_binding_lost is NOT applicable - nothing was lost because nothing was
        ever printed.
    - pattern: display_type_ocr_damage
      affects: "text-layer italic page-number footers on seven pages (printed 27, 29, 37, 53, 55, 57, 59)"
      detectability: detected_by_independent_check
      recoverability: recovered_in_this_copy
      evidence: >
        Re-verified mechanically with pdftotext in this pass ("Pf", "752]", "2/7", "28)", "oo",
        "nye", "he"); the page images carry correct folios everywhere, so the loss is text-layer
        only and fully recovered by page render. No word of body text is touched;
        extraction_uncertainty ocr_degraded is correctly used on zero objects.
  claim_resolution_after_inspection: not_applicable
  consequence: >
    The copy is complete and legible page by page and the folio affordance is real, so locators
    are trustworthy at page granularity. The pattern that governs downstream use is the one that
    is not our fault: the evidential advertisements were never printed, and bnd_sa8_001 exists
    so a retrieval layer cannot serve a Hopkins claim as though its evidence were merely
    un-digitised.

evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    48 objects. The same source class as the live chapters 1-7 record - the canonical
    measurement_claimed_result_not_supplied case in AUDIT-GATE-v0.2.md - and categorised here
    from the actual frozen objects, not by inheritance from that record.
  categories:
    - category: source_own_measurement_reported
      sk_refs: [sk_sa8_0010, sk_sa8_0016, sk_sa8_0019, sk_sa8_0024, sk_sa8_0026, sk_sa8_0028,
                sk_sa8_0035, sk_sa8_0036]
      evidence: >
        The eight places in fourteen chapters where a measurement is described AND its return
        given: $20-$25 per tooth-brush convert (p.31); 4%/96% canvass (p.35); the 425-calorie
        laboratory return (p.36); the 1,460,000-request issue and coupon-charging costs (p.41);
        70c mailed vs 18-22c store-presented on the same advertisement, 70% by telephone (p.42);
        the repeater check (p.42); the 91% coupon-redeemer vote at ~$1,000 per test (p.49); the
        best-of-fifty-plans 75% cost reduction over five years (p.49). All eight carry
        empirical_within_source in the frozen record; sk_sa8_0026 is the span's single
        controlled_comparison and the extraction argued rather than assumed it.
    - category: measurement_claimed_result_not_supplied
      sk_refs: [sk_sa8_0002, sk_sa8_0004, sk_sa8_0006, sk_sa8_0008, sk_sa8_0013, sk_sa8_0025,
                sk_sa8_0029, sk_sa8_0033, sk_sa8_0034, sk_sa8_0038, sk_sa8_0044]
      evidence: >
        Eleven objects where the source asserts that measurement happened and reports nothing
        from it, each carrying a "measurement asserted, result withheld" (or equivalent)
        extractor_observed caveat in the frozen record. The two sharpest: sk_sa8_0033 - chapter
        15 specifies the test-campaign procedure more fully than any other chapter and reports
        not one campaign's return, the negative finding that closes the live record's chapter-15
        gap - and sk_sa8_0034, "we establish averages on a small scale, and those averages
        always hold", the doctrine's load-bearing premise with no paired predicted/observed
        figure anywhere in the book. None of the eleven carries empirical_within_source,
        consistently.
    - category: source_author_assertion
      sk_refs: [sk_sa8_0001, sk_sa8_0003, sk_sa8_0005, sk_sa8_0007, sk_sa8_0009, sk_sa8_0011,
                sk_sa8_0012, sk_sa8_0014, sk_sa8_0015, sk_sa8_0017, sk_sa8_0018, sk_sa8_0020,
                sk_sa8_0021, sk_sa8_0022, sk_sa8_0023, sk_sa8_0027, sk_sa8_0030, sk_sa8_0031,
                sk_sa8_0032, sk_sa8_0037, sk_sa8_0039, sk_sa8_0040, sk_sa8_0041, sk_sa8_0042,
                sk_sa8_0043, sk_sa8_0045, sk_sa8_0046, sk_sa8_0047, sk_sa8_0048]
      evidence: >
        The remaining 29 objects: doctrine stated in the practitioner's own voice, frequently
        with mechanism (46 of 48 carry mechanism_given) and frequently with an outcome claimed
        but never evidenced (21 of 48 carry outcome_claimed). sk_sa8_0043 (the magazine
        publisher's twenty-five-letter cell test) is a described third-party practice with no
        result reported - recorded here as assertion because the source neither owns the
        measurement nor supplies a return from it.
  relation_to_evidence_characteristics: >
    Consistent with the frozen record and with the vocabulary finding the live chapters 1-7
    audit states: empirical_within_source appears on exactly the eight own-measurement objects;
    none of the eleven measurement-claimed objects carries it. The 8-vs-21 ratio of reported
    returns to claimed outcomes is the span's central evidential fact, and the audit layer
    records the claims-an-empirical-basis fact the frozen characteristic cannot hold.

