        disagreement-settling procedure.
    - consumer: benchmark
      outcome: binding_exists
      existing_binding_refs: [bnd_sa8_006, bnd_sa8_007, bnd_sa8_008]
      note: Named test cases from the chapter-20 name taxonomy, the two specified test designs, and the claim-selection minimal pairs.
    - consumer: deterministic_composition
      outcome: no_current_binding
      existing_binding_refs: []
      note: No exactly executable geometry or composition rule exists in the span.
    - consumer: human_workflow
      outcome: candidate_no_binding_made
      existing_binding_refs: []
      note: >
        The chapter-15 test-campaign procedure and the town-comparison method are working
        methods for an organisation - how a team learns, not what an asset contains - the same
        finding the live chapters 1-7 record makes for the keyed-advertisement apparatus. No
        workflow binding was made and none is manufactured here.
  unbound_knowledge_of_note:
    - sk_refs: [sk_sa8_0033]
      observation: >
        The chapter-15 procedure specification - the resolution of the live record's explicit
        NOT VERIFIED gap - binds to nothing directly (bnd_sa8_001 binds its extrapolation
        premise, sk_sa8_0034). The negative finding it carries (procedure specified, returns
        withheld) is the most audit-relevant content in the span.
    - sk_refs: [sk_sa8_0030, sk_sa8_0031]
      observation: >
        The 1923 physical distribution mechanics (store-routed sampling, the pre-announced
        full-package coupon) are left unbound and their remedy terms untranslated, correctly:
        there is no generative-media equivalent of mailing a grocer a proof sheet.
  conclusion: >
    Right-shaped fit for a scope-continuation of an assertive 1923 trade manual: evaluation,
    governance and benchmark bindings exist with the evidence-interpretation guard in front of
    them; production content is held as candidates; nothing binds to creative IR.

lineage:
  authors: [Claude C. Hopkins]
  publisher: Snowball Publishing / BN Publishing (2009 reprint of the 1923 work)
  series: null
  first_published: 1923
  copy_edition: 2009 reprint, Internet Archive scan, same physical file as the live chapters 1-7 source (SHA-256 verified this pass)
  related_sources_in_corpus:
    - source_id: hopkins_scientific_advertising_ch1_7
      relation: shared_author
      evidence: >
        Same author and in fact the SAME 1923 VOLUME: this candidate is chapters 8-21 (printed
        pp.25-64) of the identical scan file (SHA-256
        e081207466c2f8da334bf6bdeba8c454c17107e6ddfe90cbccc0d95e8531b6fc) whose chapters 1-7
        (printed pp.1-24) are the live accepted source. The controlled vocabulary's
        dependence-defeating relations were each assessed: companion_volume is false (one
        volume, not two), derivative_of is false (neither span derives from the other; both are
        spans of one continuous work), shared_primary_informant is subsumed (one man IS the
        work). shared_author is declared as the true dependence-defeating relation, with the
        same-volume fact recorded here because it is STRONGER than the relation name can say:
        agreement between the two spans is one author restating himself inside one book and is
        worth exactly zero as corroboration. Eighteen objects carry caveats naming the live
        sk_hop_sa_ id they extend or are distinct from; six ontology relationships point at live
        terms, all labelled observations.
    # This entry sat in the jain-precedent related_candidate_sources_outside_accepted_corpus
    # block for the one commit during which the memoir was admitted after this span; it moved
    # up into related_sources_in_corpus, symmetrically, at the memoir's own admission
    # (DN-06 batch, 2026-09-01).
    - source_id: hopkins-my-life-in-advertising
      relation: shared_author
      evidence: >
        Same practitioner, 1927 memoir, extracted in the sibling candidate. The doctrinal
        overlap is near-total - EXTRACTION-NOTES.md §6.2 tabulates ten near-identical doctrine
        pairs and flags that sk_mla_0020 supplies the Liquozone measurement chain chapter 15
        withholds. Two books by one author are one origin; the memoir's numbers do not
        corroborate the manual's doctrine.
  independence_verdict: not_independent_of_named_sources
  independence_basis: >
    Not independent of the two named Hopkins sources, per the pairwise entries above - against
    hopkins_scientific_advertising_ch1_7 the dependence is same-volume, the strongest in the
    corpus. ADMITTED PER DN-06 RULING (d) AS AN EXPLICITLY SCOPED EXTENSION of
    hopkins_scientific_advertising_ch1_7, never as an independent origin: the two-sided lineage
    declaration is written on both records at admission, and agreement between the two spans is
    one author restating himself inside one book, worth zero as corroboration. Independence is
    a property of a pair: nothing here impugns this source's standing against any non-Hopkins
    source, and no such pair was assessed as dependent.
  extractor_exposure:
    spec_contains_examples_from_this_source: false
    evidence: >
      SPEC-03/04/05's worked examples quote Light: Science & Magic and other sources; no SPEC
      quotes Hopkins (the live chapters 1-7 record states the same). Separately recorded for
      honesty: the extraction lane deliberately read the live chapters 1-7 files before writing,
      for the duplication diff in EXTRACTION-NOTES.md §9 - exposure to the sibling span, managed
      by the diff itself, not spec exposure.

technology_contingency:
  applicable: true
  applicability_basis: >
    A 1923 trade manual read 103 years later: area-priced space, halftone engraving, bearer
    coupons redeemed at grocers, postal response routes, the telephone as novelty. Thirty-one of
    forty-eight objects carry historical_claim and nine carry culturally_bounded in the frozen
    record.
  assessed: true
  classes:
    - class: technology_contingent
      sk_refs: [sk_sa8_0005, sk_sa8_0008, sk_sa8_0009, sk_sa8_0011, sk_sa8_0012, sk_sa8_0014,
                sk_sa8_0015, sk_sa8_0017, sk_sa8_0018, sk_sa8_0020, sk_sa8_0023, sk_sa8_0024,
                sk_sa8_0025, sk_sa8_0028, sk_sa8_0030, sk_sa8_0031, sk_sa8_0032, sk_sa8_0033,
                sk_sa8_0034, sk_sa8_0043, sk_sa8_0044, sk_sa8_0045, sk_sa8_0048]
      evidence: >
        All carry historical_claim (without culturally_bounded). Mechanics of 1923 trade
        structure: the chapter-9 picture economics are an arithmetic over area-priced space and
        engraving costs (EXTRACTION-NOTES.md §5 - nothing in the lane says anything about
        whether images work); the sampling, coupon and distribution machinery runs on physical
        retail; the dollar figures are 1923 amounts; test-campaign scale and letter-test cell
        economics assume 1923 media buying and postage.
    - class: historical_convention
      sk_refs: [sk_sa8_0003, sk_sa8_0006, sk_sa8_0007, sk_sa8_0010, sk_sa8_0026, sk_sa8_0038,
                sk_sa8_0042, sk_sa8_0046, sk_sa8_0047]
      evidence: >
        All carry culturally_bounded: period taste and period reader behaviour stated as fact -
        the fool's-cap and clown strictures, the 1923 account of what women want in the beauty
        instruction, telephone-vs-stamps habits, the naming conventions of 1923 brands.
    - class: durable_mechanism
      sk_refs: [sk_sa8_0004, sk_sa8_0029]
      evidence: >
        Neither carries historical_claim or culturally_bounded. The admissibility rule (opinions
        from anyone who does not know his returns are inadmissible) and cost-per-customer as the
        criterion settled by comparison are reasoning patterns about evidence and measurement,
        not about a medium - the extraction's own §10 draws exactly this line between the
        reasoning patterns and the mechanics. That they are durable says nothing about whether
        they are evidenced; both remain assertion.
  existing_characteristics_relied_on: [historical_claim, culturally_bounded]
