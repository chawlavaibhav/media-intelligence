technology_contingency:
  applicable: true
  applicability_basis: >
    The book's subject is human professional judgement - largely mechanism-level psychology and
    arithmetic that does not date - but several of its strongest results are about specific
    institutional and technical practices (linear models of its studied era, algorithmic
    decision tools, performance-management and interview practice), and its values-side
    objections are bound to a legal-political culture. The frozen record carries
    culturally_bounded on three objects and historical_claim on none, so this section leans on
    the caveats where the characteristic vocabulary is silent.
  assessed: true
  classes:
    - class: durable_mechanism
      sk_refs: [sk_nse_0001, sk_nse_0002, sk_nse_0005, sk_nse_0010, sk_nse_0026, sk_nse_0027,
                sk_nse_0030]
      evidence: >
        Arithmetic identities (the error equation and its nested decompositions are mathematics;
        the figures render them as sums of squares) and psychological mechanisms (substitution,
        excessive coherence, the relative-vs-absolute judgement advantage grounded in
        psychophysics) that do not expire with a technology generation. Durability here is
        about the mechanism class, not a claim that any particular measured magnitude
        generalises - the frozen hedges (e.g. on sk_nse_0011) are untouched.
    - class: technology_contingent
      sk_refs: [sk_nse_0033, sk_nse_0045, sk_nse_0039]
      evidence: >
        Results stated over the tools and practices the studies used: mechanical-aggregation
        superiority rests on linear regression, models-of-the-judge and random linear models
        (the frozen caveat records the source's "consistently better, but not much better" and
        its refusal of a replacement conclusion); the noiseless-but-biased-algorithm objection
        and its favourable third-party results are claims about particular deployed systems;
        the structured-interview validity range is a finding about a hiring technology as
        practised. A different generation of models or practices can move all three.
    - class: uncertain
      sk_refs: [sk_nse_0046, sk_nse_0047, sk_nse_0048]
      evidence: >
        The three culturally_bounded objects: dignity and individualised treatment, noise as
        room for changing values / gaming / morale, and rules versus standards. Value-laden
        institutional positions whose durability depends on legal and political culture rather
        than on any technology; the audit cannot class them as durable or dated from the
        repository record.
  existing_characteristics_relied_on: [culturally_bounded]
