representation_integrity:
  delivery_format: repository_text_extract
  page_addressability: pages_unknown
  page_addressability_evidence: >
    canon/sources/ogilvy-ch2-advertising-that-sells.txt, verified earlier in the same session
    against the full EPUB at 215 of 219 sentences over 70 characters matched verbatim; the
    remaining four are caption-merge artifacts whose opening fragments are findable elsewhere in
    the book. No page numbers survive.
  inspection_state: not_inspected_access_blocked
  visual_argument_role: figure_carries_content
  observed_loss_patterns:
    - pattern: announced_loss_placeholder
      affects: >
        Six literal placeholders - three "Click here for hi-res image and text", two "Click here
        for hi-res image", one "Click here for text" - stand where reproductions of actual
        advertisements were. Those advertisements are the chapter's primary evidence: Ogilvy argues
        from specific campaigns and what they did to sales.
      detectability: announced_by_placeholder
      recoverability: recoverable_not_attempted
      evidence: >
        The ledger names this pattern announced_absence and contrasts it with the two others the
        batch had seen: Williams was SILENT loss, where the evidence vanished and the file gave no
        sign; Grammar of the Shot was NAMED loss, figures numbered and captioned but unavailable;
        this file contains an instruction to click something that cannot be clicked. Captions
        survive in full and are substantive - the Rolls-Royce caption states the ad ran in two
        newspapers and two magazines at a cost of $25,000 - so the reader learns what each
        advertisement was and what it achieved, and never sees it.
  claim_resolution_after_inspection: not_applicable
  consequence: >
    The batch's ranking of danger by detectability was built here: announced and named losses are
    recoverable in principle because you know exactly what to go and find, and silent loss is the
    dangerous one because an extractor cannot tell anything is absent. That ordering is why
    detectability is a required field on every loss pattern rather than a note.

evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 22 objects reviewed. Four carry empirical_within_source, five outcome_claimed, twenty
    practitioner_assertion and fourteen anecdotal. This is the corpus's densest mixture of asserted
    authority and claimed result, and it is the reason area B exists.
  categories:
    - category: source_own_measurement_reported
      sk_refs: [sk_ogl_c003_0002, sk_ogl_c003_0009, sk_ogl_c003_0017, sk_ogl_c003_0020]
      evidence: >
        All four carry empirical_within_source in the frozen record. Ogilvy reports research his
        own agency conducted and gives a result - readership figures, recall comparisons - rather
        than asserting that testing occurred.
    - category: source_author_assertion
      sk_refs: []
      evidence: >
        The bulk of the chapter. Twenty of twenty-two objects carry practitioner_assertion and zero
        carry controlled_comparison: an extreme profile, and the schema absorbed it without
        modification days after absorbing Light: Science & Magic's opposite profile of 14 of 20
        mechanism_given and zero anecdotal.
    - category: measurement_claimed_result_not_supplied
      sk_refs: []
      evidence: >
        Present in the source but not separable object-by-object from the repository record alone.
        Five objects carry outcome_claimed, which SPEC-03 defines as a result claimed without
        controls - close to this category but not identical, since outcome_claimed does not
        distinguish "sales rose" from "we tested it and it worked". Recorded as a category with no
        sk_refs rather than assigned by guess. Resolving it would need the chapter re-read against
        each claim, which this audit did not do.
  relation_to_evidence_characteristics: >
    Ogilvy shows that outcome_claimed and the origin question are adjacent and not the same.
    outcome_claimed says a result was asserted without controls; the origin categories say whose
    result it was and whether a result was supplied at all. Hopkins is where the two come apart
    most sharply.

