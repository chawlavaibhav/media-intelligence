lineage:
  authors: [David Ogilvy]
  publisher: null
  series: null
  first_published: 1983
  copy_edition: null
  related_sources_in_corpus:
    - source_id: hopkins_scientific_advertising_ch1_7
      relation: no_known_relation
      evidence: >
        Ogilvy is famously an admirer of Hopkins and the two books share the doctrine that
        advertising is salesmanship measured by response. That is intellectual descent, not shared
        authorship, and this corpus's extraction records no citation of Hopkins inside the
        processed chapter. Recorded as no_known_relation with the caveat stated, because a
        reviewer promoting a concept across these two should see that the question was considered
        and how thin the evidence for a relation is. If a citation were found in the source, the
        correct relation would be cites_source, which under the candidate rule still does not
        defeat independence.
  independence_verdict: independent_origin
  independence_basis: >
    No shared author, publisher, series or derivation established from the repository record.
  extractor_exposure:
    spec_contains_examples_from_this_source: false
    evidence: >
      SPEC-03/04/05 quote Molly Bang, Williams, Lupton, Grammar of the Shot and Light: Science &
      Magic. Ogilvy is not among them. A historical FINDINGS document for this book exists and was
      correctly sealed until after the fresh checkpoint.

technology_contingency:
  applicable: true
  applicability_basis: >
    A 1983 book about advertising in print, television and direct mail, read in 2026. The media it
    describes still exist but the economics, measurement and audience behaviour it assumes may
    not, so the durability question is live.
  assessed: true
  classes:
    - class: uncertain
      sk_refs: [sk_ogl_c003_0013, sk_ogl_c003_0019]
      evidence: >
        Both carry historical_claim in the frozen record. The audit cannot decide from the
        repository record whether the underlying claims are about persuasion mechanisms that
        persist or about a media economy that has gone. Deciding would require re-reading the
        chapter against each claim, which this audit did not do. Recorded as uncertain rather than
        assigned.
  existing_characteristics_relied_on: [historical_claim]
