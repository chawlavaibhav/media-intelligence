representation_integrity:
  delivery_format: publisher_epub
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    Reflowable publisher EPUB with no authored page. Locators are chapter + section + figure
    number; figure numbering is stable and byte-verifiable (systematic image naming figN_M.jpg
    matches caption numbering), and the mandatory 5-locator sample (no original-file hash was
    recorded; byte size matches) passed 5 of 5 (ledger, locator_verification_sample).
  inspection_state: inspected_figure_level
  visual_argument_role: figure_carries_content
  observed_loss_patterns:
    - pattern: no_authored_page
      affects: "the whole source"
      detectability: detected_by_independent_check
      recoverability: unrecoverable_in_this_copy
      evidence: >
        The EPUB has no page; every locator is chapter/section/figure, which this pass
        re-resolved. No page number was invented anywhere in the extraction.
    - pattern: figure_semantic_binding_lost
      affects: "designed page-level pairing of matched before/after photographs"
      detectability: named_by_text
      recoverability: unrecoverable_in_this_copy
      evidence: >
        The book argues through matched pairs and diagrams; the reflowable copy severs figures
        from the designed page geometry. The REP-07 pass bounded the damage: all 129 cited
        figures are now opened across the two passes (53 extraction-time rows imported under
        DN-03 + 76 fresh), every figure's internal content is intact and correctly bound to its
        caption, so the loss is page-layout pairing only, not figure content.
    - pattern: no_loss_detected
      affects: "the internal content of all 129 cited figures"
      detectability: detected_by_independent_check
      recoverability: not_applicable
      evidence: >
        Every one of the 76 previously unopened figures shows what its caption and citing prose
        state; none contradicts a claim; no image is corrupted or misbound. The 18 objects with
        extraction_uncertainty: figure_not_inspected have their figures inspected with no frozen
        claim qualified or overturned. The one prose-vs-picture gap remains the extraction's own
        catch (7.24/7.25 improvement subtler than the text implies, sk_lsmx_0049), imported
        unchanged.
  claim_resolution_after_inspection: all_resolved
  consequence: >
    This candidate is now the corpus's most fully visually verified Light: Science & Magic span
    — the inverse of the live ch3 record, whose 14 figures were never seen
    (blocked_visual_validation during CANON-003). Any later pooling of the two spans should note
    the live span is the text-only one; the asymmetry EXTRACTION-NOTES §3 insists on still
    travels with this lane, with its direction reversed.

