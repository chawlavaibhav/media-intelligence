        sk_conv_c003_0026 records that the editor receives lens decisions already made and can only
        request a remedy. That is a claim about how roles are arranged in a production, not about an
        asset, and it has no consumer.
  unbound_knowledge_of_note:
    - sk_refs: [sk_conv_c003_0001, sk_conv_c003_0002, sk_conv_c003_0005]
      observation: >
        Six bindings against 27 objects, and that ratio is correct rather than thin. Much of this
        chapter is testimony about one film under one set of constraints - true and well evidenced AS
        testimony, and never a claim about films in general. The frozen extraction refused to promote
        those into principles Murch did not state, and the audit does not undo that refusal.
  conclusion: >
    Three consumers bound. Sixteen terms against Grammar of the Edit's 48 is source shape, not thin
    work: a textbook names things because naming is how it teaches, and a conversation reaches for a
    figure of speech instead.

lineage:
  authors: [Michael Ondaatje]
  publisher: Knopf
  series: null
  first_published: 2002
  copy_edition: >
    EPUB, ISBN 978-0-307-51817-0. dc:creator "Michael Ondaatje" with opf:role="aut"; dc:rights
    "Copyright (c) 2002 by Michael Ondaatje". The source states its own origin: "talks that took
    place during our meetings over the next year, starting in July 2000".
  related_sources_in_corpus:
    - source_id: murch_blink_p1_25_editing_decisions
      relation: shared_primary_informant
      evidence: >
        Walter Murch's own practitioner claims are a primary knowledge source in both works despite
        different bibliographic authorship. In the Blink of an Eye is written by Murch. This book is
        Ondaatje's, and its Third Conversation is substantially Murch speaking - the transcript is
        marked O: and M:, and the claims this extraction records are overwhelmingly his.

        This is not incidental quotation. Two load-bearing items were extracted independently from
        both sources. The Egyptian-painting argument is a footnote in Blink - each part of the body
        drawn from its most characteristic angle, with the speculation that "in some remote future,
        our films will look just as comic and twisted" - and a full passage here, sk_conv_c003_0027,
        ending "five hundred years from now, when people see films from our era, they'll seem
        'Egyptian' in a strange way". And `planarity` is a named criterion of the Rule of Six in
        Blink, appearing here as `planarity_of_the_face` applied to lens choice, sk_conv_c003_0025.

        Contamination was disclosed at extraction time rather than discovered later:
        sk_conv_c003_0027 carries an extractor-observed caveat recording that the argument was
        recognised on sight, because the same lane had extracted it from Blink earlier. Nothing was
        imported - the object is written from the wording in front of the extractor, which is
        substantially longer and differently developed.

        Recorded as LB-20. Different author, different publisher, different year: this pair would
        pass any independence check built on author, publisher or source id, and no metadata field
        anywhere records that a book consists largely of another person's words.
  independence_verdict: not_independent_of_named_sources
  independence_basis: >
    Not independent of murch_blink_p1_25_editing_decisions specifically. Against every other source
    in the corpus this is an independent origin - no shared author, series, publisher or derivation
    with any of them, and Knopf appears nowhere else. Independence is pairwise: agreement between
    this source and, say, Grammar of the Edit or Alton remains genuine convergence, and only the
    Murch pairing is blocked from cross-source promotion.
  extractor_exposure:
    spec_contains_examples_from_this_source: false
    evidence: >
      Not quoted in SPEC-03, SPEC-04 or SPEC-05. The relevant exposure here is not spec contamination
      but lane contamination, and it is disclosed above and in the lineage entry rather than left to
      memory: assigning two books by or about one person to a single lane means the second extraction
      is performed by someone who has read the first.

technology_contingency:
  applicable: false
  applicability_basis: >
    A 2002 book of conversations recorded in 2000-2001, about why edits work perceptually and how a
    film is assembled. Two objects carry historical_claim - sk_conv_c003_0021 and sk_conv_c003_0027 -
    and both are claims about past practice or about how the future will read our era, not claims
    that depend on surviving equipment. One object carries culturally_bounded. The chapter discusses
    films cut on systems that no longer exist, but the claims recorded are about attention, character
    and structure rather than about the apparatus.
  assessed: false
  classes: []
  existing_characteristics_relied_on: [historical_claim, culturally_bounded]
