representation_integrity:
  delivery_format: publisher_epub
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    Knopf EPUB, ISBN 978-0-307-51817-0, converted by calibre 0.9.12 in January 2013. An EPUB reflows,
    so there is no page. Encoding was positively verified rather than merely un-flagged: 0
    replacement characters across the chapter's 13,774 words and across all five conversations plus
    the introduction, 92,199 words in total, with 155 em-dashes, 45 pairs of curly quotes, 23
    ellipses and correctly decoded accents in Almasy, fete and d'echafaud.
  inspection_state: inspected_no_page_available
  visual_argument_role: illustrative_only
  observed_loss_patterns:
    - pattern: no_authored_page
      affects: >
        The whole extraction, and unusually severely, because this is a PLATE BOOK. Its photographs
        were grouped across facing pages in print, and its captions were written to address several
        plates at once by position.
      detectability: named_by_text
      recoverability: unrecoverable_in_this_copy
      evidence: >
        Recorded as not_verified_page_level rather than blocked_visual_validation, and the
        distinction is exact: the images are present and were inspected. What cannot be verified is
        how they were ORGANISED. Reflowing destroyed the arrangement the captions describe.
    - pattern: in_figure_text_absent
      affects: >
        Four caption blocks use print-relative position words - "Overleaf:", "Above:", "Right:",
        "center", "far right" - to say which plate each clause describes. In a reflowable EPUB those
        words point at nothing. The caption survives, the image survives, and the BINDING between
        them does not.
      detectability: detected_by_independent_check
      recoverability: unrecoverable_in_this_copy
      evidence: >
        The worked case: one caption names three films. The image beside it, 076, contains two of
        them - In the Mood for Love across the top, Rear Window at the lower right - plus a black
        rectangle where a third plate sat in the printed book. The film named by "Overleaf" is not in
        the image at all. This is a loss shape the corpus had not previously recorded: neither the
        text nor the picture is missing, only the correspondence between them.
    - pattern: text_layer_order_damage
      affects: >
        Section-heading discovery, not the prose. A first sweep using a plain uppercase pattern found
        five of the seven section headings and silently missed the two whose titles contain an
        apostrophe or a quotation mark.
      detectability: detected_by_independent_check
      recoverability: recovered_in_this_copy
      evidence: >
        Both missing headings were found by reading the chapter, and the original worker recorded the
        method lesson explicitly: a completeness check built on a naive pattern can under-report and
        still look like it passed. No prose was lost or reordered.
  claim_resolution_after_inspection: some_underdetermined
  consequence: >
    The caption-to-plate binding loss is the finding this source contributes to area A, and it is
    genuinely new: every visual loss the corpus had recorded before was a missing thing. Here nothing
    is missing and the relationship between two present things is gone. It is unrecoverable in an
    EPUB by construction, not by fault.

evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 27 objects reviewed. This source has no single voice, which is the reason its origin audit is
    the most consequential in the corpus. A statement can be Murch asserting; Ondaatje proposing and
    Murch assenting ("Mm-hm", "Right"); Ondaatje asserting unchallenged; or a named third party
    recalling. Those are different evidential situations and SPEC-03 has no field for a speaker.
  categories:
    - category: source_quotes_named_third_party
      sk_refs: []
      evidence: >
        The chapter interleaves four kinds of text carrying different evidential weight: Ondaatje's
        third-person editorial frame; the transcribed dialogue marked O: and M:; an inset first-person
        contribution from the producer Rick Schmidlin, roughly 400 words, "As if Orson was sending us
        notes"; and photograph captions, some carrying substantive content. Under the frozen method
        the speaker was named in each claim's text and quoted with the source's own O:/M: markers in
        source_terms rather than being given a field. Recorded as LB-15 and deliberately not solved
        by adding a field. No sk_refs are listed because the attribution is per-statement inside
        objects rather than a property of whole objects; enumerating them would assert a precision
        the frozen record does not carry.
    - category: source_author_assertion
      sk_refs: []
      evidence: >
        All 27 objects carry explicitly_stated and practitioner_assertion, and 21 carry anecdotal -
        the highest proportion in the corpus. Murch is a practitioner recounting his own work. The
        source reports no measurement and none carries empirical_within_source or outcome_claimed.
    - category: origin_unresolved
      sk_refs: []
      evidence: >
        Recorded as present-and-unenumerated for the same reason as the first category. Where
        Ondaatje proposes and Murch merely assents, whose claim it is cannot be settled from the
        transcript, and the frozen extraction preserved the exchange rather than deciding. Hedges and
        abandonments were kept for the same reason - "I don't know whether love is the right word",
        "It is and it isn't" - because in a transcript the hedge is often the most accurate part of
        the claim.
  relation_to_evidence_characteristics: >
    The gap here is not the measurement gap Lane C found; it is a SPEAKER gap, and it is adjacent to
    but distinct from the voice problem Lane D found in Catmull and Art & Fear. There the author
    quotes a named colleague inside a work that is otherwise his own. Here the work is a transcript
    in which the bibliographic author is mostly the interviewer. evidence.characteristics cannot
    express either, and the audit records this one without proposing a new field, because one source
    of this shape is not enough evidence to change SPEC-03.

