    - consumer: governance
      outcome: binding_exists
      existing_binding_refs: [bnd_disc_001, bnd_disc_002, bnd_disc_003, bnd_disc_004,
                              bnd_disc_005, bnd_disc_007, bnd_disc_008, bnd_disc_009,
                              bnd_disc_010, bnd_disc_011, bnd_disc_012]
      note: >
        Eleven governance bindings - the heaviest governance skew in the HOLD dock, matching a
        source whose subject is how feedback conversations should be interpreted, scoped and
        run (evidence_interpretation x6, conflict_resolution x2, rule_application x2,
        taxonomy_governance x1).
    - consumer: benchmark
      outcome: no_current_binding
      existing_binding_refs: []
      note: Nothing here is a benchmarkable artifact property.
    - consumer: human_workflow
      outcome: candidate_no_binding_made
      existing_binding_refs: []
      note: >
        The critique frameworks, facilitation rules and session procedures are working
        procedure for people - the runbook's own classification of this candidate
        (human_workflow consumer, low weak-model runtime value); no workflow binding was made
        and none is manufactured here.
    - consumer: deterministic_composition
      outcome: no_current_binding
      existing_binding_refs: []
      note: Nothing exactly executable.
  unbound_knowledge_of_note:
    - sk_refs: [sk_disc_0024]
      observation: >
        The discriminating-power test for design principles (a good principle eliminates more
        design ideas than it retains) is the span's most reusable evaluation idea and
        currently binds only through governance.
  conclusion: >
    Fit matches the source's nature: governance-dominant doctrine about running critique,
    with human workflow as the real consumer and near-zero direct runtime value for a weak
    model - exactly the runbook's rank rationale for scheduling it late.

