representation_integrity:
  delivery_format: publisher_epub
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    University of California Press EPUB reprinting the 1949 text. An EPUB reflows; no printed page
    exists in the file. Every object in the extraction locates itself by section rather than page.
  inspection_state: inspected_figure_level
  visual_argument_role: figure_carries_content
  observed_loss_patterns:
    - pattern: heading_carried_as_image
      affects: >
        Every chapter- and section-level heading is an SVG of glyph outline paths - a drawing of
        the words - with an empty alt attribute. The six section titles of chapter 2 exist nowhere
        in the text layer, while the 39 deeper headings are ordinary text and extract cleanly.
      detectability: silent
      recoverability: recovered_in_this_copy
      evidence: >
        R-01. The result is not a chapter that looks damaged, it is a chapter that looks FLAT: 39
        topics in a row with no sign that thirteen of them belong inside one section called "The
        Theory of Illumination". A text-only extractor would produce a coherent-looking, wrongly
        structured reading and have no reason to doubt it. Losing all the headings would have been
        more honest than losing half of them from the top. Caught by listing image references and
        noticing that subheadings sat under no heading; rasterising the twenty SVGs recovered every
        section title.
    - pattern: figure_inspected_claim_underdetermined
      affects: >
        Alton offers Figures 83 and 84 for the claim that "both are flat surfaces, yet one gives a
        sensation of depth and the other does not". The text never says which one. Neither figure
        carries a verdict label, unlike the Wrong/Right pair three pages earlier. Both read as a
        tunnel.
      detectability: named_by_text
      recoverability: unrecoverable_in_this_copy
      evidence: >
        R-02. Recorded in the frozen record as extraction_uncertainty: ambiguous_referent rather
        than resolved by inference from the neighbouring rule, which would have been a guess
        dressed as a reading. The missing element is not the picture but the pairing of picture to
        verdict.
  claim_resolution_after_inspection: some_underdetermined
  consequence: >
    This source breaks the batch's working assumption that inspecting the figure recovers what the
    text lost. Here the figures were inspected and one claim is still not settled. A source marked
    verified at figure level can therefore overstate what was recovered, which is precisely why
    claim_resolution_after_inspection is a separate field from inspection_state.

evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 27 objects carry practitioner_assertion and none carries empirical_within_source. Alton
    writes as a working cinematographer stating what the studio does.
  categories:
    - category: source_author_assertion
      sk_refs: []
      evidence: >
        All 27 objects. No study, no measurement, no attributed third party anywhere in the
        processed chapter.
  relation_to_evidence_characteristics: >
    Trivial in area B and the most consequential source in the corpus for area E. The two are
    independent questions and this source proves it: uniform claim origin, radically non-uniform
    durability.

