technology_contingency:
  applicable: true
  applicability_basis: >
    A 1949 technical manual about motion-picture lighting, processed 77 years later. The subject is
    a craft executed with equipment and film stock that no longer exist, so the durability question
    is live for every claim in it.
  assessed: true
  classes:
    - class: durable_mechanism
      sk_refs: [sk_alt_c003_0011, sk_alt_c003_0012, sk_alt_c003_0013]
      evidence: >
        Physical geometry that has not dated - one source renders a solid flat, matching tones lose
        their edge, an angle reveals form. These are optical facts about light and surfaces and are
        as true of a sensor as of 1949 nitrate.
    - class: technology_contingent
      sk_refs: [sk_alt_c003_0003, sk_alt_c003_0004, sk_alt_c003_0005, sk_alt_c003_0006, sk_alt_c003_0018]
      evidence: >
        Claims whose validity expired with their technology: the instrument catalogue, shiny props
        being wanted BECAUSE of antihalo film, the requirement that every negative be normally
        exposed. All carry historical_claim in the frozen record.
    - class: historical_convention
      sk_refs: [sk_alt_c003_0021]
      evidence: >
        One studio convention of the period stated as technical fact - that high reflectors are
        unfavourable to feminine faces. Carries both historical_claim and culturally_bounded in the
        frozen record, which is the correct pair and was applied by hand.
    - class: uncertain
      sk_refs: [sk_alt_c003_0024, sk_alt_c003_0025, sk_alt_c003_0026]
      evidence: >
        Carry historical_claim but the audit cannot decide from the repository record alone whether
        the underlying claim is about optics or about 1949 practice. Recorded as uncertain rather
        than resolved, because resolving it would need the book re-opened and CANON-004 forbids
        that where the repository record is silent.
  existing_characteristics_relied_on: [historical_claim, culturally_bounded]
