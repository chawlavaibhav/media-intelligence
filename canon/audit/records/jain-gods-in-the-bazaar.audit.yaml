# ── A. Representation integrity ─────────────────────────────────────────────
representation_integrity:
  delivery_format: native_digital_pdf
  page_addressability: authored_pages
  page_addressability_evidence: >
    A born-digital publisher's typeset PDF: Creator DVIPSONE 2.2.3, Producer Acrobat Distiller 8.0.0,
    with the book's own imprint page recording its typesetting ("Typeset in Adobe Jenson Pro by Tseng
    Information Systems, Inc."). Real printed folios are present. The mapping is printed = pdf - 13,
    established mechanically before any locator was written and verified at three independent points:
    pdf 60 and 62 carry printed folios reading 47 and 49, and the chapter-1 running head appears on
    the facing pages. The offset is constant. Every provenance block in the frozen record carries a
    printed page range together with a chapter and section. No page number was interpolated.
  inspection_state: inspected_figure_level
  visual_argument_role: figure_carries_content
  observed_loss_patterns:
    - pattern: no_loss_detected
      affects: "the text layer, its ordering, and completeness"
      detectability: detected_by_independent_check
      recoverability: not_applicable
      evidence: >
        THE CLEANEST OF THE THREE COPIES ADDED IN THIS PASS, and checked rather than assumed. This is a
        publisher's typeset PDF, not a scan and not a conversion: there is no OCR error class at all,
        ligatures and diacritics survive, and the prose extracts in order across all 449 pages. A
        duplicate-sentence scan for sentences above 90 characters returned exactly ONE hit and it is
        not damage - it is a boilerplate permissions line ("Reprinted with the permission of the
        copyright-holder and the publishers, Sage Publications India Pvt.") which legitimately appears
        twice in the Acknowledgements because two chapters were previously published with the same
        press. Completeness was checked against the book's own contents page: Notes on Style,
        Acknowledgments, Introduction, chapters 1-7 across three parts, Conclusion, Notes, Works Cited
        and Index all present and all resolving.
    - pattern: source_evidence_never_printed
      affects: "colour in the figures the book itself reproduces in monochrome"
      detectability: named_by_text
      recoverability: unrecoverable_in_this_copy
      evidence: >
        A property of the publication, not of this copy, and recorded so it is not confused with
        digitisation loss. Some figures are printed in black and white in the book - fig. 138 among
        those inspected. Because COLOUR SATURATION IS ITSELF ONE OF THIS SOURCE'S ARGUMENTS, monochrome
        reproduction bounds what such a figure can be used to show. This was handled rather than noted:
        no claim about colour in the frozen record rests on a monochrome figure, and sk_jgb_0020 rests
        on fig. 88, which is in colour and which photographs a print beside its original painting.

  # Coverage bound, deliberately NOT recorded as a loss pattern: nothing is missing from the copy.
  # The Gate's loss vocabulary describes damage to the artefact, and using one of its terms for an
  # intact source would misdescribe it. The bound is stated here instead, and in the ledger.
  inspection_coverage_bound:
    not_inspected: "approximately 149 of approximately 156 numbered figures"
    blocked: false
    evidence: >
      The visual pass was PARTIAL and its bounds are stated exactly: seven figures rendered and read,
      approximately 149 not. Bounded by cost, not blocked - the copy is complete and born-digital, the
      page mapping is established, and any figure can be rendered on demand. No claim in the frozen
      record rests on an uninspected figure. The seven were chosen by argument load, so the set is NOT
      a sample and nothing about the remaining figures may be inferred from it.

  claim_resolution_after_inspection: some_underdetermined
  consequence: >
    THIS WAS THE MOST PRODUCTIVE VISUAL PASS OF THE THREE RUN IN THIS BATCH, and the reason is
    structural: Jain's constraints are claims about what an artefact LOOKS LIKE - a face turned out of
    frame, an unmuscled body in battle, a print more saturated than its painting - and are therefore
    settleable by looking. Six were checked and all six hold. Fig. 88 is especially valuable because it
    is a controlled comparison, photographing a printed Hanuman beside the original painting it was
    made from; the print is visibly more saturated and higher in contrast, so the effect of the
    retouching stage is observed directly rather than taken from the caption. Fig. 92 shows a woman
    watching television with her face turned frontally out of the frame, watching the screen from the
    corner of her eye - the front-looking imperative visible in a single naturalistically implausible
    pose. Fig. 93 shows Ram and Lakshman drawing bows in battle with half-lidded eyes and unmuscled
    bodies.

    The resolution is SOME_UNDERDETERMINED for a precise reason that must not be lost. Inspection
    establishes that the constraints are real and visible in the artefacts. It establishes NOTHING
    about why they exist, nothing about whether the reasons practitioners give for them are true, and
    nothing whatever about what any viewer does with such an image. The reasons remain practitioner
    testimony, bounded by sk_jgb_0180; the audience-level claims remain unmeasured, here as everywhere
    in this book.

# ── B. Evidence and claim origin ────────────────────────────────────────────
evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 18 objects classified. This source has a MIXED evidential form, and separating its parts is the
    main work of this section: first-hand ethnographic fieldwork carried out by the author 1994-2001;
    doctrine and history reported from named scholars; and theoretical positions argued from
    Euro-American theory and illustrated by cases. The author states her own bound on the first of
    these, and it is extracted as sk_jgb_0180.
  categories:
    - category: source_own_measurement_reported
      sk_refs: [sk_jgb_0020, sk_jgb_0040, sk_jgb_0050, sk_jgb_0060, sk_jgb_0070, sk_jgb_0090]
      evidence: >
        Six objects rest on the author's OWN systematically collected first-hand evidence: interviews
        with named artists, printers, publishers, agents and consumers conducted 1994-2001 (building on
        1991-92 work), plus direct observation of the industry's structure and functioning in Sivakasi,
        Delhi, Mumbai, Nathdwara, Chennai and Madurai. She names her informants and thanks them
        individually, and the granularity reflects a trained visual-communication designer: retouching
        times per separation, plate counts, file assembly, letterpress overprinting, agents' markups.

        THE CATEGORY NAME OVERSTATES ONE THING AND THIS IS RECORDED RATHER THAN GLOSSED. This is
        ETHNOGRAPHIC OBSERVATION, not quantitative measurement. Nothing here was counted, sampled or
        instrumented; there is no sample size anywhere in the book. The category is used because it is
        the only one in the controlled vocabulary that correctly asserts the evidence is the SOURCE'S
        OWN rather than reported from elsewhere, and because the frozen record's
        empirical_within_source characteristic on exactly these six objects means what it says: the
        author gathered this evidence herself. An auditor should read this category, for this source,
        as "the author's own first-hand field evidence, unquantified".
    - category: source_quotes_named_third_party
      sk_refs: [sk_jgb_0080, sk_jgb_0130, sk_jgb_0110, sk_jgb_0160]
      evidence: >
        Four objects are reported from named scholars, and the record keeps the attribution rather than
        absorbing it into the author's voice: the enabling-technique reading of realism from Geeta
        Kapur; the aesthetics of presence from Richard Davis; meta-popularity from Michael Warner and
        mimetic desire from René Girard; and the iconographic shift in depictions of Ram from Anuradha
        Kapur. In two of these the author is arguing AGAINST the scholar she cites - she rejects
        Anuradha Kapur's explanation of the muscular Ram while accepting the shift, and she positions
        her account of naturalism against Christopher Pinney's "naturalist blip". The frozen record
        carries the disagreements.
    - category: source_author_assertion
      sk_refs: [sk_jgb_0010, sk_jgb_0030, sk_jgb_0100, sk_jgb_0120, sk_jgb_0140,
                sk_jgb_0150, sk_jgb_0170, sk_jgb_0180]
      evidence: >
        Eight objects are the author asserting or arguing in her own voice. Two of these are the
        record's most important bounds and are assertions ABOUT HER OWN WORK rather than about calendar
        art: sk_jgb_0180 states what her interview evidence is and is not, and sk_jgb_0170 is her
        closing denial that images are powerful in themselves. Two are methodological positions
        (sk_jgb_0100 on the limits of a juridical frame, sk_jgb_0120 on critique as performative) and
        establish no fact about any image. sk_jgb_0150, on the post-liberalisation landscape, is an
        interpretive characterisation drawn from one firm's transformation observed at two points.

        Note that sk_jgb_0010 and sk_jgb_0030 appear here rather than under the author's own field
        evidence although they are attested from interviews. The reason is deliberate: what those
        objects assert is a CONSTRAINT the industry works under, which is field-attested and was
        confirmed against the plates; but the REASON given for the constraint is a practitioner's
        theory of his own customers, which is neither the author's measurement nor a named third
        party's, and the objects' caveats separate the two.
    - category: measurement_claimed_result_not_supplied
      sk_refs: []
      evidence: >
        Recorded as EMPTY after checking. There is no claim anywhere in this source about what a
        measurement returned or would have returned. This is worth stating positively because the book
        is confident in tone and dense with specifics, and a reader could mistake its ethnographic
        precision for measurement.
  relation_to_evidence_characteristics: >
    Six objects carry empirical_within_source in the frozen record and exactly those six appear under
    source_own_measurement_reported; no object carrying the characteristic appears under a category
    asserting the measurement was not the source's own, and no object lacking it appears under
    source_own_measurement_reported. The consistency rule is satisfied in both directions
    non-trivially, which distinguishes this source from dwyer_patel_cinema_india and
    pandey_pandeymonium on this branch, where it is satisfied trivially because nothing is empirical.

    THE THING AN AUDITOR SHOULD NOTICE: this is the only source in the CANON-014 batch with first-hand
    field evidence of its own, and it is therefore the one most at risk of being over-read. What the
    fieldwork establishes is WHAT PRACTITIONERS SAY AND DO. It does not establish that their theories
    of their audience are true, and the author says so herself in the passage extracted as sk_jgb_0180:
    her interview accounts are "not so much ... transparent, consistent truths but ... narratives,
    produced largely for my benefit". That bound is grouped as scs_jgb_002 with the objects that depend
    on it, so it cannot be retrieved separately from them.

# ── C. Application fit ──────────────────────────────────────────────────────
application_fit:
  audited: true
  findings:
    - consumer: creative_ir
      outcome: no_current_binding
      note: >
        Considered and declined, despite this being the source with the most artefact-level material in
        the batch. The constraints it documents - frontality, the unmuscled divine body, saturated
        colour, regional attribute codes - are requirements of ONE IDIOM, stated by practitioners
        working inside it, and the author warns that they are "primarily discursive categories, part of
        the bazaar's self-understanding" rather than observed regularities of the artefacts. Installing
        any of them as a Creative IR field would convert a description of one tradition's requirements
        into a general statement about what an artefact should be.
    - consumer: production_ir
      outcome: binding_exists
      existing_binding_refs: [bnd_jgb_0004]
      note: >
        One, and a CANDIDATE ONLY: status production_candidate with target_path null, because
        Production IR does not exist (PROJECT-CONTRACT separation 2). It binds the existence and shape
        of two idiom constraints - the returned gaze and the non-muscular divine body - for work
        intended to function within the tradition the source studies, on the ground that a generator
        working from generic naturalist priors will violate both by default. Both were confirmed
        first-hand against the plates in this pass. The binding's limits carry the source's discursive
        warning AND require sk_jgb_0160 to travel with it, because the muscularity injunction was
        breached from the late 1980s and the source's own chapter 7 is about that breach.
    - consumer: evaluation
      outcome: binding_exists
      existing_binding_refs: [bnd_jgb_0003]
      note: >
        One, and it is a DISTINCTION this project's evaluation work does not currently have a name for:
        the difference between a criterion that grades an artefact and one that determines whether it
        functions at all. In this tradition iconographic correctness is the second kind - an incorrect
        icon is held not to be a worse image but a vacant one - and the trade's behaviour follows,
        with artists reporting accuracy as the main thing changed before a design goes to press. What
        is established is that the TRADE behaves this way; that buyers reject incorrect images is
        imputed to consumers by printers, at one remove, and is not bound. No criterion in this project
        is classified by the binding and no threshold is adopted.
    - consumer: governance
      outcome: binding_exists
      existing_binding_refs: [bnd_jgb_0001, bnd_jgb_0002, bnd_jgb_0005]
      note: >
        Three, and the strongest fit. One binds a fully documented case of a production convention
        outliving the constraint that produced it: manual colour retouching, begun to compensate for
        poor filters and insensitive film, retained in software after digital scanning made it
        unnecessary. One binds the structural reason a purchase signal is not a preference signal when
        the purchaser is not the viewer - the calendar file indexes what publishers think clients want,
        which indexes how those clients want to be seen. One binds the treatment of practitioner
        testimony, including the author's own demonstration that a finding can be derived from the gap
        between what informants say and what they do.
    - consumer: benchmark
      outcome: candidate_no_binding_made
      note: >
        One, and it is deliberately the weakest binding in the batch. Jain reports one dimension along
        which artefacts here are in fact discriminated by the people who commission them, and which is
        unlike almost everything else in these three books: conformity to an explicit, enumerable,
        regionally differentiated attribute code. It is bound as INFORMING what such a dimension would
        look like and for nothing else. NO THRESHOLD IS ADOPTED AND NONE EXISTS: the source supplies an
        illustrative list from informants, not a code, does not claim it is complete or current, and
        does not report that any prints were surveyed against it. Constructing a scorable code from
        this material would be inventing a benchmark, which this project forbids, and the binding says
        so.
        CANON-014 FINAL RECONCILIATION: THE BINDING THIS FINDING NAMED HAS BEEN REMOVED and the
        outcome is now `candidate_no_binding_made`. bnd_jgb_0006 carried role `informs`, which
        SPEC-04 does not define, and its own rationale said it was bound as INFORMING what such a
        dimension would look like "and for no other purpose" - an honest description of something
        that is not a binding. The observation survives in sk_jgb_0040 and sk_jgb_0070. No
        threshold was adopted before and none is adopted now.
    - consumer: deterministic_composition
      outcome: no_current_binding
      note: >
        Nothing executable and nothing specifiable, despite the surface temptation. The frontality
        requirement sounds composable and is not: the source gives no angle, no tolerance and no test,
        and its own examples show the constraint being satisfied by a compositional judgement (a face
        turned out of frame while an action continues to the side) rather than by a parameter. Deriving
        a numeric rule from this material would be invention.
    - consumer: human_workflow
      outcome: candidate_no_binding_made
      note: >
        A genuine fit and deliberately no binding. All four repair terms in the frozen ontology act on a
        person or a process and each names its executor: ask whether a convention's cause still holds
        (whoever maintains it); count the parties a demand signal passed through (whoever interprets
        it); classify a criterion as enabling or grading (whoever designs the inspection); record who
        was asking (whoever collects testimony). None is a test, and the source supplies no instrument
        for any of them. Naming a fit is not creating a binding.
  unbound_knowledge_of_note:
    - sk_refs: [sk_jgb_0100, sk_jgb_0110, sk_jgb_0120, sk_jgb_0170]
      observation: >
        The book's theoretical core - the limits of a juridical frame, meta-popularity and the
        triangulated gaze, critique as performative, and the closing position that images are not
        powerful in themselves - is retained and bound to nothing. These are positions argued from
        theory and illustrated by cases, several of them episodes of real political violence. They are
        the most intellectually interesting material in the source and the least suited to a binding,
        because binding them would convert a contested position in cultural criticism into an
        operational premise.
    - sk_refs: [sk_jgb_0160, sk_jgb_0150]
      observation: >
        Deliberately unbound and for opposite reasons. sk_jgb_0160, the muscular Ram, is the least
        evidentially secure object in the record: the shift is well attested and accepted from another
        scholar, but the explanation is the author's own counter-proposal offered in a chapter she
        introduces as "an experiment" whose narrative "unapologetically index[es] a certain will to
        power". sk_jgb_0150, the post-liberalisation characterisation, is bounded not by its evidence
        but by its date: it describes a media landscape observed to roughly 2004-06 and predates the
        Indian smartphone and streaming eras entirely.
    - sk_refs: [sk_jgb_0080]
      observation: >
        Realism as an enabling technique detached from its philosophical schema is genuine and useful
        knowledge with no consumer here. It is an art-historical claim about a colonial encounter, and
        this project has nothing that consumes it.
  conclusion: >
    Six bindings from eighteen objects, twelve unbound, none to Creative IR, one production candidate
    with no target and one benchmark binding that explicitly adopts nothing.

    This is the most operationally useful of the three sources added in this pass and therefore the one
    most at risk of being turned into a rule set. It is not one. What it contributes is four things:
    a documented case of a convention outliving its cause; a structural account of why a purchase
    signal is not a preference signal; a distinction between enabling and grading criteria that this
    project's evaluation work lacks a name for; and two idiom constraints, confirmed against the
    artefacts, that a generator working from naturalist priors would violate by default. Everything
    else is art history, political economy and cultural criticism with no consumer here.

# ── D. Lineage and independence ─────────────────────────────────────────────
lineage:
  authors: ["Kajri Jain"]
  publisher: "Duke University Press"
  series: "Objects/Histories: Critical Perspectives on Art, Material Culture, and Representation (series editor Nicholas Thomas)"
  first_published: 2007
  copy_edition: >
    Duke University Press, 2007, published with assistance from the Getty Foundation, printed in
    Canada. The supplied filename and the book's imprint page AGREE on publisher and year, which is
    worth stating because neither of the other two sources added in this pass has that property.
  related_sources_in_corpus:
    - source_id: dwyer_patel_cinema_india
      relation: cites_source
      evidence: >
        The relation is real, directional, and runs the OTHER WAY from this source. Dwyer and Patel
        (2002) cite Kajri Jain by name in their chapter 2, note 9 - "Kajri Jain, 'Gods in the Bazaar',
        South Asia, XXI/1 (1998)" - which is the journal article this book grew out of five years
        later. THIS BOOK DOES NOT CITE DWYER AND PATEL, and the citation it receives predates it.
        The relation is recorded here symmetrically with that record so the pair reads the same from
        either side.

        The two share a substantial third-source milieu: Christopher Pinney on chromolithography and
        Camera Indica, Geeta Kapur on frontality and iconicity, Ashish Rajadhyaksha on Phalke, Tapati
        Guha-Thakurta, Patricia Uberoi, Partha Chatterjee. Both treat Ravi Varma, chromolithography and
        the Bombay School of Art, and both discuss the artist S. M. Pandit.

        THIS DOES NOT DEFEAT INDEPENDENCE. cites_source is not among the dependency-defeating
        relations, the citation is to a third party's earlier article, and no claim in either record
        rests on the other. What it DOES require, and what has been done, is that no cross-source
        concept be created: frontality and iconicity are held as source-local terms in each record with
        each source's own gloss, because the two authors do not use them identically - Dwyer reports
        Geeta Kapur's formal category and applies it to cinema, while Jain treats frontality as a
        functional requirement of ritual use with a stated devotional mechanism. Recorded pairwise in
        canon/findings/CANON-014-CANDIDATE-LINEAGE-MATRIX.yaml.
    - source_id: parameswaran_nawabs_nudes_noodles
      relation: no_known_relation
      evidence: >
        Tested and rejected, and the result is more interesting than a bare rejection. Both describe
        Indian commercial visual culture of overlapping decades, but from institutionally SEPARATE
        arenas, and Jain's chapter 1 argues for exactly that separation: the vernacular print trade of
        Sivakasi publishers and mobile agents on one side, and the English-medium corporate advertising
        agencies on the other, with "little use for calendar artists' skills". Parameswaran writes from
        inside the second. The pair is therefore COMPLEMENTARY rather than corroborating - two accounts
        of arenas the first source says did not meet - which is recorded as an observation in the
        lineage matrix and from which no promotion follows. Different authors, publishers, works and
        evidence; neither cites the other.
    - source_id: bijapurkar_we_are_like_that_only
      relation: no_known_relation
      evidence: >
        Different authors, publishers, disciplines and evidence bases; neither cites the other. Both
        concern Indian consumers in overlapping decades, which is subject adjacency and not shared
        origin.
    - source_id: pandey_pandeymonium
      relation: no_known_relation
      evidence: >
        Different authors, publishers, works and evidence; neither cites the other.
  # Relations to sources that are durable CANON-014 candidates rather than accepted Canon.
  # They carry no Audit Gate record - a HOLD source must never have one - so they cannot sit
  # in `related_sources_in_corpus`, whose entries the Gate resolves against existing records.
  # The relation itself is unchanged and is recorded pairwise in
  # canon/findings/CANON-014-CANDIDATE-LINEAGE-MATRIX.yaml, which is its durable home.
  related_candidate_sources_outside_accepted_corpus:
    - source_id: desai_mother_pious_lady
      relation: no_known_relation
      evidence: >
        Different authors, publishers, works and evidence; neither cites the other. Both concern Indian
        everyday visual and material culture, which is subject adjacency.
  independence_verdict: independent_origin
  independence_basis: >
    No shared author, work, series, publisher or primary informant with any of the 19 live accepted
    sources or with any of the other four CANON-014 candidates, checked pairwise against the full live
    list. This source's evidence is its own fieldwork, conducted by the author with named informants
    she identifies, and no other source in the corpus draws on those informants.

    THE ONE RELATION THAT REQUIRED A DECISION is the citation from dwyer_patel_cinema_india, recorded
    above. It is recorded as cites_source, which does not defeat independence, and it runs INTO this
    source from an earlier work rather than out of it - this book cites Dwyer and Patel nowhere.

    RECORDED AS AN OBSERVATION AND NOT AS A CONVERGENCE: this source and dwyer_patel_cinema_india
    describe overlapping visual conventions (frontality, the returned gaze, the iconic image) and draw
    on an overlapping literature. They are independent, so promotion would not be BLOCKED by lineage -
    but no cross-source promotion is authorised by CANON-014, none was created, and there is a
    substantive reason for caution recorded in the matrix: the two authors use the shared terms
    differently, one as a formal art-historical category and one as a functional requirement with a
    devotional mechanism. Merging them would assert an equivalence neither author states.
  extractor_exposure:
    spec_contains_examples_from_this_source: false
    evidence: >
      SPEC-03, SPEC-04 and SPEC-05 quote Molly Bang, Lupton, Ogilvy and Light: Science & Magic. None
      quotes this source, which was not in the corpus when the specs were written.

# ── E. Technology contingency ───────────────────────────────────────────────
technology_contingency:
  applicable: true
  applicability_basis: >
    Applicable, and unusually so: this source documents a technology transition WHILE IT IS HAPPENING
    and treats the transition itself as evidence. Its fieldwork spans 1994-2001, exactly the period in
    which the Sivakasi industry moved from manual pre-press to digital, and one of its most useful
    findings - that manual retouching persisted in software after scanning made it unnecessary - is
    available only because the author was present across the change. It also documents a shift in the
    industry's economics (Sivakasi losing the calendar trade to higher-quality metropolitan presses)
    and a shift in the wider media landscape after liberalisation. A source of this kind cannot be
    assessed as though its content were timeless.
  assessed: true
  classes:
    - class: durable_mechanism
      sk_refs: [sk_jgb_0020, sk_jgb_0060, sk_jgb_0130, sk_jgb_0100]
      evidence: >
        Four mechanisms that do not depend on the technology that revealed them, and these carry three
        of the six bindings. A convention outliving the constraint that produced it is a general hazard
        and this source documents one instance end to end - the technical justification for retouching
        lapsed and the practice did not. A purchase signal encoding the purchaser's self-presentation
        rather than the viewer's preference is a property of any gift-advertising structure, not of
        calendars. The distinction between an enabling condition and a grading criterion is a property
        of criteria. And the observation that a frame which asks only whether an image is adequate to a
        truth cannot see properties residing in its circulation is a methodological point about frames.
        DURABLE here means not period-bound; it does not mean measured, and none of these is measured.
    - class: technology_contingent
      sk_refs: [sk_jgb_0020, sk_jgb_0050, sk_jgb_0150]
      evidence: >
        Three objects depend on specific production or distribution technology, and sk_jgb_0020 is
        listed in both classes deliberately: the retouching PRACTICE is contingent on offset pre-press
        and on the specific film, filters and lighting available in Sivakasi, while the FAILURE SHAPE it
        exemplifies is not. The vernacularizing-capitalism account depends on a particular mix of
        centralised offset and local letterpress that made personalised short runs economic. And
