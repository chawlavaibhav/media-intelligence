briefs:
- brief_id: B01
  title: RentOK vertical video ad (Indian hostel/PG software)
  text: 'I am RentOK. Create a commercially strong vertical video ad for owners who run hostels and PGs
    in India. Managing rent collection, tenant records, KYC, move-outs, complaints and compliance through
    WhatsApp, notebooks or scattered spreadsheets creates leakages and missed follow-ups. Make that operational
    chaos painfully recognisable and then position RentOK as the clean system for managing the property.
    It should feel contemporary, credible and Indian, not like a generic Silicon Valley SaaS explainer.
    You may use only RentOK''s official website, https://rentok.com, for company, product and brand information.
    Target duration: about 30 seconds. Aspect ratio: 9:16.'
  sha256_of_committed_file: 944a0a7edd62bcc3f8dcab670a0aed3fffc06bb29e8df1beb6b103e014023cff
- brief_id: B02
  title: aight festive promotional poster (media-generation API pricing)
  text: 'I am aight. Create one premium promotional poster for our media-generation API for Indian businesses
    during the festive season. The key commercial proposition is: image generation at ₹9 and video generation
    at ₹99. Both prices must be immediately understandable, but the design must still feel like a serious
    AI infrastructure/product company rather than a discount retail flyer. Make typography and information
    hierarchy do most of the work. You may use only aight''s official website, https://getaight.ai, for
    product and brand information. Deliverable: one 4:5 poster.'
  sha256_of_committed_file: 1974ed4998e88de52cf50cc79c94f64c5573959355cd2e0d0b4a64c686dff87a
- brief_id: B03
  title: mosambi sparkling drink premium advertising image
  text: Create one premium 4:5 advertising image for a new Indian sparkling drink made from mosambi and
    sparkling water. It is aimed at urban consumers aged roughly 22–35. The product should feel refreshing,
    sophisticated and culturally contemporary while still retaining the familiarity of mosambi. Avoid
    clichéd "Indian" visual shorthand and avoid making it look like a cheap soft drink. The product must
    be the unmistakable hero. No celebrity and no external website.
  sha256_of_committed_file: 896df798a0f91b8fbb3af461051248675d746e3a95b78bc0b62b95bba4123492
- brief_id: B04
  title: Indian D2C skincare UGC performance video
  text: 'Create a 9:16 performance-oriented UGC video for a fictional Indian D2C skincare brand. The product
    is a fragrance-free 2% salicylic-acid facial serum for adults with oily, blemish-prone skin. One believable
    Indian woman should speak directly to camera, naturally demonstrate the product and communicate one
    clear purchase reason. It should feel like credible creator content rather than a polished television
    commercial, while remaining visually controlled and commercially usable. Do not invent clinical statistics,
    guarantees or medical claims. Target duration: about 25 seconds. No external website.'
  sha256_of_committed_file: 0d2b8a86fbc34551c2e10457beb104fd14160f136d759ee3d3ecee01456115ce
- brief_id: B05
  title: two-person café dialogue scene, six shots
  text: 'Create a short cinematic scene between two people sitting opposite each other at a café table.
    One person has discovered that the other concealed something important. The dialogue is tense but
    restrained; nobody shouts. The viewer must always understand where each person is in relation to the
    other. Use exactly six shots. Avoid elaborate camera movement. The scene should feel cinematic rather
    than mechanically covered. Target final duration: about 40 seconds. Aspect ratio: 16:9. No external
    website.'
  sha256_of_committed_file: a5450117410e01e6eb8889977e463e6f697f0e6fb42f524c70784a254cd510c6
- brief_id: B06
  title: Aster Meridian 38 watch e-commerce hero image
  text: 'Create one premium 4:5 e-commerce hero image for a fictional mechanical watch called the Aster
    Meridian 38. Product facts are fixed: 38 mm brushed stainless-steel case, deep blue sunburst dial,
    silver baton hour markers, silver dauphine hands, no date window, domed sapphire crystal and a dark
    brown leather strap. The image must communicate craftsmanship, dial detail, material quality and wrist-watch
    desirability while remaining commercially useful on a premium product page. Product geometry and details
    must not be casually altered. Avoid generic floating-product CGI unless the creative idea genuinely
    requires it. No external website.'
  sha256_of_committed_file: 27391665eb56d62f9788329ce994dabcb2a8f152073843594caf6bef74ab8ff4
