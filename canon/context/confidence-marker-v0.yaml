# ── MARKER-SCHEME.md ─────────────────────────────────────────────────────────
marker_scheme_md: |
  # MARKER SCHEME v0

  STATUS: PROPOSED — Canon-stream worker output; no Controller decision adopts it;
  coordination/CONTROL-STATE.md governs.

  ## What a marker is

  A marker is a compact label of a claim's evidence character, computed as a pure
  function of the claim's committed fields. It is attached to every compiled claim so
  a weak consuming model inherits the corpus's honesty for free. A marker is NOT a
  score: it does not rank sources, prefer claims, or arbitrate contradictions
  (contradiction arbitration is the compiler's job via scoped resolution rules).

  ## Why the corpus needs it

  The accepted corpus is 677 objects across 24 sources. Its evidence profile:
  503/677 (74.3%) carry practitioner_assertion; only 25/677 (3.7%) carry
  controlled_comparison; 1082 of 1408 caveats (76.8%) were observed by the extractor
  rather than stated by the source. A compiled pack that presents this material
  unlabelled overstates it. Recompute: iterate yaml.safe_load over
  canon/knowledge/current/*/source-knowledge.yaml counting evidence.characteristics
  values and caveats[].origin values; or run
  `python3 canon/compilation/assign_markers.py --check`.

  ## The rule (deterministic, committed-fields only)

  Base grade — exactly one, first match wins:
  - MEASURED: evidence.characteristics intersects
    {controlled_comparison, empirical_within_source} — 59/677.
  - REASONED: 'mechanism_given' present — 337/677.
  - ASSERTED: otherwise — 281/677.

  Orthogonal flags — any subset, rendered in this order:
  - CONTESTED (85): an undirected in-source contradicts partner exists. Stored
    direction is extractor choice, so the edge is symmetrised before testing.
  - QUALIFIED (167): a qualifies/qualified_by partner qualifies THIS object (it is the
    target of a stored 'qualifies' edge or the holder of a stored 'qualified_by' edge).
  - DATED (110): 'historical_claim' in characteristics.
  - CULTURE-BOUND (84): 'culturally_bounded' in characteristics.
  - FIGURE-UNVERIFIED (122): provenance.figure_refs nonempty and
    provenance.inspected.figures empty.

  Suffixes on the base grade:
  - '-our_reading' (21): claim_type == source_interpretation.
  - '-hedged' (634): any caveat has origin extractor_observed.

  Origin count — DECISION level only:
  - SINGLE-ORIGIN / MULTI-ORIGIN(n) from the decision's domain
    independent_origin_count in canon/planning/CANON-V1-LIVE24-COVERAGE.yaml.
  - Claim-level cross-source consensus is uncomputable today: 0 of 189 committed
    ontology relationship rows cross a source boundary and 0 cross_source_concept
    rows exist. No marker may claim that two sources agree on a claim, and none does.
    A later ontology join pass can upgrade this without changing the scheme's shape.

  ## Rendering

  `[BASE{suffixes}|FLAGS...|ORIGIN?]`, e.g. `[REASONED|CONTESTED|MULTI-ORIGIN(2)]`,
  `[ASSERTED-hedged|DATED|SINGLE-ORIGIN]`. The origin token appears only on rendered
  DECISIONS, never on an individual claim. The legend (above, <=120 tokens) is
  injected once per system prompt.

  ## Companion annex

  canon/planning/PROPOSED-claim-dating-annex-v1.yaml joins the audit records'
  technology_contingency classes onto sk ids (9 of 24 records applicable=true) and
  adds the distinct marker class medium_transfer_untested for film/print-era
  pacing/attention/hook claims whose transfer to 6-20s vertical feed video is
  untested per GAP-LEDGER G2/G5 — flagged as untested, not presumed false, and not
  presumed true.
