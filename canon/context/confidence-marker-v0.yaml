# confidence-marker-v0.yaml
# STATUS: PROPOSED — Canon-stream worker output; no Controller decision adopts it;
# coordination/CONTROL-STATE.md governs.
#
# Deterministic confidence-marker decision table for the 677 accepted sk objects.
# Consumed by canon/compilation/assign_markers.py, which is the reference implementation;
# every expected_count below is recomputed by tests/test_assign_markers.py from committed
# yaml and any drift fails the build. This scheme LABELS evidence character. It never
# ranks sources and never scores claims (PR #84 anti-score rule G6, preserved in spirit:
# a marker is a description of how a claim is evidenced, not a preference between claims).

artifact: confidence-marker-v0
status: PROPOSED
stream: canon
addresses_gap: GAP-12
inputs:
  - canon/knowledge/current/*/source-knowledge.yaml   # 24 accepted sources, 677 objects
  - canon/planning/CANON-V1-LIVE24-COVERAGE.yaml      # decision-level origin counts only
reference_implementation: canon/compilation/assign_markers.py
outputs:
  - canon/compilation/marker-map-v0.yaml
  - canon/planning/PROPOSED-claim-dating-annex-v1.yaml

# ── Decision table ────────────────────────────────────────────────────────────
# Pure function of committed fields. No judgment calls in code: every predicate
# below names the exact committed field it reads. First matching base rule wins;
# flags are orthogonal (any subset); suffixes append to the base grade.

decision_table:
  base_grade:
    evaluation: first_match_wins_exactly_one_per_object
    rules:
      - grade: MEASURED
        condition: >-
          evidence.characteristics intersects {controlled_comparison, empirical_within_source}
        expected_count: 59
      - grade: REASONED
        condition: >-
          'mechanism_given' in evidence.characteristics
        expected_count: 337
      - grade: ASSERTED
        condition: otherwise
        expected_count: 281

  flags:
    evaluation: orthogonal_any_subset_render_in_listed_order
    rules:
      - flag: CONTESTED
        condition: >-
          an undirected in-source contradicts partner exists: the object is either end of any
          stored intra_source_relations edge with relation == contradicts whose target resolves
          in the same corpus (stored direction is extractor choice, so the edge is symmetrised)
        expected_count: 85
      - flag: QUALIFIED
        condition: >-
          a qualifies/qualified_by partner exists that qualifies THIS object: the object is the
          target of a stored 'qualifies' edge, or the holder of a stored 'qualified_by' edge.
          The flag marks the qualified rule, not the qualifying exception (the exception is not
          itself narrowed by the relation)
        expected_count: 167
      - flag: DATED
        condition: "'historical_claim' in evidence.characteristics"
        expected_count: 110
      - flag: CULTURE-BOUND
        condition: "'culturally_bounded' in evidence.characteristics"
        expected_count: 84
      - flag: FIGURE-UNVERIFIED
        condition: >-
          provenance.figure_refs is nonempty and provenance.inspected.figures is empty — the
          claim cites a figure that no inspection pass has verified
        expected_count: 122

  suffixes:
    evaluation: append_to_base_grade_in_listed_order
    rules:
      - suffix: "-our_reading"
        condition: "claim_type == source_interpretation"
        expected_count: 21
      - suffix: "-hedged"
        condition: "any caveats[].origin == extractor_observed"
        expected_count: 634

  origin_count:
    level: decision_only
    condition: >-
      SINGLE-ORIGIN if the decision's domain independent_origin_count == 1, else
      MULTI-ORIGIN(n). Read from CANON-V1-LIVE24-COVERAGE.yaml domains[].independent_origin_count.
      NEVER attached to an individual claim.
    uncomputable_note: >-
      Claim-level cross-source consensus is uncomputable today: the committed ontology holds
      0 cross-source relations (0 of 189 relationship rows cross a source boundary, 0
      cross_source_concept rows). No deterministic function of committed fields can say two
      sources agree at sk granularity, and no marker in this scheme claims it. The origin
      count is a DECISION-level proxy carried at the domain the decision compiles from.

# ── Corpus context (recomputable; see marker_scheme_md for the commands) ─────
corpus_context:
  objects: 677
  practitioner_assertion: {count: 503, share: "74.3%"}
  controlled_comparison: {count: 25, share: "3.7%"}
  caveats_total: 1408
  caveats_extractor_observed: {count: 1082, share: "76.8%"}
  caveats_source_stated: {count: 326}

# ── Legend (injected once per system prompt; <=120 whitespace tokens) ────────
legend: |
  MEASURED = the source itself compares or measures. REASONED = a mechanism is given.
  ASSERTED = stated without mechanism or measurement. CONTESTED = another claim in the
  same source contradicts it. QUALIFIED = an in-source exception narrows it. DATED =
  tied to its era's technology. CULTURE-BOUND = tied to its culture. FIGURE-UNVERIFIED =
  cites a figure nobody inspected. -hedged = caveat added by the extractor, not the
  source. -our_reading = our interpretation of the source, not its explicit words.
  SINGLE-ORIGIN / MULTI-ORIGIN(n) = independent sources behind the decision's domain,
  never claim-level agreement. Markers label evidence character; they never rank sources.

# ── Rendering ────────────────────────────────────────────────────────────────
rendering:
  form: "[BASE{suffixes}|FLAG|...|ORIGIN?]"
  flag_order: [CONTESTED, QUALIFIED, DATED, CULTURE-BOUND, FIGURE-UNVERIFIED]
  suffix_order: ["-our_reading", "-hedged"]
  origin_token: "SINGLE-ORIGIN or MULTI-ORIGIN(n), decision-level only, always last"
  examples:
    - "[REASONED|CONTESTED|MULTI-ORIGIN(2)]"
    - "[ASSERTED-hedged|DATED|SINGLE-ORIGIN]"
    - "[MEASURED|QUALIFIED]"

# ── Medium-transfer sweep configuration (consumed by the dating annex) ───────
