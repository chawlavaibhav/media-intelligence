#
# Rendered from committed ids, never written by hand (spec R5). Illustrative only: it is built
# for EVAL-037 brief B06 (watch hero image), which is concluded evidence, and it authorises
# nothing. Validate with:
#   python3 canon/validation/validate_canon_context.py canon/context/examples/B06-watch-hero.canon-context.yaml

canon_context_version: v0.1
context_id: b06-watch-hero-v0-1

built_for:
  request_ref: EVAL-037/B06
  outcome_kind: single hero product image, wristwatch, with an on-image claim line
  built_at_commit: 5b95da18a89710a42eab39d1d89981e31dcf4191

budget:
  max_guidance_entries: 8
  max_principle_bytes: 4096
  max_serialized_bytes: 16384
  basis: >-
    Spec R1 defaults. The principle budget is the value-gate oracle contexts own upper bound
    (3,655 bytes) rounded up; the total budget adds the six-field scaffolding the oracle
    contexts never carried. Not calibrated against accepted-outcome evidence.

production_questions:
  - question_id: PQ-01
    question: >-
      Where is the key light placed relative to the watch case and crystal?
    why_it_matters: >-
      A polished case either carries a chosen highlight or an accidental one; a reflection of the room in the crystal is the single most common reason a watch hero image is not accepted.
    answered_by: [KG-01, KG-02]
  - question_id: PQ-02
    question: >-
      Where does the watch sit in the frame, and is a centred composition defensible here?
    why_it_matters: >-
      Placement is decided once and constrains crop, aspect ratio and every later repair; an unreasoned placement costs a regeneration rather than an edit.
    answered_by: [KG-03]
  - question_id: PQ-03
    question: >-
      What does the on-image claim line actually say?
    why_it_matters: >-
      The line is generated with the image and cannot be swapped cheaply afterwards; a line that asserts nothing checkable wastes the space and discounts the rest of the frame.
    answered_by: [KG-04, KG-05]

key_guidance:
  - guidance_id: KG-01
    principle: >-
      Whether a direct reflection appears is decided entirely by whether the light sits inside the family of angles. A light inside it produces one; a light outside it does not light a mirror-like subject at all as far as the camera is concerned. To see direct reflection across most of a mirror-like surface, the source must be large enough to fill the family; to see none, both camera and light must be placed so the source falls outside it.
    render_mode: verbatim_claim
    rendered_from: {ref: sk_lsm_c003_0014, field: claim}
    applicability: >-
      Polished, mirror-like surfaces — the steel case, crown and crystal. The source restricts the family of angles to direct reflection by its own stipulation (sk_lsm_c003_0013).
    concrete_implication: >-
      Decide the highlight before the frame: size the key light to fill the family of angles for the case if the metal should read as lit across its length, or place camera and light so the source falls outside it if the case should read dark. There is no third setting; a light half in the family gives a partial highlight nobody chose.
    failure_mode: >-
      A light placed by eye lands partly inside the family, so the case carries an accidental highlight shape and the crystal a reflection of whatever is in front of it. This is the most common way a watch hero image is rejected.
    evidence:
      source_dir: light-science-magic-ch3
      refs: [sk_lsm_c003_0014]
      characteristics: [explicitly_stated, argued, mechanism_absent]
    uncertainty: >-
      None recorded on the claim itself; the source states no mechanism (mechanism_absent) and the supporting figure was not inspected.
  - guidance_id: KG-02
    principle: >-
      Polarized direct reflection is more visible on black or transparent subjects, but not because such subjects reflect more directly. They produce weaker diffuse reflection, which leaves the direct component easier to see. This is the explanation for the earlier room observation that black objects change brightness with viewpoint while white objects do not.
    render_mode: verbatim_claim
    rendered_from: {ref: sk_lsm_c003_0017, field: claim}
    applicability: >-
      Black, dark or transparent subjects — a dark dial, a black strap, the crystal.
    concrete_implication: >-
      Treat a dark dial as the place the direct reflection will show first, not the place it is safest. Its low diffuse return is what makes any stray reflection prominent, so control the direct component there before adding fill anywhere else.
    failure_mode: >-
      The dark dial is lit as if it were a dark object needing more light; the added source lands in the family of angles and the dial returns a visible reflection of it instead of reading black.
    evidence:
      source_dir: light-science-magic-ch3
      refs: [sk_lsm_c003_0017]
      characteristics: [explicitly_stated, argued, repeated_within_source, mechanism_given]
    uncertainty: >-
      None recorded — explicitly stated, argued, repeated within the source, mechanism given.
  - guidance_id: KG-03
    principle: >-
      Off-centre is the most popular idea and comes naturally to practised photographers, but the criticism of dead-centred, bull's-eye positioning should not be taken to mean centring has no use: there are many situations in which centring the main subject makes a firm and strong statement. The source's worked case shows what those situations have in common — the subject had strong intrinsic pull, being both colourful and circular, it sat within a fairly flat surrounding area, and the surrounding structure was arranged in concentric curves around it, so everything pointed to the centre.
    render_mode: verbatim_claim
    rendered_from: {ref: sk_fre_c003_0019, field: claim}
    applicability: >-
      A subject with strong intrinsic attraction surrounded by structure that converges on it — which a round watch face on a plain ground is.
    concrete_implication: >-
      Centring is available for this subject rather than a default to be avoided; if the composition is centred, give the surround a reason to converge (concentric or flat ground) instead of leaving the watch merely in the middle of empty space.
    failure_mode: >-
      Centring is rejected on the general "bull's-eye" objection and the watch is pushed off-centre without a compositional reason, producing an arbitrary placement that neither centring nor the rule of thirds supports.
    evidence:
      source_dir: freeman-photographers-eye-graphic-guide
      refs: [sk_fre_c003_0019]
      characteristics: [explicitly_stated, visually_demonstrated, anecdotal, practitioner_assertion, mechanism_given]
    uncertainty: >-
      The source asserts "any number of situations" and shows exactly one (extractor_observed); the figure was not inspected; and the same passage proposes to improve its own strongest centring case by cropping to square.
  - guidance_id: KG-04
    principle: >-
      A specific claim is believed because it is either true or a lie, with no middle ground, and readers do not expect an advertiser to lie — they know he cannot lie in the best media. Definite statements are therefore usually accepted, actual figures are not generally discounted, and specific facts carry their full weight. The weight of an argument may often be multiplied by making it specific: a tungsten lamp said to give "more light" leaves doubt, while one said to give three and one-third times the light is believed; "Our prices have been reduced" makes no marked impression while "Our prices have been reduced 25 per cent" gets the full value of the announcement.
    render_mode: verbatim_claim
    rendered_from: {ref: sk_hop_sa_0051, field: claim}
    applicability: >-
      Claims that can be stated as figures or definite facts — water resistance, movement accuracy, power reserve, warranty length.
    concrete_implication: >-
      Replace each adjective in the on-image line with the figure behind it, if a figure exists. If no figure exists, the line is describing nothing and should be cut rather than softened.
    failure_mode: >-
      The hero line reads as approved marketing language that asserts quality without any statement that could be checked, so it carries no weight and occupies the space a checkable claim would have had.
    evidence:
      source_dir: hopkins-scientific-advertising-ch1-7
      refs: [sk_hop_sa_0051]
      characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given, repeated_within_source]
    uncertainty: >-
      The believability mechanism rests on the premise that an advertiser cannot lie in the best media, stated as fact and unsupported; no comparison of a vague and a specific version of the same advertisement is reported.
  - guidance_id: KG-05
    principle: >-
      Platitudes and generalities leave no impression at all, and superlatives such as "Best in the world" or "Lowest prices in existence" are usually damaging as well as useless: they claim only what is expected, they suggest looseness, exaggeration and carelessness of truth, and they lead readers to discount every other statement the advertiser makes. A man inclined to superlatives must expect all his statements to be taken with caution.
    render_mode: verbatim_claim
    rendered_from: {ref: sk_hop_sa_0050, field: claim}
    applicability: >-
      Written or spoken selling claims — here, the headline and any on-image copy.
    concrete_implication: >-
      Remove superlatives outright rather than qualifying them. The cost is not the weak line itself but the discount the reader then applies to the specific claims sitting beside it.
    failure_mode: >-
      A superlative in the headline suggests looseness and carelessness of truth, and the specific figures elsewhere in the same image lose the credibility they would otherwise have had.
    evidence:
      source_dir: hopkins-scientific-advertising-ch1-7
      refs: [sk_hop_sa_0050]
      characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given, repeated_within_source]
    uncertainty: >-
      The contamination claim — that a superlative discredits the advertiser's other statements — is the strongest part of this record and is asserted with no case, comparison or measurement.

conflicts:
  - conflict_id: CF-01
    between: [sk_lsm_c003_0004, sk_lsm_c003_0010]
    nature: >-
      The extraction records these two as contradicting each other. A diffuse reflection has the
      same brightness from every viewing angle; a direct reflection is visible only from the one
      angle the geometry determines. Both are asserted without qualification by the same source.
    resolution_rule: >-
      Resolve by surface, not by preference: the contradiction is a scope boundary the source
      draws elsewhere, not an open question. Apply the direct-reflection rules to the case, crown
      and crystal, and the diffuse rules to a leather strap or matte dial. A single lighting
      decision covering the whole watch is what makes these two look incompatible.
    unresolved: false

do_not_overgeneralize:
  - guidance_id: KG-01
    limit: >-
      Applies to mirror-like surfaces only. It licenses nothing about the strap, a matte dial, fabric or skin.
    why: >-
      The source stipulates that a family of angles for diffuse reflection would be meaningless (sk_lsm_c003_0013), so the concept has no defined behaviour off polished surfaces.
  - guidance_id: KG-03
    limit: >-
      Not a rule that centring is right for round subjects. It removes an objection for one described case.
    why: >-
      The source asserts "any number of situations" and shows exactly one, and the figure was not available for inspection.
  - guidance_id: KG-04
    limit: >-
      Not evidence that specific copy outperforms vague copy. It is a practitioner argument about why it should.
    why: >-
      No comparison of a vague and a specific version of the same advertisement is reported; the tungsten-lamp and price-reduction lines are illustrations, not results.
  - guidance_id: KG-05
    limit: >-
      The contamination effect is not quantified and must not be traded off against anything as if it were.
    why: >-
      The claim that a superlative discredits an advertiser's other statements is asserted with no case, comparison or measurement.
  - guidance_id: KG-01
    limit: >-
      None of this is evidence that any image model can execute the placement it implies.
    why: >-
      Book knowledge is never evidence about model capability (PROJECT-MEMORY.md section 4.2); the Capability Registry holds zero rows.

