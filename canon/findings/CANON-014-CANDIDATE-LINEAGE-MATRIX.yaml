# CANON-014 — Candidate lineage matrix
#
# WHY THIS EXISTS
# The previous run was summarised to the Controller as "12 new independent origins + 5 scope
# extensions". That summary is wrong in kind, not just in count: it reports independence as a
# per-source property. The Audit Gate is explicit that INDEPENDENCE IS A PROPERTY OF A PAIR, not of
# a source, and that the source-level verdict `not_independent_of_named_sources` points at pairwise
# entries and does not block on its own.
#
# This file therefore records PAIRS. There is no global independence count anywhere in it, and one
# cannot be derived from it by counting rows, because a source that is not an independent origin
# against one counterpart remains a perfectly good one against every other.
#
# THE PROMOTION RULE (canon/audit/AUDIT-GATE-v0.2.md, section D)
#   Two sources count as independent origins for a cross_source_concept ONLY IF neither one's audit
#   record declares the other with relation shared_author, same_series, companion_volume,
#   derivative_of or shared_primary_informant.
#   shares_publisher_only and cites_source do NOT by themselves defeat independence.
#   independence_not_established blocks promotion against everything until resolved.
#
# WHAT THIS FILE DOES NOT DO
# No cross_source_concept is created by CANON-014, anywhere. This task is not authorised to make any
# cross-source promotion. Apparent agreements and disagreements between sources are recorded at the
# end as OBSERVATIONS for later Controller review, and they are observations about what two sources
# happen to say - not findings that they converge.

matrix_version: v2
task: CANON-014
recorded: 2026-08-30
revision_note: >
  v2 records the three sources that the first pass listed as "not supplied". They were on the
  Controller's machine as PDFs and have now been processed. Three consequences run through this
  file and are not confined to the new section:
    - Section 4's FORWARD relations to Bijapurkar and to a primary source on calendar art are no
      longer forward. They are LIVE PAIRS and have moved into section 3B.
    - The forward row for Dwyer stays forward and is now a documented near miss: Parameswaran cites
      *Picture Abhi Baaki Hai*, a DIFFERENT work by one of *Cinema India*'s two authors. The pair
      (Parameswaran, Cinema India) starts and stays at no_known_relation.
    - Section 6 no longer lists any unsupplied source.

# ─────────────────────────────────────────────────────────────────────────────
# 1. THE CORRECTION TO THE PREVIOUS SUMMARY
# ─────────────────────────────────────────────────────────────────────────────

correction_to_canon013_reporting:
  what_was_reported: "12 new independent origins + 5 scope extensions"
  why_it_is_wrong:
    - >
      It reports a global independence count. Independence does not have a global value. Grammar of
      the Shot is not an independent origin against Grammar of the Edit and is a perfectly good one
      against every other source in the corpus; a single number cannot express that.
    - >
      A count of sources is not a count of origins even before that: five of the seventeen are scope
      extensions of works already live and carry ZERO independence against their live counterpart,
      which the previous run's own README states correctly while the summary does not.
    - >
      Hopkins's My Life in Advertising is a distinct WORK but shares its author and its position with
      the live Hopkins material. It must not be treated as corroborating it. A different title is not
      a different origin.
    - >
      Sullivan's relationship to the live Ogilvy material was recorded as unresolved. An unresolved
      relation is `independence_not_established`, which BLOCKS promotion until settled - it does not
      quietly count as independent.
  the_correct_statement: >
    There is no number. What exists is a set of pairs, each with a relation and a verdict. Any later
    promotion must consult the pairs it actually intends to use, and must not count directories,
    books, chapters or authors.

