# CANON-014 — ontology relationships that cross source boundaries.
#
# These were written inside individual sources' ontology-mappings.yaml, where they point at
# terms that live in a DIFFERENT source's file. That is the wrong home for two reasons: a
# relationship between two sources is not a property of either one, and a per-source
# validator cannot resolve a reference it cannot see, so the reference silently rots.
#
# They are moved here unchanged. NONE OF THEM ASSERTS AGREEMENT. Under SPEC-05 a claim that
# two sources describe the same thing is a `cross_source_concept`, needs two INDEPENDENT
# origins established from Audit Gate lineage records, and requires Controller review.
# CANON-014 creates none, and every source named here is a HOLD candidate with no audit
# record, so no independence is established for any of these pairs. Read them as recorded
# observations awaiting review.

