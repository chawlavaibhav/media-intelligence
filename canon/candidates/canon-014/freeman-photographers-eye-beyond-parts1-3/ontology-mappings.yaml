source_id: freeman-photographers-eye-beyond-parts1-3
terms:
- term_id: t_pex_0001
  term: shift_lens
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: entity
  definition_in_origin_frame: 'Also called a perspective control or PC lens. The lens elements slide up,
    down or sideways while staying in the same plane, which slides different parts of the scene into the
    frame. Requires a lens projecting an image circle larger than the sensor.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0002
  term: tilt_lens
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: entity
  definition_in_origin_frame: 'A lens whose plane can be angled relative to the sensor, so that the plane
    of sharp focus can be steered rather than only moved nearer or farther. The source treats it as the
    DSLR descendant of a large-format camera''s movable front standard.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0003
  term: Scheimpflug_principle
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: entity
  definition_in_origin_frame: 'The rule the source names for why tilt works — where the lens plane meets
    the sensor plane is where the plane of sharp focus must also meet, so tilting produces a wedge-shaped
    rather than slab-shaped depth of field.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0004
  term: exposure_triangle
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: entity
  definition_in_origin_frame: 'Shutter, aperture and ISO taken together; the source''s point is that there
    is always a trade-off among the three, so a fast shutter is paid for in noise or in depth of field.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0005
  term: colour_cylinder
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: entity
  definition_in_origin_frame: 'The source''s three-axis solid for colour — hue radially like spokes of
    a wheel, saturation increasing outward from the centre, brightness from dark at the top to bright
    at the bottom. Every named colour look in the book is a region of it.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_pex_0006
  term: active_part_of_the_frame
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: entity
  definition_in_origin_frame: 'The source''s caption label for the region of a frame where several curves
    cross over each other, marked on its own diagram as the place the picture''s interest sits.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0007
  term: graphic_photograph
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A photograph in which lines and shapes play a strong part, often stronger
    than the subject. The source stresses that photographs contain edges and contrast, and that the lines
    and shapes are supplied by the viewer''s eye and mind.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0008
  term: implied_triangle
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A triangle the eye supplies from any three prominent points, whether or
    not anything triangular is present. The source calls implied triangles the most frequent shapes in
    imagery for this reason.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0009
  term: implied_circle
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A circle read out of an arrangement rather than present as an object. The
    source rates these above complete ready-made circles such as a clock face, and says they occur less
    often than implied triangles.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0010
  term: rhythm
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'Repetition that additionally aligns and flows, which the source says gives
    an image an unexpected structure. Distinguished from plain repetition, which it calls boring.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0011
  term: field_image
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A view of many similar things — a field of poppies, a field of stars —
    that reads as continuing beyond the frame because its elements are cut through at every edge.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0012
  term: four_square
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A viewpoint facing the subject head-on and frontally with all major lines
    squared up and rectangular. The source says it looks objective and that believing it therefore is
    objective is a delusion.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0013
  term: tunnel_effect
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'The source''s name for wide-angle vignetting used deliberately. Darkening
    away from the centre concentrates attention toward the centre, because the eye tends toward brighter
    areas.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0014
  term: precision_shot
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A composition that, in the source''s word, inevitably calls for precision
    — typically nested identical geometry, where any small misalignment is directly visible and reads
    as sloppy.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_pex_0015
  term: close_viewpoint
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A sense of being right up against the subject, from closer than most people
    would consider normal. The source separates this explicitly from close-up, which is magnification,
    and says it does not require a wide-angle lens.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0016
  term: showing_distance
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'Making the interval between camera and subject legible, as distinct from
    being far from the subject. Depends on visible cues — continuous ground, a raised viewpoint, aerial
    perspective — rather than on the lens.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0017
  term: selective_focus
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'Shallow depth of field used to point the viewer at exactly what the photographer
    chose, because the eye drifts toward whatever is sharp. The source notes the resulting gradient is
    purely photographic — normal eyesight sees the periphery as indistinct, not blurred.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0018
  term: counter_focus
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'The source''s own coinage, flagged as such — tilting the lens back against
    a scene that tilts forward, to produce the most extreme selective focus possible. It calls this the
    exact opposite of the way the equipment was designed to be used.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0019
  term: colour_wash
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'An element defocused so completely that it loses identity and survives
    only as colour. The source uses it behind the subject and, with a different and harder shooting style,
    in front of it.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0020
  term: subjective_camera
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'Borrowed from cinematography — the camera is you. A wide-angle lens used
    from close inside a busy scene, projecting the audience into it rather than leaving them observing.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0021
  term: telephoto_coolness
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'The observer position produced by stepping back to a long lens — a fly
    on the wall. The source insists this is mood and taste rather than a defect, and names the accompanying
    flattening, in which everything appears to lie on a similar plane.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0022
  term: still_point
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'The exact instant at the peak of a parabola when something thrown into
    the air pauses before falling back. One of only two moments in a trajectory the source considers worth
    the frame.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0023
  term: streaking
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'The source''s name for motion blur, which it says viewers thoroughly accept
    and almost never reject as a mistake — unlike out-of-focus. It refuses to name a correct amount.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0024
  term: eyeline
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A visible line of sight that the viewer follows. Two converging eyelines
    become almost magnetically the centre of attention; the effect is multiplied where someone is intently
    focusing a camera.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0025
  term: scene_level_vector
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A direction carried by the setting itself rather than by any moving element
    — the source''s instance is harbour-front façades lit so that they clearly face toward an out-of-frame
    setting sun. Our label for what the source describes without naming.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_pex_0026
  term: colour_theme
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'Colours drawn from one wedge of the hue circle, holding a number of images
    together. The source is explicit that a theme covers a set of pictures and need not be intentional.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0027
  term: colour_palette
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A set of colours giving a particular character to an image. Borrowed from
    painting, and the source marks the difference — a painter chooses a palette, a photographer has to
    find one.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0028
  term: spot_colour
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A single strong colour concentrated in a small area, dominating because
    the surroundings are drab, muted or consistently a different colour. Also called colour accent.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0029
  term: near_far
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'Attributed by the source to Ansel Adams — a very close foreground subject
    and a background subject, both impeccably sharp, with a meaningful relationship between them. A rock
    and a mountain with no relationship does not qualify.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0030
  term: compression
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'The long-lens effect of equalising the apparent sizes of near and far elements,
    which the source uses to relate two groups of figures at very different distances. Requires being
    nearly end-on.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0031
  term: stacking
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A stack of upright planes like a pack of cards, produced by a long telephoto
    plus a high enough viewpoint plus haze and backlighting that hide the detail inside each plane and
    make them two-dimensional.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0032
  term: layering
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A reflection treated as a literal extra layer that contributes its own
    surface details and irregularities. The source''s case depends on the irregularity, and it declines
    extra sharpness that would remove the merged overlaps.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0033
  term: tableau
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'From painting and theatre — strictly a group of figures formally arranged
    to represent a historical scene, loosely a set piece caught at a good moment. The source notes that
    a squared-up long table imports an association whether or not it is intended.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0034
  term: declared_composite
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A combined image that does not pretend to be a single unadulterated photograph.
    The source separates this from compositing that sets out to fool the viewer, which it calls dodgier
    on the ethics front, and declines to settle the argument.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0035
  term: mountain_water
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: property
  definition_in_origin_frame: 'A Chinese vertical scroll form. The source names two departures from the
    European canon — long and vertical is not part of it, and the aim is the essence of a landscape rather
    than a view of it — and describes the method as stacking elements vertically toward an upper peak.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0036
  term: anything_that_would_distract_from_the_verticals
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'Elements competing with the line or shape the picture is about. The source''s
    instances are a window at the left of the frame and lit grass below it.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0037
  term: repetition_that_is_only_predictable
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'Things appearing one after another too predictably. The source''s failure
    examples are a brick wall and an ordinary field of flowers, and its own uninspired elevated view of
    a row of memorial arches.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_pex_0038
  term: an_over_photographed_subject
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'A subject already thoroughly photographed, which the source says makes
    the search for visual surprise all the more pressing. Named twice in this span, for a national-park
    waterfall and for Stonehenge.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_pex_0039
  term: converging_verticals
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'From ground level, tilting the camera up to take in a building makes its
    sides lean inward.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0040
  term: a_noticeably_sloppy_composition
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'What a small departure from the centre line produces where two identical
    forms are nested — the far one visibly offset inside the near one.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0041
  term: a_sense_of_distance_missing_from_the_equation
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'What a telephoto solution to a far subject can lose — the subject is brought
    closer and seen in detail, but nothing in the frame lets the viewer measure the interval.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0042
  term: you_end_up_with_just_a_busy_scene
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'A crowded frame whose elements do not cohere. The source names three routes
    out — camera angle, light, or the way the action unfolds — and says the third often does not work.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0043
  term: the_annual_report_look
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'The source''s name for the flat, dutiful treatment a factory or industrial
    scene falls into by default.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0044
  term: outtakes_unsuccessful_because_of_poor_positioning
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'A figure caught crossing a graphic line rather than landing in one of the
    frame''s usable gaps. The source says most of its beach-cabin frames failed this way.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0045
  term: rich_colour_becoming_too_much_for_comfort
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'Strong colour gives plenty to react to and for that reason tires quickly;
    the source''s remedy is restraint at the level of a body of work, not of a frame.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_pex_0046
  term: an_obsession_for_revealing_everything_in_an_image
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'The habit the source attributes to some photographers of opening up every
    shadow because processing makes it possible. Its counter-position is that sometimes you need to hold
    things back from the viewer.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_pex_0047
  term: the_optically_maximum_depth_of_field_is_not_enough
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'At close range the laws of physics limit depth of field, and the source
    states plainly that front-to-back sharpness cannot be had by normal means for such a subject.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_pex_0048
  term: vignetting_treated_as_an_optical_fault
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: problem
  definition_in_origin_frame: 'Manufacturers engineer vignetting out and processing software corrects
    it automatically, which removes a compositional device the source wants. Framed as a problem only
    for a photographer who wants the effect.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_pex_0049
  term: crop_tightly_to_exclude_what_competes
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: remedy
  definition_in_origin_frame: 'Cropping with a telephoto at the time of shooting, and afterwards trimming
    out the window, the lit grass, and the top and bottom of the frame, so nothing distracts from the
    lines.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - physical_production
  - human_edit
- term_id: t_pex_0050
  term: process_for_contrast_rather_than_balance_the_tones
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: remedy
  definition_in_origin_frame: 'Deliberately raising contrast so a line separates strongly enough to dominate,
    against what the source treats as the reader''s default of balancing tones.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - human_edit
- term_id: t_pex_0051
  term: rotate_the_camera_so_verticals_run_counter_to_an_existing_diagonal
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: remedy
  definition_in_origin_frame: 'Rotating about the viewing axis converts the scene''s verticals into a
    diagonal set opposed to the diagonals already present, which the source credits with the energy of
    the frame.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - physical_production
- term_id: t_pex_0052
  term: get_closer_overhead_and_change_to_a_longer_lens
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: remedy
  definition_in_origin_frame: 'The move that turned a general balcony overview into the source''s circles
    picture, after exploring alternative camera positions as standard procedure.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - physical_production
- term_id: t_pex_0053
  term: frame_so_the_elements_run_off_at_all_the_edges
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: remedy
  definition_in_origin_frame: 'The source calls this essential for a field image; it says this alone suggests
    the elements go on and on beyond the frame.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - physical_production
  - human_edit
- term_id: t_pex_0054
  term: centre_and_level_the_camera_with_a_grid_overlay
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: remedy
  definition_in_origin_frame: 'What a four-square viewpoint requires; the source says a grid overlay on
    the viewfinder or live-view screen is always useful and that a standard or longer lens makes it easier.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - physical_production
- term_id: t_pex_0055
  term: shoot_from_the_subjects_own_vantage_point
  origin: source
  origin_ref: freeman-photographers-eye-beyond-parts1-3
  kind: remedy
  definition_in_origin_frame: 'Photographing from the top of the lighthouse so the lighthouse becomes
    the subject without appearing, present only as a shadow; the source waited until later in the day
    so the shadow would be longer.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - physical_production
- term_id: t_pex_0056
  term: put_an_unfocused_obstruction_in_the_foreground
  origin: source
