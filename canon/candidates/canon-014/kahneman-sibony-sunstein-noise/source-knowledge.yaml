- sk_id: sk_nse_0041
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "the outside view"
  - "base-rate neglect"
  - "reference class"
  - "Think statistically, and take the outside view of the case"
  concept_label: the_outside_view_and_base_rates
  label_origin: source_verbatim
  claim: >-
    Taking the outside view means treating the case as a member of a reference class and thinking
    statistically about that class, rather than building a causal story about this case alone. The
    source's argument is that people applying unique experience to a unique reading of a case produce
    pattern noise, and that judges sharing a reference class will be less noisy. It also serves accuracy:
    the base rate is the starting point a matching prediction skips, and predictions anchored in it are
    appropriately moderate.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Causal thinking is the default and is effortless; statistical thinking is effortful, requires
      training, and begins with ensembles rather than the focal case. Because the case-focused mode draws
      on each judge's own associations and memories, it is precisely the mode that generates idiosyncratic
      readings. Substituting a shared class for private associations removes that input.
  scope:
    domain_discussed_by_source: [executive_selection, academic_prediction, geopolitical_forecasting, corporate_acquisitions]
    conditions: >-
      Requires a defensible reference class. The source's own examples show the work involved: defining
      "a group of deals considered comparable enough" is a step in its own right.
  caveats:
  - text: >-
      The source concedes the authors themselves missed it: they wrote the Gambardi case to illustrate
      noise and only realised weeks later that it was also a base-rate-neglect example. "Thinking of base
      rates is no more automatic for the authors of this book than for anyone else."
    origin: source_stated
  - text: >-
      The outside view is a starting point, not the answer: "this number is only a starting point, and
      the specifics of Gambardi's case will affect your final estimate."
    origin: source_stated
  - text: >-
      The superforecaster base-rate practice is Tetlock and colleagues' finding, not the authors' study.
    origin: extractor_observed
  source_stated_problems:
  - "Relying on causal thinking about a single case is a source of predictable errors"
  - "if you focused solely on what you were told about Gambardi, you neglected a key piece of information"
  - "they can be blamed for a lack of predictive humility"
  source_stated_remedies:
  - "professionals who share the same reference class will be less noisy"
  - "Before we discuss this situation, what is the relevant base rate?"
  - "Ensure that whenever possible, mediating assessments use an outside view"
  examples:
