- sk_id: sk_nse_0050
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "the valley of the normal"
  - "Causally, noise is nowhere; statistically, it is everywhere"
  - "bias has a kind of explanatory charisma, which noise lacks"
  - "It is the occurrence of the event that tells you its cause"
  concept_label: noise_is_invisible_because_our_thinking_is_causal
  label_origin: extractor_assigned
  claim: >-
    Noise is a statistical property of a set of judgements and becomes visible only when a set is examined
    statistically. Ordinary understanding is causal: an unexpected but unsurprising outcome triggers a
    search of memory for a cause, the search almost always succeeds, and the resulting story makes the
    outcome feel predictable in hindsight. Applied to judgement errors, that habit finds a bias every
    time and never finds noise — not because noise is absent but because a single case cannot display it.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Most events fall in the valley of the normal, neither actively expected nor surprising, and are
      explained after the fact from an unlimited reservoir of available facts and beliefs — the same news
      flow explains a market rise and a market fall. Because the explanation arrives only once the outcome
      is known, it feels like understanding while predicting nothing. Statistical thinking, the only mode
      in which noise appears, is effortful and must be learned.
  scope:
    domain_discussed_by_source: [social_science, business_post_mortems, everyday_explanation]
    conditions: >-
      Applies wherever explanation of individual cases is the mode of review. The source presents this as
      its answer to why noise is absent from public discussion despite being ubiquitous.
  caveats:
  - text: >-
      The Fragile Families challenge and the reviews of effect sizes in social psychology are
      third-party work. The source uses them to argue that limited predictive accuracy implies limited
      causal understanding.
    origin: extractor_observed
  - text: >-
      The step from "causation implies correlation" to "correlation measures how much causality we
      understand" is the source's own argument, offered without qualification but resting on the
      assumption that the measured predictors capture the causal structure.
    origin: extractor_observed
  - text: >-
      The source does not claim causal thinking is a defect to be removed: it "avoids unnecessary effort
      while retaining the vigilance needed to detect abnormal events".
    origin: source_stated
  source_stated_problems:
  - "The invisibility of noise is a direct consequence of causal thinking"
  - "Researchers must reconcile the idea that they understand life trajectories with the fact that none of the predictions were very accurate"
  - "If we try to explain, in hindsight, why a particular decision was wrong, we will easily find bias and never find noise"
  source_stated_remedies:
  - "Only a statistical view of the world enables us to see noise"
  - "We think we understand what is going on here, but could we have predicted it?"
  examples:
    positive:
    - {description: "the Joneses' eviction, explicable in hindsight from a lay-off and an unmoved manager — and equally explicable had it not happened, from her tenacity and his kindness", figure_ref: null}
    - {description: "'they failed because they lacked experience' — a low correlation converted into a satisfying causal force", figure_ref: null}
    counter:
