- sk_id: sk_nse_0034
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "broken-leg exceptions"
  - "is there a broken leg here, or do you just dislike the prediction?"
  concept_label: the_broken_leg_principle
  label_origin: source_verbatim
  claim: >-
    The source gives one test for when a person may override a mechanical recommendation: whether they
    hold decisive information the rule could not take into account. If they do, that is a broken leg and
    the override is right. If they merely disagree, the disagreement is a personal pattern applied to the
    same predictors the rule already used — highly likely to be invalid — and overriding will make the
    prediction worse. The test is a question about the information, not about the strength of the
    feeling.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Meehl's original case is a model predicting who will go to the cinema tonight, and someone who knows
      a particular person just broke a leg. The private fact is decisive and outside the model's inputs.
      Absent such a fact, the only thing the human adds over the rule is their own pattern noise.
  scope:
