- sk_id: sk_nse_0047
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "noise might be essential to accommodate new values"
  - "a noise-free system might freeze existing values"
  - "Creativity, Morale, and Fresh Ideas"
  - "In the end, most of the efforts to defend noise aren't convincing"
  concept_label: noise_as_room_for_changing_values_gaming_deterrence_and_morale
  label_origin: extractor_assigned
  claim: >-
    The source catalogues four further defences of noise and answers each. Noise leaves room for values to
    change, where a fixed rule would freeze them. Vagueness deters gaming, because clear rules have clear
    edges that clever parties work around. Unpredictable penalties may deter wrongdoing better than
    certain ones. And discretion sustains morale and creativity, since people who are hemmed in feel
    diminished. The source's answers are: revisit rules on a schedule instead; ask how much evasion
    against how much noise; note that deterrence by unpredictability depends on the wrongdoer being
    risk-averse and that raising the penalty would work better; and pick hygiene strategies that leave
    room to manoeuvre.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The common structure of the source's replies is that each defence attacks one particular
      noise-reduction instrument — usually a firm rule — rather than noise reduction as such. Aggregation,
      structuring and shared scales survive all four objections, because none of them freezes a value,
      creates an exploitable edge, or removes a professional's room to think.
  scope:
    domain_discussed_by_source: [criminal_justice, taxation, university_conduct_codes, corporate_policy, regulation]
    conditions: >-
      The source states the verdict "depends on the particular noise-reduction strategy to which it is
      meant to apply".
  caveats:
  - text: >-
      The source is explicit that it presents these objections sympathetically without endorsing them:
      "we by no means endorse them, at least not if they are taken as reasons to reject the general goal
      of reducing noise."
    origin: source_stated
  - text: >-
      The deterrence reply is analytical, not empirical: whether a punishment lottery deters more
      depends on whether potential wrongdoers are risk-averse or risk-seeking, which the source does not
      claim to know.
    origin: source_stated
  - text: >-
      The source concedes the morale objection has real force in some cases — "Demoralization is itself a
      cost and leads to other costs, such as poor performance" — and grants that Philip Howard "makes
      some appealing arguments" for general principles over prescriptive rules.
    origin: source_stated
  - text: >-
      The gaming argument is presented as a live debate among tax specialists rather than a settled
      finding.
    origin: source_stated
  source_stated_problems:
  - "A rule-bound system might eliminate noise, which is good, but it might also freeze existing norms and values"
  - "if there is a specific list of what counts as wrongdoing, then terrible behavior that is not explicitly covered by the list will end up being tolerated"
  - "Who wants to work in a place that squelches your own capacity to make independent decisions?"
  source_stated_remedies:
  - "noise-reduction efforts need not and should not be permanent … They might revisit them annually"
  - "We need to ask how much evasion there would be—and how much noise there would be"
  - "if we want to increase deterrence, wouldn't it be better to increase the penalty and eliminate the noise?"
  - "a process exists to challenge and rethink them—but not to break them by exercising case-by-case discretion"
  examples:
