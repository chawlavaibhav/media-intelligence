- sk_id: sk_nse_0024
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "independence is a prerequisite for the wisdom of crowds"
  - "aggregation can only reduce noise if judgments are truly independent"
  - "The second opinion is not independent if the person giving it knows what the first opinion was"
  concept_label: independence_is_a_precondition_for_aggregation
  label_origin: extractor_assigned
  claim: >-
    The noise reduction that averaging delivers is contingent on the judgements being independent. A
    second opinion given by someone who knows the first is not a second observation; it is a
    contaminated echo, and the third is worse. The source's sharpest instance is procedural: a
    verification step designed as an independent check delivers none of the expected benefit when the
    verifier knows what conclusion is being verified.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Averaging works because errors that are uncorrelated partly cancel. Social influence correlates
      them — it "reduces group diversity without diminishing the collective error" — so the sample size
      that the arithmetic assumes is not the sample size that exists. The source's analogy is witnesses to
      a crime who are allowed to talk before testifying.
  scope:
    domain_discussed_by_source: [forensic_examination, hiring_committees, forecasting, corporate_boards]
    conditions: >-
      Wherever multiple judgements of one case are combined, formally or informally. The source treats
      the requirement as "routinely violated in the procedures of organizations, notably in meetings".
  caveats:
  - text: >-
      The source concedes independence is often impractical: its own worked example has one analyst
      covering two assessments because there were not enough people, mitigated only by ordering the work
      and choosing maximally dissimilar topics.
    origin: source_stated
  - text: >-
      Independence is necessary but not sufficient. The source stresses averaging "does nothing to
      reduce bias", so independent judges who share a bias produce a confident, precise, wrong average.
    origin: source_stated
  source_stated_problems:
  - "The verification step therefore does not provide the benefit normally expected from the aggregation of independent judgments, because verifications are not, in fact, independent"
  - "group deliberation often adds more error in bias than it removes in noise"
  source_stated_remedies:
  - "the second person should not be aware of the first judgment"
  - "the company makes sure that the interviewers rate the candidate separately, before they communicate with one another"
  - "Organizations that want to harness the power of diversity must welcome the disagreements that will arise when team members reach their judgments independently"
  examples:
