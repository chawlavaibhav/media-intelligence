  concept_label: noise_reduction_can_introduce_error_and_bias
  label_origin: extractor_assigned
  claim: >-
    The second objection the source raises against itself is that a noise-reduction measure can be blunt
    enough to cause more error than it removes, and can introduce directional bias where none existed. A
    rule that removes all posts containing certain words is noise-free and takes down many that should
    stay; a three-strikes sentencing law removes the judge lottery and imposes life sentences on people
    who should not receive them. The same applies to algorithms: because they are consistent, an algorithm
    trained on biased data or using proxies for a protected characteristic can be more reliably biased
    than the humans it replaces.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      A rule buys consistency by refusing to look at variables it does not contain. Where those variables
      matter, the consistency is consistency in being wrong. For algorithms the source names two routes to
      bias: predictors correlated with race or gender even when neither is used, and training data that
      already encodes discrimination — the predictive-policing case, where overpoliced neighbourhoods
      generate the data that justifies more policing.
  scope:
    domain_discussed_by_source: [criminal_sentencing, content_moderation, bail_decisions, recruitment, university_admissions]
    conditions: >-
      Applies to any specific noise-reduction instrument. The source insists the verdict depends on which
      instrument, not on noise reduction in general.
  caveats:
  - text: >-
      The source's rebuttal is escalation rather than retreat: if one strategy is too crude, devise a
      better one — complex rules, wise guidelines, aggregation, or a structured process. It does not
      claim that a better one always exists.
    origin: source_stated
  - text: >-
      The favourable algorithm results — 41% fewer people of colour jailed at constant crime rate, a
      résumé screener selecting a more diverse pool — are third-party studies, and the source is careful
      to say algorithms "can" and not "will" outperform.
    origin: extractor_observed
  - text: >-
      The source records the opposing literature it does not adjudicate: O'Neil's Weapons of Math
      Destruction and the ProPublica analysis of COMPAS. It states that how to test for disparate impact
      is "well beyond the scope of this book".
    origin: source_stated
  - text: >-
      Its one claimed structural advantage for algorithms is auditability — that the question can be
      asked at all — not fairness. "It is much harder to subject individual human beings, whose
      judgments are often opaque, to the same kind of scrutiny."
