  - "linear sequential unmasking"
  - "keep a 'shadow of a doubt'"
  - "forensic confirmation bias"
  concept_label: sequencing_information
  label_origin: source_verbatim
  claim: >-
    More information is not always better. Where information could bias a judgement by letting an
    impression form early, the source's remedy is to control what the judge knows and when: give them
    only what they need, when they need it, and require the judgement at each step to be documented
    before the next piece of information is revealed. Any later change of mind, and its reasons, must be
    recorded too. The source stresses that this applies to accurate information as much as to misleading
    information.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Coherence-seeking makes an early impression organise everything that follows, and the source reports
      that biasing context changes not only the conclusion but what the examiner perceives — examiners
      shown a target exemplar alongside a latent print recorded significantly fewer details in the print
      than examiners shown it alone. Withholding the biasing input is therefore the only reliable point of
      intervention; instructing someone to disregard what they have seen is not.
  scope:
    domain_discussed_by_source: [forensic_examination, fingerprint_analysis, corporate_decision_making]
    conditions: >-
      Judgements assembled in steps from separable pieces of evidence, where some of the evidence is not
      needed for the sub-judgement being made.
