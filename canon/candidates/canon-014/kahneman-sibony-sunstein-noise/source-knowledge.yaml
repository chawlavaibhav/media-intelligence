    conditions: >-
      Applies where a mechanical recommendation exists and a person may depart from it. The source notes
      that with enough data a machine-learning model can itself discover many broken legs, reducing the
      need for human supervision.
  caveats:
  - text: >-
      The broken-leg example is Meehl's; the source presents it as a principle for decision makers, not
      as a tested procedure, and offers no evidence about how often overrides that pass the test improve
