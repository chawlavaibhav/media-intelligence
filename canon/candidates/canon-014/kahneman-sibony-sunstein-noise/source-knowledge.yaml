  label_origin: extractor_assigned
  claim: >-
    A matter of judgement occupies the space between computation, where no disagreement is allowed, and
    taste, where unresolved disagreement is entirely acceptable. What defines it is an expectation of
    bounded disagreement: competent people may differ, but not by much, and they behave as though an
    invisible target existed whether or not one does. How much disagreement is admissible is itself a
    judgement call and depends on the difficulty of the problem. The source narrows "judgement" further:
    it is a conclusion expressible in a word or phrase, not a synonym for thinking, and it is the
    conclusion of a report rather than the report.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The source's diagnostic is easiest at the extremes: judges who differ widely on an ordinary fraud
      sentence still concur that a one-dollar fine and a life sentence are both unreasonable; wine judges
      who differ on medals are often unanimous in contempt for the rejects. Agreement on absurdity marks
      the boundary of the space without fixing any point inside it.
  scope:
    domain_discussed_by_source: [criminal_sentencing, wine_judging, insurance_underwriting, professional_judgment]
    conditions: >-
      Applies where people believe they should agree. The source explicitly excludes matters of opinion
      or taste, where the concept of noise does not apply.
  caveats:
  - text: >-
      The source gives no procedure for setting the bound. It says the acceptable amount of
      disagreement "is itself a judgment call".
    origin: source_stated
  - text: >-
      The narrow technical sense of "judgment" is borrowed from psychology and is much narrower than
      ordinary usage; the source warns that "making accurate judgments is not a synonym for having good
      judgment".
