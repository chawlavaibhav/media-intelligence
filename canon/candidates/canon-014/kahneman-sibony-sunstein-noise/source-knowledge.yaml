- sk_id: sk_nse_0028
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "matching"
  - "your task is to find a value on the judgment scale that matches your mood or experience"
  - "The matching operation is a versatile tool of fast, System 1 thinking and the core of many intuitive judgments, but it is crude"
  concept_label: the_matching_operation
  label_origin: source_verbatim
  claim: >-
    Every rating is the output of a matching operation: an impression on one dimension is mapped onto a
    value on the response scale. The source argues people do this effortlessly and across wildly
    unrelated dimensions — affection for singers onto building heights, a restaurant onto the length of a
    novel — and that the versatility is real. The operation is nevertheless crude, and it is one of the
    three points in the judgement process at which variability enters.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Quantitative intensity dimensions share the property that "which is more?" can be answered for any
      pair of values, which is what allows one dimension to be mapped onto another. The source's account
      of the Julie problem shows the two stages: evaluate the evidence into a band ("unusually but not
      extraordinarily precocious"), then find the value on the target scale carrying the same label.
  scope:
    domain_discussed_by_source: [academic_prediction, consumer_ratings, punitive_damages, probability_judgment]
    conditions: >-
      Quantitative or ordered scales. The source separates these from qualitative scales — professions,
      diagnoses — whose values are not ordered.
  caveats:
  - text: >-
      The claim that two differently-worded questions elicit identical numbers rests on third-party
      experimental work; the source calls the evidence for the mechanism "unusually conclusive" but that
      is its assessment of others' results.
    origin: extractor_observed
  - text: >-
      The source notes the range of a scale is set by context in ordinary language — "she has been
      saving a lot of money" means different things about a banker and a babysitter — so a matched value
      is only interpretable against a shared frame of reference.
    origin: source_stated
  source_stated_problems:
  - "Individuals may differ in the interpretation of labels even when they agree on the substance of the judgment"
  - "our ability to match values across intensity dimensions cannot be better than our ability to assign values on these dimensions"
  source_stated_remedies:
