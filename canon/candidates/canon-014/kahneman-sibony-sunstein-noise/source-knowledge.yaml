- sk_id: sk_nse_0019
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "internal signal of judgment completion"
  - "the achievement of a coherent solution"
  - "This emotional experience ('the evidence feels right') masquerades as rational confidence"
  concept_label: internal_signal_of_judgment_completion
  label_origin: source_verbatim
  claim: >-
    What tells a judge that a judgement is finished is not evidence about the world but an internal
    signal: a feeling that the answer fits the evidence coherently. The signal is self-administered and
    unrelated to any outside information, which is why judging a fictitious case feels exactly like
    judging a real one, and why a judgement whose accuracy can never be checked still feels complete. Its
    danger is that it is construed not as a feeling but as a belief — "I know, even if I don't know why" —
    so subjective confidence gets mistaken for evidence of validity.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The sense of coherence is part of the experience of judging rather than a consequence of being
      right, so it is available whether or not an outcome exists. The source adds that the coherence is
      often manufactured — "bolstered by hiding or ignoring pieces of evidence that don't fit" — and that
      confidence therefore requires only two things: a comprehensively coherent story and no attractive
      alternative in mind, both of which can be achieved by suppression rather than by getting it right.
  scope:
    domain_discussed_by_source: [executive_intuition, professional_judgment, forecasting]
    conditions: >-
      Any judgement, verifiable or not. The source claims universality: "we are not all highly confident
      all the time, but most of the time we are more confident than we should be."
  caveats:
  - text: >-
      The internal signal is the authors' proposed construct, offered as an interpretation of the
      managerial-intuition literature, not as a measured quantity. The definition of intuition they
      build on is a third party's review.
    origin: extractor_observed
  - text: >-
      The source treats the signal as legitimate at the right moment: it does not recommend banning it,
      only delaying it, because decision makers "clearly need to be comfortable with their eventual
      choice".
    origin: source_stated
  source_stated_problems:
  - "Confidence is no guarantee of accuracy"
  - "subjective confidence in one's judgment by no means guarantees accuracy"
  - "you can also achieve coherence, albeit less elegantly, by ignoring or explaining away whatever does not fit"
