- sk_id: sk_nse_0037
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "aggregating multiple independent judgments"
  - "Averaging is mathematically guaranteed to reduce noise"
  - "estimate-talk-estimate"
  - "the crowd within"
  concept_label: aggregating_independent_judgments
  label_origin: extractor_assigned
  claim: >-
    Averaging independent judgements divides noise by the square root of the number averaged: four
    judgements halve it, a hundred cut it by 90%. The reduction is arithmetic and guaranteed, and it does
    nothing whatever to bias. Where several people are unavailable, the source reports a weaker version
    of the same effect within one person — a second estimate by the same judge, better if separated by
    time or generated by deliberately arguing against the first. Beyond straight averaging the source
    describes select-crowd averaging, prediction markets, the Delphi method and its single-meeting form,
    estimate-talk-estimate.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      A single judgement is a sample of one drawn from a population of possible judgements; increasing
      sample size improves precision. The source adds a second-order gain: aggregating judges who are both
      independent and complementary beats aggregating redundant ones, because validity rises faster when
      judgements are uncorrelated. Its striking consequence is that "the average of that noisy group will
      be more accurate than the average of a unanimous one".
  scope:
    domain_discussed_by_source: [forecasting, juries, hiring, performance_appraisal]
    conditions: >-
      Independence is required; without it the arithmetic does not apply. The source also notes averaging
      is powerless against shared bias, so the gain in total error depends on the bias/noise mix.
  caveats:
  - text: >-
      The inner-crowd results are Vul and Pashler's and the dialectical-bootstrapping variant is Herzog
      and Hertwig's. The reported gains are small — about one tenth of a second opinion immediately, one
      third after three weeks, about one half with the dialectical instruction.
    origin: extractor_observed
  - text: >-
      Aggregation has a cost the source records elsewhere: Google found that beyond four interviews
      additional interviews added almost no predictive validity, and 360-degree systems became
      counterproductive as the number of raters and questions grew.
