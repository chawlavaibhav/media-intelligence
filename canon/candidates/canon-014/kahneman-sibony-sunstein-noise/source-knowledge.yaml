      The study is the authors' own; the Stevens results on brightness and the Social-Security-number
      anchoring demonstration are third parties'.
    origin: extractor_observed
  - text: >-
      The demonstration required each juror to judge ten cases. Real juries see one, which is exactly the
      source's point — the ranking remedy is unavailable in the setting the study models.
    origin: source_stated
  - text: >-
      The source's charge against American legal practice — that prohibiting any communication of other
      awards "assumes an ability that humans do not have" — is a normative claim about an institution,
      not a finding.
    origin: extractor_observed
  source_stated_problems:
