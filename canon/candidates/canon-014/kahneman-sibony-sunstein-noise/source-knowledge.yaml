- sk_id: sk_nse_0039
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "structuring complex judgments"
  - "decomposition, independence, and delayed holistic judgment"
  - "mediating assessments"
  - "do not exclude intuition, but delay it"
  concept_label: structuring_complex_judgments
  label_origin: source_verbatim
  claim: >-
    A structured complex judgement has three parts, and the source insists all three are required.
    Decomposition breaks the judgement into a small set of assessments defined in advance, which both
    directs attention to what matters and filters out what does not. Independence requires that evidence
    for each assessment be gathered and scored separately, because merely listing dimensions does not stop
    them contaminating one another. Delayed holistic judgement keeps the final integrating judgement human
    but forbids it until every assessment is complete.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Decomposition attacks the halo effect only if the scoring is genuinely separate — the source notes
      that ranking on an aggregate "work quality" would not reduce halo at all. Independence protects the
      evidentiary value of each assessment the way separating witnesses protects testimony. Delay lets the
      final intuition be anchored on fact-based, discussed ratings rather than on a first impression.
  scope:
    domain_discussed_by_source: [personnel_selection, performance_appraisal, corporate_acquisitions]
    conditions: >-
      Complex judgements with several separable dimensions. The source concedes that defining the
      assessments "gets difficult for unusual or senior positions, and this step of definition is
      frequently overlooked".
  caveats:
