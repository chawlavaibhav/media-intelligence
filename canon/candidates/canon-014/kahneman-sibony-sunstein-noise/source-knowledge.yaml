- sk_id: sk_nse_0026
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "substitution"
  - "a heuristic for answering a difficult question is to find the answer to an easier one"
  - "the outrage hypothesis"
  concept_label: substitution_of_an_easier_question
  label_origin: extractor_assigned
  claim: >-
    Faced with a hard question, people frequently answer an easier one instead, without noticing the
    swap, and report the answer as though it addressed the original. The substitute is typically a
    question of similarity, of ease of recall, or of feeling. Because the two questions have different
    correct answers, the substitution guarantees error: evidence gets weights appropriate to the easy
    question rather than the hard one. In the authors' own punitive-damages study the substituted question
    was emotional — "how angry am I?" — and mean outrage ratings correlated 0.98 with mean punitive
    intent across twenty-eight scenarios.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      System 1 supplies a fast answer to whatever nearby question it can answer, and System 2 endorses it.
      The tell is a misweighting that can be demonstrated experimentally: a factor that should matter is
      ignored, or one that should not is given weight. The source's demonstration is that harm suffered
      barely moved outrage ratings (4.24 severe versus 4.19 mild) but did move punitive intent (4.93
      versus 4.65) and doubled the median award — showing which question each scale was really answering.
  scope:
    domain_discussed_by_source: [jury_awards, probability_judgment, risk_perception, life_satisfaction]
    conditions: >-
      "The substitution happens, of course, only if the available information is relevant" — an
      irrelevant cue is correctly ignored rather than substituted.
  caveats:
  - text: >-
      The punitive-damages study is the authors' own (Kahneman, Schkade and Sunstein, reported 1998),
      run with 899 mock jurors on constructed vignettes. The Bill and Julie demonstrations are classic
      third-party heuristics-and-biases material.
    origin: extractor_observed
  - text: >-
      The 0.98 correlation is between the MEAN ratings of twenty-eight scenarios, not between
      individuals' judgements. Agreement on averages coexisted with very large disagreement case by
      case.
    origin: extractor_observed
  source_stated_problems:
  - "substituting one question for another will lead to an answer that does not give different aspects of the evidence their appropriate weights"
  - "The participants … were not even aware of assigning weights to the various features of the case"
  source_stated_remedies:
