- sk_id: sk_nse_0015
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "illusion of agreement"
  - "naive realism"
  - "Noise was like a leak in the basement. It was tolerated not because it was thought acceptable but because it had remained unnoticed"
  concept_label: illusion_of_agreement
  label_origin: source_verbatim
  claim: >-
    Professionals who disagree systematically in their daily judgements can work alongside one another
    for years without discovering it. The source's account is that shared vocabulary and shared rules
    supply constant, false evidence of agreement: colleagues agree readily that absurd judgements are
    absurd, and mistake that easy consensus for consensus on ordinary cases. Confidence grows from
    agreeing with one's own past self, not from ever checking agreement with others. Organisations then
    reinforce the illusion, because procedures are often arranged to minimise exposure to disagreement.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Two mechanisms are given. Psychologically, naive realism — the unquestioned belief that the world
      is as it looks and that others see it the same way — means alternatives to one's own reading are
      never generated, so disagreement is never anticipated. Organisationally, shared doctrine eliminates
      some possibilities without specifying a positive answer to any particular case, so drift between
      colleagues is invisible; and post-mortems examine only judgements far outside the norm, which are
      easy to agree about and therefore teach nothing about ordinary disagreement.
  scope:
    domain_discussed_by_source: [insurance_underwriting, university_admissions, organisational_decision_making]
    conditions: >-
      Settings where professionals judge alone after an apprenticeship and where second opinions, if
      taken at all, are not independent.
  caveats:
  - text: >-
      The supporting evidence is the authors' own: their insurance audit, their informal polling of 828
      CEOs and senior executives whose median expected difference was 10% against a measured 55%, and
      interviews they conducted. The naive-realism literature they invoke is third-party work.
    origin: extractor_observed
  - text: >-
      The admissions-office anecdote — a school that abandoned blind second reads because they produced
      "so many disagreements" — was related to the authors by Nathan Kuncel. It is a reported anecdote,
      not a study.
    origin: extractor_observed
  source_stated_problems:
  - "respected professionals—and the organizations that employ them—maintained an illusion of agreement while in fact disagreeing in their daily professional judgments"
  - "the discomfort of disagreement … Most organizations prefer consensus and harmony over dissent and conflict"
  - "Bad judgment is much easier to identify than good judgment"
  source_stated_remedies:
  - "The noise audit shattered the illusion of agreement"
  examples:
