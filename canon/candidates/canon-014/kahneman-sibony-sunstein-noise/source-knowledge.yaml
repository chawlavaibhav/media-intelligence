      The Google account is drawn from Laszlo Bock's book and from the company's own reporting; the
      structured-interview validity range (r = .44 to .57, PC 65-69%) comes from the personnel-selection
      literature. Neither is the authors' study.
    origin: extractor_observed
  - text: >-
      The source records that people dislike it: "there is some evidence that both interviewees and
      interviewers dislike structured interviews", and that there is continuing debate about what
      qualifies as structured.
    origin: source_stated
  - text: >-
      The source warns against the failure mode of bloated dimension lists produced by consensus —
      "vague wish lists … with no way to calibrate the characteristics or make trade-offs among them".
    origin: source_stated
  source_stated_problems:
