- sk_id: sk_nse_0031
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "the role of the response scale as a pervasive source of noise"
  - "ambiguous scales are noisy"
  - "People may differ in their judgments, not because they disagree on the substance but because they use the scale in different ways"
  concept_label: ambiguous_response_scales_generate_noise
  label_origin: extractor_assigned
  claim: >-
    A large share of apparent disagreement is disagreement about the scale rather than about the case. In
    the authors' own study, the same twenty-eight scenarios judged on three scales that ask substantively
    the same question produced very different amounts of noise: 51% of variance was noise on the
    punitive-intent scale, 71% on the outrage scale, and 94% on the dollar scale. The source's explanation
    is specificity of the scale's upper bound: "extremely severe punishment" is bounded by law in a way
    that "absolutely outrageous" is not, and dollars are not bounded at all.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Verbal anchors that different people interpret differently convert agreement about substance into
      disagreement about numbers. The clearer the upper bound of the scale, the less room there is for
      that divergence — which is why the ordering of noise across the three scales tracks the ordering of
      their specificity, not their content.
  scope:
    domain_discussed_by_source: [jury_awards, performance_appraisal, legal_standards_of_proof, probability_expressions]
    conditions: >-
      Judgements expressed on a scale defined by words or by an unbounded unit. The source generalises:
      "professional judgments are rarely expressed on scales that are so hopelessly ambiguous.
      Nonetheless, ambiguous scales are common."
  caveats:
  - text: >-
      This is the authors' own study (Kahneman, Schkade and Sunstein), with 899 mock jurors and
      constructed vignettes; each participant answered only one of the three questions, across ten of
      twenty-eight scenarios.
    origin: extractor_observed
  - text: >-
      The noise percentages depend on an explicit and possibly wrong assumption, which the source states:
      the average of individual judgements is treated as the unbiased just value, and every deviation
      from it is counted as error. "This is an assumption for purposes of analysis; we emphasize that it
      might be wrong."
