  concept_label: dignity_and_the_demand_for_individualized_treatment
  label_origin: extractor_assigned
  claim: >-
    The third objection the source raises is that people want an individualised hearing — a real person
    who considers their particular circumstances and has the power to act — and that noise may be the
    price of it. The source treats this as a real value with deep moral foundations rather than a
    confusion, and notes that it does not bite equally on all strategies: three judges instead of one, or
    guidelines that leave discretion, still give an individualised hearing; rigid rules do not. Its
    rebuttal is conditional: the interest in being heard matters, but not at the price of more deaths,
    more unfairness and higher costs.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The source locates the objection's force in the legal doctrine of individualised determination, and
      shows the doctrine cutting both ways: the same reasoning that struck down a mandatory death sentence
      also struck down a rule requiring pregnant teachers to leave five months before childbirth on the
      ground that there was no individualised determination — while, as the source observes, many
      unobjectionable rules are irrebuttable presumptions too, including voting ages and speed limits.
  scope:
    domain_discussed_by_source: [criminal_justice, lending, employment, university_admissions]
