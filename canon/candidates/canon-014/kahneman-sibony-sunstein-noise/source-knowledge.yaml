    - {description: "the same four adjectives read forwards and backwards, producing clearly different evaluations of the same person", figure_ref: null}
    - {description: "a 360-degree questionnaire of forty-six ratings on eleven dimensions, where an early strong rating pulls the rest with it", figure_ref: null}
    counter:
