      individualized treatment does not matter" and immediately adds that "there is a high price to pay
      if such treatment leads to all sorts of terrible consequences, including palpable unfairness".
    origin: source_stated
  - text: >-
      The argument is legal, literary and philosophical rather than empirical. No evidence is offered
      about how much people actually value individualised hearings or what they would trade for them.
    origin: extractor_observed
  source_stated_problems:
