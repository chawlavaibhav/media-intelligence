- sk_id: sk_nse_0027
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "excessive coherence"
  - "halo effect"
  - "we jump to conclusions, then stick to them"
  concept_label: excessive_coherence_and_the_halo_effect
  label_origin: source_verbatim
  claim: >-
    People form an overall impression from the first evidence they meet and then interpret everything
    after it in that impression's light, so identical evidence presented in different orders produces
    different conclusions. The source's demonstration is a four-adjective description of a candidate —
    intelligent, persistent, cunning, unprincipled — which reads far more favourably in that order than
    reversed. The consequence for a set of judgements is that whenever the order in which information
    arrives varies haphazardly across cases and judges, excessive coherence converts that arbitrary order
    into system noise.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      An evaluation forms before the evidence is complete and is not revised enough by what follows.
      Confirmation bias then reduces the weight given to later, conflicting data, and information already
      seen cannot be unseen. Where judgements on several dimensions are required, the first strong rating
      drags the rest with it — the halo effect — which is why nominally separate dimensions are not in fact
      assessed separately.
  scope:
    domain_discussed_by_source: [hiring, performance_appraisal, claims_adjusting, forensic_examination, consumer_choice]
    conditions: >-
      Requires sequential exposure to evidence. Where all judges receive the same information in the same
      order, the effect produces shared bias instead of noise.
  caveats:
  - text: >-
      The calorie-label study — labels to the left of the item mattering more than to the right, and the
      mirror-image result for Hebrew readers — is a third party's, and the source notes the wider
      evidence on calorie labelling is "disputed and mixed".
    origin: extractor_observed
  - text: >-
      The source concedes the process "is fine, of course, if the conclusions are correct". Excessive
      coherence is a failure only when the initial impression is wrong or arbitrary.
    origin: source_stated
  - text: >-
      The source records a practical limit on remedies: instructing jurors to disregard inadmissible
      evidence "is not a realistic instruction", though rejecting arguments built on it in deliberation
      may help.
    origin: source_stated
  source_stated_problems:
  - "we form coherent impressions quickly and are slow to change them"
  - "the halo effect implies that supposedly separate dimensions will in fact not be treated separately"
  - "the order in which data about a claim becomes available varies haphazardly … causing random variation in initial impressions"
  source_stated_remedies:
  - "People can reduce excessive coherence by breaking down the judgment problem into a series of smaller tasks"
  - "Was there accidental bias in the choice of considerations that were discussed early?"
  examples:
