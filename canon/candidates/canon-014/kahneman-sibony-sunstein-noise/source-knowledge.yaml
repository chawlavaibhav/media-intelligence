- sk_id: sk_nse_0023
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "informational cascades"
  - "social pressure cascades"
  - "people tend to neglect the possibility that most of the people in the crowd are in a cascade, too"
  - "chance variation in a small number of early movers"
  concept_label: cascades_and_group_polarization
  label_origin: extractor_assigned
  claim: >-
    A group's conclusion can be determined by who spoke first and what they said, rather than by the
    merits. Each subsequent speaker who lacks strong private grounds reasonably defers to the apparent
    weight of opinion already expressed, and the private information they held goes unshared. Social
    pressure produces the same pattern without any learning at all. The consequence the source stresses
    is diagnostic: unanimity and confidence in a group are weak evidence of correctness, because
    observers systematically underestimate how much of an apparent consensus is people following
    predecessors rather than judging independently.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The source's worked example runs a ten-person hiring meeting in sequence: Arthur names Thomas,
      Barbara defers because she trusts Arthur, Charles suppresses a contrary view because he is a
      respectful listener rather than a coward, and by the time Erica speaks the consensus is
      self-sustaining. Had Barbara spoken first, or Arthur felt slightly differently, the group would have
