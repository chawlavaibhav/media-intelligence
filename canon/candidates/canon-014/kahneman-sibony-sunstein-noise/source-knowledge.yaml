- sk_id: sk_nse_0042
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "mediating assessments protocol"
  - "options are like candidates"
  - "delay intuition, but don't ban it"
  concept_label: mediating_assessments_protocol
  label_origin: source_verbatim
  claim: >-
    The mediating assessments protocol applies the structure used for evaluating candidates to the
    evaluation of options. Its six steps are: define the assessments up front; ground each in an outside
    view and, for recurring decisions, in a case scale; keep the analytical work on each assessment
    independent; review each assessment separately in the decision meeting; take individual judgements
    before discussion and use estimate-talk-estimate; and delay the final holistic judgement without
    banning it. The source presents this as the integration of its other decision hygiene strategies, not
    a new one.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The protocol substitutes intermediate goals for the goal of reaching a decision, which is what stops
      the group processing all information in the light of a conclusion it is already reaching. The source
      predicts and welcomes a specific symptom: because the assessments are kept independent, the resulting
      profile is uneven rather than uniformly favourable, and the discrepancies are the material for a real
      debate.
  scope:
    domain_discussed_by_source: [corporate_acquisitions, venture_investment, strategic_decision_making]
    conditions: >-
      Applies "whenever the evaluation of a plan or an option requires considering and weighting multiple
      dimensions", for both singular and recurring decisions.
  caveats:
  - text: >-
      The protocol is illustrated with a stylised composite of real cases — a fictitious company — not
      with a reported study. The authors say so. No measured effect on decision quality is offered.
    origin: source_stated
  - text: >-
      The final step deliberately refuses mechanical aggregation of the assessment ratings, and the
      source's stated reasons are practical rather than accuracy-based: people game a system whose
      formula they know, and unanticipated broken legs would otherwise be missed.
    origin: source_stated
  - text: >-
      The source concedes the emphasis on process "may raise some eyebrows" and that the objections
      raised by its own fictional participants "are not unusual".
    origin: source_stated
  source_stated_problems:
  - "We are constantly aware of the final goal of reaching a decision, and we process all the information in light of that goal"
  - "we are at risk of using all the debate to confirm our first impressions"
  - "decision makers game the system when they know that a formula will be used"
  source_stated_remedies:
  - "structure the decision into mediating assessments"
  - "In the decision meeting, review each assessment separately"
  - "To make the final decision, delay intuition, but don't ban it"
  examples:
