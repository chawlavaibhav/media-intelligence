  concept_label: unanchored_ratio_scales_make_absolute_values_arbitrary
  label_origin: extractor_assigned
  claim: >-
    On an unbounded scale with a meaningful zero, a judge who is given no reference point must invent one
    on the first case and then judges everything else consistently against it. The absolute values are
    therefore arbitrary while the relative ordering is not. The authors demonstrated this by replacing each
    juror's dollar awards with their rank among that juror's own ten judgements: the noise share fell from
    94% to 49%, slightly below the noise in the ratings of punitive intent. Jurors agreed about the
    relative severity of the cases all along; the dollar scale hid it.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Stevens's finding is that a ratio scale can be tied down by a single intermediate anchor, and that
      both the judgements and their standard deviation scale proportionally with whatever anchor is
      supplied. With no anchor supplied, the judge's own first answer becomes the modulus. Ranking removes
      all judge-level differences mechanically, because the 1-to-10 distribution of ranks is the same for
      everyone.
  scope:
    domain_discussed_by_source: [jury_awards, willingness_to_pay, punitive_damages]
    conditions: >-
      Ratio scales — meaningful zero, unbounded top. The source contrasts these with bounded verbal
      rating scales, which behave differently.
  caveats:
