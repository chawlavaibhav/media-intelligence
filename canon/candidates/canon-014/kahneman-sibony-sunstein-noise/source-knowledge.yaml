- sk_id: sk_nse_0049
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "objective ignorance"
  - "the illusion of validity"
  - "denial of ignorance"
  - "wherever there is prediction, there is ignorance, and more of it than you think"
  concept_label: objective_ignorance_and_the_illusion_of_validity
  label_origin: extractor_assigned
  claim: >-
    The largest source of prediction error is usually not how good judgements are but how good they could
    be. Objective ignorance — what cannot be known plus what could be known but is not — is a property of
    the task, not of the judge, and it sets a ceiling that no amount of noise or bias reduction can lift.
    The characteristic error is to confuse confidence in reading a case with confidence in predicting an
    outcome; the source calls this the illusion of validity, and calls the belief that unpredictable
    events are predictable the denial of ignorance.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Evaluating a case and predicting an outcome are two different tasks, and only the first is one you
      have most of the information for. The internal signal fires on the first and is read as confidence in
      the second. The source adds an institutional consequence: because the achievable accuracy is low,
      decision makers reject formal methods that do not promise high validity and keep the intuitive
      method that supplies the emotional reward instead.
  scope:
    domain_discussed_by_source: [personnel_selection, political_forecasting, medical_diagnosis, social_science_prediction]
    conditions: >-
      Predictive tasks. The source notes objective ignorance is lower in some domains than others — "with
      respect to many illnesses, doctors' predictions are excellent" — and that it accumulates the further
      ahead one looks.
  caveats:
  - text: >-
      All the ceiling evidence is third-party: Tetlock's expert political judgement work, the Fragile
      Families common-task challenge with 160 teams, the personnel-selection review giving r = .28 for
      human judges against .44 for mechanical prediction, and the Mullainathan and Obermeyer heart-attack
      model.
    origin: extractor_observed
  - text: >-
      The source draws the practical conclusion in the opposite direction from despair: a rise from PC
      59% to 65% is worth having, and "none of them would buy a lottery ticket that had a 59% chance of
      winning if they could buy, for the same price, one with a 65% chance".
    origin: source_stated
  - text: >-
      Because objective ignorance is a ceiling on accuracy and not on agreement, it does not license
      tolerating noise: noise reduction remains available below the ceiling.
    origin: extractor_observed
  source_stated_problems:
  - "It is the limit on how good they could be"
  - "If you are as confident in your predictions as you are in your evaluation of cases, however, you are a victim of the illusion of validity"
  - "leaders say they are especially likely to resort to intuitive decision making in situations that they perceive as highly uncertain"
  source_stated_remedies:
  - "Have we checked whether the experts we trust are more accurate than dart-throwing chimpanzees?"
  - "As long as algorithms are not nearly perfect … human judgment will not be replaced. That is why it must be improved"
  examples:
    positive:
    - {description: "executives estimating their own hiring accuracy at PC 75-85% against a measured average of about 59%", figure_ref: null}
    - {description: "160 teams with thousands of variables per family predicting eviction at r = .22", figure_ref: null}
    counter:
    - {description: "'you know most of what you need to know to assess the two cases' — the evaluation half of the task, where confidence is warranted", figure_ref: null}
