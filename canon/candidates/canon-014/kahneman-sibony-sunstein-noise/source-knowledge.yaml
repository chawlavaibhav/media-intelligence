- sk_id: sk_nse_0044
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "reducing noise can be expensive; it might not be worth the trouble"
  - "an optimal level of noise that is not zero"
  - "invoking the difficulty of reducing noise is nothing but an excuse not to measure it"
  concept_label: costs_of_noise_reduction_may_exceed_benefits
  label_origin: extractor_assigned
  claim: >-
    The source accepts, as a first objection in its own catalogue of seven, that noise reduction has costs
    and that these can exceed the benefits. Its worked case is a teacher grading twenty-five essays a week
    for whom a second reader, a checklist or repeated readings may simply not be worth it — and it notes
    the calculation changes with the stakes, so the same effort that is overkill for a weekly assignment
    is warranted for a senior thesis. Its rebuttal is not that the cost is never real but that the cost
    argument is usually deployed without measurement: absent an audit, no one knows what is being bought.
  claim_type: explicit_source_claim
