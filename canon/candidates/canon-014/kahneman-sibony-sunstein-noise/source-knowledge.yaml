  - "we cannot measure noise in a singular decision, but if we think counterfactually, we know for sure that noise is there"
  concept_label: singular_decisions_are_noisy_too
  label_origin: extractor_assigned
  claim: >-
    A decision made once — no precedent, no prepackaged response, genuinely unique features — cannot
    exhibit measurable noise, because there is no second judgement of the same case to compare it with.
    The source argues that the noise is nevertheless present: the factors that produce disagreement among
    judges of recurrent cases are all still operating, and a different but equally competent decision
    maker, or the same one on a different day, could have concluded otherwise. The practical consequence
    is that the same noise-reduction procedures apply, which the source concedes is counter-intuitive.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The shooting-range analogy is run in reverse: observing only the first shooter of a team tells you
      nothing about the team's scatter, but the unsteady hand that produced the scatter is present in that
      first shot too. Unmeasurability is a property of the observation, not of the process.
  scope:
    domain_discussed_by_source: [political_decision_making, military_command, corporate_strategy, personal_decisions]
    conditions: >-
      The source states there is a continuum rather than a category difference; extreme cases at each end
      are what make the distinction meaningful.
  caveats:
