- sk_id: sk_nse_0018
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "predictive judgment"
  - "evaluative judgment"
  - "nonverifiable"
  - "What's Wrong with Noise"
  concept_label: predictive_versus_evaluative_judgment
  label_origin: extractor_assigned
  claim: >-
    Predictive judgements aim at a true value, which may or may not ever be revealed; evaluative
    judgements match a response to the perceived merits of a case and have no true value to aim at.
    Noise is a defect in both, but for different reasons. In predictive judgement, disagreement proves
    that at least one judge is wrong. In evaluative judgement, disagreement is a failure of fairness and
    of institutional credibility: people affected by an evaluation expect it to express the values of the
    system, not of whichever individual happened to be assigned. The source stresses that the boundary is
    fuzzy and that judges are usually unaware of which side they are on.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The asymmetry follows from what a true value does. Where one exists, two different judgements
      cannot both be right, so scatter implies error directly. Where none exists, scatter cannot be
      convicted of inaccuracy but still turns an assignment into a lottery, and "System noise is
      inconsistency, and inconsistency damages the credibility of the system."
  scope:
    domain_discussed_by_source: [criminal_sentencing, essay_grading, wine_judging, forecasting, medical_diagnosis, strategic_decision_making]
    conditions: >-
      The source notes that most consequential decisions contain both: predictive judgements supply the
      inputs, and evaluative judgements resolve the trade-offs between options.
  caveats:
  - text: >-
      The source's own error equation is declared inapplicable to evaluative judgements, so the
      quantitative apparatus that supports most of the book's argument does not extend to them.
    origin: source_stated
  - text: >-
      "Professionals feel much the same, act much the same, and speak much the same to justify
      themselves" whether the judgement is predictive or evaluative — the source concedes the
      distinction is invisible from the inside.
    origin: source_stated
  source_stated_problems:
  - "The observation of noise in predictive judgments always indicates that something is wrong"
  - "large disagreements about the same case violate expectations of fairness and consistency"
  - "People who are affected by evaluative judgments expect the values these judgments reflect to be those of the system, not of the individual judges"
  source_stated_remedies:
  - "Regardless of whether the goal of judgment is just accuracy or a more complex trade-off between values, noise is undesirable and often measurable"
  examples:
    positive:
    - {description: "one customer with a defective laptop fully reimbursed and another given an apology — evaluative noise as an inconsistency problem, not an accuracy problem", figure_ref: null}
    - {description: "two doctors disagreeing on a diagnosis — predictive noise, where at least one must be wrong", figure_ref: null}
    counter: []
  intra_source_relations:
