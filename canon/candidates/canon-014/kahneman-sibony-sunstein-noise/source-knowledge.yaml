  - {relation: qualified_by, target: sk_nse_0049, note: "the signal is unrelated to the achievable accuracy set by objective ignorance"}
  - {relation: trades_off_with, target: sk_nse_0036, note: "sequencing deliberately withholds the information that would let the signal fire early"}
