- sk_id: sk_nse_0040
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "a shared scale grounded in an outside view"
  - "case scale"
  - "frame-of-reference training"
  - "behaviorally anchored rating scales"
  concept_label: shared_scale_anchored_in_case_examples
  label_origin: extractor_assigned
  claim: >-
    If different judges use different scales there will be noise, so the source's remedy is to anchor the
    scale in something shared. Behaviourally anchored scales, which attach a described behaviour to each
    degree, help but are not sufficient. The stronger form is a case scale: anchor points defined by
    concrete reference cases known to everyone, so that rating a new case becomes a comparison rather than
    an absolute judgement. Frame-of-reference training, where raters practise on vignettes and see how
    their ratings compare with expert ratings, is the source's named method for installing one.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Judgement entails translating an impression onto a scale; a shared, concretely anchored scale
      removes the part of the divergence that is about the scale rather than the case, and converts the
      matching operation into the comparison at which people are more reliable. In recurring decisions the
      organisation's own past cases can serve as the anchors.
  scope:
    domain_discussed_by_source: [performance_appraisal, hiring, investment_evaluation]
    conditions: >-
      Requires an agreed set of anchor cases known to all raters and kept up to date. The source notes
      these must be customised per organisation and unit and "frequently updated as job requirements
      evolve".
  caveats:
  - text: >-
      Frame-of-reference training is third-party research, and the source records a serious limitation:
      "the majority of studies of frame-of-reference rater training have so far been conducted on
      students, not on actual managers."
    origin: source_stated
  - text: >-
      The source explains why it has not spread — it is complex, time-consuming, requires customisation,
      and reduces raters' ability to steer outcomes, which "is certain to generate considerable
      resistance".
    origin: source_stated
  - text: >-
      Figure 18 contrasts a behaviourally anchored scale with a case scale and was not inspected; the
      prose states the distinction.
    origin: extractor_observed
  source_stated_problems:
  - "if different judges use different scales, there will be noise"
  - "different raters have completely different ideas of what 'good' or 'great' means"
  - "true variance … accounts for no more than 20 to 30% of the total variance"
  source_stated_remedies:
