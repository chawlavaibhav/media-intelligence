- sk_id: sk_nse_0030
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "The Magical Number Seven, Plus or Minus Two"
  - "Explicit comparisons between objects of judgment support much finer discriminations than do ratings of objects evaluated one at a time"
  - "Comparative or relative judgments are more sensitive than categorical or absolute ones"
  concept_label: relative_judgments_are_less_noisy_than_absolute_ones
  label_origin: extractor_assigned
  claim: >-
    People can reliably place items into only about seven categories on an intensity scale, and the limit
    barely moves when the range of the stimuli widens. Any rating scale finer than that resolution
    manufactures noise. Comparison is not subject to the same limit: people can rank items they cannot
    reliably label, so replacing absolute ratings with comparisons — or with ratings on an explicitly
    comparative scale — reduces noise. The source's practical recipe is to sort into a small number of
    categories first, then rank within each.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Absolute judgement requires holding a whole scale in mind and assigning a label to one item at a
      time; comparison requires only deciding which of two is greater, which people do far more finely.
      The source notes the limit can be pushed by hierarchical categorisation, but only where the
      categories exist in advance with clear boundaries — categorisation is "not under voluntary control
      when you are in the fast-thinking mode".
  scope:
    domain_discussed_by_source: [essay_grading, restaurant_and_singer_ratings, performance_appraisal, punitive_damages]
    conditions: >-
