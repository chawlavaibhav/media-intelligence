- sk_id: sk_nse_0035
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "The goal of judgment is accuracy, not individual expression"
  - "judgment is not the place to express your individuality"
  - "decision hygiene"
  concept_label: judgment_is_not_the_place_for_individuality
  label_origin: source_verbatim
  claim: >-
    The source's first principle of decision hygiene is that judgement aims at accuracy, not at
    self-expression. Because stable pattern noise — the largest component of system noise — is a direct
    consequence of individual differences in how people read cases, the uniqueness that makes a person
    interesting is exactly what makes a judgement system noisy. The source is careful about the boundary:
    individuality and creativity are essential in choosing goals, framing problems and generating
    options, and become a defect only at the point of judging between them.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The operational test the source derives is perspectival: "when the goal is accuracy and you expect
      others to agree with you, you should also consider what other competent judges would think if they
      were in your place." That substitutes an ensemble standard for a personal one at the moment of
      judgement.
  scope:
    domain_discussed_by_source: [professional_judgment, organisational_decision_making]
    conditions: >-
      Judgements where agreement is expected. The principle does not reach matters of taste, idea
      generation, or competitive settings where variation is selected on.
  caveats:
  - text: >-
      The source itself calls the conclusion unpopular and grounds it on the tentative finding that
      stable pattern noise dominates — a finding it hedges as drawn from a limited selection of examples.
    origin: source_stated
  - text: >-
