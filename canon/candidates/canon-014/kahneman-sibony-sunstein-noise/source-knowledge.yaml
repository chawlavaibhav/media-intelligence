- sk_id: sk_nse_0025
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "psychological biases create system noise when judges are biased in different ways, or to a different extent"
  - "psychological bias"
  - "statistical bias"
  concept_label: psychological_biases_create_noise_when_unshared
  label_origin: extractor_assigned
  claim: >-
    A psychological bias is a mechanism; whether it shows up as bias or as noise depends on how widely it
    is shared. When everyone is pulled the same way by the same amount, the result is statistical bias.
    When people differ in which biases affect them, in how strongly, or in what triggers them, the same
    mechanisms produce system noise instead. The source therefore refuses the common inference that
    "psychological bias" implies a directional error, and separately objects to using the word "bias" as
    a catch-all explanation for any bad outcome.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Three families are given. Substitution misweights the evidence; conclusion biases, including
      prejudgment, the affect heuristic and anchoring, either bypass the evidence or distort its reading;
      excessive coherence magnifies first impressions. Each produces noise rather than bias when its
      trigger is idiosyncratic — a question answered by consulting one's social circle, an order of
      information that arrives haphazardly, a prejudgment that half the judges hold and half do not.
  scope:
    domain_discussed_by_source: [claims_adjusting, asylum_adjudication, hiring, forecasting]
    conditions: >-
      Requires either individual differences in bias, or context-dependence in the trigger. Shared,
      uniformly-triggered biases yield bias, not noise.
  caveats:
  - text: >-
      The bias catalogue is drawn from half a century of third-party research reviewed elsewhere, not
      from studies conducted for this book. Nothing in this extraction asserts anything about the
      current replication status of any of those findings.
    origin: extractor_observed
  - text: >-
      The source draws a hard line on what counts as an explanation: a bias explains a judgement error
      only if it could have been predicted in advance or detected in real time, and it explicitly calls
      after-the-fact bias attribution "completely vacuous".
    origin: source_stated
  - text: >-
      The BIN analysis of the Good Judgment Project found that training aimed at reducing bias in fact
      worked mainly by reducing noise — a result the source reports as surprising to the researchers
      themselves. That analysis is Satopää, Tetlock, Mellers and Salikhov's, not the authors'.
    origin: extractor_observed
  source_stated_problems:
  - "blaming every undesirable outcome on biases is a worthless explanation"
  - "when there are large individual differences in biases (different prejudgments) or when the effect of biases depends on context (different triggers), there will be noise"
  source_stated_remedies:
  - "We recommend reserving the word bias for specific and identifiable errors and the mechanisms that produce them"
  examples:
    positive:
    - {description: "half of hiring managers biased against women and half in their favour: no overall bias, and a great many wrong hires", figure_ref: null}
    - {description: "'Is there climate change?' answered by 'do I trust the people who say so?' — the same substitution producing different answers per person", figure_ref: null}
    counter:
    - {description: "Bill the accountant, where the substitution is shared by nearly everyone and produces a common error with no noise at all", figure_ref: null}
  intra_source_relations:
