- sk_id: sk_nse_0013
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "noise audit"
  - "an experiment in which several professionals make independent judgments of the same cases"
  - "All we need to measure noise is multiple judgments of the same problem"
  concept_label: noise_audit
  label_origin: source_verbatim
  claim: >-
    A noise audit is an experiment in which several interchangeable professionals each judge the same
    cases, independently, without being told that the variability of their answers is the object of
    study. The spread of their answers is the measurement. No true value is needed. Because each judge
    handles several cases, the audit recovers not just the total amount of disagreement but its
    composition — how much comes from some judges being generally more severe, and how much from judges
    ranking the same cases differently.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Normal operations assign one case to one judge, so two judgements of the same case never exist and
      the disagreement is never observable. An audit manufactures the missing observation by making
      several judges work the same case. The multi-case design is what makes the level/pattern split
      arithmetically recoverable.
  scope:
    domain_discussed_by_source: [insurance_underwriting, criminal_sentencing, organisational_decision_making, forensic_examination]
    conditions: >-
      The judges must be genuinely interchangeable — the source's test is that if one were unavailable
      another would be assigned and expected to reach a similar judgement. The source recommends a task
      that can be completed from written information and answered numerically.
  caveats:
  - text: >-
      The insurance audit that supplies the source's headline numbers was conducted by the authors'
      own consulting engagement at one company. It is their study, not a survey of an industry.
    origin: extractor_observed
  - text: >-
      An audit measures disagreement, not accuracy. The source is explicit that no one could say how
      much error or bias there was, "because no one could know for sure the Goldilocks value for each
      case".
    origin: source_stated
  - text: >-
      Audits use constructed cases, not live work. The source's own defence is an a fortiori argument:
      if much disagreement appears on simplified cases, real cases can only be worse. That is an
      argument, not a measurement.
    origin: extractor_observed
  source_stated_problems:
  - "no one at the company had expected anything like the amount of noise we had observed"
  - "the amount of noise observed when an organization takes a serious look almost always comes as a shock"
