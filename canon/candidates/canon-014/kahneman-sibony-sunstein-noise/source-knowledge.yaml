- sk_id: sk_nse_0033
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "clinical judgment"
  - "mechanical prediction"
  - "the model of the judge"
  - "simple models beat humans"
  - "mindless consistency"
  concept_label: mechanical_aggregation_outperforms_clinical_judgment
  label_origin: extractor_assigned
  claim: >-
    Where the same predictors are available to both, a rule that combines them the same way every time
    generally out-predicts a person combining them case by case. The result holds for three successively
    more damaging comparisons: a model fitted to the outcomes beats the judge; a model fitted to the
    judge's own past judgements beats that same judge; and in one study, randomly weighted linear models
    beat the human experts in 77% to 100% of ten thousand trials. The source's diagnosis is that the
    subtlety human judges believe they contribute is mostly noise, and that removing it improves accuracy
    even when some of the subtlety is genuinely valid.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      A model of a judge can only subtract: it drops the judge's complex rules and it drops the judge's
      pattern noise and occasion noise. If the lost subtlety were worth more than the removed noise, the
      model would lose. It does not. The source adds why valid subtlety rarely pays: complex rules apply
      only under rarely-observed conditions, and measurement error at both ends drowns their advantage.
  scope:
    domain_discussed_by_source: [personnel_selection, academic_prediction, clinical_diagnosis, bail_decisions]
    conditions: >-
      Predictive judgements with a measurable outcome and a common set of predictors. The source insists
      "we should not conclude that any model beats any human", and notes the Yu and Kuncel result is
      extreme because the human judges performed very poorly in absolute terms.
  caveats:
  - text: >-
      Every study cited is a third party's: Meehl's 1954 review of twenty studies, the 2000 review of
      136 studies (mechanical better in 63, tied in 65, clinical better in 8), Goldberg's model-of-the-
      judge work, and Yu and Kuncel's random-model study on 847 candidates.
    origin: extractor_observed
  - text: >-
      The margin is small. The source states plainly that "models are consistently better than people,
      but not much better" — in the median study of that review clinicians were right 68% of the time
      and formulas 73%.
    origin: source_stated
  - text: >-
      In many of the studies the human judges had access to private information the model did not,
      which the source describes as an unfair advantage to the humans that they still failed to convert.
    origin: source_stated
  - text: >-
      The source explicitly declines the conclusion that people should be replaced: "Our goal in this
      book is to offer suggestions for the improvement of human judgment, not to argue for the
      'displacement of people by machines'."
    origin: source_stated
  source_stated_problems:
  - "clinicians and other professionals are distressingly weak in what they often see as their unique strength: the ability to integrate information"
  - "the gains from subtle rules in human judgment—when they exist—are generally not sufficient to compensate for the detrimental effects of noise"
  - "You may believe that you are subtler, more insightful, and more nuanced than the linear caricature of your thinking. But in fact, you are mostly noisier"
  source_stated_remedies:
