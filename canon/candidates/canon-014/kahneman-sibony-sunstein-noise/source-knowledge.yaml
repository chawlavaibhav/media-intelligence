- sk_id: sk_nse_0038
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "respect-experts"
  - "actively open-minded thinking"
  - "perpetual beta"
  - "good judgments depend on what you know, how well you think, and how you think"
  concept_label: selecting_better_judges
  label_origin: extractor_assigned
  claim: >-
    Some judges are both less noisy and less biased than their equally qualified peers, and three things
    distinguish them: task-specific skill, general mental ability, and a cognitive style the source calls
    actively open-minded — actively seeking information that contradicts one's own hypothesis and being
    willing to change one's mind. The source separates true experts, whose superiority is verifiable
    against outcomes, from respect-experts, whose standing rests only on peers' regard, and warns that
    the traits that produce respect — confidence, fluency, a coherent story — are not the traits that
    produce accuracy.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Respect-experts are trusted because they share professional doctrine, have experience, and
      construct coherent stories with confidence; the source notes the confidence heuristic gives confident
      people extra weight in a group whether or not the confidence is warranted. Since doctrine "does not
      fully specify how to proceed", identically trained professionals drift apart in applying it, so
      shared training buys agreement on absurdity without buying agreement on cases.
  scope:
    domain_discussed_by_source: [forecasting, underwriting, criminal_sentencing, wine_tasting, political_analysis]
    conditions: >-
      Selection is available and someone can be identified as better. The source concedes that in practice
      you often cannot test people and must guess who the abler ones are.
  caveats:
  - text: >-
      The evidence is entirely third-party: the GMA literature, the cognitive reflection test, the
      need-for-cognition scale, Baron's actively-open-minded scale, and the Good Judgment Project's
      finding that selection had the largest effect of the three interventions tested.
    origin: extractor_observed
  - text: >-
      The source flags a trap in using apparent ability as the selection signal: high mental ability also
      improves the ability to convince others, so it produces respect-experts in the absence of any
      reality feedback. "Medieval astrologers must have been among the highest-GMA people of their time."
    origin: source_stated
  - text: >-
      The BIN analysis found that selection, like training and teaming, worked mainly by reducing noise
      rather than by better reading of the evidence — a result the researchers themselves called a
      surprise.
    origin: extractor_observed
  - text: >-
      Haran, Ritov and Mellers found the need for cognition did NOT reliably predict forecasting
      performance; only actively open-minded thinking did. The source records the negative result.
    origin: source_stated
  source_stated_problems:
  - "The confidence we have in these experts' judgment is entirely based on the respect they enjoy from their peers"
  - "It can be sensible to place your trust in people who look and sound intelligent … but this strategy is insufficient and may even backfire"
  - "Even identically trained professionals who agree on the doctrine they are applying will drift away from one another in their application of it"
  source_stated_remedies:
