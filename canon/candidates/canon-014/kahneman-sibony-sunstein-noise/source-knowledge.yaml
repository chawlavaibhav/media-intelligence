- sk_id: sk_nse_0029
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "matching prediction"
  - "nonregressive"
  - "regression to the mean"
  - "Intuitive predictions that match the evidence are too extreme, both when they are optimistic and when they are pessimistic"
  concept_label: matching_predictions_are_nonregressive
  label_origin: extractor_assigned
  claim: >-
    An intuitive prediction typically carries the intensity of the evidence straight onto the outcome
    scale, as if the evidence were perfectly predictive of the outcome. It almost never is. The correct
    prediction lies between the outside-view average and the intuitive match, at a distance from the
    average proportional to the actual predictive value of the evidence. The source's correction
    procedure is explicit and arithmetic: make the intuitive guess, find the mean for the reference class,
    estimate the correlation, then move from the mean toward the guess by that proportion.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Matching is a substitution of an evidence-intensity question for a prediction question, so the
      answer inherits the evidence's extremity. Because past and future performance are imperfectly
      correlated, extreme observations tend to become less extreme; a prediction that ignores this is
      systematically too extreme in whichever direction the evidence points.
  scope:
    domain_discussed_by_source: [academic_prediction, sales_forecasting, hiring, film_production]
    conditions: >-
      Predictive judgements scored for accuracy. The source notes the correction "can be neglected only in
      very easy problems, when the information available supports a prediction that can be made with
      complete confidence".
  caveats:
  - text: >-
      The source concedes corrected predictions "will inevitably result in some highly visible failures"
      in hindsight, because they never bet on outliers. Its defence is that the opposite error is far
      more frequent.
    origin: source_stated
  - text: >-
      The correlation estimate the procedure requires "will have to be a back-of-the-envelope estimate"
      in all but rare cases. The precision of the corrected number is therefore illusory.
    origin: source_stated
  - text: >-
      The source records an asymmetry it does not fully explain: people resist matching predictions from
      unfavourable evidence more than from favourable evidence, and the asymmetry disappears as more
      information arrives.
    origin: source_stated
  source_stated_problems:
  - "The matching prediction can be justified only if reading precocity and college GPA are perfectly correlated, which is clearly not the case"
  - "Producers routinely anticipate that the next movie of a director whose previous movie was a hit will be just as successful"
  - "predictions should be moderate"
  source_stated_remedies:
  - "The optimal prediction must lie between these two extremes of perfect knowledge and zero knowledge"
  - "adjust from the mean, in the direction of your intuitive guess, in proportion to the correlation you have estimated"
  examples:
    positive:
    - {description: "Julie's GPA: intuitive 3.8, class mean 3.2, evidence correlation at most .20, corrected prediction about 3.3", figure_ref: null}
    - {description: "an outstanding interview suggesting $1m of first-year sales against a $500k mean, corrected to at most $700k at a generous r = .40", figure_ref: null}
    counter:
    - {description: "knowing Julie's grades in every subject — perfectly predictive of her GPA, so no regression is needed", figure_ref: null}
  intra_source_relations:
