- sk_id: sk_nse_0043
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "judgment guidelines"
  - "guidelines succeed in reducing noise because they decompose a complex decision into a number of easier subjudgments on predefined dimensions"
  - "the diagnostic criteria of some disorders are still vague and difficult to operationalize"
  concept_label: judgment_guidelines_and_their_limits
  label_origin: extractor_assigned
  claim: >-
    A guideline sits between open discretion and a rule: it does not eliminate judgement, it decomposes
    it. The source's account of why guidelines reduce noise has three parts — they focus the judge on a
    fixed set of predictors known to matter, they specify how each is to be assessed so each sub-judgement
    is easier, and they aggregate the sub-judgements mechanically instead of leaving the weighting to the
    judge. The limit follows directly from the mechanism: where the criteria themselves remain vague, the
    decomposition buys little, which is the source's explanation for the persistently high noise in
    psychiatric diagnosis despite successive revisions of its manual.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      In the Apgar score only heart rate is strictly numerical; the other four components still involve
      judgement, but each is simple enough that practitioners with modest training rarely disagree much.
      Noise reduction comes from making each sub-judgement easy and from removing the judge's discretion
      over the weights, not from removing judgement.
  scope:
    domain_discussed_by_source: [medical_diagnosis, psychiatry, criminal_sentencing]
    conditions: >-
      Works where the components can be defined concretely. The source states that "to the extent that such
      criteria are relatively open-ended, noise remains likely".
  caveats:
  - text: >-
      All the medical evidence is third-party: the Apgar and Centor scores, the BI-RADS interrater
      study, and the psychiatric reliability studies from 1964 onwards including the DSM-5 field trials.
    origin: extractor_observed
  - text: >-
      The psychiatric case is a genuine negative result the source reports rather than explains away:
      field trials found agreement on major depressive disorder "between 4 and 15% of the time", and
      some DSM-5 diagnoses were "so unreliable as to appear useless in clinical practice".
    origin: source_stated
  - text: >-
      The source notes the explanations for psychiatric noise are themselves contested — "the
      explanations for noise are themselves noisy" — and declines to predict whether proposed fixes will
      work.
    origin: source_stated
  - text: >-
      Guidelines are a point on a continuum, not a category. The source states that "when guidelines are
      tightened so as to eliminate that discretion, they turn into rules".
    origin: source_stated
  source_stated_problems:
  - "When diagnosing the same patient using the same diagnostic criteria, psychiatrists frequently disagree with one another"
  - "the reliance on the patient's subjective symptoms, the clinician's interpretation of the symptoms, and the absence of objective measure … implant the seeds of diagnostic unreliability"
  source_stated_remedies:
  - "A focus on the relevant predictors, simplification of the predictive model, and mechanical aggregation—all of these reduce noise"
  - "clarifying diagnostic criteria, moving away from vague standards"
  - "producing 'reference definitions' of symptoms and their level of severity"
  examples:
    positive:
    - {description: "the Apgar score: five predefined components, each with a concrete three-point description, summed mechanically", figure_ref: null}
    counter:
    - {description: "successive revisions of the psychiatric manual, where more explicit criteria reduced noise only modestly and one revision appears to have increased it", figure_ref: null}
  intra_source_relations:
