- sk_id: sk_nse_0048
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "rules and standards"
  - "Rules are meant to eliminate discretion by those who apply them; standards are meant to grant such discretion"
  - "the costs of decisions and the costs of errors"
  - "the rules will simply drive discretion underground"
  concept_label: rules_versus_standards
  label_origin: extractor_assigned
  claim: >-
    Rules eliminate discretion and therefore noise; standards export decision authority and therefore
    invite it. The source's framework for choosing reduces to two factors: the cost of making decisions
    and the cost of errors. Standards make every decision expensive because someone must give the
    open-ended term content; rules make decisions cheap but make writing the rule expensive, and are
    sometimes prohibitively so. On errors there is no general winner. The decisive practical question is
    trust: principals impose rules when they cannot rely on their agents to be competent, unbiased, and
    practising decision hygiene.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Where many similar decisions must be made, the per-decision cost of a standard accumulates and the
      one-off cost of writing a rule amortises, which is why the source says repeated decisions argue for
      moving toward rules. It also names the failure mode: a rule that produces terrible results in
      particular cases gets quietly ignored — jury nullification, prosecutors declining to charge a third
      felony, employees disregarding stupid rules — so noise reappears where no one can hear it.
  scope:
    domain_discussed_by_source: [law, content_moderation, corporate_policy, medicine, aviation]
    conditions: >-
      The source notes rules and standards are a continuum and can be mixed — a rule constraining the pool,
      a standard choosing within it — and that guidelines can sit at either end.
  caveats:
  - text: >-
      The source records a reason for standards that has nothing to do with judgement quality: where a
      group is divided or lacks the information to write a sensible rule, a standard may be the only
      thing that can be agreed at all.
    origin: source_stated
  - text: >-
      Rules do not automatically end noise: fact-finding under a rule is itself judgement and can be
      noisy or biased. The reduction depends on people actually following the rule.
    origin: source_stated
  - text: >-
      The Facebook example is drawn from the company's public Community Standards and a non-public
      implementation document obtained by a magazine, not from a study.
    origin: extractor_observed
  - text: >-
      The source's closing position is normative and it says so — that legal systems should do much more
      to control noise, and that it would "not go so far" as to make noise reduction a human right.
    origin: source_stated
  source_stated_problems:
  - "In private and public organizations, noise is often a product of a failure to issue rules"
  - "there is a risk that noise will reemerge"
  - "When such things happen, there will be noise, but no one will hear it"
  - "We often use standards when we should embrace rules—simply because we don't pay attention to noise"
  source_stated_remedies:
  - "Principals need to impose rules when they have reason to distrust their agents"
  - "We need to monitor our rules to make sure they are operating as intended"
  - "they are willing to devote considerable time and attention, in advance, to ensuring that the rules are accurate (enough)"
  examples:
