- sk_id: sk_nse_0017
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "Multiple, conflicting cues create the ambiguity that defines difficult judgment problems"
  - "if there is more than one way to see anything, people will vary in how they see it"
  - "Large individual differences emerge when a judgment requires the weighting of multiple, conflicting cues"
  concept_label: conflicting_cues_make_complex_judgments_noisier
  label_origin: extractor_assigned
  claim: >-
    Agreement is high when the cues in a case point the same way, because everyone can build the same
    coherent story from them. Noise appears when the cues conflict, because there is then more than one
    defensible way to see the case: people select different pieces of evidence as the core of their
    narrative, weight them differently, and arrive at different conclusions each of which feels coherent
    to its owner. The source's rule is blunt — the more ways there are to see something, the more people
    will vary in how they see it — and this is where pattern noise comes from.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The source decomposes a complex judgement into three steps, each contributing variability:
      selective attention and recall over the available cues; informal — not formal — integration of
      those cues into an overall impression; and the conversion of that impression into a value on a
      scale. Where the cues cohere, the first two steps converge across people; where they conflict, they
      do not.
  scope:
    domain_discussed_by_source: [executive_selection, academic_prediction, recruitment, professional_judgment]
    conditions: >-
      Complex judgements from a mass of partly inconsistent information. The source notes that agreement
      remains fairly high on single dimensions and on cues that point the same general direction.
  caveats:
  - text: >-
      The demonstration cases — Gambardi and Julie 2.0 — were written by the authors to be difficult and
      were presented to readers and, in Gambardi's case, to 115 MBA students whose estimates ranged from
      10 to 95. That is the authors' own demonstration, and it was designed to produce the effect it
      illustrates.
    origin: extractor_observed
  - text: >-
      The source concedes it made the Gambardi case for one purpose and only later noticed it
      illustrated another — "it took us weeks before we realized that it was also a prime example of the
      bias we describe here". The cases are illustrations, not controlled comparisons of cue coherence.
    origin: source_stated
  source_stated_problems:
  - "There is a mass of information, much of it seemingly inconsistent"
  - "some noise is inevitable in an informal operation"
  - "you can be quite certain that other readers will construct different stories that justify judgments other than yours"
  source_stated_remedies: []
