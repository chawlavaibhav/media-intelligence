- sk_id: sk_nse_0022
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "statistical juries"
  - "deliberating juries were far noisier than statistical juries"
  - "Deliberation had the effect of increasing noise"
  - "group polarization"
  concept_label: group_deliberation_increases_noise
  label_origin: extractor_assigned
  claim: >-
    Aggregating judgements mechanically reduces noise; discussing them can increase it. In the authors'
    own experiments, virtual six-person juries formed by taking the median of six independent judgements
    were markedly less noisy than real six-person juries that met and discussed the same case. The
    deliberating groups also became more extreme in the direction their median member already leaned —
    more lenient when the median was lenient, more severe when severe — and 27% of them awarded as much as
    or more than their most severe member.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      Two mechanisms are given. Informational: a group leaning one way hears mostly arguments for that
      way, so listening members shift further in it. Reputational: members who care about standing in the
      group shift toward the dominant tendency as well. The source adds that group dynamics amplify
      whatever level, pattern and occasion noise the individual members brought in, notably through
      whoever speaks first.
  scope:
    domain_discussed_by_source: [juries, professional_teams, corporate_decision_making]
    conditions: >-
      Groups that deliberate before recording individual views. The source is explicit that the noise
      reduction it contrasts this with "was a mechanical effect of statistical aggregation".
  caveats:
  - text: >-
      These are the authors' own studies: 899 participants for the statistical juries, then more than
      three thousand jury-eligible citizens forming more than five hundred six-person juries. Both used
      constructed product-liability vignettes with mock jurors, not real trials.
    origin: extractor_observed
  - text: >-
      The finding is about noise across groups and about polarisation within them. The source does not
      claim deliberating juries are less accurate — for punitive damages there is no true value to be
      accurate against.
    origin: extractor_observed
  - text: >-
      The source elsewhere concedes deliberation has real benefits: teaming improved forecasters'
      ability to extract information, and "under favorable circumstances, in which people share what
      they know, deliberating groups can indeed do well".
    origin: source_stated
