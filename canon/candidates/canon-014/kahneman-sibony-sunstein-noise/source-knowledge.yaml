- sk_id: sk_nse_0020
  source_id: kahneman-sibony-sunstein-noise
  source_terms:
  - "evaluating the process of judgment"
  - "focus on the process, not on the outcome of a single case"
  - "The judgments are verifiable as an ensemble, although no single probability judgment can be declared right or wrong"
  concept_label: evaluate_the_process_not_the_single_outcome
  label_origin: extractor_assigned
  claim: >-
    There are two ways to evaluate a judgement — against its outcome, and by the quality of the process
    that produced it — and they can disagree in any single case. The source's position is that the
    process is the right target: it is the only route available for the many judgements that are
    unverifiable, it is the only route available before an outcome exists, and it is the only thing that
    can be improved. A process can be assessed in two ways: by how it performs across an ensemble of
    similar cases, and by whether it conforms to the principles of logic and probability.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      A single probability judgement other than 0 or 100% cannot be confirmed or disconfirmed by one
      outcome, because a 10% event happens 10% of the time. Calibration is a property of a set: if a
      forecaster calls a hundred races at 70% and seventy of them are won, that is evidence about the
      forecaster. The unit of evaluation therefore has to be the ensemble, not the case.
  scope:
    domain_discussed_by_source: [forecasting, political_prediction, professional_judgment]
    conditions: >-
      Applies to verifiable and nonverifiable judgements alike; the source presents it as the general
      answer to "how, then, are we to decide what constitutes good judgment?"
  caveats:
  - text: >-
      The source concedes this is not standard practice: "Professionals are usually evaluated on how
      closely their judgments match verifiable outcomes."
    origin: source_stated
  - text: >-
      Calibration alone is not enough. The source's Brier-score discussion shows a perfectly calibrated
      forecaster who is useless because she never differentiates; resolution is required as well. That
      argument is drawn from Brier's scoring rule and the Good Judgment Project, both third-party work.
    origin: extractor_observed
  - text: >-
      "In a single quarter, a dart-throwing chimpanzee will sometimes be right" — the source's own
      statement that outcome and process verdicts can diverge in any one case.
    origin: source_stated
  source_stated_problems:
  - "The outcome does not reveal what the ex ante probability was"
  - "a psychological bias that is identified only after the fact can still provide a useful, if tentative, explanation if it also offers a prediction about the future"
  - "'In that case they failed, so they must have been overconfident.' The statement is completely vacuous"
  source_stated_remedies:
  - "All the procedures we recommend in this book to reduce bias and noise aim to adopt the judgment process that would minimize error over an ensemble of similar cases"
  examples:
    positive:
    - {description: "a forecaster who calls a hundred candidates 70% likely and sees seventy elected — evidence about skill that no single call could give", figure_ref: null}
    - {description: "Margaret, perfectly calibrated at 60% every day, and Nicholas, equally calibrated but willing to differentiate — the same calibration, very different usefulness", figure_ref: null}
    counter:
    - {description: "attributing a single failed decision to overconfidence — an explanation the source calls vacuous because it predicts nothing", figure_ref: null}
  intra_source_relations:
  - {relation: depends_on, target: sk_nse_0018, note: "process evaluation is what remains when a judgement is nonverifiable"}
  - {relation: generalises, target: sk_nse_0035, note: "the case for decision hygiene rests on process being the improvable object"}
  - {relation: qualifies, target: sk_nse_0050, note: "post-hoc causal explanation of a single bad judgement is the failure mode this replaces"}
