- term_id: t_sgb_0027
  term: chance_operation
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'An organising procedure whose specific outcome is not controlled, though
    "the chance is being controlled to a certain degree" through the choice of operation.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_sgb_0028
  term: random_physical_effect
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'The first category of chance operation, "based on an action that prevents
    explicit control of the outcome" — flinging, scattering, dropping — where the designer can predict
    the family of results but not a specific one.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - physical_production
