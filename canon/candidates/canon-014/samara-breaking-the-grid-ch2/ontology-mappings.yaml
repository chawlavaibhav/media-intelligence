source_id: samara-breaking-the-grid-ch2
extraction_date: 2026-08-30
terms:
- term_id: t_sgb_0001
  term: breaking_the_grid
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: property
  definition_in_origin_frame: 'The chapter''s own title for organising visual communication by some logic
    other than a repeating modular structure. Samara frames grid use as "part of the status quo of designing"
    and "a convention" suitable for particular goals rather than all of them.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0002
  term: compromising_the_informations_integrity
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: problem
  definition_in_origin_frame: 'The failure the chapter opens with: "assuming that one should be imposed
    may, in fact, compromise the information''s integrity." The damage is attributed to imposing a structure
    by default, not to the structure itself.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0003
  term: deconstruction
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'Samara''s word, used both historically (the term "coined to describe their
    intentions: to break apart preconceived structures, or to use those structures as a starting point
    for new avenues of discovery") and operationally ("taking apart or subverting a grid to generate new
    spatial relationships").

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_sgb_0004
  term: alternative_architectures
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: property
  definition_in_origin_frame: 'The chapter''s collective name for structures not based on repeating, modular
    or orthogonal geometry — including those derived from nature, from mathematical or formal relationships,
    and from nested or concentric arrangements.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0005
  term: splitting_splicing_and_shifting
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'The orthogonal deconstruction procedure: install a base grid, then separate
    columns and rows at irregular intervals, cut through them in the opposing direction and slide the
    parts, and widen some but not others.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - deterministic_composite
- term_id: t_sgb_0006
  term: base_grid
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: entity
  definition_in_origin_frame: 'The structure installed first so that it can then be altered. "First, the
    designer installs a base grid... And then changes how columns and rows relate to each other."

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0007
  term: deformation_and_distortion
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'Non-orthogonal deconstruction: altering the actual shapes of columns and
    rows rather than their positions, pulling their edges out of parallel alignment, or making them curvilinear.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - deterministic_composite
- term_id: t_sgb_0008
  term: vestige_of_the_original_structure
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'Our label for the source''s caption device in which "the conventional calendar
    grid that gave rise to this poster''s overlapping layers remains as a vestige to help navigation"
    — a recognisable remnant of the broken structure kept so the reader can read from a familiar standpoint.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - human_edit
- term_id: t_sgb_0009
  term: verbal_and_editorial_deconstruction
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'Using verbal or conceptual cues within the content to break a grid or create
    a new one — the natural rhythm of spoken language guiding changes in weight, size, colour or alignment,
    so that "the natural logic of the writing creates a visual order".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_sgb_0010
  term: giving_a_voice_to_visual_language
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'Samara''s phrase for setting louder or faster words larger, bolder or italic
    to correspond to stresses and lulls in actual speech.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_sgb_0011
  term: interference_with_reading
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: problem
  definition_in_origin_frame: 'The conceded cost of fragmenting running text: "Although generally this
    would interfere with reading, in some cases the resulting ambiguity may be appropriate to the content."
    Restated in a caption as "the visual clarity is decreased".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0012
  term: readability_as_engagement
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: property
  definition_in_origin_frame: 'Samara''s redefinition, offered hedged ("It might even improve readability"):
    "the quality of and the degree to which the type engages its readers with the content" — not the ease
    of decoding.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0013
  term: centred_axis_structure
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: entity
  definition_in_origin_frame: 'Symmetrical composition in which elements are arranged in response to the
    format''s centre. Samara calls it the classical or traditional page architecture and "structurally
    antithetical to grid-based visualization".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0014
  term: bilateral_symmetry
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: property
  definition_in_origin_frame: '"if form elements'' centers align with the axis, straddling it, as well
    as mirror each other across the axis".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0015
  term: rotational_symmetry
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: property
  definition_in_origin_frame: 'Symmetry in which "elements invert in their orientation relative to the
    axis".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0016
  term: intellectual_rest
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: problem
  definition_in_origin_frame: 'The failure symmetry is said to invite: "a viewer is likely to gloss over
    material and come to an intellectual rest quickly, rather than investigate a work more intently."

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0017
  term: optical_vitality
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: property
  definition_in_origin_frame: 'What exaggerated contrasts in scale and spacing are said to ensure in a
    symmetrical composition, "and, therefore, greater viewer engagement".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0018
  term: contour_and_axis
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: property
  definition_in_origin_frame: 'The pair of properties by which any inserted form creates structure: contour,
    "the shape of its outer boundary", and axis, "an imaginary line that separates its halves".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0019
  term: structural_relevance_on_a_communicative_level
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: property
  definition_in_origin_frame: 'The obligation that survives the claim that all structures are functionally
    equal: "Designers must still confront the issue of a structure''s relevance on a communicative level"
    — because "If an arrangement is structured like a tree, for instance, the viewer will interpret it
    as a tree."

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_sgb_0020
  term: interval_progression_as_a_division_source
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'Our label for the source''s practice of taking page divisions from musical
    intervals or alternation schemes (A/B/A), from odd-number ratios, or from the Fibonacci progression.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - deterministic_composite
- term_id: t_sgb_0021
  term: spontaneous_composition
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: '"the intuitive placement of material based on its formal aspects: seeing
    inherent visual relationships within the material and making connections for the viewer based on those
    relationships." Includes an explicit adjustment step after the first fast pass.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_sgb_0022
  term: contrast
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: property
  definition_in_origin_frame: '"Creating areas of differing presence or quality—what is known as ''contrast''—is
    crucial; it''s what imparts vitality and ensures that viewers remain engaged." Later restated as the
    primary hierarchy control, in relative size and relative spacing.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
