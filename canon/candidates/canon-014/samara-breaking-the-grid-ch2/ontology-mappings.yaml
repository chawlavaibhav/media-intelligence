  term: imagery_as_a_source
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'Letting the visual aspects of the imagery determine the project''s compositional
    structure and the type''s compositional and stylistic attributes, in either of two named directions.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_sgb_0024
  term: narrative_pictorialization
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'A layout made to "look like" something discussed in the text, so that "the
    layout becomes a kind of illustration", with the governing logic held constant as the depicted subject
