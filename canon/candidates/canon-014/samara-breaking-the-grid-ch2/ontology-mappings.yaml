    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_sgb_0026
  term: vernacular
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'Visual language "associated with common, everyday experiences or stylistic
    gestures associated with particular contexts", appropriated to impose the look of something else onto
