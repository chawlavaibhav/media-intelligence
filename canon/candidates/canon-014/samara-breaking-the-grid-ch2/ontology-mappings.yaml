  term: programmatic_effect
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'The second category, using "planned procedures, usually of the mechanical
    or mathematical variety", which equally deny explicit control but whose "mechanical nature... guarantees
