    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_sgb_0025
  term: metaphorical_allusion
  origin: source
  origin_ref: samara-breaking-the-grid-ch2
  kind: remedy
  definition_in_origin_frame: 'A layout structure alluding to a tangential idea "acting as a metaphor
