      - {description: "a bank's annual report whose typographic treatments, some derived from printing details of money and stock certificates, mark separations between financial tables and between sections of numeric data rather than invading them", figure_ref: null}
      - {description: "a calendar page in which elements cascade downward, diminishing in activity, size and weight and transitioning from planar to linear, so that they meet the calendar grid at the bottom seamlessly", figure_ref: null}
      - {description: "a taxonomic tree diagram, conventionally orthogonal, altered to follow a concentric circular structure to integrate it with an organic image environment, with the legend set inside a dot to support the motif", figure_ref: null}
    counter: []
  intra_source_relations:
