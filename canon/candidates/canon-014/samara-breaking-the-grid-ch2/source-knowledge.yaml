- sk_id: sk_sgb_0025
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Imagery as a Source"
    - >
      what happens if the visual aspects of imagery are allowed to rule, so to speak—to determine not
      only the compositional structure of a project overall, but the compositional and stylistic
      attributes of the type?
    - >
      Typography is always a pattern of lines, but images present a radically greater range of form
      languages
  concept_label: imagery_can_govern_both_the_layout_and_the_typography
  label_origin: extractor_assigned
  claim: >
    Bringing type and image together is described as notoriously difficult because each has formal
    characteristics most often at odds with the other, and because the two are usually assumed to be
    mutually dominant and referential. The source proposes inverting that assumption and letting the
    imagery rule — determining not only the project's overall compositional structure but the
    compositional and stylistic attributes of the type. Its reason is that typography is always a
    pattern of lines whereas images present a radically greater range of form languages, so applying
    an image's language to text quickly relieves a designer of presumptions about how text should
    behave and how layouts ought to be organised. Two directions are named: one in which typographic
    elements become in essence part of the imagery, and one in which the imagery sets up the logic
    for how type responds to it pictorially while the type retains its identity as a separate entity
    alongside the images.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Type's form language is narrow — lines — so it cannot supply the variety a layout needs;
      imagery can, and letting it lead breaks the designer's default assumptions about text
      behaviour rather than arguing with them.
  scope:
    domain_discussed_by_source: [poster_design, publication_design, editorial_design]
    conditions: "projects that carry substantial image material"
  caveats:
    - text: >
        The source is explicit that the correspondence need not be literal: in one study the sizes,
        positions and radii of type arcs are not direct repetitions of any attribute in the image,
        and the mere fact of them is enough to create the visual connection. That weakens the method
        into a judgement call with no test.
      origin: source_stated
    - text: >
        Every instance is a layout this lane could not see. The two named directions are recorded
        because they are stated in words; the visual result of either is not inferred.
      origin: extractor_observed
  source_stated_problems:
    - "type and image are notoriously challenging to bring together; each has its own formal characteristics most often at odds with the other"
  source_stated_remedies:
    - "let the imagery determine the compositional structure and the type's compositional and stylistic attributes"
    - "either absorb the typographic elements into the imagery, or let the imagery set the logic to which separate type responds"
  examples:
