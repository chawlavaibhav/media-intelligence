    inspected: {text: true, figures: []}

- sk_id: sk_sgb_0039
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      The trick is to be able to analyze, as specifically as possible, what the most prevalent formal
      conditions are among all those that might be present.
    - >
      "What kind of images am I using?" "Is geometry important in the shapes or relationship?" "Is
      there spatial depth, and, if so, what creates it—transparency, scale change, overlap?" "Do I
      sense movement, and, if so, is it lateral, vertical, frenzied, calm, and repeated?"
    - "The answers to these questions are the system's rules."
  concept_label: the_systems_rules_are_found_by_naming_the_prevalent_formal_conditions
  label_origin: extractor_assigned
  claim: >
    An irregular system's rules are not designed in advance; they are read off the work that already
    exists. The stated method is to analyse as specifically as possible which formal conditions are
    the most prevalent among all those present, and the source gives the diagnostic questions
    verbatim: what kind of images am I using; is geometry important in the shapes or relationships;
    is there spatial depth and, if so, what creates it — transparency, scale change, overlap; do I
    sense movement and, if so, is it lateral, vertical, frenzied, calm, repeated. The answers to
    those questions are the system's rules. Each rule may then be reinterpreted in different
    instances according to the variables inherent in it and to different extremes — if cropping
    images into an irregular trapezoid is a rule, the trapezoids may all be one size and shape, or
    vary in size, or vary in the measures of their sides, or extend to parallelograms and triangles.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An intuitive layout has properties before it has rules. Naming the dominant properties turns
      what was arrived at by instinct into something repeatable, which is what makes a system
      possible without a grid.
  scope:
    domain_discussed_by_source: [publication_design, editorial_design, identity_systems]
    conditions: "defining a system for a project already composed by intuitive means"
  caveats:
    - text: >
        The procedure is retrospective by design — the rules are extracted from work already made.
        This inverts the chapter-1 order in which a structure is derived before the pages are built,
        and it is the same author describing a different order of work rather than contradicting
        himself.
      origin: extractor_observed
    - text: >
        The four questions are a starting list offered as "a great way to begin", not a closed
        checklist, and the source gives no test for whether the answers found are the prevalent
        conditions.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "analyse as specifically as possible which formal conditions are most prevalent"
    - "ask what images, whether geometry matters, whether there is depth and what creates it, and whether there is movement and of what kind"
    - "take the answers as the system's rules and define the permitted variables of each"
  examples:
    positive:
      - {description: "a recruiting brochure in which two kinds of text each hold their own column width and typographic style while being fluidly repositioned from spread to spread, with the spread title always running across the centre as a binding focal point", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: generalises, target: sk_sgb_0038, note: "the discovery step that precedes the limit"}
    - {relation: depends_on, target: sk_sgb_0024, note: "presupposes material already placed intuitively"}
