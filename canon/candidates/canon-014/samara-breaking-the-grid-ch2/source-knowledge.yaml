- sk_id: sk_sgb_0010
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      Altering a familiar structure—even a simple, two- or three-column grid—is an excellent
      introduction to exploring alternative kinds of structure
    - >
      First, the designer installs a base grid... And then changes how columns and rows relate to
      each other—by separating them at irregular intervals; "cutting" through them in the opposing
      direction and sliding the "parts" horizontally or vertically, together or separately; by
      widening some columns and rows but not others; and so on.
    - "Splitting, Splicing, and Shifting"
  concept_label: orthogonal_deconstruction_installs_a_base_grid_before_altering_it
  label_origin: extractor_assigned
  claim: >
    The most straightforward way to alter a familiar structure is to manipulate it along its own
    orthogonal axes, and the procedure is ordered: first install a base grid, then change how its
    columns and rows relate to each other. The named operations are separating them at irregular
    intervals; cutting through them in the opposing direction and sliding the parts horizontally or
    vertically, together or separately; and widening some columns and rows but not others. The
    source recommends altering even a simple two- or three-column grid as the introduction to
    alternative structure.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [editorial_design, poster_design, publication_design]
    conditions: "work that begins from a conventional orthogonal grid"
  caveats:
    - text: >
        The ordering is the source's own and is the plainest statement in the chapter that the
        structure must exist before it can be broken. The source does not, however, say what makes a
        base grid adequate for the purpose, so the constraint is procedural rather than qualitative.
      origin: extractor_observed
    - text: >
        The complementary case is stated in an exhibit and points the other way: a structure built
        before its material is assessed forces the deconstruction rather than enabling it.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
