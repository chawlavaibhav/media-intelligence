- sk_id: sk_sgb_0007
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      Designers need not totally discard the notion of structure in their search for compositional
      options beyond the grid.
    - "taking apart or subverting a grid to generate new spatial relationships"
    - >
      there are also many kinds of structure that happen to not be based on a logic of repeating,
      modular—or even orthogonal (90°)—geometry
    - >
      The appreciation of a particular structure often instigates an association with certain
      physical experiences—and so non-grid-based structures, too, can impart metaphorical or
      narrative understanding.
  concept_label: structure_survives_the_grids_removal_and_carries_its_own_metaphor
  label_origin: extractor_assigned
  claim: >
    Abandoning the grid does not require abandoning structure. The source names two routes.
    Deconstruction is one: taking apart or subverting a grid to generate new spatial relationships.
    The other is the large class of structures not based on repeating, modular or even orthogonal
    geometry — those derived from nature, such as crystals, molecules and the branches of trees, and
    those derived from mathematical or formal relationships, such as nested or concentric ones.
    Because appreciating a particular structure instigates an association with physical experience,
    non-grid structures also impart metaphorical or narrative understanding, and familiarity with a
    variety of arrangement possibilities gives the designer greater latitude to architect a
    project's space and serve the content's needs.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Structure is a class and the grid is a member of it. Removing the member does not remove the
      class, and the associations a structure carries come from what it resembles in physical
      experience rather than from its regularity.
  scope:
    domain_discussed_by_source: [graphic_design, poster_design, web_design]
    conditions: "any project where the grid has been ruled out"
  caveats:
    - text: >
        This extends, in the same author's voice, chapter 1's claim that the structure itself can be
        a message; the live extraction holds that claim for grids only. Chapter 2 says the same
        mechanism operates for structures that are not grids at all. Same author, one work.
      origin: extractor_observed
    - text: >
        The source's inclusion criterion is looser than it looks: one exhibit is admitted to the
        no-grid section although "technically, there is a grid of sorts in use here", on the ground
        that the grid is inconsequential — its body-to-margin relationship is near default and its
        two page structures do not relate to each other.
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
    - "deconstruct: take apart or subvert an existing grid"
    - "adopt a structure derived from nature or from a mathematical or formal relationship"
  examples:
    positive:
      - {description: "a poster slicing pictorial space along diagonal axes radiating from a fixed point, producing an illusory perspective that exaggerates the industrial spaces the poster promotes", figure_ref: null}
      - {description: "an artist's website organising free-form arrangements symmetrically on both horizontal and vertical axes", figure_ref: null}
  intra_source_relations:
    - {relation: generalises, target: sk_sgb_0011, note: "orthogonal deconstruction is one of the two named routes"}
    - {relation: generalises, target: sk_sgb_0014, note: "non-orthogonal deformation is the other"}
    - {relation: depends_on, target: sk_sgb_0008, note: "why structure cannot in fact be discarded"}
