- sk_id: sk_sgb_0019
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Centered-Axis Structure"
    - "centering is structurally antithetical to grid-based visualization"
    - >
      because it assumes only one governing alignment axis; because that axis is "buried" within the
      area of the material, rather than marked by its contours; and because the exterior contours,
      widths, and depths of centered elements are mutually interdependent
    - "a sense of immediacy, or unfussy directness"
  concept_label: centred_axis_is_structurally_antithetical_to_grid_based_visualisation
  label_origin: extractor_assigned
  claim: >
    Centred-axis, or symmetrical, composition arranges elements in response to the format's centre —
    halfway between left and right or top and bottom edges, and sometimes in response to each
    other's central axes independently of the format. Although a grid may guide the proportions or
    positions of centred material, centring is structurally antithetical to grid-based
    visualisation, for three stated reasons: it assumes only one governing alignment axis; that axis
    is buried inside the area of the material rather than marked by its contours; and the exterior
    contours, widths and depths of centred elements are mutually interdependent — driven by their
    fit and relative proportion as they come into central alignment, not by predetermined intervals.
    Elements stack sequentially top to bottom or left to right, and the shapes either side of the
    axis, and the negative spaces beyond them, are identical. The primary visual result is a sense of
    immediacy or unfussy directness, followed by an appearance of formal simplicity, as the
    material's quality as a unit dominates perception of its internal divisions.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A grid works by predetermined intervals marked at the contours of the material; a centred axis
      works by mutual fit around a line that is not drawn. The two allocate space by incompatible
      logics, which is why one cannot simply be laid over the other.
  scope:
    domain_discussed_by_source: [page_design, poster_design, publication_design, web_design]
    conditions: "classical or traditional page architecture, print or screen"
  caveats:
    - text: >
        Samara calls this the classical or traditional page architecture, so the claim is partly a
        statement about a Western typographic convention rather than about perception.
      origin: extractor_observed
    - text: >
        This is an unusual member of a chapter about breaking grids: the alternative here is older
        than the grid, not newer.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
