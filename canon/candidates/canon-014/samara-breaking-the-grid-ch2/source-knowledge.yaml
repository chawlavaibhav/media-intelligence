# ─────────────────────────────────────────────────────────────
# SYSTEMATIZING THE ORGANIC — consistency without a grid
# ─────────────────────────────────────────────────────────────

- sk_id: sk_sgb_0038
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Systematizing the Organic"
    - "The visual freedom inherent in their makeup is a double-edged sword when it comes to defining a system."
    - >
      the more rules, the greater the number of variables for each, and the more extreme the
      expression of each variable, the greater the potential for the system to fall apart. Limit the
      rules to two or three, total
    - "a system of this ilk must still exhibit some consistency, and it must be maintained without compromising the project's unconventional energy"
  concept_label: limit_the_rules_to_two_or_three_or_the_system_falls_apart
  label_origin: extractor_assigned
  claim: >
    Most design projects are systems of serial or sequential components that need visual rules for
    consistency while permitting variation. Grid-based thinking, for all the variation it encourages,
    tends to produce systems that are consistent and programmatic, and expressing variation within
    them is difficult; alternative approaches grow from formal irregularity, and their visual freedom
    is a double-edged sword when a system must be defined. Such a system must still exhibit some
    consistency, and that consistency must be maintained without compromising the project's
    unconventional energy. The source gives a numeric limit: the more rules there are, the more
    variables each carries, and the more extreme the expression of each variable, the greater the
    potential for the system to fall apart — so limit the rules to two or three in total, and limit
    the number, kinds and degrees of their variations too. Rules and their variations must then be
    applied consistently across the corresponding parts. Where a discrepancy arises, by need or by
    desire, it should be treated as a reason to reinvestigate the rules: the discrepancy may be
    edited out, or it may give rise to a new rule that must then be resolved among the existing
    elements.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Rule count, variable count per rule and the extremity of each variable multiply together, so
      the space of permitted outcomes grows fast enough to stop reading as one system. Capping the
      rules caps that product.
  scope:
    domain_discussed_by_source: [publication_design, book_design, identity_systems, editorial_design]
    conditions: "serial or sequential projects organised by an alternative, irregular approach"
  caveats:
    - text: >
        "Two or three, total" is the single most specific instruction in the chapter and the only
        numeric one. It is a practitioner's rule of thumb, offered with a mechanism but no evidence.
      origin: extractor_observed
    - text: >
        The claim that grid-based systems make variation difficult is asserted here in a chapter
        arguing against grids, and is the same author's own qualification of chapter 1's treatment
        of grids as a device that enables extensive variation.
      origin: extractor_observed
  source_stated_problems:
    - "the more rules, variables and extremes, the greater the potential for the system to fall apart"
    - "grid-based systems make expressing variation more difficult"
  source_stated_remedies:
    - "limit the rules to two or three in total"
    - "limit the number, kinds and degrees of the variations of each rule"
    - "apply rules and variations consistently across corresponding parts"
    - "treat a discrepancy as a reason to reinvestigate the rules — edit it out or promote it to a new rule"
  examples:
    positive:
      - {description: "a series of book covers governed by very specific but few rules — three kinds of image; black plus one middle-value cool colour; one image component coloured; one type family with a consistent style per hierarchic level; the title set as a staggered group of lines", figure_ref: null}
      - {description: "an art school course catalogue, far more complex than the covers, governed by the same number of rules and very similar ones", figure_ref: null}
    counter: []
  intra_source_relations:
    - {relation: specialises, target: sk_sgb_0005, note: "how a system defined by inconsistency stays a system"}
    - {relation: qualifies, target: sk_sgb_0006, note: "the maximum-conformity/maximum-freedom problem given a working limit"}
    - {relation: depends_on, target: sk_sgb_0039, note: "the rules must first be discovered"}
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, mechanism_given, visually_demonstrated]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: "2 Breaking the Grid"
    section: "Considering the Practical in the Impractical — Systematizing the Organic (spine 6)"
    page_start: null
    page_end: null
    figure_refs: []
