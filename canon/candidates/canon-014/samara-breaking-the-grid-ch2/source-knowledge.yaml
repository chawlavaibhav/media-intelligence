- sk_id: sk_sgb_0028
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Chance Operations"
    - "Random Physical Effect"
    - "Programmatic Effect"
    - "Conducting a chance operation implies that the chance is being controlled to a certain degree, and this is usually the case."
    - >
      By selecting the type of chance operation to use, a designer can skew the results in their
      favor to some degree, ensuring appropriateness in the form while allowing the unpredictability
      to create new visual relationships that structured thinking about layout won't achieve.
  concept_label: chance_is_a_controlled_operation_in_two_kinds
  label_origin: extractor_assigned
  claim: >
    Chance as an organising principle may seem counterintuitive, but unpredictable results can aid
    communication conceptually by bringing out juxtapositions of material that would otherwise have
    escaped notice; introducing chance sometimes helps the designer see the material more clearly and
    yields less predictable but more illuminating solutions. The crucial qualification is that
    conducting a chance operation implies the chance is being controlled to a degree, and the source
    says this is usually the case. Control falls into two categories. Random physical effect involves
    randomness to a greater degree, based on an action that prevents explicit control of the outcome
    — flinging paint at a surface, or scattering or dropping cropped images over a format from a
    certain height, knowing that certain kinds of pattern will occur because of the brush size or the
    gesture, but unable to predict or effect a specific result. Programmatic effect uses planned
    procedures, usually mechanical or mathematical; these equally deny explicit control, but their
    mechanical nature guarantees greater foreknowledge of the results. Named programmatic procedures
    include dissecting an image on an arbitrarily applied grid or a mathematical formula;
    photographing or scanning a layout in progress from a fixed viewpoint at predetermined times and
    inserting the results as images; augmenting the point sizes of successive lines of type by an
    arbitrary multiplier; and printing two layouts over one another then deleting the overlaps. By
    choosing which type of operation to use, the designer skews the results in their favour and
    ensures appropriateness of form while letting unpredictability create relationships structured
    thinking will not reach.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Chance is admitted at the level of the specific outcome and withheld at the level of the
      operation. The designer chooses the generator, which fixes the family of results, and gives up
      only the individual result — which is what makes the juxtapositions new without making them
      arbitrary.
  scope:
    domain_discussed_by_source: [poster_design, publication_design, book_design]
    conditions: "physical and pre-digital or digital procedures applied to layout material"
  caveats:
    - text: >
        The two named kinds are distinguished by degree of foreknowledge, not by whether control is
        exercised; in both the operation is chosen deliberately. Reading this section as a licence
        for arbitrary placement inverts its actual claim.
      origin: extractor_observed
    - text: >
        The source's stated benefit — that chance can make a solution more illuminating — is a
        practitioner assertion with no evidence attached and no failure case discussed.
      origin: extractor_observed
    - text: >
        The illustration for this section is itself a chance operation performed on the page, a list
        of possibilities dropped onto the layout. That demonstration exists only as a printed page and
        was not available to this extraction.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "choose the type of chance operation so as to skew the family of results toward appropriateness"
    - "random physical effect: fling, scatter or drop material with knowledge of what the gesture tends to produce"
    - "programmatic effect: dissect on an arbitrary grid or formula, capture at predetermined times, multiply successive point sizes, or overprint two layouts and delete the overlaps"
  examples:
    positive:
      - {description: "a book in which a master grid orchestrates the dissection of an image across many pages, with the dissection points chosen arbitrarily and without regard to the image's own composition, and the placement of the pieces in the page sequence predetermined by a formula whose results were unknown in advance", figure_ref: null}
    counter: []
  intra_source_relations:
