- sk_id: sk_sgb_0026
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Narrative Constructs"
    - "Pictorialization and Metaphorical Allusion"
    - "the layout becomes a kind of illustration"
    - >
      As content progresses or pursues a different direction from page to page or screen to screen,
      the "subject" depicted by the layout changes, but the governing logic remains the same.
  concept_label: narrative_pictorialisation_and_metaphorical_allusion_as_structure
  label_origin: source_verbatim
  claim: >
    An idea embedded in the project's content can itself be visualised as the compositional structure
    of the page or screen. The source names two variants. In narrative pictorialisation the layout
    and its parts are made to look like something discussed in the text — elements arranged to give
    the impression of objects swept up in a flood, or to construct a literal image of a car or other
    machine; in simplest terms the layout becomes a kind of illustration. As the content progresses
    or changes direction from page to page, the subject the layout depicts changes while the
    governing logic stays the same. In metaphorical allusion the layout structure and the visual
    language of the forms it arranges refer to some tangential idea that supports or manipulates
    perception of the meaning — a promotion for a film festival splicing repeated images to refer to
    film editing. Both variants follow the idea of visual storytelling, relying on depictive
    strategies to deliver narrative meaning that either describes the content or reframes and
    augments it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Chapter 2 has already established that a viewer reads a structure as the thing it resembles.
      Pictorialisation and allusion are the deliberate exploitation of that reading: the arrangement
      is made to resemble something so that the resemblance carries meaning.
  scope:
