- sk_id: sk_sgb_0040
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      If a particular variation repeats inconsistently among the components of a system, the
      discrepancy will cause those layouts that share a similar variation to disunify.
    - >
      The number of component parts that make up a system is one factor to consider in how such a
      discrepancy might be resolved.
    - "The system has a binary variation."
  concept_label: inconsistent_variation_disunifies_and_variation_is_calibrated_to_component_count
  label_origin: extractor_assigned
  claim: >
    A variation that repeats inconsistently among a system's components causes the layouts sharing a
    similar variation to disunify. How a discrepancy should be resolved depends in part on how many
    component parts the system has. The source's worked case is a four-poster series in which the
    main titling element rotates to a different angle in each poster: the variation is controlled
    specifically against the fact that there are four, with two titles oriented orthogonally and two
    diagonally, giving the system a binary variation. Had the two diagonally rotated titles been set
    at the same angle, that logic would have conflicted with the other two, in which the angle
    differs in each.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A variation is read as a rule only if its pattern completes across the set. In a small set the
      pattern is visible, so a half-applied variation reads as a mistake rather than as a rule.
  scope:
    domain_discussed_by_source: [poster_design, identity_systems, publication_design]
    conditions: "small serial sets whose components are seen together"
  caveats:
    - text: >
        The worked case turns on a set of exactly four. The source says component count is "one
        factor" but does not say how the reasoning changes for a set of forty.
      origin: extractor_observed
    - text: >
        The distinction being drawn — a variation that completes a pattern versus one that does not —
        is the closest the chapter comes to a test for whether irregularity reads as designed. It is
        stated for a poster series and not generalised by the source.
      origin: extractor_observed
  source_stated_problems:
    - "a variation repeating inconsistently causes layouts sharing a similar variation to disunify"
  source_stated_remedies:
    - "control the variation against the number of components — for example a binary variation across four posters"
