- sk_id: sk_sgb_0032
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      Bigger and bolder usually means "seen first," so applying such differences to greater extremes
      than one normally would is a useful strategy.
    - >
      Repeating partially obscured information in an open area may help, but it may also confuse a
      viewer with its redundancy—better to give it a little extra room where it appears in sequence.
    - >
      When in doubt, simplify: if the same visual effect can be achieved with fewer elements or less
      interference, it will differentiate itself more efficiently from within a complicated field.
  concept_label: hierarchy_control_is_unchanged_but_must_be_pushed_to_greater_extremes
  label_origin: extractor_assigned
  claim: >
    Ensuring that a reader can easily identify the most important elements, or those from which a
    sequence originates, is critical. Because bigger and bolder usually means seen first, the
    source's remedy for an unusual composition is not a different device but the same device applied
    to greater extremes than one normally would. Repeating partially obscured information in an open
    area may help but may also confuse the viewer with its redundancy; the source prefers giving that
    information a little extra room where it already appears in the sequence. Where doubt remains,
    simplify — if the same visual effect can be achieved with fewer elements or less interference, it
    will differentiate itself more efficiently from within a complicated field.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Differentiation is relative to its field. A complicated field raises the threshold, so the
      contrast that would suffice in a quiet layout has to be increased, or the field simplified,
      for the same element to read as first.
