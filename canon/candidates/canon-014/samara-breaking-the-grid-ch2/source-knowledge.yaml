- sk_id: sk_sgb_0023
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      The intervals between musical notes or chords—the octave established by the seven unique tonal
      pitches in Western music—have been used by book designers to create page divisions since the
      Middle Ages.
    - "Any numeric progression or fractional relationship can be a starting point for creating spatial divisions"
    - >
      combining different kinds of structural approach offers the designer infinite possibilities for
      organizing content and adding new levels of meaning
  concept_label: progressions_and_intervals_are_legitimate_sources_of_spatial_division
  label_origin: extractor_assigned
  claim: >
    A structure's intervals may be sourced from outside the page. The intervals between musical
    notes or chords — the octave established by the seven unique tonal pitches of Western music —
    have been used by book designers to divide pages since the Middle Ages, and rhythmic or thematic
    alternation schemes borrowed from musical composition can be applied to the distances between
    elements in a layout, in patterns such as A/B/A or A/B/A/C where each letter stands for one
    measurement. Any numeric progression or fractional relationship can serve as the starting point
    for spatial divisions — odd-number ratios such as 1:3:5:7, or the Fibonacci progression in which
    each number is the sum of the preceding two, which is the same proportional relationship that
    drives the Golden Section. The source adds that the structural approaches it lists are neither
    comprehensive nor mutually exclusive, and that combining them offers further possibilities for
    organising content and adding levels of meaning.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [book_design, publication_design, page_design]
    conditions: "choosing the intervals of a structure, grid-based or not"
  caveats:
    - text: >
        The historical claim about book designers using musical intervals since the Middle Ages is
        stated without a citation.
      origin: extractor_observed
    - text: >
        The source calls the Fibonacci/Golden Section correspondence a coincidence. It attaches no
        claim that any of these progressions produces a better result than another; consistent with
        this chapter's position that structures are functionally equal.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "derive page divisions from musical interval or alternation schemes such as A/B/A"
    - "use a numeric progression or fractional relationship — odd-number ratios, Fibonacci — as the starting point for spatial divisions"
    - "combine different kinds of structural approach rather than using them independently"
  examples:
