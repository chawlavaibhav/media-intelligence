- sk_id: sk_sgb_0044
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      The designers pay close attention to the relative parallel or divergent nature of axes and
      their junctures, distributing them along a limited selection of planar levels and directions to
      ensure well-crafted, rhythmic cohesion instead of chaotic randomness.
    - >
      the spatial confusion and complicated interferences of shape and text overlaps, however, are
      underpinned by a rigorously controlled network of geometric axes—the edges of every element
      line up with or point to those of other elements
  concept_label: a_limited_set_of_axes_separates_rhythmic_cohesion_from_chaotic_randomness
  label_origin: extractor_assigned
  claim: >
    In the exhibits Samara repeatedly names the same underlying condition as the thing that makes an
    apparently disordered layout read as crafted rather than as chaos, and the condition is
    restriction of the axis set. In one exhibit the designers attend to whether axes run parallel or
    divergent and to their junctures, distributing them along a limited selection of planar levels
    and directions, which he says ensures well-crafted, rhythmic cohesion instead of chaotic
    randomness. In another, spatial confusion and complicated interference between overlapping shapes
    and text are underpinned by a rigorously controlled network of geometric axes in which the edges
    of every element line up with, or point to, those of other elements and the junctures between
    them; he traces one such axis through the poster explicitly. The disorder in these cases is
    surface disorder over a constrained substructure.
  claim_type: source_interpretation
  interpretation_basis: >
    Samara states each observation about its own exhibit and does not generalise them into a rule.
    The generalisation — that a restricted family of axes is what distinguishes intentional disorder
    from incompetent disorder — is the extractor's reading across several exhibit commentaries that
    use the same contrast in the same terms. The wording "cohesion instead of chaotic randomness" is
    the source's; the elevation of it to a diagnostic is not.
  mechanism:
    stated_by_source: true
    text: >
      Every element has axes whether or not a grid is present. Where those axes fall into a small
      number of families the eye finds repetition beneath the complexity, and the arrangement reads
      as governed; where they do not, there is nothing to find and it reads as accidental.
  scope:
    domain_discussed_by_source: [poster_design, publication_design]
    conditions: "densely layered compositions with no visible grid"
  caveats:
    - text: >
        The generalisation is the extractor's. Samara offers it as description of particular projects
        and never as a test to apply to a new one.
      origin: extractor_observed
    - text: >
        The evidence is entirely visual and none of it was inspected. Whether the axes in these
        particular projects really are restricted cannot be checked from the text; what is recorded
        is the criterion the source applies, not a verification that the projects meet it.
      origin: extractor_observed
    - text: >
        Nothing here licenses a claim that a viewer can tell the difference. The source asserts the
        distinction; no reader evidence is offered anywhere in the chapter.
      origin: extractor_observed
  source_stated_problems: ["chaotic randomness"]
  source_stated_remedies:
    - "distribute axes along a limited selection of planar levels and directions"
    - "align or point the edges of every element to those of others or to the junctures between them"
  examples:
    positive:
      - {description: "an architecture-competition poster whose tumbling kinetic arrangement is controlled by attention to parallel and divergent axes distributed over a limited set of planar levels and directions", figure_ref: null}
      - {description: "a promotional poster in which a white slash following one word describes a diagonal axis connecting the firm's initial to the top of a vertical grey line in the image and on to the point where the axis of a word at the poster's foot strikes the top edge", figure_ref: null}
    counter: []
  intra_source_relations:
