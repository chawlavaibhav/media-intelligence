- sk_id: sk_sgb_0033
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      Contrast in relative size (large versus small) and relative spacing (or density and openness)
      account for the most effective ways to establish a clear hierarchy.
    - >
      When an element in a visual field distinguishes itself from others... it becomes a focal point
      and, therefore, assumes the greatest level of importance.
    - >
      Repetition assigns relative meaning to elements that will be understood as related no matter
      where they occur within the visual field
  concept_label: contrast_in_size_and_density_is_the_primary_hierarchy_control
  label_origin: extractor_assigned
  claim: >
    Contrast in relative size — large against small — and in relative spacing, meaning density
    against openness, account for the most effective ways to establish a clear hierarchy. As
    expressions of purely positive/negative interaction, these two contrasts change the sense of the
    format being divided into darker and lighter areas, an effect that is enhanced by altering hue or
    value. An element that distinguishes itself sufficiently from the others becomes a focal point
    and therefore assumes the greatest level of importance; where that disconnection is extreme, it
    diminishes the effect of other contrasts present in the secondary material. Repetition performs
    the complementary function: it assigns relative meaning to elements that will be understood as
    related wherever they occur in the field, even when separated by clearly different material.
    Hierarchy, the source states, is not only about level of importance but also about relation —
    establishing which elements are alike in meaning, whether or not they are important.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Size and spacing act on the same underlying variable — how much of the format reads dark and
      how much light — which is why they dominate over other contrasts, and why an extreme focal
      point flattens the differences among everything else.
  scope:
    domain_discussed_by_source: [publication_design, poster_design, web_design]
    conditions: "any composition, grid-based or alternative"
  caveats:
    - text: >
        The redefinition of hierarchy to include relation as well as rank is the load-bearing part of
        this object and is easily lost: it is what lets a layout without a reading order still be
        hierarchically organised.
      origin: extractor_observed
    - text: >
        The claim is illustrated by diagrams — a vivid red dot among neutral elements, and repeated
        forms across a field — which this lane could not inspect. The words are recorded; the
        demonstrated magnitudes are not.
      origin: extractor_observed
