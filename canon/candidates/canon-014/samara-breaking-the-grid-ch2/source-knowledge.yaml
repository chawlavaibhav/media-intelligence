- sk_id: sk_sgb_0043
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Pacing and Sequencing"
    - "Unconventional layout strategies tend to be more experiential than expository"
    - >
      Visual elements may relate to each other in time, as though in frames of a film... This kind of
      kinetic structure comes to be recognized and understood as the viewer experiences the
      succession of frames.
    - >
      a designer might very well consider the sequence and pace as an idea unto itself that helps
      establish how the content ought to be delivered
  concept_label: sequence_and_pace_may_themselves_be_the_organising_idea
  label_origin: extractor_assigned
  claim: >
    The visual cadence of a sequential project such as a book or a wall of an exhibit can be handled
    conventionally, using particular layouts to mark major divisions off from contiguous content. But
    because unconventional layout strategies tend to be more experiential than expository, they lend
    themselves to other ways of thinking about sequence and pace. Visual elements may relate to each
    other in time, as frames of a film do: an image might move across the format or change from page
    to page and affect images or text appearing later, and this kinetic structure comes to be
    recognised and understood as the viewer experiences the succession of frames. Using sensory
    experiences of space and time as organising principles is described as a powerful tool for
    evoking a visceral, emotional response. Decisions about the ebb and flow of material will often
    still be driven by the content's requirement for sequential clarity, but a designer may treat the
    sequence and pace as an idea in itself that establishes how the content ought to be delivered.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Where a single page carries no visible structure, order can be carried across pages instead:
      the structure becomes something the viewer assembles over time rather than something read off
      one surface.
  scope:
    domain_discussed_by_source: [book_design, exhibition_design, publication_design]
    conditions: "projects of a sequential nature"
  caveats:
    - text: >
        The claim that space-and-time organisation evokes a visceral emotional response is asserted
        without evidence.
      origin: extractor_observed
    - text: >
        A kinetic structure is by definition unavailable to any single-surface inspection, and it is
        doubly unavailable here: the sequence of spreads that would demonstrate it does not exist as
        pages in this copy. The principle is recorded; no instance of it was verified.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "relate visual elements to each other in time, as frames of a film"
    - "treat sequence and pace as an organising idea rather than only as a consequence of content"
  examples:
    positive:
      - {description: "a book about the Second World War paced by a physical hole in its centre that grows through the sequence, piercing images and text and altering their meaning, with secondary pacing from content volume, page position and light/dark value", figure_ref: null}
      - {description: "a book organised filmically, each spread a frame referring to the one before and setting up the next, with negative space in one image yielding to a similarly shaped positive image on the next spread", figure_ref: null}
    counter: []
  intra_source_relations:
