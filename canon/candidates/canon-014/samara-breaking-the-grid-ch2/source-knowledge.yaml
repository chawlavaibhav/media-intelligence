- sk_id: sk_sgb_0034
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "eye path"
    - >
      Compositional flow, sometimes called "eye path," occurs as a viewer compares each hierarchic
      level's degree of contrast from the others and senses the difference as a decrease in optical
      resistance
    - "For Western readers, it's wise to orient top-level elements toward the left-hand area of a layout."
    - >
      Elements to be encountered next must differentiate from their contexts to a similar degree
      (like things attract attention) or be positioned in proximity to the place where the viewer's
      eye is likely to leave the first element behind.
  concept_label: eye_path_is_a_gradient_of_decreasing_optical_resistance_starting_at_the_left_for_western_readers
  label_origin: extractor_assigned
  claim: >
    Where the first or most important element sits, and how it optically connects the viewer to what
    follows, matter as much as differentiation itself. Compositional flow — eye path — occurs as the
    viewer compares each hierarchic level's degree of contrast against the others and senses the
    difference as a decrease in optical resistance; the eye moves from the area of greatest overall
    contrast to the least, along a direction the designer can support by positioning axes or by using
    graphical forms to point. For Western readers the source advises orienting top-level elements
    toward the left-hand area of the layout. Each subsequent element must either differentiate from
    its context to a similar degree, because like things attract attention, or be placed near where
    the eye is likely to leave the previous element. Inserting graphical markers or anchoring points
    at strategic locations helps focus attention and direct the flow. The same rule is applied to a
    specific case: when setting type on a circular path or arc, orient its entry point toward the
    upper left and, if possible, so that the first words are relatively horizontal.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Contrast is restated as optical resistance, so a sequence of decreasing contrast reads as a
      path of decreasing resistance. Order is therefore produced by a gradient rather than by
      position in a structure, which is why a layout with no grid can still have a reading order.
  scope:
    domain_discussed_by_source: [publication_design, poster_design, web_design]
    conditions: "Western reading conventions; explicitly scoped to Western readers by the source"
  caveats:
    - text: >
        The left-hand and upper-left advice is stated by the source as specific to Western readers
        and must not be generalised to readers of right-to-left or vertical scripts.
      origin: source_stated
    - text: >
        The mechanism is an account of perception offered without evidence; it is a designer's model
        of reading, not a reading study.
      origin: extractor_observed
    - text: >
        The comparison that carries the type-on-a-curve rule is a paired before/after image. Only the
        rule is recorded; the demonstrated difference in readability was not seen.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "orient top-level elements toward the left for Western readers"
    - "differentiate the next element to a similar degree, or place it near where the eye leaves the previous one"
    - "insert graphical markers or anchoring points to focus attention and direct flow"
    - "orient the entry point of type on a curve to the upper left, with the first words relatively horizontal"
  examples:
    positive:
      - {description: "a composition in which a single text line at upper left and a paragraph at lower right, both reversed from heavy dark planes and the only horizontally proportioned elements in the field, differentiate strongly enough that the reader intuits the upper-left line as the start", figure_ref: null}
      - {description: "a book spread in which black planes of reversed type dominate visually, but two hotly coloured elements — the only chromatic ones present — create an invisible directional axis that drives the eye to the upper left", figure_ref: null}
    counter: []
