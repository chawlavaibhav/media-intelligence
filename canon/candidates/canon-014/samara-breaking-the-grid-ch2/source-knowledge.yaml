    speech and may change the reader's presumed reading order. The source concedes plainly that this
    would generally interfere with reading. It is warranted only in the cases where the resulting
    ambiguity is appropriate to the content of the text, and where the associations it yields
    between words or images augment and comment upon the literal meaning.
