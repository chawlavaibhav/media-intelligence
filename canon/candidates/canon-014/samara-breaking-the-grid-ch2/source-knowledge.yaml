- sk_id: sk_sgb_0011
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      It's important to watch what happens when information that would normally appear in an
      expected place—marking a structural juncture in the grid—is moved to another place, perhaps
      aligned with some other kind of information in a way that creates a new verbal connection that
      didn't exist before.
    - >
      The optical confusion that results will often create situations where foreground and
      background appear to swap places.
  concept_label: displacing_expected_information_creates_new_verbal_and_spatial_relations
  label_origin: extractor_assigned
  claim: >
    The payoff of splicing and shifting is not formal but relational. When information that would
    normally sit in its expected place, marking a structural juncture, is moved and lands beside
    some other kind of information, a new verbal connection is created that did not exist before.
    Shifted information may also end up behind or on top of other information if a change in size or
    density accompanies the change in placement, and the resulting optical confusion will often make
    foreground and background appear to swap places. The source instructs the designer to watch for
    both effects rather than to plan them.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Meaning in a layout is carried partly by adjacency, so moving an element rewrites what it is
      adjacent to and therefore what it says.
  scope:
