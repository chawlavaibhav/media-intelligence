- sk_id: sk_sgb_0014
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Deformation and Distortion"
    - >
      altering the actual shapes of columns and rows produces a compositional effect that is far
      more organic, where the orthogonal underpinning of the base grid's structure becomes less
      apparent
    - "Pulling edges of columns and rows out of parallel alignment emphasizes diagonal axes."
    - >
      This kind of deformation often results in the illusion of perspective as newly created angles
      converge; the effect is greatly enhanced if content within columns changes in size or spacing
      to correspond with perceived changes in spatial location from near to far.
  concept_label: deforming_column_shapes_reads_organic_and_converges_into_illusory_perspective
  label_origin: extractor_assigned
  claim: >
    In contrast to splicing and shifting, which keep the orthogonal frame, altering the actual
    shapes of columns and rows produces a far more organic effect in which the orthogonal
    underpinning becomes less apparent. Pulling edges out of parallel alignment emphasises diagonal
    axes; deformed structures may sit side by side as though on one surface, or be shifted and
    rotated to move over and under each other. Deformation often produces an illusion of perspective
    as the new angles converge, and that illusion is greatly enhanced if the content inside the
    columns changes in size or spacing to correspond with the perceived near-to-far position.
    Columns and rows may also be deformed curvilinearly — circles, waves or free-form organic
    shapes — not only angularly.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Converging angles are the cue for depth. Making the type inside a column shrink and tighten as
      the column recedes supplies the second, corroborating cue, so the two agree instead of
      conflicting.
  scope:
    domain_discussed_by_source: [editorial_design, poster_design, magazine_design, web_design]
    conditions: "layouts where an organic or dimensional reading is wanted"
  caveats:
    - text: >
        The scale-and-spacing correspondence is the only part of this that is precisely specifiable,
        and it is stated as an enhancement rather than a requirement.
      origin: extractor_observed
    - text: >
        The source extends the technique to screens with a medium-specific argument: the
        conventional scrolling of webpages can rapidly regularise perceived movement into a
        vertically constrained stream, and deformation can introduce greater lateral movement and a
        perception of deeper space, with the irregularity abruptly reinforced as the altered shapes
        pass the orthogonal edges of the browser window. This is asserted, with no example of a
        shipped site behaving that way.
      origin: extractor_observed
    - text: >
        Every claim in this object is about how an arrangement looks, and its demonstrations are
        images not inspectable in this copy.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "pull column and row edges out of parallel to emphasise diagonal axes"
    - "change content size or spacing inside columns to match the perceived near-to-far position"
    - "deform columns curvilinearly as circles, waves or free-form shapes"
  examples:
    positive:
      - {description: "a modular grid without gutters distorted at its flowlines and column lines to explore exaggerated illusory space", figure_ref: null}
      - {description: "two magazine spreads compared - trapezoidal columns that tensely butt against each other on the surface, against paragraphs and images that read as tilted planes in a dimensional space", figure_ref: null}
  intra_source_relations:
