    - {relation: demonstrated_together_with, target: sk_sgb_0029, note: "the same device — a structure applied without regard to the material — read once as a method and once as a failure"}
    - {relation: trades_off_with, target: sk_sgb_0031, note: "unpredictable juxtaposition against navigability"}
