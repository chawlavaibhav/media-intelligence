- sk_id: sk_sgb_0021
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "symmetry is unforgiving with regard to layout flexibility"
    - >
      a viewer is likely to gloss over material and come to an intellectual rest quickly, rather than
      investigate a work more intently
    - >
      Exaggerating contrasts in scale (or proportion) and spacing (density and rhythm) when working
      with symmetrical compositions is critical to ensuring optical vitality
  concept_label: symmetry_is_unforgiving_and_lets_the_viewer_rest_too_soon
  label_origin: extractor_assigned
  claim: >
    Symmetry is unforgiving with regard to layout flexibility because it demands that every element
    adhere to a single axis; elements that do not typically appear disunified from the whole. The
    restfulness and overall uniformity that follow can be problematic relative to the goals of
    designed communication — a viewer is likely to gloss over the material and come to an
    intellectual rest quickly rather than investigate the work more intently. The source's stated
    remedies are to exaggerate contrasts in scale or proportion and in spacing, density and rhythm;
    to enlarge symmetrically organised forms until they are clearly bigger than the remaining
    symmetrical spaces, so that their confrontation with the format becomes tense and the
    composition's static quality is reduced; to juxtapose dramatically different emphases in
    proportion among both the forms and the spaces separating them, under a defined logic of
    progression or alternation along the axis from beginning to end; and to make radical changes in
    size or in relative lightness and darkness so that lateral movement is reordered dimensionally,
    from near to far.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A single axis and mirrored shapes remove the optical differences that hold attention, so
      contrast has to be reintroduced by exaggerating the dimensions symmetry does not govern —
      scale, density, value — rather than by moving elements off the axis.
  scope:
    domain_discussed_by_source: [poster_design, publication_design, web_design]
    conditions: "symmetrical compositions, including a desktop browser and a smartphone screen"
  caveats:
    - text: >
        The failure named here — the viewer resting too soon — is asserted, not measured. No reader
        evidence is offered.
      origin: extractor_observed
    - text: >
        The source notes that maintaining a logic of contrasting form widths and margin spaces is
        easy in a wide desktop browser and harder within a smartphone's narrow confines, where text
        must be forced into a narrower-than-optimal width and punctuating graphical forms introduced
        so that some lateral contrast survives.
      origin: source_stated
  source_stated_problems:
    - "elements that do not adhere to the single axis appear disunified from the whole"
    - "restfulness and overall uniformity"
    - "a viewer is likely to gloss over material and come to an intellectual rest quickly"
  source_stated_remedies:
    - "exaggerate contrasts in scale or proportion and in spacing, density and rhythm"
    - "enlarge symmetrical forms until they are clearly bigger than the remaining symmetrical spaces"
    - "define a logic of progression or alternation of shape proportions and distance intervals along the axis"
    - "make radical changes in size or in relative lightness and darkness to reorder movement from near to far"
  examples:
