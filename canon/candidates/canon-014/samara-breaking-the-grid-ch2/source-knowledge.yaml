- sk_id: sk_sgb_0045
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      The apparent simplicity of the execution belies the almost obsessive attention to the
      selection, ordering, cropping, color transitions, and color reversal logic of the images
      required to achieve a credible result that seems—at a glance—not really designed.
    - >
      Careful consideration has been given to the precise placement of the forms, however, so that
      although their rhythm is made more random in feeling, their legibility isn't impaired
    - >
      The information is accessible, despite its playful structure, because each part of the
      information is decisively located.
  concept_label: apparent_artlessness_is_produced_by_obsessive_control
  label_origin: extractor_assigned
  claim: >
    Across several exhibit commentaries Samara describes the same relationship between how a layout
    looks and what produced it. An exhibition catalogue whose apparent simplicity looks, at a glance,
    not really designed is said to require almost obsessive attention to the selection, ordering,
    cropping, colour transitions and colour-reversal logic of its images to be credible. A poster on
    the theme of improvisation, with no baselines, alignments or margins and letters floating as
    though scattered, is described as a carefully randomised layout to which two spatial levels add
    further control, with precise placement given to the forms so that legibility is not impaired
    even where red and black letterforms of close optical colour overlap. A third project's playful
    structure is called accessible because each part of the information is decisively located and
    individual components are separated so the eye can reach them easily. In each case the randomness
    is in the appearance and the control is in the placement.
  claim_type: source_interpretation
  interpretation_basis: >
    Each observation is the source's, about its own exhibit. The pattern across them — that in this
    book's own examples apparent randomness is consistently reported as the product of increased
    rather than reduced control — is the extractor's reading. Samara never states it as a general
    proposition, and this object must not be cited as though he did.
  mechanism:
    stated_by_source: true
    text: >
      Removing the grid removes the mechanism that would have placed elements correctly by default.
      The work it was doing does not disappear; it transfers to the designer, element by element,
      which is why the effortless-looking result costs more attention rather than less.
  scope:
    domain_discussed_by_source: [poster_design, publication_design, book_design]
    conditions: "projects whose finished appearance is casual, random or undesigned"
  caveats:
    - text: >
        This is the closest the chapter comes to distinguishing deliberate disorder from incompetent
        disorder, and it does so by describing process rather than by giving a test that could be
        applied to a finished artefact by someone who did not watch it being made.
      origin: extractor_observed
    - text: >
        The source has an interest in this reading: these are exhibits it selected and is commending.
        No case is shown in which apparent randomness turned out to be actual carelessness, so the
        chapter offers no negative control.
      origin: extractor_observed
    - text: >
        Every instance is a layout, and no layout in this copy could be inspected. The proposition
        rests entirely on the source's own descriptions of images the extractor could not see.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "locate each part of the information decisively and separate components so the eye can reach them"
    - "add controlled spatial levels to a randomised arrangement"
    - "place forms precisely so that a more random rhythm does not impair legibility"
  examples:
    positive:
      - {description: "an exhibition catalogue with full-bleed artwork and running text in a colour highlight effect, whose apparent simplicity depends on obsessive control of image selection, ordering, cropping and colour reversal", figure_ref: null}
      - {description: "a poster for an exhibition on improvisation with no baselines, alignments or margins, its letters precisely placed so that legibility survives the overlap of red and black forms close in optical colour", figure_ref: null}
