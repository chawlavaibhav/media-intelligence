- sk_id: sk_sgb_0041
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Interaction Design Without Grids"
    - >
      There really are no considerations or best practices for screen-based design from an
      alternative standpoint that diverge from those that exist for conventional approaches
    - >
      Content is of primary importance; navigation must be clearly different from content; text must
      be legible; users must be able to intuit functionality and page flow, and be able to trace the
      sequence of pages or screens they've accessed; they must be able to get from one screen to
      another, anywhere in the site; the site must load quickly; and it must be a beautiful,
      compelling experience worthy of their time.
  concept_label: alternative_screen_layout_faces_the_same_unchanged_usability_requirements
  label_origin: extractor_assigned
  claim: >
    Samara observes that although interactive media could technically free designers from grid-based
    editorial structure — page matter need not stay statically displayed as it does in print — grid
    use has become remarkably ubiquitous in online publishing. He grants that a grid readily addresses
    responsive design and speeds the templating of many pages, but says there is no good reason those
    requirements cannot be met equally well by an alternative logic, and that screen-based
    interactivity, from scrolling to animation to flyout navigation to parallax, seems ready-made for
    alternative layout. The constraint he attaches is that there are no considerations or best
    practices for screen design from an alternative standpoint that diverge from those for
    conventional approaches. He lists them: content is of primary importance; navigation must be
    clearly different from content; text must be legible; users must be able to intuit functionality
    and page flow and trace the sequence of screens they have visited; they must be able to reach any
    screen from any other; the site must load quickly; and it must be an experience worth their time.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [web_design, interaction_design]
    conditions: "screen-based publishing and interactive media as of the 2017 second edition"
  caveats:
    - text: >
        This is the plainest statement in the chapter that the licence to depart from the grid does
        not extend to the usability requirements. The requirements are not relaxed for unconventional
        work; only the structure is.
      origin: extractor_observed
    - text: >
        The observation that designers underuse the medium is a 2017 practitioner's reading of the
        field, and the platform assumptions behind it — desktop browser, mouseover, flyout menus —
        are of that moment.
      origin: extractor_observed
    - text: >
        Most of the screen examples are described through their motion behaviour, which no static
        extraction of any kind can verify. Only the stated requirements are recorded here.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "keep navigation clearly different from content"
    - "keep text legible"
    - "let users intuit functionality and page flow and trace where they have been"
    - "allow movement from any screen to any other"
  examples:
