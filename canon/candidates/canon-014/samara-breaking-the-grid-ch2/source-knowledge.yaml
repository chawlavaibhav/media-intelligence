- sk_id: sk_sgb_0008
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      Inserting any form (even a solitary one) into a space creates structure—a set of visual
      relationships between its contour (the shape of its outer boundary) and axis (an imaginary
      line that separates its halves), and those of other forms.
    - >
      simply because an arrangement presents no perceptible repetition or pattern among its parts
      doesn't discredit it as a structure
  concept_label: inserting_any_form_creates_structure_and_irregularity_does_not_disqualify_it
  label_origin: extractor_assigned
  claim: >
    Inserting any form into a space, even a solitary one, creates structure: a set of visual
    relationships between that form's contour and axis and those of other forms. Because of human
    orientation to Earth, forms are typically perceived as expressing two primary axes, horizontal
    and vertical — orthogonal, grid structure. But structures may be far more complex than that, and
    any structure may be fluid and irregular in proportion or interval. That an arrangement presents
    no perceptible repetition or pattern among its parts does not discredit it as a structure.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Structure is defined here as relationship between contours and axes, not as regularity. Two
      forms in one space have relationships whether or not those relationships repeat, so structure
      is unavoidable and only its kind is chosen.
  scope:
    domain_discussed_by_source: [graphic_design, composition]
    conditions: "any format containing at least one form"
  caveats:
    - text: >
        The orthogonal default is given a perceptual-cum-gravitational cause — "because of our
        orientation to Earth" — which is asserted, not argued, and would if true be universal rather
        than cultural. The source does not reconcile it with its own culturally specific reading
        claims elsewhere in the chapter.
      origin: extractor_observed
    - text: >
        Read strictly, this definition makes "no structure" impossible and so makes the chapter's
        title figurative. That is the extractor's observation; the source does not draw it.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "radial flower petals, the irregular axes of constellations, galactic spirals, hexagonal crystal lattices and the helical whorl of DNA, given as structures expressing geometricity without horizontal and vertical axes", figure_ref: null}
  intra_source_relations:
    - {relation: depends_on, target: sk_sgb_0009, note: "if structure is unavoidable, the only remaining question is what it means"}
