- sk_id: sk_sgb_0004
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      the word deconstruction was coined to describe their intentions: to break apart preconceived
      structures, or to use those structures as a starting point for new avenues of discovery
    - "either simply ugly or as morally wrong"
  concept_label: deconstruction_named_as_breaking_or_restarting_from_preconceived_structure
  label_origin: source_verbatim
  claim: >
    The source defines deconstruction, as the term was coined between 1971 and 1984 at Cranbrook and
    around it, as two intentions: to break apart preconceived structures, or to use those structures
    as a starting point for new avenues of discovery. Its method was to dissect varied sources —
    poststructural philosophy, semiotics, the vernacular, the Swiss New Wave — and then rebuild
    exaggerated configurations of type and image based on the findings.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Both intentions take the existing structure as their input. Deconstruction in this sense is
      defined by having something to work against, not by the absence of structure.
  scope:
    domain_discussed_by_source: [graphic_design, design_education]
    conditions: "a specific movement, dated by the source to 1971-1984 and located at named schools"
  caveats:
    - text: >
        The source records that much of the East Coast and European establishment read this work as
        "either simply ugly or as morally wrong, a repudiation of the progress for which Modernism
        had struggled." That the same artefacts were read as incompetence by trained peers is the
        clearest evidence in the chapter that the intentional-versus-incompetent distinction is not
        self-evident from the artefact.
      origin: source_stated
    - text: "a historical and educational account; the definition is the movement's, reported by the source"
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "Cranbrook work by Nakata, Hori, Wilde, Tenazas, Santoro, Haycock and Makela", figure_ref: null}
  intra_source_relations:
    - {relation: depends_on, target: sk_sgb_0011, note: "the craft procedure that instantiates the first intention"}
    - {relation: trades_off_with, target: sk_sgb_0005, note: "deconstruction still refers to a structure; Carson's practice did not"}
