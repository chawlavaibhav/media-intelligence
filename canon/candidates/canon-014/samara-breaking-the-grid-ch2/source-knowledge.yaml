- sk_id: sk_sgb_0029
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      The grid forces the deconstruction because its structure is created before assessing the
      material it governs: The material ends up doing whatever it will as it is made to conform to
      its predetermined criteria.
    - >
      This book of seemingly random three-dimensional spaces, texts, and images is built on a master
      grid that helps contribute to its intuitive organic quality.
  concept_label: a_structure_imposed_before_the_material_is_assessed_forces_its_own_deconstruction
  label_origin: extractor_assigned
  claim: >
    In one exhibit Samara states the inverse of the chapter's usual direction. A book of seemingly
    random three-dimensional spaces, texts and images is built on a master grid, and the grid is what
    contributes to its intuitive, organic quality. The stated reason is that the grid forces the
    deconstruction because its structure was created before the material it governs was assessed: the
    material ends up doing whatever it will as it is made to conform to predetermined criteria. The
    result is a collage of texture, shadow, light and type which on closer inspection reveals its
    hidden order.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A grid built before its content is a closed system the content cannot fit; the misfits are the
      deconstruction. The disorder is therefore produced by the structure rather than in spite of it,
      and the structure remains recoverable underneath.
  scope:
    domain_discussed_by_source: [book_design, publication_design]
    conditions: >
      an exhibit produced for a show on the relationship between structure and freedom, in which
      participants were required to use predetermined kernel elements — a grid, the word "word", and
      the image of an eye
  caveats:
    - text: >
        The same author's chapter-1 material treats building a grid before assessing content as an
        error to be avoided. Here the identical act is described as productive. This is one author
        qualifying his own earlier statement in a different context — a deliberately constrained
        exhibition brief — and not two sources disagreeing.
      origin: extractor_observed
    - text: >
        It is a single exhibit under an artificial brief. Reading it as a general licence to impose a
        grid before reading the content would overstate what the source says.
      origin: extractor_observed
    - text: >
        The hidden order is said to be revealed on closer inspection of the printed book. That
        inspection was not possible here; only the stated reasoning is recorded.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
