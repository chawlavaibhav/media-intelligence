- sk_id: sk_sgb_0009
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      Being completely objective, the choice of one structural approach is no more valid, on a
      functional level, than that of another.
    - >
      The different qualities of each, however, will impart extremely different perceptions of
      content and, therefore, of its meaning
    - "If an arrangement is structured like a tree, for instance, the viewer will interpret it as a tree."
    - "Designers must still confront the issue of a structure's relevance on a communicative level."
  concept_label: all_structures_are_functionally_equal_but_semantically_consequential
  label_origin: extractor_assigned
  claim: >
    Objectively, no structural approach is more valid than another on a functional level. Every kind
    of structure has implications for the display of content, and the differing qualities of each
    impart extremely different perceptions of the content and therefore of its meaning — especially
    where the structure is one a viewer is likely to associate with a concrete experience. If an
    arrangement is structured like a tree, the viewer will interpret it as a tree. The designer must
    therefore still confront the question of a structure's relevance on a communicative level. The
    source adds that these approaches are not comprehensive and need not be used independently of
    each other.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A structure that resembles a familiar physical arrangement is read as that arrangement, so
      choosing a structure is choosing an association whether or not the association was intended.
  scope:
    domain_discussed_by_source: [graphic_design, composition]
    conditions: "any structural choice, grid or otherwise"
  caveats:
    - text: >
        This is the chapter's actual constraint on breaking the grid and it is a semantic one, not a
        formal one. Formal freedom is granted in full; relevance is not.
      origin: extractor_observed
    - text: >
        "The viewer will interpret it as a tree" is stated without qualification about which
        viewers. The associations the chapter goes on to use — supermarket banners, Hatch Show
        Prints, Victorian illustrated books — are specific to particular cultures and periods.
      origin: extractor_observed
  source_stated_problems:
    - "a structure that is not relevant on a communicative level"
  source_stated_remedies: []
  examples:
    positive: []
    counter: []
  intra_source_relations:
