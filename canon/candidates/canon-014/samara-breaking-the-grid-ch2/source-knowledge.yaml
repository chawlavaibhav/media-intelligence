- sk_id: sk_sgb_0037
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Integrating Information Design"
    - >
      The looser, more organic, and gestural the layout is, the less these architectural and
      geometric elements will fit in... Unless they're made to do so.
    - >
      As a last resort, a designer might simply rotate a graph or table slightly, or position it over
      a more organic form, to diminish the presence of its corners and orthogonal axes—without
      compromising the data's integrity, of course.
  concept_label: information_graphics_should_be_recast_before_they_are_merely_rotated
  label_origin: extractor_assigned
  claim: >
    Statistical data, financial tables and similar infographic material will typically be at odds
    with non-grid-based composition, and the looser, more organic and gestural the layout, the less
    these architectural and geometric elements fit — unless they are made to. The source gives an
    ordered procedure. First, determine whether the data must keep the form in which it was supplied,
    since many kinds of statistical data can be visualised in different forms using different chart
    conventions. If it can change, choose the data shape whose formal qualities most closely reflect
    those of the overall layout and recast the data into it. If it cannot, the existing data
    structure may still be alterable enough to create adequate formal dialogue with the other
    elements. Only as a last resort should the designer rotate a graph or table slightly, or position
    it over a more organic form, to diminish the presence of its corners and orthogonal axes — and
    never at the cost of the data's integrity.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A chart's dissonance comes from its form language, not from its content, and the same numbers
      can wear a different form. Changing the encoding therefore removes the conflict at its source,
      whereas rotating the object only disguises it.
  scope:
    domain_discussed_by_source: [annual_report_design, publication_design, information_design]
    conditions: "data-bearing material placed in loose, organic or gestural layouts"
  caveats:
    - text: >
        The remedies are explicitly ranked and the ranking is the useful part: recast, then adjust
        the existing structure, then — last — rotate. Treating rotation as a first move inverts the
        source.
      origin: extractor_observed
    - text: >
        The integrity of the data is stated as a hard limit on all three moves, which is the one
        place in the chapter where an expressive gain is subordinated outright to accuracy.
      origin: extractor_observed
  source_stated_problems:
    - "statistical and infographic material is visually at odds with non-grid-based composition"
  source_stated_remedies:
    - "determine whether the data can take a form other than the one supplied"
    - "choose the data shape whose formal qualities most closely reflect the layout and recast the data"
    - "otherwise alter the existing data structure enough to create formal dialogue"
    - "as a last resort rotate the graph or table slightly, or set it over an organic form, without compromising the data's integrity"
  examples:
