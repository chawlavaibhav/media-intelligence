      - {description: "a book whose characters' voices are coded by typeface style against a legend in the head margins, with columns deconstructed as the dialogue falls apart, becomes confused or interrupts itself", figure_ref: null}
      - {description: "an exhibition poster whose title is verbally deconstructed after the chemical names of its pharmaceutical client, so the treatment states the nature of the business", figure_ref: null}
  intra_source_relations:
