  concept_label: vernacularism_imports_a_foreign_context_to_comment_on_the_subject
  label_origin: extractor_assigned
  claim: >
    A further allusive strategy is to appropriate the visual language of common, everyday experience
    or the stylistic gestures associated with a particular context — the vernacular. Using vernacular
