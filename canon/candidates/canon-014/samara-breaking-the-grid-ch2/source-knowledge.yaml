- sk_id: sk_sgb_0030
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Considering the Practical in the Impractical"
    - "why deny the potential of an unusual solution for the reason that it's not functional... Yet?"
    - >
      Any approach that flies in the face of convention will be fraught with difficulties. By
      objectively identifying problematic aspects and working to address them with a little common
      sense, even the most challenging solution may be resolved to achieve a necessary level of
      practicality—without necessarily diluting its inventiveness.
  concept_label: an_unconventional_layout_must_be_made_practical_by_objective_diagnosis
  label_origin: extractor_assigned
  claim: >
    The factor that usually dissuades a designer from an unconventional layout is the challenge it is
    perceived to pose for viewers — aesthetic discomfort, or something more utilitarian such as being
    too difficult to navigate — and many argue that usability necessarily precludes these approaches.
    The source rejects the conclusion rather than the difficulty. Any approach that flies in the face
    of convention will be fraught with difficulties; the obligation is to identify the problematic
    aspects objectively and work to address them, after which even the most challenging solution may
    be resolved to a necessary level of practicality without necessarily diluting its inventiveness.
    The stated reframing is temporal: a solution is not to be rejected because it is not functional
    yet.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: null
  scope:
    domain_discussed_by_source: [publication_design, book_design, poster_design, web_design]
    conditions: "any layout that departs from convention"
  caveats:
    - text: >
        This is the chapter's actual constraint and it is a duty, not a permission: the difficulty is
        conceded in full and the designer is made responsible for resolving it. The chapter is
        frequently read as "anything goes"; this sentence is the reason that reading is wrong.
      origin: extractor_observed
    - text: >
        "A little common sense" is the whole of the stated method. No procedure, threshold or test of
        sufficiency is given, and the qualifier "necessary level of practicality" is not defined.
      origin: extractor_observed
    - text: >
        The word "necessarily" in "without necessarily diluting its inventiveness" concedes that the
        repair may cost some of the invention. The source does not say how to decide when it has cost
        too much.
      origin: extractor_observed
  source_stated_problems:
