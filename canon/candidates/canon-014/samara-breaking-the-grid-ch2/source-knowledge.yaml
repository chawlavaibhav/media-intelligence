- sk_id: sk_sgb_0035
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Easing Dissonance, Enhancing Totality"
    - >
      the importance of applying macro-level compositional gestures to micro-scale elements such as
      text, albeit at a smaller scale, can not be overstated
    - "the potentially fractured or dissonant quality that often attends alternative compositional approaches"
    - >
      Text of a legible point size will withstand a degree of manipulation without sacrifice but, if
      it seems too challenging, consider treating subheadings and callouts or decks as a bridge
      between macro and micro.
  concept_label: macro_scale_gestures_repeated_at_micro_scale_ease_dissonance
  label_origin: extractor_assigned
  claim: >
    Alternative compositional approaches often carry a fractured or dissonant quality. The source's
    remedy is a matter of finesse rather than practicality: apply the layout's macro-level
    compositional gestures to micro-scale elements such as text, at a smaller scale, which creates
    greater cohesion among disparate parts and alleviates the dissonance. Text of a legible point
    size will withstand a degree of manipulation without sacrifice; where that seems too challenging,
    the source proposes treating subheadings, callouts or decks as a bridge between the macro and
    micro scales instead of manipulating the running text.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Cohesion comes from the same gesture recurring at more than one scale. Where the smallest scale
      cannot take the gesture without becoming illegible, an intermediate element carries it, so the
      chain from macro to micro is not broken.
  scope:
    domain_discussed_by_source: [publication_design, book_design, editorial_design]
    conditions: "layouts built on alternative compositional approaches that contain running text"
  caveats:
    - text: >
        "A degree of manipulation" and "too challenging" are the source's own limits and neither is
        quantified. The legibility floor that decides between the two remedies is left to judgement.
      origin: extractor_observed
    - text: >
        The subhead-as-bridge remedy is the practical core of this object and is easy to overlook
        next to the general instruction.
      origin: extractor_observed
  source_stated_problems:
    - "the potentially fractured or dissonant quality that often attends alternative compositional approaches"
  source_stated_remedies:
    - "apply macro-level compositional gestures to micro-scale elements at a smaller scale"
    - "where text cannot take the manipulation, use subheadings, callouts or decks as the bridge"
  examples:
