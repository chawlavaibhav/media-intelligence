- sk_id: sk_sgb_0024
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - "Spontaneous Composition"
    - "the intuitive placement of material based on its formal aspects"
    - "This approach starts fast and loose"
    - "as an antidote to structure, which implies analytical intent"
  concept_label: spontaneous_composition_is_intuitive_placement_then_optical_correction
  label_origin: extractor_assigned
  claim: >
    Where structure implies analytical intent, the source offers spontaneous approaches as an
    antidote — working by instinct and letting purely formal instincts supersede the rational.
    Spontaneous composition is defined as the intuitive placement of material based on its formal
    aspects: seeing the visual relationships already inherent in the material and making those
    connections for the viewer. The method is not a single gesture but a loop. The designer starts
    fast and loose, working as a painter does and making quick decisions as the material is put
    together and the relationships are first seen; then, as the elements' optical qualities begin to
    interact, the designer determines which qualities those first decisions have affected and adjusts
    to enhance or negate them as the communication requires. Samara notes that designers often use
    this method as a step within the process of building a grid, and asserts that its use as an
    organisational idea on its own is just as valid.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The method's liveliness has an affinity with collage; its immediacy and directness are
      described as inviting to viewers, providing a simple and gratifying experience that is very
      accessible.
  scope:
    domain_discussed_by_source: [poster_design, publication_design, editorial_design]
    conditions: "projects where a formal, experiential reading is wanted rather than an analytical one"
  caveats:
    - text: >
        The critical detail is that the placement is intuitive but not unexamined: the source's own
        description contains an evaluation step in which the designer reads back what the first
        decisions did and corrects. This is the difference the chapter relies on and it is easy to
        miss.
      origin: extractor_observed
    - text: >
        The claim that immediacy is inviting and accessible to viewers is a practitioner assertion
        with no audience evidence behind it.
      origin: extractor_observed
    - text: >
        Samara says designers often use spontaneous composition inside grid-building, which places
        this method upstream of the live chapter-1 procedure rather than opposed to it.
      origin: source_stated
  source_stated_problems: []
  source_stated_remedies:
