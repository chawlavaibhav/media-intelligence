- sk_id: sk_sgb_0015
  source_id: samara-breaking-the-grid-ch2
  source_terms:
    - >
      The natural rhythm of spoken language, for example, is often used as a guide for changing
      weight, size, color, or alignment among lines of type; louder or "faster" words may be set in
      larger or bolder type or in italics, corresponding to stresses and lulls in actual speech.
    - >
      Giving a "voice" to visual language can help alter the structure of a text by pushing words
      out of paragraphs or forcing modules or columns into relationships where the natural logic of
      the writing creates a visual order.
    - "treating all of the adjectives in a particular way would create a secondary structure"
  concept_label: speech_qualities_can_generate_or_break_typographic_structure
  label_origin: extractor_assigned
  claim: >
    Verbal or conceptual cues inside the content can be used to break a grid or to create a new one
    entirely. The natural rhythm of spoken language is the source's principal example: louder or
    faster words set larger, bolder or italic, corresponding to the stresses and lulls of actual
    speech. Giving a voice to visual language alters the structure of a text by pushing words out of
    paragraphs, or forcing modules and columns into relationships in which the natural logic of the
    writing creates the visual order. Grammatical categories work the same way — treating every
    adjective in a particular way creates a secondary structure with a rhythmic, organic quality.
    The source presents three graded versions of one text: size change alone produces loudness and a
    crescendo; changes of weight, posture, width and spacing produce a rhythmic journey of slowing
    and speeding; and changes applied to distinguish linguistic and conceptual relationships give
    the reader a snapshot of the content before they fully engage the text.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The structure is read off a property the content already has, so the resulting arrangement is
      motivated by the writing rather than imposed on it.
  scope:
    domain_discussed_by_source: [typography, editorial_design, book_design]
    conditions: "text whose spoken or grammatical character carries meaning worth showing"
  caveats:
    - text: >
        The source traces this to Dada and Futurist practice, in which letters and words were
        pictures of emotional or psychological states whose power came from aggressive visual
        arrangement rather than from literal meaning, and to Ruder's mixing of weight, slant and
        size within single lines for a semiotic representation of language. The craft rule and its
        historical warrant are the same claim at different dates.
      origin: source_stated
    - text: >
        The three graded versions are a figure sequence. The text names what each version does; the
        versions themselves are images not inspectable in this copy, so the ladder is recorded on
        the captions' word and not verified.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "map size to loudness for a crescendo"
    - "map weight, posture, width and spacing to tempo for a rhythmic journey"
    - "code linguistic and conceptual relationships so the reader gets a snapshot before reading"
  examples:
