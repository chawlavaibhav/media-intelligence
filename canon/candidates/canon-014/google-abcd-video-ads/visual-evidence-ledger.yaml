    framework illustrations and the storyboard graphic were inspected individually; the fourteen
    brand-vignette thumbnails were opened and checked against their alt text and against the
    examples.positive entries that cite them.
  images_enumerated: 64
  chrome_excluded: 39
  content_images_opened: 25
  figures: 0
  figure_note: >
    No image on any of the three pages is a figure in the argument-bearing sense. The pass found
    nothing whose content a cited claim depends on.
  groups:
    - group: framework_illustrations
      files: [images/P2-img19.png, images/P2-img20.png, images/P2-img21.png, images/P2-img22.png, images/P2-img23.png, images/P2-img24.png]
