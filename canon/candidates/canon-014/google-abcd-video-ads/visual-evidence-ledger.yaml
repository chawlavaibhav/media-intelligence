      Figure-statistic discrepancy STANDS EXACTLY AS RECORDED: P3 "Deliver as much as a 30% lift
      ... and a 17% lift" (upper bound); P2 "On average, the ABCDs deliver a 30% lift ... 17%
      lift" (central tendency); P1 bare callouts with "n=11,000 ads" and the footer "Actual
      results will vary by advertiser". Nothing on any pinned page resolves it.
    - >
      P3 objective matrix cell-to-column bindings re-read from the pinned table markup match the
      extraction's resolved matrix exactly, including the two double-bullet Connection cells
      ("Make the people core to the story" + "Be different, yet simple"; "Show how it works" +
      "Be relatable") that the original text dump had flattened (sk_abcd_0023-0026).
    - >
      sk_abcd_0014's platform-behaviour claim is verbatim on P2: "YouTube is almost entirely a
      sound-on experience, so take advantage of the multisensory aspect of your medium".
    - >
      sk_abcd_0019's principle wording "Ask them to take action and give clear, concise direction
