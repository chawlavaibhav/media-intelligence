- blocker: technology_and_platform_contingent_throughout
  detail: 'This is guidance about how one platform''s feed behaved at one time, published by the party
    that owns

    the platform and sells the advertising on it. Almost nothing in it is a durable mechanism: the

    recommendations track a specific player, a specific autoplay and sound-off behaviour, and a specific

