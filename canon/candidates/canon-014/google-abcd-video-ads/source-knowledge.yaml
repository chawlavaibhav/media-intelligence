source_id: google-abcd-video-ads
source_knowledge:
# google-abcd-video-ads — SourceKnowledge (SPEC-03)
# Google's own published guidance on the "ABCDs of effective video ads", three Google-owned pages,
# retrieved 30 August 2026. There are NO page numbers; locators name page + section heading.
# EXPERIMENTAL — NOT LIVE CANON.
#
# Two cautions apply to this whole file and are repeated as caveats on every object:
#   (1) declared publisher interest — the publisher sells advertising on the platform whose
#       creative guidance this is, and whose effectiveness the cited research validates;
#   (2) platform- and time-contingency — one platform's ad products under one set of playback
#       behaviours at one time, not a durable mechanism claim.

- sk_id: sk_abcd_0001
  source_id: google-abcd-video-ads
  source_terms:
  - "The 4 principles of creating effective YouTube video ads are Attention, Branding, Connection, and Direction"
  - "Attention, Branding, Connection, Direction"
  - "the ABCDs"
  concept_label: abcd_four_principle_execution_framework
  label_origin: extractor_assigned
  claim: >-
    The source decomposes effective YouTube video-ad execution into exactly four named principles —
    Attention, Branding, Connection and Direction — and presents them not as a menu to choose from
    but as a set to be factored into each of the many decisions that go into making an ad.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      The source's account is that these principles were observed across video ads that worked
      effectively for brands, and that "by factoring four simple principles into each decision, your
      work is more likely to achieve your marketing goals".
  scope:
    domain_discussed_by_source: [youtube_video_advertising, brand_communication]
    conditions: >-
      Paid video advertising on YouTube, as the platform and its ad products stood on the pages
      dated April 2022 and May 2023 and as retrieved on 30 August 2026.
  caveats:
  - text: >-
      The source nowhere states that the four principles are exhaustive, and reports no result
      for omitting one. Jointness is asserted by how the framework is written and used, not by
      any test the source describes.
    origin: extractor_observed
  - text: >-
      Platform- and time-contingent. This is guidance about one company's ad products on one
      platform. Playback behaviour, ad formats and surfaces change; the source does not claim a
      durable mechanism and none should be read in.
    origin: extractor_observed
  - text: >-
      Declared publisher interest. The publisher sells advertising on the platform whose creative
      guidance this is, and the cited research validates that product. Third-party involvement
      (Ipsos as research partner; Nielsen and Kantar as independent reviewers, per the source's
      own account) moderates this; it does not remove it.
    origin: extractor_observed
  source_stated_problems:
  - "Making an ad involves many decisions: some big, some small"
  source_stated_remedies:
  - "By factoring four simple principles into each decision, your work is more likely to achieve your marketing goals"
  examples:
    positive:
    - {description: "The 'Fishos' fish-flavoured dog-treat storyboard, revised principle by principle as the source walks the four letters", figure_ref: null}
    counter:
    - {description: "The same Fishos ad before the ABCD principles are applied, which the source presents as the weaker of the pair", figure_ref: null}
  intra_source_relations:
  - {relation: member_of_system, target: scs_abcd_001, note: "the framework object anchors the system"}
  - {relation: generalises, target: sk_abcd_0005, note: "Attention is one of the four"}
  - {relation: generalises, target: sk_abcd_0010, note: "Branding is one of the four"}
  - {relation: generalises, target: sk_abcd_0015, note: "Connection is one of the four"}
  - {relation: generalises, target: sk_abcd_0019, note: "Direction is one of the four"}
  - {relation: qualified_by, target: sk_abcd_0002, note: "the source limits the framework to execution"}
  evidence:
    characteristics: [explicitly_stated, repeated_within_source, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: 'Google Ads Help, "About the ABCDs of effective video ads"'
    section: >-
      Article introduction; the same decomposition opens Google for Business resources, "ABCDs of
      effective video ads" (May 2023) and Think with Google, "Understanding the ABCDs of effective
      creative on YouTube" (April 2022)
    page_start:
    page_end:
    figure_refs: []
    source_support: text
    inspected:
      text: true
      figures: []

- sk_id: sk_abcd_0002
  source_id: google-abcd-video-ads
  source_terms:
  - "The ABCD principles are not a formula for generating creative ideas"
  - "creative execution is just as important as the idea itself"
  - "once you have that big idea, the ABCDs can help you bring it to life on YouTube"
  concept_label: abcds_govern_execution_not_idea_generation
  label_origin: extractor_assigned
  claim: >-
    The source explicitly limits its own framework: the ABCDs are not a method for generating
    creative ideas. They are applied after a concept exists, to bring that concept to life on the
    platform. The source's stated warrant for caring about execution at all is a third party's
    research, which it says shows creative — concept through execution — is the leading driver of
    campaign effectiveness and ROI.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: true
    text: >-
      If creative execution carries as much weight as the idea, then a set of execution principles
      can raise the return on an idea that already exists, without supplying the idea.
  scope:
    domain_discussed_by_source: [youtube_video_advertising, creative_process]
    conditions: "Stated at the point where the source introduces the framework"
  caveats:
  - text: >-
      The supporting effectiveness claim is attributed to NCSolutions, a third party, and is
      reported by the publisher without a study name, date, sample or method. It is a
      third-party-reported claim, not a measurement the source lets the reader inspect.
    origin: extractor_observed
  - text: >-
      Only the Think with Google page states this limit. The Google Ads Help page and the
      resources article present the ABCDs without it, so a reader arriving at either of those
      pages does not meet the boundary condition at all.
    origin: extractor_observed
  - text: >-
      Platform- and time-contingent. This is guidance about one company's ad products on one
      platform. Playback behaviour, ad formats and surfaces change; the source does not claim a
      durable mechanism and none should be read in.
    origin: extractor_observed
  - text: >-
      Declared publisher interest. The publisher sells advertising on the platform whose creative
      guidance this is, and the cited research validates that product. Third-party involvement
      (Ipsos as research partner; Nielsen and Kantar as independent reviewers, per the source's
      own account) moderates this; it does not remove it.
    origin: extractor_observed
  source_stated_problems:
  - "treating the ABCDs as a formula for generating creative ideas"
  source_stated_remedies:
  - "once you have that big idea, the ABCDs can help you bring it to life on YouTube in the most powerful way"
  examples:
    positive:
    - {description: "The Fishos walkthrough begins with an already-approved concept and starts at the storyboard, which is where the source says the ABCDs enter", figure_ref: null}
    counter: []
  intra_source_relations:
  - {relation: qualifies, target: sk_abcd_0001, note: "sets the boundary of the framework"}
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, outcome_claimed]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: 'Think with Google, "Understanding the ABCDs of effective creative on YouTube" (Ariane Le Port, April 2022)'
    section: 'Section "Crafting a successful ad"'
    page_start:
    page_end:
    figure_refs: []
    source_support: text
    inspected:
      text: true
      figures: []

- sk_id: sk_abcd_0003
  source_id: google-abcd-video-ads
  source_terms:
  - "Deliver as much as a 30% lift in short-term sales likelihood and a 17% lift in long-term brand contribution"
  - "On average, the ABCDs deliver a 30% lift in short-term sales likelihood and a 17% lift in long-term brand contribution"
  - "Source: Google/Kantar, The Short & the Long of ABCDs Effectiveness, Global, Apr 2021. n=11,000 ads"
  concept_label: abcd_effectiveness_lift_claim
  label_origin: extractor_assigned
  claim: >-
    The source attaches two effectiveness figures to the ABCDs as a set — a 30 per cent lift in
    short-term sales likelihood and a 17 per cent lift in long-term brand contribution — sourced to
    a study it names "The Short & the Long of ABCDs Effectiveness", credited to Google/Kantar,
    global, April 2021, with a sample of 11,000 ads. The publisher's three pages state the same
    two figures at three different strengths and with three different levels of citation detail.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: false
    text:
  scope:
    domain_discussed_by_source: [youtube_video_advertising, effectiveness]
    conditions: >-
      Attributed to a global study of 11,000 ads dated April 2021; the source does not state the
      markets, categories, ad formats, lengths or comparison baseline behind either figure.
  caveats:
  - text: >-
      The three Google pages phrase the identical finding differently and the difference is not
      cosmetic. Google Ads Help says "Deliver as much as a 30% lift ... and a 17% lift", which is
      an upper bound. Think with Google says "On average, the ABCDs deliver a 30% lift ... and a
      17% lift", which is a central tendency. The Google for Business resources article prints the
      two numbers as bare callouts ("30% lift in short-term sales likelihood", "17% lift in
      long-term brand contribution") with no qualifier at all, above a page-footer line reading
      "Actual results will vary by advertiser". An upper bound and an average are different
      statistics. The discrepancy is recorded, not resolved; nothing in any of the three pages
      settles which is correct.
    origin: extractor_observed
  - text: >-
      Citation detail also differs by page. Only the Google for Business resources article gives
      the sample size, "n=11,000 ads". Google Ads Help gives the same study, publisher, scope and
      month with no sample size. Think with Google cites it as "Google/Kantar Link AI, Global, The
      Short and the Long of ABCDs Effectiveness, 2021" — naming Kantar's Link AI, dropping the
      month and giving no sample size.
    origin: extractor_observed
  - text: >-
      The underlying study is not published on any of the three pages and is not linked. No
      method, comparison baseline, definition of "short-term sales likelihood" or
      "long-term brand contribution", confidence interval or dispersion is given. These are
      reported results, but they are reported by an interested party from a study the source does
      not let the reader inspect.
    origin: extractor_observed
  - text: >-
      The figures are attached to the ABCDs as a set. The source does not decompose the lift by
      principle, so no figure here supports a claim about Attention, Branding, Connection or
      Direction individually.
    origin: extractor_observed
  - text: >-
      Platform- and time-contingent. This is guidance about one company's ad products on one
      platform. Playback behaviour, ad formats and surfaces change; the source does not claim a
      durable mechanism and none should be read in.
    origin: extractor_observed
  - text: >-
      Declared publisher interest. The publisher sells advertising on the platform whose creative
      guidance this is, and the cited research validates that product. Third-party involvement
      (Ipsos as research partner; Nielsen and Kantar as independent reviewers, per the source's
      own account) moderates this; it does not remove it.
    origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
  - "Refine your creative execution with data-backed guidelines"
  examples:
    positive: []
    counter: []
  intra_source_relations:
  - {relation: depends_on, target: sk_abcd_0004, note: "the study's independence rests on the framework's stated research provenance"}
  - {relation: qualifies, target: sk_abcd_0001, note: "the lift is claimed for the four as a set"}
  evidence:
    characteristics: [explicitly_stated, empirical_within_source, outcome_claimed, historical_claim, repeated_within_source]
    source_uncertainty: source_hedges
    extraction_uncertainty: none
  provenance:
    chapter: 'Google Ads Help, "About the ABCDs of effective video ads"'
    section: >-
      Section "Benefits" and its asterisked source note; the same two figures appear as headline
      callouts with a footnote in Google for Business resources, "ABCDs of effective video ads",
      and in Think with Google, "Understanding the ABCDs of effective creative on YouTube", section
      "Crafting a successful ad" with source note 1
    page_start:
    page_end:
    figure_refs: []
    source_support: text
    inspected:
      text: true
      figures: []

