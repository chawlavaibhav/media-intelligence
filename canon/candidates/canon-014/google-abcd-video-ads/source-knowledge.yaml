- sk_id: sk_abcd_0026
  source_id: google-abcd-video-ads
  source_terms:
  - "Full funnel: Maximize effectiveness by incorporating all objectives"
  - "Hook attention with audio and focus on elements that deliver the message"
  - "Start with a mix of branding elements and finish with the product"
  - "Establish a connection with your audience to help support your product"
  - "Use CTAs throughout your ad, and be more direct as you go"
  concept_label: full_funnel_objective_weighting
  label_origin: extractor_assigned
  claim: >-
    The full-funnel row is the only one that gives all four principles an objective-specific
    instruction, and two of the four instructions are about ordering within the ad rather than
    about content. Branding is to start with a mix of branding elements and finish with the
    product. Direction is to use calls to action throughout the ad and to become more direct as it
    proceeds. Attention is to be hooked with audio while focusing on the elements that deliver the
    message, and Connection is to be established in support of the product.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: false
    text:
  scope:
    domain_discussed_by_source: [youtube_video_advertising, media_planning, brand_communication]
    conditions: "Campaigns incorporating awareness, consideration and action objectives together"
  caveats:
  - text: >-
      The full-funnel row contradicts a common reading of the core Direction guidance as a single
      end-of-ad ask: it asks for calls to action throughout, escalating in directness. That is a
      structural instruction the core table does not contain.
    origin: extractor_observed
  - text: >-
      This row exists only in the Google Ads Help table. Think with Google names three objectives
      and not this one.
    origin: extractor_observed
  - text: >-
      No evidence is offered for this weighting. It is asserted in a table with no result attached
      to any cell.
    origin: extractor_observed
  - text: >-
      Platform- and time-contingent. This is guidance about one company's ad products on one
      platform. Playback behaviour, ad formats and surfaces change; the source does not claim a
      durable mechanism and none should be read in.
    origin: extractor_observed
  - text: >-
      Declared publisher interest. The publisher sells advertising on the platform whose creative
      guidance this is, and the cited research validates that product. Third-party involvement
      (Ipsos as research partner; Nielsen and Kantar as independent reviewers, per the source's
      own account) moderates this; it does not remove it.
    origin: extractor_observed
