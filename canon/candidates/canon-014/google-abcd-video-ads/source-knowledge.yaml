- sk_id: sk_abcd_0008
  source_id: google-abcd-video-ads
  source_terms:
  - "Support the story with audio and supers"
  - "Reinforce your message with audio and text. Avoid competing elements."
  - "Emphasize key points"
  concept_label: audio_and_supers_reinforce_the_message_without_competing_elements
  label_origin: extractor_assigned
  claim: >-
    Audio and on-screen text are to be used to reinforce the story's key points, and the source
    attaches a negative condition to that instruction: competing elements are to be avoided. The
    two halves belong together — the reinforcement only works if the text, the audio and the
    picture are saying the same thing at the same moment.
  claim_type: explicit_source_claim
  interpretation_basis:
  mechanism:
    stated_by_source: false
    text:
  scope:
    domain_discussed_by_source: [youtube_video_advertising, short_form_video_advertising, typography, hierarchy]
    conditions: "A core Attention guideline; the source assumes the audio track is heard"
  caveats:
  - text: >-
      The three pages name this technique differently: Google Ads Help calls it "Support the story
      with audio and supers", the resources article calls it "Emphasize key points". The
      instruction is the same; the label is not, so retrieval on either label alone will miss the
      other page.
    origin: extractor_observed
  - text: >-
      "Competing elements" is never defined. The source gives no test for when two elements
      compete rather than reinforce.
    origin: extractor_observed
  - text: >-
      Platform- and time-contingent. This is guidance about one company's ad products on one
      platform. Playback behaviour, ad formats and surfaces change; the source does not claim a
      durable mechanism and none should be read in.
    origin: extractor_observed
  - text: >-
      Declared publisher interest. The publisher sells advertising on the platform whose creative
      guidance this is, and the cited research validates that product. Third-party involvement
      (Ipsos as research partner; Nielsen and Kantar as independent reviewers, per the source's
      own account) moderates this; it does not remove it.
    origin: extractor_observed
  source_stated_problems:
  - "competing elements"
  source_stated_remedies:
  - "Use audio and text to support the story and reinforce key messages"
