- scs_id: scs_dmpl_001
  source_id: desai_mother_pious_lady
  label: how_value_is_settled_in_the_household_the_source_describes
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: 'Four claims from the book''s opening essay that together describe how a purchase is judged in the middle-class household Desai writes from: value realised through use over time rather than at price; a free extra whose function is closure rather than saving; indulgence licensed by an occasion rather than by appetite; and a second, social return currency in which the same household spends ruinously without inconsistency.

    '
  whole_system_claim:
    text: 'In this account a purchase is not settled at the transaction. It is settled afterwards, by use; the transaction itself is closed by a token extra whose money value is irrelevant; appetite alone does not license spending, an occasion does; and a separate social-return budget operates alongside all of this without being felt to contradict it.

      '
    origin: extractor_synthesis
    interpretation_basis: 'Desai states each of these in one essay, "The Dhania Factor", plus the wedding case in the same essay. He does not assemble them into an account of how value is settled, and he draws no general conclusion from the set. The synthesis is the extractor''s. What justifies attempting it is that the four are stated in one continuous argument and each is offered as part of the same disposition; what makes it a synthesis rather than a report is that Desai never states that they jointly constitute a model of anything, and would probably resist the word "model".

      '
    source_ref:
  members:
  - sk_ref: sk_dmpl_0010
    role_in_system: value_realised_by_use
    order: 1
    membership_origin: source_stated
  - sk_ref: sk_dmpl_0011
    role_in_system: transaction_closure
    order: 2
    membership_origin: source_stated
  - sk_ref: sk_dmpl_0012
