    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: 'Very high, and the highest of any system CANON-014 created. Both the grouping AND the membership are the extractor''s — the members come from four essays with no connection in the book, written years apart as separate newspaper columns. Desai proposes nothing of the kind. The whole-system claim is a hypothesis about what this material has in common, offered because it is the reading most useful to this project, which is exactly the condition under which an extractor is most likely to see a pattern that is not there. Every member is independently sound; the system is not evidence for anything.

      '
