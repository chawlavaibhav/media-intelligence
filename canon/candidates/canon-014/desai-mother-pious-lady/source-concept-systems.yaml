      scheme: none
      origin: extractor_inferred
    dependencies: []
    tradeoffs:
    - between:
      - sk_dmpl_0010
      - sk_dmpl_0013
      nature: extracting every paisa of use-value, against spending ruinously on a wedding — the author holds both without contradiction because the return currencies differ
      origin: source_stated
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref:
  evidence:
    characteristics:
    - explicitly_stated
    - argued
    - mechanism_given
    - culturally_bounded
    - historical_claim
    source_uncertainty: 'none'
    extraction_uncertainty: none
    system_level_uncertainty: 'High. Every member is directly stated by Desai in one essay, so membership is well grounded. What is entirely the extractor''s is the claim that the four constitute a system for settling value — Desai writes an essay, not a model, and the Introduction explicitly describes the book as scraps sewn together rather than as a single argument. The system is also bounded twice over: to the urban middle class the author names, and to a period he himself describes as loosening. It must not be consumed as a model of Indian consumer behaviour.

      '
  provenance:
