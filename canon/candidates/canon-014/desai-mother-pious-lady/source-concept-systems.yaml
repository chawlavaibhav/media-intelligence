- scs_id: scs_dmpl_002
  source_id: desai_mother_pious_lady
  label: meaning_carried_by_form_rather_than_by_assertion
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: 'Five claims from four unrelated essays in which a meaning is carried by the form of a thing rather than by anything it asserts: a perceived attribute produced by surrounding imagery against the physical fact; concealment or display of a mechanism as the signal; an extreme compression format working on shared code; a descriptor inflating once everyone claims it; and a status signal that exists only when received.

    '
  whole_system_claim:
    text: 'Across these cases the carrier of meaning is the form — what is hidden, what is omitted, what is shared as code, what must be received — rather than the content of any claim. Read together they say that in this cultural material the assertion is rarely where the meaning is.

      '
    origin: extractor_synthesis
    interpretation_basis: 'This grouping is wholly the extractor''s and is the more speculative of the two systems here. The members come from four essays Desai wrote separately about a scooter, a matrimonial column and an airport frisking board; he draws no connection between them and there is no reason to think he would accept one. What justifies recording it is that each member independently concerns how form signifies, which is the property this project''s consumers would be looking for. It is offered as a hypothesis about the book, and a reader who rejects the grouping loses nothing, because every member stands alone.

      '
    source_ref:
