# ── A. Representation integrity ─────────────────────────────────────────────
representation_integrity:
  delivery_format: publisher_epub
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    Reflowable EPUB, no page map declared, no folio in the text. Every locator is an ESSAY TITLE,
    which is unusually safe here: the essays are individually titled, no title repeats, and the
    table of contents matches the essays present. No page number was interpolated.
  inspection_state: inspected_figure_level
  visual_argument_role: no_visual_argument
  observed_loss_patterns:
  - pattern: no_authored_page
    affects: "the whole source"
    detectability: detected_by_independent_check
    recoverability: unrecoverable_in_this_copy
    evidence: "Established from the OPF and a scan of the text layer. Not a fault; unfixable in this format."
  - pattern: text_layer_order_damage
    affects: "one paragraph of the Introduction, and ten front-matter and section-break positions"
    detectability: announced_by_placeholder
    recoverability: recovered_in_this_copy
    evidence: >
      THIS COPY HAS BEEN MODIFIED BY A REDISTRIBUTOR. The string "GAPPAA.ORG" is injected at 11
      positions. Ten stand alone in front matter, the dedication, the contents, section openers and
      chapter heads, where they are obviously not authorial. ONE is a complete non-authorial
      sentence sitting INSIDE an authorial paragraph of the Introduction, carrying no
      distinguishing markup and reading as prose: "My effort in this book has been to examine
      Middle India from within. This book has been downloaded from gappaa dot org. I have grown up
      in a middle class family; ...". All 11 were located by string search, enumerated in the
      ledger, and excluded from extraction. Recorded as announced_by_placeholder because the
      injected text names itself; the pattern is text_layer_order_damage because what it does is
      insert non-authorial content into the reading order.
  - pattern: no_loss_detected
    affects: "the visual dimension - the pass ran and found nothing missing, because there is nothing visual to lose"
    detectability: detected_by_independent_check
    recoverability: not_applicable
    evidence: >
      Recorded as no_loss_detected rather than as a visual-loss pattern, deliberately: the source
      makes no visual argument (see visual_argument_role above, which is where that fact belongs),
      so there is no visual evidence for this copy to have lost.
      30 of the 33 images are 700-1,840-byte decorative ornaments recurring at essay openings; the
      other three are the cover and two front-matter marks. Both non-ornament images were opened.
      The book argues about objects - a scooter, a thali, a matrimonial column, a nightie - entirely
      in prose and never reproduces or points at an image of any of them. No sentence in the book
      directs the reader to look at anything. A text-only representation loses NOTHING of this
      argument, which is the opposite of the situation in the other two CANON-014 candidates.
  - pattern: no_loss_detected
    affects: "the body text of the essays"
    detectability: detected_by_independent_check
    recoverability: not_applicable
    evidence: >
      Apart from the 11 enumerated injections the prose extracts cleanly and in order across all
      137 spine items. A duplicate-sentence scan found no sentence above 90 characters occurring
      twice, so no pull-quote flattening.
  claim_resolution_after_inspection: not_applicable
  consequence: >
    The visual pass changed nothing and could not have, because there is no visual argument; that is
    recorded as a completed inspection with a null result rather than as a gap, which is the
    distinction the two-axis vocabulary exists to make.
    The material limit is elsewhere and it is NOT the 11 injections that were found. It is that a
    redistributor demonstrably willing to insert a sentence into an author's prose may have made
    other changes carrying no marker, which would be undetectable in this copy. That risk is silent
    and unbounded. The extraction is built to survive it: no object rests on a single verbatim
    sentence, and every object is supported by an argument the author develops across a whole essay,
    which no plausible injection would fabricate. The metadata is separately overwritten - dc:publisher
    reads GAPPAA.ORG - so the EDITION is not establishable from this copy, though the work's identity
    is not in doubt and no locator depends on the edition.

# ── B. Evidence and claim origin ────────────────────────────────────────────
evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 17 objects classified. This source is overwhelmingly the author's own voice: 10 of 17 objects
    are typed source_interpretation, which is the correct shape for a collection of interpretive
    essays and not a defect.
  categories:
  - category: source_own_measurement_reported
    sk_refs: [sk_dmpl_0020, sk_dmpl_0045]
    evidence: >
      The ONE measurement in the book: a content analysis of matrimonial advertisements across
      thirty years which the author says he was involved in, and the structural finding drawn from
      it that the format's surface changed while its underlying model did not. Both carry
      empirical_within_source, as this category requires.
      What the source supplies is thin and is recorded as such on the objects: no sample size, no
      sampling frame, no publication list, no coding scheme, no date range, no inter-coder check
      and not a single number - every finding is directional. It is nonetheless the author's own
      measurement with results reported, which is what distinguishes this category from
      measurement_claimed_result_not_supplied, and its most valuable result is a NULL one (caste
      mention did not change), which runs against the book's own modernisation narrative.
  - category: source_author_assertion
    sk_refs: [sk_dmpl_0001, sk_dmpl_0002, sk_dmpl_0010, sk_dmpl_0011, sk_dmpl_0012, sk_dmpl_0013, sk_dmpl_0021, sk_dmpl_0022, sk_dmpl_0030, sk_dmpl_0031, sk_dmpl_0040, sk_dmpl_0041, sk_dmpl_0042, sk_dmpl_0043, sk_dmpl_0044]
    evidence: >
      Fifteen objects in the author's own voice, argued from observation and recollection. This is
      the whole of the rest of the book. Several are essayistic generalisations of considerable
      rhetorical force and no evidential force - the Imperfect Solution thesis, the reading of
      hierarchy, the SRK essay - and each carries a caveat saying so on the object rather than
      relying on this record to bound it.
  - category: source_quotes_named_third_party
    sk_refs: [sk_dmpl_0021]
    evidence: >
      The source invokes Malcolm Gladwell's *Blink* and the notion of thin-slicing to characterise
      the matrimonial advertisement as a very thin slice. It is a borrowed frame used
      illustratively rather than a reported finding, and nothing in the extraction depends on it.
  relation_to_evidence_characteristics: >
    Exactly two objects carry empirical_within_source and both are listed under
    source_own_measurement_reported, as the consistency rule requires. No sk_id appears under
    third_party_measurement_reported or measurement_claimed_result_not_supplied - correctly, because
    this source reports no third-party measurement anywhere and never invokes a study whose result it
    withholds. The single named third party is invoked for a concept, not for a measurement.

# ── C. Application fit ──────────────────────────────────────────────────────
application_fit:
  audited: true
  findings:
  - consumer: creative_ir
    outcome: binding_exists
    existing_binding_refs: [bnd_dmpl_0004]
    note: >
      One only. A Creative IR that states a benefit for a specified audience has a real question to
      record: whether that audience holds the premise that makes the benefit meaningful. Derived
      from the source's account of why safety was not a saleable proposition in one market; its
      status_reason records that the observation is dated and the explanation interpretive.
  - consumer: production_ir
    outcome: no_current_binding
    note: >
      Nothing in this source concerns making anything. It is a book about how things already made
      are read. There is no production knowledge here to be blocked by the absent schema, which is
      why this is no_current_binding rather than blocked_target_schema_absent.
  - consumer: evaluation
    outcome: binding_exists
    existing_binding_refs: [bnd_dmpl_0003]
    note: >
      One: descriptor saturation is directly checkable over a corpus - whether a claimed attribute
      is claimed by substantially everything in the set and therefore discriminates nothing. The
      observation unit is asset_set_over_time because the question cannot be asked of one asset.
      No threshold; the source supplies none.
  - consumer: governance
    outcome: binding_exists
    existing_binding_refs: [bnd_dmpl_0001, bnd_dmpl_0002]
    note: >
      The strongest fit, and both are prohibitions. One carries the source's own scope statement
      with anything retrieved from it, because this source's most quotable material is its least
      supported and would otherwise be lifted as a claim about Indian consumers. One records that
      surface change in a convention licenses no inference about the model underneath.
  - consumer: benchmark
    outcome: no_current_binding
    note: >
      No dimension, criterion or threshold anywhere in this source. The one measurement it reports
      is directional only, so not even its findings could seed a benchmark dimension.
  - consumer: deterministic_composition
    outcome: no_current_binding
    note: >
      Considered and declined without difficulty. Nothing in this source is executable geometry or
      specifiable layout; it contains no figure, no measurement of any artefact, and no procedure.
  - consumer: human_workflow
    outcome: candidate_no_binding_made
    note: >
      Real fit, no binding written. Both remedies in the ontology act on a process or a person -
      carry the source's scope statement with the retrieved object, and check a descriptor against
      its whole category before treating it as differentiating - and both name their executor.
      Naming a fit in an audit is not creating a binding, and no SPEC-04 target type covers this
      consumer.
  unbound_knowledge_of_note:
  - sk_refs: [sk_dmpl_0010, sk_dmpl_0011, sk_dmpl_0012, sk_dmpl_0013]
    observation: >
      The account of how value is settled in the household the source describes - use realised over
      time, a free extra that closes the transaction, indulgence licensed by occasion, and a second
      social-return currency in the same budget - is the most substantive consumer-culture material
      in the corpus and NONE of it is bound. Correctly: this project has no consumer for it. It is
      durable, it is the kind of context a system operating in this market would otherwise lack
      entirely, and it is worth holding unbound.
  - sk_refs: [sk_dmpl_0043, sk_dmpl_0044, sk_dmpl_0040, sk_dmpl_0041]
    observation: >
      Deliberately unbound: the Imperfect Solution thesis, the SRK essay, and the two hierarchy
      objects. These are the most quotable material in the book and they are cultural criticism.
      Binding them would convert criticism into production advice, which the CANON-014
      authorisation names as a failure mode, and their generalisations are exactly what the source's
      own Introduction disclaims. They stay in the record as source truth with no consumer.
  conclusion: >
    Four bindings from seventeen objects, and 13 objects with none. The fit is concentrated in
    governance, where this source contributes two prohibitions that bear directly on how any Indian
    cultural material is consumed. Its real value is that it is the corpus's only account of Indian
    everyday material culture from inside it, and that value is not application-shaped. No binding was
    manufactured to raise coverage, and the most quotable material was deliberately left unbound.

