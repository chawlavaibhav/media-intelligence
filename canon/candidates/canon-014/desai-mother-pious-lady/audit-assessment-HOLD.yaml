# ── E. Technology contingency ───────────────────────────────────────────────
technology_contingency:
  applicable: true
  applicability_basis: >
    The book is explicitly organised around a transition - its three sections move from
    pre-liberalisation India, through the changes the author observes, to the dilemmas of change -
    so nearly everything in it is dated by construction, and several objects describe practices the
    author himself says are passing.
  assessed: true
  classes:
  - class: historical_convention
    sk_refs: [sk_dmpl_0012, sk_dmpl_0010, sk_dmpl_0042]
    evidence: >
      Indulgence licensed by festival occasion and the three-stage recycling ladder are described
      by the author as belonging to the household of his childhood, and the book's second section
      is about their loosening. The claim that no vehicle brand was sold on safety is a market
      observation from the late 2000s and is exactly the kind that expires; the object says so.
  - class: technology_contingent
    sk_refs: [sk_dmpl_0021, sk_dmpl_0022, sk_dmpl_0045, sk_dmpl_0020, sk_dmpl_0030, sk_dmpl_0031]
    evidence: >
      All the matrimonial material is contingent on the PRINT COLUMN as the medium - the
      twenty-five-word limit is what forces the compression, and the shared decoding convention is
      what a print column can sustain. The book predates the migration of Indian matrimonial
      matching to websites and apps and does not discuss it, so whether any of this survived the
      change is open. The scooter objects are contingent on a market in which the scooter preceded
      the motorcycle in middle-class ownership, which the author writes about retrospectively
      because it had already ended.
  - class: durable_mechanism
    sk_refs: [sk_dmpl_0011, sk_dmpl_0013, sk_dmpl_0022, sk_dmpl_0041, sk_dmpl_0045, sk_dmpl_0002]
    evidence: >
      Six statements whose form does not depend on the technology that carried them: a disposition
      can outlive the condition that produced it and change function; two return currencies can
      operate in one budget without being felt to conflict; a descriptor everyone claims stops
      discriminating; a status signal that is not received does no work; surface change in a
      convention licenses no inference about the model underneath; and reflexive action is less
      filtered evidence than deliberate statement. Note sk_dmpl_0022 and sk_dmpl_0045 appear in both
      this class and technology_contingent, deliberately: the print column is the dead medium, the
      mechanisms it demonstrates are not.
  - class: uncertain
    sk_refs: [sk_dmpl_0043, sk_dmpl_0044, sk_dmpl_0040]
    evidence: >
      The Imperfect Solution thesis, the SRK essay and the hierarchy essay cannot be classified,
      because they are not claims of a kind that expires or endures - they are interpretive theses
      about a culture, argued by assertion, for which no evidence is offered in either direction.
      Placing them in durable_mechanism would credit them with a durability nothing establishes;
      placing them in historical_convention would credit them with a specificity they do not have.
  existing_characteristics_relied_on: [historical_claim, culturally_bounded]
audit_status_reason: "HOLD. This copy has been modified by a redistributor: the publisher metadata is overwritten (dc:publisher reads GAPPAA.ORG rather than HarperCollins), the string is injected at 11 positions, and one complete non-authorial sentence sits INSIDE an authorial paragraph of the Introduction carrying no distinguishing markup. All 11 sites were located mechanically and excluded from extraction.\nThat is not the blocker. The blocker is what cannot be established: a redistributor demonstrably willing to insert a sentence into an author's prose may have made further changes carrying no marker, which would be undetectable in this copy. That risk is SILENT and UNBOUNDED, and excluding the marked injections does not bound it.\nSettling it requires comparing this copy against an independent clean representation. No such copy is available in this environment and there is no external network egress, so the question cannot be closed here. `evidence_insufficient` is the Audit Gate's designed outcome for exactly this: the committed record does not settle the audit's questions and the original would have to be re-opened.\nThe extraction is retained as source evidence and is NOT accepted knowledge. It sits outside canon/knowledge/current/ and has no record in canon/audit/records/, because a record there would imply it passed the gate."
