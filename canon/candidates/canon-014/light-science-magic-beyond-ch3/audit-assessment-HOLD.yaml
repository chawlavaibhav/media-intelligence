    that source is ZERO.'
- blocker: figures_are_load_bearing_and_uninspected
  detail: 'This is the source where an uninspected figure costs most. The material is applied lighting
    for

    specific surface classes - metal, glass, liquids - and the book teaches it through paired

    photographs and lighting diagrams. Its live counterpart carries 14 uninspected figures on the record

    already. A visual pass here is not a formality; it is most of the evidence.'
- blocker: qualifies_a_live_accepted_source
  detail: 'The later chapters QUALIFY and in places REVERSE the guidance in the live chapter 3. That
    makes this

    candidate more valuable as evidence ABOUT an accepted source than as an admission, and it is the

    single strongest reason to run its visual pass: a live Canon source may currently be giving

    consumers guidance its own later chapters withdraw.'
what_would_move_this_to_ready: A first-hand figure-level inspection of the source, authored as a visual-evidence-ledger.yaml,
