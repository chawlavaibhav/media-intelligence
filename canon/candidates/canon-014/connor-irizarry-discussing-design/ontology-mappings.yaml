source_id: connor-irizarry-discussing-design
extraction_date: 2026-08-30
terms:
- term_id: t_disc_0001
  term: reaction_based_feedback
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Feedback that is emotional or visceral, produced quickly and instinctively
    from the responder''s own expectations, desires and values — a gut reaction. Includes a second variety
    driven by what the responder believes they are expected to say, which responds to being asked rather
    than to the work. It reports the responder''s state and names no element and no objective.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0002
  term: direction_based_feedback
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Feedback that begins, and often ends, with an instruction or suggestion:
    the giver communicating their own vision for the design. Even when a reason accompanies it, it does
    not say how or why the existing design is or is not effective at addressing the problem the giver
    perceives.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0003
  term: incomplete_critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Feedback that states an outcome or a verdict without the "why" behind it,
    so the maker cannot tell what would need to change or explore alternatives.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0004
  term: preferential_critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Feedback justified from purely preferential thinking — work rejected because
    it does not match what the giver likes rather than because an aspect fails an objective. Becomes structural
    where the preference-holder also holds approval, because the team then prioritises that taste alongside
    or above project and user goals.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0005
  term: selfish_critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Critique driven by the critic''s own goals at the expense of the team or
    the maker — including wanting to be recognised as smarter, and using the session to advance one''s
    own unshared alternative idea.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0006
  term: untimely_critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Critique offered without invitation, when the recipient is not in a mindset
    to listen, process and use it. Leads to defensiveness and communication breakdown rather than uptake.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0007
  term: lack_of_foundation
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'A project in which the objectives have not been explicitly and jointly
    stated, so each participant frames the discussion against their own. The source''s summary form of
    the failure is that "the objectives each participant is critiquing against are different".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0008
  term: disparate_foundations
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'The Appendix A name for the same failure, framed as a bad habit: starting
    a critique from unaligned ideas of what the product should accomplish, likened to a rowing team each
    pulling in a different direction.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0009
  term: design_by_committee
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'The amalgamation of elements from several ideas into a final design without
    attention to disharmony or to whether the result achieves the desired outcomes. The source is precise
    that combining elements is not itself the defect — the weakness is the reason the combined elements
    were selected, which is typically to get stakeholders saying yes rather than effectiveness against
    an objective.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0010
  term: problem_solving_during_analysis
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'A participant proposing a new solution or change during a critique, which
    the source treats as a switch from analytical to creative thinking that fragments the group across
    at least four simultaneous mental processes and consumes the session''s remaining items.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0011
  term: ta_da_moment
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Unveiling work for the first time in the session and expecting immediate
    useful feedback. Because critical thought takes time, the room can only supply reactions.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0012
  term: hippo
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Highest Paid Person''s Opinion — the weight given to a perspective on account
    of the speaker''s position rather than its accuracy. The source calls it "a killer when it comes to
    effective critique" because participants sensing inequality stay quiet or defer.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0013
  term: too_much_critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Critique held so often that it no longer contributes to momentum and may
    inhibit it. Four cues: advancement between sessions too small to feel like progress; sessions circling
    without the resulting changes advancing the design; formal critiques required faster than the design
    can be pushed forward between them; and critique being used as a validation mechanism for want of
    confidence.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0014
  term: premature_critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Critique attempted before the maker has enough clarity about the idea to
    communicate it, where the only available answer to a clarifying question is "I don''t know".

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_disc_0015
  term: confusing_critique_with_review
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Treating an approval gate as a diagnostic session. The source''s stated
    markers of a review are that it sits at the end of a phase, aims at sign-off, and where sign-off is
    withheld produces a list of changes required to obtain it — none of which is analysis against objectives.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0016
  term: overly_broad_principle
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'A design principle stated as a broad quality ("fun", "amusing") that every
    team member interprets differently and that eliminates no ideas. The source''s negative test: when
    asking whether design options adhere to a principle, more often the answer should be "no".

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_disc_0017
  term: binary_or_output_based_goal
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'A goal that names a thing to be produced rather than an outcome to be reached,
    so it is satisfied by shipping regardless of effect — "add a remember me feature" as against "increase
    authenticated visits to our site by 15 percent".

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_disc_0018
  term: unexamined_positive_feedback
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Approval that names no aspect and no objective — "I love it!" — which the
    source holds is as unusable for iteration as an unexplained rejection, and is additionally suspect
    because people often offer praise to avoid hurting feelings.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_disc_0019
  term: alternative_design_returned_as_feedback
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Receiving, in place of critique, a sketch or mockup of the design the responder
    thinks should have been made, or a list of changes. The source reads it in most cases as an articulation
    failure — the person could not express the concern and thought showing would be easier.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_disc_0020
  term: getting_defensive
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'The maker focusing on defending the work, or on what others will think
    of her if it has imperfections, which takes the focus off the product and puts it on the person. Named
    in Appendix A alongside the instruction "Explain your work, do not defend it."

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0021
  term: scope_creep_in_critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'A session drifting into matters outside the product''s scope or outside
    the aspects the presenter wanted analysed, typically via the supplementary questions about new problems
    or missing objectives, and consuming time on parts of the design not yet thought through.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0022
  term: facade_of_authority
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Brad Nunnally''s term for the assumption that the facilitator role confers
    authority over participants. It is only as strong as the facilitator''s personality and social presence,
    and the participants own the room.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0023
  term: delayed_concern_from_a_quiet_participant
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'A judgement withheld during the session and shared afterwards with someone
    else, travelling person to person until it returns days or weeks later when it can no longer be acted
    on.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_disc_0024
  term: feedback_sandwich
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Positive, then negative, then positive. The source describes it, notes
    that in practice the positives are superficial or vague, that the opening praise signals bad news,
    that positives are forgotten once the negative arrives, and that it can feel manipulative — and declines
    it while keeping the underlying balance of strengths and weaknesses.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0025
  term: asking_for_validation
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Requesting feedback while wanting only praise, so that genuine analysis
    arrives to a mind that cannot receive it and is met with defensiveness, argument or silence.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_disc_0026
  term: criteria_documented_but_not_believed
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Kim Goodwin''s observation that teams treat evaluation criteria as shared
    once they are written down or mentioned in a meeting. Criteria are not truly shared unless everyone
    both understands them and believes in them; unbelieved criteria get cited to win arguments rather
    than used to think.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0027
  term: silence_misread_as_agreement
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: problem
  definition_in_origin_frame: 'Reading the absence of a voiced objection as its absence in the participant''s
    mind, where societal or organisational norms make speaking up costly. The source pairs it with the
    converse error, straightforwardness misread as combativeness.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_disc_0028
  term: lead_with_questions
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Before offering analysis, ask what the objectives were for a specific element,
    what other options were considered, why this approach was chosen, and what constraints applied — phrased
    invitingly ("Tell me more about…") rather than as a series of "Why" questions.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0029
  term: filter_your_reaction
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Hold an initial reaction, investigate why it occurred, and then triage:
    relate it to an objective or best practice, drop it as preference, or treat it as evidence that an
    objective or constraint is missing and needs its own discussion.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0030
  term: state_your_assumption
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Put an assumption into the conversation and ask whether it is accurate,
    rather than reasoning silently from it. In asynchronous channels, write it alongside the feedback
    so the maker can confirm or correct it.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0031
  term: talk_about_strengths
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Name what is working and why, on two grounds independent of softening criticism:
    so the reason can be abstracted and reused elsewhere in the design, and so an effective element is
    not lost in the next iteration for want of anyone having said it was load-bearing.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0032
  term: return_to_the_foundation
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Relate a comment that seems out of place back to the agreed personas, scenarios,
    goals and principles, if necessary by asking the giver follow-up questions that do the relating —
    and, if no relation can be found, name explicitly that the team may hold different views of the objectives.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0033
  term: active_listening
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Reply to a piece of feedback by repeating it back as understood so the
    giver can confirm or correct the reading before anything is built on it.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0034
  term: laddering
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Repeated, progressively specific questioning — each answer met with a form
    of "Why?" until a logical stopping point — to reach either the objective the concern actually bears
    on, or the recognition that it is personal preference and can be left alone.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0035
  term: consequence_question
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Asking what would happen if the thing were left as it is, which prompts
    the speaker to describe the effect on the user or the undesirable behaviour — something that can then
    be related to an objective.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - human_edit
- term_id: t_disc_0036
  term: define_critique_scope_and_goals
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Fix, in advance, both which components of the design will be analysed and
    which objectives they will be analysed against; and set the session''s goals, by default what is working
    within that scope, what is not, the designer''s specific questions, and any concerns, open questions
    and assumptions.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0037
  term: reverse_planning
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Derive scope from intended action: start from what you want to be able
    to do after the conversation, ask what questions must be answered to do it, and let those questions
    decide what to present and discuss.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0038
  term: send_material_in_advance
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Distribute the designs to be critiqued a couple of days ahead, limited
    to the aspects in scope and prefaced with the focus and expectations — to jump-start critical thinking,
    not to collect finished feedback beforehand.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - human_edit
- term_id: t_disc_0039
  term: present_quickly
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Walk the group through the aspect in scope with only enough explanation
    to convey how the design is intended to work, focus on what cannot be seen (typically by presenting
    from a user''s perspective), and let rationale emerge in answer to questions rather than pre-empting
    them.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0040
  term: withhold_constraints_until_asked
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Let constraints surface through a question about why a choice was made,
    worded matter-of-factly, rather than volunteering them up front where they are heard as excuses or
    blame. One exception: where the constraint was discussed with the group before and the presentation
    is of the solution to it.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - human_edit
- term_id: t_disc_0041
  term: public_note_taking
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'One designated note-taker recording where everyone can see, so participants
    can question or clarify an entry that does not match their understanding — instead of several private
    interpretations merged afterwards.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0042
  term: round_robin
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Calling on participants in a fixed repeatable order to remove the question
    of who speaks first and give predictability about turns. To be used to start a stalled group and then
    eased off, not for a whole session; and it can be run without announcing it.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0043
  term: quotas
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Asking each participant for a set number of things working and not working
    — often two that are not and one that is, or two and two — with the formula varied to see what works.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0044
  term: direct_inquiry
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Putting a question to a specific participant whose expertise bears on the
    aspect under discussion, so a sole knowledge-keeper''s perspective is not lost by default. Requires
    the facilitator to know who holds what expertise.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0045
  term: lens_based_analysis
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Framing analysis through one declared lens at a time — de Bono''s Six Thinking
    Hats, or a team''s own lenses such as one persona at a time — with everyone wearing the same lens
    simultaneously so the conversation stays focused.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0046
  term: postpone_exploration
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'When someone begins elaborating a solution, get them to hold the idea for
    a later session focused on exploration; or, if the whole group is stuck, deliberately pause the critique
    and switch everyone to exploring together. What matters is that everyone is in the same mental process.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - human_edit
- term_id: t_disc_0047
  term: frame_insights_as_actions
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'In follow-up, reorganise the notes so each finding becomes an exploration
    rather than a change: "The news feed is too prominent, because…" becomes "Explore options for decreasing
    the prominence of the newsfeed…".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0048
  term: record_why_an_item_was_not_addressed
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Decide explicitly which collected items will not be acted on and write
    down the reason, because the question will be asked again in a later discussion.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - human_edit
- term_id: t_disc_0049
  term: critique_the_directive_feedback
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Privately, before meeting: ask how the proposal differs, what problems
    it is trying to solve, whether you tried to solve those and how differently, whether any omission
    was deliberate or an oversight, and what the proposed changes indicate matters most to the proposer.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0050
  term: critique_together_against_the_foundation
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Rather than comparing two designs to each other, compare both against what
    the team previously agreed mattered — which removes the my-idea-versus-your-idea framing and turns
    the exchange into a critique of the original design that uses the proposal as a discussion tool. Includes
    asking what the proposer did not change, and why.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - human_edit
- term_id: t_disc_0051
  term: explain_do_not_defend
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Supply the group with the reasoning behind decisions without seeking to
    end the analysis. The source gives no cue for telling the two apart in the moment; the difference
    is one of aim.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0052
  term: vest_authority_in_artifacts
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'Brad Nunnally''s remedy for the facade of authority: use an outline and
    agenda shared in advance as a social contract, and a timetable reviewed at the start so that time,
    not the facilitator, is the authority being enforced.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0053
  term: mini_creative_brief
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'A single page holding the problem statement, key personas, main scenarios,
    business goals and design principles, read aloud at the start of discussions to keep the foundation
    in front of the team. The source credits the technique to Jared Spool and UIE, and reports that UIE
    has a different person read it each time.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_disc_0054
  term: establish_product_focused_intent
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'The source''s prescription that both parties enter with the right intent
    — the giver wanting to help the maker understand the effect of elements on the objectives, the recipient
    wanting to understand whether the elements will work toward them. Named as necessary but given no
    procedure; the source says only to "ensure that you''re going in with the right intent".

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - unknown
- term_id: t_disc_0055
  term: make_the_process_allow_iteration
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: remedy
  definition_in_origin_frame: 'The source''s precondition that the process provide time to analyse, rethink
    and change, and that the culture value continuous improvement over right-the-first-time. It is stated
    as a required state of the organisation with no executable route to it beyond practising critique
    and accepting incremental change.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by:
  - unknown
- term_id: t_disc_0056
  term: critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: '"A form of analysis that uses critical thinking to determine whether a
    design is expected to achieve its desired objectives (and adhere to any pertinent best practices or
    heuristics)." The third of three forms of feedback.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0057
  term: critical_thinking
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: '"The process of taking a statement and determining if it is true or false";
    in this book, the examination of what you are designing against the objectives for its creation. Paired
    by the source with `delivery`, how that thinking is presented to others.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0058
  term: the_three_elements_of_critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: 'A specific aspect or decision; its relation to an objective or best practice;
    and how and why that aspect does or does not support that objective. All three required.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0059
  term: actionable_feedback
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: 'The source''s definition is deliberately narrow: the designer has enough
    understanding of what is and is not working, and why, that she can explore alternatives or make other
    adjustments. Explicitly not the same as prescriptive — actionable feedback does not say what to change.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0060
  term: objective
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: 'What a design is judged against. May be about utility, about metrics, or
    experiential; and the source admits best practices and heuristics as a second legitimate yardstick
    alongside a project''s own objectives.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0061
  term: goal
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: '"The desired, measurable outcomes that result from the product being used."
    Should be achievable, meaningful, and correlate to a change in user behaviour.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0062
  term: design_principle
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: '"The qualities and characteristics that the product will exhibit in its
    content, behavior, and so on as people use it." Should be specific, and by virtue of specificity should
    eliminate more ideas than it retains.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0063
  term: persona
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: '"User archetypes that describe an individual''s behaviors, goals, expectations,
    knowledge, and so on." The source prefers half-page, succinct personas over narrative ones, and warns
    against flowery detail and demographic proxies.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0064
  term: scenario
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: '"Short narratives that describe the contexts in which your product will
    be used and the experience people have when using it", including thought process and emotion, grounded
    in real observation.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0065
  term: foundation
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: 'The agreed set of personas, scenarios, goals and principles that constitutes
    what the source means by a product''s objectives; the referent every critique is made against.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0066
  term: creative_analytical_toggle
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: 'The source''s model of a mind switching between generating ideas and assessing
    what exists against what is intended, held to be non-simultaneous and controllable with practice.
    Asserted without citation; it is the premise underneath the rule against problem solving and the divergent/convergent
    structure.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0067
  term: critique_sweet_spot
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: 'The span in the life of a design after the idea is clear enough to communicate
    and before the work must be let go to be produced, within which critique is immediately useful — the
    maker can walk away and begin iterating at once.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0068
  term: facilitation
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: '"The conscious, balanced management of conversations toward a conclusion."
    Begins from the objectives and purpose of the discussion; not always a formal role.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0069
  term: divergent_thinking_activity
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: 'An activity that pushes participants to consider many possibilities without
    regard to their validity, typically enforced by a time limit and a challenge, in order to minimise
    or remove the opportunity for critical thinking.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0070
  term: convergent_thinking_activity
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: property
  definition_in_origin_frame: 'An activity that pushes participants to compare, contrast, consolidate
    and eliminate ideas. The source places critique inside this phase, before any vote.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0071
  term: giver
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: entity
  definition_in_origin_frame: '"The individual(s) giving the critique — the critics — who are being asked
    to think critically about the design and provide their thoughts and perspectives."

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0072
  term: recipient
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: entity
  definition_in_origin_frame: '"The individual(s) receiving the critique… who will take the perspectives
    and information raised during the critique, process it, and act upon it in some way."

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0073
  term: third_party_facilitator
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: entity
  definition_in_origin_frame: 'Someone from outside the team or project who guides the conversation and
    keeps it in scope without contributing feedback. Helpful while a team is starting out; costly because
    an outsider may not recognise when something useful has been said.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0074
  term: standalone_critique
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: entity
  definition_in_origin_frame: '"Meetings or discussions held for the sole purpose of critiquing something"
    so it can be iterated upon. May be formal or informal; both are recommended.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0075
  term: design_review
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: entity
  definition_in_origin_frame: 'A meeting held toward the end of a design phase, including a goal of collecting
    approval so effort can shift elsewhere, and where approval is withheld focusing on the changes needed
    to obtain it. A gate, not a critique.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_disc_0076
  term: collaborative_activity
  origin: source
  origin_ref: connor-irizarry-discussing-design
  kind: entity
  definition_in_origin_frame: '"Events in which multiple people work together simultaneously to solve
    a specific challenge" — workshops and working sessions, into which critique is placed as the transition
    between divergent and convergent phases.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
relationships:
- from: t_disc_0001
  to: t_disc_0056
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: 'the source''s central distinction: a reaction reports the responder''s state, a critique relates
    an element to an objective. Recorded as distinct_from rather than as a family resemblance because
    the source spends its first chapter separating them.'
- from: t_disc_0002
  to: t_disc_0056
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: direction supplies a remedy; critique supplies a diagnosis. The source states that even a direction
    accompanied by a reason is still not critique.
- from: t_disc_0003
  to: t_disc_0058
  relation: related_to
  confidence_basis: extractor_judgement
  note: incompleteness is precisely the absence of the third element
- from: t_disc_0004
  to: t_disc_0060
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: a preference is a referent held by one person; an objective is a referent held by the group. The
    whole method turns on keeping these apart.
