technology_contingency:
  applicable: true
  applicability_basis: >
    The book teaches on a circa-2014 consumer digital camera - mode dials, P/S(Tv)/A(Av)/M,
    per-frame ISO, exposure-compensation buttons, IS/VR, inbuilt flash defaults, RAW/JPEG -
    and six objects carry historical_claim for exactly that stratum. Underneath it sit optical
    and light-geometry claims that do not date, and above it viewer-response claims bound to
    culture rather than to any technology. The three strata need separating, which is this
    section's job.
  assessed: true
  classes:
    - class: durable_mechanism
      sk_refs: [sk_crl_0001, sk_crl_0002, sk_crl_0003, sk_crl_0004, sk_crl_0006,
                sk_crl_0007, sk_crl_0008, sk_crl_0009, sk_crl_0013, sk_crl_0014,
                sk_crl_0017, sk_crl_0019, sk_crl_0021, sk_crl_0022, sk_crl_0024,
                sk_crl_0025, sk_crl_0026, sk_crl_0027, sk_crl_0029, sk_crl_0030]
      evidence: >
        Composition and attention devices (leading line, internal frame, foreground layering,
        frame-scan, thirds), optical geometry (depth of field needing depth to act on, focal
        length fixing distance and field, wide-angle proportioning), light geometry (hard
        light's lit/unlit division, flat light shifting the guiding burden to composition) and
        judgement procedures (pre-setting before the moment, the excuse test, series as unit)
        rest on optics, scene geometry and human looking, none of which expires with a camera
        generation. Where the mechanism inside one of these is asserted rather than argued,
        the frozen caveats already say so; durability, not demonstration, is what is classed
        here.
    - class: technology_contingent
      sk_refs: [sk_crl_0010, sk_crl_0011, sk_crl_0012, sk_crl_0015, sk_crl_0016, sk_crl_0020]
      evidence: >
        The six historical_claim objects: the exposure trio's interface and mode vocabulary,
        the shutter/shake and freeze rules of thumb stated for 2014 hand-held bodies (IS/VR by
        their period names), the manual-mode argument (meter behaviour, P suppressing flash,
        compensation on a dial), the metering/compensation account, and inbuilt-flash
        behaviour. The physics underneath (light admitted over time, on-axis shadow geometry)
        is durable; the interfaces, defaults and numeric thumb-rules are of their period, and
        the book's own reference chart (opened this pass) prints them as period interface
        facts.
    - class: historical_convention
      sk_refs: [sk_crl_0028]
      evidence: >
        The "nice subject" list - sunsets, pretty flowers, hot air balloons - is a snapshot of
        one photographic culture around 2014, stated as such in the frozen caveat
        (culturally_bounded). The underlying claim about pre-supplied interest may travel; the
        inventory of what counts as photogenic is a convention of its time and place.
    - class: uncertain
      sk_refs: [sk_crl_0005, sk_crl_0018, sk_crl_0023]
      evidence: >
        Viewer-response claims resting on cultural reading habits rather than on any
        technology: symmetry answering a "primal need for order", soft light flattering and
        reading contemplative, distance reading predatory. All three carry culturally_bounded
        in the frozen record; whether they are durable features of human looking or
        conventions of Carroll's audience cannot be classed from this source, and the source
        offers no evidence either way.
  existing_characteristics_relied_on: [historical_claim, culturally_bounded]
