  detail: 'This is an image-led book: each lesson is taught against a specific reproduced photograph.
    Roughly

    half the extracted knowledge depends on photographs that were never inspected, so those claims are

    claims about what the author SAYS a photograph shows. They are not presented as visually verified,

    and they must not be.'
