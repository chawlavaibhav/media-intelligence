- binding_id: bnd_ogx_006
  source_knowledge_refs: [sk_ogx_0044]
  source_system_refs: []
  target_type: evaluation
  target_path:
  target_schema:
  target_schema_version:
  role: [diagnoses]
  observation_unit: asset_set_over_time
  governance_consumer:
  rationale: >
    The interchangeability test — could a competitor sign this line — cannot be answered from one
    asset. It requires the line together with the competitor lines it sits among, which makes it a
    property of a set rather than of a piece.
  applicability:
    when: "a standing line, slogan or endline, assessed against the category's other standing lines"
    limits: >
      The source applies it to nineteen corporate slogans of 1983 and offers it as an observation
      rather than as a rule. His claimed second consequence — that such lines depress readership of
      the copy by cluttering the layout — is asserted without measurement and is not carried into
      this binding.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_ogx_0020]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_007
  source_knowledge_refs: [sk_ogx_0060, sk_ogx_0009]
  source_system_refs: []
  target_type: evaluation
  target_path:
  target_schema:
  target_schema_version:
  role: [diagnoses]
  observation_unit: whole_asset
  governance_consumer:
  rationale: >
    The source designates one question the most important in his book, and it is answerable of a
    finished asset: is a benefit to the consumer promised anywhere in it, and is the promise stated
    in specifics rather than in generalities or superlatives. Uniqueness, his second criterion,
    is deliberately excluded from this binding because he supplies no way to assess it.
  applicability:
    when: "any advertising asset making a claim about a product"
    limits: >
      Presence of a promise is checkable; whether the promise is the right one is not, and the
      source says selecting it requires research. His uniqueness criterion has no stated method and
      is not bound here.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_ogx_0004]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_008
  source_knowledge_refs: [sk_ogx_0021, sk_ogx_0020, sk_ogx_0035]
  source_system_refs: [scs_ogx_003]
  target_type: evaluation
  target_path:
  target_schema:
  target_schema_version:
  role: [diagnoses, flags]
  observation_unit: whole_asset
  governance_consumer:
  rationale: >
    The displacement question — after this element is in, what is the most memorable thing in the
    asset, and is it the product — is one check that covers four failures the source reports
    separately across three chapters. It is proposed as a single flag because the repairs differ
    while the observation is the same.
  applicability:
    when: "an asset containing a celebrity, an analogy, a named competitor or a borrowed symbol"
    limits: >
      The grouping of these four failures into one shape is OURS, not the source's, and it is
      recorded as such in scs_ogx_003. The flag identifies a candidate for review; it does not
      select a repair, because the four repairs are not interchangeable.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_ogx_0005, t_ogx_0006, t_ogx_0007]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; the grouping is an extractor hypothesis and has not been reviewed"

- binding_id: bnd_ogx_009
  source_knowledge_refs: [sk_ogx_0016, sk_ogx_0070]
  source_system_refs: []
  target_type: evaluation
  target_path:
  target_schema:
  target_schema_version:
  role: [diagnoses]
  observation_unit: asset_set_over_time
  governance_consumer:
  rationale: >
    Two of the source's diagnoses turn on who the work appears designed to please rather than on
    anything inside a single asset: the subject chosen because it interests the maker, and the
    category whose advertising is aimed at the audience that approves it. Detecting either needs a
    body of work over time, not one piece.
  applicability:
    when: "reviewing a body of work from one maker or one category"
    limits: >
      Both are inferences from content to intended audience. The source offers no evidence about how
      the work he diagnoses was actually approved, and this binding inherits that weakness.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_ogx_0022, t_ogx_0027]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_010
  source_knowledge_refs: [sk_ogx_0028, sk_ogx_0038, sk_ogx_0042, sk_ogx_0029]
  source_system_refs: []
  target_type: benchmark
  target_path:
  target_schema:
  target_schema_version:
  role: [derives]
  observation_unit:
  governance_consumer:
  rationale: >
    Four of the comparisons this source reports are minimal pairs in his own telling — reverse type
    against black on white, voice-over against on-camera, cartoon against live action, headline
    above the illustration against below — and each names one varied element with a direction of
    result. They are usable as a small set of contrast cases whose expected direction is on record,
    which is exactly what a benchmark needs and what most of this book does not supply.
  applicability:
    when: "constructing contrast cases where a stated expected direction is wanted"
    limits: >
      Directions only. The source gives no magnitude for three of the four, no sample for any, and
      in each case the two arms differed in more than the named element. These are contrast cases
      with a recorded expectation, not validated effects, and they belong to print and broadcast of
      1983.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_011
  source_knowledge_refs: [sk_ogx_0030, sk_ogx_0047, sk_ogx_0055, sk_ogx_0045]
  source_system_refs: []
  target_type: benchmark
  target_path:
  target_schema:
  target_schema_version:
  role: [derives]
  observation_unit:
  governance_consumer:
  rationale: >
    The medium- and situation-specific chapters yield a set of brief categories whose constraints
    the source states explicitly and differently: a transit card with a long dwell time, a poster
    with a glance, a specialist trade audience with high prior interest, a destination sold to
    someone who already wants to go, and a response asset that must complete a sale in one exposure.
    They are useful as a spread of briefs precisely because the source refuses to give them one set
    of rules.
  applicability:
    when: "assembling a spread of briefs that vary audience prior interest, dwell time and the act being asked for"
    limits: >
      Each brief carries its era's media conditions inside it — dwell times, publication economics,
      ordering infrastructure — and those must be stated when the brief is used, not silently
      updated.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_012
  source_knowledge_refs: [sk_ogx_0023, sk_ogx_0032, sk_ogx_0039, sk_ogx_0020]
  source_system_refs: []
  target_type: governance
  target_path:
  target_schema:
  target_schema_version:
  role: [constrains]
  observation_unit:
  governance_consumer: evidence_interpretation
  rationale: >
    This source repeatedly says research established something and never supplies the finding. Four
    clear instances are recorded in this lane, and in every one the withheld result is doing the
    load-bearing work in the argument. That is a distinguishable evidence state from a result
    claimed without controls, and it argues for weighting a citation by whether the finding was
    supplied rather than by whether research was invoked.
  applicability:
    when: "weighting a source's claim that is supported by a named but unreported measurement"
    limits: >
      The distinction is drawn from this one source's habits. SPEC-03's `outcome_claimed` covers a
      result asserted without controls; the pattern here is narrower, and the lane records it as an
      ontology term rather than proposing any change to the fixed vocabulary.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_ogx_0068]
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_013
  source_knowledge_refs: [sk_ogx_0011, sk_ogx_0030, sk_ogx_0040, sk_ogx_0056, sk_ogx_0002]
  source_system_refs: []
  target_type: governance
  target_path:
  target_schema:
  target_schema_version:
  role: [constrains, flags]
  observation_unit:
  governance_consumer: rule_application
  rationale: >
    Twenty-seven objects in this lane carry `historical_claim`, and several state their own media
    conditions as the reason the rule holds — the density of headlines on a newspaper page, the
    dwell time of a transit rider, the length of a broadcast slot, the economics of colour printing.
    A rule whose stated mechanism is a media condition may not be applied where that condition does
    not hold, and this lane's position is that such a rule is retrieved with its condition or not at
    all.
  applicability:
    when: "retrieving a rule from this source for application outside 1983 print, broadcast or direct mail"
    limits: >
      This constrains retrieval and application; it makes no judgement about which of the source's
      claims survive. The audit record for the live chapter-2 material classified two comparable
      objects as `uncertain` rather than deciding, and this lane takes the same position.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_014
  source_knowledge_refs: [sk_ogx_0025, sk_ogx_0028]
  source_system_refs: []
  target_type: production
  target_path:
  target_schema:
  target_schema_version:
  role: [derives]
  observation_unit:
  governance_consumer:
  rationale: >
    The typographic settings — drop-initial, leading between paragraphs, point size, column measure,
    type colour — are physical print production decisions in the source's frame. They are recorded
    here as production actions and PARKED. No generative equivalent is asserted, and no instruction
    is derived from them for any other kind of system.
  applicability:
    when: "setting type for physical print, in the source's own frame"
    limits: >
      Physical typesetting for the presses and paper of 1983. Not translated. Production IR does not
      exist, and producing a generative equivalent would be a hypothesis this lane is not authorised
      to make.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_ogx_0033, t_ogx_0034, t_ogx_0035, t_ogx_0036, t_ogx_0038]
  status: production_candidate
  status_reason: "Production IR does not exist; physical print production, parked and not translated"

