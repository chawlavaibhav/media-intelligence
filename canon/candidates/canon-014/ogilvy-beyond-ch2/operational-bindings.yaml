  governance_consumer:
  rationale: >
    The super rule is exactly checkable and exactly mechanical: the words set over the picture are
    either identical to the words spoken beneath them or they are not. It requires the picture and
    the audio of the same shot together, and it is one of very few cues in this source with no
    interpretive slack at all.
  applicability:
    when: "a time-based asset carrying superimposed text over spoken audio"
    limits: >
      The source's claim that divergence confuses the viewer is asserted without measurement; only
      the check itself is mechanical.
