# David Ogilvy, Ogilvy on Advertising (1983) — chapters BEYOND chapter 2 — SPEC-04 bindings
# EXPERIMENTAL — NOT LIVE CANON. Lane: ogilvy-beyond-ch2, book-expansion-qa-v1. Non-merge.
#
# NO creative_ir BINDINGS ARE MADE HERE. A creative_ir binding requires a real SPEC-01 path with a
# justification, and this lane's knowledge is either a diagnostic question about a finished asset,
# a physical print or mailing production setting, or a measurement procedure. None of those is a
# field in a creative specification, and inventing a path to make the lane look useful is the exact
# distortion SPEC-03 was written to stop.
#
# The honest bindings here are `evaluation` — his diagnostic cues really are checkable questions
# about an asset — plus two `benchmark` bindings, two `governance` bindings with named consumers,
# and three `production` bindings that are PARKED, NOT TRANSLATED. Physical print production is
# never rewritten as a generative instruction.
#
# NOTHING here infers any model capability. This is a 1983 book and it is not evidence about what
# any generative system can do.
#
# Every `evidence_basis` is derived_from_source or extractor_inference. Neither
# cross_source_supported nor empirically_supported is used anywhere: no cross-source promotion is
# authorised in this task and no empirical record is attached.

source_id: ogilvy-beyond-ch2
operational_bindings:

- binding_id: bnd_ogx_001
  source_knowledge_refs: [sk_ogx_0004, sk_ogx_0029]
  source_system_refs: [scs_ogx_001]
  target_type: evaluation
  target_path:
  target_schema:
  target_schema_version:
  role: [diagnoses]
  observation_unit: whole_asset
  governance_consumer:
  rationale: >
    The source's readership ordering yields a small set of yes-or-no questions that can be asked of
    a finished print asset without any judgement of quality: is there a headline at all, does it
    name the product, does it stand below rather than above the illustration, and does the element
    order run illustration, headline, copy. Each question is checkable by looking, and each has a
    stated consequence in the source rather than being a matter of taste.
  applicability:
    when: "a static print or print-derived asset with an illustration, a headline and body copy"
    limits: >
      The source's evidence is magazine and newspaper readership of 1983 and his stated scanning
      order is asserted rather than demonstrated. Whether the ordering holds for any other surface,
      crop or viewing duration is untested here and is not claimed.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_ogx_0001, t_ogx_0002, t_ogx_0012]
  repair_ontology_refs: [t_ogx_0030, t_ogx_0029]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_002
  source_knowledge_refs: [sk_ogx_0026]
  source_system_refs: []
  target_type: evaluation
  target_path:
  target_schema:
  target_schema_version:
  role: [diagnoses, flags]
  observation_unit: whole_asset
  governance_consumer:
  rationale: >
    The caption rule is the single cheapest check the source offers: every illustration either has a
    caption beneath it or does not, and where it does, the caption either carries the brand name and
    the promise or does not. Two observable facts, one stated consequence.
  applicability:
    when: "a print asset containing one or more illustrations"
    limits: >
      The source states the caption readership multiplier inconsistently — four times the body copy
      in one chapter, twice in another — so the check can be applied while the size of the effect
      cannot be quoted from him. Nothing here carries the rule beyond print of his period.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: [t_ogx_0032]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_003
  source_knowledge_refs: [sk_ogx_0028]
  source_system_refs: []
  target_type: evaluation
  target_path:
  target_schema:
  target_schema_version:
  role: [diagnoses]
  observation_unit: whole_asset
  governance_consumer:
  rationale: >
    His legibility failures are a checklist of physically observable settings rather than opinions:
    type reversed out, headline in capitals, headline over the illustration, a full stop closing a
    headline, a measure far from the familiar width, copy set into a shape. Each is present or
    absent in the asset.
  applicability:
    when: "any asset carrying typeset text intended to be read"
    limits: >
      Every item rests on the reading habits of a 1983 print audience, which the source states
      explicitly as his principle. The checklist may be applied as a description of what the source
      would flag; the underlying claims are not verified here for any other audience or surface, and
      the source's own two exceptions to the reverse-type rule turn on the page not being the light
      source.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_ogx_0010, t_ogx_0011, t_ogx_0012, t_ogx_0013, t_ogx_0009]
  repair_ontology_refs: [t_ogx_0034, t_ogx_0035]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_ogx_004
  source_knowledge_refs: [sk_ogx_0040, sk_ogx_0039]
  source_system_refs: []
  target_type: evaluation
  target_path:
  target_schema:
  target_schema_version:
  role: [diagnoses]
  observation_unit: sequence
  governance_consumer:
  rationale: >
    Two of the source's television cues are properties of a time span rather than of any single
    frame: whether the brand name occurs within the opening seconds, and whether the opening frames
    contain a surprise rather than an establishing lull. Neither can be seen in one frame, so the
    evaluator must receive the opening sequence.
  applicability:
    when: "a time-based asset with an opening the viewer may leave during"
    limits: >
      The source states both for the thirty-second broadcast commercial of 1983, inside a viewing
      environment he describes as thirty thousand commercials a year. A separate lane covers modern
      platform guidance; any resemblance is an observation and no claim is transferred here.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: [t_ogx_0016, t_ogx_0019]
  repair_ontology_refs: [t_ogx_0039, t_ogx_0040]
