  delivery_format: publisher_epub
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    Reflowable Vintage 1985 ebook; no authored page exists and the extraction invented none.
    Locators are chapter + section heading; 13 of 13 sampled cited headings resolve on the
    unpacked spine (ledger, locator_verification_sample). No original-file hash was recorded;
    the on-arrival hash in the ledger is the first byte identity for this candidate.
  inspection_state: inspected_figure_level
  visual_argument_role: figure_carries_content
  observed_loss_patterns:
    - pattern: no_authored_page
      affects: "the whole source"
      detectability: detected_by_independent_check
      recoverability: unrecoverable_in_this_copy
      evidence: Reflowable format; section-heading locators are the stable citation unit.
    - pattern: announced_loss_placeholder
      affects: "the extraction's plain-text representation only"
      detectability: announced_by_placeholder
      recoverability: recovered_in_this_copy
      evidence: >
        The REP-07 pass's central finding (ledger): the recorded absence of the reproduced
        advertisements — 39 'Click here for hi-res image' placeholders — is a property of the
        text dump the extraction read, not of the copy. The EPUB's chapters carry 241 inline
        image references (243 files): the reproductions themselves, plus an Appendix of 39
        hi-res duplicates the placeholders hyperlink to. The loss is fully recovered by
        opening the EPUB, which is what this pass did.
    - pattern: no_loss_detected
      affects: "the reproduced advertisements and charts across all extracted chapters"
      detectability: detected_by_independent_check
      recoverability: not_applicable
      evidence: >
        115 distinct content images opened across chapters 7-13 and 15: complete, correctly
        placed, legible down to body copy and chart values. All 14 figure_not_inspected
        objects have the reproductions behind their passages opened, and none is contradicted
        or underdetermined (ledger, figure_not_inspected_resolution).
  claim_resolution_after_inspection: all_resolved
  consequence: >
    The candidate's visual standing inverts: the copy contains its full evidence base of
    reproduced advertisements, and the craft doctrine is now figure-verified. The
    audit-assessment's placeholder framing, and the parallel note in the live ch-2 audit
    record, should be re-read against this ledger at admission time (an admission-time task;
    this record edits neither).

