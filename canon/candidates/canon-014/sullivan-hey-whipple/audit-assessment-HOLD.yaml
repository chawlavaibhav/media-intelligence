access_position: 'THE ACCESS BLOCKER RECORDED BY THE EARLIER PASSES NO LONGER HOLDS, AND THIS IS A CHANGE
  OF FACT THE

  CONTROLLER SHOULD SEE. Those passes recorded `evidence_insufficient` partly because the source could

  not be opened: the extraction had read a local library that did not exist in the container the

  repair ran in, and that container had no external network egress. Both were true there. NEITHER IS

  TRUE IN THE ENVIRONMENT THIS RECONCILIATION RAN IN - the book is present locally, and network egress

  was tested and works. What remains unresolved is therefore NOT access. It is that the inspection has

  not been done. That is a matter of cost and authorisation, and it is a materially better position

  than being blocked, but it is not a pass and this task does not treat it as one.

  '
source_specific_blockers:
- blocker: independence_not_established
  detail: 'The extraction recorded that Sullivan draws on an Ogilvy-published book across three chapters
    - a

    dependency heavier than a citation - and deliberately did NOT assert independence against

    `ogilvy-ch2-advertising-that-sells`, which is accepted live Canon. Under SPEC-05 and the Audit Gate,

    `independence_not_established` BLOCKS promotion against everything until it is resolved; it does
    not

    quietly pass as independent. Resolving it means re-opening Sullivan and testing whether Ogilvy''s

    claims are load-bearing in it, which is the `shared_primary_informant` test. The book is now present

    locally, so this is a doable piece of work rather than a permanent block.'
- blocker: partial_extraction_recorded_as_whole
  detail: 'Chapters 1-9, 11, 15 and 16 were read in full and one section of chapter 12; CHAPTERS 10,
    13, 14 AND

    17 WERE NOT READ. The extraction is recorded as one source, so nothing in the artifacts tells a

    reader which parts of the book are represented and which are absent.'
- blocker: reproduced_advertisement_evidence_never_inspected
  detail: 'The book argues from reproduced advertisements and none was inspected. Every claim about
    a named

    campaign is a claim about what Sullivan SAYS about it.'
