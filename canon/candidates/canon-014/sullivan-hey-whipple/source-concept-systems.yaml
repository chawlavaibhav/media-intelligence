    source_support: text_and_visual

- scs_id: scs_whip_005
  source_id: sullivan-hey-whipple
  label: the_sources_apparatus_for_judging_finished_work
  label_origin: extractor_assigned
  system_type: decision_framework
  system_type_origin: extractor_inferred
  description: >
    The book's founding premise is that measured sales effect does not by itself justify an
    advertisement (sk_whip_0042), which creates the problem the rest of this system answers: if not
    sales, then what. Sullivan's answer has three layers. A negative layer of named, checkable faults
    — the pun and the rhyme (sk_whip_0029), the category's worn imagery (sk_whip_0030), reflexive
    exaggeration (sk_whip_0031), the reassurance signals that read as their own refutation
    (sk_whip_0033, sk_whip_0034, sk_whip_0035), the business register (sk_whip_0036) and copy that
    explains its own headline (sk_whip_0037). A positive layer that rejects work passing all of those
    and still doing nothing (sk_whip_0038), tested by whether people would talk about it and whether
    the press would carry it (sk_whip_0066) and pursued by deliberate inversion of category
    convention (sk_whip_0065). And one overriding constraint that survives when the source discards
    every other rule in his own book: the work must be relevant (sk_whip_0067). Two members are
    negative findings about the apparatus itself — Sullivan's refusal of focus-group creative testing
    (sk_whip_0039) and his stated mechanisms for why it distorts (sk_whip_0068).
  whole_system_claim:
    text: >
      Sullivan replaces one measurable criterion with a stack of unmeasurable ones and does not
      conceal the exchange: he rejects sales as sufficient, rejects testing as valid, and offers in
      their place a fault list applied by a trained eye, two talkability questions answered by
      prediction, and a relevance requirement he supplies no test for. The apparatus is coherent, it
      is checkable in its negative layer, and its positive layer rests on professional judgement.
      That is the honest description of it, and it is what makes `source_position` the right register
      for most of this material.
    origin: extractor_synthesis
    interpretation_basis: >
      The three layers are ours. Sullivan distributes these claims across Chapters 1, 3, 4, 5, 9 and
      16 without ever presenting them as an evaluation framework, and does not himself observe that
      rejecting both sales and testing leaves judgement carrying the whole weight. He does state the
      ordering of the last element himself — relevance is the one rule that survives when the rest
      are thrown out — and he does state the founding premise as the reason he wrote the book. The
      characterisation of the apparatus as trading measurability for judgement is entirely ours and
      is offered as a description, not as a criticism of the individual claims.
    source_ref:
  members:
  - {sk_ref: sk_whip_0042, role_in_system: founding_premise, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_whip_0039, role_in_system: rejected_method, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_whip_0068, role_in_system: rejected_method, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_whip_0029, role_in_system: fault, order: 4, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0030, role_in_system: fault, order: 5, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0031, role_in_system: fault, order: 6, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0033, role_in_system: fault, order: 7, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0034, role_in_system: fault, order: 8, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0035, role_in_system: fault, order: 9, membership_origin: source_stated}
  - {sk_ref: sk_whip_0036, role_in_system: fault, order: 10, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0037, role_in_system: fault, order: 11, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0038, role_in_system: residual_fault, order: 12, membership_origin: source_stated}
  - {sk_ref: sk_whip_0065, role_in_system: remedy, order: 13, membership_origin: source_stated}
