    system_level_uncertainty: >
      The claims are the source's; the set is largely OURS. He himself puts the clever/straight rule,
      the see-say failure and the polarity claim together in one run, and repeats the dominance
      requirement inside the letter/postcard decision, so a core of four members is source-grouped.
      The devices and the two look constraints were pulled in by us from a different chapter. A
      material limitation: almost every member is demonstrated by a reproduced advertisement that
      this extraction could not see, so what the images actually do is taken on the source's word.
