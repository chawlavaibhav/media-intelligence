- scs_id: scs_whip_006
  source_id: sullivan-hey-whipple
  label: the_division_of_labour_between_word_and_image
  label_origin: extractor_assigned
  system_type: interacting_set
  system_type_origin: extractor_inferred
  description: >
    Sullivan's treatment of headline and visual is a set of interlocking constraints on a single
    quantity: how the burden of meaning is split between the two elements. The precondition is that
    one element is designated as the entry point (sk_whip_0053). The format decision is taken early
    and is set by message complexity — letter or postcard (sk_whip_0045) — and choosing the postcard
    transfers the whole selling idea into the image (sk_whip_0044). Within a piece carrying both, one
    element may be the clever one and the other must be straight (sk_whip_0043); the distance between
    what is said and what is shown is the variable that sets the size of the reader's shift
    (sk_whip_0048); and zero distance is the named failure, the see-say (sk_whip_0032). Three
    generative devices supply the image side: transformation of the product itself (sk_whip_0051),
    borrowed image equity re-angled into a metaphor (sk_whip_0046), and demonstration rather than
    assertion (sk_whip_0047), which can remove the need for a headline entirely. Two members govern
    the look rather than the split: the brand should own a visual territory (sk_whip_0049) pulled
    from its own material rather than from current fashion (sk_whip_0050). The environment the piece
    appears in can itself become the image (sk_whip_0052).
  whole_system_claim:
    text: >
      In this source the relation between word and image is a designed quantity, not a matter of
      composition. Its lower bound is duplication, which wastes an element; its upper bound is the
      fuse running past the medium's dwell time; and everything between is a deliberate choice about
      how much of the resolving the reader is asked to do. That is why "which element carries the
      idea" is a question the maker must answer before executing rather than discover afterwards.
    origin: extractor_synthesis
    interpretation_basis: >
      Sullivan states each constraint separately, across two chapters, as headed advice. He does
      state the scaling claim about polarity, the see-say failure and the clever/straight rule in the
      same short run, which is the strongest evidence for reading them as one set. What is ours is
      the framing of all of it as governing a single quantity, the identification of duplication and
      fuse length as the two bounds, and the inclusion of the look and environment members, which
      concern recognisability rather than the split.
    source_ref:
  members:
  - {sk_ref: sk_whip_0053, role_in_system: precondition, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_whip_0045, role_in_system: format_decision, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_whip_0044, role_in_system: consequence, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_whip_0043, role_in_system: rule, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_whip_0048, role_in_system: governing_variable, order: 5, membership_origin: source_stated}
  - {sk_ref: sk_whip_0032, role_in_system: lower_bound_failure, order: 6, membership_origin: source_stated}
  - {sk_ref: sk_whip_0051, role_in_system: device, order: 7, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0046, role_in_system: device, order: 8, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0047, role_in_system: device, order: 9, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0052, role_in_system: device, order: 10, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0049, role_in_system: constraint_on_look, order: 11, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0050, role_in_system: constraint_on_look, order: 12, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies:
    - {from: sk_whip_0043, to: sk_whip_0053, note: "the clever/straight split presupposes a designated boss", origin: extractor_inferred}
    - {from: sk_whip_0044, to: sk_whip_0053, note: "a visually led piece presupposes the visual is dominant", origin: extractor_inferred}
    - {from: sk_whip_0032, to: sk_whip_0048, note: "the see-say is polarity at zero", origin: extractor_inferred}
    - {from: sk_whip_0050, to: sk_whip_0049, note: "the owned look must come from the brand, not from fashion", origin: extractor_inferred}
    - {from: sk_whip_0046, to: sk_whip_0030, note: "the metaphor's boundary against the visual cliché is re-angling", origin: extractor_inferred}
    tradeoffs:
    - {between: [sk_whip_0048, sk_whip_0001], note: "greater polarity means a longer fuse; this set is bounded by scs_whip_001", origin: extractor_inferred}
    - {between: [sk_whip_0049, sk_whip_0050], note: "a distinctive owned look and indifference to current visual convention pull against each other in practice, and against sk_whip_0030's requirement to study the category's conventions closely", origin: extractor_inferred}
    conflicts: []
  source_warns_against_isolated_use: false
  source_warning_ref:
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, practitioner_assertion, mechanism_given]
    source_uncertainty: source_hedges
