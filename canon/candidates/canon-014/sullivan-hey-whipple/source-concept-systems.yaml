# Luke Sullivan, Hey Whipple, Squeeze This (6th ed., Wiley, 2022) — SPEC-03 SourceConceptSystems
# EXPERIMENTAL — NOT LIVE CANON. Lane: sullivan-hey-whipple, book-expansion-qa-v1. Non-merge.
#
# LOCATORS: EPUB, reflowable. NO AUTHORED PAGE NUMBERS. page_start / page_end are null in every
# system. Chapter and section names carry the locator. Audit pattern: no_authored_page.
#
# ORIGIN MARKING: seven systems are recorded. Sullivan writes in chapter-length runs of numbered
# advice, so the individual claims are his and the *structure* connecting them is very often ours.
# Every system therefore carries a blunt `system_level_uncertainty` saying how much of it he stated
# and how much we imposed. Where he states the structure himself (the fuse/reduction arithmetic, the
# truth-plus-conflict generator, the clear/clever diagram) that is said plainly too.
#
# No system is recorded for the source's career advice, agency-life material or award-show example
# runs, none of which was extracted at all.

source_id: sullivan-hey-whipple

source_concept_systems:

- scs_id: scs_whip_001
  source_id: sullivan-hey-whipple
  label: the_reduction_and_speed_of_get_model
  label_origin: extractor_assigned
  system_type: causal_model
  system_type_origin: extractor_inferred
  description: >
    Sullivan's simplicity chapter is not a list of preferences but a small closed causal loop, and
    the members are unintelligible apart. Attention inside one composition is treated as a fixed
    quantity divided among the elements present, so every element added lowers the salience of every
    other and every element removed raises it (sk_whip_0003). That arithmetic is what makes the
    removal test meaningful rather than arbitrary: an element that can be taken out without loss was
    already diluting the rest (sk_whip_0002). Reduction has a target — one point, because a concept
    making more than one makes none (sk_whip_0004) — and a purpose, which is comprehension speed:
    the fuse must be short enough that the idea resolves inside the viewer's attention and long
    enough that resolving it is worth something (sk_whip_0001). How long the fuse may be is not a
    property of the idea but of the medium the viewer meets it in (sk_whip_0060). Remove any member
    and the others stop having reasons.
  whole_system_claim:
    text: >
      Simplicity in this source is instrumental, not aesthetic. Element count is the lever,
      per-element salience is the intermediate variable, and comprehension speed inside the medium's
      dwell time is the outcome the whole chain exists to control. This is why Sullivan can say a
      quick get matters more than the creativity of the piece and treat it as heresy rather than as
      taste: within the model, creativity that lengthens the fuse past the medium's budget produces
      nothing at all.
    origin: extractor_synthesis
    interpretation_basis: >
      Sullivan states each link — French's arithmetic, the removal test, the one-point limit, the
      fuse, the medium's speed — but never assembles them into a single mechanism or says that the
      earlier links exist to serve the last. The causal ordering is ours. He does connect the fuse to
      reduction explicitly ("you can improve the speed of the get on your concepts by taking
      everything out of the idea except the idea"), which is the one link he supplies himself.
    source_ref:
  members:
  - {sk_ref: sk_whip_0003, role_in_system: mechanism, order: 1, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0002, role_in_system: procedure, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_whip_0004, role_in_system: target_state, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_whip_0001, role_in_system: outcome_variable, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_whip_0060, role_in_system: boundary_condition, order: 5, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: causal, origin: extractor_inferred}
    dependencies:
    - {from: sk_whip_0002, to: sk_whip_0003, note: "the removal test is only justified by the dilution arithmetic", origin: extractor_inferred}
    - {from: sk_whip_0001, to: sk_whip_0002, note: "the removal test is the stated way to shorten a long fuse", origin: extractor_inferred}
    - {from: sk_whip_0001, to: sk_whip_0060, note: "permissible fuse length is set by the medium", origin: extractor_inferred}
    tradeoffs:
    - {between: [sk_whip_0001, sk_whip_0007], note: "wit requires the viewer to travel part of the distance, which lengthens the fuse on purpose; the model has an optimum, not a minimum", origin: extractor_inferred}
    conflicts:
    - {note: "sk_whip_0045 grants that the sheer weight of body copy adds gravitas whether or not it is read, which the dilution arithmetic cannot accommodate; the source does not reconcile them", origin: extractor_inferred}
  source_warns_against_isolated_use: true
  source_warning_ref: sk_whip_0001
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, mechanism_given, repeated_within_source]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: figure_not_inspected
    system_level_uncertainty: >
      The five claims are the source's, stated in his own words in one chapter and one adjacent
      section. The causal assembly is OURS: he presents them as consecutive advice, not as a chain
      with a single outcome variable. Two links he does state (fuse improved by removal; outdoor
      forcing simplicity). The rest of the ordering is our reading. He also concedes he reached the
      system's ideal end state — one element — exactly once in a career, which should temper any use
      of this as a procedure.
  provenance:
    chapter: "Ch. 6 — The Virtues of Simplicity: Or, Why It's Hard to Pound in a Nail Sideways"
    section: "the whole chapter, including 'A few words about outdoor.' (spine 19)"
    page_start:
    page_end:
    source_support: text_and_visual

- scs_id: scs_whip_002
  source_id: sullivan-hey-whipple
  label: the_truth_plus_conflict_platform_generator
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: source_stated
  description: >
    The storytelling chapter contains an explicit generative procedure with a stated entry point, a
    stated operation, a stated output and two stated acceptance tests. Entry: the truest thing that
    can be said about the brand, which is generally not in the brief because clients are taught to
    minimise it (sk_whip_0041, sk_whip_0012). Operation: cross that truth with the conflicts it
    produces (sk_whip_0012), a conflict being required because without one there is no story
    (sk_whip_0011); the conflict may be found in the category, invented outright, or imposed by the
    versus frame (sk_whip_0014), and its most reliable shape is deprivation — life without the
    product rather than with it (sk_whip_0013). Output: not a campaign but a world with rules, which
    then keeps generating (sk_whip_0009); casting the brand as an archetype rather than as the hero
    is one route into such a world (sk_whip_0015). Acceptance tests: it fits on a sticky note, and
    spoken aloud it starts talking (sk_whip_0010). Sullivan applies the whole sequence to branded
    content, where the output must additionally satisfy an entertainment criterion (sk_whip_0070).
  whole_system_claim:
    text: >
      The system's real claim is that a platform is produced rather than found, and that the
      production runs on constraint. Each step narrows: a truth eliminates most of what could be
      said, a conflict eliminates most of what could be dramatised, and the resulting rule set
      eliminates most of what could be executed — after which, by the source's account, executions
      arrive without further invention. Sullivan states the payoff of the middle step in one word,
      focus, and states the payoff of the last as the rules starting to talk.
    origin: extractor_synthesis
    interpretation_basis: >
      Sullivan states the formula (TRUTH + CONFLICTS = possible platform), the definitions of
      campaign and platform, the two signs, and the deprivation and versus devices, all in the same
      chapter and in this order. What is ours is the reading of the whole as a narrowing sequence and
      the claim that constraint is what makes it work — he says only that it gave his student focus.
      He also refuses the word formula and calls it a tool, so presenting it as a procedure is
      already one step further than he goes.
    source_ref: "Ch. 7, 'Truth + conflicts = platform.' (spine 21)"
  members:
  - {sk_ref: sk_whip_0041, role_in_system: input, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_whip_0012, role_in_system: operation, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_whip_0011, role_in_system: precondition, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_whip_0014, role_in_system: device, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_whip_0013, role_in_system: device, order: 5, membership_origin: source_stated}
  - {sk_ref: sk_whip_0015, role_in_system: device, order: 6, membership_origin: source_stated}
  - {sk_ref: sk_whip_0009, role_in_system: output, order: 7, membership_origin: source_stated}
  - {sk_ref: sk_whip_0010, role_in_system: acceptance_test, order: 8, membership_origin: source_stated}
  - {sk_ref: sk_whip_0070, role_in_system: extension, order: 9, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: procedural, origin: source_stated}
    dependencies:
    - {from: sk_whip_0012, to: sk_whip_0041, note: "the operation needs a truth, and a fact will not serve", origin: extractor_inferred}
    - {from: sk_whip_0009, to: sk_whip_0012, note: "the rule set is what the crossing produces", origin: extractor_inferred}
    - {from: sk_whip_0010, to: sk_whip_0009, note: "the two signs test for the property that object defines", origin: extractor_inferred}
    tradeoffs: []
    conflicts:
    - {note: "sk_whip_0059 requires every execution to be wholly self-sufficient, while a platform's value is that later stories draw on rules the earlier ones established; the source states both and reconciles neither", origin: extractor_inferred}
  source_warns_against_isolated_use: true
  source_warning_ref: sk_whip_0012
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, mechanism_given, anecdotal]
    source_uncertainty: source_hedges
    extraction_uncertainty: figure_not_inspected
    system_level_uncertainty: >
      The sequence is largely the SOURCE'S — he writes it in this order in one chapter and states the
      formula in a display line. Ours are: the framing of it as a progressive narrowing, the
      placement of sk_whip_0041 (from Chapter 3) as the system's input, and the inclusion of
      sk_whip_0070 as an extension. He explicitly hedges the whole thing as a tool rather than a
      rule, and every supporting case is classroom work or a celebrated campaign described after the
      fact.
  provenance:
    chapter: "Ch. 7 — Why Is the Bad Guy Always More Interesting?; with the input from Ch. 3 and the extension in Ch. 11"
    section: "Ch. 7 in full; Ch. 3 'Start with a central human truth.'; Ch. 11 'The hard part.' (spines 21, 13, 29)"
    page_start:
    page_end:
    source_support: text_and_visual

- scs_id: scs_whip_003
  source_id: sullivan-hey-whipple
  label: the_clear_and_clever_intersection
  label_origin: source_verbatim
  system_type: mutual_qualification
  system_type_origin: source_stated
  description: >
    Sullivan draws a two-circle diagram and states that the writer's job is the overlap: all the ways
    the key message could be communicated clearly, intersected with all the ways it could be spun
    into something interesting (sk_whip_0005). The two demands are owed to different parties — the
    client is entitled to clarity, the reader is not looking for it — so neither can be traded away
    for the other, which is what makes this a mutual qualification rather than a scale. Each half has
    a named failure at its far end: "I've seen that before" at the clear end and "I don't get it" at
    the clever end. Around the diagram sit the operations. Say it straight, then say it great is the
    stated entry procedure (sk_whip_0006). Wit is the mechanism of the clever half, working by making
    the viewer travel part of the distance (sk_whip_0007), and two sentence architectures realise
    that shift inside a single line (sk_whip_0008). Two upstream checks guard the clear half: the
    message must survive "Yeah, riiiight" and "So what?" (sk_whip_0040), and it must be built on a
    truth rather than a fact (sk_whip_0041, which is also this system's shared boundary with
    scs_whip_002).
  whole_system_claim:
    text: >
      Interest and clarity are not two settings of one dial and cannot be optimised separately. Each
      one, pursued alone, produces a named and recognisable failure, and the source locates
      essentially all of the working time in the search for the borders of the region where both
      hold. The practical consequence is that "make it clearer" and "make it more interesting" are
      never sufficient instructions on their own.
    origin: extractor_synthesis
    interpretation_basis: >
      The diagram, the two rejections and the entry procedure are Sullivan's, printed as a figure and
      discussed directly. What is ours is treating the two upstream checks (sk_whip_0040) and the
      fact/truth distinction (sk_whip_0041) from Chapter 3 as guards on the clear half — he does not
      connect them to the diagram. The reading of the relation as mutual qualification rather than as
      a trade-off is also ours, though it follows from his statement that the two demands come from
      different parties.
    source_ref: "Ch. 5, 'First say it straight, then say it great.', Figure 5.3 (spine 17)"
  members:
  - {sk_ref: sk_whip_0005, role_in_system: whole, order: 1, membership_origin: source_stated}
  - {sk_ref: sk_whip_0006, role_in_system: entry_procedure, order: 2, membership_origin: source_stated}
  - {sk_ref: sk_whip_0007, role_in_system: mechanism, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_whip_0008, role_in_system: mechanism, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_whip_0040, role_in_system: guard, order: 5, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0041, role_in_system: guard, order: 6, membership_origin: extractor_inferred}
  internal_structure:
    ordering: {scheme: none, origin: extractor_inferred}
    dependencies:
    - {from: sk_whip_0006, to: sk_whip_0005, note: "the procedure exists to reach the overlap", origin: extractor_inferred}
    - {from: sk_whip_0007, to: sk_whip_0005, note: "wit is what the clever half is doing", origin: extractor_inferred}
    - {from: sk_whip_0008, to: sk_whip_0007, note: "the sentence architectures are wit realised in one line", origin: extractor_inferred}
    tradeoffs:
    - {between: [sk_whip_0005, sk_whip_0001], note: "cleverness is bought with comprehension time; the intersection is bounded by the fuse model of scs_whip_001", origin: extractor_inferred}
    - {between: [sk_whip_0007, sk_whip_0001], note: "the 5-to-40-percent travel the audience does is exactly what lengthens the fuse", origin: extractor_inferred}
    conflicts: []
  source_warns_against_isolated_use: true
  source_warning_ref: sk_whip_0005
  evidence:
    characteristics: [explicitly_stated, visually_demonstrated, practitioner_assertion, mechanism_given]
    source_uncertainty: none
    extraction_uncertainty: figure_not_inspected
    system_level_uncertainty: >
      The core is the SOURCE'S and is printed as a diagram he discusses at length; the two failure
      names are quoted from George Felton. Ours: the inclusion of the two Chapter 3 guards as members,
      the system type, and the observation that this system is bounded by the fuse model. Nothing
      here tells a maker where the borders of the overlap lie in any particular case, and Sullivan
      says so — finding them is the work.
  provenance:
    chapter: "Ch. 5 — Brevity Is the Soul of Wit: The Art of Copywriting; with guards from Ch. 3"
    section: "Ch. 5, 'Have a writing process' and 'The architecture of ideas'; Ch. 3, 'Three final notes on strategy.' (spines 17, 13)"
    page_start:
    page_end:
    source_support: text_and_visual

- scs_id: scs_whip_004
  source_id: sullivan-hey-whipple
  label: the_diverge_converge_working_cycle
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: extractor_inferred
  description: >
    Sullivan's account of how work is actually produced spans four chapters and resolves into one
    repeating cycle with named stages and named failure modes at each. Conditions are set first: a
    three-hour session, paper rather than a screen, everything else off (sk_whip_0026), and a partner
    protocol that suspends judgement (sk_whip_0027) while keeping the work off the hallway
    (sk_whip_0028). Generation runs wide and cheap — shallow holes everywhere rather than one deep
    one (sk_whip_0019) — fed by two collision devices (sk_whip_0024, sk_whip_0064) and one methodical
    coverage device (sk_whip_0025), toward an explicit volume target (sk_whip_0017) reachable only
    at speed, which is the discard skill experience actually buys (sk_whip_0018). Bad ideas are
    written down rather than suppressed (sk_whip_0020), and the arc is expected to pass through easy
    ideas that must be discarded and a dry stretch that must be endured (sk_whip_0021), with a set of
    named recovery moves for the dry stretch (sk_whip_0069). Judgement then runs separately and cold
    (sk_whip_0022), after which the surviving ideas are clustered to find the campaign latent in them
    (sk_whip_0023) and the cycle reverses. Upstream of all of it sits the option of refusing the
    question the brief asked (sk_whip_0062) and replacing its key message with a key question
    (sk_whip_0063).
  whole_system_claim:
    text: >
      Everything in this cycle is arranged to keep generation and judgement from happening at the
      same time, and the source's individual instructions are almost all instances of that one rule:
      write hot and edit cold, angel's advocate not devil's, record the bad idea instead of arguing
      with it, capture the promising find and keep digging, do not talk about the work while it is
      unfinished. The volume target is what the separation makes possible, and the clustering step is
      what makes volume pay.
    origin: extractor_synthesis
    interpretation_basis: >
      Sullivan never assembles these into one cycle; they are distributed across Chapters 4, 5, 8 and
      15 as separate runs of headed advice. He does state the separation principle twice in his own
      words ("write hot, edit cold", repeated in two chapters) and states the convergent/divergent
      alternation directly, which is what licenses reading the rest as instances of it. The
      identification of the four condition-setting members as a preamble, and the placement of
      problem-finding upstream, are ours.
    source_ref:
  members:
  - {sk_ref: sk_whip_0026, role_in_system: precondition, order: 1, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0027, role_in_system: precondition, order: 2, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0028, role_in_system: precondition, order: 3, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0062, role_in_system: upstream_option, order: 4, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0063, role_in_system: upstream_option, order: 5, membership_origin: source_stated}
  - {sk_ref: sk_whip_0019, role_in_system: step, order: 6, membership_origin: source_stated}
  - {sk_ref: sk_whip_0024, role_in_system: device, order: 7, membership_origin: source_stated}
  - {sk_ref: sk_whip_0025, role_in_system: device, order: 8, membership_origin: source_stated}
  - {sk_ref: sk_whip_0064, role_in_system: device, order: 9, membership_origin: source_stated}
  - {sk_ref: sk_whip_0020, role_in_system: rule, order: 10, membership_origin: source_stated}
  - {sk_ref: sk_whip_0017, role_in_system: target, order: 11, membership_origin: source_stated}
  - {sk_ref: sk_whip_0018, role_in_system: enabling_skill, order: 12, membership_origin: source_stated}
  - {sk_ref: sk_whip_0021, role_in_system: expected_stage, order: 13, membership_origin: source_stated}
  - {sk_ref: sk_whip_0069, role_in_system: repair, order: 14, membership_origin: source_stated}
  - {sk_ref: sk_whip_0022, role_in_system: step, order: 15, membership_origin: source_stated}
  - {sk_ref: sk_whip_0023, role_in_system: step, order: 16, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: procedural, origin: extractor_inferred}
    dependencies:
    - {from: sk_whip_0017, to: sk_whip_0018, note: "the volume target is unreachable without fast discard", origin: extractor_inferred}
    - {from: sk_whip_0023, to: sk_whip_0017, note: "there is nothing to cluster without volume", origin: extractor_inferred}
    - {from: sk_whip_0023, to: sk_whip_0022, note: "clustering follows the cold edit", origin: extractor_inferred}
    - {from: sk_whip_0020, to: sk_whip_0022, note: "permission to write badly is safe only because judgement comes later", origin: extractor_inferred}
    tradeoffs:
    - {between: [sk_whip_0069, sk_whip_0021], note: "change something versus sit through it — the source gives both and no rule for choosing", origin: extractor_inferred}
    conflicts:
    - {note: "sk_whip_0062 concedes that agencies are staffed only for current business and so cannot do problem-finding, which makes the system's upstream option unavailable under the conditions the source himself describes", origin: extractor_inferred}
  source_warns_against_isolated_use: false
  source_warning_ref:
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, repeated_within_source, mechanism_given, anecdotal]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      This is the most extractor-assembled system in the lane and should be treated as such. The
      sixteen claims are all Sullivan's, in his words, and several of the local orderings are his
      (shallow holes then deep dig; write hot then edit cold; cluster after editing). The unification
      of four chapters into one cycle with preconditions, devices, targets and repairs is OURS. He
      does not present a process; he presents advice under headings, and says explicitly that
      whatever process a reader arrives at is their own.
  provenance:
    chapter: "Ch. 4 — A Controlled Daydream; Ch. 5 — Brevity Is the Soul of Wit; Ch. 8 — Rewiring Your Brain; Ch. 15 — Creative Mind Versus Monkey Mind"
    section: "the concepting and writing-process sections of each (spines 15, 17, 23, 37)"
    page_start:
