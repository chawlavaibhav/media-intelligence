- scs_id: scs_whip_007
  source_id: sullivan-hey-whipple
  label: the_copy_finishing_sequence
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: source_stated
  description: >
    The copywriting chapter's back half is ordered, and the source states the ordering at the points
    where it matters. Tone is decided before writing and is constrained by product and audience,
    with the standing correction that funny is a subset of interesting rather than a goal
    (sk_whip_0058). Voice is acquired by study of the brand's own published work rather than invented
    (sk_whip_0054). The draft is then written, and only afterwards worked: rhythm varied and the
    joints filled until no sentence can be removed without damage (sk_whip_0055), the whole cut by a
    third and read aloud (sk_whip_0056). The tagline is written last, explicitly — save it until the
    campaign is well started, possibly to the very end — and must survive alone with the logo
    (sk_whip_0057). The final requirement is that each piece stands alone and ends by moving the
    reader somewhere (sk_whip_0059).
  whole_system_claim:
    text: >
      The ordering carries the claim. Each step operates on material the previous step produced, and
      three of the steps are explicitly retrospective — you cannot vary a rhythm, cut a third, or
      summarise an idea into a tagline before the thing exists. Taken together they say that
      copywriting in this source is mostly editing, which is Sullivan's own summary: all first drafts
      are crap and all good copywriting is rewriting.
    origin: extractor_synthesis
    interpretation_basis: >
      The individual steps and two of the orderings are the source's — the tagline is explicitly last,
      and reading aloud and cutting are explicitly after the writing. The unification of the tone and
      voice material at the head of the same sequence is ours; he presents those under a separate
      heading and does not say they precede the draft, though his own account of voice emerging from
      the brand truth implies it.
    source_ref: "Ch. 5, 'If you have to have one, make your tagline an anthem.' (spine 17)"
  members:
  - {sk_ref: sk_whip_0058, role_in_system: step, order: 1, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0054, role_in_system: step, order: 2, membership_origin: extractor_inferred}
  - {sk_ref: sk_whip_0055, role_in_system: step, order: 3, membership_origin: source_stated}
  - {sk_ref: sk_whip_0056, role_in_system: step, order: 4, membership_origin: source_stated}
  - {sk_ref: sk_whip_0057, role_in_system: step, order: 5, membership_origin: source_stated}
  - {sk_ref: sk_whip_0059, role_in_system: acceptance_test, order: 6, membership_origin: source_stated}
  internal_structure:
    ordering: {scheme: procedural, origin: source_stated}
    dependencies:
    - {from: sk_whip_0057, to: sk_whip_0055, note: "the tagline summarises an idea that must already exist", origin: extractor_inferred}
    - {from: sk_whip_0056, to: sk_whip_0022, note: "the cut and the aloud read are the cold edit at sentence level", origin: extractor_inferred}
    - {from: sk_whip_0054, to: sk_whip_0041, note: "voice is said to emerge from the brand truth", origin: extractor_inferred}
    tradeoffs: []
    conflicts:
    - {note: "sk_whip_0057 prescribes how to make a tagline while sk_whip_0003's reduction exercise names the tagline as the first element to remove; the source holds both and signals it by making the tagline advice conditional", origin: extractor_inferred}
  source_warns_against_isolated_use: false
  source_warning_ref:
  evidence:
    characteristics: [explicitly_stated, practitioner_assertion, visually_demonstrated, repeated_within_source]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      Half the ordering is the SOURCE'S and stated: the tagline is last, the cut and the aloud read
      come after writing, and the whole chapter runs from process to voice to flow to finish. Ours:
      placing the tone decision and voice acquisition as steps one and two, and treating sk_whip_0059
      as the sequence's acceptance test rather than as separate campaign advice. None of the steps
      has a measured effect attached; all are craft prescriptions.
  provenance:
    chapter: "Ch. 5 — Brevity Is the Soul of Wit: The Art of Copywriting"
    section: "Voice and tone; Flow and readability; If you have to have one, make your tagline an anthem. (spine 17)"
