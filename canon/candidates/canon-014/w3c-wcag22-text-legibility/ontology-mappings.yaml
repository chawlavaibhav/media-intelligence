- from: t_wcag_0011
  to: t_wcag_0012
  relation: broader_than
  confidence_basis: extractor_judgement
  note: text belonging to an inactive component is another of the four incidental situations
- from: t_wcag_0006
  to: t_wcag_0010
  relation: broader_than
  confidence_basis: extractor_judgement
  note: the source's own note under SC 1.4.5 and SC 1.4.9 declares logotypes to be essential, making logotype
    a named case of the wider term
- from: t_wcag_0001
  to: t_wcag_0002
  relation: narrower_than
  confidence_basis: extractor_judgement
  note: the ratio is a construction over two relative luminance values; luminance is the more general
    quantity
- from: t_wcag_0003
  to: t_wcag_0001
  relation: related_to
  confidence_basis: extractor_judgement
  note: size classification selects which contrast threshold applies; it is not itself a contrast property
- from: t_wcag_0013
  to: t_wcag_0014
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: 'checked and rejected as the same failure. The source separates them explicitly: a star rating
    relying on yellow versus white fill fails Use of Colour, while a pale yellow star on white fails Non-text
    Contrast. Colour-alone encoding can occur at any contrast level, and insufficient contrast can occur
    with no colour coding at all.'
- from: t_wcag_0017
  to: t_wcag_0014
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: checked and rejected. Insufficient contrast is a measured shortfall against a threshold; the nominal-pass
    problem is content that meets the threshold as specified and is nonetheless faint as rendered. Same
    appearance to a reader, opposite verdicts under the standard.
- from: t_wcag_0019
  to: t_wcag_0017
  relation: same_mechanism
  confidence_basis: extractor_judgement
  note: both are the source's account of stroke weight interacting with perceived contrast — one stated
    as a normative warning attached to the large-scale definition, one as a non-normative rendering consequence
- from: t_wcag_0004
  to: t_wcag_0007
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: 'checked and rejected as interchangeable. The glossary defines them separately, and SC 1.4.5 exists
    precisely because they are different: one is programmatically determinable and restylable by the user,
    the other is pixels.'
- from: t_wcag_0009
  to: t_wcag_0008
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: both are assessed at 3:1 under SC 1.4.11 but they are separate clauses with separate exceptions
    — components are exempt when inactive or user-agent-styled, graphics when a particular presentation
    is essential
- from: t_wcag_0020
  to: t_wcag_0021
  relation: related_to
  confidence_basis: extractor_judgement
  note: 'the source lets one substitute for the other in one direction only: a lightness difference reaching
    3:1 counts as an additional visual means, but no contrast level substitutes for a second cue where
    a specific hue must be identified'
- from: t_wcag_0022
  to: t_wcag_0023
  relation: related_to
  confidence_basis: extractor_judgement
  note: both address the same problem at different strictness; providing text alongside the image satisfies
    SC 1.4.5 but not SC 1.4.9
- from: t_wcag_0024
  to: t_wcag_0021
  relation: narrower_than
  confidence_basis: extractor_judgement
  note: exceeding the threshold is the general remedy specialised to the thin-face rendering case, and
    it is offered as best practice rather than as a requirement
- from: t_wcag_0015
  to: t_wcag_0016
  relation: distinct_from
  confidence_basis: extractor_judgement
  note: checked and rejected. F24 is a failure of specification — one half of the pair is missing. F83
    is a failure of the specified pair against an actual image background. Different diagnoses, different
    repairs.
