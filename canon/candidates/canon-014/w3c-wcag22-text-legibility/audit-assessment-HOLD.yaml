  detail: 'The extraction read a live web standard. A published page can change under its own URL, and
    nothing

    in the committed record fingerprints the bytes that were actually read, so the extraction cannot
    be

    shown to correspond to any particular version of the document. For a source whose whole value is

    that it supplies EXACT NUMERIC CRITERIA - contrast ratios, resize percentages, spacing multipliers
    -

    that is a material gap: a criterion is only as good as the version it came from. A re-audit must

    re-fetch, record the version and date, and fingerprint what it read.'
