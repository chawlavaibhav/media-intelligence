    rules, because the source explicitly declines to make them that.
  applicability:
    when: "any downstream rule, checklist or automated check derived from this source's criteria chapter"
    limits: >
      This constrains OUR use of the source; it makes no claim about design. Note the source's own
      precondition on the exemption — the licence to break the rules is extended to a designer who
      knows them, not to one who does not — so the constraint is not a licence to ignore the
      criteria either.
  evidence_basis: derived_from_source
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"
