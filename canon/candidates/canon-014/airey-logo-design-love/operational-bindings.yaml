# ── GOVERNANCE ───────────────────────────────────────────────────────────────

- binding_id: bnd_logo_016
  source_knowledge_refs: [sk_logo_0049, sk_logo_0036, sk_logo_0037, sk_logo_0029]
  source_system_refs: []
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [flags]
  governance_consumer: evidence_interpretation
  rationale: >
    This source carries several commercial outcome figures — a 20 per cent sales fall, a $33 million
    loss, 400,000 complaints, 8.3 million copies in 24 hours, tens of millions of pounds saved —
    every one of them cited to trade press or asserted by a party to the project, with no controls
    and no alternative explanation examined. They are the most quotable material in the book and the
    least supported. This binding exists to make the handling rule explicit rather than leaving each
    downstream reader to decide: figures from this source may be reported as WHAT THIS SOURCE
    CLAIMS, attributed and dated, and may never be used as evidence that a design property causes a
    commercial result.
  applicability:
    when: "any downstream use of a numeric or commercial outcome claim originating in this source"
    limits: >
      The rule is about how to READ this source, not about the world. It does not assert the figures
      are wrong — Tropicana's reversal is well documented — only that this source is not evidence
      for the causal link it draws, and that its whole example set is survivorship-selected: famous
      surviving marks, chosen after the fact, with no unsuccessful comparison set anywhere in the
      book.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: []
  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

