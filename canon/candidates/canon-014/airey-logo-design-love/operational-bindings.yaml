  source_knowledge_refs: [sk_logo_0046, sk_logo_0025, sk_logo_0001]
  source_system_refs: [scs_logo_001]
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains]
  governance_consumer: rule_application
  rationale: >
    The source withdraws the necessity of its own criteria in the closing paragraph of the chapter
    that states them, and separately prints a qualification demoting simple-and-appropriate to
    necessary-but-insufficient. Anything downstream that applies the seven elements as a
    specification is reading the source against itself. This binding records the constraint: the
