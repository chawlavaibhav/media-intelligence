access_position: 'THE ACCESS BLOCKER RECORDED BY THE EARLIER PASSES NO LONGER HOLDS, AND THIS IS A CHANGE
  OF FACT THE

  CONTROLLER SHOULD SEE. Those passes recorded `evidence_insufficient` partly because the source could

  not be opened: the extraction had read a local library that did not exist in the container the

  repair ran in, and that container had no external network egress. Both were true there. NEITHER IS

  TRUE IN THE ENVIRONMENT THIS RECONCILIATION RAN IN - the book is present locally, and network egress

  was tested and works. What remains unresolved is therefore NOT access. It is that the inspection has

  not been done. That is a matter of cost and authorisation, and it is a materially better position

  than being blocked, but it is not a pass and this task does not treat it as one.

  '
