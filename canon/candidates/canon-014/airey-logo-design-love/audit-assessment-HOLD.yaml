- blocker: representation_is_a_degraded_unattributed_translation
  detail: 'THE STRONGEST BLOCKER ON ANY OF THE SEVENTEEN, AND ONE THAT SURVIVES HAVING THE FILE IN HAND.
    The

    local copy is not the English original. It is an UNATTRIBUTED, DEGRADED SPANISH MACHINE TRANSLATION

    of it, so Airey''s own wording cannot be recovered from it and all 45 ontology terms are correctly

    marked `verbatim: false` - which for a book about naming and identity vocabulary removes much of
    the

    point. The translation is also WRONG in at least one load-bearing place: on printed p.64 it calls
    the

    FAILED Tropicana redesign the "successfully renamed identity", contradicting the body text around
