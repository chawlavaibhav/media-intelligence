observed_loss_patterns:

  # NOTE ON VOCABULARY: `illustrative_only` is an Audit Gate `visual_argument_role` value recorded
  # at the head of this file, not a loss pattern. It replaces the `no_visual_argument` the runbook
  # predicted, because the book does place images in its argument's path — it just never rests a
  # claim on one.
  - pattern: no_authored_page
    affects: "the whole source"
    detectability: detected_by_independent_check
    recoverability: unrecoverable_in_this_copy
    evidence: >
      Reflowable EPUB, no page map, no folio in the text. Every locator in this extraction is
      chapter plus named section per SCHEMA-CONTRACT-ADDENDUM-LOCATORS.md Case 3, with the spine
      number as a secondary aid; page_start/page_end are null on every object and no page number
      was invented. PROVENANCE.md also records that the endnotes are dense with page numbers that
      are all ranges inside OTHER works, and none was used as a locator. Section headings are
      unique within their chapters, so the locators are stable in this copy.

  - pattern: in_figure_text_absent
    affects: "axis labels, tick values and legends of the two data charts (00011, 00007)"
    detectability: detected_by_independent_check
    recoverability: recovered_in_this_copy
    evidence: >
      The charts are raster images; their axis text (e.g. '75/50/25', weekday letters, 'March 2011
      / April 2011', 'Midnight…Noon', 'Weekday/Weekend') exists only inside the JPEGs and is
      absent from the text layer. The chart title lines ('Searches for "Rebecca Black" on YouTube
      March 2011', 'Mention of Cheerios on Twitter') ARE present as text, and the prose adjacent
      to each chart states the pattern the chart shows. This pass opened both charts and confirms
      the prose statements match the plotted data. No extracted object cites an in-figure value.

  - pattern: no_loss_detected
    affects: "the argument carried by the extraction"
    detectability: detected_by_independent_check
    recoverability: not_applicable
    evidence: >
      All five in-body images restate or decorate propositions the prose states in full: the two
      charts are immediately narrated ('Notice the spike once every week?'), the two campaign
      images are described and quoted in the surrounding text, and the aerosol photograph is
      described. The extraction's empty figure_refs on all 54 objects is therefore confirmed
      correct AS A STATEMENT OF DEPENDENCE - no claim rests on an image - although the book is not
      literally imageless, which is why the role recorded here is illustrative_only rather than
      no_visual_argument. Nothing visual that the argument needs is missing from a text-only
      representation.

