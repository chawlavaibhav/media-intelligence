# REP-07 — visual-evidence ledger for Berger, "Contagious: Why Things Catch On".
#
# The visual pass RAN and COMPLETED. The expected result was a pure null (the extraction recorded
# no figure refs). The actual result is close to but not identical with that expectation, and the
# difference is recorded honestly: the book contains five in-body images, two of them data charts
# that the prose explicitly directs the reader to look at — and in every case the prose then states
# the pattern the chart shows, so no extracted claim depends on any image. Recording what was
# actually found, rather than forcing the null template, is the point of running the pass.

