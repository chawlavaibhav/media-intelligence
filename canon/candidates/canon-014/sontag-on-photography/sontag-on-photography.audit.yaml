representation_integrity:
  delivery_format: publisher_epub
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    Reflowable Picador ebook (first eBook edition June 2011, eISBN 9781429957113). Sontag's
    essays have no section headings, so per PROVENANCE.md §2 every locator names the essay by
    title plus a short distinguishing phrase identifying the passage - the locator addendum
    requires the phrase because a bare title is too coarse for a forty-page essay;
    page_start/page_end are null on every object, spine numbers are secondary aids, and no page
    number was invented. Endnotes are cited by the author's own note numbers where used.
  inspection_state: inspected_figure_level
  visual_argument_role: no_visual_argument
  observed_loss_patterns:
    - pattern: no_loss_detected
      affects: "the visual dimension - nothing visual was lost because there is nothing visual to lose"
      detectability: detected_by_independent_check
      recoverability: not_applicable
      evidence: >
        The REP-07 pass enumerated all 37 image assets and opened everything large enough to
        carry content (ledger, inspection): a cover, a scanned title page, two cover thumbnails,
        and 33 copies of a single ~500-byte ornamental mark used as essay-opening and
        section-break furniture. Not one photograph, diagram or chart exists in the archive - a
        book about photographs that reproduces none, confirming PROVENANCE.md §3's statement by
        enumeration. No sentence in the book directs the reader to look at anything in it, so a
        text-only representation loses nothing of the argument.
    - pattern: no_authored_page
      affects: "the whole source"
      detectability: detected_by_independent_check
      recoverability: unrecoverable_in_this_copy
      evidence: >
        The format has no page at all; essay-title-plus-passage-phrase locators are the stable
        citation unit, essay titles being unique and the phrases findable by search (ledger,
        no_authored_page).
  claim_resolution_after_inspection: not_applicable
  consequence: >
