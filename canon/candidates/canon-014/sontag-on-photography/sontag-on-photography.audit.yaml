evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 22 objects categorised. Critical essays: every claim is Sontag arguing in her own voice
    from readings of named photographs, historical episodes and her own experience; nothing in
    the book is measured, and the frozen record credits no measurement anywhere.
  categories:
    - category: source_author_assertion
      sk_refs: [sk_snt_0001, sk_snt_0002, sk_snt_0003, sk_snt_0004, sk_snt_0005, sk_snt_0006,
                sk_snt_0007, sk_snt_0008, sk_snt_0010, sk_snt_0012, sk_snt_0013, sk_snt_0014,
                sk_snt_0015, sk_snt_0016, sk_snt_0017, sk_snt_0018, sk_snt_0019, sk_snt_0020,
                sk_snt_0021]
      evidence: >
        Nineteen objects argued in the author's own critical voice - by analogy (footprint,
        death mask, relic on sk_snt_0003), by readings of single cases doing the work of general
        claims (the wartime photograph and caption on sk_snt_0008), and by her own reported
        experience (the operation watched and the operation filmed on sk_snt_0013). Where she
        engages another writer adversarially - the Benjamin captioning proposal she argues
        against inside sk_snt_0008 - that is not approving quotation and stays here. sk_snt_0020
        directly contradicts what the photographers she discusses said about themselves,
        offering argument rather than evidence for preferring her account, which the frozen
        caveat records.
    - category: source_quotes_named_third_party
      sk_refs: [sk_snt_0009, sk_snt_0011, sk_snt_0022]
      evidence: >
        Objects where an identified other author's words are carried approvingly and do real
        supporting work: Brecht's Krupp remark inside sk_snt_0009, Benjamin's 1934 address
        inside sk_snt_0011, and a novelist of 1901's remark that you cannot claim to have really
        seen something until you have photographed it inside sk_snt_0022. In each the frozen
        caveat records the attribution and asserts nothing about the relationship between the
        two writers.
  relation_to_evidence_characteristics: >
    Consistent with the frozen record, mechanically checked: empirical_within_source appears on
    zero of 22 objects, and no category here asserts a supplied measurement. The dominant frozen
    characteristics are argued plus historical_claim (19 objects) and culturally_bounded (19
    objects), which is the extraction's per-object enforcement of the 1977 premise rule
    (PROVENANCE.md §6) and is relied on by the technology_contingency section below.

