technology_contingency:
  applicable: true
  applicability_basis: >
    Date matters more for this source than for any other in its extraction run (PROVENANCE.md
    §1): almost every claim rests on premises of 1973-77 - film, the material scarcity of
    images, the picture magazine, the camera-made image as the only photographic-looking image -
    and the extraction enforced two rules: no claim modernised, no assertion of what has changed
    since. This section classes the claims against those premises without updating any of them.
  assessed: true
  classes:
    - class: technology_contingent
      sk_refs: [sk_snt_0001, sk_snt_0003, sk_snt_0004, sk_snt_0005, sk_snt_0014, sk_snt_0017,
                sk_snt_0018, sk_snt_0022]
      evidence: >
        Claims whose stated premise is the film-era technology and circulation environment
        itself: reception of the photograph as a piece of the world and its trace authority both
        rest on the premise, stated by the frozen caveats, that in 1977 an image which looked
        photographic was made by a camera (sk_snt_0001, sk_snt_0003); the retouching-era
        falsification and portrait claims are period evidence (sk_snt_0004, sk_snt_0005); the
        saturation and threshold claim is stated within the 1977 curated image flow
        (sk_snt_0014); the still/flow contrast is about broadcast television as she encountered
        it (sk_snt_0017); acquisition-as-knowledge rests on the photograph being a light-weight
        physical object (sk_snt_0018); and the photograph-as-standard-of-reality claim rests on
        the 1977 abundance premise (sk_snt_0022). All eight carry historical_claim.
    - class: durable_mechanism
      sk_refs: [sk_snt_0002, sk_snt_0006, sk_snt_0008, sk_snt_0010]
      evidence: >
        Claims resting on structural properties of any selective, framed, captioned image rather
        than on film-era technology: selection imposes a standard while appearing to impose none
        (sk_snt_0002), framing severs the subject from its circumstances (sk_snt_0006), the
        caption speaks for the mute image and still cannot fix its meaning (sk_snt_0008), and
        what an image is of dominates how it is seen (sk_snt_0010). Their evidence remains
        unmeasured criticism - durable in mechanism, not thereby verified.
    - class: uncertain
      sk_refs: [sk_snt_0007, sk_snt_0009, sk_snt_0011, sk_snt_0012, sk_snt_0013, sk_snt_0015,
                sk_snt_0016, sk_snt_0019, sk_snt_0020, sk_snt_0021]
      evidence: >
        Cultural-reception claims - meaning-as-use, beautification, convention exhaustion,
        aestheticisation's neutralising effect, the interesting-by-recycling - argued about a
        particular image culture at a particular date with no measurement; whether they describe
        durable facts about viewers or artefacts of the 1970s Western image economy cannot be
        classed from this source, and the extraction deliberately recorded no view on what has
        changed since.
  existing_characteristics_relied_on: [historical_claim, culturally_bounded]
