blocker_shared_by_all_seventeen: 'NO VISUAL OR FIGURE-LEVEL INSPECTION HAS EVER BEEN RUN ON THIS SOURCE,
  so it has no

  `visual-evidence-ledger.yaml`. That file is one of the five the Audit Gate fingerprints, and the

  Gate reports a missing covered artifact rather than skipping it, so no Audit Gate record can be

  written for this source at all. It cannot be authored from the committed extraction either: a

  visual-evidence ledger records what an inspection found, and transcribing a previous run''s

  self-report into it would be fabricating an inspection.

  '
access_position: 'THE ACCESS BLOCKER RECORDED BY THE EARLIER PASSES NO LONGER HOLDS, AND THIS IS A CHANGE
  OF FACT THE

  CONTROLLER SHOULD SEE. Those passes recorded `evidence_insufficient` partly because the source could

  not be opened: the extraction had read a local library that did not exist in the container the

  repair ran in, and that container had no external network egress. Both were true there. NEITHER IS

  TRUE IN THE ENVIRONMENT THIS RECONCILIATION RAN IN - the book is present locally, and network egress

  was tested and works. What remains unresolved is therefore NOT access. It is that the inspection has

  not been done. That is a matter of cost and authorisation, and it is a materially better position

  than being blocked, but it is not a pass and this task does not treat it as one.

  '
source_specific_blockers:
- blocker: critique_rather_than_craft
  detail: 'The project''s own coverage map warned that this is criticism, not craft, and the extraction
    was run

    with that warning enforced - only the transferable material was taken. The warning does not go away

    at admission. This source supplies arguments about what photographs DO in a culture; it supplies

    almost no statement about how to make one, and nothing in it is measured. Its value is real and
    it

    is not the same kind of value as the rest of the corpus.'
