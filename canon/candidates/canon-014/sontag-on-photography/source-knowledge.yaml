        THIS IS NOT PRODUCTION ADVICE AND MUST NOT BE READ AS ANY. Sontag is describing what the
        medium does to a viewer's relation to a subject. She does not say what should be photographed,
        how it should be composed, or what should be avoided, and nothing is inferred here.
      origin: extractor_observed
    - text: >
