- sk_id: sk_snt_0019
  source_id: sontag-on-photography
  source_terms:
    - "A way of certifying experience, taking photographs is also a way of refusing it—by limiting experience to a search for the photogenic, by converting experience into an image, a souvenir"
    - "Travel becomes a strategy for accumulating photographs"
    - "Most tourists feel compelled to put the camera between themselves and whatever is remarkable that they encounter. Unsure of other responses, they take a picture"
    - "This gives shape to experience: stop, take a photograph, and move on"
    - "The very activity of taking pictures is soothing, and assuages general feelings of disorientation"
  concept_label: the_camera_certifies_experience_and_refuses_it_in_the_same_act
  label_origin: extractor_assigned
  claim: >
    Sontag's account of the camera in travel turns on a single act doing two opposite things.
    Photographs certify experience — they are indisputable evidence that the trip was made, the
    programme carried out, the fun had — and taking them is simultaneously a way of refusing the
    experience, by limiting it to a search for the photogenic and converting it into an image, a
    souvenir. Travel becomes a strategy for accumulating photographs. Her second mechanism is about
    anxiety rather than memory: the activity is soothing and assuages the disorientation travel
    produces, so tourists unsure of how else to respond put the camera between themselves and
    whatever is remarkable, which gives shape to the experience — stop, take a photograph, move on.
    She adds that the appeal is strongest for people with a ruthless work ethic, for whom picture-
    taking is a friendly imitation of work that appeases the anxiety of not working while on
    holiday.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Photographing is an available response when no other is confidently held, and it terminates the
      encounter by converting it into a task with a completion. The certification and the refusal are
      not two acts but one, because what certifies the experience is precisely the object that
      replaced it.
  scope:
