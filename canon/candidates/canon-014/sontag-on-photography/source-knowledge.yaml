    Photography does not simply reproduce the real, it recycles it: in the form of images, things
    and events are put to new uses and assigned new meanings that go beyond the distinctions between
    beautiful and ugly, true and false, useful and useless, good taste and bad. The quality that
    erases those distinctions is "the interesting", and what makes something interesting is that it
    can be seen to be like, or analogous to, something else. There is an art and there are fashions
    of seeing things so as to make them interesting, supplied by a steady recycling of the artefacts
    and tastes of the past — so clichés recycled become meta-clichés, unique objects become clichés,
    and clichés become distinctive artefacts. Her demonstration of how far the erasure goes is a
    single sentence: in the form of a photograph the explosion of an atomic bomb can be used to
    advertise a safe. She adds that images are always compatible, or can be made compatible, even
    when the realities they depict are not.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Interest is a relational property — it is produced by resemblance to something else rather
      than by anything in the thing. Because photographs make everything comparable to everything
      else, the medium can manufacture the property at will, and in doing so overrides the
      distinctions the subjects themselves carry.
  scope:
    domain_discussed_by_source: [photography, advertising, consumer_culture, art_criticism]
    conditions: "a society in which images circulate in quantity and are layered over one another"
  caveats:
    - text: >
        "The interesting" is doing heavy work as a quasi-technical term she does not define beyond
        the analogy formula. The argument is by accumulation of instances rather than by
        demonstration.
      origin: extractor_observed
    - text: >
        The advertising example is a single illustrative sentence, not a documented campaign. It is
        recorded as her illustration.
      origin: extractor_observed
    - text: >
        The passage sits inside her extended contrast with Chinese image practice of the early
        1970s, in which she argues the same medium is deliberately restricted to prevent exactly this
        layering. That contrast is period argument of a particular political moment and is not
        extracted; only the mechanism is.
      origin: extractor_observed
