- sk_id: sk_snt_0018
  source_id: sontag-on-photography
  source_terms:
    - "To photograph is to appropriate the thing photographed. It means putting oneself into a certain relation to the world that feels like knowledge—and, therefore, like power"
    - "To collect photographs is to collect the world"
    - "Photography is acquisition in several forms"
    - "the camera is the ideal arm of consciousness in its acquisitive mood"
    - "we can acquire something as information (rather than experience)"
  concept_label: photographing_is_a_form_of_acquisition_and_it_feels_like_knowledge
  label_origin: extractor_assigned
  claim: >
    Sontag's founding claim about the act is that it is acquisitive. To photograph is to appropriate
    the thing photographed: it places the photographer in a relation to the world that feels like
    knowledge and therefore like power, and to collect photographs is to collect the world. She
    separates the forms the acquisition takes. In its simplest form a photograph is surrogate
    possession of a cherished person or thing. In a second it establishes a consumer's relation to
    events, including events that are not part of one's experience — and she notes that habitual
    consumption blurs the distinction between the two kinds. The third and most inclusive is the
    acquisition of something as information rather than as experience: through being photographed,
    something becomes part of a system of classification and storage, and reality is redefined as an
    item for exhibition, a record for scrutiny and a target for surveillance.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Possession of an image of a thing is easily mistaken for a relation to the thing, because the
      image is portable, storable and inspectable in ways the thing is not. What is acquired is a
      handle on the subject, and having a handle is what feels like knowledge.
  scope:
    domain_discussed_by_source: [photography, tourism, surveillance, family_photography, information]
    conditions: "the Western image culture of the 1970s; still photographs as objects"
  caveats:
    - text: >
        The whole claim rests on a premise she states as a fact of the medium: a still photograph is
        an object — light-weight, cheap to produce, easy to carry about, accumulate and store — which
        moving images on a wall are not. The premise is recorded as she states it, and this lane
        says nothing about any other arrangement.
      origin: extractor_observed
    - text: >
        "Feels like knowledge" is doing careful work and should not be flattened. She is describing a
        sensation the act produces, and she argues elsewhere that it is not knowledge.
      origin: extractor_observed
  source_stated_problems:
