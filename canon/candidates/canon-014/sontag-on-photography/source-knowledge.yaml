- sk_id: sk_snt_0004
  source_id: sontag-on-photography
  source_terms:
    - "A fake painting (one whose attribution is false) falsifies the history of art. A fake photograph (one which has been retouched or tampered with, or whose caption is false) falsifies reality"
    - "The consequences of lying have to be more central for photography than they ever can be for painting, because the flat, usually rectangular images which are photographs make a claim to be true that paintings can never make"
  concept_label: a_falsified_photograph_falsifies_reality_where_a_forged_painting_falsifies_art_history
  label_origin: extractor_assigned
  claim: >
    Sontag draws the consequence of the trace directly. Because photographs make a claim to be true
    that paintings can never make, the consequences of lying are more central for photography than
    they ever can be for painting. A forged painting falsifies the history of art — a question of
    attribution. A faked photograph falsifies reality itself. And she is explicit about what counts
    as faking: retouching or tampering with the image, **or a false caption**. The caption is placed
    inside the definition of the fake, not outside it, which makes the claim about words attached to
    an unaltered image as much as about the image.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The two kinds of image make different claims, so falsifying them damages different things.
      Since a photograph's claim is about the world rather than about its own authorship, corrupting
      it corrupts a claim about the world — however the corruption is introduced.
  scope:
    domain_discussed_by_source: [photography, painting, journalism]
    conditions: "images received as photographs, and the words attached to them"
  caveats:
    - text: >
        Stated in the course of an argument about the nineteenth-century contest between
        beautification and truth-telling, not as a rule for anyone to follow. Sontag prescribes
        nothing here and this lane records no prescription.
      origin: extractor_observed
    - text: >
        Her account of retouching is period evidence: a German photographer's two versions of one
        portrait astounded crowds at an 1855 exposition. The claim about consequence is not
        period-bound in her frame; the illustration is.
      origin: extractor_observed
  source_stated_problems:
    - "A fake photograph ... falsifies reality"
  source_stated_remedies: []
  examples:
    positive:
      - {description: "an 1855 exposition display of a retouched and an unretouched version of one portrait, which she says made being photographed more popular rather than less", figure_ref: null}
