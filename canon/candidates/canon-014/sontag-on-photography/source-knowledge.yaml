- sk_id: sk_snt_0002
  source_id: sontag-on-photography
  source_terms:
    - "photographs are as much an interpretation of the world as paintings and drawings are"
    - "would take dozens of frontal pictures of one of their sharecropper subjects until satisfied that they had gotten just the right look on film"
    - "In deciding how a picture should look, in preferring one exposure to another, photographers are always imposing standards on their subjects"
    - "Even when photographers are most concerned with mirroring reality, they are still haunted by tacit imperatives of taste and conscience"
  concept_label: selection_imposes_a_standard_while_appearing_to_impose_none
  label_origin: extractor_assigned
  claim: >
    Against the presumption of transparency Sontag sets a mechanism that operates entirely through
    choice. Photographers, even those most concerned with mirroring reality, are haunted by tacit
    imperatives of taste and conscience; in deciding how a picture should look and in preferring one
    exposure to another they are always imposing standards on their subjects. Her worked case is a
    documentary project whose photographers took dozens of frontal pictures of a single subject
    until satisfied they had the right look on film — the expression that supported their own
    notions about poverty, dignity, texture and exploitation. So the image is selected into
    agreement with a prior idea, and the selection leaves no mark in the result. She adds that
    photography's very passivity and ubiquity is itself its message and its aggression, so
    undiscriminating or self-effacing shooting does not escape the didacticism.
  claim_type: source_interpretation
  interpretation_basis: >
    Both halves are Sontag's and stated plainly — that photographers always impose standards in
    deciding how a picture should look, and that photographs carry a presumption of veracity which
    gives them authority. What is the EXTRACTOR'S is the joining of them into one claim about
    concealment: that the imposition leaves no trace in the surviving frame, and that this is why the
    presumption survives it. Sontag places the two adjacent and lets the contrast do the work; she
    does not say that the selection is invisible in the result. The joining is defensible from the
    passage's structure — the documentary-project example appears immediately after the sentence
    about the presumption of veracity, as its counterweight — and it is recorded here as ours.
  mechanism:
    stated_by_source: false
    text: >
      EXTRACTOR'S RECONSTRUCTION, NOT THE SOURCE'S: the camera records what is put in front of it,
      but which of many recordings is kept is decided by taste, and because the decision happens
      between frames rather than inside one the surviving frame carries it without displaying it.
  scope:
    domain_discussed_by_source: [documentary_photography, photojournalism, photography]
    conditions: "any photographic practice in which more frames are taken than are used"
  caveats:
    - text: >
        This is the sharpest thing in the book for anyone thinking about images that stand as
        evidence, and it is entirely a reading. Sontag offers no account of how she knows what the
        photographers were satisfied by.
      origin: extractor_observed
    - text: >
        She is describing selection among photographs of a real scene. This lane records that scope
        and does not extend the claim beyond it.
      origin: extractor_observed
  source_stated_problems:
    - "imposing standards on their subjects"
    - "This very passivity—and ubiquity—of the photographic record is photography's 'message,' its aggression"
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a 1930s government documentary project whose photographers shot repeatedly until the subject's expression matched their own notions about poverty and dignity", figure_ref: null}
      - {description: "images that idealise and images that make a virtue of plainness, described as equally aggressive", figure_ref: null}
  intra_source_relations:
    - {relation: qualifies, target: sk_snt_0001, note: "the interpretation the presumption of transparency conceals"}
    - {relation: member_of_system, target: scs_snt_001}
  evidence:
