- sk_id: sk_snt_0008
  source_id: sontag-on-photography
  source_terms:
    - "This photograph, like any photograph, is physically mute. It talks through the mouth of the text written beneath it"
    - "In fact, words do speak louder than pictures. Captions do tend to override the evidence of our eyes; but no caption can permanently restrict or secure a picture's meaning"
    - "even an entirely accurate caption is only one interpretation, necessarily a limiting one, of the photograph to which it is attached"
    - "the caption-glove slips on and off so easily"
    - "What the moralists are demanding from a photograph is that it do what no photograph can ever do—speak"
  concept_label: the_caption_speaks_for_the_mute_image_and_still_cannot_fix_its_meaning
  label_origin: extractor_assigned
  claim: >
    Sontag treats the caption as a real and asymmetric mechanism, and then denies it can do the job
    asked of it. A photograph is physically mute; it talks through the mouth of the text written
    beneath it, and words do speak louder than pictures — captions tend to override the evidence of
    our eyes. But no caption can permanently restrict or secure a picture's meaning: even an
    entirely accurate caption is only one interpretation, and a limiting one, and the caption-glove
    slips on and off too easily to hold. Her demonstration is a photograph released by one party and
    published by another whose caption reversed what it had meant to those who released it. She
    reports and rejects Benjamin's proposal that the right caption could rescue a picture and confer
    a revolutionary use value on it: what the moralists are demanding is that a photograph do what no
    photograph can ever do, which is speak.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Words assert and images do not, so an attached text supplies the assertion the image lacks and
      dominates the reading. But the attachment is external and detachable: the same image travels
      into a new placement with a new text, and nothing in the image resists the substitution.
  scope:
