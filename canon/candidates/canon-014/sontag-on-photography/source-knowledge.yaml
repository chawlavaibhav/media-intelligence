        THIS IS THE OBJECT MOST LIKELY TO BE MISREAD AS PRODUCTION ADVICE AND IT IS NOT. Sontag is
        not saying that images of difficulty should be composed differently, framed differently or
        avoided. She makes no recommendation of any kind here. Anything of that form would be an
        invention of this lane's, and none is made.
      origin: extractor_observed
    - text: >
        Her strongest evidence is her own experience: she reports watching an operation in person
        without flinching and flinching repeatedly at a filmed one, and reports the childhood
        encounter with camp photographs after which something went dead. Two first-person reports,
        offered as such.
      origin: extractor_observed
