# ─────────────────────────────────────────────────────────────
# DECONTEXTUALISATION, CAPTION, AND WHAT A PHOTOGRAPH CANNOT DO
# ─────────────────────────────────────────────────────────────

- sk_id: sk_snt_0006
  source_id: sontag-on-photography
  source_terms:
    - "In a world ruled by photographic images, all borders ('framing') seem arbitrary. Anything can be separated, can be made discontinuous, from anything else: all that is necessary is to frame the subject differently"
    - "Conversely, anything can be made adjacent to anything else"
    - "the world becomes a series of unrelated, freestanding particles; and history, past and present, a set of anecdotes and faits divers"
    - "The camera makes reality atomic, manageable, and opaque"
  concept_label: framing_severs_the_subject_from_its_circumstances
  label_origin: extractor_assigned
  claim: >
    Sontag's account of decontextualisation is mechanical rather than moral in its first move. A
    photograph is a thin slice of space as well as of time, and once images rule, all borders seem
    arbitrary: anything can be separated from anything else, since all that is required is to frame
    the subject differently — and conversely anything can be made adjacent to anything else. The
    consequence she draws is at the level of what a viewer can then know: the world becomes a series
    of unrelated freestanding particles and history a set of anecdotes, a view which denies
    interconnectedness and continuity while conferring on each moment the character of a mystery.
    The camera, in her phrase, makes reality atomic, manageable and opaque. Her last move is the one
    that matters most: because photographs cannot themselves explain anything, they are inexhaustible
    invitations to deduction, speculation and fantasy — the ultimate wisdom of the image being to say
    "there is the surface, now think, or rather feel, what the reality must be like if it looks this
    way".
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A frame is a decision about where to stop, and a photograph carries no record of that decision.
      What was severed is therefore unavailable to the viewer, who has the surface and must supply
      the circumstance — which is why the same image supports many readings without any of them being
      contradicted.
  scope:
    domain_discussed_by_source: [photography, journalism, information]
    conditions: "any photograph considered apart from what surrounded its subject"
  caveats:
    - text: >
        The claim that anything can be made adjacent to anything else describes a possibility of the
        medium. She is arguing about a cultural consequence, not reporting a practice.
      origin: extractor_observed
    - text: >
        The nominalism claim — that photography reinforces a view of social reality as small units of
        an apparently infinite number — is asserted, not shown, and is one of the places where the
        argument runs entirely by accumulation.
      origin: extractor_observed
  source_stated_problems:
    - "The camera makes reality atomic, manageable, and opaque"
    - "It is a view of the world which denies interconnectedness, continuity"
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a newspaper described as designed for skilled readers running no photographs at all, on the presumption that for such readers a photograph could only illustrate the analysis", figure_ref: null}
  intra_source_relations:
    - {relation: generalises, target: sk_snt_0007, note: "if the frame severs the circumstance, the meaning must come from where the image is placed"}
    - {relation: demonstrated_together_with, target: sk_snt_0010, note: "the same severance is why a photograph cannot explain"}
    - {relation: member_of_system, target: scs_snt_002}
  evidence:
    characteristics: [explicitly_stated, argued, mechanism_given, culturally_bounded, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
  provenance:
    chapter: '"In Plato''s Cave", the passage beginning "A new sense of the notion of information has been constructed around the photographic image" (spine 5)'
    section: null
