- sk_id: sk_snt_0010
  source_id: sontag-on-photography
  source_terms:
    - "the identification of the subject of a photograph always dominates our perception of it—as it does not, necessarily, in a painting"
    - "The painter constructs, the photographer discloses"
    - "we don't know how to react to a photograph (if the image is visually ambiguous: say, too closely seen or too distant) until we know what piece of the world it is"
    - "the formal qualities of style—the central issue in painting—are, at most, of secondary importance in photography, while what a photograph is of is always of primary importance"
  concept_label: what_a_photograph_is_of_dominates_how_it_is_seen
  label_origin: extractor_assigned
  claim: >
    Sontag states a difference in how the two kinds of image are processed. The identification of a
    photograph's subject always dominates our perception of it, in a way that is not necessarily true
    of a painting — the painter constructs, the photographer discloses. Her evidence is what happens
    with a visually ambiguous image: a photograph seen too closely or too distantly cannot be reacted
    to at all until the viewer knows what piece of the world it is. Two named cases carry the
    argument. A photographed cabbage leaf that looks like gathered cloth needs a title to identify it,
    and the image then works in two ways — the form pleases, and it is, surprisingly, a cabbage
    leaf — where gathered cloth would not have been beautiful, because that beauty is already known
    from the fine arts. And a shape resembling a bare coronet becomes far more interesting on
    learning it is a splash of milk. Her conclusion is that the formal qualities of style, the
    central issue in painting, are at most secondary in photography, while what a photograph is of is
    always primary.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because a photograph is received as a piece of the world, the question "what is this?" runs
      before any question about how it looks, and the answer supplies the terms in which the looking
      is then done. A painting carries no equivalent prior question, so form can be primary.
  scope:
    domain_discussed_by_source: [photography, painting, art_criticism]
    conditions: "images received as photographs, particularly close-up or abstracting ones"
  caveats:
    - text: >
        Argued from two celebrated images and a general observation about ambiguity, not from any
