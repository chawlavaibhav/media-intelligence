  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A photograph cannot say what it is of; the identification comes from outside it. Where the
      naming has already happened the image is read within that naming and can reinforce it; where
      it has not, there is nothing for the image to attach to and it registers as unreal.
