- sk_id: sk_snt_0007
  source_id: sontag-on-photography
  source_terms:
    - "Because each photograph is only a fragment, its moral and emotional weight depends on where it is inserted"
    - "A photograph changes according to the context in which it is seen"
    - "Each of these situations suggests a different use for the photographs but none can secure their meaning"
    - "As Wittgenstein argued for words, that the meaning is the use—so for each photograph"
    - "One of the central characteristics of photography is that process by which original uses are modified, eventually supplanted by subsequent uses"
  concept_label: a_photographs_meaning_is_its_use_and_no_placement_secures_it
  label_origin: extractor_assigned
  claim: >
    Sontag's strongest structural claim about images is that meaning is not a property a photograph
    carries. Because each photograph is only a fragment, its moral and emotional weight depends on
    where it is inserted, and the same photograph changes according to the context in which it is
    seen — she lists a contact sheet, a gallery, a political demonstration, a police file, a
    photographic magazine, a news magazine, a book, a living-room wall. Each situation suggests a
    different use, and none of them can secure the meaning. She applies Wittgenstein's formula
    directly: the meaning is the use. From this follows a claim about time rather than placement:
    the context that shapes a photograph's immediate, especially political, use is inevitably
    succeeded by contexts in which that use is weakened, so original uses are modified and eventually
    supplanted — most notably by the discourse of art, into which she says any photograph can be
    absorbed.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A fragment has no internal specification of what it is a fragment of, so what it means is
      supplied by its surroundings. Since surroundings change and cannot be fixed by the maker, the
      meaning drains and is replaced rather than persisting.
  scope:
    domain_discussed_by_source: [photography, photojournalism, art_criticism, politics]
    conditions: "photographs that circulate beyond their first placement, which she treats as all of them"
  caveats:
    - text: >
        Her supporting case is a photograph of a dead revolutionary that she says resembled, without
        anyone intending it, two well-known paintings — and that the very extent to which it is
        unforgettable indicates its potential for being depoliticised into a timeless image. That is
        a reading of a resemblance, offered as evidence for a general claim about all photographs.
      origin: extractor_observed
    - text: >
        The claim that the discourse of art can absorb any photograph is stated absolutely and
        supported by examples rather than argued.
      origin: extractor_observed
  source_stated_problems:
    - "this meaning is bound to drain away"
    - "the erosion of the very notion of meaning"
  source_stated_remedies: []
  examples:
