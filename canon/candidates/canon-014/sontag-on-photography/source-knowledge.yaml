- sk_id: sk_snt_0016
  source_id: sontag-on-photography
  source_terms:
    - "Photographs cannot create a moral position, but they can reinforce one—and can help build a nascent one"
    - "A photograph that brings news of some unsuspected zone of misery cannot make a dent in public opinion unless there is an appropriate context of feeling and attitude"
    - "What determines the possibility of being affected morally by photographs is the existence of a relevant political consciousness"
    - "the contribution of photography always follows the naming of the event"
    - "Without a politics, photographs of the slaughter-bench of history will most likely be experienced as, simply, unreal"
  concept_label: an_image_lands_inside_an_existing_frame_and_cannot_supply_one
  label_origin: extractor_assigned
  claim: >
    This is Sontag's clearest statement of what an image can and cannot accomplish, and it is a
    limit rather than a complaint. Photographs cannot create a moral position; they can reinforce
    one and can help build a nascent one. An image bringing news of an unsuspected zone of misery
    cannot make a dent in public opinion unless an appropriate context of feeling and attitude
    already exists, and what determines the possibility of being affected morally is the existence
    of a relevant political consciousness — without one, such photographs are most likely experienced
    as simply unreal, or as a demoralising blow. She puts the point at its sharpest as a claim about
    order: it is never photographic evidence that constructs, or more properly identifies, an event;
    the contribution of photography always follows the naming of the event. Her demonstrations are
    comparative: battlefield photographs that did not reduce enthusiasm for continuing the war;
    prison-camp photographs that inflamed opinion against the other side rather than against the
    practice; internment photographs of 1942 read as a crime only by viewers who had arrived at a
    political understanding two decades later.
