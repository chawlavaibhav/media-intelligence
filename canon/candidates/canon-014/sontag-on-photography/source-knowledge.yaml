- sk_id: sk_snt_0003
  source_id: sontag-on-photography
  source_terms:
    - "a photograph is not only an image (as a painting is an image), an interpretation of the real; it is also a trace, something directly stenciled off the real, like a footprint or a death mask"
    - "a photograph is never less than the registering of an emanation (light waves reflected by objects)—a material vestige of its subject in a way that no painting can be"
    - "Having a photograph of Shakespeare would be like having a nail from the True Cross"
    - "it revives—in wholly secular terms—something like the primitive status of images"
  concept_label: the_authority_comes_from_the_photograph_being_a_trace_not_from_its_accuracy
  label_origin: extractor_assigned
  claim: >
    Sontag locates photographic authority in something other than resemblance. A painting, however
    exact, is never more than the stating of an interpretation; a photograph is never less than the
    registering of an emanation — light reflected by objects — and is therefore a material vestige of
    its subject in a way no painting can be. It is a trace, stencilled off the real like a footprint
    or a death mask. Her thought experiment isolates the point: offered a hypothetical Holbein
    portrait of Shakespeare or a hypothetical photograph of him, most would take the photograph, and
    not merely because it would show what he looked like — even a faded, barely legible brown shadow
    would be preferred, because having it would be like having a nail from the True Cross. The
    authority is relic-like, and she says photography revives in wholly secular terms something like
    the primitive status of images, in which the thing and its image were two manifestations of one
    energy.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Because light from the subject physically produced the image, the image stands in a causal
      relation to the subject that no depiction has. What is credited is that causal link, not the
      likeness — which is why a degraded photograph retains the authority a perfect painting never
      acquires.
  scope:
    domain_discussed_by_source: [photography, painting, image_theory]
    conditions: "images understood by their viewers to have been produced by light from the subject"
  caveats:
    - text: >
        The whole claim is conditional on the viewer believing in the causal link. Sontag does not
        examine that condition, because in 1977 an image that looked photographic had one. The
        premise is recorded here as she relies on it, and this lane asserts nothing about whether it
        holds now.
      origin: extractor_observed
    - text: >
        Argued by analogy — footprint, death mask, relic — rather than demonstrated. She is
        establishing a distinction in kind, not measuring how much authority anything carries.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies: []
  examples:
    positive:
      - {description: "a hypothetical choice between a painted and a photographed portrait of Shakespeare, in which the faded photograph is argued to be preferred", figure_ref: null}
      - {description: "a nineteenth-century novelist's reported dread that each exposure used up a layer of the sitter's body", figure_ref: null}
  intra_source_relations:
