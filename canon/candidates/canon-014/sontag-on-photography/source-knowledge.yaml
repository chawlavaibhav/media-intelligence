- sk_id: sk_snt_0013
  source_id: sontag-on-photography
  source_terms:
    - "the aestheticizing tendency of photography is such that the medium which conveys distress ends by neutralizing it"
    - "Cameras miniaturize experience, transform history into spectacle"
    - "As much as they create sympathy, photographs cut sympathy, distance the emotions"
    - "Photography's realism creates a confusion about the real which is (in the long run) analgesic morally"
    - "the whole world becomes a department store or museum-without-walls in which every subject is depreciated into an article of consumption"
  concept_label: aestheticisation_neutralises_the_distress_the_image_conveys
  label_origin: extractor_assigned
  claim: >
    Sontag's most consequential claim about aestheticisation is that it works against the effect the
    image was made to have. Protected inhabitants of the more affluent parts of the world learn about
    the world's horrors mainly through the camera, and photographs can and do distress — but the
    aestheticising tendency is such that the medium which conveys distress ends by neutralising it.
    She gives two routes. Cameras miniaturise experience and transform history into spectacle; and
    as much as they create sympathy, photographs also cut sympathy and distance the emotions,
    producing a realism about the real that is in the long run morally analgesic while remaining
    sensorially stimulating. She insists this holds for the most well-intentioned and properly
    captioned work, which is the part that matters: intention and accuracy do not exempt an image
    from the tendency. Her wider version is that photography converts the world into a department
    store or a museum without walls, in which every subject is depreciated into an article of
    consumption and promoted into an item for aesthetic appreciation.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The same operation that makes suffering visible at a distance also makes it small, framed and
      available for appreciation. Because sympathy and appreciation are different relations to a
      subject, moving the viewer into the second displaces the first rather than adding to it.
  scope:
    domain_discussed_by_source: [photojournalism, documentary_photography, photography, consumer_culture]
    conditions: "viewers at a distance from what is depicted, in an affluent image-consuming culture of the 1970s"
  caveats:
