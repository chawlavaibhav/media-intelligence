- sk_id: sk_snt_0012
  source_id: sontag-on-photography
  source_terms:
    - "Photographs create the beautiful and—over generations of picture-taking—use it up"
    - "The image-surfeited are likely to find sunsets corny; they now look, alas, too much like photographs"
    - "photographic seeing has to be constantly renewed with new shocks, whether of subject matter or technique, so as to produce the impression of violating ordinary vision"
    - "What it once took a very intelligent eye to see, anyone can see now"
    - "Increased familiarity does not entirely explain why certain conventions of beauty get used up while others remain. The attrition is moral as well as perceptual"
  concept_label: photographs_establish_conventions_of_beauty_and_then_exhaust_them
  label_origin: extractor_assigned
  claim: >
    Sontag describes a cycle in which the medium consumes its own achievements. Photographs create
    the beautiful and, over generations of picture-taking, use it up; certain glories of nature have
    been all but abandoned to amateur attention, and the image-surfeited find sunsets corny because
    they now look too much like photographs. The mechanism she gives is assimilation rather than mere
    boredom: challenged by the revelations of photographers, seeing accommodates to photographs, so
    photographic seeing has to be constantly renewed with new shocks — of subject matter or of
    technique — in order to keep producing the impression of violating ordinary vision. Her worked
    case is a generation of close-up studies of plants, shells, leaves, weathered wood and workers'
    hands that became clichés of a merely photographic way of seeing: what once took a very
    intelligent eye to see, anyone can see now. She adds a qualification against her own tidiness —
    increased familiarity does not entirely explain why some conventions get used up while others
    remain, and the attrition is moral as well as perceptual.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A way of seeing is startling only against a habit it violates. Successful images become the
      habit, so each success removes the condition that made it work, and the next attempt must
      violate a habit that now includes its predecessor.
  scope:
    domain_discussed_by_source: [photography, art_criticism]
    conditions: "conventions of beauty in a culture saturated with images, over generations"
  caveats:
