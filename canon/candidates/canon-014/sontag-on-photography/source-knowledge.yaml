  concept_label: photographic_seeing_is_a_habit_of_treating_the_world_as_potential_photographs
  label_origin: extractor_assigned
  claim: >
    Sontag names as an acquired habit what is usually treated as heightened perception. Photographic
    seeing is both a new way of seeing and a new activity to perform, and its content is the mentality
    that looks at the world as a set of potential photographs. She grants what it delivers: an
    aptitude for discovering beauty in what everybody sees but neglects as too ordinary, and — because
    cameras record anything quickly — a freedom from having to make narrow choices about what is
    worth contemplating. She also states its cost, and states it against the photographers who
    claimed the opposite: contrary to their assertions, the habit of looking at reality as an array
    of potential photographs creates estrangement from rather than union with what is seen, and what
    it amounts to on examination is a kind of dissociative seeing. Her closing formulation reverses
    a nineteenth-century line about everything existing to end in a book: today everything exists to
    end in a photograph.
