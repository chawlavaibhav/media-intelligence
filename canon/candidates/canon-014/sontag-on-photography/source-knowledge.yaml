- sk_id: sk_snt_0014
  source_id: sontag-on-photography
  source_terms:
    - "Photographs shock insofar as they show something novel. Unfortunately, the ante keeps getting raised—partly through the very proliferation of such images of horror"
    - "The shock of photographed atrocities wears off with repeated viewings"
    - "Images transfix. Images anesthetize"
    - "making the horrible seem more ordinary—making it appear familiar, remote ('it's only a photograph'), inevitable"
    - "In these last decades, 'concerned' photography has done at least as much to deaden conscience as to arouse it"
  concept_label: repeated_exposure_blunts_the_response_and_the_threshold_keeps_rising
  label_origin: extractor_assigned
  claim: >
    Sontag's account of attrition has two parts and the second is what makes it a mechanism rather
    than an observation. First, photographs shock insofar as they show something novel, and the
    shock of photographed atrocity wears off with repeated viewing — she puts it beside pornography,
    where the surprise of the first encounter also wears off. Second, the threshold rises, and it
    rises partly through the very proliferation of the images: a vast catalogue of misery has given
    everyone a familiarity with atrocity that makes the horrible seem ordinary, familiar, remote —
    "it's only a photograph" — and inevitable. Her strongest formulation is that images transfix and
    images anaesthetise, and that an event known through photographs becomes more real than it would
    otherwise have been and then, after repeated exposure, becomes less real. Her example is a
    comparison of two famine reportages a generation apart, the later having less impact for some
    viewers because the images had become banal. Her conclusion is that in recent decades concerned
    photography has done at least as much to deaden conscience as to arouse it.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Response is a function of novelty, and every image spends some of the novelty available to the
      images that follow it. Because the supply of images is not limited, the stock of novelty is
