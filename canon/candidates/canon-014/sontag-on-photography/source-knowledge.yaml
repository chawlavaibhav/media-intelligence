- sk_id: sk_snt_0005
  source_id: sontag-on-photography
  source_terms:
    - "The news that the camera could lie made getting photographed much more popular"
    - "People want the idealized image: a photograph of themselves looking their best"
    - "They feel rebuked when the camera doesn't return an image of themselves as more attractive than they really are"
    - "That photographs are often praised for their candor, their honesty, indicates that most photographs, of course, are not candid"
  concept_label: knowing_the_camera_can_lie_increased_rather_than_reduced_the_appetite
  label_origin: extractor_assigned
  claim: >
    Sontag reports a reception effect that runs against the intuitive one. When retouching became
    known in the 1850s, the news that the camera could lie made getting photographed much more
    popular — not less. Her explanation is about what people want from the image: they want the
    idealised picture, themselves looking their best, and they feel rebuked when the camera does not
    return an image of themselves as more attractive than they really are. She adds a corollary that
    works as an inference rule: the fact that photographs are often praised for their candour and
    honesty indicates that most photographs are not candid, since a property is only remarked on
    where it is not the default.
  claim_type: source_interpretation
  interpretation_basis: >
    Sontag states the fact — the news that the camera could lie made getting photographed much more
    popular — and states, in the immediately preceding paragraph, that people want the idealised
    image and feel rebuked when the camera does not flatter them. She does NOT connect the two. The
    causal joining is the EXTRACTOR'S: that the appetite rose because a demonstrated capacity to
    depart from accuracy is a capability when the wanted outcome is flattery. The basis is adjacency
    and subject matter within a single passage, which is weaker than an argument, and the object is
    typed source_interpretation for that reason.
  mechanism:
    stated_by_source: false
    text: >
      EXTRACTOR'S RECONSTRUCTION, NOT THE SOURCE'S: the demand for portraits is not primarily a
      demand for accuracy, so a demonstrated capacity to depart from accuracy reads as a capability
      rather than a defect.
  scope:
    domain_discussed_by_source: [portrait_photography, photography, fashion_photography]
    conditions: "images of the viewer or of people the viewer knows; mid-nineteenth-century onward in her account"
  caveats:
    - text: >
        A historical claim about a specific decade, offered without a source. Its interest lies in
        the direction of the effect, which is the opposite of what a straightforward account of
        trust would predict.
      origin: extractor_observed
    - text: >
        Scoped by her to portraits, where the subject is also the audience. She does not extend it to
        photographs of events, and nor does this lane.
      origin: extractor_observed
  source_stated_problems:
    - "They feel rebuked when the camera doesn't return an image of themselves as more attractive than they really are"
  source_stated_remedies: []
  examples:
