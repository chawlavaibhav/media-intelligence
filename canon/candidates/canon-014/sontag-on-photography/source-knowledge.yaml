- sk_id: sk_snt_0022
  source_id: sontag-on-photography
  source_terms:
    - "photographs, rather than the world, have become the standard of the beautiful"
    - "We learn to see ourselves photographically: to regard oneself as attractive is, precisely, to judge that one would look good in a photograph"
    - "Instead of just recording reality, photographs have become the norm for the way things appear to us, thereby changing the very idea of reality, and of realism"
    - "It is reality which is scrutinized, and evaluated, for its fidelity to photographs"
    - "reality has come to seem more and more like what we are shown by cameras"
  concept_label: photographs_became_the_standard_against_which_reality_is_measured
  label_origin: extractor_assigned
  claim: >
    Sontag describes a reversal in which the copy becomes the measure of the original. So successful
    has the camera been at beautifying the world that photographs, rather than the world, have become
    the standard of the beautiful — and the reversal reaches the self: we learn to see ourselves
    photographically, so that to regard oneself as attractive is precisely to judge that one would
    look good in a photograph. Generalised, the claim is that instead of just recording reality
    photographs have become the norm for the way things appear to us, changing the very idea of
    reality and of realism, so that it is reality which is scrutinised and evaluated for its fidelity
    to photographs. She reports the same movement in ordinary speech: people describe a violent
    event they were caught up in by saying it seemed like a movie, and she notes that this is said
    not to diminish the event but because other descriptions seem insufficient — it is how they
    explain how real it was.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: >
      EXTRACTOR'S RECONSTRUCTION, NOT THE SOURCE'S: judgements need a reference and take whatever is
      most available for comparison, so where images are more available than the occasions they
      depict the image becomes the reference. Sontag asserts the reversal repeatedly and does not
      explain it.
  scope:
    domain_discussed_by_source: [photography, consumer_culture, realism, self_presentation]
    conditions: "an image-saturated culture; explicitly industrialised societies in her account"
  caveats:
    - text: >
        She marks the boundary of the claim herself and it is important: she says that in some
        non-industrialised countries people still felt apprehensive at being photographed, sensing a
        trespass, whereas people in industrialised countries seek to have their photographs taken and
        feel they are made real by them. Her claim is scoped to the second case.
      origin: source_stated
    - text: >
        A supporting quotation from a novelist of 1901 — that you cannot claim to have really seen
        something until you have photographed it — is one writer's remark carrying a general claim.
      origin: extractor_observed
    - text: >
        The premise is 1977: an abundance of photographic images relative to first-hand occasions.
        Recorded as she states it, with no claim by this lane about any other condition.
      origin: extractor_observed
