- sk_id: sk_snt_0011
  source_id: sontag-on-photography
  source_terms:
    - "Nobody ever discovered ugliness through photographs. But many, through photographs, have discovered beauty"
    - "the most enduring triumph of photography has been its aptitude for discovering beauty in the humble, the inane, the decrepit. At the very least, the real has a pathos. And that pathos is—beauty"
    - "is now incapable of photographing a tenement or a rubbish-heap without transfiguring it"
    - "notwithstanding the declared aims of indiscreet, unposed, often harsh photography to reveal truth, not beauty, photography still beautifies"
  concept_label: the_medium_beautifies_whatever_it_records_including_what_is_not_beautiful
  label_origin: extractor_assigned
  claim: >
    Sontag's claim about beautification is that it is a property of the medium rather than of the
    photographer's intention, and therefore not escapable by intending otherwise. Nobody ever
    discovered ugliness through photographs; many discovered beauty. She quotes Benjamin's 1934
    statement that the camera is by then incapable of photographing a tenement or a rubbish-heap
    without transfiguring it, and that it has succeeded in turning abject poverty itself, handled in
    a modish and technically perfect way, into an object of enjoyment. Her own version is stronger
    because it covers the work that sets out to refuse beauty: notwithstanding the declared aims of
    indiscreet, unposed, often harsh photography to reveal truth and not beauty, photography still
    beautifies. And she gives the route by which it does so where the subject offers no beauty to
    find — the real has a pathos, and that pathos is beauty.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Where the subject offers no beauty to be found, one is supplied by the medium's own resources:
      the real has a pathos, and that pathos is beauty. Sontag adds that aesthetic distance is built
      into the very experience of looking at photographs, if not immediately then certainly with the
      passage of time.
  scope:
    domain_discussed_by_source: [photography, photojournalism, documentary_photography, art_criticism]
    conditions: "Western image culture as of the 1970s; any photograph considered as an object of attention"
  caveats:
