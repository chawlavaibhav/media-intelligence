- sk_id: sk_snt_0017
  source_id: sontag-on-photography
  source_terms:
    - "Photographs may be more memorable than moving images, because they are a neat slice of time, not a flow"
    - "Television is a stream of underselected images, each of which cancels its predecessor. Each still photograph is a privileged moment, turned into a slim object that one can keep and look at again"
    - "The force of a photograph is that it keeps open to scrutiny instants which the normal flow of time immediately replaces"
    - "the movie condenses something that takes hours to a few minutes ... the camera looks for me—and obliges me to look, leaving as my only option not to look"
  concept_label: a_still_holds_a_moment_open_where_a_flow_cancels_each_image_with_the_next
  label_origin: extractor_assigned
  claim: >
    Sontag distinguishes the still from the moving image by what each does to the viewer's time. A
    photograph is a neat slice of time rather than a flow, which is why she thinks stills may be
    more memorable: a stream of underselected images cancels each predecessor with its successor,
    whereas a still is a privileged moment turned into a slim object that can be kept and looked at
    again. Its force is that it keeps open to scrutiny instants which the normal flow of time
    immediately replaces. She develops the difference into a claim about agency, drawing on her own
    account of the same procedure watched in person and on film: in the room she was the one who
    changed focus and made the close-ups, while on film the camera had already looked for her and
    obliged her to look, leaving as her only option not to look — and the sequence had been
    condensed and arranged to stir or shock. She adds the cost of the still's stasis: the truths
    rendered in a dissociated moment, however decisive, have a very narrow relation to the needs of
    understanding.
  claim_type: source_interpretation
  interpretation_basis: >
    Every component is Sontag's, from three separated passages: the still-versus-stream contrast in
    "In Plato's Cave"; the account, in the same essay, of a book of photographs whose order is
    proposed by the pages but whose viewing time nothing enforces, against a film that imposes both;
    and the first-person account in "The Image-World" of the same procedure watched in person and on
    film, where the camera has already looked for her and leaves as her only option not to look. What
    is the EXTRACTOR'S is the claim that ONE variable — who controls the duration of looking —
    accounts for all three. Sontag never names that variable or presents the passages as one
    argument, and the third is in a different essay written about a different subject. The
    unification is ours and is typed accordingly.
  mechanism:
    stated_by_source: false
    text: >
      EXTRACTOR'S RECONSTRUCTION, NOT THE SOURCE'S: duration is controlled by the artefact in a flow
      and by the viewer in a still, so attention can return and accumulate in the second case and is
      displaced before examination in the first.
  scope:
    domain_discussed_by_source: [photography, television, film]
    conditions: "the still and moving media of the 1970s as she describes them"
  caveats:
    - text: >
        "May be more memorable" is her hedge and it is kept. She offers no comparison beyond her own
        contrast and one first-person account.
      origin: source_stated
    - text: >
        Her description of television as a stream of underselected images that cancel one another is
        a claim about broadcast television as she encountered it in the 1970s. The premise is
        recorded as she states it and this lane says nothing about any other arrangement.
      origin: extractor_observed
    - text: >
        The stasis she credits with force is the same stasis she elsewhere says has a very narrow
        relation to understanding. Both statements are hers and neither is dropped.
      origin: source_stated
  source_stated_problems:
    - "a stream of underselected images, each of which cancels its predecessor"
    - "the truths that can be rendered in a dissociated moment ... have a very narrow relation to the needs of understanding"
  source_stated_remedies: []
