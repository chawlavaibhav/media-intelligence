- sk_id: sk_snt_0009
  source_id: sontag-on-photography
  source_terms:
    - "But photographs do not explain; they acknowledge"
    - "Strictly speaking, one never understands anything from a photograph"
    - "the camera's rendering of reality must always hide more than it discloses"
    - "In contrast to the amorous relation, which is based on how something looks, understanding is based on how it functions. And functioning takes place in time, and must be explained in time. Only that which narrates can make us understand"
    - "a photograph of the Krupp works reveals virtually nothing about that organization"
  concept_label: photographs_acknowledge_but_cannot_explain_because_explanation_takes_time
  label_origin: extractor_assigned
  claim: >
    Sontag draws a hard limit on what an image can deliver, and gives a reason rather than an
    assertion. Photographs do not explain; they acknowledge. Strictly speaking one never understands
    anything from a photograph, because the camera's rendering of reality must always hide more than
    it discloses. The reason is about the form of understanding itself: an amorous relation is based
    on how something looks, but understanding is based on how something functions, functioning takes
    place in time and must be explained in time, and therefore only that which narrates can make us
    understand. She takes Brecht's example — a photograph of a great armaments works reveals
    virtually nothing about that organisation — and generalises it. Photographs do fill blanks in
    a mental picture, and she concedes the case: images of nineteenth-century urban squalor are
    sharply instructive to someone who did not know it was that bad. Filling a blank is not
    explaining.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Understanding is knowledge of how something functions, and function is extended in time. A
      photograph is a slice of time, so the object of understanding is not present in it at all —
      not insufficiently present, but absent in kind.
  scope:
    domain_discussed_by_source: [photography, journalism, politics, education]
    conditions: "still photographs considered as a source of knowledge about what they depict"
  caveats:
