- sk_id: sk_snt_0001
  source_id: sontag-on-photography
  source_terms:
    - "Photographs furnish evidence"
    - "A photograph passes for incontrovertible proof that a given thing happened"
    - "The picture may distort; but there is always a presumption that something exists, or did exist, which is like what's in the picture"
    - "Photographed images do not seem to be statements about the world so much as pieces of it, miniatures of reality that anyone can make or acquire"
    - "a photograph—any photograph—seems to have a more innocent, and therefore more accurate, relation to visible reality than do other mimetic objects"
  concept_label: a_photograph_is_received_as_a_piece_of_the_world_not_a_statement_about_it
  label_origin: extractor_assigned
  claim: >
    Sontag's account of photographic authority begins with a difference in how the thing is
    received. What is written about a person or an event is frankly an interpretation, and so are
    handmade images such as paintings and drawings; a photograph is not received that way. It is
    taken as a piece of the world rather than a statement about it — a miniature of reality — and
    from that follows the presumption that something existed which is like what is in the picture.
    She is precise that the presumption survives distortion: the picture may distort, and the
    presumption holds anyway. She also insists the presumption is indifferent to the maker's
    competence or ambition — any photograph, amateur or virtuoso, seems to have a more innocent and
    therefore more accurate relation to visible reality than other made images do.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: false
    text: >
      EXTRACTOR'S RECONSTRUCTION, NOT THE SOURCE'S: a drawing announces a hand between the world and
      the viewer and a photograph does not, so the image is filed as a specimen rather than as
      testimony. Sontag states the difference in reception and does not state this account of it.
  scope:
    domain_discussed_by_source: [photography, journalism, policing, family_photography, art_criticism]
    conditions: "Western image culture as of the mid-1970s; images assumed to be photographic in origin"
  caveats:
    - text: >
        This is criticism, not a finding about viewers. Sontag reports how photographs are received
        in the culture she is describing; no study, survey or measurement supports it anywhere in the
        book.
      origin: extractor_observed
    - text: >
        The claim is stated within a premise she does not examine because in 1977 it did not need
        examining: that an image which looks photographic was made by a camera pointed at something.
        The premise is recorded here as she relies on it. This lane says nothing about whether it
        holds now, because it has no source for that.
      origin: extractor_observed
    - text: >
        She immediately qualifies the innocence: photographs are as much an interpretation of the
        world as paintings and drawings are. The two statements are both hers and the tension between
        them is the subject of sk_snt_0002.
      origin: source_stated
  source_stated_problems:
    - "A photograph passes for incontrovertible proof"
  source_stated_remedies: []
  examples:
    positive:
      - {description: "photographs adopted as a tool of state surveillance and control from the 1870s onward, cited as the incriminating use of the record", figure_ref: null}
      - {description: "documents held to be invalid without a photograph-token of the citizen's face affixed to them", figure_ref: null}
  intra_source_relations:
