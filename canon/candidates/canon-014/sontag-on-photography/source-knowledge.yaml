# SourceKnowledge — Susan Sontag, "On Photography" (Picador/FSG; essays 1973-77, book 1977).
# source_id: sontag-on-photography
# EXPERIMENTAL — NOT LIVE CANON.
#
# LOCATORS: EPUB, reflowable. NO AUTHORED PAGE NUMBERS. page_start/page_end are null everywhere.
# Locators are the essay title plus a short distinguishing phrase for the passage, with "(spine n)"
# as a file-position aid. No page number was used or invented.
#
# WHAT THIS BOOK IS: six essays of cultural and moral criticism about what photographs do to the
# people who look at them. It is NOT instructional and is NOT extracted as though it were. It
# contains no method, no procedure and — with two heavily qualified exceptions recorded in
# ontology-mappings.yaml — no remedy of any kind.
#
# THE HARD RULE, STATED ONCE AND ENFORCED THROUGHOUT: no critical observation here is converted into
# production advice. Sontag observing that photography beautifies whatever it records is NOT recorded
# as a reason to avoid a composition, and nothing below tells anyone how to make anything. Every
# claim is about how photographs are READ. See EXTRACTION-NOTES.md §4 for how this was enforced and
# checked.
#
# EVIDENCE: this is argument by accumulation and allusion, not by proposition. There is no study, no
# measurement, no survey and no controlled comparison anywhere in the book.
# empirical_within_source appears on NO object in this lane. The dominant characteristics are
# explicitly_stated, argued, historical_claim and culturally_bounded.
#
# DATE: 1977. Film, scarce images, the family album, the picture magazine, an explicitly Western
# image culture. Every premise is recorded AS SHE STATES IT. Where a premise is visibly of its
# moment the contingency is noted in an extractor_observed caveat that says what she assumes — and
# never what is now true instead, because this lane has no source for that.

