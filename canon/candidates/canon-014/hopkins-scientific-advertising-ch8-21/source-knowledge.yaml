        not stated beyond calling them "a few average towns", and "average" is never defined against
        anything. No duration is given for the test itself, only the payback periods being measured.
        Nothing is said to be held constant. No control or comparison town is required by the
        procedure as described — the test measures absolute levels, and only the paired-town designs
