  concept_label: the_featured_claim_is_chosen_by_the_share_of_readers_it_can_reach
  label_origin: extractor_assigned
  claim: >
    The claim an advertisement features should be selected by the proportion of readers it can reach,
    because every reader it cannot reach is paid-for circulation wasted. The worked case is a relief
    for asthma: if a canvass showed sufferers to be one in a hundred, the advertiser must cover a
    hundred useless readers to reach one, and his cost of results might run twenty times as high as
    for an article appealing to one in five — an excess the source says would probably mean disaster.
    The source then gives the allocation rule for claims that are neither dominant nor negligible: a
