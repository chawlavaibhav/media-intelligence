- sk_id: sk_sa8_0006
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "Not only in picturing the collar or the clothes, but in picturing men whom others envy, in surroundings which others covet."
    - "The pictures subtly suggest that these articles of apparel will aid men to those desired positions."
    - "Picturing men in high positions or taking upward steps forms a very convincing argument."
    - "But there is a great advantage in including a fascinated man. Women desire beauty largely because of men."
  concept_label: pictures_pay_where_they_depict_the_condition_the_buyer_covets
  label_origin: extractor_assigned
  claim: >
    Where pictures do pay, the source says they pay by depicting the condition the buyer wants to
    reach rather than the article for sale, so that the picture carries the implication that the
    article delivers that condition. The cases given are apparel (men others envy, in surroundings
    others covet), correspondence schools (men in high positions or taking upward steps), and beauty
    articles (beautiful women, admired and attractive) — with the added instruction to show the
    beauty being used to its effect on a fascinated man, on the stated ground that women desire
    beauty largely because of men.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The picture works by subtle suggestion rather than description: showing the desired position
      alongside the article implies that the article is a route to it. This is an argument, made
      pictorially, and that is why it can beat type.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: >
      Lines whose purchase is motivated by a social position or appearance the buyer wants —
      apparel, correspondence courses, beauty articles. The source explicitly separates these from
      lines where the article itself should be pictured.
  caveats:
    - text: >
        Only the correspondence-school case is said to rest on measurement — "Theirs is traced
        advertising" — and even there no return is reported. Measurement asserted, result withheld.
        The apparel and beauty cases are asserted outright.
      origin: extractor_observed
    - text: >
        `culturally_bounded`. The beauty instruction encodes a specific 1923 account of what women
        want and why, stated by the source as fact. It is recorded here because it is what the source
        holds and because it is the reasoning behind a concrete visual instruction — not because this
        lane finds it true or transferable.
      origin: extractor_observed
    - text: >
        This is the clearest counter to reading Hopkins as anti-picture. His objection is to pictures
        that carry no argument, not to pictures. Extraction that reported only sk_sa8_0005 would
        misrepresent the chapter.
      origin: extractor_observed
  source_stated_problems: []
  source_stated_remedies:
    - "picturing men whom others envy, in surroundings which others covet"
    - "show them using their beauty, as women do use it, to gain maximum effect"
  examples:
    positive:
      - {description: "Arrow Collars and clothing advertising, where pictures are said to have proved most convincing", figure_ref: null}
      - {description: "correspondence schools picturing men in high positions or taking upward steps", figure_ref: null}
  intra_source_relations:
