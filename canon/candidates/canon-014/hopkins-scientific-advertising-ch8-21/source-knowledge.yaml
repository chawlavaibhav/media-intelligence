  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The economics of a campaign are a small number of per-customer quantities — acquisition cost,
      repeat rate, purchase volume, payback period — and each can be observed on a few thousand
      customers as well as on a few million. Measuring them small converts a national commitment into
      an arithmetic extrapolation.
  scope:
    domain_discussed_by_source: [advertising, testing_method]
    conditions: "repeat-purchase consumer products where a sample can start usage and repeat buying can be observed"
