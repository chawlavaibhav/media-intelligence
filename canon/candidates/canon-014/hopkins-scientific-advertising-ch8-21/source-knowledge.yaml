  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Running the challenger in parallel decouples the search for improvement from the risk of losing
      the current result, so the cost of trying a plan is the test's cost rather than the campaign's
      exposure. That makes a long sequence of attempts affordable.
