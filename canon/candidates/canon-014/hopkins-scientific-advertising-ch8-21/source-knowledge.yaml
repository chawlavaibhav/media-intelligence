- sk_id: sk_sa8_0033
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "Almost any question can be answered, cheaply, quickly and finally, by a test campaign. And that's the way to answer them—not by arguments around a table. Go to the court of last resort—the buyers of your product."
    - "Perhaps we try out our project in four or five towns. We may use a sample offer or a free package to get users started quickly. We learn in this way the cost per customer started."
    - "Then we wait and see if users buy those samples. If they do, will they continue? How much will they buy? How long does it take for the profit to return our cost of selling?"
    - "A test like this may cost $3,000 to $5,000. It is not all lost, even when the product proves unpopular. Some sales are made. Nearly every test will in time bring back the entire cost."
    - "On another product it may take three months to bring back the cost with a profit."
  concept_label: the_test_campaign_procedure_and_the_five_questions_it_is_built_to_answer
  label_origin: extractor_assigned
  claim: >
    The source specifies a test campaign as a defined procedure. Scale: four or five towns. Method of
    starting: a sample offer or free package, used to get users started quickly. First measure: cost
    per customer started. The remaining measures are taken over time and are stated as a fixed
    sequence of questions — do users buy after the sample, will they continue, how much will they buy,
    and how long does it take for profit to return the cost of selling. Cost of the exercise is put at
    $3,000 to $5,000, and the source argues the true cost is far less because some sales are made
    even on an unpopular product and nearly every test will in time bring back its entire cost.
    Payback period is the output that determines how the national campaign must be financed: on some
    products the advertising cost returns before the bills are due, which means the product can be
    advertised without investment; on others it may take three months, and the advertiser must finance
    accordingly when he spreads out.
