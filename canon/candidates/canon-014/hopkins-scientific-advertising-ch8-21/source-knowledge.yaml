  label_origin: extractor_assigned
  claim: >
    Expenditure aimed at dealers is mostly measured at the wrong level. Extra discounts, loading
    offers and window displays can visibly move trade to the dealer who receives them without
    increasing the advertiser's total sales at all, because they redistribute demand between stores
    rather than creating it. The source puts a number on the loading case: one extra case free with
    ten means the advertising must sell 10 per cent more to produce the same return, and the dealer
    would probably have bought just as much anyway. Its position is that the advertiser has no
    interest in centring trade at any particular store, that this money would be better spent
    securing new consumers, and that the question is settled by comparing TOTAL sales across matched
    towns — try one town one way, one another — with the expectation that in many lines such tests
    show costly displays to be worthless. A growing number of experienced advertisers, it reports,
    spend nothing on displays.
