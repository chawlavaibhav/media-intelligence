- sk_id: sk_sa8_0002
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "They learn their appealing claims by tests—by comparing results from various headlines."
    - "Gradually they accumulate a list of claims important enough to use. All those claims appear in every ad thereafter."
    - "in usual lines a number of claims appeal to a large percentage. Then present those claims in every ad for their effect on that percentage."
  concept_label: claims_are_qualified_by_headline_testing_then_all_of_them_run_permanently
  label_origin: extractor_assigned
  claim: >
    The set of claims an advertisement carries is built by a two-stage procedure: claims are first
    qualified individually by comparing results from various headlines, and the ones that prove
    important enough are then added to a standing list which appears in every advertisement
    thereafter. Testing selects the members; it does not select one winner to run alone. The source
    frames this as what the best advertisers do, and as the reason their advertisements stop
    changing.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Different facts convince different people, so a claim that loses a headline comparison can
      still be the fact that converts a share of readers once they are reading. Headline testing
      measures pulling power; the standing list preserves converting power.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "'in usual lines' — lines where several claims appeal to a large percentage of readers"
  caveats:
    - text: >
        Measurement asserted, result withheld. The chapter states that the best advertisers learn
        their claims by comparing headline results and gives not one comparison, product, figure or
        margin.
      origin: extractor_observed
    - text: >
        EXTENDS the live objects sk_hop_sa_0033 (`changing_only_the_headline_can_multiply_returns`)
        and sk_hop_sa_0034 (`run_many_appeals_in_parallel_because_a_weaker_appeal_can_still_pay`),
        both from chapter 5. Chapter 5 establishes that headlines are tested and that weaker appeals
        can still pay in parallel. What chapter 8 adds — and the reason this object exists — is the
        resolution between them: the parallel appeals are not separate advertisements but co-resident
        claims inside one permanent advertisement.
      origin: extractor_observed
    - text: >
        No stopping rule is given. "Gradually they accumulate a list of claims important enough to
        use" leaves the threshold for "important enough" undefined, which is the decision the
        procedure actually turns on.
      origin: extractor_observed
  source_stated_problems:
    - "Omit any one and a certain percentage will lose the fact which might convince."
  source_stated_remedies:
    - "All those claims appear in every ad thereafter."
  examples:
    positive:
      - {description: "advertisers who never change their advertisements at all; single mail order advertisements running year after year without diminishing returns", figure_ref: null}
  intra_source_relations:
    - {relation: qualifies, target: sk_sa8_0001, note: "supplies the selection procedure the full-story rule leaves open"}
