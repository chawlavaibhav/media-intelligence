# Claude C. Hopkins, "Scientific Advertising" (1923), chapters 8-21 (printed pp. 25-64).
# SPEC-03 SourceKnowledge objects.
#
# EXPERIMENTAL — NOT LIVE CANON. Lane: canon/experimental/book-expansion-qa-v1/.
#
# SCOPE EXTENSION, NOT AN INDEPENDENT ORIGIN. Chapters 1-7 of this same book are live Canon as
# `hopkins_scientific_advertising_ch1_7`. Same work, same author, same volume. Nothing here may
# ever be counted as a second source agreeing with that one. Where an object extends, qualifies or
# supplies evidence for a live object, its caveats name the live sk_ id explicitly.
#
# EVIDENCE DISCIPLINE, governing the whole file: the source calls itself scientific, exact and
# proved. Those are recorded as the source's claims. `empirical_within_source` appears ONLY where
# Hopkins reports what a measurement returned. `outcome_claimed` appears where a result is asserted
# without controls. Where he asserts that measurement happened and withholds the return, the caveat
# says "measurement asserted, result withheld" in those words.
#
# VISUAL: printed pp. 25-64 contain zero figures. No object is visually demonstrated. The audit
# pattern `source_evidence_never_printed` applies throughout: Hopkins argues from advertisements
# the book never reproduces, and in chapter 9 tells the reader to go and look at advertisements the
# book does not contain. Not digitisation loss — a 1923 reader was in the same position.
#
# HISTORICAL SCOPE: this is 1923 print, coupon, mail-order, sampling and dealer-distribution
# practice. `historical_claim` and `culturally_bounded` are used where the claim is about what was
# true then or is scoped to that period. No claim here is translated into a modern digital
# equivalent; the source does not support that and this lane is not authorised to do it.

