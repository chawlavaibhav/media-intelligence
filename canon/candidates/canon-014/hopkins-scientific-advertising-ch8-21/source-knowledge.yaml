- sk_id: sk_sa8_0004
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "Note that brief ads are never keyed. Note that every traced ad tells a complete story, though it takes columns to tell."
    - "Never be guided in any way by ads which are untraced."
    - "Never be led in new paths by the blind."
    - "Take the opinion of nobody, the verdict of nobody, who knows nothing about his returns."
  concept_label: evidence_from_anyone_who_does_not_know_his_returns_is_inadmissible
  label_origin: extractor_assigned
  claim: >
    The source states an admissibility rule for advertising evidence: an untraced advertisement may
    not be used as a guide in any way, and the opinion or verdict of anyone who does not know his own
    returns is to be given no weight whatever. The supporting observation offered is a claimed
    correlation — brief advertisements are never keyed, and every traced advertisement tells a
    complete story — which is used to argue that the practice of the measured population differs
    systematically from the practice of the unmeasured one.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      An advertiser who cannot see his returns has no way to have learned anything from them, so his
      practice records only his preferences. Copying it transmits preference while appearing to
      transmit experience.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "any decision about advertising practice justified by pointing at existing advertising"
  caveats:
    - text: >
        Measurement asserted, result withheld — and here it is the load-bearing observation. "Brief
        ads are never keyed" and "every traced ad tells a complete story" are absolutes about a
        population the reader cannot inspect. No sample, no count, no list of keyed advertisements is
        given, and the book reproduces no advertisement of either kind.
      origin: extractor_observed
    - text: >
        The rule is self-serving in a way the source does not acknowledge: it disqualifies every
        critic who lacks the author's own instrumentation, and the author's own returns are equally
        unavailable to the reader. Applied consistently it would disqualify the book.
      origin: extractor_observed
    - text: >
        Near-neighbour, kept distinct: the live object sk_hop_sa_0029
        (`long_running_mail_order_advertisements_are_proved_models`) says which advertisements to
        imitate. This object states the complementary prohibition — which advertisements may not be
        cited at all — and is a rule about evidence rather than about models.
      origin: extractor_observed
  source_stated_problems:
    - "ads which are untraced"
    - "some uninformed advertiser considers that something right"
  source_stated_remedies:
    - "Apply to your advertising ordinary common sense."
    - "Take the opinion of nobody, the verdict of nobody, who knows nothing about his returns."
