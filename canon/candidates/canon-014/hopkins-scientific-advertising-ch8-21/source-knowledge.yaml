  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A dealer's effort operates on which store a buyer uses, not on whether the purchase happens.
      Any measurement taken at the dealer therefore records a redistribution as if it were a gain,
      and only a total taken across a whole town can distinguish them.
  scope:
    domain_discussed_by_source: [advertising, evaluation_diagnosis]
    conditions: "advertised lines sold through many retailers, where the profit on the advertised line is not large"
  caveats:
