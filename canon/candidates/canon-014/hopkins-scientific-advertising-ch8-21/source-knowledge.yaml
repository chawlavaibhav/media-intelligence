  claim: >
    Advertising that is already working is improved by running new methods as tests alongside it
    rather than by replacing it, so that better methods can be sought continuously without
    interrupting plans already proved out. The source reports a five-year programme for one food
    advertiser in which over fifty separate plans were tried, improvements were found every little
