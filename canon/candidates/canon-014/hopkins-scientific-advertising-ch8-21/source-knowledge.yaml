# ═══════════════════════ Chapter 21 — Good Business (pp. 62-64) ═══════════════════════

- sk_id: sk_sa8_0048
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "An advertiser of many years' standing, spending as high as $700,000 per year, told the writer he did not know whether his advertising was worth anything or not."
    - "End an ad with an offer to pay five dollars to anyone who writes you that he read the ad through. The scarcity of replies will amaze you."
    - "Men getting back 30 per cent of their cost when they might get 150 per cent. And the facts could be easily proved."
    - "Every line of a big store's ad is charged to the proper department. And every inch used must the next day justify its cost."
    - "Advertising is prima facie evidence that the man who pays believes that advertising is good... So he takes it like some secret tonic which others have endorsed. If the business thrives, the tonic gets the credit."
  concept_label: a_five_dollar_offer_for_reading_it_through_is_proposed_as_a_cheap_measure_of_whether_an_advertisement_is_read
  label_origin: extractor_assigned
  claim: >
    The source proposes a specific cheap diagnostic for advertising whose effect is unknown: end the
    advertisement with an offer to pay five dollars to anyone who writes in that he read it through,
    and the scarcity of replies will amaze the advertiser. It is offered in a reported exchange with
    an advertiser of many years' standing spending up to $700,000 a year who said he did not know
    whether his advertising was worth anything, and to whom the writer replied that he did know it was
    utterly unprofitable and could prove it in one week. The diagnosis behind the proposal is that
    unmeasured advertising survives by default attribution: advertising is taken as prima facie
    evidence that the man who pays believes in it, like a secret tonic others have endorsed, so if the
    business thrives the tonic gets the credit and otherwise the failure is put down to fate. The
    contrast the source draws is with a big store, where every line is charged to the proper
    department and every inch must justify its cost the next day.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A payment large enough to be worth claiming converts readership into a countable act, so a
      quantity that is otherwise invisible becomes observable for the price of the few claims made.
      The reason it is needed is that a growing business supplies a default explanation for the
      advertising, and nothing forces the attribution to be tested.
  scope:
    domain_discussed_by_source: [advertising, evaluation_diagnosis]
    conditions: "national advertising running without a key, where no return can be traced"
  caveats:
    - text: >
        THE PROPOSED TEST WAS NEVER RUN, or at least no run of it is reported. "The scarcity of
        replies will amaze you" is a prediction of the result, offered in the same sentence as the
        proposal, in a book whose argument is that predictions must not be trusted. It is recorded as
        a proposed diagnostic, not as a finding.
      origin: extractor_observed
    - text: >
        The instrument measures reading, not selling, and the source does not distinguish them. Even
        a run of it would answer a narrower question than the one the $700,000 advertiser asked.
      origin: extractor_observed
    - text: >
        "Men getting back 30 per cent of their cost when they might get 150 per cent" is an assertion
        about other people's unmeasured advertising, made in the course of arguing that assertions
        about unmeasured advertising are worthless, and immediately followed by "the facts could be
        easily proved" — which is a claim that proof is available, not proof. Recorded as the clearest
        instance in this span of the book applying a standard to others that it does not meet.
      origin: extractor_observed
    - text: >
        The default-attribution diagnosis is the durable content here and is genuinely sharp: a
        growing business will absorb any expenditure into its success story unless something
        separates them.
      origin: extractor_observed
  source_stated_problems:
    - "those ads are always unkeyed. The money is spent blindly, merely to satisfy some advertising whim"
    - "The business is growing through many efforts combined, and advertising is given its share of the credit."
  source_stated_remedies:
    - "End an ad with an offer to pay five dollars to anyone who writes you that he read the ad through."
    - "Men and methods will be measured by the known returns."
