- sk_id: sk_sa8_0003
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "In every ad consider only new customers. People using your product are not going to read your ads. They have already read and decided."
    - "You might advertise month after month to present users that the product they use is poison, and they would never know it."
    - "So never waste one line of your space to say something to present users, unless you can say it in headlines."
    - "Bear in mind always that you address an unconverted prospect."
  concept_label: every_line_of_space_is_written_to_the_unconverted_and_none_to_present_users
  label_origin: extractor_assigned
  claim: >
    Advertising space should be allocated entirely to unconverted prospects. Existing users do not
    read the advertising for a product they already use, having read and decided already, so a line
    addressed to them is a line wasted. The source allows exactly one exception — something aimed at
    present users may be said in a headline, where non-readers still see it — and otherwise forbids
    it outright.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The decision already taken removes the motive to read. Body copy is only reached by people
      who are still deciding; headlines are the only part of the advertisement a non-reader is
      exposed to.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "periodical advertising for a product with an existing user base"
  caveats:
    - text: >
        Stated as a universal with no evidence at all. The vivid form — that users would not notice
        being told month after month that their product is poison — is rhetoric, not a reported
        observation, and no readership measurement is offered anywhere in the chapter.
      origin: extractor_observed
    - text: >
        `historical_claim` and `culturally_bounded`: this is a claim about periodical readership
        behaviour in 1923, under conditions where the advertiser had no way to address existing and
        prospective customers separately. The economic argument is explicitly about the cost of paid
        space, so it is contingent on that constraint. It is recorded here as the source's position
        about its own era and is NOT translated into any claim about retention or lifecycle
        communication in any other medium.
      origin: extractor_observed
    - text: >
        The headline exception is a real qualification and is easy to lose. Hopkins does not say
        never speak to users; he says never spend body copy on them.
      origin: source_stated
  source_stated_problems:
    - "never waste one line of your space to say something to present users"
  source_stated_remedies:
    - "In every ad consider only new customers."
    - "Bear in mind always that you address an unconverted prospect."
  examples:
    positive:
      - {description: "advertisers whose constant returns come from getting new readers rather than from a second reading by the same readers", figure_ref: null}
