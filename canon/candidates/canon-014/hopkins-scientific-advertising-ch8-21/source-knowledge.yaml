- sk_id: sk_sa8_0047
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "Other coined names are meaningless... They can be protected, and long-continued advertising may give them a meaning. When this is accomplished they become very valuable. But the great majority of them never attain that status."
    - "Other coined names signify ingredients which anyone may use... They invite substitution. They are naturally classified with other products which have like ingredients, so the price must remain in that class."
    - "On a patented product it must be remembered that the right to a name expires with the patent. Names like Castoria, Aspirin, Shredded Wheat Biscuit, etc., have become common property."
    - "Another serious fault in coined names is frivolity. In seeking uniqueness one gets something trivial. And that is a fatal handicap in a serious product."
    - "When a product must be called by a common name, the best auxiliary name is a man's name. It is much better than a coined name, for it shows that some man is proud of his creation."
  concept_label: the_four_ways_a_name_fails_and_the_one_fallback_when_the_product_has_a_common_name
  label_origin: extractor_assigned
  claim: >
    The source distinguishes four distinct name failures, each with its own mechanism. A meaningless
    coined name is exclusive and protectable and long-continued advertising may eventually give it a
    meaning at which point it becomes very valuable — but the great majority never attain that status,
    so its display is doubtful. An ingredient name may dominate a market if the price is reasonable
    but invites substitution and forces the product into the price class of everything sharing the
    ingredient. A patented product's name right expires with the patent, which the source calls a very
    serious point that often makes a patent an undesirable protection. And a frivolous name, arrived
    at while seeking uniqueness, is a fatal handicap in a serious product because it almost prohibits
    respect. Where a product must be called by a common name, the best auxiliary is a man's name,
    better than a coined one because it shows that some man is proud of his creation.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      A name's exclusivity and its descriptive power trade against each other. Exclusivity protects
      demand but must be paid for in advertising to acquire meaning; description sells for free but is
      available to competitors, so the demand created is shared and the price class is set by the
      shared attribute.
  scope:
    domain_discussed_by_source: [advertising, brand_communication]
    conditions: "naming a new product, including products under patent and products with an unavoidable common name"
  caveats:
    - text: >
        The classification is the valuable content and it is a taxonomy without evidence: which names
        fell into which class is asserted, and no rate is given for the central quantitative claim
        that the great majority of meaningless coined names never acquire meaning.
      origin: extractor_observed
    - text: >
        Toasted Corn Flakes and Malted Milk appear here as they do in chapter 12 (sk_sa8_0023).
        `repeated_within_source` is recorded. The chapter also admits an untested counterfactual:
        "It is interesting to speculate on how much more profitable a coined name might have been."
      origin: source_stated
    - text: >
        The trademark and patent reasoning is 1923 American law as the author understood it. It is
        recorded as the source's claim about its period and is NOT relied on as legal fact.
      origin: extractor_observed
    - text: >
        The frivolity claim is the same respect argument used against eccentric pictures in chapter 9
        (sk_sa8_0007), applied to naming, and it is equally unevidenced in both places.
      origin: extractor_observed
