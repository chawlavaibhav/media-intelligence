        The 10-per-cent loading arithmetic is the one piece of this chapter that can be checked, and
        it is arithmetic rather than evidence. The empirical half — that the dealer would have bought
        just as much anyway — is the assumption the arithmetic depends on and it is asserted with
        "probably".
      origin: extractor_observed
    - text: >
        The observation-level argument is the durable content and it is stated by the source
        explicitly: an effect visible at one dealer and absent from the town total is a
        redistribution. That is a claim about the unit of measurement, and it does not depend on 1923
        retailing.
      origin: extractor_observed
    - text: >
