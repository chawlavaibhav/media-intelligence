# ═══════════════════════ Chapter 9 — Art in Advertising (pp. 28-30) ═══════════════════════

- sk_id: sk_sa8_0005
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "Pictures in advertising are very expensive. Not in the cost of good art work alone, but in the cost of space."
    - "From one-third to one-half of an advertising campaign is often staked on the power of the pictures."
    - "Use pictures only to attract those who may profit you. Use them only when they form a better selling argument than the same amount of space set in type."
    - "Anything expensive must be effective, else it involves much waste."
  concept_label: a_picture_is_bought_with_space_so_it_must_outsell_the_same_space_set_in_type
  label_origin: extractor_assigned
  claim: >
    The real price of a picture is the paid space it occupies, not the artwork fee, and on that
    accounting one-third to one-half of a campaign is often staked on the pictures. The source
    therefore states a single admission test for any picture: use it only when it forms a better
    selling argument than the same amount of space set in type. Pictures used because they are
    interesting, to attract attention, or to decorate, fail the test by construction, because the
    advertisement's business is money-spending addressed to a restricted minority rather than
    pleasing, interesting or amusing a general audience.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Space is the scarce, purchased resource and type and image compete for the same units of it.
      A picture therefore has an explicit opportunity cost — the selling argument the same space
      would have carried in words — and must beat it.
  scope:
    domain_discussed_by_source: [advertising, mail_order_advertising]
    conditions: >
      Paid print space in 1923, priced by area, with type-set copy as the alternative use of that
      area. The source excludes from the discussion "the lines where the article itself should be
      pictured".
  caveats:
    - text: >
        TECHNOLOGY- AND COST-CONTINGENT, and this must not be read as a durable claim about images.
        The whole argument is arithmetic over 1923 print economics: space sold by the column inch,
        halftone reproduction, and a set of media where a page of type was a live alternative to a
        page of picture. The conclusion follows from that cost structure. Where the cost structure
        differs, the arithmetic does not carry, and this lane asserts nothing about what it would
        give under any other one.
      origin: extractor_observed
    - text: >
        EXTENDS the live object sk_hop_sa_0026 (`a_picture_must_earn_the_space_it_occupies`) from
        chapter 4, which states the principle and reports the incubator case. Chapter 9 supplies what
        chapter 4 does not: the cost premise (one-third to one-half of a campaign), and an operational
        comparison test — better than the same space set in type — rather than a general injunction to
        earn the space.
      origin: extractor_observed
    - text: >
        "From one-third to one-half" is offered with no source, no sample and no definition of what
        is being measured (space share, budget share, or share of the campaigns the author has seen).
      origin: extractor_observed
    - text: >
        The chapter's own close contradicts its opening: pictures are "of paramount importance" on
        p.28 and art questions are "minor questions... mere economies, not largely affecting the
        results of a campaign" on p.30. The tension is recorded at sk_sa8_0009 rather than resolved.
      origin: extractor_observed
  source_stated_problems:
    - "Pictures should not be used merely because they are interesting. Or to attract attention. Or to decorate an ad."
    - "It is certainly unwise to spend large sums on a dubious adventure."
  source_stated_remedies:
    - "Use them only when they form a better selling argument than the same amount of space set in type."
    - "if none exist which apply to his line, he should work out his own by tests"
  examples:
    positive:
      - {description: "Puffed Grains, where pictures of the grains themselves beat every figure drawing tried, because they awake curiosity", figure_ref: null}
      - {description: "mail order advertisers, said to have pictures down to a science — some large, some small, some none — and none using expensive art work", figure_ref: null}
  intra_source_relations:
    - {relation: trades_off_with, target: sk_sa8_0006, note: "the cost test against the cases where pictures are the strongest available argument"}
    - {relation: contradicts, target: sk_sa8_0009, note: "paramount importance at the chapter's opening against minor economies at its close"}
