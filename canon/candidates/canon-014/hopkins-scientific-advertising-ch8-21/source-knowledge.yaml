- sk_id: sk_sa8_0007
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "Then a picture which is eccentric or unique takes attention from your subject. You cannot afford to do that. Your main appeal lies in your headline. Over-shadow that and you kill it."
    - "Don't, to gain general and useless attention, sacrifice the attention that you want."
    - "One may gain attention by wearing a fool's cap. But he would ruin his selling prospects."
    - "Don't be like a salesman who wears conspicuous clothes. The small percentage he appeals to are not usually good buyers."
  concept_label: an_eccentric_picture_overshadows_the_headline_and_costs_the_confidence_it_buys_attention_with
  label_origin: extractor_assigned
  claim: >
    An eccentric or unique picture damages an advertisement in two separate ways. First it competes
    with the headline for the reader's attention, and since the main appeal lies in the headline,
    overshadowing it kills the appeal. Second it forfeits respect: treating the subject lightly, or
    attempting frivolity, lowers regard for the advertiser and the article, because people do not
    patronise a clown. The general attention gained is described as useless attention bought at the
    price of the attention actually wanted, and the buyers it does attract are said to be a small
    percentage who are not usually good buyers.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Attention inside an advertisement is a fixed quantity being divided. A striking picture wins
      its share from the headline, which is where the selling appeal is. Separately, visible
      frivolity is read as a statement about the advertiser's seriousness, and confidence and
      conviction require appearing normal.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "advertising seeking confidence and conviction; the source names business and home as the two subjects never to joke about"
  caveats:
    - text: >
        Two distinct claims are welded into one passage — an attention-competition claim and a
        respect claim — and the source supplies no evidence for either. No comparison of an eccentric
        and a plain treatment is reported anywhere in the chapter.
      origin: extractor_observed
    - text: >
        "An eccentric picture may do you serious damage" is hedged with "may"; the rest of the
        passage is not. The strength of the claim varies within the paragraph.
      origin: extractor_observed
    - text: >
        This is a source position of its period about tone and respectability, and it is squarely at
        odds with much later and current practice that buys attention deliberately. It is recorded
        faithfully as Hopkins's position, not endorsed.
