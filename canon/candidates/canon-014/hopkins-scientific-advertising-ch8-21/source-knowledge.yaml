    - "Don't show the wrinkles you propose to remove, but the face as it will appear. Your customers know all about the wrinkles."
    - "Picture what others wish to be, not what they may be now."
    - "Tell people what to do, not what to avoid."
    - "Assume that people will do what you ask. Say, 'Send now for this sample.' Don't say, 'Why do you neglect this offer?' That suggests that people are neglecting."
    - "You will find that the positive ad outpulls the other four to one, if you have our experience."
  concept_label: show_the_condition_desired_rather_than_the_defect_to_be_removed_and_never_attack_a_rival
  label_origin: extractor_assigned
  claim: >
    The source states a single positive-framing doctrine covering both competitors and the customer's
    own condition. Attacking a rival is never good advertising: it is not permitted in the best
    mediums, the selfish purpose is apparent, and it looks unfair. And the advertisement should
    depict the condition the buyer wants to arrive at rather than the defect being removed — pretty
    teeth not bad teeth, well-dressed people not the shabby, successful men not failures — on the
    stated ground that the customer already knows all about the wrinkles. The rule is extended to
    the instruction itself: tell people what to do rather than what to avoid, and assume compliance
    ("Send now for this sample") rather than imply neglect ("Why do you neglect this offer?"), which
    only suggests that people are neglecting. The source claims that on comparing a negative and a
    positive advertisement the positive outpulls the other four to one.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      People are attracted by sunshine, beauty, happiness, health and success, so the advertisement
      should point the way to those rather than the way out of their opposites. Naming a negative
      behaviour also implies it is normal, which invites the reader to follow the wrong crowd.
  scope:
