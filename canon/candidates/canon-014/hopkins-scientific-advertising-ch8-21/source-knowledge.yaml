        and sk_hop_sa_0040 (`people_judge_value_by_stated_price_because_they_are_not_experts`) from
        chapter 6, which give the psychology of price in copy. Chapter 12 treats price as a decision
        to be made before copy exists, and adds the two regimes chapter 6 does not cover — volume
        economics and low-consumption margin.
      origin: extractor_observed
  source_stated_problems:
