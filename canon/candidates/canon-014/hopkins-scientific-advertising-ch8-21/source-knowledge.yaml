# ═══════════════════════ Chapter 8 — Tell Your Full Story (pp. 25-27) ═══════════════════════

- sk_id: sk_sa8_0001
  source_id: hopkins-scientific-advertising-ch8-21
  source_terms:
    - "Whatever claim you use to gain attention, the advertisement should tell a story reasonably complete."
    - "In one reading of an advertisement one decides for or against a proposition. And that operates against a second reading."
    - "Some advertisers, for the sake of brevity, present one claim at a time. Or they write a serial ad, continued in another issue. There is no greater folly. Those serials almost never connect."
    - "the average reader is only once a reader, probably. And what you fail to tell him in that ad is something he may never know"
  concept_label: one_reading_decides_so_the_advertisement_must_carry_the_whole_case
  label_origin: extractor_assigned
  claim: >
    Because a reader decides for or against the proposition in a single reading, and that decision
    operates against ever reading a second time, every important claim must be present in the
    advertisement the reader happens to see. Splitting the case across issues — one claim at a time,
    or a serial advertisement continued later — is named as the greatest folly available, on the
    ground that serials almost never connect and people do not read successive advertisements on one
    line any more than they read a news item twice. The source concedes the resulting advertisements
    look monotonous to anyone who reads them all, and answers that the average reader is only once a
    reader.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      The decision, not the exposure, is the scarce event. One reading produces a verdict; the
      verdict suppresses re-reading; so any argument withheld from that reading is an argument the
      reader will never meet.
  scope:
    domain_discussed_by_source: [advertising, mail_order_advertising]
    conditions: >
      Advertising addressed to unconverted prospects in periodical media. The source explicitly
      refuses a fixed length rule: one sentence may tell a complete story on chewing gum or Cream of
      Wheat, while a considered purchase will absorb columns.
  caveats:
    - text: >
        EXTENDS the live object sk_hop_sa_0027 (`telling_the_complete_story_sells_more`), which
        records the same doctrine from chapter 4 scoped to mail order and immediate-sale advertising
        and marked `mechanism_absent`. Chapter 8 does two things chapter 4 did not: it generalises
        the rule to advertising at large, and it supplies the mechanism (one reading, one verdict,
        no second reading). This object exists for the mechanism and the generalisation, not to
        restate the doctrine.
      origin: extractor_observed
    - text: >
        "There is no fixed rule on this subject of brevity" is the source's own limit on the
        doctrine, stated in this chapter. Completeness, not length, is what is being prescribed.
      origin: source_stated
    - text: >
        The Marmon case is a purchase anecdote about one unnamed man, recounted second-hand, with no
        sales figure attached and no test. It is offered as illustration; it demonstrates nothing.
        Note also that it undercuts itself: the buyer is reported as never sorry and yet as later
        learning facts that would have sold him a car at nearly three times the price.
      origin: extractor_observed
  source_stated_problems:
    - "Some advertisers, for the sake of brevity, present one claim at a time."
    - "Those serials almost never connect."
    - "What folly it is to cry a name in a line like that, plus a few brief generalities."
  source_stated_remedies:
    - "Bring all your good arguments to bear. Cover every phase of your subject."
    - "So present to the reader, when once you get him, every important claim you have."
  examples:
    positive:
      - {description: "the Marmon, which told a complete story and was bought after the reader read columns and books about it", figure_ref: null}
    counter:
      - {description: "Rolls-Royce, Pierce-Arrow and Locomobile, whose very short advertisements offered no information and whose makers evidently thought arguing comparative merits undignified", figure_ref: null}
  intra_source_relations:
