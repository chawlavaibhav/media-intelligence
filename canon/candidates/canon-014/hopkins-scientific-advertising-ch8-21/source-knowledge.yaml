    - "It is a well-known fact that the greatest profits are made on great volume at small profit."
    - "A price which appeals only to—say 10 per cent—multiplies the cost of selling."
    - "One hardly cares what he pays for a corn remedy because he uses little. The maker must have a large margin because of small consumption."
    - "On other lines a higher price may be even an inducement. Such lines are judged largely by price. A product which costs more than the ordinary is considered above the ordinary."
  concept_label: price_selection_follows_the_lines_consumption_and_judgment_regime
  label_origin: extractor_assigned
  claim: >
    Price is treated as a strategic variable with three distinct regimes rather than a single rule.
    In the volume regime the greatest profits come from great volume at small profit, and a price
    that appeals to only some percentage of buyers multiplies the cost of selling by the reciprocal
    of that percentage. In the low-consumption regime high price is unimportant but high margin is
    essential, because sale per customer is small — a buyer hardly cares what he pays for a corn
    remedy because he uses little. In the judgment regime a higher price is itself an inducement,
    because the line is judged largely by price and a product costing more than the ordinary is
    considered above the ordinary. Which regime a product is in decides the price.
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: >
      Price acts on three quantities at once — the size of the addressable field, the margin
      available per sale, and the quality the buyer infers. Which effect dominates depends on how
      much the customer consumes and whether the buyer has any way to judge the product other than
      by its price.
  scope:
    domain_discussed_by_source: [advertising]
    conditions: "packaged consumer goods sold at retail; the three regimes are named by example rather than defined"
  caveats:
    - text: >
        No selection test is given. The source names three regimes and gives an exemplar of each but
        never states how to determine which one a new product is in — which is the decision the whole
        passage is about.
      origin: extractor_observed
    - text: >
