        nominally supported: that attacking rivals is bad policy, that depicting the desired state
        outperforms depicting the defect, and that assuming compliance outperforms implying neglect.
        The four-to-one figure is attached to the second only.
      origin: extractor_observed
    - text: >
        `historical_claim`: "It is not permitted in the best mediums" is a statement about 1923
        magazine and newspaper acceptance policy, not an argument about effect, and it is doing part
        of the work of the prohibition.
      origin: extractor_observed
