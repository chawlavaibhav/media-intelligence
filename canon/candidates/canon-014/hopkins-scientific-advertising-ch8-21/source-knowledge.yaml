        result withheld — and this is the chapter the whole book points forward to. Not one cost per
        customer started, repeat rate, purchase volume or payback period is given for any product in
        any town. The only dollar figures in the passage are the COST OF RUNNING a test ($3,000 to
        $5,000), not anything a test returned.
      origin: extractor_observed
    - text: >
