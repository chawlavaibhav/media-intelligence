observed_loss_patterns:

  # NOTE ON VOCABULARY (per the desai template): no_visual_argument is a visual_argument_role
  # value recorded at the head of this file, not a loss pattern.
  - pattern: no_loss_detected
    affects: "the visual dimension - nothing visual was lost because nothing visual exists in the span"
    detectability: detected_by_independent_check
    recoverability: not_applicable
    evidence: >
      All 40 pages of printed 25-64 were opened. Zero figures, zero illustrations, zero tables,
      zero diagrams, zero reproduced advertisements. Continuous single-column body text on every
      page. The extraction's record that every source_support value is text and every
      provenance.inspected.figures is empty is confirmed by direct inspection of every page.

  - pattern: source_evidence_never_printed
    affects: >
      Every advertisement Hopkins argues from in chapters 8-21: the Arrow Collar and
      correspondence-school pictures (ch.9), the Puffed Grains pictures of the grains (ch.9),
      the Marmon columns of copy (ch.8), the coupon advertisements carrying full-package offers
      (ch.13-14), the "before and after taking" ads and the positive/negative pair said to
      outpull four to one (ch.18), the magazine publisher's twenty-five test letters (ch.19).
    detectability: named_by_text
    recoverability: not_applicable
    evidence: >
      Confirmed by opening every page of the span: not one of the advertisements the text argues
      from is reproduced anywhere in printed 25-64. This is not digitisation loss - a reader of
      the 1923 first edition was in exactly the same position - and the full-span page pass now
      establishes it by direct inspection rather than by trusting the text layer. In chapter 9
      (p.28) Hopkins instructs the reader to look at mail order advertisements to see how
      pictures are used; the book itself makes the instruction impossible to follow.

  - pattern: display_type_ocr_damage
    affects: "the text layer's italic page-number footers on seven pages, and a stray mark in the p.28 text layer"
    detectability: detected_by_independent_check
    recoverability: recovered_in_this_copy
    evidence: >
      The damage is confined to the TEXT LAYER: pdftotext returns garbled folios ("Pf", "752]",
      "2/7", "28)", "oo", "nye", "he") on printed 27, 29, 37, 53, 55, 57, 59. The page IMAGES
      render every folio correctly and this pass read them all, so the loss is fully recovered
      in this copy by page render. No word of Hopkins's body text is touched.

