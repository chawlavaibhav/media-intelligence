    makes the pair worth binding rather than a reason not to.
  applicability:
    when: "assessing whether a visual element earns its place in a bounded composition"
    limits: >
      The source's arithmetic is 1923 print economics — space priced by area, art cost small beside
      insertion cost. It is bound here as a STANCE (compare against the alternative use of the same
      space) and NOT as its conclusions, which do not survive a different cost structure. The
      source's own conclusions about colour, art quality and picture repetition are deliberately
      NOT bound.
