# Claude C. Hopkins, "Scientific Advertising" (1923), chapters 8-21 (printed pp. 25-64).
# SPEC-04 operational bindings.
#
# EXPERIMENTAL — NOT LIVE CANON. Lane: canon/experimental/book-expansion-qa-v1/.
# SCOPE EXTENSION of the live `hopkins_scientific_advertising_ch1_7`. Same work, same author.
#
# STANCE. Eleven bindings against forty-eight SourceKnowledge objects. Most of chapters 8-21 is
# 1923 media buying, coupon mechanics, dealer distribution and print production, and has no honest
# consumer here. It is left unbound, which SPEC-04 states is a normal outcome and information about
# the product rather than about the knowledge.
#
# THREE RULES APPLIED THROUGHOUT:
#  1. Physical-era production advice is NOT rewritten as a generative-model instruction. Two
#     production bindings are recorded, both `status: production_candidate`, both `target_path:
#     null`, both stating in `limits` that no generative equivalent is asserted.
#  2. `evidence_basis` is never `cross_source_supported` or `empirically_supported`. No cross-source
#     promotion is authorised in this task and no empirical record is attached to anything here.
#  3. A binding never restates the source claim; it references the sk_ id and says what WE would do.
#
# NOTE ON EVIDENCE CHAINS. Several of these bind knowledge whose own `evidence.characteristics` are
# `practitioner_assertion` and `outcome_claimed`. Where the binding then rests on
# `extractor_inference`, it is two inferential steps from anything demonstrated. That chain is
# readable from these records deliberately.

source_id: hopkins-scientific-advertising-ch8-21

operational_bindings:

- binding_id: bnd_sa8_001
  source_knowledge_refs: [sk_sa8_0034]
  source_system_refs: [scs_sa8_003]
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [flags, constrains]
  governance_consumer: evidence_interpretation
  observation_unit: null
  rationale: >
    A worked case of a source whose entire evidential authority rests on one inferential step that
    the source states as a law and never supports. sk_sa8_0034 is the step; sk_sa8_0033 is the
    procedure that depends on it. The pair is directly useful to how evidence characteristics are
    weighted, because it demonstrates that a well-specified METHOD and a reported RESULT are
    independent, and that a source can supply the first in full while supplying none of the second.
    Any weighting scheme that credits methodological specificity as if it were evidence would score
    chapter 15 highly and be wrong.
  applicability:
    when: "weighing a source that describes a measurement procedure in detail"
    limits: >
      This is one source, of one period, in one trade. It illustrates a distinction; it does not
      establish how often the distinction bites.
  evidence_basis: derived_from_source
  empirical_refs: []
