# ── DELIBERATELY UNBOUND ─────────────────────────────────────────────────────
# Recorded so the absence reads as a decision rather than an oversight.
#
# Chapter 13's sampling mechanics, chapter 14's distribution mechanics and chapter 19's letter
# devices are the most operationally detailed material in the span and are left entirely unbound.
# They are 1923 coupon, retail and postal machinery. Binding them would require asserting a modern
# analogue, which this lane is not authorised to do and the source cannot support.
#
# Chapter 10's cost figures, chapter 12's price regimes and chapter 11's research programme are
# unbound because their consumer would be a business-planning system that does not exist here.
#
# Chapter 17's individuality doctrine and chapter 18's positive-framing doctrine are unbound
# because the only honest binding would be an evaluation check ("is the tone consistent", "does
# this show the desired state") whose source support is one hedged four-to-one claim and no
# comparison at all. A binding was drafted for each and both were discarded: an evaluator that
# scores tone consistency does not need Hopkins to justify it, and one that scores positive framing
# would be encoding an unevidenced 1923 preference as an acceptance criterion.
