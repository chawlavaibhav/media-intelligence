  observation_unit: null
  rationale: >
    The source supplies a two-part procedure for settling a disagreement about a practice: identify
    whose interest the argument serves, then replace the argument with a comparison the disputants
    do not control. It is directly applicable to how contradictions between pieces of knowledge are
    settled, and it is more useful than its conclusions because the source demonstrates both halves
    — it applies the bias test to advertising agents in chapter 13 and fails to apply it to its own
    agency in chapter 15.
  applicability:
    when: "two positions on a practice conflict and each is argued rather than measured"
    limits: >
      The source's remedy assumes a comparison is cheaply available, which is the case it happens to
      be discussing and not the general case. Where no comparison can be run, the procedure gives
      nothing.
