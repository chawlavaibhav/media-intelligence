- binding_id: bnd_sa8_003
  source_knowledge_refs: [sk_sa8_0038]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses, flags]
  governance_consumer: null
  observation_unit: asset_set_over_time
  rationale: >
    sk_sa8_0038 is an observation-unit argument, not a retailing argument: an effect measured where
    it is largest can be a redistribution rather than a gain, and only a total across the whole
    population distinguishes them. That is exactly the failure an evaluator scoring individual
    assets cannot see, and it names the unit required to see it. Recorded here because the
    structural point survives the 1923 setting even though nothing else in the chapter does.
  applicability:
    when: "an intervention shows a gain on the subset it was applied to"
    limits: >
      The source is discussing shop trade in 1923 and reports no such measurement. The transfer from
      shops-in-a-town to any other population is ours, and the source supplies no evidence for the
      general form of the claim.
  evidence_basis: extractor_inference
  empirical_refs: []
  failure_ontology_refs: [t_sa8_0012]
  repair_ontology_refs: [t_sa8_0034]
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_sa8_004
  source_knowledge_refs: [sk_sa8_0032, sk_sa8_0030]
  source_system_refs: []
  target_type: evaluation
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [diagnoses]
  governance_consumer: null
  observation_unit: whole_asset
  rationale: >
    A named failure state that is invisible to any measure of persuasion: a fully converted
    respondent with no route to act. The source's phrasing — a convert who cannot be supplied — makes
    the point that conversion and fulfilment are separate conditions and that success on the first
    without the second is a loss rather than a partial success. Useful as an acceptance check on any
    asset that asks for an action.
  applicability:
    when: "an asset issues a call to action"
    limits: >
      The source's case is physical retail stock in 1923. Whether an equivalent gap exists in any
      other setting is not something this source can establish, and no equivalence is asserted here.
