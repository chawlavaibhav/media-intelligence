  repair_ontology_refs: []
  status: proposed
  status_reason: "experimental; not reviewed"

- binding_id: bnd_sa8_002
  source_knowledge_refs: [sk_sa8_0004, sk_sa8_0048]
  source_system_refs: []
  target_type: governance
  target_path: null
  target_schema: null
  target_schema_version: null
  role: [constrains]
  governance_consumer: evidence_interpretation
  observation_unit: null
  rationale: >
    The source states an admissibility rule for practice evidence — that a practitioner who cannot
    see his returns has no experience to transmit, only preferences — and then does not meet it
    itself, since its own returns are equally unavailable to the reader. The rule and its
    self-application are both useful precedents for how a corpus should treat authority claims from
    practitioners: the reasoning is sound and applies to the source that supplies it.
  applicability:
    when: "a source justifies a practice by pointing at existing practice"
    limits: >
      The source's rule is stated about advertising specifically and is not a general epistemology.
      Applying it to a corpus of craft books is our extension, not the source's.
