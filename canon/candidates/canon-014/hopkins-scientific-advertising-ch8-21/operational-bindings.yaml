  governance_consumer: null
  observation_unit: whole_asset
  rationale: >
    The chapter supplies a comparison test rather than a quality standard — does this element beat
    what the same space would carry otherwise — and, in the same chapter, a ranking that puts
    execution quality below the decisions that halve or multiply the result. Both are useful as a
    stance for an evaluator: comparative rather than absolute, and explicit about which findings
