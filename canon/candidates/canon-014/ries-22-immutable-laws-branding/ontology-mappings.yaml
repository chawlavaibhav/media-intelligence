source_id: ries-22-immutable-laws-branding
extraction_date: 2026-08-30
terms:
- term_id: t_r22_0001
  term: the_law_of_expansion
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"The power of a brand is inversely proportional to its scope." Law 1. Putting
    a name on more things weakens it; expansion buys sales now and costs brand meaning later.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0002
  term: the_law_of_contraction
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"A brand becomes stronger when you narrow its focus." Law 2. The positive
    statement of Law 1, carrying a five-step retail programme: narrow, stock deep, buy cheap, sell cheap,
    dominate.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0003
  term: the_law_of_publicity
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"The birth of a brand is achieved with publicity, not advertising." Law
    3. A new brand must be able to generate coverage; advertising will not launch one.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0004
  term: the_law_of_advertising
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"Once born, a brand needs advertising to stay healthy." Law 4. For a leader,
    advertising is a defence budget and insurance against competitive attack, not an investment expected
    to return.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0005
  term: the_law_of_the_word
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"A brand should strive to own a word in the mind of the consumer." Law
    5. One word nobody else owns; the answer to growth pressure is to expand the market, not the brand.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0006
  term: the_law_of_credentials
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"The crucial ingredient in the success of any brand is its claim to authenticity."
    Law 6. Credentials are the collateral that makes every other claim believable; leadership is the readiest
    one.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0007
  term: the_law_of_quality
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"Quality is important, but brands are not built by quality alone." Law
    7. Measured quality does not track market success; the perception of quality is built by focus, a
    better name and a higher price.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0008
  term: the_law_of_the_category
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"A leading brand should promote the category, not the brand." Law 8. Narrow
    until no market remains, launch as the first, and grow the pie rather than the slice.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0009
  term: the_law_of_the_name
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"In the long run a brand is nothing more than a name." Law 9. Product differentiation
    is competed away; the perceived difference between names is what remains.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0010
  term: the_law_of_extensions
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"The easiest way to destroy a brand is to put its name on everything."
    Law 10. Extensions draw volume from the core, and management measures only the extension''s sales.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0011
  term: the_law_of_fellowship
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"In order to build the category, a brand should welcome other brands."
    Law 11. Competition raises category consciousness and consumption; about fifty per cent is the share
    ceiling.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0012
  term: the_law_of_the_generic
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"One of the fastest routes to failure is giving a brand a generic name."
    Law 12. The mind processes sound, so capitalising a common word does not make it a name.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0013
  term: the_law_of_the_company
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"Brands are brands. Companies are companies. There is a difference." Law
    13. Customers buy brands; the brand name should dominate the company name.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0014
  term: the_law_of_subbrands
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"What branding builds, subbranding can destroy." Law 14. Subbrand, masterbrand
    and megabrand are terms invented inside companies and have no meaning in customers'' minds.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0015
  term: the_law_of_siblings
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"There is a time and a place to launch a second brand." Law 15. A family
    of genuinely different brands under six conditions, controlled from the top.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0016
  term: the_law_of_shape
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"A brand''s logotype should be designed to fit the eyes. Both eyes." Law
    16. Horizontal, about 2.25 to 1; legibility above expression; the symbol is secondary to the word.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0017
  term: the_law_of_color
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"A brand should use a color that is the opposite of its major competitor''s."
    Law 17. The leader takes the category''s symbolic colour; followers take the opposite one.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0018
  term: the_law_of_borders
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"There are no barriers to global branding. A brand should know no borders."
    Law 18. Keep the narrow focus at home and go global; country-of-origin perception is an asset or a
    liability.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0019
  term: the_law_of_consistency
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"A brand is not built overnight. Success is measured in decades, not years."
    Law 19. Markets may change but brands should not; the authors call this the most frequently violated
    law.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0020
  term: the_law_of_change
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"Brands can be changed, but only infrequently and only very carefully."
    Law 20. Three permitted situations; the authors call this law the biggest exception to the laws of
    branding.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0021
  term: the_law_of_mortality
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"No brand will live forever. Euthanasia is often the best solution." Law
    21. Awareness and meaning are different assets; a new category is won by a new name.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0022
  term: the_law_of_singularity
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: entity
  definition_in_origin_frame: '"The most important aspect of a brand is its single-mindedness." Law 22.
    A brand is a singular idea owned in a prospect''s mind; a proper noun usable in place of a common
    phrase.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0023
  term: line_extension
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'Putting an existing brand name on an additional product, usually with a
    generic descriptor attached. The book''s central prohibition: the extension draws its volume from
    the core brand rather than from competitors, and the company measures only the extension''s sales.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0024
  term: milking_a_brand
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'Using line extension, megabranding and variable pricing to convert accumulated
    brand meaning into present sales. The authors'' contrast term for building: milking brings easy money
    now and wears the brand down until it stands for nothing.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0025
  term: the_wrong_end_of_the_ruler
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'The measurement error the authors say makes extension look successful:
    management measures the success of the extension and never measures the erosion of the core brand,
    nor the opportunity forgone by not launching a new brand instead.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0026
  term: manufacturer_logic
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'The reasoning the authors say produces new brands in the wrong places:
    when volume is flat the manufacturer concludes it needs more brands, and when the category is growing
    it concludes it does not — the reverse, they say, of what the market calls for.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0027
  term: subbranding
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'Attaching a secondary name to a core brand in order to move it into new
    territory. The authors call it inside-out: it pushes the core brand outward from within the company
    and answers no demand the customer had.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0028
  term: megabrand_or_masterbrand_thinking
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'The hierarchy in which a parent name is a megabrand and the model names
    beneath it are the brands. The authors say customers do not understand the concept at all: what the
    manufacturer calls a brand the customer calls a model.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0029
  term: generic_brand_name
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'A brand name made of common descriptive words. It cannot differentiate,
    because the mind processes the printed word as sound and cannot hear the capital letter that would
    make it a proper noun.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0030
  term: omnibus_brand
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'A very broad brand — the authors also say "mile-wide" — that looks strong
    because it is well known and long established, but which they say loses whenever it meets a specialist.
    Its successes are attributed to facing equally broad competitors.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0031
  term: burned_out_brand
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'A brand that has lost its singularity, so that asking what it is returns
    a list of contradictory attributes. The authors note such brands can persist for years because their
    competitors are equally extended, so survival does not disconfirm the diagnosis.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0032
  term: sibling_rivalry
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'The corporate behaviour in which brands in one family copy each other''s
    best features, so that a portfolio of distinct brands converges on a single indistinct one. The authors''
    stated reason why a sibling strategy needs more top-management control, not less.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0033
  term: chasing_the_market
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'Following a change in demand with the existing brand rather than holding
    position or launching a second brand. The authors'' summary: when you feel the need to create subbrands,
    you are chasing the market, not building the brand.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0034
  term: why_should_we_limit_ourselves
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'A verbal cue the authors tell the reader to treat as a red flag. The sentence
    marks the moment a company is about to break the Law of Consistency, and the authors'' answer to it
    is that limitation is the essence of branding.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0035
  term: too_much_choice
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: problem
  definition_in_origin_frame: 'The point past which more brands, flavours and varieties produce confusion
    in a category rather than interest, and consumption per head falls. The authors'' bound on their own
    Law of Fellowship.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0036
  term: narrowing_the_focus
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'Reducing what a brand sells or stands for, up to and including discarding
    profitable lines — throwing out the furniture and keeping the toys. The authors'' primary remedy,
    and the first step of the five-step retail pattern.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0037
  term: category_creation
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'Narrowing until no market remains and then launching as the first, the
    leader, the pioneer or the original. The authors call it the most efficient and most productive aspect
    of branding, and the route by which a non-leader acquires a leadership credential.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0038
  term: promote_the_category_not_the_brand
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'Spending behind the concept rather than the name, so the category takes
    off and pulls the brand with it — increasing the size of the pie rather than the slice. Prescribed
    for the pioneer and for the leader of a young category.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0039
  term: owning_a_word
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'Reducing the brand''s essence to one attribute nobody else owns in the
    category, and holding it. Recorded as `unknown` for executability because the source names a state
    in a prospect''s mind and gives no procedure for producing it beyond following the other laws.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - unknown
- term_id: t_r22_0040
  term: leadership_credential
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'Stating leadership of a category — however small — everywhere the brand
    name appears, and inventing a category narrow enough to lead where none exists. The authors say they
    created credentials this way for clients who had none.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0041
  term: code_word_for_prestige
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'A substitute claim that lets a buyer justify a prestige purchase on other
    grounds, used together with a price set well above the comparable competitor. The authors'' example
    is an engineering claim standing in for prestige.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0042
  term: word_used_out_of_context
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'The naming procedure the authors offer against generic names: take an ordinary
    word whose connotation the brand wants and use it outside its usual context, or cut a generic phrase
    down to a short distinctive form.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0043
  term: sibling_brand
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'A separately named brand in the same product area, segmented on a single
    attribute with rigid non-overlapping distinctions, deliberately named unlike its siblings, launched
    only when it can create a new category, and controlled from the top.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0044
  term: go_global_and_keep_the_focus
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'The authors'' answer to a company that believes home-market share is capped
    and that it must grow: keep the brand''s narrow focus in its home country and take it abroad unchanged,
    subject to being first and to fitting the perceptions of the country of origin.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0045
  term: opposite_colour_to_the_leader
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'For a brand that is not the category leader: take a colour opposite the
    major competitor''s, in preference to the colour that symbolises the category. The authors say separate
    identity matters more than symbolic fit, and hold the choice constant over years.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0046
  term: publicity_first_then_advertising
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'Develop strategy from a publicity point of view and launch on coverage
    rather than paid media; shift to advertising only once the category story and the pioneer story have
    both been told, and then only to defend.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0047
  term: euthanasia_of_a_brand
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: remedy
  definition_in_origin_frame: 'Letting an obsolete brand die rather than spending to keep it alive, and
    putting the money into a new brand for the new category. The authors give no criterion for when a
    brand has reached this point, which is why the executability is recorded as an act with no stated
    test.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by:
  - human_edit
- term_id: t_r22_0048
  term: brand_power
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'A brand''s ability to influence purchasing behaviour, held to be inversely
    proportional to its scope. The authors insist it is distinct from sales, because sales are also a
    function of how weak the competition is.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0049
  term: singularity
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'Single-mindedness: the property of standing for one idea in a prospect''s
    mind. The authors make it the most important property of a brand and the reason no brand can have
    universal appeal.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0050
  term: scope
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'How much a brand name is attached to. The quantity the Law of Expansion
    says power varies inversely with — stated as a proportion but never computed anywhere in the book.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0051
  term: credentials
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'The collateral a brand puts up to guarantee its performance — authenticity,
    leadership, priority. Their function is to make every other claim believable, and their absence is
    why benefit claims are discounted as "that''s what they all say".

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0052
  term: the_generic_effect
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'A brand name standing for its whole category in ordinary speech. Obtainable
    only by having been the first brand and established the category — the authors say it cannot be acquired
    by later outselling the leader.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0053
  term: publicity_potential
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'A brand''s capacity to generate coverage, which the authors treat as finite
    and consumed in two phases — the launch of the category and the rise of the pioneering company. A
    line-extended name is said to have none.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0054
  term: perception_of_quality
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'Quality as it resides in a buyer''s mind, which the authors distinguish
    sharply from quality as measured by third-party comparative testing and say has little correlation
    with it.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0055
  term: the_fifty_percent_share_ceiling
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'The authors'' stated upper limit on a dominant brand''s share absent a
    sanctioned monopoly, given as "our research indicates that 50 percent is about the upper limit" and
    repeated as a leading brand''s "rightful share". No research is reported, and it conflicts with the
    domination figures the same book cites approvingly.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0056
  term: country_of_origin_perception
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'The value a brand''s perceived home adds or subtracts, which the authors
    say no brand escapes: every brand is from somewhere regardless of where it is made, and its name and
    connotations fix where.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0057
  term: brand_as_badge
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'A brand used as a personality statement to friends, neighbours, colleagues
    or oneself. The authors'' reason why a brand should not follow its customers as they age: people change
    badges, and a brand that follows ends up making a statement nobody wants.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0058
  term: awareness_versus_meaning
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'The authors'' valuation distinction: how well known a brand is, against
    what it stands for. A well-known brand that stands for nothing has no value; a brand that stands for
    something has value even if little known.

    '
  first_seen: 2026-08-30
  verbatim: true
  executable_by: null
- term_id: t_r22_0059
  term: the_what_comes_to_mind_test
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'The book''s recurring diagnostic, used to open chapter 1 and to close chapter
    22: say the brand name and see what comes back. A list of contradictory attributes means the brand
    has lost its power.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_r22_0060
  term: the_question_nobody_asks_test
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'The diagnostic for a subbrand: state the demand it serves as a sentence
    a customer would say aloud — "don''t you have a more expensive hotel I can stay at?" If nobody would
    say it, the subbrand answers a demand that does not exist.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
- term_id: t_r22_0061
  term: the_weak_competition_clause
  origin: source
  origin_ref: ries-22-immutable-laws-branding
  kind: property
  definition_in_origin_frame: 'The authors'' stated rule that a brand can gain sales while losing power
    if its competitors are weaker still. Recorded as a term because it is used four times in the span
    to reassign counter-examples, and a reader needs a name for it to see the pattern.

    '
  first_seen: 2026-08-30
  verbatim: false
  executable_by: null
