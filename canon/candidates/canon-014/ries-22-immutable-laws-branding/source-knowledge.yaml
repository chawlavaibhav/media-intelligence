- sk_id: sk_r22_0018
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - To get into the consumer's mind you have to sacrifice.
  - it's a physical impossibility for most brands to go beyond a single word
  concept_label: mental_capacity_limits_a_brand_to_one_attribute
  label_origin: extractor_assigned
  claim: 'The authors ground the one-word rule in a capacity argument about minds. The average adult knows
