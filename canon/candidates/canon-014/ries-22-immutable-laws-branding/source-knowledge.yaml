- sk_id: sk_r22_0024
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Quality
  - Quality is important, but brands are not built by quality alone.
  - There is almost no correlation between success in the marketplace and success in comparative testing
    of brands
  concept_label: measured_quality_does_not_track_market_success
  label_origin: source_verbatim
  claim: 'Law 7. The authors deny that building a better product reliably builds a better brand. They
    claim almost no correlation between marketplace success and performance in independent comparative
    testing of any kind — taste, accuracy, reliability, durability — and open the chapter by asking whether
    the reader is sure that any of the standard premium brands actually outperforms its cheaper rival.
    Quality, they say, matters, but it is the perception of quality residing in the buyer''s mind that
    governs, not the property measured on a bench.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Quality has no independent existence at the point of choice: it resides in the mind of the
      buyer. The authors use the Coke/Pepsi blind taste result — most people prefer Pepsi blind while
      Coke outsells it — as their demonstration that the tested property and the chosen brand come apart,
      and they reject the conventional response that the taste test must be faulty.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - consumer_marketing
    - automobiles
    - consumer_packaged_goods
    conditions: stated for consumer categories where a third party publishes comparative rankings
  caveats:
  - text: '''years of observation have led us to this conclusion'' is the entire methodological statement;
      no correlation is computed anywhere and no data set is named'
    origin: extractor_observed
  - text: the nearest thing to evidence is a Consumer Reports ranking of sixteen small cars in which the
      authors report the sales positions of exactly three brands — the first, second and third in quality.
      The ranking is undated and unnamed beyond 'recent', the source of the sales ranking is not given,
      and thirteen of the sixteen are not reported. This lane deliberately did NOT tag it empirical_within_source
    origin: extractor_observed
  - text: the blind-taste-test claim about Coke and Pepsi is reported without citation
    origin: extractor_observed
