- sk_id: sk_r22_0028
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The rightful share of a leading brand is never more than 50 percent.
  - Instead of fighting competitive brands, a leader should fight competitive categories.
  concept_label: a_leaders_share_is_capped_and_it_should_fight_categories_not_brands
  label_origin: extractor_assigned
  claim: 'The authors give the pioneer a boundary condition and a redirection. The boundary: a leading
    brand''s rightful share is never more than fifty per cent, so the fall from an initial hundred per
    cent of a category it created down through ninety, eighty and seventy per cent as the category grows
    is normal and should not be fought. The redirection: rather than attacking competing brands, a leader
    should attack competing categories — take the bus rather than drive, take the meal home rather than
    cook. They add that competition actively helps the pioneer, since rival brands stimulate interest
    in the category even as the leader''s share falls.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Category growth outruns share loss. The rise of competing brands raises consumer interest in
      the category, so the pioneer''s smaller share is a share of something larger; fighting the rivals
      removes the interest they generate.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - category_creation
    - competitive_strategy
    conditions: for the leader of a growing category
  caveats:
  - text: the fifty per cent ceiling is asserted here and again in the Law of Fellowship as 'our research
      indicates', with no research reported. It also conflicts directly with the domination figures the
      authors cite approvingly in the Law of Contraction — 95 per cent, 80 per cent and 70 per cent —
      and the book does not reconcile the two
    origin: extractor_observed
  - text: 'the Polaroid case is a counterfactual: the authors assert Kodak would have expanded the instant-photography
      market had Polaroid not litigated it out, which cannot be checked'
    origin: extractor_observed
  source_stated_problems:
  - leaders get antsy as their 100 percent share of the initial market drops
  - '''we''ve got to fight back and recapture our rightful share,'' they say'
  source_stated_remedies:
  - a leader should fight competitive categories
