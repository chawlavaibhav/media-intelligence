  claim: 'The single mechanism the authors give for publicity''s superiority is source credibility: a
    statement made about a brand by someone other than its owner carries more weight than the same statement
    made by the owner. They pair this with an explanation of why they think the shift from advertising
    to PR has gone unremarked — the "grass phenomenon", that nobody notices a trend that develops slowly,
    which they illustrate with the unnoticed rise of the fax machine against the loudly noticed rise and
    fall of the Internet.

