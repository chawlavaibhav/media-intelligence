- sk_id: sk_r22_0031
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Extensions
  - The easiest way to destroy a brand is to put its name on everything.
  - management measures results with the wrong end of the ruler
  concept_label: line_extension_erodes_the_core_and_is_measured_with_the_wrong_ruler
  label_origin: source_verbatim
  claim: 'Law 10. The authors'' central prohibition, stated in absolute terms. Their principal diagnostic
    is a measurement error: management measures only the success of the extension and never measures the
    erosion of the core brand, so the decision is taken on half the ledger. They add a second, subtler
    cost — foregone opportunity, since the new brand that could have been launched instead was not. Their
    test question for where an extension''s volume comes from is directed at the core: they say a Coors
    Light drinker is more likely to have come from Coors than from a rival, and that after the three light
    beers launched, the three regular brands all declined substantially.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Cannibalisation plus an accounting blind spot. The extension is nearest in the mind to its
      own parent, so it draws its volume from the parent rather than from competitors, while the management
      measurement system records only the extension''s sales. The authors add "manufacturer logic" as
      the reason the error persists: when volume is flat the manufacturer concludes it needs more brands,
      and when the category is growing it concludes it does not — exactly the reverse, they say, of what
      the market requires.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - consumer_packaged_goods
    - beer
    - grocery_and_drug_trade
    conditions: stated as a law without conditions; the demonstration material is US grocery, drug and
      beer
  caveats:
  - text: the Kroger scanner figures (23,000 items in a store, 5,500 selling nothing in a month) are third-party
      data reported second-hand with no method given, and they describe slow-moving stock, not the erosion
      of core brands that the law claims
    origin: extractor_observed
  - text: '''more than 90 percent of all new products introduced in the U.S. grocery and drug trade are
      line extensions'' is cited without source and does not by itself say anything about whether extensions
      work'
    origin: extractor_observed
  - text: the beer case turns on the assertion that the three regular brands declined because of the light
      launches; no comparison group and no other cause is considered, and the authors themselves note
      a real market shift from regular to light beer
    origin: extractor_observed
  - text: the authors state the shift from regular to light is genuine and say it is 'really two markets'
      — which is a concession that the demand the extensions served was real
    origin: source_stated
  source_stated_problems:
  - it measures only the success of the extension. It never measures the erosion of the core brand.
  - the marketplace is filled with line extensions in areas where they are not needed and is starved for
    new brands in areas where they are needed
  source_stated_remedies:
  - the best way to capture those two markets is with two brands
  examples:
    positive:
    - description: SnackWell's, launched as a separate fat-free brand rather than as an extension, becoming
        a top-selling grocery item — and then, on the authors' account, falling once its own name was
        extended
