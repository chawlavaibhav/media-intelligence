    - description: Tab leading Diet Pepsi at the moment Diet Coke launched, offered as evidence that a
        separate name can beat an extended one
      figure_ref: null
    counter:
    - description: Diet Coke, which the authors concede succeeded, attributed to competitor weakness rather
        than counted against the law
      figure_ref: null
