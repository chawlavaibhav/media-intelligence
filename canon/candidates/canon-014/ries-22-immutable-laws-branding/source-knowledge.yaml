- sk_id: sk_r22_0015
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Advertising
  - Once born, a brand needs advertising to stay healthy.
  - Your advertising budget is like a country's defense budget.
  concept_label: advertising_is_a_defence_budget_not_an_investment
  label_origin: extractor_assigned
  claim: 'Law 4. The authors assign advertising a purely defensive role for an established leader. The
    budget, they say, does not buy anything; it keeps the brand from losing share, in the way a defence
    budget keeps a country from being overrun. They state this in its strongest form: leaders should not
    treat advertising budgets as investments that will pay dividends but as insurance against losses from
    competitive attack, and they concede in the same chapter that advertising may not pay for itself.
    Its value to the leader is that it raises the price of admission so that a challenger must spend heavily
    to take ground.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Deterrence by cost. Heavy spending by the incumbent forces any attacker to match it, which
      the authors say many competitors cannot afford and those who can will not bother — they will settle
      for the crumbs. The publicity-then-advertising sequence explains the timing: a brand''s publicity
      potential is exhausted once the category is established and the pioneer''s rise has been told, at
      which point there is no story left and advertising takes over.

      '
  scope:
    domain_discussed_by_source:
    - advertising
    - media_planning
    - brand_communication
    conditions: explicitly for established leaders after the publicity phase has ended; the authors say
      advertising will not build a fledgling brand
  caveats:
  - text: no return figure of any kind is computed anywhere; the claim that advertising does not pay dividends
      is asserted, not measured, and the authors give the reader no way to distinguish a defensive budget
      that is working from one that is wasted
    origin: extractor_observed
  - text: the media costs quoted ($2 million for a Super Bowl thirty seconds, $620,000 for a spot in ER,
      $343,000 average production) are of the late 1990s and are period-bound
    origin: extractor_observed
  - text: the defence-budget analogy does the argumentative work; nothing in the chapter tests it
    origin: extractor_observed
  source_stated_problems:
  - leaders should not look on their advertising budgets as investments that will pay dividends
  source_stated_remedies:
  - look on advertising budgets as insurance that will protect them against losses caused by competitive
    attacks
  examples:
