- sk_id: sk_r22_0013
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The best way to generate publicity is by being first.
  - the best way to make news is to announce a new category, not a new product
  concept_label: being_first_in_a_new_category_is_the_engine_of_publicity
  label_origin: extractor_assigned
  claim: 'The authors make being first into a category the operative cause of publicity, and therefore
    the operative cause of brand birth. Their reason is a claim about what news organisations want: the
    media want what is new, first and hot, not what is better. A brand can therefore make news only when
    it can announce a category rather than a product — which is why they say the way to become quotable
    is to define a new category and occupy it.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Newsworthiness is the intermediary. "Better" is not a story because every brand claims it;
      "first" is a story because it can only be told once. The authors treat the media''s appetite for
      novelty as the reason category creation converts into free coverage.

