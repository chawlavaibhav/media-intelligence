      0.8 per cent and a combined Korean loss of 0.4 per cent — is a third-party figure reported without
      source, undated beyond 'a recent year', and used to support a single-cause explanation with no consideration
      of any other difference between the economies. The book gives no reason to prefer branding over
      every alternative account
    origin: extractor_observed
  - text: '''East Asia does not have a banking problem, a financial problem, a monetary problem, or a
      political problem. East Asia has a branding problem'' is a polemical restatement; it is recorded
      here because it shows how far the authors extend the law, not because the book supports it'
