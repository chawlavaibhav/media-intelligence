- sk_id: sk_r22_0046
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Change
  - Brands can be changed, but only infrequently and only very carefully.
  - Brand changing occurs inside the mind of the consumer.
  concept_label: the_three_situations_in_which_a_brand_can_be_changed
  label_origin: extractor_assigned
  claim: 'Law 20. Against the previous law, the authors name three situations in which changing a brand
    is feasible. First, where the brand is weak or non-existent in the mind — there is effectively no
    brand, so it can be moved anywhere, and nobody will know. Second, where the brand is being moved permanently
    down the price ladder, which they say customers read as value; moving up is much harder if not impossible.
    Third, where the field is slow-moving and the change can be spread over a long period, in which case
    what happens is not that minds are changed but that enough time passes for forgetting to occur. They
    stress that the change must be assessed in the prospect''s mind and not in the company''s plans, and
    that customers are never wrong: told a brand is now something else, they reject the message.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Forgetting rather than persuasion is the operative mechanism in the third case, and it is why
      the authors say what works in banking will not work in computers or consumer electronics — there
      is not enough time for forgetting. In the first case there is nothing to overwrite. In the second,
      a permanent price reduction is read as value received rather than as a change of identity.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - repositioning
    - banking
    - technology_marketing
    conditions: explicitly conditional — the authors close by telling a brand with a unique and distinct
      perception to change at its own risk
  caveats:
  - text: the three conditions are stated without any test for which one a given brand is in, and the
      first — 'your brand is weak or nonexistent in the mind' — is exactly the judgement a company is
      least able to make about itself
    origin: extractor_observed
  - text: the Intel case works only because the authors assert that nobody outside a small trade audience
      knew Intel had stood for memory chips; this is asserted, not established
    origin: extractor_observed
  - text: Citicorp's corporate/consumer split reversing from roughly 80:20 to 30:70 over twenty-five years
      is a company figure reported second-hand; it describes the business mix, not the state of any prospect's
      mind, which is what the claim is about
    origin: extractor_observed
  source_stated_problems:
  - companies are often focused on what they need to do internally in order to facilitate the change of
    a brand
  - when you try to tell customers that your brand is different than it used to be, they will reject your
    message
  source_stated_remedies:
  - if you want to change your brand, first look into the prospect's mind. Where are you?
  examples:
    positive:
    - description: Intel leaving memory chips for microprocessors, which the authors say worked because
        almost nobody knew what Intel had previously stood for
      figure_ref: null
    counter:
    - description: Kentucky Fried Chicken shortening to KFC and promoting rotisserie chicken, with customers
        continuing to come for fried chicken until the chain returned to it
      figure_ref: null
  intra_source_relations:
