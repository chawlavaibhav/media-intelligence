  source_id: ries-22-immutable-laws-branding
  source_terms:
  - Most retail category killers follow the same five-step pattern.
  - Narrow the focus. Stock in depth. Buy cheap. Sell cheap. Dominate the category.
  concept_label: the_five_step_category_killer_pattern
  label_origin: source_verbatim
  claim: 'The authors set out a five-step pattern they say most retail category killers follow, in order:
    narrow the focus by contracting rather than expanding the category; stock the narrowed category in
    depth (a Toys "R" Us store carrying ten thousand toys against three thousand in a large department
    store); buy cheap, which they say is where the money is actually made; sell cheap, which depth of
    buying makes possible while holding margin; and dominate the category, which they name as the ultimate
    objective of any branding programme.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The steps are causally chained by the authors: narrowing permits depth, depth permits buying
      power, buying power permits low prices at maintained margin, and the combination produces category
      domination. Domination is then said to make a brand extremely powerful.

      '
  scope:
