- sk_id: sk_r22_0026
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - Omnibus brands are weak, not strong.
  - Mile-wide brands . . . look strong, but in reality are weak.
  - Who wins when two weak brands compete? A weak brand that just happens to be less weak than its competitor.
  concept_label: omnibus_brands_are_weak_even_when_they_are_large
  label_origin: extractor_assigned
  claim: 'The authors address the obvious objection to the Law of Expansion — that some of the largest
    and most profitable companies in the world carry very broad names — by separating size from brand
    strength. General Electric, General Motors and General Dynamics are, on their account, weak brands
    that look strong because they are well known and long established. Where such a brand succeeds, they
    say it is competing against other equally broad brands; where it meets a specialist, it loses. Their
    prediction is that a mile-wide brand entering a category with a focused incumbent will fail.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Relative weakness. Because outcomes are competitive, an omnibus brand facing only other omnibus
      brands can win without being strong; the authors say the test of strength is what happens when it
      goes against a specialist.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - industrial_and_diversified_companies
    conditions: when a broad brand competes against a focused one
  caveats:
  - text: 'this is the third use of the weak-competition escape clause: the counter-example the authors''
      own law most needs — a very large diversified brand that succeeds — is re-described rather than
      counted, and the book gives no independent way to establish that a set of competitors is weak'
    origin: extractor_observed
  - text: the supporting cases are two GE failures the authors select (mainframes against IBM, appliances
      against specialists); GE's successful businesses are not examined
    origin: extractor_observed
  source_stated_problems:
  - there is much misinformation on this subject in business publications today
  source_stated_remedies: []
  examples:
    positive: []
