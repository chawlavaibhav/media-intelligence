- sk_id: sk_r22_0041
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Siblings
  - There is a time and a place to launch a second brand.
  - You don't want to create a family of brands, you want to create a family of different brands.
  concept_label: six_conditions_governing_a_family_of_sibling_brands
  label_origin: extractor_assigned
  claim: 'Law 15. The authors open by conceding that their own laws seem to suggest a company should concentrate
    everything on one brand for one market, agree that this is true, and then license an exception: there
    comes a time to launch a second brand, and perhaps a third and fourth. They set six conditions — focus
    the family on a common product area; segment on a single attribute, price being the most common; set
    rigid, non-overlapping distinctions, which price makes easiest because numbers can be attached to
    it; give the siblings different rather than similar names, since alliteration is the curse of a sibling
    family; launch a new sibling only when it can create a new category, never to fill a hole in the line
    or block a competitor; and keep control at the highest level. They are explicit that a sibling strategy
    requires more top-management supervision, not less, because the natural drift is toward making the
    brands alike.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Separation is what makes a portfolio work, and separation decays without enforcement. The authors
      name the decay mechanism as sibling rivalry: each brand copies the best features of its siblings,
      and if control has been decentralised each division also broadens its own scope, so the portfolio
      converges on a single indistinct offering. Their case is General Motors, whose five brands they
      say a child could once tell apart from a block away.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - portfolio_strategy
    - brand_architecture
    conditions: explicitly not for every company; the authors say a mishandled second brand dilutes the
      first and wastes resources
  caveats:
  - text: the exception is granted without any test for when the 'time and place' has arrived, so the
      licence and the prohibition it qualifies cannot both be applied to a given case without judgement
      the book does not supply
    origin: extractor_observed
  - text: the authors themselves note that Wrigley's approach is imperfect, since three of its brands
      need the parent name to support generic descriptors, and that Time Inc. has since produced names
      that break the rule — the exemplars are graded rather than clean
    origin: source_stated
  - text: the four Coca-Cola siblings named as blocking launches (Mr Pibb, Fruitopia, Mello Yello, Surge)
      are all reported as having gone nowhere, which is consistent with the rule but is again a set selected
      after the outcome
    origin: extractor_observed
  source_stated_problems:
  - most managers are too internally focused to see the power of a separate identity
  - many CEOs believe that a sibling strategy works best when the organization itself is decentralized.
    Not so.
  source_stated_remedies:
  - make each sibling a unique individual brand with its own identity
  - keep control of the sibling family at the highest level
  examples:
    positive:
    - description: Wrigley's seven separately named gum brands run by one company with one sales force;
        Time Inc.'s seven titles, none of them named as a Time-for-something extension
      figure_ref: null
    - description: Black & Decker launching DeWalt rather than Black & Decker Pro for professional tools;
        Sara Lee launching L'eggs rather than a Hanes extension for supermarket distribution
      figure_ref: null
    counter:
    - description: General Motors after control was decentralised — expensive Chevrolets, cheap Cadillacs,
        and by the authors' summary all the cars ending up with fins
      figure_ref: null
  intra_source_relations:
