      billion market, regular Bayer falling about 10 per cent a year) are reported without source, and
      the regular brand's decline is stated by the authors themselves to predate the launch — aspirin
      was already losing to acetaminophen and ibuprofen — so the case cannot separate the two causes
    origin: extractor_observed
  - text: the rest of the argument is a list of extensions the authors treat as self-evidently self-defeating,
      with no evidence that any of them harmed its parent
    origin: extractor_observed
  source_stated_problems:
