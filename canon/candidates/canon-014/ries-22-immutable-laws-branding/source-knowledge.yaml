- sk_id: sk_r22_0009
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Contraction
  - A brand becomes stronger when you narrow its focus.
  concept_label: narrowing_the_focus_strengthens_the_brand
  label_origin: source_verbatim
  claim: 'Law 2. The positive form of Law 1: a brand becomes stronger when its focus is narrowed. The
    authors'' cases are all businesses that began in a broad format and cut it back — a coffee shop that
    sold everything reduced to coffee, a delicatessen reduced to the submarine sandwich, a children''s
    store that threw out the furniture and kept the toys. They add an operational consequence besides
    the mental one: when you make only one thing you get better at making it, which they illustrate by
    contrasting the original eleven-item McDonald''s menu with the sixty or seventy items a store carried
    when they wrote.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Two mechanisms are given, one mental and one operational. Mentally, a narrow brand can be retrieved
      by a single word, which the previous law says is the condition of power. Operationally, restricting
      the range concentrates practice, so quality of execution rises — the authors'' explanation for why
      a chain that makes only submarine sandwiches makes them well.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - retailing
    - food_service
    conditions: stated as a law; every case given is a retail or food-service format
  caveats:
  - text: every case is selected after success was known; the book presents no narrowly focused business
      that failed, which is the counter-example the claim most needs
    origin: extractor_observed
  - text: the evidence offered for Subway is Fred DeLuca's disclosed salary across 1990-1994, which is
      a fact about an owner's pay and not a measurement of the effect of narrowing
    origin: extractor_observed
  - text: in the same chapter the authors note in passing that Starbucks 'currently is busy getting into
      everything from ice cream to bottled drinks to tea' — their own hero example is, on their account,
      expanding — and they do not treat this as bearing on the law
    origin: extractor_observed
  - text: 'historical: all cases pre-2002'
    origin: extractor_observed
  source_stated_problems:
  - what is the conventional way to grow? Adding more things to sell.
  source_stated_remedies:
  - narrow the focus
  examples:
    positive:
    - description: Starbucks, Subway and Toys 'R' Us, each presented as the narrowing of an existing broad
        format
      figure_ref: null
    - description: Domino's, Little Caesars and Papa John's, each of which began with a wider menu and
        cut it back
      figure_ref: null
    counter: []
  intra_source_relations:
  - relation: specialises
