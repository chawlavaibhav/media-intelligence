- sk_id: sk_r22_0016
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - What should a brand leader advertise? Brand leadership, of course.
  - Leadership is the single most important motivating factor in consumer behavior.
  concept_label: advertise_leadership_rather_than_superiority
  label_origin: extractor_assigned
  claim: 'The authors prescribe that a leader advertise its leadership rather than its quality, and note
    that very few do. Their reason is what each claim produces in the reader: "our product is better"
    produces the response "that''s what they all say", while "our product is the leader" produces "it
    must be better". They also explain why leadership advertising is rare — companies ask customers why
    they buy, and customers deny buying the leading brand because it leads, saying instead that they buy
    it because it is better. The authors treat the stated reason as unreliable and the inference as circular
    but real.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A closed loop. People believe the better product wins; therefore they buy the leader in order
      to buy the better product; their purchase keeps it the leader; leadership sustains the perception
      of superiority. Leadership advertising works, on this account, by supplying the one premise the
      consumer will accept on the advertiser''s word.

      '
  scope:
    domain_discussed_by_source:
    - advertising
    - persuasion
    - consumer_marketing
    conditions: for the leading brand in a category
  caveats:
  - text: the account of what a consumer thinks on reading each claim is supplied by the authors as invented
      dialogue; no test of the two claims against each other is reported
    origin: extractor_observed
  - text: the argument that customers deny being influenced by leadership is used to discount contrary
      research findings in advance, which makes survey evidence unable to count against the claim
    origin: extractor_observed
  - text: explicitly culture-bound in the authors' own framing — they ground the inference in an American
      belief that the better product always wins
    origin: extractor_observed
  source_stated_problems:
  - almost every ad makes some type of better-product claim. That's what they all say.
  source_stated_remedies:
  - advertise leadership
  examples:
    positive:
    - description: 'leadership lines the authors cite as rare exceptions — America''s favourite ketchup,
        king of beers, Italy''s #1 pasta, #1 in tires'
