- sk_id: sk_r22_0032
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - What are line extensions like light, clear, healthy, and fat-free actually telling you? That the regular
    products are not good for you.
  - Let sleeping brands lie.
  concept_label: a_qualified_line_extension_tells_customers_the_core_product_is_deficient
  label_origin: extractor_assigned
  claim: 'A specific failure mode with a specific diagnostic cue. Where a line extension is defined by
    the absence or reduction of something — light, clear, healthy, fat-free, aspirin-free — the authors
    say the extension communicates that the original product has the defect the extension removes. The
    manufacturer thereby argues against its own core brand. Their diagnostic test is to ask, before launch,
    what existing customers of the brand will conclude when they see the extension on the shelf.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'An extension carries an implicit comparison. Naming the new item by what it lacks asserts that
      the old item has it, and the assertion comes from the manufacturer, which is the one source the
      customer has no reason to disbelieve on that particular point. Bayer Select is their case: a company
      telling aspirin buyers that its own aspirin-free products are better.

      '
  scope:
