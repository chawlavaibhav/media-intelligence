- sk_id: sk_r22_0001
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - A brand name is nothing but a word in the mind
  - Any and every proper noun is a brand
  concept_label: a_brand_is_a_proper_noun_held_in_a_mind_not_a_marketing_artefact
  label_origin: extractor_assigned
  claim: 'The authors reject every distinction the marketing trade draws between company names, division
    names, brand names, model names, subbrands, megabrands and flanker brands. On paper there is no difference;
    inside the prospect''s mind all of the variations vanish, because people do not talk or think in those
    categories. A brand, for them, is simply a proper noun lodged in a mind — which makes brands not limited
    to registered trademarks, and makes places, people and individuals brands too. The power of a brand
    is defined narrowly as its ability to influence purchasing behaviour, and they insist a brand name
    on a package is not the same thing as a brand name in a mind: the same shopper buys milk and bread
    as commodities and beer and cigarettes by brand in the same trip.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The test they apply is conversational: imagine a customer saying to a friend "what do you think
      of this new flanker brand?" Nobody talks that way, so the distinction has no existence in the only
      place the authors regard as real, which is the mind of the prospect. Everything that cannot be spoken
      by an ordinary customer is treated as an internal fiction.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - consumer_marketing
    - us_consumer_markets_late_twentieth_century
    conditions: the authors state it without limit; they apply it to companies, places and individuals
      alike
  caveats:
  - text: the argument is entirely definitional — the authors offer no evidence that customers cannot
      hold hierarchical brand structures, only the observation that customers do not say the words
    origin: extractor_observed
  - text: '''you are a brand'' is asserted as advice for personal success and is outside anything the
      book examines'
    origin: extractor_observed
  source_stated_problems:
  - marketing people have all sorts of definitions for company names, division names, brand names, and
    model names, not to mention subbrands, megabrands, flanker brands
  source_stated_remedies:
  - when you look inside the mind of the prospect all of these variations disappear
  examples:
    positive:
    - description: Philadelphia as simultaneously the cream cheese brand and the city; Patagonia as clothing
        line and tourist region
      figure_ref: null
    counter: []
  intra_source_relations:
  - relation: depends_on
    target: sk_r22_0029
    note: the Law of the Name restates this as the long-run claim that a brand is nothing more than a
      name
  - relation: generalises
    target: sk_r22_0039
    note: the Law of the Company is this definition applied to the company/brand question
