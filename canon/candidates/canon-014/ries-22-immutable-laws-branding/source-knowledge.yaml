- sk_id: sk_r22_0017
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of the Word
  - A brand should strive to own a word in the mind of the consumer.
  concept_label: a_brand_should_own_one_word_in_the_prospects_mind
  label_origin: source_verbatim
  claim: 'Law 5. The authors direct branding effort at securing a single word in the prospect''s mind
    that nobody else owns — safety for Volvo, driving for BMW, prestige for Mercedes-Benz, thick for Prego,
    overnight for Federal Express. They add a durability claim: once a brand owns a word it is almost
    impossible for a competitor to take it away, and competitors who build a genuinely better product
    on that dimension will still not own the word. They also note that a brand may own the category word
    itself rather than an attribute, as they say Kleenex owns tissue.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Words are how the mind gives meaning to a visual reality that has none on its own. The product
      may have a visual existence, but it is the name and its associations that give it meaning, so the
      branding contest is fought over which word attaches to which name.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - positioning
    - brand_communication
    conditions: the word must be one nobody else already owns in that category
  caveats:
  - text: the authors concede in the chapter that none of their three headline cases is a clean example,
      because Mercedes, Volvo and BMW have each recently violated the law by moving outside their word
    origin: source_stated
  - text: the durability claim ('almost impossible' to take a word away) is asserted with no case in which
      a competitor tried and the outcome was measured
    origin: extractor_observed
  - text: 'the Kleenex treatment strains against the Law of Extensions in the same book: Kleenex''s many
      varieties are said not to dilute the brand, and the reason given is that it owns the category word,
      which is an exemption the book does not state as a general rule'
    origin: extractor_observed
  source_stated_problems:
  - the minute a brand begins to stand for something in the mind, the company that owns the brand looks
    for ways to broaden the base
  source_stated_remedies:
