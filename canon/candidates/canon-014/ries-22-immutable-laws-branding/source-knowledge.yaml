      be checked against anything in the book
    origin: extractor_observed
  - text: the authors concede in the same passage that FedEx's expansion may have hurt the brand without
      hurting the company, and make its safety contingent on no competitor being astute enough to narrow
      against it; this is a substantial qualification of the law's practical force
    origin: source_stated
  - text: '''what was the market for X before Y? Nil'' is used four times as a rhetorical form; in no
      instance is a market size before or after actually given'
    origin: extractor_observed
