- sk_id: sk_r22_0021
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - You need to make your product or service more expensive than the competition.
  - You need to find a code word for prestige.
  concept_label: prestige_requires_a_higher_price_and_a_code_word
  label_origin: extractor_assigned
  claim: 'Where the word a brand wants to own is prestige, the authors say the word itself cannot be used,
    because people want prestige brands but will not admit it. They give a two-part procedure: price the
    product substantially above the comparable competitor, and find a code word that lets the buyer justify
    the purchase on other grounds. Their case is Mercedes-Benz, priced at about twice a comparable Cadillac,
    with an engineering line standing in for the prestige claim and giving the owner an excuse to buy
    an expensive car.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Two mechanisms combine. Price is read as evidence — the buyer infers that a car costing twice
      as much must be better. The code word handles the social problem that the real motive cannot be
      stated aloud, so the brand supplies a defensible reason for a purchase made on another one.

      '
