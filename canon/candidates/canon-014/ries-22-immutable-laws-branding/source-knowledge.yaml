  source_id: ries-22-immutable-laws-branding
  source_terms:
  - nothing in life, nothing in branding, is ever absolute. There are always exceptions to every rule.
  - the law of change is the biggest exception to the laws of branding
  - While the laws of branding are immutable, brands themselves are not.
  - The laws of branding seem to suggest that a company concentrate all of its resources on a single brand
    for a single market. True. But . . .
  concept_label: the_authors_own_limits_on_the_immutability_of_their_laws
  label_origin: extractor_assigned
  claim: 'Three passages in this span limit the book''s own title claim, and they are the source''s own
    words rather than an outside criticism. In chapter 20 the authors state that nothing in branding is
    ever absolute, that there are always exceptions to every rule, and that the Law of Change is the biggest
    exception to the laws of branding — that is, one member of the set is described as an exception to
    the others. In chapter 21 they narrow immutability to the laws themselves and explicitly exclude brands,
    which are born, mature and die. In chapter 15 they state what the laws seem to suggest, agree it is
    true, and then license a departure from it. The set is therefore presented by its own authors not
    as independent axioms but as an interconnected body of advice in which at least one member overrides
    the others and at least one is a stated exception.

    '
