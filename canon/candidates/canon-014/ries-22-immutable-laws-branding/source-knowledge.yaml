- sk_id: sk_r22_0037
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of the Generic
  - One of the fastest routes to failure is giving a brand a generic name.
  - The mind doesn't deal in letters or words. It deals in sounds.
  concept_label: a_generic_name_cannot_differentiate_because_the_mind_processes_sound_not_capitals
  label_origin: source_verbatim
  claim: 'Law 12. A generic name cannot separate a brand from its competitors, and the authors ground
    this in a claim about processing. Most brand communication happens verbally rather than visually —
    they say the average person spends nine times as long listening to radio and television as reading
    print — and even the printed word is processed through the sound it generates, so a reader cannot
    hear the difference between "general" and "General". Capitalising a generic word does not make it
    a name. They use this to explain why line extensions fare poorly: an extension typically pairs a brand
    name with a generic descriptor, and the descriptor cannot create the separate identity the branding
    process needs.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Sound is the channel. Because the mind processes the printed word through its sound, the orthographic
      marking that distinguishes a proper noun from a common one is lost, and the generic word is heard
      as generic however it is set. The naming process, the authors say, goes wrong because it is conducted
      visually — logotypes mounted on foamcore and passed round a boardroom — rather than by ear.

      '
  scope:
    domain_discussed_by_source:
    - brand_naming
    - brand_communication
    - dietary_supplements
    - technology_marketing
    conditions: the authors allow that some generic-named companies succeeded, and explain those separately
  caveats:
  - text: the nine-times listening-to-reading ratio is cited without source and is a claim about media
      time, not about how names are processed
    origin: extractor_observed
  - text: 'the historical objection is handled by an alternative explanation the authors assert rather
      than test: National Biscuit, General Electric and International Harvester succeeded because they
      were first, ''in spite of their names''. Since success is credited to priority and failure to the
      name, the law cannot be disconfirmed by either outcome'
    origin: extractor_observed
  - text: the Vaseline Intensive Care case is conceded as a generic descriptor that became a brand, and
      explained as luck — customers happening to treat the descriptor as a name
    origin: source_stated
  source_stated_problems:
  - the biggest mistake made when picking brand names. The process proceeds visually rather than verbally.
  - generic names disappear into the ether
  source_stated_remedies:
  - take a regular word and use it out of context to connote the primary attribute of your brand
  examples:
    positive:
    - description: words used out of context — Blockbuster for video rental, Budget for car rental, Staples
        for office supplies, and Intel as a generic phrase cut in half
      figure_ref: null
    counter:
    - description: the shelf of near-identical Nature's-something supplement brands, offered as names
        that cannot enter a mind
      figure_ref: null
