- sk_id: sk_r22_0020
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - what works is not expanding the brand, but expanding the market
  - Ask not what percentage of an existing market your brand can achieve, ask how large a market your
    brand can create by narrowing its focus and owning a word in the mind.
  concept_label: expand_the_market_not_the_brand
  label_origin: extractor_assigned
  claim: 'The authors identify growth pressure as the reason managers break the Law of the Word, and give
    their answer to it: expand the market for the narrow thing the brand already owns rather than expanding
    the brand into adjacent things. Federal Express, on their account, should have grown the market for
    overnight delivery instead of adding two- and three-day service; Mercedes-Benz grew the market for
    expensive cars rather than moving down-market. They close the chapter by rejecting market size as
    the first question a company should ask — the question is how large a market the brand can create
    by narrowing.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Narrow ownership is what makes the category desirable. Because Federal Express stood only for
      overnight, a package arriving by it signalled importance, which made overnight itself fashionable
      among executives and grew the whole category. The mechanism is that the brand''s narrowness supplies
      the meaning that expands demand for the category.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - category_creation
    - growth_strategy
    conditions: offered as the alternative available to a brand under pressure to grow
  caveats:
