- sk_id: sk_r22_0047
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Mortality
  - No brand will live forever. Euthanasia is often the best solution.
  - How well known the brand is / What the brand stands for
  - when a revolutionary new category develops, the inevitable winner is a revolutionary new brand name
  concept_label: brands_die_and_new_categories_are_won_by_new_names
  label_origin: extractor_assigned
  claim: 'Law 21. Brands are mortal; companies spend millions saving old ones while resisting the cost
    of creating new ones, and there is a time to harvest a brand and let it go. The authors give a valuation
    distinction that carries the diagnostic weight: how well known a brand is and what it stands for are
    different things. A well-known brand that stands for nothing, or for something obsolete, has no value
    and has nowhere to go but down; a brand that stands for something has value even if it is not well
    known, because it can be worked with — especially through publicity. Their strongest prediction is
    about succession: when a revolutionary new category appears, the winner is a new name, not an incumbent''s
    name carried across.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'A brand''s power is confined to the meaning attached to its name, so it cannot be carried into
      a category that meaning does not cover — Kodak stands for conventional photography, which is why
      the authors say the Kodak name has no power over videotape or digital imaging. The succession claim
      follows: the incumbent''s name is the wrong name for the new thing by definition, so a new name
      wins.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - portfolio_strategy
    - photography
    - consumer_electronics
    conditions: at a technological transition between categories
  caveats:
  - text: the succession list (Sony over the incumbent electronics names, Blockbuster over the incumbent
      retailers, Dell over the incumbent computer makers) is composed entirely of winners chosen after
      the fact; incumbents that did carry a name into a new category are not examined
    origin: extractor_observed
  - text: the Kodak discussion is a forecast made in the late 1990s about a transition then under way.
      This lane has deliberately NOT recorded what became of Kodak — there is no source for it here
    origin: extractor_observed
  - text: '''euthanasia is often the best solution'' is offered without any criterion for when a brand
      has reached that point'
    origin: extractor_observed
  source_stated_problems:
  - the Nursing Home for Dying Brands does a booming business
  - many managers make poor financial decisions because they fail to distinguish between two aspects of
    a brand's value
  source_stated_remedies:
  - invest your money in a new brand with a future
