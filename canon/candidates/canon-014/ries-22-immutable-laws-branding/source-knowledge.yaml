- sk_id: sk_r22_0012
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Publicity
  - The birth of a brand is achieved with publicity, not advertising.
  - Today brands are born, not made.
  concept_label: a_new_brand_is_born_with_publicity_not_advertising
  label_origin: source_verbatim
  claim: 'Law 3. The authors separate brand building from brand maintenance and assign advertising only
    to the second. A large advertising budget may be needed to maintain an established brand, but advertising
    will generally not get a new brand off the ground; a new brand must be capable of generating favourable
    coverage in the media or it will not have a chance. They state that public relations has eclipsed
    advertising as the most effective force in branding, that brands are now built with publicity and
    maintained with advertising, and that strategy should therefore be developed from a publicity point
    of view first rather than being written as advertising slogans for PR to amplify.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Two reasons are given. First, message volume: in an "overcommunicated society" where each person
      absorbs hundreds of commercial messages a day, the authors hold that what worked in the past no
      longer does. Second, and more central, third-party endorsement — what others say about a brand is
      more powerful than what the brand says about itself.

      '
  scope:
    domain_discussed_by_source:
    - brand_communication
    - public_relations
    - advertising
    - technology_marketing
    conditions: explicitly for NEW brands and new categories; the authors say the position of an established
      leader is different
  caveats:
  - text: the evidence is a set of brands the authors say grew with little advertising (The Body Shop,
      Starbucks, Wal-Mart, Sam's Club) set against one that spent heavily and failed (Miller Regular,
      $50 million); no brand that advertised heavily and succeeded at launch is examined, and no count
      of either kind is given
    origin: extractor_observed
  - text: the Miller Regular case is used to carry two claims at once — that advertising cannot build
      a brand and that a line-extended name has no publicity potential — so it cannot discriminate between
      them
    origin: extractor_observed
  - text: 'period-bound: written for a pre-social, pre-search media environment in which ''publicity''
      means newspaper, magazine, radio and television coverage'
    origin: extractor_observed
  source_stated_problems:
  - most marketers confuse brand building with brand maintenance
  - marketing strategies were usually formulated first into advertising slogans
  source_stated_remedies:
  - strategy should be developed first from a publicity point of view
  examples:
