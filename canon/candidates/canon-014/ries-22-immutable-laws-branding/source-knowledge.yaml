- sk_id: sk_r22_0023
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - Leadership is the most direct way to establish the credentials of a brand.
  - When you don't have the leading brand, your best strategy is to create a new category in which you
    can claim leadership.
  - Never forget leadership. No matter how small the market.
  concept_label: leadership_is_the_readiest_credential_and_can_be_manufactured_by_defining_a_category
  label_origin: extractor_assigned
  claim: 'The authors make leadership the default credential and, where a brand does not lead, prescribe
    inventing a category narrow enough that it does. They add three operating rules: promote leadership
    even where the market is tiny, because the market may grow and the position is hard to dislodge later;
    never assume prospects know who leads, which they say matters most in new categories where prospects
    have no experience and gravitate to the leader; and accept that as a category matures the more adventurous
    customers will go out of their way to avoid the leader — write them off, because you cannot appeal
    to everybody.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Leadership is a fact about the market rather than a claim about the product, so it is accepted
      where a performance claim would be discounted; reporters in particular will acknowledge it. Its
      durability is argued from persistence of leadership over time, and its value to a new prospect from
      that prospect having no other basis for choosing.

      '
  scope:
    domain_discussed_by_source:
    - brand_communication
    - positioning
    - category_creation
    - software_marketing
    conditions: for brands that lead something, however narrow; the authors say they found exploitable
      credentials for almost every client and invented a category where they could not
  caveats:
  - text: the durability claim rests on 'a widely publicized study of twenty-five leading brands . . .
      in the year 1923' with no author, title or method given — a third-party figure reported second-hand,
      not a measurement made by this book
    origin: extractor_observed
  - text: defining a category narrowly enough to lead it makes the credential a matter of how the category
      is described; the authors are explicit that they created credentials by inventing categories, which
      means the credential can be true and uninformative at the same time
    origin: extractor_observed
  - text: Datastream's '32 per cent of a very, very small market' is offered approvingly, which is the
      same move stated plainly
    origin: extractor_observed
  source_stated_problems:
