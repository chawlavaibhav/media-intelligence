- sk_id: sk_r22_0043
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Color
  - A brand should use a color that is the opposite of its major competitor's.
  - Leaders have first choice.
  concept_label: choose_a_colour_opposite_the_leaders_rather_than_the_categorys_symbolic_colour
  label_origin: extractor_assigned
  claim: 'Law 17. The authors give a rule with an order of precedence. The leader in a category should
    take the colour most symbolic of the category. Everyone after the leader should take a colour opposite
    the major competitor''s, and the authors state flatly that creating a separate identity matters more
    than using the right symbolic colour — the blue tractor they named for a Brazilian client is their
    own worked case of choosing wrongly on symbolism in order to choose rightly on differentiation. They
    restrict the palette to five basic colours plus neutrals, prefer a single colour, and say consistency
    over years is what lets a colour burn a brand into the mind.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The authors offer a physiological account: long wavelengths focus slightly behind the retina
      so red appears to advance, short wavelengths focus slightly in front so blue appears to recede,
      and this is why red reads as energetic and blue as calm. From this they derive red as a retail attention
      colour and blue as a corporate stability colour, with yellow brightest because it sits mid-spectrum.
      The differentiation rule itself does not depend on the physiology — it depends on the same argument
      as the rest of the book, that a brand must be separable in the mind.

      '
  scope:
    domain_discussed_by_source:
    - brand_communication
    - corporate_identity
    - colour
    - retail_branding
    conditions: the authors allow multiple colours where the object is to stand out physically, and treat
      the leader's choice as a different case from a follower's
  caveats:
  - text: the chromatic-aberration account is presented as the reason for the emotional readings of red
      and blue; the book cites no source for it and derives cultural associations from it, which the physiology
      does not support
    origin: extractor_observed
  - text: the colour meanings listed (white purity, black luxury, blue leadership, purple royalty, green
      environment) are Western conventions offered as though general
    origin: extractor_observed
  - text: '''red is the dominant color in 45 percent of all national flags'' is an uncited count used
      decoratively; it tests nothing in the argument'
    origin: extractor_observed
  - text: visual argument carried entirely in prose in this copy; no colour is shown — see figure_semantic_binding_lost
      in EXTRACTION-NOTES.md
    origin: extractor_observed
  source_stated_problems:
  - managers usually focus on the mood they want to establish rather than the unique identity they want
    to create
  - Burger King made the mistake of symbolizing the colors of a hamburger rather than picking a color
    to contrast with the leader
  source_stated_remedies:
  - be the opposite
  - it's more important to create a separate brand identity than it is to use the right symbolic color
  examples:
