- sk_id: sk_r22_0034
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Fellowship
  - In order to build the category, a brand should welcome other brands.
  - Choice stimulates demand.
  concept_label: competition_builds_the_category_and_should_be_welcomed
  label_origin: source_verbatim
  claim: 'Law 11. The dominant brand should not merely tolerate competitors but welcome them, because
    competition raises the noise level, makes customers more conscious of the category, and lifts consumption
    per head. The authors add a customer-side reason: choice is itself read as a benefit, and its absence
    makes buyers suspicious that the category is flawed or the price too high. They observe the same effect
    geographically — similar businesses cluster, and the cluster draws more customers than any of its
    members would alone, allows comparison shopping, and lets competitors watch each other.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Three mechanisms are given. Attention: rival brands increase the total volume of category communication,
      which the authors say expands interest. Comparison: a buyer with nothing to compare against distrusts
      the offer. Focus preservation: two competing brands can each stay narrow — the authors'' example
      is one appealing to older and one to younger customers — and between them cover a market that neither
      could cover without broadening.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - competitive_strategy
    - retailing
    - food_service
    conditions: the authors say two major brands per category seem ideal
  caveats:
  - text: the retail-cluster observations (Seventh Avenue, Wall Street, the diamond district, Branson)
      are descriptions of existing agglomerations, offered as illustrations of the branding claim rather
      than as evidence for it
    origin: extractor_observed
  - text: this law sits directly against the Law of Advertising in the same book, which tells a leader
      to use massive advertising to smother competitors and make them pay through the nose. The book never
      reconciles the two
    origin: extractor_observed
  - text: the Coca-Cola/Pepsi-Cola trademark case is used as a demonstration that losing a lawsuit was
      good for the winner's rival — a single retrospective reading
    origin: extractor_observed
  source_stated_problems:
