- sk_id: sk_r22_0025
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - To build a quality brand you need to narrow the focus and combine that narrow focus with a better
    name and a higher price.
  - What can we put into our brand to justify the higher price?
  concept_label: quality_perception_is_built_from_narrow_focus_a_better_name_and_a_higher_price
  label_origin: extractor_assigned
  claim: 'The authors'' constructive prescription for quality perception has three components, and they
    state that the way to build it is to follow the other laws rather than to improve the product. Narrowing
    makes a brand a specialist, and specialists are perceived to know more; a better name beats an equal
    competitor with a worse one; a high price is itself a benefit, because it lets a buyer take public
    satisfaction from consumption. They invert the conventional order of design: instead of building quality
    and pricing to match, start with a higher price and then ask what can be put into the brand to justify
    it.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Specialist perception is argued from the cardiologist against the general practitioner — most
      people believe the specialist knows more, and the authors say from a marketing point of view it
      does not matter whether that is true. High price works socially rather than functionally: the Rolex
      wearer is not buying punctuality but the public fact of affordability, and the authors ask whether
      $100 jeans would sell at that price with the label inside.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - pricing
    - premium_and_luxury_goods
    conditions: the price move is offered specifically for 'a sea of similar products with similar prices'
  caveats:
  - text: 'the authors qualify their own advice: they say they always advise clients to build as much
      quality as they can afford, so this is a claim about what builds the brand, not a licence to build
      a worse product'
    origin: source_stated
  - text: the justification examples (a bigger and heavier watch, an oversized driver, a fatter pen, more
      butterfat, longer ageing) are product changes chosen after the brands succeeded; no case is given
      of the same tactic failing
    origin: extractor_observed
  source_stated_problems:
  - conventional wisdom often advocates marketing a high-quality product at a comparable price
  source_stated_remedies:
  - deliberately start with a higher price
