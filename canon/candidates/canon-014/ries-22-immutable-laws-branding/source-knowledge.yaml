- sk_id: sk_r22_0027
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of the Category
  - A leading brand should promote the category, not the brand.
  - Customers don't really care about new brands, they care about new categories.
  concept_label: narrow_to_nothing_to_create_a_category_then_promote_the_category
  label_origin: extractor_assigned
  claim: 'Law 8. The authors take the Law of Contraction to its limit and treat the result as the best
    situation available: narrow the focus until no market remains, and you have created the chance to
    introduce a new category. They then prescribe two things done at once — launch so as to create the
    perception that the brand is the first, the leader, the pioneer or the original, and promote the category
    rather than the brand. Their reason is that customers care about categories, not brands: not about
    Domino''s but about whether the pizza arrives in thirty minutes. They state plainly that the most
    useful aspect of branding has nothing to do with increasing a company''s share of an existing market.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Preemption plus category promotion. Being the only brand associated with a concept gives a
      publicity platform; spending behind the concept rather than the name makes the concept take off
      and pull the brand with it. The generic effect follows: the brand name comes to stand for the category
      while the category itself is being enlarged.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - category_creation
    - food_service
    - sporting_goods
    conditions: for the pioneer and for the leader of a young category
  caveats:
  - text: '''what was the market for X before Y? Almost nothing'' is used five times in a row without
      a single figure; the rhetorical form does the work'
    origin: extractor_observed
  - text: the EatZi's case is a going concern at the time of writing whose outcome was not yet known,
      and the authors say themselves that it has yet to conceptualise the benefit it should be promoting
      — this is the one place in the span where a case is not selected on a known outcome
    origin: extractor_observed
  - text: the Apple Newton case is used to show a category-naming failure and simultaneously as a product
      failure; the two are not separated
    origin: extractor_observed
  source_stated_problems:
  - most category leaders just can't wait to shift into a brand-building mode. That's a mistake.
  - when Apple introduced its ill-fated Newton, it forgot about the category name
  source_stated_remedies:
  - promote the category, not the brand
  - increase the size of the pie rather than their slice of the pie
  examples:
    positive:
    - description: Prince with the oversize racquet, Callaway with the oversize driver and Domino's with
        home delivery, each preempting a category and then promoting it
      figure_ref: null
    counter:
    - description: Boston Chicken, first to focus on rotisserie chicken for take-home, which renamed itself
        Boston Market, added other meats, and fell into trouble
      figure_ref: null
