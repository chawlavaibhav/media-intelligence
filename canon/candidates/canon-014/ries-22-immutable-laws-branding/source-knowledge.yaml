- sk_id: sk_r22_0044
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Borders
  - There are no barriers to global branding. A brand should know no borders.
  - Keep the brand's narrow focus in its home country. Go global.
  - There is no such thing as a global brand with a global perception.
  concept_label: going_global_is_the_growth_route_that_preserves_narrow_focus
  label_origin: extractor_assigned
  claim: 'Law 18. The authors identify the belief pair that drives line extension — that home-market share
    cannot be increased much and that the company must grow — and offer global expansion as the answer
    that satisfies both without breaking the Law of Expansion: keep the narrow focus at home and take
    it abroad. They attach two conditions for a global brand: be first, and fit the perceptions attached
    to your country of origin. Country perception is treated as a real asset or liability that a brand
    cannot escape — every brand is from somewhere regardless of where it is made — and they add a language
    rule, that a name intended for world markets should work in English or at least sound as though it
    does.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Value is located in the mind, so where a brand is perceived to come from adds or subtracts
      value in the same way any other association does. A brand whose category is stereotypically associated
      with its country carries a credential across the border; one whose is not must borrow or manufacture
      one, which is why the authors treat Heineken''s success as three pieces of luck rather than as a
      repeatable procedure.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - global_marketing
    - brand_naming
    - beer
    - spirits
    - apparel
    conditions: the authors state plainly that not every brand can do this — 'can any brewery do the same?
      Of course not'
  caveats:
  - text: the country-perception pairs (Swiss watches, French wine, German cars, Japanese electronics,
      Italian clothing) are stated as self-evident and are the stereotypes of a particular period and
      readership
    origin: extractor_observed
  - text: the Heineken account attributes the outcome to three separate strokes of luck, which concedes
      that the two stated conditions were not sufficient
    origin: source_stated
  - text: the mistranslation examples are widely circulated marketing anecdotes reproduced without any
      source; this lane has not attempted to verify them and they carry no argumentative weight
    origin: extractor_observed
  - text: '''there are no barriers to global branding'' is stated as the law while the chapter itself
      lists duties, tariffs, quotas, inspections and regulations — the claim is about mental barriers,
      not trade ones'
    origin: extractor_observed
  source_stated_problems:
  - '''expanding our line may be dangerous, but it''s the only way to grow'''
  source_stated_remedies:
  - keep the brand's narrow focus in its home country. Go global.
  examples:
