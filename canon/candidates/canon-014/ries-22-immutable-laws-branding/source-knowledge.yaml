- sk_id: sk_r22_0040
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Subbrands
  - What branding builds, subbranding can destroy.
  - Subbranding is an inside-out branding strategy
  concept_label: subbranding_is_inside_out_and_transfers_no_equity
  label_origin: source_verbatim
  claim: 'Law 14. The authors treat subbranding, masterbranding and megabranding as terminology invented
    to legitimise moves management already wanted to make, and say the concepts have no meaning in the
    minds of most consumers. Their diagnostic is a demand test framed as a question nobody asks: did anyone
    ever ask a Holiday Inn clerk for a more expensive hotel, or a Cadillac dealer for a smaller Cadillac?
    Where the question is absurd, the subbrand answers a demand that does not exist. They add a naming-authority
    point: what the manufacturer calls a brand the customer calls a model, and what the manufacturer calls
    a megabrand the customer calls a brand — a company cannot impose its own branding system on a market
    that sees things differently.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Direction of travel. Subbranding pushes the core brand outward from inside the company rather
      than answering anything the customer wanted, and it captures management attention because of what
      it promises rather than what it delivers. The core brand''s established meaning then works against
      the extension: a customer paying a premium wants a premium brand, so paying more to stay at a Holiday
      Inn is the objection the strategy cannot answer.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - brand_architecture
    - hospitality
    - automobiles
    - fashion
    conditions: the authors allow one brand across several models, provided the models do not detract
      from the singular idea that sets the brand apart
  caveats:
  - text: the authors themselves record a case that goes the other way — Marquis by Waterford, called
      'a big success' — and dispose of it not with evidence but with an expectation that it will erode
      the parent line sooner or later
    origin: source_stated
  - text: the Holiday Inn Crowne Plaza research quote is the company's own customer research reported
      second-hand by the authors, with no method
    origin: extractor_observed
  - text: the Donna Karan case ends with a sale to LVMH, which is offered as though it were an outcome
      of the branding argument
    origin: extractor_observed
  source_stated_problems:
  - management tends to invent terminology in order to give legitimacy to the branding moves it wants
    to make
  - when you feel the need to create subbrands, you are chasing the market, you are not building the brand
  source_stated_remedies:
  - think like a customer
  examples:
