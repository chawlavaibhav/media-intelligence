- sk_id: sk_r22_0048
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Singularity
  - The most important aspect of a brand is its single-mindedness.
  - What's a brand? A singular idea or concept that you own inside the mind of the prospect.
  concept_label: singularity_is_the_defining_property_of_a_brand
  label_origin: source_verbatim
  claim: 'Law 22, and the book''s closing definition. The most important property of a brand is single-mindedness,
    and a brand is a singular idea or concept owned inside a prospect''s mind. The authors give the diagnostic
    in the form they used to open the book: ask what a name is, and if the answer is a list of contradictory
    attributes — a large, small, cheap, expensive car or truck — the brand is burned out. They add a boundary
    that matters for how a burned-out brand looks from outside: such brands can stay on the marketing
    scene for years because their competitors are equally line-extended, so survival is not evidence that
    singularity was retained. The Introduction states the same principle at the demand side: because branding
    rests on singularity, no brand can have universal appeal.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'The social function the authors assign a brand is substitution: a proper noun that can be used
      in place of a common phrase, so that a buyer asks for a Heineken instead of an imported beer, or
      a Volvo instead of a safe car. A name that stands for several things cannot perform that substitution,
      which is what "burned out" means in their vocabulary.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - positioning
    conditions: stated without limit as the closing definition of the book
  caveats:
  - text: the chapter is largely a restatement of the Law of Expansion and the Law of the Word, and this
      lane extracted it for the closing definition and the survival caveat rather than for its examples
    origin: extractor_observed
  - text: 'the survival caveat repeats the weak-competition escape clause a fourth time, and it does so
      in the book''s final pages: a brand''s continued existence is not allowed to count against the diagnosis'
    origin: extractor_observed
  source_stated_problems:
  - loss of singularity weakens a brand
  source_stated_remedies: []
  examples:
    positive:
    - description: the substitution test — asking for a Rolex rather than an expensive Swiss watch, a
        Prego rather than a thick spaghetti sauce
      figure_ref: null
    counter:
    - description: Atari, described as a brand that lost its life when the leading video game tried to
        become a computer
