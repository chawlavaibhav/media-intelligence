- sk_id: sk_r22_0045
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Consistency
  - A brand is not built overnight. Success is measured in decades, not years.
  - Markets may change, but brands shouldn't. Ever.
  - 'Run up a red flag whenever you hear the words: ''Why should we limit ourselves?'''
  concept_label: markets_may_change_but_brands_should_not_follow_them
  label_origin: source_verbatim
  claim: 'Law 19, which the authors call the most frequently violated. Once a brand occupies a position
    in a mind, its essential characteristics should never be changed, though they may be bent slightly
    or given a new slant. When the market swings elsewhere the choice is to follow the fad and destroy
    the brand, or to hang on and hope the market swings back — and the authors say hanging on is the better
    approach. They supply a specific verbal cue for the failure: the sentence "why should we limit ourselves?",
    which they say should raise a red flag, because limitation is the essence of branding. They also note
    that the failure is diagnosed the wrong way round in practice — when an extension flops it is the
    product that is declared a failure, never the branding concept.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Two mechanisms. Brands are used as personality statements or badges, and people change badges
      as they grow up, so a brand that follows its customers through their life stages ends up making
      a statement no group wants. And boredom: brand building is boring work, absolute consistency over
      decades is what works, and the people doing it get bored — which the authors offer as the actual
      cause of most violations.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - brand_communication
    - spirits
    - automobiles
    - food_service
    conditions: applies once the brand's characteristics are firmly planted in the mind; the authors allow
      slight bending
  caveats:
  - text: '''ever'' is absolute and is retracted in the very next chapter, which the authors introduce
      by saying nothing in branding is absolute'
    origin: extractor_observed
  - text: the durability examples (Volvo selling safety for thirty-five years, BMW driving for twenty-five)
      are counts of years, not measurements of effect
    origin: extractor_observed
  - text: the Little Caesars case attributes a fall to third place to the abandonment of a two-for-one
      takeout position, with no other cause considered and no figures given
    origin: extractor_observed
  - text: the line between 'bent slightly or given a new slant' and following the market is not drawn
      anywhere, and it is the line every practical case turns on
    origin: extractor_observed
  source_stated_problems:
  - the most frequently violated law
  - it's always the product that is declared a failure, never the branding concept
  source_stated_remedies:
  - you should limit your brand. That's the essence of branding.
  examples:
    positive: []
    counter:
    - description: Volvo adding sports cars and a convertible, and BMW adding a station wagon, each described
        as diluting the one word the brand owned
      figure_ref: null
    - description: 'the Arch Deluxe: an adult hamburger in a restaurant the authors say is understood
        as kid-oriented — good in the mouth, not in the mind'
      figure_ref: null
  intra_source_relations:
