- sk_id: sk_r22_0035
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - When there is too much choice, consumption suffers.
  - For each category, two major brands seem to be ideal.
  concept_label: choice_helps_the_category_until_it_becomes_confusion
  label_origin: extractor_assigned
  claim: 'The authors bound their own Law of Fellowship. Choice stimulates demand up to a point; past
    it, more brands, flavours and varieties produce confusion in the category and lower consumption per
    head. They name two major brands as the apparent ideal and give paired examples across five categories.
    Their case for the failure mode is wine, where they say the profusion of wineries, brands and vintages
    has prevented any major brand from arising and coincides with low American consumption per head.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Confusion. The mechanism is the mirror of the one-word argument: where no name can be retrieved
      with a stable meaning, the buyer has nothing to ask for, and the authors take the absence of a brand
      to be what suppresses consumption.

      '
  scope:
