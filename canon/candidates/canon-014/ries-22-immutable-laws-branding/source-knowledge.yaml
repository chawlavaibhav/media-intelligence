- sk_id: sk_r22_0039
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of the Company
  - Brands are brands. Companies are companies. There is a difference.
  - Consumers buy brands, they don't buy companies.
  concept_label: the_brand_name_must_dominate_the_company_name
  label_origin: extractor_assigned
  claim: 'Law 13. Brand names should almost always take precedence over company names, because consumers
    buy brands and not companies; where a company name is used alone it simply is the brand. The authors
    then give a preference that runs against their own separation: unless there are compelling reasons
    otherwise, the best strategy is to use the company name as the brand name, so that the question "what
    is a Zippo?" has one answer. Their diagnostic is the pair of questions — what is the name of the brand,
    and what is the name of the stuff inside the package — which they say had better return the same answer.
    They add that when customers feel obliged to say both names together, there is usually a branding
    problem, and that this normally happens because a generic word was used as the brand name.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Point of view. Managers are employees and are company-oriented; customers are brand-oriented,
      and the brand for them is not the name on the package but the thing inside it. The authors push
      the identification hard: Coca-Cola is not a cola made by a company, the liquid itself is Coca-Cola
      — which is why they say a company that understood branding could not have introduced a product called
      New Coke.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - brand_naming
    - corporate_identity
    conditions: for consumer-facing brands; they allow that the trade and some customers want to know
      who makes a brand
  caveats:
  - text: the recommendation to use the company name as the brand name is only safe where the company
      makes one thing, which is the very condition the Law of Expansion imposes; the authors do not state
      this dependency, and readers of the Hyundai passage in chapter 9 will find the opposite advice for
      a company that makes many things
    origin: extractor_observed
  - text: the Microsoft Excel and Microsoft Word contrast is an argument from what the authors say customers
      say, with no observation reported
    origin: extractor_observed
  source_stated_problems:
  - nothing causes as much confusion in the branding process as the proper use of a company name
  - when customers feel they have to use both your company name and your brand name together, you usually
    have a branding problem
  source_stated_remedies:
  - if you have to use the company name, use it. But do so in a decidedly secondary way.
  examples:
    positive:
    - description: WD-40, Zippo and Coca-Cola, where company and brand are one name and the question 'what
        is a…' has a single answer
      figure_ref: null
    counter:
    - description: Gillette's Trac II and Atra, marketed with the company name the same size as the brand
        name, against the Mach 3 where the brand name dominates
      figure_ref: null
  intra_source_relations:
  - relation: specialises
    target: sk_r22_0001
    note: the Introduction's definition applied to the company question
  - relation: depends_on
    target: sk_r22_0037
    note: the both-names symptom is attributed to a generic brand name
  - relation: trades_off_with
