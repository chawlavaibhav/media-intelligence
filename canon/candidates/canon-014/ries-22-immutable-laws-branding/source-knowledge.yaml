- sk_id: sk_r22_0042
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of Shape
  - A brand's logotype should be designed to fit the eyes. Both eyes.
  - Legibility is the most important consideration in selecting a typeface used in a logotype.
  - The meaning lies in the word, or words, not in the visual symbol.
  concept_label: the_logotype_should_be_horizontal_and_legible_and_the_symbol_is_secondary_to_the_word
  label_origin: extractor_assigned
  claim: 'Law 16. Three connected claims about visual identity. First shape: because human eyes are mounted
    side by side, the ideal logotype is horizontal, roughly two and a quarter units wide to one high,
    and a vertical logotype is at a severe disadvantage, especially on a retail frontage. Second typography:
    legibility is the most important consideration, over any expressive quality, because a typeface''s
    mood only becomes noticeable through exaggeration and exaggeration costs legibility — a trade the
    authors say is not worth making. Third symbol: the trademark is overrated, the meaning lies in the
    word, and it is the name that gives the symbol meaning rather than the reverse. A symbol may come
    to stand for a name through long association, but the authors say the advantages of using it alone
    are slim, and that if history has not already given a brand one of the few simple effective symbols
    it is probably too late to create one.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'For shape, binocular geometry: two eyes side by side make a horizontal field, so a horizontal
      mark takes maximum advantage of it. For typography, a stated vicious cycle: to make the mood of
      a face noticeable to an average prospect you must exaggerate it, and exaggeration destroys readability,
      so the name cannot be read and therefore cannot be remembered. For the symbol, a "rebus" effect:
      the mark can stand for the name only after the name has given it meaning.

      '
  scope:
    domain_discussed_by_source:
    - brand_communication
    - corporate_identity
    - typography
    - retail_signage
    conditions: the horizontal claim is said to hold wherever a logotype is used and to matter most on
      retail premises
  caveats:
  - text: the 2.25:1 proportion is given with no derivation and no evidence; the binocular argument is
      stated as though it settled the ratio, which it does not
    origin: extractor_observed
  - text: the typography claim rests on a paraphrase of David Ogilvy and on the authors' own rhetorical
      questions about which typeface Rolex or Rolls-Royce uses; no legibility measurement is cited
    origin: extractor_observed
  - text: this is one of the two chapters whose argument is visual in character, and the copy inspected
      carries the argument entirely in prose with no illustration in the text layer — see EXTRACTION-NOTES.md,
      figure_semantic_binding_lost
    origin: extractor_observed
  - text: the chapter sits in tension with the book's own decision to give two of its twenty-two laws
      to visual identity while arguing that visual identity is overrated
    origin: extractor_observed
  source_stated_problems:
  - logotype designers often go way overboard in picking a typeface to express the attribute of a brand
    rather than its ability to be clearly read
  - a great deal of effort has gone into creating elaborate symbols . . . for the most part, these efforts
    are wasted
  source_stated_remedies:
  - the ideal shape for a logotype is horizontal
  - legibility is the most important consideration
  examples:
