- sk_id: sk_r22_0029
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - The Law of the Name
  - In the long run a brand is nothing more than a name.
  - Don't confuse what makes a brand successful in the short term with what makes a brand successful in
    the long term.
  concept_label: in_the_long_run_a_brand_is_nothing_more_than_a_name
  label_origin: source_verbatim
  claim: 'Law 9. The authors separate the short-run and long-run bases of a brand. In the short run a
    brand needs a unique idea or concept, needs to be first in a new category, and needs to own a word.
    In the long run the unique idea disappears — every copier is now a plain-paper copier — and what remains
    is only the difference between the names, or rather the perception of the names. They therefore call
    the naming decision the most important branding decision a company will make, and say the most valuable
    asset of the Xerox Corporation is the Xerox name itself.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Technical differentiation erodes as competitors match it, while the name does not. Once the
      products are equivalent, the only remaining asymmetry between competitors is which name a prospect
      retrieves and what it connotes, so the name becomes the whole of the brand.

      '
  scope:
    domain_discussed_by_source:
    - brand_strategy
    - brand_naming
    - technology_and_office_equipment
    conditions: the long run, once category differentiation has been competed away
  caveats:
  - text: '''in the long run'' is not defined; the claim is stated as a time-limit argument with no time
      constant'
    origin: extractor_observed
  - text: '''the most valuable asset of the Xerox Corporation is the Xerox name'' is an assertion, not
      a valuation'
    origin: extractor_observed
  source_stated_problems:
  - marketers often disparage the importance of the name
  source_stated_remedies:
  - the most important branding decision you will ever make is what to name your product or service
  examples:
