- sk_id: sk_r22_0038
  source_id: ries-22-immutable-laws-branding
  source_terms:
  - take a regular word and use it out of context to connote the primary attribute of your brand
  - Sometimes you can carve out a brand name by cutting a generic in half.
  concept_label: build_a_name_by_displacing_an_ordinary_word_or_truncating_a_generic
  label_origin: extractor_assigned
  claim: 'The authors give two constructive naming procedures alongside the prohibition. The first is
    displacement: take an ordinary word and use it out of its usual context so that it connotes the brand''s
    primary attribute — Blockbuster borrowed from what Hollywood calls its hits, Budget saying what it
    charges, Staples turning an office product into a shop name. The second is truncation: cut a generic
    phrase down until what remains is short and distinctive, which they illustrate by contrasting an intelligent-chip
    company with Intel. They note that inventing an entirely new name is also available but reserve it
    for products that are genuinely revolutionary and unlikely to be copied soon.

    '
  claim_type: explicit_source_claim
  interpretation_basis: null
  mechanism:
    stated_by_source: true
    text: 'Displacement preserves meaning while removing the category ownership problem: the word already
      carries the connotation the brand wants, and using it outside its home context stops it being read
      as a description. Truncation produces a form that no competitor''s description can also use — every
      computer has an intelligent chip inside, but only one has Intel inside.

      '
  scope:
    domain_discussed_by_source:
    - brand_naming
    conditions: offered as the general alternative to a generic name
  caveats:
  - text: the procedures are illustrated only with names that succeeded; no failed displacement or truncation
      appears
    origin: extractor_observed
  - text: which ordinary words will work is not specified, so the procedure is a description of successful
      outcomes rather than a rule that could be applied in advance
    origin: extractor_observed
  source_stated_problems:
  - nobody is saying that you should always invent a new name for an established brand
  source_stated_remedies:
  - use it out of context to connote the primary attribute of your brand
  examples:
