# Al Ries & Laura Ries, *The 22 Immutable Laws of Branding* — SPEC-03 SourceConceptSystems
# EXPERIMENTAL — NOT LIVE CANON. book-expansion-qa-v1, non-merge, exploratory.
#
# Three systems. Each is recorded because the knowledge genuinely lives in the relationships and
# would be misread if the members were taken singly. The first is the set of twenty-two laws
# itself, which the lane brief flagged as a probable system: it IS one, but not of the kind the
# book's packaging implies, and the whole point of recording it is to state what the authors
# actually claim about how the laws relate — including the places where two laws pull against
# each other and the book does not reconcile them.
#
# ORIGIN MARKING. The membership of system 001 is source_stated (the book numbers and names its
# own twenty-two laws). Its system_type, its whole_system_claim and every conflict recorded in
# its internal_structure are OURS, and carry the origin marking that requires. Systems 002 and
# 003 are assembled by us from material the source presents as prose and cross-reference, and
# both say so.
#
# WHAT WE DID NOT DO. We did not resolve any conflict recorded here. Where two of the authors'
# laws point in opposite directions, both are recorded and the disagreement is left standing —
# that is the honest output, and inventing a reconciliation the book does not offer would be
# putting our own doctrine into a source layer.

source_id: ries-22-immutable-laws-branding

source_concept_systems:

- scs_id: scs_r22_001
  source_id: ries-22-immutable-laws-branding
  label: the_twenty_two_immutable_laws_of_branding
  label_origin: source_verbatim
  system_type: mutual_qualification
  system_type_origin: extractor_inferred
  description: >
    The twenty-two named laws, numbered and titled by the authors, each opening with a one-line
    epigram beneath its chapter title. The book presents them as a body, not as a list: laws are
    invoked by name inside other laws' chapters, one law is described as the biggest exception to
    the rest, another is introduced by conceding what "the laws seem to suggest" before departing
    from it, and one pair is given an explicit temporal order. What the authors do NOT claim
    anywhere in this span is that the laws are independent, mutually exclusive, or ranked; the
    numbering is presentational and only once is a law given an ordinal ("the first law of
    branding, the law of expansion", printed p. 91). Nor do they claim a procedure for applying
    them in sequence. The set is asserted to be universal — the Introduction says the laws apply
    equally to the Internet and the real world — while three chapters inside it limit that
    assertion.
  whole_system_claim:
    text: >
      The twenty-two laws cannot be read as twenty-two separable rules, because several of them
      are stated as qualifications of others and at least three pairs point in opposite directions
      without the book reconciling them. Read singly, a law will mislead: the Law of Contraction
      taken alone tells a retailer to dominate its category, while the Law of Fellowship and the
      Law of the Category both cap a leading brand at about half of it; the Law of Advertising
      tells a leader to smother competitors while the Law of Fellowship tells it to welcome them;
      the Law of Consistency says brands should never change while the Law of Change says they can.
      The set behaves as a body of mutually qualifying practitioner advice in which the reader
      supplies the judgement about which law governs a given case — and the book supplies no
      criterion for that judgement. Anyone using these laws must therefore hold the qualifying
      partner of each law alongside it.
    origin: extractor_synthesis
    interpretation_basis: >
      The source states the membership, the names and the epigrams; it states that the Law of
      Change is the biggest exception to the laws of branding (printed p. 101); it states that the
      laws are immutable while brands are not (p. 105); it states what the laws seem to suggest
      about single-brand concentration and then licenses a second brand (p. 77); and it invokes
      laws by name inside other chapters (pp. 35, 39, 56, 60, 91). All of that is the authors'.
      What is OURS is the characterisation of the whole as mutual qualification, the identification
      of the three unreconciled conflicts recorded below, and the conclusion that a law read alone
      will mislead. The authors nowhere say their laws conflict, and they nowhere tell the reader
      to hold a law's qualifying partner alongside it. Do not attribute that instruction to them.
    source_ref: null
  members:
    - {sk_ref: sk_r22_0005, role_in_system: law_01_expansion, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_r22_0009, role_in_system: law_02_contraction, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_r22_0012, role_in_system: law_03_publicity, order: 3, membership_origin: source_stated}
