    - {sk_ref: sk_r22_0047, role_in_system: law_21_mortality, order: 21, membership_origin: source_stated}
    - {sk_ref: sk_r22_0048, role_in_system: law_22_singularity, order: 22, membership_origin: source_stated}
    - {sk_ref: sk_r22_0049, role_in_system: the_authors_own_limits_on_the_set, order: 23, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: source_numbered
      origin: source_stated
    dependencies:
      - "Law 2 (Contraction) is the positive statement of Law 1 (Expansion); the authors restate the pair as a single sentence at printed p. 47 — expand and you reduce power, contract and you increase it"
      - "Law 8 (Category) is explicitly derived from Law 2 in its opening sentence: 'according to the law of contraction a brand becomes stronger when you narrow its focus. What happens when you narrow the focus to such a degree that there is no longer any market?' (printed p. 39)"
      - "Law 7 (Quality) is explicitly derived from the others: 'the best way to build a quality perception in the mind is by following the laws of branding. Take the law of contraction' (printed p. 35)"
      - "Law 11 (Fellowship) invokes Law 1 by name — 'the law of expansion suggests the opposite' (printed p. 56) — and points the reader forward to Law 15 for shares above fifty per cent (printed p. 60)"
      - "Law 18 (Borders) invokes Law 1 by name as 'the first law of branding' (printed p. 91)"
      - "Law 4 (Advertising) refers the reader back to Law 3's chapter by number (printed p. 19)"
      - "Law 12 (Generic) supplies the naming mechanism for Law 10's prohibition on extensions (printed p. 65)"
      - "Law 6 (Credentials) depends on Law 8: a brand without leadership is told to invent a category in which it can claim it (printed p. 30)"
    tradeoffs:
      - "short-term sales against long-term brand meaning — the authors' own framing of Law 1, and the trade that most of the book turns on (sk_r22_0006)"
      - "focus against growth — the pressure that produces every violation the book records; the authors permit four answers to it and forbid one (see scs_r22_003)"
      - "a brand's interests against its owner's: at printed p. 25 the authors say Federal Express's expansion hurts the brand and may not hurt the company, which concedes the two can come apart"
    conflicts:
      - "DOMINATION AGAINST THE SHARE CEILING. Law 2's five-step pattern names 'dominate the category' as the ultimate objective of any branding programme and cites 95, 80 and 70 per cent approvingly (printed pp. 10-11), while Law 8 states that a leading brand's rightful share is never more than 50 per cent (p. 42) and Law 11 gives about 50 per cent as the researched upper limit (p. 60). The book never addresses the conflict, and the Coca-Cola figure differs between the two passages without comment. UNRESOLVED — recorded, not adjudicated."
      - "SMOTHER AGAINST WELCOME. Law 4 tells a leader to use massive advertising to smother the competition and make competitors pay through the nose (printed p. 21); Law 11 tells the dominant brand to welcome competitors because they build the category (p. 56). Both are stated as laws. UNRESOLVED."
      - "NEVER CHANGE AGAINST CHANGE CAREFULLY. Law 19 says markets may change but brands should not, ever (printed p. 97); Law 20 opens by saying nothing in branding is absolute and sets out three situations in which a brand can be changed (p. 101), and names itself the biggest exception to the laws of branding. The authors present this as a stated exception rather than a conflict, but they give no criterion for identifying which of the three situations a brand is in. RECORDED AS THE AUTHORS' OWN EXCEPTION."
      - "ONE BRAND AGAINST A FAMILY. Law 2 and Law 22 point to a single narrowly focused brand; Law 15 opens by conceding that the laws seem to require exactly that, agreeing it is true, and then licensing a second, third and fourth brand (printed p. 77). Again an authors' concession, with no test for when the 'time and place' has come."
      - "NARROWING AGAINST STOCKING IN DEPTH. Inside Law 2 itself, step 1 is to narrow the focus and step 2 is to stock the narrowed category in depth — ten thousand toys against a department store's three thousand (printed p. 10). The brand contracts what it is about while expanding what it carries, and the book does not say where one stops and the other begins."
      - "THE WORD AGAINST THE VISUAL. Laws 16 and 17 devote two of the twenty-two to logotype and colour while both chapters argue that the visual is secondary and the meaning lies in the word (printed pp. 84-85)."
  source_warns_against_isolated_use: true
  source_warning_ref: "printed p. 101 — 'nothing in life, nothing in branding, is ever absolute. There are always exceptions to every rule. And the law of change is the biggest exception to the laws of branding.' Also printed p. 77 and p. 105. This is the closest the source comes to warning against isolated use; it is not framed as such a warning."
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, anecdotal, outcome_claimed, mechanism_given, repeated_within_source, historical_claim]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: none
    system_level_uncertainty: >
      The membership, the names, the numbering, the epigrams and every cross-reference listed under
      dependencies are the SOURCE'S. The classification as mutual_qualification, the six conflicts,
      the three trade-offs and the whole_system_claim are OURS. The authors never say their laws
      conflict; on the contrary the Introduction asserts them as universally applicable. Any
      downstream reader should treat the conflicts as this lane's reading of the text — checkable
      against the pages cited, since each conflict is a pair of passages, but a reading
      nonetheless. And the word "immutable" carries no evidential weight anywhere in this system:
      the entire set rests on selected corporate anecdote, and the book reports no measurement of
      its own (see sk_r22_0049 and PROVENANCE.md §6-7).
  provenance:
    chapter: "The 22 Immutable Laws of Branding, chapters 1-22"
    section: "chapter titles and epigrams; contents list at printed pp. v-vi"
    page_start: 3
    page_end: 110
    source_support: text

- scs_id: scs_r22_002
  source_id: ries-22-immutable-laws-branding
  label: the_brand_life_cycle_from_publicity_to_euthanasia
  label_origin: extractor_assigned
  system_type: sequence
  system_type_origin: extractor_inferred
  description: >
    Four of the laws describe successive phases in the life of a single brand, and the source
    itself supplies the connective tissue for the first transition and the last. A brand is born
    with publicity, generated by being first in a new category (Law 3). Once the category launch
    and the pioneer's rise have both been told, the publicity potential is exhausted, and the
    authors state the sequence explicitly: "First publicity, then advertising is the general rule"
    (printed p. 19); advertising thereafter defends rather than builds (Law 4). Through the long
    middle the brand is held still — success measured in decades, not years (Law 19). Change is
    possible only under three narrow conditions (Law 20). And finally the brand dies, at which
    point the authors say the money should go to a new brand rather than to life support (Law 21),
    because a new category will be won by a new name.
  whole_system_claim:
    text: >
      What a brand should do depends on where it is in this sequence, and the authors' most
      counter-conventional prescriptions are phase-specific rather than general. Advertising is
      useless for building and necessary for defending — the same activity, opposite verdicts,
      separated only by phase. The instruction to hold absolutely still applies to a brand that has
      already taken a position and not to one that has none, which is why Law 20's first permitted
      change is for a brand that is weak or non-existent in the mind. Reading any of these four
      laws without its phase produces the wrong advice: a start-up that takes Law 4 literally will
      spend on defence it has nothing to defend, and an established leader that takes Law 21
      literally will kill a brand that has not finished.
    origin: extractor_synthesis
    interpretation_basis: >
      The source states the publicity-to-advertising transition and its cause directly (printed
      pp. 18-19), states that brands are born, grow up, mature and die (p. 105), and states that
      Law 20's first permitted change applies where there is effectively no brand (p. 101). It does
      NOT present these four laws as a life cycle, does not number them as phases, and does not
      warn that a law read out of phase misleads. The assembly into a sequence, and the warning,
      are OURS.
    source_ref: null
  members:
    - {sk_ref: sk_r22_0012, role_in_system: birth_phase, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_r22_0013, role_in_system: the_engine_of_the_birth_phase, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_r22_0015, role_in_system: maintenance_phase, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_r22_0045, role_in_system: the_long_middle, order: 4, membership_origin: extractor_inferred}
    - {sk_ref: sk_r22_0046, role_in_system: the_conditional_exception, order: 5, membership_origin: extractor_inferred}
    - {sk_ref: sk_r22_0047, role_in_system: death_phase, order: 6, membership_origin: source_stated}
  internal_structure:
    ordering:
      scheme: causal
      origin: source_stated
    dependencies:
      - "the transition from phase 1 to phase 3 is caused, on the authors' account, by the exhaustion of publicity potential once both stories — the new category and the pioneer's rise — have been told (printed pp. 18-19)"
      - "phase 5 depends on a judgement about phase 4: whether the brand occupies a distinct position in the mind at all"
      - "phase 6 depends on Law 5: a brand can be carried only as far as the word it owns, which is why the authors say a new category is won by a new name"
    tradeoffs:
      - "investing in an old brand against funding a new one — the authors' framing of Law 21"
    conflicts:
      - "Law 19's 'ever' and Law 20's three permitted changes sit on either side of the same transition; see the conflict list in scs_r22_001"
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, anecdotal, mechanism_given, historical_claim]
    source_uncertainty: none
    extraction_uncertainty: none
    system_level_uncertainty: >
      The first transition is the source's, stated in a single sentence and given a cause. The
      rest of the sequence is OUR assembly of four separate chapters that the book does not
      connect. Nothing in the sequence is measured: no phase has a duration, no transition has a
      test, and the whole rests on the same anecdotal base as the rest of the book.
  provenance:
    chapter: "3 — Publicity; 4 — Advertising; 19 — Consistency; 20 — Change; 21 — Mortality"
    section: null
    page_start: 13
    page_end: 108
    source_support: text

- scs_id: scs_r22_003
  source_id: ries-22-immutable-laws-branding
  label: the_growth_problem_and_the_four_permitted_answers
  label_origin: extractor_assigned
  system_type: decision_framework
  system_type_origin: extractor_inferred
  description: >
    The book returns repeatedly to one situation: a company believes its home-market share cannot
    rise much further and believes it must grow, and therefore extends its brand. The authors state
    this belief pair verbatim at printed p. 91 and treat it as the origin of the violations the
    book catalogues. Against the one forbidden answer — put the existing name on more things (Law
    10) — they permit four. Grow the market for the narrow thing the brand already owns rather than
    the brand itself (Law 5, printed p. 26). Narrow further until a new category exists, then
    promote the category (Law 8). Take the unchanged narrow brand across borders (Law 18). Launch a
    separate sibling brand, under six conditions, when the market has genuinely moved or when share
    would otherwise pass about fifty per cent (Laws 10, 11 and 15).
  whole_system_claim:
    text: >
      The permitted answers are not alternatives of equal standing but a ladder the authors expect
      to be climbed in order of how little the existing brand is disturbed: expand the category
      around the brand, create an adjacent category, carry the brand abroad unchanged, and only
      then add a name. What unifies all four, and separates them from the forbidden answer, is a
      single test — does the growth move require the existing name to stand for anything new? If it
      does not, the authors permit it; if it does, they forbid it, whatever it is called. This test
      is what makes the difference between the sibling brand they license and the subbrand they
      condemn: both add a product, but only one adds meaning to an existing name.
    origin: extractor_synthesis
    interpretation_basis: >
      Every member is the source's, and the source itself connects three of the links: Law 18
      names the belief pair and offers going global as the answer to it, Law 11 points forward to
      Law 15 for shares above fifty per cent, and Law 10 states the two-branch rule about launching
      a second brand. The unifying test — whether the move requires the existing name to carry new
      meaning — is OURS. So is the ordering of the four answers as a ladder. The authors state no
      order among them and never give a single test for what separates permitted from forbidden
      growth; they argue case by case.
    source_ref: null
  members:
    - {sk_ref: sk_r22_0031, role_in_system: the_forbidden_answer, order: 0, membership_origin: source_stated}
    - {sk_ref: sk_r22_0020, role_in_system: permitted_answer_expand_the_market, order: 1, membership_origin: source_stated}
    - {sk_ref: sk_r22_0027, role_in_system: permitted_answer_create_a_category, order: 2, membership_origin: source_stated}
    - {sk_ref: sk_r22_0044, role_in_system: permitted_answer_go_global, order: 3, membership_origin: source_stated}
    - {sk_ref: sk_r22_0041, role_in_system: permitted_answer_launch_a_sibling, order: 4, membership_origin: source_stated}
    - {sk_ref: sk_r22_0033, role_in_system: the_decision_rule_between_them, order: 5, membership_origin: source_stated}
    - {sk_ref: sk_r22_0036, role_in_system: the_share_trigger_for_a_sibling, order: 6, membership_origin: source_stated}
    - {sk_ref: sk_r22_0040, role_in_system: the_disallowed_near_neighbour_of_the_sibling, order: 7, membership_origin: extractor_inferred}
  internal_structure:
    ordering:
      scheme: none
      origin: extractor_inferred
    dependencies:
      - "the sibling answer depends on the six conditions in Law 15; without them the authors say a second brand dilutes the first"
      - "the go-global answer depends on two stated conditions — being first, and fitting the perceptions of the country of origin"
      - "the create-a-category answer depends on the publicity engine of Law 3"
    tradeoffs:
      - "each permitted answer costs more management effort than the forbidden one; the authors say a sibling family needs more top-management supervision, not less"
    conflicts:
      - "the authors give no test for when a market has 'really' moved, which is the judgement that selects between the two branches of sk_r22_0033 and therefore between doing nothing and launching a brand"
  source_warns_against_isolated_use: false
  source_warning_ref: null
  evidence:
    characteristics: [explicitly_stated, argued, practitioner_assertion, anecdotal, outcome_claimed, mechanism_given, repeated_within_source, historical_claim]
    source_uncertainty: source_concedes_difficulty
    extraction_uncertainty: none
    system_level_uncertainty: >
      The members and three of the links are the source's; the framework, the ordering and the
      unifying test are OURS and should be attributed to this lane, not to Ries & Ries. No answer
      in this framework has been measured against any other anywhere in the book, and the whole
      rests on cases chosen after their outcomes were known.
