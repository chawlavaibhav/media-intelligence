representation_integrity:
  delivery_format: publisher_epub
  page_addressability: no_pages_reflowable
  page_addressability_evidence: >
    Reflowable Portfolio/Penguin EPUB (ebook ISBN 9780525540847). Every locator is chapter number
    and title plus Godin's own bold section heading, which occurs every few hundred words and so
    gives a genuinely fine locator without any page (PROVENANCE.md §2, Case 3);
    page_start/page_end are null on every object, spine numbers are secondary aids, and no page
    number was invented. Image asset names echoing print folios (page_246.png) are file names,
    not a page map.
  inspection_state: inspected_figure_level
  visual_argument_role: illustrative_only
  observed_loss_patterns:
    - pattern: no_authored_page
      affects: "the whole source"
      detectability: detected_by_independent_check
      recoverability: unrecoverable_in_this_copy
      evidence: >
        The format has no page at all; chapter-plus-bold-section locators are the stable
        citation unit (ledger, no_authored_page).
    - pattern: in_figure_text_absent
      affects: "the internal text of all 16 figures"
      detectability: detected_by_independent_check
      recoverability: recovered_in_this_copy
      evidence: >
        Every figure is a raster image whose internal text (axis and quadrant labels, the
        standard-deviation percentages, the ~130 logo names of the Helvetica clip sheet) is
        absent from the text layer. The REP-07 pass opened all 16 and confirms that for every
        figure adjacent to an extracted claim the prose states the semantic binding the figure
        carries; no frozen object cites an in-figure value the prose does not also state
        (ledger, in_figure_text_absent).
    - pattern: no_loss_detected
      affects: "the argument carried by the extraction"
      detectability: detected_by_independent_check
      recoverability: not_applicable
      evidence: >
        All 22 images in the archive were opened (ledger, inspection): 16 in-body figures -
        quadrant grids, positioning maps, the Metcalfe and long-tail charts, the Rogers-curve
        distribution, the Hype Cycle - plus cover, title page, two chevron ornaments, publisher
        logos and back-matter promo. Every figure illustrates a proposition the adjacent prose
        states in full, and the material where a figure comes closest to carrying a claim alone
        (the logo sheet, the Hype Cycle, the long-tail t-shirt) was refused by the extraction on
        independent grounds, so no frozen claim depends on any image.
  claim_resolution_after_inspection: all_resolved
  consequence: >
    Hash-on-arrival matched the SHA-256 recorded in PROVENANCE.md (ledger, hash_on_arrival), so
    the inspection provably examined the extraction's own copy. The runbook's expectation of a
    cheap null-visual pass was corrected: the book carries sixteen real figures, several pointed
    at by the prose - and every one is illustrative of stated propositions. The pass also closed,
    by inspection, the figure_semantic_binding_lost question PROVENANCE.md §2 raised and
    EXTRACTION-NOTES.md never recorded (ledger, visual_only_observations): no figure whose
    semantic binding an extracted claim needs is missing it. The shared CANON-014 blocker (no
    visual-evidence ledger) is closed by this pass.

evidence_origin:
  audit_scope: all_objects
  audit_scope_note: >
    All 29 objects categorised. A practitioner's book: the dominant origin by far is the author
    asserting from his own practice and constructed illustrations, with no measurement of his
    own credited anywhere in the frozen record - the extraction's central discipline was the
    aphorism test (what would it mean for this to be false?), not an evidence ledger.
  categories:
    - category: source_author_assertion
      sk_refs: [sk_god_0001, sk_god_0002, sk_god_0003, sk_god_0004, sk_god_0005, sk_god_0006,
                sk_god_0007, sk_god_0008, sk_god_0009, sk_god_0010, sk_god_0011, sk_god_0012,
                sk_god_0013, sk_god_0014, sk_god_0015, sk_god_0016, sk_god_0017, sk_god_0018,
                sk_god_0019, sk_god_0020, sk_god_0021, sk_god_0022, sk_god_0026, sk_god_0027,
                sk_god_0028, sk_god_0029]
      evidence: >
        Twenty-six objects stated in the author's own voice and argued from analogy, worked
        cases and his own practice; nearly all carry practitioner_assertion. This category
        includes the objects where Godin reports his own figures - the village solar-lantern
        afternoon (sk_god_0011, 'doubled', one observer, no counts), the JCPenney-era retail
        outcome (sk_god_0009, a fifty-per-cent figure reported unsourced), and his 1990s
        company's open and response rates (sk_god_0027) - because the frozen record deliberately
        credits none of them as measurement: they are recalled, uncontrolled business outcomes,
        and the extraction recorded them as outcome_claimed anecdote rather than
        empirical_within_source. Attribution credits inside these objects (Keith Johnstone's
        status vocabulary on sk_god_0017) are vocabulary credits, not quoted claims doing
        evidential work.
    - category: source_quotes_named_third_party
      sk_refs: [sk_god_0024, sk_god_0025]
      evidence: >
        Objects whose load-bearing support is an identified other author's material, carried
        approvingly: Geoffrey Moore's chasm and Gartner's hype cycle inside sk_god_0024 (the
        frozen caveat says plainly they are cited frameworks, not findings of this book), and
        Jay Levinson's quoted maxim ('change them when your accountant is tired of them') inside
        sk_god_0025.
    - category: source_quotes_unnamed_third_party
      sk_refs: [sk_god_0023]
      evidence: >
        The neophiliac-motive claim cites 'a study' of conspiracy believers with no researcher,
        venue or design named, and the object's other numeric support - the Rogers-curve
        proportions - is a normal distribution's percentages presented as though they were
        measurements of adoption behaviour, per the frozen caveat.
  relation_to_evidence_characteristics: >
    Consistent with the frozen record, mechanically checked: empirical_within_source appears on
    zero of 29 objects, and no category here asserts a supplied measurement. The near-misses are
    inside source_author_assertion by design: sk_god_0011 and sk_god_0027 are the author's own
    reported figures that the extraction refused to credit as measurement because they are
    uncontrolled recollections; this audit follows the frozen file's refusal rather than
    upgrading them, which is what the cross-check rule is for.

application_fit:
  audited: true
  findings:
    - consumer: creative_ir
      outcome: no_current_binding
      existing_binding_refs: []
      note: >
        None attempted, per EXTRACTION-NOTES §8: nothing about a Creative IR path is inferred
        from a trade book about positioning, and the task forbids it.
    - consumer: production_ir
      outcome: no_current_binding
      existing_binding_refs: []
      note: The source prescribes no physical production procedure.
    - consumer: evaluation
      outcome: binding_exists
      existing_binding_refs: [bnd_god_002, bnd_god_003, bnd_god_004]
      note: >
        Three evaluation bindings over inspectable properties of finished work: the
        made-to-offend-no-one flatness that pursuing mass produces, the two constraints on
        being talked about (gives the sharer something to say about themselves, buildable in),
        and the tension-versus-fear boundary (does the asset present a route forward).
    - consumer: governance
      outcome: no_current_binding
      existing_binding_refs: []
      note: >
        No governance binding was made. The nearest governance-shaped knowledge - the
        survivor-only support behind the smallest-viable-market cases (sk_god_0003's caveat) -
        is carried as caveats rather than as a rule, and none is manufactured here.
    - consumer: benchmark
      outcome: binding_exists
      existing_binding_refs: [bnd_god_001, bnd_god_005]
      note: >
        bnd_god_001 wraps the only ready-made brief specification in this lane group - Godin's
        thirteen-question worksheet - and bnd_god_005 uses the XY positioning method's
        by-construction minimal pairs (same offering, opposite extremes).
    - consumer: deterministic_composition
      outcome: no_current_binding
      existing_binding_refs: []
      note: No exactly-executable geometry or composition rule; the guidance is judgemental.
    - consumer: human_workflow
      outcome: candidate_no_binding_made
      existing_binding_refs: []
      note: >
        The XY positioning method (sk_god_0014) and the two-questions discipline (sk_god_0002)
        are procedures that act on a person's decision process, executable by a human before any
        artefact exists; no workflow binding was made in the extraction and none is manufactured
        here.
  unbound_knowledge_of_note:
    - sk_refs: [sk_god_0002]
      observation: >
        'Who's it for? What's it for?' with its two named failure modes is the
        questions-with-defaults shape the compiled-pack work (REP-05) wants for brief intake,
        and it currently binds only indirectly through the worksheet benchmark.
  conclusion: >
    A thin, honest fit for an assertive positioning book: three evaluation bindings and two
    benchmark bindings, five bindings from twenty-nine objects - the extraction calls that a
    refusal rate, and this audit agrees. Nothing binds to creative or production IR, and the
    unfalsifiable-aphorism hazard the extraction named is kept out of the bindings.

