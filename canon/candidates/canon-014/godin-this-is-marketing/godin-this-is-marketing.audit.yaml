technology_contingency:
  applicable: true
  applicability_basis: >
    The book's machinery is psychological and sociological (status, tension, worldview,
    smallest viable market), but a minority of claims are stated over the 2018 attention
    economy - platform permission, the advertising duopoly's economics, a specific retail
    episode - and the extraction period-bounded them per object. The question is answered class
    by class.
  assessed: true
  classes:
    - class: durable_mechanism
      sk_refs: [sk_god_0001, sk_god_0002, sk_god_0003, sk_god_0004, sk_god_0005, sk_god_0006,
                sk_god_0007, sk_god_0008, sk_god_0010, sk_god_0011, sk_god_0012, sk_god_0013,
                sk_god_0014, sk_god_0015, sk_god_0016, sk_god_0017, sk_god_0019, sk_god_0020,
                sk_god_0021, sk_god_0022, sk_god_0023, sk_god_0024, sk_god_0025, sk_god_0026,
                sk_god_0029]
      evidence: >
        Claims whose stated mechanism is human choice, status-seeking, belief-grouping and
        tension - not any platform generation. Where such an object carries historical_claim or
        culturally_bounded (several do), the frozen caveats bound the supporting examples and
        the 2018 framing rather than the claimed mechanism; sk_god_0014's asserted historical
        shift in what positioning requires (truth and generosity now) is recorded there as
        unevidenced and stays a caveat, not a reclassification.
    - class: technology_contingent
      sk_refs: [sk_god_0009, sk_god_0027, sk_god_0028]
      evidence: >
        Claims whose validity is tied to a media-economic environment that changes: the JCPenney
        episode's 2011-13 US department-store retail environment (sk_god_0009, the frozen caveat
        says that environment no longer exists in that form), the permission-asset and
        platform-sharecropper claims stated over 2018 platform incentives with supporting
        numbers from 1990s email (sk_god_0027), and the direct/brand economics stated over the
        named ad duopoly's 2018 CPMs and spend share (sk_god_0028). All three carry
        historical_claim in the frozen record.
    - class: uncertain
      sk_refs: [sk_god_0018]
      evidence: >
        The claim that modern urban, internet, arts and innovation culture is built primarily on
        affiliation rather than dominion is a broad cultural assertion of 2018 offered with no
        support (frozen caveat); whether it is a durable observation about those cultures or an
        artefact of its moment cannot be classed from this source.
  existing_characteristics_relied_on: [historical_claim, culturally_bounded]
