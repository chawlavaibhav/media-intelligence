  - id: t_eic_0012
    source_dir: binet-field-effectiveness-in-context-ch1
    evidence: 'short_termism: over-allocation of budget to sales activation at the expense of brand building'
  supporting_ids: [sk_hop_sa_0021, t_eic_0004, sk_eic_0014]
  independence:
  - {a: hopkins-scientific-advertising-ch1-7, b: binet-field-effectiveness-in-context-ch1, audit_relation: no_known_relation}
