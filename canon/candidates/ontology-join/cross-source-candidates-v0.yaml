- record_id: xj_0019
  kind: tension
  label: fixed_laws_vs_alchemy
  status: proposed
  relation: contradicts_across_sources
  usable: accepted_only
  confidence: high
  members:
  - id: sk_hop_sa_0001
    source_dir: hopkins-scientific-advertising-ch1-7
    evidence: 'advertising is a science: causes and effects analysed, correct procedures proved and established, governed by laws'
  - id: sk_sut_alc_0013
    source_dir: sutherland-alchemy-introduction
    evidence: 'in psychology the opposite of a good idea can also be a good idea; scarcity and ubiquity are both potent selling arguments'
  supporting_ids: [t_hop_sa_0035, sk_sut_alc_0006, sk_sut_alc_0026, sk_sut_alc_0032]
  independence:
  - {a: hopkins-scientific-advertising-ch1-7, b: sutherland-alchemy-introduction, audit_relation: no_entry_in_either_audit_record}
  frame_note: >
    Hopkins' fixed_principle ("invariably proves best") asserts context-free laws; Sutherland
    asserts context decides and opposite approaches both work. Qualified twice: sk_sut_alc_0032
    targets logical overreach, not logic, and both sources agree on testing (xj_0010) — the
    disagreement is about what testing yields (laws vs local, context-bound wins).

- record_id: xj_0020
