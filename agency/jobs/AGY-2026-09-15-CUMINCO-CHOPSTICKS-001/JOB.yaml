# ── 5. CREATIVE BLUEPRINT ────────────────────────────────────────────────────
blueprint:
  concept: "'Bottom stick, still.' Noodle night at a warm kitchen table: he fumbles a pair of chopsticks over a steaming Kairi bowl, she shows him with her hands over her Rosé bowl — three quiet macro beats that are the brand's own guide, verbatim — he fails anyway, and they eat happily regardless, her chopsticks resting in the bowl's rim notch. The lesson is the brand's blog; the warmth is the brand's register; the bowl demonstrates its own feature without a line of copy."
  first_read: ["steam and the mint bowl in front of him (colour + light)", "his crossed chopsticks / the escaping noodle (motion)", "her hand entering to show (blocking)"]
  hook: "A noodle slips back into the bowl in the first second — everyone who has held chopsticks wrong feels it before a word is read."
  offer_placement: none (spec; no price, no code)
  product_placement: "the two bowls are in every beat: hero-sized in the macro inserts (rim, glaze, embossed mark soft), table-scale in the two-shots; never obstructed by text (text sits in the upper third clear zone or the lower third above the Reels UI band)"
  proof: "the grip itself, shown not told, in three ≥ 3.3-s holds; and the closing image — chopsticks resting in the rim notch — which is the blog's own product argument"
  cta_placement: "brand line 'Cumin Co.' bottom-centre of the end beat; 'Ramen night at home.' above it; no other CTA"
  attention_order: "beat 1 wide two-shot (his hands → bowl → her face) → beat 2 macro her hand, bottom stick settles (one cue: stillness) → beat 3 macro her hand, top stick pinches (one cue: the pinch closing) → beat 4 macro his hand, sticks cross, noodle escapes (one cue: the miss) → beat 5 two-shot, both laughing, he eats, her sticks rest in the notch → text lands last"
  brand_world: "one soft window source camera-left, late afternoon; warm oat linen and light wood; the Kairi mint and Rosé glazes are the only saturated notes plus the noodles' amber; matte surfaces everywhere except the glaze (PA-D1); no printed matter, no packaging, no signage anywhere in frame"
  remember: "The bottom one doesn't move — and Cumin Co. is the bowl on a noodle night."
  muted_test: "yes — the three step texts and the actions carry the film without sound; VO adds warmth, not information"
  hindi_copy_origination: n/a
  voice_over:
    route_decision: "single generated narrator over silent clips (candidate pattern); calm, empathetic, Indian English, female"
    lines:
      - {beat: 1, text: "First noodle night with chopsticks.", t: "0.4–2.6"}
      - {beat: 2, text: "The bottom one just rests. It never moves.", t: "3.4–6.2"}
      - {beat: 3, text: "The top one does all the work. Hold it like a pencil.", t: "6.9–9.8"}
      - {beat: 4, text: "Pinch… and… nearly.", t: "10.4–12.6"}
      - {beat: 5, text: "It takes a few tries. Dinner doesn't wait.", t: "13.6–16.6"}
    chars_total: 158
    status: "FROZEN — approved by the user 2026-09-15T13:28:37Z"
  beats:
    - {n: 1, t: "0.0–3.0", shot: "two-shot, table height, wide", action: "he holds the sticks in a fist over the steaming Kairi bowl; a noodle slides back; she watches, amused", text: none, asset: clip-1 from plate-A}
    - {n: 2, t: "3.0–6.5", shot: "macro, her right hand over the Rosé bowl", action: "the bottom stick settles into the thumb web, ring finger curls under it; the hand then holds perfectly still", text: "1  The bottom stick stays still.", asset: clip-2 from plate-H1}
    - {n: 3, t: "6.5–10.0", shot: "macro, same hand, same framing", action: "the top stick is picked up like a pencil and pinches down once on noodles; the bottom stick does not move", text: "2  The top stick does all the work.", asset: clip-3 from plate-H2}
    - {n: 4, t: "10.0–13.0", shot: "macro, his right hand over the Kairi bowl", action: "he tries the pinch; the tips cross; the noodle escapes back into the broth", text: "3  Pinch and release.", asset: clip-4 from plate-H3}
    - {n: 5, t: "13.0–18.0", shot: "two-shot, slightly closer than beat 1", action: "both laugh; he eats with a spoon from the Kairi bowl (user's call); her chopsticks rest in the rim notch of the Rosé bowl", text: "Ramen night at home. / Cumin Co.", asset: clip-5 from plate-B}
  check_lines:
    PA-D1: "pass — glaze declared direct/glossy (soft window reflection), noodles and wood matte, linen matte; declared per plate prompt"
    PA-D2: "pass — one large soft window reflection on each glaze, camera-left, consistent across plates"
    PA-D3: "pass — soft source: soft shadow edges + large soft highlight; no pinpoint speculars"
    PA-D4: "pass — one nameable source: window, camera-left, late afternoon; every plate prompt names it"
    PA-D5: "pass — mint / rosé glaze against warm oat linen survives grayscale (mid vs light); checked on each plate (B3)"
    PA-D6: "pass — low-contrast, soft-key, warm mood attributed to the window light, declared in every prompt"
    PA-D7: "pass — 'the bowl on a noodle night' sells at a glance; the hero image needs no copy"
    PA-D8: "pass — glaze speculars declared wanted (large, soft); no accidental hard speculars; no glass in frame"
    PA-D9: "pass — three-quarter-high angle on the bowls shows rim, notch, wall and glaze; macro inserts frame rim + hand"
    PA-D10: "pass — no deviation"
    CA-D1: "pass — per beat exactly one dominant cue (see attention_order); text lands after the action settles"
    CA-D2: "pass — bowls sit in the lower-centre zone (the hands work above them; the upper third stays clear for text); reason stated, no ratio"
    CA-D3: "pass — edge treatment: bowls contained with margin in macros; two-shots crop at the shoulders deliberately (named); no near-tangency of rim to frame edge"
    CA-D4: "n-a — no frame within the frame"
