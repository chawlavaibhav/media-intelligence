intake:
  commercial_objective: "A spec film that makes Cumin Co.'s founders (ex-Meta / ex-Zomato growth) see that their own blog content converts into a warm, product-led launch film for the new Ramen Bowl in days — a launch-cadence capacity demonstration, never a quality critique (Controller hand-check 14 Sep: ~270 active premium ads)."
  audience: "Primary reader: Niharika Joshi / Udit Lekhi (Cumin Co. co-founders). Depicted consumer: urban Indian young adults setting up a noodle night at home (the blog's own reader: 'someone who wants to eat comfortably at their own table')."
  channel: "Instagram Reels / Meta feed (spec); Upwork portfolio tile 10-class material afterwards (quoted-per-project tier, no time claim)"
  deliverable_type: multi_shot_story           # runtime/contracts/DELIVERABLE-KINDS.yaml; outside Alpha-1 (C-7) — produced under the user's job-specific authorisation, not the runtime's auto-route
  package: "n/a (spec_work). Nearest PROFILE.md class: 'quoted per project' — 30-60 s films / product-story clips; no express, no 24-h claim"
  dimensions_aspects: ["1080x1920 9:16 (master)", "1080x1350 4:5", "1080x1080 1:1"]
  count: 1 film, 3 delivered geometries
  product_reference_assets: [ref_bowl_packshot, ref_bowl_chopsticks_lifestyle]
  mandatory_text:
    - {role: headline, value: "The bottom stick stays still.", script: latin, may_reflow: false, placement: overlay, source: "blog thesis, verbatim fragment"}
    - {role: headline, value: "The top stick does all the work.", script: latin, may_reflow: false, placement: overlay, source: "blog thesis, verbatim fragment"}
    - {role: headline, value: "Pinch and release.", script: latin, may_reflow: false, placement: overlay, source: "blog Step 5 title, verbatim fragment"}
    - {role: tagline, value: "Ramen night at home.", script: latin, may_reflow: false, placement: overlay, source: "blog para 1, verbatim fragment"}
    - {role: brand_line, value: "Cumin Co.", script: latin, may_reflow: false, placement: overlay}
    - {role: legal, value: "Unsolicited spec work. Not affiliated with or commissioned by Cumin Co.", script: latin, may_reflow: true, placement: "delivery note + portfolio caption only, never in-frame"}
  offer: none                                  # spec film carries no price and no offer code; the bowl's price (₹1,499 read off the PDP JSON 15 Sep) is not verified by hand and is not shown
  cta: none in-frame (brand line closes the film)
  language: [en]                               # Indian-English voice-over; Latin script only
  brand_constraints:
    colours: ["Kairi (Mint) glaze", "Rosé glaze", "warm off-white / oat ground", "acacia wood"]
    fonts: {latin: "a warm serif for the brand-like lines + a clean sans for step text — chosen at composition, one token source", devanagari: n/a}
    tone: "warmth / design register ('cookware that understands you', 'inspired by the warmth of Indian kitchens'); calm, empathetic, never instructional-stern"
    forbidden: ["any health / toxin / PTFE / lead-free / cadmium-free claim of ours", "patent or Enviromax", "performance claims not read verbatim off the PDP", "revenue / funding / household / repeat-rate figures", "implied endorsement or client relationship", "tool or model names in any customer- or portfolio-visible text", "the film actress from their partnership ad", "standing chopsticks upright in rice (blog etiquette)"]
  duration_s: 18
  deadline: "none stated; TTAO is the clock (2026-09-15T13:17:42Z start)"
  spend_ceiling_stated: "none in this session — asked at start-of-job summary. A prior cloud session (Downloads/HANDOFF.md) recorded USD 8 / 0 retries / ≤ USD 1 fal cash; that is prior authority and is NOT reusable money"
  assumptions:
    - "Product: the 15 cm Ceramic Ramen Bowl (Kairi Mint for him, Rosé for her — the blog's 'Meal for Two' pairing) with the brand's acacia chopsticks. The user said 'a bowl of sorts'; the blog post is the Ramen Bowl launch content, so this is the bowl."
    - "Three steps: the brand's guide has FIVE steps (Rest / Anchor / Pencil / Align / Pinch-and-release). The film compresses them to three beats whose text companions are verbatim fragments of the guide — the film never claims 'Step 1 of 3'; the numerals 1·2·3 are beat markers. Flagged to the user at the summary."
