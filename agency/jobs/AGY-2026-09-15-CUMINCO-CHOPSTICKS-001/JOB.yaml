    CA-D6: "pass — 9:16 justified by the vertical stack hand-over-bowl and the Reels slot; 4:5 / 1:1 are declared re-crops with subject anchoring"
    CA-D7: "pass — per cut: new information named (beat 2 the anchor; 3 the pinch; 4 the miss; 5 the outcome); device per beat: cut (no camera moves in macros; slow push only in beat 5)"
    CA-D8: "pass — the cut from beat 4 (miss) to beat 5 (laughing) sacrifices strict eye-trace for emotion, declared"
    CA-D9: "pass — her hand enters from frame-left, his from frame-right in every beat; the two-shots keep her camera-left and him camera-right"
    CA-D10: "pass — no macro holds past its content (≥ 3.3 s, ≤ 3.5 s); the two-shots hold 3 and 5 s; pace named as the Reels norm"
    CA-D11: "pass — macros static (motion is the hands); beat 5 has one slow push motivated by the outcome (moving in on the meal)"
