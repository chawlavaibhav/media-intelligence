  job_start_utc: 2026-09-15T13:17:42Z   # first production input in THIS session. A prior cloud session (Downloads/HANDOFF.md, never pushed) opened the same brief at 2026-09-15T12:06:40Z; recorded in intake.assumptions, not blended
  planning_complete_utc: null
