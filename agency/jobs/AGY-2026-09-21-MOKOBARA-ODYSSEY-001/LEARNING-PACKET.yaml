what_worked:
- nano-banana-2 with the product photos as reference images gave a faithful bag likeness first draw, 7/7; the model copies the tiny wordmark from the reference — a code paint-out before dispatch fixed it
  every time
- Veo 3.1 fast i2v held the face, hair and bag across 6 beats from per-beat stills anchored on one hero still; costume drifted once (beat 1)
- 'the deadpan gag was realised by Veo from a text description: arm in, both arms in, an impossibly long paddle out'
- Lyria wording refusal (HTTP 500) reproduced the Lane A pattern; a neutral re-send worked
- 'repair round: a still that already shows the END state (pebbles empty, bag full; man already on the raft with the paddle) + a short i2v of the last action beat the "do the whole action in 4 s" prompt
  every time (beats 5 and 6, first draw each)'
- giving the model an EXIT action after the goal state (lift the bag out of frame) stopped it undoing the goal (re-opening the bag)
- a customer's "weird" on the paddle was a warped blade in take 2 — the take we had not used (take 1) was the fix at USD 0; keep every take
- 'the super on a light sky: the site''s own black logo PNG measured 6.58:1 on real pixels where white measured 1.3:1 — brand assets come in two mono versions for this reason'
what_did_not:
- a 4-s clip cannot pack seven items; the pace asked exceeded the model (cf. Media Factory P5 "richer prompt != better when it exceeds model grammar")
- Veo added the product to a beat where the prompt did not mention it (beat 1) — negative-prompt the product where it must be absent
- tesseract over natural texture is noisy (40/56 frames) — useful only as a flag, not a gate
- two concurrent dispatches both counted the ledger and issued the same attempt id (att-020); the dispatch tool needs a lock or an atomic counter — relabelled by hand this time
- the brand face (NeurialGrotesk) is commercial and absent; the closest system face was used and said so — a licensed brand font is a customer-supplied asset in future intakes
