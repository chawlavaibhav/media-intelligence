/scontent.fdel1-8.fna.fbcdn.net\/v\/t39.8562-6\/434142421_286709107784021_8606740831775041629_n.svg?_nc_cat=1&amp;ccb=1-7&amp;_nc_sid=f537c7&amp;_nc_ohc=6KT__zmnd7cQ7kNvwHWrY6e&amp;_nc_oc=AdpJRKOOlUSU1vFIDMaAqApxPI6apuv5LEifM8hGT8SE6OJPl7j2t9RWd2684mmoNFR_POKfv0PQPieX_DI2z41R&amp;_nc_zt=14&amp;_nc_ht=scontent.fdel1-8.fna&amp;_nc_gid=M3xwGp7KX5hHyp2_f4PP3w&amp;_nc_ss=7320f&amp;oh=00_AQIQlWKtEtK25l0qZPhnRFF5PdF9vyK8B4VsoawEegYI3A&amp;oe=6AB5FC5E\" width=\"24\" height=\"24\" alt=\"\" loading=\"eager\" style=\"border-radius:0px\" \/>\u003Cspan class=\"_9nym\"> Create a Page \u003Cdiv class=\"hidden_elem\">\u003Cnoscript id=\"u_0_4d_W4\">\u003C\/noscript>\u003C\/div>\u003C\/span>\u003C\/a>"},4,"HTML"],["__markup_a588f507_0_0_WM",{"__html":"\u003Cdiv>\u003Cdiv id=\"FB4BSmoothScrollWrapper\" class=\"_au9u\">\u003Cdiv id=\"FB4BSmoothScrollContent\">\u003Cdiv role=\"main\" id=\"FB4BResponsiveMainContent\">\u003Cdiv class=\"_3dpr _9wq5 _asa9\">\u003Cdiv id=\"top\">\u003C\/div>\u003Cdiv id=\"redesign-headers\">\u003Cdiv class=\"_9b14 _2__g\">\u003Cdiv class=\"__sw _9f23 _ars8 _9f2e _asaz\">\u003Ch1 class=\"_ez1 _aio4 _aio2 _7oxw _34g8 _ag2g\" style=\"\">About text overlays and the safe zone for ads on Facebook and Instagram\u003C\/h1>\u003C\/div>\u003C\/div>\u003C\/div>\u003Cdiv id=\"GBMBizEdArticleRoot\" class=\"_ag2w _ag2z _ag0_\">\u003Cdiv class=\"_ag2-\">\u003Cdiv>\u003Cdiv class=\"__sw __sz __t3 __ta _ag2y\">\u003Cdiv class=\"_ag0-\">\u003Cnoscript id=\"u_0_4u_cV\">\u003C\/noscript>\u003Cdiv class=\"_5arv\" id=\"faq-page\">\u003Cdiv class=\"_5pfd\">\u003Cdiv class=\"mbl pam _b4p uiBoxLightblue dashedborder\">We\u2019ve updated how ads are labeled on Facebook and Instagram. Ads that were previously marked with a \u201cSponsored\u201d label will now display an \u201cAd\u201d label instead.\u003C\/div>\u003Cdiv class=\"_agle\">\u003Cdiv class=\"_aglg\">\u003Cimg class=\"_2qnn img\" src=\"https:\/\/static.xx.fbcdn.net\/mci_ab\/public\/cms\/?ab_b=e&amp;ab_page=CMS&amp;ab_entry=438223955063449&amp;version=1666716831&amp;transcode_extension=webp\" width=\"24\" height=\"24\" alt=\"\" loading=\"eager\" style=\"\" \/>\u003C\/div>\u003Cdiv class=\"_aglf\">\u003Cdiv>Some of these features are being introduced gradually. You may not see them yet.\u003C\/div>\u003C\/div>\u003C\/div>\u003Cp class=\"_3p8\">Text overlays are any words or phrases placed directly on top of an ad\u2019s visual content. These can highlight key messages, calls to action or important information. In Meta Ads Manager, you can add text overlays and logo overlays in various fonts and colors, and use the grid tool to choose their position on your creative.\u003C\/p>\u003Cp class=\"_3p8\">The safe zone refers to the area within your ad where important elements \u2014 like text overlays and logos \u2014 will not be cropped out or covered by the user interface. \u003C\/p>\u003Cdiv class=\"_9dt3 _9dt4 _a0fy _ar3_ _ab_k _adhw _af0b\" style=\"\">\u003Ch2>Text overlay best practices for ads\u003C\/h2>\u003C\/div>\u003Cul class=\"uiList _341 _3vz6 _4of _4kg\">\u003Cli>\u003Cdiv class=\"fcb\">Use a modern, clean font in a large enough type size and a contrasting hue.\u003C\/div>\u003C\/li>\u003Cli>\u003Cdiv class=\"fcb\">Don\u2019t obstruct the visuals.\u003C\/div>\u003C\/li>\u003Cli>\u003Cdiv class=\"fcb\">Don\u2019t communicate too many messages because ads usually only have one call to action.\u003C\/div>\u003C\/li>\u003Cli>\u003Cdiv class=\"fcb\">Stay within the safe zone.\u003C\/div>\u003C\/li>\u003C\/ul>\u003Cdiv class=\"_67p3 _5arv\">\u003Cdiv class=\"_56jq\">\u003C\/div>\u003C\/div>\u003Cdiv class=\"_9dt3 _9dt4 _a0fy _ar3_ _ab_k _adhw _af0b\" style=\"\">\u003Ch2>Understand safe zones for ads\u003C\/h2>\u003C\/div>\u003Cp class=\"_3p8\">For ads with a 9:16 aspect ratio in Stories, Reels, Feed and Facebook in-stream reels, keep the edges (top, bottom and sides) free of key creative elements, text and logos.\u003C\/p>\u003Cp class=\"_3p8\">For Instagram Feed ads using non-9:16 aspect ratios (such as 1:1 or 4:5) keep the bottom and side edges free of key creative elements, text and logos.\u003C\/p>\u003Cp class=\"_3p8\">This helps ensure that important brand elements stay within the safe zone and aren\u2019t cropped out or covered by the user interface, such as the profile icon or a call to action.\u003C\/p>\u003Cp class=\"_3p8\">In Meta Ads Manager, you can toggle on the \u003Cb class=\"_9o-0\">Safe zone guardrail\u003C\/b> to see where the safe zone is located. The safe zone is the area inside the yellow overlay that appears on your creative.\u003C\/p>\u003Cimg class=\"img\" src=\"https:\/\/static.xx.fbcdn.net\/mci_ab\/public\/cms\/?ab_b=e&amp;ab_page=CMS&amp;ab_entry=26179993448299694&amp;version=1770733604&amp;transcode_extension=webp\" width=\"700\" alt=\"Diagram showing safe zones for text overlays in Reels and Stories ads.\" \/>\u003Cp class=\"_3p8\">\u003Cb class=\"_9o-0\">Note:\u003C\/b> 9:16 video ads in Instagram Feed use the same safe zone guidance as Reels and Stories. \u003C\/p>\u003Cp class=\"_3p8\">Before you publish your ad, remember that:\u003C\/p>\u003Cul class=\"uiList _341 _3vz6 _4of _4kg\">\u003Cli>\u003Cdiv class=\"fcb\">On devices with screens that are taller than the 9:16 aspect ratio, we may either zoom the creative to better fill the whole screen (which can crop areas outside the safe zone), or show the creative in its original 9:16 aspect ratio and use a black background to fill any extra space. Keep critical text and visuals comfortably within the safe zone to help protect key elements and optimize ad performance for both cases.\u003C\/div>\u003C\/li>\u003Cli>\u003Cdiv class=\"fcb\">If you\u2019re including disclaimers on your Reels ads, you should leave the bottom 40\u0025 of your ad free from text, logos and other key creative elements.\u003C\/div>\u003C\/li>\u003C\/ul>\u003Cdiv class=\"_9dt3 _9dt4 _a0fy _ar3_ _ab_k _adhw _af0b\" style=\"\">\u003Ch2>Learn more\u003C\/h2>\u003C\/div>\u003Cul class=\"uiList _341
