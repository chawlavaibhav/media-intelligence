# ── 5. CREATIVE BLUEPRINT ────────────────────────────────────────────────────
blueprint:
  concept: "A vertical side-scrolling platform game in which a pixel-art PG owner is beaten down by five obstacles — tenant verification, collecting rent, tenants leaving without paying, no reconciliation, complaints — until a cheat code, INSTALL RENTOK APP, hands him a phone that makes him immune and lets him fire tick-marks that clear every obstacle and reach the flag. The film closes on the RentOk wordmark with the same ask."
  first_read: ["the moving sprite entering from the right", "its label", "the HUD change"]
  hook: "a game already in motion at frame 1 — the owner mid-jump with a live health bar, no title card"
  offer_placement: none
  product_placement: "the phone item at 17.4 s (F7), phone icon in the HUD from 18.0 s, five capability chips 19.6–25.6 s, wordmark end card 27.6–30.0 s"
  proof: "five green chips naming permitted capabilities (copy-deck.json claims_source_map)"
  cta_placement: "in-story cheat code at 15.8–17.2 s; direct end-card CTA 27.6–30.0 s"
  attention_order: "HUD → obstacle → label → health, repeated five times; then panel → typed code → phone → refill; then owner → projectile → burst → chip, five times; then flag → end card"
  brand_world: "one fictional source (daylight, upper-left); flat matte pixel art with 2-px outlines; palette sky/cream/terracotta/ochre for the world, brand blue/cyan/yellow/green reserved for the solution; register retro-arcade, affectionate"
  remember: "install the app = the cheat code for running a PG"
  muted_test: "yes"
  hindi_copy_origination: n-a
  check_lines: {PA-D1: pass, PA-D2: n-a, PA-D3: pass, PA-D4: pass, PA-D5: pass, PA-D6: pass, PA-D7: pass, PA-D8: n-a, PA-D9: n-a, PA-D10: pass, CA-D1: pass, CA-D2: pass, CA-D3: pass, CA-D4: pass, CA-D5: pass, CA-D6: pass, CA-D7: pass, CA-D8: pass, CA-D9: pass, CA-D10: pass, CA-D11: pass}   # bases in stages/03-CREATIVE.md A3
  deviations:
    - {decision_id: D-1, brief_clause: "no voice-over vs sk_abcd_0012/0021 — Stage 2.6 muted-first; no clean single-voice route (cases 001/002)"}
    - {decision_id: D-2, brief_clause: "raster wordmark placed as-is (its tagline unreadable at chip size) — brand fidelity, sk_vig_c003_0013"}
    - {decision_id: D-3, brief_clause: "customer-as-hero over product-as-hero — 'The player is basically a PG owner'"}
    - {decision_id: D-4, brief_clause: "GAME OVER? with a question mark — the film must not say the business fails"}
    - {decision_id: D-5, brief_clause: "no numbers in copy though the site prints them — A11"}
  reviews: []                      # checker gate verdicts are recorded by the checker, never here by the author

