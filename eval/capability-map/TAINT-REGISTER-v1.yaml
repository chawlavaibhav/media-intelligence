notes:
- id: NOTE-ROUTE-KEY-COLLISION
  text: 'RESOLVED by C-6c. IMG-TEXT held two cells -- flux-2-pro+C_composite_textless_base and flux-2-pro+code_overlay
    -- with the SAME route_key (''flux-2-pro'') and the SAME arm (''C_composite_textless_base''), resting
    on the same four trial identities with two different verdicts (1 of 4 eliminated versus 4 of 4). C-6c
    rules that the two are DIFFERENT route mechanisms: the model drawing the text (route identity flux-2-pro,
    text_mechanism model_draws_text) and code composing the text on a textless plate (route identity flux-2-pro+code_overlay,
    text_mechanism deterministic_text_composition). The map now carries distinct route_key values and
    a text_mechanism field on every cell, the recompute tool groups the two judgings apart, and a router
    keyed on (route_key, arm) gets one answer. The cell KEYS are unchanged so consumers keep their references.'
  cells:
  - IMG-TEXT/flux-2-pro+C_composite_textless_base
  - IMG-TEXT/flux-2-pro+code_overlay
  blocking_ruling: null
  resolved_by: C-6c
- id: NOTE-THREE-DENOMINATORS
  text: 'RESOLVED by C-3 and C-6b. The routing map used to run three denominator conventions at once:
    the planned count (8), a double count of failed plus re-sent draws (14, VID-I2V/wan-2.2-a14b-i2v),
    and a count with the failed draws deleted (2, VID-2SPK/kling-v3-pro-audio). There is now ONE convention
    everywhere: the planned denominator, with the STRICT reading -- the first sending of a draw is the
    one that counts, a failure stays a failure, and a re-send is carried as descriptive only. VID-I2V/wan-2.2-a14b-i2v
    is 2 of 8 with six counted failures; VID-2SPK/kling-v3-pro-audio is 0 of 2 with two counted failures.'
  blocking_ruling: null
  resolved_by:
  - C-3
  - C-6b
- id: NOTE-BLINDNESS-BY-CONDUCT
  text: 'Report B finding F-7. The two image rounds were blind by construction: the true mapping was held
    outside the repository and only a salted fingerprint was committed, and both fingerprints re-compute.
    Every video and audio round was blind by conduct only -- MAPPING.json sits beside the answer sheet,
    the results files say commitment_verified: false, and the blind copies the Controller actually watched
    were never sealed. A clean_observed status on a video or audio cell therefore means the ARITHMETIC
    reproduces; it does not mean the blinding can be proved after the fact. Each cell carries blinding_commitment_verified
    read from its own sealed results file. This is not in the problem vocabulary and changes no status
    here.'
  blocking_ruling: null
- id: NOTE-UNTESTED-PRICING-SURFACE
  text: Report B finding F-9. Every paid call behind this register ran on fal, Vertex, Sarvam or ElevenLabs.
    No call has ever run on the Gemini Developer API, yet the nano-banana-2, nano-banana-pro, nano-banana-pro-edit
    and gemini-omni routes are now priced against it. Where such a cell is clean_observed, the ACCEPTANCE
    evidence is clean; the PRICE is quoted on a surface that has never carried a call. C-13 is the smoke
    that would close it.
  blocking_ruling: null
- id: NOTE-WHY-NO-METHOD-TAINTED-CELLS
  text: 'No cell is method_tainted, and that is a statement about REPAIRABILITY, not about safety. Every
    problem the closed vocabulary can name has now been disposed of by a Controller ruling (problem_disposed_by),
    and the recompute rebuilt every number from the sealed bytes under the frozen rule, so no cell is
    waiting on a ruling any more and none is beyond repair. What the rulings did NOT do is re-test any
    route: where a route is eliminated only because failures the run had classified as infrastructure
    or request-shape faults are now counted (replacement_needed: true -- VID-I2V/wan-2.2-a14b-i2v, VID-2SPK/kling-v3-pro-audio+A_native,
    VID-T2V/kling-v3-pro-audio), only a clean rerun under Controller item C-15 could put a new number
    behind it. The generator''s own guard refuses to run against a changed map, so this file must be rebuilt
    deliberately whenever the map is.'
  blocking_ruling: null
- id: NOTE-REGISTRY-UNAFFECTED
  text: 'This register covers the human-acceptance tier only. The 575 deterministic Registry rows are
    untouched by every problem named here: they never read a Controller verdict (C-4: ''Deterministic
    Registry evidence is untouched''). Where one trial identity was sent twice the Registry holds two
    rows for it, distinguishable by run_ids; they must never be added together.'
