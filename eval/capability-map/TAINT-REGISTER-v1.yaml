# =============================================================================
# TAINT-REGISTER-v1 -- what each number in the routing map is worth
# =============================================================================
#
# READ THIS FIRST. It is written for a reader who is not an engineer.
#
# The routing map next door lists, for every job the project can do, which
# model routes were tried and how many of their outputs were accepted. This
# file sits beside it and answers a different question about each of those
# entries: HOW MUCH WEIGHT CAN THIS NUMBER TAKE?
#
# An audit on 10 September 2026 found that some numbers in the map were
# produced under a counting rule that was not the one written down before the
# money was spent, that some draws were sent twice under the same name, and
# that in one place the same four draws carried two different answers. On
# 14 September 2026 the Controller ruled on every one of those points
# (rulings C-3, C-4, C-6b, C-6c and C-6d, quoted verbatim under `rulings`
# below), and the map was regenerated so that every human-acceptance number
# is now COMPUTED under the frozen rule, applied literally, from the sealed
# run directories. This file records, per entry, which problems touched it,
# which ruling disposed of each, and what the number is now worth.
#
# None of that means the earlier work was wasted. It means a machine may use
# a number to choose a route for a paying customer only where the number
# reproduces from the sealed files under the rule that was frozen first.
#
# -----------------------------------------------------------------------------
# THE FIVE STATUSES, IN PLAIN ENGLISH
# -----------------------------------------------------------------------------
#
# clean_observed
#   WHAT IT MEANS: the literal frozen rule reproduces the number from the
#     sealed files; every named problem touching the entry has been disposed
#     of by a Controller ruling listed in `rulings_applied` and the entry has
#     been recomputed; at least four settled draws sit behind it. A settled
#     draw is one whose FIRST sending has a counted outcome -- an accept, a
#     reject, or a refusal / error counted as a failure. Re-sends and smoke
#     draws are never settled; they are listed as descriptive.
#   WHAT IT DOES NOT MEAN: it does not mean the route is good, cheap, or the
#     best choice; it does not mean the sample is large enough to be reliable in
#     a statistical sense; and it does NOT mean the route is cleared for launch
#     traffic. Four to eight draws judged by one person over two evenings is
#     honest evidence, not proof. An eliminated route can be clean_observed --
#     its number is clean -- and still carry production_use_allowed: false.
#
# directional_only
#   WHAT IT MEANS: the number reproduces and every problem is disposed of, but
#     it rests on fewer than four settled draws. It is a signal, not a
#     measurement.
#   WHAT IT DOES NOT MEAN: it does not mean the number is wrong. It means a
#     route that scored 2 out of 2 may simply be a coin that landed twice, so
#     the number should not decide a route on its own.
#
# awaiting_controller_ruling
#   WHAT IT MEANS: a specific question is still open and its answer changes the
#     entry's number, its keep / drop verdict, or whether it may be counted.
#     Since the rulings of 14 September 2026 NO entry carries this status: C-3,
#     C-4, C-6b, C-6c and OPEN-1 (closed by C-6d) are all ruled. The status
#     stays in the vocabulary so that a future unruled problem has somewhere
#     honest to go.
#
# method_tainted
#   WHAT IT MEANS: a known problem affects the number and no ruling can repair
#     it -- the only fix is to run the draws again, cleanly.
#   WHAT IT DOES NOT MEAN: it does not mean anyone acted in bad faith, and it
#     does not mean what was learned from those outputs is untrue. It means the
#     number cannot be defended. No entry carries it today (see
#     NOTE-WHY-NO-METHOD-TAINTED-CELLS).
#
# insufficient
#   WHAT IT MEANS: there is not enough evidence here to say anything at all.
#   WHAT IT DOES NOT MEAN: it does not mean the route failed.
#
# -----------------------------------------------------------------------------
# WHAT THIS FILE DELIBERATELY DOES NOT CONTAIN
# -----------------------------------------------------------------------------
#
# There is no launch-eligibility status anywhere in this file, and there never
# will be. Whether an entry may carry real customer traffic is a Controller
# ruling plus a runtime decision. This file only reports the state of the
# evidence. The runtime's own policy profile decides which of these statuses it
# is willing to route on automatically -- for example, a cautious profile might
# auto-route only on `clean_observed` and send everything else to a person.
#
# `production_use_allowed` is this file's reading of the evidence, not a
# permission:
#     true         the evidence behind this entry is settled and reproduces
#     manual_only  a person must look before this entry decides anything
#     false        do not rest a route decision on this entry (an eliminated
#                  route is always false, whatever its status)
#
# `replacement_needed: true` means the route's elimination rests on failures
# the run itself classified as infrastructure or request-shape faults, now
# counted under C-3 / C-6b. No ruling can re-test the route; only a clean
# rerun (Controller item C-15) can.
#
# `c4_disposition` appears on every entry C-4 names (a duplicated dispatched
# identity, a smoke draw sharing its name, or an infrastructure exclusion):
#     recomputed_under_frozen_rule            the number shown is the literal
#                                             recompute and stands
#     descriptive_only_pending_clean_replacement
#                                             the recompute could not produce a
#                                             frozen-rule number (none today)
#
# Nothing in this file was decided by its author. Every ruling applied is
# quoted; every question still open is named and left open.
#
# Generated by coordination/audits/tools/build_taint_register.py -- regenerate,
# do not hand-edit. The generator refuses to run if the routing map has changed.
# =============================================================================
