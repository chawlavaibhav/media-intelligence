- id: RR-1
  scope: text on stills
  rule: Code-set text on a cheap textless plate is the DEFAULT where exactness is contractual (prices, legal lines, brand names) or where a re-render
    must be free.
  evidence: 'img-r1-composite: 4/4 accepted, exact by construction, ~USD 0.03 per accepted picture (plates USD 0.12 + overlay USD 0)'
  tier: human_blind_acceptance
  registry: false
  caveat: could not be blind as to arm
  source: eval/experiments/EVAL-040/runs/img-r1/IMAGE-ROUND-1-SUMMARY.md (addendum 2026-09-09)
- id: RR-2
  scope: in-scene text on stills
  rule: 'Generated text where the type must sit inside the scene (on a pack, a sign, a surface): Nano Banana 2 or GPT Image 2.'
  evidence: 'img-r1 IMG-TEXT: nano-banana-2 4/4 and gpt-image-2 4/4 (Devanagari 2/2, English 2/2 each) at USD 0.053-0.067 a picture; nano-banana-pro
    4/4 at 3x the price'
  tier: human_blind_acceptance
  registry: false
  source: eval/experiments/EVAL-040/runs/img-r1/IMAGE-ROUND-1-SUMMARY.md
- id: RR-3
  scope: Devanagari text on stills
  rule: Avoid Seedream 5 Pro, Recraft V4 and FLUX.2 Pro for Devanagari text.
  evidence: 'img-r1 IMG-TEXT-01 (Hindi): seedream-5-pro 0/2, recraft-v4 0/2, flux-2-pro 0/2 - every rejection ''wrong spelling''; qwen-image-3
    1/2'
  tier: human_blind_acceptance
  registry: false
  source: eval/experiments/EVAL-040/runs/img-r1/IMAGE-ROUND-1-SUMMARY.md
- id: RR-4
  scope: edit / extend / compose / reference on a supplied photo
  rule: Seedream 5 Pro edit is the DEFAULT for work on a supplied photo (remove an object, extend a banner, compose a supplied face and pack,
    reproduce a referenced product or person).
  evidence: 'half2: seedream-5-pro-edit 10/12 (IMG-EDIT 2/4, IMG-EXT 2/2, IMG-COMP 2/2, IMG-REF 4/4) at USD 0.0675 a call; flux-2-pro-edit 4/12;
    nano-banana-pro-edit 3/12 at USD 0.15 a call'
  tier: human_blind_acceptance
  registry: false
  caveat: n = 2 per (case, route); two Controller rejects on IMG-REF-02 ('clothes changed') read the contract more strictly than it is written
  source: eval/experiments/EVAL-040/runs/half2/IMAGE-HALF-TWO-SUMMARY.md
- id: RR-5
  scope: extend a banner (outpaint to 9:16)
  rule: Only Seedream 5 Pro edit extended the banner without resizing or cutting it; avoid FLUX.2 Pro edit and Nano Banana Pro edit for extension.
  evidence: 'half2 IMG-EXT-01: seedream-5-pro-edit 2/2; flux-2-pro-edit 0/2 ''changed size''; nano-banana-pro-edit 0/2 ''slight cutoff, not consistent'''
  tier: human_blind_acceptance
  registry: false
  source: eval/experiments/EVAL-040/runs/half2/IMAGE-HALF-TWO-SUMMARY.md
- id: RR-6
  scope: exact Devanagari text in motion (video)
  rule: Never ask the premium video model to write the text. Set the type by code on an animated textless plate (cheap image-to-video), or carry
    a CORRECT still into a cheap animator.
  evidence: 'topo3-video VID-TOPO3-01: arm C (FLUX.2 Pro textless plate -> MiniMax H3 Max i2v -> exact strings by code on every frame) 2/2; arm
    B native text on veo-3.1-full 0/2 and kling-v3-pro 0/2 (''different text altogether''); arm A (qwen-image-3 plate -> H3 Max / Wan 3.0 Prime
    i2v) 0/4, every reject the plate''s own misspelling carried faithfully - the animators preserved the lettering'
  tier: human_blind_acceptance
  registry: false
  caveat: video packet was blind as to route and arm but had no off-repo reveal key
  source: eval/experiments/EVAL-040/runs/topo3-video/VIDEO-PIECE-1-SUMMARY.md
- id: RR-7
  scope: the still that feeds a cheap animator
  rule: 'A text plate that goes into image-to-video must come from a text-capable still route (RR-2: Nano Banana 2 or GPT Image 2), never from
    the cheapest still model.'
  evidence: 'topo3-video arm A: both qwen-image-3 9:16 plates misspelled Hindi (0/4 in motion); topo3-nb-video arm A2: nano-banana-2 plate (draw
    2 accepted, draw 1 ''two shri'') -> H3 Max 2/2 - the same animator passes once the plate is right'
  tier: human_blind_acceptance
  registry: false
  status: tested_in_motion_2026-09-09
  source: eval/experiments/EVAL-040/runs/topo3-video/VIDEO-PIECE-1-SUMMARY.md
