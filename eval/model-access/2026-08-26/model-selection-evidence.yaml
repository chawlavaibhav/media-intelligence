# EVAL-008 — machine-readable model-selection evidence
# Written and frozen BEFORE any sourcing analysis. Contains NO route/provider
# recommendation by design; sourcing lives in the E8-C/D/E/F artifacts.
#
# 0 API calls. Rs 0 spent. No account created. No terms accepted. No Registry row.

meta:
  task: EVAL-008
  package: E8-A + E8-B
  date: 2026-08-26
  branch: claude/eval-008-cloud-model-access-i3fl86
  task_file_branch_name: work/eval-008-model-access
  selection_independent_of_sourcing: true
  authorises_spend: false
  registry_rows_created: 0

evidence_tiers:
  T1:
    name: primary_read_directly
    meaning: page fetched by this session
    reachable_domains: [cloud.google.com]
    supports: [exact_model_id, price, availability]
  T2:
    name: provider_page_via_search
    meaning: search tool read a vendor-owned or platform-owned page and summarised it
    supports: [probable_existence, approximate_capability]
    does_not_support: [version_pinning, price]
  T3:
    name: third_party
    meaning: comparison blog, leaderboard summary, news article
    supports: [currently_serious, family_comparison]
    does_not_support: [identity, availability, price]

environment_constraint:
  network_egress: restricted_by_policy
  domains_probed: 37
  vendor_domains_reachable: 1
  reachable: [cloud.google.com]
  blocked_examples:
    [fal.ai, docs.fal.ai, platform.openai.com, developers.openai.com, bfl.ai,
     runwayml.com, runway.com, elevenlabs.io, docs.byteplus.com, www.sarvam.ai,
     docs.sarvam.ai, replicate.com, huggingface.co, artificialanalysis.ai,
     ideogram.ai, stability.ai, app.klingai.com, platform.minimax.io,
     openrouter.ai, lumalabs.ai, en.wikipedia.org, docs.cloud.google.com]
  consequence: >
    Provider documentation could not be read directly except on cloud.google.com.
    Every non-Google identity, availability and price claim is therefore T2 or T3
    and must be re-verified from the provider catalogue before any paid run.
  demonstrated_T3_price_failure:
    claim_a: "Veo 3.1 costs $0.03/sec (third-party)"
    claim_b: "Veo 3.1 costs $0.40/sec (third-party)"
    T1_truth: "Veo 3.1 video+audio $0.40 per generated video (per count) at 720p/1080p; $0.60 at 4K"
    lesson: third_party_prices_are_wrong_in_unit_and_magnitude

hypotheses:
  H_frontier_image_quality: frontier overall image quality
  H_text_exactness: exact text/typography, Devanagari and Hinglish in particular
  H_instruction_edit: instruction-driven image editing without full re-roll
  H_identity_consistency: person/product identity held across images or shots
  H_lineage_acceptance: whether training lineage changes commercial acceptance
  H_structured_ir: whether a structured image IR reduces retries
  H_open_economics: marginal cost of owning the step on open weights
  H_vector_output: taking type out of the raster generator
  H_t2v_quality: text-to-video quality
  H_reference_video: reference-conditioned video, reference count as a variable
  H_multishot_continuity: state continuity across cuts
  H_footage_editing: editing existing footage vs generating new
  H_native_dialogue: native multilingual audio/dialogue in one pass
  H_conversational_loop: conversational iteration vs re-prompting
  H_cost_knee: where paying more stops buying accepted outcomes
  H_clean_rights: quality cost of licensed-data-only training
  H_indic_voice: Indian-language and Hinglish voice correctness
  H_lipsync_route: TTS + lip-sync as the working route to Hindi dialogue video

