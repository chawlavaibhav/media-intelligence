  the_one_reachable_domain:
    domain: cloud.google.com
    http_code: '200'
    why_it_still_yields_nothing: 'Its model and pricing documentation 301-redirects to docs.cloud.google.com,
      which is itself blocked. The two pricing pages that do render return truncated, JavaScript-dependent
      content with no pricing table. Three separate pages were attempted: Vertex AI generative-AI
      pricing, Vertex AI video generation docs, and Cloud Text-to-Speech pricing. None yielded
      a model id or a price.'
  search_engine_available: true
  why_search_was_not_used_as_evidence: Search returns reseller blogs, cost calculators and
    third-party 'cheap access' sites. E7-B permits secondary sources as leads and forbids
    them as evidence, so none was used to populate any field.
  why_memory_was_not_used: Model identities and prices in this market change faster than the
    gap between the assistant's training cutoff and today - a lead encountered in an earlier
    session showed legacy veo-3.0 endpoints retired 30 June 2026, after that cutoff. A remembered
    price inside a document that gates a budget is invented evidence however plausible it
    reads.
  consequence_for_the_program: E7-B could not be completed. It does NOT block E7-A, E7-C,
    E7-D, E7-E or the benchmark architecture in E7-F, all of which rest on evidence that IS
    reachable. It blocks only the cost forecast's price cells, which remain null.
  resolution: One session with ordinary web access fills these rows from the official pages.
    The row schema below is complete, so this is a lookup, not a design task.
