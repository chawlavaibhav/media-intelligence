# PIN-INDEX — ElevenLabs DIRECT surface (route keys elevenlabs-v3-direct / elevenlabs-music-direct), fetched 2026-09-09 (UTC).
# Same conventions as ../PIN-INDEX.yaml: the exact file fetched, its size, its SHA-256 fingerprint, the command used and an exact
# substring (evidence_quote) that must be present in the bytes. Free, unauthenticated fetches of public documentation pages;
# no API call, no key. The paid API (api.elevenlabs.io) was NOT contacted.
#
# What the pages say (plain English):
#   * ElevenLabs does not bill the direct API in cash per call. Every plan carries a monthly pool of CREDITS and every product
#     draws from that one pool. The pricing page names the rates: "Text to Speech 1 credit per character" and
#     "Eleven Music 900 credits per minute" (with the caveat that the exact TTS cost "depend[s] on the model used").
#   * The harness therefore models the direct surface as a NEW ledger pool `elevenlabs_credits`: 0 USD cash per call, the
#     credit quantity recorded natively (characters for TTS x 1 credit; music at 900 credits per minute, minutes rounded UP —
#     the page does not say whether music is prorated, so the reservation is whole minutes, conservative), capped by
#     `elevenlabs_cap_credits` in the authorisation file (missing = 0 = forbidden).
#   * The text-to-speech reference does NOT name the v3 model id (its example uses eleven_multilingual_v2, the documented
#     default of `model_id`). The models page does: `eleven_v3`, "5,000" character limit. That page was pinned as a fourth
#     file so the id the adapter sends is a pinned value, not a guess.
#   * The music reference URL /docs/api-reference/music/compose answered 200; the endpoint it documents is POST /v1/music
#     (not /v1/music/compose). Body: prompt (<=4100 characters), music_length_ms (3000-600000), model_id (default music_v1).
#   * Plan sizes on the pricing page (monthly credits): Free $0 (10,000); Starter $6 (30,000); Creator $22 (121,000);
#     Pro $99 (600,000); Scale $299 (1,800,000); Business $990 (6,000,000). Not used by the harness — recorded for context.
