# PIN-INDEX - Gemini Developer API surface for the Gemini-named routes (nano-banana-2, nano-banana-pro, nano-banana-pro-edit,
# gemini-omni-1.1-flash / -10s / -long), pinned 2026-09-09 after CONTROLLER-GEMINI-MODELS-VIA-GEMINI-KEY-2026-09-09 and
# CONTROLLER-FAL-LAST-CHOICE-CREDITS-FIRST-2026-09-09. Free, unauthenticated fetches (curl); no key, no spend.
# schema_page pins document the request / response shapes the gemini_api_image and gemini_api_omni adapters send and read;
# price pins point at the pricing page already pinned for the judge (gemini-api-judge/) and quote the exact price strings.
# Every bytes / sha256 value is computed from the file by the generator (scratchpad pin_gemini_api.py); each evidence_quote is
# a verbatim substring of the pinned bytes. The pinned pages are Google devsite HTML and carry the site's own public browser
# config keys, as the earlier gemini-api-judge/ and vertex-shared/ pins do; nothing of the user's is in them.
surface: gemini_api
key_name: GOOGLE_API_KEY (name only; ~/.mi-keys)
billing_pool: credits
billing_note: GCP credits via the Gemini API key
what_the_gemini_api_exposes:
  image: 'Nano Banana 2 (gemini-3.1-flash-image) and Nano Banana Pro (gemini-3-pro-image): the guide documents the Interactions API (POST /v1beta/interactions,
    response_format{type:image, aspect_ratio, image_size}); the generateContent reference documents generationConfig.responseModalities / imageConfig{aspectRatio,
    imageSize} for the same models. The adapter sends the generateContent form (reference-documented, live-proven on this surface by EVAL-038
    on 2026-09-01, byte-identical to the Vertex body).'
  omni_video: 'Gemini Omni Flash (gemini-omni-1.1-flash, ''now generally available to developers on the paid tier of the Gemini API'') via the
    Interactions API only: POST /v1beta/interactions with response_format{type:video, aspect_ratio 16:9|9:16, resolution 360p|720p|1080p|4k, duration,
    delivery inline|uri}; inline base64 mp4 back. No generateContent video form exists.'
