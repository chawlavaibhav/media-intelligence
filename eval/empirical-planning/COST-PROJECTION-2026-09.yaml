assumptions:
- id: A-01
  assumption: Veo prices on the Vertex page read "$0.40 / 1 count" under "Price (USD)"; the bytes do not define "count". Treated as per second of generated video (the survey and fal read it that way, and
    fal lists the identical 0.40/s).
  source: survey-2026-09-05 §2; roster notes; NOT a vendor statement
- id: A-02
  assumption: Video items are 6 s at 720p unless the plan states 10 s or 15 s; TTS items are 250 characters; lipsync plates are 6 s (Kling lipsync bills a 6-s plate as 10 s).
  source: STAGE-A-ROUTE-PRICE-REFRESH-2026-08-26.yaml execution_assumptions; plan §C.3
- id: A-03
  assumption: 'Image outputs are ≈ 1 megapixel (1024-class): FLUX.2-pro = first-megapixel price; Nano Banana 2/Pro = 1K row; Qwen = 1K; Seedream ≤ 1536² tier; GPT Image 2 = fal 1024×1024 medium-quality
    projection (0.053) — the harness must set quality=medium, fal defaults to high (0.211).'
  source: plan §C.3; pinned fal/Vertex texts
- id: A-04
  assumption: The plan’s 112 image generations decompose as 48 core + 32 exact-text + 16 edit + 16 reference; ref2v 12 = 4 Seedance + 4 Veo + 4 Kling elements; lipsync 12 = 6 + 6.
  source: assumption (plan §E gives totals only)
- id: A-05
  assumption: Routes whose credit surface is not yet enabled (gpt-image-2, FLUX.2-pro on Azure) are priced on their fal fallback as cash tonight; they move to credits once MD-9 deployments exist.
  source: task §4 rule (cash for the fallback); roster fallback records
- id: A-06
  assumption: 'Gemini Omni Flash 1.1 per-second price is derived: $17.50 per 1M video-output tokens × 5,792 tokens per second of 720p = 0.10136/s; prompt input tokens are not added.'
  source: pinned Vertex bytes (both figures); arithmetic by the Executor
- id: A-07
  assumption: Lyria is priced at 0.06 per clip for the id that exists (lyria-002, read as the "Lyria 2" row); the plan’s "Lyria 3" (0.04) has no reachable id tonight.
  source: roster lyria record; MD-7
- id: A-08
  assumption: Kling v3 dialogue items use the audio-on rate (0.168/s); all other Kling lines use audio off (0.112/s) as in the 26-Aug slot design.
  source: pinned fal text; STAGE-A-ROUTE-PRICE-REFRESH-2026-08-26.yaml VID-02
- id: A-09
  assumption: C.3c SD3.5 Large (8 gens, credits) and VID-05 cost-knee lines (Veo Lite 4, H3 Max 480p 4) are additions beyond the plan’s §E nominal 164 and are shown separately (generations_additions).
  source: plan §C.3c, §C.3 VID-05; counts = assumption
- id: A-EVAL
  assumption: Evaluator prices are the plan’s nominals (Cloud Vision 1.50 per 1k images, VLM triage 0.01 per call), not pinned; ASR is unpriced and excluded; T2/T3 evaluator calls are all priced at the
    VLM nominal.
  source: plan §E
- id: A-10
  assumption: 'Credits: any route on Vertex / Bedrock / Azure "sold by Azure" is counted as credits per the survey’s reading of each programme’s terms; balances and enrolment are unknown (MD-1). fal, Sarvam,
    Runway are cash.'
  source: survey-2026-09-05 §4; decision §3 rule 9
- id: A-BLEND
  assumption: 'T2 and T3 are priced at the blended Tranche-1 average of USD 0.6111 per generation (Tranche-1 pinned lines: 250 generations, USD 152.764), split 0.7737 cash / 0.2263 credits, because survivors
    are unknown until Stage A runs'
  source: assumption (Executor); counts from plan §E
