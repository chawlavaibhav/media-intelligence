# TOPO-02 arm C overlay spec — exact strings from the blueprints' text_handling, set by code on the FLUX.2 Pro
# textless plates. Fonts are pinned SYSTEM files (the blueprints named Noto Serif Devanagari / Inter, which are not
# on this machine; Kohinoor Devanagari Bold and Helvetica Neue Bold are the recorded substitutes). Positions were
# chosen after looking at the plates: IMG-TEXT-01's sweets and diyas sit in the lower half, so all three lines go in
# the empty upper half with the shop name largest; IMG-TEXT-02's stripe runs lower-left to upper-right, so the type
# sits in the black upper-left block and the lower-right corner stays empty, as the contract requires.
# v2 (same day): the 104 pt headline overran the stripe at x > 0.62 ("OFF" lost on yellow); 78 pt keeps it inside the block.
fonts:
  devanagari: {file: /System/Library/Fonts/Kohinoor.ttc, face_index: 3}
  latin:      {file: /System/Library/Fonts/HelveticaNeue.ttc, face_index: 1}
cases:
  IMG-TEXT-01:
    strings:
      - {id: t1, text: "दीपावली की शुभकामनाएं", script: devanagari, size_pt: 44, colour: F5E9D3, anchor: center, y_frac: 0.10}
      - {id: t2, text: "सभी मिठाइयों पर 20% छूट", script: devanagari, size_pt: 60, colour: D4A017, anchor: center, y_frac: 0.215}
      - {id: t3, text: "श्री गणेश मिष्ठान भंडार", script: devanagari, size_pt: 96, colour: F5E9D3, anchor: center, y_frac: 0.365}
  IMG-TEXT-02:
    strings:
      - {id: t1, text: "FLAT 40% OFF", script: latin, size_pt: 78, colour: E6FF00, anchor: left, x_frac: 0.06, y_frac: 0.11}
      - {id: t2, text: "First 100 members only", script: latin, size_pt: 40, colour: FFFFFF, anchor: left, x_frac: 0.06, y_frac: 0.215}
      - {id: t4, text: "Offer ends 15 January", script: latin, size_pt: 30, colour: FFFFFF, anchor: left, x_frac: 0.06, y_frac: 0.275}
      - {id: t3, text: "AlphaFit", script: latin, size_pt: 60, colour: E6FF00, anchor: left, x_frac: 0.06, y_frac: 0.37}
