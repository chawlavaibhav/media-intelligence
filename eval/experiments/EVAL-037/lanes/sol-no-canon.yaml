    report. Substituting a different model silently destroys the comparison.
  settings:
    reasoning_effort: high
    sampling: provider defaults
  settings_note: >-
    reasoning.effort=high on the Responses API. Sampling parameters are left at provider
    defaults and must not be set explicitly.

