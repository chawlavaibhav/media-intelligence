retry_policy:
  technical_failure:
    initial_attempt: 1
    max_technical_retries: 2
    max_total_attempts_from_technical: 3
    qualifying_classes:
      - timeout
      - connection_error
      - rate_limit
      - server_error_5xx
      - empty_response
      - truncated_response
      - provider_refusal_non_content
      - sdk_error
    on_exhaustion: >-
      Record the trial as failed_technical with every attempt retained. Do not
      substitute a model, relax a setting or hand-write a package.
  format_repair:
    max: 1
    scope: format only
    permitted_when: >-
      The response is present and substantive but does not carry the required
      FINAL_PRODUCTION_PACKAGE section structure.
    forbidden: >-
      Changing, steering, enriching or improving the creative content. A format
      repair may ask only for the same answer in the required shape.
  forbidden_retry_reasons:
    - the answer looks creatively weak
    - the idea seems unoriginal or safe
    - the package is shorter than expected
    - a different sample would probably be better
    - the model used no website
  forbidden_retry_note: >-
    Creative weakness is NEVER a reason for another attempt. Retrying on quality
    silently selects the best-of-N and destroys the comparison this experiment exists
    to make.

