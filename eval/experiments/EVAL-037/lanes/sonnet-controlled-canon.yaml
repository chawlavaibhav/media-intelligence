retry_policy:
  # A retry is licensed ONLY by a TRANSIENT provider failure. Deterministic
  # failures are recorded and never resampled — resampling them would be
  # creative resampling wearing a technical retry's clothes.
  transient_failure:
    initial_attempt: 1
    max_technical_retries: 2
    max_total_attempts_from_transient: 3
    retry_resends: the identical request, unchanged
    classes:
      - timeout
      - connection_error
      - rate_limit_429
      - server_error_5xx
    on_exhaustion: >-
      Record the trial as failed_technical with every attempt retained. Do not
      substitute a model, relax a setting or hand-write a package.
  deterministic_failure:
    retries: 0
    status: failed_execution
    classes:
      - invalid_request_4xx
      - auth_error
      - tool_schema_rejected
      - context_overflow
      - tool_loop_guard_exhausted
      - model_refusal
      - truncated_response
      - empty_response
      - sdk_error
    note: >-
      A stable 4xx caused by request, configuration or tool schema; context
      exhaustion; tool-loop exhaustion; provider truncation; or model refusal is
      recorded distinctly and receives NO automatic resampling. Context overflow
      or tool-loop exhaustion caused by the model's own retrieval is a
      model+condition EXECUTION FAILURE and is a real result of this experiment,
      not a transient provider fault.
  truncation_detection: >-
    Detected from the provider's own stop/finish reason, not inferred from missing
    section headings.
  format_repair:
    max: 1
    scope: format only
    request_contains:
      - the original customer brief
      - the original model answer, verbatim
      - exactly the frozen format-only instruction
    must_not_contain:
      - any other trial
      - any new creative guidance
    records: repair_source_response_digest
    permitted_when: >-
      The response is present and substantive but does not carry the required
      FINAL_PRODUCTION_PACKAGE section structure.
    on_transient_failure_during_repair: >-
      Retry THAT SAME format-repair request under the transient retry policy. It
      must NEVER fall back to a fresh creative generation.
    if_repair_still_invalid:
      retain_output: true
      status: failed_format
      eligible_for_media_generation: false
      note: An invalid repair is never labelled format_repaired.
  forbidden_retry_reasons:
    - the answer looks creatively weak
    - the idea seems unoriginal or safe
    - the package is shorter than expected
    - a different sample would probably be better
    - the model did not use Canon
  forbidden_retry_note: >-
    Creative weakness is NEVER a reason for another attempt. Retrying on quality
    silently selects the best-of-N and destroys the comparison this experiment exists
    to make.

tool_loop_guard:
  max_provider_turns: 100
  purpose: emergency stop against literal runaway execution
  is_a_retrieval_budget: false
  note: >-
    The model may retrieve as much as it wants below this. Hitting the guard is a
    model+condition execution failure, preserved as such, and never rerun as a
    transient provider failure.

spend:
  experiment_level_cap: none
  note: >-
    EVAL-037 has no experiment-level spend cap. Cost is recorded, not enforced.

evidence:
  root: eval/experiments/EVAL-037/runs/sonnet-controlled-canon
  attempt_ledger: eval/experiments/EVAL-037/runs/sonnet-controlled-canon/attempt-ledger.json
  attempt_ledger_schema: schemas/attempt-ledger.schema.json
  result: eval/experiments/EVAL-037/runs/sonnet-controlled-canon/result.json
  result_schema: schemas/result.schema.json
  raw_requests: eval/experiments/EVAL-037/runs/sonnet-controlled-canon/requests/
  raw_responses: eval/experiments/EVAL-037/runs/sonnet-controlled-canon/raw/
  tool_transcripts: eval/experiments/EVAL-037/runs/sonnet-controlled-canon/transcripts/
  transcript_note: >-
    Every provider invocation retains its EXACT serialised request, not only a
    digest. Every tool call retains its real arguments, per-item identity
    (item id, source id, source_status, kind, Q&A flag) and the full tool result,
    so a later session can reconstruct exactly what the model asked for and got.
  usage_note: >-
    Usage is recorded per PROVIDER TURN, including every intermediate turn caused
    by a tool call, and summed to trial and lane totals. A field the provider does
    not expose is null; nothing is invented.
  price_snapshot: common/price-snapshot.yaml
  packages: eval/experiments/EVAL-037/runs/sonnet-controlled-canon/packages/
  retention: >-
    Retain every output regardless of apparent quality, including outputs from
    failed and repaired attempts. Nothing is deleted, trimmed or tidied.
  controlled_retrieval_evidence: >-
    Every trial additionally records, under `controlled_retrieval`: the knowledge needs
    the model declared, every canon_search query with its requested `limit` and the
    number of results actually returned, every canon_read target, the totals against
    each allowance, the violation list and the compliance verdict.
  validator: validators/validate_lane_run.py
  supplemental_validator: validators/validate_controlled_retrieval.py

downstream:
  all_valid_packages_eligible_for_media_generation: true
  media_generation_in_scope: false
  acceptance_scoring_in_scope: false
  note: >-
    Media generation and final acceptance scoring are explicitly outside EVAL-037.
    Eligibility is never withdrawn on creative grounds.

worker_obligations:
  - Run from a checkout containing the approved frozen substrate; verify the
    common_substrate_digest above and the freeze fingerprint before dispatch.
  - Read only EXECUTION-CONTRACT.md, this lane YAML, and files this YAML names.
  - Never list or read a sibling lane config.
  - Never inspect another EVAL-037 execution branch, PR, log, output or report.
  - Preflight the exact model id; stop rather than substitute if unavailable.
  - Preflight both Canon fingerprints; stop on mismatch.
  - Freeze and commit the runner BEFORE the first experimental call.
  - Make no runner, prompt or config change after the first call.
  - Execute exactly 18 trials, in the listed order.
  - Use a fresh stateless provider request for every trial.
  - Never pass output or state from one trial into another.
  - Retain every output regardless of apparent quality.
  - Do no creative judging.
  - Generate no media.
  - Never expand the retrieval allowance, and never clamp a call to keep a trial
    inside it. Record a violation as failed_controlled_retrieval and move on.
  - Never re-run a trial on quality grounds, and never re-run one for exceeding the
    allowance.
  - Write only under runs/sonnet-controlled-canon; touch no other lane's evidence.

