# EVAL-037 lane: sonnet-controlled-canon  (SUPPLEMENTAL RUN)
#
# SELF-CONTAINED. This file plus EXECUTION-CONTRACT.md plus the files named below
# are everything this worker may read. Do not open a sibling lane config. Do not
# look at another EVAL-037 branch, PR, log, output or report.
#
# WHAT THIS LANE IS
#   A supplemental treatment, NOT a replacement. It tests whether claude-sonnet-5
#   can benefit from the Canon corpus when retrieval is OBJECTIVE-DRIVEN and
#   CONTROLLED instead of free-form and unbounded — an approximation of the
#   production system we actually want, where the reasoning model researches only
#   what it needs to produce the customer's requested media outcome.
#
# WHAT IT DOES NOT REPLACE
#   The original `sonnet-full-canon` lane and run, and the repaired unbounded-
#   retrieval run, remain the evidence of what unrestricted autonomous Canon
#   retrieval does to this model. This lane writes to its own run directory under
#   its own trial ids and touches neither.
#
# EVERY VARIABLE EXCEPT RETRIEVAL IS THE FROZEN sonnet-full-canon TREATMENT
#   model, API, adaptive thinking, effort=high, provider-default sampling, the six
#   briefs byte-for-byte, three repetitions, the common system prompt, the Canon and
#   Q&A corpora, ACCEPTED/HOLD/Q&A semantics, the website rules and snapshots, the
#   production-package schema, the trial-ordering METHOD, the retry policy, the
#   format-repair policy, stateless independent trials, no creative judging, no media
#   generation, no model/provider selection. Canon itself was not altered.

experiment: EVAL-037
lane_id: sonnet-controlled-canon
lane_role: supplemental
branch: work/eval-037-sonnet-controlled-canon
trial_id_prefix: E037SCC-sonnet
trial_id_prefix_note: >-
  Distinct trial ids so this run can never be confused with, or overwrite, the
  original sonnet-full-canon evidence. The ORDERING METHOD is unchanged: ids are
  sorted by sha256("EVAL-037|" + trial_id), exactly as every other lane. Different
  ids necessarily yield a different concrete order; that is the method working, not
  a change to it.

substrate:
  # The experiment-defining BYTES are the authority, not a commit SHA. The
  # substrate was authored after the Canon merge, so no commit can contain both
  # itself and its own fingerprint; requiring one would be self-referential.
  algorithm: sha256-of-sorted-path-and-content
  common_substrate_digest: 012b9e6799cd89acc6badf7cbdde1e6bdb50e4d14bc2279728fbbeefb0764036
  common_substrate_scope: eval/experiments/EVAL-037/** excluding lanes/, runs/, dotfiles
  common_substrate_note: >-
    Safe to embed here because lanes/ is outside its scope. This is the digest
    this lane verifies on its own: prompt, briefs, website snapshots, conditions,
    schemas, tools and validators. Recompute and STOP on mismatch.
  freeze_fingerprint_file: FREEZE-FINGERPRINT.yaml
  freeze_fingerprint_note: >-
    The whole-substrate fingerprint covers lanes/ too, so it cannot be embedded
    in a lane without self-reference. It lives in FREEZE-FINGERPRINT.yaml, is
    recorded in the controller approval, and is verified with
    `tools/freeze_fingerprint.py --check` before dispatch.
  canon_base_commit: c6f8d910f7a3cdaaeafa2280313abfb9b898cddd
  canon_base_commit_role: >-
    Canon provenance only. This is the CANON-014 merge the two corpus
    fingerprints were computed against. It does NOT contain EVAL-037 and is not
    the execution-lane starting commit.
  execution_checkout_requirement: >-
    Run from any checkout that contains the approved frozen substrate (verified
    by freeze_fingerprint) and has canon_base_commit as an ancestor.
  supplemental_freeze_note: >-
    This supplemental run carries the two named instrumentation fixes and the
    controlled-retrieval treatment, all of which live inside the common substrate
    scope, so the common digest necessarily MOVED. It is re-stamped here, on this
    lane only. The eight original lane YAMLs are deliberately left untouched, so
    validate_freeze gate F1c is red on this branch by design: re-stamping them
    would modify the original EVAL-037 freeze. THIS FREEZE IS LANE-SCOPED.

model:
  key: sonnet
  provider: Anthropic
  model_id: claude-sonnet-5
  api: Messages API
  credential_env: ANTHROPIC_API_KEY
  moving_alias: false
  alias_policy: >-
    This exact model id, never a moving alias and never a substitute. Preflight the
    id against the provider before the first trial. If it is unavailable, STOP and
    report. Substituting a different model silently destroys the comparison.
  settings:
    thinking: adaptive
    effort: high
    sampling: provider defaults
  settings_note: >-
    Adaptive thinking with effort=high. Sampling parameters are left at provider defaults
    and must not be set explicitly.

condition: CONTROLLED_CANON
condition_detail:
  canon_instruction: present
  canon_instruction_note: >-
    The FULL_CANON addendum's corpus and ACCEPTED/HOLD/Q&A status paragraphs are
    preserved verbatim. Exactly two lines are replaced — "Use any amount of it if
    useful, or none." and "Decide for yourself what is relevant." — because
    unbounded discretion IS the variable under test. The controlled research
    procedure takes their place. Nothing else in the addendum differs.
  addendum_path: conditions/controlled-canon.yaml
  addendum_key: addendum
  addendum_placement: >-
    Appended to the common system prompt, after its final line, separated by one
    blank line. The customer brief is the user message. Nothing else is added.
  canon_tools_exposed:
    - canon_catalog
    - canon_search
    - canon_read
  canon_tools_module: tools/canon_tools.py
  canon_tools_access: read-only
  corpus:
    roots:
      accepted: canon/knowledge/current
      hold: canon/candidates/canon-014
      qa: canon/qa/canon-014
    index: canon/knowledge/CANON-CORPUS-INDEX.yaml
  fingerprints:
    algorithm: sha256-of-sorted-path-and-content
    full_knowledge:
      file_count: 193
      combined_digest: cbd321aa3be7464e785a0d42de1764cdccc8bdd33bc023a376740f8f196bde60
    qa:
      file_count: 23
      combined_digest: 1313c0babe2194a7bc71c1628f9fbec5fa4f35ca5ff5edc7f594662101dc62bd
    verify_at_preflight: true
    on_mismatch: stop
  status_invariants:
    - Every returned object carries source_status.
    - source_status is ACCEPTED or HOLD, taken from the corpus, never inferred.
    - HOLD is never represented, relabelled or defaulted as accepted.
    - An object whose status cannot be established is not returned.
    - Q&A is accessible knowledge, not independent corroboration and not benchmark truth.
  model_discretion:
    # The model still decides all of this. The harness imposes none of it.
    - which production questions matter for this brief
    - what to query for each of them
    - which returned items are worth reading
    - whether to consume Q&A
    - when it has enough and should stop
  model_does_not_decide:
    - how much retrieval allowance it has
  no_aggregate_top_k: true
  no_canon_token_budget: true
  harness_enforced_retrieval_count_budget: false
  mandatory_canon_use: false

retrieval_treatment:
  # THE ONE CHANGED VARIABLE.
  id: OBJECTIVE_DRIVEN_CONTROLLED
  objective: >-
    Retrieve only knowledge that can materially improve execution of THIS customer's
    requested media outcome. Not "find everything relevant".
  procedure:
    - STEP 1 identify at most THREE concrete production knowledge needs from the brief,
      declared in the model's own working message under a RESEARCH_NEEDS line.
    - STEP 2 at most ONE canon_search per need, queried for that need only, passing
      `limit` set to at most 8.
    - STEP 3 read only the returned items judged worth reading — at most 3 objects per
      need, at most 6 in total, by item_id where possible.
    - STEP 4 stop as soon as the production decision can be made; unused allowance is
      not a reason to keep retrieving.
    - STEP 5 produce the frozen FINAL_PRODUCTION_PACKAGE from the brief, the permitted
      website snapshot, and only the Canon knowledge actually retrieved and judged
      useful. KNOWLEDGE_AND_WEBSITE_USE lists what was actually used.
  allowance:
    max_knowledge_needs: 3
    max_canon_search_calls: 3
    max_results_per_search: 8
    max_search_results_total: 24
    max_canon_read_objects: 6
  allowance_is_a_treatment_not_a_guard: true
  enforced_by_harness: false
  enforcement_note: >-
    The harness caps, truncates and blocks NOTHING. canon_search still returns every
    scoring item when `limit` is omitted. Compliance is MEASURED after the fact by
    tools/controlled_retrieval.py, so a model that ignores the treatment is observed
    doing so rather than silently rescued.
  measured_by: tools/controlled_retrieval.py
  violation_status: failed_controlled_retrieval
  violation_policy: >-
    A trial that exceeds the allowance is recorded failed_controlled_retrieval. It is
    never silently repaired by changing the treatment, never rescued by expanding the
    allowance, and NEVER re-run. If the model cannot produce a useful package inside
    this procedure, that is a RESULT.
  discouraged_but_unscored:
    - canon_catalog is discouraged unless a targeted search cannot formulate a useful
      query; it is counted and reported, never scored.

