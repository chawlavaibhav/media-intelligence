model:
  key: gemma
  provider: Google Gemini API
  model_id: gemma-4-31b-it
  api: Gemini API
  credential_env: GEMINI_API_KEY
  moving_alias: false
  alias_policy: >-
    This exact model id, never a moving alias and never a substitute. Preflight the
    id against the provider before the first trial. If it is unavailable, STOP and
    report. Substituting a different model silently destroys the comparison.
  settings:
    sampling: provider defaults
    reasoning: provider defaults
  settings_note: >-
    Provider defaults throughout. Do NOT invent or pass unsupported reasoning controls:
    there is no thinking budget, no effort parameter and no reasoning_effort on this model.
    If a control is not documented for gemma-4-31b-it, it is not set.

condition: FULL_CANON

# ---------------------------------------------------------------------------
# THE SINGLE EXPERIMENTAL TREATMENT CHANGE vs the frozen gemma-full-canon lane.
# ---------------------------------------------------------------------------
treatment:
  id: REQUIRED_CANON
  supplements: gemma-full-canon
  supplements_note: >-
    This lane does NOT replace or re-run gemma-full-canon. That lane is frozen and
    records that Gemma, offered Canon, chose to use it 0/18 times. This lane asks a
    different question: whether Gemma produces better production packages when Canon
    retrieval is compelled rather than optional.
  question: >-
    Can gemma-4-31b-it produce better production packages when Canon retrieval is
    explicitly required?
  change: >-
    Canon use is mandatory. Before finalizing each production package the tested model
    must call canon_search at least once with a query of its own choosing, inspect the
    results, call canon_read on at least one retrieved object it chooses, and then
    decide for itself what knowledge to apply.
  we_force_retrieval_not_the_answer:
    - the query is NOT curated for the model
    - no Canon source or object is named to the model
    - no preselected Canon packet is supplied
    - no retrieval-token quota is imposed
    - no fixed top-K is imposed
  everything_else_held_identical:
    - model gemma-4-31b-it on the Google Gemini API
    - model settings (provider defaults throughout)
    - the six briefs, byte for byte
    - three repetitions per brief
    - website rules and the frozen website snapshots
    - the common production-package system prompt
    - the FULL_CANON corpus and Q&A fingerprints
    - Canon status semantics
    - the Canon tools
    - the trial-ordering method
    - the retry rules
    - the format-repair rules
    - no creative judging
    - no media generation
    - no provider/model selection
    - a fresh stateless context for every trial
  compliance_gate:
    satisfied_when: at least one canon_search AND at least one canon_read in the evidence
    canon_catalog_alone_is_not_canon_use: true
    on_violation:
      retain_output: true
      status: failed_required_canon_use
      quality_retry: forbidden
      resample: forbidden
      note: >-
        Non-compliance is a real result of this treatment. It is recorded, never
        retried and never resampled.

condition_detail:
  canon_instruction: present
  addendum_path: conditions/full-canon-required.yaml
  addendum_key: addendum
  addendum_placement: >-
    Appended to the common system prompt, after its final line, separated by one
    blank line. The customer brief is the user message. Nothing else is added.
  canon_tools_exposed:
    - canon_catalog
    - canon_search
    - canon_read
  canon_tools_module: tools/canon_tools.py
  canon_tools_access: read-only
  corpus:
    roots:
      accepted: canon/knowledge/current
      hold: canon/candidates/canon-014
      qa: canon/qa/canon-014
    index: canon/knowledge/CANON-CORPUS-INDEX.yaml
  fingerprints:
    algorithm: sha256-of-sorted-path-and-content
    full_knowledge:
      file_count: 193
      combined_digest: cbd321aa3be7464e785a0d42de1764cdccc8bdd33bc023a376740f8f196bde60
    qa:
      file_count: 23
      combined_digest: 1313c0babe2194a7bc71c1628f9fbec5fa4f35ca5ff5edc7f594662101dc62bd
    verify_at_preflight: true
    on_mismatch: stop
  status_invariants:
    - Every returned object carries source_status.
    - source_status is ACCEPTED or HOLD, taken from the corpus, never inferred.
    - HOLD is never represented, relabelled or defaulted as accepted.
    - An object whose status cannot be established is not returned.
    - Q&A is accessible knowledge, not independent corroboration and not benchmark truth.
  model_discretion:
    # Under REQUIRED_CANON the model no longer decides WHETHER to retrieve. Every
    # choice inside the retrieval remains entirely its own.
    - what to search        # the model composes its own query
    - what to read          # the model chooses the object(s)
    - whether to consume Q&A
    - how much additional retrieval to perform
    - what retrieved knowledge to actually apply
  model_no_longer_decides:
    - whether to use Canon at all
  no_aggregate_top_k: true
  no_canon_token_budget: true
  no_retrieval_count_budget: true
  mandatory_canon_use: true

