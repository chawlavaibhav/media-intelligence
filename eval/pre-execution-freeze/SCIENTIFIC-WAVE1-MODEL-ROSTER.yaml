# -----------------------------------------------------------------------------
# EVAL-008 challenge record - what was demoted and why
# -----------------------------------------------------------------------------
eval008_disposition:
  treated_as: candidate_universe_research_only
  candidates_reviewed: 53
  slots_admitted: 14
  challenge_findings:

    - id: CHALLENGE-01
      subject: "~99% Hindi/Bengali character-accuracy claim (attributed to OpenAI, gpt-image-2)"
      eval008_status: "listed under `distinctive` as a vendor claim"
      verification_attempted: true
      method: >-
        Direct fetch of the vendor announcement page (EGRESS_BLOCKED) plus a
        targeted web search for primary evidence and evaluation methodology.
      result: NO_PRIMARY_EVIDENCE_FOUND
      what_the_search_returned: >-
        Reseller product pages, a Medium post and marketing summaries. The
        search itself concluded the results were "primarily marketing claims and
        general descriptions rather than detailed peer-reviewed primary source
        documentation of the evaluation methodology".
      disposition: >-
        NOT LOAD-BEARING. It is not used as an admission reason anywhere in this
        roster. INSTEAD IT IS CONVERTED INTO THE HYPOTHESIS THE BENCHMARK TESTS:
        slot IMG-01 exists to find out whether frontier generated Devanagari is
        viable at all, and this claim is the null it will falsify or support.
        A marketing number becomes a testable prediction rather than a reason to
        believe.

    - id: CHALLENGE-02
      subject: "Leaderboard/Elo evidence (gpt-image-2 T2I arena #1 ~1370; reve-2.1 #2 ~1306)"
      eval008_status: "recorded as `seriousness_evidence` tier T3"
      disposition: >-
        INSUFFICIENT ALONE, per Controller. Arena Elo measures aggregate human
        preference on community prompts - HPSv2 states preference comparison is
        "only meaningful for images generated by the same prompt". It says
        nothing about exact Devanagari, brand-mark geometry or campaign
        consistency, which are our actual constraints. Elo is used here ONLY as
        a weak tie-break BETWEEN candidates already justified by a question,
        never to create a row.

    - id: CHALLENGE-03
      subject: "Vendor geography / training lineage as a differentiator (H_lineage_acceptance)"
      eval008_status: "hypothesis attached to seedream-5.0-pro"
      disposition: >-
        DEMOTED. 'Different national/vendor lineage' is not a concrete failure
        hypothesis. It was RE-SPECIFIED into something testable and kept only in
        that form: whether a model trained predominantly on non-Indian
        commercial imagery produces Indian-market people, products and typography
        that reviewers accept. That is a measurable acceptance question; 'made
        elsewhere' is not. Row IMG-04 carries the re-specified version.

    - id: CHALLENGE-04
      subject: "H_clean_rights (marey-realism, licensed-data-only training)"
      disposition: >-
        DEMOTED OUT OF WAVE 1. Rights-clean training is a procurement/legal
        property, not a capability our benchmark measures. It would change a
        purchasing decision, not a production design. Recorded as a Controller
        legal question, not an Eval row.

    - id: CHALLENGE-05
      subject: "H_conversational_loop (gemini-omni-flash)"
      disposition: >-
        DEMOTED TO RESERVE. Multi-turn is explicitly recognised by the Controller
        as real but NOT solved, with no request-history schema frozen and no
        block on Wave 1. Testing a conversational loop before the request grammar
        exists would measure against a moving target.

    - id: CHALLENGE-06
      subject: "27 EVAL-008 entries carrying no hypothesis at all"
      disposition: >-
        NOT ADMITTED. Superseded versions and unhypothesised entries were
        excluded by the admission rule automatically - a row with no question
        cannot earn a slot. This is the rule doing its job rather than a
        judgement about those models.

    - id: CHALLENGE-07
      subject: "Composite-route arms treated as model rows"
      disposition: >-
        RESTRUCTURED. 'Generate image without type, then composite type locally'
        and 'TTS + lip-sync instead of native AV' are WORKFLOW TOPOLOGY arms, not
        models. Treating them as roster rows would have inflated the roster and
        hidden the fact that the comparison is between ROUTES. They are modelled
        as topology comparisons that reuse admitted slots (see topology_arms).

# -----------------------------------------------------------------------------
# THE ROSTER
# -----------------------------------------------------------------------------
slots:

  # ---------------- IMAGE ----------------
  - slot_id: IMG-01
    tier: core
    lane: image
    question: >-
      Is generated exact Devanagari/Hinglish text viable AT ALL from a frontier
      general image model, at commercial delivery sizes?
    why_it_changes_production: >-
      THE highest-value question in Wave 1. If the answer is no, the production
      topology must change fundamentally - type gets composited rather than
      generated, which changes every downstream cost, repair path and acceptance
      route. If the answer is yes, a whole compositing subsystem is unnecessary.
    capabilities: [exact_text_devanagari, exact_text_latin, typography_legibility,
                   spatial_relationship_2d, attribute_binding]
    conditions_swept: [COND-LANGUAGE, COND-CONSTRAINT, COND-DELIVERY]
    workflow_mode: t2i
    candidate: {name: "gpt-image-2 (OpenAI)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: IMG-02
    why_both_needed: >-
      IMG-02 is a text SPECIALIST; this is a frontier GENERALIST. If the
      generalist fails and the specialist succeeds, production routes text
      through a specialist step - a materially different design. If both fail,
      the composite topology is forced. They cannot substitute for each other.
    admission_basis: distinct_question_not_leaderboard_not_vendor_claim
    explicit_note: >-
      Admitted DESPITE, not because of, its unverified ~99% claim. That claim is
      the hypothesis under test.

  - slot_id: IMG-02
    tier: core
    lane: image
    question: >-
      Does a typography/text-specialist model outperform a frontier generalist
      on non-Latin script exactness?
    why_it_changes_production: >-
      Determines whether a specialist text step earns its place in the pipeline
      or is redundant complexity.
    capabilities: [exact_text_devanagari, exact_text_latin, typography_legibility]
    conditions_swept: [COND-LANGUAGE, COND-CONSTRAINT]
    workflow_mode: t2i
    candidate: {name: "ideogram-v3 (Ideogram)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: IMG-01
    why_both_needed: "See IMG-01. Specialist-vs-generalist is the comparison."
    admission_basis: distinct_question

  - slot_id: IMG-03
    tier: core
    lane: image
    question: >-
      Does instruction-driven editing preserve everything it was not asked to
      change?
    why_it_changes_production: >-
      Decides whether variants and campaign sets are CHEAP (edit) or EXPENSIVE
      (re-roll each). This is the single largest lever on CpAO for commercial
      work, which ships in sets.
    capabilities: [edit_preservation, product_identity, person_identity,
                   wardrobe_invariant_fidelity, technical_visual_integrity]
    conditions_swept: [COND-REFERENCE, COND-CONSTRAINT]
    workflow_mode: edit
    candidate: {name: "flux2-pro (Black Forest Labs)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: "nano-banana-2 / reve-2.1 / mai-image-2.5-pro"
    why_both_needed: >-
      NOT both needed at Wave 1. All are instruction-edit models answering the
      SAME question, so admitting several would buy redundant evidence. One core
      slot; the others are equivalent fills for the same slot if EVAL-010 finds
      the named candidate unavailable or mispriced.
    admission_basis: distinct_question

  - slot_id: IMG-04
    tier: core
    lane: image
    question: >-
      Does a reference-conditioned model hold person AND product identity across
      a multi-asset set, and are Indian-market people/products/typography
      accepted by reviewers?
    why_it_changes_production: >-
      Campaign work requires N assets that read as one campaign. If identity
      does not hold across a set, campaign delivery is not viable on this route
      at any price. The market-acceptance half re-specifies EVAL-008's
      lineage hypothesis into something measurable.
    capabilities: [person_identity, wardrobe_invariant_fidelity, product_identity,
                   reference_conditioning, composition_brand_register]
    conditions_swept: [COND-REFERENCE, COND-SCALE, COND-LOAD]
    workflow_mode: reference_conditioned
    candidate: {name: "seedream-5.0-pro (ByteDance)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: "nano-banana-pro"
    why_both_needed: >-
      Not both at Wave 1. Same question. Kept as an equivalent fill.
    admission_basis: distinct_question_lineage_hypothesis_respecified
    explicit_note: >-
      Vendor origin is NOT the admission reason. The testable form is whether
      Indian-market commercial content is accepted by reviewers - a question that
      would be asked of any candidate regardless of where it was built.

  - slot_id: IMG-05
    tier: reserve
    lane: image
    question: "Does owning the step on open weights change CpAO enough to matter?"
    why_it_changes_production: >-
      Marginal cost approaches zero on owned compute, which could dominate CpAO
      at volume - but only if quality is acceptable.
    capabilities: [exact_text_devanagari, edit_preservation, product_identity, cost_and_cpao]
    conditions_swept: [COND-CONSTRAINT]
    workflow_mode: t2i
    candidate: {name: "qwen-image (Alibaba)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: "flux2-klein"
    tier_rationale: >-
      RESERVE because open-weights economics only bite at volume, and we have no
      volume yet. If a core image slot proves quality-viable, this becomes the
      immediate follow-up question.
    promotion_trigger: "Any core image slot passes its acceptance bar."

  - slot_id: IMG-06
    tier: reserve
    lane: image
    question: >-
      Can type be emitted as editable vector output, so a text defect is
      REPAIRABLE without regenerating the asset?
    why_it_changes_production: >-
      Changes the repair path, not just the pass rate. A text error that can be
      fixed without a re-roll has a completely different CpAO to one that forces
      regeneration.
    capabilities: [exact_text_latin, exact_text_devanagari, typography_legibility, repairability]
    conditions_swept: [COND-LANGUAGE, COND-CONSTRAINT]
    workflow_mode: t2i
    candidate: {name: "recraft-v3 (Recraft)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: none
    tier_rationale: >-
      RESERVE with an EXPLICIT PROMOTION TRIGGER rather than core, because it is
      the fallback production design. If generated Devanagari is viable we may
      not need it; if it is not, we need it urgently.
    promotion_trigger: "IMG-01 AND IMG-02 both fail their Devanagari acceptance bar."
    dormant_capability_note: >-
      Touches `repairability`, which is DORMANT in Capability Contract v2. The
      repair question can be observed qualitatively in Wave 1 but cannot produce
      a repairability measurement until a repair loop exists.

  # ---------------- VIDEO ----------------
  - slot_id: VID-01
    tier: core
    lane: video
    question: >-
      Can a frontier video model hold rendered text and logo STABLE across a
      clip, and produce usable native audio in one pass?
    why_it_changes_production: >-
      Text mutating mid-clip is a failure we have OBSERVED in our own prior
      evidence, and it is invisible at frame level. Native audio determines
      whether the one-call route is viable at all against the composite route.
    capabilities: [text_logo_stability_in_clip, person_stability_in_clip,
                   product_stability_in_clip, technical_visual_integrity,
                   camera_framing_fidelity, spoken_script_correctness,
                   audio_video_synchronisation, single_speaker_lip_sync]
    conditions_swept: [COND-DELIVERY, COND-LANGUAGE, COND-MOTION]
    workflow_mode: t2v
    candidate: {name: "veo-3.1 (Google)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: "seedance-2.0-pro / happyhorse-1.1"
    why_both_needed: >-
      Not all three at Wave 1. Equivalent fills for one slot.
    admission_basis: distinct_question
    price_note: >-
      EVAL-008 recorded a T1 price fact here and a documented third-party error
      of an order of magnitude in both unit and value. Price remains EVAL-010's.

  - slot_id: VID-02
    tier: core
    lane: video
    question: "Does state and identity continuity survive across CUTS, not just within a shot?"
    why_it_changes_production: >-
      Multi-shot ads are the product. If continuity fails across cuts, either
      the ad must be single-shot or continuity must be enforced by production
      technique rather than by the model.
    capabilities: [sequence_state_continuity, multi_shot_spatial_continuity,
                   person_identity, product_identity, hook_pacing_temporal_hierarchy]
    conditions_swept: [COND-SEQUENCE, COND-MOTION]
    workflow_mode: t2v
    candidate: {name: "kling-3.0 (Kuaishou)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: VID-01
    why_both_needed: >-
      VID-01 measures WITHIN-clip stability; this measures ACROSS-cut continuity.
      Different observation units (sequence vs shot_pair) and different failures.
      A model can be perfect within a shot and incoherent across a cut.
    admission_basis: distinct_question_distinct_observation_unit

  - slot_id: VID-03
    tier: core
    lane: video
    question: "Can supplied reference images control identity in generated VIDEO?"
    why_it_changes_production: >-
      Determines whether a real product or a real person can appear in video at
      all, or whether video is limited to generic subjects. Decisive for
      product-led advertising.
    capabilities: [reference_conditioning, product_identity, person_identity,
                   person_stability_in_clip]
    conditions_swept: [COND-REFERENCE, COND-SCALE]
    workflow_mode: i2v
    candidate: {name: "minimax-h3 (MiniMax)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: VID-01
    why_both_needed: >-
      Reference-conditioned video is a different workflow mode from text-to-video
      and is scored under different conditions. I2V hands the model frame 0, so
      identity there is GIVEN not generated - the two cannot share a cell.
    admission_basis: distinct_question_distinct_workflow_mode

  - slot_id: VID-04
    tier: core
    lane: video
    question: "Can EXISTING customer footage be edited rather than regenerated?"
    why_it_changes_production: >-
      Customers arrive with footage. If it can be edited, an entire class of
      brief becomes servable cheaply; if not, every job is generate-from-nothing.
      This is the video analogue of IMG-03 and maps to a Controller-approved
      requested operation (`edit`).
    capabilities: [edit_preservation, technical_visual_integrity, person_identity,
                   product_identity]
    conditions_swept: [COND-INPUT, COND-WORKFLOW]
    workflow_mode: edit
    candidate: {name: "runway-aleph-2.0 (Runway)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: none
    admission_basis: distinct_question_distinct_requested_operation

  - slot_id: VID-05
    tier: core
    lane: video
    question: >-
      Where is the cost knee - does the premium tier buy enough additional
      ACCEPTED outcomes to justify its price over the fast tier of the same
      family?
    why_it_changes_production: >-
      Directly and only about CpAO, the primary business metric. A cheap model
      that needs three attempts is not cheap; a premium model that passes first
      time may be the cheaper route. This cannot be answered by testing one tier.
    capabilities: [reliability_pass_at_k, cost_and_cpao, latency_errors_refusals,
                   reproducibility]
    conditions_swept: [COND-DELIVERY]
    workflow_mode: t2v
    candidate: {name: "fast/cheap tier of the VID-01 family", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: VID-01
    why_both_needed: >-
      The question IS the pair. A cost knee is a comparison, so a single tier
      cannot answer it. Deliberately runs a REDUCED item set - it needs
      contrast, not full capability coverage.
    admission_basis: distinct_question_cpao

  # ---------------- AUDIO / SUPPORTING ----------------
  - slot_id: AUD-01
    tier: core
    lane: tts
    question: >-
      Does an India-focused voice model pronounce Hindi, Hinglish code-mixing
      and Indian brand names acceptably to first-language listeners?
    why_it_changes_production: >-
      The product is Indian-market media. A globally strong voice that
      mispronounces brand names is unusable here regardless of its other
      qualities, and no amount of downstream work fixes it.
    capabilities: [pronunciation_intelligibility, spoken_script_correctness,
                   voice_identity_consistency, emotional_prosodic_fit]
    conditions_swept: [COND-LANGUAGE]
    workflow_mode: tts
    candidate: {name: "sarvam-bulbul-v3 (Sarvam AI)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: AUD-02
    why_both_needed: >-
      The comparison IS the question: does Indic specialisation beat a global
      frontier voice on OUR language topology? One row cannot answer it.
    admission_basis: distinct_question
    explicit_note: >-
      Admitted for a concrete, testable pronunciation hypothesis - NOT because
      the vendor is Indian. The identical question would be asked of any model
      claiming Indic coverage.

  - slot_id: AUD-02
    tier: core
    lane: tts
    question: "Does a global frontier voice model match a specialist on Hindi/Hinglish?"
    why_it_changes_production: "Determines whether one voice vendor can serve all languages."
    capabilities: [pronunciation_intelligibility, spoken_script_correctness,
                   voice_identity_consistency]
    conditions_swept: [COND-LANGUAGE]
    workflow_mode: tts
    candidate: {name: "elevenlabs-v3 (ElevenLabs)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: AUD-01
    why_both_needed: "See AUD-01."
    admission_basis: distinct_question

  - slot_id: AUD-03
    tier: core
    lane: lipsync
    question: >-
      Is TTS + lip-sync a viable production route for Hindi dialogue video, as
      an alternative to native audio-video?
    why_it_changes_production: >-
      This is the second arm of the topology comparison. The composite route
      gives control over the voice (so AUD-01/02 findings apply) and makes parts
      of sync deterministically checkable because WE supply both inputs. The
      native route gives one call. Which wins is a production-design decision we
      cannot make without both.
    capabilities: [single_speaker_lip_sync, audio_video_synchronisation,
                   person_identity, voice_identity_consistency, technical_visual_integrity]
    conditions_swept: [COND-LANGUAGE, COND-INPUT]
    workflow_mode: transform_lipsync
    candidate: {name: "sync-3 (sync.so)", identity: UNRESOLVED_EVAL_010}
    nearest_redundant: "omnihuman-1.5 / heygen"
    admission_basis: distinct_question_topology_arm

# -----------------------------------------------------------------------------
# Workflow topology comparisons - routes, not roster rows
# -----------------------------------------------------------------------------
topology_arms:
  - id: TOPO-01
    outcome: "Hindi dialogue video with a visible speaker"
    arm_a: {route: native_audio_video, uses: [VID-01]}
    arm_b: {route: "silent video + TTS + lip-sync", uses: [VID-01, AUD-01, AUD-03]}
    why_compared: >-
      Materially different cost, failure surface and applicable capability set.
      In arm A sync is a property of ONE trial; in arm B it is a property of a
      transform over our own inputs, which makes part of it deterministically
      checkable. This is a PLANNER decision, not a customer request.
    eval_position: "Eval measures both routes. Eval does not choose."

  - id: TOPO-02
    outcome: "Static ad with exact Devanagari headline"
    arm_a: {route: "type generated by the image model", uses: [IMG-01, IMG-02]}
    arm_b: {route: "image generated without type + type composited locally",
            uses: [IMG-03], note: "compositing is a deterministic LOCAL step, not a provider trial"}
    why_compared: >-
      If arm A fails, arm B is the product. Arm B's compositing step creates
      artifacts WITHOUT provider trials, per the approved topology.
    eval_position: "Measures both; the choice is the Planner's."

