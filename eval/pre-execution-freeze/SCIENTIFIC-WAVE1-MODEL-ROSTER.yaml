# =============================================================================
# E9-G — Scientific Wave-1 model/workflow roster
# =============================================================================
# Task: EVAL-009 · Date: 2026-08-26
# STATUS: PROPOSED FOR CONTROLLER FREEZE. NOT IN FORCE. NO MODEL IS QUALIFIED.
#
# THE ADMISSION RULE, APPLIED WITHOUT EXCEPTION
#   Each row must answer a DISTINCT, product-relevant empirical question whose
#   answer materially changes production design, acceptance, repair or CpAO.
#
# EXPLICITLY NOT ADMISSION CRITERIA - none was used:
#   * availability on Frontier Clouds, fal, or any direct vendor
#   * existing credits or account access
#   * leaderboard rank or Elo
#   * vendor novelty or topicality
#   * national origin / vendor geography / training lineage, on its own
#   * an unverified vendor marketing claim
#
# WHY ROWS ARE SLOTS, NOT MODEL NAMES
#   A row is defined by its QUESTION and the characteristics a model must have
#   to answer it. A named candidate is the current best guess at an INSTRUMENT
#   for that question. If EVAL-010 finds the named candidate unavailable,
#   misidentified or mispriced, the SLOT SURVIVES and an equivalent fills it.
#   Naming models as the unit of science would let a sourcing failure silently
#   delete an empirical question - which is exactly the coupling the Controller's
#   independence rule forbids.
#
#   Every model identity/version below is UNRESOLVED and is EVAL-010's to verify.
# =============================================================================

