runway:
  provider: Runway
  evidence: SRC-SDK-RUNWAY
  api_surface_note: >
    Runway's own published Python SDK exposes a full public API: text_to_video, image_to_video,
    video_to_video, text_to_image, character_performance, text_to_speech, video_upscale,
    voice_dubbing and more. This directly contradicts EVAL-008's recorded concern that Runway
    API access is Enterprise-only. Account entitlement is a separate matter and was not tested.
  models:
    - {candidate: "Runway Aleph 2.0", api_model_literal: "aleph2", workflow: video_to_video, also: "gen4_aleph", status: verified_fallback_only}
    - {candidate: "Runway Gen-4.5", api_model_literal: "gen4.5", workflows: [text_to_video, image_to_video], status: verified_fallback_only}
    - {candidate: "Runway act_two", api_model_literal: "act_two", workflow: character_performance, status: verified_fallback_only}
  aggregated_third_party_models:
    note: "Runway is itself an aggregator. These are alternative routes to models on the candidate list."
    models:
      - {model_literal: "veo3.1", workflows: [text_to_video, image_to_video]}
      - {model_literal: "veo3.1_fast", workflows: [text_to_video, image_to_video]}
      - {model_literal: "hailuo3", workflows: [text_to_video, video_to_video], significance: "the only provider-authorised confirmation found that MiniMax H3 exists as a callable model"}
      - {model_literal: "gpt_image_2", workflow: text_to_image, significance: "third route to GPT Image 2, with a different aspect-ratio set from OpenAI direct"}
  billing_unit: "credits; the SDK documents per-second credit surcharges (e.g. 5 credits/sec for prores and png_sequence, 20 and 40 credits/sec tiers)"
  price_verified: false
  blocker: "runway.com and dev.runwayml.com unreachable, so the credit-to-currency rate is unknown"

