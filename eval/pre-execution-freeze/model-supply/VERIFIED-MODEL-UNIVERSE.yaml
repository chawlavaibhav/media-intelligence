status_vocabulary:
  execution_ready_preferred_route: identity + route + billing_unit + price all verified
  verified_fallback_only: route and identity verified, but price and/or billing unit not verified
  identity_or_version_unresolved: the exact selected version could not be confirmed from primary evidence
  route_unresolved: no provider-authorised route could be established from reachable evidence
  not_current_or_deprecated: primary evidence shows the version is superseded, preview-only or scheduled for shutdown

