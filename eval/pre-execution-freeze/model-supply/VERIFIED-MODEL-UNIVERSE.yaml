# This file verifies HOW candidates can be called. It does NOT decide which
# models deserve testing; EVAL-009 owns scientific Wave-1 selection.
#
# No API/model calls. No accounts. No payments. No terms accepted. No Registry rows.

meta:
  task: EVAL-010
  package: E10-A + E10-B
  date: 2026-08-26
  branch: work/eval-010-route-verification
  upstream_candidate_source: eval/model-access/2026-08-26/ (EVAL-008, research evidence only)
  selection_authority: EVAL-009
  this_task_changed_selection: false
  authorises_spend: false

evidence_classes:
  provider_page_fetched:
    weight: execution_grade
    meaning: page retrieved directly by this session from a provider-owned host
    hosts_reachable: [cloud.google.com]
  provider_sdk:
    weight: execution_grade
    meaning: >
      package published by the vendor to a public registry (PyPI/npm) under a
      vendor-owned account or vendor-owned source repository. Generated API type
      definitions in such a package are provider-authorised statements about model
      identifiers and request parameters.
    limits: >
      An SDK is authoritative for what it declares. It is NOT authoritative for
      prices (SDKs do not carry them), and its model enumerations may lag the live
      catalogue. Absence in an SDK is recorded as not_present_in_sdk_version, never
      as unavailable.
  lead_only:
    weight: none
    meaning: search snippets, blogs, leaderboards, reseller pages
    may_populate: [notes, leads]
    may_not_populate: [verified_version, verified_price, verified_billing_unit, execution_ready_route]

