# EVAL-010 E10-H — budget inputs
# Contains ONLY execution-grade verified values. Every unverified figure is null.
# This is not a budget and authorises no spend.

meta:
  task: EVAL-010
  package: E10-H
  date: 2026-08-26
  authorises_spend: false
  currency: USD
  tax_excluded: true
  credits_excluded: true

hard_separation_required_by_task:
  nominal_benchmark_cost:
    definition: "list-price cost of running a wave, computed only from verified prices"
    computable_for: "Google models only"
    computable_for_full_roster: false
  actual_cash_outlay_after_credits:
    status: UNRESOLVED
    reason: >
      Frontier Clouds could not be identified from reliable evidence, so we do not know which
      provider holds the user's credits, what those credits cover, or how much remains.
      Nominal cost therefore cannot be converted into cash outlay for any row.

