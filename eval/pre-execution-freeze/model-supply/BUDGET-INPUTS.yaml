worked_cost_examples:
  purpose: "show what a verified price actually buys, so the Controller can size a wave. Illustrative arithmetic, not an approved plan."
  examples:
  - scenario: "100 images at 1K on Nano Banana 2"
    formula: "100 * 0.067"
    usd: 6.70
  - scenario: "100 images at 1K/2K on Nano Banana Pro"
    formula: "100 * 0.134"
    usd: 13.40
  - scenario: "100 videos with audio at 720p on Veo 3.1 Lite"
    formula: "100 * 0.05"
    usd: 5.00
  - scenario: "100 videos with audio at 720p/1080p on Veo 3.1"
    formula: "100 * 0.40"
    usd: 40.00
  - scenario: "100 ten-second clips on Gemini Omni Flash at 720p with audio"
    formula: "100 * 10 * 0.10136"
    usd: 101.36
    caveat: "uses an EVAL-010-derived per-second value, not a vendor-published one"
  observation: >
    The verified Veo ladder spans 8x within one family (0.05 to 0.40 per generation) and the
    verified Google image ladder spans about 3.6x (0.034 to 0.134 at comparable resolution).
    Those two spreads are the only cost/quality gradients this project can currently price at all.

cost_unknown_for_the_rest_of_the_roster:
  count_of_candidate_rows_with_no_verified_price: 22
  includes: [GPT Image 2, Seedream, Reve 2.1, FLUX.2 pro, FLUX.2 klein, Qwen-Image, Seedance,
             HappyHorse, Kling 3.0, MiniMax H3, Runway Aleph 2.0, Sarvam Bulbul v3,
             ElevenLabs v3, Sync-3, MAI-Image-2.5-Pro, Ideogram V3, Recraft, Wan 2.7, LTX-2,
             Marey, OmniHuman v1.5]
  consequence: >
    No wave that includes any of these rows can be costed today. A budget built from this file
    alone would cover Google models and nothing else.

evaluator_and_human_costs:
  status: OUT_OF_SCOPE_FOR_THIS_TASK
  note: >
    EVAL-010 verifies generation supply only. Evaluator-call cost, human-review cost and
    resource cost are not in this file and must not be inferred from it. Also unchanged:
    no checker has been qualified, so generation cost is not the whole cost of an accepted outcome.

what_would_unblock_a_real_budget:
  1: "identify Frontier Clouds, then establish what its credits cover and how much remains"
  2: "reach fal to obtain per-endpoint prices for the 12 rows fal verifiably carries at the selected version"
  3: "reach OpenAI, Sarvam, ElevenLabs and Runway pricing pages for the remaining execution rows"
  4: "obtain Runway's credit-to-currency rate, without which no Runway route can be costed"
  5: "EVAL-009's scientific Wave-1 roster, which sets how many rows actually need pricing"
