# EVAL-010 E10-D — fal route verification
# Source of truth for this file: npm @fal-ai/client==1.10.1, published by
# "Features & Labels <support@fal.ai>", repository github.com/fal-ai/fal.
# The package ships src/types/endpoints.d.ts: 1117 endpoint identifiers with typed
# input/output schemas. That is a provider-authorised statement of what fal exposes
# and what each endpoint accepts.

meta:
  task: EVAL-010
  package: E10-D
  date: 2026-08-26
  evidence_class: provider_sdk
  source: "npm @fal-ai/client@1.10.1 — src/types/endpoints.d.ts"
  fal_hosts_reachable_this_session: false
  hosts_blocked: [fal.ai, docs.fal.ai]

what_this_file_can_and_cannot_establish:
  establishes:
    - exact fal endpoint identifiers
    - the typed input schema of each endpoint, i.e. the controls fal exposes
    - which selected versions are and are not enumerated by fal's own client
  does_not_establish:
    - any fal price (the SDK carries none, and fal.ai was unreachable)
    - fal's billing unit
    - whether an endpoint absent from this SDK version exists in the live catalogue
  absence_semantics: >
    Where a selected version is not enumerated, this file records
    not_present_in_sdk_version. That is NOT the same as unavailable. An SDK can lag
    the live catalogue. It is, however, the strongest evidence reachable here, and it
    directly contradicts several EVAL-008 fal claims.

