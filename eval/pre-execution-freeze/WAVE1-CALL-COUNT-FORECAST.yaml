reduction_levers:
  purpose: Offered so the Controller can trade scope against budget EXPLICITLY. None is applied.
    Each names what evidence is lost - a cheaper wave that hides what it gave up is not cheaper,
    it is less honest.
  levers:
  - id: L1
    lever: repeats_per_item 2 -> 1
    saves_pct: 50
    loses: 'ALL reliability evidence. pass_at_k and reproducibility become uncomputable, and
      a single draw cannot distinguish a flaky model from a bad one. Strongly discouraged: reliability
      IS the product question.'
  - id: L2
    lever: drop the comparability core
    saves_pct: 12
    loses: Cross-slot comparability. Slots could no longer be compared on shared items, only
      on their own.
  - id: L3
    lever: defer VID-04 (footage edit) to Wave 2
    saves_pct: 8
    loses: Whether customer-supplied footage is usable. Preserves the hypothesis in the record
      per the Controller's trade-off rule.
  - id: L4
    lever: defer layer-3 sweeps to Wave 2
    saves_pct: 17
    loses: Condition-dependence evidence. Every result becomes a single-point measurement whose
      envelope is unknown.
  - id: L5
    lever: reduce core image slots from 4 to 3
    saves_pct: 9
    loses: 'One of: specialist-vs-generalist text, edit economics, or campaign identity. Each
      is a distinct production decision.'
  recommended_if_budget_forces_a_cut: L3 then L4. They defer whole QUESTIONS, which is recoverable
    and visible. L1 corrupts every remaining number instead, which is not.
formula_for_eval010:
  generation_cost: sum over slots of ( generations[slot] * unit_price[slot] )
  evaluator_cost: sum over instruments of ( calls[instrument] * unit_price[instrument] )
  human_cost: human_review_units * review_minutes_per_unit * hourly_rate / 60
  layers_1_3_permitted_metrics:
  - trial_cost (generation_cost + evaluator_cost over trials run)
  - reliability / repeat consistency, under a DECLARED seed policy
  - latency, error rate, refusal rate
  - cost_per_benchmark_pass where a pass is defined
  layers_1_3_forbidden_metric: customer-outcome CpAO. Layers 1-3 have no accepted customer outcomes,
    so the denominator does not exist. Reporting cost_per_benchmark_pass as CpAO is the specific
    relabelling EVAL-011 forbids.
  api_tool_cpao: (generation_cost + evaluator_cost) / accepted_outcomes
  api_tool_cpao_computable_from: STAGE C ONLY (layer 4 end-to-end outcomes)
