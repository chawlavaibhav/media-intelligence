nominal_vs_cash:
  nominal_benchmark_cost:
    definition: list-price cost of running a stage, from verified prices only
    computable_for_any_stage: false
    reason: no stage has a complete set of verified generation and evaluator prices
  cash_outlay_after_credits:
    status: UNRESOLVED
    reason: Frontier Clouds service identity remains unresolved in the repository.
      We do not know which provider holds the user's credits, what those credits cover,
      or how much remains. Media generation is frequently excluded from credit grants
      that cover language models.
    do_not_infer: true
