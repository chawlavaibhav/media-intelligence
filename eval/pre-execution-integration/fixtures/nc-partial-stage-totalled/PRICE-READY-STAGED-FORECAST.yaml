rules:
- Preserve the source billing unit. Never normalise incompatible units by guesswork.
- A missing price is null. A stage containing any null generation price has NO total.
- Nominal benchmark cost and cash outlay after credits are different numbers and are
  kept apart.
- A route-specific price is never generalised across sibling APIs or routes of the
  same model.
- Frontier Clouds identity is NOT inferred. Cash outlay stays unresolved.
