rules_applied:
  - "The scientific question is copied unchanged from EVAL-009."
  - "named_candidate is the model EVAL-009 admitted. It is never replaced here."
  - >-
    equivalent_candidates are listed ONLY where the alternative genuinely answers the SAME slot
    question. Listing one is not substituting one. Switching is a Controller decision and must
    record the route/version difference.
  - >-
    A sibling or family version is never silently substituted. Where EVAL-010 found only a
    different version of the same family, that is recorded as unresolved, not as a match.
  - "A slot is never removed because sourcing is hard. Two slots below have no verified identity and both remain."

