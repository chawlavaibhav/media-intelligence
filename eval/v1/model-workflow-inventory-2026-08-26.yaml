# -----------------------------------------------------------------------------
# CANDIDATE LEADS — NOT EVIDENCE, NOT ADMITTED, NOT PRICED.
# -----------------------------------------------------------------------------
# Deliberately recorded as vendor/product FAMILIES rather than exact model ids.
# An exact id from memory would look like verified identity and is exactly what
# the blocker above forbids. A family name is a research starting point.
# Each must be replaced by an officially verified record before admission.
candidate_leads:
  status: UNVERIFIED_LEADS_ONLY
  evidential_weight: none
  instruction: >-
    Use these only to decide which official pricing pages to open first. Do not
    carry any name from this list into a Registry row, a cost forecast or an
    admission decision without official verification of identity, availability
    and price on that date.
  image: ["Google Imagen / Gemini image", "OpenAI image", "Black Forest Labs FLUX",
          "ByteDance Seedream (via aggregator)", "Ideogram", "Stability"]
  video: ["Google Veo", "OpenAI Sora", "Runway", "Luma", "Kling", "MiniMax Hailuo", "Alibaba Wan"]
  native_av: ["Google Veo (audio-enabled tiers)", "OpenAI Sora (audio-enabled)", "Kling (audio-enabled)"]
  lipsync: ["Sync.", "HeyGen", "Hedra", "D-ID"]
  tts: ["ElevenLabs", "Google Cloud TTS / Chirp", "OpenAI TTS", "Cartesia",
        "Sarvam AI (Indic-focused)", "Azure Speech"]
  india_specific_note: >-
    The first product is Indian-market commercial media in English, Hindi and
    Hinglish. Indic-specialist TTS vendors deserve a slot in the TTS lane on
    that basis, not as an afterthought - a globally strong voice model that
    mispronounces Hindi brand names is not usable for this product. This is a
    SELECTION CRITERION, which Eval owns, and it stands independently of the
    pricing blocker.
  aggregator_note: >-
    Several models are reachable both directly and through aggregators. These
    are DIFFERENT endpoints with different prices, different version pinning
    and different reliability, and must never share a Registry row. Where both
    are available, prefer the one that can be version-pinned; if only the
    aggregator can be pinned, that is a reason to prefer the aggregator.

