# -----------------------------------------------------------------------------
# LANE ARCHITECTURE — frozen by the runbook. COMPLETE.
# -----------------------------------------------------------------------------
lanes:
  - id: image
    label: "image generation / editing"
    max_endpoints: 4
    admitted: 0
    why_this_lane: >-
      Carries static commercial creatives, product packshots and
      reference-based campaign edits - the largest share of the first product,
      and the cheapest per trial, so it should be screened widest.
    capabilities_it_can_evidence:
      [object_count, attribute_binding, spatial_relationship,
       delivery_format_compliance, exact_text_latin, exact_text_devanagari,
       typography_legibility, logo_wordmark_fidelity,
       packaging_brand_colour_fidelity, person_identity, product_identity,
       reference_conditioning, edit_preservation, anatomy_hands,
       human_object_contact, human_human_interaction,
       physics_material_appearance, proposition_objective_fit,
       hierarchy_product_as_hero, composition_brand_register]

  - id: video
    label: "general text/image-to-video"
    max_endpoints: 5
    admitted: 0
    why_this_lane: >-
      Carries 6-20 second product and brand videos without visible speech.
      Widest cap because this lane has the most credible competing providers
      and the largest quality spread.
    capabilities_it_can_evidence:
      [action_adherence, delivery_format_compliance, motion_action_quality,
       physics_material_appearance, person_stability_in_clip,
       product_stability_in_clip, text_logo_stability_in_clip,
       multi_shot_spatial_continuity, hook_pacing_temporal_hierarchy]

  - id: native_av
    label: "native audio-video (video generated with its own audio)"
    max_endpoints: 4
    admitted: 0
    why_this_lane: >-
      Distinct from video-plus-external-VO because the audio and picture are
      produced by one model, so sync and speech correctness are properties of
      the SAME trial rather than of a compositing step. Must be recorded as a
      separate workflow even where the underlying model name is shared with the
      video lane.
    capabilities_it_can_evidence:
      [spoken_language_correctness, single_speaker_lip_sync,
       two_speaker_turn_assignment_and_lip_sync, audio_video_synchronisation,
       emotional_prosodic_fit, action_adherence, motion_action_quality,
       person_stability_in_clip, delivery_format_compliance]

  - id: lipsync
    label: "dedicated lip-sync / digital human"
    max_endpoints: 3
    admitted: 0
    why_this_lane: >-
      A transformation lane, not a generation lane - it consumes an existing
      video plus an existing audio track. Its outputs are TRANSFORMATIONS and
      are counted separately from generations because the input is ours, which
      also makes some of its checks deterministic.
    capabilities_it_can_evidence:
      [single_speaker_lip_sync, two_speaker_turn_assignment_and_lip_sync,
       audio_video_synchronisation, person_identity, person_stability_in_clip,
       delivery_format_compliance]

  - id: tts
    label: "TTS / external voiceover"
    max_endpoints: 3
    admitted: 0
    why_this_lane: >-
      The cheapest lane per trial and the one where Hindi, Hinglish and Indian
      English pronunciation matter most for the first product. Should be
      screened on code-mixed script, brand names and numbers, not on clean
      English sentences.
    capabilities_it_can_evidence:
      [spoken_language_correctness, emotional_prosodic_fit,
       delivery_format_compliance]

max_endpoint_combinations: 19
endpoints_currently_admitted: 0

multi_lane_rule: >-
  One model may occupy more than one lane ONLY where the workflow/endpoint
  conditions are materially different, and each occupancy is recorded as a
  separate row with its own conditions. A model used text-to-video and again as
  native-AV is two rows, never one. One entry = one vendor + model + version +
  workflow, carried forward from the V0 Registry rule.

# -----------------------------------------------------------------------------
# PER-ENDPOINT RECORD SCHEMA — every field the runbook requires. COMPLETE.
# Zero rows are populated. This is the form each admission must fill.
# -----------------------------------------------------------------------------
endpoint_record_schema:
  vendor: "<string>"
  model_api_id: "<exact id as the provider publishes it>"
  marketed_name: "<string>"
  endpoint_or_workflow: "<string>"
  lane: "<one of the five lane ids>"
  version_pinning:
    mechanism: "<explicit version string | dated snapshot | none>"
    pinnable: "<true | false>"
    note: >-
      An endpoint that CANNOT be pinned to a version is still admissible, but
      its inability to pin must be recorded, because an unpinnable endpoint
      makes every measurement against it provisional - the model can change
      underneath a Registry row without any signal.
  modalities: "<list>"
  reference_image_support: "<true | false | unknown>"
  audio_support: "<none | native | input_only>"
  constraints:
    max_duration_s: "<number | n/a>"
    max_resolution: "<string>"
    supported_aspect_ratios: "<list>"
    seed_support: "<true | false | unknown>"
  price:
    value: "<number>"
    billing_unit: "<per image | per second | per 1M characters | per call>"
    currency: "<string>"
    source_url: "<official provider pricing page>"
    read_date: "<YYYY-MM-DD>"
    STATUS: "unresolved_in_this_session"
  availability:
    ga_or_preview: "<string>"
    region_restrictions: "<string | none stated>"
    account_restrictions: "<string | none stated>"
  local_execution_environment:
    credential_present: false
    note: "presence boolean only; never a secret value"
  wave1_rationale: "<why this endpoint merits a slot>"
  disposition: "<admit | reserve | unavailable | reject>"

