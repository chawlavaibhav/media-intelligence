# -----------------------------------------------------------------------------
# THE BLOCKER — stated precisely, with the evidence that establishes it
# -----------------------------------------------------------------------------
blocker:
  id: E2-BLOCK-01
  stop_condition: "runbook section 10 - official model version/access/pricing cannot be pinned"
  severity: blocks_admission_only
  summary: >-
    E2's admission research rule requires OFFICIAL provider documentation for
    model identity, current availability and price, and permits secondary
    sources only as leads. This cloud session's network egress policy blocks
    almost every official provider domain, so that rule cannot be satisfied.

  retested_under_correction_E_C2: >-
    RE-TESTED 26 Aug 2026 after GitHub access was restored. The network egress
    policy is UNCHANGED: 21 of 22 official provider domains remain unreachable.
    The single reachable domain, cloud.google.com, now 301-redirects its model
    and pricing documentation to docs.cloud.google.com, which is ALSO blocked.
    So the one partial route that existed before is now closed too. No price and
    no exact model identity could be obtained by any available means.

  evidence:
    method: >-
      HTTPS reachability probe of 22 official provider domains from this cloud
      session, plus document-fetch attempts against the one reachable domain
      and its documentation redirect target.
    domains_probed: 22
    domains_reachable: 1
    reachable:
      - domain: cloud.google.com
        http_status: 200
        pricing_table_extractable: false
        note: >-
          Reachable but the pricing content is JavaScript-rendered and returned
          truncated. Two fetch attempts - the Vertex AI generative-AI pricing
          page and the Cloud Text-to-Speech pricing page - both returned no
          extractable pricing table.
    blocked:
      - ai.google.dev
      - openai.com
      - platform.openai.com
      - elevenlabs.io
      - fal.ai
      - replicate.com
      - runwayml.com
      - docs.runwayml.com
      - bfl.ai
      - sarvam.ai
      - docs.sarvam.ai
      - heygen.com
      - sync.so
      - lumalabs.ai
      - klingai.com
      - minimax.io
      - deepmind.google
      - azure.microsoft.com
      - aws.amazon.com
      - stability.ai
      - ideogram.ai
    web_search_available: true
    web_search_verdict: >-
      Web search returns results, but for pricing queries the results were
      reseller blogs, cost calculators and third-party "cheap access" sites.
      Those are SECONDARY SOURCES. The runbook permits them as leads and
      explicitly forbids them as final evidence, so they were not used to
      populate any price.

  why_training_memory_was_not_used: >-
    The obvious shortcut is to write prices from the assistant's own training
    data. That was deliberately NOT done, for a reason this session can
    demonstrate rather than assert - a search lead indicated that legacy
    veo-3.0-generate-001 endpoints reached a shutdown date of 30 June 2026,
    which is AFTER the assistant's May 2026 training cutoff. Model identities
    and prices in this market change on a timescale shorter than the gap
    between that cutoff and today. Writing a remembered price into a cost
    forecast that gates a real budget decision would be inventing evidence.

  what_this_does_and_does_not_block:
    blocks:
      - "admitting any endpoint to the Wave-1 roster"
      - "producing a rupee or dollar cost figure for the later paid waves"
      - "confirming which models currently exist, are GA, or are region-limited"
    does_not_block:
      - "the five-lane architecture and roster caps (frozen by the runbook)"
      - "the admission criteria and the per-endpoint record schema"
      - "the access-visibility record"
      - "the forward call counts, which are arithmetic and are COMPLETE"
      - "the cost-forecast machinery, which is built and self-tested"

  resolution_required: >-
    A session with ordinary web access, or the Controller, fills
    `eval/v1/prices-TEMPLATE.yaml` from official provider pricing pages and runs
    `python3 eval/v1/cost_forecast.py --prices <file>`. The forecast then
    computes immediately. Estimated effort - well under an hour for someone who
    can open the provider pricing pages. This is a lookup task, not a design
    task, because all the design work around it is finished.

