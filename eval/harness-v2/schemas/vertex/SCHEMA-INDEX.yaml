shapes:
  veo:
    sources:
    - veo_t2v_guide
    - veo_i2v_guide
    - veo_params_ref
    - veo_instance_ref
    - veo_extend_guide
    - veo_references_guide
    submit: POST https://us-central1-aiplatform.googleapis.com/v1/projects/PROJECT_ID/locations/us-central1/publishers/google/models/MODEL_ID:predictLongRunning
    poll: POST ...:fetchPredictOperation {"operationName"}
    instance_fields:
    - prompt
    - image{bytesBase64Encoded|gcsUri,mimeType}
    - video{bytesBase64Encoded|gcsUri,mimeType}
    - lastFrame
    - referenceImages[{image,referenceType:asset|style}]
    parameter_fields:
    - sampleCount
    - storageUri
    - fps
    - durationSeconds
    - seed
    - aspectRatio
    - resolution
    - personGeneration
    - pubsubTopic
    - negativePrompt
    - enablePromptRewriting
    - enhancePrompt
    - generateAudio
    - compressionQuality
    - task
    - resizeMode
    evidence_quotes:
    - '"durationSeconds": number'
    - '"generateAudio": boolean'
    - 'Veo 3 models: 4, 6, or 8'
    - The extended length is 7 seconds
    - If not provided, video bytes are returned in the response
    - '"referenceType": "asset"'
  omni:
    sources:
    - veo_t2v_guide
    - veo_i2v_guide
    - omni_interactions_ref
    submit: POST https://aiplatform.googleapis.com/v1beta1/projects/PROJECT_ID/locations/global/interactions
    body_fields:
    - model
    - input[{type:text,text}|{type:image,uri|data,mime_type}]
    - response_format[{type:video,delivery,gcs_uri,aspect_ratio,resolution,duration}]
    - generation_config.video_config.task
    evidence_quotes:
    - Allowed strings are integers between 3 and 10, followed by "s"
    - 'gemini-omni-1.1-flash-preview supports the following values: "360p" "720p" "1080p" "4k"'
    - '"type":"model_output","content":[{"type":"video","data":"VIDEO DATA","mime_type":"video/mp4"'
  gemini_image:
    sources:
    - gemini_image_guide
    live_proven_module: eval/experiments/EVAL-038/tools/generate_media.py (Gemini Developer API, 2026-09-01)
    submit: POST https://aiplatform.googleapis.com/v1/projects/PROJECT_ID/locations/global/publishers/google/models/MODEL_ID:generateContent
    evidence_quotes:
    - '"responseModalities": ["TEXT", "IMAGE"]'
    - '"imageConfig": { "aspectRatio": "16:9"'
    - export GOOGLE_CLOUD_LOCATION=global
    - gemini-3.1-flash-image
    - gemini-3-pro-image
  lyria:
    sources:
    - lyria_ref
    submit: POST https://us-central1-aiplatform.googleapis.com/v1/projects/PROJECT_ID/locations/us-central1/publishers/google/models/lyria-002:predict
    evidence_quotes:
    - '"instances": [ { "prompt": "string", "negative_prompt": "string", // Optional "seed": 0 // Optional. Cannot be used with sample_count.'
    - '"parameters": { "sample_count": 1'
    - '"audioContent" : "BASE64_ENCODED_WAV_STRING_SAMPLE_1" , "mimeType" : "audio/wav"'
    - Each generated audio clip is 30 seconds long
  sarvam:
    sources:
    - sarvam_tts_ref
    submit: POST https://api.sarvam.ai/text-to-speech
    auth: api-subscription-key header
    evidence_quotes:
    - text string Required
    - language_code enum Required The language code in BCP-47 format
    - speaker enum or null Optional Defaults to shubh
    - 'bulbul:v3: Max 2500 characters'
    - audios list of strings The output audio files in WAV format, encoded as base64 strings
