shapes:
  elevenlabs_tts:
    sources:
    - elevenlabs_tts_convert_ref
    - elevenlabs_models_ref
    submit: POST https://api.elevenlabs.io/v1/text-to-speech/{voice_id}?output_format=mp3_44100_128
    auth: xi-api-key header
    model_id: eleven_v3          # from the models page; the convert page's default is eleven_multilingual_v2
    character_limit: 5000        # models page, eleven_v3 row
    required_fields:
    - text
    body_fields_sent:
    - text
    - model_id
    body_fields_pinned:
    - text
    - model_id
    - language_code
    - voice_settings
    - pronunciation_dictionary_locators
    - seed
    - previous_text
    - next_text
    - previous_request_ids
    - next_request_ids
    - apply_text_normalization
    - apply_language_text_normalization
    - use_pvc_as_ivc
    output: raw audio bytes; output_format mp3_44100_128 (the pinned default, sent explicitly) -> audio/mpeg
    evidence_quotes:
    - text string Required The text that will get converted into speech
    - model_id string Optional Defaults to eleven_multilingual_v2
    - output_format enum Optional Defaults to mp3_44100_128
    - The generated audio file
    - eleven_v3 5,000 ~5 minutes
  elevenlabs_music:
    sources:
    - elevenlabs_music_compose_ref
    submit: POST https://api.elevenlabs.io/v1/music?output_format=mp3_44100_128
    auth: xi-api-key header
    model_id: music_v1           # the pinned default, sent explicitly so the measured model is recorded
    required_fields: []          # the page marks every body field Optional; the adapter refuses without a prompt and a duration
    body_fields_sent:
    - prompt
    - music_length_ms
    - model_id
    body_fields_pinned:
    - prompt
    - composition_plan
    - music_length_ms
    - model_id
    - seed
    - force_instrumental
    - finetune_id
    - respect_sections_durations
    - store_for_inpainting
    - sign_with_c2pa
    limits:
      prompt_chars_max: 4100
      music_length_ms: 3000-600000
    output: raw audio bytes; output_format mp3_44100_128 (what "auto" resolves to for v1 models) -> audio/mpeg; response header song-id
    evidence_quotes:
    - prompt string or null Optional <=4100 characters A simple text prompt to generate a song from
    - music_length_ms integer or null Optional 3000-600000 The length of the song to generate in milliseconds
    - model_id enum Optional Defaults to music_v1
    - song-id string Optional Unique identifier for the generated song
    - The generated audio file in the format specified
