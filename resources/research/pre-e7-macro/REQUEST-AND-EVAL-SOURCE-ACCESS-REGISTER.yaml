# Request / evaluation source access & rights register
#
# Task: R3-A of resources/tasks/RES-003-CLOUD-EVIDENCE-PROGRAM.md. Owner: Resources.
# Companion narrative: SOURCE-ACCESS-RIGHTS-REPORT.md
# Validator: validators/check_source_register.py (fail-closed)
#
# WHAT THIS IS. One row per public source that Canon's request-space work or Eval's capability work
# is likely to want. Each row separates the facts that this project has learned to keep separate,
# because collapsing them is how it has been burned before:
#   * a CODE licence is not a MEDIA licence (the PVP trap: a search asserted the dataset was MIT; it
#     was the repository's code licence);
#   * a dataset/annotation licence is not the underlying-media rights;
#   * "publicly reachable" is not "ungated";
#   * useful for DISCOVERY is not automatically usable for CALIBRATION or HOLDOUT.
#
# EVIDENCE LEVEL - READ THIS BEFORE QUOTING ANY ROW.
# This session's network egress proxy BLOCKS the official pages: huggingface.co, arxiv.org,
# poloclub.github.io and vidprom.github.io all returned EGRESS_BLOCKED on direct fetch. Web SEARCH
# worked. So every rights fact below is `search_supported` - drawn from search results that quote or
# summarise the official source - and NOT `officially_verified`. No row may drive an acquisition
# decision until a human reads the actual licence file on the actual distribution page.
#
# NO ACQUISITION OCCURRED. No dataset was downloaded, no account created, no terms accepted, ZERO
# spend. This is a documentation/metadata survey only.

meta:
  version: v1
  date: 2026-08-26
  task: R3-A
  branch: work/res-003-evidence-topology
  session: cloud-only, no laptop, no raw corpus, no provider credentials
  evidence_levels:
    officially_verified: "Read directly from the creator/publisher/distributor page in this session."
    search_supported: "From search results quoting or summarising the official source. NOT read directly."
    inferred: "Reasoned from other recorded facts. Labelled as inference wherever it appears."
    unknown: "Not established."
  egress_limitation: >
    huggingface.co, arxiv.org, poloclub.github.io and vidprom.github.io are BLOCKED by this session's
    egress proxy (confirmed by direct fetch attempts returning EGRESS_BLOCKED). Therefore NOTHING in
    this register is officially_verified. Official rights verification must happen where those pages
    are reachable.
  suitability_vocabulary:
    request_discovery: "Learning what people ask for. Tolerates bias and staleness; needs scale and realism."
    benchmark_construction: "Authoring or tuning benchmark tasks. Contaminates anything downstream that shares its lineage."
    evaluator_calibration: "Setting an instrument's operating point. Same contamination consequence."
    active_benchmark: "Scoring current models."
    final_holdout: "Untouched reserve. One look and it is no longer a holdout."

