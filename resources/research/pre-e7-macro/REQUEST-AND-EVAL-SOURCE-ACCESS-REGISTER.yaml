  - source_id: src_arena_t2i_hard
    name: Arena-T2I-Hard
    category: evaluation_benchmark_text_to_image
    publisher: "banyuanhao et al.; distributed under lmarena-ai"
    distributor: "Hugging Face (lmarena-ai/Arena-T2I-Hard); GitHub banyuanhao/Arena-T2I-Hard"
    access_route: public_hugging_face
    authentication_or_terms_gate: none_reported
    dataset_annotation_licence:
      value: "Not separately established in this session. The prompts derive from the arena pool (CC-BY-4.0 for user prompts)."
      evidence_level: unknown
    underlying_media_rights: {value: "No media distributed with the prompt benchmark per available description.", evidence_level: search_supported}
    prompt_text_rights: {value: "Derived from arena user prompts.", evidence_level: search_supported}
    prompt_text_accessible: yes_full_text
    redistribution_status: unknown
    internal_research_evaluation_suitability: "Suitable as an external benchmark reference."
    suitable_for: [active_benchmark]
    NOT_suitable_for: [final_holdout]
    critical_leakage_warning: >
      THE SHARPEST LEAKAGE RISK IN THIS REGISTER. Arena-T2I-Hard's 310 prompts are sampled from the
      SAME public arena pool that src_arena_leaderboard_data exposes. If Canon learns its request
      grammar from arena prompts and Eval then benchmarks on Arena-T2I-Hard, the benchmark is a
      descendant of the discovery set and any "generalisation" claim is circular. They are ONE
      LINEAGE and must not occupy both a discovery role and a holdout role in the same experiment.
    methodology_notes:
      value: >
        310-prompt stress benchmark of real hard arena requests (long, multi-entity, with attributes,
        spatial relations, counts, stylistic constraints). Prompts span Jan-Mar 2026. NSFW, PII and
        invalid-prompt filtering applied, each prompt manually checked. Evaluator is a dependency-aware
        checklist: each prompt decomposed into a DAG of yes/no questions, failing a parent zeroes its
        descendants. ~13.9k questions across 310 prompts (9.6k faithfulness, ~4.4k aesthetics).
        Separately, a 10k training set and a disjoint 1k test set are sampled from the arena pool.
      evidence_level: search_supported
    resources_note_for_eval: >
      The dependency-aware DAG structure is methodologically interesting to Eval and is NOT a Resources
      decision. Recorded as observed methodology, not endorsed. Note also that its own 10k/1k split is
      an example of exactly the discipline R3-C proposes.
    source_lineage: "lin_lmarena — SHARED with src_arena_leaderboard_data."
    approximate_scale: {value: "310 benchmark prompts; 13.9k checklist questions", evidence_level: search_supported}
    acquisition_status: not_acquired_documentation_only

