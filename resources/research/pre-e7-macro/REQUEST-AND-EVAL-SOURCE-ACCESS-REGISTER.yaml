# ===========================================================================
# Lineage groups — sources sharing a group are NOT independent of each other
# ===========================================================================
lineage_groups:
  lin_diffusiondb:
    members: [src_diffusiondb, src_imagerewarddb]
    note: >
      src_imagerewarddb IS ALREADY IN OUR ACQUIRED CORPUS (2,584 items) and its images come from
      DiffusionDB. Acquiring DiffusionDB would therefore NOT add an independent lineage; it would
      enlarge one we already hold.
  lin_pika_discord:
    members: [src_vidprom, src_tip_i2v]
