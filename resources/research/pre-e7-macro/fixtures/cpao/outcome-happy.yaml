#
# EVERYTHING HERE IS SYNTHETIC. Fictional provider, fictional model, ledger basis synthetic_test,
# currency XTS (the ISO code reserved for testing). No provider was called and no money was spent.
#
# THE POINT OF THIS FIXTURE: art-logo is generated ONCE and used by TWO shots. A naive walk of the
# provenance tree visits it twice and double-counts its cost. The correct answer counts it once.
#
#   HAND-COMPUTED EXPECTED TOTAL
#     gen shot1                        10.00
#     gen shot2 (attempt 1, ERROR)      4.00   <- failed attempt still cost money
#     gen shot2 (retry, ok)            10.00
#     gen logo  (SHARED by shot1+shot3) 6.00   <- counted ONCE, not twice
#     gen shot3                        10.00
#     refused attempt (no artifact)     1.00   <- refusal cost, no bytes produced
#     local concat (recorded compute)   0.50
#     local overlay                     0.00   <- free local step, entry exists with amount 0
#     evaluator measurements 3 x 0.25   0.75   <- three separate ledger entries
#     human review                      3.00
#                                    -------
#     TOTAL                            45.25
#     accepted outcomes                    1
#     CpAO                             45.25
#
#   DISTINCT LEDGER ENTRIES COUNTED = 12
#     6 provider attempts (incl. 1 error, 1 refusal) + 2 local + 1 human + 3 evaluator.
#     NOTE: LED-LOCAL-OVERLAY is referenced by TWO steps (S-7 and S-8) and LED-LOGO is consumed by
#     TWO composites - both are counted ONCE. That is two independent demonstrations of the dedup.
#
#   A naive tree-walk that double-counts the shared logo would report 51.25. The negative control
#   fixture asserts the engine does NOT produce that.

