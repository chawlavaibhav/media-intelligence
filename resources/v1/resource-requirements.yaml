# Resource requirements matrix — machine-readable source of truth
#
# Owner: Resources. Produced by R1 of RESOURCES-V1-OVERNIGHT-PROGRAM.md on 26 Aug 2026.
#
# WHAT THIS IS. One row per thing that Canon or Eval needs material for. It answers a single
# question per row: does this need media from outside the project, does Eval build it itself,
# is what we already hold enough, or does it need no media at all?
#
# WHAT THIS IS NOT. It is not a shopping list and not an approval. A row marked `missing` is a
# statement that a named consumer needs something we do not have. Acquiring it needs a separate
# Controller decision. Resources does not decide thresholds, labels or creative quality.
#
# AUTHORITY. Capability ids and counts are taken verbatim from eval/tasks/EVAL-V1-OVERNIGHT-PROGRAM.md
# and canon/tasks/CANON-V1-OVERNIGHT-PROGRAM.md. Where Resources believes a target is wrong, it is
# recorded in `resources_note`, never silently changed.

meta:
  version: v1
  date: 2026-08-26
  task: R1
  branch: work/resources-v1-overnight
  authored_by: Resources worker (cloud session, no laptop access)
  capability_source: eval/tasks/EVAL-V1-OVERNIGHT-PROGRAM.md section 1 (36 frozen capabilities)
  instrument_source: eval/tasks/EVAL-V1-OVERNIGHT-PROGRAM.md section 5 (6 evaluator families)
  canon_source: canon/tasks/CANON-V1-OVERNIGHT-PROGRAM.md C2, C9, C10
  states:
    available: "A named existing source or pack satisfies this row now."
    partial: "Existing material covers part of the row; a named remainder is missing."
    missing: "No existing material satisfies this row; acquisition or construction is required."
    blocked: "Material is identified but access/rights/consent prevent obtaining it under current policy."
    constructed_by_eval: "Eval builds the material itself; Resources supplies no external media."
    no_external_resource: "The measurement needs no media beyond the model's own outputs/telemetry."
  storage_classes:
    A: "Reacquirable external material. Retain selection rule, hashes, member list, official URL, retrieval script."
    B: "Controlled/permissioned reference material. Retain durable originals plus permission/provenance records."
    C: "Irreproducible empirical model output. Never treat as reacquirable; preserve bytes plus full provenance."
    none: "No stored media."

# ---------------------------------------------------------------------------
# Shared packs. Several capability rows point at the same pack on purpose.
# The whole point of doing R1 before R4 is that we buy/build one pack, not six.
# ---------------------------------------------------------------------------
packs:
  - pack_id: PACK-PRODUCT-REF
    name: Controlled product reference pack
    target: ">=48 images = 12 products x >=4 controlled views"
    state: missing
    storage_class: B
    serves: [REQ-CAP-10, REQ-CAP-12, REQ-CAP-13, REQ-CAP-14, REQ-CAP-21, REQ-INS-03]
    why_one_pack: "Product identity, packaging colour, reference conditioning, edit preservation and in-clip product stability are five different measurements of the same physical objects. Acquiring five packs would multiply cost and destroy comparability."
    # Folded in under R-C5 of RESOURCES-V1-CORRECTION-PASS.md. These are composition requirements on
    # the SAME >=48 images: not a fifth pack, not a larger target.
    composition_requirements:
      non_match_decoys: >
        Choose the 12 products so that same-category non-match decoys exist within the pack - at least
        two visually similar products per category. A known-non-match comparison is only meaningful
        against a plausible confusion: an identity checker that distinguishes a shoe from a kettle has
        demonstrated nothing.
      declared_brand_colour_reference: >
        Record a declared brand-colour reference value per product where one applies, plus the capture
        lighting and any colour reference card in frame. Without a declared value there is nothing for
        packaging_brand_colour_fidelity to be measured against.
      difficulty_coverage: >
        Where feasible, cover curved surfaces, angled/oblique views and logo-on-surface placement. A
        wordmark on a flat front-facing box is the easy case; the commercially common case is a mark
        wrapped around a bottle or read at an angle.
      resources_boundary: >
        Resources records the declared colour value, the capture conditions and which products are
        same-category. Resources does NOT decide the tolerance, the match threshold, or what counts as
        an acceptable colour difference - those are Eval's.

  - pack_id: PACK-PERSON-REF
    name: Controlled person reference pack
    target: ">=32 images = 8 identities x >=4 controlled views"
    state: missing
    storage_class: B
    serves: [REQ-CAP-11, REQ-CAP-13, REQ-CAP-14, REQ-CAP-20, REQ-INS-03]
    why_one_pack: "Same reasoning as product. Also the pack with the highest consent/privacy exposure, so it must be acquired once, deliberately, with documented permission."
    # Folded in under R-C5. Composition requirements on the SAME >=32 images.
    composition_requirements:
      known_match_and_decoy: >
        The 8 identities must themselves support known-match and known-non-match comparisons. Include
        at least one pair of plausibly confusable identities (similar age, build, skin tone, hair,
        eyewear) so a non-match is a real test rather than a trivial one.
      no_public_face_scraping: >
        Absolute, and reaffirmed by R-C5. Identities come from consented capture or purpose-created
        synthetic references. No public-face dataset, no scraping, no opportunistic collection.
      resources_boundary: >
        Resources records identity ids, capture conditions, which pairs are the intended decoys, and
        the consent record. Resources does NOT decide how similar is 'too similar', or what similarity
        score constitutes a match.

  - pack_id: PACK-AV-CLEAN
    name: Clean AV calibration pack
    target: "36 clips = 24 single-speaker + 12 two-speaker; transcripts for all; turn boundaries for two-speaker; English/Hindi/Hinglish represented"
    state: missing
    storage_class: B
    serves: [REQ-CAP-24, REQ-CAP-25, REQ-CAP-26, REQ-CAP-27, REQ-CAP-28, REQ-INS-05]
    why_one_pack: "All five speech/audio capabilities and the entire speech instrument family depend on the same clean recordings plus deterministic perturbations of them."
    hard_blocker: "The current corpus contains ZERO audio. The YouTube-UGC clips are audio-removed excerpts. This is not a shortfall to top up; it is an empty category."
    # Folded in under R-C5. Composition requirements on the SAME 36 clips.
    composition_requirements:
      explicit_turn_boundaries: >
        All 12 two-speaker clips carry explicit turn boundaries with speaker attribution, not merely a
        transcript. This is the annotation almost no public source ships, and it is what
        two_speaker_turn_assignment_and_lip_sync actually measures.
      perturbation_reuse: >
        Reuse >=12 clean clips from THIS pack as the deterministic temporal-perturbation base rather
        than acquiring a fifth pack. Scientifically valid because a perturbation base needs only clips
        whose sole defect is the one introduced, and a controlled recording satisfies that better than
        KoNViD-1k, which was sampled for degradation variety.
      lineage_consequence: >
        Consequence Resources must enforce: clips reused for perturbation qualification share content
        lineage with their AV originals, so they cannot serve as an independent holdout for any speech
        measurement that also uses the original. The lineage keys make this checkable rather than a
        matter of memory.
      resources_boundary: >
        Resources supplies the clips, the verified transcripts, the turn boundaries and the exact
        introduced offsets. Resources does NOT set the millisecond tolerance - Eval derives that from
        evidence.

  - pack_id: PACK-COMMERCIAL
    name: Commercial creative bank
    target: "80 assets = 40 static + 40 video; 60 active + 20 untouched reserve; target >=50% Indian-market; >=6 commercial categories"
    state: missing
    storage_class: B
    serves: [REQ-CAP-29, REQ-CAP-30, REQ-CAP-31, REQ-CAP-32, REQ-INS-06, REQ-CAN-03]
    why_one_pack: "Eval's creative/commercial evaluator qualification and Canon's Experiment B are explicitly told to reuse ONE 60-active-asset bank. Two independent acquisitions would be waste and would make the two results incomparable."
    resources_constraint: "Selection axes may be product category, media type, market/language, duration or platform. Selection may NEVER be by whether Canon predicts the asset is good or bad — that is the circularity this stream exists to prevent."
    # Folded in under R-C5. Composition requirements on the SAME 80 assets.
    composition_requirements:
      reserve_frozen_first: >
        The 20-asset reserve is frozen BEFORE any evaluator or Canon tuning touches the 60 active
        assets. Freezing is one-way: a reserve anyone has inspected is no longer a reserve.
      known_clean_subset: >
        Eval or its human reviewers may later establish a >=15 asset known-clean subset for
        false-criticism calibration - measuring how often an evaluator invents a fault that is not
        there. Resources supplies candidates, rights and provenance and MUST NOT author that label:
        'clean' is a creative-quality judgement and belongs to Eval and its human reviewers.
      resources_boundary: >
        Resources supplies candidates, rights records and descriptive axes only. No creative labels,
        no quality judgements, no selection by the theory under test.

  - pack_id: PACK-CV-FIXTURES
    name: Deterministic CV known-answer fixtures
    target: ">=100 synthetic fixtures spanning count, bounding/relative position, aspect/duration, simple attribute and relationship checks"
    state: constructed_by_eval
    storage_class: none
    serves: [REQ-CAP-01, REQ-CAP-02, REQ-CAP-03, REQ-CAP-05, REQ-INS-02]
    why: "Truth is generated, not observed, so no human label and no external media are needed. Resources supplies nothing here and should not be asked to."

  - pack_id: PACK-LATIN-TEXT
    name: Latin exact-text calibration pack
    target: "Deterministic, human-auditable rendered-string pack; size set by Eval"
    state: constructed_by_eval
    storage_class: none
    serves: [REQ-CAP-06, REQ-INS-01]
    resources_constraint: "Must NOT mutate the frozen 96-item Devanagari battery. A separate pack, built the same way."

  - pack_id: PACK-DEVA-READ
    name: Devanagari reading calibration pools (existing)
    target: "Existing photographed Devanagari with human transcriptions"
    state: available
    storage_class: A
    serves: [REQ-CAP-07, REQ-INS-01]
    backing_sources: [src_bstd_devanagari, src_indicstr12_devanagari, src_iiit_ilst_devanagari]
    lineage_warning: "IndicSTR12 + IIIT-ILST are ONE source lineage. BSTD is the only genuine cross-lineage reserve."

  - pack_id: PACK-DEVA-GEN
    name: Devanagari generated-defect battery (existing, frozen)
    target: "96 items = 48 match / 48 mismatch, 48 accepted base words, 33 hard opportunities, 20 failure classes / 5 groups"
    state: constructed_by_eval
    storage_class: none
    serves: [REQ-CAP-07, REQ-INS-01]
    owner: Eval
    note: "Frozen and human-validated. Resources neither owns nor may modify it. Listed here so nobody acquires media to duplicate work that is already done."
    reproducibility_caveat: "Not rebuildable from GitHub alone: built items live under a git-ignored build/ directory and the pinned font is an uncommitted proprietary system asset. Recorded, not solved, by Resources."

  - pack_id: PACK-TEMPORAL-PERTURB-BASE
    name: Clean base clips for deterministic temporal perturbation
    target: "Clips clean enough that an introduced discontinuity is the only defect"
    state: partial
    storage_class: A
    serves: [REQ-CAP-23, REQ-INS-04]
    backing_sources: [src_konvid1k, src_youtube_ugc]
    limitation: "KoNViD-1k was sampled for DEGRADATION variety (compression, blur, shake). Perturbation calibration wants clips whose only defect is the one introduced. Usable, but the base-clip cleanliness must be screened by Eval before qualification, and Resources cannot screen it in this cloud session."
    # R-C5: this is NOT a fifth acquisition. Once PACK-AV-CLEAN exists, >=12 of its controlled clips
    # become the preferred perturbation base, because a controlled recording is cleaner than material
    # sampled for degradation variety. This pack then falls back to a stopgap using existing holdings.
    superseded_by_when_available: PACK-AV-CLEAN
    lineage_consequence: >
      Clips reused from PACK-AV-CLEAN for perturbation qualification share content lineage with their
      AV originals and cannot serve as an independent holdout for a speech measurement that also uses
      the original.

# ---------------------------------------------------------------------------
# Capability rows: 36/36
# ---------------------------------------------------------------------------
requirements:

  # === A. Constraint fidelity ===
  - id: REQ-CAP-01
    consumer: "Eval capability object_count"
    group: A_constraint_fidelity
    media: "generated image + video (Eval output); synthetic fixtures for instrument"
    target_quantity: constructed_by_eval
    required_metadata: "prompt-declared target count; deterministic ground truth for fixtures"
    label_trust: deterministically_validated
    independence: "item-level only; no external lineage risk"
    geo_language: n/a
    rights_minimum: none_external
    storage_class: none
    candidate_sources: [PACK-CV-FIXTURES]
    state: constructed_by_eval
    why: "Counting objects has a generated right answer. Downloading a dataset to test counting would import someone else's labels for no gain."

  - id: REQ-CAP-02
    consumer: "Eval capability attribute_binding"
    group: A_constraint_fidelity
    media: "generated image/video; synthetic fixtures for instrument"
    target_quantity: constructed_by_eval
    required_metadata: "prompt-declared attribute-to-object bindings"
    label_trust: deterministically_validated
    independence: item_level
    geo_language: n/a
    rights_minimum: none_external
    storage_class: none
    candidate_sources: [PACK-CV-FIXTURES]
    state: constructed_by_eval
    why: "Same as object_count: the binding is declared by the prompt, so truth is known by construction."

  - id: REQ-CAP-03
    consumer: "Eval capability spatial_relationship"
    group: A_constraint_fidelity
    media: "generated image/video; synthetic fixtures for instrument"
    target_quantity: constructed_by_eval
    required_metadata: "declared relative positions; fixture bounding boxes"
    label_trust: deterministically_validated
    independence: item_level
    geo_language: n/a
    rights_minimum: none_external
    storage_class: none
    candidate_sources: [PACK-CV-FIXTURES]
    state: constructed_by_eval
    why: "Position truth can be rendered exactly. No acquisition justified."

  - id: REQ-CAP-04
    consumer: "Eval capability action_adherence"
    group: A_constraint_fidelity
    media: "generated video (Eval output)"
    target_quantity: constructed_by_eval
    required_metadata: "prompt-declared action; observation unit = whole clip"
    label_trust: "requires human or qualified VLM adjudication; NOT deterministic"
    independence: item_level
    geo_language: n/a
    rights_minimum: none_external
    storage_class: none
    candidate_sources: []
    state: constructed_by_eval
    resources_note: "Flagged for Eval: unlike 01-03 this has no deterministic checker, so its instrument qualification depends on REQ-INS-03/04, which are themselves blocked on missing packs."
    why: "The stimulus is Eval's own generation. Resources supplies no media."

  - id: REQ-CAP-05
    consumer: "Eval capability delivery_format_compliance"
    group: A_constraint_fidelity
    media: "generated asset container metadata only"
    target_quantity: no_external_resource
    required_metadata: "requested duration/aspect/resolution/output contract vs delivered"
    label_trust: deterministically_validated
    independence: n/a
    geo_language: n/a
    rights_minimum: none_external
    storage_class: none
    candidate_sources: []
    state: no_external_resource
    why: "This is a file-property check against the request. It needs no reference media at all."

  # === B. Text and brand ===
  - id: REQ-CAP-06
    consumer: "Eval capability exact_text_latin"
    group: B_text_brand
    media: "generated image/video; deterministic rendered calibration pack for instrument"
    target_quantity: constructed_by_eval
    required_metadata: "exact target string; rendered ground truth"
    label_trust: deterministically_validated
    independence: "string-level; base strings must not be reused between calibration and qualification"
    geo_language: Latin_script
    rights_minimum: none_external
    storage_class: none
    candidate_sources: [PACK-LATIN-TEXT]
    state: constructed_by_eval
    resources_note: "The corpus holds only 14 English-labelled BSTD images. That is nowhere near a real-world Latin scene-text pool, and it is not needed: the Devanagari battery proved rendered strings are the better instrument."
    why: "Copying the proven EVAL-005 method to Latin is cheaper and more auditable than acquiring real Latin scene text."

  - id: REQ-CAP-07
    consumer: "Eval capability exact_text_devanagari"
    group: B_text_brand
    media: "real photographed Devanagari (reading) + Eval-generated Devanagari (rendering)"
    target_quantity: "reading: existing 29,722-item pool; rendering: 96-item frozen battery"
    required_metadata: "human transcription per item; script-level filter, not language label"
    label_trust: "source transcriptions are OBSERVATIONS of one annotator group, not project ground truth, until Eval validates them"
    independence: "source lineage: CVIT pair = one lineage; BSTD = independent"
    geo_language: Devanagari_India
    rights_minimum: "internal research/evaluation only; CVIT sources rights not_stated"
    storage_class: A
    candidate_sources: [PACK-DEVA-READ, PACK-DEVA-GEN]
    state: available
    resources_note: "TWO DIFFERENT ABILITIES, one capability id. Reading real signage is covered. Judging a generator's own Devanagari rendering is covered by the 96-item battery. What is NOT covered is real generated-Devanagari failure material at scale, which only paid generation produces."
    why: "The single best-covered capability in the project, and the only one where existing material is genuinely sufficient."

  - id: REQ-CAP-08
    consumer: "Eval capability typography_legibility"
    group: B_text_brand
    media: "generated image/video"
    target_quantity: constructed_by_eval
    required_metadata: "type size/contrast/placement conditions declared by the item"
    label_trust: "human or qualified VLM adjudication"
    independence: item_level
    geo_language: "Latin + Devanagari"
    rights_minimum: none_external
    storage_class: none
    candidate_sources: []
    state: constructed_by_eval
    resources_note: "Canon holds no accepted Devanagari-structure source (CANON-008 stopped). Resources cannot supply typographic judgement criteria and must not invent them."
    why: "Legibility is judged on Eval's own outputs against declared conditions."

  - id: REQ-CAP-09
    consumer: "Eval capability logo_wordmark_fidelity"
    group: B_text_brand
    media: "reference logo/wordmark assets + generated output"
    target_quantity: ">=12 distinct marks with clear ownership (aligned to the 12 products)"
    required_metadata: "vector or high-resolution original; ownership/permission record; colour spec"
    label_trust: deterministically_validated
    independence: "brand-level: a mark used in calibration must not appear in qualification"
    geo_language: "target >=50% Indian-market brands"
    rights_minimum: "first-party or explicitly permissioned; third-party trademarks are NOT usable by default"
    storage_class: B
    candidate_sources: [PACK-PRODUCT-REF, LEGACY-MF-REFS]
    state: partial
    resources_note: "PARTIAL, and this is a real find. Three first-party logo assets are recoverable from chawlavaibhav/media-factory git history (spike/refs/logo_0.png, logo_1.png, aight_logo.png). That is 3 of >=12 marks, from a project-owned source. See LEGACY-EVIDENCE-RECONCILIATION.md."
    why: "Brand fidelity is the capability most exposed to trademark risk. Using project-owned marks removes that risk entirely for the part it covers."

  - id: REQ-CAP-10
    consumer: "Eval capability packaging_brand_colour_fidelity"
    group: B_text_brand
    media: "controlled product photographs + generated output"
    target_quantity: "covered by PACK-PRODUCT-REF (>=48 images / 12 products)"
    required_metadata: "measured or specified brand colour values; lighting conditions recorded"
    label_trust: deterministically_validated
    independence: product_level
    geo_language: "target >=50% Indian-market"
    rights_minimum: "first-party or permissioned; controlled capture strongly preferred"
    storage_class: B
    candidate_sources: [PACK-PRODUCT-REF]
    state: missing
    why: "Colour fidelity needs a known reference value. A web image with unknown colour management cannot serve as one."

  # === C. Identity and references ===
  - id: REQ-CAP-11
    consumer: "Eval capability person_identity"
    group: C_identity_references
    media: "controlled person reference images + generated output"
    target_quantity: ">=32 images = 8 identities x >=4 views"
    required_metadata: "identity id, view/pose/lighting condition, capture date, written consent record"
    label_trust: "known-match/known-nonmatch by construction; similarity is NOT exactness and needs human adjudication"
    independence: "identity-level: an identity in calibration must not appear in qualification"
    geo_language: "should include South Asian faces; skin-tone and age spread recorded"
    rights_minimum: "explicit written consent for internal evaluation use; biometric-data implications documented"
    storage_class: B
    candidate_sources: [PACK-PERSON-REF]
    state: missing
    resources_note: "HIGHEST-RISK ROW IN THE MATRIX. Consent and biometric exposure make this the one pack that must never be filled opportunistically. 19 images of what appears to be a single identity are recoverable from media-factory history, but I could not establish a consent record for them in this session, so they are recorded as a candidate needing rights confirmation, NOT as supply."
    why: "Identity consistency is a core commercial requirement (the same spokesperson across a campaign) and cannot be measured without controlled references."

  - id: REQ-CAP-12
    consumer: "Eval capability product_identity"
    group: C_identity_references
    media: "controlled product reference images + generated output"
    target_quantity: ">=48 images = 12 products x >=4 views"
    required_metadata: "product id, view/angle, lighting, scale reference, ownership record"
    label_trust: "known-match/known-nonmatch by construction"
    independence: product_level
    geo_language: "target >=50% Indian-market products"
    rights_minimum: "first-party ownership or explicit permission"
    storage_class: B
    candidate_sources: [PACK-PRODUCT-REF]
    state: missing
    why: "The single most commercially load-bearing capability: if the generated product is not the customer's product, nothing else about the asset matters."

  - id: REQ-CAP-13
    consumer: "Eval capability reference_conditioning"
    group: C_identity_references
    media: "both reference packs + generated output"
    target_quantity: "reuses PACK-PRODUCT-REF and PACK-PERSON-REF"
    required_metadata: "which reference images were supplied to the model; conditioning mode"
    label_trust: "human or qualified VLM adjudication"
    independence: "identity and product level"
    geo_language: inherits_from_packs
    rights_minimum: inherits_from_packs
    storage_class: B
    candidate_sources: [PACK-PRODUCT-REF, PACK-PERSON-REF]
    state: missing
    why: "Measures whether the model actually used the reference it was given. Needs no new media beyond the two packs."

  - id: REQ-CAP-14
    consumer: "Eval capability edit_preservation"
    group: C_identity_references
    media: "both reference packs + controlled edit pairs"
    target_quantity: "reuses PACK-PRODUCT-REF and PACK-PERSON-REF"
    required_metadata: "before/after pair, declared edit instruction, declared must-not-change regions"
    label_trust: deterministically_validated
    independence: "identity and product level"
    geo_language: inherits_from_packs
    rights_minimum: inherits_from_packs
    storage_class: B
    candidate_sources: [PACK-PRODUCT-REF, PACK-PERSON-REF]
    state: missing
    why: "Editing is where the money is in production reuse. Preservation is checkable against a declared unchanged region, so it is cheap once the packs exist."

  # === D. Human and physical realism ===
  - id: REQ-CAP-15
    consumer: "Eval capability anatomy_hands"
    group: D_realism
    media: "generated image/video"
    target_quantity: constructed_by_eval
    required_metadata: "declared hand-involving action; observation unit = frame or image"
    label_trust: "human adjudication; no deterministic checker exists"
    independence: item_level
    geo_language: n/a
    rights_minimum: none_external
    storage_class: none
    candidate_sources: []
    state: constructed_by_eval
    resources_note: "Instrument qualification for this needs known-defect examples. Those come from Eval's own generations once E7 runs, not from an acquisition."
    why: "Classic generator failure mode; the stimulus is the generator's own output."

  - id: REQ-CAP-16
    consumer: "Eval capability human_object_contact"
    group: D_realism
    media: "generated image/video"
    target_quantity: constructed_by_eval
    required_metadata: "declared contact/grip relationship"
    label_trust: human_adjudication
    independence: item_level
    geo_language: n/a
    rights_minimum: none_external
    storage_class: none
    candidate_sources: []
    state: constructed_by_eval
    why: "Person-holding-product is the commonest commercial shot and the commonest physical failure. Stimulus is Eval-generated."

  - id: REQ-CAP-17
    consumer: "Eval capability human_human_interaction"
    group: D_realism
    media: "generated image/video"
    target_quantity: constructed_by_eval
    required_metadata: "declared interaction"
    label_trust: human_adjudication
    independence: item_level
    geo_language: n/a
    rights_minimum: none_external
    storage_class: none
    candidate_sources: []
    state: constructed_by_eval
    why: "Same pattern as 15/16."

  - id: REQ-CAP-18
    consumer: "Eval capability motion_action_quality"
    group: D_realism
    media: "generated video; real and generated video for instrument development"
    target_quantity: "instrument development only: existing pools"
    required_metadata: "per-clip motion/dynamic-degree scores where available"
    label_trust: "VideoFeedback dynamic-degree scores are the distributor's human ratings — observations, not our truth"
    independence: "source lineage: single distributor per pool"
    geo_language: "unstated; assume Anglosphere-weighted"
    rights_minimum: "apache-2.0 asserted by publisher; internal evaluation only"
    storage_class: A
    candidate_sources: [src_videofeedback, src_konvid1k, src_videogen_rewardbench]
    state: partial
    resources_note: "Useful for DEVELOPING a motion evaluator, not for qualifying one against current models: ImageRewardDB is DiffusionDB-era and VideoFeedback does not even name its generators. Generator era is a real limitation, not a caveat to wave through."
    why: "This is the one realism capability where existing material genuinely helps."

  - id: REQ-CAP-19
    consumer: "Eval capability physics_material_appearance"
    group: D_realism
    media: "generated image/video"
    target_quantity: constructed_by_eval
    required_metadata: "declared material/physical condition"
    label_trust: human_adjudication
    independence: item_level
    geo_language: n/a
    rights_minimum: none_external
    storage_class: none
    candidate_sources: []
    state: constructed_by_eval
    why: "Stimulus is Eval-generated; no reference corpus would establish what 'correct' looks like for an invented scene."

  # === E. Temporal / continuity ===
  - id: REQ-CAP-20
    consumer: "Eval capability person_stability_in_clip"
    group: E_temporal
    media: "generated video + person references"
    target_quantity: "reuses PACK-PERSON-REF"
    required_metadata: "reference identity; sampled-frame observation rule"
    label_trust: human_or_qualified_VLM
    independence: identity_level
    geo_language: inherits_from_pack
    rights_minimum: inherits_from_pack
    storage_class: B
    candidate_sources: [PACK-PERSON-REF]
