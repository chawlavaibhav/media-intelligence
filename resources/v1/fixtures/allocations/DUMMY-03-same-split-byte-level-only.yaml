# DUMMY ALLOCATION 03 — the SAME broken split as DUMMY-02, checked only at byte level.
#
# It passes. That is the point: it demonstrates that a byte-identity check on this corpus certifies
# a split that is almost entirely contaminated. Kept next to DUMMY-02 so the pair reads as one
# argument for why three levels exist.
experiment_id: DUMMY-EXPERIMENT-03-BYTE-LEVEL-ILLUSION
allocation_version: 1
frozen: false
independence_level: byte
rationale: >
  Identical membership to DUMMY-02, requiring only byte independence. Demonstrates the blind spot,
  it does not endorse it.
