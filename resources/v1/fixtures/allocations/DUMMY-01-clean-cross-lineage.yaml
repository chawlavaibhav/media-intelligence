# DUMMY ALLOCATION 01 — the split Resources would recommend if asked today.
# DUMMY. Not an approved experiment. No role is actually assigned to any item.
experiment_id: DUMMY-EXPERIMENT-01
allocation_version: 1
frozen: false
independence_level: source_lineage
rationale: >
  Devanagari reading instrument. Develop and calibrate on the whole CVIT lineage; hold BSTD out
  entirely as the qualification set. Chosen because BSTD is the only Devanagari lineage independent
