  - name: 19-cost-ref-that-does-not-resolve
    expect: fail
    expect_contains: "does not resolve"
    why: >
      RI-C4. cost_ref is a REFERENCE, not a number. An unresolvable reference means the cost that was
      actually incurred is gone, and Cost per Accepted Outcome stops being auditable.
    override:
      attempts:
        - {attempt_id: A-OK, trial_id: T-OK, eval_item_id: ITEM-1, provider: dummy-vendor, model_id: dummy-m,
           model_version: v0, endpoint: dummy.generate, workflow: single_call, lane: image,
           prompt_hash: "aa", config_hash: "bb", config_location: "dummy://cfg/1",
           reference_asset_hashes: [], requested_at: "2026-01-01T00:00:00Z",
           completed_at: "2026-01-01T00:00:10Z", status: ok, cost_ref: LEDGER-DOES-NOT-EXIST,
           storage_class: C_irreproducible_empirical, repeat_index: 0, repeat_of_attempt_id: null,
           retry_of_attempt_id: null, retry_reason: null, error_detail: null}

  - name: 20-inline-cost-instead-of-a-ledger-reference
    expect: fail
    expect_contains: "inline number"
    why: >
      RI-C4. A number written next to an attempt can be silently recomputed or re-derived from a
      price list that has since changed. This is exactly what the legacy media-factory ledger did:
      July-2026 list prices hardcoded in the script, not billed amounts.
    override:
      attempts:
        - {attempt_id: A-OK, trial_id: T-OK, eval_item_id: ITEM-1, provider: dummy-vendor, model_id: dummy-m,
           model_version: v0, endpoint: dummy.generate, workflow: single_call, lane: image,
           prompt_hash: "aa", config_hash: "bb", config_location: "dummy://cfg/1",
           reference_asset_hashes: [], requested_at: "2026-01-01T00:00:00Z",
           completed_at: "2026-01-01T00:00:10Z", status: ok, cost_ref: 0.15,
           storage_class: C_irreproducible_empirical, repeat_index: 0, repeat_of_attempt_id: null,
           retry_of_attempt_id: null, retry_reason: null, error_detail: null}

  - name: 21-mutable-cost-ledger-entry
    expect: fail
    expect_contains: "immutable must be true"
    why: "RI-C4. A ledger entry is never edited; a correction is a new entry. Superseding yes, silent mutation no."
    override:
      cost_ledger:
        - {ledger_entry_id: LEDGER-1, attempt_id: A-OK, amount: 0.0, currency: XTS, unit: call,
