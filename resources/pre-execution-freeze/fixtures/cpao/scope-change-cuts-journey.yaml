# POSITIVE FIXTURE — a customer SCOPE CHANGE cuts the production journey. EXPECT exit 0.
# All synthetic; currency XTS; no provider called, no money spent.
#
# Identical to revision-journey-included.yaml EXCEPT that OUT-1 carries scope_change_boundary: true.
# The customer materially changed the brief, so OUT-1's work belongs to a DIFFERENT journey and must
# NOT be charged to the outcome that was finally accepted.
#
#   charged: OUT-2 only  ->  api_tool 10.00, human_required 5.00, fully_loaded 15.00
#   accepted outcomes 1  ->  API/tool CpAO 10.00, fully-loaded CpAO 15.00
#
# Contrast with revision-journey-included.yaml (30.00). Same records, one flag, and the difference is
# exactly the earlier journey's cost. That flag is the boundary the Controller decision requires:
# a scope change opens a new outcome rather than retroactively charging unrelated work.
