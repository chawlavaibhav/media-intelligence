# MAT-AV-MIN candidate spec v1 — RES-005
#
# One entry per DISTINCT SOURCE WORK. One clip is cut from each work, so the 12
# clips are 12 independent works: no two clips share a source work, a creator's
# production, or a depicted subject.
#
# Every field below is either (a) copied verbatim from the named authority, or
# (b) marked "verify_by" and left for the acquisition run to MEASURE. Nothing
# content-descriptive is asserted here; visual tags are measured, not declared.
#
# licence_authority = the page a human can open to confirm the licence.
# retrieval_authority = the server the bytes actually come from.

meta:
  spec_version: v1.1
  task: RES-005
  date: 2026-08-28
  purpose: >
    Stage-Q temporal perturbation base (MAT-PERT input) per
    eval/pre-execution-integration/EVALUATOR-AND-MATERIAL-STAGE-MAP.yaml and
    eval/v1/instruments/FAMILY-4-TEMPORAL-VIDEO.md.
  clip_target_seconds: 10.0
  distinct_source_works_required: 12
  window_revision_policy: >
    A clip window may be moved when MEASUREMENT shows the first window fails a cleanliness screen.
    The requirement is never relaxed to fit the sample; the sample is moved to meet the
    requirement, and the original window and its measured failure are recorded in the entry.
  paid_calls: 0
  accounts_created: 0
  terms_accepted: 0

